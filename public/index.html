perten Jan Hallenberg en stor risk för Donald Trump: Punkt 1. – Det är vad jag kan bedöma det största omedelbara hotet mot avtalet.", "link": "https://www.dn.se/varlden/riskerna-for-trump-och-usa-nar-forhandlingarna-fortsatter/", "date_display": "2026-06-18", "date_iso": "2026-06-18T20:51:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Social worker: \"In my neighborhood, Freja would have been at home now\"", "summary": "Alarms about three basic errors • \"Contradicts the Social Services Act\"", "title_original": "Socialsekreterare: ”I min stadsdel hade Freja varit hemma nu”", "summary_original": "Larmar om tre grundläggande fel • ”Strider mot socialtjänstlagen”", "link": "https://www.tv4.se/artikel/6oycHtl7uwrTTnPacluAYD/socialsekreterare-i-min-stadsdel-hade-freja-varit-hemma-nu", "date_display": "2026-06-18", "date_iso": "2026-06-18T20:09:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["LVU", "/lvu"]}, {"id": 140, "title": "76,000 Britons can decide the future of the entire country", "summary": "MAKERFIELD. They have gone from invisible to the epicenter of British politics. Now the whole of Britain is watching what the voters in Makerfield are doing. - The residents here are not used to such uproar, says campaign worker Louise.", "title_original": "76 000 britter kan avgöra hela landets framtid", "summary_original": "MAKERFIELD. De har gått från osynliga till den brittiska politikens epicentrum. Nu följer hela Storbritannien vad väljarna i Makerfield gör. – Invånarna här är inte vana vid ett sådant ståhej, säger kampanjarbetaren Louise.", "link": "https://www.dn.se/varlden/76-000-britter-kan-avgora-hela-landets-framtid/", "date_display": "2026-06-18", "date_iso": "2026-06-18T20:08:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Businessman with ties to Putin arrested by security services", "summary": "Businessman Ilya Traber, who has long had close ties to Vladimir Putin, has been arrested on suspicion of having instigated the murder of a former business partner. According to state media sources, he is also accused of eco-crimes.", "title_original": "Affärsman med band till Putin gripen av säkerhetstjänst", "summary_original": "Affärsmannen Ilya Traber, som länge haft nära band till Vladimir Putin, har gripits misstänkt för att ha anstiftat ett mord på en tidigare samarbetspartner. Enligt källor till statliga medier anklagas han även för ekobrott.", "link": "https://www.dn.se/varlden/affarsman-med-band-till-putin-gripen-av-sakerhetstjanst/", "date_display": "2026-06-18", "date_iso": "2026-06-18T20:01:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Alarms about a shortage ahead of midsummer - the old men are green in many places", "summary": "For many, strawberries are a must at the midsummer table. This year, however, the tradition appears to be under threat in various parts of the country. - Usually these days we have so many more pickers here to collect the berries for our stores and partners. But this year we barely have strawberries for our own store, says Daniel Nylander, strawberry grower. Early midsummer is behind The shortage is partly due to a chilly spring, but also because this year midsummer is a week earlier than usual in the calendar. This means that many strawberries are still green when our most Swedish holiday is just around the corner. - If we had been given one more week here, it would probably have been busy, says Daniel Nylander. Also many stores that have contacted Daniel when they have not been able to get strawberries through their usual wholesalers.  - They are willing to pay our starting price. But we want to serve our customers first and foremost. - We charge 75 kroner here now, and I think that's almost a bit high here. But this is probably where the prices are today. \"The price is strongly linked to demand\" Strawberry expert Marcus Söderlind believes that the situation probably looks very different in Sweden, depending on how the weather has been. - The strawberry responds to the night lightning fast. But it is clear that many growers were hoping for a slightly warmer and sunnier week, he says. Will the strawberries become more expensive if there is a shortage of them? - It's hard to say, but the price of strawberries is strongly linked to demand. Even how many berries there are in Europe affects the price picture in Sweden, says Marcus Söderling, chairman of LRF's Garden Delegation. He emphasizes, however, that one should pay attention if the price is unusually low. - Then you have to think about is this what I am paying for? Are they fresh berries or old berries?", "title_original": "Larmar om brist inför midsommar – gubbarna gröna på många ställen", "summary_original": "Jordgubbar är för många ett måste vid midsommarbordet. I år ser dock traditionen ut att hotas på olika ställen i landet. – Vanligtvis de här dagarna har vi så mycket fler plockare här för att plocka ihop bären till våra butiker och samarbetspartners. Men i år har vi knappt jordgubbar till vår egen butik, säger Daniel Nylander, jordgubbsodlare. Tidig midsommar ligger bakom Bristen ska delvis bero på en kylig vår men också på att midsommar i år ligger veckan tidigare  än vanligt i kalendern. Det gör att många jordgubbar fortfarande är gröna när vår svenskaste högtid står för dörren. – Hade vi fått en vecka till här hade det nog varit fullt upp, säger Daniel Nylander. Även många butiker som har hört av sig till Daniel när de inte fått fatt i jordgubbar genom deras vanliga grossister.  – De är villiga att betala vårt utgångspris. Men vi vill ju serva våra kunder först och främst. – Vi tar ju 75 kronor här nu och det tycker jag är nästan lite högt här ju. Men det är väl här priserna ligger på idag. ”Priset är starkt kopplat till efterfrågan” Jordgubbsexperten Marcus Söderlind menar att läget förmodligen ser väldigt olika ut i Sverige, beroende på hur vädret sett ut. – Jordgubben svarar på natten blixtsnabbt. Men det är klart att många odlare hoppades på en lite varmare och soligare vecka, säger han. Kommer jordgubbarna bli dyrare om det är brist på dem? – Det är svårt att säga men jordgubbarnas pris är starkt kopplat till efterfrågan. Även hur mycket bär som finns  Europa påverkar prisbilden i Sverige, säger Marcus Söderling, ordförande på LRFs Trädgårdsdelegation. Han understryker dock att man bör vara uppmärksam om priset är ovanligt lågt. – Då ska man fundera på är det det jag betalar för? Är det färska bär eller gamla bär?", "link": "https://www.tv4.se/artikel/5MAlIZqWRnGq8NFK2d0fwc/larmar-om-brist-infoer-midsommar-gubbarna-groena-pa-manga-staellen", "date_display": "2026-06-18", "date_iso": "2026-06-18T19:31:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/tradgard", "/jordgubbar", "/midsommar"]}, {"id": 143, "title": "Stubb sounds the alarm about a Russian attack on NATO", "summary": "Finnish President Alexander Stubb dismisses alarms from Sweden, among others, that Russia wants to test NATO's Article 5 soon. He says that the issue, on the contrary, is the result of a Russian hybrid operation.", "title_original": "Stubb sågar larm om rysk attack mot Nato", "summary_original": "Finlands president Alexander Stubb avfärdar larm bland annat från Sverige om att Ryssland snart vill testa Natos artikel fem. Han säger att frågan tvärtom är resultatet av en rysk hybridoperation.", "link": "https://www.dn.se/varlden/stubb-sagar-larm-om-rysk-attack-mot-nato/", "date_display": "2026-06-18", "date_iso": "2026-06-18T19:24:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 144, "title": "Juholt's best midsummer herring: \"Clinton loved it\"", "summary": "Midsummer Eve is around the corner and the herring has a given place on the dining table. The ex-ambassador and now self-titled \"herring manufacturer\" Håkan Juholt tips about his parade dish. - Take crème fraiche and mayonnaise.", "title_original": "Juholts bästa midsommarsill: ”Clinton älskade den”", "summary_original": "Midsommarafton är runt hörnet och sillen har en given plats på matbordet. Ex-ambassadören och numera självtitulerade ”sillfabrikör” Håkan Juholt tipsar om sin paradrätt. – Ta crème fraiche och majonnäs.", "link": "https://www.dn.se/sverige/juholts-basta-midsommarsill-clinton-alskade-den/", "date_display": "2026-06-18", "date_iso": "2026-06-18T18:57:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 145, "title": "The Swede behind the viral AI cover", "summary": "Anyone who has scrolled on Tiktok or Instagram in recent months has probably not missed mikeeysmind's viral cover. It's used in everything from cooking videos to epic nature clips and has featured in over 1.7 million Tiktok clips. In addition, it has been played 155 million times on Spotify and peaked at number two on Billboard's World Digital Song Sales chart. \"AI can do things humans can't\" Behind the song is the 25-year-old Gothenburg citizen Mikael Daghighi together with two other producers. He has previously produced several songs that hit internationally under the artist name mikeeysmind, but then without AI. He says that he initially saw the song as an experiment. - It's an iconic French song and we mostly saw it as a fun thing. I didn't think it would go this well, says Mikael Daghighi. Daghighi says the instrumental in the song is largely done without AI. However, AI has been used for the voice.  - It became much stronger. AI can reach tones and do things humans can't. Could be worth millions Daghighi says he's reached an agreement with the original artist's team, but won't say how much he earned from the song. Spotify does not pay a fixed amount per stream, but according to a rough range, the streaming revenue from Spotify alone can be worth five to eight million kroner. The revenue is distributed between several actors such as record companies, distributors, music publishers, songwriters and producers.  - Of course it would have been more if I had done everything myself. Now there are several who share it, says Daghighi. He is doubtful whether he will continue to use AI in his music creation. He believes that fully AI generated songs will not be as good. - You still need to have good ideas, but AI can help producers test ideas faster. I think it has to be a little \"human made\", otherwise it will be AI slop, says Daghighi.", "title_original": "Svensken bakom virala AI-covern", "summary_original": "Den som scrollat på Tiktok eller Instagram under de senaste månaderna har sannolikt inte missat mikeeysminds virala cover. Den används i allt från matlagningsvideor till storslagna naturklipp och har varit med i över 1,7 miljoner Tiktok-klipp. Dessutom har den spelats 155 miljoner gånger på Spotify och nådde som högst en andraplats på Billboards lista World Digital Song Sales. “AI kan göra saker människor inte kan”  Bakom låten står den 25-årige göteborgaren Mikael Daghighi tillsammans med två andra producenter. Han har tidigare producerat flera låtar som slagit internationellt under artistnamnet mikeeysmind, men då utan AI. Han menar att han till en början såg låten som ett experiment. – Det är en ikonisk fransk låt och vi såg det mest som en kul grej. Jag trodde inte att den skulle gå så här bra, säger Mikael Daghighi. Daghighi säger att det instrumentala i låten i stort sett är gjort utan AI. Däremot har AI använts till rösten.  – Det blev mycket starkare. AI kan nå toner och göra saker som människor inte kan. Kan vara värd miljoner Daghighi uppger att han kommit överens med originalartistens team, men vill inte berätta vad han tjänat på låten. Spotify betalar ingen fast summa per stream, men enligt ett grovt intervall kan bara streamingintäkterna från Spotify vara värda fem till åtta miljoner kronor. Intäkterna fördelas mellan flera aktörer såsom skivbolag, distributörer, musikförlag, låtskrivare och producenter.  – Det hade såklart varit mer om jag gjort allt själv. Nu är det flera som delar på det, säger Daghighi. Han är tveksam till om han kommer fortsätta använda AI i sitt musikskapande. Han tror att helt AI-genererade låtar inte blir lika bra. – Man behöver fortfarande ha bra idéer men AI kan hjälpa producenter att testa idéer snabbare. Jag tror att det måste vara lite “human made”, annars blir det AI-slop, säger Daghighi.", "link": "https://www.tv4.se/artikel/2DLSyvSY82nMHI13r0VU7x/haer-aer-svensken-bakom-virala-ai-covern", "date_display": "2026-06-18", "date_iso": "2026-06-18T18:48:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/noje", "/ai", "/musiker", "/goteborg", "/musik"]}, {"id": 146, "title": "Here the 89-year-old lay alone and dying on the floor - for several days", "summary": "A 66-year-old man is charged with aggravated assault and aggravated assault, after his 89-year-old mother was found seriously ill at home. According to the indictment, the woman must have been lying on the floor in the hall for up to five days and was ill for at least ten days without the son alerting the medical service. According to the indictment, the woman should not have received food, liquid or medicine. In the end, the son called 112 after the mother was unconscious and had not taken any liquid for at least two days. The news agency Siren was the first to report on it. - Hello. You, my mother, she had a stroke here a few days ago, says the son when the emergency operator answers the call. During the emergency call, he describes her condition as \"something hovering between sleep and coma\".  When the woman arrived at the emergency department, she was unconscious and dehydrated with acute kidney failure. She also had elevated infection values ​​and ulcers over the sacrum. She later died later in hospital. The son: \"Euthanasia clinics\" The medical assessment together with the forensic findings indicate that the cause of death was blood poisoning as a result of acute pneumonia. In questioning, the son has said that he promised his father that the mother would die at home and not in hospital, and that he therefore did not alert the medical service immediately. \"There are no hospitals, it's euthanasia clinics,\" the son said in questioning. The son also claims that \"there was no ambulance that came, but an ambulance whose staff euthanized her as soon as they had loaded her.\" Suspected of causing her death The prosecutor believes that the son left her sick without treatment, did not call an ambulance despite clear symptoms and left her lying there for several days - and thereby caused the death. The woman's relatives had previously raised the alarm that the man could be dangerous to his mother and that he prevented contact with the mother. The man denies wrongdoing. - Fiction, a fairy tale. I deny it, the man replies when asked how he reacts to the suspicions.", "title_original": "Här låg 89-åringen ensam och döende på golvet – i flera dagar", "summary_original": "En 66-årig man åtalas för grov misshandel och grovt vållande till annans död, sedan hans 89-åriga mamma hittats svårt sjuk i hemmet. Enligt åtalet ska kvinnan ha legat på golvet i hallen upp till fem dagar och varit sjuk i minst tio dagar utan att sonen larmade sjukvården. Kvinnan ska enligt åtalet varken ha fått mat, vätska eller medicin. Till slut ringde sonen 112 sedan mamman legat medvetslös och inte fått i sig vätska på minst två dygn. Det var nyhetsbyrån Siren först med att rapportera om. – Hej. Du, min mamma, hon fick en stroke här för några dagar sedan, säger sonen när larmoperatören svarar på samtalet. Under larmsamtalet beskriver han hennes tillstånd som ”något svävande mellan sömn och koma”.  När kvinnan kom till akutmottagningen var hon medvetslös och uttorkad med akut njursvikt. Hon hade även förhöjda infektionsvärden och sår över korsbenet. Hon dog senare senare på sjukhus. Sonen: ”Avlivningskliniker” Sjukvårdens bedömning tillsammans med de rättsmedicinska fynden talar för att dödsorsaken var en blodförgiftning till följd av en akut lunginflammation. I förhör har sonen sagt att han lovat sin pappa att mamman skulle få dö hemma och inte på sjukhus, och att han därför inte larmade sjukvården direkt. ”Det finns inga sjukhus, det är avlivningskliniker det handlar om”, har sonen sagt i förhör. Sonen hävdar också att ”det var ingen ambulans som kom utan det var en sjuktransport vars personal avlivade henne så fort de hade lastat henne.” Misstänks orsakat hennes död Åklagaren menar att sonen lät henne vara sjuk utan vård, inte ringde ambulans trots tydliga symptom och lät henne ligga kvar i flera dygn – och därigenom orsakade döden. Kvinnans anhöriga ska tidigare ha larmat om att mannen kunde vara farlig för sin mamma och att han hindrade kontakt med mamman. Mannen förnekar brott. – Påhitt, en saga. Jag förnekar, svarar mannen på frågan om hur han ställer sig till misstankarna.", "link": "https://www.tv4.se/artikel/2IoN163UuhIobfpSrhbino/misstanken-laemnades-hungrig-och-doeende-pa-golvet-i-fem-dagar", "date_display": "2026-06-18", "date_iso": "2026-06-18T17:44:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/grovt-brott", "/brott", "/brott-och-straff"]}, {"id": 147, "title": "Could be the biggest since World War II", "summary": "", "title_original": "Kan vara det största sedan andra världskriget", "summary_original": "", "link": "https://www.tv4.se/artikel/5BejquuHtzYZaJfQS86dz4/kan-vara-det-stoersta-sedan-andra-vaerldskriget", "date_display": "2026-06-18", "date_iso": "2026-06-18T16:10:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 148, "title": "The internal fury against Trump: \"Reagan is turning in his grave\"", "summary": "Widespread criticism of the deal from own party: Makes Iran stronger", "title_original": "Interna raseriet mot Trump: ”Reagan vänder sig i sin grav”", "summary_original": "Omfattande kritik mot avtalet från det egna partiet: Gör Iran starkare", "link": "https://www.tv4.se/artikel/3giK5jdfbFumgEpA1dIvZk/interna-raseriet-mot-trump-reagan-vaender-sig-i-sin-grav", "date_display": "2026-06-18", "date_iso": "2026-06-18T14:27:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 149, "title": "In memory of Kerstin Marianne Skoglund Eckeskog", "summary": "", "title_original": "Till minne av Kerstin Marianne Skoglund Eckeskog", "summary_original": "", "link": "https://www.dagen.se/familj/till-minne-av-kerstin-marianne-skoglund-eckeskog/10375931", "date_display": "2026-06-18", "date_iso": "2026-06-18T12:36:23+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 150, "title": "Sweden can participate in securing the strait: \"I don't rule it out\"", "summary": "The Strait of Hormuz must be opened immediately • Several NATO countries are expected to participate", "title_original": "Sverige kan delta i säkrandet av sundet: ”Jag utesluter inte det”", "summary_original": "Hormuzsundet ska öppnas omedelbart • Flera Natoländer väntas delta", "link": "https://www.tv4.se/artikel/brwykiDhwLvuKAWp7apq4/sverige-kan-delta-i-saekrandet-av-sundet-jag-utesluter-inte-det", "date_display": "2026-06-18", "date_iso": "2026-06-18T12:17:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 151, "title": "Local politicians can challenge for the post of prime minister: \"Was crazy\"", "summary": "During Thursday, it will be decided which candidate will represent the Makerfield constituency in north-west England, between Manchester and Liverpool. The election was triggered by MP Josh Simons leaving his post last month to give Andy Burnham, mayor of Manchester, an opportunity to take his place. Among the voters of Makerfield, it is no secret that the mayor's goal is not primarily to improve the lives of the barely 80,000 residents - but instead has his sights set on the most powerful position in the country. - That's why he's here, because this MP stepped aside to allow Burnham to get into Parliament and maybe become Prime Minister that way. That is the whole point of this election, says Paul Jensen when TV4 Nyheterna meets him in the middle of Ashton-in-Makerfield. Media circus in the small town In recent weeks, an intensive campaign has been going on in the constituency and journalists from both British and international media have more or less taken over the small town. Many of the residents say they are tired of answering questions and now just want the whale scare to be over. - It's crazy, it's been crazy for three weeks now. You have to plan to try to stay away from everything, says Tony Corley. Opinion polls have shown that Andy Burnham has a good chance of winning - but even though Labor has previously been able to see Makerfield as a safe constituency, dissatisfaction with the governing party has grown here as well. \"Immigration, immigration, immigration\" Now many predict instead that it could be even between Labor and the right-wing populist challenger Reform UK. The far-right party Restore Britain is also seen as a strong contender. - I want Restore to win to send a clear message that everyone is tired of immigration. That's the only thing we talk about here. Immigration, immigration, immigration, says Tony Corley. Many want to see Burnham Many of the voters in Ashton-in-Makerfield, however, see Andy Burnham as an obvious election winner, because he", "title_original": "Lokalpolitiker kan utmana om premiärministerposten: ”Varit galet”", "summary_original": "Under torsdagen avgörs vilken kandidat som ska representera valkretsen Makerfield i nordvästra England, mellan Manchester och Liverpool. Valet utlöstes av att parlamentsledamoten Josh Simons lämnade sin post förra månaden för att ge Andy Burnham, borgmästare i Manchester, en möjlighet att ta hans plats. Bland väljarna i Makerfield är det ingen hemlighet att borgmästarens mål inte i första hand är att förbättra livet för de knappt 80 000 invånarna – utan i stället har siktet inställt på landets mäktigaste position. – Det är därför han är här, eftersom den här parlamentsledamoten klev åt sidan för att låta Burnham ta sig in i parlamentet och på så sätt kanske bli premiärminister. Det är hela poängen med det här valet, säger Paul Jensen när TV4 Nyheterna möter honom mitt i Ashton-in-Makerfield. Mediecirkus i den lilla orten De senaste veckorna har en intensiv kampanj pågått i valkretsen och journalister från såväl brittiska som internationella medier har mer eller mindre intagit den lilla orten. Många av invånarna säger att de har tröttnat på att svara på frågor och nu bara vill att valrysaren ska vara över. – Det är galenskap, det har varit galet i tre veckor nu. Man måste planera för att försöka hålla sig undan allt, säger Tony Corley. Opinionsundersökningar har visat att Andy Burnham har goda chanser att vinna – men trots att Labour tidigare har kunnat se Makerfield som en säker valkrets har missnöjet med regeringspartiet vuxit även här. ”Invandring, invandring, invandring” Nu förutspår många i stället att det kan bli jämnt mellan Labour och den högerpopulistiska utmanaren Reform UK. Även ytterhögerpartiet Restore Britain ses som en stark utmanare. – Jag vill att Restore ska vinna för att skicka ett tydligt budskap om att alla är trötta på invandringen. Det är det enda man talar om här. Invandring, invandring, invandring, säger Tony Corley. Många vill se Burnham Flera av väljarna i Ashton-in-Makerfield ser dock Andy Burnham som en självklar valsegrare, eftersom han oftast ses som en populär borgmästare. De hoppas att han nu även ska bli premiärminister. – Jag röstar för Andy Burnham. Han har alltid gjort en bra insats för Manchester. De andra partierna är för långt ut på högerkanten, jag vill inte gå i den riktningen, säger Labourväljaren Pat Murphy. Premiärminister Keir Starmer har vid flera tillfällen sagt att han inte tänker kliva åt sidan utan kämpa in i det sista om han skulle bli utmanad om sitt jobb. Skulle Andy Burnham vinna fyllnadsvalet kan han utmana Starmer om premiärministerposten på måndag, då den som vinner valet tidigast kan sväras in.", "link": "https://www.tv4.se/artikel/3eBilPksteaKipghOyKAof/lokalpolitiker-kan-utmana-om-premiaerministerposten-varit-galet", "date_display": "2026-06-18", "date_iso": "2026-06-18T12:07:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/storbritannien", "/brittisk-politik", "/brittiska-parlamentet"]}, {"id": 152, "title": "The firemen guard Torpladan during the large gatherings", "summary": "\"Firefighters have a lot to talk about, and sometimes it's nice to talk to other Christian firefighters.\"", "title_original": "Brandmännen bevakar Torpladan under de stora samlingarna", "summary_original": "”Brandmän har en hel del att prata om, och ibland är det fint att få tala med andra kristna brandmän.”", "link": "https://www.dagen.se/nyheter/brandmaennen-bevakar-torpladan-under-de-stora-samlingarna/10400969", "date_display": "2026-06-18", "date_iso": "2026-06-18T11:24:24+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "A Swedish Strategy for Biodiversity and Ecosystem Services", "summary": "The report \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "title_original": "A Swedish Strategy for Biodiversity and Ecosystem Services", "summary_original": "The report \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "link": "https://www.government.se/reports/2026/06/a-swedish-strategy-for-biodiversity-and-ecosystem-services/", "date_display": "2026-06-18", "date_iso": "2026-06-18T11:07:11+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "1 day old", "tags": ["Report", "International", "Ministry of Climate and Enterprise", "Environment and climate", "Sweden in the UN"]}, {"id": 154, "title": "Warning of severe thunderstorms - may strike during Sweden's World Cup match", "summary": "SMHI has issued a yellow warning for heavy thunder and rain during Midsummer's Day on Saturday. Locally, there may be large amounts of rain and, according to SMHI, there is a risk of flooding in basements and stormwater systems. - This is an early warning. It is not very common to issue warnings so far in advance, says TV4 meteorologist Ulrika Elvgren. - At the same time, it's the bank holiday and many people will be outside. It can be dangerous to stay in open fields, continues Elvgren. The warning covers Götaland, large parts of Svealand and southeasternmost Norrland and applies between eight in the morning and eleven in the evening on Midsummer's Day. Can be upgraded to orange The warning may be upgraded to an orange tomorrow, Elvgren adds. - Initially, the warning covers a large area. The forecast will be fine-tuned during tomorrow, and when the area narrows, the warning may be upgraded to orange level, she says. Elvgren adds that it can be dangerous to be in open fields. She urges those who are about to go out to stay updated via apps. - It is important to stay updated and follow the situation via weather apps. The Sweden match threatened The warning could mean a risk of power outages in time for Sweden's World Cup match against the Netherlands, which starts at 19:00 on Saturday.  - You should also prepare for possible power outages and make sure that your mobile phone is charged, so that you can follow the match even if the power goes out, says TV4 meteorologist Ulrika Elvgren.", "title_original": "Varnar för kraftig åska – kan slå till under Sveriges VM-match", "summary_original": "SMHI har utfärdat en gul varning för kraftig åska och regn under midsommardagen på lördagen. Lokalt kan det komma stora regnmängder och enligt SMHI finns det risk för översvämningar i källare och dagvattensystem. – Det här är en varning som utfärdats tidigt. Det är inte särskilt vanligt att man går ut med varningar så långt i förväg, säger TV4-meteorologen Ulrika Elvgren. – Samtidigt är det storhelg och många kommer att vara utomhus. Det kan vara farligt att vistas på öppna fält, fortsätter Elvgren. Varningen omfattar Götaland, stora delar av Svealand samt sydostligaste Norrland och gäller mellan klockan åtta på morgonen och elva på kvällen på midsommardagen. Kan uppgraderas till orange Varningen kan komma att uppgraderas till en orange under morgondagen, tillägger Elvgren. – Till en början omfattar varningen ett stort område. Prognosen finjusteras under morgondagen, och när området smalnat av kan varningen komma att uppgraderas till orange nivå, säger hon. Elvgren tillägger att det kan vara farligt att befinna sig på öppna fält. Hon uppmanar de som ska ge sig ut att hålla sig uppdaterade via appar. – Det är viktigt att hålla sig uppdaterad och följa läget via väderappar. Sverigematchen hotad Varningen kan innebära en risk för strömavbrott lagom till Sveriges VM-match mot Nederländerna som börjar klockan 19.00 på lördagen.  – Man bör också förbereda sig på eventuella strömavbrott och se till att mobilen är laddad, så att man kan följa matchen även om strömmen går, säger TV4-meteorologen Ulrika Elvgren.", "link": "https://www.tv4.se/artikel/5k4XO1XGlUjmlB9PEdo84z/varnar-foer-kraftig-aska-kan-sla-till-mitt-i-fotbollsfesten", "date_display": "2026-06-18", "date_iso": "2026-06-18T10:51:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/vadret", "/prognos", "/midsommar", "/smhi"]}, {"id": 155, "title": "Alarms: Hundreds of children may have been taken into care - completely wrongly", "summary": "Requires review • Criticizes the new law", "title_original": "Larmar: Hundratals barn kan ha omhändertagits – helt felaktigt", "summary_original": "Kräver granskning • Kritiserar nya lagen", "link": "https://www.tv4.se/artikel/5CF8oQwoksJwwU6e1fimQd/larmar-hundratals-barn-kan-ha-omhaendertagits-helt-felaktigt", "date_display": "2026-06-18", "date_iso": "2026-06-18T09:29:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes"]}, {"id": 156, "title": "Christian youth: \"Finally Torp!\"", "summary": "Comforting Bible study about how Jesus calms the storms.", "title_original": "Kristna ungdomar: ”Äntligen Torp!”", "summary_original": "Tröstande bibelstudium om hur Jesus stillar stormarna.", "link": "https://www.dagen.se/nyheter/kristna-ungdomar-aentligen-torp/10400115", "date_display": "2026-06-18", "date_iso": "2026-06-18T07:35:04+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "\"Christian values ​​give people room to think freely\"", "summary": "Great interest in Dagen's panel debate at Nyhemsvekkan", "title_original": "”Kristna värderingar ger människor utrymme att tänka fritt”", "summary_original": "Stort intresse för Dagens paneldebatt på Nyhemsveckan", "link": "https://www.dagen.se/nyheter/kristna-vaerderingar-ger-maenniskor-utrymme-att-taenka-fritt/10400265", "date_display": "2026-06-18", "date_iso": "2026-06-18T07:24:42+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Here is the first picture of Mette-Marit after the lung transplant", "summary": "13 days ago, the Norwegian court announced that Crown Princess Mette-Marit was put on the waiting list for a lung transplant. During Wednesday, the news came that she got new lungs. According to court expert Johan T Lindwall, the transplant must have taken place in the utmost secrecy, and exactly when it took place is still unclear.  In the coming weeks, Mette-Marit will be hospitalized at the Rikshospitalet in Oslo, and because of that, Crown Prince Haakon will change his schedule so that he can be with the Crown Princess.  First picture Now TV4 Nyheterna can show the first picture of Mette-Marit from inside the hospital. In the picture, which was taken on Wednesday, the crown prince couple is seen sitting and talking on a patio. Mette-Marit sits in a wheelchair and Haakon opposite her. - She looked fine. They seemed to be having a good time, says the person who took the picture to TV4 Nyheterna. Based on the image, it is difficult to know when the actual operation took place, explains Göran Dellgren, senior physician and professor at the Transplantation Center at Sahlgrenska University Hospital. - In most cases, you are usually woken up and off the ventilator three to six hours after the transplant. Then you are in the intensive care unit for two to three days and then in the ward for two to three weeks, he says. - She is probably still in intensive care and may go from there to the intensive care unit in a day or so, continues the chief physician. The Crown Princess was diagnosed in 2018 with the chronic disease pulmonary fibrosis.  During the spring, the disease worsened and the doctors judged that a transplant was necessary, whereupon she was put on the waiting list. Even then, her doctors were clear that Mette-Marit would not have any priority in the gender.  But it did not take many days before the transplant was completed.\n\nHere you can read why TV4 Nyheterna publishes the picture of Mette-Marit.", "title_original": "Här är första bilden på Mette-Marit efter lungtransplantationen", "summary_original": "För 13 dagar sedan meddelade det norska hovet att kronprinsessan Mette-Marit satts upp på väntelistan för en lungtransplantation. Under onsdagen kom beskedet att hon fått nya lungor. Transplantationen ska enligt hovexperten Johan T Lindwall ha skett i största hemlighet, och exakt när den skedde är ännu oklart.  De kommande veckorna kommer Mette-Marit att vara inlagd på Rikshospitalet i Oslo, och med anledning av det kommer kronprins Haakon att förändra sitt schema så att han kan vara tillsammans med kronprinsessan.  Första bilden Nu kan TV4 Nyheterna visa den första bilden på Mette-Marit inifrån sjukhuset. På bilden, som är tagen under onsdagen, ses kronprinsparet sitta och prata på en uteplats. Mette-Marit sitter i rullstol och Haakon mittemot henne. – Hon såg ut att må bra. De verkade ha en trevlig stund, säger personen som tagit bilden till TV4 Nyheterna. Baserat på bilden är det svårt att veta när själva operationen ägt rum, förklarar Göran Dellgren, överläkare och professor vid Transplantationscentrum vid Sahlgrenska universitetssjukhuset. – I de flesta fall är man oftast väckt och ur respiratorn tre till sex timmar efter transplantationen. Sedan ligger man på intensiven i två till tre dagar och sedan på avdelning i två till tre veckor, säger han. – Hon är säkert kvar på intensiven fortfarande och kanske går därifrån till vårdavdelning om någon dag eller så, fortsätter överläkaren. Kronprinsessan diagnostiserades 2018 med den kroniska sjukdomen lungfibros.  Under våren förvärrades sjukdomen och läkarna bedömde att en transplantation var nödvändig, varpå hon sattes upp på väntelista. Redan då var hennes läkare tydliga med att Mette-Marit inte skulle få någon förtur i kön.  Men det dröjde inte många dagar innan transplantationen var genomförd.\n\nHär kan du läsa varför TV4 Nyheterna publicerar bilden på Mette-Marit.", "link": "https://www.tv4.se/artikel/6GvXZakBNu2zxEE3KstJcM/haer-aer-foersta-bilden-pa-mette-marit-efter-lungtransplantationen", "date_display": "2026-06-18", "date_iso": "2026-06-18T05:58:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/mette-marit", "/kronprins-haakon-av-norge", "/norska-kungahuset", "/norska-kungafamiljen"]}, {"id": 159, "title": "Moscow in flames after attacks: \"Puts Putin under serious pressure\"", "summary": "Zelensky: \"A completely justified answer\"", "title_original": "Moskva i lågor efter attacker: ”Sätter Putin under rejäl press”", "summary_original": "Zelenskyj: ”Ett fullständigt berättigat svar”", "link": "https://www.tv4.se/artikel/2x2aQNqJtANSlc0Zzx6Tq7/nattliga-attacker-i-ukraina-och-ryssland", "date_display": "2026-06-18", "date_iso": "2026-06-18T04:11:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 160, "title": "Who dares to do like Gunnar Strömmer then (G) who in God is back during the Almedal week?", "summary": "The Minister of Justice drew down ovations during last year's almedal week.", "title_original": "Vem vågar göra som Gunnar Strömmer då (G) som i Gud är tillbaka under Almedalsveckan?", "summary_original": "Justitieministern drog ned ovationer under förra årets almedalsvecka.", "link": "https://www.dagen.se/nyheter/vem-vagar-goera-som-gunnar-stroemmer-da-g-som  for state aid received by the Government.", "title_original": "Government receives new state aid application for nuclear power", "summary_original": "A new application for state aid to build nuclear power reactors has been submitted to the Government. The application was submitted by Studsvik, which is seeking to establish reactors in the municipalities of Nyköping and Valdermarsvik. This is the third application for state aid received by the Government.", "link": "https://www.government.se/press-releases/2026/06/government-receives-new-state-aid-application-for-nuclear-power/", "date_display": "2026-06-17", "date_iso": "2026-06-17T07:28:57+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "2 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 172, "title": "Friades - can still lose custody of the daughter: \"We are stuck\"", "summary": "Seeking care for bruises - was taken away from the child • Points out Lex Lilla's heart: \"22 moment\"", "title_original": "Friades – kan ändå förlora vårdnaden om dottern: ”Vi sitter fast”", "summary_original": "Sökte vård för blåmärken – blev fråntagna barnet • Pekar ut Lex Lilla hjärtat: ”Moment 22”", "link": "https://www.tv4.se/artikel/2jOnWWyjL6DYZQGuSzcyfe/friades-kan-aenda-foerlora-vardnaden-om-dottern-vi-sitter-fast", "date_display": "2026-06-17", "date_iso": "2026-06-17T06:11:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Inrikes", "/inrikes"]}, {"id": 173, "title": "The Archbishop: \"There are situations you cannot get out of with clean hands\"", "summary": "Martin Modéus hopes to spread peace theology with a new book", "title_original": "Ärkebiskopen: ”Det finns situationer man inte kan komma ur med rena händer”", "summary_original": "Martin Modéus hoppas sprida fredsteolog   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
