upp”", "summary_original": "Pastorn och riksdagsledamoten riktar blytung kritik mot hur Liberalerna banar väg för SD i regeringen • ”Jag har aldrig varit med om en sådan toppstyrd process”", "link": "https://www.dagen.se/nyheter/jakob-olofsgard-l-om-sd-kramen-det-var-en-strategiskt-planerad-kupp/10253200", "date_display": "2026-03-16", "date_iso": "2026-03-16T16:10:49+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Till minne av Evy Nokuthula Juneswed", "summary": "", "title_original": "Till minne av Evy Nokuthula Juneswed", "summary_original": "", "link": "https://www.dagen.se/familj/till-minne-av-evy-nokuthula-juneswed/10240076", "date_display": "2026-03-16", "date_iso": "2026-03-16T15:07:19+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "The Swedish response after Trump's outburst: \"Not relevant today\"", "summary": "The US wants NATO's support in the Strait of Hormuz • Defense Minister's comment", "title_original": "Svenska svaret efter Trumps utspel: ”Inte aktuellt i dag”", "summary_original": "USA vill ha Natos stöd i Hormuzsundet • Försvarsministerns kommentar", "link": "https://www.tv4.se/artikel/7cYgIXwv68mfpQs3i7WjNe/jonson-inte-aktuellt-med-hjaelp-i-hormozsundet", "date_display": "2026-03-16", "date_iso": "2026-03-16T14:43:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 140, "title": "A stroke of genius or a death knell?", "summary": "", "title_original": "Ett genidrag eller en dödsryckning?", "summary_original": "", "link": "https://www.tv4.se/artikel/5R8xPkFuQW6yYd7sjEHJD4/aer-det-ett-genidrag-eller-en-doedsryckning", "date_display": "2026-03-16", "date_iso": "2026-03-16T14:41:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 141, "title": "Training for new mothers - with the baby in your arms", "summary": "- Just that I even started training after I was pregnant has given me a lot. I feel energetic, I feel good, I start to feel fresh in my body and I also feel that I have made new friends. You get a completely new social context after you have been on the passes. So it's super fun, says Linn Vänskä with her son Axel in her arms. Training and community The participants train together with their children. Bella Asphede trains with daughter Lycke, while Mikaela Magnusson uses daughter Juni as a \"dumbbell\". Group training provides both physical activity and social interaction.  - How quickly you recover is a very personal journey. Both how the pregnancy was and how the body responds after having a baby. It often differs between pregnancies in the same person as well, says group training instructor Marie Nordin. Support and understanding The atmosphere is non-prestige and the participants support each other.  - You support, encourage, consult. Everyone is in the same seat. It's so nice to come here and everyone understands each other. No weirdness to breastfeed or change a diaper in the middle of the session or just sit and cuddle for ten minutes, explains Mikaela Magnusson with her daughter Juni in her arms. - You come here rather without prestige. If I do five squats, it's great. If it's a full training session, it's great. Everyone understands each other. If someone screams, it doesn't matter, says Bella Asphede, Lycke's mother.\n Focus on the pelvic floor The training aims to help the mothers find contact with their pelvic floor and regain muscle control.  - All training is very much about finding a way back to muscle contact and muscle control. This also applies to the pelvic floor. You have to find the connection with your pelvic floor. From there we start working, explains group training instructor Marie Nordin. - Yes, it is difficult after giving birth. Before you give birth, you don't think much about the activity that takes place in the pelvic floor. When you have given birth, it has been through a trauma. There has been a lot of strain on the pelvis", "title_original": "Träning för nyblivna mammor – med bebisen i famnen", "summary_original": "– Bara att jag ens började träna efter att jag varit gravid har gett mig mycket. Jag känner mig pigg, jag mår bra, jag börjar känna mig fräsch i kroppen och jag känner också att jag har fått nya kompisar. Man får ett helt nytt socialt sammanhang efter att man har varit på passen. Så det är superkul, säger Linn Vänskä med sonen Axel i famnen. Träning och gemenskap Deltagarna tränar tillsammans med sina barn. Bella Asphede tränar med dottern Lycke, medan Mikaela Magnusson använder dottern Juni som \"hantel\". Gruppträningen ger både fysisk aktivitet och social samvaro.  – Det är en väldigt personlig resa hur snabbt man återhämtar sig. Både hur graviditeten var och hur kroppen svarar efter man fått barn. Det skiljer sig ofta mellan graviditeter hos samma person också, säger gruppträningsinstruktör Marie Nordin. Stöd och förståelse Stämningen är prestigelös och deltagarna stöttar varandra.  – Man stöttar, peppar, rådfrågar. Alla är i samma sits. Det är så skönt att komma hit och alla förstår varandra. Inga konstigheter att amma eller byta en blöja mitt i passet eller bara sitta och gosa i tio minuter, förklarar Mikaela Magnusson med dottern Juni i famnen. – Man kommer hit ganska prestigelöst. Gör jag fem knäböj så är det toppen. Blir det ett helt träningspass så är det kanon. Alla förstår varandra. Om det är någon som skriker så gör det ingenting, säger Bella Asphede, mamma till Lycke.\n Fokus på bäckenbotten Träningen syftar till att hjälpa mammorna hitta kontakt med sin bäckenbotten och återfå muskelkontroll.  – All träning handlar mycket om att hitta tillbaka till muskel-kontakt och muskelkontroll. Det gäller även bäckenbotten. Man ska hitta kontakten med sin bäckenbotten. Därifrån börjar vi jobba, förklarar grupptränings-instruktören Marie Nordin. – Ja, det är svårt efter att ha fött barn. Innan du föder barn tänker du inte så mycket på aktiviteten som sker i bäckenbotten. När du har fött barn har den varit med om ett trauma. Det har varit mycket belastning på bäckenbotten. Det är en snabb händelse att vi har haft viktbelastningen som sen är borta. Det är det vi tränar på, att hitta tillbaka till kontakten och styrkan, förklarar Marie. Viktigt socialt sammanhang För många deltagare är träningen också ett sätt att bryta ensamheten.  – Han är mitt första barn. Om man inte vet vart man ska vända sig kan man lätt känna sig ensam. Då är de här passen ett jättebra sätt att lära känna nya människor och bara komma ut, utanför sin lägenhet. Bara det kan vara ett stort steg, säger Linn Vänskä.", "link": "https://www.tv4.se/artikel/1jxFB2m86f4EN08iqQXI3M/traening-foer-nyblivna-mammor-med-bebisen-i-famnen", "date_display": "2026-03-16", "date_iso": "2026-03-16T14:41:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/idrott-och-halsa", "/strong-mama"]}, {"id": 142, "title": "Former Methodist pastor in the US is suspended - worked for Jeffrey Epstein", "summary": "Was, among other things, property manager for the sex offender's private island in spring 2019.", "title_original": "Tidigare metodistpastor i USA stängs av – jobbade för Jeffrey Epstein", "summary_original": "Var bland annat fastighetsförvaltare för sexförbrytarens privata ö våren 2019.", "link": "https://www.dagen.se/nyheter/tidigare-metodistpastor-i-usa-staengs-av-jobbade-foer-jeffrey-epstein/10252084", "date_display": "2026-03-16", "date_iso": "2026-03-16T14:39:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Here are the courses that will get you a job", "summary": "On Monday, registration for universities and colleges opened for the autumn semester. Saco's new report \"Future Prospects 2026\" describes how the labor market and job opportunities for university graduates are expected to look in five years. Sofia Rydgren Stale, chairman of Saco, says that an academic education is generally a good investment and that the labor market is good in the vast majority of academic professions. If she were to point out an area where the chances are particularly great after completing education, it would be care and social care. - Both dentists, veterinarians and sociologists, says Sofia Rydgren Stale are examples of jobs with good future prospects. At the same time, the security policy situation is strained and professions such as officer and coast guard are also among those where competition for the jobs is expected to be low. Professions where there will be a lot of competition for jobs Some of the professions where there is a balance between supply and demand – i.e. where approximately as many people are looking for jobs as there are vacancies – are biologist, graduate economist/economist, primary school teacher, IT graduate and lawyer. - These are areas with great needs and fairly large professional groups, so it is very positive that they are in balance, says Sofia Rydgren Stale. Professions where, on the other hand, there is expected to be a lot of competition for jobs in the future are, among other things, architects (building works), health scientists, interior designers, communication professions, museum and cultural environment professions, and social scientists. - If you choose professions in these areas, it can take a little longer before you get a permanent job, she says. - You may also need to move to get a permanent job. So that you are aware of the choice you are making. If you are passionate about working in these professions, you may also have to make choices during your studies that increase the chances of actually getting a job. This is how you should think about the choice of education Sofia Rydgren Stale's advice before what may be one of life's most important decisions is to think with both heart and brain. - You have to think about what you yourself are interested in and what you", "title_original": "Här är utbildningarna som ger dig jobb", "summary_original": "Under måndagen öppnade anmälan till universitet och högskolor inför höstterminen. I Sacos nya rapport ”Framtidsutsikter 2026” redogörs hur arbetsmarknaden och jobbchanserna för högskoleutbildade väntas se ut om fem år. Sofia Rydgren Stale, ordförande för Saco, säger att en akademisk utbildning generellt är en bra investering och att arbetsmarknaden är god inom de allra flesta akademiska yrken. Skulle hon peka ut ett område där chanserna är särskilt stora efter avslutad utbildning är det vård och omsorg. – Både tandläkare, veterinärer och socionomer, säger Sofia Rydgren Stale är exempel på jobb med goda framtidsutsikter. Samtidigt är det säkerhetspolitiska läget ansträngt och yrken som officer och kustbevakare hör också till dem där konkurrensen om jobben väntas vara liten. Yrken där det komma vara stor konkurrens om jobben Några av de yrken där det råder balans mellan tillgång och efterfrågan – alltså där ungefär lika många söker jobb som det finns lediga tjänster – är biolog, civilekonom/ekonom, grundskollärare, IT‑akademiker och jurist. – Det här är områden med stora behov och rätt så stora yrkesgrupper så det är väldigt positivt att de är i balans, säger Sofia Rydgren Stale. Yrken där det däremot väntas bli stor konkurrens om jobben framöver är bland annat arkitekt (byggnadsverk), hälsovetare, inredningsarkitekt, kommunikationsyrken, musei- och kulturmiljöyrken samt samhällsvetare. – Väljer man yrken inom de här områdena kan det ta lite längre tid innan man får ett fast jobb, säger hon. – Man kanske också behöver flytta för att få ett fast jobb. Så att man är medveten om vilket val man gör. Brinner man för att arbeta inom de här yrkena kan man dessutom behöva göra val under studietiden som ökar chanserna att faktiskt få ett jobb. Så ska du tänka kring valet av utbildning Sofia Rydgren Stales råd inför vad som kan vara ett av livets viktigaste beslut är att man ska tänka med både hjärta och hjärna. – Man måste fundera på vad man själv är intresserad av och vad man har fallenhet för. Man ska inte bara ta sig igenom en utbildning, utan också arbeta inom yrket ett helt arbetsliv, säger hon. – Men man behöver också välja med hjärnan och fundera på vilka delar som är viktiga för mig.", "link": "https://www.tv4.se/artikel/1k2pjWXODV9y4ZjTq829aH/haer-aer-utbildningarna-som-ger-dig-jobb", "date_display": "2026-03-16", "date_iso": "2026-03-16T13:09:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/nyhetsmorgon", "/jobb", "/arbete", "/student", "/arbetsmarknaden"]}, {"id": 144, "title": "The crime expert: \"Marius ends up in prison regardless\"", "summary": "The prosecutor in the closing argument: He is not a monster", "title_original": "Krimexperten: ”Marius hamnar i fängelse oavsett”", "summary_original": "Åklagaren i slutpläderingen: Han är inget monster", "link": "https://www.tv4.se/artikel/4z1Kb9Y6qUojh6UaTvbULL/krimexperten-marius-hamnar-i-faengelse-oavsett", "date_display": "2026-03-16", "date_iso": "2026-03-16T12:31:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 145, "title": "All L ministers resign if Mohamsson loses", "summary": "Pourmokhtari: Standing side by side for over a decade", "title_original": "Alla L-ministrar avgår om Mohamsson förlorar", "summary_original": "Pourmokhtari: Stått sida vid sida i över ett decennium", "link": "https://www.tv4.se/artikel/tt-260316-liberalerna1-1d08ce3c/alla-l-ministrar-avgar-om-mohamsson-forlorar", "date_display": "2026-03-16", "date_iso": "2026-03-16T11:31:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Liberalerna", "/valet-2022/liberalerna"]}, {"id": 146, "title": "How to tell if your child has a pollen allergy", "summary": "According to specialist nurse Johan Holmgren, pollen allergy is unusual in children under two years of age. After the age of two, the problems can start to be felt. A clear sign is if the symptoms return the same period every year, and that the allergy often affects several parts of the body at the same time. - If you are allergic to pollen, it is not certain that it just settles in your nose, but you have itchy eyes, redness, maybe it makes your throat itch, a little swelling and things like that, Johan Holmgren, specialist nurse for children and adolescents. If you suspect a pollen allergy, you can try self-care with an antihistamine. If the symptoms improve, it may indicate an allergy, since a cold is not affected by that type of medicine. When medicine does not help At the same time, medicine is not always enough. Many parents feel that antihistamines do not always work on children, and Johan Holmgren believes that it is often a matter of overexposure to pollen. - Many times when you penetrate it deeper, you may have been out playing in the park for a whole day. Then the medicines don't help, because then you are exposed to pollen storms, says Johan Holmgren and continues: - It doesn't matter how much medicine we use. There is too much pollen that we are exposed to.  In these cases, Johan Holmgren believes that you need to change clothes when the child comes in, avoid airing in the middle of the day and do not hang bedding outside during the pollen season. - You have to think a little about how we can minimize exposure to pollen. We should not isolate ourselves, but meet up with medicines for a good everyday life. But if you go out into the woods or play in the park, the medicine is not sufficient, he says.  Allergy vaccination in severe cases For children with very severe complaints, allergy vaccination may be relevant from school age. The treatment is given over a long period of time and aims to get the body used to the pollen that causes the allergy. However, the treatments are very expensive - These are the specific cases where it affects everyday life significantly, says Johan Holmgren. If you believe that bar", "title_original": "Så märker du om ditt barn har pollenallergi", "summary_original": "Enligt specialistsjuksköterskan Johan Holmgren är pollenallergi ovanligt hos barn under två år. Efter tvåårsåldern kan besvären börja märkas. Ett tydligt tecken är om symtomen återkommer samma period varje år, och att allergin ofta påverkar flera delar av kroppen samtidigt. – Om du är pollenallergisk är det inte säkert att det bara sätter sig i näsan utan du har kliande ögon, rodnad, kanske får det klia i halsen  lite svullenhet och såna saker, Johan Holmgren, specialistsjuksköterska barn och ungdom. Vid misstanke om pollenallergi kan man prova egenvård med antihistamin. Om symtomen förbättras kan det tyda på allergi, eftersom en förkylning inte påverkas av den typen av läkemedel. När medicin inte hjälper Samtidigt räcker medicin inte alltid till. Många föräldrar upplever att antihistamin inte alltid fungerar på barnen, och Johan Holmgren menar att det ofta handlar om överexponering för pollen. – Många gånger när man penetrerar det djupare kanske man har varit ute och lekt i parken en hel dag. Då hjälper inte medicinerna, för då utsätts man för pollenstorm, säger Johan Holmgren och fortsätter:  – Det spelar ingen roll hur mycket medicin vi skjuter på. Det är för mycket pollen som vi exponeras för.  I de här fallen menar Johan Holmgren att man behöver byta kläder när barnet kommer in, undvika att vädra mitt på dagen och inte hänga sängkläder utomhus under pollensäsongen. – Man får tänka till lite hur vi kan minimera att utsätta oss för pollen. Vi ska inte isolera oss, utan möta upp med läkemedel för en bra vardag. Men går du ut i skogen eller leker i parken, är medicinen inte tillräcklig, säger han.  Allergivaccination vid svåra fall För barn med väldigt svåra besvär kan allergivaccination bli aktuellt från skolåldern. Behandlingen ges under lång tid och syftar till att vänja kroppen vid det pollen som orsakar allergin. Dock är behandlingarna väldigt dyra – De här är de specifika fallen där det påverkar vardagslivet avsevärt, säger Johan Holmgren. Om man tror att barnet har pollenallergi bör man först och främst observera symtomen och prova egenvård. Om besvären är allvarliga, till exempel påverkar andning eller skolgång, ska man kontakta vården.", "link": "https://www.tv4.se/artikel/3Jjn0G73dh8onqbgjyhwV/sa-maerker-du-om-ditt-barn-har-pollenallergi", "date_display": "2026-03-16", "date_iso": "2026-03-16T10:57:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/pollenallergi", "/pollen", "/barn", "/foraldrar", "/halsa"]}, {"id": 147, "title": "Then it is cheapest to wash and wash the dishes", "summary": "During the morning, hydropower and wind power accounted for equal shares of energy. The nuclear power plants Forsmark 3 and Oskarshamn 2 are down for revision, which means that part of the planned electricity is missing.  - So we become more dependent on the weather, says meteorologist Ulrika Elvgren. She says that every degree affects the price of electricity. - Now there is a difference of one degree on the thermometer. It affects the electricity price by 4 öre per kilowatt hour, and the wind One meter per second difference affects the electricity price by 11 öre/kWh, says Ulrika Elvgren. Keep an eye on the duck curve The wind is the biggest factor that affects the price of electricity if you look at the impact of the weather. This week the weather is expected to be quite favorable. - We have the mild air which is also going on here. Mild air means that the consumption, we don't need as much electricity to heat properties, will go down so that you don't need as much in circulation in the electricity system as well. Ulrika Elvgren also says that it is good to keep an eye on the duck curve. - We get solar electricity from the continent, which lowers the spot prices during the day. You get a duck curve on the spot prices. One must know how expensive it is to start the washing machine. If you have quarter prices anyway, she says. Then it's cheapest to wash and wash dishes But she sees a positive development. Electricity prices look set to drop going forward due to milder temperatures and more spin on the wind turbines. - So we probably even have negative electricity prices here also baked into this average value that we see ahead of the middle of the week, says Ulrika Elvgren. But the wind is expected to subside and there may be cold nights that push up prices in southern Sweden. - But there may still be, in the middle of the day, that it is cheap when we bring in solar electricity from the continent. So Wednesday, Thursday, that's when we do the dishes, wash and vacuum.", "title_original": "Då är det billigast att tvätta och diska", "summary_original": "Under morgonen har vattenkraften och vindkraften stått för lika stora andelar av energi. Kärnkraftverken Forsmark 3 och Oskarshamn 2 är nere för revision vilket gör att en del av den planerbara elen saknas.  – Så vi blir ju mer väderberoende, säger meteorolog Ulrika Elvgren. Hon säger att varje grad påverkar elpriset. – Nu skiljer det en grad på termometern. Det påverkar elpriset med 4 öre per kilowattimme, och vinden En meter per sekund i skillnad påverkar elpriset med 11 öre/kWh, säger Ulrika Elvgren. Håll koll på ankkurvan Vinden är den största faktorn som påverkar elpriset om man ser till väderpåverkan. I veckan väntas vädret bli ganska gynnsamt. – Vi har mildluften som dessutom är på gång här. Mildluft innebär att förbrukningen, vi behöver inte lika mycket el  för att värma upp fastigheter, kommer att gå ner så att man inte behöver lika mycket i omlopp i elsystemet också. Ulrika Elvgren säger också att det är bra att hålla koll på ankkurvan. –Vi får in solelen från kontinenten som sänker spotpriserna under dagen. Man får en ankkurva på spotpriserna. Man måste veta hur dyrt det är att starta tvättmaskinen. Om man har kvartspriser i alla fall, säger hon. Då är det billigast att tvätta och diska Men hon ser en positiv utveckling. Elpriserna ser ut att sjunka framåt på grund av en mildare temperatur och mer snurr på vindkraftverken. – Så förmodligen kanske vi till och med har negativa elpriser här också inbakat i det här medelvärdet som vi ser framåt mitten av veckan, säger Ulrika Elvgren. Men vinden väntas avta och det kan bli kalla nätter som drar upp priserna i södra Sverige. –  Men det kanske finns ändå, mitt på dagen, att det är billigt när vi får in solelen från kontinenten. Så onsdag, torsdag, det är då vi diskar, tvättar och dammsuger.", "link": "https://www.tv4.se/artikel/1Ms99C8TUqh57Vn2sFNnlw/da-aer-det-billigast-att-tvaetta-och-diska", "date_display": "2026-03-16", "date_iso": "2026-03-16T10:55:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/ekonomi/elpriset", "/elpriskollen"]}, {"id": 148, "title": "Trump calls for NATO help - warns of 'very bad future'", "summary": "The Swedish expert: This is a sign", "title_original": "Trump kräver Natos hjälp – varnar för ”mycket dålig framtid”", "summary_original": "Svenske experten: Det här är ett tecken", "link": "https://www.tv4.se/artikel/2nBKhl6nvvsrXc8PunWz02/trump-kraever-natos-hjaelp-varnar-foer-mycket-dalig-framtid", "date_display": "2026-03-16", "date_iso": "2026-03-16T10:46:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 149, "title": "Målle gets its memorial bench in Nässjö - despite the municipality's no", "summary": "The family is paying for a memorial bench that will be set up in Nässjö Hembygdspark.", "title_original": "Målle får sin minnesbänk i Nässjö – trots kommunens nej", "summary_original": "Familjen bekostar minnesbänk som sätts upp i Nässjö hembygdspark.", "link": "https://www.dagen.se/nyheter/malle-far-sin-minnesbaenk-i-naessjoe-trots-kommunens-nej/10248956", "date_display": "2026-03-16", "date_iso": "2026-03-16T10:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 150, "title": "HD does not try the John Walter case - the family takes it on", "summary": "John Walter was placed in May 2021 by Falu municipality in a HVB home in Hagfors in Värmland, despite the parents' opposition to the placement. Just over two weeks later, he ran away from home and was found a few hours later drowned in a nearby river.  Both the Falu District Court and now also the Svea Court of Appeal exonerated the municipality from liability.  Now the Supreme Court has decided that it will not try the case. Thus, the Court of Appeal's judgment stands, where Falu municipality is freed from responsibility. \"I am disappointed. John Walter is completely without rights, us parents too,\" says the father Hans-Erik Sjöholm in a press release.  The organization Center for Justice, which is helping the family legally, states that the next step will be the European Court. - This is a tragedy. A child has died in community care and according to the courts, no one can be held responsible. It is an incorrect assessment, says Alexandra Loyd, deputy director at the Center for Justice.", "title_original": "HD prövar inte fallet John Walter – familjen tar det vidare", "summary_original": "John Walter placerades i maj 2021 av Falu kommun på ett HVB-hem i Hagfors i Värmland, trots att föräldrarna motsatte sig placeringen. Drygt två veckor senare rymde han från hemmet och hittades några timmar senare drunknad i en närliggande älv.  Både Falu tingsrätt som nu även Svea hovrätt friade kommunen från ansvar.  Nu har högsta domstolen beslutat att man inte kommer att pröva fallet. Därmed står hovrättens dom fast, där Falu kommun frias från ansvar. ”Jag är besviken. John Walter är helt rättslös, vi föräldrar också”, säger pappan Hans-Erik Sjöholm i ett pressmeddelande.  Organisationen Centrum för rättvisa, som hjälper familjen juridiskt, uppger att nästa steg blir Europadomstolen. – Det här är en tragedi. Ett barn har dött i samhällets vård och enligt domstolarna är det ingen som kan hållas ansvarig. Det är en felaktig bedömning, säger Alexandra Loyd, biträdande chef på Centrum för rättvisa.", "link": "https://www.tv4.se/artikel/3P2gMufIHb544VytV84SVs/hd-proevar-inte-fallet-john-walter-familjen-tar-det-vidare", "date_display": "2026-03-16", "date_iso": "2026-03-16T10:20:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/john-walter", "/hvb", "/hogsta-domstolen"]}, {"id": 151, "title": "Salad with goat cheese and pears", "summary": "Today's dinner tip offers a fresh salad where creamy goat cheese meets sweet, crunchy pears and roasted pine nuts - a flavor combination that is hard to beat. With roasted vegetables and chickpeas, it becomes a complete and satisfying dinner.  See Siri Barje's recipe", "title_original": "Sallad med getost och päron", "summary_original": "Dagens middagstips bjuder på en fräsch sallad där krämig getost möter söta, krispiga päron och rostade pinjenötter - en svårslagen smakkombination. Med rostade grönsaker och kikärter blir det en komplett och mättande middag.  Se Siri Barjes recept", "link": "https://www.tv4.se/artikel/2QFeEL4Pk4XRE2n3w7Sty1/sallad-med-getost-och-paeron", "date_display": "2026-03-16", "date_iso": "2026-03-16T09:43:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/siri-barje", "/koket", "/kokets-middag"]}, {"id": 152, "title": "Secure the sign of spring - the bears at Skansen have woken up", "summary": "After barely four months, they now began to move again. The three six-year-old siblings have been sleeping since November and today they came out of their trance. And they are described as \"dizzy awake\". During the winter, the bears rested in their house.  - The whole body and the heart rhythm decrease in activity, but recently the activity in the body has slowly increased, says Henrietta Seward, group manager, Wild animals at Skansen.  The surest sign of spring Now they get meat to eat - and some vegetables. During the summer, the diet consists more of fruit and berries.  - You adapt the diet to what food is available in the wild, says Henrietta Seward. It is a big adjustment to come out of the id. In the beginning, the bears do not eat very much.  - They will be very tired again soon. But the more they eat, the fitter they will be.", "title_original": "Säkra vårtecknet – björnarna på Skansen har vaknat", "summary_original": "Efter knappt fyra månader började de nu röra på sig igen. De tre sexåriga syskonen har sovit sedan i november och i dag kom de ut ur sitt ide. Och de beskrivs som ”yrvakna”. Under vintern har björnarna vilat i sitt hus.  – Hela kroppen och hjärtrytmen går ner i aktivitet men den senaste tiden har aktiviteten i kroppen sakta ökat, säger Henrietta Seward, gruppchef, Vilda djur på Skansen.  Säkraste vårtecknet Nu får de kött att äta – och lite grönsaker. Under sommaren består kosten mer av frukt och bär.  – Man anpassar kosten efter vilken mat som finns i det vilda, säger Henrietta Seward. Det är en stor omställning att komma ut ur idet. I början äter björnarna inte särskilt mycket.  – De kommer bli väldigt trötta snart igen. Men ju mer de äter upp sig, desto piggare kommer de bli.", "link": "https://www.tv4.se/artikel/3hhc7K14QUKeLlKwTSDLbo/saekra-vartecknet-bjoernarna-har-vaknat", "date_display": "2026-03-16", "date_iso": "2026-03-16T09:24:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/bjorn", "/skansen"]}, {"id": 153, "title": "The Kurdish leader from Sweden: That's why we're not going into Iran - yet", "summary": "TV4's team visits camps near the border", "title_original": "Kurdiska ledaren från Sverige: Därför går vi inte in i Iran – än", "summary_original": "TV4:s team besöker läger nära gränsen", "link": "https://www.tv4.se/artikel/6iX1RU4NdJXFS7aEvfflKq/kurdiska-ledaren-fran-sverige-daerfoer-gar-vi-inte-in-i-iran-aen", "date_display": "2026-03-16", "date_iso": "2026-03-16T08:47:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 154, "title": "Pesticides in food - warns of harmful chemical cocktail", "summary": "In the review, the Nature Conservation Association looked at a total of seven foods purchased from stores in the Stockholm area. \n\nIn the analysis, residues from a total of 32 different harmful pesticides were measured in 37 out of 50 conventionally grown products. For organically grown, the corresponding figure was 3 out of 36. Among what was found are PFAS substances, substances that are harmful to bees or that are suspected of causing cancer.  It looked worst with apples, grapes and wheat flour, where all specimens contained at least one substance harmful to health. An apple that was tested contained seven harmful substances.  Risks with a cocktail effect At the same time, the review states that the levels of each individual substance are below the prevailing limit values. But according to Karin Lexén, it is the so-called cocktail effect, i.e. the mixture of substances, that constitutes the health risk. \n\n- We don't know how it works. Probably it becomes more serious when it is a combination of different substances. That gives us reason to be concerned. If we find it in our food, we also find it in our nature, she says.   Wants to see support for conversion She believes that one reason why it looks the way it does is that conventional agriculture does not have sufficient resources. \n\n- Many would like to use organic farming, but they do not have the financial means to do so. \n\nThe Nature Conservation Society highlights several measures that they want the daily grocery trade and politics to take. On the one hand, shops should increase the supply and lower the profit margin on the organic goods, and on the other hand, politics should do more to phase out pesticides.  \n\n- We think they should give financial instruments to farmers who want to switch to organic farming and support to consumers who want to buy more of it, says Karin Lexén.", "title_original": "Bekämpningsmedel i mat – varnar för skadlig kemikaliecocktail", "summary_original": "I granskningen har Naturskyddsföreningen tittat på totalt sju livsmedel inköpta från butiker i Stockholmsområdet. \n\nI analysen uppmättes rester från totalt 32 olika skadliga bekämpningsmedel i 37 av 50 konventionellt odlade produkter. För ekologiskt odlade var motsvarande siffra 3 av 36. Bland det som hittats finns PFAS-ämnen, ämnen som är skadliga för bin eller som är misstänkt cancerframkallande.  Värst såg det ut hos äpplen, vindruvor och vetemjöl där samtliga exemplar innehöll minst ett hälsoskadligt ämne. Ett äpple som testades innehöll sju skadliga ämnen.  Risker med cocktaileffekt  Samtidigt fastslår granskningen att halterna av varje enskilt ämne ligger under rådande gränsvärden. Men enligt Karin Lexén är det den så kallade cocktaileffekten, det vill säga blandningen av ämnen, som utgör hälsorisken. \n\n– Den vet vi inte hur den slår. Förmodligen blir det allvarligare när det är en kombination av olika ämnen. Det ger oss en anledning till att vara oroliga. Hittar vi det i vår mat, hittar vi det också i vår natur, säger hon.   Vill se stöd för omställning  Hon menar att en anledning till att det ser ut som det gör är att konventionella jordbruk inte har tillräckliga resurser. \n\n– Många skulle vilja använda sig av ekologisk odling, men de har inte ekonomiska förutsättningar att göra det. \n\nNaturskyddsföreningen lyfter flera åtgärder som de vill att dagligvaruhandeln och politiken ska vidta. Dels bör butiker öka utbudet och sänka vinstmarginalen på de ekologiska varorna, dels bör politiken göra mer för att fasa ut bekämpningsmedel.  \n\n– Vi tycker att de ska ge ekonomiska styrmedel till lantbrukare som vill gå över till ekologisk odling och stöd till konsumenter som vill köpa mer av det, säger Karin Lexén.", "link": "https://www.tv4.se/artikel/6Xio7QLSxEnOhJ2mMleliZ/bekaempningsmedel-i-mat-varnar-foer-skadlig-kemikaliecocktail", "date_display": "2026-03-16", "date_iso": "2026-03-16T05:41:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/matbutiker", "/livsmedel", "/naturskyddsforeningen", "/granskning"]}, {"id": 155, "title": "Here is Dagens' new youth panel - new trio of writers", "summary": "Uma Lundkvist, 17, Lisabeth Möllås, 15, and Matilda Westlund, 16, make up Dagen's youth panel • Get to learn more about journalism and contribute their own texts to the newspaper in 2026.", "title_original": "Här är Dagens nya ungdomspanel – ny skribenttrio", "summary_original": "Uma Lundkvist, 17, Lisabeth Möllås, 15, och Matilda Westlund, 16, utgör Dagens ungdomspanel • Får lära sig mer om journalistik och bidra med egna texter i tidningen under 2026.", "link": "https://www.dagen.se/kultur/haer-aer-dagens-nya-ungdomspanel-ny-skribenttrio/10243840", "date_display": "2026-03-16", "date_iso": "2026-03-16T05:03:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "He is the new Ica-Stig: \"I thought about it for about five minutes\"", "summary": "Since Björn Kjellman hung up the white jacket in February, there has been a lot of speculation. According to the odds, comedians and actors Per Andersson and Annika Andersson were favorites to take over the lead role in Ica's commercials. Then followed Rolf Lassgård, Henrik Dorsin, David Batra and Sissela Kyle. In the evening newspaper, Christian Bauer, Pernilla Wahlgren's husband and purchasing manager at Ica, was asked if he thought it would be fun to become the new Ica‑Stig. On Monday morning, someone completely different appeared in the TV box. An actor who was not on the betting companies' list of nearly 70 candidates - Mikael Tornving, who will now take on the role of Ica-Stig. - For me, he is a hard-working, warm, empathetic businessman, says Mikael Tornving about his new character. It was not obvious to accept But it was not obvious to accept the assignment. - I hadn't even thought about this. But I thought for about five minutes then I realized that this could be great fun to do, says Mikael Tornving in Nyhetsmorgon. But it wasn't the price tag that made him change his mind. - It is not US money we are talking about. But it is a continuous work. I am semi-retired and this felt like fun to do. It's great fun, since I started recording I feel like I've missed being part of a context and working together, he says. He is fourth Ica-Stig Mikael Tornving is a comedian, actor and presenter and has, among other things, appeared in \"Parliament\", \"Jeopardy\" and \"Kompani Svan\" and played Patrik Agrell in \"Johan Falk\" and Tommy in \"Playa del Sol\". Since the start of Ica's popular advertising soap in 2001, three actors have had time to shoulder the role of Ica-Stig before him. First out was Hans Mosesson. In 2015, Loa Falkman took over and played the popular trader until 2020. Then Björn Kjellman stepped in and had the role for five years. - That the choice fell on Mikael Tornving was because of his precise timing, characteristic humor and his natural poise. ICA-Sti", "title_original": "Han är nya Ica-Stig: ”Tänkte väl i ungefär fem minuter”", "summary_original": "Sedan Björn Kjellman hängde av sig den vita kavajen i februari har spekulationerna varit många. Enligt oddsen var komikerna och skådespelarna Per Andersson och Annika Andersson favoriter att ta över huvudrollen i Icas reklamfilmer. Därefter följde Rolf Lassgård, Henrik Dorsin, David Batra och Sissela Kyle. I kvällstidningen fick Christian Bauer, Pernilla Wahlgrens make och inköpschef på Ica, frågan om han skulle tycka att det var roligt att bli nya Ica‑Stig. Under måndagsmorgonen syntes någon helt annan i tv-rutan. En skådespelare som inte fanns med på bettingbolagens lista över närmare 70 kandidater – Mikael Tornving, som nu ska axla rollen som Ica-Stig. – För mig är han en hårt arbetande, varm, empatisk affärsman, säger Mikael Tornving om sin nya karaktär. Inte självklart att tacka ja Men det var inte självklart att tacka ja till uppdraget. – Det här hade jag inte ens tänkt på. Men jag tänkte väl i ungefär fem minuter sen insåg jag att det här kan ju bli jätteroligt att göra, säger Mikael Tornving i Nyhetsmorgon. Men det var inte prislappen som fick honom att ändra sig. – Det är inte USA-pengar vi pratar om. Men det är ett kontinuerligt arbete. Jag har gått i kvasipension och det här kändes kul att göra. Det är jätteroligt, sen jag började spela in så känner jag att jag har saknat att ingå i ett sammanhang och jobba tillsammans, säger han. Han är fjärde Ica-Stig Mikael Tornving är komiker, skådespelare och programledare och har bland annat medverkat i ”Parlamentet”, ”Jeopardy” och ”Kompani Svan” och spelat Patrik Agrell i ”Johan Falk” och Tommy i ”Playa del Sol”. Sedan starten av Icas populära reklamsåpa 2001 har tre skådespelare hunnit axla rollen som Ica-Stig före honom. Först ut var Hans Mosesson. År 2015 tog Loa Falkman över och spelade den folkkära handlaren fram till 2020. Därefter klev Björn Kjellman in och hade rollen i fem år. – Att valet föll på just Mikael Tornving var för att hans precisa timing, karaktäristiska humor och hans naturliga pondus. ICA-Stig som karaktär är både stark och inspirerande, men ska också kunna bjuda på sig själv och ha glimten i ögat vilket vi tycker att Mikael har, säger Fredrik Kullberg, marknadschef ICA Sverige i ett pressmeddelande.", "link": "https://www.tv4.se/artikel/1OMxHhmBTNNF0rFVv6hQOG/han-aer-nya-ica-stig", "date_display": "2026-03-16", "date_iso": "2026-03-16T04:52:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/ica", "/reklam", "/nyhetsmorgon"]}, {"id": 157, "title": "This is how municipalities should improve their contacts with religious communities", "summary": "New guidance released after a year-long government mandate • Sweden's municipalities and regions: \"Wise to cooperate with religious communities in an organized way.\"", "title_original": "Så ska kommunerna förbättra sina kontakter med trossamfunden", "summary_original": "Ny vägledning släppts efter årslångt regeringsuppdrag • Sveriges kommuner och regioner: ”Klokt att samverka med trossamfunden på ett organiserat sätt.”", "link": "https://www.dagen.se/nyheter/sa-ska-kommunerna-foerbaettra-sina-kontakter-med-trossamfunden/10245820", "date_display": "2026-03-16", "date_iso": "2026-03-16T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The fruit of one's leadership determines whether the call bears", "summary": "In a time when people choose their leaders like small sweets, it becomes decisive that it is God who calls, not people, writes Lisa Fredlund in a closing remark.", "title_original": "Frukten av ens ledartjänst avgör om kallelsen bär", "summary_original": "I en tid när människor väljer sina ledare som smågodis blir det avgörande att det är Gud som kallar, inte människor, skriver Lisa Fredlund i en slutreplik.", "link": "https://www.dagen.se/debatt/frukten-av-ens-ledartjaenst-avgoer-om-kallelsen-baer/10245831", "date_display": "2026-03-16", "date_iso": "2026-03-16T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Here the network \"Rätt till tro\" steps into the Riksdag for the cause of the converts", "summary": "\"For many years, we have pointed out that converts were rejected on such bizarre grounds,\" says Micael Grenholm, who was there when \"Rätt till tro\" tried to influence the politicians", "title_original": "Här kliver nätverket ”Rätt till tro” in i riksdagen för konvertiternas sak", "summary_original": "”Vi har i många år pekat på att konvertiter fått avslag på så bisarra grunder”, säger Micael Grenholm som var med då ”Rätt till tro” försökte påverka politikerna", "link": "https://www.dagen.se/nyheter/haer-kliver-naetverket-raett-till-tro-in-i-riksdagen-foer-konvertiternas-sak/10248422", "date_display": "2026-03-16", "date_iso": "2026-03-16T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Oscar to Ludwig Göransson", "summary": "Ludwig Göransson has previously talked about how his father Tomas got him hooked on blues music - which has now led to him receiving an Oscar for best music for the film \"Sinners\", directed by Ryan Coogler.  From the stage at the Dolby Theatre, Göransson recounted how his father bought a blues record with John Lee Hooker in 1964. It was from the other side of the world, a place my father had never been and a place he couldn't relate to, but the music changed my father's life. The father became a music teacher and inspired his son, who has now received his third Oscar. Göransson has previously been awarded the Oscar for best film score from \"Black Panther\" in 2018 and \"Oppenheimer\", as recently as two years ago.  Göransson was seven years old when he got his first guitar.  And it was the guitar that opened the doors for me and it was the guitar that brought me to the United States and ultimately led me to one of the greatest storytellers of our time – Ryan Coogler. Göransson is also nominated in the best song category for \"I lied to you\", also from \"Sinners\". If he wins that category, he will be the only Swede to have won four Oscars.", "title_original": "Oscar till Ludwig Göransson", "summary_original": "Ludwig Göransson har tidigare pratat om hur hans pappa Tomas fick honom att fastna för bluesmusik – som nu har lett till att han fått en Oscar för bästa musik för filmen ”Sinners”, som regisserats av Ryan Coogler.  Från scenen på Dolby Theatre återberättade Göransson hur hans pappa köpte en bluesskiva med John Lee Hooker 1964.  Den var från andra sidan av jorden, en plats min pappa aldrig hade varit på och ett ställe han inte kunde relatera till, men musiken förändrade min pappas liv. Pappan blev musiklärare och inspirerade sin son, som nu fått sin tredje Oscar. Göransson har tidigare belönats med Oscar för bästa filmmusik ur ”Black panther” 2018 och ”Oppenheimer”, så sent som för två år sedan.  Göransson var sju år när han fick sin första gitarr.  Och det var gitarren som öppnade dörrarna för mig och det var gitarren som tog mig till USA och till slut ledde mig till en av de främsta historieberättarna i vår tid – Ryan Coogler. Göransson är även nominerad i kategorin bästa låt för ”I lied to you”, också den från ”Sinners”. Vinner han den kategorin blir han ensam svensk att ha vunnit fyra Oscars.", "link": "https://www.tv4.se/artikel/tt-260316-oscarsgalangoransson1-b1fc1dd5/oscar-till-ludwig-goransson-hyllade-sin-pappa", "date_display": "2026-03-16", "date_iso": "2026-03-16T01:32:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/film", "/usa", "/konst", "/ludwig-goransson", "/kultur", "/oscarsgalan"]}, {"id": 161, "title": "It can be early signs of dementia: \"Valuable clues\"", "summary": "Behavioral changes such as anxiety, depression, irritability, apathy or agitation can appear in older people long before a dementia diagnosis can be established. A new study conducted by researchers at the Karolinska Institute and the University of Perugia in Italy also shows that the symptoms can form patterns in both cognitively healthy and dementia-diagnosed people, which the site forskning.se was the first to report. 1,234 people aged 65 and over participated in the study. Four neuropsychiatric profiles were developed, with the lowest level showing no or very few symptoms and the strongest showing behavior dominated by delusions, agitation and irritability.  \"Can give us valuable clues\" Behavioral changes occurred in both groups, but were more pronounced in those diagnosed with dementia. 42 percent of the participants without dementia showed symptoms of any of the behavioral changes. According to the researchers, the results are important for understanding the development of dementia. \"This can give us valuable clues about who is at higher risk of developing dementia. Our study also shows that certain clusters of symptoms occur together with treatable health conditions, which highlights opportunities for preventive strategies and earlier support,\" says Anna Marseglia, assistant lecturer at the department of neurobiology, care science and society at Karolinska Institutet who co-authored the study, in a press release. Will investigate connection to Alzheimer's The next step is to follow the participants over time to form an idea of ​​whether the neuropsychiatric profiles develop clinically and to investigate what role different factors play in the development. The researchers also plan to link the behavioral patterns of the people studied to blood-based biomarkers for Alzheimer's disease to better understand the underlying mechanisms that lead to dementia.", "title_original": "Det kan vara tidiga tecken på demens: ”Värdefulla ledtrådar”", "summary_original": "Beteendeförändringar såsom ångest, depression, irritabilitet, apati eller agitation kan uppträda hos äldre personer långt innan en demensdiagnos kan fastlås. En ny studie gjort av forskare vid Karolinska institutet och universitet i Perugia i Italien visar dessutom att symptomen kan bilda mönster hos såväl kognitivt friska som demensdiagnostiserade personer, vilket sajten forskning.se var först med att rapportera. 1 234 personer i åldern 65 och uppåt deltog i studien. Fyra neuropsykiatriska profiler togs fram, där den lägst nivån visade inga eller mycket få symptom och den kraftigaste visade ett beteende dominerat av vanföreställningar, agitation och irritabilitet.  ”Kan ge oss värdefulla ledtrådar” Beteendeförändringar förekom i båda grupper, men var mer uttalade hos de som diagnostiserats med demens. 42 procent av deltagarna utan demens visade symptom för någon av beteendeförändringarna. Enligt forskarna är resultaten viktiga för att förstå utveckling av demens. ”Detta kan ge oss värdefulla ledtrådar om vilka som löper högre risk att utveckla demens. Vår studie visar också att vissa symtomkluster förekommer tillsammans med behandlingsbara hälsotillstånd, vilket lyfter fram möjligheter för förebyggande strategier och tidigare stöd”, säger Anna Marseglia, biträdande lektor vid institutionen för neurobiologi, vårdvetenskap och samhälle vid Karolinska Institutet som var med och skrev studien, i ett pressmeddelande. Ska undersöka koppling till Alzheimer Nästa steg är att följa deltagarna över tid för att bilda en uppfattning om de neuropsykiatriska profilerna utvecklas kliniskt samt att undersöka vilken roll olika faktorer spelar i utvecklingen. Forskarna planerar dessutom att koppla de studerade personernas beteendemönster till bland blodbaserade biomarkörer för Alzheimers sjukdom för att bättre förstå underliggande mekanismer som leder till demenssjukdomar.", "link": "https://www.tv4.se/artikel/7rmrxMnpzaa7X2CfjfvjFf/det-kan-vara-tidiga-tecken-pa-demens-vaerdefulla-ledtradar", "date_display": "2026-03-15", "date_iso": "2026-03-15T19:41:41+00:00", "source": , {"id": 176, "title": "Diana Rocky:\nWe must dare to believe that the church bells may soon ring openly in Iran", "summary": "Exile Iranian Dayana Rocky writes about the struggle among Iranian Christians and why so many Iranians choose to follow Jesus - despite the risks", "title_original": "Dayana Rocky:\nVi måste våga tro att kyrkklockorna snart kan ringa öppet i Iran", "summary_original": "Exiliraniern Dayana Rocky skriver om kampen bland iranska kristna och varför så många iranier väljer att följa Jesus – trots riskerna", "link": "https://www.dagen.se/kultur/dayana-rocky-vi-maste-vaga-tro-att-kyrkklockorna-snart-kan-ringa-oeppet-i-iran/10238996", "date_display": "2026-03-14", "date_iso": "2026-03-14T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 177, "title": "Sebastian Stake Set:\nIt's never about what you did for God", "summary": "The only thing that is needed is that we believe in what he did for us on the cross", "title_original": "Sebastian Stakset:\nDet handlar aldrig om vad du gjort för Gud", "summary_original": "Det enda som behövs är att vi tror på vad han gjort för oss på korset", "link": "https://www.dagen.se/livsstil/sebastian-stakset-det-handlar-aldrig-om-vad-du-gjort-foer-gud/10245466", "date_display": "2026-03-14", "date_iso": "2026-03-14T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 178, "title": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "title_original": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary_original": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/speech-by-the-minister-for-foreign-affairs-at-the-baltic-sea-security-talks-in-gdansk-on-12-march/", "date_display": "2026-03-13", "date_iso": "2026-03-13T13:51:21+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "3 days old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 179, "title": "The Payments Report 2026: Measures required to reduce vulnerability and increase inclusion in the payments market", "summary": "In order to reduce dependence on the outside world, the banks need to develop new payment services based on national and European systems. Primarily, banks must offer more services for instant payments, otherwise legislation should be introduced. To increase inclusion in the payment market, more payment methods are needed for those who do not have a payment account or experience digital exclusion. Access to cash services also needs to be improved, the Riksbank writes in the Payment Report published today.", "title_original": "Betalningsrapporten 2026: Åtgärder krävs för minskad sårbarhet och ökad inkludering på betalningsmarknaden", "summary_original": "För att minska omvärldsberoendet behöver bankerna utveckla nya betaltjänster som bygger på nationella och europeiska system. Primärt måste bankerna erbjuda fler tjänster för omedelbara betalningar, annars bör lagstiftning införas. För att öka inkluderingen på betalningsmarknaden behövs det fler betalsätt för de som saknar betalkonto eller upplever digitalt utanförskap. Tillgången till kontanttjänster behöver också förbättras, det skriver Riksbanken i Betalningsrapporten som publiceras idag.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/betalningsrapporten-2026-atgarder-kravs-for-minskad-sarbarhet-och-okad-inkludering-pa-betalningsmarknaden/", "date_display": "2026-03-12", "date_iso": "2026-03-12T08:00:30+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "5 days old", "tags": []}, {"id": 180, "title": "The Riksbank's business survey: \"It is not an obvious recovery, but we see that it is still happening\"", "summary": "The large Swedish companies are experiencing a certain improvement in the economy, but the recovery is both slow and hesitant. The troubled global situation has noticeably affected household consumption and companies' willingness to invest, and makes companies cautious when looking ahead. This is shown by the Riksbank's company survey in February.", "title_original": "Riksbankens företagsundersökning: ”Det är ingen självklar återhämtning men vi ser att det ändå händer”", "summary_original": "De svenska storföretagen upplever en viss förbättring av konjunkturen, men återhämtningen är både långsam och tvekande. Det oroliga omvärldsläget har påverkat hushållens konsumtion och företagens investeringsvilja märkbart och gör företagen försiktiga när de blickar framåt. Det visar Riksbankens företagsundersökning i februari.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbankens-foretagsundersokning-det-ar-ingen-sjalvklar-aterhamtning-men-vi-ser-att-det-anda-hander/", "date_display": "2026-03-11", "date_iso": "2026-03-11T08:30:29+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "5 days old", "tags": []}, {"id": 181, "title": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "title_original": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary_original": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/statement-by-ms-nina-larsson-minister-for-gender-equality/", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:54:30+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "6 days old", "tags": ["Speech", "International", "Ministry of Employment", "Gender equality", "Nina Larsson"]}, {"id": 182, "title": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "title_original": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary_original": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "link": "https://www.government.se/statements/2026/03/statement-from-ministry-for-foreign-affairs-on-summoning-of-russian-ambassador/", "date_display": "2026-03-10", "date_iso": "2026-03-10T09:26:54+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement", "Sweden's support to Ukraine"]}, {"id": 183, "title": "Government supports women’s and girls’ resilience in Ukraine", "summary": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "title_original": "Government supports women’s and girls’ resilience in Ukraine", "summary_original": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "link": "https://www.government.se/press-releases/2026/03/government-supports-womens-and-girls-resilience-in-ukraine/", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:58:18+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "7 days old", "tags": ["Press release", "International", "Ministry of Employment", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Benjamin Dousa", "Nina Larsson"]}, {"id": 184, "title": "Minister for Gender Equality wants to see stronger international alliances against online threats and hatred", "summary": "Minister for Gender Equality Nina Larsson will lead the Swedish delegation attending the UN Commission on the Status of Women in New York on 9–19 March, the world’s largest conference on women’s rights and gender equality. Ms Larsson will take part during the first week and will be advocating for stronger international alliances against online threats and hatred. The conference on women’s rights and gender equality is held annually and is the second largest in the UN system.", "title_original": "Minister for Gender Equality wants to see stronger international alliances against online threats and hatred", "summary_original": "Minister for Gender Equality Nina Larsson will lead the Swedish delegation attending the UN Commission on the Status of Women in New York on 9–19 March, the world’s largest conference on women’s rights and gender equality. Ms Larsson will take part during the first week and will be advocating for stronger international alliances against online threats and hatred. The conference on women’s rights and gender equality is held annually and is the second largest in the UN system.", "link": "https://www.government.se/press-releases/2026/03/minister-for-gender-equality-wants-to-see-stronger-international-alliances-against-online-threats-and-hatred/", "date_display": "2026-03-09", "date_iso": "2026-03-09T12:33:12+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "7 days old", "tags": ["Press release", "International", "Ministry of Employment", "Democracy and human rights", "Gender equality", "Nina Larsson"]}, {"id": 185, "title": "Statement on the decisions by the International Paralympic Committee related to the 2026 Paralympic Winter Games", "summary": "", "title_original": "Statement on the decisions by the International Paralympic Committee related to the 2026 Paralympic Winter Games", "summary_original": "", "link": "https://www.government.se/statements/2026/03/statement-on-the-decisions-by-the-international-paralympic-committee-related-to-the-2026-paralympic-winter-games/", "date_display": "2026-03-06", "date_iso": "2026-03-06T17:23:30+00:00", "source": "Government.se", "ministry": "Ministry of Health and Social Affairs", "type": "Official Information", "age_tag": "10 days old", "tags": ["International", "Ministry of Health and Social Affairs", "Civil society and sport", "Statement", "Jakob Forssmed"]}, {"id": 186, "title": "Continuing Nordic cooperation on returns", "summary": "Joint Statement by the ministers responsible for   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
