select { padding-right: 30px; }

.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {

/* FOOTER */

é att stressa. Men det är klart att man ibland undrar hur det ens ska gå. Petter vill ju, men han har bara inte haft tid. Men jag är lugn nu när du är här, säger hon. När Northug jobbade i Spanien följde Takacs med för att de skulle kunna träna. – Men nu på fredag blir det säsongsbästa, säger hon. – Nu förväntar sig folk i Sverige och Norge, och juryn, att jag ska prestera på topp. Då får jag börja ge dem det. Vi har legat lite bakom i fältet och lurat, men nu ska vi ta kommando i Let's dance, säger han. Paret med bästa kemi Samtidigt som de haft ont om träningstid har paret omgetts av romansrykten. Under sändningen i fredags skämtades det friskt om deras resa till Spanien. – Jag tror att det stärker oss. Folk ser att vi har bra kemi nu, särskilt eftersom Jasmine har varit så nära mig och följt med på träning. Hon har fått se hur min hektiska vardag ser ut. Vi pressar in träningspassen, har humor, har kul och äter middag tillsammans. Det tror jag är vår styrka, både nu och längre fram i tävlingen, säger Northug. Är ni paret med bäst kemi? – Alla par har nog sin egen kemi, men jag tror att vi har byggt upp en ganska stark kemi hittills. Sedan får vi se hur långt den räcker, säger han.", "link": "https://www.tv4.se/artikel/1mJeoYzGqoUhJ2NM7sqz4l/takacs-om-efterlaengtade-tiden-med-northug-kaenns-fantastiskt", "date_display": "2026-09-11", "date_iso": "2026-09-11T12:10:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/tv4", "/tv4-play", "/lets-dance", "/let-s-dance"]}, {"id": 2, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "", "title_original": "Misstänkt grov våldtäkt mot barn i Järfälla", "summary_original": "", "link": "https://www.svd.se/a/wA9Gmd/senaste-nytt?pinnedEntry=77283&utm_medium=rss", "date_display": "2026-09-11", "date_iso": "2026-09-11T12:08:18+00:00", "source": "Svenska Dagbladet (S . Lovas välbetalda jobb Även vilseledande jobbannonser på nätet har spelat en avgörande roll för att lura utländska medborgare till Ryssland, enligt vittnesmål i rapporten. Många av de drabbade uppger att de felaktigt lovats civila jobb inom säkerhet, logistik, byggbranschen och IT, med löften om höga löner och snabbare väg till ryskt medborgarskap. I många av fallen fick de aldrig någon ersättning, samtidigt som deras tillhörigheter och ID-handlingar togs ifrån dem. Rörelsefriheten och möjligheterna att avvika begränsades också kraftigt.  En Sydafrikansk man sökte ett jobb som chaufför i Polen och fick instruktioner på WhatsApp att flyga till Moskva för att hämta en lastbil och köra den till Polen. Vid ankomsten till Moskva fick han reda på att han inte skulle till Polen utan att han skulle bli soldat, uppger hans fru för Amnesty. Pedro, en brasiliansk IT-specialist reste till Ryssland för att börja ett välbetalt teknikjobb. Istället hamnade han i armén. När han bad sin befälhavare om frisedel fick han till svar att alternativen i så fall var fängelse eller döden. Allvarliga brott mot internationell rätt Efter bara två veckors utbildning skickades rekryterna ut i strid, något som enligt Amnesty tyder på att brist på militär erfarenhet inte verkar vara något hinder för Rysslands rekrytering av soldater. Landets mål var att snabbt öka det totala antalet soldater vid frontlinjen, utan någon hänsyn till stridsberedskap och med likgiltighet inför människoliv, uppger Amnesty. Mönstren som framträder i rapporten pekar på allvarliga brott mot de skyldigheter som Ryssland har enligt internationell rätt, däribland uppenbar inblandning i människohandel samt underlåtenhet i att kriminalisera och bekämpa människohandel.", "link": "https://www.tv4.se/artikel/1xeEl4fIk8nULUO4DSlFIo/utlaendska-medborgare-luras-till-ryssland-foer-att-strida-vid-frontlinjen", "date_display": "2026-09-11", "date_iso": "2026-09-11T12:04:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", ": "https://www.hd.se/hoganas/gulligaste-valet-i-hoganas-vann-puman-eller-tumlaren/", "date_display": "2026-09-11", "date_iso": "2026-09-11T11:44:11+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 14, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Pappans bror i rätten: Ringde och ringde – men ingen svarade", "summary_original": "Under fredagen fortsatte rättegången om den dödliga båtolyckan som inträffade utanför Tjörn i somras. En fritidsbåt kolliderade med lastfartyget Misje Verde den 28 juli. På fritidsbåten befann sig en familj bestående av en pappa, mamma, son och dotter. Pappan och sonen överlevde olyckan, mamman och dottern dog. I rätten står nu fartygets befälhavare och lots åtalade för vållande till annans död.  Pappan, befälhavaren och lotsen har förhörts. Nu är det dags för pappans bror att vittna. Han och hans familj var med på båtsemestern och befann sig ett par hundra meter bort i en egen båt när olyckan inträffade. Brodern: ”Gick obehagligt nära” Broderns båt hade under dagen för olyckan fått motorproblem och därför beslutade sig bröderna för att hålla ihop, att ligga nära varandra ifall något skulle hända. Efter ett tag gasade brodern dock iväg, då han märkte att båten gick bättre då. – Jag tittade bak och då såg jag den här stora båten som gick obehagligt nära. Och så blev jag först lite orolig, det var otäckt nära, men sen så tänkte jag att min son tycker jag väldigt mycket om stora maskiner och sånt, så jag tänkte att det kan vara roligt för honom att se. Så här nära kommer han förmodligen aldrig komma en så här stor båt igen, säger brodern i rätten. I rätten diskuterades avståndet mellan broderns fritidsbåt och fartyget. Kustbevakningens beräkningar har kommit fram till ett avstånd på 60-70 meter. Åklagaren frågar om det kan stämma. – Det kan säkert göra. Jag tyckte det kändes otäckt nära, men hade jag varit tvungen att gissa så hade jag sagt mindre.  Behövde hjälp – ingen som svarade Lite längre fram fick broderns båt problem igen och det började bolma rök som spred sig in i båten. Han stannade, öppnade kapellet och lyckades släcka branden med en pulversläckare. Sedan bad han sin sambo att ringa brodern och hans fru. – Jag behövde ju hjälp, och jag trodde att de skulle ha kommit ikapp. Men de hade ju inte det. Så då höll hon på att ringa och ringa. Och det var ingen som svarade.  Han berättar att han först blev irriterad, eftersom de kommit överens om att brodern skulle bogsera honom ifall han skulle få haveri. – Så då ringde jag Sjöräddningssällskapet. Då sa de: Vi har redan en pågående utryckning. Så han kopplade ihop mig med JRCC och då fick jag förklara för dem. Jag minns inte om det var då eller innan som jag förstod att den här båten som hade passerat oss hade någonting med det att göra.   – Jag kunde inte föreställa mig att det var det som hade hänt förrän jag inte fick tag på dem på telefon. Det tog nog en halvtimme innan vi larmade, tror jag.", "link": "https://www.tv4.se/artikel/62aeRkPokykXL1K33La7yE/pappans-bror-vittnar", "date_display": "2026-09-11", "date_iso": "2026-09-11T11:40:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/batolyckan-vid-tjorn"]}, {"id": 15, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "", "title_original": "144 kvadratmeter stor villa från 1910 i Vintrie såld", "summary_original": "", "link": "https://www.sydsvenskan.se/fastighetsaffarer/144-kvadratmeter-stor-villa-fran-1910-i-vintrie-sald/", "date_display": "2026-09-11", "date_iso": "2026-09-11T11:37:49+00:00", "source": "Sydsven ge däremot kvalet. Några svenska lagmedaljer blev det inte heller.\n\nEnligt Svenska ridsportförbundets tillförordnade sportchef Göran \"Yogi\" Breisner är bristen på hästar i den absoluta världstoppen en viktig förklaring.\n\n– Precis som i alla sporter så är det bara en väldigt, väldigt liten procent som är absolut världsklass. För tillfället har vi nog inte en häst som är absolut världsklass, säger Breisner.\n\nSamtidigt ser han flera lovande hästar som med rätt träning kan ta steget upp.  Satsar på återväxten  För att få fram fler ryttare och hästar på högsta nivå satsas det nu på att bredda den svenska eliten.\n\nDen nya Mästerskapsstiftelsen ska ge fler ryttare möjlighet att träna och tävla internationellt och utvecklas mot mästerskapsnivå. Bakom satsningen finns bland andra Henrik Ankarcrona, förbundskapten för det svenska hopplandslaget.\n\n– Vi vill få fram nästa generation av ryttare och se till att vi utvecklar de rätta hästarna för att de ska komma in och hålla den här världsklassen, säger Breisner.  Amanda Staam hoppas på medalj  Ett av Sveriges framtidshopp är fälttävlansryttaren Amanda Staam.\n\nVM-debutanten var en del av laget som säkrade OS-platsen i Aachen och hoppas nu kunna ta nästa steg mot världstoppen.\n\nHennes häst Corpoubet AT gjorde ett starkt VM och var felfri på hinder i terrängen. Sverige slutade sjua i lagtävlingen och säkrade därmed OS-platsen till Los Angeles.\n\nAmanda tror att de kan vara med och slåss om medaljerna.\n\n– Han gjorde ett väldigt bra VM, han har gått två EM tidigare så han är väldigt väl befäst på den nivån nu och är en fantastisk terränghäst. Jag tror att det ser väldigt bra ut.\n\nSenast Sverige tog en OS-medalj i ridsport var i Tokyo 2021. Nu hoppas svensk ridsport kunna bygga för en ny medaljgeneration till Los Angeles.", "link": "https://www.tv4.se/artikel/3ArLtLEQthKcM1KAwnOHZ9/varningen-efter-vm-sverige-saknar-haestar-i-vaerldsklass", "date_display": "2026-09-11", "date_iso": "2026-09-11T09:40:07+00:00", "sou  sändebuden Steve Witkoff och Jared Kushners besök i huvudstaden förra veckan, rapporterar Kyiv Independent.  Under torsdagen ska drönare ha slagit ner på ytterligare platser i Kiev, bland annat vid en bensinstation i Holosiivskyj-distriktet och på ett fyravånings affärscenter i Solominskyi-distriktet.  Även andra delar av Ukraina har utsatts för attacker.  I staden Pavlohrad i Dnipropetrovsk-regionen i östra Ukraina har fem personer dödats och över 70 skadats i en rysk attack mot ett köpcentrum. Åtta av de skadade är barn, enligt myndigheterna. Natten till torsdag dog även två personer efter att en drönare slog ner i ett köpcentrum i i Sumy i nordöstra Ukraina.", "link": "https://www.tv4.se/artikel/3qhnsdnw6FLT3V8CSXgYov/svenske-niklas-mitt-i-ryska-droenarattacken-kom-allt-naermare", "date_display": "2026-09-10", "date_iso": "2026-09-10T20:57:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/kiev"]}, {"id": 146, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "”Vanligt att män säger så till bestämda kvinnor”", "summary_original": "Anderssons mothugg efter Åkessons pik • Får medhåll av Lind: ”Anstår inte”", "link": "https://www.tv4.se/artikel/1f160QATrwszMQqX9toAWr/ganska-vanligt-att-maen-saeger-sa-till-kvinnor-som-aer-bestaemda", "date_display": "2026-09-10", "date_iso": "2026-09-10T20:37:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 147, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "”Varför är du så sur hela tiden?”", "summary_original": "Storbråket om jobben • Åkesson till Andersson: Borde vara tacksam", "link": "https://www.tv4.se/artikel/3dPgFhV22Gke7FCZI4VmFT/varfoer-aer-du-sa-sur-hela-tiden", "date_display": "2026-09-10", "date_iso": "2026-09-10T19:51:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 148, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Trump vet exakt vad som står på spel", "summary_original": "Trump vet att plånboksfrågorna avgör. Både mat och bensin har blivit dyrare för amerikanerna. Matkassen för en genomsnittlig tvåbarnsfamilj kostar idag cirka 5 procent mer än vid presidentvalet för två år sedan. Bensinpriset har stigit betydligt mer, i synnerhet sedan kriget i Iran inleddes för drygt ett halvår sedan.  Trots Trumps försök att spela ner problemet är han innerst inne medveten om missnöjet över en politik som inte märkts av i folks vardagsekonomi. Att inflationen är lägre än under president Bidens krisår ger föga tröst. Eftersom det enligt amerikansk lag är förbjudet att köpa röster kan lagligheten i att utlova 5 000 dollar per vuxen amerikan starkt ifrågasättas. Motargumentet är att det handlar om ett klassiskt vallöfte – en politisk idé – vilket gör det lagligt. Ska tas från tullintäkter Lika oklart är det hur finansieringen av de totalt omkring en biljon dollar som krävs faktiskt ska gå till. Vicepresident JD Vance uttalade i Fox News att pengarna ska tas från tullintäkter, men utan att gå in på några kalkyler. Det är inte första gången Trump utlovar pengar som amerikanerna sedan aldrig ser röken av. Ett exempel är besparingarna inom DOGE – organet som skulle effektivisera myndigheter och skära ner på byråkratin. Trots bilden Trump målade upp av hur yxan skulle gå varm bland Washingtons byråkratiska kolosser ledde det knappast till mer pengar för vanliga hushåll. Spelar ingen roll för Trump I slutändan är det troligen få amerikaner, oavsett partisympati, som faktiskt räknar med någon påfyllning i hushållskassan. Men det spelar ingen roll för Trump. I Dallas har Trump gjort som han brukar. Han kastar in en brandfackla och lyckas flytta fokus från sina egna svagheter. Republikanerna ligger illa till i mellanårsvalen till både representanthuset och senaten, samtidigt som förtroendet för presidenten nått bottennoteringen 30 procent. Men precis som den här analysen visar hamnar det faktumet sist i texten. Trump vill att vi ska tänka på annat – som vad man kan göra för 5 000 dollar.", "link": "https://www.tv4.se/artikel/3KPn8grnivCxsD0cgvVn60/trump-vet-exakt-vad-som-star-pa-spel", "date_display": "2026-09-10", "date_iso": "2026-09-10T18:37:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/donald-trump"]}, {"id": 149, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Oljepris skenar – högsta sedan maj", "summary_original": "Efter de senaste upptrappningarna i kriget mellan USA och Iran har oljepriset nu nått 105 dollar per fat, en prisnivå vi inte sett sedan maj i år. Råvaruexperten Christian Kopfer menar att det finns flera anledningar till att oljan nu blivit så pass dyr.  Den främsta anledningen är att Kina börjat köpa olja eftersom deras reserver börjar ta slut, vilket ökar den övriga efterfrågan, menar han. Priset per fat kan komma att nå 150 dollar i början av nästa år, erfarar han. – Kina är världens största nettoimportör av råolja. Så när de kommer tillbaka och ökar på med en miljon fat per dag, då märks det väldigt, väldigt fort på marknaden, säger Kopfer. Ketchupeffekt 100-dollargränsen har en psykologisk effekt som i sig kan driva på marknadspriset ytterligare. Prisökningen visar att bristen på olja är fortsatt allvarlig, vilket kan driva på efterfrågan.  Därför kan priset komma att skena iväg, menar han. – Bryter det igenom en sån gräns så blir det lite propp-lösande effekt. Det är som en ketchupflaska – du har skakat den ett tag, sedan kommer det att släppa loss, säger han. För konsumenter innebär det fortsatt ökande prisnivåer. –Det drar upp priserna ännu mer på olja för omedelbar leverans och sen så får ju det i princip omedelbara effekter på drivmedelspriserna, säger Kopfer. När de tillfälliga sänkningarna på energi-och koldioxidskatterna upphör, första oktober respektive första december, kan konsumenter vänta sig kraftigt ökade priser på drivmedel, utöver ökade oljepriser.  Tvingar fram omställning Det enda positiva i den här oljekrisen är att det kommer få världen att tänka annorlunda, menar Kopfer.  Omställningen är oundviklig. – Det här kommer verkligen att driva på accelerationen till omställning, bort från fossila bränslen i allmänhet och Mellanösternberoendet i synnerhet, säger han och fortsätter: – Världen konsumerar mer än vad som produceras och det är helt ohållbart givetvis. Lösningen ligger i de större frågorna, menar Kopfer. Eldrift är den enda vägen framåt, fortsätter han. – Jag tror det här verkligen är en ögonöppnare för hela världen.", "link": "https://www.tv4.se/artikel/7LRCwVTLvY1KgVmcHNaUwv/oljepriset-skenar-hoegsta-sedan-maj", "date_display": "2026-09-10", "date_iso": "2026-09-10T17:43:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/oljepriser", "/kina", "/mellanostern", "/utrikes"]}, {"id": 150, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Svarar på anklagelserna från Busch: ”Lite upphettad stämning”", "summary_original": "Kristersson och Åkesson kommenterar: ”Fint samarbete” • Busch replikerar igen", "link": "https://www.tv4.se/artikel/24Aa963fNl2ImAVGLg10Ht/svarar-pa-anklagelserna-fran-busch-lite-upphettad-staemning", "date_display": "2026-09-10", "date_iso": "2026-09-10T17:03:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 151, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Klimatförändringar ritar om turistkartan – Sverige gynnas stort", "summary_original": "Sundsvall sticker ut i statistiken, med en 20-procentig ökning av internationella turister i juli jämfört med året innan, inte minst för aktiviteter som höghöjdsbana. Enligt Robert Pettersson är det framför allt just naturupplevelser och utomhusaktiviteter som lockar fler besökare.  Han ser en tydlig trend där fler väljer äventyrsaktiviteter och att göra saker tillsammans, något som blivit allt viktigare för dagens turister. Extremväder påverkar resmönster De senaste somrarna har extremvärme och skogsbränder i södra Europa fått fler att söka sig norrut. Fenomenet coolcation, att resa till svalare platser, har blivit ett känt begrepp. – Fler har valt att undvika extremväder. Värme och skogsbränder kan följa i kölvattnet av de heta temperaturerna, säger Robert Pettersson. Trots detta fortsätter många svenskar att resa till varmare länder, särskilt Spanien. – År efter år är Spanien det mest besökta landet som svenskar åker till. Sol och värme har satt sig som något som svenskar väljer att resa till. Det kommer förmodligen inte att förändras över en natt, utan det är en fortsatt populär resanledning, säger Pettersson. Förändringar sker långsamt Även om klimatförändringarna påverkar turistströmmarna sker förändringarna gradvis, enligt Robert Pettersson. Han tror inte att svenskarna plötsligt slutar resa söderut, men att fler kan välja att resa under andra tider på året eller till nya destinationer. – Man kanske väljer att undvika den varmaste perioden på året. Vi kanske ser fler som reser i maj eller i september, eller kanske väljer sol- och badresmål någon annanstans än just de varmaste områdena runt Medelhavet. ”Konkurrensfördel för Sverige” Om fler väljer att semestra i Sverige eller norra Europa kan det få positiva effekter för svensk ekonomi. – Om det blir en förskjutning mot norra Europa eller för all del mer från sol och bad, då är Sverige en konkurrensfördel gentemot traditionella resmål, säger Robert Pettersson.", "link": "https://www.tv4.se/artikel/44IoUlHN7nJ0h6J4jvUwvc/klimatfoeraendringar-ritar-om-turistkartan-sverige-gynnas-stort", "date_display": "2026-09-10", "date_iso": "2026-09-10T16:57:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/turism", "/spanien", "/semester"]}, {"id": 152, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Listkuppen: ”Vänsterpartister som har hyllat terror”", "summary_original": "Partiledarna anländer inför debatten • Utspel redan på röda mattan", "link": "https://www.tv4.se/artikel/14roIuehuTbSIctbNcIqja/skyltkupp-pa-roeda-mattan-symbol-foer-deras-totala-misslyckande", "date_display": "2026-09-10", "date_iso": "2026-09-10T16:04:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Valet 2026", "/valet-2026"]}, {"id": 153, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "", "title_original": "Missade du debatten? Läs ikapp här", "summary_original": "", "link": "https://www.tv4.se/artikel/pTwRKQQ6Ysl68eWwAXAE4/partiledardebatten-i-tv4", "date_display": "2026-09-10", "date_iso": "2026-09-10T15:19:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Valet 2026", "/valet-2026"]}, {"id": 154, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Man misstänks ha knivmördat sin pappa – häktas", "summary_original": "Polisen larmades klockan 04.47 i måndags om en skadad man i 60-årsåldern i en lägenhet i Västerås. När patrullerna och ambulanspersonal anlände till bostaden konstaterades att mannen var död. Enligt uppgifter till TV4 Nyheterna ska han ha knivhuggits. På platsen fanns ytterligare en man, i 25-årsåldern, som greps misstänkt för mord, enligt polisen. – Det vi kan säga är att vi ser det här som en isolerad händelse. Både misstänkt och den avlidne är personer som känner varann sedan tidigare. Så vi misstänker ingen koppling till någon kriminell miljö, sa Magnus Jansson Klarin, presstalesperson på polisen, efter insatsen. Misstänks ha mördat sin pappa Enligt uppgifter till TV4 Nyheterna är den mordmisstänkte mannen son till offret och sedan tidigare dömd för flera brott. På torsdagseftermiddagen häktades han. – Vid förhandlingen medgav den misstänkte att det föreligger sannolika skäl för mord och Västmanlands tingsrätt häktade mannen för det, säger kammaråklagare Ewa Henriksson, som leder förundersökningen, utan att vilja bekräfta att offret är pappa till den häktade. Åklagaren uppger att man ännu inte vet exakt när mordet skett. – I nuläget vet vi inte tidpunkten för mordet utan vi misstänker att det varit någon gång mellan den 7 och 8 september. Polis kom till platsen tidigt på morgonen den 8 september efter att ha fått in ett larmsamtal, men närmare information om det kan jag inte lämna, säger Ewa Henriksson.  Hur jobbar ni vidare i utredningen nu? – Det är en brottsplatsundersökning som påbörjats och den ska färdigställas. Det kommer att genomföras obduktion och det kommer behövas hållas ytterligare förhör, både med misstänkt och även andra personer. Den häktades advokat vill inte kommentera ärendet.", "link": "https://www.tv4.se/artikel/4mIRLxPbqGa0OkHb4ZlESH/man-misstaenks-ha-knivmoerdat-sin-pappa-haektas", "date_display": "2026-09-10", "date_iso": "2026-09-10T14:14:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/vasteras", "/mord", "/brott"]}, {"id": 155, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Shekarabi och Forssmed i kyrkan: ”Vi råkar faktiskt gilla varandra”", "summary_original": "Kan toppolitikerna från S och KD även tänka sig att sitta i samma regering?", "link": "https://www.dagen.se/nyheter/shekarabi-och-forssmed-i-kyrkan-vi-rakar-faktiskt-gilla-varandra/10523310", "date_display": "2026-09-10", "date_iso": "2026-09-10T13:45:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 156, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Rekordmånga polacker lämnar Sverige: ”Känner oss mer hemma här”", "summary_original": "På flera sätt är Chwarzno-Wiczlino ganska likt Sverige. Nybyggda flerfamiljshus, många i nordisk stil och i trä, tornar upp sig kring en skogsäng och stora öppna fält. – Det är lite som Skåne, säger 11-årige Marceli Jarosz. Och han borde veta. I ett och ett halvt år bodde han med sin pappa Wojciech och sin mamma Małgorzata i Perstorp i Skåne. Wojciech jobbade som snickare och målare, och Małgorzata lärde sig svenska och öppnade en frisörsalong. Långt ifrån ensamma Men förra året bestämde sig familjen för att flytta hem till Polen. Det blev Chwarzno-Wiczlino, en liten stad utanför Gdansk vid Östersjön. De var långt ifrån ensamma. För första gången på flera årtionden minskade antalet människor födda i Polen i Sverige, enligt Statistiska centralbyrån. För 26 år sedan bodde det 40 000 polacker i Sverige. År 2024 nåddes en toppnotering på över 100 000. Men 2025 kom trendbrottet: då bodde drygt 98 000 polacker i Sverige. Trenden fortsätter i år, med nästan dubbelt så många polacker som flyttar från Sverige som till Sverige. Stark gemenskap och ekonomi För Wojciech och Marceli var det sociala en av de stora anledningarna till att de ville flytta hem. Marceli fick inga kompisar i skolan, \"kanske för att jag inte var svensk\", säger han. Och Wojciech hade svårt att förstå varför nästan ingen av grannarna i huset de bodde i hälsade i trappen. En annan anledning var att inkomstskillnaderna inte längre var så stora – inte när man räknade in boendekostnaderna i Sverige. Polens ekonomi har vuxit kraftigt under flera år. Förra året ökade bruttonationalprodukten med 3,6 procent, mer än dubbelt så mycket som tillväxten i Sverige. Färre kommer hit Wojciech tror inte att polacker som har bott länge i Sverige kommer att flytta hem. Men färre polacker kommer att komma hit, gissar han. Och av dem som bara har bott i Sverige i några år kommer många att flytta tillbaka i takt med att möjligheterna i Polen växer. Om han har rätt kommer trenden att fortsätta. Då får Sverige klara sig med färre polska arbetare än vad landet har vant sig vid.", "link": "https://www.tv4.se/artikel/5IP3S96qquqr4q7XlCzqKe/rekordmanga-polacker-laemnar-sverige-kaenner-oss-mer-hemma-haer", "date_display": "2026-09-10", "date_iso": "2026-09-10T13:21:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/polen", "/invandring"]}, {"id": 157, "title": "France and Sweden to develop a roadmap for enhanced bilateral space cooperation", "summary": "On the occasion of the International Space Summit held in Paris, France and Sweden have agreed to develop a roadmap that will provide a political framework for enhanced bilateral space cooperation.", "title_original": "France and Sweden to develop a roadmap for enhanced bilateral space cooperation", "summary_original": "On the occasion of the International Space Summit held in Paris, France and Sweden have agreed to develop a roadmap that will provide a political framework for enhanced bilateral space cooperation.", "link": "https://www.government.se/press-releases/2026/09/france-and-sweden-to-develop-a-roadmap-for-enhanced-bilateral-space-cooperation/", "date_display": "2026-09-10", "date_iso": "2026-09-10T12:00:18+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry of Defence", "Ministry of Education and Research", "Higher education, research and space.", "Foreign and security policy", "Lotta Edholm", "Pål Jonson"]}, {"id": 158, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Efter ”tröjkuppen” i SVT – Mauri och Marcus gör nytt tv-program", "summary_original": "I den nya programserien, med arbetsnamnet ”Mauri och Marcus räddar Sverige”, ska programledaren Mauri Hermundsson och komikern Marcus Berggren ta sig an olika samhällsproblem – en människa i taget. Ett av uppdragen är att få fler att folkbokföra sig i Ljusnarsbergs kommun som har den största befolkningsminskningen i Sverige. ”När vi åker härifrån ska fler bo i Ljusnarsberg” Under torsdagen håller duon en presskonferens i Kopparberg för att berätta om satsningen och uppmana fler att flytta till kommunen. – Vi ska få folk att flytta hit. När vi åker härifrån ska fler bo i Ljusnarsberg, säger Åsa Johansson, projektledare på Mauri Hermundssons produktionsbolag Mustig produktion till TV4 Nyheterna. Satsningen inleddes redan under finalen av ”Allsång på Skansen” då Hermundsson och Berggren plötsligt dök upp på vipläktaren i tröjor med uppmaningen att flytta till Ljusnarsberg. Efteråt intervjuades kommunstyrelsens ordförande Natalie Hart (S) av SVT. För henne kom inslaget som en glad överraskning. – Jag visste inte om det, men det är välkommet, sa hon till kanalen. Så blir de andra avsnitten Efter presskonferensen drar arbetet med att locka fler till kommunen i gång på riktigt. Bland annat ska duon besöka en niobarnsfamilj i Örebro. – Vi har hört rykten om att de vill flytta och behöver något större. Så dem ska vi åka in och träffa i dag och övertala. Kanske i alla fall få dem att komma hit och ta en titt, säger Åsa Johansson. Mauri och Marcus räddar Sverige planeras ha premiär våren 2027 på TV4 och TV4 Play, men tidsplanen kan ändras.\n\n– I de andra programmen kommer vi att fokusera på en person. Vi kan inte hjälpa alla, men vi kan hjälpa en. Det är undertexten till hela den här programserien, säger Åsa Johansson.", "link": "https://www.tv4.se/artikel/6tGlFOJPBmLhtg3nGtT8uK/efter-troejkuppen-i-svt-mauri-och-marcus-goer-nytt-tv-program", "date_display": "2026-09-10", "date_iso": "2026-09-10T11:52:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/tv4", "/tv4-play", "/personer/mauri-hermundsson"]}, {"id": 159, "title": "Sweden and the Netherlands agree on GlobalEye deal", "summary": "Sweden and the Netherlands have signed a Letter of Intent on long-term cooperation regarding airborne warning and control capabilities through the GlobalEye system. The Netherlands intends to acquire one GlobalEye system.", "title_original": "Sweden and the Netherlands agree on GlobalEye deal", "summary_original": "Sweden and the Netherlands have signed a Letter of Intent on long-term cooperation regarding airborne warning and control capabilities through the GlobalEye system. The Netherlands intends to acquire one GlobalEye system.", "link": "https://www.government.se/press-releases/2026/09/sweden-and-the-netherlands-agree-on-globaleye-deal/", "date_display": "2026-09-10", "date_iso": "2026-09-10T11:30:42+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry of Defence", "NATO", "Pål Jonson", "Military defence", "International defence cooperation", "Total defence"]}, {"id": 160, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Josefin Lilja:\nCarolas 60-årsfest mer ekumenisk än en kristen konferens.", "summary_original": "Artisten lyckas som få andra samla människor med totalt olika livsåskådningar", "link": "https://www.dagen.se/kultur/josefin-lilja-carolas-60-arsfest-mer-ekumenisk-aen-en-kristen-konferens/10521358", "date_display": "2026-09-10", "date_iso": "2026-09-10T10:20:31+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Forskarens varning: AI kan döda oss alla inom tio år", "summary_original": "Coxon lämnade sin tjänst vid Anthropic tidigare i veckan, efter att ha tillbringat de senaste tre åren med att träna AI-modeller i forskningssyfte på både Anthropic och konkurrenten OpenAI. På X varnar han nu för en farlig utveckling: ”Inget av bolagen agerar ansvarsfullt. De skenar rakt mot självförbättrande superintelligens och leker med våra liv”, skriver han och fortsätter: ”Underskatta inte kraften i den här tekniken (...) De som bygger AI tror på fullt allvar att det skulle kunna döda oss alla innan decenniets slut.” Anthropic-forskaren: Vi tror att AI kan döda oss Företrädare för företagen, forskare och chefer, som utåt sett tonar ner sina formuleringar för att framstå som förnuftiga, uttrycker samtidigt oro bakom stängda dörrar, enligt Jacob Coxon. ”På Anthropic är man väl införstådda om insatserna, men är låsta vid en kapplöpning om att komma först – de tror att ingen annan kommer att agera ansvarsfullt, så de måste göra det själva, trots risken”, skriver Coxon. Han får medhåll av Evan Hubinger, säkerhetsforskare på Anthropic. ”Vi tror verkligen på fullt allvar att AI skulle kunna döda alla människor”, skriver han på X och uppger att hans personliga bedömningen är att risken att det sker inom det närmaste årtiondet är över tio procent. Flera incidenter Med nuvarande AI-modeller är risken låg menar han, samtidigt uppger Hubinger att utvecklingen accelererar snabbare och snabbare när systemen kan förbättra sig själva utan mänsklig input, genom så kallad ”rekursiv självförbättring”. Han menar att företaget ännu inte har någon plan för att säkerställa att ett AI-system som överträffar mänsklig förmåga skulle lyda sina skapare. Den senaste tiden har det inträffat flera incidenter där AI-agenter lyckats fly från sina testmiljöer, rapporterar Wall Street Journal. En svärm av avancerade AI-agenter inuti OpenAI hackade sig in i AI-plattformen Hugging Face, tog kontroll över datorservrar och försökte sedan sopa igen spåren efter sig. Vid ett annat tillfälle rymde AI-agenter från Anthropic från ett brittiskt regeringstest och försökte lura en riktig människa att godkänna skadlig datorkod, skriver WSJ. ”Två tankar i huvudet samtidigt”  Paulina Modlitba är AI-expert och föreläsare. Hon tonar ner AI-forskarnas varning. – Det här är verkligen en fråga man behöver behöver tänka både-och kring, två tankar i huvudet samtidigt. AI håller på att bli väldigt kraftfull. Det här är någonting som man ska ta på allvar, men samtidigt ska man men också tänka på vilka det är som faktiskt pratar om AI på det här sättet, säger hon och fortsätter: – Det är nästan uteslutande alltid människor som jobbar på de här AI-bolagen och som i nån mån tjänar pengar på den här branschen. Det gäller även Jacob, även om han sa upp sig, men han fick gehör från folk som fortfarande jobbar på Anthropic.  Hon tror däremot inte att det rör sig om ett pr-trick.  – Det är att dra det för långt åt andra hållet.  Hon pekar på det faktum att Jacob Coxon uppger att dagens AI-modeller inte har kapaciteten att kunna förgöra mänskligheten. – Det är en risk som man ser skulle kunna komma att utvecklas. Men det finns många forskare som inte håller med om den bilden, som inte ser tecken på att AI skulle kunna bli superintelligent, säger Paulina Modlitba. Det finns dock en aspekt som hon finner oroväckande. – Han (Jacob Coxon) pratar om varför de olika AI-bolagen fortsätter med det här kycklingracet. De verkar alla vilja stoppa det, men ingen gör det. Anthropic är medvetna om det, men de kutar på i racet ändå, säger Paulina Modlitba och tillägger: – Det tycker jag är oroväckande. Frågan är varför gör de det? Här skulle jag vilja se att vi inte bara på EU-nivå, som sker nu, utan att vi även på global nivå börjar prata om säkerhetsfrågor kopplat till det här.", "link": "https://www.tv4.se/artikel/18ENnhDkcL0zzbz138Vo59/forskarens-varning-ai-kan-doeda-oss-alla-inom-tio-ar", "date_display": "2026-09-10", "date_iso": "2026-09-10T08:36:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/ekonomi", "/ai", "/forskare", "/usa"]}, {"id": 162, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Skolinspektionen får kritik för fråga om församlingstillhörighet", "summary_original": "Ledningen för konfessionell skola ombads berätta vilken församling de tillhör.", "link": "https://www.dagen.se/nyheter/skolinspektionen-far-kritik-foer-fraga-om-foersamlingstillhoerighet/10516276", "date_display": "2026-09-10", "date_iso": "2026-09-10T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Jag tror på Gud – inte på Bibeln", "summary_original": "Jag vill fortsatt hävda att våra bibelöversättningar är föränderliga. Olika översättningar har sina ideal och principer, skriver Hillevi Uddenfeldt i en replik.", "link": "https://www.dagen.se/debatt/jag-tror-pa-gud-inte-pa-bibeln/10513585", "date_display": "2026-09-10", "date_iso": "2026-09-10T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 164, "title": "Error 500 (Server   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
