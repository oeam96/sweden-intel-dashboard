JmPMB8f0r/ai-bilder-sprids-pa-cancersjuka-linn-foer-jaevligt", "date_display": "2026-08-14", "date_iso": "2026-08-14T14:52:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/cancer", "/barncancer", "/meta", "/facebook", "/kallafakta/bluffannonserpafacebook", "/ai"]}, {"id": 136, "title": "44-year-old man died when the battery in the church's defibrillator was discharged", "summary": "The widow: I got very angry and frustrated.", "title_original": "44-årig man dog när batteriet i kyrkans hjärtstartare var urladdat", "summary_original": "Änkan: Jag blev jättearg och frustrerad.", "link": "https://www.dagen.se/nyheter/44-arig-man-dog-naer-batteriet-i-kyrkans-hjaertstartare-var-urladdat/10480665", "date_display": "2026-08-14", "date_iso": "2026-08-14T13:23:14+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Neonatal closed - newborn had to move between three hospitals", "summary": "On July 26, Cecilia Byström and Felix Söderholm's son was born by caesarean section at Östersund Hospital. The boy needed respiratory support and neonatal care, but because the neonatal unit was closed, he was flown to Umeå.\nCecilia remained in Östersund. - The feeling that they're taking someone I've carried for nine months and taking him away from me, and I don't get to know anything. It was terrible, says Cecilia Byström. Two days later, she was able to reunite with her son in Umeå. But then his condition worsened and the family was flown on to Karolinska University Hospital in Stockholm. There, the boy was operated on for a hole in the intestine. First time as parents - far from home The first weeks as parents have therefore largely been spent in hospital far from home and the usual support of family and friends. - It has been very tough. No sleep, nothing. And when you've been blown away like this, you have no one you know, no close ones, no one who can help you. It has been very difficult, says Cecilia. When the neonatal ward in Östersund recently reopened, the plan was for the family to be flown back. But just before they were to be picked up, a new message arrived: the hospital could not accept them due to a lack of staff. The region: \"No good solution\" The neonatal ward in Östersund was closed for two weeks during the summer. According to the region, there was a lack of nurses to staff both the children's ward and the neonatal ward. - We don't think this was a good solution, to close. It is not something we have chosen, but we have worked incredibly hard to try to stay open as much as possible, says Anna-Lena Fureman, medical manager at the children's clinic at Östersund Hospital. The region regrets that families have been affected. At the same time, it cannot be ruled out that the same decision may have to be made again if there are not enough personnel. - But our hope now is that we will succeed in recruiting and retaining staff so that we will not end up in this situation again, say", "title_original": "Neonatalen stängd – nyfödd fick flytta mellan tre sjukhus", "summary_original": "Den 26 juli föddes Cecilia Byström och Felix Söderholms son med kejsarsnitt på Östersunds sjukhus. Pojken behövde andningsstöd och neonatalvård, men eftersom neonatalavdelningen var stängd flögs han till Umeå.\nCecilia blev kvar i Östersund. – Känslan av att de tar någon som jag har burit i nio månader och tar honom ifrån mig, och jag får inte veta någonting. Det var hemskt, säger Cecilia Byström. Två dagar senare kunde hon återförenas med sin son i Umeå. Men då försämrades hans tillstånd och familjen flögs vidare till Karolinska universitetssjukhuset i Stockholm. Där opererades pojken för ett hål på tarmen. Första tiden som föräldrar – långt hemifrån De första veckorna som föräldrar har därför till stor del tillbringats på sjukhus långt från hemmet och det vanliga stödet från familj och vänner. – Det har varit jättetufft. Ingen sömn, ingenting. Och när man har blivit flugen så här har man ju inga man känner, inga nära, inga som kan hjälpa en. Det har varit väldigt jobbigt, säger Cecilia. När neonatalavdelningen i Östersund nyligen öppnade igen var planen att familjen skulle flygas tillbaka. Men strax innan de skulle hämtas kom ett nytt besked: sjukhuset kunde inte ta emot dem på grund av personalbrist. Regionen: ”Ingen bra lösning” Neonatalavdelningen i Östersund hölls stängd i två veckor under sommaren. Enligt regionen saknades det sjuksköterskor för att kunna bemanna både barnavdelningen och neonatalavdelningen. – Vi tycker inte att det här var en bra lösning, att stänga. Det är inget vi har valt, utan vi har jobbat otroligt hårt för att försöka hålla öppet så mycket som möjligt, säger Anna-Lena Fureman, medicinskt ansvarig vid barnkliniken på Östersunds sjukhus. Regionen beklagar att familjer har drabbats. Samtidigt går det inte att utesluta att samma beslut kan behöva fattas igen om det inte finns tillräckligt med personal. – Men vår förhoppning är nu att vi ska lyckas rekrytera och behålla personal så att vi inte kommer att hamna i den här situationen igen, säger Fureman. ”Riktigt konstigt och riktigt dåligt” För Cecilia är beskedet svårt att förstå. Hon hoppas att situationen kan undvikas för andra familjer framöver. – Jag tycker att det är riktigt konstigt och riktigt dåligt att just en sådan avdelning ska stängas. Man måste kanske planera bättre till nästa gång, så att det inte är någon annan som råkar ut för samma sak, säger Cecilia Byström.", "link": "https://www.tv4.se/artikel/4vtanUz7YrobNsFKtZq0pE/neonatalen-staengd-nyfoedd-fick-flytta-mellan-tre-sjukhus", "date_display": "2026-08-14", "date_iso": "2026-08-14T12:34:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ostersund", "/neonatalvard", "/umea", "/sjukvard"]}, {"id": 138, "title": "Here, 16-year-old Betty gets stuck in the world star's hair: \"Råpanik\"", "summary": "Before Zara Larsson's concerts, many fans hope to be invited on stage to dance to \"Lush life\". On Way out west, it became reality for 16-year-old Betty Eidenskog. - To stand there in front of an entire audience, with my parents at the back and my friends in the audience. It was sick to see that view. It's probably something you don't get to experience again, she says in Nyhetsmorgon. On stage, Betty took every opportunity to tell the world star how much she loves her. - I passed all the steps, but I was afraid that I would have a complete blackout. But I didn't get that, so it went well. \"Nightmare scenario\" But even before the dance had started, things were going really wrong. Betty wore, in addition to her pink cowboy hat - which caught Zara Larsson's interest - a ring with a star. Suddenly it got stuck in the performer's hair. - Just me: this is the nightmare scenario. Right before the dance, like. Kind of like this, but God, what am I going to do? The clip from the gig shows how Betty grabs Zara Larsson's hair and starts pulling. - It doesn't look that strong on the video, and I've been able to see that in retrospect. But I pull so hard that the hair snaps, almost to the point that the hair falls off. And then it let go and I could dance. At the same time, Zara Larsson missed the tone she was supposed to take. - There was a little laugh. Lost her hair in Norway When Zara Larsson performed in Norway in June, one of her hair extensions came off when she threw her head. Betty was afraid that something similar would happen on Way out west. - I just thought: What if a whole piece of hair flies off and hangs on my ring during the dance. - It was panic. Really screaming panic for a few seconds.", "title_original": "Här fastnar 16-åriga Betty i världsstjärnans hår: ”Råpanik”", "summary_original": "Inför Zara Larssons spelningar hoppas många fans på att få bli uppbjudna på scen för att dansa till ”Lush life”. På Way out west blev det verklighet för 16-åriga Betty Eidenskog. – Att stå där framför ett helt publikhav, med mina föräldrar längst bak och mina kompisar i publiken. Det var sjukt att se den vyn. Det är nog inget man får uppleva igen, säger hon i Nyhetsmorgon. På scen tog Betty varje tillfälle i akt att berätta för världsstjärnan hur mycket hon älskar henne. – Jag klarade alla stegen, men jag var rädd att jag skulle få full blackout. Men det fick jag ju inte, så det gick bra. ”Mardrömsscenariot” Men redan innan dansen hade dragit igång höll det på att gå riktigt fel. Betty bar, utöver sin rosa cowboyhatt – som fångade Zara Larssons intresse – en ring med en stjärna. Plötsligt fastnade den i artistens hår. – Jag bara: det här är ju mardrömsscenariot. Precis innan dansen, liksom. Lite så här, men gud, vad ska jag göra? På klippet från spelningen syns hur Betty tar tag i Zara Larssons hår och börjar dra. – Det ser inte så kraftigt ut på videon, och det har jag fått se i efterhand. Men jag drar så hårt att det knakar i håret, nästan så håret går av. Och då släppte det och jag kunde dansa. Zara Larsson missade samtidigt tonen hon skulle ta. – Det blev ett litet skratt. Tappade håret i Norge  När Zara Larsson uppträdde i Norge i juni lossnade en av hennes hårförlängningar när hon kastade med huvudet. Betty var rädd att något liknande skulle hända på Way out west. – Jag tänkte bara: Tänk om en hel hårbit flyger av och hänger kvar på min ring under dansen. – Det var panik. Verkligen råpanik i några sekunder.", "link": "https://www.tv4.se/artikel/3nHQDceAffPUj1mmAlKweR/16-ariga-betty-fastnade-i-vaerldsstjaernans-har-rapanik", "date_display": "2026-08-14", "date_iso": "2026-08-14T11:36:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/musik", "/way-out-west", "/personer/zara-larsson"]}, {"id": 139, "title": "Kidnapped missionary released after nine months", "summary": "An American missionary kidnapped in Niger has been released after nine months in captivity.", "title_original": "Kidnappad missionär frisläppt efter nio månader", "summary_original": "En amerikansk missionär som kidnappats i Niger har släppts efter nio månader i fångenskap.", "link": "https://www.dagen.se/nyheter/kidnappad-missionaer-frislaeppt-efter-nio-manader/10480710", "date_display": "2026-08-14", "date_iso": "2026-08-14T11:26:36+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Joint Statement from the International Contact Group for the Great Lakes region (ICG)", "summary": "The United States, Belgium, Canada, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, and the United Kingdom, as members of the International Contact Group (ICG) for the Great Lakes region, chaired by France, issue the following statement regarding the disarmament, demobilization, and cantonment protocol signed between the Congolese authorities and the Democratic Forces for the Liberation of Rwanda-FOCA (FDLR).", "title_original": "Joint Statement from the International Contact Group for the Great Lakes region (ICG)", "summary_original": "The United States, Belgium, Canada, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, and the United Kingdom, as members of the International Contact Group (ICG) for the Great Lakes region, chaired by France, issue the following statement regarding the disarmament, demobilization, and cantonment protocol signed between the Congolese authorities and the Democratic Forces for the Liberation of Rwanda-FOCA (FDLR).", "link": "https://www.government.se/statements/2026/08/joint-statement-from-the-international-contact-group-for-the-great-lakes-region-icg/", "date_display": "2026-08-14", "date_iso": "2026-08-14T11:20:38+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement"]}, {"id": 141, "title": "C about homophobia within SFI - requires basic values ​​education", "summary": "The center party demands that the teaching plan for Swedish for immigrants, SFI, be changed after a new survey on values ​​among migrants. The background is a new study from the World Values ​​Survey and the Institute for Future Studies. According to the survey, 48 percent of the SFI participants who responded state that they consider homosexuality unacceptable. At the same time, the result is uncertain, as fewer than four out of ten respondents answered. Wants to introduce basic values ​​education The Center Party's integration policy spokesperson, Niels Paarup-Petersen, now wants education about democracy, equality and everyone's equal value to become a separate element in SFI. - It is unacceptable that as much as half of the participants in SFI stand for homophobic values. The Center Party demands that SFI includes clear value-based teaching about the foundations of Swedish society as a separate course element. It is clear that today's general writings are not enough. The same as in primary school He believes that teaching needs to include the same basic questions that Swedish students encounter in school. - The same things we teach, questions about democracy, equality and everyone's equal value. It is not only in SFI that we have these problems. If you don't go to Swedish elementary school, you haven't received that education. Our democratic values ​​must permeate society. All people have the same rights. According to Paarup-Petersen, it is also about clarifying which values ​​apply in Sweden. - It is terrible and problematic. In many countries of the world there is homophobia. The most important thing for us is that everyone should understand that in Sweden it is a fundamental value that everyone has the same value. People have to understand that when they come here. The Sweden Democrats share the view that the results are worrying, but instead emphasize the need for a strict migration policy. \"Anyone who doesn't like our values ​​shouldn't live here. It's that simple. The report clearly shows why we need four more years. Sweden", "title_original": "C om homofobin inom SFI – kräver värdegrundsundervisning", "summary_original": "Centerpartiet kräver att undervisningsplanen för svenska för invandrare, SFI, ändras efter en ny undersökning om värderingar bland migranter. Bakgrunden är en ny studie från World Values Survey och Institutet för framtidsstudier. Enligt undersökningen uppger 48 procent av de SFI-deltagare som svarat att de anser att homosexualitet är oacceptabelt. Resultatet är samtidigt osäkert, eftersom färre än fyra av tio av de tillfrågade svarade. Vill införa värdegrundsundervisning Centerpartiets integrationspolitiske talesperson, Niels Paarup-Petersen, vill nu att undervisning om demokrati, jämställdhet och allas lika värde ska bli ett eget moment i SFI. – Det är oacceptabelt att det är så mycket som hälften av deltagarna i SFI som står för homofobiska värderingar. Centerpartiet kräver att SFI inkluderar tydlig värdegrundsundervisning om svenska samhällets grunder som ett eget kursmoment. Det är tydligt att dagens generella skrivningar inte räcker. Samma som i grundskolan Han menar att undervisningen behöver omfatta samma grundläggande frågor som svenska elever möter i skolan. – Samma saker som vi lär ut, frågor om demokrati, jämställdhet och allas lika värde. Det är inte bara i SFI vi har de här problemen. Om man inte går i svensk grundskola har man inte fått den undervisningen. Våra demokratiska värderingar ska genomsyra samhället. Alla människor har samma rättigheter. Enligt Paarup-Petersen handlar det också om att tydliggöra vilka värderingar som gäller i Sverige. – Det är jättehemskt och problematiskt. I många av världens länder finns det homofobi. Det viktigaste för oss är att alla ska förstå att det i Sverige är en grundläggande värdering att alla har samma värde. Det måste folk förstå när de kommer hit. Sverigedemokraterna delar bilden att resultaten är oroande, men betonar i stället behovet av en stram migrationspolitik. ”Den som inte gillar våra värderingar borde inte bo här. Så enkelt är det. Rapporten visar med all tydlighet varför vi behöver fyra år till. Sverige behöver hålla kursen från denna mandatperiod och säkerställa att alla som befinner sig i vårt land respekterar hur vi lever”, skriver Ludvig Aspling, migrationspolitisk talesperson för Sverigedemokraterna, till TV4 Nyheterna.", "link": "https://www.tv4.se/artikel/5h7VJ6AykCzTdXCwb6rar6/c-om-homofobin-inom-sfi-kraever-vaerdegrundsundervisning", "date_display": "2026-08-14", "date_iso": "2026-08-14T09:53:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/politik", "/valet-2022/centerpartiet", "/homosexualitet", "/sfi", "/hbtqia"]}, {"id": 142, "title": "Warns of high UV index – even in late summer", "summary": "Protecting yourself from the sun on a scorching summer day at the beach is not strange for many. But what happens when the holidays are over and the high summer heat feels far away? - It is absolutely important to continue to protect yourself because the UV radiation can be intense even at the end of summer. A common misconception is that there is less UV when it is a bit colder or cloudy. But the amount of radiation does not depend on temperature, as long as it is not a thick cloud cover, it affects quite a bit, says Tove Sandberg Liljendahl, investigator at the Radiation Safety Agency. Extra important for children Already on Thursday, 28.2 degrees were measured in Uppsala. During Friday and Saturday, the high summer heat persists, with temperatures of 25 to 30 degrees in southern Sweden, according to TV4 meteorologist Peter Kondrup. When the UV index is 3 or higher, one should be careful. In Sweden, it is at its highest during the summer between 11 a.m. and 3 p.m. Then the UV index can be between 4 and 7. This weekend it looks like there will be an index around 4-5 in large parts of Sweden and then it is important to think about whether you are basking in the sun outdoors, especially for children. - Children have more sensitive skin than adults. They are usually not that aware of the sun and may have a different movement pattern, then a larger skin surface is exposed to UV radiation. The best protection for both adults and children is covering clothing, and shade, as well as sunscreen as a supplement, says Tove Sandberg Liljendahl. How you can keep track Since the sun is at its strongest between 11 a.m. and 3 p.m., it may be a good idea to stay inside or try to spend more time in the shade during those hours. Another tip from the expert is to use an app that shows the current UV index. - The UV index is displayed, for example, on the Radiation Safety Authority's website and in the weather app in most smartphones. How much sun you can tolerate is individual, but there is a tool called Minsoltid where you can get a recommendation based on where you are, time of day and your own sensitivity, says Tove Sandberg Liljend", "title_original": "Varnar för högt UV-index – även under sensommaren", "summary_original": "Att skydda sig mot solen en stekhet sommardag på stranden är för många inga konstigheter. Men hur blir det när semestern är slut och högsommarvärmen känns långt borta? – Det är absolut viktigt att fortsätta skydda sig eftersom UV-strålningen kan vara intensiv även i slutet av sommaren. En vanlig missuppfattning är att det är mindre UV när det är lite kallare eller molnigt. Men mängden strålning beror inte på temperatur, så länge det inte är ett tjockt molntäcke så påverkar det ganska lite, säger Tove Sandberg Liljendahl, utredare på Strålsäkerhetsmyndigheten. Extra viktigt för barn Redan under torsdagen uppmättes 28,2 grader i Uppsala. Under fredagen och lördagen håller högsommarvärmen i sig, med temperaturer på 25 till 30 grader i södra Sverige, enligt TV4 meteorolog Peter Kondrup. När UV-index är 3 eller högre ska man vara försiktig. I Sverige är det som högst under sommaren mellan klockan 11 och 15. Då kan UV-index ligga mellan 4 och 7.  Nu i helgen ser det ut att bli ett index runt 4–5 i stora delar av Sverige och då är det viktigt att tänka till om man lapar sol utomhus, särskilt för barn. – Barn har känsligare hud än vuxna. De är oftast inte så medvetna om solen och kan ha ett annat rörelsemönster, då blir en större hudyta utsatt för UV-strålning. Det bästa skyddet för både vuxna och barn är täckande kläder, och skugga, samt solkräm som komplement, säger Tove Sandberg Liljendahl. Så kan du hålla koll Eftersom solen är som starkast mellan klockan 11 och 15 kan det vara en bra idé att hålla sig inne eller att försöka spendera mer tid i skuggan just de timmarna. Ett annat tips från experten är att använda en app som visar aktuellt UV-index. – UV-index visas exempelvis på Strålsäkerhetsmyndighetens hemsida och i väder-appen i de flesta smartphones. Hur mycket sol man tål är individuellt, men det finns ett verktyg som heter Minsoltid där man kan få en rekommendation utifrån var man befinner sig, tidpunkt på dagen och sin egen känslighet, säger Tove Sandberg Liljendahl. Då vänder det Redan på söndag bryts högsommarvärmen. – På söndag är 25 till 30 grader ett minne blott. Under kvällen passerar en kallfront och temperaturerna når som mest 20 grader i Svealand och Götaland, säger Peter Kondrup och fortsätter: – Det blir en liten föraning av hösten. Men det är bara augusti, så vi ska inte ropa hej än. Det kan vända igen. I norra Sverige väntas ett betydligt ostadigare helgväder, med regn, blåst och temperaturer på 10 till 15 grader.", "link": "https://www.tv4.se/artikel/4KxpWIJ8mnkBRWIe0HDM7y/varnar-foer-vanlig-missuppfattning-naer-hoegsommarvaermen-atervaender", "date_display": "2026-08-14", "date_iso": "2026-08-14T09:18:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/sommar", "/vadret", "/uv-stralning"]}, {"id": 143, "title": "The DNA test revealed the truth: Dennis had four sisters", "summary": "It was spring 2020 that Dennis Karlén started genealogical research. After submitting a dna test via MyHeritage, relatives suddenly appeared that he could not explain. The man Dennis thought his whole life was his biological father had no siblings - yet the test showed Dennis had cousins ​​he had never heard of. - I had a hard time accepting it. I thought, \"This can't be right. Something's wrong,\" says Dennis. Thinking that the dna test was wrong, Dennis began to dig into the new family ties and got in touch with a cousin in Scania. Eventually it became clear that his biological father was another man, Malte, and that Dennis also had four sisters he never knew about. For the sisters, the news of an unknown big brother was unexpected, to say the least. - We have always wanted a brother, says Birgitta \"Gittan\" Persson. In the spring of 2021, the siblings met for the first time. Dennis describes how at first they mostly looked at each other and tried to find similarities. - You look for similarities and so on. I think we sat and watched a lot before we started talking, he says. United by shoes – and a kiwi allergy Since then, the sibling relationship has developed. And when the question of heredity and environment comes up, it turns out that there are at least a few things that unite the siblings. - We are both allergic to kiwi, says Birgitta. In addition, they share an interest in shoes. Today, the siblings meet regularly. Dennis goes down to Skåne in the summers and the sisters have visited him in Kungsör. Through them, Dennis has also gotten to know his biological father Malte, who is no longer alive. He has been told of a happy and humorous man who, like Dennis, enjoyed fishing. - He seems to have been a person I would have liked to have gotten to know. \"Feels like you've come home\" The joy over the newfound family is mixed with sadness over all the years they never had together. Dennis and the sisters are only three years apart in age and state that they could have shared large parts of their lives. But in that", "title_original": "DNA-testet avslöjade sanningen: Dennis fick fyra systrar", "summary_original": "Det var våren 2020 som Dennis Karlén började släktforska. Efter att ha skickat in ett dna-test via MyHeritage dök det plötsligt upp släktingar som han inte kunde förklara. Mannen som Dennis hela livet trott var hans biologiska pappa hade inga syskon – ändå visade testet att Dennis hade kusiner han aldrig hört talas om. – Jag hade svårt att acceptera det. Jag tänkte: ”Det här kan inte stämma. Någonting är fel”, säger Dennis. Trodde att dna-testet visade fel Dennis började nysta i de nya släktbanden och fick kontakt med en kusin i Skåne. Så småningom stod det klart att hans biologiska pappa var en annan man, Malte och att Dennis dessutom hade fyra systrar han aldrig vetat om. För systrarna blev beskedet om en okänd storebror minst sagt oväntat. – Vi har alltid önskat oss en bror, säger Birgitta ”Gittan” Persson. Våren 2021 träffades syskonen för första gången. Dennis beskriver hur de till en början mest tittade på varandra och försökte hitta likheter. – Man tittar efter likheter och så vidare. Jag tror att vi satt och tittade mycket innan vi började prata, säger han. Förenas av skor – och kiwiallergi Sedan dess har syskonrelationen vuxit fram. Och när frågan om arv och miljö kommer på tal visar det sig att det finns åtminstone några saker som förenar syskonen. – Vi är båda allergiska mot kiwi, säger Birgitta. Dessutom delar de ett intresse för skor. I dag träffas syskonen regelbundet. Dennis åker ner till Skåne på somrarna och systrarna har hälsat på honom i Kungsör. Genom dem har Dennis också fått lära känna sin biologiska pappa Malte, som inte längre är i livet. Han har fått höra om en glad och humoristisk man som, precis som Dennis, tyckte om att fiska. – Han verkar ha varit en person jag gärna skulle ha lärt känna. ”Känns som att man har kommit hem” Glädjen över den nyfunna familjen blandas med en sorg över alla år de aldrig fick tillsammans. Dennis och systrarna har bara tre års åldersskillnad och konstaterar att de hade kunnat dela stora delar av livet. Men i dag är glädjen över att ha hittat varandra störst. – Det är bara mysigt att vara tillsammans de dagar vi har tillsammans, säger Birgitta. För Dennis har systrarna också blivit en länk till pappan han aldrig fick lära känna. – Genom mina systrar känns det som att man har kommit hem. Det känns bra.", "link": "https://www.tv4.se/artikel/61UDtuBkWuDvZnREbihnAI/dna-testet-avsloejade-sanningen-dennis-fick-fyra-systrar", "date_display": "2026-08-14", "date_iso": "2026-08-14T08:53:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/livsoden", "/dna"]}, {"id": 144, "title": "Drink expert David Kringlund's three sour drinks with mint", "summary": "Today's weekend tip offers three different drinks from drink expert David Kringlund - a fresh Gin Gin Mule, a Gold Rush with lemon and honey and a non-alcoholic slush with apple and mint. See David Kringlund's Gin Gin Mule See David Kringlund's Gold Rush See David Kringlund's alcohol-free slush with apple and mint", "title_original": "Drinkexperten David Kringlunds tre syrliga drinkar med mynta", "summary_original": "Dagens helgtips bjuder på tre olika drinkar från drinkexperten David Kringlund - en fräsch Gin Gin Mule, en Gold Rush med citron och honung samt en alkoholfri slush med äpple och mynta. Se David Kringlunds Gin Gin Mule Se David Kringlunds Gold Rush Se David Kringlunds alkoholfria slush med äpple och mynta", "link": "https://www.tv4.se/artikel/15yi2nIpkpOZ5HLVvl8ajR/drinkexperten-david-kringlunds-tre-syrliga-drinkar-med-mynta", "date_display": "2026-08-14", "date_iso": "2026-08-14T06:55:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/koket", "/kokets-helgtips", "/david-kringlund"]}, {"id": 145, "title": "Tahereh is one of the first to take the new citizenship test", "summary": "It is a historic moment for many who have long waited for Swedish citizenship. Tahereh Taqadussi is one of the first thousand to be given the opportunity to write the new exam, which is now being tested in pilot form. She lives in Karlstad, has a daughter who is a Swedish citizen and works in the restaurant industry.  \"It costs me money too\" Before Saturday's exam, Tahereh has prepared as much as she can. She has studied, practiced the questions and received help from friends. Nevertheless, the nervousness is great. She feels the level is high and says that several Swedes she tested the questions on also had difficulty answering. - I have read and received help from my friends. But these questions are very difficult. Many could not answer them and thought it was very strange. For Tahereh, the exam also means more than just hours of preparation. She needs to take time off from work in Karlstad, travel to Stockholm and pay for a hotel night in order to be there. - I booked a hotel in Stockholm. I'm going to sleep there tonight. It costs me money too. At the same time, she is critical of the introduction of the test and believes that it involves costs both for the individual and for society. - First of all, I think that this test only costs money for the state. It is unnecessary. \"I love Sweden\" Despite the criticism, there is no doubt about what Swedish citizenship would mean to Tahereh. After ten years in the country, she describes Sweden as the place she herself chose to build her life. - I live in Sweden. I have a daughter who is a Swedish citizen. I chose this country, I wanted to live here. I like Karlstad. I love Sweden. Now the last upload remains before Saturday's test. And despite the nervousness, Tahereh hopes that all the studying will last all the way. - I am prepared. I have read and I have practiced. I just hope I pass this exam.", "title_original": "Tahereh är en av de första att göra nya medborgarskapsprovet", "summary_original": "Det är ett historiskt ögonblick för många som länge väntat på svenskt medborgarskap. Tahereh Taqadussi är en av de första tusen som får möjlighet att skriva det nya provet, som nu testas i pilotform. Hon bor i Karlstad, har en dotter som är svensk medborgare och arbetar inom restaurangbranschen.  ”Det kostar pengar för mig också” Inför lördagens prov har Tahereh förberett sig så mycket hon kan. Hon har pluggat, övat på frågorna och fått hjälp av vänner. Ändå är nervositeten stor. Hon upplever nivån som hög och berättar att flera svenskar hon testat frågorna på också haft svårt att svara. – Jag har läst och fått hjälp från mina kompisar. Men de här frågorna är jättesvåra. Många kunde inte svara på dem och tyckte att det var jättekonstigt. För Tahereh innebär provet dessutom mer än bara timmar av förberedelser. Hon behöver ta ledigt från jobbet i Karlstad, resa till Stockholm och betala för en hotellnatt för att kunna vara på plats. – Jag bokade hotell i Stockholm. Jag ska sova där i natt. Det kostar pengar för mig också. Samtidigt är hon kritisk till att provet införs och menar att det innebär kostnader både för den enskilde och för samhället. – Först och främst tycker jag att det här provet bara kostar pengar för staten. Det är onödigt. ”Jag älskar Sverige” Trots kritiken råder det ingen tvekan om vad ett svenskt medborgarskap skulle betyda för Tahereh. Efter tio år i landet beskriver hon Sverige som platsen hon själv valt att bygga sitt liv på. – Jag bor i Sverige. Jag har en dotter som är svensk medborgare. Jag valde det här landet, jag ville bo här. Jag gillar Karlstad. Jag älskar Sverige. Nu återstår den sista uppladdningen inför lördagens prov. Och trots nervositeten hoppas Tahereh att allt pluggande ska räcka hela vägen. – Jag är förberedd. Jag har läst och jag har övat. Jag hoppas bara att jag klarar det här provet.", "link": "https://www.tv4.se/artikel/4j55ZnL40b8s5VsaahsnGK/hon-aer-en-av-de-foersta-att-goera-medborgarskapsprovet-jaettenervoes", "date_display": "2026-08-14", "date_iso": "2026-08-14T06:36:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/medborgarskap", "/svenskt-medborgarskap", "/medborgarskapsprovet"]}, {"id": 146, "title": "Alisa, 26, was raped by Russian soldiers: \"Felt animal fear\"", "summary": "401 cases of sexual violence against civilians documented", "title_original": "Alisa, 26, våldtogs av ryska soldater: ”Kände djurisk rädsla”", "summary_original": "401 fall av sexuellt våld mot civila dokumenterade", "link": "https://www.tv4.se/artikel/2VwlcaTnZjUMSpVDHdF9MR/alisa-26-valdtogs-av-ryska-soldater-kaende-djurisk-raedsla", "date_display": "2026-08-14", "date_iso": "2026-08-14T06:17:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 147, "title": "Mummified body found in abandoned house - police appeal for help", "summary": "The body was found in a mummified state by excavators hired to demolish the house, located on a forest property in Vällersten outside Värnamo. The property changed hands in April, just under six months before the man was found. The police estimate that the man probably arrived at the cabin sometime in the summer or fall of 2022. The cabin had been bolted from the inside and the body was lying on a makeshift bed on the floor – and next to him were his belongings. Based on the deceased man's pack, he appeared to be equipped to stay for an extended period of time in the woods and fields. - His belongings basically consisted of a Haglöfs hiking backpack at the time. And all the things you can imagine that you have with you when you live in the wilderness or outside of civilization. It was a storm kitchen, sleeping pads, matches, a saucepan, says Johan Borg at Värnamopolisen. - The clothes he wore were typically Swedish clothes. Underwear from Newbody. And outdoor style pants and jacket I would say, he adds. \"Someone who lived a vagabond life in the wilderness\" Among the belongings, however, there was neither a mobile phone nor ID documents. According to the police, there is no indication that a crime was committed, or that someone was in the house with him. - He was under a blanket there and there were circumstances at the scene that I don't want to go into that make us think he was ill. And that he might have sought shelter because he felt bad and then simply died there then, says Johan Borg. For four years, the police, without the public's knowledge, have worked to try to identify him, so far without success, something P4 Jönköping was first able to tell.  - We had the Swedish Medical Examiner's Office do a carbon-14 and carbon-13 examination on the teeth and there they were able to conclude that the person should have been born in 1988 plus or minus one year, and also then that he was probably of Nordic or Scandinavian origin, says Johan Borg. Police have tapped relatives of missing persons to try to get a DNA match, and have also s", "title_original": "Mumifierad kropp hittades i ödehus – polisen vädjar om hjälp", "summary_original": "Kroppen hittades i mumifierat skick av grävmaskinister som anlitats för att riva huset, beläget på en skogsfastighet i Vällersten utanför Värnamo. Fastigheten bytte ägare i april, ett knappt halvår innan mannen hittades. Polisen bedömer att mannen antagligen anlände till stugan någon gång under sommaren eller hösten 2022.  Stugan hade reglats inifrån och kroppen låg på en provisorisk bädd på golvet – och bredvid honom hans tillhörigheter. Baserat på den avlidna mannens packning såg han ut att vara utrustad för att vistas en längre tid i skog och mark. – Hans tillhörigheter bestod i princip av en Haglöfs vandringsryggsäck då. Och alla de saker man kan tänka sig att man har med sig när man bor i  vildmarken eller utanför civilisationen. Det var stormkök, liggunderlag, tändstickor, en kastrull, säger Johan Borg på Värnamopolisen. – Kläderna han bar var av typiskt svenska kläder. Underkläder från Newbody. Och byxor och jacka i friluftsstil skulle jag påstå, tillägger han. ”Någon som levt ett vagabondliv i vildmarken” Bland tillhörigheterna fanns dock varken mobiltelefon eller id-handlingar. Enligt polisen finns inget som tyder på att något brott begåtts, eller att någon befunnit sig med honom i huset. –  Han låg under en filt där och det fanns omständigheter på platsen som jag inte vill gå in på som gör att vi tror att han var sjuk. Och att han kanske hade sökt skydd för att han kände sig dålig och sen helt enkelt avled där då, säger Johan Borg. I fyra års tid har polisen, utan allmänhetens vetskap, arbetat med att försöka identifiera honom, hittills utan att lyckas, något P4 Jönköping först kunde berätta.  – Vi lät Rättsmedicinalverket göra en kol-14 och kol-13 undersökning på tänderna och där kunde de sluta sig till att personen bör ha varit född 1988 plus minus ett år, och också då att han troligen var av nordiskt eller skandinaviskt ursprung, berättar Johan Borg. Polisen har topsat anhöriga till försvunna personer för att försöka få en DNA-matchning, och har också skickat ut signalement och DNA-profil till polismyndigheter internationellt – utan någon träff. Johan Borg har sin egen teori om vad det skulle kunna handla om för person. – Jag tror och av allt att döma tycker jag att jag har belägg för det med att det är en person som har levt någon form av vagabondliv i vildmarken och velat hålla sig utanför samhället. Antagligen självvalt. Kommer kremeras och begravas Genom att gå ut med bilder på mannens tillhörigheter hoppas man att anhöriga ska känna igen ägodelarna, och på så vis kunna identifiera honom. – Det finns ju personer som lever ”off-grid” och som inte har några anhöriga. Det stöter vi på men vi har ju så vitt jag vet,  efter snart 20 år här som polis i Värnamo så har vi inte haft något ärende som detta. Där vi inte har kunnat identifiera någon. Så det vore bra att få en lösning på mysteriet, säger Johan Borg. Mannens kropp kommer inom snar framtid kremeras och begravas vid en lokal kyrka, i nuläget med en blank namnplakett på gravstenen. – Det finns ju nåt tragiskt med det, kan vi tycka. Så vi skulle ju väldigt gärna vilja få en identitet och en plats som man skulle kunna hänvisa anhöriga till. Nån måste ju undra vart han tog vägen, tänker jag. Varför har det dröjt tills nu för er att gå ut med det här? – Vi har väl känt att de åtgärder vi har haft att ta till skulle fortfarande kunna ge någonting, men där har vi väl gett upp  hoppet nu. Och vi skulle ju hemskt gärna vilja identifiera honom för att kunna lämna ett dödsbud på ett bra sätt. Den här efterlysningen ser polisen nu som en sista chansning, men däremot inte den sista möjligheten att identifiera honom. – Allt material kommer att finnas kvar. Det finns ju DNA-prov kvar så att man för all framtid ska kunna söka rätt på honom om vi får in ett matchande spår, säger Johan Borg.", "link": "https://www.tv4.se/artikel/7BdWXEEABUoTiIunhL2ubk/mumifierad-kropp-hittades-i-ett-oedehus-polisen-vaedjar-om-hjaelp", "date_display": "2026-08-14", "date_iso": "2026-08-14T04:30:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/dod-person", "/varnamo", "/polisen", "/polismyndigheten"]}, {"id": 148, "title": "Swedish big companies are waiting for Donald Trump's customs money", "summary": "Most Swedish companies that are active in the USA have been exposed to US import duties in the past year. Some of these were invalidated by the Supreme Court in February this year and are now being repaid piece by piece. Half refunded So far, the US Customs Service has received over 250,000 applications from various companies for refunds. About half of what is to be repaid, around 90 billion dollars, has already been repaid, Johan Karlberg, acting US director at Business Sweden in New York, told TT. Around 1,000 Swedish goods companies have production in the USA and have thus been affected by the now invalidated tariffs. One of the Swedish companies that has now been granted a refund is Electrolux, which, among other things, manufactures ovens in Springfield, Tennessee, and which applied for a refund of around 83 million dollars (around 760 million kroner). Struggling with sector tariffs The application has been approved for payment, confirms Ann-Sofi Jönsson, responsible for investor relations at Electrolux, for TT. But notes that the company has new tariffs to contend with. In April this year, the United States introduced so-called sectoral tariffs, which mainly cover raw materials, products in the metal and automotive sectors and certain high technology. The import duties also affect Mexico and thus hit Electrolux, which has production of refrigerators and freezers there and needs to import parts for its production. The company does not have a strategy to cope with the sector duties. We are working to streamline and adjust operations, but the import duties are already felt, says Ann-Sofi Jönsson. Customers demand money Some Swedish companies, especially in the engineering industry, have handled customs costs by passing them on to customers. In several cases where the companies have been open about this, the customers in turn are now demanding repayment, says Johan Karlberg at Business Sweden. Some Swedish companies that have been explicit in their customer dialogues and put the customs cost on the invoice say that the customers are now demanding this money back, says h", "title_original": "Svenska storbolag väntar på Donald Trumps tullpengar", "summary_original": "De flesta svenska företag som är aktiva i USA har det senaste året utsatts för USA:s importtullar. En del av dessa ogiltigförklarades av Högsta domstolen i februari i år och återbetalas nu bit för bit. Hälften återbetalats Hittills har det amerikanska tullverket tagit emot över 250 000 ansökningar från olika bolag om återbetalning. Omkring hälften av det som ska återbetalas, runt 90 miljarder dollar, har redan betalats tillbaka, uppger Johan Karlberg, tillförordnad USA-chef på Business Sweden i New York, för TT. Omkring 1 000 svenska varubolag har produktion i USA och har därmed drabbats av de nu ogiltigförklarade tullarna. Ett av de svenska företag som nu beviljats återbetalning är Electrolux, som bland annat tillverkar ugnar i Springfield, Tennessee, och som ansökt om återbetalning på omkring 83 miljoner dollar (cirka 760 miljoner kronor). Brottas med sektorstullar Ansökningen har godkänts för utbetalning, bekräftar Ann-Sofi Jönsson, ansvarig för investerar-relationer vid Electrolux, för TT. Men konstaterar att bolaget fått nya tullar att brottas med. I april i år införde USA så kallade sektorstullar, som framför allt omfattar råvaror, produkter inom metall- och fordonssektor och viss högteknologi. Importtullarna berör även Mexiko och slår därmed mot Electrolux, som har produktion av kylskåp och frysar där och behöver importera delar för sin tillverkning. Någon strategi för att klara sektorstullarna har bolaget inte. Vi jobbar för att effektivisera och anpassa verksamheten, men importtullarna är redan kännbara, säger Ann-Sofi Jönsson. Kunder kräver pengar Vissa svenska bolag, särskilt inom verkstadsindustrin, har hanterat tullkostnader genom att rulla dem vidare på kunder. I flera fall där bolagen varit öppna med detta, kräver kunderna i sin tur nu återbetalning, berättar Johan Karlberg vid Business Sweden. En del svenska bolag som har varit explicita i sina kunddialoger och satt tullkostnaden på fakturan säger att kunderna nu kräver dessa pengar tillbaka, säger han. Något som dock inte gäller Electrolux. Tullarna har ändå hunnit göra avtryck i kostnader och bidrog under andra kvartalet till breda prishöjningar på mellan 5 – 20 procent för kunder i Nordamerika, meddelar Ann-Sofi Jönsson.", "link": "https://www.tv4.se/artikel/tt-260814-aterbetalningtullar1-585e27e4/svenska-bolag-vantar-pa-trumps-tullpengar", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:45:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["USA", "/usa", "/mexiko", "/tullverket", "/tennessee", "/hogsta-domstolen", "/ekonomi"]}, {"id": 149, "title": "Ida-Maria Brengesjö: What happens to the congregation after September 13th?", "summary": "We must continue to pray together and carry each other's burdens even when we disagree.", "title_original": "Ida-Maria Brengesjö:  Vad händer med församlingen efter den 13:e september?", "summary_original": "Vi ska fortsätta be tillsammans och bära varandras bördor också när vi inte är överens.", "link": "https://www.dagen.se/ledare/ida-maria-brengesjoe-vad-haender-med-foersamlingen-efter-den-13e-september/10430153", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "\"Bless the academic year 2026/27\" - Here is the prayer prepared before the start of school", "summary": "Churches are asked to join in the intercessory prayer for the school this Sunday.", "title_original": "”Välsigna läsåret 2026/27' – Här är bönen som tagits fram inför skolstarten", "summary_original": "Kyrkor uppmanas att stämma in i förbönen för skolan nu på söndag.", "link": "https://www.dagen.se/nyheter/vaelsigna-laesaret-2026/27-haer-aer-boenen-som-tagits-fram-infoer-skolstarten/10475105", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "The issue is much bigger than just the marriage issue", "summary": "My experience is that it is uncomfortable and difficult for many LGBTQI people to participate because they do not feel at home and accepted in the church, writes Karin Janfalk (ÖKA) in a response.", "title_original": "Frågan är mycket större än bara vigselfrågan", "summary_original": "Min erfarenhet är att det är obekvämt och svårt för många hbtqi-personer att delta eftersom de inte känner sig hemma och accepterade i kyrkan, skriver Karin Janfalk (ÖKA) i en replik.", "link": "https://www.dagen.se/debatt/fragan-aer-mycket-stoerre-aen-bara-vigselfragan/10476341", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Increased loss for Human Bridge", "summary": "\"We have gone through a trial by fire\" • ... but the bereaved children of the aid organization have recovered.", "title_original": "Ökad förlust för Human Bridge", "summary_original": "”Vi har gått igenom ett eldprov” • … men biståndsorganisationens sorgebarn har repat sig.", "link": "https://www.dagen.se/nyheter/oekad-foerlust-foer-human-bridge/10477108", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "\"Before the last move, our son thought we had ruined his life\"", "summary": "Mats and Maria Levander about daring to choose the adventure abroad - both as a family and as a couple.", "title_original": "”Inför sista flytten tyckte vår son att vi förstört hans liv”", "summary_original": "Mats och Maria Levander om att våga välja äventyret utomlands - både som familj och som par.", "link": "https://www.dagen.se/livsstil/infoer-sista-flytten-tyckte-var-son-att-vi-foerstoert-hans-liv/10449300", "date_display": "2026-08-14", "date_iso": "2026-08-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "A record number of civilians were killed in July – Russia steps up", "summary": "At the same time, Ukraine has liberated several villages on the front: \"Carried out with precision\"", "title_original": "Rekordmånga civila dödades i juli – Ryssland trappar upp", "summary_original": "Samtidigt har Ukraina befriat flera byar vid fronten: ”Genomförts med precision”", "link": "https://www.tv4.se/artikel/2SYcKYreJMdKelWorwKrji/rekordmanga-civila-doedades-i-juli-ryssland-trappar-upp-robotattacker", "date_display": "2026-08-13", "date_iso": "2026-08-13T20:25:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 155, "title": "New information from the murder scene: Pieces of glass in a pile", "summary": "The woman in her 50s is believed to have been murdered in the morning on Tuesday last week. She was not found until 4:21 p.m. by relatives who were worried and went to the holiday home on the island of Sollenkroka in Värmdö municipality. She had extensive injuries to her body and when paramedics landed by helicopter they announced that her life could not be saved. According to information to TV4 Nyheterna, it is about at least knife violence. Pile of broken glass When the police arrived at the scene, it was discovered that the door to the veranda and the cabin was wide open, according to documents that TV4 Nyheterna has seen. Later, the patrol responded to the fact that a large window had been broken. The police's assessment was that the window had been smashed from inside the building. According to the same documents that TV4 Nyheterna has seen, the police thought that it looked like someone had then collected the pieces of glass in a pile on the ground outside. The patrols began to document the scene before blocking it for a technical examination. Trying to map the sequence of events Just nine minutes after the alarm, at 4:30 p.m., the murder suspects were directed at the victim's 55-year-old boyfriend, which TV4 Nyheterna previously reported on. It was the start of a 33-hour police manhunt with several raids by the task force and intelligence operations before he was arrested on a nearby island with the help of the police helicopter. In questioning with the police, the boyfriend told about the couple's summer holiday in the holiday home, that something \"tumultuous\" happened and about his escape by kayak afterwards. - I think about her and her kind of life. Which I removed, he says according to documents that TV4 Nyheterna has seen. The man did not want to tell more about the incident in police questioning or go into details. The motive and the exact course of events are still unclear, but the police are working intensively to map out all the elements. - It's not that I kind of want to squirm. I just can't put it into words. I'm not a coward. It's that I can't put it into words, he says in the investigation", "title_original": "Nya uppgifter från mordplatsen: Glasbitar i en hög", "summary_original": "Kvinnan i 50-årsåldern tros ha mördats på förmiddagen i tisdags förra veckan. Hon hittades inte förrän klockan 16.21 av närstående som varit oroliga och tagit sig till fritidshuset på ön Sollenkroka i Värmdö kommun. Hon hade omfattande skador på kroppen och när ambulanspersonal landade med helikopter meddelade de att hennes liv inte gick att rädda. Enligt uppgifter till TV4 Nyheterna handlar det om åtminstone knivvåld. Hög av glasbitar När poliserna kom fram till platsen upptäcktes att dörren till verandan respektive stugan stod vidöppen, enligt handlingar som TV4 Nyheterna tagit del av. Senare reagerade patrullen på att ett stort fönster var sönderslaget. Polisens bedömning var att rutan hade krossats inifrån byggnaden. Enligt samma handlingar som TV4 Nyheterna tagit del av tyckte poliserna att det såg ut som att någon sedan samlat ihop glasbitarna i en hög på marken utanför. Patrullerna började dokumentera platsen innan man spärrade av för en teknisk undersökning. Försöker kartlägga händelseförloppet Bara nio minuter efter larmet, klockan 16.30, riktades mordmisstankarna mot offrets pojkvän i 55-årsåldern, vilket TV4 Nyheterna tidigare rapporterat om. Det blev början på en 33 timmar lång polisjakt med flera tillslag av insatsstyrkan och spaningsinsatser innan han greps på en närliggande ö med hjälp av polishelikoptern. I förhör med polisen har pojkvännen berättat om parets sommarsemester i fritidshuset, att något ”tumultartat” skedde och om hans flykt med kajak efteråt. – Jag tänker på henne och hennes liksom liv. Som jag tog bort, säger han enligt handlingar som TV4 Nyheterna tagit del av. Mannen har inte velat berätta närmare om händelsen i polisförhör eller gå in på detaljer. Motivet och det exakta händelseförloppet är fortfarande oklart, men polisen arbetar intensivt för att kartlägga alla delar. – Det är inte att jag liksom vill slingra mig. Bara att jag kan inte sätta ord på det. Jag är inte feg. Det är att jag kan inte sätta ord på det, säger han i utredningen.", "link": "https://www.tv4.se/artikel/3IKRrbf2kUB2O7PASihUp/nya-uppgifter-fran-mordplatsen-glasbitar-i-en-hoeg", "date_display": "2026-08-13", "date_iso": "2026-08-13T19:28:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/mordet-i-stockholms-skargard", "/varmdo", "/stockholm", "/mord", "/brott"]}, {"id": 156, "title": "The Tidö parties' great victory: Criminal politics central to the election campaign", "summary": "", "title_original": "Tidöpartiernas stora seger: Kriminalpolitiken central i valrörelsen", "summary_original": "", "link": "https://www.tv4.se/artikel/4Z2uJPDyPaoYWLyq0LaxdD/tidoepartiernas-stora-seger-kriminalpoliti anitarian assistance to Colombia.", "title_original": "Sweden provides SEK 5 million in humanitarian assistance to Colombia following earthquake", "summary_original": "Sweden has announced SEK 5 million in humanitarian support to Colombia through the UN Refugee Agency (UNHCR) following the earthquake that recently hit the country. This will help address urgent humanitarian needs, strengthen support for people who have been forced to leave their homes and provide assistance to the most vulnerable groups in affected areas. Through the Swedish International Development Cooperation Agency (Sida), Sweden has long been a key donor of humanitarian assistance to Colombia.", "link": "https://www.government.se/press-releases/2026/08/sweden-provides-sek-5-million-in-humanitarian-assistance-to-colombia-following-earthquake/", "date_display": "2026-08-13", "date_iso": "2026-08-13T15:40:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Maria Malmer Stenergard", "Benjamin Dousa"]}, {"id": 160, "title": "Joint statement on executions in Iran", "summary": "Canada, Albania, Austria, Australia, Belgium, Croatia, Cyprus, Czech Republic, Denmark, Estonia, the High Representative of the European Union, Finland, France, Germany, Hungary, Iceland, Ireland, Italy, Latvia, Lithuania, Luxembourg, Montenegro, the Netherlands, New Zealand, North Macedonia, Norway, Portugal, Romania, Slovakia, Slovenia, Spain, Sweden, and the United Kingdom condemn in the strongest terms the ongoing executions of protesters and use of the death penalty by the Islamic Republic of Iran.", "title_original": "Joint statement on executions in Iran", "summary_original": "Canada, Albania, Austria, Australia, Belgium, Croatia, Cyprus, Czech Republic, Denmark, Estonia, the High Representat   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
