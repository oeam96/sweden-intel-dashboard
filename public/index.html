-24T09:10:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/energidryck", "/kost"]}, {"id": 153, "title": "\"We as Christians should be proud to be able to create spaces like this\"", "summary": "(G) which in God-mingling at Almedalen offered unexpected meetings, bad puns and a member of the Riksdag who was crowned as the winner.", "title_original": "”Vi som kristna ska vara stolta över att kunna skapa sådana här rum”", "summary_original": "(G) som i Gud-mingel på Almedalen bjöd på oväntade möten, dåliga ordvitsar och en riksdagsledamot som korades som vinnare.", "link": "https://www.dagen.se/nyheter/vi-som-kristna-ska-vara-stolta-oever-att-kunna-skapa-sadana-haer-rum/10410328", "date_display": "2026-06-24", "date_iso": "2026-06-24T09:06:12+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Minutes from the monetary policy meeting on 16 June 2026", "summary": "Minutes from the monetary policy meeting on 16 June 2026", "title_original": "Protokoll från det penningpolitiska mötet den 16 juni 2026", "summary_original": "Protokoll från det penningpolitiska mötet den 16 juni 2026", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/protokoll-fran-det-penningpolitiska-motet-den-16-juni-2026/", "date_display": "2026-06-24", "date_iso": "2026-06-24T07:30:40+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Reports Åkesson to the police after the review: \"Serious things\"", "summary": "Documents reveal fiddling with accounting and tax money within SD", "title_original": "Polisanmäler Åkesson efter granskningen: ”Allvarliga saker”", "summary_original": "Dokument avslöjar fiffel med bokföring och skattepengar inom SD", "link": "https://www.tv4.se/artikel/tt-260624-almedalenanmalan1-7d1b7922/v-polisanmaler-akesson-kan-vara-brottsligt", "date_display": "2026-06-24", "date_iso": "2026-06-24T06:58:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Vänsterpartiet", "/valet-2022/vansterpartiet"]}, {"id": 156, "title": "Acts to counteract the deficiency - hormone patches will become more expensive", "summary": "Sandoz, the company behind the hormone patch Estradot, has warned that the shortage situation may worsen and has now been given the okay to charge a higher price, reports Dagens Medicin. The authority TLV, which made the decision, states that otherwise the risk is that the drug will disappear from the Swedish market. Warns of even greater shortage In its application for a price increase, Sandoz refers to a greatly increased global demand that could affect supply for several years to come. The company warns of even greater shortages if prices are not raised. The price increase will take effect on July 1 and will be between 55 and 60 percent for the strengths of 50, 75 and 100 micrograms/24 hours.", "title_original": "Agerar för att motverka bristen – hormonplåster ska bli dyrare", "summary_original": "Sandoz, företaget bakom hormonplåstret Estradot, har varnat för att bristsituationen kan förvärras och har nu fått okej för att ta ut ett högre pris, rapporterar Dagens Medicin. Myndigheten TLV,  som fattat beslutet, uppger att risken annars är att läkemedlet försvinner från den svenska marknaden. Varnar för ännu större brist I sin ansökan om prishöjning hänvisar Sandoz till en kraftigt ökad global efterfrågan som kan påverka tillgången i flera år framöver. Företaget varnar för ännu större brist om inte priserna höjs. Prishöjningen börjar gälla den 1 juli och blir mellan 55 och 60 procent för styrkorna 50, 75 och 100 mikrogram/24 timmar.", "link": "https://www.tv4.se/artikel/tt-260624-ostrogenpris1-466bc89b/hojt-pris-pa-hormonplaster-ska-motverka-brist", "date_display": "2026-06-24", "date_iso": "2026-06-24T06:23:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Privatekonomi", "/privatekonomi", "/inrikes", "/ostrogenbrist", "/medicin"]}, {"id": 157, "title": "Big test: \"The most expensive riding helmets are the worst\"", "summary": "Riding is one of Sweden's biggest youth sports and around half a million ride regularly, according to the National Sports Confederation. At the same time, Folksam's insurance data shows that around 1,400 riders are injured each year, that is, an average of 26 a week.  The most common injury is concussion. This year's test includes a total of 15 riding helmets that are available on the Swedish and European markets. All helmets included in the test are approved according to the current CE standard.  - In our statistics, we have very few skull fractures, but the most common injury is a concussion. If we look at head injuries in general, we have twelve a week that are reported to Folksam from the Equestrian Association's members. Then it is important that we focus on those injuries, says Helena Stigson, head of research at Folksam. The test shows that there is up to eight times higher risk of a concussion or more serious injury if you use the worst helmet compared to one of the better ones.  The most expensive helmets belong to the worst The price of the helmets varies from SEK 1,300 to SEK 6,800 and the average purchase price was approximately SEK 3,800. But expensive does not mean best. - The most expensive helmets are the worst, so it's completely the opposite of what you might think. As a consumer, you might think that if you buy an expensive helmet, you get safety. But here there is over a 50 percent risk of concussion in several of the impacts, says Stigson.  On the list of the worst are Antares Premium Eclipse, for around SEK 5,400 and Free Jump VoronÏ, which costs around SEK 6,600.  That's why the more expensive ones are worse The reason why the more expensive ones are worse is because the most expensive helmets don't reach the right standard.  - You do not set the requirement in the CE marking and that is the problem. That's why we do consumer tests to help the customer make a safe choice. We try to influence the legal requirements and also via the Swedish Equestrian Federation and I am also part of the FEI, which is the international federation's group regarding helmets, to increase the requirements. Here are the best helmets Hjäl", "title_original": "Stort test: ”De dyraste ridhjälmarna är de sämsta”", "summary_original": "Ridning är en av Sveriges största ungdomsidrotter och omkring en halv miljon rider regelbundet, enligt Riksidrottsförbundet. Samtidigt visar Folksams försäkringsdata att runt 1 400 ryttare skadas varje år, det vill säga i snitt 26 i veckan.  Vanligaste skadan är hjärnskakning I årets test ingår totalt 15 ridhjälmar som finns tillgängliga på den svenska och europeiska marknaden. Alla hjälmar som ingår i testet är godkända enligt gällande CE-standard.  –  I vår statistik har vi väldigt få skallfrakturer men den vanligaste skadan är en hjärnskakning. Om vi tittar på huvudskador generellt har vi tolv i veckan som rapporteras till Folksam från Ridsportförbundets medlemmar. Då är det viktigt att vi fokuserar på de skadorna, säger Helena Stigson, forskningsansvarig på Folksam. Testet visar att det är upp till åtta gånger högre risk för en hjärnskakning eller mer allvarlig skada om man använder den sämsta hjälmen jämfört med en av de bättre.  Dyrast hjälmarna tillhör de sämsta Priset på hjälmarna varierar från 1 300 till 6 800 kronor och genomsnittligt inköpspris var cirka 3 800 kronor. Men dyrt betyder inte bäst. – De dyraste hjälmarna är de sämsta så det är helt omvänt mot vad man kan tro. Som konsument tror man kanske att om man köper en dyr hjälm får man säkerhet. Men här ligger man över 50 procents risk för hjärnskakning i flera av islagen, säger Stigson.  På listan av de sämsta finns Antarés Premium Eclipse, för cirka 5 400 kronor och Free Jump VoronÏ, som kostar cirka 6 600 kronor.  Därför är de dyrare sämre Anledningen till att de dyrare är sämre beror på att de dyraste hjälmarna inte når upp till rätt standard.  – Man ställer inte kravet i CE-märkningen och det är problemet. Det är därför vi gör konsumenttester för att hjälpa kunden att göra ett säkert val. Vi försöker påverka lagkraven och även via Svenska Ridsportförbundet och jag sitter även med i FEI  som är den internationella federationens grupp kring hjälmar för att öka kraven. Här är de bästa hjälmarna Hjälmarna som toppar listan är bland annat Hansbo HS Vision Mips för 2 000 kronor och Back on Track Strixx för 3 000 kronor.  – Alla de här har någon typ av rotationsskydd, så kallat Mips. Det är ett extra glidlager inne i hjälmen som tar hand de delar av det sneda islaget och förlänger själva förloppet och tar ner värdena. De här hjärmarna är billigare än genomsnittet, säger Stigson.", "link": "https://www.tv4.se/artikel/6S6IOkGc49f50FDQbjRNkI/stort-test-haer-aer-de-saemsta-ridhjaelmarna", "date_display": "2026-06-24", "date_iso": "2026-06-24T05:28:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/ridsport", "/hastsport"]}, {"id": 158, "title": "Croatia won after a successful jump - Panama eliminated", "summary": "", "title_original": "Kroatien vann efter succéinhopp – Panama utslaget", "summary_original": "", "link": "https://www.tv4.se/artikel/4MyELP7e9bXFjPZK7UCDyT/kroatien-vann-efter-succeinhopp-panama-utslaget", "date_display": "2026-06-24", "date_iso": "2026-06-24T04:27:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 159, "title": "Sharp criticism after blown penalties: \"WHERE was on vacation\"", "summary": "Watch the highlights f tags": []}, {"id": 162, "title": "Lay people should be allowed to lead worship in priestless churches", "summary": "The problem in the countryside is that we don't have priests, and I don't know when the last venia was distributed. Instead, the rural churches are empty, writes Eva-Lotta Kalman in a concluding remark.", "title_original": "Lekmän bör få leda gudstjänst i prästtomma kyrkor", "summary_original": "Problemet på landsbygden är att vi inte har präster, och jag vet inte när det senast delades ut venia. I stället står landsbygdskyrkorna tomma, skriver Eva-Lotta Kalman i en slutreplik.", "link": "https://www.dagen.se/debatt/lekmaen-boer-fa-leda-gudstjaenst-i-praesttomma-kyrkor/10402285", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Clear: Hans Erik Bylund becomes acting director of Uppsala Pingst", "summary": "Ending his position as director of Botkyrka Pingst after 13 years", "title_original": "Klart: Hans Erik Bylund blir tillförordnad föreståndare i Uppsala Pingst", "summary_original": "Slutar sin tjänst som föreståndare för Botkyrka Pingst efter 13 år", "link": "https://www.dagen.se/nyheter/klart-hans-erik-bylund-blir-tillfoerordnad-foerestandare-i-uppsala-pingst/10409714", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 164, "title": "State investigation: Foreign contributions to religious communities must be able to be stopped", "summary": "Churches may have to register all gifts of more than SEK 150,000.", "title_original": "Statlig utredning: Utländska bidrag till trossamfund ska kunna stoppas", "summary_original": "Kyrkor kan behöva registrera alla gåvor på mer än 150 000 kronor.", "link": "https://www.dagen.se/nyheter/statlig-utredning-utlaendska-bidrag-till-trossamfund-ska-kunna-stoppas/10408819", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 165, "title": "How will we be able to choose who will receive vital humanitarian aid?", "summary": "We all need to get better at highlighting what the aid could look like so that Sweden and the EU, in cooperation with more like-minded people, can handle the great challenges we face, writes Ulrika Modéer, Swedish Red Cross.", "title_original": "Hur ska vi kunna välja vem ska få livsviktig humanitär hjälp?", "summary_original": "Vi behöver alla bli bättre på att lyfta hur biståndet skulle kunna se ut så att Sverige och EU, i samarbete med fler likasinnade, kan hantera de stora utmaningarna vi står inför, skriver Ulrika Modéer, Svenska Röda korset.", "link": "https://www.dagen.se/debatt/hur-ska-vi-kunna-vaelja-vem-ska-fa-livsviktig-humanitaer-hjaelp/10395622", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "This is the church's most important task for the next twenty years", "summary": "Erik Helmerson: A Sweden without fresh water is a dystopian nightmare.", "title_original": "Detta är kyrkans viktigaste uppgift de kommande tjugo åren", "summary_original": "Erik Helmerson: Ett Sverige utan friskt vatten är en dystopisk mardröm.", "link": "https://www.dagen.se/ledare/detta-aer-kyrkans-viktigaste-uppgift-de-kommande-tjugo-aren/10406976", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 167, "title": "New Wine wants to shine a light on healthy charisma", "summary": "Around 400 people meet for a summer conference in Frihamskyrkan in Gothenburg", "title_original": "New Wine vill sätta ljuset på sund karismatik", "summary_original": "Omkring 400 personer möts till sommarkonferens i Frihamnskyrkan i Göteborg", "link": "https://www.dagen.se/nyheter/new-wine-vill-saetta-ljuset-pa-sund-karismatik/10407696", "date_display": "2026-06-24", "date_iso": "2026-06-24T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 168, "title": "Continues to invest in Africa: \"Great interest in Russia\"", "summary": "The Russian paramilitary Wagner group led by Yevgeny Prigozhin became an important asset as Russia expanded its influence in Africa. The group was active in several countries and conflicts, but it came to an abrupt end in the summer of 2023. Prigozhin's \"march to Moscow\" and the mutiny against President Putin came to be the end of the paramilitary group, later Prigozhin died in a mysterious plane crash.  What was left of the Wagner Group was incorporated under the Russian Ministry of Defense and when Wagner stepped out of Africa, the Russian Afrika Korps entered instead. According to previous information, it consists to a large majority of former mercenaries from the Wagner group in particular. Several parts can be used in the war against Ukraine At the same time that Russia's war of aggression in Ukraine is consuming resources, it has a continued presence in Africa. In an exclusive interview with the Ukrainian Kyiv Post, the spokesman of the military intelligence service GUR Andrii Cherniak comments on Russia and the presence of the Afrika Korps in Africa.  Cherniak believes that Russia's war in Ukraine and its presence in Africa have an interaction and that the issue is high on the agenda in the Kremlin. He describes Africa as a large \"vote bank\" in the UN, which can be used to create an opposition on the international stage.  - Russia also gets access to valuable natural resources: gold, diamonds, uranium and oil, says Cherniak. He also points out that Russia can use Africa to circumvent international sanctions - partly to maintain its economy but also to obtain components for its weapons production. - In addition, Russia sees Africa as a source of cheap mercenaries for its war against Ukraine. In many cases, this happens through fraud – people are lured with promises of work but, after arriving in Russia, are sent directly into the meat grinder of the front, says Cherniak. Russian intelligence services play an important role At the center of the Kremlin's influence over Africa are the Russian intelligence services, says Cherniak. He points out that the Russian GRU and SVR are playing masterminds", "title_original": "Fortsätter satsa på Afrika: ”Stort intresse för Ryssland”", "summary_original": "Den paramilitära ryska Wagnergruppen som leddes av Jevgenij Prigozjin blev en viktig tillgång när Ryssland utökade sitt inflytande i Afrika. Gruppen var aktiv i flera länder och konflikter, men den fick ett abrupt slut sommaren 2023. Prigozjins ”marsch mot Moskva” och myteriet mot president Putin kom att bli den paramilitära gruppens slut, senare dog Prigozjin i en mystisk flygkrasch.  Det som fanns kvar av Wagnergruppen införlivades under det ryska försvarsministeriet och när Wagner klev ut ur Afrika gick istället den ryska Afrikakåren in. Enligt tidigare uppgifter består den till stor majoritet av tidigare legosoldater från just Wagnergruppen. Flera delar kan användas i kriget mot Ukraina Samtidigt som Rysslands anfallskrig i Ukraina slukar resurser har man en fortsatt närvaro i Afrika. I en exklusiv intervju med ukrainska Kyiv Post kommenterar den militära underrättelsetjänsten GUR:s talesperson Andrii Cherniak Ryssland och Afrikakårens närvaro i Afrika.  Cherniak menar att Rysslands krig i Ukraina och närvaron i Afrika har ett samspel och att frågan står högt på agendan i Kreml. Han beskriver Afrika som en stor ”röstbank” i FN, som kan användas för att skapa en opposition på den internationella scenen.  – Ryssland får också tillgång till värdefulla naturresurser: guld, diamanter, uran och olja, säger Cherniak. Han pekar också på att Ryssland kan använda Afrika för att kringgå internationella sanktioner – dels för att upprätthålla sin ekonomi men även för att få tag på komponenter till sin vapenproduktion. – Dessutom ser Ryssland Afrika som en källa till billiga legosoldater till sitt krig mot Ukraina. I många fall sker detta genom bedrägeri – människor lockas med löften om arbete men skickas efter ankomsten till Ryssland direkt in i frontens köttkvarn, säger Cherniak. Ryska underrättelsetjänster spelar en viktig roll I centrum för Kremls inflytande över Afrika står de ryska underrättelsetjänsterna, uppger Cherniak. Han pekar på att ryska GRU och SVR spelar huvudrollerna och verkar under täckmantel på ambassader och genom organisationer som den ryska staten kontrollerar.  – Antalet ryska informationsoperationer i afrikanska länder har ökat kraftigt. I minst 22 länder driver ryska underrättelsetjänster en fabrik för falska nyheter som når miljontals människor, provocerar fram våld, stöder och legitimerar militärkupper samt skrämmer representanter för civilsamhället som motsätter sig rysk inblandning, säger Cherniak. En del av arbetet görs även genom så kallade proxyorganisationer, menar Cherniak. Utåt sett ser organisationerna ut som oberoende, men i själva verket styrs de av Ryssland och används för att spä på olika konflikter i regionen.  Har tappat starka ledare och stridseffekt Samtidigt menar han att Wagnergruppens fall har påverkat operationerna på kontinenten.  – Wagners kvarlevor omorganiserades till Afrikakåren efter gruppens kollaps. I praktiken är det samma ”privata militärföretag”, men utan några framträdande ledare. Och detta verkar ha påverkat deras stridsförmåga negativt, säger Cherniak. Han lyfter bland annat att Afrikakåren haft betydande förluster i strider med rebeller i Mali.  – Trots dessa pinsamma nederlag är det dock för tidigt att tala om att Ryssland förlorar sina positioner i Afrika. Afrikakåren består av mellan 8 000 och 10 000 soldater. De fortsätter att stödja militärjuntor och olika väpnade grupper i länder över hela kontinenten, bland annat Mali, Niger och Burkina Faso, säger Cherniak.", "link": "https://www.tv4.se/artikel/3VEREcnvOjzWk9WxKB1xWx/fortsaetter-satsa-pa-afrika-stort-intresse-foer-ryssland", "date_display": "2026-06-23", "date_iso": "2026-06-23T19:48:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/afrika", "/ryssland", "/wagnergruppen", "/ukrainakonflikten", "/gur"]}, {"id": 169, "title": "We need more people like Agnes Wold in the church", "summary": "Frida Park: Trans activists and traditionalists must be able to unite for the sake of the children", "title_original": "Det behövs fler motvallskäringar som Agnes Wold i kyrkan", "summary_original": "Frida Park: Transaktivister och traditionalister måste kunna enas för barnens skull", "link": "https://www.dagen.se/ledare/det-behoevs-fler-motvallskaeringar-som-agnes-wold-i-kyrkan/10407926", "date_display": "2026-06-23", "date_iso": "2026-06-23T11:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 170, "title": "Recipients of 2026 Government Award for Voluntary Efforts in Support of Ukraine", "summary": "Yesterday, Minister for International Development Cooperation and Foreign Trade Benjamin Dousa has presented the Government’s annual award for Swedish volunteer projects in support of Ukraine. The 2026 recipients are Elly Reinolds and OperationChange.", "title_original": "Recipients of 2026 Government Award for Voluntary Efforts in Support of Ukraine", "summary_original": "Yesterday, Minister for International Development Cooperation and Foreign Trade Benjamin Dousa has presented the Government’s annual award for Swedish volunteer projects in support of Ukraine. The 2026 recipients are Elly Reinolds and OperationChange.", "link": "https://www   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
