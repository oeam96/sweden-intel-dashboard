body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }
button:hover, select:hover { background: #f8f9fa; border-color: #bbb; }
button.active { background: #007bff; color: white; border-color: #007bff; }
button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;
    height: auto;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
.tag-type { background: #e9ecef; color: #495057; }
.tag-ministry { background: #e3f2fd; color: #0d47a1; }
.tag-old { background: #ffebee; color: #c62828; }

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {
    padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
}
.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }
</style>

river Trump, som bedömer att tekniken kan motsvara så mycket som en fjärdedel av USA:s BNP. ”Reglering ligger inte för honom” AI-experten Paulina Modlitba är kritisk till Trumps utspel. – Donald Trump är en kommersiell president som drivs mycket av ekonomiska intressen, och det gör han även här. Han ser stora vinningar i att AI-bolagen får utveckla tekniken mer fritt. Reglering ligger inte riktigt för honom, säger hon. Modlitba tror inte att Trumps ord kommer att få vanliga människor att sluta oroa sig för AI. Men de kan påverka hur branschen agerar. – Det blir svårare att hitta en gemensam plattform eller utgångspunkt för att reglera tillsammans. Det är klart att vad en amerikansk president säger har påverkan. AI-experten understryker att utvecklingen måste tas på allvar, även om hon inte tror att tekniken i sig kommer att utplåna mänskligheten – som vissa varnar för. AI som en del av kapprustningen Samtidigt som Trump avfärdar AI-varningarna vill han skapa en statlig ”AI Styrka”. Enligt Modlitba kan det militära språket, tillsammans med retoriken om konkurrensen med Kina, driva på en snabbare och mer oreglerad utveckling.\n\n– Det är också ett tacksamt narrativ för att få fortsätta springa på utan reglering. AI ses som en viktig del av kapprustningen mellan USA och Kina, säger hon. Planen kan samtidigt tyda på att Trump är medveten om riskerna med utvecklingen. – Han förstår nog att det till viss del behöver kontrolleras och ses över. Men han kan inte primärt välja det narrativet  för att han måste också visa på styrka gentemot Kina och måla upp den bilden av att det är yttre krafter som USA också måste kapprusta mot,", "title_original": "Skjuter ner Trumps ord om AI: ”Väldigt opålitlig generellt”", "summary_original": "Donald Trump vill att USA ska fortsätta satsa stort på AI.  I ett långt inlägg på Truth Social beskriver presidenten AI som nästa industriella revolution, och meddelar att han vill skapa en särskild ”AI Styrka”. ”Vi kommer inte på något sätt att hi a slag i ansiktet. Inom looksmaxing – en trend för hur unga män ska…", "link": "https://www.svd.se/a/L4z371/trenden-bland-unga-killar-steroider-och-hammare?utm_medium=rss", "date_display": "2026-09-21", "date_iso": "2026-09-21T11:03:33+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "Efter skandalerna – Norge sluter upp bakom nya kungaparet", "summary": "Skandaler och Jeffrey Epstein-kopplingar till trots – norrmännen verkar redo att ge det nya…", "title_original": "Efter skandalerna – Norge sluter upp bakom nya kungaparet", "summary_original": "Skandaler och Jeffrey Epstein-kopplingar till trots – norrmännen verkar redo att ge det nya…", "link": "https://www.svd.se/a/d4A71X/efter-skandalerna-norge-sluter-upp-bakom-nya-kungaparet?utm_medium=rss", "date_display": "2026-09-21", "date_iso": "2026-09-21T11:02:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Annikas båda döttrar drabbades av ätstörning: ”Hade inte verktygen”", "summary": "Annika berättar om hur hennes två döttrar, då i övre tonåren, utvecklade ätstörningar nästan samtidigt. För familjen blev det en resa präglad av oro och svårigheter att veta hur och när man skulle ingripa. En av döttrarna fick en allvarlig allergisk reaktion till följd av sitt hetsätande, vilket ledde till att familjen snabbt fick professionell hjälp via sjukvården. Den andra dottern, som har adhd, fick stöd via psykiatrin. ”Rädd för konflikten” Annika beskriver hur svårt det var att veta vilka frågor som kunde ställas utan att förvärra situationen och hur viktigt det blev att som förälder våga stå kvar i samtalet, även när det kändes motigt. I morgon håller ”Min Stora Dag” seminariet \"Våga prata om ätstörningar\", något Annika hänvisar till.  – Jag hade förmodligen haft väldigt mycket hjälp av samtalsstödet som ”Min stora dag” erbjuder, i att ställa de här frågorna. Jag ställde dem, men vågade kanske inte bottna dem. Man är ju rädd för konflikten, säger hon. Hon berättar att det tog tid att förstå vad som pågick, särskilt eftersom familjen aldrig pratat om mat på ett värderande sätt. Hennes två döttrar hade olika förhållanden till mat där den ena tyckte om mat under uppväxten. – För oss tog det kanske ännu längre tid att upptäcka det med henne. Hon sa att hon åt hos kompisar, inte hemma. För mig var det inte konstigt.   Hennes andra dotter hade via sin ADHD-diagnos haft svårt med konsistens.  – Där har jag och min man jobbat hårt för att mat inte ska bli  ett stigma, det ska inte bli en källa till konflikt, så vi har varit otroligt noga med att aldrig prata om mat i något värderande syfte alls, säger Annika. Sociala medier ökar pressen Klara Edlund, psykolog och forskare, menar att Annikas erfarenheter delas av många föräldrar. En ny undersökning från Novus visar att 75 procent av unga mellan 13 och 17 år känner press över utseende och kropp, och att 82 procent upplever störst utseendepress från sociala medier.  Den visar även att hälften av föräldrar är oroade för deras barns relation till mat, kropp och träning och även att bli avvisad av barnet.  – Det är otroligt utbrett med press kring kropp och utseende, och mycket av den upplevda pressen kommer från sociala medier men också från andra ställen, säger Klara Edlund. Hon betonar vikten av att föräldrar vågar fråga hur barnen mår – utan att vara fördömande eller fokusera på kropp och mat. I stället handlar det om att visa att man finns kvar, även om barnet drar sig undan eller avvisar samtalet. Viktigt med stöd och tidig hjälp Både Annika och Klara Edlund framhåller att det är avgörande att söka hjälp tidigt och att föräldrar inte ska känna att de måste klara allt själva. Att våga prata om oro och söka stöd kan vara avgörande för att bryta ensamheten och ge barnet en chans att bli frisk. Annikas döttrar är i dag vuxna och har gett sitt godkännande till att deras historia berättas. För Annika var det avgörande att ta emot hjälp från sjukvården och att visa trygghet inför barnen. – Det hjälpte mig att känna mig trygg, att ta hjälp av läkare och psykologer. På något sätt kände de trygghet i att mamma känner sig trygg, pappa känner sig trygg. Vi fick ett bra bemötande och någonstans där vände det, säger Annika.", "title_original": "Annikas båda döttrar drabbades av ätstörning: ”Hade inte verktygen”", "summary_original": "Annika berättar om hur hennes två döttrar, då i övre tonåren, utvecklade ätstörningar nästan samtidigt. För familjen blev det en resa präglad av oro och svårigheter att veta hur och när man skulle ingripa. En av döttrarna fick en allvarlig allergisk reaktion till följd av sitt hetsätande, vilket ledde till att familjen snabbt fick professionell hjälp via sjukvården. Den andra dottern, som har adhd, fick stöd via psykiatrin. ”Rädd för konflikten” Annika beskriver hur svårt det var att veta vilka frågor som kunde ställas utan att förvärra situationen och hur viktigt det blev att som förälder våga stå kvar i samtalet, även när det kändes motigt. I morgon håller ”Min Stora Dag” seminariet \"Våga prata om ätstörningar\", något Annika hänvisar till.  – Jag hade förmodligen haft väldigt mycket hjälp av samtalsstödet som ”Min stora dag” erbjuder, i att ställa de här frågorna. Jag ställde dem, men vågade kanske inte bottna dem. Man är ju rädd för konflikten, säger hon. Hon berättar att det tog tid att förstå vad som pågick, särskilt eftersom familjen aldrig pratat om mat på ett värderande sätt. Hennes två döttrar hade olika förhållanden till mat där den ena tyckte om mat under uppväxten. – För oss tog det kanske ännu längre tid att upptäcka det med henne. Hon sa att hon åt hos kompisar, inte hemma. För mig var det inte konstigt.   Hennes andra dotter hade via sin ADHD-diagnos haft svårt med konsistens.  – Där har jag och min man jobbat hårt för att mat inte ska bli  ett stigma, det ska inte bli en källa till konf ger för Putins parti i iscensatt val", "summary": "President Vladimir Putins parti Enade Ryssland får som väntat fortsatt majoritet i statsduman. Partiet fick nästan 58 procent av rösterna i helgens hårt kontrollerade val. EU:s utrikeschef Kaja Kallas dömer ut valet.", "title_original": "Väntad seger för Putins parti i iscensatt val", "summary_original": "President Vladimir Putins parti Enade Ryssland får som väntat fortsatt majoritet i statsduman. Partiet fick nästan 58 procent av rösterna i helgens hårt kontrollerade val. EU:s utrikeschef Kaja Kallas dömer ut valet.", "link": "https://www.sydsvenskan.se/varlden/vantad-seger-for-putins-parti-i-iscensatt-val/", "date_display": "2026-09-21", "date_iso": "2026-09-21T09:53:26+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 90, "title": "Ex-ministern klar för tittarsuccén", "summary": "I söndags avslöjade TV4 att influencern Klara Elvgren medverkar i den sjätte säsongen av ”Förrädarna”. Under måndagen presenterades ytterligare tre deltagare, däribland Johan Pehrson, tidigare utbildningsminister och partiledare för Liberalerna. – Jag är med i denna fantastiska mordgåta, säger han i Nyhetsmorgon. – Man tar det på blodigt, blodigt allvar. Likheten med politiken I början av 1990-talet medverkade han i kanalens dejtingprogram ”Tur i kärlek”. Nu ska Sveriges tillträdande ambassadör i Portugal i stället checka in på Häringe slott.\n\nOm erfarenheten från maktens högborg och det politiska spelet blir en fördel i tävlingen är svårt att säga.\n\n– Man är ju under kontroll hela tiden i politiken, och det är en likhet. När vi spelar in den här mordgåtan är alla hela tiden observanta och kontrollerar varandra. Det blir ett enormt psykiskt tryck, faktiskt. Kanske är man lite mer van vid det som tidigare politiker, att man vet att man granskas dygnet runt i stort sett, säger Johan Pehrson. Han tackade ja eftersom det verkade roligt och som ett spännande experiment. – llokalerna stängde i Berlin och Mecklenburg-Vorpommern, stod förbundskansler Friedrich Merz framför kamerorna. Spekulationerna om att han skulle avgå satte givetvis igång. Men Merz ville i stället blicka framåt. Resultatet i Mecklenburg-Vorpommern var en katastrof, sa han, men nu gällde det att genomföra reformer och leda Tyskland vidare. Några timmar senare blev katastrofen en mardröm för Merz. Hans kristdemokrater klarade inte ens femprocentsspärren i den nordtyska delstaten. De hamnar nu utanför delstatsparlamentet, tillsammans med småpartier som Djurskyddspartiet och det rysslandsvänliga partiet BSW. Katastrof, mardröm, historiskt nederlag… Ein Desaster. Läsaren kan själv välja ord och språk för att beskriva resultatet för CDU och Merz. Hårt tryck och krav på ledarbyte Om det hade varit Storbritannien hade partiet gjort processen kort med Merz. En omröstning i partigruppen, och sedan hade det varit dags att packa flyttkartongerna. Men i Tyskland är det mer komplicerat att avsätta en regeringschef. Det räcker inte att förbundsdagen röstar mot Merz; den måste samtidigt välja en ny förbundskansler med absolut majoritet. Det är svårt att se det hända i nuläget. I stället kommer kraven på att Merz självmant ska avgå att bli allt högre. Min gissning är att han är alldeles för envis för att göra det, men om ministrar börjar avgå och ledande kristdemokrater runt om i landet sätter riktigt hård press på honom är det kanske inte omöjligt. Två personer redo att ta över Den ena är Nordrhein-Westfalens ministerpresident Hendrik Wüst: relativt ung, energisk och smart. Den andra är CSU-ledaren och Bayerns ministerpresident Markus Söder: folklig, rolig och förtjust i att lägga upp bilder på sig själv när han äter snabbmat. Nästa år väntar fem delstatsval i Tyskland. Sedan dröjer det inte länge förrän det är dags för förbundsdagsval och EU-val 2029. Frågan är dock om någon alls kan styra Tyskland just nu. Inflationen, migrationen och den hackande ekonomiska motorn har lett till r för personer med funktionsnedsättning, skiljer sig kommunernas bedömningar av LSS-boende kraftigt åt beroende på var du bor. Förbundets genomgång är begränsad. Bara sju kommuner har lämnat ut statistik, och även hos myndigheter saknas en heltäckande bild. Men skillnaderna är ändå tydliga, menar förbundet. – Det är helt avgörande var man bor. I en kommun kan i stort sett alla få insatser och stöd, medan det är tvärtom i en annan, säger Anders Lago, förbundsordförande. Enligt FUB:s genomgång får 78 procent avslag på ansökan om LSS-boende i Borås kommun, jämfört med 5 procent i Växjö. Även Vårdföretagarna har liknat situationen vid ett \"lotteri\". Anders Lago pekar på politiskt ointresse, besparingar och brist på LSS-bostäder som möjliga orsaker. Dessutom är många beslut tidsbegränsade. – Då kan du bli av med din insats, din bostad, efter ett eller två år. 25-åriga Hanna vill flytta hemifrån En som fått nej på sin ansökan är Hanna Eneström, som har Downs syndrom. – Hon måste få bli en egen person med ett eget liv, säger hennes mamma Pia Eneström. Hanna jobbar på förmiddagarna som mood manager på en restaurang och har inga fysiska begränsningar. Men hon behöver rutiner och vägledning för att klara exempelvis tvätt, inköp och plötsliga förändringar i vardagen. Ett LSS-boende med personal och personer med liknande funktionsnedsättningar skulle ge både det sociala och praktiska stöd som krävs, enligt hennes mamma Pia Eneström. – De har kanske en tacotorsdag eller en mellofredag tillsammans. Sedan säger personalen: \"Hanna, nu har tvätthögen växt\". Familjen har bekanta i andra kommuner som har barn med liknande behov som fått ett ja, medan Hanna fick ett nej av sin kommun förra året. Detta trots att kommunens egen konsult bekräftade familjens bild. Översyn av lagen Enligt Anders Lago finns det flera åtgärder som kan vidtas för att förbättra jämlikheten över landet. – Riksrevisionen har föreslagit att man ska styra upp lagen och få bort LSS-lotteriet. Det kan regeringen göra. Det behövs också en bättre uppföljning och tillsyn från staten, säger han. Sveriges Kommuner och regioner håller med FUB om att det behövs en översyn av LSS-lagen. – Praxis när det gäller bedömningarna och LSS-lagstiftningen är väldigt oklar. Dessutom har det blivit väldigt komplext när det gäller verkställigheten, och det är därför det skiljer sig så mycket mellan kommunerna, säger Åsa Furén-Thulin, sektionschef på SKR och pekar på att mycket hänt sedan lagen trädde i kraft år 1994. – Men man får inte glömma att det är fler än någonsin som får LSS-boende i dag. På tisdagen ska Hannas fall prövas i förvaltningsrätten. En process som inte alla har resurser att driva, påpekar Hannas pappa Magnus Eneström. – Det är en jädra orättvisa som inte alls är okej. Det behöver centraliseras på något sätt, säger han.", "title_original": "Förbundets varning: Rena lotteriet vem som får LSS-boende", "summary_original": "LSS-lagen ska ge personer med funktionsnedsättning möjlighet att leva som andra. Men enligt Riksförbundet FUB, som arbetar för personer med funktionsnedsättning, skiljer sig kommunernas bedömningar av LSS-boende kraftigt åt beroende på var du bor. Förbundets genomgång är begränsad. Bara sju kommuner har lämnat ut statistik, och även hos myndigheter saknas en heltäckande bild. Men skillnaderna är ändå tydliga, menar förbundet. – Det är helt avgörande var man bor. I en kommun kan i stort sett alla få insatser och stöd, medan det är tvärtom i en annan, säger Anders Lago, förbundsordförande. Enligt FUB:s genomgång får 78 procent avslag på ansökan om LSS-boende i Borås kommun, jämfört med 5 procent i Växjö. Även Vårdföretagarna har liknat situationen vid ett \"lotteri\". Anders Lago pekar på politiskt ointresse, besparingar och brist på LSS-bostäder som möjliga orsaker. Dessutom är många beslut tidsbegränsade. – Då kan du bli av med din insats, din bostad, efter ett eller två år. 25-åriga Hanna vill flytta hemifrån En som fått nej på sin ansökan är Hanna Eneström, y": "2026-09-21", "date_iso": "2026-09-21T07:38:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/lss-boende", "/lss", "/funktionsvariation", "/lagar-och-regler"]}, {"id": 111, "title": "Avslöjar bästa knepen – så kommer barnen över sin tandläkarskräck", "summary": "Studier visar att 5-15 procent av barnen fortfarande känner rädsla, men de flesta tycker att tandläkarbesöken går bra. Informationsmaterial som böcker och filmer kan också hjälpa till att förbereda både barn och föräldrar inför besöket.\n\nAtt prata med sitt barn inför första tandläkarbesöket är viktigt, men det gäller att välja sina ord. Övertandläkare Lars Fredriksson menar att föräldrar ofta omedvetet överför sin egen oro till barnet, till exempel om föräldern själv haft tandläkarskräck som liten.\n\n– Barnet är inte rädd för att du är rädd för tandläkaren. Barnet är rädd för att dina signaler inte stämmer. Det är bättre att vara öppen och förklara varför du själv är orolig, säger han. Undvik skrämmande detaljer Fredriksson råder föräldrar att inte göra en stor sak av besöket. Man ska undvika att berätta skräckhistorier från sin egen barndom eller använda ord som kan låta skrämmande. – Man ska inte dra en rövarhistoria som farfar upplevde när han gick till tandvården på 50-talet eller det mest plågsamma besöket man själv har upplevt. Berätta i stället att man går på en undersökning för att titta på alla tänder som kommit och att man känner på tanden för att se att den är hel och fin.  Lars Fredriksson tipsar också om att använda enkla verktyg som en orosmätare, något som han själv kallar ”mojometer”. Genom den får barnet visa om barnet känner sig lugnt (grönt), lite oroligt (gult) eller väldigt rädd (rött). Det kan öppna för samtal om känslor och oro. Fler förebyggande tips Lars Fredriksson har en viktig uppmaning till föräldrar om ett barn visar stor oro inför ett tandläkarbesök. – Hör av er till tandläkarmottagningen redan innan, så att vi vet om att det finns en oro. Då kan första besöket handla om att bara titta på kliniken och prova stolen, utan undersökning. Det ger en trygg bild om vad som kommer hända, säger Lars Fredriksson. Han betonar att ingen ska tvingas till behandling. – Ett barn som säger nej ska respekteras på samma sätt som att en vuxen säger nej. Tandvårdsrädslan minskar Enligt Lars Fredriksson har tandvårdsrädslan bland barn minskat över tid. Han ser det som ett resultat av både bättre förebyggande tandvård och ett mer psykosocialt bemötande.\n\n– Jag tror att det är en konsekvens av att barnen har färre hål i tänderna och vi behöver göra mycket mindre, borra till exempel. Vi berättar och visar alltid vad vi ska göra innan vi gör något. Om vi jämför med för hundra år sedan, då hade ju alla hål i princip i alla tänder, har det hänt väldigt mycket.", "title_original": "Avslöjar bästa knepen – så kommer barnen över sin tandläkarskräck", "summary_original": "Studier visar att 5-15 procent av barnen fortfarande känner rädsla, men de flesta tycker att tandläkarbesöken går bra. Informationsmaterial som böcker och filmer kan också hjälpa till att förbereda både barn och föräldrar inför besöket.\n\nAtt prata med sitt barn inför första tandläkarbesöket är viktigt, men det gäller att välja sina ord. Övertandläkare Lars Fredriksson menar att föräldrar ofta omedvetet överför sin egen oro till barnet, till exempel om föräldern själv haft tandläkarskräck som liten.\n\n– Barnet är inte rädd för att du är rädd för tandläkaren. Barnet är rädd för att dina signaler inte stämmer. Det är bättre att vara öppen och förklara varför du själv är orolig, säger han. Undvik skrämmande detaljer Fredriksson råder föräldrar att inte göra en stor sak av besöket. Man ska undvika att berätta skräckhistorier från sin egen barndom eller använda ord som kan låta skrämmande. – Man ska inte dra en rövarhistoria som farfar upplevde när han gick till tandvården på 50-talet eller det mest plågsamma besöket a, mörka roman om begär…", "title_original": "När influencern är en parasit", "summary_original": "En dagisfröken och en influencer kommer varandra nära i Therese Bohmans nya, mörka roman om begär…", "link": "https://www.svd.se/a/QJzXr8/nar-influencern-ar-en-parasit?utm_medium=rss", "date_display": "2026-09-21", "date_iso": "2026-09-21T07:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Mötet mellan influeraren och pedagogen liknar en uppgörelse på savannen", "summary": "I ”Kapitalet” börjar modeinflueraren Alice dotter på förskolan där Emma arbetar. Trots romanens förutsägbara intrig visar Therese Bohman att hon är en skicklig författare – om man orkar ta människors liv på sociala medier på allvar, skriver Jesper Högström.", "title_original": "Mötet mellan influeraren och pedagogen liknar en uppgörelse på savannen", "summary_original": "I ”Kapitalet” börjar modeinflueraren Alice dotter på förskolan där Emma arbetar. Trots romanens förutsägbara intrig visar Therese Bohman att hon är en skicklig författare – om man orkar ta människors liv på sociala medier på allvar, skriver Jesper Högström.", "link": "https://www.dn.se/kultur/motet-mellan-influeraren-och-pedagogen-liknar-en-uppgorelse-pa-savannen/", "date_display": "2026-09-21", "date_iso": "2026-09-21T07:10:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Här är nya juryn i programmet", "summary": "Tina Nordström bildade jury med kockarna Tommy Myllymäki och Tom Sjöstedt i våras. När långköraren kommer tillbaka nästa år gör hon och Tom Sjöstedt i stället Niklas Ekstedt sällskap i en helt ny konstellation. Beskedet kommer efter att Mischa Billing lämnade programmet i samband med att kändisversionen gick i mål i september. – Det känns så kul att välkomna Tom, Niklas och Tina till juryn för Sveriges mästerkock 2027. Erkända, e ver USA:s inrikesdepartement på X. ”Den illegala utlänningens läge är stabilt, och han är i federalt förvar i väntan på att avlägsnas från landet”, skriver myndigheten. De uppger att de själva kommer att utreda händelsen, tillsammans med FBI. Till CNN säger Kate Lincoln-Goldfinch, advokaten som representerar Perez familj, att hon inte kan bekräfta hans migrationsstatus. – Utifrån den information vi har tillgång till kom han in i USA på laglig väg, säger hon. CNN skriver att Perez arbetar med att köra ut mat för företaget Doordash. ”Gör mig olycklig och arg” Några hundra demonstranter samlades på platsen efter händelsen. ICE har tidigare varit inblandade i flera skjutningar som lett till stora protester i USA. Fyra personer, två av dem medborgare i USA, har skjutits ihjäl av ICE eller andra federala agenter under insatser mot migranter i liberala städer som Minneapolis och Los Angeles. Austins demokratiska borgmästare Kirk Watson säger att han är arg, men inte överraskad, över vad som hänt. – Att en person skjuts i Austin av någon som utger sig för att upprätthålla lag och ordning, särskilt när det är ICE, är något som gör mig olycklig och arg, säger han. – Det ligger i ICE:s natur, på sättet de bedriver sin verksamhet nuförtiden. Åklagarkontoret i Travis county, länet i Texas där skjutningen ägde rum, har bett om att få göra en oberoende utredning tillsammans med Austinpolisen. ”Vi ber den federala regeringen ge oss tillgång till bevismaterialet. Som tidigare skett i andra jurisdiktioner, är det möjligt att det förekommit brott mot lagarna i delstaten”, skriver de i ett pressmeddelande.", "title_original": "28-årig man skjuten av ICE", "summary_original": "Wilber Rafael Garces Perez, 28, är allvarligt skadad efter att ha blivit skjuten av en agent från ICE, alltså den amerikanska migrationspolisen. Skjutningen ägde rum på vid lunchtid i Texas huvudstad Austin. Efter en kortare jakt till fots sköt agenten honom i överkroppen. Körde ut mat Perez är en odokumenterad mi versitetssjukhuset i Örebro. Genom ett skuggschema har flera läkare kunnat få betalt utan att vara på plats på sjukhuset, enligt NA.", "link": "https://www.dn.se/sverige/lakarchef-sprang-ultralopp-fick-lon-samtidigt/", "date_display": "2026-09-21", "date_iso": "2026-09-21T05:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Alex Schulman: Redan nu är jag trött på talmannens kakfat", "summary": "Det ser ut som att det kan ta tid att få en ny regering på plats. Vi vet att talmannen Andreas Norlén orkar – men orkar vi med alla chokladbiskvier och punschrullar?", "title_original": "Alex Schulman: Redan nu är jag trött på talmannens kakfat", "summary_original": "Det ser ut som att det kan ta tid att få en ny regering på plats. Vi vet att talmannen Andreas Norlén orkar – men orkar vi med alla chokladbiskvier och punschrullar?", "link": "https://www.dn.se/sverige/alex-schulman-redan-nu-ar-jag-trott-pa-talmannens-kakfat/", "date_display": "2026-09-21", "date_iso": "2026-09-21T04:34:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Svenska tekniken kan förhindra skoldåd – men används inte här", "summary": "Datavetaren Lisa Kaati vid Stockholms universitet har utvecklat AI-systemet Dechefr. Programmet har testats med hjälp av underlag från FBI-agenter och används för att hitta varningssignaler i text från sociala medier och nätchattar – tecken på att en person kan vara på väg att begå ett våldsdåd. Några av riskfaktorerna AI:n tränats på att känna igen är till exempel att personen uttrycker stark beundran för tidigare dåd, skapar eftermälen efter sig på internet och själv har planer på dåd. – Allt ifrån att man ser att en individ tydligt är en del av en ideologi där man accepterar våldsanvändning. Det kan också vara att man är väldigt inspirerad av tidigare gärningspersoner. Att man delar bilder på dem i en positiv bemärkelse, säger Lisa Kaati. Används redan i USA När systemet identifierat en riskperson analyseras resultatet av mänskliga experter, som sedan kan uppmärksamma bland annat lärare och föräldrar. I USA är skolattacker ett återkommande problem. Många skolor har därför särskilda grupper som arbetar med att förebygga skoldåd.  Lisa Kaatis AI-verktyg används redan på flera skolor i landet som en del av arbetet med att förhindra våldsdåd. I Sverige används däremot inte systemet, och många potentiella riskpersoner går under radarn. – Ansvaret hamnar på en individuell lärare som själv måste uppmärksamma och förstå alla signaler. Det är väldigt svårt när man har stora klasser och olika ämnen. Det är inte ens säkert att man har samma elev hela tiden, säger hon. Skoldådet i Fagersta: ”Ett klassiskt fall” Den 21 augusti gick en man till attack med svärd inne på Brinellskolan i Fagersta. En 17-årig flicka dödades. Den misstänkte gärningsmannen kopplas till ett konto på sociala medier där korta klipp, så kallade edits, som glorifierar tidigare våldsdåd och gärningsmän har spridits. Lisa Kaati vill inte spekulera i huruvida systemet skulle ha kunnat identifiera den misstänkta gärningsmannen som en potentiell risk, men menar att gärningsmannen delar många av de riskfaktorer som AI:n är tränad på. – Från det man sett från medierapporteringen så känns det verkligen som ett klassiskt fall där vi ser jättemånga varningsindikatorer, just den här beundran för tidigare gärningspersoner, att man postar edits. Det är ju ett starkt varningstecken, säger hon. Vill ta efter USA Lisa Kaati menar att Sverige behöver bli bättre på att arbeta förebyggande mot skolattacker genom att tidigare upptäcka varningssignaler och sätta in stödinsatser. Hon menar att Sverige borde inspireras av USA:s arbete med att förhindra dåd. – Vi behöver ett strukturerat sätt att försöka identifiera hot, kunna göra bra bedömningar, följa upp bedömningar vilket ju också är jätteviktigt. Vi måste ha någon form av system som kan hjälpa och stötta oss med den här processen. – Det kommer alltid att ske våldsdåd i samhället. Det finns alltid folk som går under radarn, men vi skulle i alla fall kunna säga att vi har gjort det bästa vi kan, säger hon.", "title_original": "Svenska tekniken kan förhindra skoldåd – men används inte här", "summary_original": "Datavetaren Lisa Kaati vid Stockholms universitet har utvecklat AI-systemet Dechefr. Programmet har testats med hjälp av underlag från FBI-agenter och används för att hitta varningssignaler i text från sociala medier och nätchattar – tecken på att en person kan vara på väg att begå ett våldsdåd. Några av riskfaktorerna AI:n tränats på att känna igen är till exempel att personen uttrycker stark beundran för tidigare dåd, skapar eftermälen efter sig på internet och själv har planer på dåd. – Allt ifrån att man ser att en individ tydligt är en del av en ideologi där man accepterar våldsanvändning. Det kan också vara att man är väldigt inspirerad av tidigare gärningspersoner. Att man delar bilder på dem i en positiv bemärkelse, säger Lisa Kaati. Används redan i USA När systemet identifierat en riskperson analyseras resultatet av mänskliga experter, som sedan kan uppmärksamma bland annat lärare och föräldrar. I USA är skolattacker ett återkommande problem. Många skolor har därför särskilda grupper som arbetar med att förebygga skoldåd.  Lisa Kaatis AI-verktyg används redan på flera skolor i landet som en del av arbetet med att förhindra våldsdåd. I Sverige används däremot inte systemet, och många potentiella riskpersoner går under radarn. – Ansvaret hamnar på en individuell lärare som själv måste uppmärksamma och förstå alla signaler. Det är väldigt svårt när man har stora klasser och olika ämnen. Det är inte ens säkert att man har samma elev hela tiden, säger hon. Skoldådet i Fagersta: ”Ett klassiskt fall” Den 21 augusti gick en man till attack med svärd inne på Brinellskolan i Fagersta. En 17-årig flicka dödades.  artificiell intelligens, men slutade i en diskussion om risken att AI utplånar mänskligheten. När Open AI bad ett antal AI-agenter att utföra en uppgift hade utvecklarna ingen aning om att agenterna på egen hand skulle genomföra en hackerattack, helt utan mänsklig inblandning. Händelsen har fått AI-branschen att börja oroa sig – kommer de kunna tämja tekniken? Programledare: Måns Mosesson. Med Simon Campanello, vetenskapsreporter på DN. Producenter: Elinor Ahlborn och Maria Hansson Botin.", "title_original": "Nya larmen: Kommer AI utplåna mänskligheten?", "summary_original": "Det var tänkt som ett test av en ny typ av artificiell intelligens, men slutade i en diskussion om risken att AI utplånar mänskligheten. När Open AI bad ett antal AI-agenter att utföra en uppgift hade utvecklarna ingen aning om att agenterna på egen hand skulle genomföra en hackerattack, helt utan mänsklig inblandning. Händelsen har fått AI-branschen att börja oroa sig – kommer de kunna tämja tekniken? Programledare: Måns Mosesson. Med Simon Campanello, vetenskapsreporter på DN. Producenter: Elinor Ahlborn och Maria Hansson Botin.", "link": "https://www.dn.se/podd/spotlight/nya-larmen-kommer-ai-utplana-manskligheten/", "date_display": "2026-09-20", "date_iso": "2026-09-20T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "FN:s högkvarter i New York nära kollaps: ”Det är sorgligt”", "summary": "Under måndagen samlas FN:s generalförsamling i New York för ett toppmöte om multilateralism. Samtidigt står högkvarteret, den 155 meter och 39 våningar höga FN-skrapan, och förfaller, rapporterar norska Dagbladet. – Det låter dumt att säga att det inte fungerar, men det är världsorganisationen vi pratar om. Det hade varit trevligt att ha stolar utan hål, säger Norges FN-ambassadör Merete Fjeld Brattested till tidningen.  Stolarnas skick har blivit så dåligt att församlingens president bönat och bett om nya.  ”Stolarna där medlemsstaterna sitter är synligt slitna och fransade – en situation som många har påpekat är ohållbar. Om ingenting görs blir budskapet att kammaren, som är hjärtat för global diplomati, har tillåtits förfalla”, skriver presidenten Annalena Baerbock, i ett brev till de 193 medlemsstaterna daterat den 2 juni, som norska Dagbladet tagit del av. USA betalar inte för sig Bygganden bär allt tydligare spår av en organisation som är i fritt fall ekonomiskt. Stolarna är bara det senaste exemplet. – Det finns mycket annat i livet som är viktigare än nya stolar. Men jag tycker det är sorgligt att de börjar bli så slitna att generalförsamlingens ordförande måste skriva till medlemsländerna och be om pengar till en fond för att kunna köpa in nya, säger Merete Fjeld Brattested. Den senaste renoveringen av bygganden ägde rum 2014. Nästan överallt syns nu tecken på slitage och dåligt underhåll, uppger ambassadören. Orsaken till förfallet, och att FN står inför en ekonomisk kris, beror på att flera medlemsländer, däribland USA, inte prioriterat att betala medlemsavgifterna, i en tid då omvärlden blir allt mer orolig. Även generalsekreteraren António Guterres har slagit larm om saken. ”Antingen respekterar alla medlemsstater sina åtaganden att betala fullt ut och i tid – eller så måste medlemsstaterna genomgripande reformera våra finansiella regler för att förhindra en nära förestående ekonomisk kollaps”, skrev Guterres i ett brev till medlemsländerna tidigare i år enligt AP. ”En kapplöpning mot konkurs” USA:s skuld till organisationen uppgår enligt Reuters till fyra miljarder dollar. Administrationen är i färd med att betala av en del av skulden, cirka 725 miljoner dollar av den totala summan. Enligt den tidigare FN-medarbetaren Eugene Chen ”kommer det hålla skeppet flytande ett tag”. Men USA måste göra ytterligare betalningar om de inte vill förlora sin rösträtt i församlingen, uppger han. Samtidigt är USA inte ensamt om att inte ha betalat in hela avgiften. Tillsammans med Kina är USA dessutom det land som bidrar mest ekonomiskt till organisationen. En krävande ekonomi är heller inget nytt för FN. De senaste åren har flera besparingsåtgärder genomförts. 2024 inleddes ett omfattande program för att strama åt omkostnaderna, varpå flera bygg- och underhållsprojekt sattes på paus. 2026 minskades budgeten ner med sju procent jämfört med föregående år, och Guterres påtalade då åter riskerna med försenade inbetalningar från medlemsländerna. – Det innebär en kapplöpning mot konkurs, sade han. Nedskärningarna har bland annat lett till att FN-personal omplacerats från dyra städer som New York och Genève till Nairobi och andra billigare platser. Dyra hyresavtal har sagts upp och personal har fått flytta till billigare boendelösningar. Därtill har organisationen infört kortare öppettider för sina lokaler, och skruvat ner termostaten under vintern för att hålla nere värmekostnaderna i byggnaderna. Ambassadören: Prioriterar ”kampen mot woke” USA:s president Donald Trump har både risat och rosat FN. Men trots att han i perioder varit en öppen kritiker av organisationen innebär hans tillträde på presidentposten inte nödvändigtvis att det har blivit svårare att få USA att betala för sig – så har det alltid varit, menar den norska ambassadören. – Där vi märker att amerikansk politik har förändrats är inom de områden som handlar om värderingsfrågor. Där vi sedan andra världskriget har stått tillsammans med USA i frågor som mänskliga rättigheter, de globala målen för hållbar utveckling och jämställdhet, tar de nu istället upp kampen mot ”woke”, säger Merete Fjeld Brattested till Dagbladet. Samtidigt behövs USA som en viktig partner i organisationen. Den rådande omvärldssituationen kräver också ett fungerande FN, anser hon. Utöver den tuffa ekonomiska situationen, har också arbetet i FN:s säkerhetsråd de senaste åren försvårats kraftigt av att två av de permanenta medlemmarna, Ryssland och USA, var och en har gått i krig, i Ukraina respektive Iran.", "title_original": "FN:s högkvarter i New York nära kollaps: ”Det är sorgligt”", "summary_original": "Under måndagen samlas FN:s generalförsamling i New York för ett toppmöte om multilateralism. Samtidigt står högkvarteret, den 155 meter och 39 våningar höga FN-skrapan, och förfaller, rapporterar norska Dagbladet. – Det låter dumt att säga att det inte fungerar, men det är världsorganisationen vi pratar om. Det hade varit trevligt att ha stolar utan hål, säger Norges FN-ambassadör Merete Fjeld Brattested till tidningen.  Stolarnas skick har blivit så dåligt att församlingens president bönat och bett om nya.  ”Stolarna där medlemsstaterna sitter är synligt slitna och fransade – en situation som många har påpekat är ohållbar. Om ingenting görs blir budskapet att kammaren, som är hjärtat för global diplomati, har tillåtits förfalla”, skriver presidenten Annalena Baerbock, i ett brev till de 193 medlemsstaterna daterat den 2 juni, som norska Dagbladet tagit del av. USA betalar inte för sig Bygganden bär allt tydligare spår av en organisation som är i fritt fall ekonomiskt. Stolarna är bara det senaste exemplet. – Det finns mycket annat i livet som är viktigare än nya stolar. Men jag tycker det är sorgligt att de börjar bli så slitna att generalförsamlingens ordförande måste skriva till medlemsländerna och be om pengar till en fond för att kunna köpa in nya, säger Merete Fjeld Brattested. Den senaste renoveringen av bygganden ägde rum 2014. Nästan överallt syns nu tecken på slitage och dåligt underhåll, uppger ambassadören. Orsaken till förfallet, och att FN står inför en ekonomisk kris, beror på att flera medlemsländer, däribland USA, inte prioriterat att betala medlemsavgifterna, i en tid då omvärlden blir allt mer orolig. Även generalsekreteraren António Guterres har slagit larm om saken. ”Antingen respekterar alla medlemsstater sina åtaganden att betala fullt ut och i tid – eller så måste medlemsstaterna genomgripande reformera våra finansiella regler för att förhindra en nära förestående ekonomisk kollaps”, skrev Guterres i ett brev till medlemsländerna tidigare i år enligt AP. ”En kapplöpning mot konkurs” USA:s skuld till organisationen uppgår enligt Reuters till fyra miljarder dollar. Administrationen är i färd med att betala av en del av skulden, cirka 725 miljoner dollar av den totala summan. Enligt den tidigare FN-medarbetaren Eugene Chen ”kommer det hålla skeppet flytande ett tag”. Men USA måste göra ytterligare betalningar om de inte vill förlora sin rösträtt i församlingen, uppger han. Samtidigt är USA inte ensamt om att inte ha betalat in hela avgiften. Tillsammans med Kina är USA dessutom det land som bidrar mest ekonomiskt till organisationen. En krävande ekonomi är heller inget nytt för FN. De senaste åren har flera besparingsåtgärder genomförts. 2024 inleddes ett omfattande program för att strama åt omkostnaderna, varpå flera bygg- och underhållsprojekt sattes på paus. 2026 minskades budgeten ner med sju procent jämfört med föregående år, och Guterres påtalade då åter riskerna med försenade inbetalningar från medlemsländerna. – Det innebär en kapplöpning mot konkurs, sade han. Nedskärningarna har bland annat lett till att FN-personal omplacerats från dyra städer som New York och Genève till Nairobi och andra billigare platser. Dyra hyresavtal har sagts upp och personal har fått flytta till billigare boendelösningar. Därtill har organisationen infört kortare öppettider för sina lokaler, och skruvat ner termostaten under vintern för att hålla nere värmekostnaderna i byggnaderna. Ambassadören: Prioriterar ”kampen mot woke” USA:s president Donald Trump har både risat och rosat FN. Men trots att han i perioder varit en öppen kritiker av organisationen innebär hans tillträde på presidentposten inte nödvändigtvis att det har blivit svårare att få USA att betala för sig – så har det alltid varit, menar den norska ambassadören. – Där vi märker att amerikansk politik har förändrats är inom de områden som handlar om värderingsfrågor. Där vi sedan andra världskriget har stått tillsammans med USA i frågor som mänskliga rättigheter, de globala målen för hållbar utveckling och jämställdhet, tar de nu istället upp kampen mot ”woke”, säger Merete Fjeld Brattested till Dagbladet. Samtidigt behövs USA som en viktig partner i organisationen. Den rådande omvärldssituationen kräver också ett fungerande FN, anser hon. Utöver den tuffa ekonomiska situationen, har också arbetet i FN:s säkerhetsråd de senaste åren försvårats kraftigt av att två av de permanenta medlemmarna, Ryssland och USA, var och en har gått i krig, i Ukraina respektive Iran.", "link": "https://www.tv4.se/artikel/5OQHICv7jqoyct2jsOFdnN/fn-s-hoegkvarter-i-new-york-naera-kollaps-det-aer-sorgligt", "date_display": "2026-09-20", "date_iso": "2026-09-20T20:34:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/utrikes", "/fn", "/new-york", "/usa"]}, {"id": 142, "title": "Erik Reinfeldt flygs akut till sjukhus", "summary": "I torsdagens avsnitt av ”Robinson” undersöks Erik Reinfeldt, son till tidigare statsministern Fredrik Reinfeldt, av sjukvårdspersonal. Han har drabbats av en kraftig allergisk reaktion efter att ha blivit stucken av en insekt på benet. – Jag vet inte ens vad det kallas, om det var en geting eller någonting som stack mig, säger han bland annat i programmet. ”Börjar domna bort” När besvären inte går över berättar Erik Reinfeldt för en lagkamrat att det ”börjar blöda och svälla”. När sjukvårdspersonalen undersöker benet på nytt berättar han också att han är allergisk mot bin.\n\n– Det kanske jag skulle sagt i början. Det börjar domna bort lite i benet, säger Erik. I avsnittet efteråt, veckans sista, säger Martin Järborg att Erik Reinfeldt inte kommer att återvända till programmet. – Erik blev dålig efter gårdagens tävling och togs in för observation. Jag kan försäkra er om att han mår bra, det är ingen fara med Erik men han kommer inte komma tillbaka till Robinson, säger programledaren. Tvingas lämna Bilder från produktionen visar hur han samma kväll som incidenten flygs akut till sjukhus i Panama City. På bilderna syns han sitta i rullstol, iklädd sjukhuskläder, medan han transporteras mellan en bil och ett flygplan. TV4 Nyheterna har sökt Erik Reinfeldt.", "title_original": "Erik Reinfeldt flygs akut till sjukhus", "summary_original": "I torsdagens avsnitt av ”Robinson” undersöks Erik Reinfeldt, son till tidigare statsministern Fredrik Reinfeldt, av sjukvårdspersonal. Han har drabbats av en kraftig allergisk reaktion efter att ha blivit stucken av en insekt på benet. – Jag vet inte ens vad det kallas, om det var en geting eller någonting som stack mig, säger han bland annat i programmet. ”Börjar domna bort” När besvären inte går över berättar Erik Reinfeldt för en lagkamrat att det ”börjar blöda och svälla”. När sjukvårdspersonalen undersöker benet på nytt berättar han också att han är allergisk mot bin.\n\n– Det kanske jag skulle sagt i början. Det börjar domna bort lite i benet, säger Erik. I avsnittet efteråt, veckans sista, säger Martin Järborg att Erik Reinfeldt inte kommer att återvända till programmet. – Erik blev dålig efter gårdagens tävling och togs in för observation. Jag kan försäkra er om att han mår bra, det är ingen fara med Erik men han kommer inte komma tillbaka till Robinson, säger programledaren. Tvingas lämna Bilder från produktionen visar hur han samma kväll som incidenten flygs akut till sjukhus i Panama City. På bilderna syns han sitta i rullstol, iklädd sjukhuskläder, medan han transporteras mellan en bil och ett flygplan. TV4 Nyheterna har sökt Erik Reinfeldt.", "link": "https://www.tv4.se/artikel/1H8WJvhMeVvjK2hQ5O18hR/robinsondeltagaren-flygs-akut-till-sjukhus", "date_display": "2026-09-20", "date_iso": "2026-09-20T19:37:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 143, "title": "Lockar med falska snyfthistorier från Elgiganten: ”Skamlöst pack!”", "summary": "Bedragare använder Elgigantens varumärke i en ny våg av falska Facebook-annonser. Genom påhittade berättelser om missnöjda eller uppsagda anställda lockas användare till falska webbsidor där deras kortuppgifter kan stjälas.  Enligt SSF Stöldskyddsföreningen sprids annonserna från flera olika Facebook-sidor och leder vidare till klonade kopior av Elgigantens webbplats. Där utlovas populära produkter som mobiltelefoner eller hörlurar till kraftigt rabatterade priser. Men syftet är långt ifrån att sälja billig elektronik. – Du lägger in dina kortuppgifter, och då menar jag namn och kortnummer. Då har bedragarna dem, säger Paul Pintér, expert på dataintrång på SSF Stöldskyddsföreningen. Bygger på falska historier  I annonserna används påhittade berättelser om personer som påstås ha blivit felbehandlade eller uppsagda av Elgiganten. ”Fy fan, Elgiganten! Vilket skamlöst pack. Min mamma la tre år av sitt liv på att jobba på Elgiganten. Men så fort hon fyllde 50 blev hon avskedad som om hon inte betydde någonting. Därför vill jag dela något som bara personal och deras familjer brukar känna till”, skriver en användare på Facebook.  Det som användaren syftar på är en intern webbsida där allmänheten påstås kunna köpa produkter till personalpris. När användaren klickar på länken hamnar den däremot inte på Elgigantens hemsida. – Tittar man på länken så går den absolut inte till Elgiganten utan till en falsk hemsida som ser ut som Elgigantens hemsida, säger han. ”En bra deal vill ingen passa upp” Enligt Pintér spelar bedragarna på människors vilja att göra ett fynd. – Nummer ett: en bra deal vill ingen passa upp. Får man ett bra erbjudande så kör man gärna på det. Det är mänsklig natur, säger han. Bedrägeriet är enligt honom en del av ett större mönster där kända företag används för att skapa förtroende. Tidigare har liknande upplägg använt sig av kändisar, falska nyhetsartiklar och påstådda investeringserbjudanden. – Nu pratar vi om Elgiganten, men det skulle egentligen kunna vara vilket stort företag som helst som folk känner till, säger Pintér. Riskerar att få lämna ut kortuppgifter På de falska sidorna får besökarna ofta svara på några frågor innan de erbjuds att köpa en produkt till ett osannolikt lågt pris. Därefter uppmanas de att fylla i sina kortuppgifter. – Det är ett falskt formulär. Du lägger in dina kortuppgifter och de går direkt till bedragarna, säger Pintér. Så undviker du bluffen Hans viktigaste råd är att alltid kontrollera vilken webbadress länken faktiskt leder till. – Man ska inte bara gå på att det står Elgiganten i annonsen. Titta på adressen. Är det inte Elgigantens riktiga webbadress ska man inte klicka vidare, säger han. Samtidigt tror han inte att den här typen av bedrägerier kommer att försvinna. – Det här är inte sista gången vi ser den här typen av bedrägerier. Det kan jag garantera till hundra procent. Eftersom det verkar vara lyckat kommer det andra inlägg med nya erbjudanden, säger Pintér.", "title_original": "Lockar med falska snyfthistorier från Elgiganten: ”Skamlöst pack!”", "summary_original": "Bedragare använder Elgigantens varumärke i en ny våg av falska Facebook-annonser. Genom påhittade berättelser om missnöjda eller uppsagda anställda lockas användare till falska webbsidor där deras kortuppgifter kan stjälas.  Enligt SSF Stöldskyddsföreningen sprids annonserna från flera olika Facebook-sidor och leder vidare till klonade kopior av Elgigantens webbplats. Där utlovas populära produkter som mobiltelefoner eller hörlurar till kraftigt rabatterade priser. Men syftet är långt ifrån att sälja billig elektronik. – Du lägger in dina kortuppgifter, och då menar jag namn och kortnummer. Då har bedragarna dem, säger Paul Pintér, expert på dataintrång på SSF Stöldskyddsföreningen. Bygger på falska historier  I annonserna används påhittade berättelser om personer som påstås ha blivit felbehandlade eller uppsagda av Elgiganten. ”Fy fan, Elgiganten! Vilket skamlöst pack. Min mamma la tre år av sitt liv på att jobba på Elgiganten. Men så fort hon fyllde 50 blev hon avskedad som om hon inte betydde någonting. Därför vill jag dela något som bara personal och deras familjer brukar känna till”, skriver en användare på Facebook.  Det som användaren syftar på är en intern webbsida där allmänheten påstås kunna köpa produkter till personalpris. När användaren klickar på länken hamnar den däremot inte på Elgigantens hemsida. – Tittar man på länken så går den absolut inte till Elgiganten utan till en falsk hemsida som ser ut som Elgigantens hemsida, säger han. ”En bra deal vill ingen passa upp” Enligt Pintér spelar bedragarna på människors vilja att göra ett fynd. – Nummer ett: en bra deal vill ingen passa upp. Får man ett bra erbjudande så kör man gärna på det. Det är mänsklig natur, säger han. Bedrägeriet är enligt honom en del av ett större mönster där kända företag används för att skapa förtroende. Tidigare har liknande upplägg använt sig av kändisar, falska nyhetsartiklar och påstådda investeringserbjudanden. – Nu pratar vi om Elgiganten, men det skulle egentligen kunna vara vilket stort företag som helst som folk känner till, säger Pintér. Riskerar att få lämna ut kortuppgifter På de falska sidorna får besökarna ofta svara på några frågor innan de erbjuds att köpa en produkt till ett osannolikt lågt pris. Därefter uppmanas de att fylla i sina kortuppgifter. – Det är ett falskt formulär. Du lägger in dina kortuppgifter och de går direkt till bedragarna, säger Pintér. Så undviker du bluffen Hans viktigaste råd är att alltid kontrollera vilken webbadress länken faktiskt leder till. – Man ska inte bara gå på att det står Elgiganten i annonsen. Titta på adressen. Är det inte Elgigantens riktiga webbadress ska man inte klicka vidare, säger han. Samtidigt tror han inte att den här typen av bedrägerier kommer att försvinna. – Det här är inte sista gången vi ser den här typen av bedrägerier. Det kan jag garantera till hundra procent. Eftersom det verkar vara lyckat kommer det andra inlägg med nya erbjudanden, säger Pintér.", "link": "https://www.tv4.se/artikel/5rQSRdEZz5Mrw2LyypIrVG/lockar-med-falska-snyfthistorier-fran-elgiganten-skamloest-pack", "date_display": "2026-09-20", "date_iso": "2026-09-20T18:24:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/brott-och-straff", "/stold", "/stoldskyddsforeningen", "/stolder", "/bedragerier", "/bedragare", "/facebook", "/kallafakta/bluffannonserpafacebook"]}, {"id": 144, "title": "Han tillagade Gynnings påfågel: ”Den var ju jättevacker”", "summary": "Efter att Carolina Gynnings påfågel hamnat hemma hos Edward Blom fick kocken Fredrik Rickardsson ett ovanligt uppdrag av sin goda vän Tobias Strede, som även han är kock. – Han ringde och frågade: ”Kan du tillaga en påfågel?”. Och det har ju jag aldrig gjort förut. Men fågel är fågel, så jag sa att ja, det kan jag väl göra, säger Fredrik Rickardsson. Påfågeln blev omskriven efter att Gynning berättat att den attackerade både familjen och grannar. Till slut avlivades djuret, och i stället för att kasta köttet kontaktades Edward Blom. När Rickardsson tackade ja till uppdraget visste han dock inte vad som väntade. – Jag visste inte att den var hel, med fjädrar och hela kittet. Men jag har ju plockat fåglar förut, så det var inga konstigheter.  ”Stört snygg” På nära håll gjorde fågeln ett gott intryck på Rickardsson. – Den var ju jättevacker. Alltså, vilken fjäderdräkt. Den var stört snygg. Det var nästan synd att plocka den, säger han. Påfågeln tillagades hemma hos Edward Blom. Rickardsson förklarar hur de tog vara på så mycket som möjligt av den. – Vi plockade den och vi brände av pennorna. Sen började vi egentligen stycka ner den och tillaga den som jag brukar tillaga lite större fåglar. Låren bräserades tillsammans med grönsaker och fond, medan bröstköttet tillagades separat. Lever och hjärta användes till en sås. – Man blancherar den lite lätt i saltat vatten och sen la vi in massa goa örter och äpplen. Sedan stekte vi den och lade in den i ugnen. Det blev väldigt gott, säger han. Så smakade påfågeln Trots att Rickardsson tillagat många olika sorters fåglar hade han aldrig tidigare provat påfågel. Enligt honom påminde smaken delvis om kyckling, men med tydligare inslag av vilt. – Det fanns också vilttoner i den som jag tyckte var väldigt goda. Jag skulle säga att den var väldigt lik en pärlhöna, som är en blandning av kyckling och vildfågel. ”Hade ingen aning” Till en början hade Rickardsson ingen aning om vem fågeln hade tillhört.  – Jag hade ingen aning om att det var Carolina Gynnings påfågel, men det förklarade Edward när vi var på plats, säger han. När bilder från tillagningen publicerades på sociala medier började kommentarerna rulla in. Då insåg Rickardsson hur välkänd fågeln var sedan tidigare.  – Folk skrev: ”Men det är ju Carolina Gynnings påfågel”. Jag bara: ”Hur vet ni det?” Trots uppståndelsen ser han tillbaka på uppdraget med värme. – Det var en jätterolig grej. Och jag menar, istället för att bara gräva ner den så var det roligt att prova tillaga den och äta den. Nu när du både tillagat och smakat påfågel, skulle du rekommendera andra att äta det? – Ja, alltså är det någon som får tag i en påfågel så rekommenderar jag det absolut. Jag tycker att smaken var god. Hade man fått den lite mer mör så hade den varit helt fantastisk.", "title_original": "Han tillagade Gynnings påfågel: ”Den var ju jättevacker”", "summary_original": "Efter att Carolina Gynnings påfågel hamnat hemma hos Edward Blom fick kocken Fredrik Rickardsson ett ovanligt uppdrag av sin goda vän Tobias Strede, som även han är kock. – Han ringde och frågade: ”Kan du tillaga en påfågel?”. Och det har ju jag aldrig gjort förut. Men fågel är fågel, så jag sa att ja, det kan jag väl göra, säger Fredrik Rickardsson. Påfågeln blev omskriven efter att Gynning berättat att den attackerade både familjen och grannar. Till slut avlivades djuret, och i stället för att kasta köttet kontaktades Edward Blom. När Rickardsson tackade ja till uppdraget visste han dock inte vad som väntade. – Jag visste inte att den var hel, med fjädrar och hela kittet. Men jag har ju plockat fåglar förut, så det var inga konstigheter.  ”Stört snygg” På nära håll gjorde fågeln ett gott intryck på Rickardsson. – Den var ju jättevacker. Alltså, vilken fjäderdräkt. Den var stört snygg. Det var nästan synd att plocka den, säger han. Påfågeln tillagades hemma hos Edward Blom. Rickardsson förklarar hur de tog vara på så mycket som möjligt av den. – Vi plockade den och vi brände av pennorna. Sen började vi egentligen stycka ner den och tillaga den som jag brukar tillaga lite större fåglar. Låren bräserades tillsammans med grönsaker och fond, medan bröstköttet tillagades separat. Lever och hjärta användes till en sås. – Man blancherar den lite lätt i saltat vatten och sen la vi in massa goa örter och äpplen. Sedan stekte vi den och lade in den i ugnen. Det blev väldigt gott, säger han. Så smakade påfågeln Trots att Rickardsson tillagat många olika sorters fåglar hade han aldrig tidigare provat påfågel. Enligt honom påminde smaken delvis om kyckling, men med tydligare inslag av vilt. – Det fanns också vilttoner i den som jag tyckte var väldigt goda. Jag skulle säga att den var väldigt lik en pärlhöna, som är en blandning av kyckling och vildfågel. ”Hade ingen aning” Till en början hade Rickardsson ingen aning om vem fågeln hade tillhört.  – Jag hade ingen aning om att det var Carolina Gynnings påfågel, men det förklarade Edward när vi var på plats, säger han. När bilder från tillagningen publicerades på sociala medier började kommentarerna rulla in. Då insåg Rickardsson hur välkänd fågeln var sedan tidigare.  – Folk skrev: ”Men det är ju Carolina Gynnings påfågel”. Jag bara: ”Hur vet ni det?” Trots uppståndelsen ser han tillbaka på uppdraget med värme. – Det var e r plan B inte att genomföra på ett smidigt sätt. Massa ogiltiga röster som visar motstånd till kriget, det är kanske inget styret vill visa upp. En annan sak att hålla ögonen på är valdeltagandet. De senaste dumavalen har det legat runt 50 procent. Det vill säga väldigt lågt. Om det inte blir högre denna gång - blir det också svårt att slå fast att Enade Ryssland och Putin verkligen har hela landets stöd.", "title_original": "Allt tyder på att Putin är orolig för folkets ärliga åsikt", "summary_original": "Det finns förstås en rad partier att rösta på i det ryska dumavalet. Men inget av dem utgör någon form av riktig opposition. De utför sin kritik och sina önskemål exakt enligt Kremls ramar. Och de fyller syftet att kunna kalla valet demokratiskt. Men det intressanta med dumavalet är trots allt att se hur enat stödet är för Putin och i sin förlängning den storskaliga invasionen av Ukraina. Syftet med valet är troligen att kunna visa upp för befolkningen att stödet är rigoröst såväl för makten, som att fortsätta kriget. Men allt tyder på att Putin är orolig för folkets ärliga åsikt. Enda kritiska parti Det enda parti som varit öppet kritiskt mot kriget är Jabloko. Och de har förbjudits att delta i stadsduman men får däremot delta i enmansvalkretsarna. Som svar har de uppmanat sina väljare att följa plan B: att gå och pappersrösta (inte digitalt som är den centrala uppmaningen) och göra sin röst ogiltig genom att kryssa i alla partier på valsedeln. Märkligt nog har flera av vallokalerna under söndagen stoppat pappersröstningen med förklaringen att systemet ligger nere. Med andra ord går plan B inte att genomföra på ett smidigt sätt. Massa ogiltiga röster som visar motstånd till kriget, det är kanske inget styret vill visa upp. En annan sak att hålla ögonen på är valdeltagandet. De senaste dumavalen har det legat runt 50 procent. Det vill säga väldigt lågt. Om det inte blir högre denna gång - blir det också svårt att slå fast att Enade Ryssland och Putin verkligen har hela landets stöd.", "link": "https://www.tv4.se/artikel/7HIh03xgUtdQvGi5NCbHUu/allt-tyder-pa-att-putin-aer-orolig-foer-folkets-aerliga-asikt", "date_display": "2026-09-20", "date_iso": "2026-09-20T16:32:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ryssland", "/vladimir-putin", "/valet-i-ryssland"]}, {"id": 146, "title": "Smocka för Djurgården i toppstriden: ”Mycket att ta in”", "summary": "Djurgården har radat upp segrar de senaste tiden och nu skulle tabelltvåan försöka ta tre nya poäng när Elfsborg besökte Stockholm.  Men det var bortalaget som tog tag i taktpinnen direkt och pressade tillbaka Djurgården. Efter sju minuter var det nära 1-0. Piotr Johansson passade hem bollen som hamnade mellan Jacob Une och Jacob Rinne och Momoh Kamara blev fri men tappade balansen och avslutade utanför. Hemmalaget hade oerhört svårt att få fast bollen och bygga anfall. Elfsborg var först på allt och när Djurgården fick bollen så tvingades man slå långa panikbollar. Tog ledningen strax innan paus Elfsborg dominerade men skapade inte jättemycket chanser. Efter 43 minuter fick Arber Zeneli ett bra skottläge utanför straffområdet och klippte till, och Jacob Rinne tvingades sträcka ut och rädda till hörna. Hörnan tog Julius Beck hand om. Kristian Lien rensade ut bollen från straffområdet, Kamara fångade upp den och sköt. Daniel Stensson blockade och bollen gick till Rasmus Wikström som drog iväg ett skott som Rinne borde tagit, vilket han dock inte gjorde och så var det 1-0. – Det är klart att han ska ha den bollen. En rejäl miss, sa TV4:s expertkommentator Vicki Blommé. Precis innan halvtid slog Rinne en lång boll som gick över Wikström och in i straffområdet där Lien tog emot och passade bakåt till Bo Hegland som fick ett bara läge men avslutade över.  Ställningen var 1-0 i paus och det hördes spridda burop.  Kortvarig glädje Djurgårdens defensiv var bättre i början på den andra halvleken, men offensivt hade man svårt att ta sig in till den sista tredjedelen. Tränare Jani Honkavaara försökte fixa till offensiven och tog in Oskar Fallenius, Abdul Abdulmalik och Max Larsson. Det gav effekt. I den 66:e minuten kvitterade hemmalaget. Hegland slog en snabb och kort hörna till Abdulmalik som passade vidare till Stensson. Han slog ett inlägg mot bortre stolpen, Lien nickade in bollen mot mål där Une kastade sig och sköt in 1-1. Hans första mål för säsongen. Men glädjen blev inte långvarig. Efter 76 minuter försvarade Abdul Abdulmalik svagt och Alexander Jensen kom fram enkelt på högerkanten och skickade in bollen mot straffpunkten. Oskar Fallenius löpte inte med Simon Olsson som placerade upp 2-1 i nättaket. ”Tio poäng, det är mycket att ta in” Hemmalaget försökte komma tillbaka - men det gick inte. Elfsborg vann med 2-1. – Vi gör en otrolig match i dag, borta mot Djurgården, säger Simon Olsson i TV4 och fortsätter: – Vi kommer hit och vågar spela, våga hålla i bollen. Djurgården är ett bra lag när de har bollen. Men vi måste också kunna behålla lugnet när vi har bollen. Det tycker jag vi gör i dag. Med åtta omgångar kvar är Djurgården tio poäng efter serieledaren Sirius. Elfsborg är fyra och har fyra poäng upp till tvåan Djurgården. – Det är ganska mycket som går snett i första halvlek. Andra är bättre. Vi är inte briljanta på något sätt, långtifrån det, ändå skapar vi några chanser och gör ett mål. Vi levde länge, men det går lite för långsamt, säger Djurgårdens Jacob Une i TV4. Han hymlar inte om att det kan bli svårt att gå ikapp Sirius. – Tio poäng, det är mycket att ta in.", "title_original": "Smocka för Djurgården i toppstriden: ”Mycket att ta in”", "summary_original": "Djurgården har radat upp segrar de senaste tiden och nu skulle tabelltvåan försöka ta tre nya poäng när Elfsborg besökte Stockholm.  Men det var bortalaget som tog tag i taktpinnen direkt och pressade tillbaka Djurgården. Efter sju minuter var det nära 1-0. Piotr Johansson passad fri ur häktet. Spelet bakom gallerierna: ”Helt gränslöst” I TV4 Nyheterna Story berättar gisslanförhandlaren själv för första gången, om spelet bakom gallerierna. – Telefonen ringde, och det var utrikesminister Pompeo. Han hade precis lämnat ett möte i Vita huset, och han sa \"Sätt dig på ett plan, första planet till Stockholm, packa för en vecka, och åk och hämta Asap Rocky. Presidenten vill ha hem honom. Få honom hem senast fredag\", säger Robert C. O'Brien. Dåvarande justitieminister Morgan Johansson (S) har efter händelsen nämnt att USA under sina påtryckningar hotade med handelsrestriktioner om man inte följde kraven. Det är numera en välkänd metod för president Trump, men då var det ovanligare. – Det här var kanske en första föraning om hur Trump kan bli när han inte har någon som spärrar, eller någonting som begränsar honom. För det här var ju ett helt gränslöst beteende från en stat i förhållande till en annan, säger Morgan Johansson (S). Övervägde handelshot mot Sverige Robert C. O'Brien hade som USA:s särskilde sändebud för gisslanfrågor fått fängslade amerikanska medborgare fria i länder som Iran, Jemen och Turkiet genom direkta förhandlingar med regeringar och regimer. Han reagerade själv på att det kändes udda att Sverige hamnade i detta sällskap, men tog uppgiften på stort allvar. På TV4:s fråga om vad han var auktoriserad att göra säger Robert C O'Brien alltså \"I princip allt, utom militärt våld\". Han bekräftar nu också med egna ord att handelshot övervägdes. – USA har många ekonomiska verktyg. Vid den tiden hade Sverige ett handelsöverskott mot USA, det hade absolut kunnat skadas. De negativa konsekvenserna var en dålig relation med USA - och att det kunde leda till handelssanktioner. Vare sig regeringen eller riksåklagaren gick med på USA:s krav. Efter rättegången släpptes Asap Rocky ur häktet och kunde lämna Sverige, i enlighet med svensk rättsordning. Men efter att artisten kommit tillbaks till USA tycks O'Briens insats ha uppfattats som en framgång. Han utsågs till nationell säkerhetsrådgivare hos president Trump.", "title_original": "Träder fram och berättar om kaoset: ”Allt utom militärt våld”", "summary_original": "En konflikt om ett par hörlurar utanför en hamburgerrestaurang 2019 ledde till mycket laddad diplomati mellan Sveriges regering och världens mäktigaste man, president Donald Trump. Den 19-årige mannen visste inte att det var världsstjärnan Asap Rocky och hans team han hamnade i bråk med. När han misshandlades med sparkar och slag på en bakgata, deltog även Asap Rocky själv. Artisten fick så småningom en villkorlig dom, men det var under veckorna fram till rättens avgörande som dramatiken var enorm.  Bilder från händelsen blev en världsnyhet och Trump skickade USA:s främste gisslanförhandlare, Robert C. O'Brien, för att få Asap Rocky, som egentligen heter Rakim Mayers, fri ur häktet. Spelet bakom gallerierna: ”Helt gränslöst” I TV4 Nyheterna Story berättar gisslanförhandlaren själv för första gången, om spelet bakom gallerierna. – Telefonen ringde, och det var utrikesminister Pompeo. Han hade precis lämnat ett möte i Vita huset, och han sa \"Sätt dig på ett plan, första planet till Stockholm, packa för en vecka, och åk och hämta Asap Rocky. Presidenten vill ha hem honom. Få honom hem senast fredag\", säger Robert C. O'Brien. Dåvarande justitieminister Morgan Johansson (S) har efter händelsen nämnt att USA under sina påtryckningar hotade med handelsrestriktioner om man inte följde kraven. Det är numera en välkänd metod för president Trump, men då var det ovanligare. – Det här var kanske en första föraning om hur Trump kan bli när han inte har någon som spärrar, eller någonting som begränsar honom. För det här var ju ett helt gränslöst beteende från en stat i förhållande till en annan, säger Morgan Johansson (S). Övervägde handelshot mot Sverige Robert C. O'Brien hade som USA:s särskilde sändebud för gisslanfrågor fått fängslade amerikanska medborgare fria i länder som Iran, Jemen och Turkiet genom direkta förhandlingar med regeringar och regimer. Han reagerade själv på att det kändes udda att Sverige hamnade i detta sällskap, men tog uppgiften på stort allvar. På TV4:s fråga om vad han var auktoriserad att göra säger Robert C O'Brien alltså \"I princip allt, utom militärt våld\". Han bekräftar nu också med egna ord att handelshot övervägdes. – USA har många ekonomiska verktyg. Vid den tiden hade Sverige ett handelsöverskott mot USA, det hade absolut kunnat skadas. De negativa konsekvenserna var en dålig relation med USA - och att det kunde leda till handelssanktioner. Vare sig regeringen eller riksåklagaren gick med på USA:s krav. Efter rättegången släpptes Asap Rocky ur häktet och kunde lämna Sverige, i enlighet med svensk rättsordning. Men efter att artisten kommit tillbaks till USA tycks O'Briens insats ha uppfattats som en framgång. Han utsågs till nationell säkerhetsrådgivare hos president Trump.", "link": "https://www.tv4.se/artikel/DpZ1fOf42NTMCnwsXDEgJ/traeder-fram-och-beraettar-om-kaoset-allt-utom-militaert-vald", "date_display": "2026-09-20", "date_iso": "2026-09-20T14:49:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/brott-och-straff", "/usa", "/donald-trump", "/artist", "/dom", "/nyheterna-story"]}, {"id": 148, "title": "Överläkaren förbluffad av nya röktrenden: ”Det är helt galet”", "summary": "Enligt en brittisk studie är cigaretter det näst vanligaste hjälpmedlet bland personer som försöker sluta med e-cigaretter. Nästan var femte vejpare uppgav att de hade testat metoden. Samtidigt visar en enkät från Nya Zeeland att 14 procent av dem som började med e-cigaretter för att sluta röka senare återgick till cigaretter när de ville sluta vejpa, rapporterar Bloomberg. Magnus Lundbäck, nikotinforskare och överläkare på hjärtkliniken vid Danderyds sjukhus, säger att ökningen av vejpandet har varit exceptionellt snabb. – I vissa grupper har det gått från några procent till 20-25 procents användning. Det är oöverträffat hur en drog har introducerats och blivit populär så oerhört snabbt, säger han. Bloomberg lyfter i sin granskning fram flera personer som uppger att de börjat röka för att bryta sitt vejpberoende. En av dem är amerikanen Shaun Moore. – Alla de skäl som får en att vilja sluta röka fanns inte alls när det gällde e-cigaretten, säger han till sajten. ”Det är helt galet” Enligt Lundbäck visar utvecklingen hur svårt det kan vara att bli av med ett nikotinberoende. – Det är helt galet. Det visar bara på hur fruktansvärt nikotinberoendet är. Rökning är oerhört skadligt, och det vet vi efter årtionden av forskning. Cigaretter dödar globalt sju till åtta miljoner människor varje år, säger Lundbäck. Han menar att risken för rökning ökar när beroendet väl är etablerat. – Det vi också vet är att om man får ett nikotinberoende så är risken att börja röka kraftigt förhöjd. Det visar bara på hur snurrigt det blir och hur svårt det är att bli av med sitt nikotinberoende, säger Lundbäck. Dubbelt bruk  Samtidigt ser han en risk att personer som försöker sluta med e-cigaretter i stället fastnar i ett dubbelt bruk. – Det vi har sett i våra studier som vi har gjort är att det vanliga som brukar bli hos de här personerna som då försöker använda e-cigarett som rökavvänjning, att de hamnar i att de använder både e-cigaretter och vanliga cigaretter. Och att man hoppar mellan de två. Att gå från e-cigaretter till vanliga cigaretter är enligt honom ingen lösning. – Det är fel på alla sätt och vis, säger han.", "title_original": "Överläkaren förbluffad av nya röktrenden: ”Det är helt galet”", "summary_original": "Enligt en brittisk studie är cigaretter det näst vanligaste hjälpmedlet bland personer som försöker sluta med e-cigaretter. Nästan var femte vejpare uppgav att de hade testat metoden. Samtidigt visar en enkät från Nya Zeeland att 14 procent av dem som började med e-cigaretter för att sluta röka senare återgick till cigaretter när de "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/halsa", "/rokning", "/e-cigaretter", "/cancer", "/studie", "/studier", "/nya-zeeland", "/sjukhuset"]}, {"id": 149, "title": "Slår tillbaka efter SD:s utspel: ”Ingen är förvånad”", "summary": "Efter orden om ”röstboskap” • ”Agerar precis som de alltid gör”", "title_original": "Slår tillbaka efter SD:s utspel: ”Ingen är förvånad”", "summary_original": "Efter orden om ”röstboskap” • ”Agerar precis som de alltid gör”", "link": "https://www.tv4.se/artikel/1rXnXgN9HjOc35yTZxCHKa/andersson-slar-tillbaka-efter-sd-s-utspel-ingen-aer-foervanad", "date_display": "2026-09-20", "date_iso": "2026-09-20T11:01:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/"]}, {"id": 150, "title": "GW efter domen: Kunde fått livstid om han var äldre", "summary": "Mannen har enligt domen haft en framskjuten roll i nätsekten 764, som har sitt ursprung i USA men fått spridning internationellt – även till Sverige. Brotten har begåtts över nätet och flera av brottsoffren finns i flera länder. – Målgruppen som han försöker påverka till att både begå brott och skada sig själva är företrädesvis barn och ungdomar, säger GW Persson.\n\nBland brotten han döms för finns två fall av mordförsök, ett fall av medhjälp till mordförsök, sex fall av våldtäkt och tre fall av grov misshandel. Brotten begicks när mannen var mellan 15 och 17 år gammal, något TV4 Nyheterna tidigare rapporterat om.  Sena kriminaliseringar Leif GW Persson konstaterar att det är fråga om mycket allvarliga brott, men också att lagstiftningen på området är relativt ny. – Det har inte alltid varit givet att du ska kunna dömas för den här typen av anstiftan eller något liknande genom skrivna eller talade budskap, säger han. I det aktuella fallet användes även anonyma vittnen, något som är ovanligt i svenska domstolar. GW menar att domen sannolikt kommer att överklagas, men tror inte att det kommer att påverka utgången i sak. Mannen har genomgått en rättspsykiatrisk utredning som visar att han varken vid gärningarna eller undersökningen led av någon allvarlig psykisk störning.", "title_original": "GW efter domen: Kunde fått livstid om han var äldre", "summary_original": "Mannen har enligt domen haft en framskjuten roll i nätsekten 764, som har sitt ursprung i USA men fått spridning internationellt – även till Sverige. Brotten har begåtts över nätet och flera av brottsoffren finns i flera länder. – Målgruppen som han försöker påverka till att både begå brott och skada sig själva är företrädesvis barn och ungdomar, säger GW Persson.\n\nBland brotten han döms för finns två fall av mordförsök, ett fall av medhjälp till mordförsök, sex fall av våldtäkt och tre fall av grov misshandel. Brotten begicks när mannen var mellan 15 och 17 år gammal, något TV4 Nyheterna tidigare rapporterat om.  Sena kriminaliseringar Leif GW Persson konstaterar att det är fråga om mycket allvarliga brott, men också att lagstiftningen på området är relativt ny. – Det har inte alltid varit givet att du ska kunna dömas för den här typen av anstiftan eller något liknande genom skrivna eller talade budskap, säger han. I det aktuella fallet användes även anonyma vittnen, något som är ovanligt i svenska domstolar. GW menar att domen sannolikt kommer att överklagas, men tror inte att det kommer att påverka utgången i sak. Mannen har genomgått en rättspsykiatrisk utredning som visar att han varken vid gärningarna eller undersökningen led av någon allvarlig psykisk störning.", "link": "https://www.tv4.se/artikel/71mcITGa6gy9p7BUeVlBvS/gw-om-764-fallet-18-arig-man-fran-umea-doemd", "date_display": "2026-09-20", "date_iso": "2026-09-20T09:56:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/personer/leif-gw-persson", "/brott", "/brott-och-straff", "/764", "/natsekten-764"]}, {"id": 151, "title": "VM-guld för Almgren: ”Han hade ingenting att sätta emot”", "summary": "Almgren blir den förste icke-afrikanska löparen på 30 år att ta guld på ett halvmaraton. Den senaste var italienaren Stefano Baldini 1996.\n\n– Det känns så bra. Först bli Europamästare och sedan komma hit med det tydliga målet att jag ska ta guldet och leverera på det här sättet. Det känns otroligt bra, säger Almgren till SVT.\n\nDet var länge jämnt mellan Almgren och Kipkorir och mot slutet turades de om att ha första och andra plats – innan Almgren lade in en överväxel och spurtade i mål.  ”Den dryga jäveln”  – Det var så stort, det här. Jag kände mig fräsch till det var en kilometer kvar. En bra känsla, säger Almgren och fortsätter:\n\n– Det är skönt att springa på ett sådant här sätt där man inte behöver göra någonting själv utan kan vara den där dryga jäveln som ligger bakom och spurtar, säger han.\n\nAndreas Almgren slog också sitt gamla rekord från i fjol med en halv minut.\n\n– När det var 200 meter kvar så lade jag i allt jag hade och då hade han (Kipkorir) ingenting att sätta emot.  Inget hårt firande  Detta är Almgrens tredje stora mästerskapsmedalj i karriären. Han har tidigare tagit VM-brons och blev nyligen Europamästare på 10 000 meter i Birmingham.\n\nAlmgren har tidigare pratat om att han gör en satsning mot maraton framöver, troligtvis efter OS i Los Angeles 2028. Nu väntar även förberedelser inför New York Marathon i början av november.\n\n– Jag ska försöka hitta något form av firande. Men jag sticker till träningsläger i USA direkt i morgon, så det blir nog inte ett hårt firande.\n\nPå damsidan satte kenyanskan Agnes Jebet Ngetich nytt världsrekord. Ngetich gick i mål på 1.05.15 – en sekunds marginal till det tidigare rekordet. Ngetich ledde loppet från start till mål.", "title_original": "VM-guld för Almgren: ”Han hade ingenting att sätta emot”", "summary_original": "Almgren blir den förste icke-afrikanska löparen på 30 år att ta guld p   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
