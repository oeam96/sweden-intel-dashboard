.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {

.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */

t ser ut nu, säger Peter Kondrup. På torsdagen är väderläget i stort sett oförändrat. Högtrycket ligger kvar över landet och det väntas fortsatt mest uppehållsväder. I Svealand och södra Norrland kan det dessutom bli en del sol. Där ligger temperaturerna på många håll mellan fem och tio minusgrader även dagtid. Mot fredag blir det ännu kallare på vissa håll.  – Det kan bli under femton minusgrader långt in över Dalarna och kanske norra Värmland. Vi har kyla som kommer in och det är i samband med det här högtrycket, säger Kondrup. ”Ett glädjebesked” Framåt helgen flyttar högtrycket söderut mot Baltikum. Då väntas svagare vindar, mer moln och dimma på många håll. Lördagen ser enligt prognosen ut att bli grå, men fortfarande utan någon större nederbörd. För den som hoppas på snö till första advent ser prognosen ändå lovande ut. – Det är ett glädjebesked för ganska många som får en vit advent, säger Kondrup. Även där det inte ligger snö på marken kan vädret bjuda på vinterkänsla.  – Även om man inte har snö så kan man hoppas på att det blir lite frost, kanske.", "title_original": "Snön väntas ligga kvar till advent: ”Glädjebesked för många”", "summary_original": "Kyla, uppehållsväder och snö som ligger kvar. Det är utsikterna för stora delar av landet när första advent närmar sig. Enligt TV4:s meteorolog Peter Kondrup har ett högtryck dragit in över Sverige och väntas dominera vädret under veckan. Det innebär låga temperaturer och relativt lite nederbörd. Redan på tisdagen väntas flera minusgrader i stora delar av landet. I Värmland och Dalarna blir det rejält kallt, samtidigt som en del snöbyar dröjer sig kvar i Norduppland och Gästrikland. På Öland och Gotland kan det förekomma regn eller snöblandat regn, medan de sydligaste delarna av landet får några plusgrader. ”God chans att ligga kvar”  Natten till onsdag väntas minusgrader i nästan hela landet. Under onsdagen fortsätter det klara och kalla vädret i Norrland och norra Svealand, medan södra Sverige får mer moln oc ytändning för svensk ungdomslitteratur, skriver DN:s Lydia Wistisen.", "link": "https://www.dn.se/kultur/lydia-wistisen-aterigen-prisas-ett-prosaverk-trots-osedvanligt-starka-bilderbocker/", "date_display": "2026-11-23", "date_iso": "2026-11-23T17:57:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 32, "title": "Jonas Thente: Priset går till en omedelbar och akut roman", "summary": "Med ”Nattsäsong” har Karolina Ramqvist skapat en mörk roman om passion, makt och åldrande. Det är ett bra prisval, tycker DN:s Jonas Thente.", "title_original": "Jonas Thente: Priset går till en omedelbar och akut roman", "summary_original": "Med ”Nattsäsong” har Karolina Ramqvist skapat en mörk roman om passion, makt och åldrande. Det är ett bra prisval, tycker DN:s Jonas Thente.", "link": "https://www.dn.se/kultur/jonas-thente-priset-gar-till-en-omedelbar-och-akut-roman/", "date_display": "2026-11-23", "date_iso": "2026-11-23T17:54:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 33, "title": "Elchocken tvingar krögarparet att stänga – hela vintern", "summary": "De höga elpriserna slår hårt mot södra Sverige. På gästgiveriet i Skivarp har Jeanette och Johan Bohman nu fattat ett tungt beslut: Att hålla restaurangköket stängt under vintern. – Det är vårt kök som drar enorma mängder el. Det är plattor, ugnar, diskmaskiner och allt som hör ett restaurangkök till, säger Jeanette Bohman. Redan i oktober mer än fördubblades elkostnaderna. Nu befarar paret att elräkningen för november kan landa på 40 000–50 000 kronor. Gästerna tvingas välja bort restaurangbesök Men det är inte bara gästgiveriets egna kostnader som ställer till problem. Även kunderna får mindre pengar över när elräkningarna stiger. – Våra kunder får tre eller fyra gånger så hög elräkning. Restaurangbesök eller julklappar måste de välja bort när elräkningen kommer, säger Johan Bohman. De ökade kostnaderna, i kombination med kundernas minskade köpkraft, gör det omöjligt för paret att hålla restaurangen öppen under vintermånaderna. Varnar för 200 000 förlorade jobb Johan Eklund, vd för Sydsvenska handelskammaren, känner igen situationen. Han berättar att företag dagligen hör av sig med liknande problem. – Vi tappar konkurrenskraft och välstånd, säger han. Enligt en analys från handelskammaren riskerar Sverige att gå miste om uppemot 200 000 arbetstillfällen fram till 2030 om elpriserna fortsätter att vara höga och oförutsägbara. – Då handlar det om att man kanske överväger att varsla personal, väljer att investera någon annanstans eller helt enkelt inte investerar alls, säger Eklund. Han varnar också för att konsekvenserna kan sprida sig från södra Sverige till fler delar av landet. Kravet till politikerna: ”Vi är ett och samma land” Jeanette Bohman vill se snabba politiska åtgärder och riktar särskild kritik mot Sveriges fyra elprisområden. – De här elprisområdena behöver man ta bort, helt enkelt. Vi är ett och samma land och måste gemensamt ta vara på våra resurser. Efter fem har sökt energi- och näringsminister Ebba Busch (KD), som i en kommentar uppger att regeringen gett Svenska kraftnät i uppdrag att påskynda arbetet med en övergång från fyra elområden till två. Enligt Busch är de stora prisskillnaderna mellan olika delar av landet inte långsiktigt hållbara.", "title_original": "Elchocken tvingar krögarparet att stänga – hela vintern", "summary_original": "De höga elpriserna slår hårt mot södra Sverige. På gästgiveriet i Skivarp har Jeanette och Johan Bohman nu fattat ett tungt beslut: Att hålla restaurangköket stängt under vintern. – Det är vårt kök som drar enorma mängder el. Det är plattor, ugnar, diskmaskiner och allt som hör ett restaurangkök till, säger Jeanette Bohman. Redan i oktober mer än fördubblades elkostnaderna. Nu befarar paret att elräkningen för november kan landa på 40 000–50 000 kronor. Gästerna tvingas välja b esta andra europeiska länder, en ambassad i Pyongyang. Men många andra länder som har diplomatiska förbindelser med Nordkorea ackrediterar sina ambassadörer i Peking för Pyongyang och har inte haft ambassader där.  Överraskar omvärlden Att Kim Jong Un nu släpper fram diplomater och till och med tar dem i hand har överraskat omvärlden. Inte sedan 1994, när Kim farfar Kim Il Sung härskade, har en nordkoreansk ledare tagit emot nyutnämnda ambassadörers kreditivbrev. Det var en uppgift som tidigare var förpassad till parlamentets ordförande. Att Kim Jong Un nu frångått det tidigare protokollet och själv tagit sig an uppgiften kan tyda på att Nordkorea vill stärka de internationella banden. – Nordkorea är redo att stärka banden av vänskap och samarbete med alla andra länder som respekterar vår stats suveränitet och är vänligt inställda till oss, sade Kim i ett tal enligt den nordkoreanska statstelevisionen.  I talet, som alltså inte hördes utan återgavs av den statliga nyhetsbyrån i text, fanns också ord om att ”världen står inför en kris”, men att ”Nordkorea är villigt att vara vän med andra länder. Trump fick nobben Kim Jong Un vill med ceremonin samtidigt visa att han inte behöver ett toppmöte med USA för att stärka sin internationella ställning, skriver Wall Street Journal. President Donald Trump ville träffa honom under sin Asienresa förra veckan, men Kim deltog inte.\n\n– Säkerhetsmiljön pressas mot en oförutsägbar fara av USA:s sedan länge fientliga politik, sade Kim toppmedarbetare Jo Yong Won under en resa i Ryssland. Under sitt tal till de besökande diplomaterna på söndagen sade Kim att hans land motsätter sig att suveräna staters rättigheter begränsas och förtrycks – en anklagelse som Pyongyang upprepade gånger har riktat mot Washington. Han nämnde inte USA direkt.  Kim har samtidigt fördjupat banden med Kina och Ryssland. Vid en militärparad i Peking förra året stod han tillsammans med Kinas ledare Xi Jinping och Rysslands president Vladimir Putin.\n\n– Det f går i en rödgrön regering skulle partiet kunna utestänga SD genom att rösta med vänste­rblocket när så önskas. Varför hör man inget om alternativet att C lägger ner sin röst i statsministervalet? undrar Nina Rask.", "link": "https://www.dn.se/insandare/centerpartiet-bor-lagga-ner-sina-roster/", "date_display": "2026-11-23", "date_iso": "2026-11-23T14:51:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "Socker­skräcken har gått för långt", "summary": "Förskolor som stoppar det traditionsenliga lussebaket misslyckas med en viktig del av sitt uppdrag.", "title_original": "Socker­skräcken har gått för långt", "summary_original": "Förskolor som stoppar det traditionsenliga lussebaket misslyckas med en viktig del av sitt uppdrag.", "link": "https://www.svd.se/a/pMLj2o/forbud-mot-lussebullar-visar-att-sockerskracken-har-gatt-for-langt?utm_medium=rss", "date_display": "2026-11-23", "date_iso": "2026-11-23T14:28:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "Jensen Huang gör comeback som vd efter otrohetsskandal", "summary": "Jensen Huang återvänder som vd för Nvidia, skriver AI-jätten i ett pressmeddelande. Detta efter ”en serie diskussioner och möten” med chefen, där styrelsedirektörerna känt sig ”nöjda med Mr. Huangs uppriktighet och förmåga” att leda företaget. Huang avgick den 12 november efter en otrohetsskandal, där han avslöjats ha flera utomäktenskapliga relationer, inte minst med Alice Huang som anklagas för att vara en kinesisk spion. – Styrelsen tror att Jensen är rätt person för att leda Nvidia, och att hans återinförande är i aktieägarnas, de anställdas, våra partners och kunders bästa intresse, säger bolagets styrelseordförande Harvey C. Jones i pressmeddelandet. Aktien rusar Direkt efter beskedet rusade Nvidia-aktien med 30 procent. Nasdaq gick upp med nära 7 procent. Elin Benjaminsson, börsstrateg på Avanza, säger att hon inte är överraskad över beskedet, men att många nog blev överraskade över att det gått så här fort. – Aktien har gått upp väldigt, väldigt kraftigt efter det här beskedet, säger hon. – Vi ser en lättnadens suck – ett glädjerus. Experten: Huang den mest framstående AI-profilen Även de andra stora techbolagens aktier påverkas positivt av beskedet – samma sak gäller bolag på Stockholmsbörsen som är kopplade till artificiell intelligens. – Nu är man kanske inte längre lika orolig för att AI-investeringarna ska sluta, att de här finansieringarna som Nvidia har hållit på med ska sluta, och att tekniken ska gå framåt, säger Benjaminsson. – Nvidia har varit väldigt viktiga i den här AI-revolutionen som vi ser, och Jensen Huang har varit den mest framstående personen, vågar jag påstå, i det här ”AI-spacet”. Jag tror att det faktum att han kommer tillbaka gör att investerarna känner sig trygga i att våga tro på AI igen. Huangs egna ord: ”Tacksam för stödet” Jensen Huang säger i Nvidias pressmeddelande att han är ”hedrad att återvända” till bolaget. – Jag tar på mig det här ansvaret med största möjliga ödmjukhet och ett förnyat engagemang. Jag vill tacka Nvidias styrelse för förtroendet och eftertänksamheten under den här processen. – Över allt annat är jag tacksam för kärleken och stödet jag får från min familj. En som verkar tacksam över beskedet är USA:s president Donald Trump. ”Det här landet behöver Jensens ledarskap på Nvidia för företagets framgång och välstånd, men även för den amerikanska ekonomins. USA:s regering har ingen anledning att tro att Jensens comeback innebär någon risk för rikets säkerhet”, skriver presidenten på Truth Social. ”Vad kan ha läckt?” Elin Benjaminsson säger att det finns flera oklarheter kring Huang som behöver redas ut den närmaste tiden. – Bland annat om personen som man hade en affär med är en kinesisk spion eller inte, och vad konsekvenserna då kan ha varit.  – Vad kan ha läckt?", "title hur en ung man kommer körande på en elsparkcykel tillsammans med sin vän. De stannar för att möta två pojkar vid idrottsanläggningen. Kort därpå försöker mannen fly, varpå en av pojkarna drar fram en pistol och öppnar eld. Det avgörande händelseförloppet fångas på bild av en parkerad Tesla. Mannen träffades i huvudet, nacke och rygg och avled senare på sjukhus.  Filmade den skjutna mannen Skytten berättar i förhör att han efter dådet fick instruktioner från uppdragsgivaren genom sina AirPods om att filma den skjutne mannen.  ”Han gjorde som han blev tillsagd innan de snabbt sprang från platsen”, skriver polisen efter förhöret med tonåringen. Duon spenderade en natt på hotell och lämnade Norge morgonen därpå. – Sedan går de i skolan ett par dagar i Karlstad, innan de åker till Norrköping samma dag som mordet sker, säger åklagare Karin Sandén till TT. Slog till på valborgsmässoafton Mordet i Norrköping inträffade vid 21-tiden på valborgsmässoafton. Även där var offret en man i 20-årsåldern, som blev skjuten i huvudet.  Pojkarna ska av anstiftarna ha blivit erbjudna stora summor pengar för att utföra morden – i ena fallet 550 000 – men har endast mottagit mindre summor. Av åtalet framgår att båda 16-åringarna ”vidgår händelseförloppen” men båda nekar dock till brott. Ytterligare två pojkar är åtalade för medhjälp till mord och grovt vapenbrott för händelsen i Norrköping.", "title_original": "Mordet fångas av Teslans kamera – duon slår till igen dagar senare", "summary_original": "Två pojkar står inför rätta vid Norrköpings tingsrätt för dubbla mord, ett i Oslo, det andra i Norrköping, med bara fyra dagars mellanrum. Morduppdragen ska de ha fått i chattar från alias som kopplas till Foxtrotnätverket. Pojkarna, som båda är 16 år, hävdar i förhör att de hotades till livet och att även deras familjer hotades om de inte följde order. Den ena pojken beskriver hur hotfulla, främmande män visade honom bilder på hans mamma och lillebror, och att han var både chockad och rädd. L kolor i Tyskland och Danmark. Enligt tyska och danska källor har de mottagit samma mejl. ”Döden väntar på dig”, uppges ha stått i ämnesraden.", "link": "https://www.dn.se/varlden/bombhot-mot-hundratals-skolor-i-tva-lander/", "date_display": "2026-11-23", "date_iso": "2026-11-23T12:39:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Strategen om AI-raset: ”Historiskt har det alltid varit köpläge”", "summary": "Det blev en blodig vecka på Wall Street när AI-frossan bet sig fast på marknaden. Börsens skräckindex rusade samtidigt som det tekniktunga Nasdaq-indexet utraderade årets uppgång när AI-bolagen rasade tvåsiffrigt. – Sentimentet är extremt nedkört just nu, säger Ålandsbankens Anders Rudolfsson.", "title_original": "Strategen om AI-raset: ”Historiskt har det alltid varit köpläge”", "summary_original": "Det blev en blodig vecka på Wall Street när AI-frossan bet sig fast på marknaden. Börsens skräckindex rusade samtidigt som det tekniktunga Nasdaq-indexet utraderade årets uppgång när AI-bolagen rasade tvåsiffrigt. – Sentimentet är extremt nedkört just nu, säger Ålandsbankens Anders Rudolfsson.", "link": "https://www.dn.se/ekonomi/strategen-om-ai-raset-historiskt-har-det-alltid-varit-koplage/", "date_display": "2026-11-23", "date_iso": "2026-11-23T12:30:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Techförvaltaren om AI-bubblan: ”Viktigt förstå vad som driver marknaden”", "summary": "Efter en dramatisk höst med börsras, vd-avhopp och en historisk rekordnotering har AI-frossan återvänt till Wall Street. Nu ställs marknadens oro för räntor och regleringar mot förhoppningarna om att kapprustningen ska ge utdelning. – Om man ser bortom allt brus och bara ser till siffrorna så ser vi accelererande tillväxt för Nvidia och flera AI-bolag, säger techförvaltaren Inge Heydorn.", "title_original": "Techförvaltaren om AI-bubblan: ”Viktigt förstå vad som driver marknaden”", "summary_original": "Efter en dramatisk höst med börsras, vd-avhopp och en historisk rekordnotering har AI-frossan återvänt till Wall Street. Nu ställs marknadens oro för räntor och regleringar mot förhoppningarna om att kapprustningen ska ge utdelning. – Om man ser bortom allt brus och bara ser till siffrorna så ser vi accelererande tillväxt för Nvidia och flera AI-bolag, säger techförvaltaren Inge Heydorn.", "link": "https://www.dn.se/ekonomi/techforvaltaren-om-ai-bubblan-viktigt-forsta-vad-som-driver-marknaden/", "date_display": "2026-11-23", "date_iso": "2026-11-23T12:30:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Virusforskaren varnar: ”Allvarligt – kan leda till svår sjukdom”", "summary": "På fredagen uppsökte en person akutmottagningen på Södersjukhuset för vård. Patienten blev sittande i väntrummet under ett antal timmar, samtidigt som andra människor rörde sig där.\n\nSenare konstaterade sjukhuset att patienten hade mässling och en intensiv smittspårning inleddes. Upp till 250 personer kan ha befunnit sig i väntrummet samtidigt som den smittade personen. Smittar genom luften Att ett fall av mässling har upptäckts på ett sjukhus, i ett utrymme där många människor vistas, är allvarligt, enligt Ali Mirazimi, virusforskare och professor vid Karolinska institutet.\n\n– Det är allvarligt i och med att det kan leda till en svår sjukdom hos de drabbade. Har man varit i ett rum och varit smittsam och sedan lämnar rummet så finns viruset kvar i luften i upp till flera timmar. Därför är viruset väldigt smittsamt, säger Ali Mirazimi.\n\nMässling är en luftburen smitta och viruset är motståndskraftigt i luften. En person med covid-19 kan smitta mellan en och sex personer, medan mässling kan smitta mellan 12 och 20 personer genom luften. Det kan dock dröja dagar eller veckor innan symtom visar sig.\n\n– Det börjar som torr hosta och sedan hög feber. Efter några dagar kommer det utslag, säger Mirazimi. Vaccinationen viktig Enligt Ali Mirazimi är ett större mässlingsutbrott däremot ingen större risk. I Sverige är över 90 procent av befolkningen vaccinerad mot viruset.\n\n– Vaccinet är väldigt viktigt. Det är det som bygger upp vår beredskap kring alla de typer av infektionssjukdomar som sprids och orsakar svår sjukdom. Det är den största lärdomen, att man ska vaccinera sig enligt de instruktioner och rekommendationer som som kommer från expertmyndigheterna.", "title_original": "Virusforskaren varnar: ”Allvarligt – kan leda till svår sjukdom”", "summary_original": "På fredagen uppsökte en person akutmottagningen på Södersjukhuset för vård. Patienten blev sittande i väntrummet under ett antal timmar, samtidigt som andra människor rörde sig där.\n\nSenare konstaterade sjukhuset att patienten hade mässling och en intensiv smittspårning inleddes. Upp till 250 personer kan ha befunnit sig i väntrummet samtidigt som den smittade personen. Smittar genom luften Att ett fall av mässling har upptäckts på ett sjukhus, i ett utrymme där många människor vistas, är allvarligt, enligt Ali Mirazimi, virusforskare och professor vid Karolinska institutet.\n\n– Det är allvarligt i och med att det kan leda till en svår sjukdom hos de drabbade. Har man varit i ett rum och varit smittsam och sedan lämnar rummet så finns viruset kvar i luften i upp till flera timmar. Därför är viruset väldigt smittsamt, säger Ali Mirazimi.\n\nMässling är en luftburen smitta och viruset är motståndskraftigt i luften. En person med covid-19 kan smitta mellan en och sex personer, medan mässling kan smitta mellan 12 och 20 personer genom luften. Det kan dock dröja dagar eller veckor innan symtom visar sig.\n\n– Det börjar som torr hosta och sedan hög feber. Efter några dagar kommer det utslag, säger Mirazimi. Vaccinationen viktig Enligt Ali Mirazimi är ett större mässlingsutbrott däremot ingen stö stal-utrustning-i-hoganas/", "date_display": "2026-11-23", "date_iso": "2026-11-23T10:54:32+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "S-profiler vill ha förbud – har själva dubbdäck", "summary": "Stockholms stad vill förbjuda dubbdäck i innerstaden på grund av de hälsofarliga partiklar de…", "title_original": "S-profiler vill ha förbud – har själva dubbdäck", "summary_original": "Stockholms stad vill förbjuda dubbdäck i innerstaden på grund av de hälsofarliga partiklar de…", "link": "https://www.svd.se/a/Pv9XQ5/dubbdacksforbud-i-stockholm-toppolitiker-vill-ha-forbud-men-kor-sjalva-med-dubbdack?utm_medium=rss", "date_display": "2026-11-23", "date_iso": "2026-11-23T10:32:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Designer maktlös när AI stjäl allt hon gör", "summary": "Så fort Malin Fredriksson lägger ut en ny design kan hon räkna med att den blir kopierad.", "title_original": "Designer maktlös när AI stjäl allt hon gör", "summary_original": "Så fort Malin Fredriksson lägger ut en ny design kan hon räkna med att den blir kopierad.", "link": "https://www.svd.se/a/aGwQkO/designer-maktlos-nar-ai-stjal-allt-hon-gor?utm_medium=rss", "date_display": "2026-11-23", "date_iso": "2026-11-23T10:30:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Zaid hjälpte Sören vid svåra bussolyckan – här ses de igen", "summary": "Det var fredag eftermiddag den 14 november förra året som den allvarliga bussolyckan inträffade vid Tekniska högskolan i Stockholm. Det var mycket folk i rörelse när larmet kom klockan 15:23 att en dubbeldäckarbuss kört in i en busskur. I busskuren stod Sören Jansson. I stället för att ta en kaffe i väntan på bussen, som han brukar göra, gick han och ställde sig längst fram i kuren för att få en bra plats. – Det var min räddning, för då stod jag ju längst fram där bussförarens dörr öppnas, säger han i Nyhetsmorgon. Blödde kraftigt Han berättar att han såg bussen komma, men att något verkade vara fel. Det såg farligt ut. – Och så insåg jag att det här går åt skogen. Jag förstår inte vad som händer, men jag hörde att det började låta om bussen när den körde in i busskuren, säger Sören Jansson. Han hann få ut en fot, sedan slog en stolpe ut honom i gatan. Han blödde rejält, blev omtöcknad och stod och höll sig i ett träd när hjälpen dök upp från oväntat håll. Zaid Al Hussen, 20, såg olyckan inträffa. Han kastade sina kryckor och sprang fram för att hjälpa till. I tumultet föll valet på att hjälpa skadade Sören. – Jag lade ner honom, försökte prata med honom samtidigt för att få honom att vara medveten och inte svimma. Sörens vänstra fot blödde kraftigt. Zaid Al Hussen försökte få hjälp från andra, men många var rädda och flydde från platsen. – Då tänkte jag att jag tar ansvaret för det, att Sören inte ska gå bort, säger Zaid Al Hussen. ”Djupt tacksam” Något Sören förstås är glad och tacksam över. – Ja, jag tänkte att det var ju fantastiskt att någon bara tog hand om mig plötsligt. Jag insåg att det här inte var en officiell räddningspersonal, utan det här var en privat människa som såg en situation som behövde åtgärdas. Så jag var djupt tacksam naturligtvis. Han gjorde allting rätt. Helt underbart, säger han. De träffades igen första gången efter olyckan i Sveriges Radio P4 förra veckan. Hur känns det att sitta bredvid varandra? – Det är fantastiskt. Det känns stort för mig att få träffa dig faktiskt, säger Sören. – Samma här. Att se dig må bra och verkligen piggare än när vi träffades där, säger Zaid. Följde sitt hjärta Zaid var själv skadad vid tillfället när olyckan inträffade och gick med kryckor. Ändå tvekade han aldrig att ingripa. – Det var en mening min far brukade säga till mig: Gå hellre ut ur din bekvämlighetszon och följ vad ditt hjärta säger att du ska göra, än att du kollar bakåt och ångrar dig. För mig var det att ta det här modet och bara göra det som känns rätt. Jag är tacksam för det jag gjorde. Sören mår bra i dag och det gör mig glad. Livet ut, kan jag säga. Zaid har tilldelats Young Courage Award av Raoul Wallenberg Academy för sin insats och han hoppas att händelsen kan inspirera unga att visa mer civilkurage.", "title_original": "Zaid hjälpte Sören vid svåra bussolyckan – här ses de igen", "summary_original": "Det var fredag eftermiddag den 14 november förra året som den allvarliga bussolyckan inträffade vid Tekniska högskolan i Stockholm. Det var mycket folk i rörelse när larmet kom klockan 15:23 att en dubbeldäckarbuss kört in i en busskur. I busskuren stod Sören Jansson. I stället för att ta en kaffe i väntan på bussen, som han brukar göra, gick han och ställde sig längst fram i kuren för att få en bra plats. – Det var min räddning, för då stod jag ju längst fram där bussförarens dörr öppnas, säger han i Nyhetsmorgon. Blödde kraftigt Han berättar att han såg bussen komma, men att något verkade vara fel. Det såg farligt ut. – Och så insåg jag att det här går åt skogen. Jag förstår inte vad som händer, men jag hörde att det började låta om bussen när den körde in i busskuren, säger Sören Jansson. Han hann få ut en fot, sedan slog en stolpe ut honom i gatan. Han blödde rejält, blev omtöcknad och stod och höll sig i ett träd när hjälpen dök upp från oväntat håll. Zaid Al Hussen, 20, såg olyckan inträffa. Han kastade sina kryckor och sprang fram för att hjälpa till. I tumultet föll valet på att hjälpa skadade Sören. – Jag lade ner honom, försökte prata med honom samtidigt för att få honom att vara medveten och inte svimma. Sörens vänstra fot blödde kraftigt. Zaid Al Hussen försökte få hjälp från andra, men många var rädda och flydde från platsen. – Då tänkte jag att jag tar ansvaret för det, att Sören inte ska gå bort, säger Zaid Al Hussen. ”Djupt tacksam” Något Sören förstås är glad och tacksam över. – Ja, jag tänkte att det var ju fantastiskt att någon bara tog hand om mig plötsligt. Jag insåg att det här inte var en officiell räddningspersonal, utan det här var en privat människa som såg en situation som behövde åtgärdas. Så jag var djupt tacksam naturligtvis. Han gjorde allting rätt. Helt underbart, säger han. De träffades igen första gången efter olyckan i Sveriges Radio P4 förra veckan. Hur känns det att sitta bredvid varandra? – Det är fantastiskt. Det känns stort för mig att få träffa dig faktiskt, säger Sören. – Samma här. Att se dig må bra och verkligen piggare än när vi träffades där, säger Zaid. Följde sitt hjärta Zaid var själv skadad vid tillfället när olyckan inträffade och gick med kryckor. Ändå tvekade han aldrig att ingripa. – Det var en mening min far brukade säga till mig: Gå hellre ut ur din bekvämlighetszon och följ vad ditt hjärta säger att du ska göra, än att du kollar bakåt och ångrar dig. För mig var det att ta det här modet och bara göra det som känns rätt. Jag är tacksam för det jag gjorde. Sören mår bra i dag och det gör mig glad. Livet ut, kan jag säga. Zaid har tilldelats Young Courage Award av Raoul Wallenberg Academy för sin insats och han hoppas att händelsen kan inspirera unga att visa mer civilkurage.", "link": "https://www.tv4.se/artikel/4NDLcRnbkh036XYauu0blw/zaid-hjaelpte-soeren-vid-svara-bussolyckan-haer-ses-de-igen", "date_display": "2026-11-23", "date_iso": "2026-11-23T10:18:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/olycka", "/trafikolycka", "/busskraschen-i-stockholm", "/buss"]}, {"id": 132, "title": "Attackerna kan avslöja Ukrainas nya taktik: ”Väldigt intressant”", "summary": "Gått från rörliga till fasta mål • Huovinen: ”En spektakulär händelse”", "title_original": "Attackerna kan avslöja Ukrainas nya taktik: ”Väldigt intressant”", "summary_original": "Gått från rörliga till fasta mål • Huovinen: ”En spektakulär händelse”", "link": "https://www.tv4.se/artikel/6F13MYqXGUE6k8HBqnEwe1/attackerna-kan-avsloeja-ukrainas-nya-taktik-vaeldigt-intressant", "date_display": "2026-11-23", "date_iso": "2026-11-23T08:18:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 133, "title": "Spaghetti all’assassina med burrata", "summary": "Dagens middagstips bjuder på en rätt där spaghettin får koka färdigt i het tomatbuljong direkt i pannan och blir kryddig, djup och lätt bränd i kanterna. Toppa med gyllene, krispigt pangrattato med persilja och parmesan, och med en hemgjord burrata för en komplett middag. Se Siri Barjes recept", "title_original": "Spaghetti all’assassina med burrata", "summary_original": "Dagens middagstips bjuder på en rätt där spaghettin får koka färdigt i het tomatbuljong direkt i pannan och blir kryddig, djup och lätt bränd i kanterna. Toppa med gyllene, krispigt pangrattato med persilja och parmesan, och med en hemgjord burrata för en komplett middag. Se Siri Barjes recept", "link": "https://www.tv4.se/artikel/3UzY0TvFI8ZPQbzRlB3Nad/spaghetti-allassassina-med-burrata", "date_display": "2026-11-23", "date_iso": "2026-11-23T07:58:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/siri-barje", "/koket", "/kokets-middag"]}, {"id": 134, "title": "Lågt förtroende för Black friday – men vi vill ändå handla", "summary": "En undersökning gjord på uppdrag av Prisjakt visar att en majoritet av svenskarna misstror de erbjudanden som marknadsförs under Black week och Black friday. Många tror att priserna höjs inför rean eller att jämförpriserna är missvisande, vilket gör att rabatterna framstår som större än de egentligen är. – Majoriteten tror inte på erbjudandena. Det är en stor misstro till att rabatterna är så bra som de ser ut, säger Isabella Ahmadi, konsumentexpert på Prisjakt. Så ser säljknepen ut Hon menar att det finns flera säljknep inom handeln för att få konsumenter att handla mer än planerat. Det kan handla om gratis frakt över en viss summa, nedräkningar eller märkningar som ”populär” och ”säljer snabbt”. – Men det allra vanligaste är att vi faller för rabatten. Vi ser procentsatsen och tänker att så här mycket sparar jag. Vi glömmer lite bort vad varan faktiskt kostar och vad den kan ha kostat tidigare också för den delen, säger Isabella Ahmadi. Det finns lagstiftning som kräver att butiker redovisar det lägsta priset de senaste 30 dagarna, men förtroendet för lagen är lågt. 55 procent av de tillfrågade tror inte att reglerna fungerar som de ska. Mindre ”fulrea” i dag Henrik Ekelund, policyansvarig på Svensk Handel, menar att deras medlemmar följer lagen och att branschen arbetar aktivt för att stärka förtroendet. – Våra medlemsföretag jobbar varje dag för att ge bra erbjudanden och service till konsumenterna. Men det är klart att aktörer som tar genvägar kan sabotera förtroendet, säger han. Han anser att de skärpta reglerna har gjort rean tryggare och att den klassiska ”fulrean” blivit ovanligare. Han uppmanar konsumenter att själva följa prisutvecklingen på varor de är intresserade av och att planera sina inköp. Titta längre tillbaka Det är samma råd som Isabella Ahmadi på Prisjakt ger till alla som är på jakt efter ett fynd. För trots misstron som råder planerar ungefär fyra av tio att shoppa på Black week-rean. – Det finns en väldigt stor köplust och det är egentligen inte så himla konstigt, för det är också ett toppentillfälle att fynda på, säger Isabella Ahmadi. Hennes tips till reasugna är att göra en lista i förväg på vad du behöver eller vill köpa och sätta en ungefärlig budget, så du inte gör impulsköp som du sedan får ångra. Och att titta på prishistoriken. – Titta helst minst tre månader tillbaka eller längre. Då kan du se vad varan brukar kosta och om dagens pris är extra bra, säger hon.", "title_original": "Lågt förtroende för Black frida _original": "Mirakelräddning – låg 14 timmar under rasmassorna", "summary_original": "Minst elva döda i rysk attack", "link": "https://www.tv4.se/artikel/38wXD3gTqTR4cm5FuJWy4U/mirakelraeddning-efter-rysk-attack-lag-14-timmar-under-rasmassorna", "date_display": "2026-11-23", "date_iso": "2026-11-23T06:18:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 137, "title": "Familjens sorg efter mordet på My: ”Smärta varje dag”", "summary": "My var på väg hem efter en utekväll när hon försvann natten mot annandagen vid stationen i Rönninge sydväst om Stockholm. Dagen därpå hittades hon mördad. Åtalet mot den 26-åring som misstänks för mordet väntas enligt åklagaren i början av december. När åtal och rättegång närmar sig riktar hennes familj ett tack till alla som har visat omtanke. ”Vi vill rikta ett varmt och innerligt tack till alla som har visat oss omtanke och stöd efter det fruktansvärda som drabbat vår familj. Inför den kommande rättegången betyder ert stöd oerhört mycket för oss”, skriver familjen till TT genom ett ombud. ”Saknaden och smärtan” ”Att förlora vår älskade dotter och syster är en sorg som inte går att beskriva med ord. Saknaden och smärtan finns med oss varje dag”, fortsätter uttalandet. De skickar samtidigt en vädjan om bli lämnade ifred och att få det utrymme som de behöver för att sörja. ”Vi vädjar återigen till medier och allmänhet att respektera vår sorg och integritet. Varje ny publicering om vår dotter eller den misstänkte gärningsmannen river upp såren och orsakar oss ytterligare smärta”, skriver de. Familjens önskan är att det inte sprids bilder, namn eller andra personliga uppgifter om dottern eller familjen, förklarar de. ”Vi vill inte heller att det som hänt blir föremål för dokumentärer, filmer eller andra faktaprogram. Ingen i familjen kommer att medverka i medier eller kommentera händelsen eller den kommande rättegången. Vi ber också medierna att lämna vår familj och våra nära vänner i fred.” Greps på bar gärning Den misstänkte gärningspersonen greps på bar gärning i samband med att kvinnans kropp hanterades efter mordet. 26-åringen har erkänt grovt gravfridsbrott, men förnekar mord. En rättspsykiatrisk undersökning har visat att personen inte led av en allvarlig psykisk störning vid brottet. Personen är tidigare dömd för grovt barnpornografibrott och försök till människorov.", "title_original": "Familjens sorg efter mordet på My: ”Smärta varje dag”", "summary_original": "My var på väg hem efter en utekväll när hon försvann natten mot annandagen vid stationen i Rönninge sydväst om Stockholm. Dagen därpå hittades hon mördad. Åtalet mot den 26-åring som misstänks för mordet väntas enligt åklagaren i början av december. När åtal och rättegång närmar sig riktar hennes familj ett tack till alla som har visat omtanke. ”Vi vill rikta ett varmt och innerligt tack till alla som har visat oss omtanke och stöd efter det fruktansvärda som drabbat vår familj. Inför den kommande rättegången betyder ert stöd oerhört mycket för oss”, skriver familjen till TT genom ett ombud. ”Saknaden och smärtan” ”Att förlora vår älskade dotter och syster är en sorg som inte går att beskriva med ord. Saknaden och smärtan finns med oss varje dag”, fortsätter uttalandet. De skickar samtidigt en vädjan om bli lämnade ifred och att få det utrymme som de behöver för att sörja. ”Vi vädjar återigen till medier och allmänhet att respektera vår sorg och integritet. Varje ny publicering om vår dotter eller den misstänkte gärningsmannen river upp såren och orsakar oss ytterligare smärta”, skriver de. Familjens önskan är att det inte sprids bilder, namn eller andra personliga uppgifter om dottern eller familjen, förklarar de. ”Vi vill inte heller att det som hänt blir föremål för dokumentärer, filmer eller andra faktaprogram. Ingen i familjen kommer att medverka i medier eller kommentera händelsen eller den kommande rättegången. Vi ber också medierna att lämna vår fami iginal": "200 000 biblar ska delas ut – biskoparna ska ut på Youtube.", "link": "https://www.dagen.se/nyheter/haer-boerjar-uppladdningen-infoer-svenska-kyrkans-bibelregn/10641815", "date_display": "2026-11-23", "date_iso": "2026-11-23T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 144, "title": "Gazpromfamiljen i mångmiljonstrid – med svenska storbanker", "summary": "Det var sommaren 2022, några månader efter Rysslands fullskaliga invasion av Ukraina, som den tidigare Gazpromtoppen försökte föra över mer än sex miljoner euro från Deutsche Bank i Schweiz till ett eget konto hos SEB. Överföringen stoppades med hänvisning till EU:s sanktioner, som förbjuder vissa ryska medborgare att göra större insättningar i europeiska banker. Kort därefter försökte hon i stället föra över pengarna till sin dotter på Östermalm i Stockholm. Efter att två transaktioner stoppats lyckades en överföring på 5,83 miljoner dollar passera bankens kontrollsystem. ”Då överför jag pengarna dit” Enligt SEB hade överföringarna lagts upp för att undvika att använda banksystemet Swift. Banken hänvisar bland annat till ett mejl där dottern beskriver en plan för att först placera pengarna på ett konto i sitt eget namn och senare eventuellt föra tillbaka dem till sin mor. I ett mejl till sin personliga bankrådgivare skriver dottern: ”Sedan när tiden tillåter skapar vi konto till NN (läs modern) och då överför jag pengarna dit.” Makarna bestrider anklagelserna om att ha kringgått sanktionerna och hävdar att pengarna var en laglig gåva från modern. De framhåller också att en förundersökning som inleddes efter SEB:s polisanmälan lades ned 2023. SEB anser dock att det var ett medvetet upplägg för att kringgå de sanktioner som faller över vissa ryska medborgare. Och kvinnan bakom miljonerna är inte vilken rysk medborgare som helst. Hon har tidigare haft flera toppositioner inom den ryska maktapparaten och energijätten Gazprom. Hennes kopplingar till den ryska makteliten går dessutom hela vägen till toppen: Vladimir Putin. Handplockad av Putin Modern har en lång karriär bakom sig i den ryska maktapparaten. Under 1990-talet gör hon och Vladimir Putin karriär samtidigt inom Sankt Petersburgs stadsförvaltning. Det är också här Putin lägger grunden till det politiska nätverk som senare följer honom till Kreml. Flera ryska dokument belägger deras samröre. Vid minst två tillfällen var de ledamöter i samma kommissioner. Och kontakterna tycks ha uppskattats av den blivande presidenten. I början av 2000-talet beskrivs hon i rysk affärsmedia som en person i Putins makt krets. När Vladimir Putin blir president för första gången ska han ha handplockat henne till sin administration, enligt en rådgivare som citerats i rysk affärsmedia. Hon blir bland annat biträdande chef för presidentadministrationens ekonomiska förvaltning. Under samma period figurerar hon högt på listor över landets mäktigaste kvinnor. När hon senare får toppjobb på Gazprom lyfter bolaget självt fram hennes bakgrund inom Putins politiska organisation. Inom Gazprom har hon har bland annat varit ledamot i moderbolagets ledningskommitté. Enligt dotterns utsago fick hon sammanlagt minst 267 miljoner rubel i arvoden från fem olika Gazpromanknutna bolag under perioden 2005–2014. Men familjens relation till det svenska banksystemet har varit betydligt mer komplicerad. Gazprom på Östermalm Även dottern har gått i moderns fotspår. Hon har haft höga befattningar inom Gazproms företagsstruktur, bland annat som styrelseledamot i det Gazpromkontrollerade projekteringsföretaget Giprospetsgaz. Det framgår av energijättens egna kvartalsrapporter från 2010-talet. Bolaget har bland annat varit huvudprojektör för den ryska landbaserade infrastrukturen kopplad till gasledningarna Nord Stream. Numera bor dottern tillsammans med sin make på en av Östermalms mest exklusiva adresser i Lärkstaden. Makarna har stämt SEB efter att banken sagt upp deras konton och banktjänster. Men problemen med de svenska bankerna slutade inte där. 16 nya miljoner stoppade I våras stoppade Nordea en överföring på 16,2 miljoner kronor från dottern till hennes make, visar handlingar som TV4 Nyheterna har tagit del av. Pengarna skulle enligt hennes egen utsago användas för att finansiera ett bostadsrättsköp i Stockholm. Nordea ansåg dock att dottern inte hade kunnat styrka pengarnas ursprung och avslutade hennes banktjänster. Därefter har paret även stämt Nordea. Stockholms tingsrätt har i två separata beslut avslagit parets begäranden om att tillfälligt tvinga bankerna att återställa tjänsterna. Det senaste beslutet meddelades den 28 oktober. Därmed pågår rättsliga tvister med två svenska storbanker om tillgången till banktjänster, efter överföringar på mångmiljonbelopp med kopplingar till den ryska energijätten. Om bankerna haft rätt att säga upp kundrelationerna är ännu inte slutligt avgjort. Paret har via sitt juridiska ombud avböjt att kommentera. Nordea har med hänvisning till banksekretessen avböjt att kommentera ärendet.", "title_original": "Gazpromfamiljen i mångmiljonstrid – med svenska storbanker", "summary_original": "Det var sommaren 2022, några månader efter Rysslands fullskaliga invasion av Ukraina, som den tidigare Gazpromtoppen försökte föra över mer än sex miljoner euro från Deutsche Bank i Schweiz till ett eget konto hos SEB. Överföringen stoppades med hänvisning till EU:s sanktioner, som förbjuder vissa ryska medborgare att göra större insättningar i europeiska banker. Kort därefter försökte hon i stället föra över pengarna till sin dotter på Östermalm i Stockholm. Efter att två transaktioner stoppats lyckades en överföring på 5,83 miljoner dollar passera bankens kontrollsystem. ”Då överför jag pengarna dit” Enligt SEB hade överföringarna lagts upp för att undvika att använda banksystemet Swift. Banken hänvisar bland annat till ett mejl där dottern beskriver en plan för att först placera pengarna på ett konto i sitt eget namn oc a", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/inrikes", "/ryssland", "/sanktioner-mot-ryssland", "/seb", "/nordea"]}, {"id": 145, "title": "Nytt GPS-system varnar vid olyckor", "summary": "Ett nytt digitalt varningssystem ska göra trafiken säkrare genom att förvarna bilister när vägarbeten eller trafikolyckor pågår. Varningarna ska ge trafikanter bättre förutsättningar att uppmärksamma skyddsfordon som jobbar på vägarna innan det är för sent. Väg- och anläggningsföretaget Svevia och BM systems ligger bakom tekniken och har använt data från ett redan befintligt GPS-system. Cirka sju tusen skyddsfordon bidrar idag med data till projektet. Kristoffer Hägvall, platschef på Svevia i Stockholm, berättar att systemet kan komma att göra skillnad. – Vi hoppas att det här ska kunna minska antalet olyckor som sker i samband med skyddsfordon. I vår bransch är det ungefär ett skyddsfordon i veckan som blir påkört i samband med en utryckning, säger han. Varningar kan minska kollisioner med 90 procent En studie från University of Minnesota i USA visar att kollisioner med utryckningsfordon minskade med upp till 90 procent när tidiga förhandsvarningar användes. Förhoppningen är att de digitala varningarna ska få en liknande effekt i Sverige. De digitala varningarna är ett led i arbetet med trafiksäkerhet, berättar Noel Alldritt, lösningsarkitekt på Trafikverket. – Den här digitala tjänsten är bara en typ av insats som vi gör. Det finns massa andra typer av insatser vi använder och jobbar med för att öka trafiksäkerheten, säger han. Fler varningar på fler vägar I dag skickas redan omkring 450 tusen varningar ut varje månad, en siffra som väntas öka. Framöver väntas fler navigationstjänster och biltillverkare ansluta sig till projektet, berättar platschef Kristoffer Hägvall. – Idag funkar varningssystemet på statliga vägar och framåt ska det även fungera på kommunala vägar, där du som trafikant kan använda de vanliga kartapparna, såsom Google Maps, Apple Maps eller Waze, för att få varningarna, säger han.", "title_original": "Nytt GPS-system varnar vid olyckor", "summary_original": "Ett nytt digitalt varningssystem ska göra trafiken säkrare genom att förvarna bilister när vägarbeten eller trafikolyckor pågår. Varningarna ska ge trafikanter bättre förutsättningar att uppmärksamma skyddsfordon som jobbar på vägarna innan det är för sent. Väg- och anläggningsföretaget Svevia och BM systems ligger bakom tekniken och har använt data från ett redan befintligt GPS-system. Cirka sju tusen skyddsfordon bidrar idag med data till projektet. Kristoffer Hägvall, platschef på Svevia i Stockholm, berättar att systemet kan komma att göra skillnad. – Vi hoppas att det här ska kunna minska antalet olyckor som sker i samband med skyddsfordon. I vår bransch är det ungefär ett skyddsfordon i veckan som blir påkört i samband med en utryckning, säger han. Varningar kan minska kollisioner med 90 procent En studie från University of Minnesota i USA visar att kollisioner med utryckningsfordon minskade med upp till 90 procent när tidiga förhandsvarningar användes. Förhoppningen är att de digitala varningarna ska få en liknande effekt i Sverige. De digitala varningarna är ett led i arbetet med trafiksäkerhet, berättar Noel Alldritt, lösningsarkitekt på Trafikverket. – Den här digitala tjänsten är bara en typ av insats som vi gör. Det finns massa andra typer av insatser vi använder och jobbar med för att öka trafiksäkerheten, säger han. Fler varningar på fler vägar I dag skickas redan omkring 450 tusen varningar ut varje månad, en siffra som väntas öka. Framöver väntas fler navigationstjänster och biltillverkare ansluta sig till projektet, berättar platschef Kristoffer Hägvall. – Idag funkar varningssystemet på statliga vägar och framåt ska det även fungera på kommunala vägar, där du som trafikant kan använda de vanliga kartapparna, såsom Google Maps, Apple Maps eller Waze, för att få varningarna, säger han.", "link": "https://www.tv4.se/artikel/3ppTF6ChxUpddkilje8DID/nytt-gps-system-varnar-vid-olyckor", "date_display": "2026-11-22", "date_iso": "2026-11-22T21:14:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/trafikverket", "/trafikolyckor"]}, {"id": 146, "title": "Robinson-vinnaren: ”Fick typ blackout”", "summary": "Finalen, där Juliette Bergkvist och Philip Denik fick nöja sig med en delad andraplats, minns hon knappt. Efteråt har 38-åringen fått fråga de andra deltagarna hur länge de simmade, pricksköt och löste olika moment innan hon till slut kunde lyfta Robinsonstatyetten. – De uppskattar kanske att själva inspelningstiden är sex till sju timmar, men kanske bara en timme effektiv tävling. Men jag har absolut ingen aning, säger Petra Sjödin till TV4 Nyheterna. – Jag fick typ blackout, i princip. Jag stängde ute alla känslor som fanns i min kropp. Det är en väldigt konstig känsla för mig. Jag tror aldrig att jag duger. Jag måste vinna för att bevisa för mig själv att jag klarar av saker. Men när jag väl når det målet så blir jag så chockad att jag inte riktigt vet hur jag ska bete mig.  ”Jag är inte en social människa” Petra Sjödin från Umeå/Örnsköldsvik hade som mål att vara sig själv, skapa genuina vänskaper och undvika ett hårt spel med pakter och knivhugg i ryggen. Hon var med i Robinson för att utmana sig själv, inte för att göra tv. – Och uppenbarligen gick det ganska långt. Man vill ju komma till sammanslagningen och börja tävla för sig själv, för det är just tävla som jag älskar. Det är det sociala spelet jag har varit rädd för. – Jag är ju inte en social människa. Jag sitter ju för mig själv i skogen och kollar på fåglar. Jag är inte den som är ute och härjar bland människor. Jag tycker det är väldigt skönt att vara själv. Samtidigt stämmer kanske inte riktigt tittarnas bild av henne som den där lågmälda personen som bara gled under radarn i programmet. – Utan jag visste var jag hade människor ganska tidigt och då ansåg inte jag att jag behövde göra någon big deal av det utan jag litade på mina vänner. Inför äventyret hade hon inte förberett sig särskilt mycket, varken fysiskt eller genom att analysera tidigare säsonger av Robinson i soffan. – Jag har ju tävlat och sportat liksom hela mitt liv. Så det känns som att det är ingenting som jag känner att jag behöver öva på. Samma sak, hålla på med tändstål. Jag har tändstål när jag far ut och fiskar eller grillar hemma. Det är ingenting som är konstigt i min vardag. Det ska hon göra för pengarna Under söndagen har hon sett Robinsonfinalen i en liten bygdegård tillsammans med vänner och familj. För vinstpengarna på en halv miljon kronor kan det bli en resa till Alaska och snöskoteråkning. – Jag känner att jag måste göra någonting som jag vill göra och faktiskt tänka på mig själv för en gångs skull. För det brukar inte riktigt vara min starka grej att prioritera mig själv, säger Petra Sjödin.", "title_original": "Robinson-vinnaren: ”Fick typ blackout”", "summary_original": "Finalen, där Juliette Bergkvist och Philip Denik fick nöja sig med en delad andraplats, minns hon knappt. Efteråt har 38-åringen fått fråga de andra deltagarna hur länge de simmade, pricksköt och löste olika moment innan hon till slut kunde lyfta Robinsonstatyetten. – De uppskattar kanske att själva inspelningstiden är sex till sju timmar, men kanske bara en timme effektiv tävling. Men jag har absolut ingen aning, säger Petra Sjödin till TV4 Nyheterna. – Jag fick typ blackout, i princip. Jag stängde ute alla känslor som fanns i min kropp. Det är en väldigt konstig känsla för mig. Jag tror aldrig att jag duger. Jag måste vinna för att bevisa för mig själv att jag klarar av saker. Men när jag väl når det målet så blir jag så chockad att jag inte riktigt vet hur jag ska bete mig.  ”Jag är inte en social människa” Petra Sjödin från Umeå/Örnsköldsvik hade som mål att vara sig själv, skapa genuina vänskaper och undvika ett hårt spe rten om vänskapen: Nu ser Ryssland Europa som huvudfienden", "summary": "På en bild publicerad på Trumps Truth Social-konto syns en leende Putin skaka hand med den amerikanske presidenten, som lutar sig fram mot Putins öra. Ovanför bilden finns texten ”min vän”. Trump har fått mycket kritik för sitt uttalande under Apecmötet i Kina i veckan, då han i en vida spridd video pekar på Putin och säger att ”han är min vän”. Dagen efter försvarade han beskrivningen, trots Rysslands fortsatta aggression efter den fullskaliga invasionen av Ukraina 2022: – Jag har ett fantastiskt bra förhållande till Putin och det är väldigt bra. Jag har ett fantastiskt förhållande till Xi, det är också bra. USA är tryggt tack vare det.  Däremot kunde den amerikanske presidenten inte svara på om Putin är en vän till USA eller inte. Så ser Ryssland på USA Hur Ryssland ser på USA är en annan femma. – Här har det skett en ganska stor förändring. För de senaste decennierna har Ryssland sett USA som den stora fienden och Europa som någon form av marionett till USA, förklarar Oscar Jonsson, doktor i rysk krigsföring vid Försvarshögskolan, i Nyhetsmorgon. – Det har förändrats med Trumpadministrationen, i synnerhet den andra Trumpadministrationen. Nu, för första gången på länge, ser man Europa som huvudfienden och så ser man lite tudelat på USA, fortsätter han. Jonsson utvecklar: – Å ena sidan ser man Trump som väldigt positiv. Å andra sidan är USA fortfarande ärkefienden, där CIA arbetar med att stötta Ukraina väldigt mycket i deras drönarangrepp mot ryska raffinaderier och så vidare. Zelenskyjs kritik: ”En mördare” Ukraina och flera allierade reagerade starkt på Trumps påstådda vänskap med Putin – efterlyst för krigsbrott av Internationella brottmålsdomstolen ICC. – För oss är han en mördare, säger Ukrainas president Volodymyr Zelenskyj. I intervjun slår han också fast att Putin inte sätts under tillräcklig press.", "title_original": "Experten om vänskapen: Nu ser Ryssland Europa som huvudfienden", kel/1hEVIVaJrXJ8UnPjwtRhRh/oron-inom-c-s-vaensterfalang-vi-aer-pa-vaeg-att-foerlora", "date_display": "2026-11-22", "date_iso": "2026-11-22T16:28:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/"]}, {"id": 151, "title": "Sirius håller gulddrömmen vid liv", "summary": "Sirius behövde en seger mot Djurgården för att sätta tryck på Hammarby i den allsvenska SM-guldstriden och bärgade i slutändan en viktig 1-0-seger hemma på Studenternas IP i Uppsala. Sirius inledde lovande och kom tidigt till en bra möjlighet, där Oscar Krusnell sköt en bit utanför mål. Därefter fortsatte Uppsala-laget att trycka på för ett ledningsmål, innan Djurgården blev tilldelat en straff efter tio minuters spel. Kristian Lien nickade först bollen på Henrik Rönnlöf Castegrens ena arm i straffområdet och brände sedan möjligheten, då han sköt utanför mål, vilket fick Dif-supportrar att jubla ordentligt på läktarplats. En hel del blårandiga fans ville nämligen inte se en seger i dag med risk för att hjälpa rivalen Hammarby i guldstriden. – En fruktansvärt dålig straff, sa Lien till TV4 under pausvilan. Underrubrik Djurgården hade därefter mest boll och hotade offensivt, där Christos Almyras var nära med en nick mot mål efter en hörna, men den gången stod Mohamed Soumah i vägen vid mållinjen.  I slutet av första halvlek stod Matias Siltanen för en felpassning som gav Isak Bjerkebo ett bra läge i straffområdet, där han blev nergjord av Miro Tenho, men utan att få med sig en elvametersspark. Matthias Nartey hade sedan även mer eller mindre öppet mål på ett inspel, men sköt utanför. Nartey skulle dock få en till chans i första akten och satte i 44:e minuten 1-0 på en retur framför mål. Därmed fick mittfältaren jubla över sitt första mål i den blåsvarta dressen i sin första start sedan i april i år i allsvenskan. Bland Sirius-fans var det stor glädje efter fullträffen, men också bland en hel del bortasupportrar. – Det betyder mycket. Jag har inte spelat på ett par veckor på grund av skador. Nu tror tränaren och alla andra på mig. Det är kul att starta och göra ett mål, säger Nartey. Underrubrik I början av andra halvlek turades Sirius och Djurgården om att ha boll, men utan att komma till några heta lägen. Djurgården var nära ett kvitteringsmål i 66:e minuten när Bo Hegland tog ett hårt avslut mot mål, men fick se David Celic rädda. I slutskedet fick även Joakim Persson ett kanonläge för utökad ledning, men lyckades inte få iväg sitt avslut på mål. Sirius vann till slut med 1-0 och är därmed nu i serieledning med tre poäng ner till Hammarby, som har bättre målskillnad, på andra plats i guldstriden. På måndag ställs Hammarby mot IFK Göteborg hemma på 3Arena. I sista omgången ställs Sirius mot IFK Göteborg borta, medan Hammarby spelar mot Västerås SK på bortaplan. Djurgården, som är på tredje plats, möter i sin tur BK Häcken på 3Arena i slutomgången.", "title_original": "Sirius håller gulddrömmen vid liv", "summary_original": "Sirius behövde en seger mot Djurgården för att sätta tryck på Hammarby i den allsvenska SM-guldstriden och bärgade i slutändan en viktig 1-0-seger hemma på Studenternas IP i Uppsala. Sirius inledde lovande och kom tidigt till en bra möjlighet, där Oscar Krusnell sköt en bit utanför mål. Därefter fortsatte Uppsala-laget att trycka på för ett ledningsmål, innan Djurgården blev tilldelat en straff efter tio minuters spel. Kristian Lien nickade först bollen på Henrik Rönnlöf Castegrens ena arm i straffområdet och brände sedan möjligheten, då han sköt utanför mål, vilket fick Dif-supportrar att jubla ordentligt på läktarplats. En hel del blårandiga fans ville nämligen inte se en seger i dag med risk för att hjälpa rivalen Hammarby i guldstriden. – En fruktansvärt dålig straff, sa Lien till TV4 under pausvilan. Underrubrik Djurgården hade därefter mest boll och hotade offensivt, där Christos Almyras var nära med en nick mot mål efter en hörna, men den gången stod Mohamed Soumah i vä nget totalt misslyckande", "summary": "Redan från början var förväntningarna lågt ställda. Det geopolitiska läget och inte minst Donald Trump, Xi Jinping och Vladimir Putins möte nyligen, där de pratade om att skruva upp produktionen av oljeprodukter, kastade en skugga över mötet.\n\nLänder som Saudiarabien och Ryssland vägrade godkänna några som helst formuleringar om utfasning av fossila bränslen. Tvärtom låg de bakom de sista förslagen på avtalstext som innehöll skrivningar om koldioxidinfångning. Att det skulle vara okej att elda fossila bränslen bara man fångar in koldioxiden som bildas. Men det här är en mycket tveksam teknik. Vi på TV4 har tidigare avslöjat hur Förenade Arabemiratens oljebolag använder tekniken för att få ut mer olja ur sina oljekällor.  Många såg rött  I slutet av mötet blev det alltmer tydligt att oljeländernas alltmer framskjutna positioner fick EU att se rött. Och inte bara EU förresten, utan även Panama i Latinamerika vägrade godkänna att fossilutfasning inte fanns med i slutdokumentet.\n\nFaktum är att det under mötets gång har samlats allt fler länder bakom kravet på att komma bort från fossila bränslen. Det är alltså inte bara är oljeländerna som formerar sig, utan även de som vill ha ett slut på olje-eran. De länderna går framåt i allt större konstellationer och frågar sig: varför ska några få länder kunna blockera beslut som effektivt skulle kunna bromsa uppvärmningen?\n\nPå klimatmötena tas nämligen alla beslut i konsensus. Men det är nu en praxis som alltmer ifrågasätts.  Ett misslyckande?  Frågan är då: blev COP31 ett misslyckande? Är det här slutet för världens samarbete för att lindra klimatförändringarna?\n\nDet verkar faktiskt inte vara så många som tror det. Även om COP31 nu har slutat utan ett slutdokument, en så kallad cover decision, där de mest ambitiösa formuleringarna brukar stå, så har man klubbat många andra mindre känsliga tekniska frågor. Så ett totalt misslyckande är det inte.\n\nAtt man inte nådde ända fram betyder det inte heller att de internationella klimatförhandlingarna är meningslösa. Tvärtom. Man kan tycka att FN är tandlöst men om varje land istället hade skött sig helt själv och släppt ut koldioxid efter behag så hade nog kvicksilvret i termometrarna skyndat upp ett par grader extra.", "title_original": "Därför är detta inget totalt misslyckande", "summary_original": "Redan från början var förväntningarna lågt ställda. Det geopolitiska läget och inte minst Donald Trump, Xi Jinping och Vladimir Putins möte nyligen, där de pratade om att skruva upp produktionen av oljeprodukter, kastade en skugga över mötet.\n\nLänder som Saudiarabien och Ryssland vägrade godkänna några som helst formuleringar om utfasning av fossila bränslen. Tvärtom låg de bakom de sista förslagen på avtalstext som innehöll skrivningar om koldioxidinfångning. Att det skulle vara okej att elda fossila bränslen bara man fångar in koldioxiden som bildas. Men det här är en mycket tveksam teknik. Vi på TV4 har tidigare avslöjat hur Förenade Arabemiratens oljebolag använder tekniken för att få ut mer olja ur sina oljekällor.  Många såg rött  I slutet av mötet blev det alltmer tydligt att oljeländernas alltmer framskjutna positioner fick EU att se rött. Och inte bara EU förresten, utan även Panama i Latinamerika vägrade godkänna att fossilutfasning inte fanns med i slutdokumentet.\n\nFaktum är att det under mötets gång har samlats allt fler länder bakom kravet på att komma bort från fossila bränslen. Det är alltså inte bara är oljeländerna som formerar sig, utan även de som vill ha ett slut på olje-eran. De länderna går framåt i allt större konstellationer och frågar sig: varför ska några få länder kunna blockera beslut som effektivt skulle kunna bromsa uppvärmningen?\n\nPå klimatmötena tas nämligen alla beslut i konsensus. Men det är nu en praxis som alltmer ifrågasätts.  Ett misslyckande?  Frågan är då: blev COP31 ett misslyckande? Är det här slutet för världens samarbete för att lindra klimatförändring   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
