ed and unconscious by the bike lane", "summary": "Samuel Björling: I have gained perspective on life and increased gratitude", "title_original": "Prästen Samuel, 40, hittades skadad och medvetslös vid cykelbanan", "summary_original": "Samuel Björling: Jag har fått perspektiv på livet och en ökad tacksamhet", "link": "https://www.dagen.se/livsstil/praesten-samuel-40-hittades-skadad-och-medvetsloes-vid-cykelbanan/10310806", "date_display": "2026-04-26", "date_iso": "2026-04-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Trump is being evacuated here - after the shooting", "summary": "Security personnel met", "title_original": "Här evakueras Trump – efter skottlossningen", "summary_original": "Säkerhetspersonal träffades", "link": "https://www.tv4.se/artikel/tt-260426-usaevakuering1-4b70cb17/trump-evakuerad-fran-middag-efter-skott", "date_display": "2026-04-26", "date_iso": "2026-04-26T00:45:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 160, "title": "L's double message on the SD issue: Yes in Sweden, no in Stockholm", "summary": "The fight for the Stockholmers • \"Very important\"", "title_original": "L:s dubbla besked i SD-frågan: Ja i Sverige, nej i Stockholm", "summary_original": "Kampen om Stockholmarna • ”Jätteviktigt”", "link": "https://www.tv4.se/artikel/3O7QTrRLLi8FweRtnpWkcv/l-s-dubbla-besked-i-sd-fragan-ja-i-sverige-nej-i-stockholm", "date_display": "2026-04-25", "date_iso": "2026-04-25T19:17:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Liberalerna", "/valet-2022/liberalerna"]}, {"id": 161, "title": "Then the trendy dietary supplement can become dangerous: \"Upsets the balance\"", "summary": "Electrolytes are marketed today as crucial to both health and performance. But according to nutritional physiologist Kristina Andersson, electrolyte supplements are unnecessary in the vast majority of cases. - Electrolytes are vital for us. But that's not the same as us needing to take supplements of them, she says. Electrolytes, such as sodium, potassium and magnesium, are needed, among other things, for fluid balance, nerve function and muscles. But Andersson believes that marketing often plays on just this. - That's where it gets crazy, when you can market something that is only based on its function, she says. No extra effect According to Andersson, there is no support for ordinary exercisers and people in everyday life that expensive electrolyte drinks or powders have a better effect than ordinary food and water. - No, I wouldn't say that. Not as it is marketed today, broadly to everyone, she says. The situations where electrolytes may actually need to be replaced are few and clear. - It's about hard physical activity where you sweat a lot, often in the heat. Then you lose above all salt, says Andersson. And the solution doesn't have to be advanced. - It is actually common salt, sodium chloride, that you lose the most. Then it belongs to replace just that, says Andersson. Too much can be a problem According to Kristina Andersson, taking electrolyte supplements daily, without need, can instead involve risks. - These are potent substances. If we get too much of it, it causes trouble, she says. - If we get too much of these substances, which we can get through supplements but not through food, it can upset the balance in the body and, for example, damage the kidneys. Sodium in particular can become a problem in large amounts, as a high intake can contribute to elevated blood pressure. But according to Kristina Andersson, the same principle applies to all nutrients. - More doesn't make the functions work better if you don't have a shortage, says Andersson. Broader trend She largely believes that electrolytes have become a big trend", "title_original": "Då kan trendiga kosttillskottet bli farligt: ”Rubbar balansen”", "summary_original": "Elektrolyter marknadsförs i dag som avgörande för både hälsa och prestation. Men enligt näringsfysiologen Kristina Andersson är elektrolyttillskott i de allra flesta fall onödiga. – Elektrolyter är livsavgörande för oss. Men det är inte samma sak som att vi behöver ta tillskott av dem, säger hon. Elektrolyter, som natrium, kalium och magnesium, behövs bland annat för vätskebalans, nervfunktion och muskler. Men Andersson menar att marknadsföringen ofta spelar på just detta. – Det är där det blir tokigt, när man kan marknadsföra någonting som bara bygger på dess funktion, säger hon. Ingen extra effekt För vanliga motionärer och människor i vardagen finns det enligt Andersson inget stöd för att dyra elektrolytdrycker eller pulver ger bättre effekt än vanlig mat och vatten. – Nej, det skulle jag inte säga. Inte så som det marknadsförs i dag, brett till alla, säger hon. De situationer där elektrolyter faktiskt kan behöva ersättas är få och tydliga. – Det handlar om hård fysisk aktivitet där man svettas mycket, ofta i värme. Då tappar man framför allt salt, säger Andersson. Och lösningen behöver inte vara avancerad. – Det är egentligen vanligt salt, natriumklorid, som man tappar mest. Då hör det hemma att ersätta just det, säger Andersson. För mycket kan bli ett problem Att ta elektrolyttillskott dagligen, utan behov, kan enligt Kristina Andersson i stället innebära risker. – Det här är potenta ämnen. Får vi oss alltför mycket av det så ställer det ju till besvär, säger hon. – Får vi för mycket av de här ämnena, vilket vi kan få via tillskott men inte via maten, så kan det rubba balansen i kroppen och till exempel skada njurarna. Särskilt natrium kan bli ett problem i stora mängder, eftersom ett högt intag kan bidra till förhöjt blodtryck. Men enligt Kristina Andersson gäller samma princip för alla näringsämnen. – Mer gör inte att funktionerna fungerar bättre om man inte har brist, säger Andersson. Bredare trend Att elektrolyter blivit en stor trend tror hon till stor del handlar om marknadsföring. – Det går att tjäna pengar på det, säger hon. Hon ser också en bredare tillskottstrend, särskilt bland unga. – Det känns mycket roligare och häftigare att hålla på med massor av tillskott än att äta välbalanserat och lite av varje för att få i sig de här ämnena, säger hon.", "link": "https://www.tv4.se/artikel/5mVNydamu08uZDtN8GjFLF/da-kan-trendiga-kosttillskottet-bli-farligt-rubbar-balansen", "date_display": "2026-04-25", "date_iso": "2026-04-25T18:28:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/naring", "/trender", "/sociala-medier", "/traning", "/motionarer", "/motion"]}, {"id": 162, "title": "'We want to show that prayer and activism are connected'", "summary": "Robert Eriksson about the ongoing Spring meeting in Gothenburg", "title_original": "'Vi vill visa att bön och aktivism hör samman'", "summary_original": "Robert Eriksson om det pågående Vårmötet i Göteborg", "link": "https://www.dagen.se/nyheter/vi-vill-visa-att-boen-och-aktivism-hoer-samman/10316211", "date_display": "2026-04-25", "date_iso": "2026-04-25T13:10:37+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Belief in creation and sex – daring questions when SVT subjected Ebba Busch to a prejudice test", "summary": "The KD leader: Don't you think it is possible to combine the theory of evolution and Darwin with the creation story?", "title_original": "Skapelsetro och sex – vågade frågor när SVT utsatte Ebba Busch för fördomstest", "summary_original": "KD-ledaren: Tror du inte att det går att kombinera evolutionsläran och Darwin med skapelseberättelsen?", "link": "https://www.dagen.se/nyheter/skapelsetro-och-sex-vagade-fragor-naer-svt-utsatte-ebba-busch-foer-foerdomstest/10316194", "date_display": "2026-04-25", "date_iso": icking for sexual exploitation in Europe and globally", "summary": "On 13 April, the French and Swedish Ministers for Gender Equality Aurore Bergé and Nina Larsson met in Paris. They discussed their national experiences in preventing and combating sexual exploitation and reaffirmed their commitment to the French - Swedish joint strategy to combat human trafficking for sexual exploitation in Europe and globally.", "title_original": "The French and Swedish Ministers for Gender Equality reaffirm partnership to combat human trafficking for sexual exploitation in Europe and globally", "summary_original": "On 13 April, the French and Swedish Ministers for Gender Equality Aurore Bergé and Nina Larsson met in Paris. They discussed their national experiences in preventing and combating sexual exploitation and reaffirmed their commitment to the French - Swedish joint strategy to combat human trafficking for sexual exploitation in Europe and globally.", "link": "https://www.government.se/articles/2026/04/the-french-and-swedish-ministers-for-gender-equality-reaffirm-partnership-to-combat-human-trafficking-for-sexual-exploitation-in-europe-and-globally/", "date_display": "2026-04-23", "date_iso": "2026-04-23T12:21:06+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "3 days old", "tags": ["International", "Ministry of Employment", "Democracy and human rights", "Gender equality", "Article", "Nina Larsson"]}, {"id": 183, "title": "Government presents proposals to increase pressure on illegal settlements in West Bank", "summary": "The Government takes an extremely serious view of the continuing settlement policy and the increased settler violence in the West Bank, and is therefore proposing new measures in the form of an expanded differentiation policy. The Israeli Government’s actions in the West Bank violate international law.", "title_original": "Government presents proposals to increase pressure on illegal settlements in West Bank", "summary_original": "The Government takes an extremely serious view of the continuing settlement policy and the increased settler violence in the West Bank, and is therefore proposing new measures in the form of an expanded differentiation policy. The Israeli Government’s actions in the West Bank violate international law.", "link": "https://www.government.se/press-releases/2026/04/government-presents-proposals-to-increase-pressure-on-illegal-settlements-in-west-bank/", "date_display": "2026-04-21", "date_iso": "2026-04-21T09:21:32+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["Press release", "EU", "International", "Ministry for Foreign Affairs", "Trade and investment promotion", "Foreign and security policy", "International law", "Response to the situation in Israel/Palestine", "Benjamin Dousa"]}, {"id": 184, "title": "Government announces SEK 15.4 million in support to democracy and cultural heritage preservation in Ukraine", "summary": "The Government is presenting a new support package focused on democracy and cultural heritage preservation in Ukraine of SEK 15.4 million for 2026–2028, SEK 8.7 million of which is for 2026. The support includes SEK 3 million to the National Democratic Institute (NDI), SEK 0.9 million to the Council of Europe and SEK 1.5 million to the OSCE Office for Democratic Institutions and Human Rights (ODIHR) for 2026. The support to cultural heritage initiatives includes SEK 10 million to Gotlands Museum for 2026–2028.", "title_original": "Government announces SEK 15.4 million in support to democracy and cultural heritage preservation in Ukraine", "summary_original": "The Government is presenting a new support package focused on democracy and cultural heritage preservation in Ukraine of SEK 15.4 million for 2026–2028, SEK 8.7 million of which is for 2026. The support includes SEK 3 million to the National Democratic Institute (NDI), SEK 0.9 million to the Council of Europe and SEK 1.5 million to the OSCE Office for Democratic Institutions and Human Rights (ODIHR) for 2026. The support to cultural heritage initiatives includes SEK 10 million to Gotlands Museum for 2026–2028.", "link": "https://www.government.se/press-releases/2026/04/government-announces-sek-15.4-million-in-support-to-democracy-and-cultural-heritage-preservation-in-ukraine", "date_display": "2026-04-20", "date_iso": "2026-04-20T15:08:41+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Sweden's support to Ukraine", "Benjamin Dousa"]}, {"id": 185, "title": "Sweden increases humanitarian support to Lebanon", "summary": "Sweden is announcing an additional humanitarian support package to Lebanon of SEK 70 million. The support is being provided in light of the country’s worsening humanitarian situation due to the conflict between Israel and Hezbollah. It will contribute to addressing basic needs, protecting the civilian population and creating security for those who have been hardest-hit by the conflict.", "title_original": "Sweden increases humanitarian support to Lebanon", "summary_original": "Sweden is announcing an additional humanitarian support package to Lebanon of SEK 70 million. The support is being provided in light of the country’s worsening humanitarian situation due to the conflict between Israel and Hezbollah. It will contribute to addressing basic needs, protecting the civilian population and creating security for those who have been hardest-hit by the conflict.", "link": "https://www.government.se/press-releases/2026/04/sweden-increases-humanitarian-support-to-lebanon/", "date_display": "2026-04-20", "date_iso": "2026-04-20T12:02:07+00:00", "source": "Government.se", "ministr bba Busch"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
