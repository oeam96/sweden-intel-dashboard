ve deportation orders, according to Louise Dane, a lawyer at the Asylum Rights Centre. - What kind of valve are they thinking of? They didn't want to answer that.", "title_original": "Jurist om Tidöpartiernas besked: Mycket är oklart", "summary_original": "Tonårsutvisningarna pausas, meddelade Tidöpartierna på fredagen. Men det är oklart hur förslagen kommer att se ut, och vad som händer med de som redan har utvisningsbeslut, enligt Louise Dane, jurist vid Asylrättscentrum. – Vad är det för ventil de tänker sig? Det ville de inte svara på.", "link": "https://www.dn.se/sverige/jurist-om-tidopartiernas-besked-mycket-ar-oklart/", "date_display": "2026-03-06", "date_iso": "2026-03-06T16:54:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Companies pressure dissatisfied customers to raise their ratings on Trustpilot", "summary": "It was in January that Emma bought a carpet from the company Mattadirekt.se.  When the delivery was delayed, Emma emailed the company several times without receiving a reply. After three weeks and a final email, the company responded via its customer service and apologized for the delay. They also offered a 30 percent discount as compensation – in exchange for her raising her rating on Trustpilot. - I replied that it sounds like extortion, says Emma to TV4 Nyheterna. Warned on Facebook Emma then decided to make a post in a Facebook group where consumers warn about rogue companies, where she posted a screenshot of the email. Mattadirekt.se then emailed again and claimed that she hung up people in the company and shared confidential information. - I experienced it as more or less a threat, says Emma, ​​who then hid the names in the images on the emails from customer service, but neither took down the post nor raised the Trustpilot rating. \"It started to get uncomfortable\" After this, Emma and her husband started receiving calls from hidden numbers, which turned out to be Mattadirekt.se. They also contacted her via messages on Facebook and Instagram threatening legal action if she did not remove the post within 24 hours. - Then I thought it was starting to get uncomfortable. If they have gone this far, how much further will they go? says Emma, ​​who contacted the police who could confirm she had done nothing wrong. When Emma asked the company to stop calling in an email, they replied that she would never be able to prove that it was them who called, as it was not in their call logs and she did not have a caller ID. \"You get cheated after all\" Emma is not alone in her experience. Just over a year ago, Sanna Håkansson wrote a negative review about Mattadirekt.se on Trustpilot after problems with deliveries. Then it didn't take long before the company got in touch, she says. - He said, we have sent them by express shipping so they will arrive tomorrow and you will get them for free, you can keep the carpets. But then you are welcome to remove your review", "title_original": "Företag pressar missnöjda kunder att höja betyg på Trustpilot", "summary_original": "Det var i januari som Emma köpte en matta från företaget Mattadirekt.se.  När leveransen dröjde mejlade Emma företaget flera gånger utan att få svar. Efter ett tre veckor och ett sista mejl svarade företaget via sin kundtjänst och bad om ursäkt för förseningen. De erbjöd också 30 procents rabatt som kompensation – mot att hon höjde sitt betyg på Trustpilot. – Jag svarade att det låter som utpressning, säger Emma till TV4 Nyheterna. Varnade på Facebook Emma bestämde sig då för att göra ett inlägg i en Facebookgrupp där konsumenter varnar om oseriösa företag, där hon lade ut en skärmdump på mejlet. Mattadirekt.se mejlade då igen och påstod att hon hängt ut personer i företaget och delat konfidentiell information. – Jag upplevde det som mer eller mindre hot, säger Emma, som då dolde namnen i avbilderna på mejlen från kundtjänst, men varken tog ner inlägget eller höjde Trustpilotbetyget. ”Det började bli obehagligt” Efter detta började Emma och hennes man få samtal från dolda nummer, vilket visade sig vara Mattadirekt.se. De kontaktade henne också via meddelanden på Facebook och Instagram där de hotade om att vidta juridiska åtgärder om hon inte tog bort inlägget inom ett dygn. – Då tyckte jag att det började bli obehagligt. Om de har gått så här långt, hur mycket längre går de då? säger Emma, som kontaktade polisen som kunde bekräfta hon inte gjort något fel. När Emma bad företaget sluta ringa i ett mejl svarade de att hon aldrig skulle kunna bevisa att det var de som ringt, eftersom det inte fanns i deras samtalsloggar och att hon inte hade ett uppringnings-id. ”Man blir ju lurad” Emma är inte ensam om sin upplevelse. För drygt ett år sedan skrev Sanna Håkansson en negativ recension om Mattadirekt.se på Trustpilot efter problem med leveranser. Då dröjde det inte länge innan företaget hörde av sig, berättar hon. – Han sa, vi har skickat dem med expressfrakt så de kommer imorgon och du får dem gratis, du får behålla mattorna. Men då får du jättegärna ta bort din recension. – Man blir ju lurad, eftersom man går in och så är det jättebra recensioner, och så ser det jättebra ut, säger Sanna. I Facebookgruppen för missnöjda konsumenter berättar ett tiotal andra om liknande bemötande och Konsumentverket har fått in åtta anmälningar mot företaget i år. Falska recensioner förbjudna Det är förbjudet att lägga ut falska recensioner, enligt Konsumentverket. Och eftersom kundrecensioner påverkar människors köpbeslut är det viktigt att företag ser till att recensionerna återspeglar verkligheten. ”Om ett företag agerar på ett sätt som innebär att recensionerna som visas är vilseledande eller rent falska är detta en otillbörlig affärsmetod och därmed inte tillåtet\", skriver Konsumentverkets jurist Sandra Troedsson i ett mejl till TV4 Nyheterna.  Även enligt Trustpilots riktlinjer måste företag samla in recensioner på ett ”rättvist och balanserat sätt”, skriver Trustpilots kommunikationschef Declan Proudfoot i en kommentar till TV4 Nyheterna, och uppmanar till att använda sajtens visselblåsarfunktion. ”Det är strängt förbjudet att skapa incitament till recensioner på Trustpilot, och om vi får kännedom om detta kommer vi att vidta åtgärder”. Svaret: Står inte bakom Mattadirekt.se uppger i ett mejl till TV4 Nyheterna att detta inte är någonting de står bakom, men att de försöker hitta en lösning i form av hjälp eller kompensation när kunder har problem. ”Vi ber också självklart våra medarbetare att kontakta missnöjda kunder som vi vet har haft ett ärende hos oss. Vi vill gärna att kunden uppdaterar sitt omdöme efter att vi har hanterat situationen eller ärendet om de anser att det har blivit förbättrat”.", "link": "https://www.tv4.se/artikel/vZzWtCreeHv8mJ7F4CVX5/foeretag-pressar-missnoejda-kunder-att-hoeja-betyg-mot-rabatt", "date_display": "2026-03-06", "date_iso": "2026-03-06T16:51:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/konsumentinformation", "/konsumentverket", "/konsumtion"]}, {"id": 135, "title": "In an underground garage, the hospital clown tries to cheer up sick children", "summary": "RAMAT GAN. A man with a defibrillator is wheeled into the parking garage on a stretcher. A few days ago there were only cars here - now Israel's largest emergency department has moved in, four floors underground. - I'm at a loss for words, both in English and Hebrew, but it's nice to work, says hospital clown Pulke.", "title_original": "I ett underjordiskt garage försöker sjukhusclownen muntra upp sjuka barn", "summary_original": "RAMAT GAN. En man med hjärtstartare rullas in på bår i parkeringsgaraget. För några dagar sedan fanns bara bilar här – nu har Israels största akutmottagning flyttat in, fyra våningar under jord. – Jag saknar ord, både på engelska och hebreiska, men det är skönt att arbeta, säger sjukhusclownen Pulke.", "link": "https://www.dn.se/varlden/i-ett-underjordiskt-garage-forsoker-sjukhusclownen-muntra-upp-sjuka-barn/", "date_display": "2026-03-06", "date_iso": "2026-03-06T16:41:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Letter to the editor. Noted by DN's readers on March 6", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Friday, March 6.", "title_original": "Insändare. Noterat av DN:s läsare den 6 mars", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll fredagen den 6 mars.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-6-mars-4/", "date_display": "2026-03-06", "date_iso": "2026-03-06T16:32:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Here, the pastors pray for Trump - and for success in the war", "summary": "\"We pray that heavenly wisdom will flow into his heart\"", "title_original": "Här ber pastorerna för Trump – och för framgångar i kriget", "summary_original": "”Vi ber om att himmelsk visdom ska flöda in i hans hjärta”", "link": "https://www.tv4.se/artikel/5qGIBtFVKTb7jfvJoUPsda/haer-ber-pastorerna-foer-trump-och-foer-framgang-i-kriget", "date_display": "2026-03-06", "date_iso": "2026-03-06T15:55:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 138, "title": "Continuing Nordic cooperation on returns", "summary": "Joint Statement by the ministers responsible for migration from the Nordic Countries.", "title_original": "Continuing Nordic cooperation on returns", "summary_original": "Joint Statement by the ministers responsible for migration from the Nordic Countries.", "link": "https://www.government.se/statements/2026/03/continuing-nordic-cooperation-on-returns/", "date_display": "2026-03-06", "date_iso": "2026-03-06T15:55:32+00:00", "source": "Government.se", "ministry": "Ministry of Justice", "type": "Official Information", "age_tag": "today", "tags": ["EU", "Ministry of Justice", "Migration and asylum", "Statement", "Johan Forssell", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 139, "title": "Hit his ex-wife 35 times - and murdered his girlfriend", "summary": "It was in Skultuna, in the May 2025 stabbing that Bergström stabbed his girlfriend to death, and later stabbed his ex-wife in Västerås so that she was badly injured. During the police manhunt that took place in the hours after the murders, a VMA was issued and the residents of the residential areas were housed. In the district court, the man received forensic psychiatric care, as he claims that he suffered from psychosis when the crimes were committed. The prosecutor appealed and demanded that the man be sentenced to prison instead of treatment. The Court of Appeal overturns the verdict The Court of Appeal now considers that the 38-year-old, despite a serious mental disorder, had some insight into his actions, and that he armed himself and acted \"collectively and purposefully\" and then aborted the attempted murder when the children stopped him. Since his need for care is also not that great, he can be sentenced to prison. He himself believes that the acts of violence were due to hallucinations. He states in questioning that it feels like a \"nightmare\". - Why would I attack her? I have everything to lose. Am I going to be locked up for the rest of my life? says the suspect in questioning. Took sleeping pills and antidepressants The night before the murder, the suspect allegedly had difficulty sleeping. He says that he felt unwell and felt stressed about both work and his family situation. The man is said to have tried several different sleeping pills with varying results. He had also started taking anti-depressants. He states that this was the first night he took the narcotic drugs he had been prescribed. - I must have been so gone, he says in questioning. The man states that he usually has difficulty distinguishing whether he is awake or asleep at night. He claims he dreamed he was being chased by tigers and had to defend himself with a knife.", "title_original": "Högg exfrun 35 gånger – och mördade sin flickvän", "summary_original": "Det var i Skultuna, i maj 2025 knivhögg som Bergström högg sin flickvän till döds, och senare högg sin exfru i Västerås så att hon skadades svårt. Under polisjakten som pågick timmarna efter morden utfärdades ett VMA och invånarna i bostadsområdena inrymdes. I tingsrätten fick mannen rättspsykiatrisk vård, då han hävdar att han led av psykos när brotten begicks. Åklagaren överklagade och yrkade att mannen skulle dömas till fängelse i stället för vård. Hovrätten river upp domen Hovrätten anser nu att 38-åringen, trots en allvarlig psykisk störning, hade viss insikt i sitt handlande, och att han beväpnat sig och agerat ”samlat och målmedvetet” och sedan avbrutit mordförsöket när barnen stoppade honom. Eftersom hans vårdbehov dessutom inte är så stort kan han dömas till fängelse. Själv menar han att våldsdåden berodde på hallucinationer. Han uppger i förhör att det känns som en ”mardröm”. – Varför skulle jag gå till attack mot henne? Jag har allt att förlora. Ska jag sitta inlåst för resten av mitt liv? säger den misstänkte i förhör. Tog sömntabletter och antidepressiva Natten innan mordet ska den misstänkte mannen haft svårt att sova. Han berättar att han mått dåligt och känt sig stressad över både jobbet och sin familjesituation. Mannen ska ha testat flera olika sömntabletter med varierade resultat. Han hade även börjat ta antidepressiva läkemedel. Han uppger att det här var första natten han tog de narkotikaklassade preparat han fått utskrivna. – Jag måste ha varit så borta, säger han i förhör. Mannen uppger att han brukar ha svårt att skilja på om han befinner sig i vaket eller sovande tillstånd på natten. Han påstår att han drömde att han jagats av tigrar och behövt försvara sig med kniv.", "link": "https://www.tv4.se/artikel/2VO9H1zeuaiSSlxF491yQE/hoegg-exfrun-35-ganger-och-moerdade-sin-flickvaen", "date_display": "2026-03-06", "date_iso": "2026-03-06T15:10:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/mord", "/vasteras"]}, {"id": 140, "title": "Thousands of drug buyers identified in \"Operation Candy\"", "summary": "Europol, Eurojust, the police in Sweden and several other countries held a press conference today at the headquarters in The Hague. - Today we are here to present the results of an investigation that began in one of the most unexpected places - with the seizure of two mobile phones in a small rural town in Sweden. What investigators found in those phones opened the door to something much bigger, they began by saying. The local police made the mobile find in November 2023. They do not want to say which small town it is about, but say it is located in Western Sweden. - You followed the leads from a small local case and refused to let it go, says Andy Kraag, head of Europol's department for organized crime, and thanks the Swedish police. The traces that the local police found in the mobile phones led to a \"global crime syndicate\" across Europe, Asia and Australia that was involved in extensive international money laundering and large-scale drug trafficking via the Internet in collaboration with notorious gangs worldwide. \"Synchronized large-scale operation\" After a Europol investigation lasting over two years, in which over 200 police officers and prosecutors participated, an international effort was launched under the code name \"Operation Candy\". - Last Wednesday, a synchronized large-scale operation was carried out in several locations around Sweden, also in Spain and Thailand. We have arrested a total of 13 central actors who have been behind large-scale international money laundering and drug trafficking with connections to several criminal networks around the world, says Hanna Paradis, deputy head of the investigation unit of the national operational department, Noa. About 20 house searches were carried out and criminal assets of between three and four million euros were found over the course of a few days. - Two of our principals were arrested in an exclusive residential area in Hua Hin. Our information indicates that all principals have ownership links to all houses in the area in one way or another. In connection with the arrest of the principals, a very large number of dates were found", "title_original": "Tusentals knarkköpare identifierade i ”Operation Candy”", "summary_original": "Europol, Eurojust, polisen i Sverige och flera andra länder höll i dag en presskonferens på högkvarteret i Haag. – I dag är vi här för att presentera resultaten av en utredning som började på en av de mest oväntade platserna – med beslagtagandet av två mobiltelefoner i en liten landsortsstad i Sverige. Det som utredarna fann i dessa telefoner öppnade dörren till något mycket större, inledde man med att säga. Lokalpolisen gjorde mobilfynden i november 2023. Man vill inte gå ut med vilken liten ort det handlar om men säger att den ligger i Västsverige. – Ni följde spåren från ett litet lokalt fall och vägrade släppa det, säger Andy Kraag, chef för Europols avdelning för organiserad brottslighet, och tackar svensk polis. Spåren som lokalpolisen hittade i mobiltelefonerna ledde till ett ”globalt brottssyndikat” över Europa, Asien och Australien som sysslat med omfattande internationell penningtvätt och storskalig narkotikahandel via nätet som skett i samarbete med ökända gäng världen över. ”Synkroniserad storskalig operation\" Efter en över två år lång Europol-utredning där över 200 poliser och åklagare deltagit slog man till i en internationell insats under kodnamnet ”Operation Candy”. – I onsdags genomfördes en synkroniserad storskalig operation på flera platser runt om i Sverige, även i Spanien och Thailand. Vi har gripit totalt 13 centrala aktörer som har legat bakom storskalig internationell penningtvätt och narkotikahandel med koppling till flera kriminella nätverk runt om i världen, säger Hanna Paradis, biträdande chef på utredningsenheten på nationella operativa avdelningen, Noa. Ett 20-tal husrannsakningar genomfördes och brottstillgångar på mellan tre och fyra miljoner euro hittades under några dagar. – Två av våra huvudmän greps i ett exklusivt villaområde i Hua Hin. Våra uppgifter tyder på att samtliga huvudmän har ägarkopplingar till samtliga hus i området på ett eller annat sätt. I samband med gripandet av huvudmännen anträffades ett mycket stort antal datorer, mobiler samt diverse ekonomiska tillgångar, säger Johan Dire, chef för spaningssektionen. Polisen hittade också kundregister på knarkförsäljningssidorna och kommer lagföra köparna. – Vi vill också passa på att nämna att vi i nuläget hittat mer än 5 000 personer i de misstänktas köpregister. Det innebär att vi har mycket god kunskap, såväl av säljare som köpare som är kopplade till onlineförsäljningen av narkotika i Sverige, säger Hanna Paradis. Insatschefen Tomas Stakeberg säger: – Vi har en gameplan hur vi ska gå vidare och det kommer att visa sig sen hur resultatet blir av fortsättningen. ”Ganska långt upp i hierarkin” Omfattande mängder narkotika har tagits i beslag. Nätverket ska ha omsatt flera hundra miljoner kronor, enligt polisen. – Vi har kommit ganska långt upp i hierarkin. Det finns ju alla nivåer av ekonomiska möjliggörare, allt från de som rör sig med småpengar till stöd för logistik, till kriminalitet, till de som har stora företagsstrukturer och global verksamhet, säger Tomas Stakeberg. Flera svenska företag som gått under radarn är inblandade i härvan med företagare som varit okända för polisen. – Avseende den grova penningtvätten har vi kunnat kartlägga ett nät av företagsstrukturer i Sverige och utomlands som använts för att tvätta brottsvinster, svarta pengar. Män i övre medelåldern som ägnat sig åt mycket företagsverksamhet och bolag, säger Tomas Stakeberg. – Vi kallar det underground banking. Det är många olika nätverk. Man använder sig av den här banken, om vi nu kallar det för det. Det spelar ingen roll vilket nätverk man kommer ifrån, utan man kan gå till den här banken och få den hjälpen man behöver för att kunna tvätta in de pengarna och kopplat till den narkotikasmuggling som vi har sett. Utredningen väntas ta uppemot flera år innan den blir klar. – Allt började med att två telefoner togs beslag, säger Tomas Stakeberg.", "link": "https://www.tv4.se/artikel/jgV75eqlEB0NsSWNMAuoR/tusentals-knarkkoepare-identifierade-i-operation-candy", "date_display": "2026-03-06", "date_iso": "2026-03-06T14:01:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/europol", "/eurojust", "/brott", "/narkotikabrott", "/penningtvatt"]}, {"id": 141, "title": "Christian Mölk ends the \"no to Tidö\" protest", "summary": "The Pentecostal pastor: Migration agreement between the Tidö parties \"an important correction of the parts that went wrong\"", "title_original": "Christian Mölk avslutar ”nej till Tidö”-protest", "summary_original": "Pingstpastorn: Migrationsöverenskommelse mellan Tidöpartierna ”en viktig korrigering av de delar som träffade fel”", "link": "https://www.dagen.se/nyheter/christian-moelk-avslutar-nej-till-tidoe-protest/10238558", "date_display": "2026-03-06", "date_iso": "2026-03-06T13:02:24+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Here, the kidnappers try on jewelry - paying with the victim's card", "summary": "It started one September night in central Trelleborg and didn't end until the following afternoon. Once in his home, the victim was, according to the indictment, threatened with a knife, secateurs and a weapon-like object. He was forced to hand over valuables and codes to his phone, bank card and bank ID. Money was withdrawn, purchases were made in his name and he was then driven around to several different locations in Skåne - all under threat to his life. The perpetrator called the bank At one point, one of the perpetrators tried to raise the man's swish limit by calling his bank. The victim was forced to use his Bank ID, but when the bank woman heard two voices in the conversation, and when the person answered her verification question incorrectly, the attempt was stopped. But the change would still be big. In total, purchases of over a quarter of a million kroner were carried out, as well as trials of a further approximately kroner 192,000. On several occasions, the kidnappers have been caught on the surveillance cameras of various stores when they are buying goods. The pictures show how one of the men tries on gold necklaces together with one of the women. SMS threats - days later Days after the kidnapping drama, the nightmare continued, when text messages started appearing on the victim's screen. \"Hello. You broke your part of the agreement. Haven't received the 50 thousand we talked about. I just want you to know that we know where you live, we know what your sister's name is, we know where she lives. Believe me, you don't want us to come to your house or her. Do the right thing for you and everything will work out,\" reads one of the messages. Five people, two women and three men, are now charged with having jointly robbed, threatened, abused and deprived the man of his liberty. The suspicions relate to kidnapping and robbery. According to the lawsuit, the suspects acted together and in agreement, strengthened each other throughout the course of events and divided the goods between them.", "title_original": "Här provar kidnapparna smycken – betalar med offrets kort", "summary_original": "Det började en septembernatt i centrala Trelleborg och slutade inte förrän eftermiddagen därpå. Väl i sin bostad blev offret, enligt åtalet, hotad med kniv, sekatör och ett vapenliknande föremål. Han tvingades lämna ifrån sig värdesaker och koder till telefon, bankkort och bank-id. Pengar togs ut, köp genomfördes i hans namn och han kördes därefter runt till flera olika orter i Skåne – allt under hot mot hans liv. Gärningsmannen ringde banken Vid ett tillfälle försökte en av gärningsmännen höja mannens swish-gräns genom att ringa hans bank. Offret tvingades använda sitt Bank-id men då bankkvinnan hörde två röster i samtalet, och då personen svarade fel på hennes kontrollfråga, stoppades försöket. Men bytet skulle bli stort ändå. Totalt genomfördes köp på över en kvarts miljon kronor samt försök på ytterligare cirka 192 000 kronor. Vid flera tillfällen har kidnapparna fastnat på olika butikers övervakningskameror när de köper varor. Bilderna visar hur en av männen provar guldhalsband tillsammans med en av kvinnorna. Sms-hot – dagar senare Dagar efter kidnappningsdramat fortsatte mardrömmen, när sms började dyka upp på offrets skärm. ”Hej. Du bröt din del av avtalet. Har inte fått några 50 tusen vi pratade om. Jag vill bara att du ska veta att vi vet var du bor, vi vet vad din syster heter, vi vet var hon bor. Tro mig du vill inte vi ska komma hem till dig eller hon. Gör rätt för dig så kommer allt lösa sig”, lyder ett av meddelandena. Fem personer, två kvinnor och tre män, står nu påtalade för att gemensamt ha rånat, hotat, misshandlat och frihetsberövat mannen. Misstankarna rör människorov och rån. Enligt stämningsansökan har de misstänkta agerat tillsammans och i samförstånd, stärkt varandra genom hela händelseförloppet och delat upp varorna mellan sig.", "link": "https://www.tv4.se/artikel/2fAuJmm5FnjjfZhqpVpXlw/haer-provar-kidnapparna-smycken-betalar-med-offrets-kort", "date_display": "2026-03-06", "date_iso": "2026-03-06T11:55:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/manniskorov", "/ran", "/trelleborg"]}, {"id": 143, "title": "Lobster rolls with lobster tails", "summary": "Today's weekend tips offer snacks inspired by the classic American lobster roll. Here, Catarina makes her version with crayfish tails in a can. Brioche bread fried in butter and filled with crayfish tails mixed in a light mayonnaise and lemon dressing with fresh dill.  See Catarina König's recipe", "title_original": "Lobster rolls med kräftstjärtar", "summary_original": "Dagens helgtips bjuder på tilltugg inspirerade av klassiska amerikanska lobster roll. Här gör Catarina sin variant med kräftstjärtar på burk. Briochebröd smörsteks och fylls med kräftstjärtar blandade i en lätt majonnäs- och citrondressing med färsk dill.  Se Catarina Königs recept", "link": "https://www.tv4.se/artikel/5nsi0KCly6flV2LvG9ADmn/lobster-rolls-med-kraeftstjaertar", "date_display": "2026-03-06", "date_iso": "2026-03-06T11:41:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/catarina-konig", "/kokets-helgtips", "/koket"]}, {"id": 144, "title": "Great anger when Bethel shut down official Facebook group for Bible school students", "summary": "\"They don't want an open forum where people can talk about their pain.\"", "title_original": "Stor ilska när Bethel stängt ned officiell Facebookgrupp för bibelskoleelever", "summary_original": "”De vill inte ha ett öppet forum där människor kan prata om sin smärta.”", "link": "https://www.dagen.se/nyheter/stor-ilska-naer-bethel-staengt-ned-officiell-facebookgrupp-foer-bibelskoleelever/10237287", "date_display": "2026-03-06", "date_iso": "2026-03-06T10:50:41+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 145, "title": "The fans' anger after the podcast message: \"Then it was finally listened to\"", "summary": "After 14 years as completely free, \"Alex and Sigge's podcast\" is starting to cost. On Friday, the moving load goes to Podme. - Then it was over. Many listeners will be lost to this, writes a listener on Facebook. - Been there from the start and listened to everything. Now we go our separate ways, writes another.  Starting March 20, the episodes will be published exclusively on Podme, and during a transition period of two weeks, the podcast will be available to listen to both in the open RSS feed and at Podme. After that, it will also be possible to listen for free, but with a four-week delay. \"Just a cash cow\" Previously, Alex Schulman has described the podcast as \"just a cash cow\" and that he does not earn enough from other assignments to be able to stop it. - The vast majority of times it feels like just one long lead, he says in an interview with Filmtopp. Now Alex Schulman says in a press release that the move feels like the right way forward. - The podcast has been with us since its inception over ten years ago and has been a kind of ongoing document about our lives, thoughts and failures. Moving to Podme feels like a perfect next step, where we can continue the conversations in an environment where the content can take center stage. Met with criticism Moa Soltanian Magnusson, Head of Content at Podme, describes the signing as \"one of the biggest things that happened in the platform's history\". The majority of the reactions on Facebook are critical, but at the same time, there are also listeners who think it will be nice to avoid the advertising. Sigge Eklund believes that Podme is in line with how they want to podcast. - I have always seen the podcast as a room where we can think out loud about what is happening here and now. The move is not about starting over, but about continuing exactly where we are, on a platform that feels relevant to how we want to work today, says Sigge Eklund in a press release. TV4 Nyheterna is looking for Alex Schulman and Sigge Eklund.", "title_original": "Fansens ilska efter podd-beskedet: ”Då var det slutlyssnat”", "summary_original": "Efter 14 år som helt gratis börjar ”Alex och Sigges podcast” att kosta. På fredagen går flyttlasset till Podme. – Då var det slutlyssnat. Det kommer tappas många lyssnare på detta, skriver en lyssnare på Facebook. – Varit med från starten och lyssnat på allt. Nu går vi skilda vägar, skriver en annan.  Från och med den 20 mars publiceras avsnitten exklusivt på Podme, och under en övergångsperiod på två veckor kommer podden gå att lyssna på både i öppna RSS-feeden och hos Podme. Därefter kommer det även gå att lyssna gratis, men med fyra veckors fördröjning. ”Bara en kassako” Tidigare har Alex Schulman beskrivit podden som ”bara en kassako” och att han inte tjänar tillräckligt på andra uppdrag för att kunna sluta med den. – De allra flesta gångerna känns det som en enda lång leda bara, säger han i en intervju med Filmtopp. Nu säger Alex Schulman i ett pressmeddelande att flytten känns som rätt väg framåt. – Podden har funnits med oss sedan starten för över tio år sedan och har varit ett slags pågående dokument om våra liv, tankar och misslyckanden. Att flytta till Podme känns som ett perfekt nästa steg, där vi kan fortsätta samtalen i en miljö där innehållet får stå i centrum. Mötts av kritik Moa Soltanian Magnusson, Head of Content på Podme, beskriver värvningen som ”något av det största som hänt i plattformens historia”. Majoriteten av reaktionerna på Facebook är kritiska, men samtidigt finns det även lyssnare som tycker att det ska bli skönt att slippa reklamen. Sigge Eklund menar att Podme ligger i linje med hur de vill podda. – Jag har alltid sett podden som ett rum där vi får tänka högt om det som händer här och nu. Flytten handlar inte om att börja om, utan om att fortsätta precis där vi är, på en plattform som känns relevant för hur vi vill jobba i dag, säger Sigge Eklund i ett pressmeddelande. TV4 Nyheterna söker Alex Schulman och Sigge Eklund.", "link": "https://www.tv4.se/artikel/2vBlh2B8kC9Xdhame0VPhO/fansens-ilska-efter-podd-beskedet-da-var-det-slutlyssnat", "date_display": "2026-03-06", "date_iso": "2026-03-06T10:26:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/poddar", "/sigge-eklund", "/alex-schulman", "/kultur"]}, {"id": 146, "title": "Tidö parties agree - teenage expulsions are paused", "summary": "\"We have agreed on a reform of family immigration,\" says Prime Minister Ulf Kristersson (M).", "title_original": "Tidöpartierna överens – tonårsutvisningar pausas", "summary_original": "”Vi har enats om en reform av anhöriginvandringen”, säger statsministern Ulf Kristersson (M).", "link": "https://www.dagen.se/nyheter/tidoepartierna-oeverens-tonarsutvisningar-pausas/10238490", "date_display": "2026-03-06", "date_iso": "2026-03-06T09:34:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 147, "title": "Trump is accused of sexual abuse of a minor", "summary": "The documents released by the US Department of Justice on Thursday contain descriptions of several interviews the FBI conducted with the woman in 2019. She claims she was abused by both Jeffrey Epstein and Donald Trump when she was between 13 and 15 years old.  The abuse Trump subjected her to allegedly took place in the 1980s, reports the New York Times. In the interviews, the woman tells how Epstein took her to a building in New York or New Jersey where she was introduced to Trump. She says there were more people in the room, who she doesn't remember, and that Trump asked them to get out.  \"Was beaten when she resisted\" Next, the woman describes that Trump tried to force her to have oral sex and beat her when she resisted. \"Get the little sub out of here!\", Trump allegedly said, according to the interview documents. In one of the interviews, the woman says that she has started cooperating with lawyers in a civil case. She also said that she or people close to her had received threatening phone calls.  It is described that she thought the calls were connected to Epstein and how she \"mutters that if it wasn't Epstein, then maybe it was 'the other one'\". When the agents ask who she means, she says Trump, according to the interview notes, Politico reports. The documents were \"accidentally\" withheld, the FBI files were made public on Thursday. The reason the material was not released earlier is because they were wrongly marked as \"duplicated\", according to the Department of Justice.  The department had already released documents detailing the FBI interviews, raising questions about why they were missing from the Epstein files. The officials state that they thought they had been published elsewhere, which was not the case. At the same time, Democrats are investigating the administration's handling of the Epstein documents.  White House: 'Baseless allegations' Trump has repeatedly denied all allegations linked to Epstein and has not been charged with a crime related to them.  According to White House press secretary Karol", "title_original": "Trump anklagas för sexuella övergrepp mot minderårig", "summary_original": "Dokumenten som släpptes av USA:s justitiedepartement på torsdagen innehåller beskrivningar av flera intervjuer FBI gjorde med kvinnan 2019. Hon hävdar att hon utsattes för övergrepp av både Jeffrey Epstein och Donald Trump när hon var mellan 13 och 15 år gammal.  Övergreppet Trump utsatte henne för ska ha skett på 1980-talet, rapporterar New York Times. I intervjuerna berättar kvinnan hur Epstein tog henne till en byggnad i New York eller New Jersey där hon introducerades för Trump. Hon säger att det var fler personer i rummet, vilka minns hon inte, och att Trump bad dem gå ut.  ”Blev slagen när hon gjorde motstånd” Därefter beskriver kvinnan att Trump försökte tvinga henne till oralsex och slog henne när hon gjorde motstånd. ”Få ut den lilla subban härifrån!”, ska Trump ha sagt enligt intervjudokumenten. I en av intervjuerna berättar kvinnan att hon börjat samarbeta med advokater i ett civilrättsligt mål. Hon sa också att hon eller personer i hennes närhet hade fått hotfulla telefonsamtal.  Det beskrivs att hon trodde samtalen var kopplade till Epstein och hur hon ”mumlar att om det inte var Epstein, så var det kanske ’den andre’”. När agenterna frågar vem hon menar, säger hon Trump, enligt intervjuanteckningarna, rapporterar Politico. Dokumenten undanhölls ”av misstag” FBI-filerna offentliggjordes på torsdagen. Anledningen till att materialet inte släppts tidigare beror på att de felaktigt markerats som ”duplicerade”, enligt justitiedepartementet.  Departementet hade redan släppt dokument som beskrev FBI-intervjuerna, vilket väckte frågor kring varför de saknades i Epstein-dokumenten. Tjänstemännen uppger att de trodde att de offentliggjorts på annat håll, vilket inte stämde. Samtidigt utreder Demokraterna administrationens hantering av Epstein-dokumenten.  Vita huset: ”Grundlösa anklagelser” Trump har vid upprepade tillfällen förnekat alla anklagelser kopplade till Epstein och har inte åtalats för brott i samband med dem.  Enligt Vita husets pressekreterare Karoline Leavitt är anklagelserna ”helt grundlösa, utan någon som helst trovärdig bevisning, från en tyvärr störd kvinna med ett omfattande kriminellt förflutet”, rapporterar Politico.", "link": "https://www.tv4.se/artikel/tt-260306-usaepsteintrump1-96b1673e/nya-epstein-dokument-med-anklagelser-mot-trump", "date_display": "2026-03-06", "date_iso": "2026-03-06T07:54:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/donald-trump", "/brott", "/fbi", "/jeffrey-epstein", "/epstein-dokumenten"]}, {"id": 148, "title": "New forecast: This is how the electricity price will be in the coming days", "summary": "After a period of cold weather, milder temperatures have taken over in large parts of the country. It affects the price of electricity, but according to meteorologist Madeleine Westin, it is only one of several factors that control the cost for households.  - If you want to generalize a bit, the weather is about half the price of electricity. If it has been really cold, then it affects the electricity price, if it is windy it affects it, usually in a positive direction. We are also connected to the rest of Europe, so the weather in our immediate area directly affects our electricity price. Big differences between north and south On Friday, the electricity price was SEK 1.32 per kilowatt hour in southern Sweden, which is high, says Madeleine Westin. During the weekend, the winds are expected to subside in the north, causing prices there to rise slightly. In southern Sweden, it will be a little cooler on Saturday, but the electricity price will still drop. On Sunday, temperatures are expected to rise again, which will reduce the need for electricity and provide a further price reduction.  For households that want to save money, it may be wise to plan electricity use for Sunday, when prices are expected to be at their lowest, says Westin. - If you're going to use your electricity at home, it's better to use it with draft on Sunday. In addition to a cold winter that led to high electricity prices in the country, the war in Iran and the conflict in the Middle East also affect the price in Sweden, and the attacks against the Iranian regime have led to sharply rising prices for gas, oil and coal.  When the Strait of Hormuz is blocked, the transport of gas from Qatar becomes difficult, affecting around 30 percent of Europe's gas imports. Southern Sweden is clearly most affected by the geopolitical situation. The area has high consumption but relatively low own production and is dependent on electricity from northern Sweden and imports from Germany. \"I hope people have money in the barns\" Claes Hemberg, energy economist at Nibe says that February's electricity bill in Malmö is basically the same, while it will be disappointing for those up north like in Luleå compared to the same period last year.  - The electricity bill was cheap last year, but now it rises to 667 per", "title_original": "Ny prognos: Så blir elpriset de kommande dagarna", "summary_original": "Efter en period med kallt väder har mildare temperaturer tagit över i stora delar av landet. Det påverkar elpriset, men enligt meteorolog Madeleine Westin är det bara en av flera faktorer som styr kostnaden för hushållen.  – Om man ska generalisera lite, vädret är ungefär halva elpriset. Har det varit riktigt kallt, då påverkar det elpriset, är det blåsigt påverkar det, oftast åt det positiva hållet. Vi sitter också ihop med resten av Europa så vädret i vårt närområde påverkar direkt vårt elpris. Stora skillnader mellan norr och söder  Under fredagen låg elpriset på 1,32 kronor per kilowattimme i södra Sverige vilket är högt säger Madeleine Westin. Under helgen väntas vindarna avta i norr, vilket gör att priserna där stiger något. I södra Sverige blir det lite kyligare på lördagen, men ändå sjunker elpriset. På söndagen väntas temperaturerna stiga igen, vilket minskar elbehovet och ger ytterligare en prissänkning.  För hushåll som vill spara pengar kan det vara klokt att planera elanvändningen till söndagen, då priserna väntas vara som lägst, säger Westin. – Ska man använda sin el hemma, så använd den hellre med dragning åt söndag. Utöver en kall vinter som lett till höga elpriser i landet påverkar även kriget i Iran och konflikten i mellanöstern priset i Sverige och attackerna mot den iranska regimen har lett till kraftigt stigande priser på gas, olja och kol.  När Hormuzsundet blockeras försvåras transporten av gas från Qatar, vilket påverkar omkring 30 procent av Europas gasimport. Södra Sverige påverkas klart mest av det geopolitiska läget. Området har hög förbrukning men relativt låg egen produktion och är beroende av el från norra Sverige och import från Tyskland. ”Hoppas folk har pengar i ladorna” Claes Hemberg, energiekonom på Nibe säger att februaris elfaktura i Malmö är i princip densamma medan det kommer vara en besvikelse för de uppe i norr som i Luleå jämfört med samma period förra året.  – Elfakturan var billig förra året, men nu sticker den upp 667 procent. I praktiken innebär det för en villaägare 1 000 spänn extra. Det är dubbelt upp jämfört med förra årets elfaktura och jag hoppas att folk har lite pengar i ladorna, säger Hemberg.  Hur elpriserna utvecklas framöver är svårt att förutse men Claes Hemberg tror att svängningarna på elmarknaden är här för att stanna. – De ojämna elpriserna måste vi lära oss och vänja oss vid. Det gäller inte att duscha kortare utan snarare att leta efter de billiga priserna och använda dem mer än de dyra, säger Hemberg.", "link": "https://www.tv4.se/artikel/5KiIKw4ZMom2PaPmI6r0Yx/sa-paverkar-irankriget-elpriset-framoever", "date_display": "2026-03-06", "date_iso": "2026-03-06T07:41:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/elpriskollen", "/personer/madeleine-westin"]}, {"id": 149, "title": "Sweden is entering an \"even more dangerous time\" - FRA warns", "summary": "These are turbulent times in the world, states the Defense Radio Agency (FRA) in its annual report. The threat picture against Sweden is described as broad, complex and serious. It is a dangerous time that we are entering, says Björn Lyrvall, director general at FRA for the past six years. The war in Iran means a situation where Iranian security-threatening activities can also be directed at Sweden. Säpo has pointed out that the risk of attacks against American and Israeli targets has increased, and also against Swedish Jews and exiled Iranians.  It is something that we need to follow much more closely and we obviously support the Security Police when it comes to that work, says Lyrvall. FRA also follows the military and political developments in the region and reports to the government. Gps interference FRA also describes that the war in Ukraine is getting closer. They point to disturbances in satellite navigation in the Baltic Sea, the Russian shadow fleet and military activities in the immediate area.  During the past year, FRA has reported on how Russian ships and aircraft move in the Baltic Sea and how Russia exercises. Among other things, the Russian-Belarusian giant Zapad exercise was held, which the Baltic countries were on full alert for.  Has Russia become more aggressive in the immediate area? We have seen examples of airspace violations for NATO countries, Estonia for example. It can be said that the risk appetite regarding Russian actions in the Baltic Sea has increased, says Björn Lyrvall. If the FRA itself notices a more offensive Russian action when they are out with their signal reconnaissance aircraft and ships, it is not something the director general wants to go into. But we operate at a safe distance from Russian airspace and naturally fly in allied and international airspace. Attacks in the cyber environment are also a central part of the threat picture against Sweden. FRA emphasizes that known vulnerabilities, such as weak passwords, recur year after year. It's not good, says Lyrvall. At the same time, he sees a growing awareness among authorities as well as companies and municipalities about the importance of cyber security and how cyber attacks can paralyze a business", "title_original": "Sverige går in i en ”ännu farligare tid” – FRA varnar", "summary_original": "Det är turbulenta tider i omvärlden, konstaterar Försvarets radioanstalt (FRA) i sin årsrapport. Hotbilden mot Sverige beskrivs som bred, komplex och allvarlig. Det är en farlig tid som vi går in i, säger Björn Lyrvall, generaldirektör på FRA sedan sex år tillbaka. Kriget i Iran innebär en situation där iransk säkerhetshotande verksamhet kan riktas även mot Sverige. Säpo har pekat på att risken för attacker mot amerikanska och israeliska mål har ökat, och även mot svenska judar och exiliranier.  Det är någonting som vi behöver följa mycket närmare och vi stödjer självklart Säkerhetspolisen när det gäller det arbetet, säger Lyrvall. FRA följer även den militära och politiska utvecklingen i regionen och rapporterar till regeringen. Gps-störningar FRA beskriver också att kriget i Ukraina kommit närmare. Man pekar på störningar i satellitnavigeringen i Östersjön, den ryska skuggflottan och militär verksamhet i närområdet.  Under året som gått har FRA rapporterat om hur ryska fartyg och flyg rör sig i Östersjön och hur Ryssland övar. Bland annat hölls den rysk-belarusiska jätteövningen Zapad, som baltländerna var på helspänn inför.  Har Ryssland blivit mer aggressivt i närområdet? Vi har sett exempel på kränkningar av luftrum för Natoländer, Estland till exempel. Man kan säga att riskbenägenheten vad gäller ryskt agerande i Östersjön har ökat, säger Björn Lyrvall. Om FRA självt märker av ett mer offensivt ryskt agerande när de är ute med sina signalspaningsflyg och fartyg är inget generaldirektören vill gå in på. Men vi verkar ju på säkert avstånd från ryskt luftrum och flyger naturligtvis ute på allierat och internationellt luftrum. En central del i hotbilden mot Sverige är också angreppen i cybermiljön. FRA framhåller att kända sårbarheter, som svaga lösenord, återkommer år efter år. Det är inte bra, säger Lyrvall. Han ser samtidigt en växande insikt hos såväl myndigheter som företag och kommuner om vikten av cybersäkerhet och hur cyberattacker kan lamslå en verksamhet. Nya hemliga lokaler Som en följd av det försämrade säkerhetsläget expanderar FRA kraftigt. På bara sex år har man gått från 800 medarbetare till över 1 300. Myndigheten bygger också nytt och rustar upp lokaler runt om i Sverige på hemliga platser. Vi har ett intresse av att bygga ut vår närvaro på andra håll i landet. Vi har några stationer som är mer kända, och andra som inte är offentliga, säger Lyrvall.", "link": "https://www.tv4.se/artikel/tt-260306-frarapport1-9065a544/fra-en-annu-farligare-tid-vantar-sverige", "date_display": "2026-03-06", "date_iso": "2026-03-06T07:24:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Ukraina", "/ukraina", "/forsvarsmakten", "/krig", "/sverige", "/iran", "/estland", "/sakerhetspolisen", "/inrikes", "/sakerhetslaget"]}, {"id": 150, "title": "Kristersson's message: Stop children on Tiktok", "summary": "The government has appointed a special investigation to investigate the possibility of introducing an age limit for social media. A first interim report will be presented in June. But the Moderates are already stating that the party wants to see just that. I think 15 years is natural, says Ulf Kristersson. The age limit should apply to large platforms such as Instagram, Facebook, Tiktok and YouTube, says the prime minister. But you have to look at that when designing the legislation itself, the more similar legislation you have around Europe, the better, I think. More countries facing The issue of age limits on social media is now being raised in more and more countries. Australia and Malaysia have recently introduced a 16-year limit and France is moving towards a 15-year limit. The issue is also discussed at EU level.  In Sweden, among others, the Social Democrats, the Christian Democrats and the Liberals have previously come out and said that they too want to see a 15-year limit. The Center Party has also spoken positively about some form of age limit. The big question is how to verify one's age to ensure that those who are too young do not access the platforms. Ulf Kristersson does not have an answer to exactly how it should be done. That it is credible is extremely important. If it were easy to get around it, it would be completely pointless, he says and adds: It is also important to maintain an integrity aspect in this. It must be a system where one identifies one's age and can then maintain one's anonymity. \"Will not love it\" But it is not only the technical solutions that are required for it to work, says Kristersson. He believes that a lively discussion among Swedish parents is required for a sharp border to work. I'm not sure all teenagers will love this. So I think it will take a certain amount of agreement in the adult world for this to work, he says.", "title_original": "Kristerssons besked: Stopp för barn på Tiktok", "summary_original": "Regeringen har tillsatt en särskild utredning som ska undersöka möjligheten att införa en åldersgräns för sociala medier. Ett första delbetänkande presenteras i juni. Men redan nu slår Moderaterna fast att partiet vill se just det. 15 år kan jag tycka är naturligt, säger Ulf Kristersson. Åldersgränsen bör gälla stora plattformar så som Instagram, Facebook, Tiktok och Youtube säger statsministern. Men det får man titta på när man utformar själva lagstiftningen, ju mer lika lagstiftning man har runt om i Europa desto bättre tror jag. Fler länder inför Frågan om åldersgräns på sociala medier seglar nu upp i allt fler länder. Australien och Malaysia har nyligen infört en 16-årsgräns och Frankrike är på väg mot en 15-årsgräns. Frågan diskuteras även på EU-nivå.  I Sverige har bland annat Socialdemokraterna, Kristdemokraterna och Liberalerna tidigare gått ut och sagt att även de vill se en 15-årsgräns. Även Centerpartiet har uttalat sig positivt om någon form av åldersgräns. Den stora frågan är hur man ska verifiera sin ålder för att säkerställa att de som är för unga inte kommer åt plattformarna. Exakt hur det ska gå till har Ulf Kristersson inget svar på. Att det är trovärdigt är jätteviktigt. Skulle det vara lätt att gå runt det så blir det helt meningslöst, säger han och tillägger: Det är också viktigt att man bibehåller en integritetsaspekt i detta. Det ska vara ett system där man identiferar sin ålder och därefter kan behålla sin anonymitet. ”Kommer inte älska det” Men det är inte bara de tekniska lösningarna som krävs för att det ska fungera, menar Kristersson. Han tror att det krävs en levande diskussion bland svenska föräldrar för att en skarp gräns ska fungera. Jag är inte säker på att alla tonåringar kommer att älska det här. Så jag tror att det kommer att krävas en viss enighet i vuxenvärlden för att det här ska fungera, säger han.", "link": "https://www.tv4.se/artikel/tt-260306-msocialamedier1-c71fdf28/kristerssons-besked-stopp-for-barn-pa-tiktok", "date_display": "2026-03-06", "date_iso": "2026-03-06T07:14:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Liberalerna", "/valet-2022/liberalerna", "/valet-2022/moderaterna", "/valet-2022/kristdemokraterna", "/kallafakta/partiernashemligapengar/kristdemokraterna", "/kallafakta/partiernashemligapengar/liberalerna", "/ulf-kristersson", "/tiktok", "/sverige", "/frankrike", "/australien"]}, {"id": 151, "title": "Investing several millions in the fight against fungal diseases", "summary": "The facility is being built at the research station in Sävar and is planned to open in the second half of 2027. Here, young plants will be tested in laboratories and climate chambers, where they are deliberately exposed to fungal attacks.\n\n- Here we have plants that are roughly the size they will be when we screen the fir for root rot, says Henrik Svennerstam, researcher at Skogforsk and points to some boxes of test plants. Costs 750 million a year In an initial stage, the focus is on two major problems: blight and root rot. Törskate is a rust fungus that mainly attacks pines in northern Sweden. It can strike the forest at any age – from plant death in young stands to growth reductions and mortality in older forests. Root rot primarily affects spruce and, according to Skogforsk, it alone is estimated to cost forestry more than SEK 750 million per year in lost revenue. Around 15 percent of all spruces that are finally felled have root rot.\n\n- As far as root rot is concerned, it is a recognized big problem, says Henrik Svennerstam. Thousands of plants are tested every year In the new centre, tens of thousands of plants can be tested every year. That's a dramatic increase compared to traditional field tests, where it can take decades to know how a tree copes with disease. The method to be used is called screening. This means that the researchers test the plants' genetic resistance early in life. \n\n- What we want to do is to identify the individuals who are more resistant to thrush and use them in the future to produce new seed for the forests of the future in Sweden, says Henrik Svennerstam. A head start against the effects of the climate With the new infrastructure, Skogforsk hopes to give forestry a head start - both against today's costly attacks and against future, as yet unknown threats.\n\n- The investment is not only about today's known problems. Climate change is expected to create better conditions for several fungal diseases and may also introduce new pests into the country, says Henrik Svennerstam.", "title_original": "Satsar flera miljoner i kampen mot svampsjukdomar", "summary_original": "Anläggningen byggs vid forskningsstationen i Sävar och planeras öppna under andra halvan av 2027. Här ska unga plantor testas i laboratorier och klimatkammare, där de medvetet utsätts för svampangrepp.\n\n– Här har vi plantor som är ungefär i den storlek som de kommer vara när vi screenar granen för rotröta, säger Henrik Svennerstam, forskare på Skogforsk och pekar på några lådor med försöksplantor. Kostar 750 miljoner om året I ett första skede ligger fokus på två stora problem: törskate och rotröta. Törskate är en rostsvamp som främst angriper tallar i norra Sverige. Den kan slå mot skogen i alla åldrar – från plantdöd i unga bestånd till tillväxtnedsättningar och dödlighet i äldre skog. Rotröta drabbar framför allt gran och enligt Skogforsk uppskattas den ensamt kosta skogsbruket över 750 miljoner kronor per år i förlorade intäkter. Omkring 15 procent av alla granar som slutavverkas har rotröta.\n\n– Vad gäller rotröta så är det ju ett erkänt stort problem, säger Henrik Svennerstam. Tusentals plantor testas varje år I det nya centret kan tiotusentals plantor testas varje år. Det är en dramatisk ökning jämfört med traditionella fälttester, där det kan ta flera decennier innan man vet hur ett träd klarar sjukdomar. Metoden som ska användas kallas screening. Det innebär att forskarna testar plantornas genetiska motståndskraft tidigt i livet. \n\n– Det vi vill göra är att identifiera de individer som är mer motståndskraftiga för törskate och använda dem framåt för att ta fram nytt frö för framtidens skogar i Sverige, säger Henrik Svennerstam. Ett försprång mot klimatets effekter Med den nya infrastrukturen hoppas Skogforsk kunna ge skogsbruket ett försprång – både mot dagens kostsamma angrepp och mot framtida, ännu okända hot.\n\n– Satsningen handlar inte bara om dagens kända problem. Klimatförändringen väntas skapa bättre förutsättningar för flera svampsjukdomar och kan också föra in nya skadegörare i landet, säger Henrik Svennerstam.", "link": "https://www.tv4.se/artikel/66sUYqFbmCCvifDDIJWfcK/satsar-flera-miljoner-i-kampen-mot-svampsjukdomar", "date_display": "2026-03-06", "date_iso": "2026-03-06T07:00:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/svamp", "/umea", "/skog"]}, {"id": 152, "title": "Fathers at home less with the children – a trend break", "summary": "Last year, women took an average of almost 70 percent of the parental days with parental allowance and VAB, child care. Men took just over 30 percent. This is shown by the TCO's gender equality index. For almost 20 years, the trend has been towards a more equal distribution of the days. But now a regression is visible. - It is the first time since we started doing the gender equality index that we have seen this happen two years in a row, says TCO's chairman Therese Svanström. Affects pension According to TCO, the distribution affects both income and pensions. When women take more responsibility for parental leave and VAB, they risk falling behind financially in the long term. - As it looks now, it is women who lose out because we share as differently as we do. We know that when children arrive, women's incomes drop. Then the ill health increases. Career opportunities are disappearing and in the end it results in a low pension for women, says Therese Svanström, chair TCO.  Want more days to be reserved In order to increase gender equality, TCO wants more months to be reserved for each parent in the parental insurance. The organization also wants to increase the compensation for the 90 days that currently have the lowest compensation. But no such proposals are currently on the government's table. Minister for the Elderly and Social Insurance Anna Tenje (M) says that the government is following the development, but at the same time highlights the importance of families being able to decide for themselves how they allocate their parental leave.", "title_original": "Pappor hemma mindre med barnen – ett trendbrott", "summary_original": "Förra året tog kvinnor i snitt ut nästan 70 procent av föräldradagarna med föräldrapenning och vab, vård av barn. Män tog drygt 30 procent. Det visar Tjänstemännens centralorganisation, TCO:s, jämställdhetsindex. Under nästan 20 år har utvecklingen gått mot en mer jämställd fördelning av dagarna. Men nu syns en tillbakagång. – Det är första gången sedan vi började göra jämställdhetsindex som vi ser att det händer två år i rad, säger TCO:s ordförande Therese Svanström. Påverkar pension Enligt TCO påverkar fördelningen både inkomster och pensioner. När kvinnor tar större ansvar för föräldraledighet och vab riskerar de att halka efter ekonomiskt på lång sikt. – Som det ser ut nu är det kvinnor som förlorar på att vi delar så olika som vi gör. Vi vet att när barnen kommer då sjunker inkomsterna för kvinnor. Då ökar ohälsan. Karriärmöjligheter försvinner och i slutändan ger det en låg pension för kvinnor, säger Therese Svanström, ordförande TCO.  Vill att fler dagar reserveras För att öka jämställdheten vill TCO att fler månader reserveras för vardera förälder i föräldraförsäkringen. Organisationen vill också höja ersättningen för de 90 dagar som i dag har lägst ersättning. Men några sådana förslag finns i nuläget inte på regeringens bord. Äldre- och socialförsäkringsminister Anna Tenje (M) säger att regeringen följer utvecklingen, men lyfter samtidigt vikten av att familjer själva ska kunna bestämma hur de fördelar sin föräldraledighet.", "link": "https://www.tv4.se/artikel/6HpCjNQC15hM6MQ30LhKke/pappor-hemma-mindre-med-barnen-ett-trendbrott", "date_display": "2026-03-06", "date_iso": "2026-03-06T06:24:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/vab", "/tco", "/jamstalldhet", "/ekonomi"]}, {"id": 153, "title": "Israel has launched a \"comprehensive attack wave\" against Iran", "summary": "Iranian attacks on targets in the Middle East", "title_original": "Israel har inlett ”omfattande attackvåg” mot Iran", "summary_original": "Iranska attacker mot mål i Mellanöstern", "link": "https://www.tv4.se/artikel/2xlWfAo8j2XPHf3nqJ3I6L/israel-har-inlett-omfattande-attackvag-mot-iran", "date_display": "2026-03-06", "date_iso": "2026-03-06T05:23:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 154, "title": "Could it be that pastoral care is seen as something a little shameful?", "summary": "Sometimes it feels as if in our congregations we put all our faith in the moments of intercessory prayer - a kind of quick fix that will solve everything, writes Bengt Klintenberg.", "title_original": "Kan det vara så att själavård ses som något lite skamligt?", "summary_original": "Ibland känns det som om vi i våra församlingar lägger all vår tilltro till förbönstunderna – en sorts quick fix som ska lösa allt, skriver Bengt Klintenberg.", "link": "https://www.dagen.se/debatt/kan-det-vara-sa-att-sjaelavard-ses-som-nagot-lite-skamligt/10231228", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "\"You can think 'Where was God in this?'\"", "summary": "Ingegerd and Malte Holmquist lost their son when he was 40 • Now they are celebrating their golden wedding anniversary", "title_original": "”Man kan tänka ’Var fanns Gud i det här?’”", "summary_original": "Ingegerd och Malte Holmquist förlorade sin son när han var 40 år • Nu firar de guldbröllop", "link": "https://www.dagen.se/familj/man-kan-taenka-var-fanns-gud-i-det-haer/10226178", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Felicia Ferreira: Uppsala shows the way for civil society", "summary": "The law has long provided the opportunity - now a municipality has dared to use it", "title_original": "Felicia Ferreira:Uppsala visar vägen för civilsamhället", "summary_original": "Lagen har länge gett möjligheten – nu har en kommun vågat använda den", "link": "https://www.dagen.se/ledare/felicia-ferreirauppsala-visar-vaegen-foer-civilsamhaellet/10232208", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "The USA, Russia and Iran – religion is making a geopolitical comeback", "summary": "Regardless of whether we want it or not, religious rhetoric and interpretations are now an aspect of global geopolitical processes, writes Pär Gustafsson Kurki.", "title_original": "USA, Ryssland och Iran – religionen gör geopolitisk comeback", "summary_original": "Oavsett om vi vill det eller ej är religiös retorik och tolkningar numera en aspekt av globala geopolitiska processer, skriver Pär Gustafsson Kurki.", "link": "https://www.dagen.se/debatt/usa-ryssland-och-iran-religionen-goer-geopolitisk-comeback/10232454", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Ebba Busch (KD) referred to \"Swedish Christian values\" in an interview", "summary": "The Christian Democrats have long highlighted the importance of Christian values, but in an interview with Dagens Nyheter, Ebba Busch added another value word", "title_original": "Ebba Busch (KD) hänvisade till ”svenska kristna värderingar” i intervju", "summary_original": "Kristdemokraterna har länge lyft fram vikten av kristna värderingar, men i en intervju med Dagens Nyheter lade Ebba Busch till ytterligare ett värdeord", "link": "https://www.dagen.se/nyheter/ebba-busch-kd-haenvisade-till-svenska-kristna-vaerderingar-i-intervju/10235905", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "After incident 2025: not applying to be an exhibitor at Torpkonfernsen", "summary": "Members of the Christian Rainbow Movement experience \"great insecurity around the conference\"", "title_original": "Efter incident 2025: ansöker inte om att bli utställare på Torpkonfernsen", "summary_original": "Medlemmar i Kristna regnbågsrörelsen upplever ”stor otrygghet kring konferensen”", "link": "https://www.dagen.se/nyheter/efter-incident-2025-ansoeker-inte-om-att-bli-utstaellare-pa-torpkonfernsen/10236423", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "ALT teachers encourage reading the Bible with Jesus as a lens", "summary": "Maria Karlsson's response to the selective \"war bible\" • Encourages \"thick religion\" that touches people deeply - and that becomes reconciling and peace-making", "title_original": "ALT-lärare uppmanar att läsa Bibeln med Jesus som lins", "summary_original": "Maria Karlssons svar på selektiva ”krigsbibeln” • Uppmuntrar till ”tjock religion” som berör människan på djupet – och som blir försonande och fredsskapande", "link": "https://www.dagen.se/dokument/alt-laerare-uppmanar-att-laesa-bibeln-med-jesus-som-lins/10209193", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Bible researchers: Right-wing extremists use the \"war bible\" when they are radicalized", "summary": "Has studied how the mass murderer Breivik quoted biblical words in his manifesto • \"Important that Christians give a more positive image of the Bible's content\"", "title_original": "Bibelforskare: Högerextrema använder ”krigsbibeln” när de radikaliseras", "summary_original": "Har studerat hur massmördaren Breivik citerade bibelord i sitt manifest • ”Viktigt att kristna ger en mer positiv bild av Bibelns innehåll”", "link": "https://www.dagen.se/dokument/bibelforskare-hoegerextrema-brukar-krigsbibeln-som-inspiration-foer-hat-och-vald/10184687", "date_display": "2026-03-06", "date_iso": "2026-03-06T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "Here, the veteran gets his arm broken - when he protests the war", "summary": "Overpowered by politicians and guards • \"Just wanted to be heard\"", "title_original": "Här får veteran armen bruten – när han protesterar mot kriget", "summary_original": "Övermannades av politiker och vakter • ”Ville bara bli hörd”", "link": "https://www.tv4.se/artikel/77xnK5IbymkS8ufOmPRBTO/haer-far-veteran-armen-bruten-naer-han-protester-mot-kriget", "date_display": "2026-03-05", "date_iso": "2026-03-05T21:03:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 163, "title": "Trump fires Kristi Noem", "summary": "Trump fires US Homeland Security Secretary Kristi Noem, he states on Truth Social. Markwayne Mullin, senator from Oklahoma, will take her place. Noem is being moved to a new role as special envoy for \"The Shield of the Americas\", which Trump describes as a \"new security initiative in the Western Hemisphere\". According to Trump, Noem has achieved \"many spectacular results, especially at the border\". \"I thank Kristi for her service on 'Homeland,'\" writes Trump. Dissatisfaction grew Already earlier on Thursday, there were reports that the president was getting ready to poke Noem and that he had heard about possible replacements. According to Wall Street Journal sources, the last straw for Trump was Tuesday's hearing of Noem in the Senate Judiciary Committee.  During the hearing, Noem was pressed by both Democratic and Republican senators. The criticism was, among other things, about an advertising campaign worth 220 million dollars in which she herself was seen prominently, something several senators believed gave the impression that tax funds were used to strengthen her own profile. Trump stated in an interview earlier that day that he did not approve of the campaign, further adding to the discontent. Mullin receives broad support Markwayne Mullin, who has sat in the Senate since 2023, has received broad support from the Republican side and is expected to have a relatively uncomplicated confirmation process, the American The Hill reports.  He formally takes office on March 31.", "title_original": "Trump sparkar Kristi Noem", "summary_original": "Trump sparkar USA:s inrikessäkerhetsminister Kristi Noem, uppger han på Truth Social. I hennes ställe tillträder Markwayne Mullin, senator från Oklahoma. Noem flyttas till en ny roll som särskilt sändebud för ”The Shield of the Americas” som Trump beskriver som ett ”nytt säkerhetsinitiativ på västra halvklotet”. Enligt Trump har Noem uppnått ”många spektakulära resultat, framförallt vid gränsen”. ”Jag tackar Kristi för hennes tjänstgöring på 'Homeland'”, skriver Trump. Missnöjet växte Redan tidigare på torsdagen kom uppgifter om att presidenten gjort sig redo att peta Noem och att han hört sig för om möjliga ersättare. Enligt källor till Wall Street Journal ska den sista droppen för Trump ha varit tisdagens utfrågning av Noem i senatens justitieutskott.  Under utfrågningen pressades Noem av både demokrater och republikanska senatorer. Kritiken handlade bland annat om en reklamkampanj värd 220 miljoner dollar där hon själv synts framträdande, något flera senatorer menade gav intrycket av att skattemedel använts för att stärka hennes egen profil. Trump uppgav i en intervju tidigare samma dag att han inte godkänt kampanjen, vilket ytterligare bidrog till missnöjet. Mullin får brett stöd Markwayne Mullin, som suttit i senaten sedan 2023, har fått brett stöd från republikanskt håll och väntas få en relativt okomplicerad bekräftelseprocess, det rapporterar amerikanska The Hill.  Han tillträder formellt den 31 mars.", "link": "https://www.tv4.se/artikel/3wmItQHb565LAkySPRPE0T/trump-sparkar-kristi-noem-far-helt-ny-roll", "date_display": "2026-03-05", "date_iso": "2026-03-05T18:54:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/usa", "/amerikansk-politik", "/donald-trump"]}, {"id": 164, "title": "Kerstin, 82, picked up 20 liters of dog poo: \"Took three hours\"", "summary": "Kerstin Carlsson, 82, in Kil has long resented dog owners not picking up after their dogs. During the walks with her own dog, she finally got tired, which Värmland's Folkblad has written about.  - I picked up 20 liters of poo, it took three hours. In a distance of one kilometer, she filled two ten liter cans with dog poo. She believes that dog owners have started to be careless more and more, but also that it can be seen more clearly now that the snow is melting.  - It was completely full on the cycle paths and you could see that people had stepped in the poo. It can't be that much fun to take home with you. \"Someone else-ism\" Kerstin Carlsson says she is tired of many people expecting others to clean up the poop. - I call it \"someone-else-ism\". Everyone thinks that someone else is going to solve their problems for them. Instead, she tries to do what she believes everyone can and should do. - If no one does it, nothing gets done. Then I will be the \"someone else\" who gets to fix it. Kerstin Carlsson believes that more people are inclined to be careless if they see others doing it. Therefore, she wants to break the trend. - Rubbish begets rubbish, I've seen that. In the forest, people have even picked up the dog poo but still threw the bag in the forest. It is even more strange. The carelessness has continued When Kerstin told about the effort, people think that it is too much to ask of her, but she believes that it is the least bad option. - I've been annoyed about it for a long time, but then it's probably better to solve things than to go around and be sad when the sun is shining and the birds are chirping. Some still seem to have difficulty learning. The day after she cleaned up the bike path, there was new dog poo in the same place. - Then I would very much like to talk to the dog owner and explain that it is highly inappropriate. She believes that those who are careless have nothing to blame. Throughout the municipality there are latrine barrels and free bags for those who cannot afford to buy. - It shouldn't be that difficult. If you can't pick up after your dog, then you shouldn't have a dog at all.", "title_original": "Kerstin, 82, plockade 20 liter hundbajs: ”Tog tre timmar”", "summary_original": "Kerstin Carlsson, 82, i Kil har länge retat sig på att hundägare inte plockar upp efter sina hundar. Under promenaderna med sin egen hund tröttnade hon till slut, vilket Värmlands Folkblad har skrivit om.  – Jag plockade upp 20 liter bajs, det tog tre timmar. På en sträcka på en kilometer fyllde hon två tiolitersdunkar med hundbajs. Hon tror att hundägare börjat slarva mer och mer, men även att det syns tydligare nu när snön smälter.  – Det var alldeles fullt på cykelbanorna och man såg att folk hade trampat i bajset. Det kan inte vara så kul att ta med sig hem. ”Nån-annan-ism” Kerstin Carlsson säger att hon är trött på att många förväntar sig att andra ska städa upp bajset. – Jag kallar det ”nån-annan-ism”. Alla tror att någon annan ska lösa deras problem åt dem. I stället försöker hon själv göra det hon menar att alla kan och borde göra. – Om ingen gör det, blir inget gjort. Då blir jag den ”någon annan” som får fixa det. Kerstin Carlsson tror att fler är benägna att slarva om de ser att andra gör det. Därför vill hon bryta trenden. – Skräp föder skräp, det har jag sett. I skogen har folk till och med plockat upp hundbajset men ändå slängt påsen i skogen. Det är ännu mer märkligt. Slarvet har fortsatt När Kerstin berättat om insatsen tycker folk att det är för mycket begärt av henne, men hon menar att det är det minst dåliga alternativet. – Jag har retat mig på det länge, men då är det väl bättre att lösa saker än att gå runt och vara sur när solen skiner och fåglarna kvittrar. Vissa verkar ändå ha svårt att lära sig. Dagen efter att hon städat upp cykelbanan låg det nytt hundbajs på samma ställe. – Då skulle jag hemskt gärna prata med hundägaren och förklara att det är högst olämpligt. Hon menar att de som slarvar inte har något att skylla på. I hela kommunen finns det latrintunnor och gratis påsar för de som inte har råd att köpa. – Det borde inte vara så svårt. Kan man inte plocka upp efter sin hund, då ska man inte ha hund överhuvudtaget.", "link": "https://www.tv4.se/artikel/3mZE8Q6jXf674b7oknthIf/kerstin-82-plockade-20-liter-hundbajs-tog-tre-timmar", "date_display": "2026-03-05", "date_iso": "2026-03-05T18:26:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/skrap", "/hundar"]}, {"id": 165, "title": "The Russian confusion - after the star's denial: \"We don't know\"", "summary": "The confusion surrounding Yngwie Malmsteen's alleged Moscow concert continues to deepen. Earlier this week, Göteborgs‑Posten reported that the Swedish guitar legend would perform in the Russian capital on March 14 – a statement that quickly attracted attention as many artists chose to boycott Russia after the country's invasion of Ukraine. But according to Malmsteen's own team, the information is completely wrong. \"There is no upcoming Russian gig. Full stop!\", his management writes in an email to TV4 Nyheterna. Removed gig They refer to the artist's official website as the only valid source for future performances and there is no Moscow gig listed. At the same time, a check using the archive tool Wayback machine shows that a Moscow gig has actually been on Malmsteen's website recently. It is now removed. The question is why it was there - and why it disappeared. \"Please call back on Monday\" A further detail is that the concert is still being advertised on the VK Stadium website, despite Malmsteen's denial. There the gig is stated to be sold out. The arena holds around 7,000 visitors. \"Maybe tickets will be sold at the box office. Check with the organizers for information,\" writes VK Stadium on the website. After several attempts, TV4 Nyheterna finally gets an answer from the arena - and the message is short: - We don't know, says a woman who works at VK Stadium. You don't know? - Please call back on Monday. Yngwie Malmsteen, one of Sweden's most influential hard rock guitarists, continues his international career with gigs in Argentina and Brazil, among others. He is also scheduled to play at Sweden Rock in June.", "title_original": "Ryska förvirringen – efter stjärnans dementi: ”Vi vet inte”", "summary_original": "Förvirringen kring Yngwie Malmsteens påstådda Moskva‑konsert fortsätter att djupna. Tidigare i veckan rapporterade Göteborgs‑Posten att den svenske gitarrlegenden skulle uppträda i den ryska huvudstaden den 14 mars – en uppgift som snabbt väckte uppmärksamhet då många artister valt att bojkotta Ryssland efter landets invasion av Ukraina. Men enligt Malmsteens eget team är uppgifterna helt felaktiga. ”Det finns ingen kommande rysk spelning. Punkt slut!”, skriver hans management i ett mejl till TV4 Nyheterna. Borttagen spelning De hänvisar till artistens officiella hemsida som den enda giltiga källan för framtida uppträdanden och där finns ingen Moskva‑spelning listad. Samtidigt visar en kontroll med hjälp av arkivverktyget Wayback machine att en Moskva‑spelning faktiskt har legat på Malmsteens hemsida nyligen. Den är nu borttagen. Frågan är varför den funnits där – och varför den försvunnit. ”Snälla, ring tillbaka på måndag” En ytterligare detalj är att konserten fortfarande annonseras på VK Stadiums hemsida, trots Malmsteens förnekande. Där uppges spelningen vara slutsåld. Arenan rymmer cirka 7000 besökare. ”Kanske säljs biljetter i biljettkassan. Hör med arrangörerna för information”, skriver VK Stadium på hemsidan. Efter flera försök får TV4 Nyheterna till slut svar från arenan – och beskedet är kort: – Vi vet inte, säger en kvinna som arbetar på VK Stadium. Ni vet inte? – Snälla, ring tillbaka på måndag. Yngwie Malmsteen, en av Sveriges mest inflytelserika hårdrocksgitarrister, f
