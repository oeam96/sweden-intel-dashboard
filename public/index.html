nal": "Katolska utbrytargruppen SSPX nära uteslutning", "summary_original": "Påve Leo XIV: ”Gör de det valet så är jag ledsen, men vi måste gå vidare.”", "link": "https://www.dagen.se/nyheter/katolska-utbrytargruppen-sspx-naera-uteslutning/10398442", "date_display": "2026-06-29", "date_iso": "2026-06-29T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Sources: Iran and US pause attacks - talks in Doha", "summary": "On Sunday, the United States and Iran should have agreed to stop attacking each other, US sources told Axios. New negotiations await in Doha, where the parties will discuss the situation in the Strait of Hormuz, according to the sources.", "title_original": "Källor: Iran och USA pausar attacker – samtal i Doha", "summary_original": "På söndagen ska USA och Iran ha kommit överens om att sluta attackera varandra, uppger amerikanska källor för Axios. Nu väntar nya förhandlingar i Doha, där parterna ska diskutera situationen i Hormuzsundet, enligt källorna.", "link": "https://www.dn.se/varlden/kallor-iran-och-usa-pausar-attacker-samtal-i-doha/", "date_display": "2026-06-28", "date_iso": "2026-06-28T21:55:32+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Historic Canada on - decided in stoppage time", "summary": "Stephen Eustáquio pushed host nation Canada through to a historic round of 16 in the FIFA World Cup. The midfielder scored in stoppage time as South Africa were knocked out 1–0 in the round of 16 in Inglewood, California.", "title_original": "Historiskt Kanada vidare – avgjorde på stopptid", "summary_original": "Stephen Eustáquio sköt värdnationen Kanada vidare till en historisk åttondelsfinal i fotbolls-VM. Mittfältaren avgjorde på stopptid när Sydafrika slogs ut med 1–0 i 16-delsfinalen i Inglewood, Kalifornien.", "link": "https://www.dn.se/sport/historiskt-kanada-vidare-avgjorde-pa-stopptid/", "date_display": "2026-06-28", "date_iso": "2026-06-28T21:09:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "South Korea's president demands an investigation into the World Cup fiasco", "summary": "South Korea went out of the World Cup already in the group stage. Now President Lee Jae-myung is demanding a thorough investigation into the failure. \"Significant state resources have been invested in the World Cup,\" he writes on X.", "title_original": "Sydkoreas president kräver att VM-fiaskot utreds", "summary_original": "Sydkorea åkte ur fotbolls-VM redan i gruppspelet. Nu kräver president Lee Jae-myung en grundlig utredning av misslyckandet. ”Betydande statliga resurser har investerats i VM”, skriver han på X.", "link": "https://www.dn.se/sport/sydkoreas-president-kraver-att-vm-fiaskot-utreds/", "date_display": "2026-06-28", "date_iso": "2026-06-28T21:07:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Air defenses are being strengthened in Moscow - concern about ballistic robots", "summary": "After repeated Ukrainian attacks on Moscow, Russia has strengthened its air defenses with powerful systems - now also at the research institute headed by President Putin's daughter. - There is a concern that Ukraine will start using ballistic robots, says military analyst Jörgen Elfving.", "title_original": "Luftvärnet förstärks i Moskva – oro för ballistiska robotar", "summary_original": "Efter upprepade ukrainska attacker mot Moskva har Ryssland förstärkt luftvärnet med kraftfulla system – nu även vid forskningsinstitutet som leds av president Putins dotter. – Det finns en oro att Ukraina ska börja använda sig av ballistiska robotar, säger militäranalytikern Jörgen Elfving.", "link": "https://www.dn.se/varlden/luftvarnet-forstarks-i-moskva-oro-for-ballistiska-robotar/", "date_display": "2026-06-28", "date_iso": "2026-06-28T20:17:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "GW hesitant: \"I can't get him to agree with the deed\"", "summary": "In 2005, a man and a woman in their 70s were axed to death in Brattås outside Härnösand. In April 2026, more than 20 years later, a 45-year-old man was detained on probable cause as his DNA was found in the woman's sock. He has been charged and is still in custody. GW: \"Was very bad\" On July 6, the prosecutor must bring charges against the man. Criminologist Leif GW Persson does not believe that a prosecution will take place, but that the prosecutor is trying to request an extended period of detention.  - I think he is most likely to get that. However, you will not be as generous as last time. Then you got a month, now you get maybe 14 days, says GW Persson in TV4 Nyhetsmorgon. - If you can't get something else substantial or a confession, I think the case will land on the bottom. It would be very bad in that case. It is up to the prosecutor to prove how it is, it is not the man who has to prove his innocence. At the same time, Leif GW Persson describes the matter as tricky. - What allows him to be caught is the fact that his DNA has been found on one of the female victim's socks. Plus he has been living in the area at the time of the crime. He himself has no idea how it could have ended up there. \"Can't make him agree with the deed\" The man still denies the crime. And the criminologist believes that there is much that speaks against it being the 45-year-old, who was around 25 when the double murder occurred, who committed it. - There is nothing about his person that matches what everyone in the know has believed about the act itself. He is totally unpunished all his life. I can't get him to agree to the deed. Instead, Leif GW Persson believes that a relative of the male victim is behind it. - There is much that speaks for it.", "title_original": "GW tveksam: ”Jag får inte honom att stämma med gärningen”", "summary_original": "År 2005 yxmördades en man och en kvinna i 70-årsåldern i Brattås utanför Härnösand. I april 2026 över 20 år senare frihetsberövades en man i 45-årsåldern, misstänkt på sannolika skäl då hans dna fanns i kvinnans strumpa. Han är åtalad och sitter fortfarande häktad. GW: ”Vore väldigt illa” Den 6 juli måste åklagaren väcka åtal mot mannen. Kriminologen Leif GW Persson tror inte på att ett åtal kommer att ske, utan att åklagaren försöker begära förlängd häktningstid.  – Det tror jag att han mest sannolikt får. Däremot kommer man inte vara lika generös som förra gången. Då fick man en månad, nu får man kanske 14 dagar, säger GW Persson i TV4 Nyhetsmorgon. – Kan man inte få in något annat substantiellt eller ett erkännande tror jag ärendet kommer att landa på rumpan. Det vore väldigt illa i så fall. Det är åklagaren sak att bevisa hur det ligger till,  det är inte mannen som ska bevisa sin oskuld. Samtidigt beskriver Leif GW Persson ärendet som knepigt. – Det som gör att han kan hamna i finkan, är det faktum att man har hittat hans dna på det kvinnliga offrets ena strumpa. Plus att han har bott i området vid tidpunkten för brottet. Han har själv inte en susning om hur det kan ha hamnat där. ”Får honom inte att stämma med gärningen” Mannen nekar fortfarande till brott. Och kriminologen menar att det finns mycket som talar emot att det skulle vara 45-åringen, som var runt 25 år när dubbelmordet inträffade, som begick det. – Det finns ingenting hos hans person som stämmer överens med vad alla insatta har trott om själva gärningen. Han är totalt ostraffad hela livet. Jag får inte honom att stämma med gärningen. Istället, tror Leif GW Persson, att en närstående till det manliga offret ligger bakom. – Det finns mycket som talar för det.", "link": "https://www.tv4.se/artikel/6zTXIF2rx4Q3OeVcAIJXYR/gw-tveksam-jag-far-inte-honom-att-staemma-med-gaerningen", "date_display": "2026-06-28", "date_iso": "2026-06-28T20:00:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/dubbelmordet-i-brattas", "/leif-gw-om"]}, {"id": 134, "title": "Charred papyrus scroll could be read with AI: “Historic breakthrough”", "summary": "Using AI, researchers have managed to read parts of a nearly 2,000-year-old charred papyrus scroll without opening it. The researchers describe the progress as a historic breakthrough.", "title_original": "Förkolnad papyrusrulle kunde läsas med AI: ”Historiskt genombrott”", "summary_original": "Med hjälp av AI har forskare lyckats läsa delar av en nästan 2 000 år gammal förkolnad papyrusrulle utan att öppna den. Forskarna beskriver framsteget som ett historiskt genombrott.", "link": "https://www.dn.se/varlden/forkolnad-papyrusrulle-kunde-lasas-med-ai-historiskt-genombrott/", "date_display": "2026-06-28", "date_iso": "2026-06-28T19:57:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "That's why humans and monkeys laugh alike", "summary": "Humans and monkeys have been laughing at the same rate for 15 million years. This is shown by new research where monkeys have been tickled. But we don't always laugh at the same things - with one exception.", "title_original": "Därför skrattar människor och apor likadant", "summary_original": "Människor och apor skrattar i samma takt sedan 15 miljoner år tillbaka. Det visar ny forskning där man har kittlat apor. Men vi skrattar inte alltid åt samma saker – med ett undantag.", "link": "https://www.dn.se/varlden/darfor-skrattar-manniskor-och-apor-likadant/", "date_display": "2026-06-28", "date_iso": "2026-06-28T19:19:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "The state made a mistake - but Jonas still had to pay", "summary": "In 2018, Jonas Lerin had his taxi license revoked by the Swedish Transport Agency because it was believed that he has epilepsy. But the authority was wrong and after a long legal process the decision was overturned. Despite this, Jonas has to bear the legal costs. - When I know I'm right, I don't give up, says Jonas, who has now taken up the fight against the state to get compensation.", "title_original": "Staten gjorde fel – men Jonas fick ändå betala", "summary_original": "2018 fick Jonas Lerin fick sitt taxileg indraget av Transportstyrelsen eftersom man menade att han har epilepsi. Men myndigheten hade fel och efter en lång rättsprocess hävdes beslutet. Trots detta får Jonas stå för advokatkostnaderna. – När jag vet att jag har rätt så ger jag mig inte, säger Jonas som nu har tagit strid mot staten för att få ersättning.", "link": "https://www.dn.se/sverige/staten-gjorde-fel-men-jonas-fick-anda-betala/", "date_display": "2026-06-28", "date_iso": "2026-06-28T19:00:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Sick ministers do not report absence - keep their fees", "summary": "The parliament has reviewed how the government handled sickness absence. The review shows that none of the 24 ministers have called in sick, despite several canceling meetings or trips due to illness.\n\nLast week, Culture Minister Parisa Liljestrand (M) canceled a planned meeting due to pneumonia. In May, Health Minister Elisabet Lann (KD) went into hospital. Environment Minister Romina Pourmokhtari (L) canceled a meeting in Brussels in December due to illness. Minister of Rural Affairs Peter Kullgren was affected by covid-19 in 2023.\n\nIn none of the cases was a sick leave reported and thus no deduction was made from the fee, writes the Altinget. Illness - but continued work Parisa Liljestrand's press secretary states that the minister canceled commitments due to the risk of infection and out of consideration for the health of the other participants.\n\n\"This did not prevent her from working with other tasks within the scope of her mission, which did not require attendance at external events,\" writes the press secretary in an email response to the Alting. \"Strange if they reported sick\" Stig-Björn Ljunggren, political scientist and political editor-in-chief at the social democratic newspaper Sydöstran, on the other hand, sees no problem with ministers not reporting sick when they are sick. He points out that it is part of the minister's duty to be available, regardless of general conditions. - It would be rather strange IF they called in sick, as they are on duty 24 hours a day, he says to TV4 Nyheterna.  \"Cheating\" Tony Haddou (V), vice-chairman of the social security committee, is, on the other hand, very critical of ministers charging full remuneration, despite canceled assignments due to illness. - Ordinary wage earners lose over a thousand kroner every time they are sick. The ministers seem to think that the rules should apply to the people, but not to the government, he tells the Altinget. - It is difficult to see this as anything other than cheating. This is how the rules for government ministers work The normal health insurance rules do not cover the government. A cabinet is in price", "title_original": "Sjuka ministrar anmäler ingen frånvaro – behåller arvoden", "summary_original": "Altinget har gått igenom hur regeringen hanterat sjukfrånvaro. Granskningen visar att ingen av de 24 ministrarna har sjukanmält sig, trots att flera ställt in möten eller resor just på grund av sjukdom.\n\nI förra veckan ställde kulturminister Parisa Liljestrand (M) in ett planerat möte på grund av lunginflammation. I maj åkte sjukvårdsminister Elisabet Lann (KD) in på sjukhus. Miljöminister Romina Pourmokhtari (L) ställde in ett möte i Bryssel i december på grund av sjukdom. Landsbygdsminister Peter Kullgren drabbades 2023 av covid-19.\n\nI inget av fallen anmäldes någon sjukanmälan och därmed gjordes heller inget avdrag på arvodet, skriver Altinget. Sjukdom – men fortsatt arbete Parisa Liljestrands pressekreterare uppger att ministern ställde in åtaganden på grund av smittorisk och av hänsyn till övriga deltagares hälsa.\n\n”Detta förhindrade henne inte från att arbeta med andrauppgifter inom ramen för sitt uppdrag, som inte krävde närvaro vid externa evenemang”, skriver pressekreteraren i ett mejlsvar till Altinget. ”Konstigt om de sjukanmälde sig” Stig-Björn Ljunggren, statsvetare och politisk chefredaktör på den socialdemokratiska tidiningen Sydöstran, ser däremot inga problem med att ministrar inte sjukanmäler sig när de är sjuka. Han påpekar att det ingår i statsråden uppdrag att vara tillgänglig, oavsett allmäntillstånd. – Det vore snarare konstigt OM de sjukanmälde sig, då de är i tjänst 24 timmar om dygnet, säger han till TV4 Nyheterna.  ”Fusk” Tony Haddou (V), vice ordförande i socialförsäkringsutskottet är däremot väldigt kritisk till att statsråden tar ut fullt arvode, trots inställda uppdrag på grund av sjukdom. – Vanliga löntagare förlorar över tusen kronor varje gång de är sjuka. Ministrarna verkar tycka att reglerna ska gälla för folket, men inte för regeringen, säger han till Altinget. – Det är svårt att se det här som något annat än fusk. Så fungerar reglerna för statsråd De vanliga sjukförsäkringsreglerna omfattar inte regeringen. Ett statsråd är i princip alltid i tjänst under årets alla dagar, dygnet runt.\n\nOm en minister blir sjuk och inte kan fullfölja ett uppdrag ska det enligt lag anmälas till Regeringskansliet. Första dagen på sjukdomsperioden dras det då upp till 5 370 kronor på arvodet och därefter dras det 20 procent av arvodet per sjukdag. Det är inte bara den nuvarande regeringen som ingen minister sjukanmäler sig. Den tidigare statministern Stefan Löfven (S) anmälde inte frånvaro trots att han opererades på sjukhus. Senaste gången ett statsråd sjukanmälde sig var för sju år sedan när Annika Strandhäll (S), dåvarande socialförsäkringsminister anmälde frånvaro efter att hennes sambo avlidit.", "link": "https://www.tv4.se/artikel/1CGl8QcK2YXLWGLa7vkBzd/sjuka-ministrar-anmaeler-ingen-franvaro-behaller-arvoden", "date_display": "2026-06-28", "date_iso": "2026-06-28T18:56:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/politik", "/regeringen", "/sjukfranvaro"]}, {"id": 138, "title": "Scream for joy in the tent camp: \"Greatest happiness you can experience\"", "summary": "Here the mother receives the news that the son is alive – after three days • TV4 on location", "title_original": "Glädjetjut i tältlägret: ”Största lycka man kan uppleva”", "summary_original": "Här får mamman beskedet att sonen lever – efter tre dygn • TV4 på plats", "link": "https://www.tv4.se/artikel/3vlOW6H7bOeDEw3fSy404e/glaedjetjut-i-taeltlaegret-stoersta-lycka-man-kan-uppleva", "date_display": "2026-06-28", "date_iso": "2026-06-28T18:28:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 139, "title": "Duplantis missed the world record after the giant wedding", "summary": "Armand Duplantis attempted three times at 6.32 meters but failed to break his own world record at the Paris Diamond League gala. \"Mondo\" still won the competition in a new competition record, 6.13, two weeks after the three-day wedding on the French Riviera and the failure at home in Stockholm's stadium.", "title_original": "Duplantis missade världsrekord efter jättebröllopet", "summary_original": "Armand Duplantis försökte tre gånger på 6,32 meter men misslyckades med att slå sitt eget världsrekord i Paris Diamond League-gala. ”Mondo” vann ändå tävlingen på nytt tävlingsrekord, 6,13, två veckor efter tredagarsbröllopet på den franska Rivieran och misslyckandet hemma på Stockholms stadion.", "link": "https://www.dn.se/sport/duplantis-missade-varldsrekord-efter-jattebrollopet/", "date_display": "2026-06-28", "date_iso": "2026-06-28T18:22:25+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Putin must be forced to make peace in 40 days - experts doubtful", "summary": "The other day, Zelenskyy approved a 40-day plan from Ukraine's security service SBU to force Russia to end the war. - Zelenskyi has announced a 40-day plan that includes attacks deep into Russia and attacks on Crimea. We don't really know more than that, says lieutenant colonel Jörgen Elfving. Elfving on the peace hopes: \"Skeptical\" Elfving's assessment that the plan has already begun to be put into action, and that the recent attacks against Russia are part of it. Most recently on Sunday, Zelensky stated that two oil refineries had been hit, partly in Slavyansk-na-Kubani near Crimea, and in Yaroslavl further into Russia. One person died in the first attack. Elfving says he is \"sceptical\" about Zelenskyi's hopes that the 40-day plan will force Russia to peace. - Russia is very big, it's about how much resources Ukraine has and what goals they manage to achieve. Caused chaos in the holiday paradise But even if he considers it unlikely that the entire Russian war machine will be shaken in the near future, Elfving sees that Ukraine's attacks have caused real problems on the Crimean peninsula, where bridges and other important infrastructure have been attacked. - They have to import petrol, which is unusual. Usually Crimea is a vacation paradise, but this year there probably won't be that many vacationers there. I know that summer camps for children have been canceled there, and there is a lack of basic goods because people have bunkered down. Paasikivi: Psychological warfare Joakim Paasikivis regards the 40-day plan as information warfare to scare the Russian population and influence public opinion rather than anything else. - The SBU is only part of the Ukrainian defense. A campaign like this from them naturally gives a partial effect militarily, but I find it very difficult to see that a single campaign by the SBU could mean that Ukraine could break Russia in 40 days, he says. - The question is: Will the 40-day plan become known to the Russian public? There, the n", "title_original": "Putin ska tvingas till fred på 40 dagar – experterna tveksamma", "summary_original": "Zelenskyj godkände häromdagen en 40-dagarsplan från Ukrainas säkerhetstjänst SBU som ska tvinga Ryssland att avsluta kriget. – Zelenskyj har aviserat en 40-dagarsplan som innehåller attacker på djupet av Ryssland och attacker mot Krim. Mer än så vet vi egentligen inte, säger överstelöjtnanten Jörgen Elfving. Elfving om fredsförhoppningarna: ”Skeptisk” Elfvings bedömning att planen redan har börjat sättas i verket, och att den senaste tidens attacker mot Ryssland är del av den. Senast på söndagen uppgav Zelenskyj att två oljeraffinaderier träffats, dels i Slavjansk-na-Kubani i närheten av Krim, och i Jaroslavl längre in i Ryssland. En person dog i den förstnämnda attacken. Elfving säger att han ”förhåller sig skeptisk” till Zelenskyjs förhoppningar om att 40-dagarsplanen ska tvinga Ryssland till fred. – Ryssland är mycket stort, det handlar om hur mycket resurser Ukraina har och vilka mål de lyckas träffa. Orsakat kaos i semesterparadiset Men även om han bedömer det som osannolikt att hela den ryska krigsmaskinen ska rubbas den närmsta tiden ser Elfving att Ukrainas attacker ställt till med verkliga problem på Krimhalvön, där broar och annan viktig infrastruktur attackerats. – De måste importera bensin, vilket är ovanligt. Vanligtvis är Krim ett semesterparadis, men i år blir det nog inte så många semestergäster där. Jag vet att sommarläger för barn har ställts in där, och det är brist på basvaror för att människor bunkrat. Paasikivi: Psykologisk krigföring Joakim Paasikivis betraktar 40-dagarsplanen som informationskrigföring till för att skrämma den ryska befolkningen och påverka opinionen snarare än något annat. – SBU är bara en del av det ukrainska försvaret. En sådan här kampanj från dem ger ju naturligtvis en deleffekt militärt, men jag har väldigt svårt att se att en enda kampanj av SBU skulle kunna göra att Ukraina på 40 dagar skulle kunna knäcka Ryssland, säger han. – Frågan är: Kommer 40-dagarsplanen till kännedom för den ryska allmänheten? Där skulle den nog kunna fungera bättre. Joakim Paasikivi menar att det är väldigt svårt att få fram sådan information i rysk tv eller tidningar, men att det går att nå den ryska befolkningen via internet eller meddelandeappar. ”Det är vad som faktiskt ger effekt” Paasikivi tror att Ukraina snarare kommer att nå militär framgång genom att försvaret arbetar tillsammans, inte bara genom en kampanj från underrättelsetjänsten. – Och det har man gjort den senaste tiden, i form av attacker mot kvalificerade mål i Ryssland, till och med i Moskva på senare tid, men även attacker mot logistik- och underhållssystem i de ockuperade delarna av Ukraina och Krim, säger Joakim Paasikivi och fortsätter: – Det tillsammans med europeiskt stöd och inte minst sanktioner är vad som faktiskt ger effekt.", "link": "https://www.tv4.se/artikel/61pAFwsgUoozhH46lxov8I/putin-ska-tvingas-till-fred-pa-40-dagar-experterna-tveksamma", "date_display": "2026-06-28", "date_iso": "2026-06-28T17:57:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ukraina", "/ryssland"]}, {"id": 141, "title": "Moa's swollen feet were unusual cancer: \"Will not lose hope\"", "summary": "But gut feeling said otherwise. Moa booked a last-minute ticket home, and shortly afterwards the news came that she had an aggressive and very unusual form of cancer: adrenal cortical cancer that had already spread to the liver and lungs. - It was very unexpected. But I was quite collected. I just thought: \"Okay, now we turn the chapter in the book.\" One of Sweden's rarest forms of cancer Adrenal cortex cancer is one of Sweden's rarest forms of cancer. According to Moa's doctor Adam Edholm, who also researches the disease, only around 10-20 people in Sweden are affected each year. Because the cancer had spread, it cannot be cured with surgery. Instead, the treatments aim to prolong life and alleviate the symptoms. Born optimist Despite that, Moa has decided not to let cancer take over her life. - I would say that I was born an optimist. Sure, I have days when I'm sad, and then I let the feelings come. But then I want to live life again. When she has the energy, she works out, meets friends and travels. She tries to fill her days with things that make her happy.  - I see no point in holding on and worrying about things that haven't happened. It drains me of energy. It's better to just take it day by day.  The great support of friends The support of family and friends means a lot. When the hair fell out, the friends organized a \"flintstone party\". It became a way to face the disease with both warmth and humor. At the same time, she refuses to let go of hope. - Regardless of what the doctors say, I will not lose hope. I believe I will be well one day. I've believed that since day one. Instead, she tries to take advantage of the little things in everyday life. - You only live once. Take care to have fun. Do things that make you happy. Listen to the birds, swim, be out in nature and spend time with people you like.", "title_original": "Moas svullna fötter var ovanlig cancer: ”Kommer inte tappa hoppet”", "summary_original": "Men magkänslan sa något annat. Moa bokade en sista minuten-biljett hem, och kort därefter kom beskedet att hon hade en aggressiv och mycket ovanlig cancerform: binjurebarkscancer som redan spridit sig till lever och lungor. – Det var väldigt oväntat. Men jag var ganska samlad. Jag tänkte bara: ”Okej, nu vänder vi kapitel i boken.” En av Sveriges ovanligaste cancerformer Binjurebarkscancer är en av Sveriges ovanligaste cancerformer. Enligt Moas läkare Adam Edholm, som också forskar om sjukdomen, drabbas bara omkring 10–20 personer i Sverige varje år. Eftersom cancern hade hunnit sprida sig går den inte att bota med operation. Behandlingarna syftar i stället till att förlänga livet och lindra symtomen. Född optimist Trots det har Moa bestämt sig för att inte låta cancern ta över hennes liv. – Jag skulle säga att jag föddes som optimist. Visst har jag dagar när jag är ledsen, och då låter jag känslorna komma. Men sedan vill jag leva livet igen. När orken finns tränar hon, träffar vänner och reser. Hon försöker fylla dagarna med sådant som gör henne glad.  – Jag ser ingen mening med att hålla på och oroa mig över saker som inte har hänt. Det dränerar mig på energi. Det är bättre att bara ta dag för dag.  Vännernas stora stöd  Stödet från familj och vänner betyder mycket. När håret föll av ordnade vännerna en ”flintisfest”. Det blev ett sätt att möta sjukdomen med både värme och humor. Samtidigt vägrar hon släppa hoppet. – Oavsett vad läkarna säger kommer jag inte att tappa hoppet. Jag tror att jag kommer att bli frisk en dag. Det har jag trott sedan dag ett. I stället försöker hon ta vara på det lilla i vardagen. – Man lever en gång. Passa på att ha roligt. Gör saker som gör dig glad. Lyssna på fåglarna, bada, vara ute i naturen och umgås med människor du tycker om.", "link": "https://www.tv4.se/artikel/1jTxbR3yKLxooxKdnKcRti/moa-fick-en-ovanlig-cancer-man-lever-en-gang-passa-pa-att-ha-roligt", "date_display": "2026-06-28", "date_iso": "2026-06-28T15:50:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/cancervard", "/cancer", "/cancerforskning", "/livsoden", "/sjukvard", "/sjukvarden", "/halsa"]}, {"id": 142, "title": "Now a government with KD and S is a conceivable scenario", "summary": "", "title_original": "Nu är en regering med KD och S ett tänkbart scenario", "summary_original": "", "link": "https://www.tv4.se/artikel/34ZmyI4Ba7pdit7gtEfiAM/nu-aer-en-regering-med-kd-och-s-ett-taenkbart-scenario", "date_display": "2026-06-28", "date_iso": "2026-06-28T13:49:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "80,000 old-timers på plats i finska Kauhava för Sommarmötet", "summary": "\"There is a four to five hour uninterrupted line for communion.\"", "title_original": "80 000 gammallæstadianer på plats i finska Kauhava för Sommarmötet", "summary_original": "”Det är en fyra till fem timmar lång oavbruten kö till nattvarden.”", "link": "https://www.dagen.se/nyheter/80-000-gammallaestadianer-pa-plats-i-finska-kauhava-foer-sommarmoetet/10418255", "date_display": "2026-06-28", "date_iso": "2026-06-28T13:39:35+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 144, "title": "So Trump made the national day about himself", "summary": "But this year, when it has been 250 years since the Declaration of Independence was approved, the national day is drawing criticism and is even seen as a battle for the soul of the nation. The critics believe that the day has turned into a symbol of President Trump - and the creator is the president himself. The showman who likes extravaganza therefore chooses to make the Fourth of July his own day, not the nation's, say those who see red around the events already during the run-up to the 4th of July.  In the politically polarized USA, it has become difficult for parts of the population to see the national day as an opportunity to celebrate fundamental values ​​of freedom and democracy.  A clear sign A clear sign of this is that two different organizations are holding the celebration, which is particularly extensive because of the 250th anniversary. One is the America 250 Committee, established by Congress across party lines. The other is President Trump's organization, Freedom 250. Congress's America 250 began its work already ten years ago, while Freedom 250 is only a little over a year old. The critics see Trump's organization as a tool for him to sell himself, his cult of personality and his own campaign message - a pure hijacking of a celebration that should benefit all Americans.\n\nMiddle-aged and older Americans are drawing parallels to the last major celebration: the bicentennial in 1976. The United States was recovering from the Watergate scandal and the resignation of President Nixon. Gerald Ford was president and the focus was on modesty, national gathering and the importance of remembering America's history through a multitude of local events, seminars, exhibitions and cultural experiences across the country. A major difference from today was that Ford, according to historians, did not emphasize himself or his party.  Arouses strong emotions The history of the United States and how it is described arouses strong emotions. The history of indigenous peoples and the consequences of slavery are not the parts highlighted in Trump's narrative of what America was and is; snare", "title_original": "Så fick Trump nationaldagen att handla om honom själv", "summary_original": "Men i år, när det har gått 250 år sedan självständighetsförklaringen godkändes, väcker nationaldagen kritik och ses till och med som en kamp om nationens själ. Kritikerna anser att dagen har förvandlats till en symbol för president Trump – och skaparen är presidenten själv. Showmannen som gillar extravaganza väljer därför att göra fjärde juli till sin egen dag, inte nationens, menar de som ser rött kring evenemangen redan under upptakten till den 4 juli.  I det politiskt polariserade USA har det blivit svårt för delar av befolkningen att enbart se nationaldagen som ett tillfälle att fira grundläggande värden om frihet och demokrati.  Tydligt tecken  Ett tydligt tecken på detta är att två olika organisationer håller i firandet, vilket ju är särskilt omfattande på grund av 250-årsjubileet. Den ena är kommittén America 250, som instiftats av kongressen över partigränserna. Den andra är president Trumps organisation, Freedom 250. Kongressens America 250 påbörjade sitt arbete redan för tio år sedan, medan Freedom 250 bara är drygt ett år gammal. Kritikerna ser Trumps organisation som ett verktyg för honom att sälja in sig själv, sin personkult och sitt eget kampanjbudskap – en ren kapning av ett firande som borde komma alla amerikaner till del.\n\nMedelålders och äldre amerikaner drar paralleller till det förra stora firandet: 200-årsdagen som inföll 1976. USA höll på att återhämta sig efter Watergateskandalen och president Nixons avgång. Gerald Ford var president och fokus låg på lågmäldhet, nationell samling och vikten av att minnas USA:s historia genom mängder av lokala evenemang, seminarier, utställningar och kulturupplevelser över hela landet. En stor skillnad mot i dag var att Ford, enligt historiker, inte framhävde sig själv eller sitt parti.  Väcker starka känslor  USA:s historia och hur den beskrivs väcker starka känslor. Ursprungsbefolkningens historia och konsekvenserna av slaveriet är inte de delar som lyfts fram i Trumps berättelse om vad USA var och är; snarare är det en mer patriotisk och traditionell historieskrivning som betonas. \n\nTidigare i år ledde detta till stora konflikter kring skyltarna utanför President’s House i Philadelphia, där USA:s förste president George Washington bodde under slutet av 1700-talet. Skyltarna beskrev fakta, nämligen att Washington hade egna slavar trots sina idéer om frihet och människors lika värde. Skyltarna plockades ner av National Park Service och byttes ut mot nya där fokus flyttades mot en mer traditionell beskrivning av Washington och utan problematiserande kring honom som slavägare och vilka slavarna var.  Det juridiska bråket om skyltarna i Philadelphia har blivit en spegel av dagens USA. När landet nu firar 250 år är det inte bara fyrverkerier och gemenskap som står i centrum, utan en strid om vem som egentligen äger den amerikanska historien.", "link": "https://www.tv4.se/artikel/3uX0PWOylBSe9WkVLMj3FH/sa-fick-trump-nationaldagen-att-handla-om-honom-sjaelv", "date_display": "2026-06-28", "date_iso": "2026-06-28T12:51:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/usa", "/donald-trump"]}, {"id": 145, "title": "Lightning struck summerland - woman seriously injured", "summary": "\"Intensive when the storm ended up directly above us\" • A total of ten injured", "title_original": "Blixten slog ned på sommarland – kvinna allvarligt skadad", "summary_original": "”Intensivt när ovädret hamnade rakt över oss” • Totalt tio skadade", "link": "https://www.tv4.se/artikel/7JRn82F84z4otZRTL9VsoG/kvinna-allvarligt-skadad-efter-blixtnedslag-pa-sommarland", "date_display": "2026-06-28", "date_iso": "2026-06-28T11:05:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 146, "title": "Police officers wrestled 15-year-old down - GW: \"There was a power cut at the top\"", "summary": "The sentence concerns an attention-grabbing intervention that was caught on the officers' body cameras. According to the Court of Appeal, the police were guilty of harassment when they used more force than the situation warranted. \"You mustn't behave like that\" Leif GW Persson believes that above all the female police crossed the line. - She gives herself to the boy in a way that you don't actually get. It is perfectly clean. This is not the way to behave, he says. At the same time, he emphasizes that it is difficult to fully assess an intervention based on the film sequences that become public. - The problem in terms of evidence is that you often have a history that you cannot take part in. First something happens and then you see when it has really gotten out of hand. You don't have the whole background ready for yourself. \"If they had been convicted of assault, they would have gone out\" GW Persson sees the police being allowed to keep their jobs as a consequence of the fact that they were convicted of molestation and not of a more serious crime. - If they had been convicted of assault, they would have gone out, I'm pretty sure of that. He describes the intervention as a single occasion where the police officers lost their judgement. - At least the female police officer seems to have had a really bad day. I don't know how she managed otherwise, but once is never once, as they say. At the same time, he hopes that the 15-year-old boy received an apology for what happened. - I hope he has received the apology he deserves and that he behaves like people in the future.", "title_original": "Poliser brottade ner 15-åring – GW: ”Blev elavbrott upptill”", "summary_original": "Domen gäller ett uppmärksammat ingripande som fångades på polisernas kroppskameror. Enligt hovrätten gjorde poliserna sig skyldiga till ofredande när de använde mer våld än situationen motiverade. ”Så får man inte bete sig” Leif GW Persson menar att framför allt den kvinnliga polisen gick över gränsen. – Hon ger sig på grabben på ett sätt som man faktiskt inte får. Det är fullkomligt klockrent. Så här får man inte bete sig, säger han. Samtidigt framhåller han att det är svårt att fullt ut bedöma ett ingripande utifrån de filmsekvenser som blir offentliga. – Problemet bevismässigt är att man ofta har en historia som man inte kan ta del av. Först händer någonting och sedan får man se när det verkligen har gått överstyr. Man har inte hela bakgrunden klar för sig. ”Hade de dömts för misshandel hade de åkt ut” Att poliserna får behålla sina anställningar ser GW Persson som en följd av att de dömts för ofredande och inte för ett grövre brott. – Hade de dömts för misshandel hade de åkt ut, det är jag ganska säker på. Han beskriver ingripandet som ett enskilt tillfälle där poliserna tappade omdömet. – Åtminstone den kvinnliga polisen verkar ha haft en rejält dålig dag. Hur hon har klarat sig i övrigt vet inte jag, men en gång är ingen gång, brukar man ju säga. Samtidigt hoppas han att den 15-årige pojken fått en ursäkt för det inträffade. – Jag hoppas att han har fått den ursäkt han förtjänar och att han beter sig som folk i fortsättningen.", "link": "https://www.tv4.se/artikel/2Xw52FtaIAoKiGoCzpoOTV/gw-om-domen-mot-poliserna-det-blev-elavbrott-upptill", "date_display": "2026-06-28", "date_iso": "2026-06-28T10:37:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/brott-och-straff", "/leif-gw-om", "/personer/leif-gw-persson", "/polisen", "/polisvald"]}, {"id": 147, "title": "Iran's withdrawal a blow to the regime: \"Instrument of propaganda\"", "summary": "The expert: \"They have politicized football and everything else\" • Exile Iranians celebrate", "title_original": "Irans uttåg en smäll för regimen: ”Instrument för propaganda”", "summary_original": "Experten: ”De har politiserat fotboll och allt annat” • Exiliranier firar", "link": "https://www.tv4.se/artikel/60ak3ATy4XwGN5lkxYJl4T/irans-uttag-en-dubbelsmaell-foer-regimen-instrument-foer-propaganda", "date_display": "2026-06-28", "date_iso": "2026-06-28T10:31:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 148, "title": "Almost 4,000 participants at a large UV scout camp in the middle of the high summer heat", "summary": "SAU's general secretary: You are moved by people's commitment.", "title_original": "Nästan 4 000 deltagare på stort UV-scoutläger mitt i högsommarvärmen", "summary_original": "SAU:s generalsekreterare: Man blir rörd över människors engagemang.", "link": "https://www.dagen.se/nyheter/naestan-4-000-deltagare-pa-stort-uv-scoutlaeger-mitt-i-hoegsommarvaermen/10417920", "date_display": "2026-06-28", "date_iso": "2026-06-28T08:06:29+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Severely visually impaired Anna does not receive a companion: \"Becomes isolated\"", "summary": "Until three years ago, Värnamo resident Anna Söderström was able to work and get by on her own. Since then, the visual impairment has worsened and she has difficulty going out without help. When she applied for an escort, she was refused. - I have worked in healthcare for 30 years and have given of myself to many others. Then when you yourself need help, you don't get the help you want. I think it's unfair, says Anna. The municipality referred to online purchases. She applied for four hours of accompaniment a month as well as a purchase in a store with the support of staff. The board rejected the application and justified, among other things, that she can shop online and that she receives home care three times a week. Now she needs to ask her 17-year-old daughter and the rest of her family for help to be able to go out. - Before, I could go out and walk for an hour and a half and be on my own in business without having to call and ask for help. You don't want alms. - You sort of want to feel that I can do this on my own, says Anna Söderström. Big differences in the country The National Association of the Visually Impaired believes that there is a lack of equivalence and that fees and conditions vary greatly across the country. - There should be greater equality throughout the country and you should be able to know what you are entitled to as a visually impaired person. It varies from zero kroner per hour to the worst up to 500 kroner per hour to go and buy a liter of milk. Or to be able to take a walk and get outside their walls, says Niklas Mattsson, chairman of the National Association of the Visually Impaired. The National Board of Health and Welfare proposed three years ago that the government should draw up a special law on accompaniment, but no investigation has been appointed. - You have had three years and nothing has happened. We think it is really bad for the government not to have been able to appoint this investigation, says Niklas Mattsson.  The government points to assessment support According to the Minister of Social Services, the National Board of Health and Welfare has instead been tasked with developing an assessment support for the municipalities. - The government", "title_original": "Gravt synskadade Anna får ingen ledsagare: ”Blir isolerad”", "summary_original": "Fram till för tre år sedan kunde Värnamobon Anna Söderström arbeta och ta sig fram på egen hand. Sedan dess har synskadan förvärrats och hon har svårt att gå ut utan hjälp. När hon ansökte om ledsagning fick hon avslag. – Jag har jobbat inom vården i 30 år och gett av mig själv till många andra. Sen när man väl själv behöver hjälp så får man inte den hjälpen man önskar. Jag tycker att det är orättvist, säger Anna. Kommunen hänvisade till nätinköp Hon ansökte om fyra timmars ledsagning i månaden samt ett inköp i butik med stöd av personal. Nämnden avslog ansökan och motiverade bland annat med att hon kan handla på nätet och att hon får hemtjänst tre gånger i veckan. Nu behöver hon be sin 17-åriga dotter och övrig familj om hjälp för att kunna gå ut. – Innan kunde jag ut och gå en och en halv timme och vara på egen hand i affärer utan att behöva ringa och be om hjälp. Man vill ju inte ha allmosor. - Man vill ju liksom känna att jag kan göra detta på egen hand, säger Anna Söderström. Stora skillnader i landet Synskadades Riksförbund menar att det saknas likvärdighet och att avgifter och villkor varierar kraftigt över landet. – Det borde ju finnas en större likvärdighet i hela landet och man borde kunna veta vad man har rätt till som synskadad. Det skiljer sig från noll kronor per timme till det värsta upp mot 500 kronor per timme för att gå och handla en liter mjölk. Eller för att få ta en promenad och komma utanför sina väggar, säger Niklas Mattsson, ordförande i Synskadades Riksförbund. Socialstyrelsen föreslog för tre år sedan att regeringen skulle ta fram en särskild lag om ledsagning, men någon utredning har inte tillsatts. – Man har haft tre år på sig och ingenting har hänt. Vi tycker att det är riktigt dåligt av regeringen att inte ha kunnat tillsätta den här utredningen, säger Niklas Mattsson.  Regeringen pekar på bedömningsstöd Enligt socialtjänstministern har Socialstyrelsen i stället fått i uppdrag att ta fram ett bedömningsstöd till kommunerna. – Regeringen bedömer att det här kommer att gå betydligt snabbare än att tillsätta en utredning och att sedan starta en lagstiftningsprocess. Men om kommunerna inte gör det som idag är ett kommunalt ansvar, så utesluter vi inte ytterligare åtgärder, säger Camilla Waltersson Grönwall (M), socialtjänstminister. Hoppas på förändring – Jag hoppas ju på att det ska bli en lagändring och att det ska bli lättare att få ledsagning. Jag tror alla människor vill vara självständiga, säger Anna Söderström.", "link": "https://www.tv4.se/artikel/2xQQbWNCaqnyOD9kvsWNl9/gravt-synskadade-anna-far-ingen-ledsagare-ledsen-och-besviken", "date_display": "2026-06-28", "date_iso": "2026-06-28T06:32:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/synskadades-riksforbund", "/sjukdomar", "/sjukdomsfall", "/livsoden", "/vard-och-omsorg"]}, {"id": 150, "title": "Top Russian politician: \"We can blow up half of Finland\"", "summary": "In a statement in the Russian media, top politician Aleksey Zhuravlyov threatens to \"blow up half of Finland\", reports the Kyiv Independent.\n\n- They continue to escalate and try in every possible way to provoke Russia. Of course, we will not give in to provocations, but we will strengthen our defense on this very important part of the border, he told the Russian news agency Gazeta.Ru and continued. - Even now, I assure you that we have enough military equipment concentrated there to blow up half of Finland.  A second Ukraine The threat comes as Finland announced plans to collaborate with the American defense company Lockheed Martin to build Europe's first maintenance center for an advanced missile system in Tammefors. Zhuravlyov also accused Finland of \"gradually turning into a second Ukraine\" after the decision to join NATO in 2023. Aleksey Zhuravlyov is the first deputy chairman of the Russian State Duma's defense committee.", "title_original": "Ryska toppolitikern: ”Vi kan spränga halva Finland”", "summary_original": "I ett uttalande i ryska medier hotar toppolitikern Aleksej Zjuravljov med att ”spränga halva Finland”, rapporterar Kyiv Independent.\n\n– De fortsätter att eskalera och försöker på alla möjliga sätt att reta upp Ryssland. Vi kommer naturligtvis inte att ge efter för provokationer, men vi kommer att stärka vårt försvar på denna mycket viktiga del av gränsen, säger han till ryska nyhetsbyrån Gazeta.Ru och fortsätter. – Även nu försäkrar jag er att vi har tillräckligt med militär utrustning koncentrerad där för att spränga halva Finland.  Ett andra Ukraina  Hotet kommer i samband med att Finland tillkännagett planer på att samarbeta med det amerikanska försvarsföretaget Lockheed Martin för att bygga Europas första underhållscenter för ett avancerat raketsystem i Tammefors. Zjuravlyov anklagade också Finland för att ”gradvis förvandlas till ett andra Ukraina” efter beslutet att gå med i Nato 2023. Aleksej Zhuravljov är förste vice ordförande i den ryska statsdumans försvarskommitté.", "link": "https://www.tv4.se/artikel/4KBfakBtXGpxO5fQaQK4j6/ryska-toppolitikern-spraenga-halva-finland", "date_display": "2026-06-28", "date_iso": "2026-06-28T06:21:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ryssland", "/natodebatten/finland", "/ukrainakonflikten", "/ukraina"]}, {"id": 151, "title": "The unlikely assassination command", "summary": "Part 2 of 4", "title_original": "Det osannolika mordkommandot", "summary_original": "Del 2 av 4", "link": "https://www.svd.se/a/Okjadk/osannolika-mordkommandot-satts-ihop-drar-fram-i-stockholm", "date_display": "2026-06-28", "date_iso": "2026-06-28T04:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sverige"]}, {"id": 152, "title": "She earns the most of all the heads of authorities", "summary": "At the beginning of the month, the government decided on new salaries for around 220 heads of authorities and senior civil servants in the state administration. The average wage increase will be 3.4 percent, according to the trade union newspaper Publikt. After the salary increase, national police chief Petra Lundh is at the top among the heads of authorities with a monthly salary of SEK 200,700, followed by Nils Öberg, director general of the Swedish Social Insurance Agency, who receives a new salary of SEK 196,000. Third is the Armed Forces Commander-in-Chief Michael Claesson with SEK 189,700 a month. The one who gets the biggest salary increase is the Fortificationsverket's director general Maria Bredberg Pettersson. After an increase of 5.66 percent, she earns SEK 139,900 a month.\n\nAt the bottom of the list is Robert Dalman at the Student Support Appeals Board, who \"only\" collects SEK 93,500.", "title_original": "Hen tjänar mest av alla myndighetschefer", "summary_original": "Regeringen beslutade i början av månaden om nya löner för omkring 220 myndighetschefer och högre tjänstemän i statsförvaltningen. Den genomsnittliga löneökningen blir 3,4 procent, uppger den fackliga tidningen Publikt. Efter löneförhöjningen ligger rikspolischef Petra Lundh i topp bland myndighetscheferna med en månadslön på 200 700 kronor, följt av Nils Öberg, generaldirektör på Försäkringskassan, som får en ny lön på 196 000 kronor. Trea är Försvarsmaktens överbefälhavare Michael Claesson med 189 700 kronor i månaden. Den som får den största löneökningen är Fortifikationsverkets generaldirektör Maria Bredberg Pettersson. Efter en höjning på 5,66 procent tjänar hon 139 900 kronor i månaden.\n\nLängst ner på listan återfinns Robert Dalman på Överklagandenämnden för studiestöd, som ”endast” drar in 93 500 kronor.", "link": "https://www.tv4.se/artikel/1bFxLbfBi92dr6OaaZenRN/hon-tjaenar-mest-av-alla-myndighetschefer", "date_display": "2026-06-28", "date_iso": "2026-06-28T04:20:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/myndigheter", "/sakerhetspolisen"]}, {"id": 153, "title": "He will be the new rector at Johannelund's Theological College", "summary": "Micael Isacson: Great that more people want to study theology", "title_original": "Han blir ny rektor på Johannelunds teologiska högskola", "summary_original": "Micael Isacson: Jätteroligt att fler människor vill läsa teologi", "link": "https://www.dagen.se/nyheter/han-blir-ny-rektor-pa-johannelunds-teologiska-hoegskola/10402785", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "I didn't know Frank Mangs was so good", "summary": "Malina Abrahamsson suggests three classics you can read this summer", "title_original": "Inte visste jag att Frank Mangs var så bra", "summary_original": "Malina Abrahamsson tipsar om tre klassiker du kan läsa i sommar", "link": "https://www.dagen.se/kultur/inte-visste-jag-att-frank-mangs-var-sa-bra/10402151", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Gamer with a passion for the Bible word", "summary": "Mikael Hallenius is getting used to his new life after 30 years as a pastor", "title_original": "Gamer med passion för bibelordet", "summary_original": "Mikael Hallenius vänjer sig vid nya livet efter 30 år i pastorstjänst", "link": "https://www.dagen.se/familj/gamer-med-passion-foer-bibelordet/10403078", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Parents collected SEK 600,000 for a Christian school threatened with closure", "summary": "Parents' initiative to save Mariaskolan in Umeå.", "title_original": "Föräldrar samlade in 600 000 kr till nedläggningshotad kristen skola", "summary_original": "Föräldrainitiativ för att rädda Mariaskolan i Umeå.", "link": "https://www.dagen.se/nyheter/foeraeldrar-samlade-in-600-000-kr-till-nedlaeggningshotad-kristen-skola/10417803", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Right to Belief: Taliban Talks May Lead to Deportation of Converts", "summary": "Micael Grenholm sees a \"betrayal\" from the Christian Democrats.", "title_original": "Rätt till tro: Talibansamtal kan leda till att konvertiter utvisas", "summary_original": "Micael Grenholm ser ett ”svek” från Kristdemokraterna.", "link": "https://www.dagen.se/nyheter/raett-till-tro-talibansamtal-kan-leda-till-att-konvertiter-utvisas/10416773", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Terrian and Ashley Cleveland make their Swedish debut at the Gullbranna Festival", "summary": "American artists who influence millions of people with their music", "title_original": "Terrian och Ashley Cleveland gör Sverigedebut på Gullbrannafestivalen", "summary_original": "Amerikanska artister som påverkar miljontals människor med sin musik", "link": "https://www.dagen.se/kultur/terrian-och-ashley-cleveland-goer-sverigedebut-pa-gullbrannafestivalen/10408808", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "\"I developed obsessive thoughts about God\"", "summary": "Maria Blank about growing up in the Free Church and wrestling with the priestly vocation.", "title_original": "”Jag utvecklade tvångstankar kring Gud”", "summary_original": "Maria Blank om uppväxten i frikyrkan och brottningen med prästkallelsen.", "link": "https://www.dagen.se/livsstil/jag-utvecklade-tvangstankar-kring-gud/10398132", "date_display": "2026-06-28", "date_iso": "2026-06-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "\"We need to get in touch with your husband - he has 24 hours\"", "summary": "It was in October of last year that the 26-year-old, who used the aliases ZeroTrace, JohnnyWalker and Phantom online, using stolen or purchased login details, was able to get into Svea Bank's IT system via a customer account belonging to Verisure. In this way, he gained access to information belonging to 34,000 of the alarm company's customers, which were stored at the bank. The information consisted of, among other things, personal data, addresses, contact details and payment history. Via a customer account, he was also able to get into Verisure's IT system. With the information in his possession, the man then tried to get in touch with the company's CEOs to pressure them for money. First by contacting customer service, and later blackmail emails directly to the managers. The email contained attachments with customer accounts and the managers were asked to add him on Telegram to facilitate communication. Demanded 10,000 dollars in bitcoin Even before that, the man had sent a text message to a close relative of one of the CEOs: \"Hey, we need to get in touch with your husband, CEO of verisure, we got into their system, and made a DATA dump, of over 600GB worth of data, customer info, invoices, systems, etc. He and the other CEOs have 24 hours to get in touch with us, in order to agree on an amount. If no contact comes, then we start LEAK the data on the forum, and sell\nthe customer data ... Here is an example, we have data on over 30 thousand customers. send your husband's email and we'll get in touch from there. ZeroTrace.” The day after, he followed up with a series of new text messages and wrote, among other things: \"Sad if so much DATA from Verisure would come out a week after you have gone public\", referring to the company's recent IPO. The police took over the contact with the man and pretended to be the managers and that a suitable ransom was discussed so that the information would not be leaked. By then, the 26-year-old had already demanded $10,000 in bitcoin from Verisure. Boast on Flashback TV4 News has previously only", "title_original": "”Vi behöver komma i kontakt med din man – han har 24 h”", "summary_original": "Det var i oktober förra året som 26-åringen, som online bland annat använt sig av aliasen ZeroTrace, JohnnyWalker och Phantom, med hjälp av stulna eller köpta inloggningsuppgifter kunde ta sig in i Svea Banks IT-system via ett kundkonto tillhörandes Verisure. Han fick på så vis åtkomst till uppgifter tillhörandes 34 000 av larmföretagets kunder, som fanns lagrade hos banken. Informationen bestod bland annat av personuppgifter, adresser, kontaktuppgifter och betalningshistorik. Via ett kundkonto kunde han också ta sig in i Verisures IT-system. Med uppgifterna i sin besittning försökte mannen därefter komma i kontakt med företagets vd:ar för att pressa dem på pengar. Först genom att kontakta kundservice, och senare utpressningsmejl direkt till cheferna. Mejlet innehöll bifogade filer med kundkonton och cheferna ombads lägga till honom på Telegram för att lättare kunna kommunicera. Krävde 10 000 dollar i bitcoin Redan dessförinnan hade mannen skickat ett sms till en nära anhörig till en av vd:arna: ”Hej, vi behöver komma i kontakt med din man, VD i verisure, vi har tagit oss in i deras system, och gjort en DATAdump, på över 600GB värt av data, kund info, invoices, system m.m. 24 timmar har han och dom andra VD’s på sig att ta kontakt med oss, för att komma överens om summa. Om ingen kontakt kommer, så börja vi LEAKA datan på forum, samt sälja\nkunddatan … Här är ett exempel, vi har data på över 30 tusen kunder. skicka din mans email så tar vi kontakt där ifrån. ZeroTrace.” Dagen därefter följde han upp med en rad nya sms och skrev bland annat: ”Tråkigt om så mycket DATA av Verisure skulle komma ut en vecka efter att ni har gått public”, syftandes på att företaget nyligen börsnoterats. Polisen tog över kontakten med mannen och utgav sig för att vara cheferna och att man diskuterade en lämplig lösensumma för att uppgifterna inte skulle läckas. Vid det laget hade 26-åringen redan krävt 10 000 dollar i bitcoin från Verisure. Skröt på Flashback TV4 Nyheterna har tidigare kunnat berätta att den nu dömda 26-åringen i samband med hackerattacken i oktober skröt om intrånget på Flashback. I en tråd på forumet laddade en användare upp ett utdrag av den läckta kunddatan och skrev under inlägget med aliaset ZeroTrace. Användaren påstod också att det fortfarande fanns en aktiv RAT, en sorts trojansk programvara, i IT-systemet. ”De ljuger som bara den, vi har en RAT i deras system som fortfarande är aktiv, det är det som är det roliga”, skrev användaren. Ansökte om lån i andra personers namn Polisen kunde den 20 oktober göra ett tillslag mot mannen i hans hem, varpå han frihetsberövades. Utöver dataintrånget mot Svea Bank och Verisure har rätten funnit mannen skyldig för intrång hos finansbolaget Sun Finance Group. Där ändrade han utbetalningskontot för 189 kunder till sitt eget och gjorde omkring 350 låneansökningar i andra personers namn till ett sammanlagt belopp av drygt 1,6 miljoner. Bara åtta av ansökningarna godkändes och betaldes ut, till en total summa av 26 000 kronor. Utredningen visar också att han hackat och i vissa fall försökt utpressa flera andra företag, däribland Bredband2, ImagineIT, Bokio, Billogram, Verticelo och Billmate. Därutöver ska två idrottsföreningar ha utsatts. 26-åringen själv nekar till brott och menar att han själv varit utsatt för en så kallad RAT (Remote Access Trojan) som tagit över och styrt hans dator, och som begått brotten i hans namn.  Utredningen har dock kunnat visa att mannens dator och telefon inte fjärrstyrts av någon utomstående. Döms till miljonskadestånd I chattar online med andra hackare har mannen uppgett att han är pank. Utredningen har också kunnat visa att han har en skatteskuld på 1,25 miljoner. Göteborgs tingsrätt har nu dömt mannen på totalt 17 punkter till fängelse i fem år och sex månader. Det gäller ett fall av grovt bedrägeri, nio fall av grovt dataintrång, två fall av försök till grov utpressning, ett fall av försök till grovt bedrägeri samt tre fall av försök till utpressning. Mannen döms även att betala ett skadestånd på 1,57 miljoner till Verisure. ”Brottet ska bedömas som grovt eftersom gärningen orsakade allvarlig skada i form av ekonomisk skada och ett rubbat förtroende hos allmänheten för Verisure”, skriver Tingsrätten i sin bedömning. Brotten begicks mellan augusti och oktober förra året.", "link": "https://www.tv4.se/artikel/47bEiqOQQVpHbnRuS7DiMH/vi-behoever-komma-i-kontakt-med-din-man-han-har-24-timmar", "date_display": "2026-06-27", "date_iso": "2026-06-27T19:49:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/dataintrang", "/hackera I was the editor-in-chief. The other editors-in-chief were also running marathons and triathlons. When others do something, you pick up without thinking. People sat there and compared themselves, but it has passed for me. The trend has become even stronger after me, so now I'm lagging behind, says Cavling.  He believes that the social pressure and the desire to show off achievements on social media is a strong driving force. At the same time, he emphasizes that there are advantages to combining activity and rest. \"Of course it's an age crisis\" Cavling states that the darecation trend is not only connected to being healthy but also some form of age fun. - It is clear that it is an age crisis. It is connected with the long lifetime trend that many people believe they can outwit death. But running triathlons is very dangerous. I have also run a marathon and it has been pure hell, he says.", "title_original": "\"Darecation\" nya semestertrenden: ”Tror de kan överlista döden”", "summary_original": "Darecation, eller vågad semester, har snabbt blivit populärt. I stället för att vila på stranden väljer många att bestiga berg, vandra genom öknar eller ta sig ner i vulkaner. Målet är inte längre bara återhämtning – utan att testa sina gränser. Enligt Dagens PS har UTMB World Series, en av världens ledande arrangörer av terränglöpning och bergslopp, sett en ökning av antal deltagare från 50 000 till 170 000 på bara några år. Majoriteten av de anmälda är inte elitidrottare. ”Hade själv en sådan period” Viggo Cavling är redaktör på Dagens PS och har själv erfarenhet av att kombinera semester med träning. Han ser en tydlig trend bland framför allt män.  – Jag hade själv en sådan period för 15 år sedan där jag sprang som en galning. På den tiden var jag chefredaktör. De andra chefredaktörerna höll också på att springa maraton och triathlon. När andra gör någonting hakar man på utan att tänka efter. Man satt där och jämförde sig men det har gått över för mig. Trenden har blivit ännu starkare efter mig så nu är jag på efterkälken, säger Cavling.  Han menar att det sociala trycket och viljan att visa upp prestationer på sociala medier är en stark drivkraft. Samtidigt betonar han att det finns fördelar med att kombinera aktivitet och vila. ”Klart det är en ålderskris” Cavling konstaterar att darecation-trenden inte bara hänger ihop med att vara hälsosam utan också någon form av åldersnoja. – Det är klart att det är en ålderskris. Det hänger ihop med long livety-trenden att många tror att de kan överlista döden. Men det är väldigt farligt att springa triathlon. Jag har även sprungit ett maraton och det har varit rent helvete, säger han.", "link": "https://www.tv4.se/artikel/6m0KnceCgHgCq9QKgBXf59/semesteraktiviteten-har-blivit-viral-alderkris-eller-trend", "date_display": "2026-06-26", "date_iso": "2026-06-26T17:42:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Efter fem", "/efter-fem", "/semester", "/traning"]}, {"id": 173, "title": "Joint Statement from the International Contact Group for the Great Lakes (ICG)", "summary": "Belgium, Denmark, Canada, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement:", "title_original": "Joint Statement from the International Contact Group for the Great Lakes (ICG)", "summary_original": "Belgium, Denmark, Canada, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement:", "link": "https://www.government.se/statements/2026/06/joint-statement-from-the-international-contact-group-for-the-great-lakes-icg/", "date_display": "2026-06-26", "date_iso": "2026-06-2 arine cooperation.", "title_original": "Ulf Kristersson to hold joint press conference with Prime Minister of Poland on bilateral submarine cooperation", "summary_original": "On Monday 29 June, Prime Minister Ulf Kristersson will travel with several ministers to Gdynia, Poland for intergovernmental consultations. The focus will be on strengthened bilateral cooperation between Sweden and Poland, specifically with regard to regional security and defence. Mr Kristersson and Prime Minister of Poland Donald Tusk will hold a joint press conference during which they will announce a new development in the countries’ bilateral submarine cooperation.", "link": "https://www.government.se/press-releases/2026/06/ulf-kristersson-to-hold-joint-press-conference-with-prime-minister-of-poland-on-bilateral-submarine-cooperation/", "date_display": "2026-06-25", "date_iso": "2026-06-25T09:38:41+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "EU", "International", "Prime Minister's Office", "Ministry of Culture", "Ministry of Defence", "Ministry for Foreign Affairs", "Foreign and security policy", "Ministry of Rural Affairs and Infrastructure", "Andreas Carlson", "Maria Malmer Stenergard", "Parisa Liljestrand", "Pål Jonson", "Ulf Kristersson", "Military defence", "Jessica Rosencrantz"]}, {"id": 186, "title": "A cloud policy for Sweden – for increased security, efficiency and innovation in public administration", "summary": "The purpose of this policy for the use of cloud services is to contribute to increased security, efficiency and innovation in public administration.", "title_original": "A cloud policy for Sweden – for increased security, efficiency and innovation in public administration", "summary_original": "The purpose of this policy for the use of cloud services is to contribute to increased security, efficiency and innovation in public administration.", "link": "https:// untary Efforts in Support of Ukraine", "summary_original": "Yesterday, Minister for International Development Cooperation and Foreign Trade Benjamin Dousa has presented the Government’s annual award for Swedish volunteer projects in support of Ukraine. The 2026 recipients are Elly Reinolds and OperationChange.", "link": "https://www.government.se/press-releases/2026/06/recipients-of-2026-government-award-for-voluntary-efforts-in-support-of-ukraine/", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:19:25+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Benjamin Dousa"]}, {"id": 191, "title": "Sweden joins special tribunal and international claims commission for Ukraine", "summary": "The Government has decided that Sweden will join the Special Tribunal for the Crime of Aggression against Ukraine and the International Claims Commission for Ukraine. Demanding accountability for Russia’s crimes against Ukraine is an important priority for the Swedish Government. The aim is to ensure redress and justice for Ukraine and its people.", "title_original": "Sweden joins special tribunal and international claims commission for Ukraine", "summary_original": "The Government has decided that Sweden will join the Special Tribunal for the Crime of Aggression against Ukraine and the International Claims Commission for Ukraine. Demanding accountability for Russia’s crimes against Ukraine is an important priority for the Swedish Government. The aim is to ensure redress and justice for Ukraine and its people.", "link": "https://www.government.se/press-releases/2026/06/sweden-joins-special-tribunal-and-international-claims-commission-for-ukraine/", "date_display": "2026-06-22", "date_iso": "2026-06-22T11:22:18+00:00", "source": "Government.se", "min ervices", "summary_original": "The report \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "link": "https://www.government.se/reports/2026/06/a-swedish-strategy-for-biodiversity-and-ecosystem-services/", "date_display": "2026-06-18", "date_iso": "2026-06-18T11:07:11+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "11 days old", "tags": ["Report", "International", "Ministry of Climate and Enterprise", "Environment and climate", "Sweden in the UN"]}, {"id": 194, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "Inflation in Sweden is low and the economic situation is somewhat weaker than normal. At the same time, the supply disruptions linked to the war in the Middle East have led to increased inflationary pressure and the risks of inflation becoming too high have increased. The management assesses that it is well balanced to now leave the key interest rate unchanged at 1.75 percent, but the probability that the interest rate will be raised later this year has increased compared to the assessment in March.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Inflationen i Sverige är låg och konjunkturläget är något svagare än normalt. Samtidigt har utbudsstörningarna kopplade till kriget i Mellanöstern lett till att inflationstrycket stigit och riskerna för att inflationen ska bli för hög har ökat. Direktionen bedömer att det är välavvägt att nu lämna styrräntan oförändrad på 1,75 procent, men sannolikheten för att räntan höjs senare i år har ökat jämfört med bedömningen i mars.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-proc eden and the US gathered in Stockholm for the US–Sweden Cancer Summit 2026: Metastasis – from mechanism to cure.", "link": "https://www.government.se/articles/2026/06/ussweden-cancer-summit-focuses-on-closer-cooperation/", "date_display": "2026-06-16", "date_iso": "2026-06-16T14:35:27+00:00", "source": "Government.se", "ministry": "Ministry of Health and Social Affairs", "type": "Official Information", "age_tag": "12 days old", "tags": ["International", "Ministry of Health and Social Affairs", "Medical care", "Article", "Government’s priorities", "Elisabet Lann"]}, {"id": 197, "title": "Inauguration of Ukraine’s Unity Hub in Sweden", "summary": "On 15 June, a hub for Ukrainians in Sweden is being inaugurated. The Hub is a new meeting place that will provide support, guidance and information to Ukrainians in Sweden. Minister for Migration Johan Forssell will attend the inauguration together with Deputy Minister of Social Policy, Family and Unity of Ukraine for European Integration Ilona Havronska and representatives of the International Centre for Migration Policy Development (ICMPD), Swedish government agencies, civil society and the Ukrainian diaspora.", "title_original": "Inauguration of Ukraine’s Unity Hub in Sweden", "summary_original": "On 15 June, a hub for Ukrainians in Sweden is being inaugurated. The Hub is a new meeting place that will provide support, guidance and information to Ukrainians in Sweden. Minister for Migration Johan Forssell will attend the inauguration together with Deputy Minister of Social Policy, Family and Unity of Ukraine for European Integration Ilona Havronska and representatives of the International Centre for Migration Policy Development (ICMPD), Swedish government agencies, civil society and the Ukrainian diaspora.", "link": "https://www.government.se/press-releases/2026/06/inauguration-of-ukraines-unity-hub-in-sweden/", "date_display": "2026-06-15", "date_iso": "2026-06-15T15:17:44+00:00", "source": "Government.se", "ministry": "M O’s role is of vital importance and central to how the ongoing Ebola outbreak in the Democratic Republic of the Congo (DRC) is handled.", "title_original": "Sweden provides SEK 120 million to WHO with focus on Ebola outbreak in Democratic Republic of the Congo", "summary_original": "Sweden is providing SEK 120 million to support the World Health Organization’s work to achieve better global health, which is of great importance to global health security and people in crisis-affected areas. The WHO’s role is of vital importance and central to how the ongoing Ebola outbreak in the Democratic Republic of the Congo (DRC) is handled.", "link": "https://www.government.se/press-releases/2026/06/sweden-provides-sek-120-million-to-who-with-focus-on-ebola-outbreak-in-democratic-republic-of-the-congo/", "date_display": "2026-06-15", "date_iso": "2026-06-15T14:19:33+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Jakob Forssmed", "Benjamin Dousa"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
