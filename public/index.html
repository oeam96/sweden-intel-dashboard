etsmorgon and has become a favorite among both viewers and the editors, but yesterday the news came that she had left this earthly life. - It is incomparable how these four-legged things enter our hearts. This is terrible. I sit and cry on TV here, says Fredrik Steen. The illnesses became too severe Little Nymo suffered from back problems early on, which led to oblique strain that affected both her front and back.  - I have never had a dog that has been given so much resources, rehab and all that, says Fredrik Steen. In December, Lilla Nymo had surgery to remove her uterus, and Fredrik then told us that she hovered between life and death. In the end, no more operations could be performed and Little Nymo had to be put to sleep. - We have medicated and got it working again, but the ailments came more and more often and we somehow didn't have time to fix it. \"She was very special\" Fredrik Steen emphasizes that it is natural to feel great sadness when an animal passes away.  - That's the worst thing about being a dog owner. It may be a comfort to others. The dog expert who has been through this a hundred times....yes, it is heavy and it has to be. The sadness is great, but he also wants to highlight all the wonderful things he got to experience together with Lilla Nymo. \n\n- She was very special. She was reckless and extremely mischievous, but she and I have always bonded, she was my soulmate, the love of my life.  Many viewers have taken to social media to show their support and have shared their own experiences of losing pets. Little Nymo turned 11 years old.", "title_original": "Tårarna efter Lilla Nymos bortgång: ”Var mitt livs kärlek”", "summary_original": "Det var 2015 som hundcoachen Fredrik Steen fick hem sin Lilla Nymo. De senaste elva åren har hon varit en älskad del av Nyhetsmorgon och blivit en favorit bland både tittare och redaktionen, men igår kom beskedet att hon lämnat jordelivet. – Det är makalöst hur de här fyrbenta sakerna går in i våra hjärtan. Det här är ju hemskt. Jag sitter och gråter i tv här, säger Fredrik Steen. Sjukdomarna blev för svåra Lilla Nymo drabbades tidigt av ryggproblem, vilket ledde till snedbelastning som påverkade både hennes fram- och bakdel.  – Jag har aldrig haft en hund som det har lagts så mycket resurser på, rehab och allt vad det är, säger Fredrik Steen. I december opererade Lilla Nymo bort sin livmoder och Fredrik berättade då att hon svävat mellan liv och död. Till slut gick det inte göra fler operationer och Lilla Nymo fick somna in. – Vi har medicinerat och fått det att funka igen, men krämporna kom tätare och tätare och vi hann liksom inte med att laga. ”Hon var väldigt speciell” Fredrik Steen betonar att det är naturligt att känna stor sorg när ett djur går bort.  – Det är det värsta med att vara hundägare. Det kan väl vara en tröst för andra. Hundexperten som varit med om det här hundra gånger....ja, det är tungt och det får vara det. Sorgen är stor, men han vill också lyfta fram allt det fina han fått uppleva tillsammans med Lilla Nymo. \n\n– Hon var väldigt speciell. Hon var hänsynslös och extremt busig, men hon och jag har alltid bondat, hon var min själsfrände, mitt livs kärlek.  Många tittare har hört av sig på sociala medier för att visa sitt stöd och har delat egna erfarenheter av att förlora husdjur. Lilla Nymo blev 11 år gammal.", "link": "https://www.tv4.se/artikel/48b4zIOVc8slhlYTy3jo16/tararna-efter-lilla-nymos-bortgang-var-mitt-livs-kaerlek", "date_display": "2026-04-18", "date_iso": "2026-04-18T07:01:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/hundar", "/hundcoachen"]}, {"id": 150, "title": "Suspected theft of millions from the Church of Sweden in New York", "summary": "The suspect is a licensed securities broker and has acted as a financial advisor to the church • Denies the allegations himself.", "title_original": "Misstänkt miljonstöld från Svenska kyrkan i New York", "summary_original": "Den misstänkte är licensierad värdepappersmäklare och har agerat finansiell rådgivare åt kyrkan • Nekar själv till anklagelserna.", "link": "https://www.dagen.se/nyheter/misstaenkt-miljonstoeld-fran-svenska-kyrkan-i-new-york/10304105", "date_display": "2026-04-18", "date_iso": "2026-04-18T05:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "Criticism of V proposal: More money for own peaks", "summary": "Can keep several thousand more kroner a month • The question of the party tax must be decided", "title_original": "Kritik mot V-förslag: Mer pengar till egna toppar", "summary_original": "Kan få behålla flera tusen kronor mer i månaden • Frågan om partiskatten ska avgöras", "link": "https://www.tv4.se/artikel/krg1r3SpzFfVtZ2ioleez/kritik-mot-v-foerslag-mer-pengar-till-egna-toppar", "date_display": "2026-04-18", "date_iso": "2026-04-18T04:22:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 152, "title": "The V leader: \"Fat cats have been allowed to rob households\"", "summary": "Dadgostar in speech: Without a place in the government for V, there will be no new direction for Sweden", "title_original": "V-ledaren: ”Feta katter har fått råna hushållen”", "summary_original": "Dadgostar i tal: Utan en plats i regering för V blir det ingen ny riktning för Sverig", "link": "https://www.tv4.se/artikel/tt-260417-vkongress1-652ee0e6/v-ledaren-feta-katter-har-fatt-rana-hushallen", "date_display": "2026-04-18", "date_iso": "2026-04-18T04:20:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Vänsterpartiet", "/valet-2022/vansterpartiet"]}, {"id": 153, "title": "The Swedish Mission Council is to train pastors in Africa in religious freedom", "summary": "The Swedish Mission Council: \"Christian leaders, churches and organizations do not always recognize themselves in rights-based language.\"", "title_original": "Svenska missionsrådet ska utbilda pastorer i Afrika i religionsfrihet", "summary_original": "Svenska missionsrådet: ”Inte alltid kristna ledare, kyrkor och organisationer känner igen sig i ett rättighetsbaserat språk.”", "link": "https://www.dagen.se/nyheter/svenska-missionsradet-ska-utbilda-pastorer-i-afrika-i-religionsfrihet/10284185", "date_display": "2026-04-18", "date_iso": "2026-04-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "\"There is an inherent conflict between being a priest and a celebrity\"", "summary": "Pastor Camilla Lif about the anxiety disorder, the vocation and the fear of becoming a celebrity priest", "title_original": "”Det finns en inneboende krock mellan att vara präst och kändis”", "summary_original": "Kyrkoherden Camilla Lif om ångestsjukdomen, kallelsen och rädslan för att bli en kändispräst", "link": "https://www.dagen.se/livsstil/det-finns-en-inneboende-krock-mellan-att-vara-praest-och-kaendis/10296031", "date_display": "2026-04-18", "date_iso": "2026-04-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "The Pope or Trump? That's what Ebba Busch chooses in the ongoing spat", "summary": "The KD leader is strongly committed to the Iran issue.", "title_original": "Påven eller Trump? Så väljer Ebba Busch i det pågående ordbråket", "summary_original": "KD-ledaren är starkt engagerad i Iranfrågan.", "link": "https://www.dagen.se/nyheter/paven-eller-trump-sa-vaeljer-ebba-busch-i-det-pagaende-ordbraket/10303297", "date_display": "2026-04-18", "date_iso": "2026-04-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Anton Ahlmark:\nNo one will snatch you out of God's hand", "summary": "I've never been a sheep herder, but the closest I've come to herding sheep is when I was a primary substitute at Fiskebäcksskolan", "title_original": "Anton Ahlmark:\nIngen kommer att rycka dig ur Guds hand", "summary_original": "Jag har inte varit fåraherde någon gång, men det närmaste jag har kommit till att valla får är när jag var lågstadievikarie på Fiskebäcksskolan", "link": "https://www.dagen.se/livsstil/anton-ahlmark-ingen-kommer-att-rycka-dig-ur-guds-hand/10296822", "date_display": "2026-04-18", "date_iso": "2026-04-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Trump and the Pope in continued war of words", "summary": "Meanwhile, Secretary of War Pete Hegseth's prayer has become a talking point.", "title_original": "Trump och påven i fortsatt ordkrig", "summary_original": "Samtidigt har krigsministern Pete Hegseths bön blivit en snackis.", "link": "https://www.dagen.se/nyheter/trump-och-paven-i-fortsatt-ordkrig/10303090", "date_display": "2026-04-18", "date_iso": "2026-04-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The haystack: \"A dream that comes true\"", "summary": "Höstacken received the least number of votes in the fourth episode of \"Masked Singer Sweden\" and was forced to shake off the straws. Tina \"Mat-Tina\" Nordström was hiding under the mask - something Pernilla Wahlgren managed to spot just like the week before. - What is happening, Sweden? But you were wonderful, we wanted to see more of you, says the panellist. The food decided According to Pernilla Wahlgren, Friday's episode was full of food references. There was talk of \"knife situations\", a ring number that was \"served\" and of someone who was used to both \"backlash\" and \"heat\". One of the clues was also about a queen-like progress on television, something Tina Nordström undeniably stood for in the early 2000s. Pernilla Wahlgren's colleagues Behrouz \"Berra\" Badreh and Carina Berg instead guessed at someone connected to Carina Berg in particular, since several other clues were about her. But it was neither Carolina Gynning - Carina Berg's best friend - nor Kristina \"Keyyo\" Petrushina - co-host - but something planted by the production to mislead both the viewers and the panel in their guesses. - Partly it is Vemdalen, we have that together, says Tina Nordström in the program to Carina Berg. - Then it was probably that you made programs like \"Berg move in\" and that I paid a visit. The connection to Susanne Lanefelt, who appeared in the program, was about the fact that they both participated in the same season of \"Let's dance\". \"A dream come true\" Tina Nordström has, just like many previous participants stated, watched the program together with her children - and loves it. - I have seen all the programs with the children. I can't believe I get to do this, she says. The fact that she was dressed as a haystack was because the TV chef owns a barn. When she needed to go away to practice singing and dancing, while the family was at home, she did it in the stable. In the feature that takes viewers behind the scenes, she tells us that it was sweaty with the pyro and the magnificent decor and that the first to step out on stage was \"", "title_original": "Höstacken: ”En dröm som blir sann”", "summary_original": "Höstacken fick minst antal röster i det fjärde avsnittet av ”Masked Singer Sverige” och tvingades skaka av sig stråna. Under masken dolde sig Tina ”Mat-Tina” Nordström – något Pernilla Wahlgren lyckades pricka in precis som veckan innan. – Vad är det som händer, Sverige? Men du var ju underbar, vi ville se mer av dig, säger panellisten. Maten avgjorde Enligt Pernilla Wahlgren var fredagens avsnitt fullt av matreferenser. Det talades om ”kniviga situationer”, ett pangnummer som ”serverades” och om någon som var van vid både ”bakslag” och ”hetta”. En av ledtrådarna handlade också om en drottningliknande framfart i tv något Tina Nordström onekligen stod för i början av 2000-talet. Pernilla Wahlgrens kollegor Behrouz ”Berra” Badreh och Carina Berg gissade i stället på någon med koppling till just Carina Berg, eftersom flera andra ledtrådar handlade om henne. Men det var alltså varken Carolina Gynning – Carina Bergs bästa vän – eller Kristina ”Keyyo” Petrushina – programledarkollega – utan något produktionen planterat in för att vilseleda både tittarna och panelen i sina gissningar. – Dels är det Vemdalen, det har vi tillsammans, säger Tina Nordström i programmet till Carina Berg. – Sen var det väl att du gjorde program som ”Berg flyttar in” och att jag gjorde besök. Kopplingen till Susanne Lanefelt, som dök upp i programmet, handlade om att de båda medverkade i samma säsong av ”Let’s dance”. ”En dröm som blir sann” Tina Nordström har, precis som många tidigare deltagare uppgett, sett programmet tillsammans med sina barn – och älskar det. – Jag har sett alla program med barnen. Jag kan inte fatta att jag ska få göra detta, säger hon. Att hon var utklädd till en höstack berodde på att tv-kocken äger en lada. När hon behövde åka i väg för att träna sång och dans, samtidigt som familjen var hemma, gjorde hon det i stallet. I inslaget som tar tittarna bakom kulisserna berättar hon att det var svettigt med pyro och den storslagna dekoren och att första klivet ut på scen var ”läskigt” – men också otroligt roligt. – Det är en dröm som blir sann. Alla ledtrådarna finns att läsa här och förklaringarna till flera av dem finns att se i programmet på TV4 Play.", "link": "https://www.tv4.se/artikel/161tKU7QrFhqgpBXLCcOnp/hoestacken-en-droem-som-blir-sann", "date_display": "2026-04-17", "date_iso": "2026-04-17T19:30:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/musik", "/masked-singer-sverige", "/tv4", "/tv4-play"]}, {"id": 159, "title": "Popular shower soap is changing – but NOT because of David", "summary": "In an email to the brand Barnängen from February 2025, David Wahlberg writes that he has noticed that their shower soap \"Creme & Olja Kakao\" has a somewhat unclear packaging. On the packaging it says \"cocoa\", but the picture below the text shows a coconut. The ingredients list also states that the shower soap contains coconut. \"I wonder if this is a mistake or if it smells like cocoa, but contains coconut,\" writes David Wahlberg in the email. - The next day I received a typical formal answer that everything was as it should be on the packaging, he tells TV4 Nyheterna. - I thought it was some translation that had gone crazy. Coconut and cocoa are quite close to each other. \"Does Nobel have a prize for these discoveries?\" David Wahlberg himself has shared a screenshot of the email in a post on Tiktok, which at the time of writing has more than 250,000 views on the platform. The post also shows a picture of the old and new packaging, where Barnängen has now kept the same text but changed the motif to a picture that instead shows cocoa. - The other day when I was in the shower, I saw on the packaging that they had changed. Then I thought it would be fun to post it on Tiktok with the exact sound I used just to have a little fun with them, he says. In the caption of the post, David Wahlberg writes that \"it only took a year to fix\" and is praised by several in the comment field. \"Does Nobel have a prize for these discoveries?\" writes one, and another comments: \"Have thought about it so many times hahaha credit to you.\" - I didn't think it would become a big deal, but many seem to have had similar thoughts about that soap. Barnängen denies But that it would be David Wahlberg who is behind the change now knocks Barnängen down. In an email reply to TV4 Nyheterna, the company writes that the label was changed in connection with the content of the product being changed - and that both the old and the new shower soap have the scent of cocoa. \"The old version also contained coconut oil,", "title_original": "Populära duschtvålen ändrar – men INTE på grund av David", "summary_original": "I ett mejl till varumärket Barnängen från februari 2025 skriver David Wahlberg att han har lagt märke till att deras duschtvål ”Creme & Olja Kakao” har en något oklar förpackning. På förpackningen står det ”kakao”, men bilden under texten föreställer en kokosnöt. I ingredienslistan står också att duschtvålen innehåller kokosnöt. ”Jag undrar om detta är ett misstag eller om den doftar kakao, men innehåller kokosnöt”, skriver David Wahlberg i mejlet. – Dagen efter fick jag ett typiskt formellt svar att allt var som det skulle på förpackningen, säger han till TV4 Nyheterna. – Jag tänkte att det var någon översättning som hade blivit knasig. Kokos och kakao ligger ju rätt nära varandra. ”Har nobel något pris för dessa upptäckter?” David Wahlberg har själv delat en skärmdump av mejlet i ett inlägg på Tiktok, som i skrivande stund har drygt 250 000 visningar på plattformen. I inlägget syns även en bild på den gamla och den nya förpackningen, där Barnängen nu har behållit samma text men bytt motivet till en bild som i stället visar kakao. – Häromdagen när jag stod i duschen såg jag på förpackningen att de hade ändrat. Då tänkte jag att det skulle vara kul att lägga ut det på Tiktok med just det ljudet jag använde bara för att dryga lite med dem, säger han. I inläggets bildtext skriver David Wahlberg att ”det bara tog ett år att fixa” och hyllas av flera i kommentarsfältet. ”Har Nobel något pris för dessa upptäckter?” skriver en, och en annan kommenterar: ”Har funderat på det så många gånger hhaha cred till dig.” – Jag tänkte inte att det skulle bli nån stor grej av det men många verkar ha haft liknande tankar om den tvålen. Barnängen dementerar Men att det skulle vara David Wahlberg som ligger bakom ändringen slår nu Barnängen ner. I ett mejlsvar till TV4 Nyheterna skriver företaget att etiketten ändrades i samband med att innehållet i produkten gjordes om – och att både den gamla och den nya duschtvålen har doft av kakao. ”Den gamla varianten innehöll dessutom kokosolja, vilket kokosnöten på bilden får representera. Men eftersom den nya varianten inte innehåller kokosolja visar vi istället en bild på en kakaofrukt och kakaosmör vilket representerar doften. Ungefär som att vi visar en bild på en blomma om den doftar gardenia eller kamelia”, skriver Mats Hagwall på Henkel Norden som har varumärket Barnängen. ”Det är förstås synd att förstöra en bra story, men vi ändrade inte bilden på grund av att en konsument har hört av sig, utan det berodde som sagt på ändrat innehåll i produkten”. Etiketterna för den nya produkten godkändes i december 2024, alltså innan David Wahlberg mejlade företaget, och produkten kom ut på marknaden i augusti 2025. ”Det är först idag jag har hört talas om denna virala story, men så hänger jag inte heller på Tiktok”, skriver Mats Hagwall vidare.", "link": "https://www.tv4.se/artikel/1pCoP8IjdKI1geOCr8qy31/populaera-duschtvalen-aendrar-men-inte-pa-grund-av-david", "date_display": "2026-04-17", "date_iso": "2026-04-17T19:11:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/halsa", "/skonhet", "/konsumentinformation", "/hygien", "/viralt"]}, {"id": 160, "title": "The police's response - after the criticism of the suspected killer's mother", "summary": "The police today closed the preliminary investigation after the violent act in Boden. This as the investigation shows that the man who died during the intervention was the only perpetrator. The preliminary autopsy report shows that the perpetrator was shot in the chest and neck. The shot to the neck came from behind. The suspected killer's mother, Tiffany, has criticized the intervention in an interview with TV4 Nyheterna and believes that the injuries indicate that her son was executed. Now the police are responding to the criticism after material was taken from the body cameras of the intervening officers.  Turned in the air In a press release to TV4 Nyheterna, Per-Olov Andersson, criminal inspector and head of preliminary investigations for serious crimes in the Norrbotten police area, describes the sequence of events that led to the perpetrator's death. The confrontation took place in the hall, where the police were met by a man with a knife in each hand. Video footage from the officers' body cameras reportedly shows how the first shot is fired and hits the man in the chest on the left side. \"This when the perpetrator is seen slashing at the police with his left hand and thereby the left half of his body ends up in the line of fire,\" writes Andersson. According to Per-Olov Andersson, as a result of the first shot combined with the momentum he already had after trying to stab the police, the man can be seen turning in the air. During this moment, the second shot is fired. \"This shot, number two, appears to hit the perpetrator in the neck before he falls to the floor.\" The seconds before the confrontation The body camera also reportedly shows the moments that led up to the perpetrator's death. When the police arrived, the front door was a couple of centimeters ajar, giving no insight into what awaited inside. \"When the incident concerns ongoing deadly violence (PDV), two police officers with drawn weapons enter relatively immediately,\" writes Per-Olov Andersson. The officers opened the door and saw a person lying on the floor in the hall. This will later turn out to be the youngest daughter who unknowingly came home", "title_original": "Polisens svar – efter kritiken från misstänkte mördarens mamma", "summary_original": "Polisen la i dag ned förundersökningen efter våldsdådet i Boden. Detta då utredningen visar den mannen som dog under ingripandet var den enda gärningsmannen. Den preliminära obduktionsrapporten visar att gärningsmannen sköts i bröst och nacke. Skottet i nacken kom bakifrån. Den misstänkte mördarens mamma, Tiffany, har kritiserat ingripandet i en intervju med TV4 Nyheterna och menar att skadorna pekar på att hennes son blev avrättad. Nu svarar polisen på kritiken efter att material hämtats från de ingripande polisernas kroppskameror.  Vände sig i luften I ett pressmeddelande till TV4 Nyheterna beskriver Per-Olov Andersson, kriminalkommissarie och förundersökningsledare på grova brott i polisområde Norrbotten, händelseförloppet som ledde fram till gärningsmannens död. Konfrontationen tog plats i hallen, där poliserna möttes av en man med en kniv i vardera hand. Videomaterial från polisernas kroppskameror uppges visa hur det första skottet avlossas och träffar mannen i bröstkorgen på vänstersidan. ”Detta då gärningsmannen syns hugga mot polisen med sin vänstra hand och därigenom hamnar hans vänstra kroppshalva i skottlinjen”, skriver Andersson. Enligt Per-Olov Andersson syns mannen, som en följd av det första skottet i kombination med det momentum han redan hade efter att ha försökt hugga polisen, vända sig i luften. Under detta ögonblick avlossas det andra skottet. ”Detta skott, nummer två, visar sig träffa gärningsmannen i nacken innan han ramlar ned på golvet.” Sekunderna innan konfrontationen Kroppskameran uppges även visa ögonblicken som ledde fram till gärningsmannens död. När polisen anlände var ytterdörren ett par centimeter på glänt, utan att ge insyn till vad som väntade på insidan. ”Då händelsen rör pågående dödligt våld (PDV) så går två poliser med dragna vapen in relativt omgående”, skriver Per-Olov Andersson. Poliserna öppnade dörren och såg en person ligga på golvet i hallen. Detta ska senare ska visa sig vara den yngsta dottern som ovetandes kommit hem under tiden då våldsdådet pågick. Ett våldsdåd som pågick i över tre timmar och som beskrivs av polisen som en skräckfilm. Från hallen kan poliserna även se ytterligare en person ligga på köksgolvet längre fram. Det är 57-åriga Annica som senare ska bekräftas död. Hallen till huset beskrivs som smal, med en dörr till en toalett på vänstersidan. På högersidan fanns krokar för jackor och en garderob. När polisen som går först ska passera garderoben kommer gärningsmannen fram, hållandes knivarna. Videomaterialet visar då ögonblicket när mannen försöker hugga polisen, och då det första skottet avlossas. Det andra skottet avfyras inom vad som beskrivs som en tiondels sekund, vilket leder till att mannen faller till marken.", "link": "https://www.tv4.se/artikel/5FaQHeNH6B1v130FJZyg4z/polisens-svar-efter-kritiken-fran-misstaenkte-moerdarens-mamma", "date_display": "2026-04-17", "date_iso": "2026-04-17T19:03:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/boden", "/mord", "/brott"]}, {"id": 161, "title": "Want to tighten the noose - can give Andersson a headache", "summary": "", "title_original": "Vill dra åt snaran – kan ge Andersson huvudvärk", "summary_original": "", "link": "https://www.tv4.se/artikel/Cg9ok84eMtd17qWSvefbg/dadgostars-plan-kan-ge-andersson-huvudvaerk", "date_display": "2026-04-17", "date_iso": "2026-04-17T18:33:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 162, "title": "The minister's message - after 14-year-old Elliot's severe brain injury", "summary": "Yesterday, TV4 Nyheterna was able to tell about Elliot Adelöw, who after a skiing accident ended up in a coma for over six months. Today, 15 months later, he lives with a brain injury and still has not returned home to his family.\n\nThe parents, who have been forced to pause their lives for over a year, describe – in addition to the emotional trauma – a concern about surviving purely financially. At the same time, there is a fight against the authorities to get the right help and support - and they are not alone. Bureaucratic labyrinth after the hospital Among the members of the Brain Damage Association Hjärnkraft, there are several who describe similar situations. After being discharged from the hospital, you are met by a bureaucratic labyrinth.\n\n- They feel very alone in this situation. You become without support and you simply don't know what to look for for help, says chairman of the Brain Injury Association Hjärnkraft Anna Barsk Holmbom, who wants to see a change.\n\nToday, there are so-called brain injury coordinators whose task is to help sufferers and relatives with information about what supports are available and how to cope. But that is far from reality for everyone, as help is limited in the country.\n\n- We think it is a very important piece so that you don't have to fight this fight alone. We would like more regions to make use of that, she says and continues:\n\n- When one's relatives suffer a very severe brain injury, that is priority one. You are afraid, you are sad and extremely worried. In many cases, you may also be hovering between life and death. Then you should be able to devote yourself to it, you shouldn't have to think about these practical questions, she says. Minister: \"Will review\" In order to ease the financial situation, the Minister of Elderly and Social Insurance Anna Tenje (M) now announces that the system will be reviewed.\n\n\"If one's child is ill, it goes without saying that as a parent you want to be there for your child. I cannot of course comment on individual cases, but temporary parental allowance when a child is seriously ill is", "title_original": "Ministerns besked – efter 14-årige Elliots svåra hjärnskada", "summary_original": "I går kunde TV4 Nyheterna berätta om Elliot Adelöw som efter en skidolycka hamnade i koma i över ett halvår. I dag, 15 månader senare, lever han med en hjärnskada och har fortfarande inte kommit hem till familjen.\n\nFöräldrarna, som tvingats pausa sina liv i över ett år, beskriver – utöver det känslomässiga traumat – en oro för att överleva rent ekonomiskt. Samtidigt pågår en kamp mot myndigheter för att få rätt hjälp och stöd – och de är inte ensamma. Byråkratisk labyrint efter sjukhuset Bland Hjärnskadeförbundet Hjärnkrafts medlemmar är det flera som beskriver liknande situationer. Efter att man blivit utskriven från sjukhuset möts man av en byråkratisk labyrint.\n\n– De känner sig väldigt ensamma i den här situationen. Man blir utan stöd och man vet inte riktigt vad man ska söka för hjälp helt enkelt, säger ordförande i Hjärnskadeförbundet Hjärnkraft Anna Barsk Holmbom, som vill se en förändring.\n\nI dag finns så kallade hjärnskadekoordinatorer som har till uppgift att hjälpa drabbade och anhöriga med information om vilka stöd som är tillgängliga och hur man bär sig åt. Men det är långt ifrån verkligheten för alla, då hjälpen är begränsad i landet.\n\n– Vi tycker att det är en väldigt viktig bit för att man inte ska behöva kämpa den här kampen ensam. Det skulle vi önska att fler regioner använde sig av, säger hon och fortsätter:\n\n– När ens anhöriga får en väldigt svår hjärnskada så är det prio ett. Man är rädd, man är ledsen och jätteorolig. I många fall kanske man också svävar mellan liv och död. Då ska man ju kunna få ägna sig åt det, man ska inte behöva tänka på de här praktiska frågorna, säger hon. Ministern: ”Ska se över” För att underlätta den ekonomiska situationen meddelar nu äldre- och socialförsäkringsminister Anna Tenje (M) att man ska se över systemet.\n\n”Om ens barn är sjukt är det självklart att man som förälder vill finnas där för sitt barn. Jag kan givetvis inte kommentera enskilda fall, men tillfällig föräldrapenning när ett barn är allvarligt sjukt är något vi vill titta vidare på så att förutsägbarhet och ekonomisk trygghet kan öka för både barn och föräldrar”, skriver hon i en kommentar till Nyheterna.\n\nEtt besked som Hjärnskadeförbundet är försiktigt positiva till.", "link": "https://www.tv4.se/artikel/4uPBDZAcY8CVrXpVhTIITI/ministerns-besked-efter-elliotts-svara-hjaernskada", "date_display": "2026-04-17", "date_iso": "2026-04-17T17:26:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/sjukvard", "/hjarnskador", "/anna-tenje-m"]}, {"id": 163, "title": "Busch's first words – after the revelation about the Russia investments", "summary": "At the end of March, TV4 Nyheterna was able to report that Ebba Busch's state secretary Simon Westberg owns shares in two large Russian companies. Westberg bought shares worth SEK 14,000 in the Russian agricultural companies Rosagro and Phosagro in February 2022 – the same month that Russia invaded Ukraine. According to Ebba Busch, the purchase of the shares is not appropriate. - No, and he has marked himself that these are shares that he does not wish to have and that he has wished to sell, but which is therefore not possible due to the sanctions, says the KD leader. Worth zero kroner The shares are today worth zero kroner due to the sanctions against Russia. Simon Westberg has previously said that he no longer wants to own the shares and that the purchase was \"a wrong decision\". Ebba Busch says that Westberg's shares are accounted for \"according to all the rules of the art\" and that they were included when the security check was done when he was to become secretary of state. - Yes, this has been reported to the government office based on existing procedures and there have been no question marks from the government office either. Busch further says that Simon Westberg's view of Russia cannot be questioned. - Simon Westberg's line on the Russia issue is very, very clear. The war of invasion in Ukraine is fully condemned.", "title_original": "Busch första ord – efter avslöjandet om Rysslandsinvesteringarna", "summary_original": "I slutet av mars kunde TV4 Nyheterna rapportera att Ebba Buschs statssekreterare Simon Westberg äger aktier i två ryska storföretag. Westberg köpte aktier till ett värde av 14 000 kronor i de ryska jordbruksbolagen Rosagro och Phosagro i februari 2022 – samma månad som Ryssland invaderade Ukraina. Enligt Ebba Busch är köpet av aktierna inte lämpligt. – Nej och han har ju markerat själv att det här är aktier som han inte önskar ha och som han har önskat sälja men som alltså inte är möjligt på grund av sanktionerna, säger KD-ledaren. Värda noll kronor Aktierna är i dag värda noll kronor på grund av sanktionerna mot Ryssland. Simon Westberg har tidigare sagt att han inte vill äga aktierna längre och att köpet var ”ett felaktigt beslut”. Ebba Busch säger att Westbergs aktier är redovisade ”enligt konstens alla regler” och att de funnits med när säkerhetsprövningen gjordes när han skulle bli statssekreterare. – Ja, det här är redovisat in till regeringskansliet utifrån de rutiner som finns och det har inte funnits några frågetecken ifrån regeringskansliet heller. Busch säger vidare att Simon Westbergs syn på Ryssland inte går att ifrågasätta. – Simon Westbergs linje i Rysslandsfrågan är väldigt, väldigt tydlig. Invasionskriget i Ukraina fördöms fullt ut.", "link": "https://www.tv4.se/artikel/6izBzLTX6CvMXNwrT8ftm9/busch-foersta-ord-efter-avsloejandet-om-rysslandsinvesteringar", "date_display": "2026-04-17", "date_iso": "2026-04-17T16:34:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/politik", "/ebba-busch", "/valet-2022/kristdemokraterna"]}, {"id": 164, "title": "HM The King and Minister for Foreign Affairs visit Ukraine", "summary": "Today, 17 April, HM The King and Minister for Foreign Affairs Maria Malmer Stenergard are visiting Lviv to show Sweden’s strong support for Ukraine.", "title_original": "HM The King and Minister for Foreign Affairs visit Ukraine", "summary_original": "Today, 17 April, HM The King and Minister for Foreign Affairs Maria Malmer Stenergard are visiting Lviv to show Sweden’s strong support for Ukraine.", "link": "https://www.government.se/press-releases/2026/04/hm-the-king-and-minister-for-foreign-affairs-visit-ukraine/", "date_display": "2026-04-17", "date_iso": "2026-04-17T14:41:36+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}, {"id": 165, "title": "Bible bingo when Ebba Busch (KD) gave a speech: \"I am educated\"", "summary": "The KD leader wants to see parental insurance without quotas - and wants to fight \"burkacracy\".", "title_original": "Bibelbingo när Ebba Busch (KD) höll tal: ”Jag är bildad”", "summary_original": "KD-ledaren vill se en föräldraförsäkring utan kvotering – och vill bekämpa ”burkakrati”.", "link": "https://www.dagen.se/nyheter/bibelbingo-naer-ebba-busch-kd-hoell-tal-jag-aer-bildad/10303878", "date_display": "2026-04-17", "date_iso": "2026-04-17T13:31:11+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "New Ambassadors from Maldives, Andorra, Ghana and Monaco", "summary": "The following Ambassadors submitted their letters of credence to HM The King, on 16 April 2026: H.E. Aishath Shaan Shakir, Maldives, with residence in Berlin; H.E. Olga Gelabert Fàbrega, Andorra, with residence in Andorra; H.E. Dr Margaret Miewien Chebere, Ghana, with residence in Copenhagen; and H.E. Stéphanie Mourou Vikström, Monaco, with residence in Monaco.", "title_original": "New Ambassadors from Maldives, Andorra, Ghana and Monaco", "summary_original": "The following Ambassadors submitted their letters of credence to HM The King, on 16 April 2026: H.E. Aishath Shaan Shakir, Maldives, with residence in Berlin; H.E. Olga Gelabert Fàbrega, Andorra, with residence in Andorra; H.E. Dr Margaret Miewien Chebere, Ghana, with residence in Copenhagen; and H.E. Stéphanie Mourou Vikström, Monaco, with residence in Monaco.", "link": "https://www.government.se/press-releases/2026/04/new-ambassadors-from-maldives-andorra-ghana-and-monaco/", "date_display": "2026-04-17", "date_iso": "2026-04-17T09:15:06+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Diplomatic portal"]}, {"id": 167, "title": "Creators want to be inspired by quiet revival among young adults in London", "summary": "Pentecost creative breaks the attendance record with 500 registered for this weekend's conference.", "title_original": "Kreatörer vill inspireras av tyst väckelse bland unga vuxna i London", "summary_original": "Pingst kreativ slår deltagarrekord med 500 anmälda till helgens konferens.", "link": "https://www.dagen.se/nyheter/kreatoerer-vill-inspireras-av-tyst-vaeckelse-bland-unga-vuxna-i-london/10302257", "date_display": "2026-04-17", "date_iso": "2026-04-17T09:07:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 168, "title": "JD Vance urges the Pope to be thorough in theological matters", "summary": "The US Vice President defends the war in Iran and engages in polemics with the Pope.", "title_original": "JD Vance uppmanar påven att vara noggrann i teologiska frågor", "summary_original": "USA:s vicepresident försvarar kriget i Iran och går i polemik med påven.", "link": "https://www.dagen.se/nyheter/jd-vance-uppmanar-paven-att-vara-noggrann-i-teologiska-fragor/10300710", "date_display": "2026-04-17", "date_iso": "2026-04-17T09:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 169, "title": "Nooshi Dadgostar fights back against internal criticism", "summary": "\"We demand to sit at the   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
