 buy medicines.  - Then it can go really bad, because there you don't even know what it is you're getting. Discreet tip At the same time, the pharmacy is often more easily accessible than healthcare, with its sometimes long queues. - We do not have an appointment, but you can pop into any pharmacy and ask questions. We are also registered health care personnel who have a duty of confidentiality, says Annika Svedberg. Despite that, many hesitate and do not dare to ask the questions they want answered. But there are ways to be more discreet.  - Many pharmacies have a counseling room. Then it is actually also possible to chat or call the pharmacy", "title_original": "Sex, svamp och hemorrojder – frågorna vi skäms över att ställa", "summary_original": "Många svenskar går runt med frågor om sin hälsa som aldrig blir ställda. En ny undersökning från Apoteket Hjärtat visar att problem kopplade till sexliv, underliv och ändtarm hör till det som upplevs som mest pinsamt.  – Det här är nåt som vi har haft på känn länge. Vi vet att ganska många kunder drar sig för att ställa vissa frågor, säger Annika Svedberg i Nyhetsmorgon.  En orsak är att många upplever besvären som skamliga – eller tror att de är ensamma.  – Det kan ha att göra med att man tycker att det är pinsamt och att man tror att man är själv om att ha den åkomman som man har fått. De vanligaste frågorna En av de vanligaste frågorna som svenskar inte vågar ställa handlar om hur receptbelagda läkemedel påverkar sexlivet. Vissa mediciner, som antidepressiva, hormonpåverkande läkemedel och blodtrycksmedicin, kan påverka både lust och funktion.  Även frågor om svampinfektioner, intimhygien och besvär som hemorrojder och analklåda upplevs som känsliga. Samtidigt betonar Annika Svedberg att problemen är vanliga.  – Varje dag på apoteken pratar vi om problem som kunder upplever som pinsamma, men för den som jobbat på apotek ett par år: Vi har hört allt. Det finns ingenting som är pinsamt för oss att prata om. Men att inte våga fråga kan få konsekvenser, menar Annika Svedberg. Det kan bland annat leda till att vissa istället vänder sig till oseriösa sajter för att köpa läkemedel.  – Då kan det gå riktigt illa, för där vet man inte ens vad det är man får. Diskreta tipset Samtidigt är apoteket ofta mer lättillgängligt än vården, med sina ibland långa köer. – Vi har ingen tidsbokning, utan du kan knalla in på vilket apotek som helst och ställa frågor. Vi är dessutom legitimerad hälso- och sjukvårdspersonal som har tystnadsplikt, säger Annika Svedberg. Trots det tvekar många och vågar inte ställa de frågor de vill få svar på. Men det finns sätt att vara mer diskret.  – På många apotek finns ett rådgivningsrum. Sen går det faktiskt också att chatta eller ringa till apoteken om man vill ha det ännu lite mer privat eller till och med anonymt, säger chefsapotekaren.", "link": "https://www.tv4.se/artikel/7IWBrx4F0bemkCJ5XmvluF/sex-svamp-och-hemorrojder-fragorna-vi-skaems-oever-att-staella", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:26:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/halsa", "/nyhetsmorgon", "/apoteket", "/apotek", "/halsobesvar"]}, {"id": 126, "title": "Why did JD Vance become a Catholic, anyway?", "summary": "In a newly published book, JD Vance explains why he became a Catholic. But is concern for the legacy one leaves behind a good enough reason to convert?", "title_original": "Varför blev J D Vance katolik, egentligen?", "summary_original": "I en nyutkommen bok förklarar J D Vance varför han blev katolik. Men är oro för det arv man lämnar efter sig ett tillräckligt gott skäl att konvertera?", "link": "https://www.svd.se/a/M79Qz5/varfor-blev-j-d-vance-katolik-egentligen", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 127, "title": "Huge row over scrapped quantity discount: \"Looks more and more like a farce\"", "summary": "Earlier this summer, the Tidö parties presented the second part of the new penal reform. According to Minister of Justice Gunnar Strömmer, the aim of the reform is to make the punishment more fair. Among other things, it was proposed to abolish the quantity discount, the introduction of a new system of conditional imprisonment and to scrap the so-called cheapness reason.  During Thursday, the Riksdag will vote on the proposal and despite the fact that the Social Democrats are positive about abolishing the quantity discount, they will vote no in the chamber.  - We are voting no because there are thousands of prison places missing. As the Prison Service assesses, it will take until 2040 before they exist, says Carvalho. Strömmer: \"Is, of course, misinformation\" The figure 2040 is the Prison Service's assessment, but Gunnar Strömmer believes that the Social Democrats are dealing with untruths.  - There has been a figure, 2040, the parties that intend to vote no say that it could only come into force then. It is, of course, misinformation, it has been about the Correctional Service's estimate of when all reforms regarding tougher penalties will have full effect in the system, says Strömmer.  When the Tidöpartierna came forward with the proposal, it was pointed out that the changes to the law would be introduced as the Correctional Service expands and can receive more inmates. The moderates believe that the penal reform could be introduced already in the next term.  - We have a plan that means that the Correctional Service will be able to handle it in terms of capacity. We have also presented what it means financially, 3–7 billion during the next term depending on which year it would come into force, says Strömmer.  A: Can't take a position on anything M claims. At the same time, Strömmer opened up to give priority to discontinued quantity discounts, in case it wasn't possible to implement all parts. - Gunnar Strömmer admits that a new bill will be required on the Riksdag's table if it is to be possible to extract the quantity discount from the entire reform, says Carvalho. She is skeptical of how the issue has been handled and points to a", "title_original": "Storbråk om slopade mängdrabatten: ”Liknar allt mer en fars”", "summary_original": "Tidigare i somras presenterade Tidöpartierna den andra delen av den nya straffreformen. Syftet med reformen är enligt justitieminister Gunnar Strömmer att göra straffen mer rättvisa. Bland annat föreslogs avskaffad mängdrabatt, införandet av ett nytt system med villkorligt fängelse och att slopa det så kallade billighetsskälet.  Under torsdagen kommer riksdagen att rösta om förslaget och trots att Socialdemokraterna är positiva till att slopa mängdrabatten kommer man att rösta nej i kammaren.  – Vi röstar nej eftersom det saknas tusentals fängelseplatser. Som Kriminalvården bedömer kommer det dröja till 2040 innan de finns, säger Carvalho. Strömmer: ”Är naturligtvis desinformation” Siffran 2040 är Kriminalvårdens bedömning, men Gunnar Strömmer menar att Socialdemokraterna far med osanning.  – Det har ju förekommit en siffra, 2040, de partierna som tänker rösta nej säger att det först skulle kunna träda i kraft då. Det är naturligtvis desinformation, det har handlat om Kriminalvårdens uppskattning av när samtliga reformer gällande skärpta straff kommer ha full effekt i systemet, säger Strömmer.  När Tidöpartierna gick fram med förslaget pekade man på att lagändringarna skulle införas i takt med att Kriminalvården expanderar och kan ta emot fler intagna. Moderaterna menar att straffreformen skulle kunna införas redan nästa mandatperiod.  – Vi har en plan som gör att Kriminalvården kommer att klara det kapacitetsmässigt. Vi har också presenterat vad det betyder ekonomiskt, 3–7 miljarder under nästa mandatperiod beroende på vilket år det skulle träda i kraft, säger Strömmer.  S: Kan inte ta ställning till något M påstår Samtidigt öppnade Strömmer för att prioritera slopad mängdrabatt, ifall det inte skulle vara möjligt att genomföra alla delar. – Gunnar Strömmer medger att det kommer att krävas ett nytt lagförslag på riksdagens bord om man ska kunna bryta ut mängdrabatten från hela reformen, säger Carvalho. Hon är skeptisk till hur frågan har hanterats och pekar bland annat på att Moderaterna under en presskonferens presenterat egna kalkyler som inte finns med i prepositionen som man ska rösta om. – Om Moderaterna har andra kalkyler, andra beräkningar, då får de presentera dem. De kan inte begära att riksdagen tar ställning till något som Moderaterna bara påstår, säger Carvalho. Vidare anser hon att Moderaternas hantering av frågan allt mer börjar likna en fars. – Det var bland det rörigaste jag någonsin tagit del av, säger Carvalho. Socialdemokraterna presenterade nyligen ett eget förslag för slopandet av mängdrabatten, där man först vill prioritera sexualbrott – något man menar är genomförbart under nästa mandatperiod.  – Vi gör gärna upp med Moderaterna, men då måste vi se till att prata med varandra och inte bara begära att vi ska rösta på deras ofinansierade och ogenomförbara förslag, säger Carvalho.", "link": "https://www.tv4.se/artikel/l9oHP8YrIgKdCxZfyzAwB/storbrak-om-slopade-maengdrabatten-liknar-allt-mer-en-fars", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:06:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/valet-2026", "/brott-och-straff", "/valet-2022/moderaterna", "/valet-2022/socialdemokraterna", "/gunnar-strommer", "/teresa-carvalho", "/politik"]}, {"id": 128, "title": "Hezbollah's economy is squeezed - lowered by the Iran war", "summary": "Iran-backed Hezbollah is facing its biggest financial challenges in years, according to an analysis by the American newspaper The New York Times. The US war against Iran has had severe consequences for the Lebanese Shia militia.", "title_original": "Hizbollahs ekonomi pressas – sänks av Irankriget", "summary_original": "Iranstödda Hizbollah står inför de största ekonomiska utmaningarna på flera år, visar en granskning från den amerikanska tidningen The New York Times. USA:s krig mot Iran har fått svåra konsekvenser för den libanesiska shiamilisen.", "link": "https://www.svd.se/a/8pxqe2/hizbollahs-ekonomi-pressas-sanks-av-irankriget", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:00:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 129, "title": "Blood Rot, part 52 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 52 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-52-av-57/", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "DN Debate. \"For once you can actually talk about a fateful choice\"", "summary": "DN DEBATE. Since I resigned as finance minister twelve years ago, I have mostly refrained from commenting on Swedish politics. But now is the time: The Green Party and the Left Party are making strong progress ahead of the election and the parliamentary balance of power is about to be upset. It would have fatal consequences for Sweden's economy, writes former moderate minister Anders Borg.", "title_original": "DN Debatt. ”För en gångs skull kan man faktiskt tala om ett ödesval”", "summary_original": "DN DEBATT. Sedan jag avgick som finansminister för tolv år sedan har jag oftast avstått från att kommentera svensk politik. Men nu är det dags: Miljöpartiet och Vänsterpartiet går starkt framåt inför valet och den parlamentariska styrkebalansen är på väg att rubbas. Det skulle få ödesdigra konsekvenser för Sveriges ekonomi, skriver tidigare moderata ministern Anders Borg.", "link": "https://www.dn.se/debatt/for-en-gangs-skull-kan-man-faktiskt-tala-om-ett-odesval/", "date_display": "2026-08-10", "date_iso": "2026-08-10T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Albert, 8, aims for the top: \"Never give up\"", "summary": "This summer, Kebnekaise was on the schedule, but Albert has also climbed both Norway's and Germany's highest mountains. And it is the German peak Zugspitze, just over 2,900 meters above sea level, which has been the most fun so far. - There was a lot of climbing and fun to see the view when you were up. You had to use a lot of rope and stuff. Heights don't scare him - most of the time. - It feels very exciting. It's a bit scary if there are cliffs on both sides, but very exciting to be up on top. Training for the next adventure The interest in the mountains runs in the family and Albert was inspired by his mother. But anyone who thinks it's just a matter of lacing up your boots and starting climbing should think again. Before the tours, Albert trains by hiking and climbing small hills and peaks. Albert has several tips for those who want to start climbing mountains.\n\n- You must always have water and warm clothes with you because it can get quite cold. One tip is to never give up. You also have to train quite a lot and have climbed other, slightly easier mountains before, he says. He explains that it's good to hike and climb hills to get your breath on for bigger challenges. Aiming for Mont Blanc Although Albert has already managed to collect several impressive peaks, he is far from finished. The big dream is to one day climb Mont Blanc in the Alps. - I really want to climb that. It is quite high and is located in France, says Albert. But he found the most beautiful view so far much closer. When asked which top was the most beautiful, the answer comes quickly: - Kebnekaise. It was very nice down there. It was very blue sky and very nice.", "title_original": "Albert, 8, siktar mot toppen: ”Ge aldrig upp”", "summary_original": "I somras stod Kebnekaise på schemat, men Albert har också tagit sig upp på både Norges och Tysklands högsta berg. Och det är den tyska toppen Zugspitze, drygt 2 900 meter över havet, som hittills varit allra roligast. – Det var mycket klättring och kul att se utsikten när man var uppe. Man fick använda mycket rep och sånt. Höjderna skrämmer honom inte – för det mesta. – Det känns väldigt spännande. Det är lite läskigt om det är stup på båda sidorna, men väldigt spännande att vara uppe på toppen. Tränar inför nästa äventyr Bergsintresset finns i familjen och Albert har inspirerats av sin mamma. Men den som tror att det bara är att snöra på sig kängorna och börja klättra får tänka om. Inför turerna tränar Albert genom att vandra och ta sig uppför mindre kullar och toppar. Albert har flera tips till den som vill börja klättra i berg.\n\n– Man måste alltid ha med sig vatten och varma kläder för det kan bli ganska kallt. Ett tips är att aldrig ge upp. Man ska också träna ganska mycket och ha bestigit andra, lite enklare berg innan, säger han. Han förklarar att det är bra att vandra och gå uppför kullar för att få upp flåset inför större utmaningar. Siktar mot Mont Blanc Trots att Albert redan hunnit samla på sig flera imponerande toppar är han långt ifrån färdig. Den stora drömmen är att en dag bestiga Mont Blanc i Alperna. – Det vill jag jättegärna bestiga. Det är ganska högt och ligger i Frankrike, säger Albert. Men den vackraste utsikten hittills hittade han på betydligt närmare håll. På frågan om vilken topp som varit allra finast kommer svaret snabbt: – Kebnekaise. Det var väldigt fint där nere. Det var väldigt blå himmel och väldigt snyggt.", "link": "https://www.tv4.se/artikel/1Cg2nhq5yQKDg3i8tusbMh/albert-8-siktar-mot-toppen-ge-aldrig-upp", "date_display": "2026-08-10", "date_iso": "2026-08-10T17:52:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/sverigesvepet", "/bergsbestigning", "/klattring"]}, {"id": 132, "title": "Jimmie Åkesson about his Romanian neighbor: \"She is wonderful\"", "summary": "In \"Who can control Mauri?\" TV profile Mauri Hermundsson takes to the roads for a practice drive with all eight party leaders as supervisors. There will be some political talk, but above all, Hermundsson wants to get to know the person behind the role of party leader. Åkesson never needs to buy tomatoes The first driving lesson takes place with the Sweden Democrats' Jimmie Åkesson. When Åkesson's neighbor Georgeta calls, he is forced to interrupt the conversation with Hermundsson. - She is wonderful, fantastic. She is not from Sweden, as you heard. She is from Romania, says Jimmie Åkesson. According to the SD leader, the neighbor is largely self-sufficient - and the Åkesson family never needs to buy tomatoes. - There is always. And we usually get garlic. Lots of fruit and stuff like that, he says. - A Romanian aunt who provides for Jimmie Åkesson in Sölvesborg, notes Mauri Hermundsson.\n\n- That's how you could see it. At least a little, answers Åkesson. \"Live more mixed than Magdalena Andersson\" After the driving lesson, Åkesson and Hermundsson will organize a barbecue party in the garden. The neighbor Georgeta is also invited. She tells us that another neighbor has moved from Romania to Sweden. - Fate, she says. - I live more mixed than Magdalena Andersson in any case, says Jimmie Åkesson. Whether Åkesson's living situation is an example of integration or assimilation is not something he has given much thought to. - I don't think you need to make such a big deal out of it. It has always been like that in all ages, that people from other countries come to Sweden and Swedes move to other countries, he says. Who can control Mauri? premieres on 10 August at 19.30 on TV4 and TV4 Play.", "title_original": "Jimmie Åkesson om sin rumänska granne: ”Hon är underbar”", "summary_original": "I ”Vem kan styra Mauri?” ger sig tv-profilen Mauri Hermundsson ut på vägarna för att övningsköra med samtliga åtta partiledare som handledare. Det blir en del politiksnack, men framför allt vill Hermundsson lära känna människan bakom rollen som partiledare. Åkesson behöver aldrig köpa tomater Första körlektionen sker med Sverigedemokraternas Jimmie Åkesson. När Åkessons granne Georgeta ringer tvingas han avbryta samtalet med Hermundsson. – Hon är underbar, fantastisk. Hon är inte från Sverige, som du hörde. Hon är från Rumänien, säger Jimmie Åkesson. Enligt SD-ledaren är grannen i stort sett självförsörjande – och familjen Åkesson behöver aldrig köpa tomater. – Det finns alltid. Och vitlök brukar vi få. Massa frukter och så där, säger han. – En rumänsk tant som försörjer Jimmie Åkesson i Sölvesborg, konstaterar Mauri Hermundsson.\n\n– Så skulle man kunna se det. Lite i alla fall, svarar Åkesson. ”Bor mer blandat än Magdalena Andersson” Efter körlektionen ska Åkesson och Hermundsson ordna en grillfest i trädgården. Även grannen Georgeta är bjuden. Hon berättar att ytterligare en granne har flyttat från Rumänien till Sverige. – Ödet, säger hon. – Jag bor mer blandat än Magdalena Andersson i alla fall, säger Jimmie Åkesson. Huruvida Åkessons boendesituation är ett exempel på integration eller assimilering är inget han har funderat särskilt mycket över. – Jag tycker inte att man behöver göra en så stor sak av det. Så har det väl alltid varit i alla tider, att det kommer människor från andra länder till Sverige och svenskar som flyttar till andra länder, säger han. Vem kan styra Mauri? har premiär den 10 augusti klockan 19.30 på TV4 och TV4 Play.", "link": "https://www.tv4.se/artikel/5q38reWBytxufpxJPEeBks/jimmie-akesson-om-sin-rumaenska-granne-hon-aer-underbar", "date_display": "2026-08-10", "date_iso": "2026-08-10T17:45:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/valet-2026", "/inrikes", "/politik", "/noje", "/tv", "/personer/mauri-hermundsson", "/personer/jimmie-akesson-sd"]}, {"id": 133, "title": "The intelligence expert: \"An unexpected traditional arrangement\"", "summary": "A Russian intelligence operation that has tried to influence Swedish decision-making and discredit Sweden, the EU and NATO has been stopped by Säpo, the authority stated in a press release on Monday. According to Säpo, it concerns a man at a foreign mission in Stockholm who was recruited by two intelligence officers at the Russian foreign intelligence service SVR. The three suspects are said to have collected information about Swedish decision-making in order to \"enable Russian intelligence to influence polarizing issues\".  - These types of operations are always serious to some extent, but at the same time this is an unexpectedly traditional set-up and something that intelligence officers deal with. This is how the game looks and in that way it is not particularly sensational, says Tony Ingesson, senior lecturer at Lund University and researcher in intelligence analysis, to TV4 Nyheterna. \"Nothing that speaks for any major damage\" When Säpo published its data on Monday, there were barely five weeks left until the election. Justice Minister Gunnar Strömmer (M) tells TV4 Nyheterna that the operation is deemed to have nothing to do with the election. Tony Ingesson shares that view. - There is really nothing to indicate that this has a connection to the election. They also appear to have been discovered at an early stage where Säpo has had the initiative through the process - and there is nothing to suggest any major damage. However, the fact that Säpo is so transparent can contribute to important awareness. - There has been an increased tendency towards openness on the part of Säpo for a few years now, and this is in line with their stated ambition to raise awareness. It also looks like a pretty big success for Säpo. These are still qualified opponents we are talking about, so I can imagine that they feel quite satisfied right now, says Tony Ingesson. The unusual recruitment The suspected persons have left Sweden since the operation was discovered, confirm", "title_original": "Underrättelseexperten: ”Ett oväntat traditionellt upplägg”", "summary_original": "En rysk underrättelseoperation som har försökt påverka svenskt beslutsfattande samt misskreditera Sverige, EU och Nato har stoppats av Säpo, uppgav myndigheten i ett pressmeddelande på måndagen. Enligt Säpo rör det sig om en man vid en utländsk beskickning i Stockholm som rekryterats av två underrättelseofficerare vid den ryska utrikesunderrättelsetjänsten SVR. De tre misstänkta personerna uppges ha samlat in information om svenskt beslutsfattande för att ”göra det möjligt för rysk underrättelsetjänst att bedriva påverkan kring polariserande frågor”.  – Den här typen av operationer är alltid allvarliga i någon mån, men samtidigt är det här ett oväntat traditionellt upplägg och sådant som underrättelseofficerare sysslar med. Det är så spelet ser ut och på så vis är det inte särskilt uppseendeväckande, säger Tony Ingesson, universitetslektor vid Lunds universitet och forskare i underrättelseanalys, till TV4 Nyheterna. ”Inget som talar för någon större skadeverkan” När Säpo publicerade sina uppgifter på måndagen är det knappt fem veckor kvar till valet. Justitieminister Gunnar Strömmer (M) säger till TV4 Nyheterna att operationen inte bedöms ha något att göra med valet. Tony Ingesson delar den uppfattningen. – Det finns egentligen ingenting som tyder på att det här har en koppling till valet. De förefaller dessutom ha upptäckts i ett tidigt skede där Säpo har haft initiativet genom processen – och det finns inget som talar för någon större skadeverkan. Att Säpo är så pass transparanta kan dock bidra till viktig medvetenhet. – Det har funnits en ökad tendens till öppenhet från Säpos sida under några år nu, och det ligger i linje med deras uttalade ambition att höja medvetenheten. Det ser dessutom ut som en ganska stor framgång för Säpo. Det är ändå kvalificerade motståndare vi pratar om, så jag kan tänka mig att de känner sig rätt nöjda just nu, säger Tony Ingesson. Ovanliga rekryteringen De misstänkta personerna har lämnat Sverige sedan operationen uppdagades, bekräftar både Säpo och utrikesminister Maria Malmer Stenergard (M). Samtliga åtnjuter diplomatisk immunitet och kan därför inte gripas och åtalas för brott. – Det mer traditionella är att underrättelseofficerarna som sköter rekrytering har diplomatisk immunitet och tvingas lämna landet, men det som är ovanligt i det här fallet är att även den rekryterade har diplomatisk immunitet.  Hur vanligt är det att man rekryterar en person med immunitet? – Det finns exempel där en annan diplomat rekryterats, men det är mer ovanligt. Det typiska är att man rekryterar någon som är medborgare eller åtminstone permanent bosatt i landet där rekryteringen sker, säger Tony Ingesson. – Det är så klar en nackdel, men fördelen med detta är att det inte krävs lika mycket bevisbörda för att agera. Det ger mer handlingsfrihet att bara skicka ut personen ur landet. Man inte måste genomföra en grundlig förundersökning som ska hålla genom en rättsprocess, säger Tony Ingesson.", "link": "https://www.tv4.se/artikel/1mqfkqKTolgEPnYysiKPNm/underraettelseexperten-ett-ovaentat-traditionellt-upplaegg", "date_display": "2026-08-10", "date_iso": "2026-08-10T17:20:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/sakerhetspolisen", "/spioneri", "/sapo"]}, {"id": 134, "title": "The giant construction is three years late - still unclear when the bus terminal will open", "summary": "Five billion more expensive than planned and three years late - so far. The latest bid is for the bus terminal in Slussen to open this fall, but no exact date is available. - I am often forced to take the car because the terminal takes so long and I really don't want that. It's really bad, says traveler Helena Rasmanis.", "title_original": "Jättebygget tre år försenat – fortsatt oklart när bussterminalen öppnar", "summary_original": "Fem miljarder dyrare än planerat och tre år försenad – hittills. Senaste budet är att bussterminalen i Slussen ska öppna i höst, men något exakt datum finns inte. – Jag tvingas ofta ta bilen eftersom terminalen dröjer så länge och det vill jag verkligen inte. Det är jättedåligt, säger resenären Helena Rasmanis.", "link": "https://www.dn.se/sverige/jattebygget-tre-ar-forsenat-fortsatt-oklart-nar-bussterminalen-oppnar/", "date_display": "2026-08-10", "date_iso": "2026-08-10T17:08:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Rumors about the spy deal: They haven't succeeded", "summary": "A Russian spy operation aimed at damaging Sweden's reputation internationally and influencing politicians has been revealed by Säpo. - Has nothing to do with the Swedish election, says Minister of Justice Gunnar Strömmer (M).", "title_original": "Strömmer om spionaffären: De har inte lyckats", "summary_original": "En rysk spionoperation som syftade till att skada Sveriges rykte internationellt och påverka politiker har avslöjats av Säpo. – Har inte med svenska valet att göra, säger justitieminister Gunnar Strömmer (M).", "link": "https://www.dn.se/sverige/strommer-om-spionaffaren-de-har-inte-lyckats/", "date_display": "2026-08-10", "date_iso": "2026-08-10T16:54:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Jenny Strömstedt: \"I think everyone should lock themselves in the sofa\"", "summary": "In just over a month, there will be parliamentary elections in Sweden. On Tuesday, TV4's election campaign Valutfråningen begins. The program is led by Jenny Strömstedt, who together with the politically interested YouTuber Emil Hansius and TV4's political reporter Ann Tiberg meet the party leaders in a three-hour live conversation. - I am very much looking forward to this. Because three hours means that we really get time to drill into questions in a way that you never actually do when you're doing what we do, says Ann Tiberg. More people will make an informed choice In the spring, the trio met and got a feel for the collaboration, which bodes well for the premiere. But according to Jenny Strömstedt, it is only now that it really begins. - To lock ourselves in this studio for three hours with a party leader and see what becomes of what we have prepared. I hope it turns out to be everything we envisioned, she says. The fact that each program is three hours long means that society is complicated. In order to get answers that actually have a bearing on reality, more time is needed, says Strömstedt. - In addition, we want to be able to include both interesting questions about current politics and important future issues. At the same time, we want to have time to talk more personally and find out what has shaped the person and led to the political choices. It also says something about one's leadership. - The point is that more people should be able to make an informed choice, find politics interesting and feel that it affects their lives. \"Everyone should lock themselves on the sofa\" The currency question is broadcast every Tuesday on TV4 at 19.30, in a half-hour version, and in its entirety on TV4 Play. - We think that everyone should lock themselves on the sofa. No, but you can come and go a bit. Our hope is that it will be interesting enough, says Jenny Strömstedt. Emil Hansius is one of Sweden's biggest YouTubers and knows how to make viewers stay in front of the screen. However, he has never before worked with Ann Tiberg and Jenny Strömstedt. - Our relationship and how it changes during", "title_original": "Jenny Strömstedt: ”Tänker att alla ska låsa fast sig i soffan”", "summary_original": "Om drygt en månad är det riksdagsval i Sverige. På tisdag inleds TV4:s valsatsning Valutfrågningen. Programmet leds av Jenny Strömstedt, som tillsammans med den politisk intresserade youtubern Emil Hansius och TV4:s politiska reporter Ann Tiberg möter partiledarna i tre timmar långa direktsända samtal. – Jag ser väldigt mycket fram emot det här. För tre timmar innebär att vi verkligen får tid att borra i frågor på ett sätt som man faktiskt aldrig gör när man håller på med det vi gör, säger Ann Tiberg. Fler ska göra ett informerat val I våras träffades trion och fick känna på samarbetet, vilket bådar gott inför premiären. Men enligt Jenny Strömstedt är det först nu det börjar på riktigt. – Att stänga in oss i den här studion i tre timmar med en partiledare och se vad det blir av det vi har förberett. Jag hoppas att det blir precis allt vi har tänkt oss, säger hon. Att varje program är tre timmar långt handlar om att samhället är komplicerat. För att få svar som faktiskt har bäring på verkligheten behövs mer tid, menar Strömstedt. – Dessutom vill vi kunna få med både intressanta frågeställningar om dagspolitik och viktiga framtidsfrågor. Samtidigt vill vi hinna prata mer personligt och ta reda på vad som har format personen och lett fram till de politiska valen. Det säger ju också någonting om ens ledarskap. – Poängen är att fler ska kunna göra ett informerat val, tycka att politik är intressant och känna att den berör deras liv. ”Alla ska låsa fast sig i soffan” Valutfrågningen sänds varje tisdag i TV4 klockan 19.30, i en halvtimmesversion, och i sin helhet på TV4 Play. – Vi tänker att alla ska låsa fast sig i soffan. Nej, men man kan väl komma och gå lite. Vår förhoppning är ändå att det ska vara tillräckligt intressant, säger Jenny Strömstedt. Emil Hansius är en av Sveriges största youtubers och vet hur man får tittarna att stanna framför skärmen. Däremot har han aldrig tidigare arbetat med Ann Tiberg och Jenny Strömstedt. – Vår relation och hur den förändras under de här åtta programmen kan ju också bli en underhållningsfaktor, säger Jenny Strömstedt. – Ja, man kan få se min och Jennys relation gå i kras, program efter program. Det blir bara värre och värre, vi sitter längre och längre ifrån varandra. Fan också. Vi tar ju en risk med vår relation, så är det ju, säger Emil Hansius.", "link": "https://www.tv4.se/artikel/OEmrX9zBds4DmQiZVx1EF/jenny-stroemstedt-vi-taenker-att-alla-ska-lasa-fast-sig-i-soffan", "date_display": "2026-08-10", "date_iso": "2026-08-10T16:39:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/valet-2026", "/inrikes", "/politik", "/personer/jenny-stromstedt", "/tv4"]}, {"id": 137, "title": "Sjöström will kick with power under the surface: \"Became more patient\"", "summary": "PARIS. In the final 35 metres, Sarah Sjöström is super strong – and usually the fastest of all. But in the opening 15 meters there are hundredths to be gained. Something that has meant that Sjöström, who only bets on 50 meter distances, has focused a little extra on underwater skills in the month before the EC in Paris, which for her starts on Tuesday.", "title_original": "Sjöström ska kicka med power under ytan: ”Blivit tåligare”", "summary_original": "PARIS. På de avslutande 35 meterna är Sarah Sjöström superstark – och oftast snabbast av alla. Men på de inledande 15 meterna finns det hundradelar att tjäna. Något som har gjort att Sjöström, som enbart satsar på 50 metersdistanser, har fokuserat lite extra på undervattenskickar månaden före EM i Paris som för hennes del inleds på tisdagen.", "link": "https://www.dn.se/sport/sjostrom-ska-kicka-med-power-under-ytan-blivit-taligare/", "date_display": "2026-08-10", "date_iso": "2026-08-10T16:32:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Iran's ultimatum to the US: Demands must be met", "summary": "Iran says a final agreement with Oman on safe sea lanes through the Strait of Hormuz is close. But the strait will not be opened unless the United States agrees to the demands, according to a spokesperson for the country's Ministry of Foreign Affairs.", "title_original": "Irans ultimatum till USA: Kraven måste uppfyllas", "summary_original": "Iran uppger att en slutlig överenskommelse med Oman om säkra sjövägar genom Hormuzsundet är nära. Men sundet kommer inte att öppnas om inte USA går med på kraven, uppger en talesperson för landets utrikesdepartement.", "link": "https://www.dn.se/varlden/irans-ultimatum-till-usa-kraven-maste-uppfyllas/", "date_display": "2026-08-10", "date_iso": "2026-08-10T16:16:05+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "TV profile charged with aggravated drunken driving - had 2.38 alcohol in blood", "summary": "It was a morning in June that the police were alerted to southern Stockholm. A person had seen a man riding a motorcycle and falling several times on the road. When the witness approached the man, he reeked of alcohol and showed obvious signs of intoxication. When the police arrived at the scene, the man admitted that he had been drinking alcohol and that it was his motorcycle that was lying on the road, but he did not want to be recognized as having driven it. Beside him he had his broken motorcycle helmet. The man was taken into custody by the police in accordance with LOB, the law on the handling of intoxicated persons, and was accompanied to the police station.  Risking jail time Blood tests later showed he had a blood alcohol level of 2.38 per thousand at the time - well above the legal limit of 0.2 per thousand to drive a motor vehicle.  At such high levels, the body is strongly affected. According to Region Stockholm's Addiction Center, at around 2 parts per thousand, you can see double and have difficulty walking upright. At 3 parts per thousand, you risk losing consciousness.  The man, who has both created and participated in several television productions and also worked as an artist, is now charged with serious drunken driving. He denies any crime and has refused a penalty order in questioning, despite the knowledge that gross drunk driving can result in prison. The trial is expected to be held in the spring of 2027.", "title_original": "TV-profil åtalas för grovt rattfylleri – hade 2,38 promille i blodet", "summary_original": "Det var en förmiddag i juni som polisen larmades till södra Stockholm. En person hade sett en man köra motorcykel och ramla flera gånger på vägen. När vittnet gick fram till mannen stank han alkohol och visade uppenbara tecken på berusning. När polisen kom till platsen medgav mannen att han druckit alkohol och att det var hans motorcykel som låg på vägbanan, men han ville inte kännas vid att han hade kört den. Bredvid sig hade han sin trasiga motorcykelhjälm. Mannen omhändertogs av polisen enligt LOB, lagen om omhändertagande av berusade personer, och fick följa med till polisstationen.  Riskerar fängelse Blodprov visade senare att han hade 2,38 promille alkohol i blodet vid den aktuella tiden – långt över den lagliga gränsen på 0,2 promille för att få köra ett motordrivet fordon.  Vid så höga nivåer påverkas kroppen kraftigt. Enligt Region Stockholms Beroendecentrum kan man vid omkring 2 promille se dubbelt och få svårt att gå upprätt. Vid 3 promille riskerar man att tappa medvetandet.  Mannen, som både har skapat och medverkat i flera tv-produktioner och dessutom arbetat som konstnär, åtalas nu för grovt rattfylleri. Han nekar till brott och har i förhör tackat nej till ett strafföreläggande, trots vetskapen om att grovt rattfylleri kan ge fängelse. Rättegången väntas hållas under våren 2027.", "link": "https://www.tv4.se/artikel/1cnpigF04VfW6a7JHHwHsV/tv4-profil-atalas-foer-grovt-rattfylleri-hade-2-38-promille-i-blodet", "date_display": "2026-08-10", "date_iso": "2026-08-10T15:59:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/rattfylleri", "/trafik"]}, {"id": 140, "title": "Over 100 dead in earthquake in Colombia", "summary": "The earthquake occurred at 07:34 in the morning local time at a depth of 96 kilometers and the epicenter of the quake was in San José del Palmar in the department of Chocó about 35 kilometers west-northwest of the city of Cartago. AFP writes that the earthquake caused buildings to shake in the capital Bogota and Ecuador's capital Quito, and that it was felt in the neighboring country of Panama. Nubia Carolina Cordoba-Curi, governor of the affected province of Chocó, warned on X of the risk of aftershocks. \"Although the epicenter was near San José del Palmar, there are injured people and extensive damage to buildings in the provincial capital Quibdó. We are already conducting a damage assessment and will publish the first official report shortly,\" she writes according to Reuters. Nine people have so far been confirmed dead in the province, according to local authorities. Stuck under the riots In the city of Cali, several people are said to be stuck under the riots after about 20 buildings collapsed, writes Colombian El País. Pictures from the city show buildings with cracks in the facade and others that have been completely demolished. According to Sky News, 27 people have died in the city, which is Colombia's third largest. In the city of Pereira, at least 47 people are said to have died, according to Sky News. Another three are said to have died in the city of Manizales, where one of the towers of the city's neo-Gothic cathedral also collapsed.  In the department of Antioquia, one person has died. The total death toll has risen to 111, according to the country's president, who has also declared a state of emergency.  In the capital, Bogotá, damage is said to be limited to cracks in facades and walls.  Six smaller airports in western Colombia have been damaged and stopped operations, writes TT with reference to the Colombian aviation authority. However, no tsunami warning has been issued after the earthquake.", "title_original": "Över 100 döda i jordskalv i Colombia", "summary_original": "Jordbävningen inträffade klockan 07.34 på morgonen lokal tid på ett djup av 96 kilometer och epicenter för skalvet var i San José del Palmar i departementet Chocó cirka 35 kilometer västnordväst om staden Cartago. AFP skriver att skalvet fick byggnader att skaka i huvudstaden Bogota samt Ecuadors huvudstad Quito, och att det ska ha känts av i grannlandet Panama. Nubia Carolina Cordoba-Curi, guvernör i den drabbade provinsen Chocó, varnade på X för risken för efterskalv. ”Trots att epicentrum låg nära San José del Palmar finns det skadade personer och omfattande skador på byggnader i provinshuvudstaden Quibdó. Vi genomför redan en skadebedömning och kommer att publicera den första officiella rapporten inom kort”, skriver hon enligt Reuters. Nio personer har hittills bekräftats döda i provinsen, enligt lokala myndigheter. Fast under rasmassorna I staden Cali ska flera personer vara fast under rasmassorna efter att ett 20-tal byggnader rasat samman, skriver colombianska El País. På bilder från staden syns byggnader med sprickor i fasaden och andra som raserats helt. Enligt Sky News har 27 människor omkommit i staden, som är Colombias tredje största. I staden Pereira ska minst 47 personer ha omkommit enligt Sky News. Ytterligare tre uppges ha dött i staden Manizales där ett av tornen på stadens neogotiska katedral också vält.  I departementet Antioquia har en person omkommit. Den totala dödssiffran har stigit till 111, uppger landets president som också har utlyst katastrofläge.  I huvudstaden Bogotá uppges skadorna vara begränsade till sprickor i fasader och väggar.  Sex mindre flygplatser i västra Colombia har skadats och stoppat verksamheten, skriver TT med hänvisning till den colombianska luftfartsmyndigheten Ingen tsunamivarning har däremot gått ut efter jordbävningen.", "link": "https://www.tv4.se/artikel/7L2yZ3VvSLlaeOSitA2ykY/flera-doeda-i-kraftigt-jordskalv-i-colombia", "date_display": "2026-08-10", "date_iso": "2026-08-10T15:58:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/colombia", "/jordbavningar", "/naturkatastrof"]}, {"id": 141, "title": "Heat record in the tourist-dense area - again: \"Gloomy\"", "summary": "The summer heat in Western Europe breaks new records. Persistent high pressure in June and July has led to extensive forest fires, dried up rivers and deaths.  But the record heat comes as no surprise, as we continue to release record levels of carbon dioxide and other greenhouse gases into the atmosphere. - It is completely in line with the expectation we have of how the climate will react to these continued emissions, says Mathias Fridahl, researcher in climate policy and associate professor at Linköping University. Will exceed the target The temperature records recorded in July correspond to around 1.5 degrees of global warming – the limit agreed upon by the world's countries in the Paris Agreement to avoid the worst consequences of climate change. The limit is set for the year 2100. - We will exceed the temperature target and have worsened negative effects of this changed climate for a period until hopefully, if we work hard on climate change, in the long term we can also start to cool the planet so that we reach back to 1.5 degrees by 2100, says Mathias Fridahl. But getting there will be a big challenge. This requires, among other things, that emissions are reduced to close to zero. - We have to make sure that we end up at a level where the emissions we add to the atmosphere are balanced by absorption from the atmosphere. That we simply remove as much greenhouse gases as we add. When we get there, it will stabilize the temperature very quickly in the atmosphere, says Fridahl. Europe stands out Europe is warming faster than many other parts of the world, partly because of changes in the jet streams. At the same time, there are clear regional differences.  - We have actually had a colder average temperature than the average in northern Europe, i.e. northern Sweden, Finland and Norway, than the average for July. For Europe as a whole, it partially offsets the extreme heat waves we had in southwestern Europe, says Mathias Friberg. The cooler temperatures in the north may affect tourism.  - Of course it can", "title_original": "Värmerekord i turisttäta området – igen: ”Dystert”", "summary_original": "Sommarens värme i Västeuropa slår nya rekord. Ett ihållande högtryck under juni och juli har lett till omfattande skogsbränder, uttorkade floder och dödsfall.  Men rekordvärmen kommer inte som någon överraskning, eftersom vi fortsätter att släppa ut rekordnivåer av koldioxid och andra växthusgaser i atmosfären. – Det ligger helt i linje med den förväntan som vi har på hur klimatet ska reagera på de här fortsatta utsläppen, säger Mathias Fridahl, forskare inom klimatpolitik och docent vid Linköpings universitet. Kommer överskrida målet De temperaturrekord som noterades i juli motsvarar omkring 1,5 graders global uppvärmning – den gräns som världens länder enats om i Parisavtalet för att undvika de värsta konsekvenserna av klimatförändringarna. Gränsen är satt till år 2100. – Vi kommer att överskrida temperaturmålet och få förvärrade negativa effekter av det här förändrade klimatet  under en period tills vi förhoppningsvis, om vi jobbar stenhårt med klimatomställningen, på sikt också kan börja kyla planeten så att vi når tillbaka till 1,5 grader till 2100, säger Mathias Fridahl. Men att nå dit blir en stor utmaning. Det kräver bland annat att utsläppen minskar till nära noll. – Vi måste se till att vi hamnar på en nivå där de utsläpp som vi tillför atmosfären balanseras av upptag från atmosfären. Att vi helt enkelt städar bort lika mycket växthusgaser som vi tillför. Når vi dit kommer det att stabilisera temperaturen väldigt snabbt i atmosfären, säger Fridahl. Europa sticker ut Europa värms upp snabbare än många andra delar av världen, bland annat på grund av förändringar i jetströmmarna. Samtidigt finns tydliga regionala skillnader.  – Vi har faktiskt haft kallare medeltemperatur än genomsnittet i norra Europa, alltså norra Sverige, Finland och Norge, än genomsnittet för juli. För Europa i sin helhet väger det delvis upp de extrema värmeböljorna som vi haft i sydvästra Europa, säger Mathias Friberg. De svalare temperaturerna i norr kan påverka turismen.  – Det kan ju naturligtvis locka turister som vill komma undan de här extrema värmeböljorna på uppåt 40 grader.", "link": "https://www.tv4.se/artikel/5reFwFsZKzlwT4rCehisO1/vaermerekord-i-turisttaeta-omradet-igen-dystert", "date_display": "2026-08-10", "date_iso": "2026-08-10T14:09:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/vadret", "/klimat", "/klimatkrisen", "/klimatforandringar", "/klimatmalen", "/copernicus"]}, {"id": 142, "title": "Nooshi Dadgostar (V) took down posts about loving abortion", "summary": "Received criticism for its wording on social media", "title_original": "Nooshi Dadgostar (V) plockade ner inlägg om att älska abort", "summary_original": "Fick kritik för sin formulering på sociala medier", "link": "https://www.dagen.se/nyheter/nooshi-dadgostar-v-plockade-ner-inlaegg-om-att-aelska-abort/10472718", "date_display": "2026-08-10", "date_iso": "2026-08-10T12:38:22+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "The MP leader rages against M's petrol film: \"Harmful for Sweden\"", "summary": "On Sunday, the Moderates released three new election films, which the party hopes will set the tone for the issues to be debated in the run-up to the election: Economy and security. In one of the films, a woman stands and fills up with gas until she fills up the tank. \"Think about the click. Something more families should be able to afford,\" reads a subsequent text. The election film creates strong reactions in the Green Party. - The Tidö government has spent four years increasing emissions and locking the Swedish people into fossil fuel dependence. It is reprehensible, says one of the party's spokespersons, Daniel Helldén. Wants to increase state subsidies The Green Party wants to invest large amounts in the state budget to increase state subsidies for electric cars. The idea is to get more people to buy or lease electric cars. At the same time, they want to increase the reduction obligation, which means that renewable fuels are mixed into fossil fuels.  However, it will increase the price at the pump. - Fossils have been too cheap with this government, says Daniel Helldén. - We need to ensure that we bring in the renewables. They should talk about that, he says further. Isn't it reasonable that families with children should be able to afford to drive their fossil-powered car? - The reasonable thing is that we make sure that even families with children can afford to buy or lease an electric car. Those who need a car, especially those who live in sparsely populated and rural areas, should be able to buy or lease an electric car for cheap money.", "title_original": "MP-ledaren rasar mot M:s bensinfilm: ”Skadligt för Sverige”", "summary_original": "På söndagen släppte Moderaterna tre nya valfilmer, som partiet hoppas ska sätta tonen för de frågor som ska debatteras i valspurten: Ekonomi och säkerhet. I en av filmerna står en kvinna och tankar bensin tills hon tankat full tank. ”Tanka till klicket. Något fler familjer ska ha råd med”, står det i en påföljande text. Valfilmen skapar starka reaktioner hos Miljöpartiet. – Tidöregeringen har ägnat fyra års tid på att öka utsläppen och låsa fast svenska folket i ett fossilberoende. Det är förkastligt, säger partiets ena språkrör Daniel Helldén. Vill öka statens subventioner Miljöpartiet vill satsa stora belopp i statsbudgeten för att öka statens subventioner på elbilar. Tanken är att få fler att köpa eller leasa elbil. Samtidigt vill man öka reduktionsplikten, vilket innebär att förnybara bränslen blandas in i de fossila.  Det kommer dock att öka priset vid pump. – Det fossila har varit på tok för billigt med den här regeringen, säger Daniel Helldén. – Vi behöver se till att få in det förnybara. Det borde de prata om, säger han vidare. Är det inte rimligt att barnfamiljer ska ha råd att kunna köra sin fossildrivna bil? – Det rimliga är att vi ser till att även barnfamiljer har råd att köpa eller leasa en elbil. De som behöver bil, framför allt de som bor på gles- och landsbygd, ska kunna köpa eller leasa en elbil för billig penning.", "link": "https://www.tv4.se/artikel/3IHA2oIdWTsFraMYIWaNl/mp-ledaren-rasar-mot-m-s-bensinfilm-skadligt-foer-sverige", "date_display": "2026-08-10", "date_iso": "2026-08-10T12:00:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Valet 2026", "/valet-2026", "/valet-2022/miljopartiet", "/valet-2022/moderaterna", "/daniel-hellden"]}, {"id": 144, "title": "MP demands government seat: \"We hold talks with everyone\"", "summary": "The Green Party presented its election manifesto today, but also took the opportunity to repeat the demand that they be part of a possible future red-green government. - It is our experience that if you are to seriously take Sweden's politics in the direction you want to see, it is crucial that you are around the table where the decisions are made. So therefore we will be part of the government, and we will vote no to the governments that we are not part of, spokeswoman Amanda Lind said at a press conference in the Riksdag today. Talks with S Miljöpartiet were also asked if they are in talks with the Social Democrats about cooperation and ministerial posts. - We are in talks with all parties in the opposition and also with Magdalena Andersson. The Green Party's press service later announces in a clarification that the talks with other opposition parties so far \"are of a more general nature\". The election manifesto is based on three main points: climate, equality and nature. The Green Party states that they want to see large investments in, among other things, railways, public transport and reduced working hours. \"Can cooperate with everyone\" The Social Democrats are tight-lipped about possible discussions with the Green Party: \"We have been clear that we are going to the elections as a single party and can cooperate with all parties except the Sweden Democrats. We will not negotiate ministerial positions before the Swedish people have had their say on September 13,\" party secretary Tobias Baudin writes in a written statement to TV4 Nyheterna.", "title_original": "MP kräver regeringsplats: \"Vi för samtal med alla\"", "summary_original": "Miljöpartiet presenterade idag sitt valmanifest, men passade också på att upprepa kravet att de ska ingå i en eventuell framtida rödgrön regering. –Det är vår erfarenhet att ska man på allvar föra Sveriges politik i den riktning man vill se, så är det avgörande att man finns med runt bordet där besluten fattas. Så därför kommer vi att ingå i regering, och vi kommer att rösta nej till de regeringar som vi inte ingår i, sa språkröret Amanda Lind vid en pressträff i riksdagen idag. Samtal med S Miljöpartiet fick också frågan om de för samtal med socialdemokraterna om samarbete och ministerposter. – Vi för samtal med alla partier i oppositionen och även med Magdalena Andersson. Miljöpartiets presstjänst meddelar senare i ett förtydligande att samtalen med andra oppositionspartier än så länge \"är av mer generell natur\". Valmanifestet bygger på tre huvudpunkter: klimat, jämlikhet och natur. Miljöpartiet uppger att de vill se stora investeringar på bland annat järnvägar, kollektivtrafik och sänkt arbetstid. \"Kan samarbeta med alla\" Socialdemokraterna är förtegna om eventuella diskussioner med Miljöpartiet: ”Vi har varit tydliga med att vi går till val som enskilt parti och kan samarbeta med alla partier förutom Sverigedemokraterna. Vi förhandlar inte ministerposter innan svenska folket har fått säga sitt den 13 september\", skriver partisekreterare Tobias Baudin i ett skriftlig uttalande till TV4 Nyheterna.", "link": "https://www.tv4.se/artikel/6Tgry6HnNvCnMOyT9ThxWh/mp-kraever-regeringsplats-vi-foer-samtal-med-alla", "date_display": "2026-08-10", "date_iso": "2026-08-10T11:51:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Valet 2026", "/valet-2026", "/politik", "/valet-2022/miljopartiet", "/valet-2022/socialdemokraterna"]}, {"id": 145, "title": "This is how the war has changed: \"It is Iran's will that rules right now\"", "summary": "Since the war began, Iran's supreme leader Ayatollah Khamenei and several other high-ranking people have been killed, but the Iranian regime is still in power. At the same time, the strategically important Strait of Hormuz is still closed.  Between Iran and Oman, which is on the other side of the strait, however, discussions are ongoing about how it can be opened again and who would then control the passage. - This whole event has given Iran a strategic advantage and control over the world economy, the global energy markets and much more. On the other hand, we have the United States, which has a completely different view, says Atarodi.  The US wants the strait to be completely open and according to Atarodi, there is a good chance that the US has been telling Oman not to accept a mechanism that would give Iran control.  - It is Iran's will that rules right now, says Atarodi. \"Incredible demands that Iran makes\" Iran, in turn, has made several demands on the United States in order for the strait to be opened.  Among other things, Iran demands an end to the war in the region, that Iranian ports are no longer blocked, that American troops withdraw from the area, that sanctions be lifted, access to frozen assets and war reparations. - These are absolutely incredible demands that Iran makes, says Atarodi and adds: - Iran acts on the basis that they have control over the Strait of Hormuz, then they also make demands.  The new trend in the Middle East: Post-US The strait, where a large part of the world's oil usually passes, has been a big issue in the US and voices are being raised from different political quarters that Trump has lost the war. Trump claims that the US has partially changed its strategy and is now using a \"softened tactic\" against Iran. At the same time, the American actions in the war have led to several of the country's allies in the region reassessing their relationship with the United States. In countries such as Qatar, Bahrain and Jordan, the US has had military bases in the past.  - But when the war came, none of these countries were consulted. It's a new trend, you could say it's post-US in Mel", "title_original": "Så har kriget förändrats: ”Det är Irans vilja som styr just nu”", "summary_original": "Sedan kriget inleddes har bland annat Irans högsta ledare ayatolla Khamenei och flera andra högt uppsatta personer dödats, men den iranska regimen sitter alltjämt kvar vid makten. Samtidigt är det strategiskt viktiga Hormuzsundet fortfarande stängt.  Mellan Iran och Oman, som ligger på andra sidan sundet, pågår dock diskussioner om hur det ska kunna öppnas igen och vem som i så fall skulle kontrollera genomfarten. – Hela den här händelsen har gett Iran en strategisk fördel och kontroll över världsekonomin, de globala energimarknaderna och mycket annat. Å andra sidan så har vi USA, som har en helt annan uppfattning, säger Atarodi.  USA vill att sundet ska vara helt öppet och enligt Atarodi finns det en stor chans att USA varit på Oman om att inte acceptera en mekanism som skulle ge Iran kontroll.  – Det är Irans vilja som styr just nu, säger Atarodi. ”Otroliga krav som Iran ställer” Iran har i sin tur ställt flera krav på USA för att sundet ska öppnas.  Bland annat kräver Iran ett slut på kriget i regionen, att iranska hamnar inte längre blockeras, att amerikanska trupper drar sig tillbaka från området, att sanktioner lyfts, tillgång till frusna tillgångar samt ett krigsskadestånd. – Det är helt otroliga krav som Iran ställer, säger Atarodi och tillägger: – Iran agerar utifrån att de har kontroll över Hormuzsundet, då ställer de också krav.  Nya trenden i Mellanöstern: Post-USA Sundet, där en stor del av världens olja vanligtvis passerar, har varit en stor fråga i USA och från olika politiska håll lyfts röster om att Trump förlorat kriget. Trump hävdar att USA delvis bytt strategi och nu använder sig av en ”dämpad taktik” mot Iran. Samtidigt har det amerikanska agerandet i kriget lett till att flera av landets allierade i regionen omvärderat sin relation till USA. I länder som Qatar, Bahrain och Jordanien har USA militära baser sedan tidigare.  – Men när kriget kom konsulterades inte något av de här länderna. Det är en ny trend, man kan säga att det är post-USA i Mellanöstern.  Flera länder har signerat försvarspakt En annan förändring i regionen är att  Saudiarabien, Pakistan och Turkiet ingått ett försvarsavtal, även Egypten uppges överväga att ansluta sig. Atarodi beskriver det som en intressant utveckling där länderna ställer sig frågande till om de verkligen kan lita på USA som en allierad.  – Kriget har visat att USA gör vissa bedömningar, vissa ageranden som inte tar hänsyn till de här länderna, säger Atarodi. Men exakt vad den nya alliansen kommer att ha för påverkan på regionen och situationen är oklar i nuläget.  – De här tre länderna kommer med varsin expertis. Turkiet är en stor modern armé med drönarteknik och mycket annat, Saudiarabien med kapital och Pakistan som är det enda land med  kärnvapen.", "link": "https://www.tv4.se/artikel/3JlgZDnFsvdA1EnnWS8xjF/sa-har-kriget-foeraendrats-det-aer-irans-vilja-som-styr-just-nu", "date_display": "2026-08-10", "date_iso": "2026-08-10T10:49:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/irankriget", "/iran", "/usa", "/saudiarabien", "/pakistan", "/turkiet", "/oman", "/hormuzsundet"]}, {"id": 146, "title": "How to succeed with preschool enrollment: \"The base for everything\"", "summary": "Starting preschool means a big change for most young children. New environments, routines and separation from parents can arouse both anxiety and anticipation. According to psychologist Reyhaneh Ahangaran, it is crucial that both children and parents have time to build trust in the educators. - It is not strange that you cry when you are left the first time. It's a small protest against being separated from their parent, but it doesn't have to mean that you don't enjoy preschool, she says. Children are different – ​​parents too. How schooling is experienced varies a lot. Some children are ready immediately, others need more time. But even parents react differently and first-time parents can feel extra nervous. - It's perfectly okay to feel nervous and maybe insecure yourself, but then you also have to find tricks to hold on and show that this is a new thing that's happening to us, says Reyhaneh Ahangaran. She emphasizes the importance of parents themselves feeling safe with the preschool and the teachers. What you signal yourself affects the child. Preparation makes a difference Preparing the child for the start can make it easier. Talking about preschool, playing in the yard or reading books on the subject are good ways to create positive expectations. For the very youngest, it is more about getting used to the environment than understanding what is going to happen. - A one-year-old doesn't understand much at all, but it's about giving the words and gradually getting used to the fact that other adults can also give comfort, she says. Collaborate with the educators If the anxiety is great, both in children and adults, it is important to talk to the educators. Many preschools offer feedback during the day, for example via SMS or pictures. But she reminds that children often have a great ability to adapt and can quickly get used to new routines and environments, even if it can feel tough at first. - This will be a new phase for both the child and the parents, she says.", "title_original": "Så lyckas du med inskolningen på förskolan: ”Basen för allt”", "summary_original": "Att börja på förskolan innebär en stor förändring för de flesta små barn. Nya miljöer, rutiner och separationen från föräldrarna kan väcka både oro och förväntan. Enligt psykologen Reyhaneh Ahangaran är det avgörande att både barn och föräldrar får tid att skapa tillit till pedagogerna. – Det är inte konstigt att man gråter när man blir lämnad första tiden. Det är en liten protest mot att bli separerad från sin förälder, men det behöver inte betyda att man inte trivs på förskolan, säger hon. Barn är olika – föräldrar också Hur inskolningen upplevs varierar mycket. Vissa barn är redo direkt, andra behöver längre tid. Men även föräldrar reagerar olika och förstagångsföräldrar kan känna extra nervositet. – Det är helt okej att man själv känner sig nervös och kanske osäker, men då måste man också hitta knep för att hålla i sig och visa att det här är en ny sak som händer oss, säger Reyhaneh Ahangaran. Hon betonar vikten av att föräldrar själva känner sig trygga med förskolan och pedagogerna. Det man själv signalerar påverkar barnet. Förberedelser gör skillnad Att förbereda barnet inför starten kan underlätta. Att prata om förskolan, leka på gården eller läsa böcker om ämnet är bra sätt att skapa positiva förväntningar. För de allra yngsta handlar det mer om att vänja sig vid miljön än att förstå vad som ska hända. – En ettåring förstår inte mycket alls, men det handlar om att ge orden och att gradvis vänja sig vid att även andra vuxna kan ge tröst, säger hon. Samarbeta med pedagogerna Om oron är stor, både hos barn och vuxna, är det viktigt att prata med pedagogerna. Många förskolor erbjuder återkoppling under dagen, till exempel via sms eller bilder. Men hon påminner om att barn ofta har en stor anpassningsförmåga och snabbt kan vänja sig vid nya rutiner och miljöer, även om det kan kännas tufft i början. – Det här blir en ny fas för både barnet och föräldrarna, säger hon.", "link": "https://www.tv4.se/artikel/6qURu7NwoB3IV0WoF3DnFt/sa-lyckas-du-med-inskolningen-pa-foerskolan", "date_display": "2026-08-10", "date_iso": "2026-08-10T10:03:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/forskola", "/forskolor", "/barn", "/psykologi"]}, {"id": 147, "title": "TV4 broadcasts from Way Out West 2026 - all artists and concerts", "summary": "Way Out West has for several years been one of the biggest highlights among festivals in Sweden. This year is no exception and the festival is basically completely sold out. Way Out West has increased its number of visitors several years in a row and last year a record 78,000 unique visitors visited the festival. This year, a series of major world artists will perform in Slottsskogen in Gothenburg, and the audience will, among other things, get to see Zara Larsson when she performs one of her biggest Swedish gigs ever. Here are the acts from Way Out West showing on TV4 Play THURSDAY 13 AUGUST\n14:30 David Ritschard (Flamingo)\n14:50 Yaeger (Linnaeus)\n16:40 Clipse (Flamingo)\n18:55 Zara Larsson (Flamingo)\n20:15 Moby (Azalea)\n21:40 The xx (Azalea)\n22:00 Cobrah (Linné) - (postponed - not shown live) FRIDAY 14 AUGUST\n14:30 Sara Parkman (Linnaeus)\n16:00 Nectar (Linnaeus)\n17:15 Now Genea (Flamingo)\n19:40 The Hives (Flamingo)\n23:00 The Cure (Flamingo) SATURDAY 15 AUGUST\n12:40 Hannes (Linnaeus)\n21:15 Terra (Linné) The list is updated with more concerts. Click here to watch the concerts for free in TV4 Play", "title_original": "TV4 sänder från Way Out West 2026 – alla artister och konserter", "summary_original": "Way Out West har under flera år varit en av de största höjdpunkterna bland festivaler i Sverige. I år är inget undantag och festivalen är i princip helt slutsåld. Way Out West har ökat sitt besökarantal flera år i rad och i fjol besökte rekordmånga 78 000 unika besökare festivalen. I år uppträder en rad stora världsartister i Slottsskogen i Göteborg och publiken kommer bland annat att få se Zara Larsson när hon gör en av sina största svenska spelningar någonsin. Här är akterna från Way Out West som visas på TV4 Play TORSDAG 13 AUGUSTI\n14:30 David Ritschard (Flamingo)\n14:50 Yaeger (Linné)\n16:40 Clipse (Flamingo)\n18:55 Zara Larsson (Flamingo)\n20:15 Moby (Azalea)\n21:40 The xx (Azalea)\n22:00 Cobrah (Linné) -  (eftersänds - visas ej live) FREDAG 14 AUGUSTI\n14:30 Sara Parkman (Linné)\n16:00 Nektar (Linné)\n17:15 Nu Genea (Flamingo)\n19:40 The Hives (Flamingo)\n23:00 The Cure (Flamingo) LÖRDAG 15 AUGUSTI\n12:40 Hannes (Linné)\n21:15 Terra (Linné) Listan uppdateras med fler konserter. Klicka här för att se konserterna gratis i TV4 Play", "link": "https://www.tv4.se/artikel/3rv3qxekXq1dHzzHQeZ7fs/tv4-saender-fran-way-out-west-2026-alla-artister-och-konserter", "date_display": "2026-08-10", "date_iso": "2026-08-10T09:56:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["TV", "/tv", "/musik", "/way-out-west", "/personer/zara-larsson", "/the-hives", "/the-cure"]}, {"id": 148, "title": "Prices halved - then more and more people choose public transport", "summary": "The halved price of monthly passes in public transport seems to have made many people buy tickets. A circular from TV4 Nyheterna shows that sales of 30-day tickets have increased in several regions. In Västra Götaland and Uppsala, sales in July increased by 294 and 148 percent, respectively, compared to the same month last year. The same trend can also be seen in, for example, Kronoberg, Sörmland and Värmland. Stockholm takes off for more travelers In Stockholm, just over half a million people bought a monthly pass in July, more than twice as many as in July the previous two years. In Region Stockholm, they are now preparing for more travelers this autumn. - For one thing, we had previously made the decision to expand public transport with 100,000 more departures for 2026 and much of that is rolling out now in August, and on top of that we are contributing an extra SEK 100 million to meet the increased travel that the halving of the price of public transport will likely lead to, says Jakop Dalunde (MP), traffic regional councilor Region Stockholm. Not everyone is attracted by the price reduction Whether the price reduction actually leads to more people traveling by public transport remains to be seen. Some state that they fit in when it is cheaper, but will not continue after the period. - During the cheap period yes, but not afterwards, says Marita Forsling. Others not attracted by the price reduction will stick to their habits. - I will just continue to take the car. It's easier for me. I can only go when I want and arrive when I want and so on, says William Stenberg.", "title_original": "Priserna halverade – då väljer allt fler kollektivtrafiken", "summary_original": "Det halverade priset på månadskort i kollektivtrafiken verkar ha fått många att köpa biljett. En rundringning från TV4 Nyheterna visar att försäljningen av 30-dagarsbiljetter ökat i flera regioner. I Västra Götaland och Uppsala ökade försäljningen i juli med 294 respektive 148 procent jämfört med samma månad i fjol. Samma trend syns även i exempelvis Kronoberg, Sörmland och Värmland. Stockholm tar höjd för fler resenärer I Stockholm köpte drygt en halv miljon personer ett månadskort i juli, mer än dubbelt så många som i juli de två föregående åren. I Region Stockholm förbereder man sig nu för fler resenärer i höst. – Dels så hade vi sedan tidigare fattat beslutet om att bygga ut kollektivtrafiken med 100 000 fler avgångar för 2026 och mycket av det rullar ut nu i augusti och ovanpå det tillskjuter vi extra 100 miljoner kronor för att möta det ökande resande som halveringen av priset på kollektivtrafiken sannolikt leder till, säger Jakop Dalunde (MP), trafikregionråd Region Stockholm. Alla lockas inte av prissänkningen Om prissänkningen faktiskt leder till att fler reser kollektivt återstår att se. Vissa uppger att de passar på när det är billigare, men inte kommer att fortsätta efter perioden. – Under den billiga perioden ja, men inte efteråt, säger Marita Forsling. Andra lockas inte av prissänkningen kommer hålla fast vid sina vanor. – Jag kommer bara fortsätta ta bilen. Det är smidigare för mig. Jag kan bara åka när jag vill och komma fram när jag vill och så vidare, säger William Stenberg.", "link": "https://www.tv4.se/artikel/3rFvd3wo1MFSCeLl2pbaqM/priserna-halverade-da-vaeljer-allt-fler-kollektivtrafiken", "date_display": "2026-08-10", "date_iso": "2026-08-10T09:39:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/sl", "/tidopartier", "/kollektivtrafik", "/valet-2026", "/ekonomi"]}, {"id": 149, "title": "Escaping the flames with the dog Brewster: \"People have been amazing\"", "summary": "Luke Bruvold is one of the residents of the town of Summerland in Canada, which has been hit by a huge forest fire after a long period of hot and dry weather. When Bruvold was out playing with the dog Brewster yesterday, fire smoke suddenly appeared, and soot began to drift down. - We started watering all the dead grass around our place. At three o'clock the police came and asked us to leave the area. And we've been here ever since, Luke Bruvold told the Reuters news agency. 'Man's worst nightmare' Here is Penticton's trade and conference center, which is hosting many of the 20,000 Canadians who have been ordered to evacuate by authorities. The state of British Columbia has declared a state of emergency and over 2,000 people are fighting to bring the fire under control. The state's prime minister describes the fire as uncontrolled and that it is currently so extensive that it creates its own weather systems with lightning, which further contributes to the spread. - This is many people's worst nightmare. And as an organization, it's one of the most challenging fires we've ever faced, says David Eby, Premier of British Columbia at a press conference. Caught in the fire So far, one person has been confirmed dead in the fires, an 80-year-old woman who tried to escape from the Meadow Valley area. A further 50 people have been evacuated on 18 flights, after they were trapped behind the fire and unable to get out in any other way. 136 square kilometers of forest are burning right now. And the authorities warn that it is still very unclear when the evacuees will be able to return to their homes, and that more people may have to flee the fire. - Our appeal to the residents is to have everything ready at the door or in the car, so that they can leave at a moment's notice, says the mayor of the city of Peachland, Patrick van Minsel. \"Evacuating a whole city\" At Penticton's trade and conference center, Luke Bruvold and the dog Brewster try to take the situation in stride. And maybe even with the much talked about Canadian courtesy. - People have been fantastic. Long queues, but that", "title_original": "Flyr lågorna med hunden Brewster: ”Folk har varit fantastiska”", "summary_original": "Luke Bruvold är en av de boende i orten Summerland i Kanada, som drabbats av en enorm skogsbrand efter en lång period av varmt och torrt väder. När Bruvold igår var ute och lekte med hunden Brewster syntes plötsligt brandrök, och sot började singla ned. – Vi började vattna allt dött gräs runt vårt ställe. Klockan tre kom polisen och bad oss lämna området. Och vi har varit här sen dess, säger Luke Bruvold till nyhetsbyrån Reuters. \"Människors värsta mardröm\" Här är Pentictons handels- och konferenscenter som tar emot många av de 20 000 kanadensare som fått en evakueringsorder av myndigheterna. Delstaten British Columbia har utlyst nödläge och över 2000 personer kämpar med att få elden under kontroll. Delstatens premiärminister beskriver branden som okontrollerad och att den just nu är så omfattande att den skapar egna vädersystem med blixtar, som ytterligare bidrar till spridningen. – Det här är många människors värsta mardröm. Och som organisation så är det en av de mest utmanande bränderna vi någonsin ställts inför, säger David Eby, premiärminister i British Columbia på en presskonferens. Fångats av elden Hittills har en person bekräftats död i bränderna, en 80-årig kvinna som försökte fly från området Meadow Valley. Ytterligare 50 personer har blivit evakuerade med 18 flyg, efter att de fångats bakom elden och inte kunnat ta sig ut på något annat sätt. 136 kvadratkilometer skog brinner just nu. Och myndigheterna varnar för att det ännu är mycket oklart när de evakuerade kommer att kunna återvända till sina hem, och att fler kan behöva fly undan elden. – Vår uppmaning till invånarna är att ha allt redo vid dörren eller bilen, så att de kan åka på ett ögonblicks förvarning, säger staden Peachlands borgmästare Patrick van Minsel. \"Evakuerar en hel stad\" Vid Pentictons handels- och konferenscenter försöker Luke Bruvold och hunden Brewster ta situationen med ro. Och kanske även med den omtalade kanadensiska artigheten. – Folk har varit fantastiska. Långa köer, men det är väl väntat när man evakuerar en hel stad. Så vi väntar och går igenom processen. Och igår hade vi tur och fick bo på hotell, säger Luke Bruvold. Hunden Brewster fick visserligen inte komma in på hotellet, utan fick sova i bilen. Å andra sidan har volontärarbetarna skämt bort honom enligt husse. – Massor med mat, massor med godis och väldigt mycket klappande. Så Brewster känner sig som en liten rockstjärna just nu, säger Luke Bruvold.", "link": "https://www.tv4.se/artikel/23A0zLSLqQZaf9IAnxBvVR/flyr-lagorna-med-sin-hund-folk-har-varit-fantastiska", "date_display": "2026-08-10", "date_iso": "2026-08-10T08:46:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/skogsbrand", "/skogsbrander", "/kanada"]}, {"id": 150, "title": "Nooshi Dadgostar: \"Should have been checked in a better way\"", "summary": "In the past week, Expressen and Kvartal have revealed that two members of parliament for the Left Party sent supportive letters to Palestinians who were behind suicide bombings and murders. V leader Nooshi Dadgostar now answers in P1 Morgon's party leader interview. - Of course we should have controlled this in a better way. We would not have sent these letters on their part. \"Not aware\" Dadgostar is asked what checks the members did. - These are people we and I were not aware of, I will willingly admit, about what their exact actions have been, she says. - We should have checked what this external party told us. It has obviously been the intention of none of our members to support something like this. On the contrary, they were to point to flaws in Israel's handling of what is called administrative detention, that it captures young and elderly Palestinians on arbitrary grounds. Claims to be \"completely confident\" When asked if Nooshi Dadgostar feels confident that no left-wing party elected this autumn has terrorist sympathies, she answers as follows: - I am completely confident about this. I am completely confident that everyone knows where the Left Party stands. We have people on the lists who represent us in a very good way.", "title_original": "Nooshi Dadgostar: ”Borde kontrollerat på ett bättre sätt”", "summary_original": "Expressen och Kvartal har under den senaste veckan avslöjat att två riksdagsledamöter för Vänsterpartiet skickat stöttande brev till palestinier som legat bakom självmordsbombningar och mord. V-ledaren Nooshi Dadgostar svarar nu i P1 Morgons partiledarintervju. – Självklart borde vi ha kontrollerat det här på ett bättre sätt. Vi skulle inte ha skickat de här breven från deras sida. ”Inte haft kännedom” Dadgostar får frågan om vilka kontroller ledamöterna gjorde. – Det här är personer vi och jag inte haft kännedom, ska jag villigt erkänna, om vad deras exakta handlingar har varit, säger hon. – Vi borde ha kollat vad den här externa parten sa till oss. Avsikten har självklart från ingen av våra ledamoter varit att stötta någonting sådant här. Tvärtom var de att peka på brister i Israels hantering av det som kallas administrativt förvar, att man tillfångatar unga och äldre palestinier på godtyckliga grunder. Säger sig vara ”helt trygg” På frågan om Nooshi Dadgostar känner sig säker på att inga vänsterpartister som väljs in i höst har terroristsympatier svarar hon så här: – Jag är helt trygg med detta. Jag är helt trygg med att alla vet var Vänsterpartiet står. Vi har personer på listorna som representerar oss på ett mycket bra sätt.", "link": "https://www.tv4.se/artikel/20Rg8sCo3XA23CBBqUsqf/nooshi-dadgostar-borde-kontrollerat-pa-ett-baettre-saett", "date_display": "2026-08-10", "date_iso": "2026-08-10T08:02:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Svensk politik", "/politik", "/sport", "/svensk-politik", "/valet-2022/vansterpartiet"]}, {"id": 151, "title": "Scientists warn of health trend: \"There are risks\"", "summary": "Blood glucose meters have previously been mainly used by people with diabetes. Now it has become a popular wellness product even among healthy people. The idea is to avoid variations in b
