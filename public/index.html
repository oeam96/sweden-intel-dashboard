splay": "2026-06-23", "date_iso": "2026-06-23T07:19:25+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Benjamin Dousa"]}, {"id": 76, "title": "Turning 80 – has followed Rögle since 1963", "summary": "He has had the same place since the new hall was inaugurated in 1983, but he started following Rögle long before that. Now Bert Inge Andersson turns 80.", "title_original": "Fyller 80 år – har följt Rögle sedan 1963", "summary_original": "Han har haft samma plats sen den nya hallen invigdes 1983, men han började följa Rögle långt innan dess. Nu fyller Bert Inge Andersson 80 år.", "link": "https://www.hd.se/familj/fyller-80-ar-har-foljt-rogle-sedan-1963/", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:19:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.hd.se/helsingborg/nya-agare-till-villa-0VZNR/", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:17:50+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Smashed cheeseburger with fried egg", "summary": "Today's dinner tip offers a juicy smash burger topped with melted cheddar, creamy mustard mayonnaise, tangy pickles and a freshly fried egg. A winning burger with both saltiness, acid and full flavor. See Stefan Ekengren's recipe", "title_original": "Smashad ostburgare med stekt ägg", "summary_original": "Dagens middagstips bjuder på en saftig smashburgare toppad med smält cheddar, krämig senapsmajonnäs, syrlig saltgurka och ett nystekt ägg. En vinnande burgare med både sälta, syra och fyllig smak. Se Stefan Ekengrens recept", "link": "https://www.tv4.se/artikel/1hNsK2bNCbQ8ou1voR6aSc/smashad-ostburgare-med-stekt-aegg", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:16:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/kokets-middag", "/koket", "/stefan-ekengren"]}, {"id": 79, "title": "The stock market falls over one percent", "summary": "", "title_original": "Börsen faller över en procent", "summary_original": "", "link": "https://www.svd.se/a/Bxkrll/borsen-faller-over-en-procent", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:13:56+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 80, "title": "The heat brings sky-high electricity prices", "summary": "The heat in Europe makes the air conditioner go into overdrive. And with mostly windless weather, electricity becomes extra expensive in the evening.", "title_original": "Hettan ger skyhöga elpriser", "summary_original": "Hettan i Europa får luftkonditioneringen att gå på högvarv. Och med närmast vindstilla väder blir elen extra dyr kvällstid.", "link": "https://www.dn.se/ekonomi/hettan-ger-skyhoga-elpriser/", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:10:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "The heat brings sky-high electricity prices", "summary": "The heat in Europe makes the air conditioner go into overdrive. And with mostly windless weather, electricity becomes extra expensive in the evening.", "title_original": "Hettan ger skyhöga elpriser", "summary_original": "Hettan i Europa får luftkonditioneringen att gå på högvarv. Och med närmast vindstilla väder blir elen extra dyr kvällstid.", "link": "https://www.sydsvenskan.se/ekonomi/hettan-ger-skyhoga-elpriser/", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:08:41+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "Mohamsson on the wretched situation: \"Release on election day\"", "summary": "The Liberals have long been under the parliamentary blockade in opinion polls, but party leader Simona Mohamsson believes that things will change this autumn. Both she and Busch answer yes to the question of whether the Liberals will clear the Riksdag barrier in the fall election. - Above all, I think it will drop on election day. It will prove quite decisive that we are needed for a bourgeois government. The equation is simple, we have been needed for every bourgeois government in modern times, says Mohamsson. \"Stronger than sexual drive\" The L leader goes on the attack against the Social Democrats. She thinks that S is jealous of the rich. \n\n- I understand that it is provocative to see billionaires buying ugly bags and riding private jets. But it is when people have chosen to invest in Sweden, to remain in Sweden and have brilliant companies in Sweden that we get more for our welfare. Then I think that this jealousy, which is mainly found in the Social Democrats, is almost stronger than the sexual drive, it is quite problematic, says Mohamsson. Votes of support and cooperation When asked about votes of support before the election, Busch answers that she wants to see votes for the blue-yellow team - and that the Liberals are an obvious part of that. She highlights the parties' joint investments in nuclear power, care queues and the fight against gun violence. - But if we are to win the voters' trust going forward, because we are behind now, we have to meet the voters where they are. They demand more social responsibility for Sweden. It is KD's home ground and to a great extent also the Liberals' home ground. I believe in a blue-yellow comeback and a very strong final sprint for Simona Mohamsson. Sweden needs what Mohamsson stands for, says Ebba Busch. At the same time, the cooperation within the Tidö parties has been questioned, among other things due to interpretations of a flirtation on the part of KD towards the Social Democrats and Magdalena Andersson. Mohamsson, however, denies that the collaboration would be threatened. - I feel very secure with our collaboration. We are the iron axis for welfare in the blue and yellow", "title_original": "Mohamsson om usla läget: ”Släpper på valdagen”", "summary_original": "Liberalerna har länge legat under riksdagsspärren i opinionsmätningarna, men partiledaren Simona Mohamsson tror att saker kommer att förändras i höst. Både hon och Busch svara ja på frågan om Liberalerna kommer klara riksdagsspärren i höstens val. – Framför allt tänker jag att det kommer släppa på valdagen. Det kommer visa sig rätt avgörande att vi behövs för en borgerlig regering. Ekvationen är enkel, vi har behövts för varje borgerlig regering under modern tid, säger Mohamsson. ”Starkare än sexualdriften” L-ledaren går till attack mot Socialdemokraterna. Hon menar att S är avundsjuka på de rika. \n\n– Jag förstår att det är provocerande att se miljardärer köpa fula väskor och åka privatjet. Men det är när människor har valt att investera i Sverige, att vara kvar i Sverige och har briljanta företag i Sverige som vi får mer till vår välfärd. Då tycker jag att den här missunnsamheten, som framför allt finns hos Socialdemokraterna nästan är starkare än sexualdriften, det är rätt problematisk, säger Mohamsson. Stödröster och samarbete På frågan om stödröster inför valet svarar Busch att hon vill se röster på det blågula laget – och att Liberalerna är en självklar del av det. Hon lyfter fram partiernas gemensamma satsningar på kärnkraft, vårdköer och kampen mot skjutvapenvåld. – Men ska vi vinna väljarnas förtroende framåt, för vi ligger ju under nu, måste vi möta väljarna där de är. De efterfrågar mer socialt ansvarstagande för Sverige. Det är KD:s hemmaplan och i mångt och mycket också Liberalernas hemmaplan. Jag tror på en blågul comeback och på en jättestark slutspurt för Simona Mohamsson. Sverige behöver det Mohamsson står för, säger Ebba Busch. Samtidigt har samarbetet inom Tidöpartierna ifrågasatts, bland annat på grund tolkningar om en flirt från KD:s sida till Socialdemokraterna och Magdalena Andersson. Mohamsson avfärdar dock att samarbetet skulle vara hotat. – Jag känner mig jättetrygg med vårt samarbete. Det är vi som utgör järnaxeln för välfärden i det blågula samarbetet som hade varit väldigt fattigt utan KD och utan L, säger hon.", "link": "https://www.tv4.se/artikel/OTrQYwdriLQDTiAhwithF/liberalerna-pressade-mohamsson-slaepper-pa-valdagen", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:05:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/almedalen-2026", "/ebba-busch", "/simona-mohamsson", "/valet-2022/kristdemokraterna", "/valet-2022/liberalerna"]}, {"id": 83, "title": "The estrogen deficiency has an explanation - in Sweden", "summary": "Sweden pays the least for estrogen drugs in Europe. This is one of the reasons for today's empty shelves in Swedish pharmacies. \"It is not possible to pressure the prices as the Swedish authorities have done,\" says Sofia Wallström, CEO of the Pharmaceutical Industry Association, Lif.", "title_original": "Östrogenbristen har en förklaring – i Sverige", "summary_original": "Sverige betalar minst för östrogenläkemedel i Europa. Det är en av orsakerna till dagens tomma hyllor på svenska apotek. ”Det går det inte att pressa priserna som svenska myndigheter har gjort”, säger Sofia Wallström, vd för Läkemedelsindustriföreningen, Lif.", "link": "https://www.svd.se/a/Gxj7lq/sverige-betalar-minst-for-ostrogen-i-europa-en-orsak-till-bristen", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:05:15+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 84, "title": "The accusation: Tesla is misleading the authorities", "summary": "Misleading data from Tesla was used as a basis for approval of its self-driving technology in the Netherlands, according to new information. At the same time, the function is now being tested in Sweden after approval by the Swedish Transport Agency.", "title_original": "Anklagelsen: Tesla vilseleder myndigheter", "summary_original": "Missvisande data från Tesla användes som underlag för godkännande av deras självkörande teknik i Nederländerna, enligt nya uppgifter. Samtidigt testkörs nu funktionen i Sverige efter prövning från Transportstyrelsen.", "link": "https://www.svd.se/a/xrQLAG/missvisande-data-fran-tesla-kan-vara-bakom-sjalvkorande-bilar-i-nacka", "date_display": "2026-06-23", "date_iso": "2026-06-23T07:03:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 85, "title": "Algeria turned – and crushed Jordan's chances", "summary": "Algeria turned a deficit into a 2-1 victory against Jordan in the FIFA World Cup. Jordan can therefore not progress, while Argentina is completely finished as group 3.", "title_original": "Algeriet vände – och grusade Jordaniens chanser", "summary_original": "Algeriet vände underläge till 2–1-seger mot Jordanien i fotbolls-VM. Jordanien kan därmed inte gå vidare, medan Argentina är helt klar som gruppetta.", "link": "https://www.sydsvenskan.se/sport/algeriet-vande-och-grusade-jordaniens-chanser/", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:55:09+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "The heat brings sky-high electricity prices", "summary": "The heat in Europe makes the air conditioner go into overdrive. And with mostly windless weather, electricity becomes extra expensive in the evening.", "title_original": "Hettan ger skyhöga elpriser", "summary_original": "Hettan i Europa får luftkonditioneringen att gå på högvarv. Och med närmast vindstilla väder blir elen extra dyr kvällstid.", "link": "https://www.hd.se/ekonomi/hettan-ger-skyhoga-elpriser/", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:35:50+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 87, "title": "\"Extend the Discrimination Act so that it fully applies to the Police as well.\"", "summary": "Young people with an ethnic background are subjected to police checks that are felt to be unfounded, writes the Discrimination Ombudsman, DO.", "title_original": "”Utvidga diskrimineringslagen så att den gäller fullt ut även för Polisen.”", "summary_original": "Ungdomar med etnisk bakgrund utsätts för polisiära kontroller som upplevs sakna grund, skriver Diskrimineringsombudsmannen, DO.", "link": "https://www.hd.se/opinion/aktuella-fragor/utvidga-diskrimineringslagen-sa-att-den-galler-fullt-ut-aven-for-polisen/", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:35:47+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 88, "title": "20,000 school students to make space safer", "summary": "Navigating the digital world safely is essential in today's society, but how do you teach children and young people about cyber security without scaring them? The answer is spelled Knäck koden, a national competition and educational initiative where students in all grades of elementary school learn to deal with digital threats through playful challenges, collaboration and this year's big theme: space.", "title_original": "20 000 skolelever ska göra rymden säkrare", "summary_original": "Att navigera säkert i den digitala världen är avgörande i dagens samhälle, men hur lär man barn och unga om cybersäkerhet utan att skrämma dem? Svaret stavas Knäck koden, en nationell tävling och utbildningssatsning där elever i grundskolans alla årskurser får lära sig att hantera digitala hot genom lekfulla utmaningar, samarbete och årets stora tema: rymden.", "link": "https://www.dn.se/ekonomi/20-000-skolelever-ska-gora-rymden-sakrare/", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:29:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 89, "title": "The heat brings sky-high electricity prices", "summary": "The heat in Europe makes the air conditioner go into overdrive. And with mostly windless weather, electricity becomes extra expensive in the evening.", "title_original": "Hettan ger skyhöga elpriser", "summary_original": "Hettan i Europa får luftkonditioneringen att gå på högvarv. Och med närmast vindstilla väder blir elen extra dyr kvällstid.", "link": "https://www.svd.se/a/K8Wr5y/hettan-ger-skyhoga-elpriser", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:28:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 90, "title": "Refreshing about being a child in a crazy adult world", "summary": "Ali Smith's new novel project is about a world where knowledge is controlled by the authorities. Johanna Käck thrives in a dystopia with an unusually good mood.", "title_original": "Uppfriskande om att vara barn i en crazy vuxenvärld", "summary_original": "Ali Smiths nya romanprojekt handlar om en värld där kunskap kontrolleras av myndigheterna. Johanna Käck trivs i en dystopi med ovanligt gott humör.", "link": "https://www.dn.se/kultur/uppfriskande-om-att-vara-barn-i-en-crazy-vuxenvarld/", "date_display": "2026-06-23", "date_iso": "2026-06-23T06:04:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 91, "title": "Electric cars are climbing in the EU", "summary": "Car sales in EU countries rose by 3.2 percent in May compared to the same month last year. The share of pure electric cars rose to 20 percent.", "title_original": "Elbilarna klättrar i EU", "summary_original": "Bilförsäljningen i EU-länderna steg med 3,2 procent i maj jämfört med samma månad i fjol. De rena elbilarnas andel steg till 20 procent.", "link": "https://www.sydsvenskan.se/ekonomi/elbilarna-klattrar-i-eu/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:43:22+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 92, "title": "Turned – and crushed Jordan's chances", "summary": "Algeria turned a deficit into a 2-1 victory against Jordan in the FIFA World Cup. Jordan can therefore not progress, while Argentina is completely finished as group 3.", "title_original": "Vände – och grusade Jordaniens chanser", "summary_original": "Algeriet vände underläge till 2–1-seger mot Jordanien i fotbolls-VM. Jordanien kan därmed inte gå vidare, medan Argentina är helt klar som gruppetta.", "link": "https://www.svd.se/a/8pRG8E/algeriet-vande-och-grusade-jordaniens-chanser", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:42:33+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 93, "title": "EKG: Caramels, \"Dallas\" and other goodies from the past", "summary": "Our housekeeper happens to be reading a book about nostalgia. Then it's cut.", "title_original": "EKG: Karameller, ”Dallas” och andra godsaker från förr", "summary_original": "Vår kåsör råkar läsa en bok om nostalgi. Då är det klippt.", "link": "https://www.dn.se/kultur/ekg-karameller-dallas-och-andra-godsaker-fran-forr/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Rapeseed fields unexpected gold mine of diversity", "summary": "Not only meadows and pastures are important for species richness. Rapeseed fields can unexpectedly benefit many species, research from the Swedish University of Agriculture shows.", "title_original": "Rapsfält oväntad guldgruva för mångfald", "summary_original": "Inte bara ängs- och betesmarker är viktiga för artrikedomen. Rapsfält kan gynna oväntat många arter, visar forskning från Sveriges lantbruksuniversitet.", "link": "https://www.sydsvenskan.se/sverige/rapsfalt-ovantad-guldgruva-for-mangfald/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:27:16+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Johanna Frändén: 'Mbappé against Messi' is becoming the best match in World Cup history", "summary": "The beloved Argentine had already thrown down the gloves. The embattled Frenchman needed no more to take up the fight. Kylian Mbappé versus Lionel Messi is increasingly emerging as the most iconic duel in modern World Cup history.", "title_original": "Johanna Frändén: ’Mbappé mot Messi’ håller på att bli VM-historiens bästa match", "summary_original": "Den älskade argentinaren hade redan kastat handskarna. Den omstridde fransmannen behövde inte mer för att ta upp kampen. Kylian Mbappé versus Lionel Messi framstår allt mer som den moderna VM-historiens mest ikoniska duell.", "link": "https://www.dn.se/sport/johanna-franden-mbappe-mot-messi-haller-pa-att-bli-vm-historiens-basta-match/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:22:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Haaland rowed home a historic victory for Norway", "summary": "EAST RUTHERFORD. \"Ro, ro, ro\" chanted tens of thousands of Norwegians in the stadium in New Jersey. And Norway very well rowed home the victory against Senegal after two goals by Erling Haaland. 3–2 were the final numbers and Norway is ready for the WC knockout tournament for the first time since 1998.", "title_original": "Haaland rodde hem en historisk seger för Norge", "summary_original": "EAST RUTHERFORD. ”Ro, ro, ro” skanderade tiotusentals norrmän på stadion i New Jersey. Och Norge rodde mycket riktigt hem segern mot Senegal efter två mål av Erling Haaland. 3–2 blev slutsiffrorna och Norge är klart för VM:s utslagsturnering för första gången sedan 1998.", "link": "https://www.dn.se/sport/haaland-rodde-hem-en-historisk-seger-for-norge/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:22:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Backs Hien after the criticism: \"He plays as long as I'm here\"", "summary": "The national team's support after the mistakes against the Netherlands • \"Love Isak\"", "title_original": "Backar Hien efter kritiken: ”Han spelar så länge jag är här”", "summary_original": "Förbundskaptenens stöd efter misstagen mot Nederländerna • ”Älskar Isak”", "link": "https://www.tv4.se/artikel/2RXi54yrGOcGA4zfPO8agF/backar-hien-efter-kritiken-han-spelar-sa-laenge-jag-aer-haer", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:07:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 98, "title": "New victory for France - after crazy weather chaos", "summary": "", "title_original": "Ny seger för Frankrike - efter galet väderkaos", "summary_original": "", "link": "https://www.tv4.se/artikel/2mgRDqlJTq7EW6WqCAR87B/ny-seger-foer-frankrike-efter-galet-vaederkaos", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:04:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 99, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.sydsvenskan.se/nya-agare-till-villa-DKG_q/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:02:25+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 100, "title": "112 square meter chain house in Staffanstorp sold for SEK 3,360,000", "summary": "", "title_original": "112 kvadratmeter stort kedjehus i Staffanstorp sålt för 3 360 000 kronor", "summary_original": "", "link": "https://www.sydsvenskan.se/112-kvadratmeter-stort-kedjehus-i-staffanstorp-salt-for-3-360-000-kronor/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:02:10+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "Kristofer Ahlström: Amanda Romare points out both the worst and second worst of Sommar", "summary": "When she's not in her own head, Amanda Romare is on the Bjäre Peninsula, but both parts are equally exhausting. Only the story of the sister brings relief. DN's Kristofer Ahlström has listened.", "title_original": "Kristofer Ahlström: Amanda Romare prickar in både det sämsta och näst sämsta med Sommar", "summary_original": "När hon inte befinner sig i sitt eget huvud är Amanda Romare på Bjärehalvön, men båda delarna är lika utmattande. Bara berättelsen om systern ger lindring. DN:s Kristofer Ahlström har lyssnat.", "link": "https://www.dn.se/kultur/kristofer-ahlstrom-amanda-romare-prickar-in-bade-det-samsta-och-nast-samsta-med-sommar/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:01:14+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "Kullagymnasiet's principal was bought out with ten months' salary", "summary": "At midsummer, Mattias Carlsson left his role as principal of Kullagymnasiet. Höganäs municipality bought him out for SEK 715,000.", "title_original": "Kullagymnasiets rektor köptes ut med tio månadslöner", "summary_original": "Vid midsommar lämnade Mattias Carlsson sin roll som rektor för Kullagymnasiet. Höganäs kommun köpte ut honom för 715 000 kronor.", "link": "https://www.hd.se/hoganas/kullagymnasiets-rektor-koptes-ut-med-tio-manadsloner/", "date_display": "2026-06-23", "date_iso": "2026-06-23T05:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "The pain in the stomach was cancer for Rickard, 57: \"Am I going to die now?\"", "summary": "57-year-old Rickard Fredlund in Uppsala was affected by rectal cancer in the fall of 2022. - It started with pain in the stomach and after a while I had blood in the stool. After an examination, the cancer was found, he says.  The illness notice turned life completely upside down. - I thought, well, I'm going to die now. It was a big shock and I barely remembered anything from when I got the news about the disease, says Rickard Fredlund. More and more are affected Every year approximately 7,500 people in Sweden are affected by colon and rectal cancer.  From 2022, everyone between the ages of 60 and 74 will be called to screening, a sample, in order to detect this cancer at an early stage. But recent statistics show that participation in bowel cancer screening among men in northern Sweden in particular is low - almost 4 out of 10 men in the northern parts of the country neglect to take the test. - It is difficult to explain exactly why it looks like this. But in general it can be said that men in northern Sweden care less about their health than in the rest of the country, says Olof Sjöström, chief surgeon at Östersund Hospital and member of the national working group for colon and rectal cancer screening.  Then the chances are good. The screening consists of a test that you do at home on your own by collecting a stool sample which is then sent for analysis. If the sample shows signs of, for example, blood, you will be called to the healthcare system for a bowel examination.  - If we find the disease in what we call stage one, i.e. early, then nine out of ten survive. If the cancer has time to spread, it may be too late so nothing can be done, says chief physician Olof Sjöström. After radiation, chemotherapy and surgery, Rickard Fredlund finally managed to get rid of his cancer. But he still goes for checks and still doesn't dare to exhale completely. He urges everyone who gets the opportunity to undergo the screening to detect the cancer in time. - I think it is extremely important, it can be completely life-changing, he says.", "title_original": "Värken i magen var cancer för Rickard, 57: ”Ska jag dö nu?”", "summary_original": "57-årige Rickard Fredlund i Uppsala drabbades av ändtarmscancer hösten 2022. – Det började med värk i magen och efter ett tag fick jag blod i avföringen. Efter undersökning konstaterades cancern, säger han.  Sjukdomsbeskedet gjorde att tillvaron vändes totalt upp och ner. – Jag tänkte, jaha ska jag dö nu. Det var en stor chock och jag kom knappt ihåg något från när jag fick beskedet om sjukdomen, säger Rickard Fredlund. Allt fler drabbas Varje år drabbas ungefär 7 500 personer i Sverige av tjock- och ändtarmscancer.  Sedan 2022 kallas alla mellan 60 och 74 år till screening, en provtagning, för att man ska upptäcka denna cancer i ett tidigt stadie. Men färsk statistik visar att deltagandet i tarmcancerscreening bland män i framför allt norra Sverige är lågt – nästan 4 av 10 män i norra delarna av landet struntar i att göra testet. – Det är svårt att förklara exakt varför det ser ut så här. Men generellt kan man säga att män i norra Sverige bryr sig mindre om sin hälsa än i övriga landet, säger Olof Sjöström, överläkare kirurgi vid Östersunds sjukhus och medlem i nationella arbetsgruppen för tjock- och ändtarmscancerscreening.  Då är chanserna goda Screeningen består av ett test som man gör hemma på egen hand genom att samla in ett avföringsprov som sedan skickas för analys. Om provet visar tecken på exempelvis blod blir du kallad till sjukvården för tarmundersökning.  – Om vi hittar sjukdomen i det vi kallar för stadie ett, alltså tidigt, då överlever nio av tio. Om cancern hinner sprida sig så kan det vara för sent så det inte går att göra något, säger överläkaren Olof Sjöström. Efter strålning, cellgifter och operation lyckades Rickard Fredlund till slut få bort sin cancer. Men han går fortfarande på kontroller och vågar fortfarande inte andas ut helt. Han uppmanar alla som får möjlighet att genomgå screeningen för att upptäcka cancern i tid. – Jag tror det är extremt viktigt, det kan ju vara helt livsavgörande, säger han.", "link": "https://www.tv4.se/artikel/2nIEehopplyl1s7nvNWhlW/vaerken-i-magen-var-cancer-foer-rickard-57-ska-jag-doe-nu", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:30:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/sjukdomsfall", "/sjukdomar", "/cancer"]}, {"id": 104, "title": "The progress of the killer snail will be decided in the coming weeks", "summary": "It may be a quieter summer than usual for the country's garden enthusiasts - the number of killer snails appears to be fewer than in previous years. But the weather in the coming weeks could be decisive.", "title_original": "Mördarsnigelns framfart avgörs kommande veckor", "summary_original": "Det kan bli en lugnare sommar än vanligt för landets trädgårdsentusiaster – antalet mördarsniglar ser nämligen ut att bli färre än tidigare år. Men kommande veckors väder kan bli avgörande.", "link": "https://www.dn.se/sverige/mordarsnigelns-framfart-avgors-kommande-veckor/", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:26:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "Listen: Giant warehouse at Väla faces criticism", "summary": "", "title_original": "Lyssna: å flera platser i landet, visar DN:s kartläggning. – Det är svårt att ta in att det här händer oss, säger Jennie Otfors, 44, som bott större delen av livet i den lilla byn i Blekinge.", "link": "https://www.dn.se/sverige/stigande-hav-kan-tvinga-skargardsborna-pa-retratt-hander-det-har-verkligen-oss/", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:06:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "Lilian Sjölund: If the sea drowns the house, the view is not worth much", "summary": "The sea is rising faster than it has in thousands of years. 17 Swedish municipalities are identified as special risk areas. Some villages are even preparing a retreat from the idyll.", "title_original": "Lilian Sjölund: Om havet dränker huset är utsikten inte mycket värd", "summary_original": "Havet stiger snabbare än vad det gjort på tusentals år. 17 svenska kommuner pekas ut som särskilda riskområden. Vissa byar förbereder till och med en reträtt från idyllen.", "link": "https://www.dn.se/ledare/lilian-sjolund-om-havet-dranker-huset-ar-utsikten-inte-mycket-vard/", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:05:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Therefore, you should not bet on Friday", "summary": "Everything in life can be replayed. But betting leaves out perhaps our most important ability.", "title_original": "Därför ska du inte betta på fredag", "summary_original": "Allt mer i livet går att spela om. Men bettingen urlakar vår kanske viktigaste förmåga.", "link": "https://www.svd.se/a/0p3Vk0/vm-bettingen-urlakar-tittarens-viktigaste-formaga", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:05:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 110, "title": "Emil, 20, dropped out of high school - now a permanent employee at Ramlösa", "summary": "Production breaks records at the Ramlösa factory. And the doors are opening for more summer workers than ever before. Some of them will find their future at the factory.", "title_original": "Emil, 20, hoppade av gymnasiet – nu fast anställd på Ramlösa", "summary_original": "Produktionen slår rekord på Ramlösafabriken. Och dörrarna öppnas för fler sommarjobbare än någonsin. Några av dem lär hitta framtiden på fabriken.", "link": "https://www.hd.se/helsingborg/emil-20-hoppade-av-gymnasiet-nu-fast-anstalld-pa-ramlosa/", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:04:12+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "The gang leader wants to go home to Landskrona – the court lifts the stay ban", "summary": "The man belongs to a well-known family-based network in Landskrona. Now, several years behind bars for attempted murder, the former gang leader wants to return to the city - but the authorities say no. Now the case has gone all the way to the Supreme Court, which ruled the man right. Now, a miscarriage of justice could change everything.", "title_original": "Gängledaren vill hem till Landskrona– domstol river upp vistelseförbud", "summary_original": "Mannen tillhör ett välkänt släktbaserat nätverk i Landskrona. Nu, flera år bakom lås och bom för mordförsök, vill den tidigare gängledaren återvända till staden – men myndigheterna säger nej. Nu har fallet gått hela vägen till Högsta domstolen, som gett mannen rätt i sak. Nu kan ett rättegångsfel förändra allt.", "link": "https://www.hd.se/landskrona/gangledaren-vill-hem-till-landskrona-domstol-river-upp-vistelseforbud/", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:03:42+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "The progress of the killer snail will be decided in the coming weeks", "summary": "It may be a quieter summer than usual for the country's garden enthusiasts - the number of killer snails appears to be fewer than in previous years. But the weather in the coming weeks could be decisive.", "title_original": "Mördarsnigelns framfart avgörs kommande veckor", "summary_original": "Det kan bli en lugnare sommar än vanligt för landets trädgårdsentusiaster – antalet mördarsniglar ser nämligen ut att bli färre än tidigare år. Men kommande veckors väder kan bli avgörande.", "link": "https://www.svd.se/a/Exzl5A/mordarsnigelns-framfart-avgors-kommande-veckor", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:00:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 113, "title": "M's horror figure: Worst result in over seven years", "summary": "The moderates fall to their lowest level in over seven years, according to new figures from SvD/Demoskop. At the same time, the Christian Democrats continue to increase and reach their highest rating since just before the 2022 election.", "title_original": "M:s skräcksiffra: Sämsta resultatet på över sju år", "summary_original": "Moderaterna faller till sin lägsta nivå på över sju år, enligt nya siffror från SvD/Demoskop. Samtidigt fortsätter Kristdemokraterna att öka och når den högsta noteringen sedan strax före valet 2022.", "link": "https://www.svd.se/a/43RovV/matning-fran-svd-demoskop-moderaterna-far-samsta-resultatet-pa-over-sju-ar", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:00:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 114, "title": "The EU is stepping out of the US's shadow", "summary": "Europe's geopolitical situation looks brighter than just a few months ago. At the G7 meeting, clear solidarity was demonstrated.", "title_original": "EU kliver fram ur USA:s skugga", "summary_original": "Europas geopolitiska läge ser ljusare ut än bara för några månader sedan. På G7-mötet demonstrerades tydlig samhörighet.", "link": "https://www.svd.se/a/xrem0X/eu-kliver-fram-ur-usa-s-skugga", "date_display": "2026-06-23", "date_iso": "2026-06-23T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 115, "title": "\"What happens to the cabin we share if my brother dies?\"", "summary": "She shares a beloved summer cottage with her brother. But if he dies, his children inherit, and they will likely want to sell to get rid of the millions. How can she protect the cabin? Lawyer and family law expert Mia Edwall Insulander answers.", "title_original": "”Vad händer med stugan vi delar om min bror dör?”", "summary_original": "Hon delar en älskad sommarstuga med sin bror. Men om han dör ärver hans barn, och de kommer sannolikt vilja sälja för att få loss miljonerna. Hur kan hon skydda stugan? Advokat och familjerättsexpert Mia Edwall Insulander svarar.", "link": "https://www.dn.se/ekonomi/vad-hander-med-stugan-vi-delar-om-min-bror-dor/", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:40:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "\"For some, he is a dangerous role model\"", "summary": "How does a convicted eco-criminal become a role model for young men? That is the question in focus in SvD and Podme's new Badfluence series about Alexander Ernstberger.", "title_original": "”För vissa är han en farlig förebild”", "summary_original": "Hur blir en dömd ekobrottsling en förebild för unga män? Det är frågan i fokus i SvD och Podmes nya Badfluence-serie om Alexander Ernstberger.", "link": "https://www.svd.se/a/XMWbKg/alexander-ernstberger-fran-fangelse-till-grischikon", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:38:09+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 117, "title": "Owed 300 million - became an idol on Tiktok", "summary": "After the Allraskandalen, Alexander Ernstberger was sentenced to six years in prison, a ten-year business ban and hundreds of millions in damages. Then something unexpected happens. A new documentary tells the story of the entrepreneur who became a grisch icon.", "title_original": "Skyldig 300 miljoner – blev idol på Tiktok", "summary_original": "Efter Allraskandalen dömdes Alexander Ernstberger till sex års fängelse, tio års näringsförbud och hundratals miljoner i skadestånd. Då händer något oväntat. I en ny dokumentär berättas historien om entreprenören som blev grisch-ikon.", "link": "https://www.svd.se/a/XMdxMo/skyldig-300-miljoner-blev-idol-pa-tiktok", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:37:38+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 118, "title": "France victorious after weather chaos", "summary": "A severe storm forced the match between France and Iraq to be paused - but once the match started again, there was nothing that could stop the French's progress. The team won the match 3–0 and thus secured a place in the playoffs.", "title_original": "Frankrike segrare efter väderkaos", "summary_original": "Ett rejält oväder tvingade matchen mellan Frankrike och Irak till paus – men när matchen väl drog i gång igen var det inget som kunde stoppa fransosernas framfart. Laget tog hem matchen med 3–0 och har därmed säkrat en plats i slutspelet.", "link": "https://www.svd.se/a/ArGbqM/frankrike-i-storstilad-seger-efter-vaderdramatik", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:33:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 119, "title": "Norway ready for playoffs - Haaland hero again", "summary": "Norway continues to gain steam in the WC. After the 3–2 victory against Senegal in New Jersey, the country has advanced to the playoffs.", "title_original": "Norge klart för slutspel – Haaland hjälte igen", "summary_original": "Norge fortsätter att ånga på i VM. Efter 3–2-segern mot Senegal i New Jersey har landet avancerat till slutspel.", "link": "https://www.svd.se/a/L4W3qP/norge-klara-for-slutspel-haaland-hjalte-igen", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:30:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 120, "title": "Isobel Hadley-Kamptz: The war has come home to Moscow", "summary": "Things are not going very well for Vladimir Putin right now. In Moscow, Russians, having discovered that the war is no longer just far away, complain about their ruined vacations.", "title_original": "Isobel Hadley-Kamptz: Kriget har kommit hem till Moskva", "summary_original": "Det går inte särskilt bra för Vladimir Putin just nu. I Moskva klagar ryssar, som upptäckt att kriget inte längre bara pågår långt borta, över sina förstörda semestrar.", "link": "https://www.dn.se/ledare/isobel-hadley-kamptz-kriget-har-kommit-hem-till-moskva/", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:13:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Living \"the life of two boys\" after the transplant", "summary": "A twelve-year-old boy dies in a car accident. 30 years later, the best friend, Andreas Ekström, has to undergo a transplant. While waiting for a new liver, he reads the old letter from his friend's mother. Over and over again.", "title_original": "Lever ”två pojkars liv” efter transplantationen", "summary_original": "En tolvårig pojke dör i en bilolycka. 30 år senare måste bästisen, Andreas Ekström, göra en trans­plantation. I väntan på en ny lever läser han det gamla brevet från vännens mamma. Om och om igen.", "link": "https://www.svd.se/a/gkLbRa/bastisens-och-donatorns-dodsolyckor-forandrade-andreas-ekstrom", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:07:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Idagsidan"]}, {"id": 122, "title": "Nils Abenius: To love without having to be loved", "summary": "", "title_original": "Nils Abenius: Att älska utan att behöva bli älskad", "summary_original": "", "link": "https://www.dagen.se/familj/nils-abenius-att-aelska-utan-att-behoeva-bli-aelskad/10384887", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "How politicians talk about people affects how we see each other", "summary": "Our elected leaders have a responsibility not to let the fight for voter support take place at the expense of the trust that carries our common society, writes the presidium of Sweden's Christian Council.", "title_original": "Hur politiker talar om människor påverkar hur vi ser på varandra", "summary_original": "Våra folkvalda ledare har ett ansvar att inte låta kampen om väljarnas stöd ske på bekostnad av den tillit som bär vårt gemensamma samhälle, skriver presidiet för Sveriges kristna råd.", "link": "https://www.dagen.se/debatt/hur-politiker-talar-om-maenniskor-paverkar-hur-vi-ser-pa-varandra/10401306", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The restlessness is a sign that there is something bigger", "summary": "Per-Johan Thörn Wistrand has read The Wild Search by Sam Wohlin", "title_original": "Rastlösheten är ett tecken på att det finns något större", "summary_original": "Per-Johan Thörn Wistrand har läst Det vilda sökandet av Sam Wohlin", "link": "https://www.dagen.se/kultur/rastloesheten-aer-ett-tecken-pa-att-det-finns-nagot-stoerre/10397052", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Here, Bishop Erik Eckerdal declares peace over Almedal Week", "summary": "It's an election year and the churches' message in the opening service was to respect each other - even when you think differently", "title_original": "Här utlyser biskop Erik Eckerdal frid över Almedalsveckan", "summary_original": "Det är valår och kyrkornas budskap i den inledande gudstjänsten var att respektera varandra – även då man tycker olika", "link": "https://www.dagen.se/nyheter/haer-utlyser-biskop-erik-eckerdal-frid-oever-almedalsveckan/10406945", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Millions rain over Christian work with young people in Örnsköldsvik", "summary": "Will help young guys on the \"narrow way\" • \"God has put it on my heart.\"", "title_original": "Miljonregn över kristet arbete med ungdomar i Örnsköldsvik", "summary_original": "Ska hjälpa unga killar in på den ”smala vägen” • ”Gud har lagt det på mitt hjärta.”", "link": "https://www.dagen.se/nyheter/miljonregn-oever-kristet-arbete-med-ungdomar-i-oernskoeldsvik/10396209", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Here, Ebba Busch does like Martin Luther - nails his theses", "summary": "The KD leader sticks his chin out during the Almedal week by promising investment in \"soft issues\" and welfare over tax cuts", "title_original": "Här gör Ebba Busch som Martin Luther – spikar upp sina teser", "summary_original": "KD-ledaren sticker ut hakan under Almedalsveckan genom att lova satsningar på ”mjuka frågor” och välfärd framför skattesänkningar", "link": "https://www.dagen.se/nyheter/haer-goer-ebba-busch-som-martin-luther-spikar-upp-sina-teser/10407851", "date_display": "2026-06-23", "date_iso": "2026-06-23T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Norway ready for playoffs - Haaland hero again", "summary": "", "title_original": "Norge klara för slutspel – Haaland hjälte igen", "summary_original": "", "link": "https://www.tv4.se/artikel/tt-260623-fotvmnorge1-9b6480ca/norge-klara-for-slutspel-haaland-hjalte-igen", "date_display": "2026-06-23", "date_iso": "2026-06-23T02:03:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Senegal", "/senegal"]}, {"id": 129, "title": "Sold suicide kits online - to thousands of people", "summary": "When David Parfett follows the trail of his son Tom's death, he discovers something shocking. A website that openly sells suicide equipment online. Behind it is the Canadian chef Kenneth Law, who is suspected of being involved in upwards of 150 deaths in several countries. Now the prosecution against him is drawing strong criticism from the victims' relatives. Host: Simon Campanello. With: Sandra Stiskalo. Producer: Måns Mosesson.", "title_original": "Sålde självmordskit på nätet – till tusentals personer", "summary_original": "När David Parfett följer spåren efter sin son Toms död upptäcker han något chockerande. En hemsida som helt öppet säljer självmordsutrustning på nätet. Bakom den ligger den kanadensiska kocken Kenneth Law, som misstänks vara inblandad i uppemot 150 dödsfall i flera länder. Nu väcker åtalet mot honom stark kritik från offrens anhöriga. Programledare: Simon Campanello. Med: Sandra Stiskalo. Producent: Måns Mosesson.", "link": "https://www.dn.se/podd/spotlight/salde-sjalvmordskit-pa-natet-till-tusentals-personer/", "date_display": "2026-06-22", "date_iso": "2026-06-22T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "The warning to Russian tourists in Crimea: \"Bathing season is over\"", "summary": "\"We are ending the bathing season in Crimea\". This was stated by Ukraine's Ministry of Defense in a statement after it attacked several targets on the Russian-occupied Crimean Peninsula. According to the ministry, among other things, an oil depot, gas compressor stations and two anti-aircraft systems and radar installations were hit. \"The prognosis for tourists is unfavorable,\" it says. Russian summer camps for children are stopped According to the Kyiv Post, the statement is aimed at Russian tourists who plan to spend their summer holidays on the peninsula. Crimea has long been an established tourist destination for Russians and, since its annexation in 2014, has been important for Russian propaganda. - Many have had connections to Crimea for generations. During the Soviet era, there were many people who went there and vacationed. People know Crimea and want to go there, Kalle Kniivilä, a journalist at Sydsvenskan who has written several books about Russia and Ukraine, previously told TT. Russian-appointed governor Sergei Aksyonov also announced on Monday that some summer camps for children on the peninsula will be suspended until early September and that children already there will be sent home, according to the Kyiv Independent. \"This is just terrible\" The warning to bath-hungry Russian tourists and the announcement that summer camps for children are on hold comes after Ukraine stepped up its attacks on Russian infrastructure in Crimea. The new strategy, aimed at cutting off Russian supply lines, has led to a halt in petrol sales as well as road closures and transport halts - a serious blow to the peninsula's economy during the peak season. According to The Guardian, tens of thousands of Russians normally visit Crimea each year, and Yelena Shtringel, head of a travel agency, told the RBC news site that around 80 percent of bookings in June have been canceled and half of bookings for the other two summer months have been cancelled. \"I want to go back to Moscow. This is just terrible,\" says a Russian tourist in a video reported by The Guardian, after her train was derailed", "title_original": "Varningen till ryska turister på Krim: ”Badsäsongen är över”", "summary_original": "”Vi avslutar badsäsongen på Krim”. Det uppgav Ukrainas försvarsdepartement i ett uttalande efter att man attackerat flera mål på den ryskockuperade Krimhalvön. Enligt departementet träffades bland annat en oljedepå, gaskompressorstationer samt två luftvärnssystem och radaranläggningar. ”Prognosen för turister är ogynnsam”, står det vidare. Ryska sommarläger för barn stoppas Enligt Kyiv Post är uttalandet riktat till ryska turister som planerar att tillbringa sin sommarsemester på halvön. Krim är sedan länge ett etablerat turistmål för ryssar och har, sedan annekteringen 2014, varit viktigt för rysk propaganda. – Många har sedan generationer kopplingar till Krim. Under Sovjettiden var det väldigt många som åkte dit och semestrade. Krim känner man till och vill gärna åka till, har Kalle Kniivilä, journalist på Sydsvenskan som skrivit flera böcker om Ryssland och Ukraina, tidigare sagt till TT. Den rysktillsatte guvernören Sergej Aksjonov meddelade också under måndagen att vissa sommarläger för barn på halvön pausas till början av september och att barn som redan är på plats ska skickas hem, enligt Kyiv Independent. ”Det här är bara hemskt” Varningen till badsugna ryska turister och beskedet om att sommarlägren för barn pausas kommer efter att Ukraina intensifierat sina attacker mot rysk infrastruktur på Krim. Den nya strategin, som syftar till att slå ut ryska försörjningslinjer, har lett till försäljningsstopp av bensin samt till att vägar stängts och transporter stoppats – ett allvarligt slag mot halvöns ekonomi under högsäsongen. Enligt The Guardian besöker normalt tiotusentals ryssar Krim varje år och Yelena Shtringel, chef för en resebyrå, säger till nyhetssajten RBC att cirka 80 procent av bokningarna i juni har avbokats och att hälften av bokningarna för de två övriga sommarmånaderna har ställts in. ”Jag vill åka tillbaka till Moskva. Det här är bara hemskt”, säger en rysk turist i en video som The Guardian rapporterar om, efter att hennes tåg ställts in på halvön.", "link": "https://www.tv4.se/artikel/5QOYYQE48x3Ab8iE7tr6Mk/varningen-till-ryska-turister-pa-krim-badsaesongen-aer-oever", "date_display": "2026-06-22", "date_iso": "2026-06-22T20:39:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ukraina", "/krimhalvon", "/ryssland"]}, {"id": 131, "title": "Messi made history - top scorer at the World Cup of all time", "summary": "\"Just getting more and more legendary\"", "title_original": "Messi skrev historia – meste VM-målskytt genom tiderna", "summary_original": "”Blir bara mer och mer legendarisk”", "link": "https://www.tv4.se/artikel/2409ZhPayO3x6XuUV71eFd/messi-skrev-historia-meste-vm-malskytt-genom-tiderna", "date_display": "2026-06-22", "date_iso": "2026-06-22T19:44:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 132, "title": "Emma Bouvin: The world sees an incredible rescue - the mullahs a propaganda victory", "summary": "While Iran and the United States had a war of words in Switzerland, the Iranian national team battled Goliath, also known as Belgium, in Los Angeles. Football should not be political, it is said. But a super save by the goalkeeper quickly became a tool for Iran's chief negotiator.", "title_original": "Emma Bouvin: Världen ser en otrolig räddning – mullorna en propagandaseger", "summary_original": "Medan Iran och USA hade ordkrig i Schweiz, slogs det iranska landslaget mot Goliat, även kallat Belgien, i Los Angeles. Fotbollen ska inte vara politisk, sägs det. Men en superräddning av målvakt blev snabbt ett verktyg för Irans chefsförhandlare.", "link": "https://www.dn.se/varlden/emma-bouvin-varlden-ser-en-otrolig-raddning-mullorna-en-propagandaseger/", "date_display": "2026-06-22", "date_iso": "2026-06-22T19:34:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Two men are charged with threats - linked to the Nazi Aktivklubb", "summary": "Nazistiska Aktivklubb Sverige is linked to a new crime in the Stockholm subway. A leader and a member previously convicted of assault are charged with holding down a 17-year-old boy and pointing an object at his neck at the T-central.", "title_original": "Två män åtalas för hot – kopplas till nazistiska Aktivklubb", "summary_original": "Nazistiska Aktivklubb Sverige kopplas till ett nytt brott i Stockholms tunnelbana. En ledargestalt och en tidigare misshandelsdömd medlem åtalas för att ha hållit fast en 17-årig pojke och riktat ett föremål mot hans hals på T-centralen.", "link": "https://www.dn.se/sverige/tva-man-atalas-for-hot-kopplas-till-nazistiska-aktivklubb/", "date_display": "2026-06-22", "date_iso": "2026-06-22T19:32:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Dissatisfaction with Trump grows among Senate Republicans: \"Seems to enjoy chaos\"", "summary": "Ahead of the autumn's US mid-term elections, the division within the Republican Party is increasing. Several senators say they have lost confidence in President Donald Trump and are frustrated by his unpredictable actions. - Every time that happens, our chances of keeping the majority decrease, says Senator Thom Tillis.", "title_original": "Missnöjet med Trump växer bland senatens republikaner: ”Verkar njuta av kaos”", "summary_original": "Inför höstens amerikanska mellanårsval ökar splittringen inom det republikanska partiet. Flera senatorer säger att de har tappat förtroendet för president Donald Trump och är frustrerade över hans oförutsägbara agerande. – Varje gång det händer minskar våra chanser att behålla majoriteten, säger senator Thom Tillis.", "link": "https://www.dn.se/varlden/missnojet-mot-trump-vaxer-bland-senatens-republikaner-verkar-njuta-av-kaos/", "date_display": "2026-06-22", "date_iso": "2026-06-22T19:18:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Lionel Messi made World Cup history - top scorer ever", "summary": "ARLINGTON. It has been a special week for Lionel Messi. Parallel to the successful start at the soccer World Cup, the soon-to-be 39-year-old superstar has had his father wrongly declared dead on television. On Monday, the Argentine also became number one in the championship's historic shooting league.", "title_original": "Lionel Messi skrev VM-historia – främste målskytten någonsin", "summary_original": "ARLINGTON. Det har varit en speciell vecka för Lionel Messi. Parallellt med succéstarten på fotbolls-VM har den snart 39-årige superstjärnan fått sin pappa felaktigt dödförklarad i tv. På måndagen blev argentinaren dessutom nummer ett i mästerskapets historiska skytteliga.", "link": "https://www.dn.se/sport/lionel-messi-har-skrivit-vm-historia-framste-malskytten-nagonsin/", "date_display": "2026-06-22", "date_iso": "2026-06-22T19:07:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Poisonous fish threaten bathers at the Mediterranean Sea - can bite off fingers and toes", "summary": "Popular Mediterranean holiday resorts warn of a new species of fish that has found its way there. The speckled fish can bite off both fingers and toes and contains a harmful nerve toxin, The Telegraph reports.", "title_original": "Giftig fisk hotar badgäster vid Medelhavet – kan bita av fingrar och tår", "summary_original": "Populära semesterorter vid Medelhavet varnar för en ny fiskart som hittat dit. Den prickiga fisken kan bita av både fingrar och tår och innehåller ett skadligt nervgift, rapporterar The Telegraph.", "link": "https://www.dn.se/varlden/giftig-fisk-hotar-badgaster-vid-medelhavet-kan-bita-av-fingrar-och-tar/", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:50:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Swede André in \"fat prison\" in China: \"Punished in front of everyone\"", "summary": "29-year-old André Helgesen from Bromölla starts each day by standing on the scales. The result is sent out directly in a large group chat.\n\n- You must not hide, he says.\n\nHe is in what some on the internet call \"fat prisons\" - weight loss camps in China that have recently become very popular in the country. There, the participants follow a strict schedule of exercise, weigh-ins and a controlled diet. - At the training sessions, there is a count to see that everyone is there and you have to send out information about what you weigh. If a lesson or training session is cancelled, you must train yourself and post it in the chat. It's very military. \"A small dream for overweight people\" André Helgesen is on a backpacking trip in Asia after resigning from his job as a systems engineer in Örebro. When he learned that the camp in China existed, he was shocked.\n\n- It's a pipe dream for overweight people: \"How nice it would be if you could just go to a camp and focus fully on the training and let someone else take care of the diet and everything around it\". In this way, it is a bit of a dream come true. For SEK 9,000, he can stay at the camp for 28 days. One of the friends he has made there has been there for ten months. As a participant from abroad, you can to some extent come and go as you please - but according to André Helgesen, all Chinese, both children and adults, must relate to a \"full prison-like\" arrangement. - Then they have, for example, a guard who comes once a night and checks that everyone is in the room. And then it's a very tight schedule, so we don't really have time to go out. Similar to Biggest loser André Helgesen has basically been overweight all his life and has long wanted to reach a more normal weight. In Sweden, he has already lost 52 kilos on his own. After two weeks at the camp in China, where he went to challenge himself and put an end to his weight loss journey, he begins to feel tired in his body.  - It is very tough. You have to have forehead bones to recover", "title_original": "Svenske André på ”fat prison” i Kina: “Straffas framför alla”", "summary_original": "29-årige André Helgesen från Bromölla inleder varje dag med att ställa sig på vågen. Resultatet skickas direkt ut i en stor gruppchatt.\n\n– Du får inte gömma dig, säger han.\n\nHan befinner sig på det som vissa på internet kallar ”fat prisons” – viktminskningsläger i Kina som på senare tid har blivit väldigt populärt i landet. Där följer deltagarna ett strikt schema med träning, invägningar och kontrollerad kost. – På träningspassen är det uppräkning för att se att alla är där och man ska skicka ut information om vad man väger. Om någon lektion eller träningspass blir inställd ska man träna själv och lägga ut det i chatten. Det är väldigt militärligt. ”En smådröm för överviktiga” André Helgesen är på backpackingresa i Asien efter att ha sagt upp sig från jobbet som systemtekniker i Örebro. När han fick veta att lägret i Kina fanns blev han chockad.\n\n– Det är en smådröm för överviktiga: ”Vad nice det hade varit om man bara kunde åka till ett camp och fokusera fullt på träningen och låta någon annan sköta dieten och allt runtomkring”. På så sätt är det lite av en smådröm som går i uppfyllelse. För 9 000 kronor får han stanna på lägret i 28 dagar. En av vännerna han har lärt känna där har varit på plats i tio månader. Som deltagare från utlandet kan man i viss mån komma och gå som man vill – men enligt André Helgesen måste alla kineser, både barn och vuxna, förhålla sig till ett ”fullt fängelseliknande” upplägg. – Då har de till exempel en vakt som kommer en gång per kväll och kollar så att alla är på rummet. Och sen är det ju väldigt tajt schema, så vi hinner inte riktigt gå ut. Liknar Biggest loser André Helgesen har i princip varit överviktig hela sitt liv och har länge velat nå en mer normal vikt. I Sverige har han redan gått ner 52 kilo på egen hand. Efter två veckor på lägret i Kina, dit han åkte för att utmana sig själv och sätta punkt för sin viktminskningsresa, börjar han känna sig trött i kroppen.  – Det är väldigt tufft. Man måste ha pannben för att ta sig igenom det. Är man inte insatt kanske det inte är det smartaste. Samtidigt är det motiverande att man har betalat för det – då känns det mer värdefullt att faktiskt ge järnet. Enligt honom liknar lägret tv-programmet Biggest Loser. – Den som går ner minst i vikt straffas framför alla på söndagar. Det kan vara att hoppa 200 hopprep, det ska göras direkt framför gruppen. Man ska skämmas över att man har varit sämst.", "link": "https://www.tv4.se/artikel/14bKWoxcQ0Epm8GBjAHbV3/svenske-andre-pa-fat-prison-i-kina-straffas-framfoer-alla", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:44:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/utrikes", "/halsa", "/kina", "/viktnedgang"]}, {"id": 138, "title": "Tomas Ramberg: KD trapped in an increasingly cramped Tidöcage", "summary": "Ebba Busch draws the logical conclusion from the stubborn opinion polls. When the battle seems lost for Tidö, it is important to save himself and his own party. In his eagerness to keep his distance from Kristersson, the KD leader hints between the lines that the party could sit in an S-led government. An idea that both she and Magdalena Andersson are currently profiting from flirting with.", "title_original": "Tomas Ramberg: KD instängda i en allt trängre Tidöbur", "summary_original": "Ebba Busch drar den logiska slutsatsen av de envisa opinionsmätningarna. När slaget verkar förlorat för Tidö gäller det att rädda sig själv och det egna partiet. I sin iver att hålla distansen till Kristersson hintar KD-ledaren mellan raderna om att partiet kan sitta i en S-ledd regering. En idé som både hon och Magdalena Andersson just nu tjänar på att flirta med.", "link": "https://www.dn.se/sverige/tomas-ramberg-kd-instangda-i-en-allt-trangre-tidobur/", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:28:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "The industry critical of the new film policy: \"Disaster\"", "summary": "On Monday, the Tidö parties presented a new film policy proposal with a focus on reaching a wider audience and increasing the commercial impact. But the new direction is now met with criticism from the industry, which believes that there is a lack of resources to achieve the goals. - It will have enormous consequences for what was also raised at the press conference, that you want cinemas throughout the country to survive - that is not possible, says Anna Croneman, CEO of the Swedish Film Institute.  Fewer national targets In the bill, it was presented that the national film targets will be reduced from seven to three. The new goals are: 1. A wide selection of high-quality films is created and shown throughout the country.\n2. Swedish film attracts a large audience nationally and internationally.\n3. Film heritage is preserved and used. Fewer targets means culture minister Parisa Liljestrand (M) should keep politics at \"arm's length\". - Political control is reduced with these fewer targets. But it also means that we have a completely different opportunity to follow up film policy. - This is a way to meet Swedish film where it is today and enable a path forward for Swedish film, continues Culture Minister Parisa Liljestrand. Several proposals are scrapped In an investigation from last year, a reduced organic VAT was proposed to lower ticket prices. The Minister of Culture states that the issue is part of a budget process and that it is therefore not possible to say anything about it at the moment.  It was also announced that there will be no so-called \"Netflix tax\" for the streaming companies in Sweden, a measure that was proposed in the previous investigation. Nor is the establishment of a state film fund included in the new bill.  According to the government, even measures against illegal IPTV need to be further analyzed and investigated before they can possibly become a reality. \"A disaster for Swedish film\" Critical voices are heard from the industry, who believe that more resources are needed to be able to increase the commercial impact. - How it can become wider and reach a larger pu", "title_original": "Branschen kritisk mot nya filmpolitiken: ”Katastrof”", "summary_original": "Tidöpartierna presenterade under måndagen en ny filmpolitisk proposition med fokus på att nå en bredare publik och öka det kommersiella genomslaget. Men den nya riktningen möts nu av kritik från branschen, som menar att det saknas resurser för att uppnå målen. – Den kommer få enorma konsekvenser för det som man också lyfte på presskonferensen, att man vill att biograferna i hela landet ska leva – det är inte möjligt, säger Anna Croneman, vd Svenska Filminstitutet.  Färre nationella mål I propositionen presenterades det att de nationella filmmålen minskar från sju till tre. De nya målen är: 1. Ett brett filmutbud av hög kvalitet skapas och visas i hela landet.\n2. Svensk film lockar en stor publik nationellt och internationellt.\n3. Filmarvet bevaras och används. Färre antal mål menar kulturminister Parisa Liljestrand (M) ska hålla politiken på ”armlängds avstånd”. – Den politiska styrningen minskar med de här färre antalen mål. Men det gör också att vi har en helt annan möjlighet att följa upp filmpolitiken. – Det här är ju ett sätt att möta svensk film där den befinner sig idag och möjliggöra för en väg framåt för svensk film, fortsätter kulturminister Parisa Liljestrand. Flera förslag skrotas I en utredning från förra året föreslogs en sänkt biomoms för att sänka biljettpriserna. Kulturministern uppger att frågan ingår i en budgetprocess och att det därför inte går att säga något om det i nuläget.  Det meddelades även att det inte blir någon så kallad ”Netflix-skatt” för strömningsbolagen i Sverige, en åtgärd som föreslagits i den tidigare utredningen. Inte heller inrättandet av en statlig filmfond finns med i den nya propositionen.  Även åtgärder mot illegal ip-tv behöver enligt regeringen analyseras och utredas ytterligare innan de eventuellt kan bli verklighet. ”En katastrof för svensk film” Från branschen hörs kritiska röster, som menar att det behövs mer resurser för att kunna öka det kommersiella genomslaget. – Hur det ska kunna bli bredare och nå en större publik, med ännu färre filmer, det är liksom en ekvation som inte går ihop, säger Anna Croneman, vd Svenska Filminstitutet. Även skådespelerskan Helena Bergström är kritisk och säger att utvecklingen riskerar att göra branschen mer försiktig. – Det är kontraproduktivt. Man säger att man vill ha ett genomslag på biograferna men det som händer i branschen är att den blir så extremt ängslig, säger Helena Bergström. Hon ser negativt på filmens utveckling i Sverige och menar att den är på väg åt fel håll. – Den får inte en chans idag. Det är jättetråkigt och jag tror att det är en katastrof för svensk film.", "link": "https://www.tv4.se/artikel/5WnhyzoO9uOHUcwvjfO2cn/branschen-kritisk-mot-nya-filmpolitiken-katastrof", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:18:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/film", "/parisa-liljestrand", "/helena-bergstrom", "/svensk-film"]}, {"id": 140, "title": "Johan Esk: In the past the stars were beaten - Messi can do what he wants", "summary": "In the past, the biggest stars were beaten and kicked down the field. Lionel Messi has received completely different referee protection.", "title_original": "Johan Esk: Förr fick stjärnorna stryk – Messi får göra som han vill", "summary_original": "Förr fick de största stjärnorna stryk och sparkades ned på planen. Lionel Messi har fått helt annat domarskydd.", "link": "https://www.dn.se/sport/johan-esk-forr-fick-stjarnorna-stryk-messi-far-gora-som-han-vill/", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:12:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Blood Rot, part 3 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 3 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-3-av-57/", "date_display": "2026-06-22", "date_iso": "2026-06-22T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Therefore, the instructor is missing - transferred to the competitor", "summary": "Last week, the participants in the fall season of \"Elite strength secrets VIP\" were presented. The program is led as usual by former elite soldiers, but one of the four names was missing: Petra \"Pam\" Malm. The program's executive producer writes to TV4 Nyheterna that the production is \"very happy about Petra's efforts\". \"But she has now moved on to new assignments,\" writes Catrin Magnusson. In April, the elite soldier was presented together with the artist Marko Lehtosalo as the new presenter for \"The Company\", which returns to Kanal 5 and HBO Max this autumn. She replaces TV4 viewers can instead get to know the psychologist Ellinor. \"We are looking forward to a new season of the Elite Force with new recruits and an addition in the form of the psychologist Ellinor, who has experience in selecting people for special forces and operational units,\" writes Catrin Magnusson. Whether the change also applies to the regular version of the program remains to be seen. \"We will be able to tell you what the upcoming series of regulars looks like when it becomes relevant for a new such season,\" writes Ina Kokalari, press officer at TV4. Previously led Robinson Petra Malm broke through as one of the instructors in the secrets of the Elite Force, but was also the program manager for the autumn seasons of \"Robinson\" from 2022 to 2024. Before 2025, she could not participate in the adventure program and was replaced by Martin Järborg, who subsequently received continued trust. - He is greatly appreciated by the viewers, said Caroline Norrby, executive producer for Robinson on TV4, at the time. TV4 Nyheterna has searched for Petra Malm.", "title_original": "Därför saknas instruktören – gått över till konkurrenten", "summary_original": "I förra veckan presenterades deltagarna i höstens säsong av ”Elitstyrkans hemligheter VIP”. Programmet leds som vanligt av före detta elitsoldater, men ett av de fyra namnen saknades: Petra ”Pam” Malm. Till TV4 Nyheterna skriver programmets exekutiva producent att produktionen är ”jätteglada över Petras insatser”. ”Men hon har nu gått vidare till nya uppdrag”, skriver Catrin Magnusson. I april presenterades elitsoldaten tillsammans med artisten Marko Lehtosalo som ny programledare för ”Kompaniet” som återvänder till Kanal 5 och HBO Max i höst. Hon ersätter TV4-tittarna får i stället bekanta sig med psykologen Ellinor. ”Vi ser fram emot en ny säsong av Elitstyrkan med nya rekryter och ett tillskott i form av psykologen Ellinor som har erfarenhet av att välja ut personer till specialstyrkor och operativa förband”, skriver Catrin Magnusson. Om förändringen även gäller programmets ordinarie version återstår att se. ”Hur kommande upplägg av vanliga ser ut får vi berätta om när det blir aktuellt för en ny sådan säsong”, skriver Ina Kokalari, pressansvarig på TV4. Tidigare lett Robinson Petra Malm slog igenom som en av instruktörerna i Elitstyrkans hemligheter, men var även programledare för höstsäsongerna av ”Robinson” 2022 till 2024. Inför 2025 kunde hon inte medverka i äventyrsprogrammet och ersattes av Martin Järborg, som därefter fått fortsatt förtroende. – Han är jätteuppskattad av tittarna, sade Caroline Norrby, exekutiv producent för Robinson på TV4, då. TV4 Nyheterna har sökt Petra Malm.", "link": "https://www.tv4.se/artikel/6qLTwy0ppR8DD7ue9KHS3s/daerfoer-saknas-instruktoeren-gatt-oever-till-konkurrenten", "date_display": "2026-06-22", "date_iso": "2026-06-22T17:53:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/tv4", "/tv4-play", "/personer/petra-malm", "/elitstyrkans-hemligheter-sverige", "/elitstyrkans-hemligheter-vip"]}, {"id": 143, "title": "How to choose the right cat sitter - the expert warns against amateurs", "summary": "Finding someone who can take care of the cat during the holidays is not always easy - especially when more and more people are offering to look after animals via social media. But you need to think about it, according to cat behavior consultant Susanne Hellman Holmström. - You have to think a little \"what do I feel myself?\". Sometimes it might be better to leave to a good cat hotel. Then I know that I have left it to trained staff who have a permit where the cat can go out in a nice rest yard. Someone is watching all the time, so I can let it go, she says. \"Surely the same money\" A cat hotel can be perceived as expensive, but according to her there is a reason for it. - The law says in Sweden that you must supervise your cat twice a day. Of course, then you can leave it to an established cat sitter who comes to your home, but then it has to come home twice. It's probably the same money. Keep in mind that it should be educated people who come home, whom you can trust too. On social media, many people offer to look after animals, sometimes without experience. - They are welcome to play gold with it. But I would never hand over my key and say: \"Can you babysit my cat?\" What if the cat gets sick, can they see it? I would probably have been careful with that. Would it be possible to leave the cat to the ten-year-old girls next door? - Be careful. If a window or door is opened, the cat may escape. Different solutions for different cats What fits best depends on the cat's personality, she says. - Sometimes it is good to keep the cat at home, if you have a very sensitive and nervous cat. Then it might be good for it to be in its safe home. If you have a mischievous, young, extroverted cat, it's probably better for it to go to a cat hotel.  Many people think that the cat can fend for itself, but that is far from always true. - There may be another cat sitting in the territory who says: \"This is my territory. What are you doing here? Now I'm going to chase you away\". - There are far too many requests. Points out the key trick For those who want to be prepared, there is an unexpected", "title_original": "Så väljer du rätt kattvakt – experten varnar för amatörer", "summary_original": "Att hitta någon som kan ta hand om katten under semestern är inte alltid enkelt – särskilt när allt fler erbjuder sig att passa djur via sociala medier. Men det gäller att tänka efter, enligt kattbeteenderådgivaren Susanne Hellman Holmström. – Man får tänka lite ”vad känner jag själv?”. Ibland kan det vara bättre att lämna till ett bra katthotell. Då vet jag att jag lämnat till utbildad personal som har tillstånd där katten kan få gå ut i en fin rastgård. Någon har koll hela tiden, så kan jag släppa det, säger hon. ”Säkert samma pengar” Ett katthotell kan upplevas som dyrt, men enligt henne finns det skäl till det. – Lagen säger i Sverige att du måste ha tillsyn på din katt två gånger om dagen. Visst, då kan du lämna till en etablerad kattvakt som kommer hem till dig, men då måste den komma hem två gånger. Det är säkert samma pengar. Tänk på att det ska vara utbildade människor som kommer hem, som du kan lita på också. På sociala medier erbjuder sig många att passa djur, ibland utan erfarenhet. – De får gärna gulla med den. Men jag skulle aldrig lämna över min nyckel och säga: ”Kan du passa min katt?” Tänk om katten blir sjuk, kan de se det? Det hade jag nog varit försiktig med. Skulle man kunna lämna bort katten till de tioåriga tjejerna i grannhuset? – Var försiktig. Öppnas ett fönster eller en dörr så kanske katten smiter ut. Olika lösningar för olika katter Vad som passar bäst beror på kattens personlighet, menar hon. – Ibland är det bra att ha kvar katten hemma, om man har en väldigt känslig och nervös katt. Då kan det vara bra att den får vara i sitt trygga hem. Har man en busig, ung, extrovert katt är det nog bättre att den får åka till ett katthotell.  Många tänker att katten klarar sig själv, men det är långt ifrån alltid sant. – Det kan sitta en annan katt på reviret som säger: ”Det här är mitt revir. Vad gör du här? Nu ska jag jaga bort dig”. – Det är alldeles för många efterlysningar. Pekar ut nyckelknepet  För den som vill vara förberedd finns ett oväntat knep. – Det borde alla kattägare göra, säger hon. Hon visar upp en burk med päls från sin egen katt som hon kallar ”smeller”. Tanken är att man kan spåra katten om den försvinner med hjälp av spårhundar. – Skulle hon försvinna så kan man kontakta ID-hundar, som nosar på pälsen och kan följa spår och hitta katten, säger hon.", "link": "https://www.t
