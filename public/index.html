", "type": "News", "age_tag": "today", "tags": []}, {"id": 90, "title": "Researchers: Swedish priests used spells for several hundred years", "summary": "\"Asagudar can be mentioned to enhance the effect of the magical ritual.\"", "title_original": "Forskare: Svenska präster använde besvärjelser under flera hundra år", "summary_original": "”Asagudar kan nämnas för att förstärka effekten av den magiska ritualen.”", "link": "https://www.dagen.se/nyheter/forskare-svenska-praester-anvaende-besvaerjelser-under-flera-hundra-ar/10474218", "date_display": "2026-08-17", "date_iso": "2026-08-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 91, "title": "Roland Utbult on leaving the Riksdag – \"a feeling of liberation\"", "summary": "The musician and free church profile highlights the conflict between the personal conscience and the party whip when he gives thanks", "title_original": "Roland Utbult om att lämna riksdagen – ”en känsla av befrielse”", "summary_original": "Musikern och frikyrkoprofilen lyfter fram konflikten mellan det personliga samvetet och partipiskan då han tackar för sig", "link": "https://www.dagen.se/nyheter/roland-utbult-om-att-laemna-riksdagen-en-kaensla-av-befrielse/10481717", "date_display": "2026-08-17", "date_iso": "2026-08-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 92, "title": "\"Nick Cave has become my musical soul savior\"", "summary": "Wilhelm Blixt sees the rock icon perform at Way Out West: Sorrow is fully present, but transformed into something collectively hopeful", "title_original": "”Nick Cave har blivit min musikaliska själasörjare”", "summary_original": "Wilhelm Blixt ser rockikonen uppträda på Way Out West: Sorgen är fullt närvarande, men transformeras till något gemensamt hoppfullt", "link": "https://www.dagen.se/kultur/nick-cave-har-blivit-min-musikaliska-sjaelasoerjare/10481986", "date_display": "2026-08-17", "date_iso": "2026-08-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 93, "title": "Sanna Hill: American right-wing Christianity paves the way for Swedish right-wing extremism", "summary": "The far-right profile that dropped out: Boost after Trump's inauguration.", "title_original": "Sanna Hill: Amerikansk högerkristendom banar väg för svensk högerextremism", "summary_original": "Extremhögerprofilen som hoppade av: Boost efter Trumps makttillträde.", "link": "https://www.dagen.se/nyheter/sanna-hill-amerikansk-hoegerkristendom-banar-vaeg-foer-svensk-hoegerextremism/10474567", "date_display": "2026-08-17", "date_iso": "2026-08-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Brazil: At least eight dead in bus accident", "summary": "At least eight people have died in a bus accident in Rio de Janeiro, Brazil.", "title_original": "Brasilien: Minst åtta döda i bussolycka", "summary_original": "Minst åtta personer har omkommit i en bussolycka i Rio de Janeiro i Brasilien.", "link": "https://www.svd.se/a/8pxL4w/brasilien-minst-atta-doda-i-olycka", "date_display": "2026-08-16", "date_iso": "2026-08-16T23:38:04+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 95, "title": "Belgian fire no longer a threat to Germany", "summary": "The large fire that ravaged a natural area in eastern Belgium and that spread towards Germany on Sunday has stopped moving, Frankfurter Allgemeine reports on Monday.", "title_original": "Belgisk brand inte längre ett hot för Tyskland", "summary_original": "Den stora brand som härjat i ett naturområde i östra Belgien och som under söndagen spred sig mot Tyskland har slutat förflytta sig, rapporterar Frankfurter Allgemeine på måndagen.", "link": "https://www.svd.se/a/e76vpO/belgisk-brand-narmar-sig-tyskland", "date_display": "2026-08-16", "date_iso": "2026-08-16T23:16:45+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 96, "title": "\"Always have an empty bag with me when I travel\"", "summary": "Dancer and choreographer Karl Dyall, 59, is a \"movement geek\" who travels with a portable sandbag and prefers to train with tractor tires and sleds in his own barn.", "title_original": "”Har alltid med mig en tom säck när jag reser”", "summary_original": "Dansaren och koreografen Karl Dyall, 59, är en ”rörelsenörd” som reser med portabel sandsäck och helst tränar med traktordäck och slädar i sin egen lada.", "link": "https://www.svd.se/a/5pjjMX/har-alltid-med-mig-en-tom-sack-nar-jag-reser", "date_display": "2026-08-16", "date_iso": "2026-08-16T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 97, "title": "EC gold for Duplantis after drama: \"For grandma\"", "summary": "Pole vaulter Armand Duplantis won gold at the European Athletics Championships in Birmingham. The gold is \"Mondo's\" fourth in a row in the EC context. - It's for grandma, says Duplantis. The silver went to Duplanti's main competitor, the Greek Emmanouil Karalis.", "title_original": "EM-guld till Duplantis efter drama: ”För mormor”", "summary_original": "Stavhopparen Armand Duplantis tog guld vid friidrotts-EM i Birmingham. Guldet är ”Mondos” fjärde raka i EM-sammanhang. – Det är för mormor, säger Duplantis. Silvret gick till Duplantis främste konkurrent, greken Emmanouil Karalis.", "link": "https://www.hd.se/sport/em-guld-till-duplantis-efter-drama/", "date_display": "2026-08-16", "date_iso": "2026-08-16T22:00:57+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "Trump wants to reduce exercise: \"North Korea shows respect\"", "summary": "North Korea acts \"non-threateningly and with respect\", believes Donald Trump. The American president now wants to reduce joint military exercises together with South Korea.", "title_original": "Trump vill banta övning: ”Nordkorea visar respekt”", "summary_original": "Nordkorea agerar ”icke hotfullt och med respekt”, anser Donald Trump. Den amerikanske presidenten vill nu dra ned på gemensamma militärövningar tillsammans med Sydkorea.", "link": "https://www.svd.se/a/16x0Gq/trump-nordkorea-visar-respekt", "date_display": "2026-08-16", "date_iso": "2026-08-16T21:31:48+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 99, "title": "The perfect end point at the EC", "summary": "Fourth straight EC gold - Armand \"Mondo\" Duplantis set the perfect finish for Sweden in Birmingham. The world's best track and field athlete is unbeatable in championships in the 2020s. Main contender Karalis raises the level even further.", "title_original": "Den perfekta slutpunkten på EM", "summary_original": "Fjärde raka EM-guldet – Armand ”Mondo” Duplantis satte den perfekta slutpunkten för Sverige i Birmingham. Världens bästa friidrottare är oslagbar i mästerskap under 2020-talet. Främste utmanaren Karalis höjer nivån ytterligare.", "link": "https://www.svd.se/a/0pgzlG/armand-duplantis-guld-blev-den-perfekta-slutpunkten-pa-em", "date_display": "2026-08-16", "date_iso": "2026-08-16T21:23:27+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 100, "title": "Ireland: Teenagers drive into traffic - five dead", "summary": "Five teenagers have died in a traffic accident on a motorway in Ireland, after driving against the direction of travel.", "title_original": "Irland: Tonåringar körde mot trafiken – fem döda", "summary_original": "Fem tonåringar har omkommit i en trafikolycka på en motorväg i Irland, efter att ha kört mot färdriktningen.", "link": "https://www.hd.se/varlden/irland-tonaringar-korde-mot-trafiken-fem-doda/", "date_display": "2026-08-16", "date_iso": "2026-08-16T21:05:07+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "Ireland: Teenagers drive into traffic - five dead", "summary": "Five teenagers have died in a traffic accident on a motorway in Ireland, after driving against the direction of travel.", "title_original": "Irland: Tonåringar körde mot trafiken – fem döda", "summary_original": "Fem tonåringar har omkommit i en trafikolycka på en motorväg i Irland, efter att ha kört mot färdriktningen.", "link": "https://www.sydsvenskan.se/varlden/irland-tonaringar-korde-mot-trafiken-fem-doda/", "date_display": "2026-08-16", "date_iso": "2026-08-16T21:05:07+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "The EC bonus to Almgren and \"Mondo\" - over half a million each", "summary": "BIRMINGHAM. Andreas Almgren and Armand Duplantis not only each received a gold medal in the EC - they also took home over half a million each in bonus as winners in each category of the European Athletics Federation's so-called \"Gold crown\". - A nice bonus. Absolutely, says Almgren.", "title_original": "EM-bonusen till Almgren och ”Mondo” – över en halv miljon var", "summary_original": "BIRMINGHAM. Andreas Almgren och Armand Duplantis fick inte bara varsin guldmedalj i EM – de tog också hem över en halv miljon var i bonus som vinnare i varsin kategori av Europeiska friidrottsförbundets så kallade ”Gold crown”. – En fin bonus. Absolut, säger Almgren.", "link": "https://www.dn.se/sport/em-bonusen-till-almgren-och-mondo-over-en-halv-miljon-var/", "date_display": "2026-08-16", "date_iso": "2026-08-16T21:04:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Maja Åskag seventh - in a high-class long jump final", "summary": "It was a revenge-hungry Maja Åskag in the long jump final. She finished in seventh place in a high-class final.", "title_original": "Maja Åskag sjua – i en högklassig längdhoppsfinal", "summary_original": "Det var en revanschsugen Maja Åskag i längdhoppsfinalen. Hon slutade på en sjundeplats i en högklassig final.", "link": "https://www.dn.se/sport/maja-askag-sjua-i-en-hogklassig-langdhoppsfinal/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:50:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "\"Mondo\" after the European Championship gold: \"It has been as stressful as possible\"", "summary": "BIRMINGHAM. The EC gold that everyone had already counted on is at hand. Armand Duplantis won the men's pole vault after another fierce duel with the Greek Emmanouil Karalis. \"Mondo\" won the competition in 6.15 and can now move on after a tumultuous period in life.", "title_original": "”Mondo” efter EM-guldet: ”Har varit hur stressigt som helst”", "summary_original": "BIRMINGHAM. EM-guldet som alla redan hade räknat med är i hamn. Armand Duplantis vann herrarnas stavhopp efter en ny häftig duell med greken Emmanouil Karalis. ”Mondo” tog hem tävlingen på 6,15 och kan nu gå vidare efter en omtumlande period i livet.", "link": "https://www.dn.se/sport/guld-till-mondo-pressades-av-karalis-i-em-finalen/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:46:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "Armand Duplantis takes his fourth European Championship gold", "summary": "", "title_original": "Armand Duplantis tar sitt fjärde EM-guld", "summary_original": "", "link": "https://www.svd.se/a/JOLwXm/armand-duplantis-tar-em-guld", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:43:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 106, "title": "New EC gold for Armand Duplantis", "summary": "Armand Duplantis was the sky-high favorite before the pole vault final at the European Championships in Brimingham. The Swede lived up to the high expectations and took home the gold with a jump of 6.15 meters. But it was no easy gold for \"Mondo\". He was pushed hard during the final by the Greek Emmanouil Karalis, who this season reached new heights.  The gold was secured when Duplantis cleared 6.15 meters in the first attempt.  At that point, Karalis had just two saves to clear the height after clearing the first attempt at 6.10 meters by a hair's breadth. The Greek also broke at 6.15 meters and then chose to put everything on one card and save the last attempt at 6.20 meters to try to snatch the gold in front of Duplantis' eyes with a single jump. But it didn't go the way of Karalis, who tore himself away. The gold for Armand Duplantis – his eighth straight in an outdoor championship.  The bronze went to Baptiste Thiery from France. Duplantis, who has an intense competition schedule ahead, subsequently opted not to attempt the world record height of 6.32 meters. The medal was Sweden's fifth in the championship and the second gold. The goal in advance was to take over six medals to erase the record from the European Championships in Gothenburg 2006.", "title_original": "Nytt EM-guld till Armand Duplantis", "summary_original": "Armand Duplantis var skyhög favorit inför stavhoppsfinalen på EM i Brimingahm. Svensken motsvarade de högt ställda förväntningarna och plockade hem guldet med ett hopp på 6,15  meter. Men det blev inget lätt guld för ”Mondo”. Han pressades hårt under finalen av greken Emmanouil Karalis som den här säsongen nått nya höjder.  Guldet säkrades när Duplantis tog 6,15 meter i första försöket.  Vid det laget hade Karalis bara två sparade försök på sig att klara höjden efter att ha rivit första försöket på 6,10 meter med en hårsmån. Greken rev även på 6,15 meter och valde då att sätta allt på ett kort och spara det sista försöket till 6,20 meter för att med ett enda hopp försöka sno guldet framför ögonen på Duplantis. Men det gick inte vägen för Karalis som rev ut sig. Guldet till Armand Duplantis – hans åttonde raka i ett mästerskap utomhus.  Bronset gick till Baptiste Thiery från Frankrike. Duplantis, som har ett intensivt tävlingsschema framöver, valde därefter att avstå från att försöka på världsrekordhöjden 6,32 meter. Medaljen var Sveriges femte i mästerskapet och det andra guldet. Målet på förhand var att ta över sex medaljer för att radera ut rekordet från EM i Göteborg 2006.", "link": "https://www.tv4.se/artikel/2UCC7dybzPHQpVGntOC2dS/em-guld-till-armand-duplantis-som-pressades", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:43:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/sport", "/friidrott", "/armand-duplantis", "/friidrotts-em", "/stavhopp", "/birmingham"]}, {"id": 107, "title": "Government investigators: \"Remake Sis from the ground up\"", "summary": "A new authority should take over from the State Board of Institutions (Sis) and the special youth homes should be replaced with a new form of placement. This is what the government's special investigator writes on DN Debatt.", "title_original": "Regeringens utredare: ”Gör om Sis från grunden”", "summary_original": "En ny myndighet bör ta över från Statens institutionsstyrelse (Sis) och de särskilda ungdomshemmen ska ersättas med en ny placeringsform. Det skriver regeringens särskilda utredare på DN Debatt.", "link": "https://www.hd.se/sverige/regeringens-utredare-gor-om-sis-fran-grunden/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:10:26+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "Government investigators: \"Remake Sis from the ground up\"", "summary": "A new authority should take over from the State Board of Institutions (Sis) and the special youth homes should be replaced with a new form of placement. This is what the government's special investigator writes on DN Debatt.", "title_original": "Regeringens utredare: ”Gör om Sis från grunden”", "summary_original": "En ny myndighet bör ta över från Statens institutionsstyrelse (Sis) och de särskilda ungdomshemmen ska ersättas med en ny placeringsform. Det skriver regeringens särskilda utredare på DN Debatt.", "link": "https://www.sydsvenskan.se/sverige/regeringens-utredare-gor-om-sis-fran-grunden/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:10:26+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "After the Bondi crime: A quarter of a million guns to be redeemed", "summary": "The Australian state of New South Wales wants to redeem about 274,000 guns after the terrorist attack in Bondi Beach - but the plan is met with criticism.", "title_original": "Efter Bondi-dådet: Kvarts miljon vapen ska lösas in", "summary_original": "Den australiska delstaten New South Wales vill lösa in omkring 274 000 vapen efter terrordådet i Bondi Beach – men planen möts av kritik.", "link": "https://www.hd.se/varlden/efter-bondi-dadet-kvarts-miljon-vapen-ska-losas-in/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:09:23+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "After the Bondi crime: A quarter of a million guns to be redeemed", "summary": "The Australian state of New South Wales wants to redeem about 274,000 guns after the terrorist attack in Bondi Beach - but the plan is met with criticism.", "title_original": "Efter Bondi-dådet: Kvarts miljon vapen ska lösas in", "summary_original": "Den australiska delstaten New South Wales vill lösa in omkring 274 000 vapen efter terrordådet i Bondi Beach – men planen möts av kritik.", "link": "https://www.sydsvenskan.se/varlden/efter-bondi-dadet-kvarts-miljon-vapen-ska-losas-in/", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:09:23+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Forgotten Swede rules the world's monetary policy", "summary": "He was in prison for blasphemy. Refused to get married so as not to become his lover's guardian. His theory guides the monetary policy of central banks globally. Now the national economist Knut Wicksell is relevant again - in the USA.", "title_original": "Bortglömd svensk styr världens penningpolitik", "summary_original": "Han satt i fängelse för hädelse. Vägrade gifta sig för att inte bli sin kärestas förmyndare. Hans teori styr centralbankers penningpolitik globalt. Nu är nationalekonomen Knut Wicksell aktuell igen – i USA.", "link": "https://www.svd.se/a/Bxzyn7/radikalen-knut-wicksell-styr-varldens-rantor-hundra-ar-efter-sin-dod", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:03:04+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 112, "title": "As an observer, you are almost redundant", "summary": "Chiara Bugatti's art has great potential and a lot of integrity - so much so that you almost feel rejected. Joanna Persman has seen an exhibition at Marabou park that leads both right and wrong.", "title_original": "Som betraktare är man nästan överflödig", "summary_original": "Chiara Bugattis konst har stor potential och mycket integritet – så pass att man nästan känner sig avvisad. Joanna Persman har sett en utställning på Marabouparken som leder både rätt och fel.", "link": "https://www.svd.se/a/pBGnd6/recension-chiara-bugatti-pa-marabouparken", "date_display": "2026-08-16", "date_iso": "2026-08-16T20:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Konst", "Kultur"]}, {"id": 113, "title": "After the Bondi crime: A quarter of a million guns to be redeemed", "summary": "The Australian state of New South Wales wants to redeem about 274,000 guns after the terrorist attack in Bondi Beach - but the plan is met with criticism.", "title_original": "Efter Bondi-dådet: Kvarts miljon vapen ska lösas in", "summary_original": "Den australiska delstaten New South Wales vill lösa in omkring 274 000 vapen efter terrordådet i Bondi Beach – men planen möts av kritik.", "link": "https://www.svd.se/a/pBVOmW/efter-bondi-dadet-kvarts-miljon-vapen-ska-losas-in", "date_display": "2026-08-16", "date_iso": "2026-08-16T19:57:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 114, "title": "Three men executed on the same day - large increase in the death penalty in the United States", "summary": "On Thursday, three men convicted of murder were executed in the United States. The last time so many people were executed on the same day was 16 years ago. The number of executions has increased in the United States, reports the BBC. Last year, a total of 47 federal and state executions were carried out. The last time so many had their death sentence carried out was in 2009, when 52 people were executed, and compared to the year before, it is almost a doubling. According to the BBC, there are two key figures behind the increase in executions - US President Donald Trump and Florida Governor Ron DeSantis. Florida behind 40 percent of executions Trump has long advocated the death penalty. In 2020, during his first term, he lifted a nearly two-decade-long moratorium on federal executions by ordering 13 executions over the next six months.  The moratorium was reinstated when Joe Biden took office as president, but was lifted again by Trump on the first day of his second and current term as US president. - Being hard and tough is part of his political brand, so it is completely in line with how he communicates in general, says USA expert Andreas Utterström. In Florida, Governor Ron DeSantis has enacted laws that partly reduce the barriers to sentencing criminals to death, and partly make it easier to carry out the executions themselves. In 2025, the state accounted for nearly 40 percent of all executions in the United States. Trump does not lose: \"Emotion always beats numbers\" If the executions are popular in the eyes of the people, it is likely that there will be more, says Andreas Utterström. - American politicians are the world's most cynical people. If a governor sees that there is a chance to be re-elected if more people are executed, that too will happen. If you operate in a state where it is viable to be tough on crime, it can absolutely increase. He does not believe that Trump is losing out on the development. - Now you have a president who very rarely talks about the causes of crime but instead focuses on punishment. He has enough there", "title_original": "Tre män avrättade på samma dag – stor ökning av dödsstraff i USA", "summary_original": "I torsdags avrättades tre morddömda män i USA. Senast så många personer avrättades under en och samma dag var för 16 år sedan. Antalet avrättningar har ökat i USA, rapporterar BBC. Förra året genomfördes totalt 47 federala och delstatliga avrättningar. Senast så många fick sin dödsdom verkställd var 2009 då 52 personer avrättades, och jämfört med året innan är det nästan en dubblering. Enlig BBC finns det två nyckelfigurer bakom ökningen av avrättningar – USA:s president Donald Trump och Floridas guvernör Ron DeSantis. Florida bakom 40 procent av avrättningarna Trump har länge förespråkat dödsstraff. 2020, under sin första mandatperiod, rev han upp ett närmare två decennier långt moratorium mot federala avrättningar genom att beordra 13 avrättningar under det kommande halvåret.  Moratoriet återinfördes när Joe Biden tillträdde som president, men revs upp igen av Trump redan under första dagen på hans andra och nuvarande mandatperiod som USA:s president. – Att vara hård och tuff är ju en del av hans politiska varumärke, så det ligger helt i linje med hur han kommunicerar i övrigt, säger USA-experten Andreas Utterström. I Florida har guvernören Ron DeSantis stiftat lagar som dels minskar barriärerna för att döma brottslingar till döden, dels gör det lättare att utföra själva avrättningarna. Under 2025 stod delstaten för nästan 40 procent av alla avrättningar i USA. Trump förlorar inte: ”Känsla slår alltid siffror” Om avrättningarna är populära i folkets ögon är det sannolikt att de blir fler, säger Andreas Utterström. – Amerikanska politiker är världens mest cyniska människor. Om en guvernör märker att det finns en chans att bli omvalt om fler personer avrättas så kommer det också att ske. Om man verkar i en delstat där det är gångbart att vara hårdför mot kriminalitet kan det absolut öka. Han tror inte att Trump förlorar på utvecklingen. – Nu har man en president som väldigt sällan pratar om orsaker till brott utan istället fokuserar på bestraffning. Där har han nog många med sig. Om man upplever en känsla av otrygghet – vilket Trump är väldigt bra på att skapa – så spelar ingen roll om statistiken visar att brottsligheten sjunker. Känsla slår alltid siffror, säger Utterström. Inte samma sprängkraft som abortfrågan Dödsstraffen har alltid delat USA. Samtidigt har Andreas Utterström svårt att se att frågan om dödsstraff kan få väljare att byta politisk åskådning. – Det är en fråga där man är väldig oense, men den har inte samma sprängkraft som exempelvis abortfrågan.  – Hur syniskt det än må låta så tror jag att döden kommer som en befrielse för de här männen. Att sitta inlåst 23 timmar om dygnet tror jag är värre än att bli avrättad. De förhållandena som råder på de fängelserna är bortom vad vi kan föreställa oss, säger Andreas Utterström.", "link": "https://www.tv4.se/artikel/7x9jVaYVXpjJziJjbLYrtR/tre-morddoemda-avraettade-pa-samma-dag-stor-oekning-av-doedsstraff", "date_display": "2026-08-16", "date_iso": "2026-08-16T19:41:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/dodsstraff"]}, {"id": 115, "title": "August 16: Don't miss today's news", "summary": "They want the C leader to form a government with, Trump wants the US's new aircraft carriers to imitate models from the 40s, and SD is stepping up the rhetoric. Here are today's most important news.", "title_original": "16 augusti: Missa inte dagens nyheter", "summary_original": "De vill C-ledaren bilda regering med, Trump vill att USA:s nya hangarfartyg ska efterlikna modeller från 40-talet och SD trappar upp retoriken. Här är dagens viktigaste nyheter.", "link": "https://www.dn.se/varlden/16-augusti-missa-inte-dagens-nyheter/", "date_display": "2026-08-16", "date_iso": "2026-08-16T19:00:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Democratic Socialist: This is the last option before we resort to violence", "summary": "MADISON. A battle is raging in the Democrats ahead of the mid-term elections in November. The socialist phalanx has outmaneuvered centrist Democrats in high-profile primaries from Colorado to New York. Voters demand change. - The alternative is violence, says Robert Guerrero, representative of the Democratic Socialists of America.", "title_original": "Demokratisk socialist: Detta är sista alternativet innan vi tar till våld", "summary_original": "MADISON. En kamp rasar i Demokraterna inför mellanårsvalet i november. Socialistfalangen har utmanövrerat mittendemokrater i uppmärksammade primärval från Colorado till New York. Väljarna kräver förändring. – Alternativet är våld, säger Robert Guerrero, företrädare för Democratic Socialists of America.", "link": "https://www.dn.se/varlden/demokratisk-socialist-detta-ar-sista-alternativet-innan-vi-tar-till-vald/", "date_display": "2026-08-16", "date_iso": "2026-08-16T18:45:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Here are the parties' wallet proposals", "summary": "After several years of geopolitical instability with high inflation and interest rate shocks as a result, household finances are at the center of the election campaign. But Sweden's economy is not doing as badly as some people think, says Américo Fernández, private economist at SEB. - It must be clear that the Swedish economy, despite geopolitical turbulence in recent years, has managed quite well. If you look at household purchasing power, it is record high, says Américo Fernández in Nyhetsmorgon. Almost all parties focus on the same groups – pensioners and families with children. - Every third voter will be over 65, so it is a target group that is heavily invested in. As for families with children, it is a group that you want to support after a tough period. It is also a group that tends to vote with their wallets, says Américo Fernández. Here is a selection of the parties' proposals: Liberals Increased tax-free ISK amount, halved state income tax as well as child allowance and toddler route. - Many of these proposals are recognized by the various parties. The Liberals want to raise the tax-free amount to around half a million kroner, and several of the other bourgeois parties also want to do that. Moderates Increased tax-free ISK amount, monthly card tax-free benefit, lower tax for working pensioners and canceled free amount for students during the summer. According to Américo Fernández, the proposal to make monthly cards a tax-free benefit is a carrot for those who do not drive. - Here, you simply want to give to everyone who commutes because you have lowered the taxes on fuel a couple of times. The Christian Democrats Mother's bonus pension and employment tax deduction for parents, reduced capital gains tax on housing sales, increased child allowance and equal pensions. - The child allowance is a stick horse that can be recognized in several parts on both the left and right side. What varies are the amounts. KD wants to raise it to SEK 2,000. It is a substantial but also quite expensive measure. Sweden Democrats Dental discount, abolished electricity tax and permanently lower food VAT. - It has", "title_original": "Här är partiernas plånboksförslag", "summary_original": "Efter flera år av geopolitisk instabilitet med hög inflation och räntesmällar som följd står hushållens ekonomi i centrum i valrörelsen. Men Sverige ekonomi går inte så dåligt som en del tycks påskina, säger Américo Fernández, privatekonom på SEB. – Man ska vara tydlig med att svensk ekonomi trots geopolitisk turbulens de senaste åren klarat sig rätt bra. Om man tittar på hushållens köpkraft så är den rekordstark, säger Américo Fernández i Nyhetsmorgon. Nästan alla partier satsar på samma grupper – pensionärer och barnfamiljer. – Var tredje väljare kommer vara över 65 år, så det är en målgrupp som satsas mycket på. Vad gäller barnfamiljer så är det en grupp som man vill stötta efter en tuff period. Det är dessutom en grupp som tenderar att rösta med plånboken, säger Américo Fernández. Här är ett axplock av partiernas förslag: Liberalerna Höjt skattefritt ISK-belopp, halverad statlig inkomstskatt samt barnavdrag och småbarnsrut. – Många av de här förslagen känns igen hos de olika partierna. Liberalerna vill höja det skattefria beloppet till omkring en halv miljon kronor, och det vill flera av de andra borgerliga partierna också göra. Moderaterna Höjt skattefritt ISK-belopp, månadskort skattefri förmån, lägre skatt för arbetande pensionärer samt slopat fribelopp för studenter under sommaren. Enligt Américo Fernández är förslaget om att göra månadskort till en skattefri förmån en morot till de som inte kör bil. – Här vill man helt enkelt ge till alla som pendlar eftersom man sänkt skatterna på drivmedel ett par gånger. Kristdemokraterna Mamma-bonuspension och jobbskatteavdrag för föräldrar, sänkt reavinstskatt vid bostadsförsäljning, höjt barnbidrag samt jämställda pensioner. – Barnbidraget är en käpphäst som känns igen i flera partier på både vänster- och högersidan. Det som varierar är beloppen. KD vill höja det till 2 000 kronor. Det är en rejäl men också ganska dyr åtgärd. Sverigedemokraterna Tandvårdsrabatt, avskaffad elskatt samt permanent lägre matmoms. – Den halverade matmomsen gäller till slutet av 2027. Men det här är en jättestor kostnad. När jag jobbade på finansdepartementet brukade nya reformer under budgetåret ligga på 20-25 miljarder kronor för alla åtgärder. Det här är en åtgärd som kostar 21 miljarder. Socialdemokraterna Dubbla barn- och studiebidrag inför skolloven, höjda pensioner, slopat karensavdrag samt avgiftsfri tandvård för unga. – Slopat karensavdrag är den stora frågan och som också löper störst sannolikhet att bli verklighet om Socialdemokraterna kommer till makten eftersom man har brett stöd i den här frågan på sin sida av politiken. – Det som sticker ut hos S är att man vill stötta de som haft ett långt arbetsliv men som kanske inte kan gå i pension för att de måste vänta ett par år till. Miljöpartiet Billigare kollektivtrafik, slopat kraensavdrag, höjt studiebidrag sam stärkt bostadsbidrag. – Bostadsbidrag är något man fokuserade på även under andra mandatperioden. Och som vi ser så vill även MP slopa karensavdraget. Centerpartiet Sänkt skatt för låg- och medelinkomsttagare, förstärkt jämställdhetsbonus, förstärkt jobbskatteavdrag för arbetande pensionärer samt landsbygsavdrag. – Landsbygdsfrågan är så klart viktig för C. Här är det skatteklyftan mellan stad och land som man vill ge sig på. Vänsterpartiet Bebispeng till förstagångsföräldrar, höjt barnbidrag och ensamståendetillägg, stärkt bostadsbidrag och frysta hyror samt höjda pensioner. – Frysta hyror är en väldig viktig fråga för Vänsterpartiet.", "link": "https://www.tv4.se/artikel/4zDGRL8yncuaNjIKbkBWiZ/lista-haer-aer-partiernas-planboksfoerslag", "date_display": "2026-08-16", "date_iso": "2026-08-16T18:27:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Valet 2026", "/valet-2026", "/inrikes", "/ekonomi", "/svensk-ekonomi", "/kriget-i-ukraina/ekonomiskaeffekterna"]}, {"id": 118, "title": "A brick does more good than cultural canon", "summary": "To teach is to point - and in our time there is no better literature to point to than poems: they get both student teachers and young people to start reading seriously. The new, updated edition of \"Swedish poetry\" is welcome - although a certain poet is missing from it.", "title_original": "En tegelsten gör mer nytta än kulturkanon", "summary_original": "Att undervisa är att peka – och i vår tid finns det ingen bättre litteratur att peka på än dikter: de får både lärarstudenter och ungdomar att börja läsa på allvar. Den nya, uppdaterade upplagan av ”Svensk poesi” är välkommen – fast en viss poet saknas i den.", "link": "https://www.svd.se/a/9pr43W/recension-louise-almqvist-om-reviderade-svensk-poesi", "date_display": "2026-08-16", "date_iso": "2026-08-16T18:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 119, "title": "Martin Liby Troein: Busch's flirtation with the S leader is not about the Christian Democrats", "summary": "Ebba Busch has realized that a life locked up in Tidöborgen is not a high point in the event of an election loss. But Ulf Kristersson needs to cool down before it can get serious.", "title_original": "Martin Liby Troein: Buschs flört med S-ledaren handlar inte om Kristdemokraterna", "summary_original": "Ebba Busch har insett att ett liv inlåst i Tidöborgen inte är någon höjdare vid en valförlust. Men Ulf Kristersson behöver kylas av innan det kan bli allvar.", "link": "https://www.dn.se/ledare/martin-liby-troein-buschs-flort-med-s-ledaren-handlar-inte-om-kristdemokraterna/", "date_display": "2026-08-16", "date_iso": "2026-08-16T18:11:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "DN Debate. \"Remake Sis from scratch - our children can't wait\"", "summary": "DN DEBATE. Many youth homes are overshadowed by reports of violence, substandard treatment and lack of competence. The shortcomings are unacceptable. We therefore propose that a new authority should take over from the State Board of Institutions. However, a new sign on the door is not enough if we are to protect vulnerable children, more is required, writes the government's special investigator Stefan Holgersson.", "title_original": "DN Debatt. ”Gör om Sis från grunden – våra barn kan inte vänta”", "summary_original": "DN DEBATT. Många ungdomshem skuggas av anmälningar om våld, undermålig behandling och bristande kompetens. Bristerna är oacceptabla. Vi föreslår därför att en ny myndighet ska ta över från Statens institutionsstyrelse. En ny skylt på dörren räcker dock inte om vi ska skydda utsatta barn, mer krävs, skriver regeringens särskilda utredare Stefan Holgersson.", "link": "https://www.dn.se/debatt/gor-om-sis-fran-grunden-vara-barn-kan-inte-vanta/", "date_display": "2026-08-16", "date_iso": "2026-08-16T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Retired at 40 - now they are working again", "summary": "They did everything right according to Fire - and retired in their 40s. Ten years later, Maribel and Oskar Lindberg have been drawn back into working life. Was the idea of ​​leaving the squirrel wheel just an impossible dream?", "title_original": "Pensionerade sig vid 40 – nu jobbar de igen", "summary_original": "De gjorde allt rätt enligt Fire – och pensionerade sig i 40-årsåldern. Tio år senare har Maribel och Oskar Lindberg åter dragits in i arbetslivet. Var idén om att lämna ekorrhjulet bara en omöjlig dröm?", "link": "https://www.svd.se/a/3p5P2A/de-nadde-fire-och-pensionerade-sig-vid-40-tio-ar-senare-jobbar-de-igen", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:55:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 122, "title": "Anita Goldman: When languages ​​die, we also lose biodiversity", "summary": "If we can no longer put experiences into words, we lose knowledge, and AI's language models accelerate the loss. But diversity is needed as a powerful safeguard for our culture and history, writes Anita Goldman.", "title_original": "Anita Goldman: När språk dör, förlorar vi också den biologiska mångfalden", "summary_original": "Om vi inte längre kan sätta ord på erfarenheter tappar vi kunskapen, och AI:s språkmodeller skyndar på förlusten. Men mångfald behövs som ett kraftfullt skydd för vår kultur och historia, skriver Anita Goldman.", "link": "https://www.dn.se/kultur/anita-goldman-nar-sprak-dor-forlorar-vi-ocksa-den-biologiska-mangfalden/", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:39:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Anna Bratt: That's why it's so difficult to get estrogen", "summary": "The pharmacy shelves are empty of estrogen patches. Now more and more women are affected when the options also start to run out. But there are solutions, writes DN's medicine reporter Anna Bratt.", "title_original": "Anna Bratt: Därför är det så svårt att få tag på östrogen", "summary_original": "Apotekens hyllor gapar tomma på östrogenplåster. Nu drabbas allt fler kvinnor när alternativen också börjar ta slut. Men det finns lösningar, skriver DN:s medicinreporter Anna Bratt.", "link": "https://www.dn.se/sverige/anna-bratt-darfor-ar-det-sa-svart-att-fa-tag-pa-ostrogen/", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:26:19+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "European Championship gold for the Swedish duo - beat Norway", "summary": "Jacob Hölting Nilsson and Elmer Andersson took EC gold in beach volleyball after victory against Norway. The Swedish pair won the final match 2–1 in sets. - It's fantastic, Andersson says in SVT's broadcast.", "title_original": "EM-guld till svenskduon – slog Norge", "summary_original": "Jacob Hölting Nilsson och Elmer Andersson tog EM-guld i beachvolleyboll efter seger mot Norge. Svenskparet vann finalmatchen med 2–1 i set. – Det är fantastiskt, säger Andersson i SVT:s sändning.", "link": "https://www.dn.se/sport/em-guld-till-svenskduon-slog-norge/", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:26:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Women cross the Finnish border in search of estrogen", "summary": "TOURNAMENT. When Swedish women with menopausal symptoms cannot collect medicines in Sweden, the pressure on the pharmacies in the Finnish border town of Torneå increases. - They come here with paper prescriptions, says pharmacist Pirjo Södervall-Barsk in Finland.", "title_original": "Kvinnor korsar finska gränsen i jakten på östrogen", "summary_original": "TORNEÅ. När svenska kvinnor med klimakteriebesvär inte kan hämta ut läkemedel i Sverige ökar trycket på apoteken i finska gränsstaden Torneå. – De kommer hit med pappersrecept, säger farmaceuten Pirjo Södervall-Barsk i Finland.", "link": "https://www.dn.se/sverige/kvinnor-korsar-finska-gransen-i-jakten-pa-ostrogen/", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:26:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Iran: 300,000 kroner to whoever kills an American soldier", "summary": "At the same time as the deadline for the cease-fire between the United States and Iran is coming to an end, the Iranian military is offering almost 300,000 kroner to whoever kills an American soldier. \"Brave Iranian women who do such an act will be rewarded twice as much,\" says army chief Amir Hatami.", "title_original": "Iran: 300 000 kronor till den som dödar en amerikansk soldat", "summary_original": "Samtidigt som tidsfristen för vapenvilan mellan USA och Iran håller på att ta slut erbjuder iransk militär nästan 300 000 kronor till den som dödar en amerikansk soldat. – Modiga iranska kvinnor som gör en dylik handling kommer att belönas med det dubbla, säger arméchefen Amir Hatami.", "link": "https://www.dn.se/varlden/iran-300-000-kronor-till-den-som-dodar-en-amerikansk-soldat/", "date_display": "2026-08-16", "date_iso": "2026-08-16T17:11:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Kristersson on public opinion: \"Then you're a loser\"", "summary": "The moderates often emphasize that the Tidö parties go to elections as a united team. But how are voters to understand what joint policies that team wants to pursue — when the parties differ on key issues? - The differences were there when we entered the last election as well, says M leader Ulf Kristersson.", "title_original": "Kristersson om opinionen: ”Då är man ju en loser”", "summary_original": "Moderaterna framhåller ofta att Tidöpartierna går till val som ett enat lag. Men hur ska väljarna förstå vilken gemensam politik det laget vill driva – när partierna skiljer sig åt i viktiga frågor? – Skillnaderna fanns när vi gick in i förra valet också, säger M-ledaren Ulf Kristersson.", "link": "https://www.dn.se/sverige/kristersson-om-opinionen-da-ar-man-ju-en-loser/", "date_display": "2026-08-16", "date_iso": "2026-08-16T16:36:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Moa was going to see the favorite artist - was denied a place on the wheelchair ramp", "summary": "When 30-year-old Moa Johansson from Gothenburg saw that Zara Larsson was going to perform at Way Out West, she booked a ticket to the festival. Moa has a CP injury and is in a wheelchair and therefore booked together with her personal assistant Jade Jonsson. When they arrived at the festival grounds, they went to the VIP area. They have gone to several concerts together during the summer and therefore know that it can be a bit difficult with a wheelchair.  - It was a bit of a hassle to, for example, get to bars as there were stairs up to them. The queue for the disabled toilet was very long. But we can handle all that, we got to talk to a lot of nice people and enjoy the VIP area which was very good, says Jade Jonsson. - That's my everyday life, says Moa. \"The staff looked at us and looked sad\" When there was just over an hour left for Zara Larsson's concert, Moa and Jade decided to get to the stage. But when they arrived, they saw that the wheelchair ramp was full. - There were four more people in minivans outside and said they couldn't get a seat either, even though they bought tickets in good time, says Moa. - The staff looked at us and looked quite sad. That's where it falls short, says Jade. It ended with Moa and Jade having to stand on the edge of the crowd. For Moa, it meant that she mostly saw the backs of a lot of other people. Zara Larsson was only allowed to see one of the big screens on a couple of occasions. - When I can afford to pay for a ticket and don't get what I pay for, then I get very tired. I have been sad, says Moa. Directed to the VIP balcony When they asked the staff if they could watch the concert from another location, they were directed to the balcony in the VIP area - which only had stairs. - I don't really know what Way Out West has planned. It says that we must have access to a wheelchair ramp, and then they have to calculate so that everyone gets a seat. It becomes a bit of a boring mentality if everyone has to be there quickly and grab a seat.  We fully understand that they want to sell", "title_original": "Moa skulle se favoritartisten – nekades plats på rullstolsrampen", "summary_original": "När 30-åriga Moa Johansson från Göteborg såg att Zara Larsson skulle uppträda på Way Out West bokade hon en biljett till festivalen. Moa har en cp-skada och är rullstolsburen och bokade därför tillsammans med sin personliga assistent Jade Jonsson. När de kom fram till festivalområdet gick de till VIP-området. De har gått på flera konserter tillsammans under sommaren och vet därför att det kan vara lite krångligt med rullstol.  – Det var lite bökigt att exempelvis ta sig till barer då det var trappor upp till dem. Kön till handikappstoaletten var väldigt lång. Men allt sådant klarar vi av, vi fick snacka med många fina människor och njuta om VIP-området som var väldigt bra, säger Jade Jonsson. – Det är min vardag, säger Moa. ”Personalen tittade på oss och såg ledsna ut” När det var drygt en timme kvar till Zara Larssons konsert bestämde sig Moa och Jade för att ta sig till scenen. Men när de kom fram såg de att rullstolsrampen var full. – Det stod ytterligare fyra personer i permobil utanför och sa att de inte heller fick plats, trots att de köpt biljetter i god tid, säger Moa. – Personalen tittade på oss och såg ganska ledsna ut. Det är där det brister, säger Jade. Det slutade med att Moa och Jade fick stå i utkanten av folkmassan. För Moa innebar det att hon mest såg ryggen på massa andra människor. Zara Larsson fick hon endast se på en av storbildsskärmarna vid ett par tillfällen. – När jag har råd att betala för en biljett och inte får det jag betalar för, då blir jag väldigt trött. Jag har varit ledsen, säger Moa. Hänvisades till VIP-balkongen När de frågade personalen om de kunde se konserten från en annan plats hänvisades de till balkongen på VIP-området – som endast hade trappor. – Jag vet inte riktigt hur Way Out West har tänkt. Det står ju att vi ska ha tillgång till rullstolsramp, och då måste de ju räkna så att alla får plats. Det blir lite tråkig mentalitet om alla ska behöva vara där snabbt och paxa en plats.  Vi har full förståelse för att de vill sälja sina biljetter, men man måste ju också få plats om man köper en biljett, säger Jade. – Moa har ju varit väldigt besviken och det jag tycker har varit mest hjärtskärande är att hon har känt att hon tog massa plats och inte kände dig välkommen. Arrangören: ”Borde ha varit bättre” Ni vill både Moa och Jade att rullstolsrampen anpassas så att alla som köpt en biljett får plats så att ingen ska behöva uppleva det de upplevde. Moa vill att det ska finnas gott om plats. – Ingen av de som var där kunde röra armarna för att det var så trångt, men jag vill ju kunna dansa. Jag vill ju inte behöva begränsa mig.  Way Out West skriver i ett mejl till TV4 Nyheterna att tillträde till rullstolsramper ges i mån av plats och att tillgänglighetsbiljetter olyckligtvis inte garanterar någon sådan plats. ”Vi beklagar att upplevelsen inte blev som förväntat. Vi borde ha varit bättre på att assistera vid uppsökandet av en alternativ plats för att kunna se konserten på, och tar verkligen med oss detta till framtiden. Vanligtvis befinner sig inte alla på samma ramp (vi har en vid varje scen på festivalen) och då finns det gott om plats, men på vissa konserter är trycket högt och det är då sånt här kan inträffa”, skriver festivalen.", "link": "https://www.tv4.se/artikel/1EBzM6YHBIesMMjFflZdEh/moa-fick-inte-plats-pa-rullstolsrampen-jag-vill-ju-kunna-dansa", "date_display": "2026-08-16", "date_iso": "2026-08-16T16:08:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/way-out-west", "/goteborg", "/funktionsvariation"]}, {"id": 129, "title": "This is how Sjöström's strength was built after the pregnancy", "summary": "PARIS. Coach Antonio Lutula coached swimming star Sarah Sjöström to double Olympic gold. Now he has carefully and sensitively guided her back to the top sport a year after she became a mother. But the two EC medals are just the beginning. Sjöström will become even stronger. - The important thing has been not to accelerate from the start, but first to build strength, says Lutula.", "title_original": "Så byggdes Sjöströms styrka efter graviditeten", "summary_original": "PARIS. Tränaren Antonio Lutula coachade simstjärnan Sarah Sjöström till dubbla OS-guld. Nu har han varsamt och lyhört lotsat henne tillbaka till toppsporten ett år efter att hon blev mamma. Men de två EM-medaljerna är bara början. Sjöström ska bli ännu starkare. – Det viktiga har varit att inte gasa från start, utan först bygga styrka, säger Lutula.", "link": "https://www.dn.se/sport/sa-byggdes-sjostroms-styrka-efter-graviditeten/", "date_display": "2026-08-16", "date_iso": "2026-08-16T16:01:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "SD steps up the rhetoric: \"Stop being Muslims\"", "summary": "SD have been promised ministerial positions if the Tidö government wins the election. Now the party sharpens the anti-Muslim messages. - Stop being Muslims for the first time, says Richard Jomshof.", "title_original": "SD trappar upp retoriken: ”Sluta vara muslimer”", "summary_original": "SD har blivit lovade ministerposter om Tidöregeringen vinner valet. Nu vässar partiet de antimuslimska budskapen. – Sluta vara muslimer för det första, säger Richard Jomshof.", "link": "https://www.dn.se/sverige/sd-trappar-upp-retoriken-sluta-vara-muslimer/", "date_display": "2026-08-16", "date_iso": "2026-08-16T15:43:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "The Russia expert on the attack: \"More than just a warning shot\"", "summary": "Ukraine has carried out what is said to be one of the most extensive attacks on Russia since the full-scale invasion began in 2022. According to the Russian Defense Ministry, over 800 drones were shot down overnight Sunday. On the outskirts of Moscow, Wildberry's largest warehouse in Russia is in flames. It is one in a series of Ukrainian attacks against the Russian e-commerce company's various logistics centers.  - It is one of Russia's most leveraged companies and I believe that the intention of the extremely extensive attacks is to trigger a banking crisis. Wildberries are fundamental to the Russian financial market, says Russia expert Malcolm Dixelius. \"More than just a warning shot\" Ukraine has been attacking Russian oil refineries for a long time to damage Russia's economy and thus the war coffers. During the summer, they also began to attack Wildberries, which has been accused of acting as a logistics hub in the Russian war machine. Wildberries is closely connected with the Russian banks. According to Malcolm Dixelius, they have a permanent current credit of several billions. If they were to have payment problems, it would therefore bode ill for the already battered Russian financial market. - It is more than just a warning shot. You are hitting a system-critical part of the financial system and in the end it could be what tips the entire Russian economy. Alongside the heavily leveraged defense industry, this is one of the most dispersed and one of the most vulnerable parts of the Russian financial market, says Malcolm Dixelius. Russian observers see end to war The attacks in Russia have made the war more tangible for the Russian population. Now more and more people - even those loyal to the country's President Vladimir Putin - are protesting against an unsustainable situation. - More and more Russian observers openly say that this is the end of the war. Such tones were completely impossible to perform before, but now you hear them and see them in text, says Malcolm Dixelius. Are these attacks the death knell for Ryssl", "title_original": "Rysslandskännaren om attacken: ”Mer än bara ett varningsskott”", "summary_original": "Ukraina har genomfört vad som uppges vara en av de mest omfattande attackerna mot Ryssland sedan den fullskaliga invasionen inleddes 2022. Enligt det ryska försvarsministeriet har över 800 drönare skjutits ner under natten mot söndagen. I utkanten av Moskva står Wildberries största lager i Ryssland i lågor. Det är en i raden av ukrainska attacker mot det ryska e-handelsbolagets olika logistikcenter.  – Det är ett av Rysslands mest belånade företag och jag tror att avsikten med de oerhört omfattande attackerna är att utlösa en bankkris. Wildberries är fundamentalt för den ryska finansmarknaden, säger Rysslandskännaren Malcolm Dixelius. ”Mer än bara ett varningsskott” Ukraina har sedan en längre tid attackerat ryska oljeraffinaderier för att skada Rysslands ekonomi och därmed krigskassan. Under sommaren har man dessutom börjat slå mot Wildberries, som har anklagats för att fungera som logistikhub i det ryska krigsmaskineriet. Wildberries är tätt sammankopplad med de ryska bankerna. Enligt Malcolm Dixelius har de en permanent löpande kredit på flera miljarder. Om de skulle få betalningsproblem skulle det därför vara illavarslande för den redan sargade ryska finansmarknaden. – Det är mer än bara ett varningsskott. Man slår mot en systemkritisk del av finanssystemet och i slutändan kan det vara det som tippar hela den ryska ekonomin. Vid sidan om den hårt belånade försvarsindustrin är det här en av de mest spridda och en av de mest sårbara delarna av den ryska finansmarknaden, säger Malcolm Dixelius. Ryska betraktare ser slut på kriget Attackerna i Ryssland har gjort kriget mer påtagligt för den ryska befolkningen. Nu protesterar alltfler – till och med de som är trogna landets president Vladimir Putin – mot en ohållbar situation. – Fler och fler ryska betraktare öppet säger att det här är slutet på kriget. Sådana tongångar var fullständigt omöjlig att framföra förut, men nu hör man dem och ser dem i text, säger Malcolm Dixelius. Är de här attackerna dödsstöten för Ryssland? – Det enda Ryssland tar till som motåtgärd är att höja nivån i terrorkriget mot Ukraina. Men Ryssland verkar ganska hjälplöst när det kommer till att hindra och skydda sig mot drönarattackerna. Man kan säga att metoden verkar fungera och att Ukraina målmedvetet kommer fortsätta med det här tills de knäcker finansmarknaden eller får Ryssland till förhandlingsbordet.", "link": "https://www.tv4.se/artikel/6zRqYCxTSmsDor7ECAODqe/rysslandskaennaren-om-attacken-mer-aen-bara-ett-varningsskott", "date_display": "2026-08-16", "date_iso": "2026-08-16T13:15:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ryssland"]}, {"id": 132, "title": "Samuel broke his neck in a diving accident - completed races in a wheelchair", "summary": "One night in July last year, Samuel Rudholm, then 24 years old, dived from a jetty in Klarälven. The water was shallower than he thought and he landed squarely on his face. - It radiated throughout the body. I asked the person who was with me in the water to hold me down and call for help and call an ambulance, says Samuel. He was rushed to hospital and operated on for a crushed neck vertebra. The injury left him paralyzed from the shoulders down. After several months in hospital and intensive training, Samuel was able to return home to his parents in December. Support from friends and family Returning to everyday life after the accident has been a challenge, both physically and mentally. - It was difficult in the beginning. But I've had incredible support from both friends, family and workplace colleagues, so we've always felt that support has been there, says Samuel. Personal assistant Katja Johansson started working with Samuel in March. Together they have found new ways to live an active life. - We try to live as usual. Then I just get to be his arms and legs, and we work together, says Katja Johansson. Karlstad city race - a milestone This summer, Samuel and Katja completed the Karlstad city race together. - It was an incredible feeling. To be part of the 3,100 people who ran. That you get to be involved in the big picture, says Samuel. Katja describes the race as both challenging and fun. - I was Samuel's arms and legs and he was my eyes. People moved and everyone who ran with us started to help. It was a joy to finish, she says. New goals and faith in the future Despite his injury, Samuel has set his sights on new challenges. The next goal is the Klarälvsloppet, which is a half-marathon. - I dream of coming back as much as possible but also being able to show others who find themselves in a similar situation that it is easy to feel a little isolated, but that it is the exact opposite. You should be able to get out and do everything like I did before, even if there are some limitations, says Samuel. ,", "title_original": "Samuel bröt nacken i dykolycka – genomförde lopp i rullstol", "summary_original": "En natt i juli förra året dök Samuel Rudholm, då 24 år, från en brygga i Klarälven. Vattnet var grundare än han trodde och han landade rakt på ansiktet. – Det strålade ut i hela kroppen. Jag bad personen som var med mig i vattnet att hålla kvar mig och ropa efter hjälp och ringa ambulans, berättar Samuel. Han fördes akut till sjukhus och opererades för en krossad nackkota. Skadan gjorde honom förlamad från axlarna och nedåt. Efter flera månader på sjukhus och intensiv träning kunde Samuel återvända hem till sina föräldrar i december. Stöd från vänner och familj Att återvända till vardagen efter olyckan har varit en utmaning, både fysiskt och mentalt. – Det var kämpigt i början. Men jag har haft en otrolig backning från både vänner, familj och arbetsplatskollegor, så vi har alltid känt att stöd har funnits, säger Samuel. Personliga assistenten Katja Johansson började arbeta med Samuel i mars. Tillsammans har de hittat nya sätt att leva ett aktivt liv. – Vi försöker leva som vanligt. Så får jag bara vara hans armar och ben, så jobbar vi ihop, säger Katja Johansson. Karlstad stadslopp – en milstolpe I somras genomförde Samuel och Katja Karlstad stadslopp tillsammans. – Det var en otrolig känsla. Att få vara en del av de 3 100 personer som sprang. Att man får vara delaktig i det stora hela, säger Samuel. Katja beskriver loppet som både utmanande och roligt. – Jag var Samuels armar och ben och han var mina ögon. Folk flyttade på sig och alla som sprang med oss började hjälpa till. Det var en fröjd att komma i mål, säger hon. Nya mål och framtidstro Trots sin skada har Samuel siktet inställt på nya utmaningar. Nästa mål är Klarälvsloppet som är en halvmara. – Jag drömmer om att komma tillbaka så mycket som möjligt men också att kunna visa för andra som hamnar i en snarlik situation att det är enkelt att känna sig lite isolerad, men att det är raka motsatsen. Man ska kunna komma ut och göra allt som jag gjorde innan, även fast det finns lite begränsningar, säger Samuel. , säger Samuel. Katja lyfter att de kompletterar varandra väl och gärna hittar på nya saker ihop. – Vi har ju fixat allting. Det spelar ingen roll vad vi har stött på, säger Katja Johansson.", "link": "https://www.tv4.se/artikel/5PpB28UYt6IPCae5gmxMBp/broet-nacken-i-dykolycka-genomfoerde-lopp-i-rullstol", "date_display": "2026-08-16", "date_iso": "2026-08-16T11:03:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/olycka", "/skada"]}, {"id": 133, "title": "The expert warns: Then acid flow can become downright life-threatening", "summary": "Surströmming is one of Sweden's most talked about dishes, known for its strong aroma to say the least. But according to food hygiene professor Marie-Louise Danielsson-Tham, it is also unusually interesting from a food safety perspective. - The acid flow gets its aroma and consistency from various bacteriological processes and enzymatic processes. So it's something that nature itself takes care of and it's just that humans have to control it so that you don't get sick when you eat it, she says. Can be dangerous if something goes wrong. The production is based on allowing the curd to ferment under controlled conditions. If the process does not work as it should, the consequences can be serious. In the stomach and intestinal system of the fish there are naturally spores of the bacterium Clostridium botulinum, which can cause botulism, an uncommon but very serious poisoning. - Then you have to prevent the spores from turning into bacterial form. This is done through high salinity. There must be at least eight to ten percent salt in the whole fish and prevent air access, says Danielsson-Tham. She explains that it is above all the high salt content and the controlled manufacturing conditions that make sour strömming safe to eat. Botulism When asked how serious the consequences can be if the process fails, she is clear: - Botulism. The spores form a deadly nerve toxin when they transform into bacterial form and then grow. - The risk is of course, as with all foods that are risk foods for botulism, that you die of respiratory paralysis. Marie-Louise Danielsson-Tham advises against making sour strömming at home. - All fermentation of food, and especially of fish, is risky. It is a dangerous process that requires knowledge and the right equipment, she says. Purchased acid strömming is safe At the same time, she emphasizes that those who buy acid strömming from established manufacturers need not be worried. - There are no risks at all. These acid flow producers care so much about their reputation because they produce a cultural", "title_original": "Experten varnar: Då kan surströmming bli rent livsfarligt", "summary_original": "Surströmming är en av Sveriges mest omtalade maträtter, känd för sin minst sagt kraftiga doft. Men enligt livsmedelshygienprofessorn Marie-Louise Danielsson-Tham är den också ovanligt intressant ur ett livsmedelssäkerhetsperspektiv. – Surströmmingen får ju sin arom och sin konsistens av olika bakteriologiska processer och enzymatiska processer. Så det är någonting som naturen själv ser till och det är då bara att människan måste styra det så att man inte blir sjuk av när man äter det, säger hon. Kan bli farligt om något går fel Tillverkningen bygger på att strömmingen får jäsa under kontrollerade former. Om processen inte fungerar som den ska kan konsekvenserna bli allvarliga. I fiskens mag- och tarmsystem finns naturligt sporer av bakterien Clostridium botulinum, som kan orsaka botulism, en ovanlig men mycket allvarlig förgiftning. – Då måste man ju hindra sporerna från att övergå i bakterieform. Det gör man genom hög salthalt. Det måste vara minst åtta till tio procents salthalt i hela fisken och förhindra lufttillträde, säger Danielsson-Tham. Hon förklarar att det framför allt är den höga salthalten och de kontrollerade tillverkningsförhållandena som gör surströmming säker att äta. Botulism På frågan om hur allvarliga följderna kan bli om processen misslyckas är hon tydlig: – Botulism. Sporerna bildar ett dödligt nervgift när de övergår i bakterieform och sedan växer till sig. – Risken är ju givetvis, som med alla livsmedel som är risklivsmedel för botulism, att man dör i andningsförlamning. Marie-Louise Danielsson-Tham avråder från att tillverka surströmming hemma. – All fermentering av livsmedel, och speciellt då av fisk, är riskabel. Det är en farlig process som kräver kunskap och rätt utrustning, säger hon. Köpt surströmming är säker Samtidigt betonar hon att den som köper surströmming från etablerade tillverkare inte behöver vara orolig. – Det är inga risker alls. De här surströmmingstillverkarna är ju så måna om sitt rykte för de producerar ju en kulturellt viktig produkt. Däremot bör konsumenter reagera om burkarna inte förvaras på rätt sätt i butik. – Skulle man hitta surströmmingsburkar som inte ligger i kylen i en affär ska man ju inte köpa dem utan säga till. När det är dags att öppna burken har hon också ett praktiskt råd. – Det är ju ofta övertryck i burkarna. Det är därför som de ser ut som fotbollar. Öppna dem under en vattenyta, exempelvis i en hink. För nybörjare finns ytterligare en rekommendation: – Man ska nog inte äta den direkt ur burken. Då vill man nog aldrig äta surströmming mer.", "link": "https://www.tv4.se/artikel/4iJgQO4xQKUcHTPYVc4k0V/experten-varnar-daerfoer-kan-surstroemming-bli-farligt", "date_display": "2026-08-16", "date_iso": "2026-08-16T10:49:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/mat", "/halsa", "/matforgiftning", "/surstrommingspremiar", "/surstromming", "/livsmedel", "/livsmedelsproduktion", "/dod"]}, {"id": 134, "title": "Nonnamaxing is growing among young people - that's how the trend works", "summary": "The phenomenon of \"nonnamaxing\" has in a short time become a concept on social media and captures the contemporary longing for a calmer pace. In Italy, the trend has led restaurants to hire real nuns who cook pasta on site, and workshops where visitors learn traditional cooking methods have become a tourist magnet. - An aunt sits there and makes pasta from scratch. It's becoming super trendy among young people, says travel journalist Lina Skandevall. At the same time, interest is growing in Sweden for activities where you make use of what nature offers and learn old techniques, such as stick-retreats, sourdough baking and foraging. \"Anti-maxa\" - slow lifestyle attracts Being inspired by the nun's lifestyle has become a way for many to find balance in everyday life and break with stress.  - It frames so much of the trends we see in general right now. This is such a great way to express the trends, says Lina Skandevall. She says that knitting retreats in Kalix are quickly fully booked when entire hotels are filled with participants who want to knit, socialize and learn from each other. - Everyone wants to sit and knit and hang out. It is so popular that the places run out in a few minutes, she says. Knowledge tourism is increasing strongly in Sweden Interest in knowledge tourism has increased by 250 percent in recent years, according to the booking app GetYourGuide. Foreign tourists are attracted by the common law, the opportunity to pick mushrooms and live by a lake in peace and quiet. In Sweden, the elderly have also been given a new role as role models. - You take it a little more calmly and gain more knowledge about what our elders have to teach us. And they become cool and are highlighted in the media and advertising too, so right, says Lina Skandevall.  Hiking and closeness to nature Hiking has become one of the most appreciated and cheap activities, says Skandevall. There are many trails around the country and adventure is often just around the corner. - You don't have to go that far. But put away the mobile phone, do things with your hands and make use of the knowledge, she says about e.g", "title_original": "Nonnamaxing växer bland unga – så funkar trenden", "summary_original": "Fenomenet ”nonnamaxing” har på kort tid blivit ett begrepp på sociala medier och fångar upp samtidens längtan efter ett lugnare tempo. I Italien har trenden fått restauranger att anställa riktiga nonnor som lagar pasta på plats, och workshops där besökare lär sig traditionella matlagningsmetoder har blivit en turistmagnet. – Där sitter en tant och gör pasta från grunden. Det blir supertrendigt hos ungdomarna, säger resejournalisten Lina Skandevall. Samtidigt växer intresset i Sverige för aktiviteter där man tar tillvara på det naturen erbjuder och lär sig gamla tekniker, som stick-retreats, surdegsbakning och foraging. ”Anti-maxa” – långsam livsstil lockar Att inspireras av nonnans livsstil har blivit ett sätt för många att hitta balans i vardagen och bryta med stressen.  – Det ramar in så himla mycket av de trender vi ser generellt just nu. Det här är ett så himla fint sätt att uttrycka trenderna på, säger Lina Skandevall. Hon berättar att stick-retreats i Kalix snabbt blir fullbokade när hela hotell fylls av deltagare som vill sticka, umgås och lära av varandra. – Alla vill sitta och sticka och umgås. Det är så populärt att platserna tar slut på några minuter, säger hon. Kunskapsturism ökar kraftigt i Sverige Intresset för kunskapsturism har ökat med 250 procent de senaste åren, enligt bokningsappen GetYourGuide. Utländska turister lockas av allemansrätten, möjligheten att plocka svamp och bo vid en sjö i lugn och ro. I Sverige har även äldre fått en ny roll som förebilder. – Man tar det lite lugnare och får mer kunskap om det som våra äldre har att lära oss. Och de blir coola och lyfts i medier och reklam också, så rätt, säger Lina Skandevall.  Vandring och närhet till naturen Vandring har blivit en av de mest uppskattade och billiga aktiviteterna, menar Skandevall. Det finns många leder runt om i landet och äventyret finns ofta runt hörnet. – Man behöver inte gå så långt. Men lägg undan mobilen, gör saker med händerna och ta tillvara på kunskapen, säger hon om trenden nonnamaxxing.", "link": "https://www.tv4.se/artikel/6M7TI424dJhoHdMgoRJW2K/nonnamaxing-vaexer-bland-unga-sa-funkar-trenden", "date_display": "2026-08-16", "date_iso": "2026-08-16T09:36:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/italien", "/sociala-medier", "/hobby", "/livsstil", "/matlagning"]}, {"id": 135, "title": "Vehicle factories become part of the German rearmament", "summary": "It may not be the trendiest part of Berlin. But the Wedding district is centrally located, just a short bike ride from the Brandenburg Gate. Here is also the latest facility that has become part of Germany's defense industry. Until a few weeks ago, parts for diesel engines were produced in Rheinmetall's factory in Wedding.  New barbed wire around the fences, surveillance drones in the air and extra security personnel testify that a brand new product has taken over – casings for 155 mm artillery ammunition. Jobs secured The IG Metall trade union represents the workers in the factory. Previously, the employees were threatened with unemployment, but all have been able to join the new production. So even if the trade union is fundamentally critical of the rearmament, the development is viewed positively. - Our employees naturally think primarily about their future. That is: Do I have a job tomorrow? Can I still provide for my family tomorrow?, says Ines Beeck, business manager for IG Metall in Berlin.  Now the workplaces at the factory are secured for several years to come. Demonstrations – but also political support However, the changeover has sparked protests. It mainly concerns local residents who are worried that the factory will become a target in the event of a conflict. But also groups that generally oppose rearmament or criticize Germany's arms exports to Israel.  Among other things, the Swedish activist Greta Thunberg has posted several videos on social media where she participates in demonstrations outside the facility. From a political point of view, however, there is strong support: The German government is currently making historically large investments in defence. Next year, the defense budget will be almost 110 billion euros – far higher than in any other European country. Precisely 155 mm artillery ammunition is widely used at the front in Ukraine and has become an acute shortage. The IG Metall trade union still hopes that the German car industry will recover. But Ines Beeck see", "title_original": "Fordonsfabriker blir en del av den tyska upprustningen", "summary_original": "Det är kanske inte den mest trendiga delen av Berlin. Men stadsdelen Wedding ligger centralt, bara en kort cykeltur från Brandenburger Tor. Här ligger också den senaste anläggningen som har blivit en del av Tysklands försvarsindustri. Fram till för några veckor sedan tillverkades delar till dieselmotorer i Rheinmetalls fabrik i Wedding.  Ny taggtråd runt stängslen, övervakningsdrönare i luften och extra säkerhetspersonal vittnar om att en helt ny produkt har tagit över – hylsor för 155 mm artilleriammunition. Arbetsplatser säkrade Fackförbundet IG Metall representerar arbetarna i fabriken. Tidigare hotades de anställda av arbetslöshet, men samtliga har kunnat följa med till den nya produktionen. Så även om fackförbundet i grunden är kritiskt till upprustningen ser man positivt på utvecklingen. – De anställda hos oss tänker naturligtvis i första hand på sin framtid. Det vill säga: Har jag ett jobb i morgon? Kan jag fortfarande försörja min familj i morgon?, säger Ines Beeck, verksamhetsledare för IG Metall i Berlin.  Nu är arbetsplatserna på fabriken säkrade i flera år framöver. Demonstrationer – men också politiskt stöd Omställningen har dock väckt protester. Det handlar framför allt om närboende som är oroliga för att fabriken ska bli en måltavla vid en konflikt. Men även grupper som generellt motsätter sig upprustning eller kritiserar Tysklands vapenexport till Israel.  Bland annat har den svenska aktivisten Greta Thunberg lagt upp flera videoklipp på sociala medier där hon deltar i demonstrationer utanför anläggningen. Från politiskt håll finns det däremot ett starkt stöd: Den tyska regeringen gör just nu historiskt stora investeringar i försvaret. Nästa år ligger försvarsbudgeten på nästan 110 miljarder euro – långt högre än i något annat europeiskt land. Just 155 mm artilleriammunition används flitigt vid fronten i Ukraina och har blivit en akut bristvara. Fackförbundet IG Metall hoppas fortfarande att den tyska bilindustrin ska återhämta sig. Men Ines Beeck ser också en framtid där försvarsindustrin tar över allt större delar av det som tidigare var bilindustri. – Vi ser att det ryska anfallskriget mot Ukraina har förändrat både prioriteringarna och den politiska debatten här i landet, säger hon.", "link": "https://www.tv4.se/artikel/4zs3Mc7IXArCQhgYVOoMZH/fordonsfabriker-blir-en-del-av-den-tyska-upprustningen", "date_display": "2026-08-16", "date_iso": "2026-08-16T08:46:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/tyskland", "/bilar", "/forsvaret"]}, {"id": 136, "title": "Mohamsson in a new TV4 documentary about the Liberals' crisis situation", "summary": "The leader's move to clear the block: \"Then I do backflips\" • Brings in the veteran", "title_original": "Mohamsson i ny TV4-dokumentär om Liberalernas krisläge", "summary_original": "Ledarens drag för att klara spärren: ”Då gör jag backflips” • Tar in veteranen", "link": "https://www.tv4.se/artikel/5Ia9w4NpyQXUZJbLM1sEqD/mohamsson-i-ny-tv4-dokumentaer-om-liberalernas-krislaege", "date_display": "2026-08-16", "date_iso": "2026-08-16T06:28:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 137, "title": "Many people do dips, pull ups and push ups wrong", "summary": "Push-ups, dips and pull-ups - how hard can it be? In fact, a surprising number of people get it wrong. \"Many people neglect to get full range of motion and then you don't get results,\" says trainer Freja Ferreira.", "title_original": "Många gör dips, pull ups och armhävningar fel", "summary_original": "Armhävningar, dips och pull ups – hur svårt kan det vara? Faktum är att förvånansvärt många gör fel. ”Många slarvar med att få fullt rörelseomfång och då får man inga resultat”, säger tränaren Freja Ferreira.", "link": "https://www.svd.se/a/OkEGP1/traningsexperter-fem-calisthenics-ovningar-manga-gor-fel", "date_display": "2026-08-16", "date_iso": "2026-08-16T04:42:15+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Livet"]}, {"id": 138, "title": "Mobile bans are now being introduced at school: \"Hope for better results\"", "summary": "Preparations for the autumn term are in full swing at Nyboda school in Tyresö outside Stockholm. The old cupboards at the entrance have been converted into mobile phone storage and more clocks have been bought in so that students can keep track of time. More balls and pool cues should make it easier to invent things during the breaks. We need to give the students good conditions to succeed, says the school's principal Magnus Prior. Students circumvented previous bans The school tested mobile-free school days as early as 2023, but many students circumvented the ban, for example by hiding their mobiles in their clothes. During the breaks, the students didn't know what to do, says Magnus Prior. The fact that the ban is now in the school law, the principal believes, will make a big difference. It becomes clearer and without discussion now. Being controlled by social media algorithms is completely rubbish. We hope for better school results. The mobile phone ban was presented by Education Minister Simona Mohamsson (L) at the beginning of the year. Approximately 80 percent of primary schools already have some form of mobile phone ban, but now it applies by law throughout the day. For 2026, the government allocates SEK 95 million to cabinets and administration, and thereafter SEK 100 million annually. The school must be allowed to be a sanctuary so that you can focus on the lessons and socialize during the breaks. All research shows the positive effects for c
