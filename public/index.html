oncentration, says Simona Mohamsson to TT. Concerns about teachers' workload Sweden's Municipalities and Regions (SKR) has previously raised practical challenges with an all-day ban. The schools must organize the storage and who will collect the phones. There has been a concern about more administration for the teachers. Many schools already have cell phone bans, but we hear that some would have liked more flexibility on how to solve it, says Monica Sonde, head of SKR's education department. Simona Mohamsson says that she rather believes that the ban reduces fighting in the classroom when submissions are made together in the morning. At the same time, SKR points to future challenges with smart watches and an", "title_original": "Nu införs mobilförbud i skolan: ”Hoppas på bättre resultat”", "summary_original": "Förberedelserna inför höstterminen är i full gång på Nyboda skola i Tyresö utanför Stockholm. De gamla skåpen vid entrén har gjorts om till mobilförvaring och fler klockor har köpts in för att elever ska kunna hålla tiden. Fler bollar och biljardköer ska göra det lättare att hitta på saker på rasterna. Vi behöver ge eleverna bra förutsättningar för att lyckas, säger skolans rektor Magnus Prior. Elever rundade tidigare förbud Skolan testade mobilfria skoldagar redan 2023 men många elever rundade förbudet, till exempel genom att gömma mobilerna i kläderna. På rasterna visste eleverna inte vad de skulle göra, säger Magnus Prior. Att förbudet nu står i skollagen tror rektorn kommer göra stor skillnad. Det blir tydligare och utan diskussion nu. Det är helt kasst att styras av sociala medier-algoritmer. Vi hoppas på bättre skolresultat. Mobilförbudet presenterades av utbildningsminister Simona Mohamsson (L) i början av året. Ungefär 80 procent av grundskolorna har redan haft någon form av mobilförbud, men nu gäller det lagstadgat under hela dagen. För 2026 avsätter regeringen 95 miljoner kronor till skåp och administration, och därefter 100 miljoner kronor årligen. Skolan måste få vara en fristad så att man kan fokusera på lektionerna och umgås på rasterna. All forskning visar på de positiva effekterna för koncentrationen, säger Simona Mohamsson till TT. Oro för lärares arbetsbelastning Sveriges Kommuner och Regioner (SKR) har tidigare lyft praktiska utmaningar med ett heldagsförbud. Skolorna måste organisera förvaringen och vem som ska samla in telefonerna. Det har funnits en oro för mer administration för lärarna. Många skolor har redan mobilförbud, men vi hör att vissa hade önskat mer flexibilitet på hur man ska lösa det, säger Monica Sonde, chef för SKR:s utbildningsavdelning. Simona Mohamsson säger att hon snarare tror att förbudet minskar tjafs i klassrummet när inlämningen sker samlat på morgonen. Samtidigt pekar SKR på framtida utmaningar med smarta klockor och annan bärbar teknik som ständigt utvecklas. Risken finns att man försöker komma runt reglerna. I slutändan handlar det om att elever och skolor ser värde i reformen, säger Monica Sonde, som hoppas på att lagen leder till en sundare balans mellan digitala och analoga verktyg i skolan.", "link": "https://www.tv4.se/artikel/tt-260816-mobilforbud1-a59d9c9c/mobilforbud-i-skolan-hoppas-pa-battre-resultat", "date_display": "2026-08-16", "date_iso": "2026-08-16T04:40:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Stockholm", "/stockholm", "/sverige", "/tyreso", "/utbildning", "/inrikes"]}, {"id": 139, "title": "Hannaskolan in Umeå closes, terminates and sells out", "summary": "Mariaskolan in Umeå continues • Postponed merger plans", "title_original": "Hannaskolan i Umeå stänger, säger upp och säljer ut", "summary_original": "Mariaskolan i Umeå fortsätter • Uppskjutna planer på samgående", "link": "https://www.dagen.se/nyheter/hannaskolan-i-umea-staenger-saeger-upp-och-saeljer-ut/10477027", "date_display": "2026-08-16", "date_iso": "2026-08-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 140, "title": "Alva Dahl: I hold Paul and Dostoevsky in high esteem", "summary": "Author Alva Dahl answers questions about reading in the series \"My book life\"", "title_original": "Alva Dahl: Jag håller Paulus och Dostojevskij högt", "summary_original": "Författaren Alva Dahl svarar på frågor om läsning i serien ”Mitt bokliv”", "link": "https://www.dagen.se/kultur/alva-dahl-jag-haller-paulus-och-dostojevskij-hoegt/10467547", "date_display": "2026-08-16", "date_iso": "2026-08-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 141, "title": "Painful to follow the break between the friends Stakset, Betz and Flavia", "summary": "Today's Daniel Wistrand has seen the SVT documentary \"Guds gän\" about Sebastian Stakset's life", "title_original": "Smärtsamt att följa brytningen mellan vännerna Stakset, Betz och Flavia", "summary_original": "Dagens Daniel Wistrand har sett SVT-dokumentären ”Guds gäng” om Sebastian Staksets liv", "link": "https://www.dagen.se/kultur/smaertsamt-att-foelja-brytningen-mellan-vaennerna-stakset-betz-och-flavia/10474250", "date_display": "2026-08-16", "date_iso": "2026-08-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 142, "title": "Emmy Stiernblad:\nI refuse to be one of those people who maps their partner via the find-my-iPhone app", "summary": "Half of the 18-34-year-olds track their respective ones digitally.", "title_original": "Emmy Stiernblad:\nJag vägrar bli en av dem som kartlägger sin partner via hitta-min-Iphone-appen", "summary_original": "Hälften av 18-34-åringarna spårar sina respektive digitalt.", "link": "https://www.dagen.se/kultur/emmy-stiernblad-jag-vaegrar-bli-en-av-dem-som-kartlaegger-sin-partner-via-hitta-min-iphone-appen/10480825", "date_display": "2026-08-16", "date_iso": "2026-08-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 143, "title": "Upset feelings in Filipstad after interview with church staff", "summary": "The priest and deacon spoke negatively about the local population.", "title_original": "Upprörda känslor i Filipstad efter intervju med kyrkans personal", "summary_original": "Präst och diakon uttalade sig negativt om lokalbefolkningen.", "link": "https://www.dagen.se/nyheter/upproerda-kaenslor-i-filipstad-efter-intervju-med-kyrkans-personal/10480009", "date_display": "2026-08-16", "date_iso": "2026-08-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "Five years of Taliban rule: \"An old wound that is being torn open\"", "summary": "It has been five years since the Taliban regained power in Afghanistan after the US's chaotic withdrawal from the country. The Taliban then promised that women's rights and freedoms would be respected and accommodated according to Islamic law. - Women are an important part of society and we respect them. Wherever society needs them, they will be active, said spokesperson Zabiullah Mujahid. Since then, women's rights have been dismantled bit by bit, and now women and girls tell the BBC about an unrecognizable existence. - Every year when this date falls, it feels like an old wound is torn open anew and a new sense of defeat fills my heart, Shakiba tells the channel. Leaves home 1-2 times a month Despite promises of preserved rights for women and girls, the Taliban have, among other things, limited opportunities for women to travel without a male companion and allowed child marriage.  Furthermore, Afghanistan is currently the only country in the world where girls aged 12 or older are officially prohibited from attending school. According to a new report from the United Nations, half of the women in the country leave the home only once or twice a month. Received 50 lashes - after talking to man The Taliban have also resumed corporal punishment in public. Shaima was punished with 50 lashes after being forced to confess to alleged crimes, including associating with infidels - meaning non-Muslims - for speaking to men she is not related to. - Around 200 people gathered at the site, including men, boys and children. All were male. I had to say out loud that I regretted my crimes, Shaima told the BBC. Manizha was punished with 39 lashes and imprisonment for having a \"friendship with a man\". She and the man wanted to get married but were arrested. In prison, she experienced things that made her no longer have any desire to live. - I became a source of shame for my family and friends. I could no longer think about marriage, she says. Creates jobs for", "title_original": "Fem år med talibanstyre: ”Ett gammalt sår som rivs upp”", "summary_original": "Det har gått fem år sedan talibanerna återtog makten i Afghanistan efter USA:s kaosartade utträde ur landet. Talibanerna lovade då att kvinnors fri- och rättigheter skulle respekteras och tillgodoses utefter islamsk lag. – Kvinnor är en viktig del av samhället och vi respekterar dem. Överallt där samhället behöver dem kommer de att vara aktiva, sade talespersonen Zabiullah Mujahid. Sedan dess har kvinnors rättigheter nedmonterats bit för bit, och nu berättar kvinnor och flickor för BBC om en oigenkännlig tillvaro. – Varje år när det här datumet infaller känns det som att ett gammalt sår rivs upp på nytt och en ny känsla av nederlag fyller mitt hjärta, säger Shakiba till kanalen. Lämnar hemmet 1–2 gånger i månaden Trots löften om bevarade rättigheter för kvinnor och flickor har talibanerna bland annat begränsat möjligheter för kvinnor att resa utan en manlig följeslagare samt tillåtit barnäktenskap.  För närvarande är Afghanistan dessutom det enda landet i världen där flickor som är 12 år eller äldre officiellt är förbjudna att gå i skolan. Enligt en ny rapport från FN lämnar hälften av kvinnorna i landet hemmet bara en till två gånger i månaden. Fick 50 piskrapp – efter samtal med man Talibanerna har dessutom återupptagit kroppsstraff i offentligheten. Shaima straffades med 50 piskrapp efter att ha tvingats erkänna påstådda brott, bland annat för samröre med otrogna – alltså ickemuslimer – för att ha talat med män hon inte är släkt med. – Omkring 200 personer samlades på platsen, däribland män, pojkar och barn. Alla var av manligt kön. Jag var tvungen att säga högt att jag ångrade mina brott, säger Shaima till BBC. Manizha straffades med 39 piskrapp och fängelse för att hon haft en ”vänskap med en man”. Hon och mannen ville gifta sig men blev gripna. I fängelset upplevde hon saker som gjorde att hon inte längde hade någon lust att leva. – Jag blev en källa till skam för min familj och mina vänner. Jag kunde inte längre tänka på äktenskap, säger hon. Skapar jobb för kvinnor Afghanistan har bland den högsta mödradödligheten i världen, bland annat på grund av att manliga läkare inte får vårda kvinnor och flickor.  Barnmorskan Marzia var med när en födande kvinno dog på sjukhus. – Vi lyckades rädda barnet, men nu kan jag inte sluta tänka på barnets framtid och kvinnans sex andra barns framtid. Vad kommer att hända dem utan deras mor?, frågar hon sig. Alla har dock inte tappat hoppet om sitt land. 24-åriga Noori studerar juridik och statsvetenskap för att ge kvinnor en röst och försvara deras rättigheter. Nu har hon startat eget för att skapa arbetstillfällen för andra kvinnor. – För närvarande arbetar tio modiga kvinnor här, säger Noori.", "link": "https://www.tv4.se/artikel/13SH4w9BuQu2rdildMwomY/fem-ar-med-talibanstyre-ett-gammalt-sar-som-rivs-upp", "date_display": "2026-08-15", "date_iso": "2026-08-15T17:57:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/talibaner", "/afghanistan"]}, {"id": 145, "title": "Fredrik has lost all his possessions: \"Our life that is gone\"", "summary": "A fire broke out in a terraced house in Arboga on Friday afternoon. The fire spread very quickly and according to the rescue service it was difficult to stop the spread of the flames. A total of 16 homes were completely destroyed and around 50 people have lost their homes. One of them is Fredrik Göranzon. TV4 News meets him in front of the remains of his residence. - What we see now are the remains of our home, our garden. Our life that is simply gone. We don't own anything more than what we're wearing right now, he says. \"Hardest 20 minutes of my life\" Fredrik was at his job in Örebro when the fire broke out. He received a call from a neighbor who said that half the row of townhouses was in flames, but that the fire had not yet spread to his house. - He said I should get in the car and drive as fast as hell. Then he called again after five minutes and said 'Fredrik, you can slow down. The whole house is in flames, it is impossible to save anywhere'. He said it was an inferno, says Fredrik. The drive from Örebro normally takes around 30 minutes. - I almost threw up in the car. I just wanted to get there as fast as possible. It was the hardest 20 minutes of my life, says Fredrik. \"Haven't started to understand until now\" There is still smoke from the remains of the terraced house. The only thing left is rubble and some fence remains. - I've seen it on TV and in groups on social media, but couldn't get close yesterday because of all the cordons. I felt that I needed to come here and see it with my own eyes to be able to take it in and get an ending, says Fredrik. He describes sadness and despair, but most of all he feels empty. - I haven't started to understand until now. You shake when you get the hugs, it's so unimaginable. There are so many who have lived here for so many years and raised families and now have their homes destroyed.  Strong support from the community The support from the environment has been great. Fredrik describes how the residents quickly got a collection point where the police, social services and crisis support group met. Fo", "title_original": "Fredrik har förlorat alla sina ägodelar: ”Vårt liv som är borta”", "summary_original": "En brand bröt ut i en radhuslänga i Arboga på fredagseftermiddagen. Branden fick mycket snabb spridning och enligt räddningstjänsten var det svårt att stoppa lågornas spridning. Totalt 16 bostäder totalförstördes och ett 50-tal personer har förlorat sina hem. En av dem är Fredrik Göranzon. TV4 Nyheterna träffar honom framför resterna av hans bostad. – Det vi ser nu är resterna av vårt hem, vår trädgård. Vårt liv som är borta helt enkelt. Vi äger inget mer än det vi har på oss just nu, säger han. ”Jobbigaste 20 minuterna i mitt liv”  Fredrik var på sitt jobb i Örebro när branden bröt ut. Han fick ett samtal från en granne som sa att halva radhuslängan stod i lågor, men att branden ännu inte spridit sig till hans hus. – Han sa att jag skulle sätta mig i bilen och köra fort som sjutton. Sen ringde han igen efter fem minuter och sa 'Fredrik, du kan sakta ner. Hela huset står i lågor, det går inte att rädda någonstans'. Han sa att det var ett inferno, säger Fredrik. Bilresan från Örebro tar normalt omkring 30 minuter. – Jag kräktes nästan i bilen. Jag ville bara komma dit så fort som möjligt. Det var de jobbigaste 20 minuterna i mitt liv, säger Fredrik. ”Har inte börjat förstå förrän nu” Det ryker fortfarande från resterna radhuset. Det enda som finns kvar är bråte och lite staketrester. – Jag har sett det på tv och i grupper på sociala medier, men kunde inte komma nära igår på grund av alla avspärrningar. Jag kände att jag behövde komma hit och se det med egna ögon för att kunna ta in det och få ett avslut, säger Fredrik. Han beskriver sorg och förtvivlan, men mest av allt känner han sig tom. – Jag har inte börjat förstå förrän nu. Man skakar när man får kramarna, det är så ofattbart. Det är så många som har bott här i så många år och bildat familj och nu fått sina hem förstörda.  Starkt stöd från samhället Stödet från omgivning har varit varit stort. Fredrik beskriver hur de boende snabbt fick en uppsamlingsplats där polis, socialtjänst och krisstödsgrupp mötte upp. Folk har dessutom skänkt så mycket kläder att man behövt stoppa nya gåvor. – Det är så fint. Det visar hur Arboga är som stad: vi sluter upp och erbjuder boenden, kläder, leksaker och allt sådant som är basalt. Det är otroligt bra, säger Fredrik.", "link": "https://www.tv4.se/artikel/3nxrzmeAaguWqYQ9x7tDmJ/fredrik-har-foerlorat-alla-sina-aegodelar-vart-liv-som-aer-borta", "date_display": "2026-08-15", "date_iso": "2026-08-15T15:37:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brand", "/arboga"]}, {"id": 146, "title": "Warns before the London trip: \"High risk of scams\"", "summary": "Since 2 April 2025, an entry permit, ETA (Electronic Travel Authorization), is required to travel to the UK. The application is made easily via the UK Government's official website. But those who google keywords like \"visa UK\" are often met with sponsored links to companies that charge money to help travelers apply for the permit. When Tanya Lundmark was due to travel to her daughter in London, she was close to paying £90 in fees on top of the £20 official application fee. - I was so pissed off when I saw they wanted 90 pounds. For what? It was exactly the same questions as on the official page, she tells TV4 Nyheterna. She reported the incident to the Swedish Consumer Agency. - It sounded very good and contained exactly the same questions as on the British authority's website. \"Grossly immoral\" According to Swedavia, nearly 600,000 Swedes travel to Great Britain each year via the company's ten airports. The real number may be higher because the statistics do not include travelers from southern Sweden who fly via Copenhagen Airport Kastrup. Travel expert Lottie Knutson says that what Tanya Lundmark encountered is a well-known problem. - I have also heard of a person who made the same mistake. It is terrible and grossly immoral, she says. According to Knutson, fraudsters often go to markets where there is both money and stress, especially when rules or routines are new. - People who travel to the USA have learned. But here there is a really high risk of scams. Entry permits are something new for us Europeans and many are looking for information at the last minute before a trip. It's an ideal situation for fraudsters, she says. Established method TV4 Nyheterna has previously reported on companies that charge for mediating services that authorities offer free of charge or at a significantly lower fee. The travel industry is no exception. TV4 Nyheterna has received several reports to the Swedish Consumer Agency from people who felt misled. Daniel B", "title_original": "Varnar inför Londonresan: ”Hög risk för lurendrejerier”", "summary_original": "Sedan den 2 april 2025 krävs ett inresetillstånd, ETA (Electronic Travel Authorisation), för att resa till Storbritannien. Ansökan görs enkelt via den brittiska regeringens officiella webbplats. Men den som googlar på sökord som ”visum UK” möts ofta av sponsrade länkar till företag som tar betalt för att hjälpa resenärer att ansöka om tillståndet. När Tanya Lundmark skulle resa till sin dotter i London var hon nära att betala 90 pund i avgift utöver den officiella ansökningsavgiften på 20 pund. – Jag blev så förbannad när jag såg att de ville ha 90 pund. För vad? Det var ju exakt samma frågor som på den officiella sidan, säger hon till TV4 Nyheterna. Händelsen anmälde hon till Konsumentverket. – Det lät väldigt bra och innehöll precis samma frågor som på den brittiska myndighetens sajt. ”Gravt omoraliskt” Enligt Swedavia reser närmare 600 000 svenskar till Storbritannien varje år via bolagets tio flygplatser. Det verkliga antalet kan vara högre eftersom statistiken inte omfattar resenärer från södra Sverige som flyger via Köpenhamns flygplats Kastrup. Reseexperten Lottie Knutson säger att det Tanya Lundmark råkade ut för är ett välkänt problem. – Jag har också hört om en person som gjort samma misstag. Det är fruktansvärt och gravt omoraliskt, säger hon. Enligt Knutson söker sig bedragare ofta till marknader där det finns både pengar och stress, särskilt när regler eller rutiner är nya. – Folk som reser till USA har lärt sig. Men här är det riktigt hög risk för lurendrejerier. Inresetillstånd är något nytt för oss européer och många söker information i sista minuten inför en resa. Det är en idealisk situation för bedragare, säger hon. Etablerad metod TV4 Nyheterna har tidigare rapporterat om företag som tar betalt för att förmedla tjänster som myndigheter erbjuder kostnadsfritt eller till en betydligt lägre avgift. Resebranschen är inget undantag. TV4 Nyheterna har tagit del av flera anmälningar till Konsumentverket från personer som upplevt sig vilseledda. Daniel Bernspång, vägledare på Konsumentverket, säger att verksamheten – precis som i tidigare fall där personer betalat för hjälp med skilsmässa eller utträde ur Svenska kyrkan – inte är olaglig. – Företag får erbjuda tjänster för att söka den här typen av inresetillstånd och så vidare. Men det måste vara tydligt att de tar betalt för tjänsten och vad den kostar. Man måste vara tydlig med vad man marknadsför, men det är inte olagligt, säger han. Lottie Knutsons bästa råd till den som ska resa till Storbritannien och vill undvika att betala betydligt mer för sin ETA-ansökan är att använda den officiella appen. – Det är väldigt synd att Storbritannien, som har så täta band med EU, har infört det här certifikatet. Men nu när det väl finns bör man absolut ladda ner den officiella appen, säger hon.", "link": "https://www.tv4.se/artikel/3Jyz09rnaf2tKleydmhsKz/varnar-infoer-londonresan-hoeg-risk-foer-lurendrejerier", "date_display": "2026-08-15", "date_iso": "2026-08-15T15:13:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/utrikes", "/ekonomi", "/storbritannien", "/london", "/gratis-till-salu", "/bluff"]}, {"id": 147, "title": "Örjan Ramberg is dead", "summary": "\"Dad fell asleep yesterday at Ersta Hospice. Me and my brother George were there. I held his hand and the church bells rang. Extremely sad,\" writes Tilde Fröling in a comment to TV4 Nyheterna. The death is confirmed for TV4 Nyheterna by Dramaten's press officer Lena Törner. Stormy privacy \"Örjan Ramberg is a large part of Dramaten's modern history in many different ways. Of course, it is impossible even today to avoid the memory of the controversies and conflicts that were connected to his person and his departure in 2019. But that he made a long series of fantastic role performances in iconic productions throughout Dramaten's history is unequivocal,\" the theater wrote in a post on Instagram that was later removed. Ramberg's private life was at times stormy and surrounded by a series of controversies. \"Your last years were not the years I had wished for you. There was a lot of harshness, hatred and contempt directed at you. But a person's life is bigger than their mistakes and actions,\" writes daughter Tilde Fröling in a longer post on Instagram. Ramberg lived in the 90s together with the artist Josefin Nilsson, a relationship that was mentioned - however without Ramberg being mentioned by name - in the SVT documentary \"Josefin Nilsson - Älska mig för den jag är\" from 2019. Employed at Dramaten for 42 years Örjan Ramberg, born in Örgryte in Gothenburg, had one of the most prominent careers on the Swedish theater scene. After early musical roles in Hair and Jesus Christ Superstar, he attended the Scenskolan in Malmö - and in 1977 he became part of Dramaten's permanent ensemble. Among his most noted efforts are the roles of the Master in The Master and Margarita and Prospero in The Tempest. On film, he got his big break as the liberated and rebellious Bart in the Ulf Lundell film adaptation Jack. For his performing arts, he was awarded the Eugene O'Neill Scholarship in 2001 and the Royal Medal Litteris et Artibus. Örjan Ramberg turned 78.", "title_original": "Örjan Ramberg är död", "summary_original": "”Pappa somnade in igår på Ersta Hospice. Jag och min bror George var där. Jag höll hans hand och kyrkklockorna ringde. Oerhört sorgligt”, skriver Tilde Fröling i en kommentar till TV4 Nyheterna. Dödsfallet bekräftas för TV4 Nyheterna av Dramatens pressansvarige Lena Törner. Stormigt privatliv ”Örjan Ramberg är en stor del av Dramatens moderna historia på många olika sätt. Såklart är det omöjligt även idag att undvika minnet av de kontroverser och konflikter som var kopplade till hans person och hans avgång 2019. Men att han gjort en lång rad fantastiska rollprestationer i ikoniska uppsättningar genom Dramatens historia är otvetydigt”, skrev teatern i ett inlägg på Instagram som senare togs bort. Rambergs privatliv var tidvis stormigt och kantades av en rad kontroverser. ”Dina sista år blev inte de år jag hade önskat dig. Det fanns mycket hårdhet, hat och förakt riktat mot dig. Men en människas liv är större än hennes misstag och handlingar”, skriver dottern Tilde Fröling i ett längre inlägg på Instagram. Ramberg levde på 90-talet tillsammans med artisten Josefin Nilsson, en relation som omtalades – dock utan att Ramberg nämndes vid namn – i SVT-dokumentären ”Josefin Nilsson – Älska mig för den jag är” från 2019. Anställd vid Dramaten i 42 år Örjan Ramberg, född i Örgryte i Göteborg, hade en av de mest framträdande karriärerna på svensk teaterscen. Efter tidiga musikalroller i Hair och Jesus Christ Superstar gick han Scenskolan i Malmö – och 1977 blev han en del av Dramatens fasta ensemble. Bland hans mest uppmärksammade insatser finns rollerna som Mästaren i Mästaren och Margarita och Prospero i Stormen. På film fick han sitt stora genombrott som den frigjorde och rebelliske Bart i Ulf Lundell-filmatiseringen Jack. För sin scenkonst tilldelades han bland annat Eugene O'Neill-stipendiet 2001 och den kungliga medaljen Litteris et Artibus. Örjan Ramberg blev 78 år.", "link": "https://www.tv4.se/artikel/2mDopyvpTssVtxZm9BKdHy/skadespelaren-oerjan-ramberg-aer-doed", "date_display": "2026-08-15", "date_iso": "2026-08-15T13:46:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/noje", "/dramaten", "/skadespelare", "/orjan-ramberg"]}, {"id": 148, "title": "Elisabeth Thand Ringqvist (C) on threats to politicians: \"It affected me\"", "summary": "The C leader emphasized that politicians have an important responsibility for the tone of the social debate when she was asked at the Vårgårda meeting", "title_original": "Elisabeth Thand Ring­qvist (C) om hot mot politiker: ”Det drabbade mig”", "summary_original": "C-ledaren betonade att politiker har ett viktigt ansvar för tonen i samhälls­debatten då hon frågades ut på Vårgårda möte", "link": "https://www.dagen.se/nyheter/elisabeth-thand-ringqvist-c-om-hot-mot-politiker-det-drabbade-mig/10481396", "date_display": "2026-08-15", "date_iso": "2026-08-15T12:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Joel Halldorf stopped in the Church of Sweden - was considered partisan", "summary": "The church historian was to talk about migration in Skara Cathedral before the election", "title_original": "Joel Halldorf stoppad i Svenska kyrkan – ansågs för partipolitisk", "summary_original": "Kyrkohistorikern skulle prata om migration i Skara domkyrka inför valet", "link": "https://www.dagen.se/nyheter/joel-halldorf-stoppad-i-svenska-kyrkan-ansags-foer-partipolitisk/10481481", "date_display": "2026-08-15", "date_iso": "2026-08-15T12:28:33+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Father and son Hedman's great ordeal: \"Disgusting\"", "summary": "When Magnus and Lancelot Hedman agreed to participate in the Secrets of the Elite Force VIP, it was with a desire to do something unique together. But the challenge turned out to be much tougher than they could have imagined. - It was terrible. When I was asked the question, I thought: \"How difficult can it be\". But I had to eat it. It was disgusting, says Lancelot Hedman. Physical and mental pressure Right from the start, the participants were thrown into ice-cold water and sleep deprivation, without the opportunity to fully prepare. Exercise and cold baths at home were not enough. - When you stand on a boat and go down into six-degree water after two hours in a leather jacket and shirt... You can't prepare for that, says Lancelot. The uncertainty and lack of food also left its mark. Not knowing when the next challenge will come or when you have to take a toll on both body and psyche. - When you haven't eaten for two days and get a deciliter of oatmeal, then it means everything, he says. Joint journey after addiction Both Magnus and Lancelot have previously struggled with addiction, something that also became part of their journey in the program. The experiences have given them a special understanding of adversity. - What we have been through has given us a foundation to start from today. We can deal with adversity in ways that many people may not be able to, says Magnus Hedman. But both father and son agree that everyone was equally vulnerable during the competition. - The fact that you like to drink alcohol shouldn't help when you jump off a fucking plane. In the program there was no advantage, we were all there on the same premises, says Lancelot. From words to action The relationship between father and son was both tested and strengthened during the recording. Making the journey together has given new insights into each other. - In an active addiction, \"sorry\" is a perfect exit from what you have done and from the present. But it is abused, says Magnus Hedman. He thinks it needs to go from words to action. After the recordings, both describe that they gained new perspectives on themselves and theirs", "title_original": "Far och son Hedmans stora prövning: ”Vidrigt”", "summary_original": "När Magnus och Lancelot Hedman tackade ja till att delta i Elitstyrkans hemligheter VIP var det med en önskan att göra något unikt tillsammans. Men utmaningen blev betydligt tuffare än de kunnat föreställa sig. – Det var fruktansvärt. När jag fick frågan tänkte jag: ”Hur svårt kan det vara”. Men det fick jag äta upp. Vidrigt var det, säger Lancelot Hedman. Fysisk och mental press Redan från start kastades deltagarna in i iskalla vatten och sömnbrist, utan möjlighet att förbereda sig fullt ut. Träning och kallbad hemma räckte föga. – När man står på en båt och ska ner i sexgradigt vatten efter två timmar i läderjacka och skjorta… Det går inte att förbereda sig för, säger Lancelot. Även ovissheten och bristen på mat satte spår. Att inte veta när nästa utmaning kommer eller när man får äta tärde på både kropp och psyke. – När man inte har käkat på två dagar och får en deciliter havregryn, då betyder det allt, säger han. Gemensam resa efter missbruk Både Magnus och Lancelot har tidigare kämpat med missbruk, något som också blev en del av deras resa i programmet. Erfarenheterna har gett dem en särskild förståelse för motgångar. – Det vi har gått igenom har gett oss ett fundament att utgå ifrån i dag. Vi kan hantera motgångar på sätt som många kanske inte kan, säger Magnus Hedman. Men både far och son är överens om att alla var lika utsatta under tävlingens gång. – Att man gillar att dricka sprit ska inte hjälpa när man hoppar ner från ett jävla flygplan. I programmet var det ingen fördel, vi alla var där på samma premisser, säger Lancelot. Från ord till handling Relationen mellan far och son har både satts på prov och stärkts under inspelningen. Att göra resan tillsammans har gett nya insikter om varandra. –  I ett aktivt missbruk är ”förlåt” en perfekt exit från det du har gjort och från nuet. Men det missbrukas, säger Magnus Hedman. Han tycker att det behöver gå från ord till handling. Efter inspelningarna beskriver båda att de fått nya perspektiv på sig själva och sin relation. – Man lär känna varandra på djupet på ett sätt som man aldrig gör annars, säger Magnus Hedman.", "link": "https://www.tv4.se/artikel/6z2WeVu8KdqyCQJdz8FgZV/far-och-son-hedmans-stora-proevning-vidrigt", "date_display": "2026-08-15", "date_iso": "2026-08-15T11:59:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/elitstyrkans-hemligheter-sverige", "/elitstyrkans-hemligheter-vip", "/magnus-hedman", "/personer/lancelot-hedman-graaf", "/missbruk"]}, {"id": 151, "title": "Tusen wrote the citizenship test: \"Hope I passed it\"", "summary": "Earlier this year, the requirements to become a Swedish citizen were tightened. The new requirements mean, among other things, that people between 16 and 66 who apply for citizenship must demonstrate knowledge of the Swedish language and Swedish society.  On Saturday, the first citizenship test in social studies was written in Sweden. About a thousand people gathered at the Stockholm Fair in Älvsjö to write the exam. Andrea Macarie comes from Romania and has lived in Sweden for nine years. She also thinks the test was easy, but unlike Martin thinks it's good that it exists. - I think it is important to learn about Swedish society. Out of 60 questions, there were seven where I was a little unsure, but I think I guessed right. \"Good way to learn\" Ibrahim Diouf has traveled from Gävle to write the exam. - It felt great. I have studied a lot so I hope I passed it, he tells TV4 Nyheterna. - I have lived in Sweden for 20 years now and there was a lot on the test that I didn't know. So it's a good way to learn.  One of those present at the Stockholm Fair on Saturday was Migration Minister Johan Forssell (M). - This is important. If you want to become a citizen of our fantastic country, you have to know a little about what Sweden is, how it works, our culture, healthcare history - but also how our democracy works. Otherwise, it is very difficult to get this community in Sweden that we want to achieve, he tells TV4 Nyheterna. \"This is a waste of time\" Martin Petersson, who has lived in Sweden for nine years, was one of the first to emerge from the test. He coldly expects to be approved. - This wastes time for many, I think. It was so easy, says Martin to TV4 Nyheterna. But the migration minister does not agree that the test would be a waste of time. - I think that if you want to become a citizen with all the freedoms and rights that entails, it is reasonable to make an effort. These are not strange demands, but the strange thing is that you have been able to be until now", "title_original": "Tusen skrev medborgarskapsprov: ”Hoppas att jag klarade det”", "summary_original": "Tidigare i år skärptes kraven för att bli svensk medborgare. De nya kraven innebär bland annat att personer mellan 16 och 66 som ansöker om medborgarskap måste visa kunskaper i svenska språket och om det svenska samhället.  På lördagen skrevs det första medborgarskapsprovet i samhällskunskap i Sverige. Omkring tusen personer samlades på Stockholmsmässan i Älvsjö för att skriva provet. Andrea Macarie kommer från Rumänien och har bott i Sverige i nio år. Hon tycker också att provet var enkelt, men tycker till skillnad från Martin att det är bra att det finns. – Jag tycker att det känns viktigt att lära sig om det svenska samhället. Av 60 frågor var det sju där jag var lite osäker, men jag tror att jag har gissat rätt. ”Bra sätt att lära sig” Ibrahim Diouf har åkt från Gävle för att skriva provet. – Det kändes jättebra. Jag har pluggat väldigt mycket så jag hoppas att jag klarade det, säger han till TV4 Nyheterna. – Jag har bott i Sverige i 20 år nu och det var mycket på provet som jag inte visste. Så det är ett bra sätt att lära sig.  En av de som var på plats på Stockholmsmässan på lördagen var migrationsminister Johan Forssell (M). – Det här är viktigt. Om man vill bli medborgare i vårt fantastiska land måste man känna till lite om vad Sverige är, hur det fungerar, vår kultur, vård historia – men också hur vår demokrati fungerar. Annars är det väldigt svårt att få den här gemenskapen i Sverige som vi vill uppnå, säger han till TV4 Nyheterna. ”Det här slösar tid” Martin Petersson, som har bott i Sverige i nio år, var en av de första som kom ut från provet. Han räknar kallt med att bli godkänd. – Det här slösar tid för många tror jag. Det var så lätt, säger Martin till TV4 Nyheterna. Men att provet skulle vara slöseri med tid delar inte migrationsministern. – Jag tycker nog att om man vill bli medborgare med alla de fri- och rättigheter det innebär så är det rimligt att man anstränger sig. Det är inga konstiga krav, utan det konstiga är att man fram till nu kunnat bli medborgare utan att känna till något om Sverige och utan att kunna tala ett enda ord svenska. Det har varit en förlorad möjlighet för integrationen, säger Johan Forssell.", "link": "https://www.tv4.se/artikel/2XpIICM1Hk6X9wZKpLYpQz/tusen-skrev-medborgarskapsprov-hoppas-att-jag-klarade-det", "date_display": "2026-08-15", "date_iso": "2026-08-15T11:37:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/svenskt-medborgarskap", "/migrationspolitik", "/politik"]}, {"id": 152, "title": "Alexandra had twelve miscarriages: \"Loss upon loss\"", "summary": "Every year, tens of thousands of women in Sweden experience miscarriages. But repeated miscarriages are much rarer. For Alexandra Larsson, there were twelve miscarriages and countless visits to healthcare. There, she felt that the feelings were not captured, and has therefore started a national organization to give other affected people support. - You don't really know where the emotions go. From a medical point of view, it is an early miscarriage, but there is so much that happens within one, she says. The dream of children Alexandra says that the dream of children and having a family has been with her since childhood. When she and her then-husband started trying, she got pregnant right away. - I thought \"God, is it this easy, but then we drive\". Then I miscarried at week eight. She says that she was both sad and disappointed, but that she didn't think anything more about it. Alexandra and her husband decided to try to have children again. - But then came that day when you had gone to pee and then you see that there is a little blood in the panties, she says. IVF and recurrent losses After the third miscarriage, Alexandra was entitled to a medical examination and was to start IVF treatment. But during the waiting period she became pregnant naturally. Again she miscarried. - It will be loss after loss. And when you get home, you sit there with all the emotions and life that goes on, she says. In the end, Alexandra decided to be open about her experiences and started the National Association for Repeated Miscarriages. - It's nice to be able to use these seven years for something that can hopefully make a difference for others in the same situation, she says. The importance of daring to talk Alexandra emphasizes that grief after miscarriage is often invisible and that many feel alone. - The most important thing for me has probably been that the sadness should be there. It's existential, I think. With all the dreams and what to do with life, she says.", "title_original": "Alexandra fick tolv missfall: ”Förlust på förlust”", "summary_original": "Varje år drabbas tiotusentals kvinnor i Sverige av missfall. Men upprepade missfall är betydligt ovanligare. För Alexandra Larsson blev det tolv missfall och otaliga besök inom vården. Där upplevde hon att känslorna inte fångades upp, och har därför startat en riksorganisation för att ge andra drabbade stöd. – Man vet inte riktigt var känslorna tar vägen. Rent medicinskt är det ju ett tidigt missfall, men inom en är det så mycket som händer, säger hon. Drömmen om barn Alexandra berättar att drömmen om barn och att skaffa familj har funnits med henne sedan barndomen. När hon och hennes dåvarande man började försöka blev hon gravid direkt. – Jag tänkte ”gud, är det så här lätt, men då kör vi”. Sen fick jag missfall i vecka åtta. Hon berättar att hon blev både ledsen och besviken, men att hon inte tänkte mer på det. Alexandra och hennes man bestämde sig för att försöka bli med barn igen. – Men så kom den där dagen när man hade varit och kissat och så ser man att det är lite blod i trosorna, säger hon. IVF och återkommande förluster Efter det tredje missfallet fick Alexandra rätt till medicinsk utredning och skulle inleda IVF-behandling. Men under väntetiden blev hon gravid på naturlig väg. Återigen fick hon missfall. – Det blir förlust på förlust. Och när man kommer hem sitter man där med alla känslor och livet som fortsätter, säger hon. Till slut bestämde sig Alexandra för att vara öppen med sina erfarenheter och startade Riksförbundet för Upprepade Missfall. – Det är fint att kunna använda de här sju åren till någonting som förhoppningsvis kan göra skillnad för andra i samma situation, säger hon. Vikten av att våga prata Alexandra betonar att sorgen efter missfall ofta är osynlig och att många känner sig ensamma. – Det viktigaste för mig har nog varit att sorgen ska få finnas. Det är existentiellt, tycker jag. Med alla drömmar och vad man ska göra av livet, säger hon.", "link": "https://www.tv4.se/artikel/2v4JdYinrjU7N7gpQ8zU5s/efter-tolv-missfall-nu-vill-alexandra-hjaelpa-andra", "date_display": "2026-08-15", "date_iso": "2026-08-15T09:52:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/missfall", "/ivf", "/gravididet", "/sjukvard", "/kvinnlig-sjukvard", "/halsa"]}, {"id": 153, "title": "M: Before open offender register", "summary": "Recently, a new law came into force in Ireland, \"Jennie's law\", which means that information about convicted offenders is published in public records. Now the Moderates want to review the legal possibilities to introduce a similar register in Sweden, if the party remains in government after the election. This targets what is typical of men's violence against women. But I'm open to even dangerous women taking part, says Strömmer. Difficult decisions In Ireland, the legislation means in short that anyone who has been convicted of serious crimes such as murder, rape, sexual assault or gross violation of women's privacy after a decision by the judge in the case has their name and details published in public searchable registers. Strömmer envisions that the Swedish register should be structured in a similar way. But there are difficult balances, he believes. Those who have committed crimes must be given a reasonable chance to come back. There is also a risk that, in exchange, information that is sensitive to crime victims is revealed. You can look at whether data should be thinned out after a certain time and whether victims of crime should have to give their approval, says Strömmer and continues: But the interest in creating a wider security for women in society means that we are ready to open this door. Increased checks in apps The moderates also propose that dating apps should be given increased opportunities to perform background checks, by having limited access to the criminal record, in order to protect users against perpetrators. Women's vulnerability is often talked about, but you can't just do that in words. You have to do it in action as well, and that must involve offensive measures, says Linda Obiedzinski, vice-chairman of the Moderate Youth Ban.", "title_original": "M: Inför öppet förövarregister", "summary_original": "Nyligen trädde en ny lag i kraft i Irland, \"Jennie’s law\", som innebär att information om dömda förövare publiceras i offentliga register. Nu vill Moderaterna se över de rättsliga möjligheterna till att införa ett liknande register i Sverige, om partiet sitter kvar i regeringsställning efter valet. Det här riktar sig mot det som är typiskt för mäns våld mot kvinnor. Men jag är öppen för att även farliga kvinnor ska vara med, säger Strömmer. Svåra avväganden I Irland innebär lagstiftningen i korthet att den som dömts för allvarliga brott som exempelvis mord, våldtäkt, sexuella övergrepp eller grov kvinnofridskränkning efter beslut av domaren i målet får sitt namn och sina uppgifter publicerade i offentliga sökbara register. Strömmer tänker sig att det svenska registret ska vara uppbyggt på ett liknande sätt. Men det finns svåra avvägningar, menar han. De som begått brott måste få en rimlig chans att komma tillbaka. Det finns också en risk att man på köpet röjer uppgifter som är känsliga för brottsoffer. Man kan titta på om uppgifter ska gallras efter en viss tid och om brottsoffer ska behöva lämna sitt godkännande, säger Strömmer och fortsätter: Men intresset för att skapa en bredare trygghet för kvinnor i samhället gör att vi är redo att öppna den här dörren. Ökade kontroller i appar Moderaterna föreslår även att dejtingappar ska få ökade möjligheter till att utföra bakgrundskontroller, genom att få en begränsad tillgång till belastningsregistret, för att kunna skydda användarna mot förövare. Det pratas ofta om kvinnors utsatthet, men det kan man inte bara göra i ord. Man måste göra det i handling också, och det måste få innebära offensiva åtgärder, säger Linda Obiedzinski, vice ordförande i Moderata ungdomsförbudet.", "link": "https://www.tv4.se/artikel/4glhdYmdmz0qRn1S03bKtg/m-infoer-oeppet-foeroevarregister", "date_display": "2026-08-15", "date_iso": "2026-08-15T09:34:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Moderaterna", "/valet-2022/moderaterna", "/svensk-politik", "/valet-2026"]}, {"id": 154, "title": "The Lighthouse Award 2026 to the musician and songwriter Michael Jeff Johnson", "summary": "Was surprised in the middle of the sing-along on the first night of Skärgårdssång", "title_original": "Fyrljuspriset 2026 till musikern och låtskrivaren Michael Jeff Johnson", "summary_original": "Överraskades mitt under allsången på första kvällen av Skärgårdssång", "link": "https://www.dagen.se/kultur/fyrljuspriset-2026-till-musikern-och-latskrivaren-michael-jeff-johnson/10481355", "date_display": "2026-08-15", "date_iso": "2026-08-15T08:41:42+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Church pastor marks against Håkan Juholt's play at the grave", "summary": "\"A tombstone is not a prop\", says vicar Lars Viper after Håkan Juholt protested against the Moderates at Gösta Bohman's grave", "title_original": "Kyrkoherde markerar mot Håkan Juholts utspel vid graven", "summary_original": "”En gravsten är inte rekvisita”, menar kyrkoherde Lars Viper efter att Håkan Juholt protesterat mot Moderaterna vid Gösta Bohmans grav", "link": "https://www.dagen.se/nyheter/kyrkoherde-markerar-mot-hakan-juholts-utspel-vid-graven/10481372", "date_display": "2026-08-15", "date_iso": "2026-08-15T08:00:52+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 156, "title": "Astronomer found dead - accused of extensive cheating", "summary": "Last week, Jason Arday left his professorship at Cambridge University in England. The origin was that the young star researcher was singled out for extensive plagiarism and cheating. \"Incessant accusations, speculation and public comments have taken a toll on both me and those I love,\" Arday said in a statement in connection with the dismissal, The Guardian reports. On Friday, Arday was found dead in his home. According to British media, he was unconscious when he was found by paramedics, and he was later pronounced dead at the scene. 30 marathons in 35 days In 2023, the then 37-year-old Jason Arday became the youngest black professor at Cambridge ever. The whole thing was seen as somewhat spectacular when Arday himself stated that due to his autism he could neither read nor write until he was 18 years old. Arday has also claimed to have run 30 marathons in 35 days and to have run nearly 1,000 kilometers in six days. However, his feats have been questioned many times in the past and Arday himself has changed his stories on several occasions. At the end of July, Arday found himself in the spotlight again when Nathan Cofnas, a former professor at Cambridge, pointed out extensive plagiarism in Arday's doctoral thesis. Accusations against Arday were also made by David Harris, professor emeritus at Cambridge. According to The Telegraph, over 100 suspected plagiarisms have been found in the text. Initiated own investigation Both Cofnas and Harris are considered controversial and Cambridge therefore first defended Arday, calling the statements \"a vile smear campaign to undermine his credibility\", reports The Guardian.  But the criticism and accusations against Arday remained and a few weeks later, Cambridge announced that they had opened an investigation into Arday's qualifications as \"new evidence emerged\". The same evening the university statement was released, Arday announced his resignation. \"The only way to end this chapter is to step aside,\" Arday said in a statement. The family: \"Long campaign a", "title_original": "Stjärnforskaren hittad död – anklagades för omfattande fusk", "summary_original": "I förra veckan lämnade Jason Arday sin professorstjänst på Cambridgeuniversitetet i England. Upprinnelsen var att den unge stjärnforskaren pekats ut för omfattande plagiering och fusk. ”Oupphörliga anklagelser, spekulationer och offentliga kommentarer har tagit hårt på både mig och dem jag älskar”, sa Arday i ett uttalande i samband med uppsägningen, rapporterar The Guardian. På fredagen hittades Arday död i sitt hem. Enlig brittiska medier var han medvetslös när han hittades av ambulanspersonal, och han förklarades senare död på platsen. 30 maraton på 35 dagar 2023 blev den då 37-årige Jason Arday den yngste svarta professorn på Cambridge någonsin. Det hela sågs smått spektakulärt då Arday själv uppget att han på grund av sin autism varken kunde läsa eller skriva förrän han var 18 år. Arday har även påstått att han sprungit 30 maraton på 35 dagar och att han sprungit nästan 1 000 kilometer på sex dagar. Hans bragder har dock ifrågasatts många gånger tidigare och Arday har själv ändrat sina historier vid flera tillfällen. I slutet av juli hamnade Arday i rampljuset på nytt när Nathan Cofnas, tidigare professor vid Cambridge, pekade ut omfattande plagiering i Ardays doktorsavhandling. Anklagelser mot Arday riktades även från David Harris, professor emeritus vid Cambridge. Enligt The Telegraph ska över 100 misstänkta plagiat ha hittats i texten. Inledde egen utredning Både Cofnas och Harris anses kontroversiella och Cambridge tog därför först Arday i försvar och kallade uttalandena för ”en vidrig smutskastningskampanj för att undergräva hans trovärdighet”, rapporterar The Guardian.  Men kritiken och anklagelserna mot Arday fanns kvar och någon vecka senare meddelade Cambridge att de inlett en utredning av Ardays kvalifikationer då ”nya bevis framkommit”. Samma kväll som uttalandet från universitet släpptes meddelade Arday att han lämnar sin tjänst. ”Det enda sättet att avsluta det här kapitlet är att kliva åt sidan”, sa Arday i ett utlåtande. Familjen: ”Lång kampanj av trakasserier” Drygt en vecka efter att ha lämnat sin tjänst hittades Arday död. Polisen utreder dödsfallet, men misstänker i nuläget inget brott, rapporterar BBC. Familjen skriver i ett uttalande att Arday utsatts för en lång kampanj av trakasserier från personer som ”inte skyr några medel i sina försök att undergräva honom” ända sedan han började sin tjänst vid Cambridge. ”Vi är chockerade över att ha förlorat denne fantastiske far, partner, bror, farbror och son”, skriver familjen.", "link": "https://www.tv4.se/artikel/69OdZbKNC8bn43KHkKKz18/stjaernforskaren-anklagades-foer-omfattande-fusk-hittad-doed", "date_display": "2026-08-15", "date_iso": "2026-08-15T07:02:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Utrikesnyheter", "/utrikes", "/universitet", "/england", "/storbritannien"]}, {"id": 157, "title": "Putting hard on hard after Trump's Hormuz threat: Will remain ours", "summary": "Claimed that the strait should become American", "title_original": "Sätter hårt mot hårt efter Trumps Hormuzhot: Kommer förbli vårt", "summary_original": "Påstod att sundet ska bli amerikanskt", "link": "https://www.tv4.se/artikel/3M2UbeNi4lWTiPVlhZYxmQ/iran-saetter-hart-mot-hart-efter-trumps-hot-sundet-foerblir-vart", "date_display": "2026-08-15", "date_iso": "2026-08-15T05:38:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna"]}, {"id": 158, "title": "So you can push the bill for the start of school", "summary": "Autumn jacket, backpack, activities and mobile phone. The list of what a parent needs to provide the children with before the start of school can be made long. As a savings economist at the loan broker Lendo, Sharon Lavie often encounters questions from worried parents who are struggling to get their finances together in connection with the start of their children's term. Individually, the expenses may not seem like much, but when they pile up, they can feel overwhelming for many households. Buy second hand Even though you as a parent may have to set a limit for what needs to be purchased, children need things that you cannot duck, notes Lavie, who gives tips on how to navigate expenses as a family. Inventory. Make sure you don't automatically buy things because you think you need them. See if you can borrow clothes from friends, exchange or buy second hand, she says, and also advises dividing the costs into portions. You may not need to buy winter overalls in August, so prioritize the essentials first. One-off costs for replenishing a child's everyday wardrobe after the summer can cost anything from just over a thousand Swedish kroner to SEK 7,000, depending on whether you buy new or used, Lavie points out. In addition, the running costs for after-school, preschool and extra-curricular activities fall into one lump sum at the start of school. Reduced fee Many parents may find it difficult to say no if their child wants to start a new activity. But maybe you don't have to deny it. Sometimes you can investigate whether, for example, the sports club can let the child participate for a reduced fee, or even for free. Most sports clubs can agree to waive the fee, especially for younger children, says Sharon Lavie. A small respite for parents who have strained finances is also available in the form of a new free amount for the leisure center fee and a leisure card for children between 7-16 years of age of SEK 550 per term. Sharon Lavie also advises on the Leisure Bank, a kind of \"gadget library\" that some municipalities offer, and where everyone, regardless of income, can borrow tracks", "title_original": "Så kan du pressa notan för skolstarten", "summary_original": "Höstjacka, ryggsäck, aktiviteter och mobiltelefon. Listan på vad man som förälder behöver förse barnen med inför skolstarten kan göras lång. Som sparekonom på låneförmedlaren Lendo möter Sharon Lavie ofta frågor från oroliga föräldrar som brottas med att få ihop ekonomin i samband med barnens terminsstart. Var och en för sig kanske utgifterna inte är så stora, men när de hopar sig kan de kännas övermäktiga för många hushåll. Köp second hand Även om man som förälder kanske måste sätta en gräns för vad som måste införskaffas, behöver barnen saker som man inte kan ducka, konstaterar Lavie, som ger tips på hur man som familj ska navigera bland utgifterna. Inventera. Se till att inte köpa på er saker automatiskt för att ni tror att ni behöver. Se om ni kan låna kläder av kompisar, byta eller köpa second hand, säger hon, och råder också att portionera ut kostnaderna. Ni kanske inte behöver köpa vinteroverall i augusti, så prioritera det mest nödvändiga först. Engångskostnader för att fylla på vardagsgarderoben för ett barn efter sommaren kan landa på allt från en dryg tusenlapp till 7 000 kronor, beroende på om man köper nytt eller begagnat, påpekar Lavie. Dessutom trillar de löpande kostnaderna för fritids, förskola och fritidsaktiviteter in i ett enda slag vid skolstart. Reducerad avgift Många föräldrar kanske tycker det är svårt att neka om ens barn vill börja en ny aktivitet. Men man kanske inte behöver neka. Ibland kan man undersöka om det exempelvis idrottsklubben kan låta barnet vara med till en reducerad avgift, eller rentav gratis. De flesta idrottsklubbar kan gå med på att stryka avgiften, särskilt för yngre barn, säger Sharon Lavie. En liten respit för föräldrar som har ansträngd ekonomi finns också i form av ett nytt fribelopp för fritidshemsavgiften och ett fritidskort för barn mellan 7–16 år på 550 kronor per termin. Sharon Lavie tipsar också om Fritidsbanken, ett slags ”prylbibliotek” som vissa kommuner erbjuder, och där alla, oavsett inkomst, kan låna sport- och fritidsutrustning gratis i 14 dagar.", "link": "https://www.tv4.se/artikel/tt-260815-skolstartutgifter1-37288cb7/sa-kan-du-pressa-notan-for-skolstarten", "date_display": "2026-08-15", "date_iso": "2026-08-15T05:32:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Privatekonomi", "/privatekonomi", "/folkhalsomyndigheten", "/ekonomi"]}, {"id": 159, "title": _original": "Russia’s full-scale invasion has put Ukraine’s health and medical system under severe pressure at the same time as care needs have increased sharply. The Government is therefore allocating SEK 6.9 million to the Swecare Foundation for 2026 to strengthen Ukraine’s health care. This is being done through training initiatives, knowledge exchange and partnerships between Swedish and Ukrainian actors, including in the business sector.", "link": "https://www.government.se/press-releases/2026/08/sweden-strengthens-ukraines-health-and-medical-care-through-partnership-and-swedish-expertise/", "date_display": "2026-08-03", "date_iso": "2026-08-03T12:00:24+00:00", "source": "Government.se", "ministry": "Ministry of Education and Research", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry of Education and Research", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Medical care", "Sweden's support to Ukraine", "Jakob Forssmed", "Benjamin Dousa", "Simona Mohamsson"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
