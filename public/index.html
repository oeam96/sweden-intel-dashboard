udiska mål. ”De använder antisemitism lite som ett slagträ i debatten”, säger judinnan Clara Sandelind om de brittiska politikernas utspel under valrörelsen.", "link": "https://www.svd.se/a/ExJyL3/svenska-judinnan-om-antisemitism-i-storbritannien", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:56:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 116, "title": "Swedish on the virus ship: \"No risk to others\"", "summary": "A Swede was previously on board the ship in the Atlantic where the hantavirus has spread - and is now being monitored by infection control. State epidemiologist Erik Sturegård wants to downplay the concerns. \"Exemplary management,\" he says.", "title_original": "Svensk på virusfartyget: ”Ingen risk för andra”", "summary_original": "En svensk befann sig tidigare ombord på fartyget i Atlanten där hantaviruset har spridits – och följs nu av smittskyddet. Statsepidemiolog Erik Sturegård vill tona ned oron. ”Skötts exemplariskt,” säger han.", "link": "https://www.svd.se/a/Wv6RAd/sa-hanterar-sverige-andesviruset-tf-statsepidimolog-erik-sturegard-svarar", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:54:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 117, "title": "We toast more - consumption increases", "summary": "Household consumption is increasing, mostly on culture and entertainment, new statistics show.", "title_original": "Vi skålar mer – konsumtionen ökar", "summary_original": "Hushållens konsumtion ökar, mest på kultur och nöjen, visar ny statistik.", "link": "https://www.sydsvenskan.se/ekonomi/vi-skalar-mer-konsumtionen-okar/", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:50:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "The roaster unmasked in \"Masked singer\"", "summary": "The jury's Pernilla Wahlgren was right in her guess when she guessed that it was the high jumper Stefan Holm who hid behind the \"roaster\".  I can run for the 10,000 kroner question in Stefan Holm, said Wahlgren.  One of the clues was that Stekaren was called a \"higher\" who is used to making \"super cuts\" - a reference to the scissoring technique of high jumping. Another clue was that Stekaren was a travel expert, which meant that Holm had previously won \"På spåret\". The whole craziness of being dressed up as a big yellow banana and standing on stage and singing, it's incredibly fun, said Stefan Holm about the experience.", "title_original": "Stekaren avmaskerad i ”Masked singer”", "summary_original": "Juryns Pernilla Wahlgren prickade rätt i sin gissning då hon tippade att det var höjdhopparen Stefan Holm som gömde sig bakom ”stekaren”.  Jag kan ställa upp i 10 000-kronorsfrågan i Stefan Holm, sade Wahlgren.  En av ledtrådarna var att Stekaren kallades för en ”höjdare” som är van att göra ”superklipp” – en referens till höjdhoppningens teknik att saxa. En annan ledtråd var att Stekaren var en reseexpert vilket syftade till att Holm tidigare vunnit ”På spåret”. Hela galenskapen med att vara utklädd till en stor gul banan och stå på scen och sjunga, det är otroligt kul, sade Stefan Holm om upplevelsen.", "link": "https://www.tv4.se/artikel/tt-260508-maskedsinger1-1faf7fb9/stekaren-avmaskerad-i-masked-singer", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:49:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/konst", "/stefan-holm", "/kultur", "/personer/pernilla-wahlgren", "/masked-singer-sverige"]}, {"id": 119, "title": "Letter to the editor. Noted by DN's readers on May 8", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Friday, May 8.", "title_original": "Insändare. Noterat av DN:s läsare den 8 maj", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll fredagen den 8 maj.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-8-maj-4/", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:43:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Barbecue brushes are inspected - after serious accidents", "summary": "Last year, TV4 Nyheterna told about Harriet Kyolaba Johansson, who had to undergo stomach surgery after ingesting steel wire from a barbecue brush. - One day the whole stomach swelled up. It hurt so much, I couldn't drink. So I called a friend who drove me to the emergency room, she says. Harriet had to have twelve centimeters of small intestine removed in the operation. Afterwards, she contacted the shop where she bought the grill brush to alert them to the risks of using it. After showing the receipt and speaking to local media, she was offered a token sum from the store's insurance company for lost income for the weeks she was on sick leave after the operation. Investigated by the Swedish Consumer Agency Now the Swedish Consumer Agency has decided to investigate the barbecue brushes, the authority states in a press release - on the day of the barbecue, too. Several reports have been made in Sweden and the Swedish Consumer Agency has also seen similar cases abroad. - We monitored the world around us and saw that in the American market there are medical studies that estimate that there are thousands of cases where people have been affected. So we decided to do a market check with random samples on the Swedish market to check safety, says Catrine Niiranen Tengqvist, a lawyer at the Swedish Consumer Agency, to TV4 Nyheterna. The Swedish Consumer Agency is to test steel-bristle grill brushes from six major retailers and has requested documentation of tests carried out to ensure the brushes are safe. - In the next step, we go through the documentation to do our own check and see if the brushes meet the requirements for a safe product, says Catrine Niiranen Tengqvist. \"The risk exists and is real\" The Swedish Consumer Agency cannot yet say whether there is a particular brand that stands out - and the manufacturers themselves write on the label that you must be careful when using the brush. - We see that there is a risk that the manufacturer himself informs about, and therefore you must be careful to check the brush and the grill before you start gr", "title_original": "Grillborstar granskas – efter allvarliga olyckorna", "summary_original": "Förra året berättade TV4 Nyheterna om Harriet Kyolaba Johansson som tvingades operera magen efter att ha fått i sig ståltråd från en grillborste. – En dag svällde hela magen upp. Det gjorde jätteont, jag kunde inte dricka. Så jag ringde en kompis som körde mig till akuten, säger hon. Harriet var tvungen att ta bort tolv centimeter tunntarm i operationen. Efteråt kontaktade hon butiken där hon köpt grillborsten för att uppmärksamma dem på riskerna med den. Efter att ha visat upp kvittot och pratat med lokala medier erbjöds hon en symbolisk summa från butikens försäkringsbolag för förlorad inkomst de veckor hon varit sjukskriven efter operationen. Utreds av Konsumentverket Nu har Konsumentverket beslutat att utreda grillborstarna, uppger myndigheten i ett pressmeddelande – på grillens dag dessutom. Flera anmälningar har gjorts i Sverige och Konsumentverket har även sett liknande fall utomlands. – Vi gjorde en omvärldsbevakning och såg att det på den amerikanska marknaden finns medicinska studier som uppskattar att det finns tusentals fall där människor blivit drabbade. Så vi bestämde oss för att göra en marknadskontroll med stickprov på den svenska marknaden för att kontrollera säkerheten, säger Catrine Niiranen Tengqvist, jurist på Konsumentverket, till TV4 Nyheterna. Konsumentverket ska testa grillborstar med stålborst från sex stora återförsäljare och har begärt dokumentation om tester som gjorts för att säkerställa att borstarna är säkra. – I nästa steg går vi igenom dokumentationen för att göra vår egen kontroll och se om borstarna uppfyller kraven för en säker produkt, säger Catrine Niiranen Tengqvist. ”Risken finns och är verklig” Konsumentverket kan ännu inte säga om det är något speciellt märke som sticker ut – och tillverkarna skriver själva på etiketten att man måste vara aktsam när borsten används. – Vi ser att det finns en risk som tillverkaren själv upplyser om och därför måste man vara noggrann med att kontrollera borsten och grillen innan man börjar grilla. Risken finns och är verklig, säger Catrine Niiranen Tengqvist. Myndigheten har i dagsläget kännedom om tre fall i Sverige där personer drabbats av stål som lossnat från grillborstar. Det finns dock en risk att fler har drabbats. – Om man ser till den amerikanska marknaden så kan man tänka sig att det finns ett mörkertal.", "link": "https://www.tv4.se/artikel/5KOrNGHm4xvMlnOans5sps/grillborstar-granskas-efter-allvarliga-olyckorna", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:21:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/grillning", "/konsumentverket"]}, {"id": 121, "title": "18-year-old is suspected of directing knife attacks over the internet", "summary": "Via a video chat, the 18-year-old in Umeå is suspected of having followed and masterminded a knife attack in Stockholm in the fall of 2024. The man, who is described as a leading figure in a sadistic online group, is now charged with a long list of crimes.", "title_original": "18-åring misstänks ha styrt knivdåd över nätet", "summary_original": "Via en videochatt misstänks 18-åringen i Umeå ha följt och detaljstyrt ett knivdåd i Stockholm hösten 2024. Mannen, som beskrivs som en ledarfigur i en sadistisk nätgrupp, åtalas nu för en lång rad brott.", "link": "https://www.dn.se/sverige/18-aring-misstanks-ha-styrt-knivdad-over-natet/", "date_display": "2026-05-08", "date_iso": "2026-05-08T19:12:25+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "The Republicans claim a heavy victory in court", "summary": "WASHINGTON. An attempt to redraw Virginia's electoral districts in favor of Democrats was invalidated Friday by the state's highest court. The decision means a heavy victory for the Republicans ahead of the autumn's important mid-term elections.", "title_original": "Republikanerna kammar hem tung seger i domstol", "summary_original": "WASHINGTON. Ett försök att rita om Virginias valkretsar till Demokraternas fördel ogiltigförklarades på fredagen av delstatens högsta domstol. Beslutet innebär en tung seger för Republikanerna inför höstens viktiga mellanårsval.", "link": "https://www.dn.se/varlden/republikanerna-kammar-hem-tung-seger-i-domstol/", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:53:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Martin Liby Troein: Trump flexes his muscles - and makes the US look weaker than ever", "summary": "Next week, Xi Jinping will receive the President of the United States. China's leader is the big winner of the war in Iran.", "title_original": "Martin Liby Troein: Trump spänner musklerna – och får USA att se svagare ut än någonsin", "summary_original": "Nästa vecka tar Xi Jinping emot USA:s president. Kinas ledare är den stora vinnaren på kriget i Iran.", "link": "https://www.dn.se/ledare/martin-liby-troein-trump-spanner-musklerna-och-far-usa-att-se-svagare-ut-an-nagonsin/", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:34:32+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Trump: Cease fire in the Ukraine war this weekend", "summary": "Zelenskyy confirms: I thank the President of the United States", "title_original": "Trump: Vapenvila i Ukrainakriget i helgen", "summary_original": "Zelenskyj bekräftar: Jag tackar USA:s president", "link": "https://www.tv4.se/artikel/OGZpZHVE9a6WfIB2KI3Iz/trump-vapenvila-i-ukrainakriget-i-helgen", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:21:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 125, "title": "A good writer lets himself down", "summary": "Witold Gombrowicz settled the notion of a stable and authentic self long before the autofictional boom of our time. Today, when literature is stuck in the hall of mirrors of the self, his thinking appears as a possible, welcome way out.", "title_original": "En bra författare sviker sig själv", "summary_original": "Witold Gombrowicz gjorde upp med föreställningen om ett stabilt och autentiskt jag långt före vår tids autofiktiva boom. I dag, när litteraturen fastnat i jagets spegelsal, framstår hans tänkande som en möjlig, välkommen utväg.", "link": "https://www.svd.se/a/16qPXJ/en-bra-forfattare-sviker-sig-sjalv", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 126, "title": "14-year-old Don leads his own soccer team", "summary": "In many parts of the country, it is difficult to find adults who want to get involved as coaches at the grassroots level in youth football. After being injured for a long period, the home club in Sala chose to think again when Don showed an interest in leadership. He has quickly become an important part of the team's development, but for Don it was not an obvious choice. - At first I thought so, I hesitated a little but then I said \"yes\", he says. Challenges and dreams Being a coach for a team where you yourself are the same age as the players can mean special challenges. Don, who has played on the team himself, says that it can be difficult at times – it has been all the more important to separate the role of friend and coach. - I try my best, I show the difference between training and being friends outside of training. Most of the time I tell them at school that \"here we are friends, on the football field I am the coach\", says Don Goal Ntore. The summer is filled with matches and training for Sala FF's boys born in 2011. Don is looking forward to leading the team through the season and has already started dreaming of a future as a high level football coach. - It will be tough, but I hope for the best, he says. Inspired by the greatest After doubting whether he fits the coaching role, Don has found his great passion - and he has a clear goal. - I want to become PSG's coach and national team captain if possible, says Don. The club hopes that Don's involvement will inspire more young people to take leadership roles in sports. For Don himself, this is just the beginning of a journey that he hopes will lead far in football.", "title_original": "14-årige Don leder eget fotbollslag", "summary_original": "På många håll i landet är det svårt att hitta vuxna som vill engagera sig som tränare på gräsrotsnivå inom ungdomsfotbollen. Efter att ha varit skadad en längre period valde hemmaklubben i Sala att tänka nytt när Don visade intresse för ledarskap. Han har snabbt blivit en viktig del av lagets utveckling men för Don var det inte ett självklart val. – Först så tänkte jag, jag tvekade lite men sen tackade jag ”ja”, säger han. Utmaningar och drömmar Att vara tränare för ett lag där man själv är lika gammal som spelarna kan innebära särskilda utmaningar. Don, som själv har spelat i laget, berättar att det ibland kan vara svårt – det har varit desto viktigare att särskilja rollen som vän och tränare. – Jag försöker mitt bästa, jag visar skillnaden mellan träning och att vara vänner utanför träningen. Oftast brukar jag säga till dem i skolan att ”här är vi vänner, på fotbollsplanen är jag tränare”, säger Don Goal Ntore. Sommaren är fylld av matcher och träningar för Sala FF:s pojkar födda 2011. Don ser fram emot att leda laget genom säsongen och har redan börjat drömma om en framtid som fotbollstränare på hög nivå. – Det kommer vara tufft, men jag hoppas på det bästa, säger han. Inspireras av de största Efter att ha varit tveksam över huruvida han passar i tränar-rollen har Don hittat sin stora passion – och han har en tydlig målbild. – Jag vill bli PSG:s tränare och förbundskapten om det går, säger Don. Klubben hoppas att Dons engagemang ska inspirera fler unga att ta ledarroller inom idrotten. För Don själv är det här bara början på en resa som han hoppas ska leda långt inom fotbollen.", "link": "https://www.tv4.se/artikel/49dXPq54h9YDOzxThJgMAL/14-arige-don-leder-eget-fotbollslag-i-sala", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:11:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/svensk-fotboll", "/ungdomar", "/idrott", "/sala"]}, {"id": 127, "title": "This is how much the WC trip costs for Swedish fans", "summary": "The match tickets for this summer's football World Cup are expected to be record expensive. But it is far from the only expense that causes the costs to skyrocket. SvD has calculated what it would cost for a Swedish supporter to follow the national team this summer.", "title_original": "Så mycket kostar VM-resan för svenska fans", "summary_original": "Matchbiljetterna till sommarens fotbolls-VM väntas bli rekorddyra. Men det är långt ifrån den enda utgiften som får kostnaderna att skena. SvD har räknat på vad det skulle kosta för en svensk supporter att följa landslaget i sommar.", "link": "https://www.svd.se/a/Ok6873/sa-mycket-kostar-biljetter-till-sveriges-matcher-under-fotbolls-vm", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:07:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 128, "title": "Trump: Cease fire between Russia and Ukraine", "summary": "", "title_original": "Trump: Vapenvila mellan Ryssland och Ukraina", "summary_original": "", "link": "https://www.svd.se/a/rrzr9w/trump-vapenvila-mellan-ryssland-och-ukraina", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:06:31+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 129, "title": "Tells about the drama: \"Be afraid that the passengers would panic\"", "summary": "With Ebola equipment, the medical team went back and forth to evacuate virus-affected patients from m/v Hondius. Cape Verde's WHO representative Ann Lindstrand talks about the drama when the cruise ship was off Cape Verde for four days.", "title_original": "Berättar om dramatiken: ”Var rädda för att passagerarna skulle få panik”", "summary_original": "Med ebolautrustning åkte läkarteamet fram och tillbaka för att evakuera virusdrabbade patienter från m/v Hondius. Kap Verdes WHO-representant Ann Lindstrand berättar om dramatiken när kryssningsfartyget stod utanför Kap Verde i fyra dygn.", "link": "https://www.dn.se/varlden/berattar-om-dramatiken-var-radda-for-att-passagerarna-skulle-fa-panik/", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:03:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "DN Debate. \"Ukraine does like Finland - and Russia pays the price\"", "summary": "DN DEBATE. The Kremlin has proposed that Ukraine withdraw from Donetsk, a \"small concession\" to end the war. But Finland already showed during the Second World War the value of fighting for smaller pieces of land. They lost the Karelian Isthmus - but showed the Soviet Union what a high price Finland demanded, writes defense policy researcher Mykola Bielieskov.", "title_original": "DN Debatt. ”Ukraina gör som Finland – och Ryssland betalar priset”", "summary_original": "DN DEBATT. Kreml har lagt fram förslag om att Ukraina ska dra sig tillbaka från Donetsk, en ”liten eftergift” för att få slut på kriget. Men Finland visade redan under andra världskriget värdet av att kämpa för mindre landbitar. De förlorade Karelska näset – men visade Sovjetunionen vilket högt pris Finland betingade, skriver försvarspolitiska forskaren Mykola Bielieskov.", "link": "https://www.dn.se/debatt/ukraina-gor-som-finland-och-ryssland-betalar-priset/", "date_display": "2026-05-08", "date_iso": "2026-05-08T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Re-debated strip show back in Sweden - the criticism: \"Cheap\"", "summary": "Magic Men started as a group of male strippers in Australia, performing shows for hen parties and birthday celebrations, among other things. Today, the group tours internationally. The group's most talked-about entertainer is spelled Will Parfitt and has made a name for himself by resembling actor Channing Tatum, who plays a male stripper in the Magic Mike movies. His videos have gone viral online and in total he now has over 16 million followers on social media. Debate about morality and double standards The show has also sparked debate about where the line is for strip shows and whether women and men are judged differently. Wilhelm Nyström, lead writer at Expressen, believes that the context matters. - When men sexualize women, it happens against an undertone of violence, coercion and humiliation that we in the Western world have worked hard to get rid of, but which we still struggle with. When women sexualize men, there is not the same tough story. Therefore, it can be considered quite harmless. \"A bit cheap\" Even though Wilhelm Nyström is more liberal towards male strip shows, he does not like them himself. - I think it seems incredibly embarrassing and a bit cheap, maybe. But it probably has more to do with the fact that I'm a bit neat and fart-like than that there is something ethically dubious about it, says Wilhelm Nyström. \"Sunk relic from the past\" Linda Westerlind, political editor-in-chief at Folkbladet, is however more critical of the strip tour and calls it \"a sunken relic from the past\". \"A strip show at Folkets hus, regardless of gender, feels like a forgotten remnant of a patriarchal and liberal 90s,\" writes Linda Westerlind. She explains the problem based on the issue of consent. - Can you then buy their consent to expose their bodies? No, I say. I think it is ethically wrong, she says. Is there anything for me feminist in this male strip show? - Men have done so much crap throughout history, and if we women were to start wars, it would not be a form of feminism, says Linda Westerlind.", "title_original": "Omdebatterad strippshow tillbaka i Sverige – kritiken: ”Billigt”", "summary_original": "Magic Men började som ett gäng manliga strippor i Australien och gjorde shower för bland annat möhippor och födelsedagsfiranden. I dag turnerar gruppen internationellt. Gruppens mest omtalade underhållare stavas Will Parfitt och har gjort sig känd för att likna skådespelaren Channing Tatum, som spelar en manlig strippa i Magic Mike-filmerna. Hans videoklipp har fått stor spridning online och sammanlagt har han nu över 16 miljoner följare på sociala medier. Debatt om moral och dubbelmoral Showen har samtidigt väckt debatt om var gränsen går för strippshower och om kvinnor och män bedöms olika. Wilhelm Nyström, ledarskribent på Expressen, menar att sammanhanget spelar roll. – När män sexualiserar kvinnor sker det mot en underton av våld, tvång och förnedring som vi i västvärlden har jobbat mycket med att få bort, men som vi fortfarande kämpar med. När kvinnor sexualiserar män finns inte samma tuffa historia. Därför får det anses ganska harmlöst. ”Lite billigt” Även om Wilhelm Nyström är mer liberalt inställd till manliga strippshower gillar han dem inte själv. – Jag tycker det verkar otroligt pinsamt och lite billigt, kanske. Men det har nog mer att göra med att jag är lite pryd och fisförnäm än att det är någonting etiskt tvivelaktigt med det, säger Wilhelm Nyström. ”Sunkig relik från förr” Linda Westerlind, politisk chefredaktör på Folkbladet, är dock mer kritisk till strippturnén och kallar det för ”en sunkig relik från förr”. ”En strippshow på Folkets hus känns, oavsett kön, som en kvarglömd rest av ett patriarkalt och liberalt 90-tal.”, skriver Linda Westerlind. Hon förklarar problematiken utifrån samtyckesfrågan. – Kan man då köpa deras samtycke till att exponera deras kroppar? Nej, säger jag. Jag tycker att det är etiskt fel, säger hon. Finns det nånting för mig feministiskt i den här manliga strippshowen? – Män har gjort så himla mycket skit genom historien, och skulle vi kvinnor börja starta krig är det inte en form av feminism i det, säger Linda Westerlind.", "link": "https://www.tv4.se/artikel/2o2L2mQ5HP1Tj3YTvZueRl/manlig-strippshow-tillbaka-i-sverige-succe-och-kritik-billigt", "date_display": "2026-05-08", "date_iso": "2026-05-08T17:36:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/dans", "/show", "/australien"]}, {"id": 132, "title": "The Minister of Foreign Affairs after Löwengrip criticism: Women are short of time", "summary": "The moderates must change the way they address women on social media – to reach double-working women, short messages are not enough, according to Foreign Minister Maria Malmer Stenergard (M). - We have to make sure that our messages are explained in depth, not so much simple points, she says about the discussion about Isabella Löwengrip's statement about women voters.", "title_original": "Utrikesministern efter Löwengrip-kritik: Kvinnor har ont om tid", "summary_original": "Moderaterna måste ändra tilltalet till kvinnor på sociala medier – för att nå dubbelarbetande kvinnor räcker det inte med korta budskap, enligt utrikesminister Maria Malmer Stenergard (M). – Vi måste se till att våra budskap förklaras på djupet, inte så mycket enkla poäng, säger hon om diskussionen om Isabella Löwengrips uttalande om kvinnliga väljare.", "link": "https://www.dn.se/sverige/utrikesministern-efter-lowengrip-kritik-kvinnor-har-ont-om-tid/", "date_display": "2026-05-08", "date_iso": "2026-05-08T17:27:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Clear: He must try to form a government", "summary": "The protracted negotiations on a new Danish government are taking a new turn. King Frederik X now appoints Liberal party leader Troels Lund Poulsen to try to form a government after Mette Frederiksen's attempt collapsed.", "title_original": "Klart: Han får försöka bilda regering", "summary_original": "De utdragna förhandlingarna om en ny dansk regering tar en ny vändning. Kung Frederik X utser nu Venstres partiledare Troels Lund Poulsen att försöka bilda regering efter att Mette Frederiksens försök kollapsat.", "link": "https://www.svd.se/a/xrMrOV/mette-frederiksen-medger-att-hon-kan-forlora-makten", "date_display": "2026-05-08", "date_iso": "2026-05-08T17:21:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 134, "title": "The President of Germany on the quarrels with Trump: \"It has become more difficult\"", "summary": "At the same time as the US threatens to withdraw troops from Europe, the German president visits Sweden and the Muskö base. Frank-Walter Steinmeier warns that the Kremlin is closely watching every sign of weakness in the relationship with the United States. - I could not imagine that the transatlantic relationship would change in this way, he says to DN.", "title_original": "Tysklands president om bråken med Trump: ”Har blivit svårare”", "summary_original": "Samtidigt som USA hotar att dra tillbaka soldater från Europa besöker Tysklands president Sverige och Musköbasen. Frank-Walter Steinmeier varnar för att Kreml noga observerar varje svaghetstecken i relationen till USA. – Jag kunde inte föreställa mig att den transatlantiska relationen skulle förändras på det här sättet, säger han till DN.", "link": "https://www.dn.se/varlden/tysklands-president-om-braken-med-trump-har-blivit-svarare/", "date_display": "2026-05-08", "date_iso": "2026-05-08T17:06:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Hackers' threat: \"Make a settlement - before everything is leaked\"", "summary": "Earlier this week, the Canvas learning platform was exposed to a hacker attack. The platform is used at many universities and colleges in Sweden and the world. The hacker group ShinyHunters has claimed the hacker attack. When a student at the Royal Institute of Technology (KTH) that TV4 Nyheterna had been in contact with tried to log in on Thursday, he was greeted by a message from the group. \"SHINYHUNTERS has breached Instructure (again). Instead of contacting us to resolve the issue, they ignored us and made some 'security updates,'\" the message reads. Threatening the recipient In the message, the hacker group threatens the affected schools. \"If any of the schools on the affected list are interested in preventing their data from being released, please contact a cyber consulting firm and contact us privately to negotiate a settlement. You have until the end of the day on May 12 before everything is leaked,\" the group wrote. During Friday morning, students that TV4 Nyheterna had been in contact with were able to access the platform, but the threat from ShinyHunters remains. - You wonder what was leaked and who is affected, says student Alex Brandner to TV4 Nyheterna. Student Ebba Carlsson wonders how the systems can't be more resilient, but doesn't feel afraid of what might be leaked. - I have given out my social security number on chatgpt, and what can they take there? I don't feel great. \"Working to support our teachers\" KTH's IT manager Hans Wohlfarth writes in an email to TV4 Nyheterna that the school has made a report about a personal data incident to the Privacy Protection Agency, and about an information security incident to the Civil Defense Agency. \"KTH, like many other universities, is affected by the cyber security incident that led to a probable data leak in the Canvas learning platform,\" says Hans Wohlfarth. According to Wohlfarth, the potential leak consists of user data such as name, email address and student ID. Even messages between users in Canvas can", "title_original": "Hackarnas hot: ”Gör en uppgörelse – innan allt läcks”", "summary_original": "Tidigare i veckan utsattes läroplattformen Canvas för en hackerattack. Plattformen används vid många universitet och högskolor i Sverige och världen. Hackergruppen ShinyHunters har tagit på sig hackerattacken. När en student vid Kungliga Tekniska Högskolan (KTH) som TV4 Nyheterna varit i kontakt med försökte logga in under torsdagen möttes han av ett meddelande från gruppen. ”SHINYHUNTERS har gjort intrång i Instructure (igen). Istället för att kontakta oss för att lösa problemet ignorerade de oss och gjorde några 'säkerhetsuppdateringar'”, står det i meddelandet. Hotar mottagaren I meddelandet hotar hackergruppen de drabbade skolorna. ”Om någon av skolorna på den berörda listan är intresserad av att förhindra att deras data släpps, vänligen kontakta ett cyberrådgivningsföretag och kontakta oss privat för att förhandla om en uppgörelse. Ni har till slutet av dagen 12 maj innan allt läcks”, skriver gruppen. Under fredagsmorgonen kunde studenter som TV4 Nyheterna varit i kontakt med komma åt plattformen, men hotet från ShinyHunters kvarstår. – Man undrar ju vad som läckt och vilka som är påverkade, säger studenten Alex Brandner till TV4 Nyheterna. Studenten Ebba Carlsson undrar hur systemen inte kan vara mer motståndskraftiga, men känner sig inte rädd för vad som kan läckas. – Jag har lämnat ut mitt personnummer på chatgpt, och vad kan de ta där? Jag känner mig inte jätteskraj. ”Arbetar för att stötta våra lärare” KTH:s it-chef Hans Wohlfarth skriver i ett mejl till TV4 Nyheterna att skolan har gjort en anmälan om dels personuppgiftsincident till Integritetsskyddsmyndigheten, dels om informationssäkerhetsincident till Myndigheten för civilt försvar. ”KTH är, liksom många andra lärosäten, påverkade av den cybersäkerhetsincident som lett till ett sannolikt dataläckage i lärplattformen Canvas”, säger Hans Wohlfarth. Enligt Wohlfarth består den potentiella läckan av användaruppgifter såsom namn, e-postadress samt student-ID. Även meddelanden mellan användare i Canvas kan ha läckt. ”Det finns i nuläget inga uppgifter som tyder på att lösenord har läckt”, tillägger han.", "link": "https://www.tv4.se/artikel/5lpvWwhvmMGQAylhv5Ynlm/hackarnas-hot-goer-en-uppgoerelse-innan-allt-laecks", "date_display": "2026-05-08", "date_iso": "2026-05-08T16:53:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/dataintrang", "/hackerattack", "/kth"]}, {"id": 136, "title": "Resignation demands in Labor as Farage cheers in England", "summary": "Demands are being heard for the Prime Minister's resignation after Labour's fiasco in Britain's local elections. The far right rejoices all the more.", "title_original": "Avgångskrav i Labour när Farage jublar i England", "summary_original": "Krav hörs på premiärministerns avgång efter Labours fiasko i Storbritanniens lokalval. Ytterhögern jublar desto mer.", "link": "https://www.dn.se/varlden/avgangskrav-i-labour-nar-farage-jublar-i-england/", "date_display": "2026-05-08", "date_iso": "2026-05-08T16:41:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Mona Sahlin hits back - allegedly made up for pancake queue: \"Completely made up\"", "summary": "After this week's dispute in the Riksdag, the former Riksdag member Fredrik Schulte (M) now joins the debate. In a post that has been widely circulated on Facebook, he writes that the queue in the Riksdag's dining room used to be long on Thursdays when pancakes were on the menu. Since Schulte sat at the back of the plenary hall, he often only got to the front after the votes.\n\nBut one day he discovered that the former Social Democratic party leader Mona Sahlin was first in the pancake queue. \"It's not physically possible!?\" I thought at first. How could aunt Sahlin get ahead of my then 25-year-old and relatively thin, pain and fit self!? Before the thought began to stray too far into secret wormhole teleportation technology or ambushes, I realized Ockham's razor: She had allowed herself to be paid off to come first in the pancake line,\" he writes in the post. Not true According to Mona Sahlin, the story from her time in the Riksdag is as crazy as it gets, because you have to turn to a specific person in the party and state what reasons you have for abstaining from voting. - Partly, I really like not pancakes. So just the idea of standing in line for that. And besides, in my system, you can't get out of the way, she tells TV4 Nyheterna. \"My pancake phobias are big\" In the Facebook post, Fredrik Schulte further writes that part of his faith in democracy and the system died that day: \"It was mentally like watching as a child how someone opens Christmas presents before Christmas Eve or cheats with the chocolate calendar\". - Since it's a completely made-up thing, I rather understand that he feels like a partisan attacked in some way for the set-off system, I don't know. - But little friend, my pancake phobias are big and do not threaten democracy, says the former S leader. In the post, Fredrik Schulte lists several examples of \"similar vital and time-critical a", "title_original": "Mona Sahlin slår tillbaka – påstås ha kvittat ut sig för pannkakskö: ”Helt påhittat”", "summary_original": "Efter veckans kvittningsbråk i riksdagen ansluter nu den tidigare riksdagsledamoten Fredrik Schulte (M) till debatten. I ett inlägg som har fått stor spridning på Facebook skriver han att kön i riksdagens matsal brukade ringla sig lång på torsdagar när pannkakor stod på menyn. Eftersom Schulte satt längst bak i plenisalen hann han ändå ofta först fram efter voteringarna.\n\nMen en dag upptäckte han att den före detta socialdemokratiska partiledaren Mona Sahlin stod först i pannkakskön. ”Det är inte fysiskt möjligt!?” tänkte jag först. Hur kunde tant Sahlin komma före mitt då 25-åriga och relativt smala, smärt och vältränade jag!? Innan tanken började spår för långt in i hemlig maskhåls-teleporterings-teknik eller lönngångar insåg jag Ockhams rakhyvel: Hon hade låtit sig kvittas ut för att komma först i pannkakskön”, skriver han i inlägget. Stämmer inte Enligt Mona Sahlin är historien från hennes tid i riksdagen så tokig som det bara kan bli, eftersom man måste vända sig till en särskild person i partiet och ange vilka skäl man har för att avstå från att rösta. – Dels så gillar jag verkligen inte pannkakor. Så bara tanken att ställa sig i kö för det. Och dessutom, i mitt system när jag var i riksdagen – man kan ju inte kvitta ut sig själv, säger hon till TV4 Nyheterna. – Hade jag sagt att jag vill hamna först i kön, så hade de bara sagt: ”Gå tillbaka och rösta.” ”Mina pannkaksfobier är stora” I Facebookinlägget skriver Fredrik Schulte vidare att en del av hans tilltro till demokratin och systemet dog den dagen: ”Det var mentalt som att som barn se hur någon öppnar julklappar före julafton eller fuskar med chockladkalendern”. – Eftersom det är en helt påhittad sak så förstår jag snarare att han känner sig som partist angripen på något vis för kvittningssystemet, jag vet inte. – Men lilla vän, mina pannkaksfobier är stora och hotar ingen demokrati, säger den tidigare S-ledaren. Fredrik Schulte listar i inlägget flera exempel på ”liknande livsnödvändiga och tidskritiska aktiviteter” för att undvika omröstning. – Okej, om man har tappat en plomb och har ont i tanden, då är det möjligt, säger Mona Sahlin. – Men att gå till frissan eller stå i pannkakskön? Nej, demokratin i riksdagen är liksom viktigare än så. TV4 Nyheterna har varit i kontakt med Fredrik Schulte som hänvisar till sitt inlägg på Facebook.", "link": "https://www.tv4.se/artikel/12vxJbPMy4aaanSxUq53Jh/kvittade-ut-sig-foer-att-bli-foerst-i-pannkakskoen-helt-pahittat", "date_display": "2026-05-08", "date_iso": "2026-05-08T16:34:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/mat", "/personer/mona-sahlin-s", "/valet-2022/moderaterna", "/riksdagen"]}, {"id": 138, "title": "Suspected Danish hantavirus case under investigation", "summary": "Two British citizens have been confirmed infected with hantavirus, British authorities announce. Additional people are being investigated - including a Dane. The origin of the virus outbreak on the cruise ship MV Hondius remains shrouded in obscurity.", "title_original": "Misstänkt danskt hantavirusfall under utredning", "summary_original": "Två brittiska medborgare har bekräftats smittade med hantavirus, meddelar brittiska myndigheter. Ytterligare personer utreds – däribland en dansk. Ursprunget till virusutbrottet på kryssningsfartyget MV Hondius är fortsatt höljt i dunkel.", "link": "https://www.dn.se/varlden/misstankt-danskt-hantavirusfall-under-utredning/", "date_display": "2026-05-08", "date_iso": "2026-05-08T16:05:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Putin's nightmare: Bombs over Red Square", "summary": "\"Who would have thought that Putin would sit in a scrub and crouch in fear?\"", "title_original": "Putins mardröm: Bomber över Röda Torget", "summary_original": "”Vem hade trott att Putin skulle sitta i en skrubb och huka av rädsla?”", "link": "https://www.tv4.se/artikel/1T6aam5mjntMblFcbVCvtp/putins-mardroem-bomber-oever-roeda-torget", "date_display": "2026-05-08", "date_iso": "2026-05-08T15:28:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 140, "title": "SD politician pretended to be a judge - kicked out by the Court of Appeal", "summary": "Navdeep Singh Bhatia is second vice chairman of the Sweden Democrats in Upplands-Bro, deputy group leader in the council group and member of several committees in the municipality. He is also the middle name for the Sweden Democrats in Upplands-Bro before the election campaign. In addition to his political assignments, he has also long sat as a member of the Svea Court of Appeal. But when traveling to India, that title has become a different one. A couple of years ago he visited a university in India and lectured about the Swedish legal system to Indian law students. In an acknowledgment post, he is described as \"justice\" at the Svea Court of Appeal in Stockholm. The term includes judges at a higher instance, for example the Court of Appeal or the Supreme Court. Shut down During the visit, he is said to have described how courts in Sweden differ from Indian ones and how the criminal law works. He should also have informed the students about the possibilities for exchanges with various courts in Sweden. \"The Court of Appeal does not leave any assignments to jurors to act on behalf of the Court of Appeal\", writes Svea Hovrätt in a comment to TV4 Nyheterna. The action has caused the Svea Court of Appeal to suspend him.  \"The Court of Appeal is aware of the information that the juror in question, among other things, in connection with trips abroad, has pretended to be a judge in Sweden. Due to the information that has come to the Court of Appeal's attention, the Court of Appeal has decided on March 31, 2026 to immediately suspend him from serving as a juror in the Svea Court of Appeal,\" the court continues. The professor: \"Serious\" Despite the fact that jurors in practice act as judges in Swedish courts, several lawyers and experts whom TV4 Nyheterna spoke to describe the action as \"inappropriate\". They understand the Court of Appeal's actions. - Taking personal gain and benefit from a public mission in that way means that you should definitely look into it more closely, says Eric Bylander, professor of procedural law at Uppsala University. In another event from a couple of years ago, where Indian Prime Minister Narendra", "title_original": "SD-politiker utgav sig för att vara domare – kickas av hovrätten", "summary_original": "Navdeep Singh Bhatia är andre vice ordförande för Sverigedemokraterna i Upplands-Bro, vice gruppledare i fullmäktigegruppen och ledamot i flera nämnder i kommunen. Han står också som andranamn för Sverigedemokraterna i Upplands-Bro inför valrörelsen. Utöver sina politiska uppdrag har han också länge suttit som nämndeman i Svea hovrätt. Men vid resor till Indien har den titeln blivit en annan. För ett par år sedan besökte han ett universitet i Indien och föreläste om svenska rättsväsendet för indiska juriststudenter. I ett avtackningsinlägg beskrivs han som ”justice” vid Svea hovrätt i Stockholm. Begreppet innefattar domare vid högre instans, exempelvis hovrätt eller högsta domstolen. Stängs av Under besöket ska han ha beskrivit hur domstolar i Sverige skiljer sig från indiska och hur strafflagstiftningen fungerar. Han ska också ha informerat studenterna om möjligheterna för utbyte med olika domstolar i Sverige. ”Hovrätten lämnar inte några som helst uppdrag till nämndemän att agera på hovrättens vägnar”, skriver Svea hovrätt i en kommentar till TV4 Nyheterna. Agerandet har gjort att Svea hovrätt stängt av honom.  ”Hovrätten har kännedom om uppgifterna om den aktuella nämndemannen bl.a. i samband med utlandsresor ska ha utgett sig för att vara domare i Sverige. Med anledning av de uppgifter som kommit till hovrättens kännedom har hovrätten den 31 mars 2026 beslutat att omedelbart stänga av honom från tjänstgöring som nämndeman i Svea hovrätt\", fortsätter domstolen. Professorn: ”Allvarligt” Trots att nämndemän i praktiken agerar som domare i svenska domstolar, beskriver flera jurister och experter som TV4 Nyheterna pratat med agerandet som ”olämpligt”. De har förståelse för hovrättens agerande. – Att dra personlig vinning och nytta av ett offentligt uppdrag på det sättet gör att man definitivt ska titta närmare på det, säger Eric Bylander, professor i processrätt vid Uppsala universitet. I ett annat evenemang från ett par år sedan, där Indiens premiärminister Narendra Modi närvarade, beskrevs Navdeep Singh Bhatia återigen som ”Justice, Svea High Court of Stockholm”. I en kort kommentar tackar han för evenemanget och säger att han är imponerad över premiärministern. Just att Navdeep Singh Bhatia beskrivs som ”justice”, reagerar Eric Bylander på. – Att vara ”justice” är inte att vara domare vilken som helst, utan det är en hög juristdomare. I det ligger att utge sig för att vara professionell juristdomare, säger han. ”Extremt hög status att vara domare” TV4 Nyheterna har också uppgifter om att Navdeep Singh Bhatia använt titeln domare för att få olika typer av förmåner i Indien. Bland annat ska han ha tilldelats säkerhetspersonal vid ett bröllop. Återigen beskrivs han som domare i inbjudan. – Det är naturligtvis fint att vara domare i Sverige, men i många länder är det oerhört fint. Det har en extremt hög status att vara domare och då förstås juristdomare. Det kan ge helt andra fördelar i vissa länders kontext jämfört med ett svenskt sammanhang, säger Eric Bylander. Navdeep Singh Bhatia har överklagat hovrättens beslut om avstängning till Överklagandenämnden för nämndemannauppdrag. Med tanke på uppgifterna som har kommit fram är Eric Bylanders bedömning att Navdeep Singh Bhatia kommer att stängas av trots överklagan. – Ska jag komma med ett stalltips så är det att den här tillfälliga avstängningen kommer att stå sig. Svea hovrätt utreder ärendet och avböjer därför intervju.  TV4 Nyheterna har vid upprepade tillfällen sökt Navdeep Singh Bhatia, som inte återkommit. TV4 Nyheterna söker Sverigedemokraterna för en kommentar.", "link": "https://www.tv4.se/artikel/21RddSIwevXNSJ49SLhedW/sd-politiker-utgav-sig-foer-att-vara-domare-kickas-av-hovraetten", "date_display": "2026-05-08", "date_iso": "2026-05-08T13:13:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/valet-2022/sverigedemokraterna", "/domare", "/brott-och-straff"]}, {"id": 141, "title": "The headmaster is convicted of rape against a student", "summary": "The man was working as a principal at a school in central Sweden when he started sending messages to the plaintiff, a child who was a student at his school.  The student stated to the police that she thought she had a relationship with the principal, but the prosecutor argued that the principal took advantage of his position vis-à-vis the student and took advantage of the plaintiff's mental illness and neuropsychiatric disability.  Tried to hide the relationship with the student In questioning, the student describes how they started sending messages to each other during the summer vacation before she was due to start ninth grade. Initially they wrote about ordinary things, then it escalated to become sexual. The investigation reveals that the principal had sex with the student on a large number of occasions in different places.  Part of the evidence consists of text messages between the principal and the student. There he describes, among other things, the student as his girlfriend and that he misses and loves her. At the same time, he writes that they must be careful. \"I get so angry that it can't be us,\" writes the student. \"Me too,\" replied the principal.  Denied a crime - means they had a relationship The headmaster denied a crime, but admitted that he had sex with the student. He said that he did not take advantage of the student's dependent position and that it was a question of a \"mutual love relationship\". The student himself contacted the police and told them about what had happened. First, she tried to contact the principal herself to give him a chance to contact the police himself.  \"He just got angry and sent her out of school. He told her to go and then she ran up to the police and told everything,\" the verdict says.", "title_original": "Rektor döms för våldtäkt mot elev", "summary_original": "Mannen arbetade som rektor på en skola i Mellansverige när han började skicka meddelanden till den målsägande, ett barn som var elev på hans skola.  Eleven uppgav för polisen att hon trodde att hon hade en relation med rektorn, men åklagaren menade att rektorn utnyttjat sin ställning gentemot eleven och utnyttjat målsägandens psykiska ohälsa och neuropsykiatriska funktionsnedsättning.  Försökte dölja relationen till eleven I förhör beskriver eleven hur de började skicka meddelanden till varandra under sommarlovet innan hon skulle börja nionde klass. Initialt skrev de om vanliga saker, sedan eskalerade det till att bli sexuellt. I utredningen framkommer att rektorn haft sex med eleven vid ett stort antal tillfällen på olika platser.  En del av bevisningen består av sms mellan rektorn och eleven. Där beskriver han bland annat eleven som sin flickvän och att han saknar och älskar henne. Samtidigt skriver han att de måste vara försiktiga. ”Jag blir så arg på att det inte får vara vi”, skriver eleven. ”Jag med”, svarade rektorn.  Nekade till brott – menar att de hade ett förhållande Rektorn nekade till brott, men erkände att han haft sex med eleven. Han menade att han inte utnyttjat elevens beroendeställning och att det varit fråga om ett ”ömsesidigt kärleksförhållande” Eleven kontaktade själv polisen och berättade om vad som inträffat. Först försökte hon kontakta rektorn själv för att ge honom en chans att själv ta kontakt med polisen.  ”Han blev bara arg och skickade ut henne från skolan. Han sa att hon skulle gå och då sprang hon fram till polisen och sa allt”, står det i domen.", "link": "https://www.tv4.se/artikel/9vMt7gdxSPQegkxUVKGLE/rektor-doems-foer-valdtaekt-mot-elev", "date_display": "2026-05-08", "date_iso": "2026-05-08T12:05:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/rektor", "/sexualbrott-mot-barn", "/sexualbrott"]}, {"id": 142, "title": "M gathers to cheer - and not think about the things that disturb", "summary": "Ulf Kristersson frequently contrasts the favorite argument \"on my side we agree\" with the fact that the red-greens have not presented a unified government alternative. L's and M's synchronized openings to the ultimate unanimity, to let the Sweden Democrats sit in the government, however, have not caught public opinion.\n\nIn the polls, the opposition has continued to have a seven to eight percent lead. And M itself is still one, two percent behind SD.\nNow Kristersson is also forced to deal with the fact that Jimmie Åkesson's party overturned the Riksdag's equalization system.  Uncertain votes The opposition has a hard time finding words for the loss of confidence, while the settlement crisis risks backfiring against another of Kristersson's favorite arguments. That the parties on his side \"can get things done\". Suddenly, the reforms, bills and the spring budget that remain to be voted through became more uncertain. Purely vulnerable to kickbacks, after Kristersson's repeated remarks that the Social Democrats during their last years of government failed to get all their budgets through. As proof of Magdalena Andersson's government ineptitude.\n\nWith German Chancellor Friedrich Merz's prestigious visit to the Sweden meeting, on the other hand, Kristersson can bask in the international glory of one of those who now wants to take on a leadership role for Europe.  What if…?  However, the fact that the Christian Democrat Merz, after a year in the coalition with Germany's Social Democrats, has disastrous trust figures among Germans in domestic politics seems to be given less attention. Kristersson says he doesn't even read measurements himself.\n\nHowever, those concerning Sweden may raise questions that are not likely to be exciting enough for the meeting in Stockholm. What happens to the Tidö project if the parties do not actually win the election? Would the Moderates then consider what was for a long time a sensitive approach to SD, and of which Kristersson has become the main embodiment, as a historical mistake?\n\nEven if Kristersson is Åkesson's candidate for prime minister, there will be opposition, as the current mandate period has shown", "title_original": "M samlas för att peppa – och inte tänka på det som stör", "summary_original": "Favoritargumentet ”på min sida är vi överens” kontrasterar Ulf Kristersson frekvent mot att de rödgröna inte har presenterat ett samlat regeringsalternativ. L:s och M:s synkroniserade öppningar till den yttersta enigheten, att låta Sverigedemokraterna sitta med i regering, har dock inte bitit i opinionen.\n\nI mätningarna har oppositionen fortsatt sju, åtta procents övertag. Och själva är M kvar en, två procent bakom SD.\nNu tvingas Kristersson dessutom hantera att Jimmie Åkessons parti vält riksdagens kvittningssystem.  Osäkrare voteringar  Oppositionen har svårt att hitta ord för förtroendeskadan, samtidigt som kvittningskrisen riskerar att slå tillbaka mot ett annat av Kristerssons favoritargument. Att partierna på hans sida ”kan få saker gjorda”. Plötsligt blev de reformer, lagförslag och den vårbudget som återstår att röstas igenom mer osäkra. Rentav sårbara för tillbakakakor, efter Kristerssons återkommande påpekande att Socialdemokraterna under sina senaste regeringsår inte lyckades få igenom alla sina budgetar. Som bevis på Magdalena Anderssons regeringsoduglighet.\n\nMed Tysklands förbundskansler Friedrich Merzs prestigebesök på Sverigemötet kan Kristersson å andra sidan sola sig i internationell glans av en av dem som nu vill ta på sig en ledarroll för Europa.  Tänk om…?  Att kristdemokraten Merz inrikespolitiskt efter ett år i koalitionen med Tysklands socialdemokrater har katastrofala förtroendesiffror bland tyskarna lär dock ges mindre uppmärksamhet. Kristersson säger sig ju själv inte ens läsa mätningar.\n\nDe som gäller Sverige kan dock väcka frågor som inte lär vara peppiga nog för mötet i Stockholm. Vad händer med Tidöprojektet ifall partierna faktiskt inte vinner valet? Skulle Moderaterna då betrakta det som länge var ett känsligt närmande till SD, och som Kristersson blivit det främsta förkroppsligandet av, som ett historiskt misstag?\n\nÄven om Kristersson är Åkessons statsministerkandidat blir oppositioner, vilket inte minst nuvarande mandatperiod visat och Kristersson själv gärna anklagande påpekar, ofta något lösare sammansatta grupperingar. På den sidan blir det också svårare att förhandla bort det faktum att ledaren för det största partiet också uppfattas som oppositionsledare. Skulle moderaten kunna underordna sig det? Eller snarare tacka för sig?", "link": "https://www.tv4.se/artikel/4d5sUlV1EiXcz6YdbbAe83/m-samlas-foer-att-peppa-och-inte-taenka-pa-det-som-stoer", "date_display": "2026-05-08", "date_iso": "2026-05-08T11:02:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/valet-2022/moderaterna", "/kvittning", "/kvittningsbraket", "/svensk-politik"]}, {"id": 143, "title": "High-profile man within the 764 network is charged", "summary": "An 18-year-old man is charged with a large number of serious crimes committed within violent networks on the Internet. In total, it was about 77 criminal suspicions. Among other things, he is accused of having orchestrated a 15-year-old in real time to carry out knife attacks in Hässelby in 2024. - The accused is highly profiled within \"The Com\", which consists of several loosely assembled violence-endorsing networks on the internet, including 764. The perpetrators often look for easily manipulated and fragile victims on platforms where there are often children and young people. It concerns, for example, self-harm groups, suicide groups and forums for mental illness, but also popular game platforms such as Roblox, says senior prosecutor Jenny Östling. \"Cult-like features\" According to Erik Glaad, reporter at Expo, these are not traditional organizations, but digital communities with clear cult-like features. - These are online communities with more cult-like features, where 764 forms its own little corner in the larger context that we call The Com, he says. The indictment also includes suspicions that the 18-year-old caused people in other countries to harm themselves or commit sexual acts on themselves. According to the prosecutor, these include plaintiffs in Australia and Germany. - He is also suspected of unlawful depiction of violence, as he has spread images with terrible content in groups and forums where, among other things, children and young people have been, says Jenny Östling. Collect points and rise in the hierarchy Glaad describes 764 as an extreme environment where abuse, violence and documentation are central elements. - 764 engages in a kind of online-based, in many ways, extremism which consists of grooming people to commit abuses on themselves or to document abuses that they in turn have pressured others to commit on themselves, he says. According to him, there is also a clear connection between online activity and physical violence. - It is also characterized by abuse and acts of violence in the physical world, where people go out and commit damage, pray", "title_original": "Högt profilerad man inom 764-nätverket åtalas", "summary_original": "En 18-årig man åtalas för en stor mängd grova brott som begåtts inom våldsbejakande nätverk på internet. Totalt handlat det om 77 brottsmisstankar. Bland annat åtalas han för att ha orkestrerat en 15-åring i realtid att utföra knivattacker i Hässelby 2024. – Den åtalade är högt profilerad inom ”The Com” som består av flera löst sammansatta våldsbejakande nätverk på internet, bland annat 764. Förövarna söker ofta efter lättmanipulerade och sköra offer på plattformar där det ofta finns barn och unga. Det handlar exempelvis om självskadegrupper, självmordsgrupper och forum för psykisk ohälsa, men också populära spelplattformar såsom Roblox, säger senior åklagare Jenny Östling. ”Sektliknande drag” Enligt Erik Glaad, reporter på Expo, rör det sig inte om traditionella organisationer, utan om digitala gemenskaper med tydliga sektliknande drag. – Det här är online‑gemenskaper med mer sektliknande drag, där 764 utgör ett eget litet hörn i det större sammanhanget som vi kallar för The Com, säger han. Åtalet omfattar även misstankar om att 18‑åringen förmått personer i andra länder att skada sig själva eller begå sexuella handlingar på sig själva. Enligt åklagaren rör det sig bland annat om målsäganden i Australien och Tyskland. – Han misstänks även för olaga våldsskildring, då han har spridit bilder med fruktansvärt innehåll i grupper och forum där det bland annat har befunnit sig barn och unga, säger Jenny Östling. Plocka poäng och stiga i hierarkin Glaad beskriver 764 som en extrem miljö där övergrepp, våld och dokumentation är centrala inslag. – 764 ägnar sig åt en slags onlinebaserad, i mångt och mycket, extremism som går ut på att grooma personer att begå övergrepp på sig själva eller att dokumentera övergrepp som de i sin tur har pressat andra att begå på sig själva, säger han. Enligt honom finns också en tydlig koppling mellan nätaktiviteten och fysiskt våld. – Det präglas också av övergrepp och våldsdåd i den fysiska världen, där man går ut och begår skadegörelse, begår knivdåd eller andra våldsamma överfall. Allt dokumenteras och sprids inom gruppen i ett ”spelifierat” sammanhang för att plocka poäng och stiga i en informell hierarki, säger Glaad. Samtliga brott ska enligt åtalet ha begåtts över internet under perioden januari 2023 till februari 2025. Mannen, som i dag är 18 år, har varit häktad sedan april förra året.", "link": "https://www.tv4.se/artikel/6qYJrUmcDU6RCGLb1vS2Uf/hoegt-profilerad-man-inom-764-naetverket-atalas", "date_display": "2026-05-08", "date_iso": "2026-05-08T10:50:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/kriminalitet", "/atal", "/brott-och-straff", "/764", "/natsekten-764"]}, {"id": 144, "title": "Doctor Mikael explains how to poop correctly: \"Don't slouch on the toilet\"", "summary": "Harvard doctor Trisha Patricia has recently released the book \"You've been pooping all wrong\", where she busts common myths about toilet habits. The book has been widely distributed and the subject has been widely discussed, even in Nyhetsmorgon. According to Mikael Sandström, known as Doctor Mikael, it is above all mobile phone use in the toilet that can cause problems. Prolonged sitting increases the risk of hemorrhoids. Taking your mobile phone into the toilet is a habit that many people have, but it can lead to sitting for longer than necessary.\n\n- You get increased problems with hemorrhoids. If you sit and relax on the toilet and scroll, you are waiting for something to happen. But pooping is a reflex that needs to start and then it needs to come out, says Mikael Sandström. Studies show that prolonged sitting in the wrong position, especially if you are idle and stuck on your mobile phone, can worsen the problems.\n\n- If you use a phone and sit and scroll and surf, you do nothing. Then you sit longer in the wrong position, claims the study. And then you don't have pelvic floor support and that in turn leads to more hemorrhoids, says Sandström. Connection with other lifestyles According to Mikael Sandström, there is also a connection between lazing on the toilet and being less active in everyday life.\n\n- It also shows that those who laze the most on the toilet, those who sit here and scroll, are a little less inclined to physical activity, he says. Squat and eat more fiber For those who have problems with the stomach or intestines, Sandström recommends squatting, with the knees higher than the hips.\n\n- Squatting is the best. Today's toilet seats are high, so you may be sitting at a 90 degree angle. But the body is made so that when you squat, the rectum straightens out, he says. A simple stool under the feet can help achieve the correct position at home. In addition, it is important to get enough fiber every day.\n\n- I think you should have fiber in all meals. You feel better d", "title_original": "Doktor Mikael reder ut hur du bajsar rätt: ”Slöa inte på toa”", "summary_original": "Harvardläkaren Trisha Patricia har nyligen släppt boken ”You've been pooping all wrong”, där hon slår hål på vanliga myter om toalettvanor. Boken har fått stor spridning och ämnet har diskuterats flitigt, även i Nyhetsmorgon. Enligt Mikael Sandström, känd som Doktor Mikael, är det framför allt mobilanvändandet på toaletten som kan orsaka problem. Lång sittning ökar risken för hemorrojder Att ta med sig mobilen in på toaletten är en vana som många har, men det kan leda till att man sitter kvar längre än nödvändigt.\n\n– Man får ökade problem med hemorrojder. Om man sitter och slappar på toaletten och scrollar, väntar man på att något ska hända. Men bajsa är en reflex som ska komma igång och sen ska det ut, säger Mikael Sandström. Studier visar att långvarigt sittande i felaktig position, särskilt om man är sysslolös och fastnar i mobilen, kan förvärra problemen.\n\n– Om man använder sig av en telefon och sitter och scrollar och surfar så gör man ingenting. Då blir man sittandes längre i felaktig position, hävdar man i studien. Och då har man inget bäckenbåtsstöd och då leder det i sin tur till att man får mer hemorrojder, säger Sandström. Samband med övrig livsstil Enligt Mikael Sandström finns det också ett samband mellan att slöa på toaletten och att vara mindre aktiv i vardagen.\n\n– Det visar sig också lite med att de som slöar mest på toa, de som sitter här och scrollar, är lite mindre benägna till fysisk aktivitet, säger han. Sitt på huk och ät mer fibrer För den som har problem med magen eller tarmen rekommenderar Sandström att sitta på huk, med knäna högre än höfterna.\n\n– På huk är det bästa. Dagens toalettstolar är ju höga, så man sitter kanske i 90 graders vinkel. Men kroppen är gjord så att när man sätter sig på huk då rätas ändtarmen ut, säger han. En enkel pall under fötterna kan hjälpa till att uppnå rätt position hemma. Dessutom är det viktigt att få i sig tillräckligt med fibrer varje dag.\n\n– Jag tycker man bör ha fibrer i alla måltider. Man mår ju bättre då, säger Mikael Sandström. Vanor som gör skillnad Att prata om toalettvanor har länge varit tabu, men enligt Sandström är det dags att ta ämnet på allvar.\n\n– Det är en vana. Det visar sig också lite med att de som slöar mest på toa, de som sitter här och scrollar, är lite mindre benägna till fysisk aktivitet, säger han. Hans tre råd är tydliga: Bajsa snabbt och effektivt, ät mer fibrer och sitt på huk.", "link": "https://www.tv4.se/artikel/6dO9cDOY420mj9EFOcz0TK/doktor-mikael-reder-ut-hur-du-bajsar-raett-sloea-inte-pa-toa", "date_display": "2026-05-08", "date_iso": "2026-05-08T10:16:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/hygien", "/avforing", "/bajs", "/toalettvanor"]}, {"id": 145, "title": "Long-term forecast for the summer: Heat, drought and risk of extreme weather", "summary": "Summer is approaching and the first long-term forecasts give an indication of what to expect. The forecasts are based on calculations from the European Weather Center ECMWF, but should be interpreted with caution. In contrast to short-term forecasts, it is not about precise announcements day by day. - It's more of a signal where the odds are leaning. The hit rate is, somewhat depending on which parameter you look at, somewhere between 50 and 70 percent, says TV4 Nyhetern's meteorologist Madeleine Westin. \"Significantly more uncertain\" The forecasts are made with large climate models that are run once a month and take into account several global systems, such as the atmosphere, oceans, land surfaces and climate change. This year, the forecasts are also affected by a strong weather phenomenon, a so-called \"Super-El Niño\", where warmer seawater affects temperatures and circulation in the atmosphere. - When talking about El Niño, it is the temperature of the sea that spills over into the temperature of the atmosphere. It's what controls jet winds and other climatic factors, says Westin.  The calculations are based on 51 different simulations with slightly varying input values. The result is an average value that gives a picture of where the development may be heading. The more the simulations differ, the greater the uncertainty. - The safest parameter is the temperature. Precipitation is much more uncertain, she says. That's what the forecasts show Despite the uncertainties, the forecasts point to a warmer than normal summer. In June, the brightest summer month, the average value for the highest temperature of the day is usually around 20–21 degrees in southern Sweden and around 15–17 degrees further north. - In the eastern parts of Sweden and Europe, it looks like the temperature will be a good bit above what is normal for the time of year, she says. According to the long-term forecasts, the average value of today's highest temperature this year may end up around 0.5 to 1.5 degrees above normal, already in June. At the same time, large regional differences in precipitation are expected. Across parts of southern France and Spain see", "title_original": "Långprognos för sommaren: Värme, torka och risk för extremväder", "summary_original": "Sommaren närmar sig och de första långtidsprognoserna ger en fingervisning om vad som kan vänta. Prognoserna bygger på beräkningar från det europeiska vädercentret ECMWF, men ska tolkas med försiktighet. Till skillnad från korttidsprognoser handlar det inte om exakta besked dag för dag. – Det är mer en signal vart oddsen lutar åt. Träffsäkerheten ligger, lite beroende på vilken parameter man tittar på, någonstans mellan 50 och 70 procent, säger TV4 Nyheternas meteorolog Madeleine Westin. ”Betydligt osäkrare” Prognoserna tas fram med stora klimatmodeller som körs en gång i månaden och väger in flera globala system, som atmosfär, hav, landytor och klimatförändringar. I år påverkas prognoserna dessutom av ett kraftigt väderfenomen, en så kallad ”Super-El Niño”, där varmare havsvatten påverkar temperaturer och cirkulation i atmosfären. – När man pratar om El Niño så är det havets temperatur som spiller över i atmosfärens temperatur. Det är det som styr jetvindar och andra klimatiska faktorer, säger Westin.  Beräkningarna baseras på 51 olika simuleringar med något varierande ingångsvärden. Resultatet blir ett medelvärde som ger en bild av var utvecklingen kan vara på väg. Ju mer simuleringarna skiljer sig åt, desto större är osäkerheten. – Den säkraste parametern är temperaturen. Nederbörden är betydligt osäkrare, säger hon. Det visar prognoserna Trots osäkerheterna pekar prognoserna mot en varmare sommar än normalt. I juni, den ljusaste sommarmånaden, ligger medelvärdet för dagens högsta temperatur vanligtvis runt 20–21 grader i södra Sverige och omkring 15–17 grader längre norrut. – I de östra delarna av Sverige och Europa så ser det ut som temperaturen kommer ligga en bra bit över vad som är normalt för årstiden, säger hon. Enligt långtidsprognoserna kan medelvärdet av dagens högsta temperatur i år hamna omkring 0,5 till 1,5 grader över det normala, redan under juni. Samtidigt väntas stora regionala skillnader i nederbörd. Över delar av södra Frankrike och Spanien ser det ut att komma mycket regn i juni, vilket i sin tur kommer att påverka semestervädret i Sverige.  – Det här betyder torka för vår del, säger hon. ”Väldigt allvarligt” I Sverige ser nederbörden ut att fördelas ojämnt. – Ganska torrt i den södra halvan, men regn längre norrut, säger Westin.  Under juli pekar prognoserna mot mer högtrycksbetonat väder över stora delar av Europa. Det är också den månad som visar den största temperaturavvikelsen i Sverige, med medelvärden tydligast över det normala, särskilt i norra delar av landet. – Det här är extremt komplicerat och utmanande. Det här innebär extrema väderhändelser – torka, skogsbränder och så vidare, säger hon. Nederbörden väntas samtidigt bli låg i stora delar av Europa, med undantag för delar av Norge och norra Sverige. I augusti ser värmen ut att dröja sig kvar och för med sig både torka och hetta.  – Det kan kännas härligt, men det här är väldigt allvarligt. Det är inte särskilt stora nederbördsmängder heller, utan det ligger under vad som är normalt, säger Madeleine Westin.", "link": "https://www.tv4.se/artikel/19JlwnNtoi4B6jzDRNZvPe/langprognos-foer-sommaren-vaerme-torka-och-risk-foer-extremvaeder", "date_display": "2026-05-08", "date_iso": "2026-05-08T06:36:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/vadret", "/vader", "/vadervarningar", "/vaderprognoser", "/vaderfenomen", "/personer/madeleine-westin", "/meteorolog", "/vatten"]}, {"id": 146, "title": "The S move: Wants to exempt own media company - from the new rules", "summary": "After TV4 Kalla Fakta exposed the Sweden Democrats' troll factories, i.e. anonymous accounts in social media that were run by SD, the Riksdag parties began negotiations on a code of conduct.\n\nAnd when it was discovered last autumn that the Social Democrats, via their media company AIP Media, used accounts in social media with unclear senders, the Liberals wanted to see clarifications in the code of conduct.  Initiative from L Koden was an initiative from the Liberals, who had difficulty balancing the criticism of the Sweden Democrats with the deep cooperation with the party.\n\nTV4 Nyheterna has taken part in the latest developments in the negotiations on the regulations. One proposal states that it should always \"be clear when a political party is behind opinion formation, even if it happens through a subsidiary\", which is the case with AIP Media - which is wholly owned by the Social Democrats. But the Social Democrats do not want to agree to that.\n\nInstead, S proposes a rule that it must be stated that it is a political party that communicates if the party \"has had direct influence over the content\" of opinion formation. Such a rule would mean that AIP Media does not have to be as clear that the Social Democrats own the company, when AIP communicates in, for example, social media.\n\n- It is important for us to influence and be where people are. You do it via a paper newspaper, you do it on websites, you do it via social media. But the content must be editorially free from us and it is, says the Social Democrats' party secretary Tobias Baudin.  The reason: Independent The exception would apply to AIP because the Social Democrats, despite owning AIP and sitting on the board, claim that the party's media company is completely independent when it comes to the content it publishes.\n\n- The important thing is that if you see something, if it's something you have an opinion on, it can be positive or negative, then you have to see, who has published this? Then it should be clear who it is. After", "title_original": "S-draget: Vill undanta egna mediabolaget – från nya reglerna", "summary_original": "Efter att TV4 Kalla Fakta avslöjat Sverigedemokraternas trollfabriker, alltså anonyma konton i sociala medier som drevs av SD, inledde riksdagspartierna förhandlingar om en uppförandekod.\n\nOch när det i höstas uppdagades att Socialdemokraterna, via sitt mediabolag AIP Media, använt sig av konton i sociala medier med oklar avsändare, ville Liberalerna se förtydliganden i uppförandekoden.  Initiativ från L  Koden var ett initiativ från Liberalerna, som hade svårigheter med att balansera kritiken mot Sverigedemokraterna med det djupa samarbetet med partiet.\n\nTV4 Nyheterna har tagit del av de senaste turerna i förhandlingarna om regelverket. I ett förslag står att det alltid ska \"framgå när ett politiskt parti står bakom opinionsbildning, även om det sker genom ett dotterbolag\", vilket är fallet med AIP Media - som helägs av Socialdemokraterna. Men det vill Socialdemokraterna inte gå med på.\n\nI stället föreslår S en regel om att det ska framgå att det är ett politiskt parti som kommunicerar om partiet \"har haft direkt inflytande över innehållet\" i opinionsbildning. En sådan regel skulle göra att AIP Media inte behöver vara lika tydliga med att Socialdemokraterna äger bolaget, när AIP kommunicerar i exempelvis sociala medier.\n\n– Det är viktigt för oss att påverka och finnas där människor finns. Man gör det via en papperstidning, man gör det på hemsidor, man gör det via sociala medier. Men innehållet ska vara redaktionellt fritt från oss och det är det ju också, säger socialdemokraternas partisekreterare Tobias Baudin.  Anledningen: Självständigt  Undantaget skulle gälla för AIP eftersom Socialdemokraterna, trots att de äger AIP och sitter med i styrelsen, hävdar att partiets mediabolag är helt självständigt när det kommer till innehållet som det publicerar.\n\n– Det viktiga är att om man ser någonting, om det är någonting man har synpunkter på, det kan vara positivt eller negativt, då ska man se, vem är det som har gett ut det här? Då ska det vara tydligt vem det är. Eftersom det då är AIP, då ska det också framgå att det är dem och det är dem man ska ringa till exempelvis. Det är inte vi som står bakom det, utan det är AIP, säger Tobias Baudin.\n\nTanken är att uppförandekoden ska bli ett regelverk för partierna i den kommande valrörelsen som ska klargöra hur partierna får kommunicera mot väljarna. Men eftersom förhandlingarna går trögt riskerar reglerna att inte komma på plats.  En fråga om tiillit  Karin Enström, partisekreterare för Moderaterna, säger att hon hoppas att processen ska komma framåt.\n\n– Det handlar om tillit också. Det handlar inte bara om den delen som Socialdemokraterna nu föreslår en liten ändring på. Jag har egentligen ingen kommentar till själva sakinnehållet. Jag hoppas på konstruktivt samtal och att Socialdemokraterna också tar ansvar i detta.\n\nTV4 Nyheterna har sökt Liberalerna och Kristdemokraterna för en kommentar. Liberalerna avstår, Kristdemokraterna har inte återkommit.", "link": "https://www.tv4.se/artikel/4yMNoQmutN4dwtdfeqDQ8J/s-draget-vill-undanta-egna-mediabolaget-fran-nya-reglerna", "date_display": "2026-05-08", "date_iso": "2026-05-08T06:11:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/politik", "/inrikes", "/svensk-politik", "/valet-2022/socialdemokraterna"]}, {"id": 147, "title": "Åkesson's smack against L: \"It would have been nice to avoid them\"", "summary": "In this week's episode of SVT's \"Prejudice show\" it was Jimmie Åkesson's turn to guest.  In the program, Emil Persson says that he believes that the Liberals are needed so that the right can retain power, but that \"a self-destructive part\" of the SD leader would at the same time enjoy if the party left the Riksdag with \"the head first\". - It is clear that it would have been nice to avoid them, replies Jimmie Åkesson.  \"Very far from each other\" Åkesson explains that the Liberals and the Sweden Democrats have historically been \"very far from each other\".\n\n- Part of me thinks so. But at the same time, the more rational part of me thinks they are still needed, he says and continues: - Partly we need their votes and partly I think we have had a damned constructive collaboration now for three years which has gone much better than I dared to hope. I like everything better about that party, actually. Plays sound from porn site In the episode, Emil Persson also plays the intro sound that is played before the clips on a famous porn site without saying where the sound is coming from, and asks the party leader if it sounds familiar. Åkesson walks straight into the trap. - It sounded familiar, of course, he replies.\n\nIs it a site you frequent? - No, I can't claim that it is. Absolutely not. Journalist and presenter Emil Persson has run the Fördompodden for several years. In the programme, he exposes the Riksdag's party leaders to his own prejudices about them.  Magdalena Andersson (S), Ebba Busch (KD) and Simona Mohamsson (L) have guested on the program in previous episodes.", "title_original": "Åkessons smocka mot L: ”Det hade varit skönt att slippa dem”", "summary_original": "I veckans avsnitt av SVT:s ”Fördomsshowen” var det Jimmie Åkessons tur att gästa.  I programmet säger Emil Persson att han tror att Liberalerna behövs för att högersidan ska kunna behålla makten, men att ”en självdestruktiv del” av SD-ledaren samtidigt skulle kunna njuta av om partiet åkte ur riksdagen med ”huvudet före”. – Det är klart att det hade varit skönt att slippa dem, svarar Jimmie Åkesson.  ”Väldigt långt ifrån varandra” Åkesson förklarar att Liberalerna och Sverigedemokraterna historiskt stått ”väldigt långt ifrån va
