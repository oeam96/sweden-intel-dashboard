mation", "age_tag": "12 days old", "tags": ["International", "Ministry of Health and Social Affairs", "Civil society and sport", "Statement", "Jakob Forssmed"]}, {"id": 189, "title": "Continuing Nordic cooperation on returns", "summary": "Joint Statement by the ministers responsible for migration from the Nordic Countries.", "title_original": "Continuing Nordic cooperation on returns", "summary_original": "Joint Statement by the ministers responsible for migration from the Nordic Countries.", "link": "https://www.government.se/statements/2026/03/continuing-nordic-cooperation-on-returns/", "date_display": "2026-03-06", "date_iso": "2026-03-06T15:55:32+00:00", "source": "Government.se", "ministry": "Ministry of Justice", "type": "Official Information", "age_tag": "12 days old", "tags": ["EU", "Ministry of Justice", "Migration and asylum", "Statement", "Johan Forssell", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 190, "title": "Statement of the International Contact Group for the Great Lakes (ICG) on the situation in the eastern Democratic Republic of the Congo (DRC)", "summary": "Belgium, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement on the situation in the eastern Democratic Republic of the Congo (DRC).", "title_original": "Statement of the International Contact Group for the Great Lakes (ICG) on the situation in the eastern Democratic Republic of the Congo (DRC)", "summary_original": "Belgium, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement on the situation in the eastern Democratic Republic of the Congo (DRC).", "link": "https://www.government.se/statements/2026/03/statement-of-the-international-contact-group-for-the-great-lakes-icg--on-the-situation-in-the-eastern-democratic-republic-of-the-congo-drc/", "date_display": "2026-03-05", "date_iso": "2026-03-05T17:12:56+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement"]}, {"id": 191, "title": "Memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries", "summary": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland.", "title_original": "Memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries", "summary_original": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland.", "link": "https://www.government.se/swedish-treaty-series/2026/03/memorandum-of-understanding-on-protecting-the-civilian-population-of-the-baltic-sea-region-and-the-nordic-countries/", "date_display": "2026-03-05", "date_iso": "2026-03-05T12:13:19+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "13 days old", "tags": ["International", "Ministry of Defence", "Emergency preparedness", "Civil defence", "Total defence", "Swedish Treaty Series"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
