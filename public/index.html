ainst foreign influence and misinformation. \n The post Election 2026: How Sweden is preparing appeared first on ABC News.", "title_original": "Valet 2026: Så förbereder sig Sverige", "summary_original": "Den 13 september 2026 hålls riksdagsval, regionval och kommunval – och myndigheterna arbetar intensivt för att skydda valinfrastrukturen mot utländsk påverkan och desinformation. \n The post  Valet 2026: Så förbereder sig Sverige  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/valet-2026-sa-forbereder-sig-sverige/", "date_display": "2026-03-23", "date_iso": "2026-03-23T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "4 days old", "tags": ["Politik", "desinformation", "MSB", "riksdagsval", "säkerhet", "val 2026", "valmyndigheten", "valrörelse"]}, {"id": 190, "title": "The Social Democrats demand a stop to new export cables", "summary": "The Social Democrats demand an immediate stop to new export cables and the upgrading of existing connections, and want the revenue to be used to lower Swedish household electricity bills. \n The post The Social Democrats demand a stop to new export cables appeared first on ABC Nyheter.", "title_original": "Socialdemokraterna kräver stopp för nya exportkablar", "summary_original": "Socialdemokraterna kräver omedelbart stopp för nya exportkablar och uppgradering av befintliga förbindelser, och vill att intäkterna används för att sänka svenska elhushålls räkningar. \n The post  Socialdemokraterna kräver stopp för nya exportkablar  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/socialdemokraterna-kraver-stopp-for-nya-exportkablar/", "date_display": "2026-03-22", "date_iso": "2026-03-22T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "5 days old", "tags": ["Politik", "el", "elpriser", "energi", "energipolitik", "EU", "exportkablar", "Socialdemokraterna"]}, {"id": 191, "title": "The Riksdag votes on security storage for an indefinite period", "summary": "The Justice Committee supports the government's proposal for safe custody – a new penalty which means that dangerous repeat offenders can be detained indefinitely. \n The post Riksdag votes on security storage for an indefinite period appeared first on ABC Nyheter.", "title_original": "Riksdagen röstar om säkerhetsförvaring på obestämd tid", "summary_original": "Justitieutskottet stödjer regeringens förslag om säkerhetsförvaring – en ny påföljd som innebär att farliga återfallsförbrytare kan hållas frihetsberövade på obestämd tid. \n The post  Riksdagen röstar om säkerhetsförvaring på obestämd tid  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/riksdagen-rostar-om-sakerhetsforvaring-pa-obestamd-tid/", "date_display": "2026-03-21", "date_iso": "2026-03-21T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "6 days old", "tags": ["Politik", "brott", "justitie", "lagstiftning", "rättsväsende", "riksdagen", "säkerhetsförvaring", "straffrätt"]}, {"id": 192, "title": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada and others on the Strait of Hormuz: 19 March 2026", "summary": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada, Republic of Korea, New Zealand, Denmark, Latvia, Slovenia, Estonia, Norway, Sweden, Finland, Czechia, Romania, Bahrain and Lithuania on the Strait of Hormuz.", "title_original": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada and others on the Strait of Hormuz: 19 March 2026", "summary_original": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada, Republic of Korea, New Zealand, Denmark, Latvia, Slovenia, Estonia, Norway, Sweden, Finland, Czechia, Romania, Bahrain and Lithuania on the Strait of Hormuz.", "link": "https://www.government.se/statements/2026/03/joint-statement-from-the-leaders-of-the-united-kingdom-france-germany-italy-the-netherlands-japan-canada-and-others-on-the-strait-of-hormuz-19-march-2026/", "date_display": "2026-03-20", "date_iso": "2026-03-20T20:17:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "6 days old", "tags": ["International", "Prime Minister's Office", "Energy", "Foreign and security policy", "Statement", "Ulf Kristersson"]}, {"id": 193, "title": "Sweden is launching a new electric car premium - here's how to apply", "summary": "A new government electric car premium opens for applications and can give households in rural areas up to SEK 46,800 - financed to 75 percent by the EU's social climate fund. \n The post Sweden launches new electric car premium – how to apply appeared first on ABC News.", "title_original": "Sverige lanserar ny elbilspremie – så här ansöker du", "summary_original": "En ny statlig elbilspremie öppnar för ansökningar och kan ge hushåll på landsbygden upp till 46 800 kronor – finansierad till 75 procent av EU:s sociala klimatfond. \n The post  Sverige lanserar ny elbilspremie – så här ansöker du  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/sverige-lanserar-ny-elbilspremie-sa-har-ansoker-du/", "date_display": "2026-03-20", "date_iso": "2026-03-20T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "7 days old", "tags": ["Ekonomi", "elbil", "elfordon", "EU", "klimat", "landsbygd", "Naturvårdsverket", "premie"]}, {"id": 194, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "The executive board has decided to leave the key interest rate unchanged at 1.75 percent and the interest rate is expected to remain at this level for some time to come. But the war in the Middle East makes the forecast very uncertain.  The Riksbank is following developments closely and will adapt monetary policy if the inflation and business cycle prospects require it.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent och räntan väntas ligga kvar på denna nivå under en tid framöver. Men kriget i Mellanöstern gör prognosen mycket osäker.  Riksbanken följer utvecklingen noga och kommer att anpassa penningpolitiken om inflations- och konjunkturutsikterna kräver det.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent2/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:42:40+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "7 days old", "tags": []}, {"id": 195, "title": "The Riksbank lowers the interest rate on the supplementary liquidity facility", "summary": "In the Riksbank's monetary policy control system, the interest rate that shall apply to the banks' overnight deposits and lending in the Riksbank is specified. In the Riksbank's supplementary liquidity facility, banks can take loans against collateral such as covered bonds. The interest surcharge on the supplementary liquidity facility is now reduced from 0.75 percentage points to 0.30 percentage points above the policy rate. In addition, the Riksbank removes the restriction on the percentage of covered bonds that the banks may use as collateral for loans from the Riksbank. The changes come into effect on 8 April 2026, and are part of the Riksbank's long-term work to facilitate banks' adaptation to an environment with less excess liquidity.", "title_original": "Riksbanken sänker räntan på den kompletterande likviditetsfaciliteten", "summary_original": "I Riksbankens penningpolitiska styrsystem anges vilken ränta som ska gälla för bankernas in- och utlåning över natten i Riksbanken. I Riksbankens kompletterande likviditetsfacilitet kan bankerna ta lån mot säkerheter som exempelvis säkerställda obligationer. Räntepåslaget på den kompletterande likviditetsfaciliteten sänks nu från 0,75 procentenheter till 0,30 procentenheter över styrräntan. Dessutom tar Riksbanken bort begränsningen för hur stor andel säkerställda obligationer bankerna får använda som säkerhet vid lån från Riksbanken. Förändringarna träder i kraft den 8 april 2026, och är en del av Riksbankens långsiktiga arbete med att underlätta bankernas anpassning till en miljö med mindre överskottslikviditet.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbanken-sanker-rantan-pa-den-kompletterande-likviditetsfaciliteten/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:29:00+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "7 days old", "tags": []}, {"id": 196, "title": "Sweden joins Pax Silica initiative", "summary": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "title_original": "Sweden joins Pax Silica initiative", "summary_original": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "link": "https://www.government.se/press-releases/2026/03/sweden-joins-pax-silica-initiative/", "da  {"id": 200, "title": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "title_original": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary_original": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/speech-by-the-minister-for-foreign-affairs-at-the-baltic-sea-security-talks-in-gdansk-on-12-march/", "date_display": "2026-03-13", "date_iso": "2026-03-13T13:51:21+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
