v4.se/artikel/4kopv3XFVTFnleIRicCwjt/sa-vaeljer-du-raett-kattvakt-experten-varnar-foer-amatoerer", "date_display": "2026-06-22", "date_iso": "2026-06-22T17:51:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/djur", "/djurskyddslagar", "/djur-och-natur", "/djursjukdomar", "/katt", "/katthem"]}, {"id": 144, "title": "Sharp warning to tourists in Europe: \"You cook from the inside\"", "summary": "According to several weather authorities, unusually high temperatures are expected in large parts of Europe this week. In France, the temperature on Monday is expected to reach up to 43 degrees in some parts of the country. In the afternoon, two children were found dead in a car in France, where the heat wave is one of the main clues in the investigation. Survival expert Torbjörn Selin has family members who are currently vacationing on the continent. He says that you don't need to be afraid if you go to places where you have access to a pool and AC. - I had seen no problem going to a regular charter location. But I didn't want to go to Mallorca and hike in the mountains, he tells TV4 Nyheterna. Then the heat wave becomes life-threatening According to Torbjörn Selin, it becomes very dangerous to go out and exert yourself if you do not know what you are doing in the extreme heat. It can be fatal if you are careless with the liquid. - So maybe you drink alcohol and don't eat and drink normally. Especially if you exert yourself in the heat, because then the body has a very hard time protecting itself and you can suffer from heat exhaustion and then heat stroke. When the temperature in the body rises to over 40 degrees, you can become unconscious, have convulsions and be unable to save yourself, according to the survival expert. - When you reach these temperatures, the cells in the body are destroyed - it's like you're boiling from the inside. The body shuts you down completely and you have no way to reverse it in any way. Cooling is more of a long process where you slowly drop the temperature.  \"Stay in the shade, drink and cool off\" Anyone planning a trip to any of the areas in Europe where red or orange weather warnings have been issued should stay indoors or in the shade during the worst mid-day hours. - Between eleven o'clock and 2 p.m. you don't have to run around outside and have activities. Stay in the shade, drink and cool off. If you still move in the sun, you can walk around with an umbrella or wet your sweater or shirt to cool down. - Just to go r", "title_original": "Skarpa varningen till turister i Europa: ”Man kokar inifrån”", "summary_original": "Enligt flera vädermyndigheter väntas ovanligt höga temperaturer i stora delar av Europa i veckan. I Frankrike väntas temperaturen under måndagen nå upp till 43 grader i vissa delar av landet. På eftermiddagen hittades två barn döda i en bil i Frankrike där värmeböljan är ett av huvudspåren i utredningen. Överlevnadsexperten Torbjörn Selin har familjemedlemmar som just nu semestrar på kontinenten. Han säger att man inte behöver vara rädd om man åker till platser där man har tillgång till pool och AC. – Jag hade inte sett något problem att åka till en vanlig charterort. Men jag hade inte velat åka till Mallorca och vandra i bergen, säger han till TV4 Nyheterna. Då blir värmeböljan livsfarlig Enligt Torbjörn Selin blir det väldigt farligt att ge sig ut och anstränga sig om man inte vet vad man gör i extremvärmen. Livsfarligt blir det om man slarvar med vätskan. – Alltså du kanske dricker alkohol och inte äter och dricker normalt. Speciellt om du anstränger dig i värmen för då har kroppen väldigt svårt att kunna skydda sig och du kan drabbas av värmeutmattning och därefter värmeslag. När temperaturen i kroppen stiger till över 40 grader kan man bli medvetslös, få kramper och inte kunna rädda sig själv, enligt överlevnadsexperten. – När du kommer upp i de här temperaturerna förstörs cellerna i kroppen – det blir som att man kokar inifrån. Kroppen stänger av dig komplett och du har ingen möjlighet att backa det på något sätt. Kyla är mer en långdragen process där du sakta tappar temperaturen.  ”Var i skuggan, drick och svalka dig” Den som har en resa planerad till något av de områden i Europa där det har utfärdats röda eller orange vädervarningar bör hålla sig inne eller i skuggan under de värsta timmarna mitt på dagen. – Mellan klockan elva och 14 behöver du inte springa runt ute och ha aktiviteter. Var i skuggan, drick och svalka dig. Om man ändå rör sig i solen kan man gå runt med ett paraply eller blöta ner sin tröja eller skjorta för att kyla ner sig. – Bara att gå runt i en stad där det står stilla utan att du har täckt dig med hjälp av skugga eller kläder kan vara jobbigt. Det vill ju till att vara där det fläktar lite, där du kan svalka dig och komma undan från den värsta värmen.", "link": "https://www.tv4.se/artikel/5uYoInHNAf0z5Xs8mM5cjR/skarpa-varningen-till-turister-i-europa-man-kokar-inifran", "date_display": "2026-06-22", "date_iso": "2026-06-22T16:34:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/vadret", "/halsa", "/varme", "/varmeboljor", "/europa", "/frankrike", "/spanien", "/tyskland", "/vader"]}, {"id": 145, "title": "Roks saw M proposal: \"Does not automatically mean that the violence ends\"", "summary": "The moderates go to the polls on tougher penalties for men's violence against women. The election pledge was presented by M leader Ulf Kristersson at a law office on Södermalm in Stockholm. - Many people think that it is provocatively low punishments for recurring violence and harassment, said Prime Minister Ulf Kristersson (M) during the press conference. The moderates want men's violence against women to be fought with the same force as gang crime. The party therefore wants to investigate the possibility of doubling the punishment for certain crimes in a close relationship, especially gross violation of women's rights. Saw by the women's organization The proposal has already met with criticism. The national organization for women's and girls' emergency services in Sweden, Roks, calls it naive. - When you read the Moderates' press release, I think you perceive it in any case as the Moderates have a rather naive view of what men's violence against women is, says Adine Samadi, chairman of Roks. The organization is critical of a one-sided focus on increasing punishment and believes that violence can continue even when the perpetrator is in prison. - Our experience from is that men's violence against women is about power and control, not just about a physical presence. To think that men do not continue to subject women to violence after being locked up is, as I said, a naive picture of the violence, says Samadi. - We meet women and girls where men who have victimized them are in prison and victimize them through prison. So he sends letters, calls, and if he doesn't have the opportunity, he uses his friends, acquaintances or relatives to send letters and such to her to continue control and power, she continues. Want to see changes in the judicial chain Roks would rather see measures that lower the thresholds for reporting and that drive changes in treatment and knowledge within the justice system, explains Samadi. - It's that she needs to have a completely different approach from the police and the prosecutor. - They need to do cultural work where they see and prioritize men's and boys' violence against women, girls and children p", "title_original": "Roks sågar M-förslag: ”Betyder inte automatiskt att våldet upphör”", "summary_original": "Moderaterna går till val på skärpta straff för mäns våld mot kvinnor. Vallöftet presenterades av M-ledaren Ulf Kristersson på ett advokatkontor på Södermalm i Stockholm. – Många tycker att det är provocerande låga straff för återkommande våld och trakasserier, sade statsminister Ulf Kristersson (M) under pressträffen. Moderaterna vill att mäns våld mot kvinnor ska bekämpas med samma kraft som gängkriminalitet. Partiet vill därför utreda möjligheten att dubblera straffen för vissa brott i nära relation, särskilt grov kvinnofridskränkning. Sågas av kvinnoorganisationen Förslaget har redan mött kritik. Riksorganisationen för kvinno- och tjejjourer i Sverige, Roks, kallar det naivt. – När man läser Moderaternas pressmeddelande så tycker jag att man uppfattar det i alla fall som att Moderaterna har en ganska naiv bild av vad mäns våld mot kvinnor är, säger Adine Samadi, ordförande för Roks. Organisationen är kritisk till ett ensidigt fokus på straffskärpningar och menar att våld kan fortsätta även när gärningsmannen sitter i fängelse. – Vår erfarenhet från är att mäns våld mot kvinnor handlar om makt och kontroll, inte bara om en fysisk närvaro. Att tro att män inte fortsätter utsätta kvinnor för våld efter att ha blivit inlåst är som sagt en naiv bild av våldet, säger Samadi. – Vi möter ju kvinnor och tjejer där män som har utsatt dem sitter i fängelse och utsätter dem genom fängelset. Alltså skickar brev, samtal, och om han inte har möjlighet så använder han sina vänner, bekanta eller släktingar att skicka brev och så till henne för att fortsätta kontrollen och makten, fortsätter hon. Vill se förändringar i rättskedjan Roks vill hellre se åtgärder som sänker trösklarna för att anmäla och som driver på förändringar i bemötande och kunskap inom rättsväsendet, förklarar Samadi. – Det är ju att hon behöver ha ett helt annat bemötande hos polisen och åklagaren. – De behöver göra ett kulturarbete där de ser och prioriterar mäns och killars våld mot kvinnor, tjejer och barn på ett helt annat sätt än i dag. Att man ser till att bryta våldet redan första gången hon anmäler berättar för någon om våldet. Det behövs i det här paketet, men det är ingenting som vi ser spår av. Samadi tillägger att frågan om våld mot kvinnor ofta lyfts i samband med val. – Vi har historiskt som organisation sett att flera olika partier pratar om mäns våld mot kvinnor i samband med ett valår. Men det är liksom inte det viktiga för oss. – Det handlar mer om att vad det innebär för kvinnor i praktiken.", "link": "https://www.tv4.se/artikel/33hmwsddb9OwoJVjWd0B7j/roks-sagar-m-foerslag-betyder-inte-automatiskt-att-valdet-upphoer", "date_display": "2026-06-22", "date_iso": "2026-06-22T12:31:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/politik", "/valet-2022/moderaterna", "/svensk-politik", "/valet-2026"]}, {"id": 146, "title": "Sweden joins special tribunal and international claims commission for Ukraine", "summary": "The Government has decided that Sweden will join the Special Tribunal for the Crime of Aggression against Ukraine and the International Claims Commission for Ukraine. Demanding accountability for Russia’s crimes against Ukraine is an important priority for the Swedish Government. The aim is to ensure redress and justice for Ukraine and its people.", "title_original": "Sweden joins special tribunal and international claims commission for Ukraine", "summary_original": "The Government has decided that Sweden will join the Special Tribunal for the Crime of Aggression against Ukraine and the International Claims Commission for Ukraine. Demanding accountability for Russia’s crimes against Ukraine is an important priority for the Swedish Government. The aim is to ensure redress and justice for Ukraine and its people.", "link": "https://www.government.se/press-releases/2026/06/sweden-joins-special-tribunal-and-international-claims-commission-for-ukraine/", "date_display": "2026-06-22", "date_iso": "2026-06-22T11:22:18+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "International law", "Sweden's support to Ukraine"]}, {"id": 147, "title": "Government receives state aid application for nuclear power project outside Malmö", "summary": "The Government has received another application for state aid to build new nuclear power reactors in Sweden. The application was submitted by Nordic Baseload Power for a project at Barsebäck in Kävlinge outside Malmö. This is the fourth such application received by the Government.", "title_original": "Government receives state aid application for nuclear power project outside Malmö", "summary_original": "The Government has received another application for state aid to build new nuclear power reactors in Sweden. The application was submitted by Nordic Baseload Power for a project at Barsebäck in Kävlinge outside Malmö. This is the fourth such application received by the Government.", "link": "https://www.government.se/press-releases/2026/06/government-receives-state-aid-application-for-nuclear-power-project-outside-malmo/", "date_display": "2026-06-22", "date_iso": "2026-06-22T11:17:31+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 148, "title": "Israeli authorities have taken over the land of the Greek Orthodox Church", "summary": "A \"dangerous precedent\" in the matter of \"church rights in Jerusalem\", says the Greek Orthodox Patriarchate.", "title_original": "Israeliska myndigheter har tagit över grekisk-ortodoxa kyrkans mark", "summary_original": "Ett ”farligt prejudikat” i fråga om ”kyrkorättigheter i Jerusalem”, menar det grekisk-ortodoxa patriarkatet.", "link": "https://www.dagen.se/nyheter/israeliska-myndigheter-har-tagit-oever-grekisk-ortodoxa-kyrkans-mark/10405666", "date_display": "2026-06-22", "date_iso": "2026-06-22T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Failed to \"go through the box\"", "summary": "Perceived as correct but boring", "title_original": "Lyckades inte ”gå genom rutan”", "summary_original": "Uppfattades som korrekt men tråkig", "link": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "date_display": "2026-06-22", "date_iso": "2026-06-22T08:52:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 150, "title": "Starmer resigns: \"Emotional speech\"", "summary": "The message after the strong criticism • Then a new leader must be in place", "title_original": "Starmer avgår: ”Känslofyllt tal”", "summary_original": "Beskedet efter starka kritiken • Då ska en ny ledare vara på plats", "link": "https://www.tv4.se/artikel/4WT6AsX7tPuTVoIhtiDUl7/keir-starmer-avgar", "date_display": "2026-06-22", "date_iso": "2026-06-22T08:37:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 151, "title": "New recommendation: Allowed to be buried with the pet's ashes", "summary": "The background to the new recommendation is, among other things, the pandemic, when many, especially the elderly, acquired pets as companions. - The requests to take the urn after a deceased dog, cat or hamster are increasing, but we must say that it is increasing from a very low level, but we think this should be possible, says Ulf Lernéus, director of the association of Sweden's funeral directors' association.  Ulf Lernéus says that five or six years ago it was not possible to get the dog's or cat's name in an obituary. - Today, that opportunity exists. It is important that we follow the changes in society. In all ages, funerals have been an indicator of how society looks and feels, says Lernéus. Positive response to the change The response to the new recommendation has so far been only positive, according to Ulf Lernéus. - We are talking from an ethical perspective, and from an ethical perspective, you see no major concerns about putting cremated pets in a coffin. He emphasizes, however, that the legislation still requires that anyone who is buried in a public burial ground must have a social security number and be registered in the national register.  This must not be in the casket According to Lernéus, drawings, photographs, wooden instruments, wood sticks, pipes and sewing boxes are some of the most common items that people want to include in the casket. But there are also limitations. Among other things, it is not appropriate to bring pets that have not been cremated. - You must not bring alcohol, ammunition, batteries, glass and carbon fiber, which are found in golf clubs, and of course other flammable liquids. The county board will have its say The discussion about what can be included in the coffin will continue after the summer. County administrations around the country must also have their say when it comes to the desire to be buried with their pet and can act differently depending on where the burial takes place. The County Administrative Board in Stockholm has, among other things, said no to the recommendation of the Association of Swedish Funeral Directors, according to Kyrkans Tidning.", "title_original": "Ny rekommendation: Tillåtet att begravas med husdjurets aska", "summary_original": "Bakgrunden till den nya rekommendationen är bland annat pandemin, då många, särskilt äldre, skaffade husdjur som sällskap. – Förfrågningarna att få ta med sig urnan efter en avliden hund, katt eller hamster ökar, men vi ska säga att den ökar från en väldigt låg nivå, men vi tycker att det här ska vara möjligt, säger Ulf Lernéus, förbundsdirektör för Sveriges begravningsbyråers förbund.  Ulf Lernéus berättar att det för fem-sex år sedan inte var möjligt att få med hundens eller kattens namn i en dödsannons. – Idag finns den möjligheten. Det är viktigt att vi följer samhällsförändringarna. I alla tider har begravningarna varit ett facit av hur samhället ser ut och mår, säger Lernéus. Positiv respons på förändringen Responsen på den nya rekommendationen har hittills varit enbart positiv, enligt Ulf Lernéus. – Vi pratar utifrån ett etiskt perspektiv, och ur ett etiskt perspektiv så ser man inga stora bekymmer att lägga ner kremerade husdjur i en kista. Han betonar dock att lagstiftningen fortfarande kräver att den som gravsätts på en allmän begravningsplats ska ha personnummer och vara folkbokförd.  Detta får inte ligga i kistan  Enligt Lernéus är teckningar, fotografier, träinstrument, metspön, pipa och syskrin några av de vanligaste föremålen som människor vill ha med i kistan. Men det finns också begränsningar. Bland annat är det inte aktuellt att ta med sig husdjur som inte är kremerade. – Alkohol, ammunition, batterier, glas och kolfiber, som finns i golfklubbor får man inte ta med och naturligtvis andra lättantändliga vätskor. Länsstyrelsen ska säga sitt Diskussionen om vad som får följa med i kistan fortsätter efter sommaren. Länsstyrelser runt om i landet ska också säga sitt när det gäller önskan om att begravas med sitt husdjur och kan agera olika beroende på var begravningen sker. Länsstyrelsen i Stockholm har bland annat sagt nej till Svenska begravningsbyråers förbunds rekommendation, enligt Kyrkans Tidning.", "link": "https://www.tv4.se/artikel/dsvTJjWv8UnqojXlWane5/nu-blir-det-tillatet-att-begravas-med-husdjurets-aska", "date_display": "2026-06-22", "date_iso": "2026-06-22T07:27:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/begravning", "/katt", "/hund"]}, {"id": 152, "title": "Tax-free usually more expensive than online purchases: \"Very big differences\"", "summary": "Prisjakt's review includes 1,048 products in categories such as perfume, skin care, hair care, make-up and sunglasses. The results show that eight out of ten items are more expensive at Arlanda Airport than in Swedish online stores.  - The worst thing here is deodorants. There you may have to pay an average of 51 percent more if you buy them in the duty free. Worst in class in the entire survey was a women's perfume where we saw that you had to pay more than triple the price, i.e. 231 percent more. We also found another perfume that in pure kroner cost 1,651 kroner more than online, says Isabella Ahmadi, consumer expert at Prisjakt. Don't stress buy Mascara, sunscreen and shampoo are also often significantly more expensive at the airport. - You often see the slightly more luxurious brands and think that they are good offers, but that is not the case. It is wise to pack from home instead of stress buying at the airport, says Isabella Ahmadi.  Bargains can be made - but require checking There are, however, exceptions. Two out of ten products are cheaper at duty-free than online. For example, the survey showed that a foundation cost 61 percent less at the airport than online. - It is very difficult to know when you are standing there if you have not checked the prices a little before or do it right then and there. You need to do your own little research, perhaps on site, pick up your mobile and compare with different stores, says Ahmadi.  The same pattern at other airports Prisjakt has carried out similar surveys in Norway and Finland, where the same tendencies are visible. The majority of products are more expensive in duty free shops there too. - You must always be aware of the price, says Ahmadi. The price differences are explained by the fact that the duty-free shops have their own price system and are not affected by the price pressure that exists between online shops. Online stores can often lower prices thanks to lower overheads and fierce competition.", "title_original": "Taxfree oftast dyrare än online-köp: ”Väldigt stora skillnader”", "summary_original": "Prisjakts genomgång omfattar 1 048 produkter inom kategorier som parfym, hudvård, hårvård, smink och solglasögon. Resultatet visar att åtta av tio varor är dyrare på Arlanda flygplats än i svenska nätbutiker.  – Värstingen här är deodoranter. Där kan du behöva betala i snitt 51 procent mer om du köper de i taxfreen. Värst i klassen i hela undersökningen var en damparfym där vi såg att man behövde betala mer än tredubbla priset, alltså 231 procent mer. Vi hittade också en annan parfym som i rena kronor kostade 1 651 kronor mer än på nätet, säger Isabella Ahmadi, konsumentexpert på Prisjakt. Stressköp inte Även mascara, solskydd och schampo är ofta betydligt dyrare på flygplatsen. – Man ser ofta de lite lyxigare varumärkena och tänker att det är bra erbjudanden, men så är inte fallet. Det är klokt i att packa med hemifrån i stället för att stressköpa på flygplatsen, säger Isabella Ahmadi.  Fynd går att göra – men kräver koll Det finns dock undantag. Två av tio produkter är billigare på taxfree än på nätet. Exempelvis visade undersökningen att en foundation kostade 61 procent mindre på flygplatsen än online. – Det är väldigt svårt att veta när du står där om du inte har checkat av priserna lite innan eller gör det precis där och då. Du behöver göra din egen lilla research, kanske på plats, ta upp mobilen och jämför med olika butiker, säger Ahmadi.  Samma mönster på andra flygplatser Prisjakt har gjort motsvarande undersökningar i Norge och Finland, där samma tendenser syns. Majoriteten av produkterna är dyrare i taxfreebutiker även där. – Man ska ha med sig prismedvetenheten hela tiden, säger Ahmadi. Prisskillnaderna förklaras av att taxfreebutikerna har ett eget prissystem och inte påverkas av den prispress som finns mellan nätbutiker. Onlinebutiker kan ofta sänka priserna tack vare lägre omkostnader och hård konkurrens.", "link": "https://www.tv4.se/artikel/QiIfegMyHIORmUakhsAVj/taxfree-oftast-dyrare-aen-online-koep", "date_display": "2026-06-22", "date_iso": "2026-06-22T05:32:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/taxfree", "/svensk-ekonomi", "/ekonomi"]}, {"id": 153, "title": "More and more pets are bitten by snakes - lack of antidote", "summary": "In May, Evidensia received an increase of roughly 63 percent in the number of dogs and cats bitten by snakes compared to the same period last year. A common factor that seems to affect it is the weather. May this year was locally much warmer and sunnier than last year. The heat and sun then means that the pets and their owners are more active outside - and may encounter more snakes. Antidote can be vital According to chief veterinarian Marlene Areskog, the snakes appear to have been more venomous early this spring, as the relative number of cases that required intensive care and the antidote snake serum rose significantly already in April. She emphasizes that the availability of antidote, which in many cases is vital for the animals, is limited for the month of June due to the unexpected demand earlier in the spring. We have it in stock at our clinics and have made a geographical distribution to ensure that you can get access to specialist care and serum at the big hospitals, says Areskog. However, it will not be available in unlimited quantities, she says. Should the trend continue, it may be that you need to be referred to another clinic that has snake serum at home. \"Go straight to the vet\" Pets are usually bitten on the paw or the nose. A bite from a viper can be life-threatening, the degree of severity varies and depends on several factors, not just where the bite is. My experience is that the dogs that get bitten on the paws and legs more often risk getting really bad, but even those that get bitten on the nose can get really bad. If the accident has occurred, Areskog emphasizes that it is important to keep the animal still, carry it home and see a veterinarian immediately. And as a precaution, of course, try to keep the dog under supervision, leashed in the forest and on the ground, watch what it does. Although cats generally cope better, the bites can be life-threatening even for them. According to new statistics from Agria djurförsäkring, the cats are exposed to a greater extent. During the entire year 2025, there were 539 cases of viper bites in cats and 278 in dogs, of which", "title_original": "Allt fler husdjur ormbitna – brist på motgift", "summary_original": "I maj fick Evidensia in en ökning på drygt 63 procent av antalet ormbitna hundar och katter i jämförelse med samma period förra året. En vanlig faktor som tycks påverka är vädret. Maj var i år lokalt mycket varmare och soligare än förra året. Värmen och solen gör då att husdjuren och dess ägare är mer aktiva ute – och kan stöta på fler ormar. Motgift kan vara livsavgörande Enligt chefsveterinär Marlene Areskog verkar ormarna ha varit giftigare tidigt denna vår, eftersom det relativa antalet fall som krävde intensivvård och motgiftet ormserum steg rejält redan i april. Hon betonar att tillgången till motgift, som i många fall är livsavgörande för djuren, är begränsad för juni månad på grund av den oväntade åtgången tidigare under våren. Vi har det i lager på våra kliniker och har gjort en geografisk fördelning för att trygga upp att man kan få tillgång till specialistvård och serum på de stora sjukhusen, säger Areskog. Det kommer dock inte finnas i obegränsad mängd, säger hon. Skulle trenden fortsätta kan det vara så att man behöver remitteras till en annan klinik som har ormserum hemma. ”Åk direkt till veterinär” Husdjuren blir oftast bitna i tassen eller i nosen. Ett bett från en huggorm kan innebära livsfara, allvarlighetsgraden varierar och beror på flera faktorer, inte bara var bettet sitter. Min erfarenhet är att de hundar som blir bitna i tassar och ben oftare riskerar att bli riktigt dåliga, men även de som blir bitna i nosen kan bli rejält dåliga. Om olyckan varit framme betonar Areskog att det är viktigt att hålla djuret stilla, bära hem det och direkt uppsöka veterinär. Och som förebyggande självklart försöka hålla hunden under uppsikt, kopplad i skogen och vid marken, titta vad den gör. Trots att katter generellt klarar sig bättre kan betten vara livshotande även för dem. Enligt ny statistik från Agria djurförsäkring utsätts katterna i större utsträckning. Under helåret 2025 handlade det om 539 fall av huggormsbett hos katter och 278 hos hundar, av dem som använt sin försäkring för att få vård. ”När katter blir bitna av en huggorm är det oftast i framtassarna, vilket är särskilt riskfyllt eftersom giftet snabbt kan spridas i kroppen när katten rör sig eller stödjer på benet”, säger Lotta Möller Koivisto, chefsveterinär på Agria, i ett pressmeddelande.", "link": "https://www.tv4.se/artikel/tt-260622-ormbett1-6a6f2989/fler-husdjur-ormbitna-begransat-med-motgift", "date_display": "2026-06-22", "date_iso": "2026-06-22T05:29:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Djur", "/djur", "/sverige", "/inrikes"]}, {"id": 154, "title": "Conversation about generations in the church: \"We young people need the elderly\"", "summary": "Relationships are more important activities for many young people in the church. It was established at the Torp conference.", "title_original": "Samtal om generationer i kyrkan: ”Vi unga behöver de äldre”", "summary_original": "Relationer viktigare är aktiviteter för många ungdomar i kyrkan. Det konstaterades på Torpkonferensen.", "link": "https://www.dagen.se/nyheter/samtal-om-generationer-i-kyrkan-vi-unga-behoever-de-aeldre/10404720", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Simona Mohamsson on faith, the Bible's place in school and why jealousy does not belong in politics", "summary": "The day asks the big questions to the Liberals' Simona Mohamsson.", "title_original": "Simona Mohamsson om tro, Bibelns plats i skolan och varför avundsjuka inte hör hemma i politiken", "summary_original": "Dagen ställer de stora frågorna till Liberalernas Simona Mohamsson.", "link": "https://www.dagen.se/nyheter/simona-mohamsson-om-tro-bibelns-plats-i-skolan-och-varfoer-avundsjuka-inte-hoer-hemma-i-politiken/10398106", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "KD cannot both protect Christian ethics and make aid conditional", "summary": "Protecting religious communities also means protecting the values ​​they stand for: openness, grace and generosity, writes Daniel Berner in a reply.", "title_original": "KD kan inte både värna kristen etik och villkora bistånd", "summary_original": "Att värna trossamfunden innebär också att värna de värden de står för: öppenhet, nåd och generositet, skriver Daniel Berner i en replik.", "link": "https://www.dagen.se/debatt/kd-kan-inte-bade-vaerna-kristen-etik-och-villkora-bistand/10399205", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "A romance that is hard to put down", "summary": "Lydia Nordlander has read \"Aldunia\" by Eva Skog", "title_original": "En romantasy som är svår att lägga ifrån sig", "summary_original": "Lydia Nordlander har läst ”Aldunia” av Eva Skog", "link": "https://www.dagen.se/kultur/en-romantasy-som-aer-svar-att-laegga-ifran-sig/10396886", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "EFS church in Växjö sold to Romanian Orthodox congregation - will not become a mosque", "summary": "State contribution from Romania makes the million deal possible.", "title_original": "EFS-kyrka i Växjö såld till rumänsk-ortodox församling – blir inte moské", "summary_original": "Statligt bidrag från Rumänien möjliggör miljonaffären.", "link": "https://www.dagen.se/nyheter/efs-kyrka-i-vaexjoe-sald-till-rumaensk-ortodox-foersamling-blir-inte-moske/10401138", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Why ban well-functioning schools, Mohamsson?", "summary": "Esther Flores Sedman: Difficult to understand the Liberals' line against denominational schools", "title_original": "Varför förbjuda välfungerande skolor, Mohamsson?", "summary_original": "Esther Flores Sedman: Svårt att förstå Liberalernas linje mot konfessionella skolor", "link": "https://www.dagen.se/ledare/varfoer-foerbjuda-vaelfungerande-skolor-mohamsson/10318793", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Simona Mohamsson (L): It's wonderful to have school graduations in the church", "summary": "The Liberal party leader says yes and amen to school graduations in church, preferably with the priest in place as it was when she went to school.", "title_original": "Simona Mohamsson (L): Det är härligt med skol­avslutningar i kyrkan", "summary_original": "Liberalernas partiledare säger ja och amen till skolavslutningar i kyrkan, gärna med prästen på plats så som det var när hon gick i skolan.", "link": "https://www.dagen.se/nyheter/simona-mohamsson-l-det-aer-haerligt-med-skolavslutningar-i-kyrkan/10357030", "date_display": "2026-06-22", "date_iso": "2026-06-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Trump's favorite heads for election victory after shocker", "summary": "The election has been very smooth. When 99.9 percent of the votes were counted, de la Espriella had voter support of 49.7 percent - which, according to the AFP news agency, is unassailable for the leftist candidate Ivan Cepeda, who stands at 48.7 percent. Cepeda says he recognizes the preliminary vote count but wants to wait for a review of the election results, which could take several days. His campaign organization wants the results from around 33,000 ballot boxes to be examined. The National Electoral Council of the country has not yet officially announced a winner.", "title_original": "Trumps favorit går mot valseger efter rysare", "summary_original": "Valet har varit rysarjämnt. När 99,9 procent av rösterna räknats hade de la Espriella ett väljarstöd på 49,7 procent – vilket enligt nyhetsbyrån AFP är ointagligt för vänsterkandidaten Ivan Cepeda, som står på 48,7 procent. Cepeda säger att han erkänner den preliminära rösträkningen men att han vill avvakta en granskning av valresultatet, vilket kan dröja flera dagar. Hans kampanjorganisation vill att resultatet från cirka 33 000 valurnor undersöks. Det nationella valrådet i landet har ännu inte officiellt tillkännagett någon vinnare.", "link": "https://www.tv4.se/artikel/tt-260622-colombiapresidentval1-9b2b0e91/trumpfavorit-gar-mot-valseger-i-colombia", "date_display": "2026-06-22", "date_iso": "2026-06-22T01:24:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Colombia", "/colombia", "/utrikes"]}, {"id": 162, "title": "US and Iran agree on \"road map\"", "summary": "First round of negotiations concluded after night mangling", "title_original": "USA och Iran överens om ”färdplan”", "summary_original": "Första rundan av förhandlingar avslutade efter nattmangling", "link": "https://www.tv4.se/artikel/tt-260622-iranforhandling1-ec389684/forhandlingarna-mellan-usa-och-iran-avslutade", "date_display": "2026-06-22", "date_iso": "2026-06-22T00:51:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Irankriget", "/irankriget"]}, {"id": 163, "title": "The analyst on Ukraine's new strategy: \"Cut off Crimea\"", "summary": "Ukraine's drone attacks against Russian infrastructure are now having concrete consequences for civilians. On the Russian-occupied Crimean peninsula, all sales of fuel to private individuals are stopped.  The decision came into force on Sunday morning, according to Russian-appointed governor Sergei Aksyonov. - Fuel will only be distributed to state-owned enterprises that maintain vital functions and security, he said in a statement, according to the Kyiv Independent. New wave of attacks The stop comes after new Ukrainian drone attacks against oil facilities and other energy infrastructure on the peninsula. In recent weeks, Ukraine has intensified a campaign aimed at cutting off Russian supply lines – not least to Crimea, which is strategically crucial for Russia. Ukrainian Defense Minister Mykhailo Fedorov has previously said that the country aims to turn the peninsula \"into an island\", according to the Kyiv Independent. 150 attacks – in a few weeks At the same time, analyzes show that the attacks have become both more numerous and more extensive. Around 150 attacks against Russian tankers, transports and trains have been documented since the beginning of May, reports CNN. The drones, developed in Ukraine, have a range of up to 30 miles and are used to strike targets far behind the front line. The consequences are clear: roads are closed, transport is stopped and now there is an acute shortage of fuel in Crimea. According to CNN, some transport routes have become so dangerous that they are no longer used by the Russian military. Videos show burnt-out trucks along key roads in southern Ukraine. - The Ukrainians have acquired the necessary means to launch a large-scale drone campaign with the aim of cutting off Crimea from its main supply routes and complicating Russia's logistical situation along the entire front line, analyst Clément Molin told CNN. \"Very effective\" In May, Defense Minister Mykhailo Fedorov called the attacks a \"logistical blockade\". - The enemy will no longer feel safe, even at a considerable distance from the line, he said. Clé", "title_original": "Analytikern om Ukrainas nya strategi: ”Skära av Krim”", "summary_original": "Ukrainas drönarattacker mot rysk infrastruktur får nu konkreta följder för civila. På den ryskockuperade Krimhalvön stoppas all försäljning av bränsle till privatpersoner.  Beslutet trädde i kraft på söndagsmorgonen, enligt den rysktillsatte guvernören Sergej Aksjonov. – Bränsle kommer endast att delas ut till statliga verksamheter som upprätthåller livsviktiga funktioner och säkerhet, säger han i ett uttalande, enligt Kyiv Independent. Ny våg av attacker Stoppet kommer efter nya ukrainska drönarattacker mot oljeanläggningar och annan energiinfrastruktur på halvön. De senaste veckorna har Ukraina intensifierat en kampanj som syftar till att slå ut ryska försörjningslinjer – inte minst till Krim, som är strategiskt avgörande för Ryssland. Ukrainas försvarsminister Mykhailo Fedorov har tidigare sagt att landet har som mål att förvandla halvön ”till en ö”, enligt Kyiv Independent. 150 attacker – på några veckor Samtidigt visar analyser att attackerna blivit både fler och mer omfattande. Omkring 150 attacker mot ryska tankbilar, transporter och tåg har dokumenterats sedan början av maj, rapporterar CNN. Drönarna, som är utvecklade i Ukraina, har en räckvidd på upp till 30 mil och används för att slå mot mål långt bakom frontlinjen. Konsekvenserna blir tydliga: vägar stängs, transporter stoppas och nu alltså akut bränslebrist på Krim. Enligt CNN har vissa transportleder blivit så farliga att de inte längre används av rysk militär. Videor visar utbrända lastbilar längs viktiga vägar i södra Ukraina. – Ukrainarna har skaffat sig de medel som krävs för att inleda en storskalig drönarkampanj i syfte att skära av Krim från dess viktigaste försörjningsvägar och försvåra Rysslands logistiska situation längs hela frontlinjen, säger analytikern Clément Molin till CNN. ”Mycket effektiva” I maj kallade försvarsministern Mykhailo Fedorov attackerna för en ”logistisk avspärrning”. – Fienden kommer inte längre att känna sig trygg, inte ens på betydande avstånd från linjen, sa han. Clément Molin menar att strategin verkar fungera. Enligt honom har Ukraina i praktiken flyttat fram vad som räknas som en säker zon långt bakom frontlinjen. Genom att kartlägga hundratals attacker ser han hur drönarslagen nu når upp till 30 mil in på ryskkontrollerat område. – Rörliga vapen som flyger över viktiga transportvägar och riktar in sig på rysk logistik, framför allt militär utrustning och tankbilar, har också visat sig vara mycket effektiva, säger han.", "link": "https://www.tv4.se/artikel/QxBroIguuYefChrvbwkjw/analytikern-om-ukrainas-nya-strategi-skaera-av-krim", "date_display": "2026-06-21", "date_iso": "2026-06-21T20:07:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/ukraina", "/putin", "/vladimir-putin", "/zelenskyj", "/dronare", "/krimhalvon", "/ryssland"]}, {"id": 164, "title": "Double emotions when Iran plays in the World Cup: \"We have bigger problems\"", "summary": "Refuses to buy the jersey • Points out the sport as a political tool", "title_original": "Dubbla känslor när Iran spelar i VM: ”Vi har större problem”", "summary_original": "Vägrar köpa tröjan • Pekar ut sporten som politiskt verktyg", "link": "https://www.tv4.se/artikel/owvp3Ntvr3MW7jGtF2jd7/dubbla-kaenslor-naer-iran-spelar-i-vm-vi-har-stoerre-problem", "date_display": "2026-06-21", "date_iso": "2026-06-21T18:32:16+00:00", "source": "TV4 Nyheterna", "mini ole as a Christian afterwards\"", "summary": "Now turning 70 - and grateful to be healthy after an autumn of health problems", "title_original": "Dan Svanell konfirmerade sig som 68-åring: ”Jag kände mig mer hel som kristen efteråt”", "summary_original": "Fyller nu 70 år – och är tacksam för att vara frisk efter en höst av hälsoproblem", "link": "https://www.dagen.se/familj/dan-svanell-konfirmerade-sig-som-68-aring-jag-kaende-mig-mer-hel-som-kristen-efterat/10397900", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 181, "title": "My husband has become radicalized in his views - what should I do?", "summary": "\"When he makes his posts, it often spills over to me,\" writes the wife in a letter to Christina Halldorf.", "title_original": "Min man har radikaliserats i sina åsikter – vad ska jag göra?", "summary_original": "”När han gör sina inlägg spiller det ofta över på mig”, skriver hustrun i ett brev till Christina Halldorf.", "link": "https://www.dagen.se/relationer/min-man-har-radikaliserats-i-sina-asikter-vad-ska-jag-goera/10393167", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 182, "title": "A Swedish Strategy for Biodiversity and Ecosystem Services", "summary": "The report \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "title_original": "A Swedish Strategy for Biodiversity and Ecosystem Services", "summary_original": "The report \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "link": "https://www.government.se/reports/2026/06/a-swedish-strategy-for-biodiversity-and-ecosystem-services/", "date_display": "2026-06-18", "date_iso": "2026-06-18T11:07:11+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "4 days old", "tags": ["Report", "International", "Ministry of Climate and Enterprise", "Environment and climate", "Sweden in the UN"]}, {"id": 183, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "Inflation in Sweden is low and the economic situation is somewhat weaker than normal. At the same time, the supply disruptions linked to the war in the Middle East have led to increased inflationary pressure and the risks of inflation becoming too high have increased. The management assesses that it is well balanced to now leave the key interest rate unchanged at 1.75 percent, but the probability that the interest rate will be raised later this year has increased compared to the assessment in March.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Inflationen i Sverige är låg och konjunkturläget är något svagare än normalt. Samtidigt har utbudsstörningarna kopplade till kriget i Mellanöstern lett till att inflationstrycket stigit och riskerna för att inflationen ska bli för hög har ökat. Direktionen bedömer att det är välavvägt att nu lämna styrräntan oförändrad på 1,75 procent, men sannolikheten för att räntan höjs senare i år har ökat jämfört med bedömningen i mars.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent4/", "date_display": "2026-06-17", "date_iso": "2026-06-17T07:31:08+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "6 days old", "tags": []}, {"id": 184, "title": "Government receives new state aid application for nuclear power", "summary": "A new application for state aid to build nuclear power reactors has been submitted to the Government. The application was submitted by Studsvik, which is seeking to establish reactors in the municipalities of Nyköping and Valdermarsvik. This is the third application for state aid received by the Government.", "title_original": "Government receives new state aid application for nuclear power", "summary_original": "A new application for state aid to build nuclear power reactors has been submitted to the Government. The application was submitted by Studsvik, which is seeking to establish reactors in the municipalities of Nyköping and Valdermarsvik. This is the third application for state aid received by the Government.", "link": "https://www.government.se/press-releases/2026/06/government-receives-new-state-aid-application-for-nuclear-power/", "date_display": "2026-06-17", "date_iso": "2026-06-17T07:28:57+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "6 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 185, "title": "US–Sweden Cancer Summit focuses on closer cooperation", "summary": "On 9 June, leading researchers, decision-makers, healthcare actors and patient organisations from Sweden and the US gathered in Stockholm for the US–Sweden Cancer Summit 2026: Metastasis – from mechanism to cure.", "title_original": "US–Sweden Cancer Summit focuses on closer cooperation", "summary_original": "On 9 June, leading researchers, decision-makers, healthcare actors and patient organisations from Sweden and the US gathered in Stockholm for the US–Sweden Cancer Summit 2026: Metastasis – from mechanism to cure.", "link": "https://www.government.se/articles/2026/06/ussweden-cancer-summit-focuses-on will go to local elections observation and greater integrity of elections and resilience against disinformation in Armenia and Moldova.", "title_original": "Sweden bolsters initiatives in support of free and fair elections and democracy in Eastern Europe", "summary_original": "The Government has presented a support package focused on democracy and free and fair elections in Eastern Europe for 2026 and 2027. The democracy support totals SEK 13.35 million and will go to local elections observation and greater integrity of elections and resilience against disinformation in Armenia and Moldova.", "link": "https://www.government.se/press-releases/2026/06/sweden-bolsters-initiatives-in-support-of-free-and-fair-elections-and-democracy-in-eastern-europe/", "date_display": "2026-06-09", "date_iso": "2026-06-09T12:26:45+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Democracy and human rights", "Benjamin Dousa"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
