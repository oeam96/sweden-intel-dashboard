play": "2026-05-31", "date_iso": "2026-05-31T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Alpha in collaboration with Ny generation – starts discussion groups in schools", "summary": "Emma Bergkvist, national leader of Alpha Youth: There is a longing among young Christians to share their Christian faith.", "title_original": "Alpha i samarbete med Ny generation – startar samtalsgrupper på skolor", "summary_original": "Emma Bergkvist, nationell ledare för Alpha Youth: Det finns en längtan bland unga kristna att få dela sin kristna tro.", "link": "https://www.dagen.se/nyheter/alpha-i-samarbete-med-ny-generation-startar-samtalsgrupper-pa-skolor/10370345", "date_display": "2026-05-31", "date_iso": "2026-05-31T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "\"I fell more in love with his brain than with anything else\"", "summary": "Spouses Jonathan and Madeleine Lindvall about the differences that have become a strength for the marriage and for the joint company", "title_original": "”Jag blev mer kär i hans hjärna än i något annat”", "summary_original": "Makarna Jonathan och Madeleine Lindvall om olikheterna som blivit en styrka för äktenskapet och för det gemensamma företaget", "link": "https://www.dagen.se/livsstil/jag-blev-mer-kaer-i-hans-hjaerna-aen-i-nagot-annat/10297299", "date_display": "2026-05-31", "date_iso": "2026-05-31T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Student needed to hear The flower time - can get 2,500 euros for discrimination", "summary": "Controversial decision in the Finnish Discrimination and Equality Board.", "title_original": "Elev behövde höra Den blomstertid – kan få 2 500 euro för diskriminering", "summary_original": "Omdiskuterat beslut i finska Diskriminerings- och jämställdhets­nämnden.", "link": "https://www.dagen.se/nyheter/elev-behoevde-hoera-den-blomstertid-kan-fa-2-500-euro-foer-diskriminering/10367971", "date_display": "2026-05-31", "date_iso": "2026-05-31T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Several men kept addicts locked up - for two days", "summary": "According to the verdict, the man, who had addiction problems and debts linked to drugs, traveled from Värmland to Stockholm in September 2025 after receiving promises that his situation would be resolved.  Instead, he was taken to an apartment south of Stockholm where three men held him against his will for two days.  \"They will hurt me, if they don't get money soon, then they will send pictures of me being smashed until they get it,\" the man is said to have written to a relative.  The man's plea: Save my life During captivity, the man is said to have been subjected to repeated violence to his face, head, neck and neck. He was also watched over by the men who took turns watching over him.  At the same time, he allegedly contacted several relatives and asked for money to be able to pay off a debt. He stated that he was in an emergency situation and two relatives then brought over SEK 45,600 - which he then allegedly passed on to the relatives of one of the perpetrators.  \"It will not go to any preparations, I promise and I swear. They will go to saving my life, please, I beg you,\" the man is said to have written to a relative.  After two days in the apartment, the man managed to get out on his own, according to the investigation.  The verdict: Imprisonment and deportation It was when a relative of the man raised the alarm that the police began tapping the man's phone. The investigation was able to show that the man's phone calls, bank transactions and DNA traces agreed with the prosecutor's description of the course of events. The district court considers the crime to be very serious and now three men in their 20s and 30s are being sentenced for kidnapping and extortion. The punishment is five years in prison for all. Two of the men, who are citizens of Bolivia, are to be deported from Sweden and prohibited from returning for a ten-year period.  Another woman and a man in their 30s are convicted of money laundering and fined 40 days each, for lending their bank accounts to one of the convicted men.", "title_original": "Flera män höll missbrukare instängd – i två dygn", "summary_original": "Enligt domen reste mannen, som hade missbruksproblem och skulder kopplade till narkotika, från Värmland till Stockholm i september 2025 efter att ha fått löften om att hans situation skulle lösas.  I stället fördes han till en lägenhet söder om Stockholm där tre män höll kvar honom mot hans vilja under två dygn.  ”De kommer att skada mig, får de inte pengar snart så, så skickar de bilder på att jag blir sönderslagen tills de får”, ska mannen ha skrivit till en anhörig.  Mannens vädjan: Rädda mitt liv Under fångenskapen ska mannen ha utsatts för upprepat våld mot ansikte, huvud, hals och nacke. Han övervakades också av männen som turades om att hålla uppsikt över honom.  Han ska samtidigt ha kontaktat flera anhöriga och bett om pengar för att kunna betala av en skuld. Han uppgav att han befann sig i en akut situation och två anhöriga förde då över 45 600 kronor – som han därefter ska ha fört vidare till anhöriga till en av gärningsmännen.  ”Det ska inte gå till några preparat, det lovar jag och svär jag. De kommer att gå till att rädda mitt liv, snälla jag ber dig”, ska mannen ha skrivit till en anhörig.  Efter två dygn i lägenheten lyckades mannen ta sig ut på egen hand, enligt utredningen.  Domen: Fängelse och utvisning Det var när en släkting till mannen slog larm som polisen började avlyssna mannens telefon. Utredningen kunde visa att mannens telefonsamtal, banktransaktioner och DNA-spår stämde överens med åklagarens beskrivning av händelseförloppet. Tingsrätten bedömer brottsligheten som mycket allvarlig och nu döms tre män i 20- till 30-årsåldern för människorov och utpressning. Straffet blir fem års fängelse för samtliga. Två av männen, som är medborgare i Bolivia, ska utvisas från Sverige och förbjuds återvända under en tioårsperiod.  Ytterligare en kvinna och en man i 30-årsåldern döms för penningtvättbrott och 40 dagsböter vardera, för att ha lånat ut sina bankkonton till en av de dömda männen.", "link": "https://www.tv4.se/artikel/g5t0ZIEaQqheHf5rLnQBB/flera-maen-hoell-missbrukare-instaengd-i-tva-dygn", "date_display": "2026-05-30", "date_iso": "2026-05-30T20:34:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott", "/stockholm", "/narkotika"]}, {"id": 159, "title": "Customs: Dog smuggling to Sweden has basically stopped", "summary": "During the corona pandemic, the demand for puppies skyrocketed, which led to a sharp increase in dog smuggling to Sweden. The climax was reached in 2022, when the Customs Service stopped a record number of smuggled dogs.  Now the trend has turned. According to the Swedish Customs Service, organized dog smuggling has decreased sharply and is now basically gone. Stefan Granath, deputy head of department at the Swedish Customs Service, welcomes the announcement.  - Our officials are used to seeing very strange and troublesome things, but most say that this with puppies is the worst thing you can experience, he says.  The problems that remain In 2020, 280 dogs were stopped by customs. The following year, the figure had risen to 523, and in 2022 the record level was reached with 552 smuggled dogs. Stefan Granath remembers certain cases that made an especially strong impression.  - They brought in ten to 15 dogs at a time and just put them in the back seat of a car, under the driver's seat or in suitcases. Very macabre way where they didn't care in the slightest about the animal, but it was only about money, he says.  - It was not fun to have to euthanize 15 little puppies that had obviously been hurt, together with district veterinarians.  Last year, the figure was back at 280 – and now the large-scale trade is said to have ceased. Stefan Granath, on the other hand, believes that many people still make mistakes when they import dogs to Sweden.  More dogs are born in Sweden At the same time, a new survey from the Swedish Kennel Club shows that 91 percent of all dogs in Sweden are born here. In the corresponding survey from 2024, the figure was 87 percent. According to the Swedish Kennel Club, there are several explanations for this. - In part, demand has decreased after the pandemic - that is a big reason. But I also think that the fact that we started talking about the illegality of this handling and that it was raised more has had an impact, says press officer Janina Pfalzer. - Then there will also be legislation. Some have probably picked up on the fact that soon it may be the case that the vet can report me if I h", "title_original": "Tullen: Hundsmugglingen till Sverige har i princip upphört", "summary_original": "Under coronapandemin sköt efterfrågan på hundvalpar i höjden, vilket ledde till en kraftig ökning av hundsmugglingen till Sverige. Kulmen nåddes 2022, då Tullverket stoppade rekordmånga smuggelhundar.  Nu har utvecklingen vänt. Enligt Tullverket har den organiserade hundsmugglingen minskat kraftigt och är i dag i princip borta. Stefan Granath, biträdande avdelningschef på Tullverket, välkomnar beskedet.  – Våra tjänstemän är vana att se mycket konstiga och jobbiga saker, men de flesta säger att det här med hundvalpar är det värsta man får uppleva, säger han.  Problemen som finns kvar  År 2020 stoppades 280 hundar av tullen. Året därpå hade siffran stigit till 523, och 2022 nåddes rekordnivån med 552 smuggelhundar. Stefan Granath minns vissa fall som gjorde extra starkt intryck.  – Man tog in tio till 15 hundar åt gången och bara stoppade in dem i baksätet på en bil, under förarsätet eller i resväskor. Väldigt makabra sätt där man inte brydde sig det minsta om djuret, utan det var bara pengar det handlade om, säger han.  – Det var inte roligt att tillsammans med distriktsveterinärer behöva avliva 15 små små hundvalpar som uppenbarligen hade farit illa.  Förra året var siffran tillbaka på 280 – och nu uppges den storskaliga handeln ha upphört. Stefan Granath menar däremot att många fortfarande gör fel när de importerar hundar till Sverige.  Fler hundar föds i Sverige  Samtidigt visar en ny undersökning från Svenska Kennelklubben att 91 procent av alla hundar i Sverige är födda här. I motsvarande undersökning från 2024 var siffran 87 procent. Enligt Svenska Kennelklubben finns flera förklaringar till detta. – Dels har efterfrågan gått ner efter pandemin – det är en stor anledning. Men jag tror också att det faktum att vi började prata om det olagliga i den här hanteringen och att det lyftes mer har påverkat, säger pressansvarig Janina Pfalzer. – Sen kommer ju också lagstiftning. Några har nog snappat upp att snart kan det vara så att veterinären kan anmäla mig om jag har köpt min hund utomlands. Faror med smuggelhundar Antalet avlivade smuggelhundar har också minskat kraftigt. Förra året avlivades tre hundar som stoppades av Tullverket. Under både 2020 och 2021 var motsvarande siffra 86. Veterinären Marie Jury varnar samtidigt för farorna med smuggelhundar. – Dels far valparna illa på vägen hit. Sen kan de bära på sjukdomar som inte finns i Sverige och som kan ha dödlig utgång. Det är inte alls bra, varken för djuren eller för oss människor, säger hon.", "link": "https://www.tv4.se/artikel/qCUKSWxu6P0MVwdZLTi70/tullen-hundsmugglingen-till-sverige-har-i-princip-upphoert", "date_display": "2026-05-30", "date_iso": "2026-05-30T17:59:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/tullen", a juni. Du kan också utöka dina vinstchanser genom att köpa ytterligare en lott på en annan adress. Det spelar ingen roll om du äger boendet eller inte. Huvudsaken är att det är ett hus med en egen adress.  Köp en postkodlott och tävla om 100 000 kr i månaden i ett år En miljon svenskar är med i Postkodlotteriet – av tre enkla skäl:\n - Chans att vinna pengar, bilar eller produkter. \n - Vinn med dina grannar: Delad glädje är dubbel glädje.  \n - Bidra till en bättre värld: Över en miljard till välgörenhet varje år.  Åldersgräns 18 år. Stödlinjen.se Köp en postkodlott och tävla om 100 000 kr i månaden i ett år", "link": "https://www.tv4.se/artikel/4fqn8PCyB54htfa0MycjVy/chans-att-vinna-100-000-kr-i-manaden-i-ett-helt-ar", "date_display": "2026-05-30", "date_iso": "2026-05-30T08:12:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Annons", "/annons", "/postkodlotteriet", "/inrikes"]}, {"id": 162, "title": "Liselotte J Andersson:\nTime for everyday life in the church year", "summary": "But there is hardly any lack of mystery, notes Liselotte J Andersson", "title_original": "Liselotte J Andersson:\nDags för vardag i kyrkoåret", "summary_original": "Men det saknas knappast mystik, konstaterar Liselotte J Andersson", "link": "https://www.dagen.se/livsstil/liselotte-j-andersson-dags-foer-vardag-i-kyrkoaret/10365671", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 163, "title": "Many who leave the Free Church go quietly", "summary": "I sometimes wonder if you are just as good at seeing people who don't crash, protest or lose faith - but who just slowly slip out of the community, writes Stefan Kinert.", "title_original": "Många som lämnar frikyrkan går tyst", "summary_original": "Jag undrar ibland om man är lika bra på att se människor som inte kraschar, protesterar eller tappar isplay": "2026-05-29", "date_iso": "2026-05-29T16:19:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 170, "title": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "title_original": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary_original": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "link": "https://www.government.se/press-releases/2026/05/minister-for-rural-affairs-to-host-ministerial-conference-on-future-of-forests/", "date_display": "2026-05-29", "date_iso": "2026-05-29T14:01:19+00:00", "source": "Government.se", "ministry": "Ministry of Rural Affairs and Infrastructure", "type": "Official Information", "age_tag": "2 days old", "tags": ["Press release", "EU", "International", "Rural affairs, agriculture and food production", "Ministry of Rural Affairs and Infrastructure", "Peter Kullgren"]}, {"id": 171, "title": "The war in the Middle East entails risks for financial stability", "summary": "The war in the Middle East has created turbulence in the financial markets, but the global financial system has functioned well. However, the uncertainty is great. The longer the war continues, the greater the risk that inflation and interest rates will increase at the same time as the economy deteriorates, which could negatively affect several financial markets and actors. There are also several global vulnerabilities that could reinforce each other and exacerbate such a negative development. Sweden has a good starting position, but there are structural risks in the banking system, for example linked to the banks' international dependencies and significant exposures to the commercial real estate sector.", "title_original": "Kriget i Mellanöstern medför risker för den finansiella stabiliteten", "summary_original": "Kriget i Mellanöstern har skapat turbulens på de finansiella marknaderna, men det globala finansiella systemet har fungerat väl. Osäkerheten är dock stor. Ju längre kriget fortgår desto större är risken att inflationen och räntorna ökar samtidigt som konjunkturen försämras, vilket kan påverka flera finansiella marknader och aktörer negativt. Det finns dessutom flera globala sårbarheter som skulle kunna förstärka varandra och förvärra en sådan negativ utveckling. Sverige har ett bra utgångsläge, men det finns strukturella risker i banksystemet exempelvis kopplade till bankernas internationella beroenden och betydande exponeringar mot den kommersiella fastighetssektorn.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/kriget-i-mellanostern-medfor-risker-for-den-finansiella-stabiliteten/", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:30:22+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "3 days old", "tags": []}, {"id": 172, "title": "Ministerial visit to Ukraine focused on health care and situation for women", "summary": "On 11–13 May, Minister for Health Care Elisabet Lann and Minister for Gender Equality Nina Larsson visited Kyiv and Lviv. The aim of their visit was to gain insight into Ukraine’s health and medical care and the situation for women during Russia’s full-scale invasion.", "title_original": "Ministerial visit to Ukraine focused on health care and situation for women", "summary_original": "On 1 nk": "https://www.dagen.se/nyheter/efk-foersamling-antog-styrande-dokument-efter-hbtq-relaterad-kris/10364453", "date_display": "2026-05-29", "date_iso": "2026-05-29T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 181, "title": "Ukraine to procure Swedish fighter jets", "summary": "Ukraine’s highest priority is air defence. To strengthen Ukrainian air defence, Sweden and Ukraine launch a major defence deal, in which Ukraine acquires Swedish Gripen fighter jets.", "title_original": "Ukraine to procure Swedish fighter jets", "summary_original": "Ukraine’s highest priority is air defence. To strengthen Ukrainian air defence, Sweden and Ukraine launch a major defence deal, in which Ukraine acquires Swedish Gripen fighter jets.", "link": "https://www.government.se/press-releases/2026/05/ukraine-to-procure-swedish-fighter-jets/", "date_display": "2026-05-28", "date_iso": "2026-05-28T11:01:16+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "International", "Prime Minister's Office", "Foreign and security policy", "Ulf Kristersson", "Military defence"]}, {"id": 182, "title": "Sweden and India deepen climate cooperation", "summary": "At the summit held between Prime Minister Ulf Kristersson and India’s Prime Minister Narendra Modi on 17 May, the countries announced deeper cooperation aimed at reducing industrial emissions. Sweden and India are to develop a new work programme for the Leadership Group for Industry Transition (LeadIT) initiative for 2027–2030.", "title_original": "Sweden and India deepen climate cooperation", "summary_original": "At the summit held between Prime Minister Ulf Kristersson and India’s Prime Minister Narendra Modi on 17 May, the countries announced deeper cooperation aimed at reducing industrial emissions. Sweden and India are to develop a new work programme for the Leadership Group for Industry Transition (LeadIT) initiative for 2027–2030.", "link": "https://www.government.se/press-releases/2026/05/sweden-and-india-deepen-climate-cooperation/", "date_display": "2026-05-27", "date_iso": "2026-05-27T14:14:15+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "International", "Ministry of Climate and Enterprise", "Environment and climate", "Johan Britz"]}, {"id": 183, "title": "That's how expensive your snus can be on your trip this summer", "summary": "In a customs document from a long time ago, you can read that snus was brought across the Swedish border from Finland in 1637. And what happened after that is, as they say, history.  But traveling with snus outside of Sweden is not easy these days. In the EU there are common regulations, but recently a number of countries have stepped away from them or expanded their rules. SEK 15,000 in fines The biggest restrictions on snuff are found in Singapore and since April 1 in France.  Singapore has zero tolerance for snuff, both brown and white. It may not be sold, imported, bought or used. Wearing snuff during a body check can mean a fine of up to SEK 15,000.  For entry into the country, the fines can be even higher and, in the worst case, even lead to imprisonment for up to six months. There, snus is seen as a drug. In France, white snus is the hardest hit. Since April 1 this year, it is forbidden to consume, import and transport.  White snus is classified under the same regulations as, for example, narcotics, which means that the punishment can be anything from up to 375,000 euros in fines or five years in prison.\n\nThe white snus can be bought in many European countries including Malta and Iceland. In Iceland, on the other hand, since 1997 there has been a ban on bringing in and selling brown snus into the country.  Want to see prescription Australia is known for its tough customs controls and strict regulations. As for brown snus, there is a maximum limit of 25 grams. If you take more with you, it must be declared and paid to customs. White snus is classified as a prescription drug and requires a medical certificate for import.\n\nIf you really want to be on the safe side, you also check what the rules for snuffing on board the flight look like.", "title_original": "Så dyrt kan ditt snus bli på resan i sommar", "summary_original": "I ett tulldokument från en lång tid tillbaka kan man läsa att snuset fördes in över den svenska gränsen från Finland 1637. Och vad som hände därefter är som man säger, historia.  Men att resa med snus utanför Sverige är numera inte helt enkelt. I EU finns gemensamma förordningar men på senare tid har ett antal länder klivit från dem eller utökat sina regler. 15 000 kr i böter Störst inskränkningar på snusandet finner vi i Singapore och sedan 1 april i Frankrike.  Singapore har nolltolerans mot snus, både brunt och vitt. Det får varken säljas, importeras, köpas eller brukas. Att ha snus på sig vid en kroppskontroll kan innebära böter på upp till 15 000 kronor.  För införsel i landet kan böterna bli ännu högre och i värsta fall även leda till fängelse i upp till sex månader. Där ses snus som en drog I Frankrike är det det vita snuset man slagit ned på hårdast. Sedan 1 april i år är det förbjudet att konsumera, importera och transportera.  Man inordnar det vita snuset under samma regelverk som exempelvis narkotika vilket innebär att straffet kan vara allt från upp till 375 000 euro i böter eller fem års fängelse.\n\nDet vita snuset går att köpa i många europeiska länder inklusive Malta och Island. På Island har man däremot sedan 1997 förbud mot att föra in och sälja brunt snus i landet.  Vill se recept Australien är kända för sina hårda tullkontroller och strikta regler. Vad gäller brunt snus har man en maxgräns på 25 gram. Tar du med dig mer måste det deklareras och tullas. Vitt snus klassas som receptbelagt läkemedel och kräver läkarintyg för import.\n\nVill du verkligen vara på den säkra sidan kollar du även hur reglerna för snusande ombord på flyget ser ut.", "link": "https://www.tv4.se/artikel/1Cjul3sEZofuxMAnAlylir/snus-pa-resan-kan-bli-dyrt-haer-aer-reglerna", "date_display": "2026-05-27", "date_iso": "2026-05-27T12:33:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "5 days old", "tags": ["Snus", "/snus", "/semester", "/utrikes"]}, {"id": 184, "title": "Statement of the Ministers of Foreign Affairs of the Nordic- Baltic countries on Russia’s latest disinformation campaign", "summary": "The Ministers of Foreign Affairs of Nordic-Baltic countries firmly reject Russia’s blatant disinformation campaign and false claims, supported by Belarus, following the airspace violations in the Nordic-Baltic region. We strongly condemn Russia’s threats of the use of force directed at Latvia and other countries in the region.", "title_original": "Statement of the Ministers of Foreign Affairs of the Nordic- Baltic countries on Russia’s latest disinformation campaign", "summary_original": "The Ministers of Foreign Affairs of Nordic-Baltic countries firmly reject Russia’s blatant disinformation campaign and false claims, supported by Belarus, following the airspace violations in the Nordic-Baltic region. We strongly condemn Russia’s threats of the use of force directed at Latvia and other countries in the region.", "link": "https://www.government.se/statements/2026/05/statement-of-the-ministers-of-foreign-affairs-of-the-nordic--baltic-countries-on-russias-latest-disinformation-campaign/", "date_display": "2026-05-25", "date_iso": "2026-05-25T16:10:52+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 185, "title": "Maria Malmer Stenergard hosts meeting of NATO Ministers of Foreign Affairs", "summary": "On 21–22 May, Minister for Foreign Affairs Maria Malmer Stenergard will welcome Allies to a meeting of NATO Ministers of Foreign Affairs in Helsingborg.", "title_original": "Maria Malmer Stenergard hosts meeting of NATO Ministers of Foreign Affairs", "summary_original": "On 21–22 May, Minister for Foreign Affairs Maria Malmer Stenergard will welcome Allies to a meeting of NATO Ministers of Foreign Affairs in Helsingborg.", "link": "https://www.government.se/press-releases/2026/05/maria-malmer-stenergard-hosts-meeting-of-nato-ministers-of-foreign-affairs/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:49:27+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "NATO", "Maria Malmer Stenergard", "Meeting of NATO Ministers of Foreign Affairs"]}, {"id": 186, "title": "I'm the Foreign Minister of Sweden. Don't Overestimate Russia.", "summary": "Opinion piece by Minister for Foreign Affairs Maria Malmer Stenergard in The New York Times, 20 May 2026.", "title_original": "I'm the Foreign Minister of Sweden. Don't Overestimate Russia.", "summary_original": "Opinion piece by Minister for Foreign Affairs Maria Malmer Stenergard in The New York Times, 20 May 2026.", "link": "https://www.government.se/opinion-pieces/2026/05/im-the-foreign-minister-of-sweden.-dont-overestimate-russia", "date_display": "2026-05-20", "date_iso": "2026-05-20T10:07:35+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "12 days old", "tags": ["Opinion piece", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
