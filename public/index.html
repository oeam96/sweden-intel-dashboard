ige"]}, {"id": 53, "title": "Invest in Anthropic - 'like a minefield'", "summary": "The AI ​​giant Anthropic warns private individuals against investing in the company. Nevertheless, Swedish players have been attracted by the possibility of buying in. \"It's like walking across a minefield,\" says Accumeo CEO Oden Vallien.", "title_original": "Investera i Anthropic – ”som ett minfält”", "summary_original": "AI-jätten Anthropic varnar privatpersoner för investeringar i bolaget. Ändå har svenska aktörer lockat med möjligheten att köpa in sig. ”Det är som att gå över ett minfält”, säger Accumeos vd Oden Vallien.", "link": "https://www.svd.se/a/OkEWpq/anthropic-varnar-privatpersoner-for-investeringar-i-bolaget-som-ett-minfalt", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:38:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 54, "title": "The criticism: \"Trump's fund will rewrite history\"", "summary": "Donald Trump's supporters cheered when the Justice Department decided on an \"anti-politicization fund\" with close to $2 billion. Now the president's allies risk losing compensation from the fund - because Republican senators want it removed.", "title_original": "Kritiken: ”Trumps fond ska skriva om historien”", "summary_original": "Donald Trumps anhängare jublade när justitiedepartementet beslutade om en ”anti-politiseringsfond” med nära 2 miljarder dollar. Nu riskerar presidentens allierade att gå miste om skadestånd ur fonden – eftersom republikanska senatorer vill ha bort den.", "link": "https://www.svd.se/a/k0pO8k/trumps-anhangare-jublar-over-miljardfond-hotar-blockera-kongressen", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:37:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 55, "title": "Brazilian move of the champions: \"Exciting and a bit wild bet\"", "summary": "The champion club Engelholm makes an unexpected and \"wild\" coach choice. A well-known Brazilian star in Swedish volleyball takes over the responsibility on the sidelines.", "title_original": "Brasilianskt drag hos mästarna: ”Spännande och lite vild satsning”", "summary_original": "Mästarklubben Engelholm gör ett oväntat och ”vilt” coachval. En välkänd brasiliansk stjärna inom svensk volleyboll tar över ansvaret vid sidlinjen.", "link": "https://www.hd.se/sport/brasilianskt-drag-hos-mastarna-spannande-och-lite-vild-satsning/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:37:13+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 56, "title": "This is where the idyll broke - an arrest after an act of violence in a villa", "summary": "On a small private road, where everyone knows everyone, a brutal act of violence took place on Sunday evening. In Ytterby, north of Gothenburg, a man and a woman were attacked with an attachment in their home. A young man connected to the couple has been arrested on suspicion of two attempted murders.", "title_original": "Här sprack idyllen – en anhållen efter våldsdåd i villa", "summary_original": "På en liten enskild väg, där alla känner alla, skedde ett brutalt våldsdåd på söndagskvällen. I Ytterby norr om Göteborg blev en man och en kvinna attackerade med ett tillhygge i sin bostad. En ung man med koppling till paret har anhållits misstänkt för två mordförsök.", "link": "https://www.dn.se/sverige/har-sprack-idyllen-en-anhallen-efter-valdsdad-i-villa/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:35:21+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 57, "title": "The comic art remains on the barricades", "summary": "The 1970s \"Teddy Bear\", \"Phantomen\" and \"Mysterious 2:an\" were published for commercial purposes, but propagated a left-wing social view. SvD's Fredrik Strömberg reads \"Kamrat Bamse\" and realizes that the comic book took the mantle of these cartoon characters.", "title_original": "Seriekonsten står kvar på barrikaderna", "summary_original": "70-talets ”Bamse”, ”Fantomen” och ”Mystiska 2:an” utgavs i kommersiellt syfte, men propagerade för en vänsterorienterad samhällssyn. SvD:s Fredrik Strömberg läser ”Kamrat Bamse” och inser att serieromanen axlat dessa seriefigurers mantlar.", "link": "https://www.svd.se/a/43LvQR/recension-kamrat-bamse-av-robert-aman", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Litteratur", "Kultur"]}, {"id": 58, "title": "Now millions of tortillas will be sent electrically from Landskrona", "summary": "The tortillas that you have for the Friday cozy will now be more environmentally friendly.", "title_original": "Nu ska miljontals tortillas skickas elektriskt från Landskrona", "summary_original": "De tortillas som du har till fredagsmyset ska nu bli mer miljövänliga.", "link": "https://www.hd.se/landskrona/nu-ska-miljontals-tortillas-skickas-elektriskt-fran-landskrona/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 59, "title": "My child is finishing ninth grade without a high school diploma", "summary": "", "title_original": "Mitt barn går ut nian utan gymnasiebehörighet", "summary_original": "", "link": "https://www.hd.se/min-mening/mitt-barn-gar-ut-nian-utan-gymnasiebehorighet/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 60, "title": "Staff photographed users: \"Extremely inconsiderate\"", "summary": "A resident in a special accommodation had had faeces all over large parts of his bathroom and himself. Before an employee began to help with the cleaning, the employee took several photos in which the resident was visible. \n- I think it is extremely inconsiderate, says operations manager David Söder.", "title_original": "Personal fotograferade brukare: ”Extremt omdömeslöst”", "summary_original": "En boende på ett särskilt boende hade fått avföring över stora delar av sitt badrum och sig själv. Innan en anställd började hjälpa till med städningen tog den anställda flera bilder där den boende syntes. \n– Jag tycker det är extremt omdömeslöst, säger verksamhetschefen David Söder.", "link": "https://www.hd.se/angelholm/personal-fotograferade-brukare-extremt-omdomeslost/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 61, "title": "Why do people do the bare minimum at work?", "summary": "Today's questioner, a recent graduate with a demanding education, is not impressed by working life. Why are people so bad at work?", "title_original": "Varför gör folk minsta möjliga på jobbet?", "summary_original": "Dagens frågeställare, nyutexaminerad med krävande utbildning, är inte imponerad av arbetslivet. Varför är folk så dåliga på jobbet?", "link": "https://www.sydsvenskan.se/inpa-livet/varfor-gor-folk-minsta-mojliga-pa-jobbet/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 62, "title": "The pool leaks - Malenbadet is forced to close", "summary": "Two days after the premiere, Malenbadet had to close again. The pool has leaked such an amount of water that the system had to be shut down and the pool must now be filled up - with drinking water.", "title_original": "Bassängen läcker – Malenbadet tvingas stänga", "summary_original": "Två dagar efter premiären fick Malenbadet stänga igen. Bassängen har läckt en sådan mängd vatten att systemet fått stängas och poolen ska nu fyllas upp - med dricksvatten.", "link": "https://www.hd.se/bastad/bassangen-lacker-malenbadet-tvingas-stanga/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:29:39+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 63, "title": "MP: That's why we don't want to raise fuel prices now", "summary": "The Green Party no longer wants to raise fuel prices by two kroner per liter. The proposal has been withdrawn due to the sharp price increases that occurred in the wake of the war in the Middle East. - We have no proposals for further increases as it looks now, says Janine Alm Ericson (MP).", "title_original": "MP: Därför vill vi inte höja bränslepriserna nu", "summary_original": "Miljöpartiet vill inte längre höja bränslepriserna med två kronor per liter. Förslaget har dragits tillbaka på grund av de kraftiga prishöjningarna som skett i spåren av kriget i Mellanöstern. – Vi har inga förslag på ytterligare höjningar som det ser ut nu, säger Janine Alm Ericson (MP).", "link": "https://www.dn.se/sverige/mp-darfor-vill-vi-inte-hoja-branslepriserna-nu/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:28:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "\"There was a lot of freedom that came with being single\"", "summary": "The actress Isabella Rossellini is exhibiting her short films in Sweden this summer. Meet her in a conversation about ageing, relationships and dying like a Swede.", "title_original": "”Det kom mycket frihet med att vara singel”", "summary_original": "Skådespelaren Isabella Rossellini ställer ut sina kortfilmer i Sverige i sommar. Möt henne i ett samtal om åldrande, relationer och att döstäda som en svensk.", "link": "https://www.svd.se/a/wrvpGP/isabella-rossellini-jag-ar-fortfarande-forvanad-over-min-filmkarriar", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:26:09+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Perfect Guide"]}, {"id": 65, "title": "Letter to the editor. Abolished power charge makes the electricity grid 25 percent more expensive", "summary": "LETTER TO THE EDITOR. The electricity network company Ellevio is raising the fee sharply when Energy Minister Ebba Busch (KD) pointed with her whole hand regarding the effect fees. I hope that this money is used for what it is intended for and does not end up in the pockets of the owners, writes villa owner Kjell Eriksson in southern Stockholm.", "title_original": "Insändare. Avskaffad effektavgift gör elnätet 25 procent dyrare", "summary_original": "INSÄNDARE. Elnätbolaget Ellevio höjer avgiften kraftigt när energiminister Ebba Busch (KD) pekat med hela handen gällande effektavgifterna. Jag hoppas att dessa pengar används till det de är avsedda för och inte hamnar i fickorna på ägarna, skriver villaägaren Kjell Eriksson i södra Stockholm.", "link": "https://www.dn.se/insandare/avskaffad-effektavgift-gor-elnatet-25-procent-dyrare/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:23:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 66, "title": "The British class society in a laughing mirror", "summary": "The innovative British documentary photographer Martin Parr died in December, and Fotografiska now shows nearly 400 photos from his 50-year career. Bo Madestrand sees a critique of class society and consumerism, but also humor and tenderness.", "title_original": "Det brittiska klassamhället i skrattspegel", "summary_original": "Den nyskapande brittiska dokumentärfotografen Martin Parr avled i december och Fotografiska visar nu nära 400 foton från hans 50 år lång karriär. Bo Madestrand ser en kritik av klassamhället och konsumismen men också humor och ömhet.", "link": "https://www.dn.se/kultur/det-brittiska-klassamhallet-i-skrattspegel/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:12:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 67, "title": "License-less Kullabo does not stop driving - now the car is impounded", "summary": "An off-duty police officer raised the alarm when he saw a 42-year-old man behind the wheel on Kullagatan. The man does not have a driver's license and has now again been convicted of gross illegal driving.", "title_original": "Körkortslös Kullabo slutar inte köra – nu beslagtas bilen", "summary_original": "En ledig polis slog larm när han fick se en 42-årig man bakom ratten på Kullagatan. Mannen saknar körkort och har nu återigen dömts för grov olovlig körning.", "link": "https://www.hd.se/hoganas/korkortslos-kullabo-slutar-inte-kora-nu-beslagtas-bilen/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:08:30+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 68, "title": "German experts are to help SL with the struggling subway", "summary": "In recent days, Stockholm's subway has had major disruptions and the problems continue. SL has not managed to fix the signal error between Gamla stan and Slussen. Now technical experts have been flown in from Germany to help.", "title_original": "Tyska experter ska hjälpa SL med strulande tunnelbana", "summary_original": "De senaste dagarna har Stockholms tunnelbana haft stora störningar och problemen fortsätter. SL har inte lyckats åtgärda signalfelet mellan Gamla stan och Slussen. Nu har tekniska experter flugits in från Tyskland för att hjälpa till.", "link": "https://www.dn.se/sverige/tyska-experter-ska-hjalpa-sl-med-strulande-tunnelbana/", "date_display": "2026-06-01", "date_iso": "2026-06-01T09:05:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "So Islam became Sweden's second largest religion - and SD the second largest party", "summary": "In episode 103 of Dagens litteraturpodd Läsarpodden, theologians Joel Halldorf and Patrik Hagman discuss the book \"Open your heart\" by Simon Sorgenfrei", "title_original": "Så blev islam Sveriges näst största religion – och SD näst största parti", "summary_original": "I avsnitt 103 av Dagens litteraturpodd Läsarpodden diskuterar teologerna Joel Halldorf och Patrik Hagman boken ”Öppna era hjärta” av Simon Sorgenfrei", "link": "https://www.dagen.se/podd/sa-blev-islam-sveriges-naest-stoersta-religion-och-sd-naest-stoersta-parti/10372751", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:52:53+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "Debut goal in Allsvenskan - and selected for the national team", "summary": "Karl Gunnarsson is listed for six starts and four appearances in the Allsvenskan in 2026.", "title_original": "Debutmål i allsvenskan – och uttagen till landslaget", "summary_original": "Karl Gunnarsson står noterad för sex starter och fyra inhopp i allsvenskan 2026.", "link": "https://www.hd.se/sport/debutmal-i-allsvenskan-och-uttagen-till-landslaget/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:46:36+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "The Liberals want to pay Lund's municipal employees two days earlier", "summary": "Municipal employees should be able to celebrate pay Friday together with their friends and avoid stressing about bills that must be paid exactly when the salary arrives. That's the opinion of the Liberals' Christoffer Karlsson, who proposes a common salary payment to everyone on the 25th of each month.", "title_original": "Liberalerna vill ge Lunds kommunanställda lön två dagar tidigare", "summary_original": "Kommunanställda ska kunna fira lönefredag tillsammans med sina kompisar och slippa stressa med räkningar som ska betalas exakt när lönen kommer. Det tycker Liberalernas Christoffer Karlsson, som föreslår gemensam löneutbetalning till alla den 25 varje månad.", "link": "https://www.sydsvenskan.se/lund/liberalerna-vill-ge-lunds-kommunanstallda-lon-tva-dagar-tidigare/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:46:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 72, "title": "Pensioners become richer: \"Working all the way\"", "summary": "Pensioners' purchasing power is increasing again and almost half a million Swedes can now call themselves \"job bonaires\", according to a survey from the occupational pension company Alecta. - Compared to ten years ago, a newly retired person typically has SEK 8,000 more a month to move around with, says the company's pension economist Staffan Ström.", "title_original": "Pensionärer blir rikare: ”Jobbar hela vägen”", "summary_original": "Pensionärernas köpkraft ökar igen och nästan en halv miljon svenskar kan nu kalla sig ” jobbonär”, visar en undersökning från tjänstepensionsbolaget Alecta. – Jämfört med för tio år sedan har en nybliven pensionär typiskt sett 8 000 kronor mer i månaden att röra sig med, säger bolagets pensionsekonom Staffan Ström.", "link": "https://www.hd.se/ekonomi/pensionarer-blir-rikare-jobbar-hela-vagen/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "Extra important derby awaits: \"Of course you are tagged\"", "summary": "Fourteen points out of thirty and seventh place after the first third. In the next round, it's derby. Here is Ervin Gigovic's account of HIF so far and how he sees the importance of now winning against Landskrona BoIS:", "title_original": "Extra viktigt derby väntar: ”Såklart man är taggad”", "summary_original": "Fjorton poäng av trettio och en sjundeplats efter första tredjedelen. I nästa omgång är det derby. Här är Ervin Gigovic bokslut av HIF så långt och hur han ser på betydelsen av att nu vinna mot Landskrona BoIS:", "link": "https://www.hd.se/sport/extra-viktigt-derby-vantar-saklart-man-ar-taggad/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "The Tidö parties agree on the teenage expulsions", "summary": "The government and SD have reached an agreement on the teenage deportations. The age limit for teenage expulsions is raised to 21 years - and expelled young people get a new chance. \"A very good day for Sweden,\" says Migration Minister Johan Forssell (M).", "title_original": "Tidöpartierna överens om tonårsutvisningarna", "summary_original": "Regeringen och SD har nått en överenskommelse om om tonårsutvisningarna. Åldersgränsen för tonårsutvisningar höjs till 21 år – och utvisade ungdomar får ny chans. ”En väldigt bra dag för Sverige”, säger migrationsminister Johan Forssell (M).", "link": "https://www.svd.se/a/zO42Ev/tidopartierna-overens-om-tonarsutvisningarna", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:23:40+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 75, "title": "Review: Major damage to US robotic defenses", "summary": "Iran has damaged at least 20 US military facilities, satellite images analyzed by the BBC show. The review indicates that the damage is more extensive than the US has admitted.", "title_original": "Granskning: Stora skador på USA:s robotförsvar", "summary_original": "Iran har tillfogat skador på minst 20 amerikanska militäranläggningar, visar satellitbilder analyserade av BBC. Granskningen tyder på att skadorna är mer omfattande än USA medgett.", "link": "https://www.sydsvenskan.se/varlden/granskning-stora-skador-pa-usas-robotforsvar/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:22:19+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Feta cheese in filo pastry with pickled green onions", "summary": "Today's dinner tip offers feta cheese wrapped in crispy filo pastry which is then fried golden and served with a fresh salad, creamy avocado and sour pickled green onions.  You can find the recipe at köket.se", "title_original": "Fetaost i filodeg med picklad salladslök", "summary_original": "Dagens middagstips bjuder på fetaost inlindad i frasig filodeg som sen steks gyllene och serveras ihop med en fräsch sallad, krämig avokado och syrligt picklad salladslök.  Receptet hittar du på köket.se", "link": "https://www.tv4.se/artikel/4XOdxLCSlSn71qjzwclhRN/fetaost-i-filodeg-med-picklad-salladsloek", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:19:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/siri-barje", "/koket", "/kokets-middag"]}, {"id": 77, "title": "Kuwait: Shot down robots and drones", "summary": "Clashes in the Middle East continue. The US has attacked an island in the Strait of Hormuz, while Kuwait was subjected to robot and drone attacks during the night. According to the Revolutionary Guard in Iran, an American military base in the region has been attacked.", "title_original": "Kuwait: Skjutit ned robotar och drönare", "summary_original": "Sammandrabbningarna i Mellanöstern fortsätter. USA har attackerat en ö i Hormuzsundet, medan Kuwait under natten utsatts för robot- och drönaranfall. Enligt Revolutionsgardet i Iran har en amerikansk militärbas i regionen angripits.", "link": "https://www.dn.se/varlden/kuwait-skjutit-ned-robotar-och-dronare/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:12:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "The inspectors: Student life must be allowed to sound", "summary": "Enjoy the commitment of the students and appreciate the sounds of the living city! Together, the brighter future can be ours - albeit a little loud at times. That's what the inspectors for twelve of Lund's nations write.", "title_original": "Inspektorerna: Studentlivet måste få lov att låta", "summary_original": "Gläds åt studenternas engagemang och uppskatta den levande stadens ljud! Tillsammans kan den ljusnande framtid vara vår – om än lite högljudd emellanåt. Det skriver inspektorerna för tolv av Lunds nationer.", "link": "https://www.sydsvenskan.se/lund/inspektorerna-studentlivet-maste-fa-lov-att-lata/", "date_display": "2026-06-01", "date_iso": "2026-06-01T08:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 79, "title": "Major damage to US robotic defenses", "summary": "Iran has damaged at least 20 US military facilities, satellite images analyzed by the BBC show. The review indicates that the damage is more extensive than the US has admitted.", "title_original": "Stora skador på USA:s robotförsvar", "summary_original": "Iran har tillfogat skador på minst 20 amerikanska militäranläggningar, visar satellitbilder analyserade av BBC. Granskningen tyder på att skadorna är mer omfattande än USA medgett.", "link": "https://www.svd.se/a/aJj9Pa/granskning-stora-skador-pa-usa-s-robotforsvar", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:55:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 80, "title": "Now the food requirement is abolished - can become bar in the bookstore", "summary": "Now the food and kitchen requirement to be allowed to serve alcohol is abolished. It opens up new beach bars, wine bars and maybe a glass at the hairdresser's. But in the short term, it is the existing places that benefit the most from the change, believes Visita's CEO Jonas Siljhammar.", "title_original": "Nu slopas matkravet – kan bli bar i bokhandeln", "summary_original": "Nu slopas mat- och kökskravet för att få servera alkohol. Det öppnar upp för nya strandbarer, vinbarer och kanske ett glas hos frisören. Men kortsiktigt är det befintliga ställen som tjänar mest på förändringen, tror Visitas vd Jonas Siljhammar.", "link": "https://www.hd.se/sverige/nu-slopas-matkravet-kan-bli-bar-i-bokhandeln/", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:45:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "Today Marilyn Monroe would have turned 100 - here she is celebrated with a world record", "summary": "Today, the legendary and iconic actor and fashion model Marilyn Monroe would have turned 100 years old. Over the weekend, she was celebrated with a big masquerade party in Palm Springs, California. 1,037 women and men dressed in blonde wigs and white dresses broke a world record - never before have so many \"look-a-likes\" gathered in one place.", "title_original": "I dag skulle Marilyn Monroe fyllt 100 – här firas hon med ett världsrekord", "summary_original": "I dag skulle den mytomspunna och ikoniska skådespelaren och fotomodellen Marilyn Monroe ha fyllt 100 år. Under helgen hyllades hon med en stor maskeradfest i Palm springs, Kalifornien. 1 037 kvinnor och män utklädda i blonda peruker och vita klänningar slog världsrekord – aldrig förr har så många ”look-a-likes” samlats på en och samma plats.", "link": "https://www.dn.se/varlden/i-dag-skulle-marilyn-monroe-fyllt-100-har-firas-hon-med-ett-varldsrekord/", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:42:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "When control becomes more important than freedom in the world of school", "summary": "The students are exposed to pressure, surveillance and norms that limit their choices, says KD's group leader in Malmö.", "title_original": "När kontroll blir viktigare än frihet i skolans värld", "summary_original": "Eleverna är utsatta för press, övervakning och normer som begränsar deras val, menar KD:s gruppledare i Malmö.", "link": "https://www.sydsvenskan.se/malmo/nar-kontroll-blir-viktigare-an-frihet-i-skolans-varld/", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 83, "title": "M promises detached houses - S wants to see wider construction", "summary": "The housing situation in Stockholm is under constant debate. Is it being built too much, too little – or the wrong kind? M promises more detached houses. S wants to build wide. But both parties have abandoned the target of 140,000 new homes by 2035.", "title_original": "M lovar småhus – S vill se bredare byggande", "summary_original": "Bostadssituationen i Stockholm är under ständig debatt. Byggs det för mycket, för lite – eller fel sort? M lovar fler småhus. S vill bygga brett. Men båda partier har övergett målet om 140 000 nya bostäder till 2035.", "link": "https://www.svd.se/a/K8Pleo/bostadssituationen-i-stockholm-sa-vill-m-och-s-bygga", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:25:08+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 84, "title": "The Tidö parties face a valve for young people threatened with deportation - the age limit is raised", "summary": "At a press conference in Norrköping, Prime Minister Ulf Kristersson (M) stated during the morning that the Tidö parties agreed on the so-called \"teenage expulsions\". - A little while ago, the government made the decision on the important issue of finding a valve for the teenagers we have been discussing for some time and who risked harm in the reforms of family immigration, says Kristersson, according to TT.  The minister: Not a new problem The teenage deportations are about the people who do not meet the requirements for a residence permit when they turn 18, even in cases where their parents have the right to stay in Sweden.  On Monday, the migration policy spokespersons from the Christian Democrats, the Liberals and the Sweden Democrats held a press conference together with Migration Minister Johan Forssell (M) to present how they want to change the system.  The Migration Minister believes that deportations have been a permanent problem since 2021 when the legislation was confirmed.  - Although this is sometimes presented in the media as a new problem, it has been going on for several years in Sweden, says Forssell. Aspling: Drawing the line is not that simple. As an 18-year-old, you are not legally part of your parents' nuclear family, which means that the basis for a residence permit can fall.  - But everyone who is a parent knows that drawing boundaries is not always that simple, says Ludvig Aspling (SD). Johan Forssell believes that the legislation has not been fair and that there must be conditions to stay in Sweden if you behave.  - In several cases, it is the case that these 18-year-olds, they have not had enough time to fulfill the requirements to be granted another residence permit, says Forssell. Raising the age limit from 18 to 21 The Tidö parties have previously agreed to pause deportations, but that agreement did not include the decisions already taken. Forssell believes that they have been working on a solution to the problem for a long time and that it is divided into three", "title_original": "Tidöpartierna inför ventil för unga utvisningshotade – åldergränsen höjs", "summary_original": "På en pressträff i Norrköping uppgav statsminister Ulf Kristersson (M) under morgonen att Tidöpartierna var överens om de så kallade ”tonårsutvisningarna”. – För en liten stund sedan fattade regeringen beslutet i den viktiga frågan om att hitta en ventil för de tonåringar vi har diskuterat under en tid och som riskerat att fara illa i reformerna av anhöriginvandringen, säger Kristersson, enligt TT.  Ministern: Inte ett nytt problem Tonårsutvisningarna handlar om de personer som inte uppfyller kraven för uppehållstillstånd när de fyller 18 år, även i de fall deras föräldrar har rätt att stanna i Sverige.  Under måndagen höll de migrationspolitiska talespersonerna från Kristdemokraterna, Liberalerna och Sverigedemokraterna en pressträff tillsammans med migrationsminister Johan Forssell (M) för att presentera hur man vill förändra systemet.  Migrationsministern menar att utvisningarna har varit ett permanent problem sedan 2021 då lagstiftningen bekräftades.  – Även om detta i media ibland framställts som ett nytt problem, så har det pågått under ett flertal år i Sverige, säger Forssell. Aspling: Gränsdragningen är inte så enkel Som 18-åring ingår man juridiskt sett inte i sina föräldrars kärnfamilj, vilket gjort att grunden för uppehållstillstånd kan falla.  – Men alla som är föräldrar vet att den gränsdragningen inte alltid är så enkel, säger Ludvig Aspling (SD). Johan Forssell menar att lagstiftningen inte varit rättvis och att det måste finnas förutsättningar att få stanna i Sverige om man sköter sig.  – I flera fall så är det så att de här 18-åringarna, de har då inte haft tillräckligt med tid på sig för att hinna uppfylla kraven för att beviljas ett annat uppehållstillstånd, säger Forssell. Höjer åldersgränsen från 18 till 21 Tidöpartierna har tidigare varit överens om att pausa utvisningarna, men den överenskommelsen innefattade inte de beslut som redan tagits. Forssell menar att man arbetat med en lösning på problemet en längre tid och att den är uppdelad i tre delar: En höjning av åldersgränsen och en chans för de som fått ett utvisningsbeslut eller utvisats att söka igen.  – Enkelt uttryckt, 18-årsgränsen flyttas upp tills dess att man har fyllt 21, säger Forssell.  De personer som fått ett utvisningsbeslut och lämnat Sverige kommer även kunna nyttja den nya ventilen. – De kan alltså söka och beviljas tillstånd enligt den här nya ventilen och därmed få en chans att komma tillbaka till Sverige. Sen gör man alltid en individuell bedömning, säger Forssell. Men även de som befinner sig i Sverige och fått ett utvisningsbeslut kommer kunna söka från Sverige.  – För personer som redan har ett lagakraftvunnet utvisningsbeslut så inför vi en ny möjlighet att kunna söka ett nytt uppehållstillstånd enligt den nya ventilen eller på grund av någon annan grund. Det kan till exempel vara arbete eller det kan vara studier för den delen. Förslaget är tänkt att träda i kraft den 1 oktober i år, men måste först röstas igenom i riksdagen.", "link": "https://www.tv4.se/artikel/2Yu51H5vJHkNSwvijHwmTe/tidoepartierna-aer-oeverens-om-tonarsutvisningarna", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:22:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/migrationspolitik", "/svensk-politik"]}, {"id": 85, "title": "Tidöpartierna: Deported teenagers get a new chance", "summary": "The Tidö parties have agreed on a \"valve\" to stop more so-called teenage deportations. The proposed legislation also applies to those who have already received a deportation order and who have left Sweden since last year.", "title_original": "Tidöpartierna: Utvisade tonåringar får ny chans", "summary_original": "Tidöpartierna har kommit överens om en ”ventil” för att stoppa fler så kallade tonårsutvisningar. Lagförslagen gäller även de som redan har fått utvisningsbeslut och som lämnat Sverige sedan i fjol.", "link": "https://www.svd.se/a/GxBLpq/tidopartierna-overens-om-ventil-for-tonarsutvisningar", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:19:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 86, "title": "Women more uncertain about crisis responsibility: \"It's great that there are women's groups\"", "summary": "Women are more pessimistic than men about security in Sweden and the world. At the same time, women are also more uncertain about what responsibility they have in a crisis. This is shown by surveys carried out by the Norwegian Civil Defense Authority, MCF. - It's great that there are women's groups where you encourage each other, says Christina Andersson, risk communication strategist.", "title_original": "Kvinnor mer osäkra på krisansvar: ”Jättebra att det finns kvinnogrupper”", "summary_original": "Kvinnor är mer pessimistiska än män om säkerheten i Sverige och världen. Samtidigt är kvinnor också mer osäkra på vilket ansvar de har vid en kris. Det visar undersökningar som gjorts av Myndigheten för civilt försvar, MCF. – Det är jättebra att det finns kvinnogrupper där man peppar varandra, säger Christina Andersson, riskkommunikationsstrateg.", "link": "https://www.hd.se/inpa-livet/kvinnor-mer-osakra-pa-krisansvar-jattebra-att-det-finns-kvinnogrupper/", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:18:11+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 87, "title": "More than 890 were arrested at the Champions League celebrations in Paris", "summary": "The celebration of Paris Saint-Germain's second consecutive Champions League title turned very violent. Almost 900 people were arrested in riots.", "title_original": "Fler än 890 greps vid Champions League-firandet i Paris", "summary_original": "Firandet av Paris Saint-Germains andra raka Champions League-titel blev väldigt våldsamt. Nästan 900 personer greps i upplopp.", "link": "https://www.hd.se/sport/fler-an-890-greps-vid-champions-league-firandet-i-paris/", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:15:21+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 88, "title": "The government and SD agree on teenage deportations", "summary": "", "title_original": "Regeringen och SD överens om tonårsutvisningarna", "summary_original": "", "link": "https://www.svd.se/a/d4L1Xz/uppgifter-regeringen-och-sd-overens-om-tonarsutvisningarna", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:12:32+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 89, "title": "Details: The son attacked his parents", "summary": "At 9:30 p.m., the police were alerted that a person had attacked two people with some form of attachment in Kungälv. A large number of police officers, an ambulance and an ambulance helicopter were sent to the scene.  - One person is taken to hospital in an ambulance and another person in an ambulance helicopter, it is about a man and a woman between the ages of 40 and 45, says Fredrik Svedemyr, press spokesperson at the police. Sahlgrenska University Hospital tells TT that the injury is serious but stable.  The incident is being investigated as two cases of attempted murder and breach of child protection, when a minor was at the scene. - One person has attacked two other people with an affection, says Fredrik Svedemyr. Details: The son attacked The police describe the whole thing as an isolated incident and that those involved are familiar with each other. According to information to TV4 Nyheterna, it is about a family drama where the son allegedly attacked his parents.  - What I can say is that the parties have a relationship with each other, but otherwise I have no details, says Fredrik Svedemyr. Prosecutor Simon Egelrud, who leads the preliminary investigation, states that the arrested person and the plaintiff have a relationship with each other from before.  - But exactly what it looks like is not something I will go into at the moment. A number of different investigation measures are underway, such as technical investigations and interrogations to try to clarify what has happened, says Egelrud. The police became aware of the incident after the neighbors raised the alarm, according to reports. - There has been an extensive resource on site, you can summarize it as, says Fredrik Svedemyr. Arrested nearby After the attack, the son allegedly left the crime scene, but was able to be arrested nearby.  - The perpetrator can be arrested in connection with the scene fairly undramatically. He is suspected of attempted murder and breach of child protection. On Monday, police work continues at the scene.  - We will continue to work with further information gathering and process what we have received into the ini", "title_original": "Uppgifter: Sonen gick till attack mot sina föräldrar", "summary_original": "Vid klockan 21.30 larmades polisen om att en person attackerat två personer med någon form av tillhygge i Kungälv. Ett stort antal poliser, ambulans och ambulanshelikopter skickades till platsen.  – En person förs till sjukhus i ambulans och ytterligare en person i ambulanshelikopter, det handlar om en man och en kvinna i 40–45-årsåldern, säger Fredrik Svedemyr, presstalesperson på polisen. Sahlgrenska universitetssjukhuset uppger för TT att skadeläget är allvarligt men stabilt.  Händelsen utreds som två fall av försök till mord och barnfridsbrott, då en minderårig befann sig på platsen. – En person har attackerat två andra personer med ett tillhygge, säger Fredrik Svedemyr. Uppgifter: Sonen gick till attack Polisen beskriver det hela som en isolerad händelse och att de inblandade är bekanta med varandra. Enligt uppgifter till TV4 Nyheterna handlar det om ett familjedrama där sonen ska ha gått till attack mot sina föräldrar.  – Det jag kan säga är att parterna har en relation till varandra men i övrigt har jag inga detaljer, säger Fredrik Svedemyr. Åklagaren Simon Egelrud, som leder förundersökningen, uppger att den anhållne och målsägande har en relation till varandra sedan tidigare.  – Men exakt hur den ser ut är inget jag kommer att gå in på i nuläget. Det pågår en rad olika utredningsåtgärder som tekniska undersökningar och förhör för att försöka klarlägga vad det är som har hänt, säger Egelrud. Polisen fick kännedom om händelsen efter att grannarna slog larm, enligt uppgifter. – Det har varit en omfattande resurs på plats kan man sammanfatta det som, säger Fredrik Svedemyr. Greps i närheten Efter attacken ska sonen ha lämnat brottsplatsen, men kunde gripas i närheten.  – Gärningspersonen kan gripas i anslutning till platsen tämligen odramatiskt. Han misstänks för försök till mord och barnfridsbrott. Under måndagen fortsätter polisens arbete på platsen.  – Vi kommer att jobba vidare med ytterligare informationsinhämtning och bearbeta det vi har fått in i det initiala skedet. – Det har varit en omfattande resurs på plats kan man sammanfatta det som.", "link": "https://www.tv4.se/artikel/5pRsrWo9JRL3BkswflgbbN/uppgifter-sonen-gick-till-attack-mot-sina-foeraeldrar", "date_display": "2026-06-01", "date_iso": "2026-06-01T07:06:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/kungalv", "/polisen"]}, {"id": 90, "title": "Restaurants charge too much VAT: \"Feel cheated\"", "summary": "For the second time in a row, June Ljungqvist in Sjöbo has received the wrong VAT on takeaway food. The restaurants have charged twelve percent - even though the VAT on takeaway food has been reduced to six percent. When she went back to the restaurants, she had to fight to get money back.  - I was a little surprised, because I have seen this as good for the consumer. Six percent cheaper, but also for the restaurateur who hopefully sold more when it becomes cheaper for us, she says. Official figures are missing In order to get a picture of how the new rules are applied in practice, we carried out a random test where we ordered takeaway food from three different restaurants in Stockholm. The result showed that two of the restaurants correctly lowered the VAT, while one kept the old one. There are no official figures yet on how widespread it is for restaurants to charge incorrect VAT since the new VAT rates came into force on 1 April. Kerstin Alvesson is a legal expert at the Swedish Tax Agency, the authority that checks that restaurants use the correct VAT rate. She believes that the incorrect VAT does not benefit anyone.  - The six percent is VAT that they have taken from the customer, and the other six percent is incorrect. It must also be paid to the state. The companies don't profit from that, she says. Possible reason for the incorrect VAT According to the trade organization Visita, the new VAT rates are both complicated and administratively expensive for the restaurants when they have to keep track of two different VAT rates at the same time, which could be one of the reasons for the incorrect VAT. This picture is also shared by the restaurant that gave us incorrect food tax. - The restaurant obviously charges a higher price than it needs. It would have been easier if the reform involved the food served in restaurants. It would have been a much simpler solution, says Jonas Siljhammar, CEO of Visita. June Ljungqvist in Sjöbo has now become more vigilant about her receipts after the VAT mistakes. - Many people don't look at the receipt, but now afterwards I look at all the receipts", "title_original": "Restauranger tar ut för hög moms: ”Kände mig lurad”", "summary_original": "För andra gången i rad har June Ljungqvist i Sjöbo fått fel moms på hämtmat. Restaurangerna har tagit ut tolv procent – trots att momsen på hämtad mat har sänkts till sex procent. När hon gick tillbaka till restaurangerna fick hon kämpa för att få tillbaka pengar.  – Jag var lite förvånad, för jag har ju sett detta som bra för konsumenten. Sex procent billigare, men även för krögaren som förhoppningsvis sålt mer när det blir billigare för oss, berättar hon. Officiella siffror saknas För att få en bild av hur de nya reglerna tillämpas i praktiken genomförde vi ett slumpmässigt test där vi beställde hämtmat från tre olika restauranger i Stockholm. Resultatet visade att två av restaurangerna korrekt sänkt momsen, medan en behöll den gamla. Det finns ännu inga officiella siffror på hur utbrett det är att restauranger tar ut felaktig moms sedan de nya momssatserna trädde i kraft den 1 april. Kerstin Alvesson är rättslig expert på Skatteverket, den myndighet som kontrollerar att restaurangerna använder rätt momssats. Hon menar att den felaktiga momsen inte gynnar någon.  – De sex procenten är moms som de har tagit från kunden, och de andra sex procenten är felaktiga. Den måste man också betala in till staten. De tjänar inte på det företagen, säger hon. Möjlig orsak till den felaktiga momsen Enligt branschorganisationen Visita är de nya momssatserna både krångliga och administrativt dyra för restaurangerna när man ska hålla koll på två olika momssatser samtidigt, vilket kan vara en av orsakerna till den felaktiga momsen. Denna bild delas även av den restaurang som gav oss felaktig matmoms. – Restaurangen tar uppenbarligen ett högre pris än den behöver. Det hade varit enklare om man involverade maten som serveras på restaurang i reformen. Det hade varit en mycket enklare lösning, säger Jonas Siljhammar, vd på Visita. June Ljungqvist i Sjöbo har nu blivit mer vaksam på sina kvitton efter momsmissarna. – Många tittar inte på kvittot, men nu efteråt så tittar jag på alla kvitton när jag hämtar mat, säger hon.", "link": "https://www.tv4.se/artikel/7C4hCuuins3WXKXT3SoWQJ/restauranger-tar-ut-foer-hoeg-moms-kaende-mig-lurad", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:29:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/hamtmat", "/skatt", "/sankt-matmoms", "/matpriserna", "/svensk-politik", "/restaurang", "/politik"]}, {"id": 91, "title": "The appeal to parents: Put away the mobile phone", "summary": "Put the mobile away when you spend time with your children. And introducing mobile phone-free zones at home. That is the Public Health Agency's call to the country's parents.", "title_original": "Uppmaningen till föräldrar: Lägg undan mobilen", "summary_original": "Lägg undan mobilen när du umgås med dina barn. Och inför mobilfria zoner hemma. Det är Folkhälsomyndighetens uppmaning till landets föräldrar.", "link": "https://www.sydsvenskan.se/sverige/uppmaningen-till-foraldrar-lagg-undan-mobilen/", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:26:06+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 92, "title": "40 degrees expected today: \"The city will basically shut down\"", "summary": "In Spanish Seville you are used to heat, it is one of Europe's hottest cities. - People say: \"It's normal, but not this early.\" This creates some concern that vegetation and terrain will dry out. Then it risks being like a start button for the fire season, says reporter Noah Toth. Already now, the rescue service has had to fight two difficult-to-extinguish forest fires in the immediate area, including in a nature reserve where over 500 hectares are said to have burned down in recent days, he says. Calls for caution Today, temperatures of over 40 degrees are expected. - When temperatures are so high during the day, the town will basically shut down. People who work outdoors will not be able to work. Siesta. It's a yellow warning issued, so people are asked to take cover to not risk death, said Noah Toth. With increasingly longer and more intense heat waves, in Spain there are rules that say that labor must be protected. - You shouldn't have to work outdoors in such high temperatures. And fragile groups, such as the elderly and children, are asked to be careful. How the population is supported From society's side, a lot is done to help the population protect themselves from the extreme heat. - It is a work that is constantly ongoing and being built up in Spain. There is a widespread network of so-called climate shelters, i.e. shelters. It can be libraries or sports halls that open up with air conditioning for those who do not have it at home. Parks with lots of shade. All so that those who cannot protect themselves so easily against heat will have somewhere to do so, says Noah Toth. The ongoing heat wave in southern Europe is due to a high pressure with warm air that has flowed in from North Africa and formed a so-called heat dome.", "title_original": "40 grader väntas i dag: ”Stan kommer i princip stänga ner”", "summary_original": "I spanska Sevilla är man van vid hetta, det är en av Europas varmaste städer. – Folk säger: ”Det är normalt, men inte så här tidigt.” Det skapar en viss oro för att vegetation och terräng torkar ut. Då riskerar det att vara som en startknapp för brandsäsongen, berättar reporter Noah Toth. Redan nu har räddningstjänsten fått bekämpa två svårsläckta skogsbränder i närområdet, bland annat i ett naturreservat där över 500 hektar ska ha brunnit ner de senaste dagarna, berättar han. Manar till försiktighet I dag väntas temperaturer på över 40 grader. – När det blir så höga temperaturer under dagen kommer stan i princip stänga ner. Folk som jobbar utomhus kommer inte kunna jobba. Siesta. Det är en gul varning utfärdad, så folk uppmanas att ta skydd för inte riskera dödsfall, säger Noah Toth. Med allt längre och intensivare värmeböljor har man i Spanien regler som säger att arbetskraft ska skyddas. – Man ska inte behöva jobba utomhus i så här höga temperaturer. Och sköra grupper, som äldre och barn och uppmanas att vara försiktiga. Så stöttas befolkningen Från samhällets sida görs en hel del för att hjälpa befolkningen att skydda sig från extremvärmen. – Det är ett arbete som hela tiden pågår och byggs upp i Spanien. Det finns ett utbrett nätverk av så kallade climate shelters, alltså skyddsplatser. Det kan vara bibliotek eller idrottshallar som öppnar upp med luftkonditionering för dem som inte har det hemma. Parker med mycket skugga. Allt för att de som inte kan skydda sig så lätt mot värme ska ha någonstans att göra det, säger Noah Toth. Den pågående värmeböljan i södra Europa beror på ett högtryck med varm luft som strömmat in från Nordafrika och bildat en så kallad värmekupol.", "link": "https://www.tv4.se/artikel/2pvuv5nAaXVSAtJyvNwMOw/40-grader-vaentas-i-dag-stan-kommer-i-princip-staenga-ner", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:20:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/vadret", "/nyhetsmorgon", "/varme", "/varmeboljor", "/vader", "/vadervarningar", "/spanien"]}, {"id": 93, "title": "Where does all the money come from?", "summary": "PODD It recently became known that the AI ​​company Anthropic has raised $65 billion in a new funding round. This is just one in a line of AI companies that are raking in astronomical sums. But where does the money come from?", "title_original": "Var kommer alla pengar ifrån?", "summary_original": "PODD Nyligen blev det känt att AI-bolaget Anthropic tagit in 65 miljarder dollar i en ny finansieringsrunda. Detta är bara ett i raden av AI-bolag som plockar in astronomiska summor. Men var kommer pengarna ifrån?", "link": "https://www.svd.se/a/ExRkEj/svd-podd-tech-brief-space-x-borsnotering-och-hora-varderingar", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:09:27+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 94, "title": "After the dry spring - now you can stop the killer snail", "summary": "A dry spring has made it difficult for the killer snail. And a joint hunting effort now could perhaps save summer's flowers and vegetables. - We can keep them in check, says snail expert Ted von Proschwitz.", "title_original": "Efter torra våren – nu kan du stoppa mördarsnigeln", "summary_original": "En torr vår har gjort det jobbigt för mördarsnigeln. Och en gemensam jaktinsats nu skulle kanske kunna rädda sommarens blommor och grönsaker. – Vi kan hålla dem i schack, säger snigelexperten Ted von Proschwitz.", "link": "https://www.hd.se/sverige/efter-torra-varen-nu-kan-du-stoppa-mordarsnigeln/", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:07:44+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Anniversaries celebrate with unknown Bellman", "summary": "A rediscovered female composer and an unknown vocal performance by Bellman – Stockholm's distinguished festival for early music celebrates 25 years. A survivor struggling in economic headwinds.", "title_original": "Jubilar firar med okänd Bellman", "summary_original": "En återupptäckt kvinnlig tonsättare och ett okänt sångspel av Bellman – Stockholms förnämliga festival för tidig musik firar 25 år. En överlevare som kämpar i ekonomisk motvind.", "link": "https://www.svd.se/a/43LbyR/stockholm-early-music-festival-firar-25-ar-2026-under-ledning-av-peter-pontvik", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Scen", "Kultur"]}, {"id": 96, "title": "Kullagymnasiet's program has fewer specialisations", "summary": "After the decision to discontinue the technology program already in the fall semester, there will now be fewer specializations in the university preparatory programs. The number of places is also decreasing.", "title_original": "Kullagymnasiets program får färre inriktningar", "summary_original": "Efter beslutet att lägga ner teknikprogrammet redan till höstterminen blir det nu färre inriktningar på de högskoleföreberedande programmen. Även antalet platser minskar.", "link": "https://www.hd.se/hoganas/kullagymnasiets-program-far-farre-inriktningar/", "date_display": "2026-06-01", "date_iso": "2026-06-01T06:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Nvidia's next billion market", "summary": "Good morning! Nvidia wants to take over more and more of our computers, record investment in French data centers, and opening for AI-controlled military without humans involved.", "title_original": "Nvidias nästa miljardmarknad", "summary_original": "God morgon! Nvidia vill ta över allt mer av våra datorer, rekordinvestering i franska datacenter, och öppning för AI-styrd militär utan inblandade människor.", "link": "https://www.svd.se/a/bOLved/nvidias-vill-na-ny-miljardmarknad-med-rtx-spark", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:52:34+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 98, "title": "Girls target for online gang recruiters", "summary": "More and more young girls in the South region are suspected of serious crimes. At the same time, the negative trend for boys has reversed. Criminal recruiters now approach girls directly on social media to get them to take on assignments.", "title_original": "Flickor måltavla för gängens rekryterare på nätet", "summary_original": "Fler och fler unga tjejer i region Syd misstänks för allvarliga brott. Samtidigt har den negativa trenden för killar vänt. Kriminella rekryterare vänder sig numera direkt till ndlade-hela-tiden-om-att-fake-it-till-you-make-it/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:33:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "n'Jonas: Never have I felt so wild as in Berlin. But now?", "summary": "n'Jonas returns to Berlin. He walks around Fotografiska's desolate museum shop. And shudder at the city's transformation.", "title_original": "n'Jonas: Aldrig har jag känt mig så vild som i Berlin. Men nu?", "summary_original": "n'Jonas återvänder till Berlin. Han går runt i Fotografiskas ödsliga museibutik. Och ryser över stadens förvandling.", "link": "https://www.dn.se/kultur/n-jonas-aldrig-har-jag-kant-mig-sa-vild-som-i-berlin-men-nu/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "Eight killed in Israeli attack in Lebanon", "summary": "Eight people were killed in an Israeli attack on Sunday morning, Lebanon's Ministry of Health said.", "title_original": "Åtta dödade i israelisk attack i Libanon", "summary_original": "Åtta personer dödades i en israelisk attack under söndagsmorgonen, uppger Libanons hälsodepartement.", "link": "https://www.hd.se/varlden/atta-dodade-i-israelisk-attack-i-libanon/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:27:25+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Had to quit after a heart attack - took Norway to the WC with inspiration from Sweden", "summary": "OSLO. This summer, Ståle Solbakken will be the first Norwegian to participate in the FIFA World Cup as both a player and the national team captain. After a playing career cut short by a heart attack, he took Norway to the World Cup for the first time in 28 years. He has taken inspiration from Sweden.", "title_original": "Fick sluta efter hjärtattack – tog Norge till VM med inspiration från Sverige", "summary_original": "OSLO. I sommar blir Ståle Solbakken förste norrman som deltagit i fotbolls-VM både som spelare och förbundskapten. Efter en spelarkarriär som avbröts av en hjärtattack tog han Norge till VM för första gången på 28 år. Inspiration har han hämtat från Sverige.", "link": "https://www.dn.se/sport/fick-sluta-efter-hjartattack-tog-norge-till-vm-med-inspiration-fran-sverige/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:24:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "Bull rushed between vehicles on E4 - had to be euthanized", "summary": "", "title_original": "Tjur rusade mellan fordon på E4 – fick avlivas", "summary_original": "", "link": "https://www.svd.se/a/q6vgX1/tjur-rusade-mellan-fordon-pa-e4-fick-avlivas", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:12:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 105, "title": "Andreas Johansson Heinö: MP and SD are polar opposites - but two things unite them", "summary": "Like KD and New Democracy, SD and MP offered something genuinely foreign when they took their place in the finer room of Swedish politics - and were fought by the establishment. THE COLUMN. Andreas Johansson Heinö is a doctor in political science, publisher at Timbro publishing house and independent columnist on DN's editorial page.", "title_original": "Andreas Johansson Heinö: MP och SD är varandras motpoler – men två saker förenar dem", "summary_original": "Liksom KD och Ny Demokrati erbjöd SD och MP något genuint främmande när de tog plats i svensk politiks finrum – och bekämpades av etablissemanget. KOLUMNEN. Andreas Johansson Heinö är doktor i statsvetenskap, förläggare vid Timbro förlag och fristående kolumnist på DN:s ledarsida.", "link": "https://www.dn.se/ledare/andreas-johansson-heino-mp-och-sd-ar-varandras-motpoler-men-tva-saker-forenar-dem/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:04:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "The listed payment giant is being investigated for money laundering - linked to Swedish criminals", "summary": "One of Europe's leading payment companies, Wise, is being investigated for money laundering. The reason: Swedish and foreign network criminals, DN and the mining network EIC can reveal.", "title_original": "Börsnoterade betaljätten utreds för penningtvätt – kopplas till svenska kriminella", "summary_original": "Ett av Europas ledande betalföretag, Wise, utreds för penningtvätt. Orsaken: svenska och utländska nätverkskriminella, kan DN och grävnätverket EIC avslöja.", "link": "https://www.dn.se/ekonomi/borsnoterade-betaljatten-utreds-for-penningtvatt-kopplas-till-svenska-kriminella/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:04:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "New owner of the property at postal address Öresundsvägen 7 in Höllviken", "summary": "", "title_original": "Ny ägare till fastigheten på postadress Öresundsvägen 7 i Höllviken", "summary_original": "", "link": "https://www.sydsvenskan.se/ny-agare-till-fastigheten-pa-postadress-oresundsvagen-7-i-hollviken/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:03:06+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.sydsvenskan.se/nya-agare-till-villa-R6nhF/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:03:05+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.sydsvenskan.se/nya-agare-till-villa-2mkSa/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:02:58+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "124 square meter chain house in Åkarp sold", "summary": "", "title_original": "124 kvadratmeter stort kedjehus i Åkarp sålt", "summary_original": "", "link": "https://www.sydsvenskan.se/124-kvadratmeter-stort-kedjehus-i-akarp-salt/", "date_display": "2026-06-01", "date_iso": "2026-06-01T05:02:52+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Pensioners become richer: \"Working all the way\"", "summary": "Pensioners' purchasing power is increasing again and almost half a million Swedes can now call themselves \"job bonaires\", according to a survey from the occupational pension company Alecta. - Compared to ten years ago, a newly retired person typically has SEK 8,000 more a month to move around with, says the company's pension economist Staffan Ström.", "title_original": "Pensionärer blir rikare: ”Jobbar hela vägen”", "summary_original": "Pensionärernas köpkraft ökar igen och nästan en halv miljon svenskar kan nu kalla sig ” jobbonär”, visar en undersökning från tjänstepensionsbolaget Alecta. – Jämfört med för tio år sedan har en nybliven pensionär typiskt sett 8 000 kronor mer i månaden att röra sig med, säger bolagets pensionsekonom Staffan Ström.", "link": "https://www.dn.se/ekonomi/pensionarer-blir-rikare-jobbar-hela-vagen/", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:52:28+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Continued problems in the subway: \"Will be crowded\"", "summary": "Experts have been flown in from Germany and travelers were stuck on a train for several hours. The disruptions on the metro's red and green lines have led to a large number of train cancellations and delays over the weekend.  On Sunday, SL warned that the problem will continue on Monday when the weekday traffic starts again.  \"The signal failure between Old Town and Slussen on the subway's Red line will also affect traffic on Monday, with delays and canceled departures. The subway's Green line has a switch failure between Stora mossen and Alvik, which is causing delays. Be out in good time and expect congestion,\" reads the message.  \"It will be crowded\" SL's press manager Andreas Strömberg says on Monday morning that the problems remain.  - We have had fault rectifiers on site during the night, but we are now entering a morning traffic with a high risk of delays and canceled departures on the red line. It will be crowded, says Andreas Strömberg.  However, the hope on Monday is that traffic will be able to flow better on the green line than on previous days.  - Yesterday afternoon we had an error on the green line. We have been able to remedy that, but so far there are still some delays and canceled departures even on the green line, but there is a great possibility that we will increase capacity on green lines, says Andreas Strömberg.  The call to travelers ahead of Monday morning is to keep up to date with the latest traffic information. - Check the latest traffic information if you have the opportunity and check signs. There will be delays and congestion is expected.", "title_original": "Fortsatta problem i tunnelbanan: ”Kommer att bli trångt”", "summary_original": "Experter har flugits in från Tyskland och resenärer satt fast på ett tåg i flera timmar. Störningarna på tunnelbanans röda och gröna linjer har lett till ett stort antal inställda tåg och förseningar under helgen.  Under söndagen varnade SL för att problematiken kommer att fortsätta under måndagen när vardagstrafiken går igång igen.  ”Signalfelet mellan Gamla stan och Slussen på tunnelbanans Röda linje kommer att påverka trafiken även under måndagen, med förseningar och inställda avgångar. Tunnelbanans Gröna linje har ett växelfel mellan Stora mossen och Alvik, som orsakar förseningar. Var ute i god tid och räkna med trängsel”, lyder meddelandet.  ”Kommer att bli trångt” SL:s presschef Andreas Strömberg säger under måndagsmorgonen att problemen kvarstår.  – Vi har haft felavhjälpare på plats under natten men vi går in nu i en morgontrafik med stor risk för förseningar och inställda avgångar på röda linjen. Det kommer att bli trångt, säger Andreas Strömberg.  Förhoppningen under måndagen är dock att trafiken ska kunna rulla bättre på den gröna linjen än tidigare dagar.  – I går eftermiddag fick vi ett fel på gröna linjen. Det har vi kunnat åtgärda men än så länge så kvarstår det vissa förseningar och inställda avgångar även på den gröna linjen men det finns en stor möjlighet att vi ska komma upp i kapacitet på gröna, säger Andreas Strömberg.  Uppmaningen till resenärerna inför måndagsmorgonen är att hålla sig uppdaterade med den senaste trafikinformationen. – Kontrollera senaste trafikinformationen om man har den möjligheten och kontrollera skyltar. Det kommer att bli förseningar och man får räkna med trängsel.", "link": "https://www.tv4.se/artikel/2Xti0zvxZRTEHw57XqtHGl/fortsatta-problem-i-tunnelbanan-kommer-att-bli-trangt", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:34:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/stockholm", "/tunnelbana"]}, {"id": 113, "title": "Hemnet is losing ground – more homes are sold outside the platform", "summary": "Hemnet was for a long time the obvious choice for those who want to sell their home. But it doesn't look like that today. The platform has received harsh criticism for rampant ad prices and is now being challenged by the fast-growing \"soon to sell\" phenomenon. Did Hemnet get too greedy for its own good?", "title_original": "Hemnet tappar mark – fler bostäder säljs utanför plattformen", "summary_original": "Hemnet var länge det självklara valet för den som vill sälja sin bostad. Men så ser det inte ut i dag. Plattformen har fått hård kritik för skenande annonspriser och utmanas nu av det snabbväxande fenomenet ”snart till salu”. Blev Hemnet för giriga för sitt eget bästa?", "link": "https://www.dn.se/ekonomi/hemnet-tappar-mark-fler-bostader-saljs-utanfor-plattformen/", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:31:53+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Blacksmiths forge equipment for Ukraine", "summary": "The blows from the hammer echo over the farm in Husaby on Kinnekulle. In a small forge, the iron is heated to 1,400 degrees and shaped into wooden hooks that will be used to build bulletproof vests for Ukrainian soldiers at the front.\n\nTherese Engdahl runs \"Smedja Therese\" together with her husband and daughter. She is one of about 20 blacksmiths in Sweden and Norway who are part of the non-profit association Blacksmiths without Borders.\n\nThe association was formed after an emergency call from guild colleagues in Ukraine in the spring of 2022 and has since then also engaged several hundred private individuals. The help is collected in Rejmyre All material that is created or donated around the country is collected in Rejmyre outside Norrköping. There it is packed into donated or purchased vehicles and then driven down to Ukraine by volunteers. So far, 120 cars have been filled with everything from forging to tires, food and electrical equipment.\n\n- We also leave the cars in Lviv and get home in another way, explains Sebastian Jonsson, one of the volunteers in the association.\n\nOn June 1, the next convoy rolls from Rejmyre. This time there are five vehicles to be delivered and Sebastian Jonsson is one of the drivers.\n\n- It feels good to go, he says. \nThe gifts remain at a high level Organizations such as Unicef ​​and Save the Children tell Nyheterna that the gifts, after the first year's exceptional peak, have now stabilized at a high level. The blue and yellow car, which also runs down vehicles with stock, is even seeing an increase this year from an average of 35 to 40 cars per month.\n\nFor Pablo von Eckardstein, who coordinates this turnaround for Smeder without borders, getting behind the wheel was not a difficult choice.\n\n- No, it wasn't. It feels good to be able to contribute and help. \n\nAren't you worried?\n\n- No, not at all. There have never been any problems on the turns I've been on so far, concludes Pablo von Eckardstein.", "title_original": "Smeder smider materiel till Ukraina", "summary_original": "Slagen från hammaren ekar över gården i Husaby på Kinnekulle. I en liten smedja värms järnet till 1 400 grader och formas till timmerhakar som ska användas för att bygga skyttevärn åt ukrainska soldater vid fronten.\n\nTherese Engdahl driver ”Smedja Therese” tillsammans med sin man och dotter. Hon är en av ett 20-tal smeder i Sverige och Norge som ingår i den ideella föreningen Smeder utan gränser.\n\nFöreningen bildades efter ett nödrop från skråkollegor i Ukraina våren 2022 och har sedan dess även engagerat flera hundra privatpersoner. Hjälpen samlas i Rejmyre Allt materiel som skapas eller skänks runt om i landet samlas i Rejmyre utanför Norrköping. Där packas det in i donerade eller köpta fordon och körs sedan ned till Ukraina av volontärer. Hittills har 120 bilar fyllts med allt från smide till däck, mat och elverk.\n\n– Vi lämnar även bilarna i Lviv och tar oss hem på annat sätt, förklarar Sebastian Jonsson, en av volontärerna i föreningen.\n\nDen 1 juni rullar nästa konvoj från Rejmyre. Den här gången är det fem fordon som ska levereras och Sebastian Jonsson är en av chaufförerna.\n\n– Det känns bra att åka, säger han. \nGåvorna ligger kvar på hög nivå Organisationer som Unicef och Rädda barnen säger till Nyheterna att gåvorna, efter första årets exceptionella peak, nu stabiliserats på en hög nivå. Blågula bilen, som också kör ned fordon med materiel, ser till och med en ökning i år från i snitt 35 till 40 bilar per månad.\n\nFör Pablo von Eckardstein, som koordinerar den här vändan för Smeder utan gränser, var det inget svårt val att sätta sig bakom ratten.\n\n– Nej det var det inte. Det känns bra att kunna bidra och hjälpa till. \n\nÄr du inte orolig?\n\n– Nej, inte alls. Det har aldrig varit några problem på de vändor jag varit iväg hittills, avslutar Pablo von Eckardstein.", "link": "https://www.tv4.se/artikel/1IspWjZGwvb99htk7Sl1B3/smeder-smider-materiel-till-ukraina", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:30:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukraina", "/krig", "/ukrainakonflikten"]}, {"id": 115, "title": "Is Helsingborg about to become a donut city?", "summary": "THE COLUMN: When the city center is emptied of life and the arable land disappears under asphalt, we have to ask ourselves: What will really be left of Helsingborg?", "title_original": "Är Helsingborg på väg att bli en donut-stad?", "summary_original": "KOLUMNEN: När stadens centrum töms på liv och åkermarken försvinner under asfalt, måste vi fråga oss: Vad blir egentligen kvar av Helsingborg?", "link": "https://www.hd.se/opinion/ledare/ar-helsingborg-pa-vag-att-bli-en-donut-stad/", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Alex Schulman: Imagine putting a freshly laid egg in the prime minister's hand", "summary": "I can understand that Prime Minister Birgitta Ed wants chickens at Harpsund. Once you've held a freshly laid egg in your hand, you'll never forget it.", "title_original": "Alex Schulman: Tänk att få lägga ett nyvärpt ägg i statsministerns hand", "summary_original": "Jag kan förstå att statsministerfrun Birgitta Ed vill ha höns på Harpsund. Har man en gång hållit ett nyvärpt ägg i handen glömmer man det aldrig.", "link": "https://www.dn.se/sverige/alex-schulman-tank-att-fa-lagga-ett-nyvarpt-agg-i-statsministerns-hand/", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:13:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "SL warns: Continued problems in the subway", "summary": "", "title_original": "SL varnar: Fortsatta problem i tunnelbanan", "summary_original": "", "link": "https://www.svd.se/a/j0LEwb/fortsatta-problem-i-tunnelbanan", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:05:05+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 118, "title": "Report: Fewer fathers at the top are taking parental leave", "summary": "The higher up in the business world managers get, the less parental days they take. That's what the Allbright foundation writes in a new report. - As long as norms prevent men in leadership positions from taking parental leave, gender equality will continue to stall, says CEO Amanda Lundeteg.", "title_original": "Rapport: Färre pappor i toppen tar ut föräldraledighet", "summary_original": "Ju högre upp i näringslivet chefsmän kommer desto mindre föräldradagar plockar de ut. Det skriver stiftelsen Allbright i en ny rapport. – Så länge normer hindrar män i ledande position att ta ut föräldraledighet kommer jämställdheten fortsätta stanna av, säger vd:n Amanda Lundeteg.", "link": "https://www.dn.se/ekonomi/rapport-farre-pappor-i-toppen-tar-ut-foraldraledig "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 121, "title": "The Gulf countries no longer trust the US", "summary": "The US and Israel's war against Iran has shaken the whole world. But in the shadow of the conflict, new collaborations are emerging in the Middle East – pacts that could eventually reshape the entire region.", "title_original": "Gulfländerna litar inte längre på USA", "summary_original": "USA:s och Israels krig mot Iran har skakat om hela världen. Men i skuggan av konflikten växer nya samarbeten fram i Mellanöstern – pakter som på sikt kan komma att omforma hela regionen.", "link": "https://www.svd.se/a/6qBjR3/efter-trumps-krig-mot-iran-och-blockaden-av-hormuzsundet-byggs-nya-samarbeten-i-mellanostern", "date_display": "2026-06-01", "date_iso": "2026-06-01T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 122, "title": "More required when we dig gold in 2026", "summary": "This summer's World Cup is framed by Donald Trump, the war in the Middle East and a growing concern about AI. When SvD has to cover the world's biggest championship, the new era demands more from us.", "title_original": "Krävs mer när vi gräver guld 2026", "summary_original": "Sommarens fotbolls-VM ramas in av Donald Trump, kriget i Mellanöstern och en växande oro för AI. När SvD ska bevaka världens största mästerskap kräver den nya tiden mer av oss.", "link": "https://www.svd.se/a/lnMLvA/vm-i-fotboll-2026-sa-bevakar-svd-masterskapet", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:53:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 123, "title": "The World Cup frenzy became fuel for S: \"An extra kick\"", "summary": "Soccer World Cup in the USA. Financial concern. A bourgeois government that claims the economy is about to turn around.  It is strongly reminiscent of Sweden today. But the year is 1994.", "title_original": "VM-yran blev bränsle för S: ”En extra kick”", "summary_original": "Fotbolls-VM i USA. Ekonomisk oro. En borgerlig regering som hävdar att ekonomin är på väg att vända.  Det påminner starkt om Sverige i dag. Men året är 1994.", "link": "https://www.svd.se/a/JOlGb8/vm-1994-ingvar-carlsson-mona-sahlin-och-bo-lundgren-minns", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:51:21+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 124, "title": "Leader: It's time for an honest conversation about the limitations of healthcare", "summary": "One fifth of all healthcare provides little or no benefit to patients. With that money, we could shorten many care queues.", "title_original": "Ledare: Det är dags för ett ärligt samtal om sjukvårdens begränsningar", "summary_original": "En femtedel av all sjukvård ger liten eller ingen nytta för patienterna. De pengarna skulle vi kunna korta många vårdköer för.", "link": "https://www.dn.se/ledare/det-ar-dags-for-ett-arligt-samtal-om-sjukvardens-begransningar/", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:41:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Letter to the editor. Don't let American Palantir nest in our society", "summary": "LETTER TO THE EDITOR. The Swedish police's use of American-owned artificial intelligence for surveillance is a dangerous step. We must protect our democracy and not allow ourselves to be manipulated by the company Palantir, writes Iwan Langermo.", "title_original": "Insändare. Låt inte amerikanska Palantir nästla sig in i vårt samhälle", "summary_original": "INSÄNDARE. Den svenska polisens användning av amerikanskägd artificiell intelligens för övervakning är ett farligt steg. Vi måste värna om vår
