original": "Det här vet vi om dådet i Berlin", "summary_original": "Minst en person dödades när en bil med hög fart körde rakt in i ett pågående Prideevenemang i centrala Berlin. Det här är vad vi vet om händelsen:", "link": "https://www.dn.se/varlden/det-har-vet-vi-om-dadet-i-berlin-2/", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:43:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Ten days of Fedorov protests in Ukraine: \"Not about him\"", "summary": "Olena Chmykhun is one of many who have shown their dissatisfaction with the dismissal of Ukrainian Defense Minister Mykhajlo Fedorov. This weekend, the country's extensive protests have been going on for ten days. - It's not so much about Fedorov as a person - we started to believe in the possibility that it is possible to find new ways to make Ukraine's defense stronger, she tells DN.", "title_original": "Tio dagar av Fedorovprotester i Ukraina: ”Handlar inte om honom”", "summary_original": "Olena Chmykhun är en av många som visat sitt missnöje mot att Ukrainas försvarsminister Mykhajlo Fedorov avskedats. I helgen har landets omfattande protester pågått i tio dagar. – Det handlar inte så mycket om Fedorov som person – vi började tro på möjligheten att det går att hitta nya sätt att göra Ukrainas försvar starkare, säger hon till DN.", "link": "https://www.dn.se/varlden/tio-dagar-av-fedorovprotester-i-ukraina-handlar-inte-om-honom/", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:37:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Sofia Roberg: The withered garden can teach us something about the limits of growth", "summary": "Low water levels in combination with high tourism are currently guaranteeing disaster in many places in Europe. Sofia Roberg searches for moisture and drought in literature.", "title_original": "Sofia Roberg: Den vissna trädgården kan lära oss något om tillväxtens gränser", "summary_original": "Låga vattennivåer i kombination med hög turism borgar just nu för katastrof på många platser i Europa. Sofia Roberg söker efter fukt och torka i litteraturen.", "link": "https://www.dn.se/kultur/sofia-roberg-den-vissna-tradgarden-kan-lara-oss-nagot-om-tillvaxtens-granser/", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:24:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Leader: Politics should not be ruled by the dirty and slow", "summary": "Companies that want to change quickly risk losing, while fossil-heavy companies on the continent will be winners, if the EU Commission's proposal becomes a reality. It would be bad for Swedish steel companies and Europe's energy security.", "title_original": "Ledare: Politiken ska inte styras av de smutsiga och långsamma", "summary_original": "Företag som vill ställa om snabbt riskerar att förlora, medan fossiltunga bolag på kontinenten blir vinnare, om EU-kommissionens förslag blir verklighet. Det vore dåligt för svenska stålbolag och Europas energisäkerhet.", "link": "https://www.dn.se/ledare/politiken-ska-inte-styras-av-de-smutsiga-och-langsamma/", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:24:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Here, TV4's reporter swims – in the bathing water with parasites", "summary": "Experts are now warning that bath itch may increase with global warming. - You can imagine, in shallow water, that now that we have higher temperatures that the water will be warmer in Sweden. Then you can see activity of the caterpillar, maybe. So it is possible that we get more trouble the warmer the temperatures are, says pediatrician Stefan Rune to TV4 Nyheterna. Bath itch comes from a microscopic bird parasite that can end up on humans when we bathe in warm and shallow fresh water.\nBut that's nothing that worries bather Elton Odén.\n- It doesn't really matter, I don't think I'll get bitten or anything, he says. And the itching is not dangerous. You can neither die nor get permanent ones, but - on the other hand, it can be very itchy and reminiscent of mosquito bites. TV4 Nyheternas reporter Ossian Palmgren tests himself jumping into the water at Tanto beach in Stockholm to see if he gets any rashes on his body, but a few hours later he announces that there is no trace of any parasite.", "title_original": "Här simmar TV4:s reporter – i badvattnet med parasiter", "summary_original": "Experter varnar nu för att badklådan kan öka i och med den globala uppvärmningen. – Man kan ju tänka sig, i grunda vatten, att nu när vi har högre temperaturer att vattnet blir varmare i Sverige. Då kan man ju ser aktivitet av larven, kanske. Så det är möjligt att vi får mer besvär ju varmare temperturer vi får, säger barnläkaren Stefan Rune till TV4 Nyheterna. Badklåda kommer från en mikroskopisk fågelparasit som kan hamna på människor när vi badar i varmt och grunt sötvatten.\nMen det är inget som oroar badgästen Elton Odén.\n– Det spelar inte så stor roll, jag tror inte jag kommer bli biten eller nåt, säger han. Och klådan är inte farlig. Man kan varken dö eller få några bestående men – däremot kan det klia rejält och påminna om myggbett. TV4 Nyheternas reporter Ossian Palmgren testar själv att hoppa i vattnet vid Tanto strandbad i Stockholm för att se om han får några utslag på kroppen, men några timmar senare meddelar han att det inte finns något spår av någon parasit.", "link": "https://www.tv4.se/artikel/7C3LFsLAyRXLfqA7JWpmlR/haer-simmar-tv4-s-reporter-i-badvattnet-med-parasiter", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:10:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/medicin", "/bad", "/badplatser"]}, {"id": 128, "title": "26: Don't miss today's news", "summary": "Terrorist suspect 21-year-old shot dead in Berlin, French Bordeaux prepares for evacuation and the US reportedly pauses attacks - here are the news you can't miss from the day.", "title_original": "26: Missa inte dagens nyheter", "summary_original": "Terrormisstänkt 21-åring ihjälskjuten i Berlin, franska Bordeaux förbereder för evakuering och USA uppges pausa anfall – här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/26-missa-inte-dagens-nyheter/", "date_display": "2026-07-26", "date_iso": "2026-07-26T19:00:21+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Terror Expert: Almost impossible to prevent", "summary": "The deadly car attack at the pride celebration in Berlin could lead to more murders with jihadist motives in the near future, according to terror expert Hans Brun. - It triggers thoughts for other individuals with the same ideas.", "title_original": "Terrorexpert: Nästan omöjligt att förhindra", "summary_original": "Den dödliga bilattacken vid pridefirandet i Berlin kan leda till fler dåd med jihadistiska motiv i närtid, enligt terrorexperten Hans Brun. – Det triggar tankegångar för andra individer med samma idéer.", "link": "https://www.dn.se/varlden/terrorexpert-nastan-omojligt-att-forhindra/", "date_display": "2026-07-26", "date_iso": "2026-07-26T18:57:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Abdul Ballout, 21, shot dead by police - found in colony area", "summary": "The police on the suspected terrorist: Ran towards the task force • \"He died on the spot\"", "title_original": "Abdul Ballout, 21, ihjälskjuten av polis – hittades i koloniområde", "summary_original": "Polisen om misstänkte terroristen: Sprang mot insatsstyrkan •  ”Han dog på platsen”", "link": "https://www.tv4.se/artikel/6vDkmqgOCKDaTCaktJwQSR/abdul-ballout-21-ihjaelskjuten-av-polis", "date_display": "2026-07-26", "date_iso": "2026-07-26T17:38:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Terrordåd", "/terrordad"]}, {"id": 131, "title": "Unique clothing store for those who are tight", "summary": "The store outside Angered in Gothenburg is full of people looking among the clothes rails. New, unused clothes are sold here at a fraction of the price compared to regular stores. - It can be sample collections, for example. Or that it is something that was sold last year in a collection that is over or that a note has fallen off or the like, says Kajsa Johansson. \"Extremely positive treatment\" What makes the store unique is that the manufacturers donate the clothes to the store. And you can only shop here if you are financially tight. - You can apply on the Rescue Mission's website where you show your income and then we make an individual assessment in each case, explains Kajsa Johansson. - There has been a very positive response from the customers. That you can actually afford to go into a store and choose a new garment for yourself or your children and also afford to pay for yourself. It is an intrinsic value in itself that you do not get anything. The money the store receives goes to the Rescue Mission's social work, and the store also provides the opportunity for job training for people who have had difficulty getting a job. New EU rules From July 19, it is forbidden for clothing companies to destroy unsold clothes and shoes according to new EU rules. The idea is to reduce overproduction and save the environment, but here the clothes also become security. A customer who often returns is Susanne Pettersson. - I've been on sick leave or unemployed for a while, so this is great for the wallet. I love clothes!", "title_original": "Unik klädbutik för dem som har det tight", "summary_original": "Det är fullt av folk i butiken utanför Angered i Göteborg som letar bland klädstängerna. Här säljs nya, oanvända kläder till en bråkdel av priset mot i vanliga butiker. – Det kan vara provkollektioner, till exempel. Eller att det är något som sålts förra året i en kollektion som är över eller att en lapp har trillat av eller liknande, berättar Kajsa Johansson. ”Jättepositivt bemötande” Det som gör butiken unik är att tillverkarna skänker kläderna till butiken. Och här får man bara handla om man har det ekonomiskt tajt. – Man får ansöka på Räddningsmissionens hemsida där man visar sin inkomst och så gör vi en individuell bedömning i varje fall, förklarar Kajsa Johansson. – Det har varit jättepositivt bemötande bland kunderna. Att man faktiskt har råd att gå in i en butik och välja ett nytt plagg till sig själv eller sina barn och att också råd att betala för sig själv. Det är ett egenvärde i sig själv att man inte får någonting. De pengar butiken får in går till Räddningsmissionens sociala arbete och i butiken ges även möjlighet till arbetsträning för personer som haft svårt att få jobb. Nya EU-regler Från och med den 19 juli är det förbjudet för klädföretag att förstöra osålda kläder och skor enligt nya EU-regler. Tanken är att minska överproduktionen och spara miljö men här blir kläderna även en trygghet. En kund som ofta återkommer är Susanne Pettersson. – Jag har ju varit sjukskriven eller arbetslös ett tag så detta är jättebra för plånboken. Jag älskar kläder!", "link": "https://www.tv4.se/artikel/4IBMXTzQhb5yaBml4q8Dpw/unik-klaedbutik-foer-dem-som-har-det-tight", "date_display": "2026-07-26", "date_iso": "2026-07-26T17:06:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/privatekonomi", "/angered"]}, {"id": 132, "title": "The TV4 couple was at the pride celebration: \"Thought - not now again\"", "summary": "\"A completely different Berlin\"", "title_original": "TV4-paret var på pridefirandet: ”Tänkte – inte nu igen”", "summary_original": "”Ett helt annat Berlin”", "link": "https://www.tv4.se/artikel/59T8I43zH6ZuQ2rVVug8zU/tv4-paret-var-pa-pridefirandet-taenkte-inte-nu-igen", "date_display": "2026-07-26", "date_iso": "2026-07-26T16:19:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 133, "title": "Swedish firefighting aircraft in action against the fire: \"Difficult flight conditions\"", "summary": "Over 300,000 evacuated in France and Spain • \"Spread very quickly\"", "title_original": "Svenska brandflyg i insats mot elden: ”Svåra flygförhållanden”", "summary_original": "Över 300 000 evakuerade i Frankrike och Spanien • ”Spridit sig väldigt fort”", "link": "https://www.tv4.se/artikel/33BJSO3Ny98hb1TLR5IPvx/svenska-brandflyg-i-insats-mot-jaettebranden-svara-flygfoerhallanden", "date_display": "2026-07-26", "date_iso": "2026-07-26T16:14:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 134, "title": "Middle East expert warns: Heading towards the \"worst case scenario\"", "summary": "The situation in the Middle East is becoming increasingly tense. While the conflict between the US and Iran continues, fighting between Saudi Arabia and the Iran-backed Houthi rebels in Yemen has escalated. The latest development worries Middle East expert Alexander Atarodi. - Right now we are somewhere in the direction of this worst-case scenario, he says. \"Very serious\" According to Atarodi, this makes the development extra serious because the conflict risks affecting traffic through the Red Sea, one of the world's most important trade routes between Asia and Europe. - We have seen attacks from Yemen towards Israel before, in 2023, but this is a new front and very serious because it is about the Red Sea, trade and much more. The Huthi rebels have close links to Iran, says Atarodi. - This is a way for Iran to show that it not only controls the Strait of Hormuz, which is of course vital for the world markets, for oil and gas, but also, via the Houthi rebels, controls the Mandab Strait, which is extremely important for world trade, not only for oil and gas but for global trade. The US can step up According to Atarodi, the US faces several choices. - One is to continue the attacks. Now there has been a break for a couple of days. But we don't know if they will come back, he says. At the same time, there is a risk that the conflict will escalate further. - The other option that the US has is, of course, to go in very strongly and escalate, quite simply.  If that happens, the consequences could be significantly greater than so far. - Then we are talking about a really, really serious situation that affects both the Strait of Hormuz, the region but also the world economy via the Mandab Strait. Can disrupt world trade Militarily, the Houthi rebels are no match for the United States, states Atarodi. - If there's anything we've learned, it's that no one can use military force against the United States. That matter is settled. But he warns that smaller actors can still cause great damage without being able to compete militarily with the United States. - Now we have a situation where Iran has", "title_original": "Mellanösternexperten varnar: På väg mot ”värsta scenariot”", "summary_original": "Läget i Mellanöstern blir allt mer spänt. Samtidigt som konflikten mellan USA och Iran fortsätter har striderna mellan Saudiarabien och de Iranstödda huthirebellerna i Jemen trappats upp. Den senaste utvecklingen oroar Mellanösternexperten Alexander Atarodi. – Just nu så är vi någonstans där i riktningen mot det här värsta scenariot, säger han. ”Mycket allvarligt” Enligt Atarodi gör det utvecklingen extra allvarlig eftersom konflikten riskerar att påverka trafiken genom Röda havet, en av världens viktigaste handelsvägar mellan Asien och Europa. – Vi har sett attacker från Jemen gentemot Israel tidigare, 2023, men det här är en ny front och mycket allvarligt för det handlar om Röda havet, handel och mycket annat. Huthirebellerna har nära kopplingar till Iran, säger Atarodi. – Det här är ett sätt för Iran att visa att man inte bara kontrollerar Hormuzsundet, vilket naturligtvis är vitalt för världsmarknaderna, för olja och gas, men också att via huthirebellerna kontrollera Mandabsundet som är oerhört viktigt för världshandeln, inte bara för olja och gas utan för global handel. USA kan trappa upp Enligt Atarodi står USA inför flera vägval. – Ett är att fortsätta attackerna. Nu har det varit paus ett par dagar. Men vi vet inte om de kommer tillbaka, säger han. Samtidigt finns risken att konflikten trappas upp ytterligare. – Det andra alternativet som USA har är att naturligtvis gå in väldigt kraftigt och eskalera, helt enkelt.  Om det sker kan konsekvenserna bli betydligt större än hittills. – Då pratar vi om ett riktigt, riktigt allvarligt läge som påverkar både Hormuzsundet, regionen men också världsekonomin via Mandabsundet. Kan störa världshandeln Militärt kan huthirebellerna inte mäta sig med USA, konstaterar Atarodi. – Är det nånting vi har lärt oss är att ingen kan sätta militära krafter gentemot USA. Den saken är klar. Men han varnar för att mindre aktörer ändå kan orsaka stor skada utan att kunna mäta sig militärt med USA. – Nu har vi en situation där Iran har visat för huthirebeller att det går att störa världshandeln och hålla världsekonomin gisslan. Enligt Atarodi kan en svagare part slå mot handel, transporter och ekonomi i stället för att möta en motståndare militärt. – I händelse av att USA eskalerar kan den assymmetriska krigföringen komma in och störa både Hormuzsundet och Mandabsundet. Ser fortfarande en diplomatisk väg ut Trots den allvarliga utvecklingen utesluter Atarodi inte att konflikten kan bromsas. – Det gröna scenariot, det bästa scenariot, är inte helt uteslutet även om vi har rört oss mot det värsta scenariot.  För att det ska ske måste både Washington och Teheran se nackdelarna med en fortsatt upptrappning.  – De två faktorerna måste finnas på plats för att diplomatin ska komma tillbaka igen, säger Atarodi.", "link": "https://www.tv4.se/artikel/3V3GZpUeDwoOU6z7kUHgPq/mellanoesternexperten-varnar-pa-vaeg-mot-vaersta-scenariot", "date_display": "2026-07-26", "date_iso": "2026-07-26T14:27:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/iran", "/irankriget", "/utrikespolitik", "/tyskland", "/krig", "/usa", "/jemen", "/saudiarabien"]}, {"id": 135, "title": "The terror researcher warns of new attacks", "summary": "The crime an \"Islamist terrorist attack\" • Hans Brun: Not surprised - high threat image in Europe", "title_original": "Terrorforskaren varnar för nya attacker", "summary_original": "Dådet en ”islamistisk terrorattack” • Hans Brun: Inte förvånad – hög hotbild i Europa", "link": "https://www.tv4.se/artikel/1597DoBEFu4RHb2JuZTVh3/terrorforskaren-varnar-foer-nya-attacker-maste-vara-pa-ta", "date_display": "2026-07-26", "date_iso": "2026-07-26T13:06:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 136, "title": "Pradeep, 22, took his own life – following the minister's decision", "summary": "The cockroaches have survived everything. After weeks of packed streets in New Delhi, tear gas and arrests of protesters, the Modi government today bowed to the pressure. The Minister of Education resigns - and for the movement the victory is a fact. The name \"the cockroaches\" began as a mockery after young unemployed activists were compared to parasites. But Generation Z took over the word and made it a symbol of resistance – and the movement's unofficial name. \"Best news in all of India\" It all started when yet another national medical entrance exam was leaked and pressured students were forced to retake the exam. Every year, over two million Indian youth write NEET – the pathway to the medical and dental schools. But the places are few: around 130,000 for medical education and a few more for dental education. In a young India where many graduates lack jobs, a doctor's place can be the ticket to a completely different life - at the same time, failure can crush hope for the future. Student Srishti, 23, says the protests have been a great success for her and her peers. - We did the NEET exam last year, and again the exam was leaked. We've struggled with anxiety and depression - only we know how we got through it. Therefore, this is the best news in all of India, she says. Pradeep, 22, took his own life For 22-year-old Pradeep Kumar, the dream was to become a doctor. He left home and moved to Sikar to devote himself entirely to the preparations for the decisive test. His father sold land and took out loans to finance his son's dream. But when the test was questioned and the results stopped, the pressure finally became too great. On May 15, Pradeep took his own life. - This broken system took my child's life, says his father Rajesh.", "title_original": "Pradeep, 22, tog sitt liv – efter ministerns beslut", "summary_original": "Kackerlackorna har överlevt allt. Efter veckor av fyllda gator i New Delhi, tårgas och gripanden av demonstranter vek sig i dag Modi-regeringen för trycket. Utbildningsministern avgår – och för rörelsen är segern ett faktum. Namnet \"kackerlackorna\" började som ett hån efter att unga arbetslösa aktivister jämförts med parasiter. Men generation Z tog över ordet och gjorde det till en symbol för motstånd – och rörelsens inofficiella namn. ”Bästa nyheten i hela Indien” Det hela började när ännu ett nationellt antagningsprov till läkarutbildningen läckte och pressade studenter tvingades göra om provet. Varje år skriver över två miljoner indiska ungdomar NEET – vägen till läkar- och tandläkarutbildningarna. Men platserna är få: omkring 130 000 till läkarutbildningen och ytterligare ett fåtal till tandläkarutbildningen. I ett ungt Indien där många akademiker saknar jobb kan en läkarplats bli biljetten till ett helt annat liv – samtidigt kan ett misslyckande krossa framtidshoppet. Studenten Srishti, 23, säger att protesterna varit en stor framgång för henne och hennes kamrater. – Vi gjorde NEET-provet förra året, och återigen läckte provet. Vi har kämpat med ångest och depression – bara vi själva vet hur vi lyckades ta oss igenom det. Därför är det här den bästa nyheten i hela Indien, säger hon. Pradeep, 22, tog sitt liv För 22-årige Pradeep Kumar var drömmen att bli läkare. Han lämnade hemmet och flyttade till Sikar för att ägna sig helt åt förberedelserna inför det avgörande provet. Hans pappa sålde mark och tog lån för att finansiera sonens dröm. Men när provet ifrågasattes och resultaten stoppades blev pressen till slut för stor. Den 15 maj tog Pradeep sitt liv. – Det här havererade systemet tog mitt barns liv, säger hans pappa Rajesh.", "link": "https://www.tv4.se/artikel/1gOGRXgd6M5ulrhW1O86V1/pradeep-22-tog-sitt-liv-efter-ministerns-beslut", "date_display": "2026-07-26", "date_iso": "2026-07-26T11:12:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/indien", "/protester"]}, {"id": 137, "title": "Thousands protest in Palma - against mass tourism", "summary": "Behind tonight's demonstration are organizations that want to see a better balance between tourism and the needs of the local population. According to the organizers, it is not tourism itself that is criticized, but the lack of regulation and the negative effects that mass tourism brings. - What you want is for the politicians to regulate, control, and make sure that it happens in a socially and economically and perhaps also environmentally sustainable way, says Per J Andersson, editor of Vagabond. \"Activists are heard more\" During the pandemic, Mallorca was hit hard when tourism came to a halt and many lost their jobs. Now, when the number of visitors is again at record levels, the activists point to the danger of being too dependent on a single industry. TV4's reporter Johan Macéus, on location in Palma, believes that most tourists do not notice the dissatisfaction in the form of threats and hatred: - I have spoken to many, both residents and tourists, who neither recognize hatred nor threats nor notice it when you are down here. On the contrary. Many are of course received as tourists and very well too. - These activists are heard more. Partly because we in the international media take this up. There's a discussion going on in the local media down here, of course. But also in social media, you hear more. But as a tourist, you don't notice it, says Johan Macéus. The housing market in focus One of the biggest questions concerns the housing market. As the demand for vacation rentals increases, prices soar, making it difficult for locals to find housing. Many who work in tourism cannot afford to live on the island all year round and are forced to temporary solutions. - There are many people who work in the service industry in Mallorca who cannot afford to get a real home, who live in campervans and the like to be able to afford to be there, says Per J Andersson. One of the demands from the protesters is that the politicians invest in more affordable housing, for example rental properties, so that the local population can afford to stay on the island", "title_original": "Tusentals protesterar i Palma – mot massturism", "summary_original": "Bakom kvällens demonstration står organisationer som vill se en bättre balans mellan turism och lokalbefolkningens behov. Enligt arrangörerna är det inte turismen i sig som kritiseras, utan bristen på reglering och de negativa effekter som massturismen för med sig. – Det man vill är ju att politikerna ska reglera, kontrollera , och se till att det sker på ett socialt och ekonomiskt och kanske också miljömässigt hållbart sätt, säger Per J Andersson, redaktör för Vagabond. ”Aktivisterna hörs ju mer” Under pandemin drabbades Mallorca hårt när turismen tvärstannade och många förlorade sina jobb. Nu, när antalet besökare åter är på rekordnivåer, pekar aktivisterna på risken med att vara alltför beroende av en enda näring. TV4:s reporter Johan Macéus, på plats i Palma menar att flesta turister inte märker av missnöjet i form av hot och hat: – Jag har pratat med många, både bofasta och turister som inte heller känner igen varken hat eller hot eller märker det när man är här nere. Tvärtom. Många tas naturligtvis emot som turister och väldigt väl också. –  De här aktivisterna hörs ju mer. Dels för att vi i internationella medier tar upp det här. Det pågår en diskussion i lokal media här nere, naturligtvis. Men också i sociala medier så hörs det ju mer. Men som turist så märker man inte av det, säger Johan Macéus. Bostadsmarknaden i fokus En av de största frågorna gäller bostadsmarknaden. När efterfrågan på semesterboenden ökar skjuter priserna i höjden, vilket gör det svårt för lokalbefolkningen att hitta bostad. Många som arbetar inom turismen har inte råd att bo på ön året runt och tvingas till tillfälliga lösningar. – Det är många som jobbar inom servicenäringen på Mallorca  som inte har råd att skaffa sig en riktig bostad som bor i campervans och liknande för att ha råd att vara där, säger Per J Andersson. Ett av kraven från demonstranterna är att politikerna ska satsa på fler prisvärda bostäder, till exempel hyresrätter, så att lokalbefolkningen har råd att bo kvar på ön. Samtidigt lyfts frågan om hållbarhet – att infrastrukturen måste klara den ökade belastningen från turismen. – Det handlar om att vattenförsörjningen ska funka, trafik, avfall, allt sånt. Det ska funka för så många människor samtidigt och inte drabba vanliga Mallorca-bor, säger Johan Macéus.", "link": "https://www.tv4.se/artikel/rul1c3WK19kEIx38KaOV2/ikvaell-protesterar-tusentals-i-palma-mot-oeverturisism", "date_display": "2026-07-26", "date_iso": "2026-07-26T10:09:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/mallorca", "/palma", "/turism"]}, {"id": 138, "title": "Free playground lunch in Finland - summer support for families with children", "summary": "It's 12 o'clock and it's time for lunch in the playground a stone's throw from central Oulu in northern Finland. There, and in two other playgrounds, the municipality serves free lunch to children under 18 this summer. Today, mashed potatoes and minced meat sauce are served, yesterday it was chicken pasta. Support when school meals go on hiatus – In the summer there is no free school lunch, so it can be a difficult time for some families financially. That's why we want to offer lunch for those families but also summer activities for all families, says Sonja Nuottila, coordinator of the playground lunches in Oulu.\n\nThe Finnish tradition of free playground lunches during the summer holidays began in Helsinki in connection with the Second World War and stretches back over 80 years. Today, over 4,000 children eat playground lunches daily in the Finnish capital, during the summer holidays, and in recent years the phenomenon has spread to several other cities. \"It's a good saving\" In Oulu, it is the third summer in a row that the municipality is offering free playground lunches.\n\n- This is a really nice concept. First we can play in the park and then the kids can eat this good food and I don't have to cook. It's really nice, says Tuula Hyväri.\n\n- It is a good saving. We have four children so that is a big saving. And then you don't have to be at home and cook before lunchtime. You can only spend the nice sunny days outside and the children have free lunch here, says Susanna Ainesmaa.\n\nA report from, among others, Rädda Barnen and Hyresgästföreningen states that many Swedish families with children find it difficult to afford food and leisure activities during the summer holidays. In Oulu, the municipality sees that the free playground lunches both alleviate financial stress and create new contacts between families.\n\n- According to my experience, this has been great. Besides the fact that many are grateful for free food, the children find new friends and families meet each other, says Sonja Nuottila. On the question of more cities away take after Helsinki and U", "title_original": "Gratis lekparkslunch i Finland – sommarstöd för barnfamiljer", "summary_original": "Klockan har slagit 12 och det är dags för lunch i lekparken ett stenkast från centrala Uleåborg i norra Finland. Där, och i ytterligare två lekparker, serverar kommunen gratis lunch till barn under 18 år i sommar. I dag serveras potatismos och köttfärssås, i går var det kycklingpasta. Stöd när skolmaten tar paus – På sommaren finns det ingen gratis skollunch, så det kan vara en svår tid för vissa familjer ekonomiskt. Därför vi vill erbjuda lunch för de familjerna men också sommaraktiviteter för alla familjer, säger Sonja Nuottila, samordnare för lekparksluncherna i Uleåborg.\n\nDen finska traditionen med gratis lekparkslunch under sommarlovet började i Helsingfors i samband med andra världskriget och sträcker sig över 80 år tillbaka. I dag är det över 4 000 barn som dagligen äter lekparkslunch i den finska huvudstaden, under sommarlovet, och de senaste åren har fenomenet spritt sig till flera andra städer. \"Det är en bra besparing\" I Uleåborg är det tredje sommaren i rad som kommunen bjuder på gratis lekparkslunch.\n\n– Det här är ett riktigt fint koncept. Först kan vi leka i parken och sedan kan barnen äta den här goda maten och jag behöver inte laga mat. Det är riktigt skönt, säger Tuula Hyväri.\n\n– Det är en bra besparing. Vi har fyra barn så det är en stor besparing. Och då behöver du inte vara hemma och laga mat innan lunchtid. Du kan bara spendera de fina soliga dagarna ute och så har barnen gratis lunch här, säger Susanna Ainesmaa.\n\nEn rapport från bland annat Rädda Barnen och Hyresgästföreningen slår fast att många svenska barnfamiljer har svårt att ha råd med mat och fritidsaktiviteter under sommarlovet. I Uleåborg ser kommunen att de gratis lekparksluncherna både mildrar ekonomisk stress och skapar nya kontakter mellan familjer.\n\n– Enligt min erfarenhet har det här varit jättebra. Förutom att många är tacksamma över gratis mat så hittar barnen nya vänner och familjer möter varandra, säger Sonja Nuottila. På frågan om fler städer borta ta efter Helsingfors och Uleåborg är mamman Susanna Ainesmaas svar givet.\n– Ja, definitivt!", "link": "https://www.tv4.se/artikel/5q0BGGCoPfJbrwsd0DDI4i/gratis-lekparkslunch-i-finland-sommarstoed-foer-barnfamiljer", "date_display": "2026-07-26", "date_iso": "2026-07-26T10:02:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Finland", "/natodebatten/finland"]}, {"id": 139, "title": "This is how the sense of smell affects your mood - becomes stronger during the summer", "summary": "The human sense of smell is there to protect us from danger and help us find things that benefit us. When we are hungry, the sense of smell is sharpened, especially for food smells, and the sense of smell can also become stronger during the summer. - We have a very good sense of smell if you compare it to other animals. We have almost the best sense of smell in the entire animal world, says Johan Lundström, professor Karolinska Institutet. Train your sense of smell Despite that, many scents pass us by in everyday life. The brain sorts out a lot, but the information is still registered and affects us, both psychologically and biologically. The sense of smell can also be trained. Just like a muscle, you get better the more you practice. - If you smell a lot of wine smells, you will be good at detecting and feeling the difference between wine smells, but maybe not motor oils, says Johan Lundström. Indication of illness The differences between people are great. In addition, your sense of smell can deteriorate significantly over the course of the day, the smell in the morning can be something completely different than in the evening. Sight also plays a crucial role in what we think we feel, it is much more difficult to identify, for example, spices without seeing them. Better general health often means a better sense of smell, and studies indicate that physical exercise can strengthen the sense of smell. A reduced sense of smell can instead be an early signal of illness, for example Parkinson's, Alzheimer's or MS, but also of mental illness such as depression. - But that does not mean that if you have a bad sense of smell you have these diseases, but if you have these diseases you almost always have a bad sense of smell. Great emotional significance Smells also have a special shortcut in the brain. Compared to other senses, they have an unusually close connection to areas of memory and emotion. This means that scents can evoke emotions quickly and strongly. - This means that it is very difficult to remember smells. But the smells you remember are often emotional and you remember them very strongly, says Johan Lundström. - You know about this, for example", "title_original": "Så påverkar luktsinnet ditt mående – blir starkare under sommaren", "summary_original": "Människans luktsinne är till för att skydda oss från faror och hjälpa oss att hitta sådant som gynnar oss. När vi är hungriga skärps lukten, särskilt för matdofter, och luktsinnet kan också bli starkare under sommaren. – Vi har ett jättebra luktsinne om man jämför med övriga djur. Vi har nästan det bästa luktsinnet i hela djurvärlden, säger Johan Lundström, professor Karolinska institutet. Träna ditt luktsinne Trots det går många dofter oss förbi i vardagen. Hjärnan sorterar bort mycket, men informationen registreras ändå och påverkar oss, både psykiskt och biologiskt. Luktsinnet går också att träna upp. Precis som med en muskel blir man bättre ju mer man övar. – Luktar du mycket på vinlukter blir du bra på att detektera och känna skillnad mellan vinlukter, men kanske inte  på motoroljor, säger Johan Lundström. Indikation på sjukdom Skillnaderna mellan människor är stora. Dessutom kan ditt luktsinne försämras kraftigt över dygnet,  lukten på morgonen kan vara något helt annat än på kvällen. Synen spelar också en avgörande roll för vad vi tror att vi känner, det är mycket svårare att identifiera till exempel kryddor utan att se dem. Bättre allmänhälsa innebär ofta ett bättre luktsinne och studier pekar på att fysisk träning kan stärka lukten. Ett försämrat luktsinne kan istället vara en tidig signal om sjukdom, till exempel Parkinson, Alzheimers eller MS, men även om psykisk ohälsa som depression. – Men det innebär inte att har man dåligt luktsinne har man de här sjukdomarna, men har man de här sjukdomarna har man nästan alltid dåligt luktsinne. Stor emotionell betydelse Lukter har dessutom en särskild genväg i hjärnan. Jämfört med andra sinnen har de en ovanligt tät koppling till områden för minne och känslor. Det gör att dofter kan väcka känslor snabbt och starkt. – Det innebär att det är väldigt svårt att minnas lukter. Men de lukter man kommer ihåg är ofta emotionella och de kommer man ihåg väldigt starkt, säger Johan Lundström. – Det här vet man om i till exempel marknadsföring och vi använder parfymer, nästan allihop av oss, för att trigga en positiv reaktion hos mottagaren. Att man slutar märka sin egen parfym efter en stund är heller inget mysterium. Luktsinnet är byggt för att upptäcka förändring – när hjärnan redan har tolkat en doft som ofarlig eller positiv behöver hjärnan inte fortsätta lägga energi på den.", "link": "https://www.tv4.se/artikel/2vwCOPuy6xI3Bu2R89twN2/daerfoer-paverkar-luktsinnet-ditt-maende", "date_display": "2026-07-26", "date_iso": "2026-07-26T08:23:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/mental-halsa", "/idrott-och-halsa", "/psykisk-halsa", "/kroppen", "/halsa"]}, {"id": 140, "title": "One dead after a car attack in Berlin – suspected Islamist being hunted", "summary": "Religious motives may be behind attack on crowd", "title_original": "En död efter bilattack i Berlin – misstänkt islamist jagas", "summary_original": "Religiösa motiv kan ligga bakom attack mot folkmassa", "link": "https://www.dagen.se/nyheter/en-doed-efter-bilattack-i-berlin-misstaenkt-islamist-jagas/10454904", "date_display": "2026-07-26", "date_iso": "2026-07-26T07:53:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 141, "title": "Study: Antidepressants can make rats aggressive", "summary": "Medicines that people use do not always disappear when they are flushed down the drain. Residues of medicines can get further into nature and end up in the bodies of wild animals. Now a study from Sweden's Agricultural University, SLU, shows that more than half of 152 rats examined in Brazil carried antibiotics or other drug residues. The researchers found clear connections between drug residues and the occurrence of certain infections. - First of all, we found that rats that wore an antidepressant called Citalopram had a three times higher risk of a kind of parasitic infection called capillaria. And then on the contrary, we found that rats with antibiotic substances in them had a 91 percent lower risk of a type of bacterial infection called leptospira, says Anna Jonsson Sundberg. Can affect the rats' behavior The researchers believe that the drug residues can also affect the rats' behavior and thus how infectious agents are spread between animals. - Since we saw an effect of antidepressants that increased the risk of infection by a parasite, you can guess that it might have something to do with the rats becoming more fearless, social, aggressive, that they interact more with other rats in a way that increases the spread of infection, she says. The findings raise questions about the consequences pharmaceutical contamination can have for both animals and humans. Since rats are known carriers of several diseases, changes in their behavior and infection patterns can have implications far beyond the environments in which the animals live. \"The rat is perhaps the most dangerous\" And although thoughts easily go to large predators that are affected by drugs, the researcher believes that the biggest threat may be much smaller than that. - If you have to think about which animal would be most dangerously affected by drugs, you might think of something big and aggressive. But if I can think more globally and about indirect dangers such as infectious diseases that affect a lot of people, I would still say that the rat is perhaps the most dangerous, says Anna", "title_original": "Studie: Antidepp kan göra råttor aggressiva", "summary_original": "Läkemedel som människor använder försvinner inte alltid när de spolas ner i avloppen. Rester av mediciner kan ta sig vidare ut i naturen och hamna i kroppen på vilda djur. Nu visar en studie från Sveriges lantbruksuniversitet, SLU, att mer än hälften av 152 undersökta råttor i Brasilien bar på antibiotika eller andra läkemedelsrester. Forskarna fann tydliga samband mellan läkemedelsrester och förekomsten av vissa infektioner. – Först och främst så hittade vi att råttor som bar på ett antidepressivt ämne som heter Citalopram fick en tre gånger högre risk för en slags parasitisk infektion som heter kapillaria. Och sen tvärtom så hittade vi att råttor med antibiotiska ämnen i sig hade 91 procent lägre risk för en slags bakterieinfektion som heter leptospira, säger Anna Jonsson Sundberg. Kan påverka råttornas beteende Forskarna tror att läkemedelsresterna också kan påverka råttornas beteende och därmed hur smittämnen sprids mellan djur. – I och med att vi såg en effekt av antidepressiva som ökade infektionsrisken av en parasit så kan man ju gissa då att det kanske har någonting med att råttorna blir mer orädda, sociala, aggressiva, att de interagerar mer med andra råttor på ett sätt som ökar smittspridningen, säger hon. Fynden väcker frågor om vilka konsekvenser läkemedelsföroreningar kan få för både djur och människor. Eftersom råttor är kända bärare av flera sjukdomar kan förändringar i deras beteende och infektionsmönster få betydelse långt utanför de miljöer där djuren lever. \"Råttan kanske är farligast\" Och även om tankarna lätt går till stora rovdjur som påverkas av läkemedel, menar forskaren att det största hotet kan vara betydligt mindre än så. – Om man ska tänka på vilket djur som vore farligast påverkat av läkemedel så tänker man kanske på något stort och aggressivt. Men om jag får tänka mer globalt och på indirekta faror som till exempel infektionssjukdomar som påverkar väldigt många människor så skulle jag ändå säga att råttan kanske är farligast, säger Anna Jonsson Sundberg.", "link": "https://www.tv4.se/artikel/3Iaa5ePcCXAfKvHSJ2KD9q/studie-antidepp-kan-goera-rattor-aggressiva", "date_display": "2026-07-26", "date_iso": "2026-07-26T05:19:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/forskning", "/lakemedel", "/rattor"]}, {"id": 142, "title": "63-year-old with the fitness of a well-trained 20-year-old", "summary": "It's a little slower, but Børge Ousland is still just as tough. Now the soon-to-be 64-year-old polar explorer is attracting attention with new test results.", "title_original": "63-åring med kondition som vältränad 20-åring", "summary_original": "Det går lite långsammare, men Børge Ousland är fortfarande lika seg. Nu väcker den snart 64-årige polarfararen uppmärksamhet med nya testresultat.", "link": "https://www.svd.se/a/2pmV8a/boerge-ousland-63-har-kondition-som-en-valtranad-20-aring", "date_display": "2026-07-26", "date_iso": "2026-07-26T04:56:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Livet"]}, {"id": 143, "title": "Greek Orthodox metal priest is a hit among music lovers", "summary": "\"I have never had any ambitions to be famous.\"", "title_original": "Grekisk-ortodox metalpräst gör succé bland musikälskare", "summary_original": "”Jag har aldrig haft några ambitioner att bli berömd.”", "link": "https://www.dagen.se/kultur/grekisk-ortodox-metalpraest-goer-succe-bland-musikaelskare/10451609", "date_display": "2026-07-26", "date_iso": "2026-07-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "Emmy Stiernblad:\nWithout the hope of eternity, life becomes unbearable", "summary": "'Already during the time of the Old Testament it was known that the simple solution will never be found with a medium'", "title_original": "Emmy Stiernblad:\nUtan hoppet om evigheten blir livet outhärdligt", "summary_original": "'Redan under Gamla testamentets tid visste man att den enkla lösningen aldrig kommer att finnas hos ett medium'", "link": "https://www.dagen.se/kultur/emmy-stiernblad-utan-hoppet-om-evigheten-blir-livet-outhaerdligt/10409305", "date_display": "2026-07-26", "date_iso": "2026-07-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 145, "title": "The parish is shaken by the second child pornography scandal in six months", "summary": "Former employee indicted • A priest in the same parish was indicted last spring.", "title_original": "Församling skakas av andra barnporrskandalen på ett halvår", "summary_original": "Tidigare anställd åtalad • Präst i samma församling åtalades i våras.", "link": "https://www.dagen.se/nyheter/foersamling-skakas-av-andra-barnporrskandalen-pa-ett-halvar/10453457", "date_display": "2026-07-26", "date_iso": "2026-07-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "American pastor sues OpenAI – was given 'dangerous advice' by ChatGPT", "summary": "Christians in the US use AI to a greater extent than the general population.", "title_original": "Amerikansk pastor stämmer OpenAI – fick 'farliga råd' av ChatGPT", "summary_original": "Kristna i USA använder AI i större utsträckning än befolkningen i stort.", "link": "https://www.dagen.se/nyheter/amerikansk-pastor-staemmer-openai-fick-farliga-rad-av-chatgpt/10451673", "date_display": "2026-07-26", "date_iso": "2026-07-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 147, "title": "Målle's memorial bench will be inaugurated in August", "summary": "Honored in Nässjö Hembygdspark • Singing, music and local politicians on site.", "title_original": "Målles minnesbänk invigs i augusti", "summary_original": "Hedras i Nässjö hembygdspark • Sång, musik och lokala politiker på plats.", "link": "https://www.dagen.se/nyheter/malles-minnesbaenk-invigs-i-augusti/10454127", "date_display": "2026-07-26", "date_iso": "2026-07-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 148, "title": "The military expert on Ukraine's new warfare: \"Clean\"", "summary": "During the past six months, Ukraine has focused on striking Russian oil facilities - but now the strategy has been broadened to also include e-commerce companies, which is becoming tangible for the Russian population. Last weekend, two of Wildberry's facilities, one east of Moscow and one in Kotovsk, collided, leading to heavy fires, eight deaths and major material losses. - This means that the little man in Russia is affected to a large extent, says Johan Huovinen, lieutenant colonel and military teacher at the Norwegian Defense Academy. Ukraine: Legitimate targets Wildberries, often called the \"Amazon of Russia,\" have allowed companies to sell military products such as uniforms, flak jackets and drones through their warehouses. Therefore, these facilities are considered legitimate targets under international law, even if only a few companies in the warehouse sell military equipment. - You have to be honest and say that Ukraine is playing along. It is clear that it has been identified, says Johan Huovinen. Becoming aware of Putin's war The Ukrainian attacks have resulted in many civilian small business owners losing their income as their warehouses are destroyed. - Civilians don't die from this, but on the other hand, civilians who had perhaps a small \"small pocket business\" are affected, and that makes them aware that Putin's war in Ukraine affects them too, says Johan Huovinen. According to Ukraine, the attacks against Russian targets are meant to damage Russia's war effort and force the country to negotiate, AFP reports.  Huovinen adds that Ukraine hopes to create an opinion within the Russian people. - One hopes from the Ukrainian side that this will spread their discontent among ordinary Russians, so to speak. That they don't like the regime, says Huovinen. Different strategies and resources Ukraine does not have enough resources to carry out attacks as large-scale as Russia, but instead must choose its targets more carefully. - Russia is a typical commodity nation. You sell oil, gas, timber, gold, d", "title_original": "Militärexperten om Ukrainas nya krigföring: ”Klockrent”", "summary_original": "Ukraina har under det senaste halvåret riktat in sig på att slå mot ryska oljeanläggningar – men nu har strategin breddats till att även omfatta e-handelsföretag, vilket blir påtagligt för den ryska befolkningen. Förra helgen träffades två av Wildberries anläggningar, en öster om Moskva och en i Kotovsk, vilket ledde till kraftiga bränder, åtta döda och stora materiella förluster. – Det här innebär att då drabbas ju den lilla människan i Ryssland i stor utsträckning, säger Johan Huovinen, överstelöjtnant och militär lärare på Försvarshögskolan. Ukraina: Legitima mål Wildberries, som ofta kallas ”Rysslands Amazon”, har tillåtit företag att sälja militära produkter som uniformer, skyddsvästar och drönare via sina lager. Därför betraktas dessa anläggningar som legitima mål enligt folkrätten, även om endast ett fåtal företag i lagret säljer militär materiel. – Man måste vara ärlig och säga att Ukraina spelar ju med. Det är klockrent att man har identifierat det, säger Johan Huovinen. Blir medvetna om Putins krig De ukrainska attackerna har lett till att många civila småföretagare förlorat sina inkomster när deras lager förstörts. – Civila människor dör inte utav detta men däremot så drabbas civila människor som då haft kanske en liten ”small pocket business” och det gör då att de blir medvetna om att Putins krig i Ukraina drabbar dem också, säger Johan Huovinen. Enligt Ukraina är angreppen mot ryska mål tänkta att skada Rysslands krigsinsats och tvinga landet till förhandlingar, rapporterar AFP.  Huovinen tillägger att Ukraina hoppas skapa en opinion inom ryska folket. – Man hoppas ju från ukrainsk sida att det här ska sprida sitt missnöje då bland vanliga ryssar så att säga. Att de inte gillar regimen, säger Huovinen. Olika strategier och resurser Ukraina har inte tillräckligt med resurser för att genomföra lika omfattande attacker som Ryssland, utan måste i stället välja sina mål mer noggrant. – Ryssland är en typisk råvarunation. Man säljer olja, gas, timmer, guld, diamanter. Det är väldigt råvarufokuserat. Då har man valt att slå mot den typen av industri och det har varit väldigt framgångsrikt, säger Huovinen. Rysslands krigföring har varit mer inriktad på att slå ut el, värme och vatten, infrastruktur i Ukraina, vilket direkt påverkar civilbefolkningen.  Samtidigt har Ukraina under de senaste månaderna skalat upp produktionen på drönare och på kryssningsrobotar. – Det har väl gjort att situationen har för ukrainsk sida stabiliserats och sen saknar Ukraina förstås luftvärnsrobotar. Det är uppenbart.  Men Ukraina har, om man nu använder Donald Trumps ord: ”Ukraine got some cards”", "link": "https://www.tv4.se/artikel/1FATAq7pA41TTlmj4PRSHM/militaerexperten-om-ukrainas-nya-krigfoering-klockrent", "date_display": "2026-07-25", "date_iso": "2026-07-25T20:59:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ryssland", "/ukraina"]}, {"id": 149, "title": "Twin sister Lykke was born with Down syndrome: \"Very worried\"", "summary": "As early as week 13, the KUB test showed that one of the twins had a high risk of Down syndrome. A few weeks later, the risk was confirmed with a NIPT test.  - At first I was very worried about whether it would affect her and whether she would even survive. She had her sister next to her so I thought: How does it affect her?, says Mira Dahlquist. But the couple never hesitated about what to do and two and a half months ago they became parents to twins Lykke and Malva. - It was very clear. Abortion was never an issue for me.  It also gave me a lot of peace to have a partner next to me who was so welcoming, says Mira Dahlquist. - The first thing I said when we found out we were going to have a child with Down syndrome was that then I have a best friend for life, says Jake Young. \"Best friend for life\" The father, Jake Young, has personal experience of working with people with Down syndrome and felt no worries about the diagnosis. During his schooling and growing up in the United States, he often met people with the diagnosis. - Here I understand that there are advantages to having different schools. Their needs are met, but many in general are not allowed to see them. Then it becomes harder for them to understand who they are, says Jake Young. He talks in particular about the boy Jackson, who always brightened his dark days at work - and who Jake would miss the most when he moved from the US. - Every day he waited at the door and gave me the biggest hug. And no matter what… No matter what, he was still in such a bright place. That's the beauty of many Downs people, that they bring joy to so many, says Jake Young. Fewer children with the diagnosis Fewer and fewer children are born with Down syndrome. This is because more people choose to terminate the pregnancy when they find out that the fetus has the diagnosis. For say Mira Dahlquist and Jake Young, it's not about diagnoses, but about unconditional human dignity.\n\n- My love lies in her existence and her value lies in her existence. Not her diagnosis or her performance", "title_original": "Tvillingsystern Lykke föddes med Downs syndrom: ”Väldigt orolig”", "summary_original": "Redan i vecka 13 visade KUB-testet att en av tvillingarna hade hög risk för Downs syndrom. Några veckor senare bekräftades risken med ett NIPT-test.  – Jag var först väldigt orolig för om det skulle påverka henne och om hon ens skulle överleva. Hon hade sin syster bredvid sig så jag tänkte: Hur påverkar det henne?, säger Mira Dahlquist. Men paret tvekade aldrig om hur de skulle göra och för två och en halv månad sedan blev de föräldrar till tvillingarna Lykke och Malva. – Det var väldigt solklart. För mig var abort aldrig aktuellt.  Det gav mig också väldigt mycket lugn att ha en partner bredvid mig som var så välkomnande, säger Mira Dahlquist. – Det första jag sa när vi fick veta att vi skulle få ett barn med Downs syndrom var att då har jag en bästa vän för livet, säger Jake Young. ”Bästa vän för livet” Pappan, Jake Young, har personlig erfarenhet av att ha jobbat med personer med Downs syndrom och kände ingen oro för diagnosen. Under hans skolgång och uppväxt i USA mötte han ofta personer men diagnosen. – Här förstår jag att det finns fördelar med att ha olika skolor. De tillgodoses sina behov, men många i allmänhet får inte träffa dem. Då blir de svårare att förstå vilka de är, säger Jake Young. Han berättar särskilt om pojken Jackson, som alltid lyste upp hans mörka dagar på arbetet – och som Jake skulle sakna allra mest när han flyttade från USA. – Varje dag väntade han vid dörren och gav mig den största kramen. Och oavsett vad… Oavsett vad så var han fortfarande på en så ljus plats. Det är det fina med många Downs-folk, att de ger glädje till så många, säger Jake Young. Färre barn med diagnosen Allt färre barn föds med Downs syndrom. Det beror på att fler väljer att avsluta graviditeten när de får reda på att fostret har diagnosen. För säger Mira Dahlquist och Jake Young handlar det inte om diagnoser, utan om ovillkorligt människovärde.\n\n– Min kärlek ligger i att hon existerar och hennes värde ligger i hennes existens. Inte hennes diagnos eller att hon presterar eller gör nånting. Samma för Malva. De existerar och därför älskar jag dem, säger Mira Dahlquist. De nyblivna föräldrarna berättar att de fått mycket stöd från både vården och sin omgivning. Tvillingarna föddes sex veckor för tidigt men mår bra. Lykke, som har Downs syndrom, följer ett särskilt vårdprogram med regelbundna kontroller och habilitering. – Hela vården är omringad av henne och stöttar henne, men just nu är hon en bebis precis som Malva. Just nu är det ingen skillnad på dem. De är två små bebisar, säger Mira Dahlquist.", "link": "https://www.tv4.se/artikel/2HP0VKNUOJGNBAMlTF0VX6/tvillingsystern-lykke-foeddes-med-downs-syndrom-var-vaeldigt-orolig", "date_display": "2026-07-25", "date_iso": "2026-07-25T18:36:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon"]}, {"id": 150, "title": "Putin openly criticized by ally: \"Very remarkable\"", "summary": "During Saturday's summit in Omsk, Russia, something unusual happened when Russian President Vladimir Putin and his Kazakh counterpart Qasym-Zjomart Toqayev were to discuss. Putin was openly criticized - by an ally. Among other things, Toqayev said that the conflict with Ukraine should be \"frozen\" and remarked on how many young people die in it. - We have always respected the Ukrainian people, their culture and their language, and we believe that the nature of the conflict is not fully understood by many, including ourselves, the Kazakh president said. The expert: \"Very, very remarkable\" Russia expert Malcolm Dixelius was surprised by the Kazakh leader's statements - especially the last one. - This Toqayev is one of Russia's most cautious neighbors. After all, he is not made for any over-the-top words in any direction, so it is very, very remarkable. Above all, he says he doesn't understand the conflict, says Russia expert Malcolm Dixelius. That Toqayev calls the conflict difficult to understand is even more remarkable that he says it should be frozen, the Russia expert believes. - When he says it with the argument that the conflict cannot be understood, he lowers Putin's credibility. When it comes to what Putin himself thinks and thinks about the Kazakh's words, Dixelius does not think it is worth speculating. - It is hopeless to read that man. He doesn't seem to be impressed by anything really, but just comes back to the fact that he himself is right. Important ally of Russia Malcolm Dixelius does not think that it is as risky for Toqayev to express himself in the terms that one might think, because Kazakhstan is such an important ally for Russia. The countries share a 300-mile-long border, so neither party is particularly interested in a conflict. - Russia is far too dependent on Kazakhstan. It would be incredibly costly for Russia to enter into some kind of conflict with Kazakhstan, says Dixelius.  He describes Kazakhstan as \"big brother\" among the centers", "title_original": "Putin kritiserades öppet av allierad: ”Väldigt anmärkningsvärt”", "summary_original": "Under lördagens toppmöte i ryska Omsk skedde något ovanligt när Rysslands president Vladimir Putin och hans kazakiske motsvarighet Qasym-Zjomart Toqajev skulle diskutera. Putin kritiserades öppet – av en allierad. Bland annat sade Toqajev att konflikten med Ukraina borde ”frysas” och anmärkte på hur många unga människor som dör i den. – Vi har alltid respekterat det ukrainska folket, deras kultur och deras språk, och vi anser att konfliktens natur inte är fullt ut förstådd av många, oss själva inkluderade, sade den kazakiske presidenten. Experten: ”Väldigt, väldigt anmärkningsvärt” Rysslandskännaren Malcolm Dixelius förvånades av den kazakiske ledarens uttalanden – speciellt det sista. – Den här Toqajev är ju en av Rysslands mest försiktiga grannar. Han är ju inte lagd för några överord i någon riktning, så det är väldigt, väldigt anmärkningsvärt. Framförallt att han säger att han inte förstår konflikten, säger Rysslandskännaren Malcolm Dixelius. Att Toqajev kallar konflikten svårförstålig är till och med mer anmärkningsvärt att han säger att den borde frysas, anser Rysslandskännaren. – När han säger det med argumentet att konflikten går inte att förstå, så sänker han ju Putins trovärdighet. När det kommer till vad Putin själv tycker och tänker om kazakens ord tycker inte Dixelius det är lönt att spekulera. – Det är hopplöst att läsa den där karln. Han verkar inte ta intryck av någonting egentligen, utan kommer bara tillbaka till att han själv har rätt. Viktig allierad till Ryssland Malcolm Dixelius anser inte att det är så riskfyllt för Toqajev att uttrycka sig i de ordalagen som man skulle kunna tro, eftersom Kazakstan är en så pass viktig allierad för Ryssland. Länderna delar en 300 mil lång gräns, så ingen av parterna är speciellt intresserade av en konflikt. – Ryssland är alldeles för beroende av Kazakstan. Det vore otroligt kostsamt för Ryssland att gå i någon sorts konflikt med Kazakstan, säger Dixelius.  Han beskriver Kazakstan som ”storebror” bland de centralasiatiska länderna. – Jag tror att han talar för dem i hög grad. Ingen ledare där förstår riktigt varför Putin måste ödsla så fruktansvärt många människoliv, pengar och krigsmateriel på det här kriget som dels inte är framgångsrikt – och där Rysslands ursprungliga skäl var så otydliga.", "link": "https://www.tv4.se/artikel/14JWi0MHfHTDKVt868ldOG/putin-kritiserades-oeppet-av-allierad-vaeldigt-anmaerkningsvaert", "date_display": "2026-07-25", "date_iso": "2026-07-25T18:34:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ryssland", "/kazakstan", "/ukrainakonflikten"]}, {"id": 151, "title": "Gunnar was beaten bloody in his taxi - by the customer: \"The head exploded\"", "summary": "Gunnar Ahlberg has worked as a taxi driver for many years and lives in Scania. One evening he picked up a customer at Stortorget in Ystad. The customer wanted to go to Skurup and offered SEK 500 for the trip. But the trip cost SEK 700.\n\nWhen Gunnar said no, the customer became aggressive.\n\n- We didn't have time to go far before he started raising his fist and was going to hit me. I had to defend myself. Then it exploded in my head. Then I got hit by him when he was leaning over the driver's seat, Gunnar says.\n\nGunnar managed to get out of the car, lock the doors and alert the police. The perpetrator was later sentenced to a few months of community service.\n\nAfter the incident, Gunnar has had to process the experience on his own.\n\n- I have not received any help. You have to manage it yourself. I've had some nightmares, he says. More choose to report Researchers believe that there are several possible reasons for the increase in reported assault crimes. An important explanation is that more people choose to report when they are exposed to violence. The healthcare system's new routines also mean that more cases are detected and reported.\n\nCriminologist Linn Persson at Malmö University says that the statistics have changed.\n\n- Ten years ago, it was mainly men who reported assault. Now we see that the difference between women and men is decreasing and that more women are reporting, she says.\n\nShe also says that the number of reported cases of abuse among children and young people under the age of 17 has increased.\n\n- This indicates that more young people and more women are prepared to report when they are exposed to crime. We also know that young people today have a lower tolerance for violence and other crimes, says Linn Persson. Drive less taxis after the incident Even though Gunnar's bruises have healed, the incident still lingers in the memory. It has affected both his security and his work.\n\n- I drive less taxis now than I did before, says Gunnar.", "title_original": "Gunnar slogs blodig i sin taxi – av kunden: ”Huvudet exploderade”", "summary_original": "Gunnar Ahlberg har arbetat som taxichaufför i många år och bor i Skåne. En kväll hämtade han en kund på Stortorget i Ystad. Kunden ville åka till Skurup och erbjöd 500 kronor för resan. Men resan kostade 700 kronor.\n\nNär Gunnar sa nej blev kunden aggressiv.\n\n– Vi hann inte åka långt innan han började höja näven och skulle slå mig. Jag fick försvara mig. Sedan exploderade det i huvudet. Då fick jag ett slag av honom när han stod lutad över förarsätet, berättar Gunnar.\n\nGunnar lyckades ta sig ur bilen, låsa dörrarna och larma polisen. Gärningsmannen dömdes senare till några månaders samhällstjänst.\n\nEfter händelsen har Gunnar fått bearbeta upplevelsen på egen hand.\n\n– Jag har inte fått någon hjälp. Man får klara det själv. Jag har haft lite mardrömmar, säger han. Fler väljer att anmäla Forskare menar att det finns flera möjliga orsaker till ökningen av anmälda misshandelsbrott. En viktig förklaring är att fler väljer att anmäla när de utsätts för våld. Även sjukvårdens nya rutiner gör att fler fall upptäcks och anmäls.\n\nKriminologen Linn Persson vid Malmö universitet säger att statistiken har förändrats.\n\n– För tio år sedan var det framför allt män som anmälde misshandel. Nu ser vi att skillnaden mellan kvinnor och män minskar och att fler kvinnor anmäler, säger hon.\n\nHon berättar också att antalet anmälda misshandelsfall bland barn och unga under 17 år har ökat.\n\n– Det tyder på att fler unga och fler kvinnor är beredda att anmäla när de utsätts för brott. Vi vet också att unga i dag har en lägre tolerans mot våld och andra brott, säger Linn Persson. Kör mindre taxi efter händelsen Även om Gunnars blåmärken har läkt finns händelsen fortfarande kvar i minnet. Den har påverkat både hans trygghet och hans arbete.\n\n– Jag kör mindre taxi nu än jag gjorde innan, säger Gunnar.", "link": "https://www.tv4.se/artikel/4oJMAYLPQBPclAPKgbSBIP/gunnar-slogs-blodig-i-sin-taxi-av-kunden-huvudet-exploderade", "date_display": "2026-07-25", "date_iso": "2026-07-25T18:15:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff"]}, {"id": 152, "title": "Residents' fear of the wild boar: \"It sounded like it was hailing\"", "summary": "TV4 has previously reported on a herd of wild boars that terrorized Bergsjön outside Gothenburg. The same problem also exists in Surte, also in the Gothenburg area.  According to Surtebon Susanne Rauswall, the animals are seen both at night and in the middle of the day. Several residents have shared their experiences in a local Facebook group to warn others. \"Food scraps all over the plot\" The wild boar barks in the gardens but also goes to garbage cans in search of food scraps and fruit.  - We often come out and find our bins overturned with food scraps all over the site, says Susanne Rauswall. She herself filmed a group of wild boars just a few meters from the house. - It sounded like it was raining or hailing. I thought, what is that sound? Then I looked down and there were two adults and three little ones nibbling cherry pits, she says. Others have seen groups of up to 30 animals and several residents have been forced to put up electric fences to protect their plots from vandalism. No action from the municipality yet Susanne says that she has not heard anything about the municipality having taken, or planning to take, any action. According to her, something needs to be done. - I think we need to increase the hunt. When they get that close.  She continues: - I just think that there are soccer fields here that children go to from time to time. It's not something you want to face, she says in conclusion.", "title_original": "Invånarnas rädsla för vildsvinen: ”Lät som att det haglade”", "summary_original": "TV4 har tidigare rapporterat om en vildsvinsflock som satt skräck i Bergsjön utanför Göteborg. Samma problem finns även i Surte, även det i Göteborgsområdet.  Enligt Surtebon Susanne Rauswall syns djuren både nattetid och mitt på dagen. Flera boende har delat sina upplevelser i en lokal Facebookgrupp för att varna andra. ”Matrester över hela tomten” Vildsvinen bökar i trädgårdarna men söker sig också till soptunnor i jakt på matrester och frukt.  – Det är ofta vi kommer ut och hittar våra soptunnor omkullvälta med matrester över hela tomten, säger Susanne Rauswall. Hon har själv filmat en grupp vildsvin bara ett par meter från huset. – Det lät som att det regnade eller haglade. Jag tänkte, vad är det som låter? Så tittade jag ner och där stod två vuxna och tre små och knaprar körsbärskärnor, berättar hon. Andra har sett grupper upp emot 30 djur och flera boende har tvingats sätta upp elstängsel för att skydda sina tomter från skadegörelse. Ingen åtgärd från kommunen ännu Susanne säger att hon inte har hört något om att kommunen ska ha gjort, eller planerar att göra, någon åtgärd. Enligt henne behöver någonting göras. – Jag tror vi behöver öka jakten. När de kommer så pass nära inpå.  Hon fortsätter: – Jag tänker bara att det finns ju fotbollsplaner här som barn går från och till. Det är ju inget man vill möta på, säger hon avslutningsvis.", "link": "https://www.tv4.se/artikel/6DDmKobo2LXf2OXFbSMQE6/invanarnas-raedsla-foer-vildsvinen-laet-som-att-det-haglade", "date_display": "2026-07-25", "date_iso": "2026-07-25T17:21:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/vildsvin", "/goteborg", "/djur"]}, {"id": 153, "title": "Fires and extreme heat - but the Swedes continue to travel", "summary": "How climate change affects tourism • Sofie: \"Nothing I would think of\"", "title_original": "Bränder och extremhetta – men svenskarna fortsätter resa", "summary_original": "Så påverkar klimatförändringarna turistandet • Sofie: ”Inget jag skulle tänka på”", "link": "https://www.tv4.se/artikel/5DCTdvfp2zLTItnbqYvFG1/braender-och-extremhetta-men-svenskarna-fortsaetter-resa", "date_display": "2026-07-25", "date_iso": "2026-07-25T17:18:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 154, "title": "Three teenagers arrested after the shooting death in Hässelby", "summary": "It was shortly before eight o'clock on Friday evening that the police received an alert that a 25-year-old man had been shot outside in Hässelby. At 22.50 the news came that the man had died and that a man had been arrested on suspicion of involvement in the shooting. Two more young men have been arrested and detained after the shooting. Intensive police work The police worked intensively at the scene during the night and morning. - We have made seizures that will probably move the investigation forward. Exactly what kind of object it is, it is nothing we want to disclose, with regard to the investigation, says Anna Lärk.  It is still too early to comment on a possible motive, he states. The classification is murder. Security operation On Saturday, the police are carrying out a security operation in the area and will continue with door knocking, they write on their website.", "title_original": "Tre tonåringar anhållna efter dödsskjutningen i Hässelby", "summary_original": "Det var strax innan klockan åtta på fredagskvällen som polisen fick larm om att en man i 25-årsåldern blivit skjuten utomhus i Hässelby. Vid 22.50 kom beskedet att mannen dött och att en man gripits misstänkt för inblandning i skjutningen. Ytterligare två unga män har gripits och anhållits efter skjutningen. Intensivt polisarbete Polisen har arbetat intensivt på platsen under natten och morgonen. – Vi har gjort beslag som troligtvis kommer föra utredningen framåt. Exakt vad det är för föremål, det är ingenting vi vill gå ut med, med hänsyn till utredningen, säger Anna Lärk.  Det är ännu för tidigt att uttala sig om ett möjligt motiv, uppger han. Rubriceringen är mord. Trygghetsinsats Under lördagen genomför polisen en trygghetsinsats i området och och kommer att fortsätta med dörrknackning, skriver de på sin hemsida.", "link": "https://www.tv4.se/artikel/1UwhlDTVNYyKWpupASbDKa/tre-unga-maen-anhallna-efter-doedsskjutningen-i-haesselby", "date_display": "2026-07-25", "date_iso": "2026-07-25T13:48:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/skjutningar-i-stockholm", "/skjutning", "/stockholm"]}, {"id": 155, "title": "That's why so many women lack sex drive - here are the biggest culprits", "summary": "Almost every second woman between the ages of 30 and 44 has lacked interest in sex in the past year, according to new figures from the Public Health Agency. The doctor and sex inspiration Hanna Hellgren believes that stress, lack of sleep and lack of pleasure are some of the biggest causes. Stress and seam deficiency According to Hellgren, also known as Dr. Spiicy, stress is one of the main causes of decreased sex drive. Lack of sleep, conflicts and other interests taking over everyday life can also play a role. - If you want to have a higher desire, it is so important that you have the kind of sex that is worth longing for. If you are always served boiled broccoli with every meal, then it is not great fun to eat. After all, there is a buffet of sex and many get stuck in a certain template, says Hellgren. She believes that many women get stuck in established patterns and forget to listen to their own needs. - The body sends a lot of signals and you feel like you don't have much desire, that's a signal. Either how life is in general or what kind of sex you've had, says Hellgren. Talk about sex She emphasizes the importance of being clear with your partner about what you want and what feels good. Instead of asking open-ended questions, you can facilitate the conversation by giving concrete alternatives or expressing appreciation for what you like. - It's more fun to ask for more and say \"this is great, I want even more\", than to have to say stop, says Hellgren.  Dare to seek help When the desire for sex disappears completely and it becomes a problem, Hellgren believes that it is important to dare to seek help, either via a health center, sexologist or therapist. But often you start with self-care. - Okay, now my desire is gone. What has happened? What does my life look like? How is my body? Have I had a period of higher desire? What did I do then? She explains that you can do a lot of self-reflection and start there. - If you try and get stuck, and it locks up and you can't get any further, then you seek help, says Hellgren.", "title_original": "Därför saknar så många kvinnor sexlust – här är största bovarna", "summary_original": "Nästan varannan kvinna mellan 30 och 44 år har saknat intresse för sex det senaste året, enligt nya siffror från Folkhälsomyndigheten. Läkaren och sexinspiratören Hanna Hellgren menar att stress, sömnbrist och brist på njutning är några av de största orsakerna. Stress och sömbrist Enligt Hellgren, även känd som Dr. Spiicy, är stress en av de viktigaste orsakerna till minskad sexlust. Även sömnbrist, konflikter och att andra intressen tar över vardagen kan spela in. – Vill man ha en högre lust är det så viktigt att man har sånt sex som är värt att längta efter. Om man alltid blir serverad kokt broccoli till varje måltid då är det inte jättekul att äta mat. Det finns ju en buffé av sex och många fastnar i en viss mall, säger Hellgren. Hon menar att många kvinnor fastnar i invanda mönster och glömmer att lyssna på sina egna behov. – Kroppen skickar ju massa signaler och känner man att man inte har så mycket lust, det är ju en signal. Antingen hur livet är i stort eller vilken typ av sex man har haft, säger Hellgren. Prata om sexet Hon betonar vikten av att vara tydlig med sin partner kring vad man vill och vad som känns bra. I stället för att ställa öppna frågor kan man underlätta samtalet genom att ge konkreta alternativ eller uttrycka uppskattning för det man gillar. – Det är roligare att be om mer och säga ”det här är jättebra, jag vill ha ännu mer”, än att behöva säga stopp, säger Hellgren.  Våga söka hjälp När sexlusten försvinner helt och det blir ett problem, menar Hellgren att det är viktigt att våga söka hjälp, antingen via vårdcentral, sexolog eller terapeut. Men ofta börjar man med egenvård. – Okej, nu är min lust borta. Vad har hänt? Hur ser mitt liv ut? Hur mår min kropp? Har jag haft en period med högre lust? Vad gjorde jag då? Hon förklarar att man kan göra mycket självreflektioner och börja där. – Försöker man och fastnar, och det låser sig och man kommer inte vidare, då söker man hjälp, säger Hellgren.", "link": "https://www.tv4.se/artikel/31QAhsSIqCvhJUF0LGUzN4/sexlusten-foersvinner-foer-naestan-haelften-stress-paverkar-jaettemycket", "date_display": "2026-07-25", "date_iso": "2026-07-25T12:15:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/lakare", "/sex", "/halsa"]}, {"id": 156, "title": "Anger at Trump's luxury construction on protected island - flamingos threatened", "summary": "Dubbed the \"Flamingo Revolution\", the protests started when it became known that a billion-dollar project for exclusive tourism was planned on the uninhabited island of Sazan and adjacent coastal strips. The area is protected and home to endangered species, including flamingos and sea turtles. - It started as an environmental issue, but has developed into a fight against corruption and the power elite, says Ekot's foreign reporter Jacob Hallerström, who recently visited Albania. Construction project paused - protests continue After private security guards cracked down on protesters and the police did not intervene, the protests spread to the capital Tirana and several other cities. The construction project has now been paused pending an environmental impact analysis, while several investors are being investigated for corruption. - It is the first time since the fall of communism that so many have gathered in a broad, popular movement, says Jacob Hallerström. New generation leads the resistance Behind the demonstrations is a new generation of Albanians, where many young people and students have taken leading roles. The protests have also received support from Albanians in exile, and several of the largest demonstrations have gathered thousands of participants both in Albania and abroad. Jorina Kadare, who previously lived in Sweden but chose to remain in Albania to participate in the protests, describes how the movement grew out of a frustration over a lack of democratic reforms and widespread corruption. She says that threats and harassment have occurred against several of the most active, but that this has not deterred the participants. \"We have nothing to lose\" The protesters now demand not only a stop to the construction, but also that Prime Minister Edi Rama and the opposition leader Salibi Risha leave their posts. - Albanians are so tired of
