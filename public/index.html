body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }

button.active { background: #007bff; color: white; border-color: #007bff; }
button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;
    height: auto;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
.tag-type { background: #e9ecef; color: #495057; }
.tag-ministry { background: #e3f2fd; color: #0d47a1; }
.tag-old { background: #ffebee; color: #c62828; }

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {
    padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
}
.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }
</style>

 GW Persson konstaterar att eleverna är misstänkta för grova brott, däribland grovt sexuellt ofredande, grovt olaga tvång och grov misshandel.  – Fängelse ingår i straffskalan. Det är långt ifrån någon angenäm situation för dem, säger han. ”Inte att leka med” GW Persson lutar åt att flera elever kommer att dömas.  – Lisa dos Santos är inte att leka med som åklagare. Sannolikheten för att det kommer att bli fällande domar i flertalet fall är hög,  säger han. Enligt uppgifter till TV4 Nyheterna ska ett flertal maskerade elever ”straffat och förnedrat” yngre elever, bland annat med ett svärd. Bland bevismaterialet finns också en regelbok som fastställer hur elever ska bestraffa varandra på skolan, som åklagaren tidigare bekräftat tagits i beslag. – Går man på internatskola så är det speciella problem som uppstår, nämligen att man inte bara läser ihop – man ska dessutom bo och leva ihop. Det är den främsta orsaken bakom, som våldsorsak, säger GW Persson. Veckointernatet avvecklas Tidigare i veckan meddelade Sigtunaskolan att de lägger ner veckointernatet. Förändringen innebär att från och med skolstarten 2027 kommer elever på skolan inte längre kunna bo på veckointernatet, som är en av tre internatformer på skolan. ”Det här är en sedan länge planerad förändring som inte har något med utredningen att göra”, skriver Mazdak Sarvari, internatchef, i en skriftlig kommentar till TV4 Nyheterna. Trots att det är en ”sedan länge planerad förändring” är det ett steg i rätt riktning, enligt GW Persson. – Det är ett sätt att minska friktionen som har en betydelse orsaksmässigt. Jag har väldigt svårt att tro att de som går där är mer våldsbenägna än elever i gemen. Sannolikt är det precis tvärtom, men de är föremål för speciella påfrestningar som skolelever i gemen inte utsätts för, säger han.", "title_original": "GW: ”Sannolikheten för fällande domar är hög”", "summary_original": "Det var i onsdags som Expressen rapporterade att en sjätte elev delgivits misstanke om brott i utredni n ur Lady och Lufsen, där de sitter på en italiensk restaurang och äter spaghetti och köttbullar. – Årets tema är ”Från oss alla till er alla”, en hyllning till svenska jultraditioner i ett samarbete mellan NK och Disney. Vi har plockat fram unika scener från filmer som vi alla älskar och känner igen, säger Karin Wickberg, kommunikations- och varumärkeschef på NK. Varuhuset började med sin klassiska julskyltning 1915 och har fortsatt varje år sedan dess. Avtäckningen brukar locka stor uppmärksamhet från allmänheten och NK uppskattar att 25 000 personer besökte under dagen. ”Otroligt stolt” Hon är väldigt nöjd med årets skyltning och samarbetet med Disney. – Det är jätteviktigt för jultraditionerna i Stockholm och Göteborg. Man har en förväntan på att NK ska leverera fantastiska julskyltfönster och skapa den första julmagin. – Jag är otroligt stolt. Det är nog den finaste julskyltningen jag har fått äran att jobba med. Populärt bland de yngre De två yngre besökarna Astrid och Signe Jalnäs Segerborg tyckte mycket om temat. – Det är roligt, skrattar de. Mamman Malin Segerborg fyller i: – Det är fantastiskt med jultraditioner. Vi bor i Funäsdalen och är bara här och hälsar på. Det var jättehäftigt att få se det här. Fantastiskt med Disney, det gillar man ju.", "title_original": "Här avtäcks klassiska julskyltningen", "summary_original": "Tusentals människor samlades på Hamngatan i Stockholm för att se när NK avslöjade årets julskyltning. Anna Hula är på plats för fjärde året i rad.  – Det är så mysigt. I går gick vi och lyssnade på en konsert, och julbelysningen är uppe. Julskyltningen föreställer bland annat den klassiska scenen ur Lady och Lufsen, där de sitter på en italiensk restaurang och äter spaghetti och köttbullar. – Årets tema är ”Från oss alla till er alla”, en hyllning till svenska jultraditioner i ett samarbete mellan NK och Disney. Vi har plockat fram unika scener från filmer som vi alla älskar och känner igen, säger Karin Wickberg, kommunikations- och var egeringsfrågan", "summary": "Partistyrelsen och riksdagsgruppen i Centerpartiet har kallats till möte i dag för att fatta beslut om vägvalet i regeringsfrågan, erfar DN. Partiledningen uppges också ha samtal med distrikten om vilket alternativ C ska välja. – I samtal med distrikten har gänget runt partiledningen tryckt på för Kristersson, säger en C-källa.", "title_original": "C-toppar möts i dag – beslut om regeringsfrågan", "summary_original": "Partistyrelsen och riksdagsgruppen i Centerpartiet har kallats till möte i dag för att fatta beslut om vägvalet i regeringsfrågan, erfar DN. Partiledningen uppges också ha samtal med distrikten om vilket alternativ C ska välja. – I samtal med distrikten har gänget runt partiledningen tryckt på för Kristersson, säger en C-källa.", "link": "https://www.dn.se/sverige/c-toppar-mots-i-dag-beslut-om-regeringsfragan/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:50:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 60, "title": "Lennox, 6, lever med ovanliga syndromet: ”Gör allt de kan”", "summary": "Sturge-Webers syndrom kännetecknas av kärlförändringar som kan ge upphov till flera olika symtom. I Lennox fall innebär det ett synligt födelsemärke i ansiktet, glaukom, vilket innebär ett förhöjt tryck i ögat, samt kärlmissbildningar på hjärnans yta.  Sjukdomen gör att han får epileptiska anfall, oftast en eller två gånger i månaden, berättar mamma Rosanna.  – Ögonen börjar fastna åt ena hållet och efter ett tag är han mer okontaktbar. I vissa fall kan kroppen hantera anfallet själv men ibland måste vi ta en kramplösande medicin, och sen somnar han. Oftast kommer de på kvällarna, så då sover han hela natten. Lennox brukar hinna förvarna sina föräldrar när epilepsianfallen närmar sig. – Det känns nästan som vanligt, säger Lennox om sina anfall. En ovanlig diagnos I Sverige finns cirka omkring 300 personer med Sturge-Webers syndrom, en sjukdom som kan yttra sig på olika sätt. – Vi har kontakt med familjer där barnen har 50–100 anfall om dagen. Vissa blir halvsidesförlamade och i vissa fall måste man koppla bort halva hjärnan för att slippa anfall, säger Rosanna. Hon beskriver vardagen för Lennox som relativt stabil. Han tar mediciner och har ett synligt födelsemärke, men lever annars ett aktivt liv. Men framtiden är oviss.  – De gör allt de kan på sjukhuset för att han ska bli helt anfallsfri. Vi håller på med en typ av utredning för det, men det går inte riktigt att säga. Det handlar om hur kärlen förändras. Födelsemärket behandlas med laser, både för att minska risken för komplikationer och av estetiska skäl. Rosanna betonar att det är ett val familjen gjort utifrån läkares rekommendationer. – Gör man ingenting, kommer det garanterat tjockna, mörkna och bli väldigt svullet, säger hon. Bemöts med nyfikenhet Lennox har nyligen börjat skolan och möter ofta frågor om sitt födelsemärke. – Ofta är barn väldigt nyfikna. Vi har berättat på skolan vad det är, så Lennox ska slippa alla frågor på rasterna, säger Rosanna. För Lennox har möten med andra barn och vuxna med födelsemärken varit betydelsefulla. En viktig del i Lennox liv är maskoten Halfred, en apa med rött ansikte, inspirerad av Lennox eget födelsemärke.  – Vi har fått hem supermånga Halfred, och vi ska dela ut dem på sjukhus till de som har födelsemärken, säger Lennox. – Vi hoppas att barnen blir glada och känner igen sig lite, säger mamma Rosanna.", "title_original": "Lennox, 6, lever med ovanliga syndromet: ”Gör allt de kan”", "summary_original": "Sturge-Webers syndrom kännetecknas av kärlförändringar som kan ge upphov till flera olika symtom. I Lennox fall innebär det ett synligt födelsemärke i ansiktet, glaukom, vilket innebär ett förhöjt tryck i ögat, samt kärlmissbildningar på hjärnans yta.  Sjukdomen gör att han får epileptiska anfall, oftast en eller två gånger i månaden, berättar mamma Rosanna.  – Ögonen börjar fastna åt ena hållet och efter ett ever-med-ovanliga-sturge-webers-syndrom", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:37:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/sjukdomar", "/vard"]}, {"id": 61, "title": "Anthropic till börsen: Stresstest för AI-marknaden", "summary": "Anthropics börsnotering närmar sig. AI-jättens intåg på Nasdaqbörsen i New York blir därmed en värdemätare för hela sektorn, menar Robert Oldstrand, aktiestrateg på Swedbank. – Det här blir lite av ett stresstest för marknaden, säger han.", "title_original": "Anthropic till börsen: Stresstest för AI-marknaden", "summary_original": "Anthropics börsnotering närmar sig. AI-jättens intåg på Nasdaqbörsen i New York blir därmed en värdemätare för hela sektorn, menar Robert Oldstrand, aktiestrateg på Swedbank. – Det här blir lite av ett stresstest för marknaden, säger han.", "link": "https://www.hd.se/ekonomi/anthropic-till-borsen-stresstest-for-ai-marknaden/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:34:04+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 62, "title": "Anthropic till börsen: Stresstest för AI-marknaden", "summary": "Anthropics börsnotering närmar sig. AI-jättens intåg på Nasdaqbörsen i New York blir därmed en värdemätare för hela sektorn, menar Robert Oldstrand, aktiestrateg på Swedbank. – Det här blir lite av ett stresstest för marknaden, säger han.", "title_original": "Anthropic till börsen: Stresstest för AI-marknaden", "summary_original": "Anthropics börsnotering närmar sig. AI-jättens intåg på Nasdaqbörsen i New York blir därmed en värdemätare för hela sektorn, menar Robert Oldstrand, aktiestrateg på Swedbank. – Det här blir lite av ett stresstest för marknaden, säger han.", "link": "https://www.sydsvenskan.se/ekonomi/anthropic-till-borsen-stresstest-for-ai-marknaden/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:34:04+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 63, "title": "Från Messias till mörker – så kraschade HIF:s nystart", "summary": "Med en kaxig skotte svepte kiltfotbollen och drömmarna in över Olympia. Några månader senare präglades HIF av kaos, konflikter och kvalångest. Här är berättelsen om den turbulenta säsongen 2026.", "title_original": "Från Messias till mörker – så kraschade HIF:s nystart", "summary_original": "Med en kaxig skotte svepte kiltfotbollen och drömmarna in över Olympia. Några månader senare präglades HIF av kaos, konflikter och kvalångest. Här är berättelsen om den turbulenta säsongen 2026.", "link": "https://www.hd.se/sport/fran-messias-till-morker-sa-kraschade-hif-s-nystart/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "Fotbollslandslaget får ledigt efter segern", "summary": "Sverige slog Bosnien-Hercegovina med 3–2 och säkrade gruppsegern i Nations League. På söndagen belönades spelarna med en ledig dag av landslagsledningen.", "title_original": "Fotbollslandslaget får ledigt efter segern", "summary_original": "Sverige slog Bosnien-Hercegovina med 3–2 och säkrade gruppsegern i Nations League. På söndagen belönades spelarna med en ledig dag av landslagsledningen.", "link": "https://www.hd.se/sport/fotbollslandslaget-far-ledigt-efter-segern/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:27:25+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 65, "title": "Fotbollslandslaget får ledigt efter segern", "summary": "Sverige slog Bosnien-Hercegovina med 3–2 och säkrade gruppsegern i Nations League. På söndagen belönades spelarna med en ledig dag av landslagsledningen.", "title_original": "Fotbollslandslaget får ledigt efter segern", "summary_original": "Sverige slog Bosnien-Hercegovina med 3–2 och säkrade gruppsegern i Nations League. På söndagen belönades spelarna med en ledig dag av landslagsledningen.", "link": "https://www.sydsvenskan.se/sport/fotbollslandslaget-far-ledigt-efter-segern/", "date_display": "2026-11-15", "date_iso": "2026-11-15T10:27:25+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 66, "title": "Nya ryska attacker mot Zaporizjzja: ”Förstörd känsla av trygghet”", "summary": "Nästan varje dag de senaste veckorna har boende i den ukrainska staden Zaporizjzja utsatts för ryska anfall. Sent under lördagskvällen slog tolv ryska glidbomber ner i staden. Sex personer skadades, bland dem ett barn, enligt Kyiv Post som hänvisar till ukrainska myndigheter. Flera flerfamiljshus och bilar skadades i attacken. – När jag kom ut i korridoren började glasrutorna genast flyga omkring. Det var fruktansvärt. Jag hann precis öppna dörrarna och ta mig ut, säger Natalia, som bor i staden.  ”Förstörd känsla av trygghet” Den regionala guvernören Mychajlo Semikin gick under lördagskvällen ut och kommenterade det ryska anfallet. ”Bakom varje siffra finns mänskligt lidande och en förstörd känsla av trygghet”, skriver han.  Attackerna kommer samtidigt som nya uppgifter om ett möjligt upplägg för att få slut på kriget. Ukrianas president Volodomyr Zelenskyj uppger att amerikanska förhandlare har föreslagit att Ukraina ska ge upp Donbass, som delvis är ockuperat av Ryssland. I utbyte skulle Ukraina få möjlighet att gå med i Nato. Enligt Zelenskyj är det första gången ett ukrainskt Natomedlemskap nämns i förhandlingarna, men varken USA eller Ryssland har kommenterat uppgifterna. Ryssland har tidigare motsatt sig ett ukrainskt medlemskap i Nato. Massiv brand efter attack mot oljeanläggning  Samtidigt har en kraftfull brand har brutit ut i den ryska staden Nizhnekamsk natten mot söndag, där ett av Europas största oljeanläggningar ligger, rapporterar flera ukrainska kanaler på Telegram och The Kyiv Independent. Nizjnekamsks borgmästare Radmir Beljajev meddelar om ”en massiv och långvarig attack från drönare” och att flera byggnader skadats i industriområdet, rapporterar nyhetsbyrån Astra. Han uppgav också att tre personer skadats. Enligt vittnesuppgifter har branden brutit ut efter en omfattande drönarattack. Ukraina har tidigare attackerat anläggningen.", "title_original": "Nya ryska attacker mot Zaporizjzja: ”Förstörd känsla av trygghet”", "summary_original": "Nästan varje dag de senaste veckorna har boende i den ukrainska staden Zaporizjzja utsatts för ryska anfall. Sent under lördagskvällen slog tolv ryska glidbomber ner i staden. Sex personer skadades, bland dem ett barn, enligt Kyiv Post som hänvisar till ukrainska myndigheter. Flera flerfamiljshus och bilar skadades i attacken. – När jag kom ut i korridoren började glasrutorna genast flyga omkring. Det var fruktansvärt. Jag hann precis öppna dörrarna och ta mig ut, säger Natalia, som bor i staden.  ”Förstörd känsla av trygghet” Den regionala guvernören Mychajlo Semikin gick under lördagskvällen ut och kommenterade det ryska anfallet. ”Bakom varje siffra finns mänskligt lidande och en förstörd känsla av trygghet”, skriver han.  Attackerna kommer samtidigt som nya uppgifter om ett möjligt upplägg för att få slut på kriget. Ukrianas president Volodomyr Zelenskyj uppger att amerikanska förhandlare har föreslagit att Ukraina ska ge upp Donbass, som delvis är ockuperat av Ryssland. I utbyte skulle Ukraina få möjlighet att gå med i Nato. Enligt Zelenskyj är det första gången ett ukrainskt Natomedlemskap nämns i förhandlingarna, men varken USA eller Ryssland har kommenterat uppgifterna. Ryssland har tidigare motsatt sig ett ukrainskt medlemskap i Nato. Massiv brand efter attack mot oljeanläggning  Samtidigt har en kraftfull brand har brutit ut i den ryska staden Nizhnekamsk natten mot söndag, där ett av Europas största olj curity situation in Europe.", "title_original": "Direktrapport om kriget i Ukraina och säkerhetsläget i Europa", "summary_original": "Följ vår direktrapportering om kriget i Ukraina och säkerhetsläget i Europa.", "link": "https://www.sydsvenskan.se/varlden/direktrapport-om-kriget-i-ukraina-och-sakerhetslaget-i-europa/", "date_display": "2026-11-15", "date_iso": "2026-11-15T09:51:49+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Barbados återförenas – med Magnus Carlsson", "summary": "Här är glädjenyheten för alla dansbandsfans: Barbados återförenas – med Magnus Carlsson.", "title_original": "Barbados återförenas – med Magnus Carlsson", "summary_original": "Här är glädjenyheten för alla dansbandsfans: Barbados återförenas – med Magnus Carlsson.", "link": "https://www.svd.se/a/LoAM9R/barbados-aterforenas-efter-25-ar-med-magnus-carlsson?utm_medium=rss", "date_display": "2026-11-15", "date_iso": "2026-11-15T09:45:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "Svårt att jazza fram ödsligheten i ”Kvarteret Korpen”", "summary": "Bo Widerbergs film ”Kvarteret Korpen” är en odödlig Malmöskildring. Som opera blir det en levande och underbart jazzig föreställning – men hopplösheten fäster inte, skriver DN:s Kristina Lindquist.", "title_original": "Svårt att jazza fram ödsligheten i ”Kvarteret Korpen”", "summary_original": "Bo Widerbergs film ”Kvarteret Korpen” är en odödlig Malmöskildring. Som opera blir det en levande och underbart jazzig föreställning – men hopplösheten fäster inte, skriver DN:s Kristina Lindquist.", "link": "https://www.dn.se/kultur/svart-att-jazza-fram-odsligheten-i-kvarteret-korpen/", "date_display": "2026-11-15", "date_iso": "2026-11-15T09:37:14+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Barbados återförenas – efter snart 25 år", "summary": "Carlsson lämnade Barbados hösten 2002 för en internationell karriär med Alcazar och därefter som soloartist. Nu återförenas originalmedlemmarna för en rikstäckande arenaturné. – Det har varit på tal många gånger men det ska också funka med de liv vi lever, säger basisten Peter Samuelsson.  Utlovar nostalgifest På låtlistan finns bland annat ”Kom hem”, ”Världen utanför” och ”Se mig”. Bandet utlovar en kväll fylld av nostalgi, med samma uppsättning som var med när allt började, och med ett arenaformat i full skala.  Så klart ingår Barbados eviga signum: en snygg scen- och ljushow med pyroteknik. Bandet utlovar också fartfyllda kvällar där hitsen står på rad.  – Musiken har följt med oss och jag tog med låtarna på mina gig. Det finns inget gig utan ”Kom hem”. Grabbarna och bandet har också fortsatt att köra låtarna. Vi har låtarna i oss så nu ska vi bara koppla ihop låtarna, vi fem originalare och göra dem igen, säger Magnus Carlsson. Från Partille till Kosta Barbados bildades 1992 i Göteborg med medlemmarna Magnus Carlsson, Peter Samuelsson, Mathias Lager, Mattias Berggren och Magnus Wictorinsson. Att starta ett dansband var aldrig killarnas ambition. Att det ändå blev så berodde helt enkelt på att deras första bokningsbolag var stora inom just dansbandsbokning.   – Det var hela tiden frågor om, så kan ni inte låta eller se ut. Det var vår drivkraft att visa att vi faktiskt kunde lyckas. Vi nådde ungdomarna, den breda publiken och danspubliken, säger Carlsson. Sedan dess har Barbados samlat ihop över tio guld- och platinaskivor, tre grammisar, sex Guldklavar och amerikanska Billboards utmärkelse ”Årets album”. Det placerar gruppen bland de mest framgångsrika svenska banden någonsin, och på flera scener i Skandinavien står publikrekorden sig fortfarande.  – När man tittar tillbaka på vad vi faktiskt fick uppleva är det nästan som att man måste nypa sig i armen. När vi får göra om det 25 år senare är det ytterligare en dröm som går i uppfyllelse, säger keyboardisten Mattias Berggren.  Turnén startar nästa höst Turnépremiären går av stapeln i Partille Arena den 24 september 2027. Därefter spelar bandet på ytterligare 17 arenor runtom i Sverige innan turnén avslutas på Craft Arena i Kosta den 13 november. – Det här har spridit sig över generationer. De som lyssnade på oss har barn nu som kanske aldrig fått lyssna på Barbados musik eller fått se oss, säger Peter Samuelsson.  Bandet får frågan om det kan bli en återkomst i Melodifestivalen i framtiden och de svarar nej i kör.  – Nu har vi de här 18 datumen och det är de vi kör, säger Carlsson.", "title_original": "Barbados återförenas – efter snart 25 år", "summary_original": "Carlsson lämnade Barbados hösten 2002 för en internationell karriär med Alcazar och därefter som soloartist. Nu återförenas originalmedlemmarna för en rikstäckande arenaturné. – Det har varit på tal många gånger men det ska också funka med de liv vi lever, säger basisten Peter Samuelsson.  Utlovar nostalgifest På låtlistan finns bland annat ”Kom hem”, ”Världen utanför” och ”Se mig”. Bandet utlovar en kväll fylld av nostalgi, med samma uppsättning som var med när allt började, och med ett arenaformat i full skala.  Så klart ingår Barbados eviga signum: en snygg scen- och ljushow med pyroteknik. Bandet utlovar också fartfyllda kvällar där hitsen står på rad.  – Musiken har följt med oss och jag tog med låtarna på mina gig. Det finns inget gig utan ”Kom hem”. Grabbarna och bandet har också fortsatt att köra låtarna. Vi har låtarna i oss så nu ska vi bara koppla ihop låtarna, vi fem originalare och göra dem igen, säger Magnus Carlsson. Från Partille till Kosta Barbados bildades 1992 i Göteborg med medlemmarna Magnus Carlsson, Peter Samuelsson, Mathias Lager, Mattias Berggren och Magnus Wictorinsson. Att starta ett dansband var aldrig killarnas ambition. Att det ändå blev så berodde helt enkelt på att deras första bokningsbolag var stora inom just dansban  Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Bopriserna ökar – protester fortsätter: ”Droppen”", "summary": "Bristen på bostäder till överkomliga priser har ökat drastiskt i Europa.", "title_original": "Bopriserna ökar – protester fortsätter: ”Droppen”", "summary_original": "Bristen på bostäder till överkomliga priser har ökat drastiskt i Europa.", "link": "https://www.svd.se/a/vkQgAm/bopriserna-okar-protester-fortsatter-droppen?utm_medium=rss", "date_display": "2026-11-15", "date_iso": "2026-11-15T05:30:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Emma, 22, först i världen att testa nya metoden: ”Jättehäftigt”", "summary": "Tekniken börjar i all enkelhet. Ett litet klistermärke med en QR-kod placeras på organet som ska opereras, exempelvis levern. När en kamera sedan förs in i patienten kan en dator med hjälp av klistermärket lägga på 3D-bilder ovanpå det som kameran faktiskt filmar.  Den kan visa ett organs inre strukturer ovanpå det faktiska organet. Att projicera datorgenererade bilder ovanpå det man ser kallas för ”augmented reality” och är samma princip som används i mobilspelet Pokémon Go. – Istället för att det är ett litet troll eller djur så ser du tumören och blodkärl i kameran, säger Niclas Kvarnström, transplantation- och leverkirurg på Sahlgrenska universitetssjukhuset. Snabbare och enklare Vanligtvis måste man stanna upp under operationer och ta en bild av organ med ultraljud, en procedur som dessutom måste göras om ifall man vill ha en ny bild senare under operationen. 3D-bilden gör att kirurgerna hela tiden har en karta över organet framför sig som förändras i realtid. Kirurgerna kan se organets inre struktur, exempelvis kärl och tumörer. Tekniken har utvecklats i ett samarbete mellan Sahlgrenska, Chalmers och företaget Navari och den ska kunna göra operationer både säkrare och snabbare. – Vi vill lösa ett problem som vi ser dagligen i leverkirurgi; Att vi inte ser djupet i själva levern, utan bara ytan. Vi ska ta bort en tumör som sitter under ytan någonstans och vi ska förhålla oss till de blodkärl och gallvägar som går i levern, som är som trädstrukturer med grenar utan att skada mer än nödvändigt, säger Niclas Kvarnström. Första operationen på människa I våras sökte 22-åriga Emma Movert vård för kraftiga ryggsmärtor. Då upptäcktes en tumör i hennes lever. När den i somras opererades bort blev Emma den första mänskliga patienten i världen som opererades med hjälp av tekniken. – Jättehäftigt. Jag förstod inte i stunden att det var en sådan grej att göra detta, jag tänkte att det är någon vanlig studie. Men det här blev ju en jättebra grej, det gick så bra och kommer hjälpa jättemånga andra, säger Emma Movert. Emma är nu helt återställd efter sin operation och den lyckade debuten gör att man på Sahlgrenska tror att tekniken kan bli standardvalet vid operationer framöver.  – Det är helt enkelt enklare med den här tekniken. Jag tror att i takt med att tekniken vinner mark och blir enklare och enklare att nyttja så kan man använda den på många andra organ också, säger Niclas Kvarnström.", "title_original": "Emma, 22, först i världen att testa nya metoden: ”Jättehäftigt”", "summary_original": "Tekniken börjar i all enkelhet. Ett litet klistermärke med en QR-kod placeras på organet som ska opereras, exempelvis levern. När en kamera sedan förs in i patienten kan en dator med hjälp av klistermärket lägga på 3D-bilder ovanpå det som kameran faktiskt filmar.  Den kan visa ett organs inre strukturer ovanpå det faktiska organet. Att projicera datorgenererade bilder ovanpå det man ser kallas för ”augmented reality” och är samma princip som används i mobilspelet Pokémon Go. – Istället för att det är ett litet troll eller djur så ser du tumören och blodkärl i kameran, säger Niclas Kvarnström, transplantation- och leverkirurg på Sahlgrenska universitet  samma plats samtidigt, säger han. Även om något större genombrott inte väntas finns flera tunga frågor på dagordningen. Enligt Vita huset väntas mötet bland annat handla om kärnvapenfrågor och kriget i Iran. Amerikanska tjänstemän har samtidigt uppgett att Ukraina inte kommer att stå på listan över samtalsämnen. – Trump vill kröna sin karriär med någon form av överenskommelse på kärnvapensidan. Amerikanerna ser med oro på både den ryska kärnvapenstyrkan och Kinas utbyggnad av sitt kärnvapenprogram, säger Hallenberg. ”Svårt att tro det” Däremot tror han inte att någon uppgörelse ligger nära. – Kineserna har sagt att de inte är beredda att diskutera kärnvapennedrustning förrän de har ungefär samma nivå som USA och Ryssland. Där är de inte i dag, säger han. Hallenberg fortsätter: – Amerikanernas intresse för Iranfrågan visar också att de har svårt att lösa den. Nu skulle de gärna ha hjälp av både Kina och Ryssland för att lösa den. Men jag har svårt att tro det, för både Kina och Ryssland har ju understött Iran på olika sätt.  Pekar ut vinnare Om någon av Trump, Xi och Putin har något att vinna på mötet så är det Putin, enligt Hallenberg. – Putin är den svagaste parten i sammanhanget. Den ryska ekonomin är ganska usel och den ryska armén lider stora förluster i Ukraina. På så sätt tror jag han politiskt kan ha störst intresse av att också visa att han inte är i kylan.  Finns det något särskilt man bör hålla utkik efter efter mötet för att kunna avgöra om samtalen faktiskt lett någonvart? – Det skulle vara någon sorts överenskommelse om att de ska träffas var sjätte eller var tolfte månad. Det skulle vara en indikation på att det ändå har haft en viss konkretion och att alla herrarna tyckte att det var givande. Men om det inte blir någon sådan uppföljning överhuvudtaget så undrar jag över hur mycket praktiska konsekvenser det får, säger Hallenberg.", "title_original": "Historiskt toppmöte väntar – experten tvivlar på genombrott", "summary_original": "I samband med Apec n har något att vinna på mötet så är det Putin, enligt Hallenberg. – Putin är den svagaste parten i sammanhanget. Den ryska ekonomin är ganska usel och den ryska armén lider stora förluster i Ukraina. På så sätt tror jag han politiskt kan ha störst intresse av att också visa att han inte är i kylan.  Finns det något särskilt man bör hålla utkik efter efter mötet för att kunna avgöra om samtalen faktiskt lett någonvart? – Det skulle vara någon sorts överenskommelse om att de ska träffas var sjätte eller var tolfte månad. Det skulle vara en indikation på att det ändå har haft en viss konkretion och att alla herrarna tyckte att det var givande. Men om det inte blir någon sådan uppföljning överhuvudtaget så undrar jag över hur mycket praktiska konsekvenser det får, säger Hallenberg.", "link": "https://www.tv4.se/artikel/7E76KdjlvQtboHSV1vNvj3/historiskt-toppmoete-vaentar-experten-tvivlar-pa-genombrott", "date_display": "2026-11-14", "date_iso": "2026-11-14T21:03:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/utrikes", "/kina", "/ryssland", "/usa", "/experter", "/politiker", "/utrikespolitik"]}, {"id": 140, "title": "”Det här är farligt, du luktar väldigt mycket seger”", "summary": "Juryn tappade kontrollen • ”A star is born”", "title_original": "”Det här är farligt, du luktar väldigt mycket seger”", "summary_original": "Juryn tappade kontrollen • ”A star is born”", "link": "https://www.tv4.se/artikel/7aaiBWeDXhOjLrJH6TufTj/det-haer-aer-farligt-du-luktar-vaeldigt-mycket-seger", "date_display": "2026-11-14", "date_iso": "2026-11-14T20:48:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje"]}, {"id": 141, "title": "Sverige säkrar gruppsegern i Nations League – efter rysare", "summary": "Blågult kunde vid seger hemma mot Bosnien-Hercegovina bli klart för uppflyttning till Nations Leagues A-division. Saken såg ut att vara klar i halvtid då Sverige hade en stor ledning, men gästerna skapade stor nerv i matchen i andra halvlek. När Graham Potters elva presenterades stod det klart att Daniel Svensson var uppsatt som högerback. Samtidigt fick exempelvis Sebastian Nanasi chansen som vänsterytter och Hugo Larsson startade på mittfältet. Sverige skulle rivstarta matchen efter att bollen satts i rullning på Nationalarenan. Redan i den femte minuten tog Blågult ledningen. Daniel Svensson gjorde sitt första landslagsmål när han ostört kunde nicka bollen i nät, efter ett inlägg på högerkanten från Anthony Elanga. Svensson firade nätrasslet med sin patenterade målgest som innebär en volt. Bosnien-Hercegovina svarade genom att vaska fram en vass chans bara minuten efter Blågults ledningsmål. Haris Tabakovic mötte ett inlägg med pannan och tvingade Viktor Johansson till en avancerad enhandsräddning i det svenska målet. Straff efter nio minuter Efter nio minuter fick sedan Sverige straffspark sedan Viktor Gyökeres dragits i tröjan. Anfallaren tog själv hand om elvameterssparken på bästa sätt genom att näta med ett tungt skott. Viktor Gyökeres blev därmed målskytt för åttonde raka matchen i Nations League. Två svenska mål på tio minuter gav Blågult en drömstart. I den 22:a minuten gjorde Sverige 3-0 genom Alexander Isak, framspelad av Viktor Gyökeres efter en snabb spelvändning. Målet föranleddes dock av en offside på Gyökeres och målet dömdes bort efter en VAR-bedömning. I samband med detta fick Bosniens assisterande tränare Zlatan Bajramovic rött kort på bortalagets bänk, efter att ha riktat frustration mot domaren innan målet underkändes. När matchen var en halvtimme gammal tändes det många pyrotekniska pjäser på den bosniska klacksektionen. På arenan meddelades det då från speakern att matchen kunde behöva avbrytas vid fler tändningar. Strax innan halvtid tilldelades Sverige sedan en andra straffspark. Den här gången gjordes Daniel Svensson ner i boxen. För andra gången i matchen klev Viktor Gyökeres fram från elva meter och anfallaren var åter klinisk när han satte dit bollen i nät. Fullträffen gjorde att Gyökeres tog sig upp topp-tio på listan över svenska landslagsmålskyttar genom tiderna. Kross vid halvlek 3-0 var ställningen i paus. Bosnien skapade sig sedan en väg in i matchen tidigt i den andra halvleken då de reducerade matchen. Svenskfödde Armin Gigovic nickade in 3-1 i den 47:e minuten. Efter målet tändes återigen ett stort antal bengaler i den bosniska klacken men matchen kunde fortgå utan avbrott. Efter knappt 60 minuters spel kom så ett efterlängtat ögonblick för Dejan Kulusevski. Efter drygt två års frånvaro från landslaget på grund av elakartad knäskada gjorde Kulusevski comeback i den blågula landslagströjan. Kulusevski ersatte Anthony Elanga och i samma veva kom även Benjamin Nygren in i spel som ersättare för Sebastian Nanasi. Bosnien reducerar I den 62:a minuten gjorde så Bosnien-Hercegovina 3-2. På en hörna nickskarvade Sead Kolasinac in en andra reducering vilket skapade rejäl nerv. Matchen flödade sedan fram och tillbaka där Bosnien vaskade fram möjligheter till en kvittering. Viktor Johansson tvingades till en jätteräddning med fem minuter kvar då Amar Memic nickade mot mål. Den svenska målvakten kunde med liten marginal hålla bollen på rätt sida mållinjen. Vidare hade Bosnien flera vassa möjligheter på stopptid, utan att få in läderkulan i nät. Trots en hel del darr lyckades Sverige hålla ut. Slutresultatet spikades till 3-2 i Blågults fördel inför 51 049 åskådare på Nationalarenan. En siffra som spikade ett nytt publikrekord för landslaget på arenan. Segern innebär att Blågult säkrade gruppsegern och därmed avancemang till Nations Leagues A-division. Vidare innebär toppositionen i gruppen att Sverige säkrade andra seedningspott (bästa möjliga utfall för ett lag i B-divisionen) inför EM-kvallottningen som genomförs 6 december.", "title_original": "Sverige säkrar gruppsegern i Nations League – efter rysare", "summary_original": "Blågult kunde en. – Trumpregimen har rationaliserat bort väldigt mycket i administrationen och sänkt anslagen, inte minst här inom flygledning och allt som har med flyg att göra administrativt, så man halkar ju efter. Han pekar också på brist på personal. – Man har också bemanningsbrist eftersom man har tagit bort många flygledare, fått dem att sluta och inte satsat på nyutbildad arbetskraft. ”Det var verkligen dags att göra någonting” Ohlsson förklarar att det fanns ett tydligt behov av att modernisera systemen, men att den delen har gått för snabbt. – Här verkar det som man kanske har skyndat på det lite väl mycket, säger han.  Han fortsätter: – Det var verkligen dags att göra någonting, men inte något som drog ut hela kontakten för det här.  – Det är det som får mig lite att tro att man kanske har skyndat på det lite för mycket. För det ska ju inte vara så att man implementerar ett nytt system och så brakar alltihopa ihop. Varnar för sårbara system Samtidigt varnar Ohlsson för att allt mer samhällsviktig infrastruktur blir beroende av avancerade tekniska system. – Så här får det inte gå till. Det här påminner om sånt som hände med banksystem och annat. Vi skapar i dag system som är väldigt sårbara. Det gör vi i ett säkerhetspolitiskt läge som är allvarligt. Det får bara inte hända, säger han. Han pekar på att flygtrafiken den här gången kunde återgå till äldre arbetssätt när systemen slutade fungera. – Om du sen fortsätter med det här med AI, hårdrar det några år framåt, då skulle en kollaps förmodligen inte bara kunna lösas på fyra timmar.", "title_original": "Flygexperten: Moderniseringen kan ha gått för fort", "summary_original": "USA:s transportminister Sean Duffy säger att flygstoppet orsakades av arbete med att byta ut gamla kopparledningar mot fiber. Exakt varför systemet havererade är däremot fortfarande inte klarlagt. Samtidigt riktas blickarna mot den pågående moderniseringen av flygledningssystemen. Det nya AI-baserade systemet SMART började rullas ut brett tidigare i veckan, enligt Business Insider. Företaget bakom systemet har dock tillbakavisat uppgifter om att SMART skulle ligga bakom haveriet. Flygexperten Jan Ohlsson tror också att problemen kan ha uppstått i mötet mellan ny och gammal teknik. – Den bästa förklaring amerikanerna själva har kommit med är ju att det är en ny mjukvara med mycket AI-inslag som mötte en ovanligt ålderstigen hårdvara, säger han.  ”Rationaliserat bort väldigt mycket” Ohlsson menar att USA länge dragits med problem kopplade till flygledningen. – Trumpregimen har rationaliserat bort väldigt mycket i administrationen och sänkt anslagen, inte minst här inom flygledning och allt som har med flyg att göra administrativt, så man halkar ju efter. Han pekar också på brist på personal. – Man har också bemanningsbrist eftersom man har tagit bort många flygledare, fått dem att sluta och inte satsat på nyutbildad arbetskraft. ”Det var verkligen dags att göra någonting” Ohlsson förklarar att det fanns ett tydligt behov av att modernisera systemen, men att den delen har gått för snabbt. – Här verkar det som man kanske har skyndat på det lite väl mycket, säger han.  Han fortsätter: – Det var verkligen dags att göra någonting, men inte något som drog ut hela kontakten för det här.  – Det är det som får mig lite att tro att man kanske har skyndat på det lite för mycket. För det ska ju inte vara så att man implementerar ett nytt system och så brakar alltihopa ihop. Varnar för sårbara system Samtidigt varnar Ohlsson för att allt mer samhällsviktig infrastruktur blir beroende av avancerade tekniska system. – Så här får det inte gå till. Det här påminner om sånt som hände med banksystem och annat. Vi skapar i dag system som är väldigt sårbara. Det gör vi i ett säkerhetspolitiskt läge som är allvarligt. Det får bara inte hända, säger han. Han pekar på att flygtrafiken den här gången kunde återgå till äldre arbetssätt när systemen slutade fungera. – Om du sen fortsätter med det här med AI, hårdrar det några år framåt, då skulle en kollaps förmodligen inte bara kunna lösas på fyra timmar.", "link": "https://www.tv4.se/artikel/9ELvCUU3wvEiHSWGSHVDW/flygexperten-efter-kaoset-moderniseringen-kan-ha-gatt-foer-fort", "date_display": "2026-11-14", "date_iso": "2026-11-14T19:06:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/utrikes", "/flygplan", "/flygresor", "/flygplats", "/flygtrafik", "/flygsakerhet", "/usa", "/ai"]}, {"id": 144, "title": "Statsvetaren: De har fördel i dragkampen om C", "summary": "Jonas Hinnfors: ”Det blir inte lätt”", "title_original": "Statsvetaren: De har fördel i dragkampen om C", "summary_original": "Jonas Hinnfors: ”Det blir inte lätt”", "link": "https://www.tv4.se/artikel/2y8O1G23gJf3Qavy0Bk2ju/statsvetaren-de-har-foerdel-i-dragkampen-om-c", "date_display": "2026-11-14", "date_iso": "2026-11-14T17:41:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 145, "title": "Självkörande robotar testas – kan bli viktiga i framtiden", "summary": "Statens väg- och transportforskningsinstitut, VTI, undersöker nu om autonoma fordon i framtiden kan användas för att transportera ut förnödenheter till folk i glesbygd vid kriser. De testar flera olika typer av fordon. Ett av dem är en markrobot från estniska Milrem Robotics. Den används redan i Ukraina, där fjärrstyrda varianter transporterar bland annat proviant och sårade. Här i Västerbotten är målet att roboten ska kunna köra helt själv. Med hjälp av ljusradar följer den en förutbestämd rutt. Inte helt färdig Men tekniken är inte helt färdig. Under provkörningen har roboten bland annat misstagit vattenpölar för hinder och varit nära att köra ner i diket. – Vår autonomi är inte tänkt för vägar. Den är inte byggd för primärvägar utan för skog och obruten terräng. Den såg inte riktigt diket som ett hinder, utan kände att det här kan jag nog faktiskt köra också, säger Joakim Hjeltström, chef för forskning och utveckling på Milrem Robotics. Samtidigt klarade roboten att väja för ett utplacerat hinder. Enligt tillverkaren ska den också kunna upptäcka och stanna för människor och mindre djur. Kan få viktig roll – Jag har själv provat att gå väldigt tätt inpå en lite mindre robot än den här. Den stannade omedelbart när jag klev framför den, säger Pia Kristiansson. Och även om tekniken fortfarande testas tror hon att självkörande fordon kan få en viktig roll i framtidens krisberedskap. – Jag tror att vi i framtiden kommer att se många olika automatiserade, självkörande fordon som också är elektrifierade. Samhället ska fungera oavsett vad vi har för väder eller krissituation, och det här kan hjälpa till, säger hon.", "title_original": "Självkörande robotar testas – kan bli viktiga i framtiden", "summary_original": "Statens väg- och transportforskningsinstitut, VTI, undersöker nu om autonoma fordon i framtiden kan användas för att transportera ut förnödenheter till folk i glesbygd vid kriser. De testar flera olika typer av fordon. Ett av dem är en markrobot från estniska Milrem Robotics. Den används redan i Ukraina, där fjärrstyrda varianter transporterar bland annat proviant och sårade. Här i Västerbotten är målet att roboten ska kunna köra helt själv. Med hjälp av ljusradar följer den en förutbestämd rutt. Inte helt färdig Men tekniken är inte helt färdig. Under provkörningen har roboten bland annat misstagit vattenpölar för hinder och varit nära att köra ner i diket. – Vår autonomi är inte tänkt för vägar. Den är inte byggd för primärvägar utan för skog och obruten terräng. Den såg inte riktigt diket som ett hinder, utan kände att det här kan jag nog faktiskt köra också, säger Joakim Hjeltström, chef för forskning och utveckling på Milrem Robotics. Samtidigt klarade roboten att väja för ett utplacerat hinder. Enligt tillverkaren ska den också kunna upptäcka och stanna för människor och mindre djur. Kan få viktig roll – Jag har själv provat att gå väldigt tätt inpå en lite mindre robot än den här. Den stannade omedelbart när jag klev framför den, säger Pia Kristiansson. Och även om tekniken fortfarande testas tror hon att självkörande fordon kan få en viktig roll i framtidens krisberedskap. – Jag tror att vi i framtiden kommer att se många olika automatiserade, självkörande fordon som också är elektrifierade. Samhället ska fungera oavsett vad vi har för väder eller krissituation, och det här kan hjälpa till, säger hon.", "link": "https://www.tv4.se/artikel/4xyijSaQxPqnSAtWiLOlCy/sjaelvkoerande-robotar-testas-kan-bli-viktiga-i-framtiden", "date_display": "2026-11-14", "date_iso": "2026-11-14T16:51:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/robot", "/krisberedskap", "/kriget-i-ukraina/svenskaberedskapen"]}, {"id": 146, "title": "Från fan till duettpartner: Nevilles drömmöte med Kim Cesarion", "summary": "Från Instagram-meddelande till att dela scen • ”Det är sjukt”", "title_original": "Från fan till duettpartner: Nevilles drömmöte med Kim Cesarion", "summary_original": "Från Instagram-meddelande till att dela scen • ”Det är sjukt”", "link": "https://www.tv4.se/artikel/1MU8c1xJotwqOAwkbQcA9S/fran-fan-till-duettpartner-nevilles-droemmoete-med-kim-cesarion", "date_display": "2026-11-14", "date_iso": "2026-11-14T16:32:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje"]}, {"id": 147, "title": "Mamman såg barnen scrolla i stället för att dansa: ”Ett dystopidisco”", "summary": "När Therése Berglin kom hem från dotterns skoldisco på fredagskvällen kunde hon inte släppa det hon hade sett. Hon satte sig och skrev ett inlägg på Instagram om barns skärmanvändning.  ”Vi behöver inte mer forskning. Svaret är här, mitt framför ögonen på oss. Det gigantiska sociala experimentet har misslyckats”, skriver Therése i inlägget. Therése, som sitter i styrelsen för skolans föräldraförening, hjälpte till på skoldiscot och beskriver hur många barn använde sina mobiltelefoner under kvällen. – Här anordnas ett disco två gånger om året. Och inte ens de här 90 minuterna kan få vara discot, utan då ska man vara hundra mil bort eller i någon annans värld än ens egen, säger hon. ”Ett dystopidisco” I inlägget beskriver hon hur hon blev ”överrumplad av sorg” under kvällen. En händelse som särskilt fastnade hos henne var när hon såg en elev sitta och scrolla på mobilen under större delen av discot. – Jag pratade med en tjej som hade suttit och scrollat i nästan en timme. Sedan berättade hon att hon dansar på fritiden. Då blir det extra sorgligt på något sätt att en person som uppenbart har ett dansintresse hellre sitter och scrollar inne på ett disco, säger Therése. Hon menar att upplevelsen gjorde problemen med barns skärmanvändning mer verkliga. – Jag har läst mycket om de här frågorna och tänkt att det kanske inte är så illa ute i verkligheten. Men det var nästan ännu värre än jag hade föreställt mig. Det var fruktansvärt sorgligt, säger hon. Therése beskriver kvällen som ett ”dystopidisco”. – Det känns bara som att vi har fipplat bort oss. Jag lägger liksom ingen skuld, givetvis inte på barnen och inte heller på föräldrarna, för att vi inte visste bättre. Nu vet vi bättre. Det råder inget tvivel om hur skadligt och dåligt det är för barn med mobiltelefoner och sociala medier. Fått stor respons Inlägget har fått stort genomslag och engagerat tusentals föräldrar. – Samtidigt som det känns lite läbbigt att tankar som man sitter och skriver vid köksbordet kan få sådan spridning, så är det ju oerhört positivt också, säger Therése. Hon fortsätter: – För det bevisar ju att det är inte bara jag vid mitt köksbord, utan det är ju föräldrar runt om i hela landet och till och med utomlands som har skrivit mig som också sitter vid sina köksbord och sliter sitt hår som jag gör.  Efter gårdagen säger Therése att hon vill utforska möjligheterna för ett mobilfritt disco.  – Jag pratade med en förälder som sa att det hade varit på tapeten förr, men att det hade fått lite ”backlash” ifrån föräldrarna. Man förstår att de vill kunna få tag på sina barn, det är inte den möjligheten jag vill ta bort. Jag vill att barnen ska uppleva ett mobilfritt disco där inne.", "title_original": "Mamman såg barnen scrolla i stället för att dansa: ”Ett dystopidisco”", "summary_original": "När Therése Berglin kom hem från dotterns skoldisco på fredagskvällen kunde hon inte släppa det hon hade sett. Hon satte sig och skrev ett inlägg på Instagram om barns skärmanvändning.  ”Vi behöver inte mer forskning. Svaret är här, mitt framför ögonen på oss. Det gigantiska sociala experimentet har misslyckats”, skriver Therése i inlägget. Therése, som sitter i styrelsen för skolans föräldraförening, hjälpte till på skoldiscot och beskriver hur många barn använde sina mobiltelefoner under kvällen. – Här anordnas ett disco två gånger om året. Och inte ens de här 90 minuterna kan få vara discot, utan då ska man vara hundra mil bort eller i någon annans värld än ens egen, säger hon. ”Ett dystopidisco” I inlägget beskriver hon hur hon blev ”överrumplad av sorg” under kvällen. En händelse som särskilt fastnade hos henne var när hon såg en elev sitta och scrolla på mobilen under större delen av discot. – Jag pratade med en tjej som hade suttit och scrollat i nästan en timme. Sedan berättade hon att hon dansar på fritiden. Då blir det extra sorgligt på något sätt att en person som uppenbart har ett dansintresse hellre sitter och scrollar inne på ett disco, säger Therése. Hon menar att upplevelsen gjorde problemen med barns skärmanvändning mer verkliga. – Jag har läst mycket om de här frågorna och tänkt att det kanske inte är så illa ute i verkligheten. Men det var nästan ännu värre än jag hade föreställt mig. Det var fruktansvärt sorgligt, säger hon. Therése beskriver kvällen som ett ”dystopidisco”. – Det känns bara som att vi har fipplat bort oss. Jag lägger liks 9:39+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Källor: Här är punkterna i S ”totalpaket” som ska locka över C", "summary": "Tre konkreta förslag • TV4 Nyheterna avslöjar", "title_original": "Källor: Här är punkterna i S ”totalpaket” som ska locka över C", "summary_original": "Tre konkreta förslag • TV4 Nyheterna avslöjar", "link": "https://www.tv4.se/artikel/7bwKcVjYrhhQgUYNYOxXoe/kaellor-haer-aer-punkterna-i-s-totalpaket-som-ska-locka-oever-c", "date_display": "2026-11-14", "date_iso": "2026-11-14T12:57:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes"]}, {"id": 150, "title": "Efter hästolyckan – har ett nytt ansikte i titan: ”Jobbigt med blickar”", "summary": "Det var i november förra året som Agnes var ute på en helt vanlig hästpromenad med sin lillasyster Alma, två vänner och tre hästar. En av hästarna blev skrämd av något och Agnes, som alltid varit van vid hästar, lade handen på djurets bakdel.   – Hästen svarar då med att sparka mig i magen och huvudet och jag svimmar av direkt. \n\nAlma stod längst bak och såg inte mycket mer än att Agnes flög bakåt.  – Jag hör bara ena tjejen ropa att Agnes är död. Då sprang jag fram och kollade pulsen. Agnes andas men jag hör att hon kvävs av sitt eget blod och jag försöker vända henne på sidan så att blodet ska åka ut, säger lillasyster Alma. ”Visste att det var över” Hon ringde därefter både ambulans och sina föräldrar. Mamma Kicki minns det ögonblick då hon fick samtalet som förändrade allt.\n\n– Jag önskar inte någon det. Det kommer alltid finnas i mig och jag hoppas att jag aldrig får uppleva något liknande.\n\nNär föräldrarna kommer till platsen möts de av ambulanspersonal som tydligt uppmanar dem att inte gå fram till Agnes. \n\n– De skrek, kom inte i närheten, det är kritiskt. Men vi är så pass nära så vi ser och där visste jag att det var över. Jag var helt säker på det när jag såg henne, säger Kicki. Har titanplattor i ansiktet Redan innan Agnes kom in till sjukhuset hade hon tappat över tre liter blod. Familjen fick flera gånger besked om att hon både skulle dö och överleva. \n\nHon låg nedsövd i två veckor och förlorade synen på vänster öga. Under sju operationer har läkarna återskapat hennes ansikte med hjälp av avancerad teknik och titanplattor, framtagna i samarbete mellan specialister i Sverige, Belgien, Colombia och Australien.\n\nAgnes beskriver det som en tuff period att vänja sig och lära sig att leva med sitt nya utseende. \n\n– Det har varit och är väldigt jobbigt. Jag trivs inte med hur jag ser ut idag och det är jobbigt att visa sig offentligt. En sådan enkel grej som att gå till affären är jättejobbigt. Jag har alltid sett ut som en i mängden, men nu är jag något utöver det vanliga. Det är jobbigt att få blickar.  Vill inspirera andra Trots det är det viktigt för Agnes att berätta vad hon varit med om och hon vill hjälpa andra som kämpar med svåra trauman eller förändrat utseende.\n\n– Kan jag visa att man kan klara det, så vill jag göra det. Jag vill försöka vara en förebild för de som känner samma sak som jag, säger hon.\n\nEtt år efter olyckan lider hon av både huvudvärk och hjärntrötthet. Agnes har tagit sig upp på hästryggen igen, men nu med större respekt för riskerna.\n\n– Första gången var jag inte rädd alls. Jag har bara suttit några få gånger och sist kände jag mig mer rädd än första gångerna. Jag tror att det är för att jag har hunnit landa i vad som faktiskt har hänt och hur mycket jag har lidit av hur snabbt det kan gå, säger hon.\n\nNu siktar Agnes på att bli sjuksköterska, för att kunna stötta andra som drabbats.\n\n– Jag tror att jag kan vara en stöttning till folk som ligger där jag låg. Det kan vara riktigt läskigt men man klarar det och man kan ta sig igenom det, säger Agnes.", "title_original": "Efter hästolyckan – har ett nytt ansikte i titan: ”Jobbigt med blickar”", "summary_original": "Det var i november förra året som Agnes var ute på en helt vanlig hästpromenad med sin lillasyster Alma, två vänner och tre hästar. En av hästarna blev skrämd av något och Agnes, som alltid varit van vid hästar, lade handen på djurets bakdel.   – Hästen svarar då med att sparka mig i magen och huvudet och jag svimmar av direkt. \n\nAlma stod längst bak och såg inte mycket mer än att Agnes flög bakåt.  – Jag hör bara ena tjejen ropa att Agnes är död. Då sprang jag fram och kollade pulsen. Agnes andas men jag hör att hon kvävs av sitt eget blod och jag försöker vända henne på sidan så att blodet ska åka ut, säger lillasyster Alma. ”Visste att det var över” Hon ringde därefter både ambulans och sina föräldrar. Mamma Kicki minns det ögonblick då hon fick samtalet som förändrade allt.\n\n– Jag önskar inte någon det. Det kommer alltid finnas i mig och jag hoppas att jag aldrig får uppleva något liknande.\n\nNär föräldrarna kommer till platsen möts de av ambulanspersonal som tydligt uppmanar dem att inte gå fram till Agnes. \n\n– De skrek, kom inte i närheten, det är kritiskt. Men vi är så pass nära så vi ser och där visste jag att det var över. Jag var helt säker på det när jag såg henne, säger Kicki. Har titanplattor i ansiktet Redan innan Agnes kom in till sjukhuset hade hon tappat över tre liter blod. Familjen fick flera gånger besked om att hon både skulle dö och överleva. \n\nHon låg nedsövd i två veckor och förlorade synen på vänster öga. Under sju operationer har läkarna återskapat hennes ansikte med hjälp av avancerad teknik och titanplattor, framtagna i samarbete mellan specialister i Sverige, Belgien, Colombia och Australien.\n\nAgnes beskriver det som en tuff period att vänja sig och lära sig att leva med sitt nya utseende. \n\n– Det har varit och är väldigt jobbigt. Jag trivs inte med hur jag ser ut idag och det är jobbigt att visa sig offentligt. En sådan enkel grej som att gå till affären är jättejobbigt. Jag har alltid sett ut som en i mängden, men nu är jag något utöver det vanliga. Det är jobbigt att få blickar.  Vill inspirera andra Trots det är det viktigt för Agnes att berätta vad hon varit med om och hon vill hjälpa andra som kämpar med svåra trauman eller förändrat utseende.\n\n– Kan jag visa att man kan klara det, så vill jag göra det. Jag vill försöka vara en förebild för de som känner samma sak som jag, säger hon.\n\nEtt år efter olyckan lider hon av både huvudvärk och hjärntrötthet. Agnes har tagit sig upp på hästryggen igen, men nu med större respekt för riskerna.\n\n– Första gången var jag inte rädd alls. Jag har bara suttit några få gånger och sist kände jag mig mer rädd än första gångerna. Jag tror att det är för att jag har hunnit landa i vad som faktiskt har hänt och hur mycket jag har lidit av hur snabbt det kan gå, säger hon.\n\nNu siktar Agnes på att bli sjuksköterska, för att kunna stötta andra som drabbats.\n\n– Jag tror att jag kan vara en stöttning till folk som ligger där jag låg. Det kan vara riktigt läskigt men man klarar det och man kan ta sig igenom det, säger Agnes.", "link": "https://www.tv4.se/artikel/DIgQR7gnm2hpuTk9nbrfw/agnes-var-naera-pa-att-doe-av-haestspark", "date_display": "2026-11-14", "date_iso": "2026-11-14T11:24:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/hastar", "/olycka"]}, {"id": 151, "title": "Grannarna i chock efter mordet: ”Hon var jättetrevlig”", "summary": "En kvinna hittades död i en lägenhet i Luleå natten mot fredagen. Enligt vittnen som TV4 Nyheterna har pratat med var polisinsatsen på platsen omfattande. Polisen har hittills varit mycket förtegen om händelsen. – De knackade på vid 23-tiden i går kväll. Jag kikade genom persiennerna och tror att det var polisen, men jag vågade inte öppna eftersom jag bor själv. Nu förstår jag varför de knackade på. Jag hade sett blåljus, men trodde att det var någon fest i området intill, säger en granne. Anhållna för mord Två personer greps på platsen och anhölls senare, misstänkta för mord. – Två män är anhållna, skäligen misstänkta för mord. Utredningen pågår och personerna ska höras under dagen, säger Annika Collin, presstalesperson vid Åklagarmyndigheten. Under lördagen är det fortsatt polisnärvaro på platsen och fastigheten är avspärrad. Flera polisenheter, däribland hundförare, finns på plats, enligt TV4 Nyheternas reporter. Grannen: ”Tragiskt” Grannar beskriver området som lugnt och säger att de inte tidigare har hört om något stök vid den aktuella adressen. På gatan bor främst äldre personer och barnfamiljer. – Hon var jättetrevlig. Tragiskt, säger en granne till TV4 Nyheterna. Anhöriga är underrättade.", "title_original": "Grannarna i chock efter mordet: ”Hon var jättetrevlig”", "summary_original": "En kvinna hittades död i en lägenhet i Luleå natten mot fredagen. Enligt vittnen som TV4 Nyheterna har pratat med var polisinsatsen på platsen omfattande. Polisen har hittills varit mycket förtegen om händelsen. – De knackade på vid 23-tiden i går kväll. Jag kikade genom persiennerna och tror att det var polisen, men jag vågade inte öppna eftersom jag bor själv. Nu förstår jag varför de knackade på. Jag hade sett blåljus, men trodde att det var någon fest i området intill, säger en granne. Anhållna för mord Två personer greps på platsen och anhölls senare, misstänkta för mord. – Två män är anhållna, skäligen misstänkta för mord. Utredningen pågår och personerna ska höras under dagen, säger Annika Collin, presstalesperson vid Åklagarmyndigheten. Under lördagen är det fortsatt polisnärvaro på platsen och fastigheten är avspärrad. Flera polisenheter, däribland hundförare, finns på plats, enligt TV4 Nyheternas reporter. Grannen: ”Tragiskt” Grannar beskriver området som lugnt och säger att de inte tidigare har hört om något stök vid den aktuella adressen. På gatan bor främst äldre personer och barnfamiljer. – Hon var jättetrevlig. Tragiskt, säger en granne till TV4 Nyheterna. Anhöriga är underrättade.", "link": "https://www.tv4.se/artikel/21AsW90L5SnN8BIDpkYiie/grannarna-i-chock-efter-mordet-hon-var-jaettetrevlig", "date_display": "2026-11-14", "date_iso": "2026-11-14T11:04:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/mord", "/lulea"]}, {"id": 152, "title": "PM Nilssons ord efter DN:s besked: ”Den borde aldrig publicerats”", "summary": "I en krönika i DN:s papperstidning och e-tidning spekulerar krönikören Catia Hultquist kring rykten på sociala medier om att Timbro-vd:n PM Nilsson använder kajal.  ”Han har därmed gått från en ganska städad till en mer punkig look. Vad har hänt?”, skriver Hultquist i krönikan. Hultquist kopplar också frågan till en växande trend där allt fler män använder skönhetsprodukter. Samtidigt tar hon upp PM Nilssons egen förklaring, att de mörka partierna kring ögonen beror på ögonskador och ögondroppar. Hultquist skriver att hon först uppfattade förklaringen som en ”klassisk bortförklaring”, innan hon senare konstaterar att läkemedlen i fråga kan ge mörkare hud runt ögonen som biverkning. Hårda orden: ”Svin” I ett inlägg på X reagerade PM Nilsson starkt på krönikan.  ”Det här tar jag illa vid mig av”, skriver han. Han fortsatte inlägget med att förklara att ”man ska inte ta lätt på personers sjukdomar”. ”Jag har opererat två näthinneavlossningar, gjort två starroperationer och tar droppar mot för högt tryck. Jag kan i teorin förlora synen när som helst. Men för DN är det en kittling i magen. Svin.” Tidningen backar  Efter att PM Nilsson uttryckt vad han tycker och tänker om krönikan så har Dagens Nyheter beslutat att inte publicera krönikan på sin sajt. Det skriver tidningens kulturchef Björn Wiman i en kommentar till TV4 Nyheterna. ”Det har från vår sida inte funnits någon avsikt att såra eller håna PM Nilsson. Med anledning av hans starka reaktion och utförliga beskrivning av sin sjukdom har vi beslutat att inte sprida krönikan vidare digitalt”, skriver han. PM Nilssons reaktion efter beskedet Efter DN:s besked säger PM Nilsson att han tolkar beslutet som att tidningen kommit fram till att krönikan aldrig borde ha publicerats. – Den borde aldrig ha publicerats och det tror jag att de själva tycker också, säger han. Han fortsätter: – Jag tycker inte att det är roligt alls. Jag använder ju inte smink, utan det är en ögonsjukdom som gör att det ser ut så här. ”Verkar vara tufft för dem” Nilsson säger att DN nu gör ”det som går att göra”, men menar samtidigt att kontrollen borde ha skett innan publiceringen. – Om man nu ger sig på enskilda människor så ska man fundera igenom skälen. Det är jätteviktigt, säger han. Någon uttrycklig ursäkt har han däremot inte fått. – Det är klart att de kan be om ursäkt på riktigt, men det verkar vara tufft för dem, säger PM Nilsson.  TV4 Nyheterna har sökt Catia Hultquist.", "title_original": "PM Nilssons ord efter DN:s besked: ”Den borde aldrig publicerats”", "summary_original": "I en krönika i DN:s papperstidning och e-tidning spekulerar krönikören Catia Hultquist kring rykten på sociala medier om att Timbro-vd:n PM Nilsson använder kajal.  ”Han har därmed gått från en ganska städad till en mer punkig look. Vad har hänt?”, skriver Hultquist i krönikan. Hultquist kopplar också frågan till en växande trend där allt fler män använder skönhetsprodukter. Samtidigt tar hon upp PM Nilssons egen förklaring, att de mörka partierna kring ögonen beror på ögonskador och ögondroppar. Hultquist skriver att hon först uppfattade förklaringen som en ”klassisk bortförklaring”, innan hon senare konstaterar att läkemedlen i fråga kan ge mörkare hud runt ögonen som biverkning. Hårda orden: ”Svin” I ett inlägg på X reagerade PM Nilsson starkt på krönikan.  ”Det här tar jag illa vid mig av”, skriver han. Han fortsatte inlägget med att förklara att ”man ska inte ta lätt på personers sjukdomar”. ”Jag har opererat två näthinneavlossningar, gjort två starroper avningar hölls", "title_original": "Snöovädret fick Svenska kyrkan i Skellefteå att stänga all verksamhet", "summary_original": "Valde att följa kommunens rekommendationer – endast begravningar hölls", "link": "https://www.dagen.se/nyheter/snoeovaedret-fick-svenska-kyrkan-i-skelleftea-att-staenga-all-verksamhet/10633848", "date_display": "2026-11-14", "date_iso": "2026-11-14T09:44:31+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Finansministern om sin adhd-diagnos: ”Hjärnan är på fullt tryck”", "summary": "Genom att berätta öppet om sin diagnos hoppas Elisabeth Svantesson att hon kan hjälpa andra, inte minst barn och unga. – Jag har inget att tjäna på det här personligen. Att ha adhd är inte min personlighet. Man kan ha adhd och komma väldigt långt om man får hjälp och man kan överleva väldigt jobbiga saker.  Vill att fler öppnar upp sig Svantesson trycker på vikten av att även anhöriga och kollegor förstår hur en person med adhd fungerar. – Jag såg till att de närmsta medarbetarna fick träffa en person som är duktig på adhd, utan att jag var där. Personen kunde förklara vad jag behövde hjälp med, säger hon.  Hon vill också att fler öppnar upp sig om sina svårigheter.  – Även innan jag fick diagnosen var jag noga med att mina medarbetare ska kunna berätta hur de mår. Jag brukar säga till männen jag jobbar med att det aldrig är en svaghet att visa skörhet. Man måste inte lägga ut hela sitt liv men ett öppet klimat underlättar. Så var uppväxten Svantesson växte upp som den yngsta i en stor familj. Hon berättar att hon sedan tidig ålder levde med ångest.  – Jag var väldigt skör och skörheten har funnits med mig hela mitt liv. Vi har alla våra sprickor i själen som tar sig uttryck på olika sätt. Jag hade en väldig rastlöshet och energi men jag kämpade med den här ångesten, säger hon.  Hon beskriver att hon som liten pratade mycket vilket på 70-talet inte alltid bemöttes väl.  – Jag kände skam när jag blev tillsagd. Jag ville inget illa.  Energin finns med henne än i dag som 59-åring och hon beskriver en vardag där hon får kämpa mycket.  – Hur mycket vilja och energi man än har orkar inte hjärnan alltid vara på högsta tryck.  Livet som toppolitiker med adhd I dag har hon fått verktygen att hantera sin diagnos, som hon fick sent i livet. – Jag har sett att jag kan jobba ändå. Ångesten har inte fått stå i min väg men den har gjort mig trött. Det finns perioder där jag bara måste få stänga av. Jag har tur att ha en politisk stab och människor runt mig som kan bidra på olika sätt, det har inte alla.  Hon berättar att hon läste mycket om adhd och kände igen sig mycket i hur diagnosen beskrevs. Hennes uppmaning är att söka hjälp tidigt.  – Det går att hitta verktyg att klara det. Man kan faktiskt vara finansminister och samtidigt ha adhd. För min del har jag tagit hjälp av mediciner. De här fyra åren som finansminister har jag ändå varit piggare än de fyra åren innan. Jag hade gärna sökt hjälp tidigare. Adhd ökar bland unga Socialstyrelsen släppte i veckan nya siffror som visar att 14 procent av pojkar och drygt 9 procent av flickor 10–17 år hade en adhd-diagnos 2025. Rapporten visar också att diagnoserna fortsätter att öka bland barn och unga. – Alla barn, oavsett vilka behov man har, har rätt att bli bemött. Sedan tänker jag att det ändå har hänt mycket. När jag var liten mådde min mamma väldigt dåligt. Hon fick ingen hjälp eller stöd. I dag har vi andra möjligheter och vi vågar samtala. Om alla vi är lite snällare mot oss själva och varandra blir allt lite bättre.", "title_original": "Finansministern om sin adhd-diagnos: ”Hjärnan är på fullt tryck”", "summary_original": "Genom att berätta öppet om sin diagnos hoppas Elisabeth Svantesson att hon kan hjälpa andra, inte minst barn och unga. – Jag har inget att tjäna på det här personligen. Att ha adhd är inte min personlighet. Man kan ha adhd och komma väldigt långt om man får hjälp och man kan överleva väldigt jobbiga saker.  Vill att fler öppnar upp sig Svantesson trycker på vikten av att även anhöriga och kollegor förstår hur en person med adhd fungerar. – Jag såg till att de närmsta medarbetarna fick träffa en person som är duktig på adhd, utan att jag var där. Personen kunde förklara vad jag behövde hjälp med, säger hon.  Hon vill också att fler öppnar upp sig om sina svårigheter.  – Även innan jag fick diagnosen var jag noga med att mina medarbetare ska kunna berätta hur de mår. Jag brukar säga till männen jag jobbar med att det aldrig är en svaghet att visa skörhet. Man måste inte lägga ut hela sitt liv men ett öppet klimat underlättar. Så var uppväxten Svantesson växte upp som den yngsta i en stor familj. Hon berättar att hon sedan tidig ålder levde med ångest.  – Jag var väldigt skör och skörheten har funnits med mig hela mitt liv. Vi har alla våra sprickor i själen som tar sig uttryck på olika sätt. Jag hade en väldig rastlöshet och energi men jag kämpade med den här ångesten, säger hon.  Hon beskriver att hon som liten pratade mycket vilket på 70-talet inte alltid bemöttes väl.  – Jag kände skam när jag blev tillsagd. Jag ville inget illa.  Energin finns med henne än i dag som 59-åring och hon beskriver en vardag där hon får kämpa mycket.  – Hur mycket vilja och energi man än har orkar inte hjärnan alltid vara på högsta tryck.  Livet som toppolitiker med adhd I dag har hon fått verktygen att hantera sin diagnos, som hon fick sent i livet. – Jag har sett att jag kan jobba ändå. Ångesten har inte fått stå i min väg men den har gjort mig trött. Det finns perioder där jag bara måste få stänga av. Jag har tur att ha en politisk stab och människor runt mig som kan bidra på olika sätt, det har inte alla.  Hon berättar att hon läste mycket om adhd och kände igen sig mycket i hur diagnosen beskrevs. Hennes uppmaning är att söka hjälp tidigt.  – Det går att hitta verktyg att klara det. Man kan faktiskt vara finansminister och samtidigt ha adhd. För min del har jag tagit hjälp av mediciner. De här fyra åren som finansminister har jag ändå varit piggare än de fyra åren innan. Jag hade gärna sökt hjälp tidigare. Adhd ökar bland unga Socialstyrelsen släppte i veckan nya siffror som visar att 14 procent av pojkar och drygt 9 procent av flickor 10–17 år hade en adhd-diagnos 2025. Rapporten visar också att diagnoserna fortsätter att öka bland barn och unga. – Alla barn, oavsett vilka behov man har, har rätt att bli bemött. Sedan tänker jag att det ändå har hänt mycket. När jag var liten mådde min mamma väldigt dåligt. Hon fick ingen hjälp eller stöd. I dag har vi andra möjligheter och vi vågar samtala. Om alla vi är lite snällare mot oss själva och varandra blir allt lite bättre.", "link": "https://www.tv4.se/artikel/1InZyEkbQi0mmssnBHMSrP/finansministern-om-sin-adhd-diagnos-man-far-kaempa-vaeldigt-mycket", "date_display": "2026-11-14", "date_iso": "2026-11-14T08:55:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["NPF-diagnos", "/npf-diagnos", "/politiker", "/nyhetsmorgon", "/elisabeth-svantesson"]}, {"id": 155, "title": "Ännu högre elpriser väntas: ”Stoppet får stora konsekvenser”", "summary": "På lördagsmorgonen rapporterade Aftonbladet att kärnkraftsreaktorn Forsmark 3 stoppats. Därmed står fyra av landets sex reaktorer stilla. Enligt Holtz, elmarknadsanalytiker på Polite Energy, innebär stoppet dels mindre elproduktion i södra Sverige, och dels att det kan bli svårare att föra över el från norr till söder, vilket kan pressa upp elpriset ytterligare. Då blir det en dubbel effekt i södra Sverige och då kan det bli några tiotals öre per kilowattimme, framför allt i mitten och slutet av nästa vecka, torsdag–fredag, för då kommer det att bli lite kallare och eventuellt också lite mindre vind, säger Holtz. Kan ”sticka iväg” Det rådande läget med höga gaspriser som ger höga elpriser på kontinenten, samt brist på vatten i vattenmagasinen, framför allt i södra Norge, bidrar också till effekten. När elsystemet är ansträngt så får varje megawattimme som försvinner större prispåverkan, säger Holtz. Han råder hushållen att i första hand minska sin elanvändning generellt. Just nu är det en ganska hög prisnivå alla timmar eller kvartar. Men nu torsdag–fredag kommer det säkert att sticka iväg extra mycket på morgonen. Kan man då vara flexibel i sin användning och samtidigt har ett kvartsavräknat elhandelsavtal finns det en hel del pengar att spara. Fel på kabel Orsaken till stoppet i Forsmark 3 är en kortslutning i ett kablage. Vi har lokaliserat felet till en kabel, som behöver bytas ut, säger Martin Danielsson, kommunikatör i beredskap hos Forsmark, till Aftonbladet. Felet upptäcktes under fredagen och enligt prognosen dröjer det till fredag i nästa vecka innan produktionen är i gång. Vi vill ha god säkerhetsmarginal, så vi har valt att stoppa produktionen under arbetet, säger Danielsson. Därmed är bara en av verkets tre reaktorer, Forsmark 2, i gång, då Forsmark 1 står avställd för årligt underhåll. När vintern och kylan närmar sig blir det dock allt viktigare att reaktorerna producerar, enligt Christian Holtz. Flera reaktorer ska komma in nästa vecka, så det blir en väldig skillnad om de kommer in som planerat. Då är förutsättningarna väldigt mycket bättre, men då vill det till att de gör det också. Det är alltid ett osäkerhetsmoment.", "title_original": "Ännu högre elpriser väntas: ”Stoppet får stora konsekvenser”", "summary_original": "På lördagsmorgonen rapporterade Aftonbladet att kärnkraftsreaktorn Forsmark 3 stoppats. Därmed står fyra av landets sex reaktorer stilla. Enligt Holtz, elmarknadsanalytiker på Polite Energy, innebär stoppet dels mindre elproduktion i södra Sverige, och dels att det kan bli svårare att föra över el från norr till söder, vilket kan pressa upp elpriset ytterligare. Då blir det en dubbel effekt i södra Sverige och då kan det bli några tiotals öre per kilowattimme, framför allt i mitten och slutet av nästa mark", "/ekonomi", "/ekonomi/elpriset"]}, {"id": 156, "title": "Dutch baby med karamelliserade päron och nötcrunch", "summary": "Dagens helgtips bjuder på en gyllene ugnspannkaka med höga, frasiga kanter toppad med len mascarponekräm, smörstekta päron med smak av kardemumma och ett knaprigt hasselnötscrunch. Se Camilla Hamids recept", "title_original": "Dutch baby med karamelliserade päron och nötcrunch", "summary_original": "Dagens helgtips bjuder på en gyllene ugnspannkaka med höga, frasiga kanter toppad med len mascarponekräm, smörstekta päron med smak av kardemumma och ett knaprigt hasselnötscrunch. Se Camilla Hamids recept", "link": "https://www.tv4.se/artikel/Ym26PQntogZDV2YS1R2XA/dutch-baby-med-karamelliserade-paeron-och-noetcrunch", "date_display": "2026-11-14", "date_iso": "2026-11-14T07:33:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/camilla-hamid", "/kokets-helgtips", "/koket"]}, {"id": 157, "title": "Förslag om samkönade vigslar splittrar kyrkan: ”Till slut en sekt”", "summary": "Kyrkomötet ska i början av nästa vecka ta ställning till en motion som vill begränsa prästers möjlighet att tacka nej till att viga samkönade par. Frågan har väckt starka reaktioner och lett till öppna brev och namninsamlingar på båda sidor. – Det vi vill göra är att tydliggöra Svenska kyrkans position i frågan. Vår äktenskapssyn är könsneutral, säger Jesper Eneroth, socialdemokratisk kyrkopolitiker. Han står bakom motionen och menar att dagens ordning kan innebära att samkönade par inte känner sig fullt välkomna i en församling. – Man har redan sagt det i ett antal ställningstaganden tidigare, men det är fortfarande så att man som enskild präst kan hänvisa till 2009 års beslut, säger han. Vill behålla nuvarande system Förslaget har mött kritik. 126 präster har skrivit under ett öppet brev mot motionen. De lyfter bland annat fram prästers rätt till sin egen övertygelse och menar att dagens system fungerar. De varnar också för att det de beskriver som ett vigseltvång riskerar att splittra kyrkan. En av undertecknarna är Johanna Risenfors Lindmark, präst i Fässbergs församling i Mölndal. Hon viger själv samkönade par, men är ändå kritisk till förslaget. För henne handlar frågan inte om själva vigseln, utan om vilken sorts kyrka Svenska kyrkan ska vara. – Kyrkan behöver få vara en bred folkkyrka som rymmer olika åsikter, där alla inte behöver tycka och tänka samma. Hon varnar för att en alltför likriktad kyrka riskerar att förlora sin öppenhet. – Om alla ska stöpas i samma form och tycka lika om precis allting så är det inte längre en öppen folkkyrka. Då är det till slut en sekt, säger Johanna Risenfors Lindmark. Det öppna brevet mot motionen fick i sin tur svar från 117 personer med olika uppdrag inom Svenska kyrkan, som ställde sig bakom förslaget. Oro för hela församlingslivet Jesper Eneroth menar att problemet blir särskilt tydligt i församlingar där ingen präst vill viga samkönade par. I dag behöver kyrkoherden se till att en annan präst kan genomföra vigseln, ibland genom att ta in en präst från en annan ort. – Det löser ju vigselfrågan, men det löser inte livet i kyrkan. Hur inkluderad och välkommen känner man sig då i söndagsgudstjänsten eller i musik- och kulturverksamheten? säger Jesper Eneroth. Johanna Risenfors Lindmark håller inte med om att dagens ordning innebär ett problem för paren. – Inget par behöver möta ett nej. Man kontaktar församlingsexpeditionen, berättar när och var man vill gifta sig och sedan ordnar församlingen en präst som kan förrätta vigseln, säger hon.", "title_original": "Förslag om samkönade vigslar splittrar kyrkan: ”Till slut en sekt”", "summary_original": "Kyrkomötet ska i början av nästa vecka ta ställning till en motion som vill begränsa prästers möjlighet att tacka nej till att viga samkönade par. Frågan har väckt starka reaktioner och lett till öppna brev och namninsamlingar på båda sidor. – Det vi vill göra är att
