le": "Test: Are the ten difficult words in your vocabulary?", "summary": "Do you know what mundane, fox and polenta mean? The correct explanations come from the Swedish Academy's dictionaries.", "title_original": "Test: Ingår de tio svåra orden i ditt ordförråd?", "summary_original": "Vet du vad mondän, räfst och polenta betyder? De rätta förklaringarna kommer från Svenska Akademiens ordböcker.", "link": "https://www.svd.se/a/vrxd2m/test-ingar-de-tio-svara-orden-i-ditt-ordforrad", "date_display": "2026-07-20", "date_iso": "2026-07-20T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 109, "title": "United States: 50 percent tariffs on goods from Canada", "summary": "", "title_original": "USA: 50-procentiga tullar på varor från Kanada", "summary_original": "", "link": "https://www.svd.se/a/m0zXop/usa-50-procentiga-tullar-pa-varor-fran-kanada", "date_display": "2026-07-20", "date_iso": "2026-07-20T21:28:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 110, "title": "Argentina to be investigated by Fifa", "summary": "", "title_original": "Argentina ska utredas av Fifa", "summary_original": "", "link": "https://www.svd.se/a/XM4v0n/argentina-ska-utredas-av-fifa", "date_display": "2026-07-20", "date_iso": "2026-07-20T21:07:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 111, "title": "Tenth night of American attacks on Iran", "summary": "", "title_original": "Tionde natten med amerikanska attacker mot Iran", "summary_original": "", "link": "https://www.svd.se/a/vrx4Jm/tionde-natten-med-amerikanska-attacker-mot-iran", "date_display": "2026-07-20", "date_iso": "2026-07-20T20:46:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 112, "title": "1.8 million on the streets – celebrating Spain's world champions", "summary": "The king's tribute • TV4's reporter on site: \"Good move\"", "title_original": "1,8 miljoner på gatorna – hyllar Spaniens världsmästare", "summary_original": "Kungens hyllning • TV4:s reporter på plats: ”Bra drag”", "link": "https://www.tv4.se/artikel/7moZFuj9iLPq7dcNFcxIGs/1-8-miljoner-pa-gatorna-hyllar-spaniens-vaerldsmaestare", "date_display": "2026-07-20", "date_iso": "2026-07-20T20:33:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 113, "title": "Expert: The US wants a \"victory against Cuba\"", "summary": "The United States accuses Cuba of having infiltrated the highest level of the American state apparatus for several decades. The timing of the 100-page report is no coincidence, according to political scientist Fredrik Uggla.", "title_original": "Expert: USA vill ha en ”seger mot Kuba”", "summary_original": "USA anklagar Kuba för att ha infiltrerat högsta nivån av den amerikanska statsapparaten under flera decennier. Tidpunkten för den 100 sidor långa rapporten är ingen slump, enligt statsvetaren Fredrik Uggla.", "link": "https://www.svd.se/a/Wv8Q6K/expert-darfor-usa-slapper-en-rapport-om-kuba", "date_display": "2026-07-20", "date_iso": "2026-07-20T20:29:54+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 114, "title": "Malmö badly out - Skogmar saved points", "summary": "Malmö were on the way to defeat - then Adrian Skogmar stepped forward. The 20-year-old arranged a point after 2–2 against Kalmar. - When you lead twice, you want three points, says KFF player Carl Gustafsson in TV4 Play.", "title_original": "Malmö illa ute – Skogmar räddade poäng", "summary_original": "Malmö var på väg mot förlust – då klev Adrian Skogmar fram. 20-åringen ordnande en poäng efter 2–2 mot Kalmar. – När man leder två gånger vill man ha tre poäng, säger KFF-spelaren Carl Gustafsson i TV4 Play.", "link": "https://www.dn.se/sport/malmo-illa-ute-skogmar-raddade-poang/", "date_display": "2026-07-20", "date_iso": "2026-07-20T20:15:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "New ultimatum to Zelenskyi - has until Friday", "summary": "Ukrainian President Volodymyr Zelenskyi recently chose to fire Defense Minister Mykhailo Fedorov, after only six months in the post.  Fedorov was liked by many Ukrainians and experts singled him out as one of the central figures behind Ukraine's success in the war against Russia. The decision led to widespread protests around the country.  - Fedorov, when he is outside the decision-making, it is clear that there is a risk that Ukraine will lose momentum. Especially now, when it seems that Ukraine has gained a kind of strategic advantage thanks to its long-range robots that they strike with inside Russia, Russia expert Malcolm Dixelius has previously said.  Making demands on the president What was behind Zelenskyi's move, according to several media outlets, was an internal power struggle between Fedorov and Commander-in-Chief Oleksandr Syrskyi. The decision to fire Fedorov was \"the sure thing before the uncertain\", according to Dixelius. On Monday, new protests were held in Ukraine. The protesters want to see Fedorov return as defense minister and at the same time demand that Syrskyj resign. - Today's event is not a protest - it is an action that focuses on our demands. After that, there will be a break of three days until Friday. And if our demand is met by Friday at the latest, we will cancel the action, one of the organizers, veteran Dmytro Koziatynskyi, told the Kyiv Independent. \"He only wants one thing\" According to several media, it is only a matter of time before Syrskyj is fired. Meanwhile, according to the Financial Times and the Kyiv Independent, Fedorov has been offered a new role in charge of defense innovation and military modernization.  - It is important for Fedorov to continue with all the projects he has started, a person with insight tells the Kyiv Independent. But Fedorov reportedly turned down that role and is said to be only interested in returning as defense minister. - He has a big influence right now. He only wants one thing: to be reinstated as defense minister. He knows that he has most of society p", "title_original": "Nytt ultimatum till Zelenskyj – har till fredag på sig", "summary_original": "Ukrainas president Volodymyr Zelenskyj valde nyligen att sparka försvarsminister Mychajlo Fedorov, efter bara sex månader på posten.  Fedorov var omtyckt av många ukrainare och experter pekade ut honom som en av de centrala personerna bakom Ukrainas framgångar i kriget mot Ryssland. Beslutet ledde till omfattande protester runt om i landet.  – Fedorov, när han står utanför beslutsfattandet, så är det klart att det finns en risk att Ukraina tappar tempo. Särskilt nu, när det verkar som om Ukraina fått ett slags strategiskt övertag tack vare sina långdistansrobotar som de slår till med inne i Ryssland, har Rysslandskännaren Malcolm Dixelius tidigare sagt.  Sätter krav på presidenten Det som låg bakom Zelenskyjs drag var enligt flera medier en intern maktkamp mellan Fedorov och överbefälhavaren Oleksandr Syrskyj. Beslutet att sparka Fedorov var ”det säkra före det osäkra”, enligt Dixelius. Under måndagen hölls nya protester i Ukraina. Demonstranterna vill se Fedorov återvända som försvarsminister och kräver samtidigt att Syrskyj avgår. – Dagens tillställning är ingen protest – det är en aktion som fokuserar på våra krav. Därefter blir det ett uppehåll på tre dagar fram till fredag. Och om vårt krav uppfylls senast på fredag kommer vi att avbryta aktionen, säger en av organisatörerna, veteranen Dmytro Koziatynskyi, till Kyiv Independent. ”Han vill bara en sak” Enligt flera medier är det bara en tidsfråga innan Syrskyj får sparken. Samtidigt har Fedorov, enligt Financial Times och Kyiv Independent, erbjudits en ny roll med ansvar för försvarsinnovation och militär modernisering.  – Det är viktigt för Fedorov att fortsätta med alla de projekt han har påbörjat, säger en person med insyn till Kyiv Independent. Men Fedorov ska ha tackat nej till den rollen och uppges endast vara intresserad av att återvända som försvarsminister. – Han har ett stort inflytande just nu. Han vill bara en sak: att återinsättas som försvarsminister. Han vet att han har större delen av samhället på sin sida, säger en person med insyn till Financial Times.", "link": "https://www.tv4.se/artikel/4JqVtkSZPtMJ2AftEvnzf1/nytt-ultimatum-till-zelenskyj-har-till-fredag-pa-sig", "date_display": "2026-07-20", "date_iso": "2026-07-20T20:02:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukraina", "/ukrainakonflikten", "/zelenskyj", "/protester", "/demonstration", "/politiker"]}, {"id": 116, "title": "Criticism of Danish shipyard - servicing Russian ships", "summary": "A liquefied gas supertanker from Siberia is at anchor on the island of Funen in Denmark, where it will be serviced at a Danish shipyard - the only one in Europe that still services Russian ships. Despite the war, imports of Russian gas to Europe are increasing.", "title_original": "Kritik mot danskt varv – servar ryska fartyg", "summary_original": "En supertanker med flytande gas från Sibirien ligger för ankar på ön Fyn i Danmark, där den ska servas i ett danskt skeppsvarv – det enda i Europa som fortfarande servar ryska fartyg. Trots kriget ökar importen av rysk gas till Europa.", "link": "https://www.svd.se/a/wrxo6P/ryska-gasfartyg-servas-i-danmark-vagrar-sluta-trots-kritik", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:56:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 117, "title": "In Mexico City, spas, swimming pools and skate parks are being built for the poor", "summary": "MEXICO CITY. By building swimming pools, culture centers and skateboard parks as lavish as in the city's wealthiest parts, the rulers of Mexico City are trying to raise the status of the outer areas. The project is called Utopías and shows how urban planning can be used to reduce social divides.", "title_original": "I Mexico City byggs spa, simhallar och skejtparker för de fattiga", "summary_original": "MEXICO CITY. Genom att bygga lika påkostade simhallar, kulturhus och skejtboardparker som i stadens rikaste delar försöker de styrande i Mexico City höja statusen i ytterområdena. Projektet kallas Utopías och visar hur stadsplanering kan användas för att minska sociala klyftor.", "link": "https://www.dn.se/varlden/i-mexico-city-byggs-spa-simhallar-och-skejtparker-for-de-fattiga/", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:42:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Sent to Sweden: \"We were so close in the hold that everyone got lice\"", "summary": "In February 1942, Carita Blomqvist stood in the basement of the post office in Helsinki with her mother and little brother Tage. Around them, hundreds of other children were waiting to be sent to Sweden.", "title_original": "Skickades till Sverige: ”Vi låg så tätt i lastrummet att alla fick löss”", "summary_original": "I februari 1942 stod Carita Blomqvist i posthusets källare i Helsingfors tillsammans med sin mamma och lillebror Tage. Runt dem väntade hundratals andra barn som skulle skickas till Sverige.", "link": "https://www.dn.se/varlden/skickades-till-sverige-vi-lag-sa-tatt-i-lastrummet-att-alla-fick-loss/", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:32:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Leader: The government has barely built a power plant - a handshake is missing", "summary": "The government could have put in place a broad agreement to build both wind power and nuclear power. Now it is postponed to the next government.", "title_original": "Ledare: Regeringen har knappt byggt kraftverk – ett handslag saknas", "summary_original": "Regeringen hade kunnat få på plats en bred överenskommelse för att bygga både vindkraft och kärnkraft. Nu skjuts det till nästa regering.", "link": "https://www.dn.se/ledare/regeringen-har-knappt-byggt-kraftverk-ett-handslag-saknas/", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:29:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "The crown prince is celebrated in the crisis: \"Norwegian monarchy's anchor\"", "summary": "On Monday, Crown Prince Haakon of Norway turns 53, after a period of crises that characterized the Norwegian royal house. Now the court experts praise him for the way he has handled the media storm. - He is very clearly the anchor of the Norwegian monarchy right now, says Ebba von Sydow.", "title_original": "Kronprinsen hyllas i krisen: ”Norska monarkins ankare”", "summary_original": "På måndagen fyller kronprins Haakon av Norge 53 år, efter en tid av kriser som präglat det norska kungahuset. Nu hyllar hovexperterna honom för hur han har hanterat mediestormen. – Han är väldigt tydligt den norska monarkins ankare just nu, säger Ebba von Sydow.", "link": "https://www.dn.se/varlden/kronprinsen-hyllas-i-krisen-norska-monarkins-ankare/", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:08:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Brita escaped the flames with the dogs – the neighbor lost everything", "summary": "\"Wouldn't have gone without them\" • Øyvind visits the house - for the first time since the devastating fire", "title_original": "Brita flydde lågorna med hundarna – grannen förlorade allt", "summary_original": "”Hade inte åkt utan dem” • Øyvind besöker huset – för första gången sedan förödande branden", "link": "https://www.tv4.se/artikel/4hzq4m3hMEElS3xWgIgYVG/brita-flydde-med-hundarna-grannen-foerlorade-allt", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:04:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 122, "title": "July 20: Don't miss today's news", "summary": "More and more young people are obsessed with skin care, Burnham is the new British Prime Minister and the first children on site at the Kumlaanstalten - here are the news you cannot miss from the day.", "title_original": "20 juli: Missa inte dagens nyheter", "summary_original": "Allt fler unga besatta av hudvård, Burnham ny brittisk premiärminister och första barnen på plats på Kumlaanstalten – här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/20-juli-missa-inte-dagens-nyheter/", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:02:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Jordan: Shot down Iranian robots", "summary": "Jordan's military says it shot down three Iranian robots that targeted the country.", "title_original": "Jordanien: Sköt ner iranska robotar", "summary_original": "Jordaniens militär uppger att man skjutit ner tre iranska robotar som haft landet som mål.", "link": "https://www.svd.se/a/q6Q2r0/jordanien-skot-ner-iranska-robotar", "date_display": "2026-07-20", "date_iso": "2026-07-20T19:01:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 124, "title": "Greece bans electric scooters for children", "summary": "Greece will ban e-scooters for children after repeated accidents, the country's Deputy Transport Minister Giorgos Kotsiras has announced.", "title_original": "Grekland förbjuder elsparkcyklar för barn", "summary_original": "Grekland kommer att förbjuda elsparkcyklar för barn efter upprepade olyckor, meddelar landets biträdande transportminister Giorgos Kotsiras.", "link": "https://www.svd.se/a/Exv3Xa/grekland-forbjuder-elsparkcyklar-for-barn", "date_display": "2026-07-20", "date_iso": "2026-07-20T18:15:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 125, "title": "Unexpected move abroad: \"Too old to be young\"", "summary": "She has long been considered one of Sweden's great talents - but the step from successful youth rider to senior rider is tough. 24-year-old show jumper Kajsa Björe decided to stop looking for excuses, and dare to try something new. A week ago she left Sweden to start working for top rider Abdel Said in Belgium.", "title_original": "Oväntade utlandsflytten: ”För gammal för att vara ung”", "summary_original": "Hon har länge räknats som en av Sveriges stora talanger – men steget från framgångsrik ungdomsryttare till seniorryttare är tufft. 24-åriga hoppryttaren Kajsa Björe bestämde sig för att sluta leta efter ursäkter, och våga testa något nytt. För en vecka sedan lämnade hon Sverige för att börja jobba hos toppryttaren Abdel Said i Belgien.", "link": "https://www.dn.se/sport/ovantade-utlandsflytten-for-gammal-for-att-vara-ung/", "date_display": "2026-07-20", "date_iso": "2026-07-20T18:00:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "DN Debate. \"The nostalgics are wrong - it wasn't better before\"", "summary": "DN DEBATE. Sure, Sweden has acute social problems, but the idea that it was better before is simply not true. Not when it comes to crime, public health, welfare or several other areas. The next government must break with pessimism and instead instill faith in the future, because we cannot continue like this, writes Markus Uvell, CEO of Nordic Public Affairs.", "title_original": "DN Debatt. ”Nostalgikerna har fel – det var inte bättre förr”", "summary_original": "DN DEBATT. Visst, Sverige har akuta samhällsproblem men idén om att det var bättre förr är helt enkelt inte sann. Inte vad gäller brottsligheten, folkhälsan, välfärden eller flera andra områden. Nästa regering måste bryta med med pessimismen och i stället ingjuta framtidstro, för så här kan vi inte fortsätta, skriver Markus Uvell, vd för Nordic Public Affairs.", "link": "https://www.dn.se/debatt/nostalgikerna-har-fel-det-var-inte-battre-forr/", "date_display": "2026-07-20", "date_iso": "2026-07-20T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Blood Rot, part 31 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 31 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-31-av-57/", "date_display": "2026-07-20", "date_iso": "2026-07-20T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Sharp warnings - at several popular destinations: \"Be vigilant\"", "summary": "Many Swedes are currently leaving rain and temperatures around 15 degrees at home in Sweden for holiday trips around the Mediterranean. But anyone who travels to Spain, Italy or Greece this week will be greeted by something completely different. A new heat wave is sweeping across southern Europe. In Spain, temperatures of up to 44 degrees are expected, while Italy has issued red heat warnings and local temperatures may exceed 45 degrees. \"TAKE precautions, be vigilant and follow the advice of the authorities. Stay updated on the latest weather forecasts and expect major disruptions in everyday life. Travel only if absolutely necessary,\" writes the European weather service MeteoAlarm about the warnings in Sardinia. Spain's meteorological agency Aemet has issued a special warning for what is being described as the third heat wave of the summer. At the same time, heat warnings apply in several parts of southern Europe. - It's basically all of Southern Europe, says TV4's meteorologist Johan Tengholm. He points out that large parts of Spain, southern France, Corsica, Greece and the Balkans are covered by the warnings. - In Spain there is an orange warning in quite a few places. Often it tends to be more local, but now it is in fairly large parts of the country. And then there is a red alert in southern Italy, which is one level up, he says. Warm air from the Sahara According to Johan Tengholm, the heat is due to a high pressure that brings up warm air from North Africa over the Mediterranean area. - It is simply warm air that dominates the weather there. It is a high pressure that extends upwards and causes warm air from below the Sahara to be brought up over Southern Europe, he says. In Mallorca, one of the Swedes' most popular destinations, temperatures are expected to rise to around 40 degrees during the week. At the same time, Aemet warns of health risks, especially for the elderly and people with cardiovascular diseases. The nights are also expected to be unusually warm. Extreme fire risk The heat wave comes at the same time as Spain's largest forest fire so far this year is raging in the Guadalajara province northeast of Madrid. The fire has destroyed", "title_original": "Skarpa varningarna – på flera populära resmål: ”Var vaksam”", "summary_original": "Många svenskar lämnar just nu regn och temperaturer kring 15 grader hemma i Sverige för semesterresor runt Medelhavet. Men den som reser till Spanien, Italien eller Grekland den här veckan möts av något helt annat. En ny värmebölja drar in över södra Europa. I Spanien väntas temperaturer på upp till 44 grader, samtidigt som Italien har utfärdat röda värmevarningar och lokalt kan få temperaturer på över 45 grader. ”VIDTA försiktighetsåtgärder, var vaksam och följ myndigheternas råd. Håll dig uppdaterad om de senaste väderprognoserna och räkna med stora störningar i vardagen. Res endast om det är absolut nödvändigt”, skriver den europeiska vädertjänsten MeteoAlarm om varningarna på Sardinien. Spaniens meteorologiska myndighet Aemet har utfärdat en särskild varning för det som beskrivs som sommarens tredje värmebölja. Samtidigt gäller värmevarningar i flera delar av Sydeuropa. – Det är hela Sydeuropa i princip, säger TV4:s meteorolog Johan Tengholm Han pekar på att stora delar av Spanien, södra Frankrike, Korsika, Grekland och Balkan omfattas av varningarna. – I Spanien är det orange varning på ganska många håll. Ofta brukar det vara mer lokalt, men nu är det i rätt stora delar av landet. Och så är det röd varning i södra Italien, som är en nivå upp, säger han. Varm luft från Sahara Enligt Johan Tengholm beror värmen på ett högtryck som för upp varm luft från Nordafrika över Medelhavsområdet. – Det är helt enkelt varm luft som dominerar vädret där. Det är ett högtryck som sträcker sig upp och gör att varmluft nerifrån Sahara förs upp över Sydeuropa, säger han. På Mallorca, ett av svenskarnas populäraste resmål, väntas temperaturerna stiga till omkring 40 grader under veckan. Aemet varnar samtidigt för hälsorisker, särskilt för äldre och personer med hjärt-kärlsjukdomar. Även nätterna väntas bli ovanligt varma. Extrem brandrisk Värmeböljan kommer samtidigt som Spaniens största skogsbrand hittills i år rasar i Guadalajara-provinsen nordost om Madrid. Branden har förstört mer än 26 000 hektar mark och över 1 000 personer har evakuerats, enligt Reuters. Aemet varnar för att värmen nu kommer att driva upp brandrisken till mycket höga eller extrema nivåer i stora delar av landet. För semesterfirare väntar några mycket varma dagar. – Närmaste dagarna ser det ut att bli uppehållsväder på många håll och riktigt varmt med temperaturer runt 40 grader på många håll, säger Johan Tengholm. Enligt prognoserna väntas värmen hålla i sig åtminstone till slutet av veckan innan svalare luft börjar röra sig in över delar av Spanien.", "link": "https://www.tv4.se/artikel/3jMECAGcFtafIhsi82YYa8/skarpa-varningarna-pa-flera-populaera-resmal-var-vaksam", "date_display": "2026-07-20", "date_iso": "2026-07-20T17:47:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/vadret", "/vader", "/vadervarningar", "/vaderprognoser", "/vaderfenomen", "/europa", "/spanien"]}, {"id": 129, "title": "Burnham appoints his new government - they get the heaviest posts", "summary": "With a new leader will also come several new ministers and Britain's new Prime Minister Andy Burnham is believed to replace large parts of the representative Keir Starmer's government. On Monday afternoon, news poured in of big names disappearing, according to the BBC at least eight ministers - among them Chancellor of the Exchequer Rachel Reeves and Minister of Justice David Lammy, both of whom were close to Starmer. Reeves' replacement, John Healey, left the government in June this year in protest at the defense not being given \"the resources the nation needs to defend the country at a time of increased threats\". The new foreign secretary will be Ed Miliband, who will take over from Yvette Cooper, according to Downing Street. Miliband, who was Labor leader from 2010 to 2015, was energy security and net zero emissions minister in Keir Starmer's government.", "title_original": "Burnham utser sin nya regering – de får tyngsta posterna", "summary_original": "Med en ny ledare kommer också flera nya ministrar och Storbritanniens nye premiärminister Andy Burnham tros byta ut stora delar av företrädaren Keir Starmers regering. Under måndagseftermiddagen strömmade beskeden om tunga namn som försvinner, enligt BBC minst åtta ministrar – bland dem finansminister Rachel Reeves och justitieminister David Lammy, som båda stod nära Starmer. Reeves ersättare John Healey lämnade regeringen i juni i år i protest mot att försvaret inte fick \"de resurser som nationen behöver för att försvara landet i en tid av ökade hot\". Ny utrikesminister blir Ed Miliband, som tar över efter Yvette Cooper, enligt Downing Street. Miliband, som var partiledare för Labour från 2010 till 2015, var minister för energisäkerhet och nettonollutsläpp i Keir Starmers regering.", "link": "https://www.tv4.se/artikel/tt-260720-storbritburnhamministrar1-3d6b4c52/burnham-utser-sin-nya-regering", "date_display": "2026-07-20", "date_iso": "2026-07-20T17:39:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["BBC", "/bbc", "/utrikes", "/storbritannien"]}, {"id": 130, "title": "Experts warn: Young people increasingly obsessed with skin care", "summary": "An unhealthy fixation on achieving flawless skin even at a young age has been given a term: cosmeticorexia. Skin therapist Emma Kinnerström warns that children, as young as ten years old, choose skin care over other hobbies. - It is so frightening how they have started to take an interest in the perfect, unattainable ideal.", "title_original": "Experter varnar: Unga allt mer besatta av hudvård", "summary_original": "En ohälsosam fixering vid att uppnå felfri hy redan som ung har fått ett begrepp: cosmeticorexia. Hudterapeuten Emma Kinnerström varnar för att barn, så unga som tio år, väljer hudvård framför andra hobbyer. – Det är så skrämmande hur de har börjat intressera sig för det perfekta, ouppnåeliga idealet.", "link": "https://www.dn.se/varlden/experter-varnar-unga-allt-mer-besatta-av-hudvard/", "date_display": "2026-07-20", "date_iso": "2026-07-20T17:35:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Trump: Air Force One plane from Qatar to be maxed out", "summary": "The president received the plane as a gift from Qatar. But according to the New York Times, there must have been security flaws that made Donald Trump choose an older Air Force One plane on his way home from Turkey. Now the plane's defense capabilities against missiles are to be upgraded.", "title_original": "Trump: Air Force One-planet från Qatar ska maxas", "summary_original": "Presidenten fick planet som en gåva av Qatar. Men enligt New York Times ska det ha funnits säkerhetsbrister som fått Donald Trump att välja ett äldre Air Force One-plan på väg hem från Turkiet. Nu ska planets försvarsförmåga mot missiler uppgraderas.", "link": "https://www.dn.se/varlden/trump-air-force-one-planet-fran-qatar-ska-maxas/", "date_display": "2026-07-20", "date_iso": "2026-07-20T17:35:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Key witness speaks out in Spanish corruption scandal", "summary": "The corruption investigation against Spain's former Prime Minister José Luis Rodríguez Zapatero took a dramatic turn on Monday. The main witness has admitted that Zapatero, against commission, \"arranged\" Spanish state aid of 53 million euros to an unknown airline that was close to the regime in Venezuela.", "title_original": "Nyckelvittne talar ut i spansk korruptionshärva", "summary_original": "Korruptionsutredningen mot Spaniens förre premiärminister José Luis Rodríguez Zapatero tog på måndagen en dramatisk vändning. Huvudvittnet har erkänt att Zapatero, mot kommission, ”ordnade” statligt spanskt stöd på 53 miljoner euro åt ett okänt flygbolag som stod nära regimen i Venezuela.", "link": "https://www.dn.se/varlden/nyckelvittne-talar-ut-i-spansk-korruptionsharva/", "date_display": "2026-07-20", "date_iso": "2026-07-20T17:10:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Rat poo at the popular sports pub - in the kitchen and bar", "summary": "At the beginning of July, the environmental administration made an effort at the restaurant after receiving complaints about rats on the site. During the first inspection, suspicious traces of rat droppings were found in the kitchen and visible gnawing marks on the door frames. During a follow-up check, it was found that pests are present in the premises. According to the board's decision, food remains, rubbish and rat droppings were noted in several places - including between and under workbenches and other equipment in the kitchen, dish area and staff canteen. Traces were also found in the bar and outside the guest toilets. At the mixer, traces in the form of a \"fat deposit\" from a rat were also noted at a hole in the roof. - The cleaning was not the best. It was seen that there was food left on the floor surfaces, and that means that the rats get there if they enter the business, says Kajsa Eriksson, head of unit at the food inspection in the city of Stockholm. Must be cleaned Now the popular sports bar chain's restaurant in Stockholm must check the premises and seal the places where rats can conceivably enter. The business also needs to clean all surfaces that may come into contact with food before they can be used again to minimize the risk of the spread of infection and contamination from pests.\n\n\"Since rats can spread infection or make food unusable, the decision must apply immediately even if it is appealed,\" the board's decision states.\n\nTV4 Nyheterna has searched the restaurant.", "title_original": "Råttbajs på populära sportkrogen – i köket och baren", "summary_original": "I början av juli gjorde miljöförvaltningen en insats på restaurangen efter att ha fått in klagomål om råttor på platsen. Vid den första kontrollen hittades misstänkta spår av råttspillning i köket och synliga gnagmärken på dörrlister. Vid en uppföljande kontroll konstaterades att skadedjur förekommer i lokalen. Enligt nämndens beslut noterades matrester, skräp och råttspillning på flera ställen – bland annat mellan och under arbetsbänkar och annan utrustning i kök, diskutrymme och personalmatsal. Spår hittades även i baren och utanför gästtoaletterna. Vid blandaren noterades dessutom spår i form av en ”fettavlagring” från råtta vid ett hål vid taket. – Rengöringen var inte den bästa. Man såg att det fanns kvar livsmedel på golvytorna, och det gör att råttorna tar sig dit om de kommer in i verksamheten, säger Kajsa Eriksson, enhetschef på livsmedelskontrollen i Stockholms stad. Måste rengöras Nu måste den populära sportbarkedjans restaurang i Stockholm kontrollera lokalerna och täta de platser där råttor kan tänkas ta sig in. Verksamheten behöver också rengöra alla ytor som kan komma i kontakt med livsmedel innan de får användas igen för att minimera risken för smittspridning och kontaminering från skadedjuren.\n\n”Eftersom råttor kan sprida smitta eller göra livsmedlen otjänliga ska beslutet gälla omedelbart även om det överklagas”, står det i nämndens beslut.\n\nTV4 Nyheterna har sökt restaurangen.", "link": "https://www.tv4.se/artikel/2bar6HNCnnxofwCuS3zQol/rattbajs-pa-populaera-sportkrogen-i-koeket-och-baren", "date_display": "2026-07-20", "date_iso": "2026-07-20T16:57:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/rattor", "/restaurang"]}, {"id": 134, "title": "Simple test can reveal hidden risk of heart attack", "summary": "You can exercise, eat right and still carry a hidden risk of heart attack. One in seven Swedes has an unknown fat in the blood that increases the risks. The blood fat is hereditary, but can be detected with a simple test.", "title_original": "Enkelt test kan avslöja dold risk för hjärtinfarkt", "summary_original": "Du kan träna, äta rätt och ändå bära på en dold risk för hjärtinfarkt. En av sju svenskar har ett okänt fett i blodet som ökar riskerna. Blodfettet är ärftligt, men kan upptäckas med ett enkelt test.", "link": "https://www.dn.se/sverige/enkelt-test-kan-avsloja-dold-risk-for-hjartinfarkt/", "date_display": "2026-07-20", "date_iso": "2026-07-20T16:41:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Breaking the trend: Fewer people are poisoned by nitrous oxide – after the new law", "summary": "A year ago, the Nitrous Oxide Act came into force, which among other things prohibits the sale of nitrous oxide for intoxicating purposes.  After the law came into force, the number of calls about acute nitrous oxide poisoning to the Poison Information Center dropped sharply, something P4 Gothenburg reported on.  In the first six months of 2025, the Poison Information Center received 560 calls regarding acute nitrous oxide poisoning. The same figure for 2026 is 127 calls. For example, in January 2025 there were 118 calls, while in January 2026 there were 19 calls.  \"Clear connection\" Acute nitrous oxide poisoning mainly occurs when nitrous oxide is used unregulated, i.e. for intoxicating purposes.  - As I see it, there is a clear connection between the fact that the regulation came into force and that the conversations about acute nitrous oxide poisoning decreased. We noticed a decline in conversations already when the bill was hammered through, says Jenny Bång Arhammar, chief physician at the Poison Information Center.  She has difficulty seeing that there is any other reason for the statistics.  - We have informed about the risks of nitrous oxide for a couple of years and carried out several information campaigns. I feel that the knowledge that nitrous oxide can be harmful is quite good, but it was actually only when the law came into force that we saw the dramatic reduction in calls to us.", "title_original": "Trendbrottet: Färre förgiftas av lustgas – efter nya lagen", "summary_original": "För ett år sedan trädde lagen om lustgas i kraft, vilken bland annat förbjuder försäljning av lustgas i berusningssyfte.  Efter att lagen trädde i kraft minskade antalet samtal om akut förgiftning av lustgas till Giftinformationscentralen kraftigt, något P4 Göteborg rapporterat om.  De första sex månaderna 2025 fick Giftinformationscentralen in 560 samtal gällande akut förgiftning av lustgas. Samma siffra för 2026 är 127 samtal. Exempelvis kom det i januari 2025 in 118 samtal medan det i januari 2026 kom in 19 samtal.  \"Tydligt samband\" Akut förgiftning av lustgas uppträder främst när man använder lustgas oreglerat, alltså i berusningssyfte.  – Som jag ser det så är det ett tydligt samband mellan att regleringen trädde i kraft och att samtalen om akut förgiftning av lustgas minskade. Vi märkte en nedgång i samtal redan när lagförslaget klubbades igenom, säger Jenny Bång Arhammar, överläkare vid Giftinformationscentralen.  Hon har svårt att se att det finns någon annan anledning till statistiken.  – Vi har informerat om riskerna med lustgas i ett par år och gjort flera informationskampanjer. Jag upplever att kunskapen om att lustgas kan vara skadligt är ganska god, men det var ju faktiskt först när lagen trädde i kraft som vi såg den dramatiska minskningen i samtal till oss.", "link": "https://www.tv4.se/artikel/3B4k8SM4JNUELglYdyyUEY/trendbrottet-faerre-foergiftas-av-lustgas", "date_display": "2026-07-20", "date_iso": "2026-07-20T15:51:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/lustgas", "/forgiftning"]}, {"id": 136, "title": "Maria's anger towards Arlanda: \"What the hell are you doing?\"", "summary": "Maria Dimetri and her family were at Arlanda at 03:00 on Monday morning to check in for their Ryanair flight departing for Sicily at 05:55. When they arrived at the airport, they were greeted by long queues at the Ryanair check-in counters. According to Maria Dimetri, the staff was not enough to handle the large number of travelers. - There were probably over a thousand people who would be squeezed onto five to six different flights. It's not okay. You have to wake up when more than 40 people don't come on the plane, she says. \"What the hell are you doing?\" Maria Dimetri and her family ran to the gate and were allowed to board the bus that would take the passengers to the plane, even though the gate had already closed. But once on the bus, they saw how their luggage was unloaded from the plane. - Everyone started crying. There were a lot of people who cried and said that this is not okay. Why don't they have a better system? Although it is primarily the airline that is responsible for the situation, she criticizes the way Arlanda handled it. - What the hell are you doing here at Arlanda? - There was such damn bad communication between the staff at the airport, the buses and the flight, she says. The family has paid around SEK 34,000 for their trip. - We have lost the rental car we booked, a hotel night with breakfast and also had to buy new tickets for 18,000. Now we also have to stop over, she says. Second time in a short time Several travelers also missed their flights on July 8 after similar queues arose at Ryanair's check-in counters at Arlanda. According to Ryanair, that incident was due to a temporary technical problem, Aftonbladet reported. Susanne Norman, head of operational operations at Swedavia, writes to TV4 Nyheterna that it is the airlines themselves that estimate and assess the capacity they need at the check-in desks - and that they are also responsible for staffing baggage handling and boarding. \"When we receive information that there is an extended waiting time and that there is a risk that the traveller", "title_original": "Marias ilska mot Arlanda: ”Vad fan håller ni på med?”", "summary_original": "Maria Dimetri och hennes familj var på plats på Arlanda klockan 03.00 på måndagsmorgonen för att checka in till sitt Ryanairflyg med avgång till Sicilien klockan 05.55. När de kom till flygplatsen möttes de av långa köer till Ryanairs incheckningsdiskar. Enligt Maria Dimetri räckte personalen inte till för att hantera det stora antalet resenärer. – Det var säkert över tusen personer som skulle klämmas in på fem till sex olika flyg. Det är inte okej. Man måste ju vakna till när över 40 personer inte kommer med planet, säger hon. ”Vad fan håller ni på med?” Maria Dimetri och hennes familj sprang till gaten och fick gå ombord på bussen som skulle köra passagerarna till flygplanet, trots att gaten redan hade stängt. Men väl på bussen såg de hur deras bagage lastades av från planet. – Alla började gråta. Det var jättemånga som grät och sa att det här inte är okej. Varför har de inte ett bättre system? Även om det i första hand är flygbolaget som bär ansvaret för situationen riktar hon kritik mot hur Arlanda hanterade den. – Vad fan håller ni på med här på Arlanda? – Det var så jävla dålig kommunikation mellan personalen på flygplatsen, bussarna och flyget, säger hon. Familjen har betalat runt 34 000 kronor för sin resa. – Vi har förlorat hyrbilen vi bokat, en hotellnatt med frukost och dessutom behövt köpa nya biljetter för 18 000. Nu måste vi dessutom mellanlanda, säger hon. Andra gången på kort tid Flera resenärer missade även sina flyg den 8 juli efter att liknande köer uppstått vid Ryanairs incheckningsdiskar på Arlanda. Enligt Ryanair berodde den händelsen på ett tillfälligt tekniskt problem, rapporterade Aftonbladet. Susanne Norman, chef för operativ drift på Swedavia, skriver till TV4 Nyheterna att det är flygbolagen som själva uppskattar och bedömer vilken kapacitet de behöver vid incheckningsdiskarna – och att de även ansvarar för bemanning av bagagehantering och boarding. ”När vi får information om att det är förlängd väntetid och att det finns risk att resenärer blir sena till flygen försöker vi hjälpa flygbolagen på olika sätt för att förbättra flödet. Vi har en kontinuerlig dialog med och arbetar tillsammans med flygbolagen för att upplevelsen ska bli så bra som möjligt för resenärerna på flygplatsen”, skriver hon. Ryanairs svar När TV4 Nyheterna kontaktar Ryanair om måndagens förseningar svarar bolaget enbart på vad som hände med deras flyg till Sardinien, som flera andra medier rapporterat om. ”Påståendet att '40 personer missade sitt flyg' är felaktigt: totalt 5 incheckade passagerare infann sig inte vid boardinggaten i tid för detta flyg från Stockholm Arlanda till Cagliari”, skriver Ryanairs presstjänst. ”Om dessa 5 passagerare hade kommit till boardinggaten innan den stängde, skulle de ha gått ombord på detta flyg från Stockholm Arlanda till Cagliari tillsammans med de 183 passagerare som infann sig vid gate-disken i tid”. Ryanair uppger också att passagerare som missar ett flyg erbjuds att, mot en så kallad ”Missed Departure”-avgift på 100 euro, ombokas till ett nytt flyg – något som de aktuella passagerarna ska ha avböjt. Ryanair hänvisar samtidigt frågor om köerna på Arlanda till flygplatsen. ”Ni måste kontakta Stockholm Arlanda Airport angående era frågor om deras incheckningsköer”, skriver de.", "link": "https://www.tv4.se/artikel/kC6Ot32NT0KiM4JtTclR3/marias-ilska-mot-arlanda-vad-fan-haller-ni-pa-med", "date_display": "2026-07-20", "date_iso": "2026-07-20T15:19:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/flygplan", "/flygresor", "/ryanair", "/arlanda"]}, {"id": 137, "title": "Ukraine's rescue service develops drones - now Sweden wants to follow suit", "summary": "The TV4 News team has visited one of the state rescue service's training centers at a secret location in Ukraine. According to the rescue service, the location is being kept secret because they fear that the facility could become a target, despite the fact that the operation is civilian and the training concerns relief efforts, such as rescuing people from riots or disarming weapons. - Attacking rescue workers has become one of their main goals in how they fight the war. That's why we don't want to reveal any details about where we train those who will save others, says Taras Berezhanskyi.\n\nDrones are used both to locate victims, disarm chemical or explosive weapons and to reduce the risk to personnel when rescue operations are underway.  - They are a great help for the entire rescue work, especially since we are exposed to continued attacks during the rescue work \"second shellings\", which have already killed 117 of our employees, says Taras Berezhanskyi. Sweden wants to learn from Ukraine's experiences According to the statistics of the Ukrainian rescue service, at least 620 firefighters have been injured in the line of duty, in addition to the 117 who have been killed since the full-scale invasion. The experiences have built an expertise in using unmanned vehicles in the air, in the water and on land.\n\nThe knowledge arouses interest from, among others, Great Britain, Poland, Estonia and Sweden. In Sweden, schools and the Swedish Civil Defense Authority (MCF), among others, have started collaborations, and Swedish rescue personnel have visited Ukraine to see and learn. - This is very important for Sweden. We are in the process of building up our total defense here in Sweden, and there the rescue service is an extremely important part. We look at what role they will have in a crisis and a possible war, and there it is extremely valuable to look at what Ukraine unfortunately had to learn the hard way, says Sofia Westberg, representative of MCF at the embassy in Kiev.\n\nTaras Berezhanskyi says that Ukraine is happy to share its knowledge. - Of course, Ukraine is ready to help and wonder", "title_original": "Ukrainas räddningstjänst utvecklar drönare – nu vill Sverige ta efter", "summary_original": "TV4 Nyheternas team har besökt ett av den statliga räddningstjänstens utbildningscentrum på hemlig plats i Ukraina. Enligt räddningstjänsten hålls platsen hemlig eftersom de befarar att anläggningen kan bli en måltavla, trots att verksamheten är civil och utbildningen gäller hjälpinsatser, som att undsätta människor ur rasmassor eller desarmera vapen. – Att attackera räddningspersonal har blivit ett av deras huvudmål i hur de utkämpar kriget. Därför vill vi inte avslöja några detaljer om var vi utbildar de som ska rädda andra, säger Taras Berezhanskyi.\n\nDrönare används både för att lokalisera drabbade, desarmera kemiska eller explosiva vapen och för att minska risken för personalen när räddningsinsatser pågår.  – De är en stor hjälp för hela räddningsarbetet, särskilt eftersom vi utsätts för fortsatta attacker under räddningsarbetet ”second shellings”, vilket redan dödat 117 av våra medarbetare, berättar Taras Berezhanskyi. Sverige vill lära av Ukrainas erfarenheter Enligt den ukrainska räddningstjänstens statistik har minst 620 brandmän skadats i tjänsten, utöver de 117 som dödats sedan den fullskaliga invasionen. Erfarenheterna har byggt upp en expertis i att använda obemannade farkoster i luften, i vattnet och på land.\n\nKunskapen väcker intresse från bland annat Storbritannien, Polen, Estland och Sverige. I Sverige har bland annat skolor och Myndigheten för civilt försvar (MCF) inlett samarbeten, och svensk räddningspersonal har besökt Ukraina för att se och lära. – Det här är jätteviktigt för svensk del. Vi håller på att bygga upp vårt totalförsvar här i Sverige och där är räddningstjänsten en oerhört viktig del. Vi tittar på vilken roll de kommer ha i kris och ett eventuellt krig och där är det oerhört värdefullt att titta på vad Ukraina tyvärr behövt lära sig den hårda vägen, säger Sofia Westberg, representant för MCF vid ambassaden i Kiev.\n\nTaras Berezhanskyi säger att Ukraina gärna delar med sig av kunskapen. – Självklart är Ukraina redo att hjälpa och undervisa alla våra vänner. Sverige och Europa är våra vänner och vårt stöd i kriget så vi delar gärna med oss av den här kunskapen så alla kan vara redo. Även om vi förstås hoppas att ni aldrig ska behöva utsättas för det här, avslutar Taras Berezhanskyi.", "link": "https://www.tv4.se/artikel/zzjITcCFlBixAw4PVd4Mo/ukrainska-raeddningstjaensten-utvecklar-droenare-sverige-vill-ta-efter", "date_display": "2026-07-20", "date_iso": "2026-07-20T12:05:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/raddningstjansten", "/totalforsvaret"]}, {"id": 138, "title": "The \"losers\" Spain won and Trump lost", "summary": "\"It must have hurt when Trump stood there, confused and grinning,\" writes Jona Källgren", "title_original": "”Förlorarna” Spanien vann och Trump förlorade", "summary_original": "”Det måste ha gjort ont när Trump stod där, förvirrad och flinande”, skriver Jona Källgren", "link": "https://www.tv4.se/artikel/1ROJOEphQJbFi84Y2K2m1F/foerlorarna-spanien-vann-och-trump-foerlorade", "date_display": "2026-07-20", "date_iso": "2026-07-20T11:07:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 139, "title": "The police warn parents: Watch out when the children go abroad", "summary": "In recent years, Swedish police and prosecutors have had to work increasingly internationally. On the one hand, digitization has driven the development, and on the other hand, the work to gain access to leading actors in criminal networks requires significantly closer cooperation with other countries. And it gives results. In Spain alone, over 30 people have been arrested this year. Globally, the number is over 170. - It is no longer the case that you have to be geographically in the place where the crime is to be committed. You reach so many actors and can buy services online, says Kristoffer Mueller, commissioner at the police's international unit. The fact that so many Swedish criminals are arrested in Spain is connected to the fact that many Swedes stay there in general, he believes. - Many Swedes travel there, which obviously seems to apply to the criminals as well. - It probably has to do with climate and preferences in general. Not just gang leaders abroad From the fact that in the past it was mainly gang leaders who operated abroad, today it is the entire hierarchy that the police are looking for in other countries. - It is not only gang leaders or tone-setting actors who suddenly have the means to live elsewhere, or in some cases try to hide in other countries, says Kristoffer Mueller. - We also see how \"enforcers\", i.e. people further down the hierarchy in criminal schemes, appear in other countries. Also young people recruited in Sweden. \"Then they are rarely true\" Therefore, Kristoffer Mueller has a call for parents and other relatives to be careful when children travel abroad. - Keep an eye on deviant behaviour, deviant patterns and new acquaintances that feel a little too good to be true. Then they are rarely true. Many young people are exploited and deceived, or lured into crime. It can go fast, he says. If you suspect that your child may have been lured into crime or is about to, you should immediately contact the police. - If you feel that the behavior is deviant and not right - parents often know that, he says.", "title_original": "Polisen varnar föräldrar: Se upp när barnen åker utomlands", "summary_original": "Svensk polis och åklagare har de senaste åren behövt arbeta allt mer internationellt. Dels har digitaliseringen drivit på utvecklingen, dels kräver arbetet med att komma åt tongivande aktörer i kriminella nätverk ett betydligt tätare samarbete med andra länder. Och det ger resultat. Bara i Spanien har över 30 personer gripits i år. Globalt är siffran över 170. – Det är inte längre så att man geografiskt måste befinna sig på den plats där brottet ska begås. Man når ju så många aktörer och kan köpa tjänster på nätet, säger Kristoffer Mueller, kommissarie vid polisens internationella enhet. Att så många svenska kriminella grips just i Spanien hänger ihop med att många svenskar vistas där i allmänhet, menar han. – Många svenskar reser dit, vilket uppenbarligen verkar gälla de kriminella också. – Det har väl med klimat och preferenser att göra rent generellt. Inte bara gängtoppar utomlands Från att det tidigare främst var gängtoppar som opererade utomlands är det i dag hela hierarkin som polisen efterlyser i andra länder. – Det är inte bara gängtoppar eller tongivande aktörer som plötsligt har medel att bo någon annanstans, eller i vissa fall försöker gömma sig i andra länder, säger Kristoffer Mueller. – Vi ser också hur ”genomförare”, alltså personer längre ner i hierarkin i brottsupplägg, dyker upp i andra länder. Även unga människor som rekryterats i Sverige. ”Då är de sällan sanna” Därför har Kristoffer Mueller en uppmaning till föräldrar och andra närstående att vara uppmärksamma när barn reser utomlands. – Ha koll på avvikande beteenden, avvikande mönster och nya bekantskaper som känns lite för bra för att vara sanna. Då är de sällan sanna. Många unga utnyttjas och luras, eller lockas in i kriminalitet. Det kan gå fort, säger han. Om man misstänker att ens barn kan ha lockats in i kriminalitet eller är på väg att ska man genast ta kontakt med polisen. – Om man känner att beteendet är avvikande och inte stämmer – det där vet föräldrar ofta, säger han.", "link": "https://www.tv4.se/artikel/31nxzCDg0e9uMRM9dys1NV/polisen-varnar-foeraeldrar-se-upp-naer-barnen-aker-utomlands", "date_display": "2026-07-20", "date_iso": "2026-07-20T09:19:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/brott-och-straff", "/utrikes", "/gangkriminalitet"]}, {"id": 140, "title": "Pelle's shame after giving birth: \"There is no one who talks about it\"", "summary": "When Pelle Tornberg and his partner became parents, there was no immediate happiness that greeted them. Both he and his partner suffered from postpartum depression, something that is often associated with mothers, but which can also affect fathers. - Everyone paints this picture that it is an indescribable joy and love and you are up there and so on. It wasn't like that for any of us. It was like being in a fog. It was a constant worry, says Pelle Tornberg. - But there was also enormous shame and a lot of guilt about not feeling the way everyone portrays that you should feel as a father. When the family received a visit from the childcare center, all the focus was on the mother and the child. Pelle doesn't remember anyone asking how he was - and believes that many fathers go through similar experiences in silence. - Even if they had asked me, I probably wouldn't have said how I felt. I didn't even tell my partner at first. Care misses fathers Child psychologist and researcher Malin Bergström, Karolinska Institutet, knows Pelle's story well. She believes that the difference in risk of postpartum depression between new fathers and mothers is smaller than many people think.  - It is believed that it is triggered by pregnancy, childbirth or breastfeeding. But the point is that the hormonal adjustment is driven by the contact with the child. BVC now offers both individual and group talks for all new parents, but during pregnancy there are still no special talks or structures to capture the mood of expectant fathers. They are not even counted as patients during pregnancy.  - Which is absurd because children are affected in exactly the same way by the mood of a mother as of a father. And we know that men generally have much more difficulty seeking care and even stronger feelings of shame around this type of condition than new mothers have, says Malin Bergström, child psychologist and researcher at KI. Wants to inspire others For Pelle Tornberg, the turning point came when he dared to talk to his partner and was later supported by a cure", "title_original": "Pelles skam efter förlossningen: ”Finns ingen som pratar om det”", "summary_original": "När Pelle Tornberg och hans sambo blev föräldrar var det ingen omedelbar lycka som mötte dem. Både han och sambon drabbades av förlossningsdepression, något som ofta förknippas med mammor, men som även kan drabba pappor. – Alla målar upp den här bilden av att det är en obeskrivlig glädje och kärlek och man är där uppe och så där. Så var det inte riktigt för nån av oss. Det var som att vara i en dimma. Det var en konstant oro, säger Pelle Tornberg. – Men det var också en enorm skam och mycket skuldkänslor kring att inte känna så som alla målar upp att man ska känna som pappa. När familjen fick besök från barnavårdscentralen låg allt fokus på mamman och barnet. Pelle minns inte att någon frågade hur han mådde – och tror att många pappor går igenom liknande upplevelser i tystnad. – Även om de hade frågat mig hade jag förmodligen inte sagt som jag kände. Jag sa det inte ens till min sambo i början. Vården missar pappor Barnpsykologen och forskaren Malin Bergström, Karolinska institutet, känner väl igen Pelles berättelse. Hon menar att skillnaden i risk för förlossningsdepression mellan nyblivna pappor och mammor är mindre än många tror.  – Man tror ju att det utlöses av graviditeten, förlossningen eller amningen. Men grejen är den att den hormonella omställningen drivs av kontakten med barnet. BVC erbjuder nu både enskilda och gemensamma samtal för alla nyblivna föräldrar, men under graviditeten finns fortfarande inga särskilda samtal eller strukturer för att fånga upp blivande pappors mående. De räknas inte ens som patienter under graviditeten.  – Vilket är absurt eftersom barn påverkas på exakt samma sätt av måendet hos en mamma som hos en pappa. Och vi vet att män generellt har mycket svårare att söka vård och ännu starkare skamkänslor kring den här typen av mående än vad nyblivna mammor har, säger Malin Bergström, barnpsykolog och forskare på KI. Vill inspirera andra För Pelle Tornberg blev vändningen när han vågade prata med sin sambo och senare fick stöd av en kurator via BVC. Han har delat sin historia på sociala medier och vill nu bidra till att minska skammen och få fler pappor att våga prata om sitt mående, och be om hjälp. – Ingen pratar om det och alla går runt i sin egen lilla bubbla med sin egen skam och sina egna känslor kring det här. I dag har Pelle en nära relation till sin son och vill att fler föräldrar ska veta att förlossningsdepression inte är ovanligt – och att det går att ta sig igenom. –  Jag är så glad att han är en del av mitt liv. Nu när jag sitter här skulle jag aldrig någonsin byta ut den situationen.", "link": "https://www.tv4.se/artikel/77pTN9gK3hbhZSx1LSaydS/pelle-drabbades-av-foerlossningsdepression-ingen-pratar-om-det", "date_display": "2026-07-20", "date_iso": "2026-07-20T09:01:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/unga-foraldrar", "/foraldrar", "/barn", "/bebis"]}, {"id": 141, "title": "District heating became an expensive trap: \"Many choose to leave\"", "summary": "A few years ago, several municipalities around the country sold their district heating networks to private companies. The deals brought quick money into the municipal coffers - but also meant that control over a socially important infrastructure disappeared. Once the network is sold, it is difficult for the municipality to influence how the business is run - while both households and municipal businesses continue to depend on the heat.\nIn Vännäs, the municipal management describes a situation where prices have risen sharply.\n\n- The companies that bought up the district heating network in our municipality have raised the price. One year with 18 percent, the next year with 30 percent. It has become so costly that many choose to leave the district heating, says Anna Frej (S), municipal councilor in Vännäs. \"The price has only skyrocketed\" For those who live in a villa, one way to get out of dependence is to change the heating system, but this requires large investments. Malin Klingefors in Vännäs says that she and her family chose to drill for geothermal heating when district heating prices rose.\n\n- Yes, we chose to drill as the price of district heating just skyrocketed. We take this investment cost by drilling instead and have made it back in about ten years, says Malin Klingefors.\n\nIn her neighborhood, development has become visible in everyday life.\n\n- The drilling truck has been driving around this neighborhood for several weeks now, almost all of our neighbors have drilled for geothermal energy, says Malin Klingefors.\n\nBut not everyone has the same opportunity to leave district heating. In multi-family houses, in properties where it is difficult to install alternatives, or for households without the financial space to invest, district heating often becomes the only realistic choice. \"Must probably be in public ownership\" When district heating networks are sold, a market without competition easily arises. Unlike electricity, where customers can choose an electricity trading company, district heating is tied to a local pipe network. Building a parallel network is not an option in practice, which means that customers risk being locked in when the price rises.\n\nAnna Frej believes that district heating should be equated with other gr", "title_original": "Fjärrvärmen blev en dyr fälla: \"Många väljer att lämna\"", "summary_original": "För några år sedan sålde flera kommuner runt om i landet sina fjärrvärmenät till privata bolag. Affärerna gav snabba pengar in i kommunkassan – men innebar också att kontrollen över en samhällsviktig infrastruktur försvann. När nätet väl är sålt är det svårt för kommunen att påverka hur verksamheten drivs – samtidigt som både hushåll och kommunala verksamheter fortsätter vara beroende av värmen.\nI Vännäs beskriver kommunledningen en situation där priserna ökat kraftigt.\n\n– Bolagen som köpt upp fjärrvärmenätet i vår kommun har höjt priset. Ett år med 18 procent, nästa år med 30 procent. Det har blivit så kostsamt så många väljer att lämna fjärrvärmen, säger Anna Frej (S), kommunalråd i Vännäs. ”Priset har bara rusat” För den som bor i villa kan ett sätt att ta sig ur beroendet vara att byta uppvärmningssystem men det kräver stora investeringar. Malin Klingefors i Vännäs berättar att hon och familjen valde att borra för bergvärme när fjärrvärmepriserna steg.\n\n– Ja, vi valde att borra då priset på fjärrvärme bara rusat. Vi tar den här investeringskostnaden med att borra istället och har tjänat igen det på ett tiotal år, säger Malin Klingefors.\n\nI hennes kvarter har utvecklingen blivit synlig i vardagen.\n\n– Borrbilen har kört runt i det här kvarteret i flera veckor nu, nästan alla våra grannar har borrat efter bergvärme, säger Malin Klingefors.\n\nMen alla har inte samma möjlighet att lämna fjärrvärmen. I flerfamiljshus, i fastigheter där det är svårt att installera alternativ, eller för hushåll utan ekonomiskt utrymme att investera, blir fjärrvärmen ofta det enda realistiska valet. ”Måste nog vara i offentlig ägo” När fjärrvärmenät säljs uppstår lätt en marknad utan konkurrens. Till skillnad från el, där kunder kan välja elhandelsbolag, är fjärrvärme knuten till ett lokalt rörnät. Att bygga ett parallellt nät är i praktiken inte ett alternativ, vilket gör att kunderna riskerar att bli inlåsta när priset stiger.\n\nAnna Frej menar att fjärrvärmen bör jämställas med annan grundläggande infrastruktur.\n\n– Jag tror att den här typen av infrastruktur måste nog vara i offentlig ägo, det är som med vägar, vatten och bredband. Det är också en fråga om beredskap, i händelse av krig måste sådana saker fungera och inte vara beroende av ett bolag som gör allt för att tjäna pengar på det, säger Anna Frej. Kommunerna i rävsax För kommunerna blir dilemmat dubbelbottnat. Försäljningen gav ett tillskott till ekonomin där och då – men när prisökningarna slår igenom drabbar det både invånare och kommunens egna lokaler, som skolor, äldreboenden och idrottsanläggningar. Samtidigt är möjligheterna att styra prisnivåer och villkor begränsade när nätet inte längre ägs av kommunen.", "link": "https://www.tv4.se/artikel/4EHLWsV6BpfeGcrv8NJotP/fjaerrvaermen-blev-en-dyr-faella-manga-vaeljer-att-laemna", "date_display": "2026-07-20", "date_iso": "2026-07-20T08:16:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/fjarrvarme", "/vasterbotten"]}, {"id": 142, "title": "13-year-old dead during Spanish gold celebrations", "summary": "A 13-year-old boy has died during the Spanish gold celebrations after a fountain collapsed, writes El Mundo. The accident happened at half past one in the night in the city of Ciudad Rodrigo in the western part of Spain. Gave way - stone bumble fell Several young people were on and in the fountain when the construction gave way. The boy was hit by a boulder, and although several policemen were immediately on the scene and tried to free him, his life could not be saved. Two other people received treatment in connection with the fountain collapsing. One of them, also a minor, is being treated for serious injuries. \"Would have been a joyous celebration\" \"What would have been a joyous celebration of the Spanish national team's World Cup victory has turned into a tragedy for the entire community of Ciudad Rodrigo,\" writes the municipality in a post on social media. A crisis group has been activated to provide psychological support to the boy's relatives.", "title_original": "13-åring död under spanska guldfirandet", "summary_original": "En 13-årig pojke har dött under det spanska guldfirandet efter att en fontän kollapsat, skriver El Mundo. Olyckan inträffade vid halv ett-tiden på natten i staden Ciudad Rodrigo i västra delen av Spanien. Gav vika – stenbumling ramlade Flera ungdomar befann sig på och i fontänen när konstruktionen gav vika. Pojken fick ett stenblock över sig, och trots att flera poliser omedelbart var på plats och försökte få loss honom gick hans liv inte att rädda. Två andra personer har fått vård i samband med att fontänen rasade ihop. En av dem, också en minderårig person, vårdas med allvarliga skador. ”Skulle varit ett glädjefyllt firande” ”Det som skulle ha varit ett glädjefyllt firande av det spanska landslagets VM-seger har förvandlats till en tragedi för hela samhället i Ciudad Rodrigo”, skriver kommunen i ett inlägg på sociala medier. En krisgrupp har aktiverats för att ge psykologiskt stöd till pojkens anhöriga.", "link": "https://www.tv4.se/artikel/6W54usSsqwnWpW9x4Lwd3h/13-aring-doed-under-spanska-guldfirandet", "date_display": "2026-07-20", "date_iso": "2026-07-20T08:14:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/fotbolls-vm-2026", "/spanien", "/olycka"]}, {"id": 143, "title": "Messi in tears - after the final miss", "summary": "\"Aware that it is his last WC trip\"", "title_original": "Messi i tårar – efter finalmissen", "summary_original": "”Känner på sig att det är hans sista VM-resa”", "link": "https://www.tv4.se/artikel/6ut4rTxcBW9IjHaWjGnLv9/messi-i-tarar-efter-finalmissen", "date_display": "2026-07-20", "date_iso": "2026-07-20T06:30:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport"]}, {"id": 144, "title": "Support for Israel plummets in the US: \"Deep concern before the election\"", "summary": "More than half of the Democratic members of the House of Representatives recently voted to end military aid to Israel. Opinion polls show that criticism of Israel's wars in Gaza, Lebanon and Iran is strong, especially among younger voters. At the same time, the election campaign for the Israeli parliamentary elections on 27 October has started. Isabell Schierenbeck, who recently returned from Israel, describes two issues dominating Israeli society. There are the wars and ceasefires in the region as well as the ongoing election campaign. - People are deeply concerned about developments in the region and the framework agreement between the US and Iran, says Isabell Schierenbeck, professor of political science, University of Gothenburg. War and military service in focus Among the most important election issues, the demand for a cross-bloc government investigation after the wars, the question of exemption from military service for ultra-orthodox Jews and Israel's international position recur. - Something that is recurring and has been on the agenda for a long time, that is Israel's international position. And the risk of being considered a pariah state.\n\nThe exemption for certain religious groups has long been controversial and is now especially sensitive when many Israelis serve in the military during ongoing conflicts. - This is a difficult question for Netanyahu. Even within Likud, his own party, and among the far-right religious Zionists, there is resistance to extending the exemption or continuing as it has been, says Schierenbeck. The relationship with the USA The reduced support from the USA worries many in Israel, even if the government tries to downplay the issue.  Several opposition politicians such as Naftali Bennett and Gadi Eisenkot say they want to repair the tensions that have arisen between the Israeli government and the US and European leaders.  - Netanyahu has been known to be this politician who has these good contacts with a number of important political leaders. It is cracking now and it is clear that there is a deep concern, I would say, that is repeated", "title_original": "Stödet för Israel rasar i USA: ”Djup oro inför valet”", "summary_original": "Fler än hälften av Demokraternas ledamöter i representanthuset röstade nyligen för att stoppa det militära stödet till Israel. Opinionsmätningar visar att kritiken mot Israels krig i Gaza, Libanon och Iran är stark, särskilt bland yngre väljare. Samtidigt har valkampanjen inför det israeliska parlamentsvalet den 27 oktober dragit igång. Isabell Schierenbeck, som nyligen återvänt från Israel, beskriver att två frågor dominerar det israeliska samhället. Det är krigen och vapenvilorna i regionen samt den pågående valkampanjen. – Man är djupt oroad över utvecklingen i regionen och ramavtalet mellan USA och Iran, säger Isabell Schierenbeck, professor i statsvetenskap, Göteborgs universitet. Krig och militärtjänst i fokus Bland de viktigaste valfrågorna återkommer kravet på en blocköverskridande statlig utredning efter krigen, frågan om undantag från militärtjänst för ultraortodoxa judar och Israels internationella ställning. – Nåt som är återkommande och har varit länge på agendan, det är Israels internationella ställning. Och risken för att betraktas som en pariastat.\n\nUndantaget för vissa religiösa grupper har länge varit kontroversiellt och är nu extra känsligt när många israeler tjänstgör i militären under pågående konflikter. – Detta är en svår fråga för Netanyahu. Även inom Likud, hans eget parti, och bland de högerextrema religiösa sionisterna finns det ett motstånd mot att undantaget ska förlängas eller att man ska fortsätta som hittills, säger Schierenbeck. Relationen till USA  Det minskade stödet från USA oroar många i Israel, även om regeringen försöker tona ned frågan.  Flera oppositionspolitiker som Naftali Bennett och Gadi Eisenkot säger att de vill reparera de spänningar som uppstått mellan Israels regering och USA samt europeiska ledare.  – Netanyahu har varit känd för att vara den här politikern som har de här goda kontakterna med en rad viktiga politiska ledare. Det krackelerar nu och det är klart att det finns en djup oro, skulle jag säga, som upprepas här från oppositionen, säger Isabell Schierenbeck.", "link": "https://www.tv4.se/artikel/31ZZY8zDO84IQf1JNYTGy4/stoedet-foer-israel-rasar-i-usa-djup-oro-infoer-valet", "date_display": "2026-07-20", "date_iso": "2026-07-20T06:27:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/usa", "/israel", "/donald-trump", "/benjamin-netanyahu"]}, {"id": 145, "title": "Spain ready to celebrate - then Trump remains", "summary": "", "title_original": "Spanien redo att fira – då står Trump kvar", "summary_original": "", "link": "https://www.tv4.se/artikel/5hLegSOgP9O8OMEjFyGfl7/haer-far-spanien-pokalen-av-donald-trump", "date_display": "2026-07-20", "date_iso": "2026-07-20T05:47:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport"]}, {"id": 146, "title": "Zelenskyi's move can hit hard: \"Risk of Ukraine losing momentum\"", "summary": "After Defense Minister Mychaylo Fedorov was dismissed, unusually strong protests have broken out in Ukraine. Demonstrators have gathered in several parts of the country and are criticizing President Volodymyr Zelenskyi's decision to get rid of a minister who for many has come to symbolize Ukraine's technological modernization and investment in drone warfare. According to Russia expert Malcolm Dixelius, the conflict is fundamentally about a power struggle in the Ukrainian leadership. - What is clear is that there has been a power struggle between the Minister of Defense and the country's Commander-in-Chief Syrskyj. In that power struggle, they seemed unable to agree, he says. According to Dixelius, Zelensky was faced with three options. - He could fire the Minister of Defence, he could fire ÖB and he could fire both. Then he chose in this situation to take the safe for the uncertain and keep the ÖB which has nevertheless been involved and fought from the first day against the Russians, he says. Can lose pace During the war, Fedorov has become a key person behind Ukraine's investment in drones and new military technology. He has often been singled out as one of the main figures behind the strategy to counter Russia's numerical superiority with innovation and precision attacks deep inside Russia. That's why the dismissal raises concerns, says Dixelius. - Fedorov, when he is outside the decision-making, it is clear that there is a risk that Ukraine will lose momentum. Especially now, when it seems that Ukraine has gained some kind of strategic advantage thanks to their long-range robots that they are striking inside Russia. He describes Fedorov as a person behind several of the reforms carried out in the army during the war. - He has been involved in creating it as an idea for how Ukraine should be able to defend itself without having the manpower that Russia musters, says Dixelius.  Considering more changes The internal power struggle may at the same time be far from over. The Financial Times reported on Saturday that Zelensky, as a result of the strong protests in the country, was considering", "title_original": "Zelenskyjs drag kan slå hårt: ”Risk att Ukraina tappar tempo”", "summary_original": "Efter att försvarsminister Mychajlo Fedorov avskedats har ovanligt starka protester brutit ut i Ukraina. Demonstranter har samlats på flera håll i landet och kritiserar president Volodymyr Zelenskyjs beslut att göra sig av med en minister som för många kommit att symbolisera Ukrainas tekniska modernisering och satsning på drönarkrigföring. Enligt Rysslandskännaren Malcolm Dixelius handlar konflikten i grunden om en maktkamp i den ukrainska ledningen. – Det som är uppenbart är att det har varit en maktstrid mellan försvarsministern och landets överbefälhavare Syrskyj. I den maktkampen så verkade de inte kunna enas, säger han. Enligt Dixelius stod Zelenskyj inför tre alternativ. – Han kunde avskeda försvarsministern, han kunde avskeda ÖB och han kunde avskeda båda. Då valde han i den här situationen att ta det säkra för det osäkra och behålla den ÖB som ändå har varit med och stridit från första dagen mot ryssarna, säger han. Kan tappa tempo Fedorov har under kriget blivit en nyckelperson bakom Ukrainas satsningar på drönare och ny militär teknik. Han har ofta pekats ut som en av huvudpersonerna bakom strategin att möta Rysslands numerära överlägsenhet med innovation och precisionsattacker långt inne i Ryssland. Därför väcker avskedandet oro, menar Dixelius. – Fedorov, när han står utanför beslutsfattandet så är det klart att det finns en risk att Ukraina tappar tempo. Särskilt nu, när det verkar som om Ukraina fått ett slags strategiskt övertag tack vare sina långdistansrobotar som de slår till med inne i Ryssland. Han beskriver Fedorov som en person som ligger bakom flera av de reformer som genomförts i armén under kriget. – Han har varit med och skapat det som en idé för hur Ukraina ska kunna försvara sig utan att ha det manskap som Ryssland uppbådar, säger Dixelius.  Överväger fler förändringar Den interna maktkampen kan samtidigt vara långt ifrån över. Financial Times rapporterade under lördagen att Zelenskyj, till följd av de starka protesterna i landet, överväger att sparka överbefälhavaren Oleksandr Syrskyj.  – Som svar på den upprörda allmänna opinionen och behovet av reformer i armén hoppas Zelenskyj att han kan skapa ny trovärdighet hos både allmänheten och armén genom att satsa på helt nya namn. Kanske kan Fedorov då få en roll bakom kulisserna, säger han. Den stora utmaningen framåt Enligt Dixelius handlar Ukrainas kanske viktigaste problem framöver inte om teknik utan om människor. Många ukrainare hade satt sitt hopp till att Fedorovs reformer skulle bidra till att stärka försvaret och på sikt skapa förutsättningar för ett avgörande i kriget. – Här står den generation som verkligen hade fått hopp och hoppades att nu skulle kriget komma till sitt slut och är oerhört besvikna över att den person som de trodde på skulle kunna, ja till och med kanske besegra Ryssland i det långa loppet, nu inte är den som styr hur kriget ska föras i fortsättningen. Samtidigt menar han att Ukrainas långsiktiga uthållighet ytterst avgörs av förmågan att få fler unga att ansluta sig till försvaret. – Fedorov hann göra så mycket att han förändrade och förbättrade möjligheterna. Han ökade möjligheten att få ledighet under kriget, han ökade betalningen för dem. Men vi har inte sett effekterna av det.", "link": "https://www.tv4.se/artikel/Dm8qqpIc6Ta9ZuXelQjdj/zelenskyjs-drag-kan-sla-hart-risk-att-ukraina-tappar-tempo", "date_display": "2026-07-19", "date_iso": "2026-07-19T18:18:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/utrikespolitik", "/ukraina", "/ukrainakonflikten", "/ryssland", "/zelenskyj"]}, {"id": 147, "title": "The expert: Every soldier killed makes it harder for Trump", "summary": "Two US soldiers have been killed and a third is missing after an Iranian attack on a US base in Jordan on Friday.  Thus, a total of 16 American servicemen have been killed since the United States and Israel began their attacks on Iran on February 28, according to the New York Times. More than 400 American soldiers have also been injured during the conflict. Despite the deaths, Donald Trump defends the US military action. - They did it because they don't want to see Iran have nuclear weapons, Trump told the New York Post after the attack. The incident risks becoming politically awkward for the US president, who has previously promised to keep the US out of new wars. Last spring, US expert Andreas Utterström warned that American casualties could be what defines Trump's efforts in the Middle East.  - If American soldiers continue to die, that is what will stick, he said then. \"A betrayal\" Now Utterström believes that the new deaths strike directly against one of Trump's most important campaign promises. - It is a betrayal of one o
