ortsätter sin internationella karriär med bland annat spelningar i Argentina och Brasilien. Han är även aktuell för spelning på Sweden Rock i juni.", "link": "https://www.tv4.se/artikel/6kQaTofcCSfPk27E9IP7XD/ryska-foervirringen-efter-stjaernans-dementi-vi-vet-inte", "date_display": "2026-03-05", "date_iso": "2026-03-05T17:38:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ryssland", "/ukrainakonflikten", "/politiker", "/rockstjarnor", "/artist", "/musiker"]}, {"id": 166, "title": "Statement of the International Contact Group for the Great Lakes (ICG) on the situation in the eastern Democratic Republic of the Congo (DRC)", "summary": "Belgium, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement on the situation in the eastern Democratic Republic of the Congo (DRC).", "title_original": "Statement of the International Contact Group for the Great Lakes (ICG) on the situation in the eastern Democratic Republic of the Congo (DRC)", "summary_original": "Belgium, Denmark, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement on the situation in the eastern Democratic Republic of the Congo (DRC).", "link": "https://www.government.se/statements/2026/03/statement-of-the-international-contact-group-for-the-great-lakes-icg--on-the-situation-in-the-eastern-democratic-republic-of-the-congo-drc/", "date_display": "2026-03-05", "date_iso": "2026-03-05T17:12:56+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement"]}, {"id": 167, "title": "The Swedes' trust in the Church of Sweden is stable - the Salvation Army and Sida are losing some ground", "summary": "Overall, the public's faith in the future is increasing, the Confidence Barometer shows.", "title_original": "Svenskarnas förtroende för Svenska kyrkan stabilt – Frälsningsarmén och Sida tappar något", "summary_original": "Över lag ökar allmänhetens framtidstro, visar Förtroendebarometern.", "link": "https://www.dagen.se/nyheter/svenskarnas-foertroende-foer-svenska-kyrkan-stabilt-fraelsningsarmen-och-sida-tappar-nagot/10236812", "date_display": "2026-03-05", "date_iso": "2026-03-05T15:55:25+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 168, "title": "Two mobile phones in a \"small Swedish town\" blew up the global network", "summary": "The circumstances surrounding the international police operation are still shrouded in secrecy. - It is still an ongoing case so we are not giving out any details at the moment, says Mats Berggren, acting deputy director at Noa, the national operational department. The case began when the police raided \"a small Swedish town\" and made an arrest. Two mobile phones were then seized in another investigation. When the investigators went through the mobile phones, the case took a completely different turn - and grew globally. Europol, Eurojust and police units worldwide were involved in the case. \"Key actors identified\" According to the authorities, \"not one group was uncovered but a constellation of interconnected criminal networks that orchestrated large-scale drug trafficking and money laundering\", states Europol. The international effort was led by Swedish police and went by the name \"Operation Candy\". According to Europol, the criminal network spans Europe, Asia and Australia - and is said to have turned over many millions. In coordinated crackdowns in several countries, they have now struck at the \"core\" of global criminal activity and \"knocked out central actors\". At the same time, the police in Gothenburg have also arrested people abroad linked to \"online sales of narcotics and illegal medicines aimed at the Swedish market.\" That effort has gone under the name \"Pandora\". On Friday, Swedish police, Europol and Eurojust will hold two different press conferences.", "title_original": "Två mobiler i ”liten svensk stad” sprängde globalt nätverk", "summary_original": "Omständigheterna kring den internationella polisoperationen omgärdas fortfarande av sekretess. – Det är fortfarande ett pågående ärende så vi lämnar inga detaljer just nu, säger Mats Berggren, tillförordnad biträdande chef på Noa, nationella operativa avdelningen. Ärendet började när polisen slog till i ”en liten svensk stad” och genomförde ett gripande. Två mobiltelefoner togs då i beslag i en annan utredning. När utredarna gick igenom mobilerna fick fallet en helt annan vändning – och växte globalt. Europol, Eurojust och polisenheter över hela världen kopplades in i ärendet. ”Slagit ut centrala aktörer” Enligt myndigheterna ”avslöjades inte en grupp utan en konstellation av sammankopplade kriminella nätverk som orkestrerade storskalig narkotikahandel och penningtvätt”, uppger Europol. Den internationella insatsen leddes av svensk polis och gick under namnet ”Operation Candy”. Enligt Europol sträcker sig det kriminella nätet över Europa, Asien och Australien – och ska ha omsatt mångmiljonbelopp. I samordnade tillslag i flera länder har man nu slagit till mot den globalt kriminella verksamhetens ”kärna” och ”slagit ut centrala aktörer”. Parallellt har polisen i Göteborg också gripit personer utomlands kopplat till ”onlineförsäljning av narkotika och illegala läkemedel riktat mot den svenska marknaden.” Den insatsen har gått under namnet ”Pandora”. På fredagen kommer svensk polis, Europol och Eurojust hålla två olika presskonferenser.", "link": "https://www.tv4.se/artikel/Fbn57Ij9iJwKqqkLK17we/tva-mobiler-i-liten-svensk-stad-spraengde-globalt-naetverk", "date_display": "2026-03-05", "date_iso": "2026-03-05T15:14:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/europol", "/eurojust", "/narkotika", "/brott", "/penningtvatt"]}, {"id": 169, "title": "Role models shape the values ​​of the future", "summary": "We used to have Phantom, Narnia and Little House on the Prairie. Today, we must create new stories that remind us that courage, justice and humanity are always worth choosing, writes Maria Borgehammar, KD.", "title_original": "Förebilder formar framtidens värderingar", "summary_original": "Förr hade vi Fantomen, Narnia och Lilla huset på prärien. I dag måste vi skapa nya berättelser som påminner om att mod, rättvisa och medmänsklighet alltid är värda att välja, skriver Maria Borgehammar, KD.", "link": "https://www.dagen.se/debatt/foerebilder-formar-framtidens-vaerderingar/9903936", "date_display": "2026-03-05", "date_iso": "2026-03-05T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 170, "title": "Lars Arrhenius quits as DO", "summary": "Lars Arrhenius is leaving his position as DO after six years, reports Altinget.", "title_original": "Lars Arrhenius slutar som DO", "summary_original": "Lars Arrhenius lämnar uppdraget som DO efter sex år, rapporterar Altinget.", "link": "https://www.dagen.se/nyheter/lars-arrhenius-slutar-som-do/10237364", "date_display": "2026-03-05", "date_iso": "2026-03-05T14:19:11+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 171, "title": "In memory of Vivianne Andersson", "summary": "", "title_original": "Till minne av Vivianne Andersson", "summary_original": "", "link": "https://www.dagen.se/familj/till-minne-av-vivianne-andersson/10199028", "date_display": "2026-03-05", "date_iso": "2026-03-05T12:56:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 172, "title": "Memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries", "summary": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland.", "title_original": "Memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries", "summary_original": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland.", "link": "https://www.government.se/swedish-treaty-series/2026/03/memorandum-of-understanding-on-protecting-the-civilian-population-of-the-baltic-sea-region-and-the-nordic-countries/", "date_display": "2026-03-05", "date_iso": "2026-03-05T12:13:19+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "1 day old", "tags": ["International", "Ministry of Defence", "Emergency preparedness", "Civil defence", "Total defence", "Swedish Treaty Series"]}, {"id": 173, "title": "Religious rhetoric in the US military - the war \"a step towards the return of Jesus\"", "summary": "The attack takes place at the same time as relations in the region are undergoing strong transformation", "title_original": "Religiös retorik inom USA:s militär – kriget ”ett steg mot Jesu återkomst”", "summary_original": "Anfallet sker samtidigt som relationerna i regionen är i stark omvandling", "link": "https://www.dagen.se/nyheter/religioes-retorik-inom-usas   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
