s to be dangerous, in that people who relax a lot have a higher risk of dying from cancer. Now the researchers know how much relaxation affects the risk of dying.", "title_original": "Så påverkar ditt slappande risken att dö av cancer", "summary_original": "Att såsa framför tv:n eller skärmen kan vara skönt. Men det verkar också vara farligt, såtillvida att personer som slappar mycket har en högre risk att dö av cancer. Nu vet forskarna hur mycket slappandet påverkar risken att dö.", "link": "https://www.dn.se/sverige/sa-paverkar-ditt-slappande-risken-att-do-av-cancer/", "date_display": "2026-07-02", "date_iso": "2026-07-02T18:06:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Here, protected flowers are stolen on Öland - several cases reported to the police", "summary": "At the end of May, a woman was filmed as she dug up unlit rope sedges by the roadside in Resmo in southern Öland. - I think it's terrible that people behave like pigs. That they cannot be afraid of Öland's nature, which is so unique, says Ulla-Britt Andersson.\n\nThe woman in Resmo has not yet been identified, but the theft has been reported to the police. In recent years, more thefts of red-listed and protected flowers have been noticed on Öland. According to information, it is about everything from orchids to backsippers. \"Extremely serious\" At Haga park last spring, around 500 backsips were dug up from a burial ground, despite the fact that the plant can also be bought in regular nurseries.\n\n- This happens too often. And it's extra serious when you collect this many and sell them, even if it's forbidden to dig up a single plant as well. It is very sad that there is such a market, says Helena Lager, head of unit at the county administration in Kalmar. Investigations are often closed Perpetrators are often difficult to prosecute due to lack of evidence and many police reports are closed.\n\nThe County Administrative Board now urges the public to be alert and to intervene in suspicious situations.\n\n- Keep an eye out when you see something suspicious. Go up and ask what they do and if they have a permit. Then they might stop and disappear. It's the only way we can stop these illegal excavations, says Helena Lager. The public right does not apply - Even if they are not registered, the public right does not include digging up plants on someone else's land. It is actually a problem that people come here and that even islanders behave in this way. So be more observant, Ulla-Britt Andersson also appeals.", "title_original": "Här stjäls fridlysta blommor på Öland – flera fall polisanmälda", "summary_original": "I slutet av maj filmades en kvinna när hon grävde upp fridlysta tovsippor vid vägkanten i Resmo på södra Öland. – Det är fruktansvärt tycker jag att folk beter sig som svin. Att de inte kan vara rädda om den öländska naturen som är så unik, säger Ulla-Britt Andersson.\n\nKvinnan i Resmo är ännu inte identifierad, men stölden är polisanmäld. De senaste åren har fler stölder av rödlistade och fridlysta blommor uppmärksammats på Öland. Enligt uppgifter handlar det om allt från orkidéer till backsippor. ”Extremt allvarligt” Vid Haga park i våras grävdes omkring 500 backsippor upp från ett gravfält, trots att växten även går att köpa i vanliga plantskolor.\n\n– Det här händer för ofta. Och det är extra allvarligt när man samlar in så här många och säljer dom, även om det är förbjudet att gräva upp en enda planta också. Det är jätteledsamt att det finns en sådan marknad, säger Helena Lager, enhetschef vid länsstyrelsen i Kalmar. Utredningar läggs ofta ned Gärningspersoner är ofta svåra att lagföra i brist på bevis och många polisanmälningar läggs ned.\n\nLänsstyrelsen uppmanar nu allmänheten att vara uppmärksam och att ingripa vid misstänkta situationer.\n\n– Ha lite koll när man ser något misstänkt. Gå fram och fråga vad de gör och om de har tillstånd. Då kanske de slutar och försvinner. Det är enda sättet vi kan stoppa de här illegala uppgrävningarna på, säger Helena Lager. Allemansrätten gäller inte – Även om de inte är fridlysta ingår det inte i allemansrätten att gräva upp plantor på annans mark. Det är faktiskt ett problem att det kommer hit folk och att även ölänningar beter sig på det här sättet. Så var mer observant, vädjar även Ulla-Britt Andersson.", "link": "https://www.tv4.se/artikel/5m3Fde8cSubV7v229QtltE/haer-stjaels-fridlysta-blommor-pa-oeland-flera-fall-polisanmaelda", "date_display": "2026-07-02", "date_iso": "2026-07-02T17:54:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/oland", "/vaxter", "/stolder"]}, {"id": 136, "title": "Common barbecue mistakes - can have \"devastating consequences\"", "summary": "Summer means high season for grilling. According to a Sifo survey from 2025, carried out by Verian on behalf of ICA, every third Swede barbecues several times a week during the summer months. At the same time, there is a common mistake that many people make when using a gas grill. On many grills, there is a special space under the grill where the gas bottle can fit. This means that many people leave the tube there even when the grill is in use. But according to fire inspector Kristina Gissler, it is safer to take it out. - It should be outside the grill when we grill, she says. Important to be able to quickly turn off the gas If the grill starts to burn, every second can be important. - I have to close the lid and turn off the gas. But I also want to switch off the gas bottle itself and not just the grill, says Kristina Gissler. If the gas tube is inside the grill's cabinet, it may be difficult to access it when the flames start. - This will be very dangerous if I go in and try to turn off the gas bottle. I'd rather do that at a safe distance away from those flames, she says. Never pour water on a grease fire Kristina Gissler also warns against pouring water on a grease fire in the grill. - It is absolutely not good. It can have devastating consequences, she says. If the grill is close to a roof or facade, the fire can quickly spread further. - Now if we had this grill under a roof, then it could have caught fire. It could also have traveled on to the facade and we would have had a much, much bigger fire, says Kristina Gissler.", "title_original": "Vanliga grillmissen – kan få ”förödande konsekvenser”", "summary_original": "Sommaren innebär högsäsong för grillning. Enligt en Sifo-undersökning från 2025, som Verian gjort på uppdrag av Ica, grillar var tredje svensk flera gånger i veckan under sommarmånaderna. Samtidigt finns det ett vanligt misstag som många gör när de använder gasolgrill. På många grillar finns ett särskilt utrymme under grillen där gasolflaskan får plats. Det gör att många låter tuben stå kvar där även när grillen används. Men enligt brandinspektören Kristina Gissler är det säkrare att ta ut den. – Den ska stå utanför grillen när vi grillar, säger hon. Viktigt att snabbt kunna stänga av gasolen Om det börjar brinna i grillen kan varje sekund vara viktig. – Jag måste stänga locket och stänga av gasolen. Men jag vill också stänga av själva gasolflaskan och inte bara grillen, säger Kristina Gissler. Om gasoltuben står inne i grillens skåp kan det bli svårt att komma åt den när lågorna slår upp. – Det här blir ju väldigt farligt om jag ska in och försöka stänga av gasolflaskan. Det kan jag hellre göra på ett säkert avstånd bort ifrån de där lågorna, säger hon. Häll aldrig vatten på fettbrand Kristina Gissler varnar också för att hälla vatten på en fettbrand i grillen. – Det är absolut inte bra. Det kan få förödande konsekvenser, säger hon. Om grillen står nära ett tak eller en fasad kan branden snabbt sprida sig vidare. – Hade vi nu haft den här grillen under ett tak, då hade ju det kunnat ta eld. Det hade också kunnat vandra vidare till fasaden och vi hade fått en mycket, mycket större brand, säger Kristina Gissler.", "link": "https://www.tv4.se/artikel/3tRlFY27r2A8i5UUjAEr3j/vanliga-grillmissen-kan-fa-foeroedande-konsekvenser", "date_display": "2026-07-02", "date_iso": "2026-07-02T16:51:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/grillning", "/matlagning", "/brand", "/brander"]}, {"id": 137, "title": "Man rescued from the racial masses - after eight days", "summary": "Security guard Hernán Gil was buried under seven collapsed floors in Catia La Mar, inside the booth where he was working when the first earthquake shook Venezuela last Wednesday. Signs of life from him were discovered this weekend. And thanks to rescue workers managing to provide him with food and water as they slowly worked their way closer to him, he was able to be kept alive far longer than the three-day maximum often expected for disaster survivors. Jubilation erupted among the international rescue team, led by Chilean firefighters, when father-of-two Hernán Gil was finally carried out on a stretcher to a waiting Red Cross ambulance. It is a miracle, his wife Gusbimar González previously told AFP about the fact that her husband is alive - and that so many helped in the fight to save him. Two-year-old rescued On Tuesday – six days after the earthquake – a two-year-old boy was rescued in La Guaira. When he arrived at hospital, he was in a state of shock - \"just screaming and screaming\", his aunt Andreína Sarmiento told the BBC. Now she is hoping for another miracle: that her sister and husband are found alive. I pray to God to give me strength. He is only two years old and I am not a mother, says the 23-year-old. Nearly 2,300 people had been confirmed dead by Wednesday evening in the quake, which was the strongest to hit Venezuela in over a century. Tens of thousands are still missing. Marked with \"D\" for dead The window to succeed in finding survivors is getting smaller and smaller. In the past six days, the around 3,000 international rescue workers who arrived have only managed to save twelve people alive, according to the UN crisis coordination team, Undac, according to the Spanish news agency EFE. In hard-hit La Guaira, north of Caracas, a majority of the demolished buildings are now marked with the letter D, reports AFP. D for deceased, which means that the houses were searched without the rescue workers finding any signs of life. On Wednesday, the Netherlands team announced that they are ending their opd", "title_original": "Man räddad ur rasmassorna – efter åtta dagar", "summary_original": "Säkerhetsvakten Hernán Gil låg begravd under sju kollapsade våningar i Catia La Mar, inne i det bås där han arbetade när den första jordbävningen skakade Venezuela förra onsdagen. Livstecken från honom upptäcktes i helgen. Och tack vare att räddningsarbetare lyckats förse honom med mat och vatten medan de sakta arbetat sig närmare honom kunde han hållas vid liv betydligt längre än de maximalt tre dygn man ofta räknar med för överlevare i katastrofer. Jubel utbröt bland det internationella räddningsteamet, med chilenska brandmän i spetsen, när tvåbarnsfadern Hernán Gil till slut kunde föras ut på en bår till en väntande ambulans från Röda Korset. Det är ett mirakel, sade hans fru Gusbimar González tidigare till AFP om det faktum att maken är vid liv – och att så många hjälpt till i kampen att rädda honom. Tvååring räddad På tisdagen – sex dagar efter skalven – räddades en tvåårig pojke i La Guaira. När han anlände till sjukhus var han i chocktillstånd – ”bara skrek och skrek”, berättar hans moster Andreína Sarmiento för BBC. Nu hoppas hon på ytterligare ett mirakel: att hennes syster med make hittas vid liv. Jag ber till Gud att ge mig styrka. Han är bara två år och jag är ingen mamma, säger 23-åringen. Nästan 2 300 personer hade på onsdagskvällen bekräftats döda i skalven, som var de kraftigaste att drabba Venezuela på över ett århundrade. Ännu saknas tiotusentals. Märkta med ”D” för döda Fönstret för att lyckas hitta överlevare blir allt mindre. Under de senaste sex dagarna har de runt 3 000 tillresta internationella räddningsarbetarna bara lyckats rädda tolv personer vid liv, uppger FN:s samordningsteam vid kriser, Undac, enligt den spanska nyhetsbyrån EFE. I hårt drabbade La Guaira norr om Caracas är en majoritet av de raserade byggnaderna nu märkta med bokstaven D, rapporterar AFP. D för deceased, döda, vilket innebär att husen sökts igenom utan att räddningsarbetarna hittat några tecken på liv. På onsdagen meddelade Nederländernas team att de avslutar sitt uppdrag i Venezuela, då chanserna att hitta överlevare minskat.", "link": "https://www.tv4.se/artikel/4IxNWPtS0wp8CPpTaECoKI/man-raeddad-ur-rasmassorna-efter-atta-dagar", "date_display": "2026-07-02", "date_iso": "2026-07-02T16:33:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/jordbavningarna-i-venezuela", "/venezuela"]}, {"id": 138, "title": "The horror caterpillar causes Danes to flee their homes: \"It itches like crazy\"", "summary": "The poisonous oak processionary spinner has created big problems in Odense, Denmark. Families have left their homes, children have been affected by rashes and the municipality has been forced to close pedestrian and bicycle paths.  In Denmark, the oak processionary moth is sometimes called the \"caterpillar from hell\". The larva's microscopic hairs can cause severe itching, rashes, eye problems, breathing problems and allergic reactions. One of those affected is Anne Dorthe Lind-Feldt in Odense. - I have moved out to my friend, who has the opportunity to house us until we find another solution, she says to DR. \"Too much\" The Lind-Feldt family has been struggling with symptoms for several weeks without understanding the cause. First they suspected fleas and later mites. - My husband has basically been blind for a month and a half. His eyes have been seriously affected and he has had blurred vision, she says. When the family's one-year-old daughter was severely affected, they chose to leave home. - When I picked up the little one, she was covered in rashes from head to toe. It was too much for me. I was completely taken, says Anne Dorthe Lind-Feldt. Plans demonstration Other residents also testify to extensive problems. Odense resident Alexander Boe mapped the situation in his area and concluded that 93 out of 118 households were affected by itching and rashes. - It itches like crazy. At first I thought it was a mosquito bite, he says. Dissatisfaction with the authorities' handling has led to residents now planning a demonstration outside Odense town hall on Saturday. The municipality of Odense describes the situation as unusual. - It has simply exploded, says Martin Petersen, head of the department for climate and environment in Odense municipality. Can establish itself in Sweden The Skåne County Administrative Board is following developments and does not rule out the species reaching Sweden. \"It seems to be creeping up slowly, so it could probably eventually establish itself here. But it is difficult to say when,\" writes Cajza Eriksson, coordinator of the work against invasive alien species, in an email reply.  According to the county board, increases", "title_original": "Skräcklarven får danskar att fly sina hem: ”Det kliar som galet”", "summary_original": "Den giftiga ekprocessionspinnaren har skapat stora problem i danska Odense. Familjer har lämnat sina hem, barn har drabbats av utslag och kommunen har tvingats stänga av gång- och cykelvägar.  I Danmark kallas ekprocessionspinnaren ibland för ”larven från helvetet”. Larvens mikroskopiska hår kan orsaka kraftig klåda, utslag, ögonbesvär, andningsproblem och allergiska reaktioner. En av de drabbade är Anne Dorthe Lind-Feldt i Odense. – Jag har flyttat ut till min vän, som har möjlighet att hysa oss tills vi hittar en annan lösning, säger hon till DR. ”Blev för mycket” Familjen Lind-Feldt har under flera veckor kämpat med symptom utan att förstå orsaken. Först misstänkte de loppor och senare kvalster. – Min man har i princip varit blind i en och en halv månad. Hans ögon har blivit rejält påverkade och han har haft suddig syn, säger hon. När familjens ettåriga dotter drabbades svårt valde de att lämna hemmet. – När jag hämtade den lilla var hon täckt av utslag från topp till tå. Det blev för mycket för mig. Jag blev helt tagen, säger Anne Dorthe Lind-Feldt. Planerar demonstration  Även andra boende vittnar om omfattande problem. Odensebon Alexander Boe kartlade situationen i sitt område och kom fram till att 93 av 118 hushåll drabbats av klåda och utslag. – Det kliar som galet. Först trodde jag att det var ett myggbett, säger han. Missnöjet med myndigheternas hantering har lett till att invånare nu planerar en demonstration utanför Odense rådhus på lördagen. Odense kommun beskriver situationen som ovanlig. – Det har helt enkelt exploderat, säger Martin Petersen, chef vid avdelningen för klimat och miljö i Odense kommun. Kan etablera sig i Sverige Länsstyrelsen Skåne följer utvecklingen och utesluter inte att arten når Sverige. ”Den verkar ju krypa långsamt uppåt så den skulle säkert så småningom kunna etablera sig här. Men det är svårt att sia om när”, skriver Cajza Eriksson, samordnare för arbetet mot invasiva främmande arter, i ett mejlsvar.  Enligt länsstyrelsen ökar möjligheterna för spridning i takt med stigande temperaturer och om arten etablerar sig i Sverige finns det samtidigt begränsade resurser för ytterligare bekämpningsinsatser. ”Sen försöker vi ju alltid prioritera arter som är i tidig etablering där en snabb insats kan göra stor skillnad, men i nuläget skulle det innebära att vi blev tvungna att ställa in andra insatser och eftersom vi generellt bara jobbar med insatser som är högt prioriterade så skulle det vara olyckligt”, skriver hon.", "link": "https://www.tv4.se/artikel/4VCl56dUTGy4NJSIIXA2KU/skraecklarven-far-danskar-att-fly-sina-hem-det-kliar-som-galet", "date_display": "2026-07-02", "date_iso": "2026-07-02T15:58:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/danmark", "/djur", "/djur-och-natur", "/allergi", "/gift"]}, {"id": 139, "title": "A thousand guests and strict security - this is what Taylor Swift's wedding is expected to be like", "summary": "The world's most talked about celebrity wedding seems to be near. According to information to the AP, pop star Taylor Swift and NFL star Travis Kelce will marry at Madison Square Garden in New York this weekend. Although the couple themselves have not confirmed the information, speculation has reached boiling point in recent weeks. Outside the iconic arena, which is home to the NBA's New York Knicks and the NHL's New York Rangers, trucks have been unloading equipment, food deliveries and construction materials, while streets around the area have been closed.  Among other things, there is speculation that a gigantic fairytale castle will be built inside the arena. That after a large staircase is seen being loaded. Up to 1,000 guests According to AP, the festivities will begin with a small rehearsal dinner on Thursday evening before the big wedding party is held on Friday.  CBS reports that about 100 people are expected to attend the rehearsal dinner, while the big party can gather up to 1,000 guests. According to the information, several musical performances are also being prepared during the evening. Among the names mentioned as possible guests are Taylor Swift's close friend Selena Gomez, producer Jack Antonoff and several of Travis Kelce's Kansas City Chiefs teammates. Safety in focus The wedding is expected to be a logistical challenge. American media reports that around 500 vehicles are expected to transport guests to the arena. The New York police have confirmed that they are planning a special operation around the event.  This happens at the same time as New York receives large numbers of visitors in connection with the soccer World Cup and the celebration of the USA's 250th anniversary. The security issue has been particularly sensitive since Swift was forced to cancel concerts in Vienna last year after a suspected terrorist plot was foiled.  Still no official word Despite the many reports, the couple continues to keep quiet about the plans. That has led some fans to speculate that the entire Madison Square Garden setup may be a diversionary maneuver to protect the real celebration,", "title_original": "Tusen gäster och stenhård säkerhet – så väntas Taylor Swifts bröllop bli", "summary_original": "Världens mest omtalade kändisbröllop tycks vara nära. Enligt uppgifter till AP kommer popstjärnan Taylor Swift och NFL-stjärnan Travis Kelce att gifta sig på Madison Square Garden i New York under helgen. Trots att paret själva inte har bekräftat uppgifterna har spekulationerna nått kokpunkten de senaste veckorna. Utanför den ikoniska arenan, som till vardags huserar NBA-laget New York Knicks och NHL-laget New York Rangers, har lastbilar lossat utrustning, matleveranser och byggmaterial samtidigt som gator runt området stängts av.  Bland annat spekuleras det om att det ska byggas upp ett gigantiskt sagoslott inne i arenan. Det efter att en stor trappa synts lastas in. Upp till 1 000 gäster Enligt AP ska festligheterna inledas med en mindre repetitionsmiddag på torsdagskvällen innan den stora bröllopsfesten hålls på fredagen.  CBS rapporterar att omkring 100 personer väntas delta vid repetitionsmiddagen, medan den stora festen kan samla upp emot 1 000 gäster. Enligt uppgifterna förbereds även flera musikframträdanden under kvällen. Bland de namn som nämnts som möjliga gäster finns Taylor Swifts nära vän Selena Gomez, producenten Jack Antonoff och flera av Travis Kelces lagkamrater från Kansas City Chiefs. Säkerheten i fokus Bröllopet väntas bli en logistisk utmaning. Amerikanska medier rapporterar att omkring 500 fordon väntas transportera gäster till arenan. New York-polisen har bekräftat att man planerar en särskild insats kring evenemanget.  Detta sker samtidigt som New York tar emot stora mängder besökare i samband med fotbolls-VM och firandet av USA:s 250-årsjubileum. Säkerhetsfrågan har varit extra känslig sedan Swift förra året tvingades ställa in konserter i Wien efter att en misstänkt terrorplan avvärjts.  Fortfarande inget officiellt besked Trots de många uppgifterna fortsätter paret att hålla tyst om planerna. Det har fått vissa fans att spekulera i att hela Madison Square Garden-upplägget kan vara en avledningsmanöver för att skydda det verkliga firandet, rapporterar AP.  Om uppgifterna stämmer väntas dock New York stå värd för det som redan beskrivs som USA:s motsvarighet till ett kungligt bröllop.", "link": "https://www.tv4.se/artikel/3aA5ByAVfQLmRO43wVcLr4/tusen-gaester-och-stenhard-saekerhet-sa-vaentas-taylor-swifts-broellop-bli", "date_display": "2026-07-02", "date_iso": "2026-07-02T15:18:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/sakerhet", "/polisen", "/karlek", "/taylor-swift", "/usa", "/new-york", "/travis-kelce"]}, {"id": 140, "title": "They are sentenced to life after the mosque murder", "summary": "The shooting happened right after the Friday prayer on August 15 last year. The crowd then left the mosque in Vivalla and went out into the parking lot. Among them was a 16-year-old boy and Guled Mahmud Elmi. Both had been in the prayer hall - but with the intention of murder. Guled Mahmud Elmi was in an ongoing video conversation on Snapchat with the client and \"mastermind\" of the assassination plans: Hassan Wehbi who was in Lebanon and directed the act from there. After the target, a 27-year-old man, was identified, Guled Mahmud Elmi approached the 16-year-old boy and put his arm around him - pointing out who was to be killed. The 16-year-old then took out the gun and opened fire on the 27-year-old in what was described as an execution. He was shot dead with several shots, including in the back. At the same time, another man, who was not the target, was hit in the arm but survived. Surveillance footage shows the chaos that erupted in the crowd. Dad alerted the police 15 people were charged in the case. Today, the verdict was handed down in Örebro district court after an extensive trial.  Guled Mahmud Elmi and Hassan Wehbi received life sentences for murder. The 16-year-old shooter was convicted of murder and attempted murder and received nine years and ten months in prison. - The murder was well planned and was like a pure execution. It is an aggravating circumstance that the murder took place in a gang conflict. There can be no other penalty for the adults convicted of murder than life imprisonment, says councilor Johan Alvner in a press release. Seven men were convicted of aiding and abetting murder. One of them, Siar Mohammed, received a life sentence after helping the shooter book a taxi for him, arranging an apartment where he could hide, a so-called printer's apartment, and ordering food for him, among other things. According to the district court, he was \"responsible for the logistics of the murder\". The other convicts received prison sentences of various lengths or closed youth care. A further three people were acquitted of aiding and abetting. Linked to gang conflict Siar Mohammed was also convicted of preparation for murder and aggravated weapons offense which occurred", "title_original": "De döms till livstid efter moskémordet", "summary_original": "Skjutningen skedde direkt efter fredagsbönen den 15 augusti förra året. Folkmassan lämnade då moskén i Vivalla och gick ut på parkeringen. Bland dem fanns en 16-årig pojke och Guled Mahmud Elmi. Båda hade befunnit sig i bönesalen – men med avsikten att mörda. Guled Mahmud Elmi var i ett pågående videosamtal på Snapchat med beställaren och ”hjärnan” av mordplanerna: Hassan Wehbi som befann sig i Libanon och styrde dådet därifrån. Efter att måltavlan, en 27-årig man, identifierats gick Guled Mahmud Elmi fram till den 16-årige pojken och lade armen om honom – och pekade ut vem som skulle mördas. Därefter tog 16-åringen fram pistolen och öppnade eld mot 27-åringen i vad som beskrivits som en avrättning. Han sköts ihjäl med flera skott, bland annat i ryggen. Samtidigt träffades en annan man, som inte var måltavla, i armen men överlevde. Övervakningsfilmer visar kaoset som bröt ut i folkmassan. Pappa larmade polisen 15 personer åtalades i målet. I dag föll domen i Örebro tingsrätt efter en omfattande rättegång.  Guled Mahmud Elmi och Hassan Wehbi fick livstids fängelse för mord. Den 16-årige skytten dömdes för mord och mordförsök och fick nio år och tio månaders fängelse. – Mordet var välplanerat och var som en ren avrättning. Det är en försvårande omständighet att mordet skett i en gängkonflikt. Det kan inte bli annan påföljd för de vuxna som döms för mord än livstids fängelse, säger rådmannen Johan Alvner i ett pressmeddelande. Sju män dömdes för medhjälp till mord. En av dem, Siar Mohammed, fick livstids fängelse efter att ha hjälpt skytten att boka taxi åt honom, ordnat en lägenhet där han kunde gömma sig, en så kallad tryckarlägenhet, och bland annat beställt mat åt honom. Enligt tingsrätten var han ”ansvarig för logistiken vid mordet”. De övriga dömda fick olika långa fängelsestraff eller sluten ungdomsvård. Ytterligare tre personer frikändes från medhjälp. Kopplas till gängkonflikt Siar Mohammed dömdes också för förberedelse till mord och grovt vapenbrott som skedde dagarna innan han greps i oktober. Dessa mordplaner genomfördes inte efter att den 14-årige utföraren ångrat sig och hans pappa larmat polisen. Både moskémordet och de avblåsta mordplanerna kopplas till samma konflikt i Örebro som pågått i flera år mellan ”olika kriminella grupperingar” i staden.", "link": "https://www.tv4.se/artikel/2Jt1HlyLTYvLxIj1T8os2X/de-doems-till-livstid-efter-moskemordet", "date_display": "2026-07-02", "date_iso": "2026-07-02T15:07:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/orebro", "/mord", "/skottlossning", "/skjutningar-i-sverige", "/brott"]}, {"id": 141, "title": "Poland procures three A26 submarines from Saab following talks with Swedish Government", "summary": "On 29 June, Swedish Prime Minister Ulf Kristersson visited Gdynia, Poland for government-level talks. The meeting focused on strengthened bilateral cooperation between Sweden and Poland in the areas of regional security and defence. Minister for Defence Pål Jonson, Minister for Foreign Affairs Maria Malmer Stenergard, Minister for Culture Parisa Liljestrand, Minister for Infrastructure and Housing Andreas Carlson and Minister for EU Affairs Jessica Rosencrantz also took part on the trip.", "title_original": "Poland procures three A26 submarines from Saab following talks with Swedish Government", "summary_original": "On 29 June, Swedish Prime Minister Ulf Kristersson visited Gdynia, Poland for government-level talks. The meeting focused on strengthened bilateral cooperation between Sweden and Poland in the areas of regional security and defence. Minister for Defence Pål Jonson, Minister for Foreign Affairs Maria Malmer Stenergard, Minister for Culture Parisa Liljestrand, Minister for Infrastructure and Housing Andreas Carlson and Minister for EU Affairs Jessica Rosencrantz also took part on the trip.", "link": "https://www.government.se/articles/2026/07/poland-procures-three-a26-submarines-from-saab-following-talks-with-swedish-government/", "date_display": "2026-07-02", "date_iso": "2026-07-02T13:55:45+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "today", "tags": ["EU", "Prime Minister's Office", "Ministry of Culture", "Ministry of Defence", "Ministry for Foreign Affairs", "Foreign and security policy", "Article", "Ministry of Rural Affairs and Infrastructure", "Andreas Carlson", "Maria Malmer Stenergard", "Parisa Liljestrand", "Pål Jonson", "Ulf Kristersson", "Military defence", "Jessica Rosencrantz"]}, {"id": 142, "title": "Swede Adrian after the night of horror in Kyiv: \"Incredibly small\"", "summary": "Forced to take shelter • On location in Kyiv", "title_original": "Svenske Adrian efter skräcknatten i Kiev: ”Small otroligt mycket”", "summary_original": "Tvingades ta skydd • På plats i Kiev", "link": "https://www.tv4.se/artikel/4Fl6HsreeQGsfgJNSgGD1B/svenske-adrian-efter-skraecknatten-i-kiev-small-otroligt-mycket", "date_display": "2026-07-02", "date_iso": "2026-07-02T13:28:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "The SSPX is excommunicated from the Catholic Church", "summary": "The traditionalist breakaway group has defied the Pope • Catholics who \"formally join the SSPX schism\" incur the Catholic Church's most severe punishment.", "title_original": "SSPX exkommuniceras ur Katolska kyrkan", "summary_original": "Den traditionalistiska utbrytargruppen har trotsat påven • Katoliker som ”formellt ansluter sig till SSPX schism” drar på sig Katolska kyrkans strängaste straff.", "link": "https://www.dagen.se/nyheter/sspx-exkommuniceras-ur-katolska-kyrkan/10422893", "date_display": "2026-07-02", "date_iso": "2026-07-02T13:08:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 144, "title": "The mystery of the car sites: Who is behind the aggressive link scam for Kollabilinfo.se and Onevin.com?", "summary": "Are you looking for reviews for Kollabilinfo.se or Onevin.com? Read our review of aggressive link marketing and why site owners are warning. \n The post The mystery of car sites: Who is behind the aggressive link scam for Kollabilinfo.se and Onevin.com?  appeared first on ABC News.", "title_original": "Mysteriet med bilsajterna: Vem ligger bakom den aggressiva länkbluffen för Kollabilinfo.se och Onevin.com?", "summary_original": "Letar du efter omdöme för Kollabilinfo.se eller Onevin.com? Läs vår granskning av den aggressiva länkmarknadsföringen och varför sajtägare varnar. \n The post  Mysteriet med bilsajterna: Vem ligger bakom den aggressiva länkbluffen för Kollabilinfo.se och Onevin.com?  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/kollabilinfo-onevin-omdome-varning/", "date_display": "2026-07-02", "date_iso": "2026-07-02T12:16:47+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Samhälle"]}, {"id": 145, "title": "The investigation is closed - Hugo's suspected murderer dead", "summary": "The police were alerted to the shooting in Örebro on the night between March 21 and 22 this year. Hugo Mosshagen was found shot in a residential area. His life could not be saved. The police put great resources into the murder investigation but could not find a motive. Hugo Mosshagen was an active athlete with football dreams and had no links to crime.  The theory was instead that he was not the target but was shot by mistake. \"Cost a young man's life\" Now the police have chosen to drop the preliminary investigation. The reason is that the suspected perpetrator is dead, the prosecutor states. On Thursday, the Örebro police and the prosecutor held a press conference about the case.  - It was gross violence that cost the life of a young person, but it has also devastated the lives of several others, says Jonas Lundh, deputy local police area chief in Örebro.  The head of the investigation Anders Mullfors says that the investigation has been conducted on a broad front. - We have dealt with the majority of different hypotheses, where we were able to continuously deduce the course of events, motives and alternative perpetrators. Hypotheses that we discussed have, among other things, dealt with different motive images, but we have also investigated possible gang connections and what is known as \"crime as a service\" and were able to rule it out completely, he says. \"Haft weapon habit\" According to Anders Mullfors, the investigation includes around 140 interrogations, around 30 house searches and analyzes of around 30 mobile phones. In addition, extensive film material has been reviewed. - It is the case that this investigative material in this preliminary investigation shows unequivocally that it is the suspected perpetrator who committed the crimes. If the conditions had existed, charges would have been brought, but since the suspected perpetrator is dead, the preliminary investigation is closed instead, says Jakob Holmberg, senior prosecutor. - The suspected perpetrator is an adult man who had a weapon habit. He had the time and opportunity to carry out the crimes and no alibi, says Anders Mullfors.  Not the intended victim According to the prosecutor", "title_original": "Utredningen läggs ned – Hugos misstänkte mördare död", "summary_original": "Polisen larmades om skottlossningen i Örebro natten mellan den 21 och 22 mars i år. I ett bostadsområde hittades Hugo Mosshagen skjuten. Hans liv gick inte att rädda. Polisen la ned stora resurser på mordutredningen men kunde inte hitta något motiv. Hugo Mosshagen var en aktiv idrottare med fotbollsdrömmar och hade inga kopplingar till kriminalitet.  Teorin var i stället att han inte var måltavlan utan blev skjuten av misstag. ”Kostade en ung människas liv” Nu har polisen valt att lägga ned förundersökningen. Anledningen är att den misstänkte gärningsmannen är död, uppger åklagaren. På torsdagen höll Örebropolisen och åklagaren en pressträff om fallet.  – Det var ett grovt våld som kostade en ung människas liv, men det har också raserat livet för flera andra, säger Jonas Lundh, biträdande lokalpolisområdeschef i Örebro.  Utredningsledaren Anders Mullfors säger att utredningen har bedrivits på bred front. – Vi har hanterat flertalet olika hypoteser, där vi löpande kunnat avföra händelseförlopp, motiv och alternativa gärningsmän. Hypoteser som vi avhandlat har bland annat handlat om olika motivbilder, men vi har också utrett eventuell gängkoppling och det som kallas för ”crime as a service” och kunnat avföra det helt, säger han. ”Haft vapenvana” Enligt Anders Mullfors omfattar utredningen omkring 140 förhör, ett 30-tal husrannsakningar och analyser av cirka 30 mobiltelefoner. Dessutom har ett omfattande filmmaterial granskats. – Det är nämligen så att det här utredningsmaterialet i den här förundersökningen visar entydigt att det är den misstänkte gärningsmannen som utfört brotten. Om förutsättningar hade funnits, så hade åtal väckts, men eftersom den misstänkte gärningsmannen är död läggs förundersökningen i stället ned, säger Jakob Holmberg, senior åklagare. – Den misstänkte gärningsmannen är en man i vuxen ålder som haft vapenvana. Han hade tid och möjlighet att genomföra brotten samt inget alibi, säger Anders Mullfors.  Inte det tilltänkta offret Enligt åklagaren var Hugo Mosshagen inte det tilltänkta offret. – Att denne var där just då kan närmast beskrivas som en tillfällighet, säger Jakob Holmberg. I stället bedömer polisen att en annan person som befann sig på platsen var den egentliga måltavlan. – Motivet är riktat mot målsägande B. Vi har gjort analys och genomgång av den misstänkte gärningsmannens mobiltelefon samt använt oss av hemliga tvångsmedel som gett stöd för att gärningen varit planerad och att den misstänkte gärningsmannen haft en forensisk medvetenhet, säger Anders Mullfors.", "link": "https://www.tv4.se/artikel/4OwCPeu8NjOZiydTBzywME/hugo-mosshagens-misstaenkte-moerdare-doed-utredningen-laeggs-ned", "date_display": "2026-07-02", "date_iso": "2026-07-02T11:31:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/orebro", "/mord", "/skottlossning"]}, {"id": 146, "title": "Warning: The new language requirement may worsen the staff shortage", "summary": "As of July 1, a language requirement applies in care for the elderly. This means that all businesses must work for the staff to reach a language level equivalent to high school Swedish. - It will be a challenge. You will have to spend a lot of time, resources and long-term work on it, but we believe that, with the right support, it will benefit the supply of skills, says Anna Bergendal, economic policy expert at Vårdföretagarna. The new law is based on a proposal from the Tidö parties and aims to increase the security of the elderly. - The elderly must be able to understand and make themselves understood. A language requirement in care for the elderly is therefore much awaited, says Minister for the Elderly and Social Insurance Anna Tenje in a press release.  Language lessons must take place during working hours The training must take place in parallel with the usual work, which has raised concerns that extra staff will be required to cover up. - If the businesses are already on their knees, it is difficult to create the spaces that are needed. Therefore, both the state and employers must contribute the resources that make these efforts possible, says Lisa Bondesson, head of social policy at Kommunal. At Vårdföretagarna, there is also a risk that the financial support allocated will go to other educations than those within the Swedish language.  - It is not earmarked for the language requirement. We already see today that some municipalities do not prioritize the language issue and that it does not reach all businesses, so the government would need to be clearer here, says Anna Bergendal. \"No quick fix\" From the trade union side, the language requirement is welcomed, but it is emphasized at the same time that the language challenges require sustained efforts. - In elderly care, we have a very high staff turnover, so it is not a quick fix, but a continuous work, says Lisa Bondesson. A concern that Bondesson raises is that employers may opt out of people with insufficient knowledge of Swedish. At the same time, she emphasizes the need for strong support for the activities in the future, to avoid", "title_original": "Varnar: Nya språkkravet kan förvärra personalbristen", "summary_original": "Från och med den 1 juli gäller ett språkkrav inom äldreomsorgen. Det innebär att alla verksamheter måste arbeta för att personalen ska nå en språknivå som motsvarar gymnasiesvenska. – Det kommer att bli en utmaning. Man kommer behöva lägga mycket tid, resurser och långsiktigt arbete på det men vi tror att, med rätt stöd, kommer det att gagna kompetensförsörjningen, säger Anna Bergendal, näringspolitisk expert på Vårdföretagarna. Den nya lagen bygger på ett förslag från Tidöpartierna och har som mål att öka de äldres trygghet. – Äldre måste kunna förstå och göra sig förstådda. Ett språkkrav i äldreomsorgen är därför mycket efterlängtat, säger äldre- och socialförsäkringsminister Anna Tenje i ett pressmeddelande.  Språklektioner ska ske på arbetstid Utbildningen ska ske parallellt med det vanliga arbetet, vilket har väckt oro för att det kommer krävas extra personal för att täcka upp. – Om verksamheterna redan går på knäna är det svårt att skapa de utrymmen som behövs. Därför måste både staten och arbetsgivarna bidra med de resurser som gör de här insatserna möjliga, säger Lisa Bondesson, samhällspolitisk chef på Kommunal. På Vårdföretagarna ser man även en risk för att det ekonomiska stödet som avsätts kommer gå till andra utbildningar än de inom det svenska språket.  – Det är inte öronmärkt till språkkravet. Vi ser redan idag att vissa kommuner inte prioriterar språkfrågan och att det inte når ut till alla verksamheter, så här skulle regeringen behöva bli tydligare, säger Anna Bergendal. ”Ingen quick fix” Från fackligt håll välkomnas språkkravet, men man betonar samtidigt att språkutmaningarna kräver uthålliga insatser. – I äldreomsorgen har vi väldigt hög personalomsättning så det är ingen quick fix, utan ett kontinuerligt arbete, säger Lisa Bondesson. En farhåga som Bondesson lyfter är att arbetsgivare kan komma att välja bort personer med bristande kunskaper i svenska. Samtidigt betonar hon behovet av ett starkt stöd för verksamheterna i framtiden, för att undvika att det går ut över de anställda. – Den största risken med språkkravet är inte språkkravet i sig, utan att man inför det utan att samtidigt investera i utbildning och bemanning. En annan risk som vi ser är att fokus läggs på kontroll i stället för utveckling.", "link": "https://www.tv4.se/artikel/4iuklCbIGFmTCaKOFz5HiY/varnar-nya-sprakkravet-kan-foervaerra-personalbristen", "date_display": "2026-07-02", "date_iso": "2026-07-02T10:38:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/sprakkrav", "/aldrevard", "/aldreomsorg", "/kommunal", "/politik"]}, {"id": 147, "title": "Tommy Körberg wants to see Benjamin Ingrosso in the role of himself", "summary": "The film will take place during the 1960s and 70s, when Tommy Körberg broke through. He describes the decades as a time filled with creativity, playfulness and great musical swings. - In the 70s, a lot happened musically. Both good and bad. It was a vibrant period of musical culture. Körberg says that he tries not to interfere with the work on the film, but admits that it can be difficult. - I don't want to get involved, but I will if I still remember something worth playing back, he says with a laugh. Already has a favorite When asked who he would most like to see in the role of young Tommy, the answer comes straight away. - The first thing I thought of was Benjamin Ingrosso. He also explains why the choice fell on Ingrosso in particular. - We have developed a very good relationship. I am his substitute father here at home. \"The music must be there\" The film will be directed by Lena Rehnberg, who previously made the films about Monica Zetterlund and Ted Gärdestad. What is most important to capture in the story, however, Tommy Körberg is absolutely sure. - The music. My musical essence. At the same time, he hopes that both the stormy years and the humor get a place on the big screen. He himself intends to try to stay in the background, although he has already joked about appearing in the middle of the film. - I suggested that I should join and comment on certain scenes. To come in and say, \"Wait a minute. It was a little worse than that.\"", "title_original": "Tommy Körberg vill se Benjamin Ingrosso i rollen som sig själv", "summary_original": "Filmen ska utspela sig under 1960- och 70-talen, då Tommy Körberg slog igenom. Han beskriver decennierna som en tid fylld av kreativitet, lekfullhet och stora musikaliska svängningar. – På 70-talet hände det väldigt mycket musikaliskt. Både bra och dåligt. Det var en levande musikkulturperiod. Körberg säger att han försöker att inte lägga sig i arbetet med filmen, men erkänner att det kan bli svårt. – Jag vill inte lägga mig i, men jag kommer att göra det om jag fortfarande kommer ihåg nåt som är värt att spela upp, säger han med ett skratt. Har redan en favorit  På frågan vem han helst ser i rollen som den unge Tommy kommer svaret direkt. – Det första jag tänkte var Benjamin Ingrosso. Han förklarar också varför valet föll på just Ingrosso. – Vi har fått en väldigt fin relation. Jag är hans reservpappa här hemma. ”Musiken måste vara med” Filmen ska regisseras av Lena Rehnberg, som tidigare gjort filmerna om Monica Zetterlund och Ted Gärdestad. Vad som är viktigast att fånga i berättelsen är Tommy Körberg däremot helt säker på. – Musiken. Mitt musikaliska väsen. Samtidigt hoppas han att både de stormiga åren och humorn får ta plats på vita duken. Själv tänker han försöka hålla sig i bakgrunden, även om han redan skämtat om att dyka upp mitt i filmen. – Jag föreslog att jag skulle vara med och kommentera vissa scener. Att komma in och säga: ”Ett ögonblick. Det var lite värre än så.”", "link": "https://www.tv4.se/artikel/6x7Or6u9bsbfANd68ji9Oa/tommy-koerberg-vill-se-benjamin-ingrosso-i-rollen-som-sig-sjaelv", "date_display": "2026-07-02", "date_iso": "2026-07-02T09:46:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/personer/tommy-korberg", "/personer/benjamin-ingrosso", "/svensk-film", "/musiker", "/artist", "/sommargasten"]}, {"id": 148, "title": "Sweden provides SEK 25 million to earthquake-stricken Venezuela", "summary": "The two earthquakes in Venezuela on 24 June have had a profound impact on the Venezuelan people and exacerbated an already difficult humanitarian situation. Sweden is now providing SEK 25 million in humanitarian assistance to Venezuela to support initiatives such as the distribution of food packages, access to clean water, temporary emergency shelter, protection of vulnerable groups and reunification of children and families who have been separated.", "title_original": "Sweden provides SEK 25 million to earthquake-stricken Venezuela", "summary_original": "The two earthquakes in Venezuela on 24 June have had a profound impact on the Venezuelan people and exacerbated an already difficult humanitarian situation. Sweden is now providing SEK 25 million in humanitarian assistance to Venezuela to support initiatives such as the distribution of food packages, access to clean water, temporary emergency shelter, protection of vulnerable groups and reunification of children and families who have been separated.", "link": "https://www.government.se/press-releases/2026/07/sweden-provides-sek-25-million-to-earthquake-stricken-venezuela/", "date_display": "2026-07-02", "date_iso": "2026-07-02T09:14:12+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Foreign and security policy", "Jakob Forssmed", "Benjamin Dousa"]}, {"id": 149, "title": "Convicted of honor killing - stabbed Fahima to death when she wanted a divorce", "summary": "The knife attack happened on the evening of November 3 last year. The 63-year-old man appeared, in only underpants, at a terraced house in Västerås that his wife Fahima was in. Armed with a knife, he attacked her and stabbed her several times in the upper body. Fahima bled to death. When the 25-year-old son tried to intervene and stop the violence, the 63-year-old attacked him as well. He was seriously stabbed but survived. Wanted a divorce The murder, which the 63-year-old committed in order to maintain his honor, according to the prosecutor, was the end of over ten years of honor-related crimes in the family. Documents from the social services show that Fahima was tightly controlled by her husband. Among other things, he ruled and persecuted her. Fahima had reported him several times for violence and earlier in 2025 he was released from a prison sentence after assaulting her. There were also a number of reports of concern that the children were in a context of honor and were subjected to physical and mental abuse by the 63-year-old. When the murder took place, Fahima had filed for divorce a few months earlier and the man had obtained a restraining order against her. \"Special recklessness\" On Thursday, the 63-year-old was sentenced by Västmanland district court to life imprisonment for murder and serious assault. The court notes that there was partly an honorable motive. - There are many aggravating circumstances surrounding the murder. The murder has been committed against a close relative in connection with her residence. It has emerged that the man was strongly controlling in the relationship with the woman and it is clear that the act was motivated by the fact that the man could not accept that the woman no longer wanted to live with him. The murder also took place in the presence of two of the joint children. The murder has thus been marked by such special recklessness that the penalty must be life imprisonment, says councilor Sakari Alander in a press release. The man was acquitted of grossly unlawful threats against the daughter who witnessed the murder, two counts of ev", "title_original": "Döms för hedersmord – högg ihjäl Fahima när hon ville skiljas", "summary_original": "Knivattacken skedde på kvällen den 3 november förra året. Den 63-årige mannen dök upp, i enbart kalsonger, vid ett radhus i Västerås som hustrun Fahima befann sig i. Beväpnad med en kniv gick han till attack mot henne och högg henne flera gånger i överkroppen. Fahima förblödde till döds. När sonen i 25-årsåldern försökte gå emellan och avbryta våldet gick 63-årinngen till attack mot honom också. Han knivskadades allvarligt men överlevde. Ville skiljas Mordet, som 63-åringen enligt åklagaren begick för upprätthålla sin heder, var slutet av över tio års hedersrelaterade brott i familjen. Handlingar från socialtjänsten visar att Fahima varit hårt kontrollerad av maken. Han bland annat styrde och förföljde henne. Fahima hade flera gånger anmält honom för våld och tidigare under 2025 släpptes han från ett fängelsestraff efter att ha misshandlat henne. Det fanns även en rad orosanmälningar om att barnen befann sig i en hederskontext och utsattes för fysisk och psykisk misshandel av 63-åringen. När mordet skedde hade Fahima några månader tidigare ansökt om skilsmässa och mannen hade fått ett kontaktförbud mot henne. ”Särskild hänsynslöshet” På torsdagen dömdes 63-åringen av Västmanlands tingsrätt till livstids fängelse för mord och grov misshandel. Domstolen konstaterar att det delvis fanns ett hedersmotiv. – Det finns många försvårande omständigheter runt mordet. Mordet har förövats mot en nära anhörig i anslutning till hennes bostad. Det har framkommit att mannen varit starkt kontrollerande i relationen med kvinnan och det är uppenbart att gärningen motiverats av att mannen inte kunde acceptera att kvinnan inte längre ville leva med honom. Mordet har också skett i närvaro av två av de gemensamma barnen. Mordet har därmed präglats av en sådan särskild hänsynslöshet som medför att påföljden ska bestämmas till livstids fängelse, säger rådmannen Sakari Alander i ett pressmeddelande. Mannen frikändes från grovt olaga hot mot dottern som blev vittne till mordet, två fall av överträdelse av kontaktförbud och ett tidigare hot samt ofredande mot Fahima.   Han ska betala skadestånd till de sex efterlevande gemensamma barnen på totalt drygt 900 000 kronor. 63-åringen har nekat till brott. Fotnot: Fahimas familj har godkänt att TV4 Nyheterna publiceras hennes förnamn och bild.", "link": "https://www.tv4.se/artikel/7hrN1eTHad5eDDT9KA7CxC/doems-foer-hedersmordet-pa-frun", "date_display": "2026-07-02", "date_iso": "2026-07-02T09:02:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/vasteras", "/mord", "/brott", "/hedersvald"]}, {"id": 150, "title": "The expert: Russian \"terror bombing\" is a sign of weakness", "summary": "The military expert on the new attacks on Kyiv", "title_original": "Experten: Rysk ”terrorbombning” är ett tecken på svaghet", "summary_original": "Militärexperten om nya attackerna mot Kiev", "link": "https://www.tv4.se/artikel/aNWHOq1duRd1Fuabw9Tt2/anklagar-ryssland-foer-terrorbombning", "date_display": "2026-07-02", "date_iso": "2026-07-02T08:38:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 151, "title": "Drunk electric scooter riders behind the death toll", "summary": "Electric vehicle accidents are on the rise in Sweden, last year by as much as 38 percent compared to the year before, according to recent statistics from the Swedish Transport Agency. In 2025, 7 people died and more than 6,600 were injured in accidents involving electric scooters. Now, researchers at Chalmers in Gothenburg and at the Swedish Transport Administration have analyzed all 204 fatal accidents involving e-scooters, e-bikes and regular bicycles in Sweden between 2016 and 2024. The e-scooters stand out both in terms of drivers and accident patterns. It may seem like we are comparing vehicles. But in practice we are comparing people. There are different populations and different uses of the vehicles, says Marco Dozza, who is professor of active safety and road user behavior at Chalmers. Private scooters Some of the results are relatively expected, he notes. This applies, for example, to the fact that the use of helmets among those who died was very low, regardless of vehicle type. A little more unexpected, however, was that the fatal accidents with electric scooters stand out in terms of the percentage of drivers under the influence of alcohol. In addition, it turned out that most of the fatal accidents occurred with privately owned e-scooters - while the public debate was largely about the rental e-scooters. Since there are so many that are rented out, we thought that the statistics would show that more people die on a rented electric scooter. But it was the other way around, says Marco Dozza. Lack of standards In order to reverse the trend, more regulation is not needed in the first place, he believes. Instead, it is about changing the approach to the electric scooter as a vehicle. Today, there are few established social norms around electric scooters, as they are still relatively new. They are therefore often perceived more as toys than as real vehicles, he says. But I think we need to start looking at e-scooters the same way we look at bicycles. For example, parents teaching their children to ride an electric scooter and making sure they wear a helmet, even when riding an electric scooter.", "title_original": "Berusade elsparkcyklister bakom dödssiffrorna", "summary_original": "Elsparkolyckorna ökar kraftigt i Sverige, i fjol med hela 38 procent jämfört med året innan enligt färsk statistik från Transportstyrelsen. Under 2025 omkom 7 personer och drygt 6 600 skadades i olyckor med elsparkcykel. Nu har forskare vid Chalmers i Göteborg och vid Trafikverket analyserat samtliga 204 dödsolyckor med elsparkcyklar, elcyklar och vanlig cykel i Sverige mellan 2016 och 2024. Elsparkcyklarna sticker ut både när det gäller förarna och olycksmönstren. Det kan verka som att vi jämför fordon. Men i praktiken är det människor vi jämför. Det är olika populationer och olika användning av fordonen, säger Marco Dozza, som är professor i aktiv säkerhet och trafikantbeteende vid Chalmers. Privata sparkcyklar En del av resultaten är relativt väntade, konstaterar han. Det gäller exempelvis att hjälmanvändningen bland de omkomna var väldigt låg, oavsett fordonstyp. Lite mer oväntat var dock att dödsolyckorna med elsparkcykel sticker ut när det gäller andelen alkoholpåverkade förare. Dessutom visade det sig att de flesta dödsolyckorna skett med privatägda elsparkcyklar – medan den offentliga debatten till stor del handlat om hyrsparkcyklarna. Eftersom det finns så många som hyrs ut trodde vi att statistiken skulle visa att fler dör på en hyrd elsparkcykel. Men det var tvärtom, säger Marco Dozza. Saknar normer För att vända utvecklingen behövs i första hand inte mer reglering, tror han. I stället handlar det om att ändra inställningen till elsparkcykeln som fordon. I dag finns det få etablerade sociala normer kring elsparkcyklar, eftersom de fortfarande är relativt nya. De uppfattas därför ofta mer som leksaker än som riktiga fordon, säger han. Men jag tror att vi måste börja se på elsparkcyklar på samma sätt som vi ser på cyklar. Till exempel att föräldrar lär sina barn att köra elsparkcykel och ser till att de har hjälm, även när de kör elsparkcykel.", "link": "https://www.tv4.se/artikel/tt-260702-elsparkcyklar1-b8d2dfb5/berusade-elsparkcyklister-bakom-dodssiffrorna", "date_display": "2026-07-02", "date_iso": "2026-07-02T05:44:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Trafikverket", "/trafikverket", "/goteborg", "/sverige", "/transportstyrelsen", "/inrikes", "/elsparkcyklar"]}, {"id": 152, "title": "One dead in shooting - man with suspected murder weapon arrested", "summary": "Late on Wednesday evening, a 35-year-old man was found with a serious gunshot wound in the Västra hamnen area of ​​Malmö. \n\nThe alarm came in to the police at 11 p.m. - We received several calls shortly before midnight from residents in Västra hamnen where loud bangs have been heard, presumably gunfire. The patrol is on the scene in Västra hamnen quite shortly after that and then they find a man with a gunshot wound, says Nils Norling, spokesperson for the police in Malmö. The police patrol that first arrived at the scene drove the man to hospital, but the man's life could not be saved. He was pronounced dead shortly after arrival. According to information, the man was shot in the head. A man in his 30s was arrested in a car nearby. He is now arrested on suspicion of murder. The car has been impounded for further investigation. - A while after this man has been taken to the hospital, a car is stopped for a check, also in Västra hamnen. In this car there is a man in his thirties who is arrested. An initial interrogation was held with him during the night and after that he was arrested and he is suspected of murder and aggravated weapons offences, says Nils Norling. At the time of the arrest, the man must have had the suspected murder weapon on him, according to information given to TV4 Nyheterna. \"Most investigation measures carried out in areas that have been cordoned off, including technical examination and witness interviews\", the police write on their website. The incident is being investigated as a murder.", "title_original": "En död i skottlossning – man med misstänkt mordvapen gripen", "summary_original": "Sent på onsdagskvällen hittades en man i 35-årsåldern svårt skottskadad i området Västra hamnen i Malmö. \n\nLarmet kom in till polisen vid 23-tiden. – Vi fick flertal samtal strax innan midnatt från boende i Västra hamnen där man har hört höga smällar, förmodat skottlossning. Patrull är ganska kort efter det på plats i Västra hamnen och då anträffar man en skottskadad man, säger Nils Norling, presstalesperson på polisen i Malmö. Polispatrullen som först kom till platsen körde mannen till sjukhus, men mannens liv gick inte att rädda. Han dödförklarades strax efter ankomst. Enligt uppgifter sköts mannen i huvudet. En man i 30-årsåldern kunde gripas i en bil i närheten. Han är nu anhållen misstänkt för mord. Bilen är tagen i beslag för vidare undersökning. – En stund efter att den här mannen har förts in till sjukhuset så stoppas en bil för kontroll, också det i Västra hamnen. I den här bilen så finns det en man i trettioårsåldern som grips. Det har hållits ett inledande förhör med honom under natten och efter det så har han anhållits och han är misstänkt för mord och grovt vapenbrott, säger Nils Norling. Vid gripandet ska mannen ha haft det misstänkta mordvapnet på sig, enligt uppgifter till TV4 Nyheterna. ”Flertal utredningsåtgärder utförda i områden som avspärrats, bland annat teknisk undersökning och vittnesförhör” , skriver polisen på sin hemsida. Händelsen utreds som mord.", "link": "https://www.tv4.se/artikel/tt-260702-malmoskott1-743f54f5/dodsskjutning-i-malmo-man-gripen", "date_display": "2026-07-02", "date_iso": "2026-07-02T04:06:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Malmö", "/malmo", "/brott", "/skane", "/sverige", "/inrikes", "/brott-och-straff"]}, {"id": 153, "title": "What does \"worth protecting\" mean if not worth protecting, KD?", "summary": "We don't just say that the right to life should be written into the constitution - we also mean it, and we therefore want abortion to be banned, writes the Christian Values ​​Party in a response.", "title_original": "Vad betyder ”skyddsvärd” om inte värd att skydda, KD?", "summary_original": "Vi säger inte bara att rätten till liv ska skrivas in i grundlagen – vi menar det också, och vi vill följaktligen att abort förbjuds, skriver Kristna värdepartiet i en replik.", "link": "https://www.dagen.se/debatt/vad-betyder-skyddsvaerd-om-inte-vaerd-att-skydda-kd/10402264", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Nya trossamfundet was denied a grant - appeals to the administrative court", "summary": "The Nordic Lutheran denomination: \"Of course we will appeal\"", "title_original": "Nya trossamfundet nekades bidrag – överklagar till förvaltningsrätten", "summary_original": "Nordiska lutherska trossamfundet: ”Självklart kommer vi att överklaga”", "link": "https://www.dagen.se/nyheter/nya-trossamfundet-nekades-bidrag-oeverklagar-till-foervaltningsraetten/10420869", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "What is considered \"Christian politics\" varies in different contexts", "summary": "For me as a politician, it is not faith that is the basis for argumentation in political matters, but our Christian democratic ideology, writes Jonas Segersam (KD).", "title_original": "Vad som anses vara ”kristen politik” växlar i olika kontexter", "summary_original": "För mig som politiker är det inte tron som är grund för argumentationen i politiska frågor utan vår kristdemokratiska ideologi, skriver Jonas Segersam (KD).", "link": "https://www.dagen.se/debatt/vad-som-anses-vara-kristen-politik-vaexlar-i-olika-kontexter/10415011", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Earth's disasters do not wait for the next term", "summary": "Esther Flores Sedman: It costs too much not to act preventively", "title_original": "Jordens katastrofer väntar inte på nästa mandatperiod", "summary_original": "Esther Flores Sedman: Det kostar för mycket att inte agera förebyggande", "link": "https://www.dagen.se/ledare/jordens-katastrofer-vaentar-inte-pa-naesta-mandatperiod/10413286", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Tomas Sjödin publishes a book in the USA", "summary": "\"I have left a year ahead completely blank for this,\" says the author and pastor.", "title_original": "Tomas Sjödin ger ut bok i USA", "summary_original": "”Jag har lämnat ett år framåt helt blankt för detta”, säger författaren och pastorn.", "link": "https://www.dagen.se/kultur/tomas-sjoedin-ger-ut-bok-i-usa/10423314", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "After 20 years, Jörgen Fahlstedt is doing his last week as Lappis general", "summary": "\"God processed me and said are you going to step into the game, or just have a lot of opinions.\"", "title_original": "Efter 20 år gör Jörgen Fahlstedt sin sista vecka som Lappisgeneral", "summary_original": "”Gud bearbetade mig och sa att ska du kliva in i matchen, eller bara ha en massa åsikter.”", "link": "https://www.dagen.se/nyheter/efter-20-ar-goer-joergen-fahlstedt-sin-sista-vecka-som-lappisgeneral/10422097", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "JO criticizes preschool for pride parade - advises against \"similar activities\"", "summary": "Guardians who registered for municipal preschool were right.", "title_original": "JO kritiserar förskola för pridetåg – avråder från ”liknande aktiviteter”", "summary_original": "Vårdnadshavare som anmälde kommunal förskola fick rätt.", "link": "https://www.dagen.se/nyheter/jo-kritiserar-foerskola-foer-pridetag-avrader-fran-liknande-aktiviteter/10422689", "date_display": "2026-07-02", "date_iso": "2026-07-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Forest fires continue in southern France", "summary": "During Friday, the extinguishing work of the many forest fires that have spread in France continues. Thousands of people are evacuated.", "title_original": "Fortsatta skogsbränder i södra Frankrike", "summary_original": "Under fredagen fortsätter släckningsarbetet av de många skogsbränder som spridit sig i Frankrike. Tusentals människor är evakuerade.", "link": "https://www.svd.se/a/5pR5LO/jattebrand-rasar-i-sodra-frankrike", "date_display": "2026-07-02", "date_iso": "2026-07-02T01:44:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Världen"]}, {"id": 161, "title": "At least thirteen dead: \"Kyiv is under furious attack\"", "summary": "New Russian attacks on Kyiv", "title_original": "Minst tretton döda: ”Kiev är under rasande attack”", "summary_original": "Nya ryska angrepp mot Kiev", "link": "https://www.tv4.se/artikel/tt-260702-ukrainaoro1-ca779f5b/omfattande-ryska-attacker-mot-ukraina", "date_display": "2026-07-01", "date_iso": "2026-07-01T23:23:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 162, "title": "Woman and child seriously injured in big family fight in Malmö", "summary": "The alarm came at 19:18. Two families had gotten into a fight at Limhamn in Malmö.  - We do not know the background to the quarrel. It is very messy and we are not yet ready at the scene, says police spokesperson Leif Fransson at around 9:30 p.m. It is unclear how many people were involved on each side of the family, but the police state that it is about ten. At least five people have been injured by various incidents and taken to hospital. A boy under the age of 18 and a woman aged 45 are seriously injured, according to Region Skåne. Man suspected of attempted murder Two people are currently suspected of crime, a man and a woman. - The man is suspected of attempted murder, the woman's criminal classification is still unclear, says Leif Fransson. The police cordoned off an area and will carry out a technical investigation. - We will be looking for various accoutrements that have been thrown away after the fight, says Fransson without wanting to go into what type of object it is. The police also have a number of patrols on site at the hospital to prevent the conflict from flaring up there.", "title_original": "Kvinna och barn allvarligt skadade i stort familjebråk i Malmö", "summary_original": "Larmet kom klockan 19.18. Två familjer hade hamnat i bråk på Limhamn i Malmö.  – Bakgrunden till bråket vet vi inte. Det är väldigt rörigt och vi är ännu inte klara på platsen, säger polisens presstalesperson Leif Fransson vid 21.30-tiden. Det är oklart hur många personer som varit inblandade på respektive familjesida, men polisen uppger att det handlar om ett tiotal. Åtminstone fem personer har skadats av olika tillhyggen och förts till sjukhus. En pojke under 18 år och en kvinna i 45-årsåldern är allvarligt skadade, uppger Region Skåne. Man misstänkt för mordförsök I nuläget är två personer misstänkta för brott, en man och en kvinna. – Mannen misstänks för försök till mord, kvinnans brottsrubricering är ännu oklar, säger Leif Fransson. Polisen spärrade av ett område och ska genomföra en teknisk undersökning. – Vi kommer att leta efter olika tillhyggen som har kastats iväg efter bråket, säger Fransson utan att vilja gå in på vad för typ av föremål det handlar om. Polisen har även ett antal patruller på plats vid sjukhuset för att förhindra att konflikten blossar upp där.", "link": "https://www.tv4.se/artikel/4PMAxPNMbDVqi7xMWCkpGU/kvinna-och-barn-allvarligt-skadade-i-stort-familjebrak-i-malmoe", "date_display": "2026-07-01", "date_iso": "2026-07-01T20:31:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/malmo"]}, {"id": 163, "title": "The common garden plant keeps mosquitoes away this summer", "summary": "You get the best effect if you mash the common garden plant before spreading it around you. But it's not because the leaves smell bad that mosquitoes run away. According to Marcus Stensmyr, docent in biology at Lund University, substances in the catnip activate pain receptors in mosquitoes that are normally triggered by high temperatures.  - So when mosquitoes come near catnip, they probably experience severe pain, he tells TV4 Nyheterna. If you want to use catnip as a mosquito repellent, it can be smart to plant it in a pot or in a flower bed where it will not take over, as it can spread quickly. - If you don't have it at home, a neighbor probably has it, he says. More plants can keep mosquitoes away Catnip is not the only plant that can repel mosquitoes. Several aromatic herbs can also help, such as basil, rosemary, lemon balm and lavender. - Lemon balm probably works somewhat in the same way, that it also activates pain receptors like this, says Marcus Stensmyr. He advises growing several varieties near the patio and placing pots on the table when you sit and eat. - Not adequate protection, as if you had a lot of mosquito repellent, but it helps. Catnip also attracts a lot of bumblebees and butterflies. - It looks nice, you can eat it and it also keeps away mosquitoes and gnats and other things. That's why it's called catmint. The name comes from the fact that some cats react strongly when they come into contact with the plant. According to Marcus Stensmyr, the effect can be extra strong in sexually mature cats. - It can produce some kind of very strange, almost narcotic and erotic effect. It lasts about a quarter of an hour, maybe 20 minutes, and then it's over, he says.\n\nExactly why cats like catnip is still unclear. But it is known that fleas, ticks and other things that the cat does not want on it can be scared away by the smell.\n\n- There have been suggestions that cats like it precisely because they rub themselves in catnip and thus use it as a mosquito repellent.", "title_original": "Vanliga trädgårdsväxten håller myggen borta i sommar", "summary_original": "Bäst effekt får du om du mosar den vanliga trädgårdsväxten innan du sprider den runt dig. Men det är inte för att bladen luktar illa som myggen flyr. Enligt Marcus Stensmyr, docent i biologi vid Lunds universitet, aktiverar ämnen i kattmyntan smärtreceptorer hos mygg som normalt triggas av hög temperatur.  – Så när myggen kommer i närheten av kattmynta så upplever de kraftig smärta förmodligen, säger han till TV4 Nyheterna. Vill du använda kattmynta som myggmedel kan det vara smart att plantera den i kruka eller i en rabatt där den inte tar över, eftersom den kan sprida sig snabbt. – Har du inte den hemma är det säkert någon granne som har det, säger han. Fler växter kan hålla myggen borta Kattmynta är inte den enda växten som kan stöta bort mygg. Även flera aromatiska kryddväxter kan hjälpa, som basilika, rosmarin, citronmeliss och lavendel. – Citronmeliss fungerar nog lite grann på samma sätt, att den också aktiverar sådana här smärtreceptorer, säger Marcus Stensmyr. Han tipsar om att odla flera sorter i närheten av uteplatsen och att ställa krukor på bordet när man sitter och äter. – Inte ett fullgott skydd, som om man skulle ha jättemycket myggmedel, men det hjälper. Kattmyntan lockar även till sig mycket humlor och fjärilar. – Det ser trevligt ut, man kan äta det och dessutom håller det undan mygg och knott och annat. Därför heter det kattmynta Namnet kommer av att vissa katter reagerar starkt när de kommer i kontakt med växten. Enligt Marcus Stensmyr kan effekten bli extra stark på könsmogna katter. – Det kan ge någon sorts jättekonstig, nästan narkotisk och erotisk effekt. Det varar ungefär en kvart, kanske 20 minuter, och sen går det över, säger han.\n\nExakt varför katter gillar kattmynta är fortfarande oklart. Men man vet att loppor, fästingar och annat som katten inte vill ha på sig kan skrämmas bort av lukten.\n\n– Det har funnits förslag om att katter gillar den just för att de gnider in sig i kattmynta och på så sätt använder den som myggmedel.", "link": "https://www.tv4.se/artikel/635fasz7VVonbxz4eNc65J/vanliga-traedgardsvaexten-haller-myggen-borta-i-sommar", "date_display": "2026-07-01", "date_iso": "2026-07-01T18:34:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/hem-och-hushall", "/husdjur", "/tradgard", "/halsa", "/sommar", "/insekter", "/mygg", "/myggbett"]}, {"id": 164, "title": "So much more you have to pay when you shop from Temu and Shein", "summary": "As of July 1, 2026, the duty-free status for so-called low-value shipments will be abolished. This means that a fee of three euros (about SEK 33) is charged for packages with a value of EUR 150 (about SEK 1,600) or less that are sent to private individuals from countries outside the EU. The aim is to slow the inflow of goods from low-cost giants from China such as Shein and Temu which have contributed to large quantities of substandard products entering the Union. According to the Swedish Customs Administration, the new customs fee should also contribute to more healthy competition for companies within the EU. Swedish Trade: the right direction Martin Kits, head of business policy and opinion formation at Swedish Trade, thinks the new customs duty is a step in the right direction.  In an email reply to TV4 Nyheterna, he writes that unfair competition is reduced when low-priced products from third countries can no longer be sold without duty and VAT. \"But the new customs fee does not solve the main problem\". \"We want the online marketplaces to take responsibility for their products before they reach the market, and they don't do that today. We want to see that Temu and Shein take the same responsibility for their products as Swedish trading companies do\". \"Should have been significantly higher\" Now Martin Kits hopes that more Swedish consumers will choose to shop from trading companies that sell approved products, even if it is not his role to say where people should put their money. \"But we unfortunately believe that the customs fee would have had to be significantly higher for us to see a tangible difference,\" he writes. According to him, it is too early to say what impact the new customs fee may have from a climate perspective. \"But in general, you can say that ultra fast fashion products, like those sold at Temu and Shein, are of course not good for the climate. In 2024, information came that 88 full Boeing planes with goods from Temu and Shein took off every day. It would not surprise me if there are even more today,\" he writes.", "title_original": "Så mycket mer måste du betala när du handlar från Temu och Shein", "summary_original": "Från och med den 1 juli 2026 slopas tullfriheten för så kallade lågvärdeförsändelser. Det innebär att en avgift på tre euro (cirka 33 kronor) tas ut för paket med ett värde på 150 euro (cirka 1 600 kronor) eller mindre som skickas till privatpersoner från länder utanför EU. Syftet är att bromsa inflödet av varor från lågprisjättar från Kina som Shein och Temu som har bidragit till att stora mängder produkter som inte uppfyller säkerhetskraven tagit sig in i unionen. Enligt Tullverket ska den nya tullavgiften också bidra till en mer sund konkurrens för företag inom EU. Svensk Handel: rätt riktning Martin Kits, chef för näringspolitik och opinionsbildning på Svensk Handel, tycker att den nya tullavgiften är ett steg i rätt riktning.  I ett mejlsvar till TV4 Nyheterna skriver han att den orättvisa konkurrensen minskar när lågprisprodukter från tredje land inte längre kan säljas utan tull och moms. ”Men den nya tullavgiften löser inte huvudproblemet”. ”Vi vill att onlinemarknadsplatserna ska ta ansvar för sina produkter innan dess att de når marknaden, och det gör de inte idag. Vi vill se att Temu och Shein tar samma ansvar för sina produkter som svenska handelsföretag gör”. ”Hade behövt vara betydligt högre” Nu hoppas Martin Kits att fler svenska konsumenter väljer att handla från handelsföretag som säljer godkända produkter, även om det inte är hans roll att säga var folk ska lägga sina pengar. ”Men vi tror tyvärr att tullavgiften hade behövt vara betydligt högre för att vi skulle se en påtaglig skillnad”, skriver han. Vilken påverkan den nya tullavgiften kan få ur ett klimatperspektiv är enligt honom för tidigt att säga. ”Men generellt kan man säga att ultra fast fashion-produkter, likt de som säljs på Temu och Shein, givetvis inte är bra för klimatet. 2024 kom information om att 88 fulla Boeingplan med varor från Temu och Shein lyfte varje dag. Det skulle inte förvåna mig om det är ännu fler i dag”, skriver han.", "link": "https://www.tv4.se/artikel/6lt7Zc0I1UlBi9AuLXltGJ/sa-mycket-mer-maste-du-betala-naer-du-handlar-fran-temu-och-shein", "date_display": "2026-07-01", "date_iso": "2026-07-01T18:21:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age
