to lower taxes is to reduce their costs. Now the government plans to do the opposite.", "title_original": "Ledare: Regeringen sänker skatten med ena handen – och bidrar till höjningar med den andra", "summary_original": "Ett bra sätt att få kommunerna att sänka skatten är att minska deras kostnader. Nu planerar regeringen att göra tvärtom.", "link": "https://www.dn.se/ledare/regeringen-sanker-skatten-med-ena-handen-och-bidrar-till-hojningar-med-den-andra/", "date_display": "2026-03-10", "date_iso": "2026-03-10T18:19:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Black rain in Iran: \"Inhaling the smoke is the worst\"", "summary": "Tehran woke to thick, black smoke as several oil depots caught fire. Even when the fire is out, the health effects can be numerous – and deadly.", "title_original": "Svart regn i Iran: &quot;Andas in röken är det värsta”", "summary_original": "Teheran vaknade till tjock, svart rök när flera oljedepåer stod i brand. Även när elden slocknat kan hälsoeffekterna vara många – och dödliga.", "link": "https://www.svd.se/a/XMjbdm/svart-regn-i-iran-andas-in-roken-ar-det-varsta", "date_display": "2026-03-10", "date_iso": "2026-03-10T18:14:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 123, "title": "Isobel Hadley-Kamptz: No, withdrawing the Palestinian writer's scholarship is not a threat to freedom of expression", "summary": "The municipality of Lund has canceled a scholarship to a persecuted Palestinian writer after revelations that she praised the terrorist act on October 7, 2024. Her freedom of expression, however, remains.", "title_original": "Isobel Hadley-Kamptz: Nej, att dra in den palestinska författarens stipendium är inget hot mot yttrandefriheten", "summary_original": "Lunds kommun har avbrutit ett stipendium till en förföljd palestinsk författare efter avslöjanden att hon hyllat terrordådet den 7 oktober 2024. Hennes yttrandefrihet däremot, den består.", "link": "https://www.dn.se/ledare/isobel-hadley-kamptz-nej-att-dra-in-den-palestinska-forfattarens-stipendium-ar-inget-hot-mot/", "date_display": "2026-03-10", "date_iso": "2026-03-10T18:08:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Ukraine's para-snowboarder: \"I don't really have the right discipline for elite sports\"", "summary": "KIEV. Ukraine is one of the world's leading Paralympic countries. But para-snowboarding is a new-age sport - and Vladyslav Chiltchenko's participation is a bit of a coincidence. On Saturday he starts in the banked slalom. It could be his last start in the Paralympics – elite sports are not for everyone.", "title_original": "Ukrainas para-snowboardåkare: ”Jag har egentligen inte rätta disciplinen för elitidrott”", "summary_original": "KIEV. Ukraina är ett av världens främsta paralympiska länder. Men para-snowboardåkning är en nygammal gren – och att Vladyslav Chiltjenko deltar är lite av en tillfällighet. På lördag startar han i banked slalom. Det kan bli hans sista start i Paralympics – elitidrott är inte för alla.", "link": "https://www.dn.se/sport/ukrainas-para-snowboardakare-jag-har-egentligen-inte-ratta-disciplinen-for-elitidrott/", "date_display": "2026-03-10", "date_iso": "2026-03-10T18:03:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Lebohang Kganye: \"Grandma's story showed that even the whites practiced sorcery\"", "summary": "Mermaids, voracious rats and mysterious street sweepers take place when the South African artist Lebohang Kganye exhibits at Fotografiska in Stockholm. In the exhibition, she examines her country's history through childhood myths. - Nelson Mandela's story aroused the admiration of the world. But have the dreams been fulfilled?", "title_original": "Lebohang Kganye: ”Mormors berättelse visade att även de vita sysslade med trollkonst”", "summary_original": "Sjöjungfrur, glupska råttor och mystiska gatsopare tar plats när den sydafrikanska konstnären Lebohang Kganye ställer ut på Fotografiska i Stockholm. I utställningen undersöker hon sitt lands historia genom barndomens myter. – Nelson Mandelas historia väckte världens beundran. Men har drömmarna blivit uppfyllda?", "link": "https://www.dn.se/kultur/lebohang-kganye-mormors-berattelse-visade-att-aven-de-vita-sysslade-med-trollkonst/", "date_display": "2026-03-10", "date_iso": "2026-03-10T18:03:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "New study shows: Busy people make you age prematurely", "summary": "We already know that processed food, smoking and sunbathing are things that make us biologically age prematurely, but now we can add troublesome people to the list. - People don't know that you are a difficult person. On the other hand, a difficult person is often a person who has poor fingertip sense, says Isabella Löwengrip, common sense and etiquette expert and entrepreneur, in Efter fem.  American researchers who analyzed data from more than 2,300 people in the United States. It turned out that the biological age among those who had at least one troublesome person in their vicinity was on average 9 months higher than those who do not have troublesome coworkers or family members.  It makes people annoying The stress over annoying people makes us age almost a year.  - It is perhaps not surprising, says Isabella Löwengrip.  She believes that most people have people around you who you perceive as troublesome and that it is good to have people around you who are honest and tell you that.  - I would say that a very simple thing that causes you to be perceived as difficult is when you only talk about yourself. They don't ask questions but it's an hour and a half just about this person. So I think you can actually reflect on, \"am I a person who asks questions?\" This is how you can handle troublesome people It is important to handle troublesome people in a neat way, says Isabella Löwengrip.  - It's not like you should say \"you're such a pain to hang out with\", but on the other hand you actually have the right to take care of your own energy.  She advises that you can say \"you know, I don't have much time to talk about this right now\", \"I think this topic is a bit heavy\" or \"I think you are kneading a bit too much.\"  You can also help steer the conversations and say \"I want to hear a little more about this person's new job now.\"", "title_original": "Ny studie visar: Jobbiga personer gör att du åldras i förtid", "summary_original": "Sedan tidigare vet vi att processad mat, rökning och solande är saker som får oss att åldras biologiskt i förtid, men nu kan vi alltså lägga till jobbiga personer på listan. – Människor vet ju inte om att man är en jobbig person. Däremot, en jobbig person är ofta en person som har dålig fingertoppskänsla, säger Isabella Löwengrip, vett- och etikettexpert och entreprenör, i Efter fem.  Amerikanska forskare som analyserat data från mer än 2 300 personer i USA. Det visade sig att den biologiska åldern bland de som hade minst en jobbig person i sin närhet var i snitt 9 månader högre än de som inte har besvärliga arbetskamrater eller familjemedlemmar.  Det gör människor jobbiga Stressen över jobbiga människor får oss alltså att åldras nästan ett år.  – Det är inte överraskande kanske, säger Isabella Löwengrip.  Hon menar att de flesta har människor runt omkring en som man uppfattar som jobbiga och att det är bra att ha människor runt en som är ärliga och berättar det för en.  – Jag skulle säga att en väldigt enkel sak som gör att man uppfattas som jobbig är när man bara pratar om sig själv. De ställer inga frågor utan det är en och en halv timme bara om den här personen. Så det tycker jag man kan faktiskt reflektera över, ”är jag en person som ställer frågor?” Så kan du hantera jobbiga personer Det är viktigt att sköta jobbiga personer på ett snyggt sätt, menar Isabella Löwengrip.  – Det är ju inte så att man ska säga ”du är så jobbig att umgås med”, men däremot har man faktiskt rätt att få ta hand om sin egen energi.  Hon tipsar om att man kan säga ”vet du, jag har inte så mycket tid att prata om just det här nu”, ”det här ämnet tycker jag är lite tungt” eller ”jag tycker du ältar lite för mycket.”  Man kan också vara med och styra samtalen och säga ”jag vill höra lite mer om den här personens nya jobb nu.”", "link": "https://www.tv4.se/artikel/7drGAPQLqlX9f0SrJ0BN32/ny-studie-visar-jobbiga-personer-goer-att-du-aldras-i-foertid", "date_display": "2026-03-10", "date_iso": "2026-03-10T17:47:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/psykologi"]}, {"id": 127, "title": "USA: Has escorted ships through the Strait of Hormuz", "summary": "", "title_original": "USA: Har eskorterat fartyg genom Hormuzsundet", "summary_original": "", "link": "https://www.svd.se/a/y5E6zg/usa-har-eskorterat-fartyg-genom-hormuzsundet", "date_display": "2026-03-10", "date_iso": "2026-03-10T17:35:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 128, "title": "The chief prosecutor's alarm: Too easy to swindle tax money", "summary": "Sweden should put more effort into stopping welfare crimes. It would be a pure business for the government to invest more money in finding and plugging the leaks, says Jonas Svanfeldt, chief prosecutor at the Ecocrime Authority. - It is extremely lucrative to deceive tax funds.", "title_original": "Chefsåklagarens larm: För lätt att lura till sig skattepengar", "summary_original": "Sverige borde lägga mer kraft på att stoppa välfärdsbrott. Det skulle vara en ren vinstaffär för regeringen att satsa mer pengar på att hitta och täppa till läckorna, menar Jonas Svanfeldt, chefsåklagare på Ekobrottsmyndigheten. – Det är oerhört lukrativt att lura till sig skattemedel.", "link": "https://www.dn.se/sverige/chefsaklagarens-larm-for-latt-att-lura-till-sig-skattepengar/", "date_display": "2026-03-10", "date_iso": "2026-03-10T17:31:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "The US gives the green light for Himars to Sweden", "summary": "", "title_original": "USA ger grönt ljus för Himars till Sverige", "summary_original": "", "link": "https://www.svd.se/a/bOmg85/usa-ger-gront-ljus-for-himars-till-sverige", "date_display": "2026-03-10", "date_iso": "2026-03-10T17:25:09+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 130, "title": "Sara Kristoffersson: Is there something special about Mon Amie in particular? Hardly", "summary": "Queuing all night, chaos and pushing, angry and upset coffee customers who didn't make it all the way. Where did this sudden hype around Rörstrand's classic pattern Mon Amie come from?", "title_original": "Sara Kristoffersson: Är det något speciellt med just Mon Amie? Knappast", "summary_original": "Köer hela natten, kaos och knuffar, arga och upprörda kaffekunder som inte nått hela vägen. Varifrån kom denna plötsliga hajp omkring Rörstrands klassiska mönster Mon Amie?", "link": "https://www.dn.se/kultur/sara-kristoffersson-ar-det-nagot-speciellt-med-just-mon-amie-knappast/", "date_display": "2026-03-10", "date_iso": "2026-03-10T17:03:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "The winter sickness is now reaching its peak", "summary": "The winter sickness is currently reaching its peak, according to the Public Health Agency. This year's season also stands out compared to recent years, reports Ekot in Sveriges Radio.", "title_original": "Vinterkräksjukan når nu sin topp", "summary_original": "Vinterkräksjukan når just nu sin topp, enligt Folkhälsomyndigheten. Årets säsong sticker dessutom ut jämfört med senaste åren, rapporterar Ekot i Sveriges Radio.", "link": "https://www.svd.se/a/j0Qll9/nu-nar-vinterkraksjukan-sin-topp", "date_display": "2026-03-10", "date_iso": "2026-03-10T16:54:07+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 132, "title": "Ukraine's new success may hinder Russian spring offensive", "summary": "Ukraine breaks the trend and gains ground in the southern parts of the country. The unexpected advance could hinder Russia's spring offensive and force them to regroup. - This is Ukraine's first major success in a long time, says military analyst Jörgen Elfving.", "title_original": "Ukrainas nya framgång kan hindra rysk våroffensiv", "summary_original": "Ukraina bryter trenden och tar mark i de södra delarna av landet. Den oväntade framfarten kan hindra Rysslands våroffensiv och tvinga dem att omgruppera. – Det här är Ukrainas första stora framgång på länge, säger militäranalytikern Jörgen Elfving.", "link": "https://www.dn.se/varlden/ukrainas-nya-framgang-kan-hindra-rysk-varoffensiv/", "date_display": "2026-03-10", "date_iso": "2026-03-10T16:47:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "The minister on S requirements for maternity care: \"Political theatre\"", "summary": "After the debate where rough cloths at BB in Malmö became a symbolic issue, the Social Democrats demand that the government stop the cut in support for maternity care. The Minister of Health calls S's play \"strong\" political theatre. - It is serious for every single woman who is affected, says Lena Hallengren (S).", "title_original": "Ministern om S-krav på förlossningsvården: ”Politisk teater”", "summary_original": "Efter debatten där sträva torklappar på BB i Malmö blev en symbolfråga kräver Socialdemokraterna att regeringen stoppar nedskärningen av stöd till förlossningsvården. Sjukvårdsministern kallar S utspel för ”magstark” politisk teater. – Det är allvarligt för varje enskild kvinna som drabbas, säger Lena Hallengren (S).", "link": "https://www.dn.se/sverige/ministern-om-s-krav-pa-forlossningsvarden-politisk-teater/", "date_display": "2026-03-10", "date_iso": "2026-03-10T16:40:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "The Folkkära TV4 program returns", "summary": "Last year, \"Let's dance\" returned after being paused for one season - only to be put on hold again. Now the program is back once again, something Expressen was the first to tell. - It is true that it will return. It is gratifying that we can confirm that and that Let's dance will continue dancing this autumn, says Ina Kokalari, communications manager at TV4, to TV4 Nyheterna. \"There will be some new features\" The program, which returned to the channel with several innovations - including a new jury with Eric Saade and Taya Shawki, a new host duo in Pär Lernström and Johanna Nordström and a new concept - was paused this summer with the justification that it was necessary to work further with the format. - We are very satisfied with the reception of the new Let's dance, said Clara Tengbom, executive producer at TV4 at the time. That work is now finished. - We said we would look at the format and there will be some new features. But we will be able to tell you more about that later, says Ina Kokalari.", "title_original": "Folkkära TV4-programmet återvänder", "summary_original": "Förra året återvände ”Let's dance” efter att ha pausats i en säsong – för att sedan läggas på is igen. Nu är programmet tillbaka ännu en gång, något Expressen var först med att berätta. – Det stämmer att det kommer tillbaka. Det är glädjande att vi kan bekräfta det och att Let's dance dansar vidare i höst, säger Ina Kokalari, kommunikationsansvarig på TV4, till TV4 Nyheterna. ”Några nytag kommer det att vara” Programmet, som återvände till kanalen med flera nyheter – bland annat en ny jury med Eric Saade och Taya Shawki, en ny programledarduo i Pär Lernström och Johanna Nordström samt ett nytt koncept – pausades i somras med motiveringen att man behövde arbeta vidare med formatet. – Vi är väldigt nöjda med omtaget av nya Let’s dance, sa Clara Tengbom, exekutiv producent på TV4 då. Nu är det arbetet alltså färdigt. – Vi sa att vi skulle titta på formatet och några nytag kommer det att vara. Men mer om det kommer vi att kunna berätta längre fram, säger Ina Kokalari.", "link": "https://www.tv4.se/artikel/79DO7X1t8pit12TA1mxyOK/folkkaera-tv4-programmet-atervaender", "date_display": "2026-03-10", "date_iso": "2026-03-10T16:04:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/tv4", "/tv4-play", "/lets-dance"]}, {"id": 135, "title": "The long-awaited combination vaccine has been approved: \"Sees only benefits\"", "summary": "The combination vaccine has been tested on 8,000 people who are 50 years of age or older and provided the same protection as if the shots were taken separately. The vaccine is based on the Nobel prize-winning mrRNA technology, which means that it is produced faster than other vaccines, Ekot reports. \"Makes everything easier\" That the vaccine for the two diseases can be combined in one syringe and work equally well is an important development, according to vaccine researcher Matti Sällberg. - I think we will see more of this in the future. If you can push three, four, five vaccines into a syringe, it makes everything easier. I don't think we know yet what the upper limit is for the number of different components in the mRNA vaccine. Benefits pensioners At the moment, the combined vaccine is approved for use by people aged 50 and over. And the 65+ group, who take covid19 and flu vaccines annually, are the ones who will benefit the most, says Matti Sällberg. - It is undeniably the case that it is better to have one visit instead of two visits, especially for the elderly, because it involves transport to the healthcare system. \"Hopefully it will be cheaper\" The EU Commission is expected to approve the vaccine for the European market in May and the manufacturer Moderna hopes for autumn 2027 in Sweden, says the company's Nordic manager Per Öhlén to Ekot. What a possible Swedish price could land on is unclear.  - My hope is that it will be cheaper, says Sällberg.  mRNA vaccines tend to cause a little more of the usual vaccine side effects; fever, feeling \"a little rough\" as well as swelling and tenderness at the injection site, says Sällberg. - But at the moment I can't see any real disadvantage, only advantages.", "title_original": "Efterlängtade kombivaccinet har godkänts: ”Ser bara fördelar”", "summary_original": "Kombinationsvaccinet har testats på 8000 personer som är 50 år eller äldre och gav samma skydd som om sprutorna tagits var för sig. Vaccinet bygger på den Nobelprisade mrRNA-tekniken som gör att det framställas snabbare än andra vaccin, rapporterar Ekot. ”Gör allting enklare” Att vaccinen för de två sjukdomarna kan kombineras i en spruta och fungera lika bra är en viktig utveckling, enligt vaccinforskaren Matti Sällberg. – Jag tror vi kommer se mer av det här i framtiden. Om du kan trycka in tre, fyra, fem vaccin i en spruta gör det allting enklare. Jag tror inte vi vet ännu vad den övre gränsen är för antalet olika komponenter i mRNA-vacicn. Gynnar pensionärer  I nuläget är kombivaccinet godkänt för användning för personer som är 50 år och över. Och gruppen 65+, som tar covid19- och influensavaccin årligen, är den som kommer gynnas mest, säger Matti Sällberg. – Det är onekligen så att det är bättre med ett besök i stället för två besök, särskilt för äldre, eftersom det innebär transport till sjukvården. ”Hoppas det blir billigare” EU-kommissionen väntas godkänna vaccinet för den europeiska marknaden i maj och tillverkaren Moderna hoppas på hösten 2027 i Sverige, säger företagets Nordenchef Per Öhlén till Ekot. Vad ett eventuellt svenskt pris kan landa på är oklart.  – Min förhoppning är att det blir billigare, säger Sällberg.  mRNA-vaccin tenderar att ge lite mer av de vanliga vaccinbiverkningarna; feber, att känn sig ”lite ruggig” samt svullnad och ömhet vid injektionsstället, säger Sällberg. – Men i dagsläget kan jag inte se någon ordentlig nackdel utan bara fördelar.", "link": "https://www.tv4.se/artikel/lmVUWvEnSuuCuFnQXG9A9/efterlaengtade-kombivaccinet-har-godkaents-ser-bara-foerdelar", "date_display": "2026-03-10", "date_iso": "2026-03-10T15:46:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["NyheternaY", "/utrikes", "/vaccin", "/covid-19", "/influensa", "/sjukdomar", "/eu"]}, {"id": 136, "title": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "title_original": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary_original": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/statement-by-ms-nina-larsson-minister-for-gender-equality/", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:54:30+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "today", "tags": ["Speech", "International", "Ministry of Employment", "Gender equality", "Nina Larsson"]}, {"id": 137, "title": "Bodö/Glimt takes Football Europe by storm", "summary": "Bodö/Glimt comes from a town with 43,000 inhabitants north of the Arctic Circle.  This year, the team has knocked out clubs such as Manchester City, Atlético Madrid and Inter.\n\nThe game is described as extremely high pressure play, tight team parts, wingers who constantly challenge, 4-3-3 and not least courage. The success gets a lot of attention - It's incredibly wonderful and Glimt gets an incredible amount of attention and it's well deserved. What we are doing is completely unique and it is great to be a part of it, says Jens Petter Hauge.\n\nThe 28-year-old team captain Patrick Berg joined the club back in 2014:\n\n- Not all dreams you think or believe can come true. I had hoped that we could achieve something big, but what we have done now, no one would have thought we would achieve. But that's what I think is so nice about football and team sports, you can achieve a lot yourself with little means. Veterans gather at Aspmyra 51 years ago Glimt roared for the first time when the club won the Norwegian Cup. The heroes from the cup gold now gather almost daily at the Aspmyra home arena to remember and share impressions from today's successful squad.\n\n- I want to go into the culture in Bodö/Glimt. Glimt has always been known for building teams, building identity, explains veteran Trond Tidemann. - That we, hopefully together with other clubs, go ahead and show that it is possible, I think that is fantastic for Norwegian football, concludes Patrick Berg.", "title_original": "Bodö/Glimt tar Fotbollseuropa med storm", "summary_original": "Bodö/Glimt kommer från en stad med 43 000 invånare norr om polcirkeln.  I år har laget slagit ut klubbar som Manchester City, Atlético Madrid och Inter.\n\nSpelet beskrivs som extremt högt presspel, tajta lagdelar, yttrar som utmanar konstant, 4-3-3 och inte minst mod. Succén får stor uppmärksamhet – Det är otroligt härligt och Glimt får otroligt mycket uppmärksamhet och det är ju välförtjänt. Det är helt unikt det vi håller på med och det är stort att vara en del av, säger Jens Petter Hauge.\n\nDen 28-årige lagkaptenen Patrick Berg kom till klubben redan 2014:\n\n– Det är inte alla drömmar man tänker eller tror kan bli verklighet. Att vi kunde få till nåt stort hade jag hoppats på, men det vi har gjort nu hade ingen trott att vi skulle få till. Men det är det som jag tycker är så fint med fotboll och lagidrott, man kan uppnå mycket själv med små medel. Veteraner samlas på Aspmyra För 51 år sedan skrällde Glimt för första gången när klubben vann norska cupen. Hjältarna från cupguldet samlas numera nästan dagligen på hemmaarenan Aspmyra för att minnas och dela intrycken från dagens succétrupp.\n\n– Jag vill gå in på kulturen i Bodö/Glimt. Glimt har alltid varit känt för att bygga lag, bygga identitet, förklara veteranen Trond Tidemann. – Att vi, förhoppningsvis tillsammans med andra klubbar, går före och visar att det är möjligt, det tror jag är fantastiskt för norsk fotboll, avslutar Patrick Berg.", "link": "https://www.tv4.se/artikel/2Qcn6n451IVHkVbCIvLgxx/bodoe-glimt-tar-fotbollseuropa-med-storm", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:40:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotboll", "/norge", "/champions-league"]}, {"id": 138, "title": "Priest in Lebanon killed in Israeli attack - both Israel and Hezbollah receive criticism", "summary": "Pierre al-Rahi called for peace - but died in an attack the following day.", "title_original": "Präst i Libanon dödad i israelisk attack – både Israel och Hizbollah får kritik", "summary_original": "Pierre al-Rahi uppmanade till fred – men dog i en attack dagen därpå.", "link": "https://www.dagen.se/nyheter/praest-i-libanon-doedad-i-israelisk-attack-bade-israel-och-hizbollah-far-kritik/10243207", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:31:33+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Today's reporter: 'There's a lot of cluster bombs going off near our house'", "summary": "Today's envoy Arne Lapidur on site in Tel Aviv testifies to several impacts near the home.", "title_original": "Dagens reporter: 'Det smäller till rejält av klusterbomber nära vårt hus'", "summary_original": "Dagens utsände Arne Lapidur på plats i Tel Aviv vittnar om flera nedslag nära bostaden.", "link": "https://www.dagen.se/nyheter/dagens-reporter-det-smaeller-till-rejaelt-av-klusterbomber-naera-vart-hus/10244076", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:25:33+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Unusual, but not unique, for Pentecost to step into a local congregation", "summary": "News commentary by reporter Thomas Österberg • That the sitting elders and board of directors in Uppsala are replaced by Pentecost nationally can certainly raise questions", "title_original": "Ovanligt, men inte unikt att Pingst kliver in i lokal församling", "summary_original": "Nyhetskommentar av reporter Thomas Österberg •  Att sittande äldste och styrelse i Uppsala ersätts av Pingst nationellt kan säkert väcka funderingar", "link": "https://www.dagen.se/nyheter/ovanligt-men-inte-unikt-att-pingst-kliver-in-i-lokal-foersamling/10243905", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:08:56+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Does he make a \"TACO\" - and leave the war to Israel?", "summary": "", "title_original": "Gör han en ”TACO” – och lämnar kriget till Israel?", "summary_original": "", "link": "https://www.tv4.se/artikel/6V0p10LqQTuN2p5RnTUPlI/goer-han-en-taco-och-laemnar-kriget-till-israel", "date_display": "2026-03-10", "date_iso": "2026-03-10T13:48:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["NyheternaY"]}, {"id": 142, "title": "This is where the Swedes are the worst at swimming: \"It's worrying\"", "summary": "In a new survey, the Swedish Lifesaving Society has asked Swedes if they can swim 200 meters, of which 50 meters on their back. In Jämtland county, 70 percent answer yes - which is the worst in the country. - It is worrying that we are in such a bad situation and I don't have any really good answers yet as to how this can happen, says Niklas Daoson (S), chairman of the municipal board in Östersund municipality. The average in Sweden is 81 percent and in Uppsala county it is the best - there 90 percent answer yes. The stretches correspond to the criteria for the Simborg brand and are vital, according to Niklas Daoson.  - After all, it is life insurance that is involved. It is, of course, extremely dangerous not to have that knowledge. The reasons must be investigated In the municipality of Östersund, several projects have previously been carried out to strengthen swimming skills, and the result is therefore extra surprising, according to Niklas Daoson. - We have done a number of campaigns and investments like this before, we have also evaluated them with good results. He doesn't think the cold water is a likely explanation. - I was about to say that maybe we don't swim as much as in southern Sweden, but the Jämtars are tough-minded and usually swim even though it's 15-16 degrees in Storsjön. \"Own responsibility\" Now Niklas Daoson wants more people to learn to swim, and points out that adults can do a lot on their own. - As an adult, you also have your own responsibility in this, and there we get to review what the best solution looks like. He has seen firsthand how important it is to be able to swim, having worked as a lifeguard when he was younger. - I worked at the bath house and actually issued simburg badges like this in my youth. Niklas Daoson has now raised the issue with his colleagues in the county to get a better picture of what could be behind the problem. - We will get to the bottom of this and try to understand why we have fallen behind.", "title_original": "Här är svenskarna sämst på att simma: ”Det är oroväckande”", "summary_original": "I en ny undersökning har Svenska Livräddningssällskapet frågat svenskar om de kan simma 200 meter varav 50 meter på rygg. I Jämtlands län svarar 70 procent ja – vilket är sämst i landet. – Det är oroväckande att vi ligger så dåligt till och jag har inga riktigt bra svar än på hur det kan komma sig, säger Niklas Daoson (S), kommunstyrelsens ordförande i Östersunds kommun. Snittet i Sverige ligger på 81 procent och i Uppsala län är man bäst – där svarar 90 procent ja. Sträckorna motsvarar kriterierna för simborgarmärket och är livsviktiga, enligt Niklas Daoson.  – Det är ju en livförsäkring som det handlar om. Det är förstås jättefarligt att inte ha de kunskaperna. Orsakerna ska utredas I Östersunds kommun har man tidigare genomfört flera projekt för att stärka simkunnigheten och resultatet är därför extra förvånande, enligt Niklas Daoson. – Vi har gjort ett antal sådana här kampanjer och satsningar förut, de har vi också utvärderat med gott resultat. Han tror inte att det kalla vattnet är en trolig förklaring. – Jag höll på att säga att vi kanske inte badar lika mycket som i sydliga Sverige, men jämtarna är tuffa i sinnet och brukar bada trots att det är 15-16 grader i Storsjön. ”Eget ansvar” Nu vill Niklas Daoson att fler lär sig simma, och pekar på att vuxna kan göra mycket på egen hand. – Som vuxen har man också ett eget ansvar i detta och där får vi se över hur den bästa lösningen ser ut. Han har på nära håll sett hur viktigt det är att kunna simma, efter att ha arbetat som badvakt när han var yngre. – Jag jobbade på badhuset och utfärdade faktiskt sådana här simborgarmärken i min ungdom. Niklas Daoson har nu lyft frågan med sina kollegor i länet för att få en bättre bild av vad som kan ligga bakom problemet. – Vi kommer att gå till botten med det här och försöka förstå varför vi har halkat efter.", "link": "https://www.tv4.se/artikel/4naVxa2H9ScJw8NqzNFvpb/haer-aer-svenskarna-saemst-pa-att-simma", "date_display": "2026-03-10", "date_iso": "2026-03-10T12:53:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["NyheternaY", "/simning", "/ostersund", "/inrikes"]}, {"id": 143, "title": "Crashes and adrenaline – the Swede is chasing another WC gold", "summary": "Bloody scrapes and broken bones are part of everyday life in ice racing. But according to the Swedish WC star, most accidents are relatively minor after all.\n\n- Most of the time it's mostly just flesh wounds. It is only the skin and some muscle that goes to waste. But it heals up, says Martin.\n\nOne of the worst crashes came during a pre-season training camp, when a clubmate suffered a puncture at high speed.\n\n- He stroked me when he got punk inside me. He broke his back and I broke my hip and elbow.\n\nDespite the severe crash, the season still ended with WC gold. Sharp spikes and 130 kilometers per hour Ice racing is run on specially built motorcycles with up to 28 millimeter long spikes in the tires. The spikes sit in a carefully designed pattern to provide maximum grip on the ice. This allows the drivers to push the speed up to around 130 kilometers per hour.\n\n- It may not be seen so much on TV, but on the track it goes very fast. Especially when you drive four in one heat. Then it's tight and a lot of adrenaline, says Martin.\n\nThe sport is far from glamorous. Often it is family and friends who help behind the scenes.\n\nDuring the competitions, his father Ari Haarahiltunen stands at the side of the track and brushes the ice between heats.\n\n- It's a good distraction, says Ari Haarahiltunen and laughs.  At the same time, he admits that the nervousness is always there.\n\n- Before it was more exciting, then he was flying all the time. Almost every competition he was up in the snow embankment. Now he has more routine, but it also goes much faster - and then the crashes are bigger. One minute full discharge Martin began his career in motocross, but soon found a home in ice racing - a sport where a heat only lasts about a minute, but where everything is decided at a breakneck pace.\n\n- It's jumpy, bouncy and terribly fun, he says.  And the competitive instinct is strong.\n\n- I'm a real competitive person, so I can get really pissed off sometimes.\n\nAfter a WC final where he let off the gas and lost the victory by a h", "title_original": "Krascher och adrenalin – svensken jagar nytt VM-guld", "summary_original": "Blodiga skrapsår och brutna ben hör till vardagen i isracing. Men enligt den svenske VM-stjärnan är de flesta olyckor trots allt relativt lindriga.\n\n– Oftast blir det mest bara köttsår. Det är bara huden och någon muskel som går åt skogen. Men det läker ihop, säger Martin.\n\nEn av de värsta krascherna kom under ett träningsläger inför en säsong, när en klubbkamrat fick punktering i hög fart.\n\n– Han strök mig när han fick punka innanför mig. Han bröt ryggen och jag bröt höften och armbågen.\n\nTrots den svåra kraschen slutade säsongen ändå med VM-guld. Sylvassa spikar och 130 kilometer i timmen Isracing körs på specialbyggda motorcyklar med upp till 28 millimeter långa spikar i däcken. Spikarna sitter i ett noggrant utformat mönster för att ge maximalt grepp på isen. Det gör att förarna kan pressa upp farten till omkring 130 kilometer i timmen.\n\n– Det kanske inte syns så mycket på tv, men på banan går det väldigt fort. Speciellt när man kör fyra stycken i ett heat. Då är det tajt och mycket adrenalin, säger Martin.\n\nSporten är långt ifrån glamorös. Ofta är det familj och vänner som hjälper till bakom kulisserna.\n\nUnder tävlingarna står hans pappa Ari Haarahiltunen vid sidan av banan och borstar isen mellan heaten.\n\n– Det är en bra distraktion, säger Ari Haarahiltunen och skrattar.  Samtidigt erkänner han att nervositeten alltid finns där.\n\n– Förut var det mer spännande, då flög han ju hela tiden. Nästan varje tävling var han uppe i snövallen. Nu har han mer rutin, men det går också mycket fortare – och då blir krascherna större. En minuts full urladdning Martin började sin karriär inom motocross, men hittade snart hem i isracing – en sport där ett heat bara varar i ungefär en minut, men där allt avgörs i ett rasande tempo.\n\n– Det är hoppigt, studsigt och fruktansvärt roligt, säger han.  Och tävlingsinstinkten är stark.\n\n– Jag är en riktig tävlingsmänniska, så jag kan bli riktigt förbannad ibland.\n\nEfter en VM-final där han släppte på gasen och förlorade segern med ett halvt framhjul tog frustrationen över.\n\n– Jag ville bara gå och byta om, men först var det prisutdelning eftersom jag kom tvåa. Sen när jag kom in i omklädningsrummet fick en dörr smaka på en fot.  Dörren höll.   – Det var en tjock ståldörr. Jag tror min fot gick sönder i stället. Jag har fortfarande ont i den, säger han.\n\nTrots riskerna och skadorna fortsätter satsningen.  Den här säsongen går Martin för sitt femte VM-guld.  I helgen avgörs de två första tävlingarna i årets VM som består av totalt tre stycken.", "link": "https://www.tv4.se/artikel/2H2LOdWkn3hIsHmCSijuAk/krascher-brutna-ben-och-adrenalin-svensken-jagar-nytt-vm-guld", "date_display": "2026-03-10", "date_iso": "2026-03-10T12:04:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/isracing", "/motorsport"]}, {"id": 144, "title": "\"Relief rally on the stock market - Trump's pain threshold not very high\"", "summary": "At eleven o'clock on Tuesday morning, the Stockholm Stock Exchange's broad index was up around 2.5 percent. Among engineering companies, the recovery is great. - They are the ones you are most worried about who will be negatively affected by the fighting in Iran. After a few very tough days of decline, we will see a small relief rally, says Carl-Henrik Söderberg, savings economist at Nordnet. The rise is largely entirely driven by the price of oil, which in turn fell back after comments from US President Donald Trump that an end to war may be imminent. - His statements have a tendency to influence us very much - both on and off the stock exchange, says Carl-Henrik Söderberg. Trump's pain threshold not very high Oil prices rose sharply after Iran announced that it was closing the important Strait of Hormuz. About 20 percent of the oil consumed passes through the strait annually. Trump has raged against Iran's actions and - alongside statements that the war will be over \"very soon\" - has threatened Iran with worse attacks. The change makes the stock exchange particularly difficult to navigate at the moment. - I interpret today's reaction as that the market is calmer now. Oil prices have fallen by 25 percent from the peak yesterday, that's a lot, says Carl-Henrik Söderberg. At the same time, the American president is being pressured by an imminent mid-term election. Rising energy prices will be felt in Americans' wallets. - Iran feels that the Strait of Hormuz is the only thing they have to force Trump into a retreat, and Trump's pain threshold is not very high. His incentive to resolve the blockade in the Strait of Hormuz is very great. Then interest rates and inflation are affected According to Carl-Henrik Söderberg, one should not pull too big gears on today's rise. - The stock market was extremely depressed after a few tough days. Trump is very moody in his communication, and I find it hard to see that the major players in the market would be much more positive about stocks today. After major declines, news of a harbinger of the end of war is enough for the price of oil to go back", "title_original": "”Lättnadsrally på börsen – Trumps smärttröskel inte särskilt hög”", "summary_original": "Vid elvatiden på tisdagsförmiddagen var Stockholmsbörsens breda index upp omkring 2,5 procent. Bland verkstadsbolagen är återhämtningen stor. – Det är de man är mest orolig för ska påverkas negativt av striderna i Iran. Efter några väldigt tuffa nedgångsdagar får vi se ett litet lättnadsrally, säger Carl-Henrik Söderberg, sparekonom på Nordnet. Uppgången är i stort sett helt driven av oljepriset, som i sin tur fallit tillbaka efter kommenterar från USA:s president Donald Trump om att ett krigsslut kan vara nära förestående. – Hans uttalanden har en tendens att påverka oss väldigt mycket – både på och utanför börsen, säger Carl-Henrik Söderberg. Trumps smärttröskel inte särskilt hög Oljepriset steg kraftigt efter att Iran meddelade att man stängt av de viktiga Hormuzsundet. Omkring 20 procent av oljan som konsumeras passerar sundet årligen. Trump har rasat mot Irans agerande och har – vid sidan av uttalanden om att kriget ”mycket snart” är över – hotat Iran med värre attacker. Omväxlingen gör börsen särskilt svårnavigerad för tillfället. – Jag tolkar dagens reaktion som att marknaden är lugnare nu. Oljepriserna har ju gått ned med 25 procent från toppen igår, det är väldigt mycket, säger Carl-Henrik Söderberg. Samtidigt pressas den amerikanske presidenten av ett stundade mellanårsval. Stigande energipriser kommer märkas i amerikanernas plånböcker. – Iran känner att Hormuzsundet är det enda de har för att tvinga Trump till en reträtt, och Trumps smärttröskel är inte särskilt hög. Hans incitament att lösa blockaden i Hormuzsundet är väldigt stort. Då påverkas räntor och inflation Enligt Carl-Henrik Söderberg bör man inte dra alltför stora växlar på dagens uppgång. – Aktiemarknaden var extremt nedtryckt efter några tuffa dagar. Trump är väldigt lynnig sin kommunikation, och jag har svårt att se att de stora aktörerna på marknaden skulle bli mycket mer positiva till aktier idag. Efter stora nedgångar räcker nyheter om ett förebådande krigsslut för att oljepriset ska backa och riskaptiten stiga. Liknande rörelser både upp och ned är att vänta de kommande dagarna. – Marknaden kommer fortsatt fokusera på oljepriset och vad som händer i Hormuzsundet. Börsen är cynisk och vill se Hormuzsundet öppet igen så att man slipper oroa sig för långvarigt höga energipriser. Det är då det sätter sin prägel på inflation, räntor, konjunktur och sedermera bolagens vinster. Effekterna sprider sig längre ju längre den här konflikten består.", "link": "https://www.tv4.se/artikel/6rOHIGbR34gSImw8xtzzt/laettnadsrally-pa-boersen-trumps-smaerttroeskel-inte-saerskilt-hoeg", "date_display": "2026-03-10", "date_iso": "2026-03-10T10:53:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/stockholmsborsen", "/irankriget", "/donald-trump"]}, {"id": 145, "title": "\"Remove the abuse label from me\"", "summary": "Ambulance nurse Linn Gustafsson lost her driver's license and her job in Karlstad after elevated values ​​in the Swedish Transport Agency's PEth tests, which can indicate alcohol consumption over time.  After criticism, the Swedish Transport Agency backed down and changed the guidelines.  - I blow into a breathalyzer before every work shift at the ambulance. There had been no room to drink the quantities that the Transport Agency claims, Linn Gustafsson has previously told TV4Nyheterna.\n\nEven though Linn Gustafsson has gotten her driver's license back, she is still registered as an addict with the authority. She has also not got her job back as an ambulance nurse. Demands that the \"abuse stamp\" be removed Now, with the help of the organization Center for Justice, she is demanding that the Swedish Transport Agency reconsider her case.\n\n- Both I and many other people have received an incorrect diagnosis based on the Swedish Transport Agency's assessment. Here I think they should reconsider my case and remove the abuse stamp. In this way, I get a chance for redress and hopefully others too who are affected in the same way as me, says Linn Gustafsson.", "title_original": "”Ta bort missbruksstämpeln på mig”", "summary_original": "Ambulanssjuksköterskan Linn Gustafsson förlorade körkortet och jobbet i Karlstad efter förhöjda värden i Transportstyrelsens PEth-tester, som kan indikera alkoholkonsumtion över tid.  Efter kritik backade Transportstyrelsen och ändrade riktlinjerna.  – Jag blåser i en alkometer inför varje arbetspass vid ambulansen. Det hade inte funnits utrymme att dricka de mängderna som Transportstyrelsen påstår, har Linn Gustafsson tidigare sagt till TV4Nyheterna.\n\nTrots att Linn Gustafsson har fått tillbaka körkortet är hon fortfarande registrerad som missbrukare hos myndigheten. Hon har inte heller fått tillbaka sitt jobb som ambulanssjuksköterska. Kräver att ”missbruksstämpeln” tas bort Nu kräver hon, med hjälp av organisationen Centrum för rättvisa, att Transportstyrelsen omprövar hennes ärende.\n\n– Både jag och många andra personer har fått en felaktig diagnos utifrån Transportstyrelsens bedömning. Här anser jag att dom borde ompröva mitt fall och ta bort missbruksstämpeln. På detta sätt får jag en chans till upprättelse och förhoppningsvis andra också som är drabbad på samma sätt som jag, säger Linn Gustafsson.", "link": "https://www.tv4.se/artikel/1Rxyl4OVkqHUF5vOf4CH3q/ta-bort-missbruksstaempeln-pa-mig", "date_display": "2026-03-10", "date_iso": "2026-03-10T10:05:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/peth-test"]}, {"id": 146, "title": "Most common myths about blood types: \"People think magical things\"", "summary": "In Sweden, blood group A is most common, followed by 0, while 0 dominates in large parts of Africa – something that is believed to be connected with protection against severe malaria. The distribution of blood groups varies between different parts of the world and cannot be fully explained but appears to be influenced by historical disease and survival. - Assume that everyone has the same blood type and then a new type of infection comes that spreads in a population and everyone has the same blood type, so everyone dies, says Gustaf Edgren, medical researcher and associate professor of epidemiology. Blood group most important in transfusion People with blood group 0 are universal donors, while A, B and AB have more limited possibilities. The wrong blood type when transfused can be life-threatening, but it is very rare. The blood group is important for transfusions and for pregnant women in case of incompatibility, but otherwise has very little meaning in everyday life. - If you need a blood transfusion, healthcare always finds out your blood type, so you don't need to know it yourself, says Gustaf Edgren. Regardless of blood type, there may be concerns that the right blood is not available in the event of an accident or in healthcare. That's why it's important to donate blood if you can - more blood donors are always needed.  The doctor answers: the most common myths, Myth 1: A blood type protects against winter sickness - The answer is that there is. There is a blood group that is protective against winter sickness, says Gustaf Edgren and continues: - This is complicated, but there are lots of blood groups. And there is one that interacts with calici or the norovirus that causes winter sickness, which means that you have almost one hundred percent protection. Myth 2: Your blood type determines your personality - There is no evidence that this is the case, or any biological link. But this is a common myth. There are those who believe in it. There is a strange view of blood groups. People think magical things, says Edgren. Myth 3: It's important to adjust your diet based on your blood type - This is actually also false, but this is a really common myth. E", "title_original": "Vanligaste myterna om blodgrupper: ”Folk tänker magiska saker”", "summary_original": "I Sverige är blodgrupp A vanligast, följt av 0, medan 0 dominerar i stora delar av Afrika – något som tros hänga ihop med skydd mot svår malaria. Fördelningen av blodgrupper varierar mellan olika delar av världen och kan inte förklaras helt men verkar påverkas av historiska sjukdomar och överlevnad. – Ponera att alla har samma blodgrupp och så kommer en ny typ av infektion som sprids i en population och alla har samma blodgrupp, så dör alla, säger Gustaf Edgren, medicinforskare och docent i epidemiolog. Blodgrupp viktigast vid transfusion Personer med blodgrupp 0 är universalgivare, medan A, B och AB har mer begränsade möjligheter. Fel blodgrupp vid transfusion kan vara livshotande, men det är mycket ovanligt. Blodgruppen är viktig vid transfusioner och för gravida vid inkompatibilitet, men har annars väldigt liten betydelse i vardagen. – Om du skulle behöva en blodtransfusion tar vården alltid reda på din blodgrupp, så man behöver inte känna till den själv, säger Gustaf Edgren. Oavsett blodgrupp kan det finnas oro för att rätt blod inte finns tillgängligt vid en olycka eller i vården. Därför är det viktigt att ge blod om du kan – fler blodgivare behövs alltid.  Doktorn svarar: vanligaste myterna, Myt 1: En blodgrupp skyddar mot vinterkräksjukan – Svaret är att det finns det. Det finns en blodgrupp som är skyddande mot vinterkräksjukan, säger Gustaf Edgren och fortsätter: – Det här är komplicerat, men det finns massvis med blodgrupper. Och det finns en som interagerar med calici eller noroviruset som ger vinterkräksjukan, som gör att man har ett nästan hundraprocentigt skydd. Myt 2: Din blodgrupp avgör din personlighet – Det finns inget som tyder på att det är så, eller nån biologisk koppling. Men det här är en vanlig myt. Det finns de som tror på det. Det finns en märklig syn på blodgrupper. Folk tänker magiska saker, säger Edgren. Myt 3: Det är viktigt att anpassa sin kost utifrån sin blodgrupp –Det är faktiskt också falskt, men det här är en riktigt vanlig myt. En amerikansk författare skrev en bok som kallas Blodgruppsdieten som har sålts i miljontals kopior. Men det är bara påhitt. Det finns ingen rationell koppling mellan blodgrupper och dieten. Myt 4: Vissa blodgrupper får mer myggbett – Nej det finns nog ingen koppling. Det är möjligt att det finns för nån av de andra 39 blodgruppssystemen men jag tror inte att det finns nån sån koppling med blodgruppssystemet, säger Gustaf Edgren.", "link": "https://www.tv4.se/artikel/128d2r64sx7RlWHlkBbAR1/vanligaste-myterna-om-blodgrupper-folk-taenker-magiska-saker", "date_display": "2026-03-10", "date_iso": "2026-03-10T09:38:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/lakare", "/efter-tio/doktorerna", "/blodgivning", "/kroppen", "/halsa"]}, {"id": 147, "title": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "title_original": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary_original": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "link": "https://www.government.se/statements/2026/03/statement-from-ministry-for-foreign-affairs-on-summoning-of-russian-ambassador/", "date_display": "2026-03-10", "date_iso": "2026-03-10T09:26:54+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement", "Sweden's support to Ukraine"]}, {"id": 148, "title": "Larb – Thai mince salad", "summary": "Today's dinner tip offers a healthy and tasty mince dish with minced pork, chilli, garlic and fresh herbs, topped with roasted sunflower seeds and tangy lime. Serve with jasmine rice or in salad leaves for a fresh and spicy meal. See Tommy Myllymäki's recipe", "title_original": "Larb – thailändsk färssallad", "summary_original": "Dagens middagstips bjuder på en frisk och smakrik färsrätt med fläskfärs, chili, vitlök och färska örter, toppad med rostade solroskärnor och syrlig lime. Servera med jasminris eller i salladsblad för en fräsch och kryddig måltid. Se Tommy Myllymäkis recept", "link": "https://www.tv4.se/artikel/1nkn6PMn6QJvYdOAxIC6Mq/larb-thailaendsk-faerssallad-tommy-myllymaeki", "date_display": "2026-03-10", "date_iso": "2026-03-10T08:03:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/personer/tommy-myllymaki", "/koket", "/kokets-middag"]}, {"id": 149, "title": "Government supports women’s and girls’ resilience in Ukraine", "summary": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "title_original": "Government supports women’s and girls’ resilience in Ukraine", "summary_original": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "link": "https://www.government.se/press-releases/2026/03/government-supports-womens-and-girls-resilience-in-ukraine/", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:58:18+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry of Employment", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Benjamin Dousa", "Nina Larsson"]}, {"id": 150, "title": "Renovate without disputes - that's how you'll succeed with this spring's construction project", "summary": "Turning your renovation dreams into reality requires more than just inspiration. According to savings economist Sharon Lavi, you should start by calculating the finances: what the project may cost, if ROT deductions can be used and if a building permit is required. Särnholm believes that many people have no idea what a construction project actually costs. Therefore, it may be wise to seek the help of someone with experience early on to get an approximate estimate. - You start and dream and think big and stuff like that. Then the reality is sometimes different, says carpenter Mattias Särnholm in Nyhetsmorgon. As of April 1, the rules for additional loans will change. Then you who already have a home loan can only borrow up to 80 percent of the home's value, compared to the previous 85 percent. In addition, it is no longer possible to revalue the house in order to be able to mortgage for craft services or renovations. Clear agreements reduce the risk of conflict A common trap is to underestimate time and costs. Savings economist Sharon Lavie therefore recommends a financial buffer and clear agreements that state what must be done, when the work must be completed and how the price is calculated. - The more details, the better, says Sharon Lavie and continues: - I think you should constantly have reconciliations with your craftsman so you can hear how things are going so that it doesn't come as a surprise at the end. One tip is to use the Swedish Consumer Agency's tradesman form, which has been developed to make it easier for private individuals to write clear contracts.  Communication is key Both experts emphasize the importance of good communication. Unforeseen problems almost always appear during construction, and then it is important to have a plan for how changes in time and cost are to be handled. If the collaboration doesn't work, the project may have to be paused or the craftsman replaced - and in the last resort you have to proceed with a legal process. Lavie also advises not paying everything up front, but splitting the payment over the course of the project. When the work is finished, it may be wise to a", "title_original": "Renovera utan tvist – så lyckas du med vårens byggprojekt", "summary_original": "Att förvandla sina renoveringsdrömmar till verklighet kräver mer än bara inspiration. Enligt sparekonomen Sharon Lavi bör man börja med att räkna på ekonomin: vad projektet får kosta, om ROT-avdrag kan användas och om bygglov krävs. Särnholm menar att många saknar koll på vad ett byggprojekt faktiskt kostar. Därför kan det vara klokt att tidigt ta hjälp av någon med erfarenhet för att få en ungefärlig uppskattning. – Man drar igång och drömmer och tänker stort och sådär. Sen är verkligheten en annan ibland, säger snickaren  Mattias Särnholm i Nyhetsmorgon. Från och med 1 april ändras reglerna för tilläggslån. Då får du som redan har bostadslån bara låna upp till 80 procent av bostadens värde, jämfört med tidigare 85 procent. Dessutom går det inte längre att omvärdera huset för att kunna belåna för hantverkstjänster eller ombyggnationer. Tydliga avtal minskar risken för konflikt En vanlig fälla är att underskatta tid och kostnader. Sparekonomen Sharon Lavie  rekommenderar därför en ekonomisk buffert och tydliga avtal där det framgår vad som ska göras, när arbetet ska vara klart och hur priset beräknas. – Ju mer detaljer, desto bättre, säger Sharon Lavie och fortsätter: – Jag tycker att man hela tiden ska ha avstämningar med sin hantverkare så man kan höra hur det går så att det inte kommer som en överraskning på slutet. Ett tips är att använda Konsumentverkets hantverkarformulär, som är framtaget för att göra det enklare för privatpersoner att skriva tydliga avtal.  Kommunikation är nyckeln Båda experterna betonar vikten av god kommunikation. Oförutsedda problem dyker nästan alltid upp under ett bygge, och då är det viktigt att ha en plan för hur förändringar i tid och kostnad ska hanteras. Om samarbetet inte fungerar kan projektet behöva pausas eller hantverkaren bytas ut – och i sista hand får man gå vidare i en rättsprocess. Lavie råder också att inte betala allt i förskott, utan dela upp betalningen under projektets gång. När arbetet är klart kan det vara klokt att ta in en oberoende besiktningsman innan slutfakturan betalas. – Man ska vara nöjd och känna att det varit härligt med en hantverkare, säger Mattias Särnholm.", "link": "https://www.tv4.se/artikel/5XksRF16Ho6CgHCGoeSM2D/renovera-utan-tvist-sa-lyckas-du-med-varens-byggprojekt", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:18:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/hus-hem", "/renovering", "/bygglov"]}, {"id": 151, "title": "This is how the far-right environment is financed - the most common way", "summary": "In 2025, the Expo Foundation recorded 1,465 activities within the racial ideological environment. These included, among other things, the dissemination of propaganda, study circles, social gatherings and martial arts training. If you compare with 2024, the number of activities increased - but the movement's ability to mobilize is still at a clearly lower level than during its most active period in the 2010s. The main reason for the increase is the rise of Aktivklubb Sverige, which is currently the fastest growing group in the environment. At the same time, the Nordic Resistance Movement (NMR) reached its lowest level of activity in ten years. Driven by anti-Semitic memes According to the annual report, a right-wing extreme youth culture is also driven by anti-Semitic memes - which are increasing.  Hateful messages are spread openly in schools and on social media, especially among young men. The development is reinforced by algorithm changes on platforms such as Meta and TikTok, which increase the spread of extreme content. Expo warns that the normalization favors Aktivklubb Sverige and involves a growing security risk. - Right-wing extremism instead bubbles up in chat groups, locally among young people who may not even join any group, but only create their right-wing extremist friend groups. Perhaps it is as simple as that extremists are faced with the same dilemma as the rest of Sweden. People do not become members of organizations in the same way. But there are groups that succeed, like Aktivklubb, says Daniel Poohl, CEO at Expo. How the extreme right-wing environment is financed In the report, Expo also describes how the racial ideological environment is financed through several complementary strategies – including through membership fees and internal payments. But there are also other ways. \"Miljön also collects through donations and crowdfunding from sympathizers, usually via digital payment services. Events such as concerts, conferences, festivals and martial arts galas are used both to raise money and sell products. Online commerce is a central source of revenue through the sale of clothing,", "title_original": "Så finansieras den högerextrema miljön – vanligaste sättet", "summary_original": "Under 2025 registrerade stiftelsen Expo 1 465 aktiviteter inom den rasideologiska miljön. Dessa omfattade bland annat spridning av propaganda, studiecirklar, sociala sammankomster och kampsportsträning. Om man jämför med 2024 så ökade antalet aktiviteter – men rörelsens förmåga att mobilisera ligger fortfarande på en klart lägre nivå än under dess mest aktiva period under 2010-talet. Den huvudsakliga orsaken till ökningen är framväxten av Aktivklubb Sverige, som just nu är den snabbast växande gruppen i miljön. Samtidigt nådde Nordiska motståndsrörelsen (NMR) sin lägsta aktivitetsnivå på tio år. Drivs av antisemitiska memes Enligt årsrapporten så drivs också en högerextrem ungdomskultur av antisemitiska memes – som ökar.  Hatbudskap sprids öppet på skolor och i sociala medier, särskilt bland unga män. Utvecklingen förstärks av algoritmförändringar på plattformar som Meta och TikTok, som ökar spridningen av extremt innehåll. Expo varnar för att normaliseringen gynnar Aktivklubb Sverige och innebär en växande säkerhetsrisk. – Högerextremismen bubblar i stället i chattgrupper, lokalt hos ungdomar som kanske inte ens går med i någon grupp, utan bara skapar sina högerextrema kompisgäng. Kanske är det så enkelt att extremister ställs inför samma dilemma som resten av förenings-Sverige. Folk blir inte medlemmar i organisationer på samma sätt. Men det finns grupper som lyckas, som Aktivklubb, säger Daniel Poohl, vd på Expo. Så finansieras högerextrema miljön I rapporten beskriver Expo också hur den rasideologiska miljön finansieras genom flera kompletterande strategier – bland annat genom medlemsavgifter och interna betalningar. Men det finns även andra sätt. ”Miljön bedriver också insamling genom donationer och crowdfunding från sympatisörer, oftast via digitala betaltjänster. Evenemang som konserter, konferenser, festivaler och kampsportsgalor används både för att samla in pengar och sälja produkter. Onlinehandel utgör en central intäktskälla genom försäljning av kläder, litteratur, musik och andra profil produkter kopplade till miljön”, står det i rapporten. Vissa bedriver också medieverksamhet som kan generera inkomster via donationer, prenumerationer och annonser. ”Fastigheter fungerar som ekonomiska och organisatoriska resurser genom gemensamt finansierade eller av sympatisörer upplåtna lokaler. Det finns också exempel på ekonomisk brottslighet, såsom skatteundandragande, svarta inkomster och andra olagliga metoder för att stärka verksamheternas ekonomi”, skriver Expo. Det är vanligaste finansieringen Daniel Poohl, vd på Expo, påpekar att evenemang och liknande är en ganska liten del av intäkterna och att det vanligaste är att man finansierar sig själva. – Den högerextrema rörelsen finansierar sig på massa olika sätt. Det absolut vanligaste är att folk skänker pengar ur egen ficka som aktivister. Sen försöker man tjäna pengar på andra sätt också. Sälja prylar och merchandise. Det är ju en form av försäljning som också nästan i sig blir politisk aktivism. Det är ju inte bara så att du skänker pengar till den här miljön utan genom att bära de här kläderna så manifesterar du din politiska tillhörighet, säger han.", "link": "https://www.tv4.se/artikel/7HgoU0TVVSqnzZC34tBnnx/sa-finansieras-den-hoegerextrema-miljoen-vanligaste-saettet", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:09:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["NyheternaY", "/inrikes", "/brott-och-straff", "/expo", "/hogerextremism"]}, {"id": 152, "title": "Anti-Semitic memes fuel Tiktok and Instagram", "summary": "A far-right youth culture fueled by anti-Semitic memes has taken hold in Sweden", "title_original": "Antisemitiska memes bränsle på Tiktok och Instagram", "summary_original": "En högerextrem ungdomskultur som drivs på av antisemitiska memes har fått fäste i Sverige", "link": "https://www.dagen.se/nyheter/antisemitiska-memes-braensle-pa-tiktok-och-instagram/10243062", "date_display": "2026-03-10", "date_iso": "2026-03-10T06:58:21+00:00", "source": "Dagen", "ministry": "General News", "type": st be made more accessible to the public in order to survive.  - This is exactly what is happening now when he says this, so I think it is great that this has happened. He himself is a multitasker and believes that the world of opera and ballet has a lot to learn from the world of music.  - What musicals have succeeded in that opera has not really succeeded in is capturing people where they are. There are prejudices about opera that we in the opera world are not very good at peeling away. Musicals have stripped it away.  He believes, among other things, that there is a fear among people that they \"don't have the right clothes\" to go to the opera and the like.  - So we have a bit left to work on, that accessibility and low thresholds, says Rickard Söderberg.", "title_original": "Tackar Chalamet för megadissen: ”Toppen att det har hänt”", "summary_original": "Det hela började med att skådespelaren Timothée Chalamet pratade om den så kallade ”biodöden”, men han drog det ett steg längre.  – Jag vill inte jobba med balett, opera eller något som känns som ”vi måste hålla det här vid liv, fast ingen bryr sig längre”, sa Chalamet i en intervju som sedan har blivit viral.  I Efter fem hyllar den svenska operasångaren och artisten Rickard Söderberg uttalandet.  – Alla de stora operahusen, sångarna och publiken kommer samman och säger ”nej, det är fantastiskt med opera”. Så det är underbart att han är lite efter och gör det här, säger Söderberg.  ”Finns fördomar om opera” Söderberg menar att operan och baletten måste göras mer lättillgänglig för allmänheten för att överleva.  – Det är precis det som händer nu när han säger det här, så jag tycker det är toppen att det här har hänt. Själv är han mångsysslare och menar att opera- och balettvärlden har mycket att lära av musikalvärlden.  – Det som musikal har lyckats med som opera inte riktigt har lyckats med är att fånga upp människor där de är. Det finns fördomar om opera som vi inom operavärlden inte är så duktiga på att skala bort. Musikaler har skalat bort det.  Han menar bland annat att det finns en ängslan hos folk att de ”inte har rätt kläder” för att gå på opera och liknande.  – Så där har vi lite kvar att jobba på, den tillgängligheten och låga trösklar, säger Rickard Söderberg.", "link": "https://www.tv4.se/artikel/okfWw9wH27AFWFMBWq4eZ/operasangaren-backar-timothee-chalamet-har-gjort-nagot-fantastiskt", "date_display": "2026-03-09", "date_iso": "2026-03-09T19:32:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["NyheternaY", "/noje", "/efter-fem", "/personer/rickard-soderberg", "/kultur"]}, {"id": 161, "title": "The hottest day of the year - but then a serious setback awaits: \"Ruggit\"", "summary": "The meteorological spring may spread rapidly north during Tuesday. That's what TV4 Nyheterna's meteorologist Peter Kondrup says. - The border can take a big leap, up over large parts of the country. It is basically half the country that can get meteorological spring, he says. Hot city On Monday, the year's highest temperature so far was recorded: 17.4 degrees in Oskarshamn in Småland. According to Kondrup, it is a place that often ends up high when warm air moves in. During Tuesday, mild air is expected to continue in eastern Småland in particular, with 14–15 degrees in some places. - These are real spring temperatures, especially for being this early in March. We had 17 degrees today, and tomorrow it could be almost as hot, says Kondrup. Cold front on its way in. However, the heat seems to disappear quickly. Already Wednesday evening, a cold front is approaching. - On Thursday, the cold front has passed. Then it will be more cloudy and around 10 degrees at most. That's almost a five-degree drop from today, he says. Kondrup believes that the temperatures will not be low for the time of year - but that the contrast will be felt clearly. - If this had been a few weeks ago, we would have thought it was perfectly fine. But since we got used to these spring days, it will feel rough, he says. Rain and snow at the end of the week During Thursday night and Friday, a larger area of ​​precipitation moves in. - There will be a more coherent rain area over southern and central Sweden. It will snow in the north. It is low pressure and unstable, says Kondrup.  The weekend continues in the same style. - There will be a lot of clouds and temperatures of 4-7 degrees in the south. In the north, only a few plus degrees, sometimes even minus in the middle of the day, he says. \"This is setback number one\" Kondrup notes that the nice March weather has probably made many a little spoiled.  - It went very quickly from winter weather to lovely spring weather. But sooner or later the setback will come. This can be counted as setback number one, he says. Despite the coming setback, spring is still on the way", "title_original": "Årets varmaste dag – men då väntar rejält bakslag: ”Ruggigt”", "summary_original": "Den meteorologiska våren kan sprida sig snabbt norrut under tisdagen. Det säger TV4 Nyheternas meteorolog Peter Kondrup. – Gränsen kan ta ett rejält skutt, upp över stora delar av landet. Det är i princip halva landet som kan få meteorologisk vår, säger han. Heta staden På måndagen noterades årets hittills högsta temperatur: 17,4 grader i Oskarshamn i Småland. Enligt Kondrup är det en plats som ofta hamnar högt när varm luft drar in. Under tisdagen väntas fortsatt mild luft i framför allt östra Småland, med 14–15 grader på vissa håll. – Det är rejäla vårtemperaturer, särskilt för att vara så här tidigt i mars. Vi hade 17 grader i dag, och i morgon kan det bli nästan lika varmt, säger Kondrup. Kallfront på väg in Värmen ser dock ut att försvinna snabbt. Redan onsdag kväll närmar sig en kallfront. – På torsdag har kallfronten passerat. Då blir det mer moln och runt 10 grader som mest. Det är nästan en femgraders sänkning från i dag, säger han. Kondrup menar att temperaturerna inte blir låga för årstiden – men att kontrasten kommer kännas tydlig. – Hade det här varit för några veckor sedan hade vi tyckt att det var helt okej. Men eftersom vi vant oss vid de här vårdagarna så kommer det kännas ruggigt, säger han. Regn och snö i slutet av veckan Under torsdag natt och fredag drar ett större nederbördsområde in. – Det kommer in ett mer sammanhängande regnområde över södra och mellersta Sverige. I norr blir det snöfall. Det är lågtrycksbetonat och ostadigt, säger Kondrup.  Helgen fortsätter i samma stil. – Det blir mycket moln och temperaturer på 4–7 grader i söder. I norr bara några plusgrader, ibland till och med minus mitt på dagen, säger han. ”Det här är bakslag nummer ett” Kondrup konstaterar att det fina marsvädret sannolikt gjort många lite bortskämda.  – Det gick väldigt snabbt från vinterväder till härligt vårväder. Men förr eller senare kommer bakslaget. Det här får räknas som bakslag nummer ett, säger han. Trots det kommande bakslaget ligger våren ändå på framfart. – Det kan bli vår upp till nästan hela Svealand och delar av sydöstra Norrland. Sedan kan det bromsas ett tag innan nästa steg kommer, säger Kondrup.", "link": "https://www.tv4.se/artikel/2vN1uzv2IeWaSSkvX4ZpN6/arets-varmaste-dag-men-da-vaentar-rejaelt-bakslag-ruggigt", "date_display": "2026-03-09", "date_iso": "2026-03-09T18:57:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["NyheternaY", "/inrikes", "/vadret", "/vader", "/vaderprognoser", "/vaderfenomen", "/sno", "/sol", "/var", "/vartecken"]}, {"id": 162, "title": "The new images point to the USA - for the bombing of the girls' school", "summary": "American cruise robot is said to have hit • 175 people are said to have died", "title_original": "Nya bilderna pekar ut USA – för bombningen av flickskolan", "summary_original": "Amerikansk kryssningsrobot ska ha träffat • 175 personer uppges ha dött", "link": "https://www.tv4.se/artikel/3RQhK1fw8vxkLDq1olIkq8/nya-bilder-pekar-ut   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
