a-pengar/", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "The wind power plant keeps Mikael awake: \"Sounds like a tractor\"", "summary": "Mikael Gälliner in Munkflohögen in Jämtland has done several reconstructions of his house to try to dampen the sound from the approximately 20 wind turbines that surround the village. - The wind turbines make a lot of noise, when it's at its worst it sounds like a tractor driving next to the house. Sometimes I can't sleep because of the noise, says Mikael Gälliner.  Now the government is proposing that those who live near wind turbines should be compensated for it. The proposal aims to make residents more positive about having wind turbines near their homes. The compensation is based, among other things, on how close to the wind turbine you live, the closer the higher the compensation. Raging against the government's proposal: \"Absolutely crazy\" For residents in southern Sweden, this means a maximum annual compensation of SEK 38,400, while in the north the amount only amounts to around half, SEK 19,400. The reason why the compensation is higher in southern Sweden is that the model is based on revenue sharing and that the higher electricity prices there lead to higher compensation.  Labor market minister and acting climate and environment minister Johan Britz (L) writes in a comment to TV4 Nyheterna that: \"The government ensures that you get to share in the revenue if you live near a wind turbine. The closer you live to a wind power plant, the higher compensation you get. The compensation depends on how much revenue the park generates and the difference in compensation between north and south reflects the differences in electricity prices within the country.\" But residents of Munkflohöjden are sharply critical of this.  - I think this is completely crazy. Why should we in the north get less compensation, the intrusion into our living environment is worth less than those in the south. No, this is not reasonable, says Bengt Hagström.  Then the rules can start to apply Wind power compensation must be paid by the owner of the wind farm to residents who have their house located within nine wind turbine heights from a wind turbine, that is 2.25 km from a 250 meter high wind turbine.  The size of the compensation is proposed to vary with", "title_original": "Vindkraftverket håller Mikael vaken: ”Låter som en traktor”", "summary_original": "Mikael Gälliner i Munkflohögen i Jämtland har gjort flera ombyggnationer av sitt hus för att försöka dämpa ljudet från de cirka 20 vindsnurror som omgärdar byn. – Vindkraftverken för ett himla oväsen, när det är som värst låter det som en traktor som kör intill huset. Det händer att jag inte kan sova på grund av oljudet, säger Mikael Gälliner.  Nu föreslår regeringen att de som bor nära vindkraftverk ska få ersättning för det. Förslaget syftar till att göra invånarna mer positivt inställda till att få vindsnurror nära sina bostäder. Ersättningen grundar sig bland annat på hur nära vindkraftverket man bor, ju närmare desto högre ersättning. Rasar mot regeringens förslag: ”Helt galet” För boende i södra Sverige innebär det en maximal årlig ersättning på 38 400 kronor medan summan i norr bara uppgår till runt hälften, 19 400 kronor. Anledningen till att ersättningen är högre i södra Sverige är att modellen bygger på intäktsdelning och att de högre elpriserna där leder till en högre kompensation.  Arbetsmarknadsminister och vikarierande klimat- och miljöminister Johan Britz (L) skriver i en kommentar till TV4 Nyheterna att: ”Regeringen ser till att du ska få dela på intäkterna om du bor i närheten av vindkraftverk. Ju närmare ett vindkraft du bor, desto högre ersättning får du. Ersättningen beror på hur stora intäkter parken genererar och skillnaden i ersättning mellan norr och söder speglar skillnaderna i elpris inom landet.” Men boende i Munkflohöjden är skarpt kritiska till detta.  – Det här tycker jag är helt galet. Varför ska vi i norr få mindre ersättning, är intrånget i vår levnadsmiljö mindre värt än dem i söder. Nej, det här är inte rimligt, säger Bengt Hagström.  Då kan reglerna börja gälla Vindkraftsersättningen ska betalas av ägaren till vindkraftsparken till boende som har sitt hus som ligger inom nio vindkraftverkshöjder från ett vindkraftverk, det vill säga 2,25 km från ett 250 meter högt vindkraftverk.  Storleken på ersättningen föreslås variera med avståndet till vindkraftsparken och beror på hur stora intäkter parken genererar.  De nya reglerna föreslås börja gälla från 1 juli 2026.", "link": "https://www.tv4.se/artikel/5fuzCHHXViyZKOkE6q7AEQ/vindkraftverket-haller-mikael-vaken-later-som-en-traktor", "date_display": "2026-04-06", "date_iso": "2026-04-06T17:58:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/kallafakta/vindkraften", "/regeringen", "/vindkraft", "/klimatmalen", "/klimat"]}, {"id": 124, "title": "Ice-cold scrotum in the sauna is trending – the testosterone expert disses", "summary": "That the sauna is good for body and soul is nothing new. On the contrary, an old Nordic tradition that is usually described in positive terms. However, at the same time, there are studies that indicate that high temperatures would be harmful to male fertility because sperm do not like heat. To remedy this, the sauna culture has now been reached by a new trend.  People who want to optimize themselves have discovered that saunas are very good for health. But then it was discovered that it is not good for \"the boys\". They don't like heat and so you try to parry it in the simplest way, says reporter Måns Edén from Paradiso P3 who tested an ice pack in the sauna.   The expert: \"I don't think the Finns agree\" The trend involves basting with an ice pack over the package to counteract the heat's effect on sperm production and quality. And on social media you can see how men from different parts of the world are testing this very thing. But testosterone expert Mikael Lehtihet is skeptical.  An ejaculate contains between 100 and 300 million sperm, 40 million are enough to make a partner pregnant. So if you get slightly worse mobility and numbers, we still have an excess capacity. I don't think the Finns agree that it affects fertility, says endocrinologist and testosterone expert Mikael Lehtihet.  Guys with a low value are more masculine Testosterone values ​​vary throughout the day and are dependent on a number of factors apart from just heat. However, it is often linked to masculinity, well-being and muscle building, but according to Mikael Lehtihet, it is a misconception that higher levels are automatically a sign of masculinity. Guys who say \"I have very high testosterone\" have a lower affinity for the receptor itself. Having a high testosterone value means that you have worse receptors for the hormone, guys who have a low value are actually more masculine. It's the other way around, but it's not that popular to say.  But despite that, he believes at the same time that there is a man who can benefit from the ice trend.", "title_original": "Iskall pung i bastun trendar – testosteron-experten dissar", "summary_original": "Att bastun gör det skönt för kropp och själ är inget nytt. Tvärtom en gammal nordisk tradition som oftast beskrivs i positivt ordalag. Dock finns det samtidigt studier som pekar på att höga temperaturer skulle vara skadligt för den manliga fruktsamheten eftersom spermier inte gillar värme. För att råda bot på detta har bastukulturen nu nåtts av en ny trend.  Folk som vill optimera sig har kommit på att bastu är väldigt bra för hälsan. Men så har man upptäckt att det inte är bra för \"the boys\". De gillar inte värme och så försöker man parera det på det enklaste sättet, säger reporter Måns Edén från Paradiso P3 som testat en ispåse i bastun.   Experten: ”Tror inte finländarna håller med” Trenden innebär att man bastar med en ispåse över paketet för att motverka värmens påverkan på spermieproduktionen och kvaliteten. Och på sociala medier kan man se hur män från olika delar av världen testar just detta. Men testosteron-experten Mikael Lehtihet är skeptisk.  Ett ejakulat innehåller mellan 100 till 300 miljoner spermier, för att göra en partner gravid räcker det med 40 miljoner. Så får man lite sämre rörlighet och antal så har vi ändå en överkapacitet. Jag tror inte finländarna håller med om att det påverkar fertiliteten, säger endokrinologen och testosteron-experten Mikael Lehtihet.  Killar med lågt värde är manligare Testosteronvärden varierar över dagen och är beroende av en mängd faktorer förutom just värme. Dock kopplas det ofta till manlighet, välbefinnande och muskelbyggande, men enligt Mikael Lehtihet är det en missuppfattning att högre nivåer automatiskt är ett tecken på manlighet. Killar som säger \"jag har jättehögt testosteronvärde\" har sämre affinitet på själva receptorn för det. Att ha högt testosteronvärde betyder alltså att man har sämre receptorer för hormonet, killar som har ett lågt värde är egentligen manligare. Det är tvärsemot, men det är inte så populärt att säga.  Men trots det menar han samtidigt att det finns en man som kan gynnas av is-trenden.  De män som aktivt försöker skaffa barn och är ofrivilligt barnlösa och lämnat spermaprov och ligger på gränsen, för dem kan det vara bra. Det gäller ungefär fem procent av männen som har svårt att bli pappa på naturligt sätt, säger professor och endorkinologen Mikael Lehtihet.", "link": "https://www.tv4.se/artikel/3aGnnL2xKm0QhBZh9EJME4/iskall-pung-i-bastun-trendar-expertens-diss", "date_display": "2026-04-06", "date_iso": "2026-04-06T17:34:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/bastu", "/trender"]}, {"id": 125, "title": "Trump: Iran can be \"wiped out\" overnight", "summary": "\"They have until tomorrow. We'll see what happens\"", "title_original": "Trump: Iran kan ”utplånas” på en natt", "summary_original": "”De har till i morgon på sig. Vi får se vad som händer”", "link": "https://www.tv4.se/artikel/EJXOK04d2aJZpagR9OoaL/trump-iran-kan-utplanas-pa-en-natt-blir-kanske-i-morgon", "date_display": "2026-04-06", "date_iso": "2026-04-06T17:29:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 126, "title": "Draft Dylan song found in Allen Ginsberg's book", "summary": "Almost sixty years after it was written, a draft of the lyrics to Bob Dylan's song \"I'm not there\" has been discovered - tucked into a paperback by the poet Allen Ginsberg, writes The Guardian.", "title_original": "Utkast till Dylan-låt hittad i Allen Ginsbergs bok", "summary_original": "Nästan sextio år efter att den skrevs har ett utkast av texten till Bob Dylans låt ”I’m not there” upptäckts – instoppat i en pocketbok av poeten Allen Ginsberg, skriver The Guardian.", "link": "https://www.sydsvenskan.se/noje/utkast-till-dylan-lat-hittad-i-allen-ginsbergs-bok/", "date_display": "2026-04-06", "date_iso": "2026-04-06T17:15:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "This is how the EU wants to open the Strait of Hormuz", "summary": "No one doubts that the EU would like to act to make it safe for merchant shipping to pass through the Strait of Hormuz as soon as possible. But despite weeks of discussions, there is still no plan. However, there is no shortage of options – even if none of them seem feasible at the moment.", "title_original": "Så vill EU öppna Hormuzsundet", "summary_original": "Ingen tvivlar på att EU skulle vilja agera för att det så snart som möjligt blir säkert för handelssjöfarten att passera Hormuzsundet. Men trots veckor av diskussioner finns det ännu ingen plan. Det saknas dock inte alternativ – även om inget av dem verkar genomförbart i nuläget.", "link": "https://www.dn.se/varlden/sa-vill-eu-oppna-hormuzsundet/", "date_display": "2026-04-06", "date_iso": "2026-04-06T17:00:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Economist warns of the new food VAT – points out the sneaky loophole", "summary": "The food VAT on takeaway food was reduced last week from 12 to 6 percent, while food eaten on site still has 12 percent VAT. For restaurants and cafes, this means new boundaries and more administration, says Rutger Brattström at think tank Timbro.  - It is not as if Sweden will perish now. But it will be bureaucratic hell for restaurant owners when there are several different VAT rates to deal with, says Rutger Brattström, project manager in international market economy at the liberal think tank Timbro. Loopholes arise The reduction has also raised questions about how it should be handled in practice in restaurants and cafes - and received criticism.  Brattström points out that there may be loopholes that guests can take advantage of, as it is now easier than before to choose \"take away\" but still eat on site - especially when self-ordering. - As an individual you may not be doing anything criminal, but as a restaurant owner you are guilty of errors in the bookkeeping, says Brattström. When three different VAT rates have to be handled for alcohol, food and takeaway food, it can also get messy in the bookkeeping for cafe and restaurant owners. It also means extra costs for paperwork linked to the bookkeeping, says Brattström. - Many hours will needlessly go into handling this in the accounting. According to him, how big the problem will be depends on how strict the Swedish Tax Agency is in its controls. Skettejurist: \"No crime\" According to tax lawyer Kerstin Alvesson, it is the restaurants that are responsible for following the rules. As a customer, you are not guilty of a tax offense if you choose \"takeaway\", but eat on site. - If the restaurants do everything they can to do the right thing, and don't put this into the system, you can't demand much more. But if, for example, we see that a restaurant systematically registers \"take away\" at the same time as the premises are full, then we will act, says Kerstin Alvesson. - It is the time of sale that decides, then the customer can either choose to bring or", "title_original": "Ekonom varnar för nya matmomsen – pekar ut luriga kryphålet", "summary_original": "Matmomsen på hämtmat sänktes förra veckan från 12 till 6 procent, medan mat som äts på plats fortsatt har 12 procents moms. För restauranger och caféer innebär det nya gränsdragningar och mer administration, menar Rutger Brattström vid tankesmedjan Timbro.  – Det är inte som att Sverige kommer gå under nu. Men det kommer bli ett byråkratiskt helvete för restaurangägare när det blir flera olika momssatser att förhålla sig till, säger Rutger Brattström, projektledare i internationell marknadsekonomi vid den liberala tankesmedjan Timbro. Uppstår kryphål Sänkningen har också väckt frågor om hur den ska hanteras i praktiken på restauranger och caféer – och fått kritik.  Brattström pekar på att det kan uppstå kryphål som gäster kan utnyttja, eftersom det nu är lättare än tidigare att välja ”ta med” men ändå äta på plats – särskilt vid självbeställning. – Som individ gör man kanske inget brottsligt, men som restaurangägare gör man sig skyldiga till fel i bokföringen, säger Brattström. När tre olika momssatser ska hanteras för alkohol, mat och hämtmat kan det också bli rörigt i bokföringen för café- och restaurangägare. Det innebär också extrakostnader för pappersarbete kopplat till bokföringen, menar Brattström. – Många timmar kommer i onödan att gå till att hantera detta i bokföringen. Hur stort problemet blir beror enligt honom på hur hårda Skatteverket är i sina kontroller. Skettejuristen: ”Inget brott” Enligt skattejuristen Kerstin Alvesson är det restaurangerna som bär ansvaret för att reglerna följs. Som kund gör man sig inte skyldig till skattebrott om man väljer ”takeaway”, men äter på plats. – Om restaurangerna gör allt de kan för att göra rätt, och inte sätter det här i system, kan man inte kräva så mycket mer. Men om vi till exempel ser att någon restaurang systematiskt registrerar ”ta med” samtidigt som det är fullt i lokalen, då kommer vi att agera, säger Kerstin Alvesson. – Det är försäljningstillfället som avgör, då kan kunden antingen välja att ta med eller äta på plats. Sen om man väljer att äta på plats gör man sig inte skyldig till något brott, fortsätter hon. I dagsläget har Skatteverket inte planerat några utökade kontroller med anledning av detta, berättar Alvesson. – Hur ska vi göra? Sitta vid kassan och titta? Kontrollerna måste vara rimliga, säger hon Alvesson tror inte att förändringen kommer att skapa något större problem. Regeln har dock precis trätt i kraft, betonar hon. ”Kan själva avgöra” Brattström menar att momsen borde vara densamma i hela landet. Han anser också att staten inte ska gå in och gynna vissa näringsidkare. – Människor är själva bäst på att avgöra vilka behov de har och vad de vill köpa. De köper själva vad de är sugna på. Regeringen har konstaterat att de nya momssatserna leder till ökade administrativa kostnader. Enligt vissa beräkningar rör det sig om runt 400 miljoner kronor.", "link": "https://www.tv4.se/artikel/4lSOPw5Ec7FZaTS8auiEVm/ekonom-varnar-foer-nya-matmomsen-pekar-ut-luriga-kryphalet", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:52:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/ekonomi", "/sankt-matmoms", "/matmoms", "/matpriserna"]}, {"id": 129, "title": "Annika Ström Melin: The French left-wing leader's flirtation with anti-Semitism is leading Europe straight to hell", "summary": "Anti-Semitism is on the rise in Europe. The French left-wing leader Mélenchon is responsible for that. THE COLUMN. Annika Ström Melin is a journalist and independent columnist on Dagens Nyheter's editorial page.", "title_original": "Annika Ström Melin: Franske vänsterledarens flirt med antisemitismen leder Europa käpprätt åt helvete", "summary_original": "Antisemitismen ökar kraftigt i Europa. Den franske vänsterledaren Mélenchon har ett ansvar för det. KOLUMNEN. Annika Ström Melin är journalist och fristående kolumnist på Dagens Nyheters ledarsida.", "link": "https://www.dn.se/ledare/annika-strom-melin-franske-vansterledarens-flirt-med-antisemitismen-leder-europa-kappratt-at-helvete/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:51:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Trump's prestige building is stopped - gone too fast", "summary": "Too high, too wide, too few doors, too many pillars. And more than twice the size of the White House. President Trump's construction of a bulky ballroom has been rushed through all instances and tweaked to the last detail. After extensive criticism, a judge has put his foot down.", "title_original": "Trumps prestigebygge hejdas – gått för fort", "summary_original": "För högt, för brett, för få dörrar, för många pelare. Och mer än dubbelt så stort som Vita huset. President Trumps bygge av en skrymmande balsal har skyndats igenom alla instanser och justerats in i det sista. Efter omfattande kritik har en domare satt ned foten.", "link": "https://www.sydsvenskan.se/varlden/trumps-prestigebygge-hejdas-gatt-for-fort/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:45:38+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "World Cup qualifying hero injured when Djurgården won: \"Suffering with him\"", "summary": "He was involved in lowering Poland into the playoffs. However, the dream of a WC summer in North America may have come to naught for Gustav Lundgren. The Gais star was injured before the Allsvenskan premiere, which Djurgården eventually won 1–0 at Gamla Ullevi. - The hamstring seems to have snapped, he tells TV4 Play after Gai's opening loss against Djurgården (0-1).", "title_original": "VM-kvalhjälten skadad när Djurgården vann: ”Lider med honom”", "summary_original": "Han var med och sänkte Polen i playoff. Drömmen om en VM-sommar i Nordamerika kan dock ha gått i kras för Gustav Lundgren. Gais-stjärnan skadade sig inför den allsvenska premiären som Djurgården till slut vann med 1–0 på Gamla Ullevi. – Hälsenan verkar ha gått av, säger han till TV4 Play efter Gais premiärförlust mot Djurgården (0–1).", "link": "https://www.dn.se/sport/vm-kvalhjalten-skadad-nar-djurgarden-vann-lider-med-honom/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:34:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Large increase in treatment for menopausal symptoms", "summary": "The number of women who are treated with hormones for menopausal symptoms has doubled in the last ten years, reports SVT Nyheter.", "title_original": "Stor ökning av behandling mot klimakteriebesvär", "summary_original": "Antalet kvinnor som behandlas med hormoner mot klimakteriebesvär har fördubblas de senaste tio åren, rapporterar SVT Nyheter.", "link": "https://www.sydsvenskan.se/sverige/stor-okning-av-behandling-mot-klimakteriebesvar/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Trump: \"Iran can be knocked out overnight\"", "summary": "Iran rejects the ceasefire proposal. At the same time, Donald Trump says that the deadline for the regime in Tehran to open the Strait of Hormuz is fixed: Tuesday. - Iran can be knocked out in one evening. It could be tomorrow night, says the president.", "title_original": "Trump: ”Iran kan slås ut på en kväll”", "summary_original": "Iran avvisar förslaget om vapenvila. Samtidigt säger Donald Trump att tidsfristen för regimen i Teheran att öppna Hormuzsundet står fast: tisdag. – Iran kan slås ut under en kväll. Det kan bli i morgon kväll, säger presidenten.", "link": "https://www.dn.se/varlden/iran-avvisar-forslag-trumps-tidsfrist-pa-vag-rinna-ut/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:20:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Russian air defense is not enough against drone attacks", "summary": "Russia is finding it difficult to protect its oil facilities from repeated attacks. The recent raids have meant a shift – now it is Ukraine that fires the most drones across the border, according to military analyst Jörgen Elfving. - Russia has a problem here, he says.", "title_original": "Ryska luftförsvaret räcker inte till mot drönaranfall", "summary_original": "Ryssland har svårt att freda sina oljeanläggningar från återkommande angrepp. Den senaste tidens räder har inneburit ett skifte – nu är det Ukraina som avfyrar flest drönare över gränsen, enligt militäranalytikern Jörgen Elfving. – Här har Ryssland problem, säger han.", "link": "https://www.dn.se/varlden/ryska-luftforsvaret-racker-inte-till-mot-dronaranfall/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:11:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Can the keto diet improve mental health?", "summary": "Can the keto diet cure schizophrenia? At least that's what US Health Secretary Robert F. Kennedy Jr. claimed recently. Experts find out how good the keto diet really is for mental health.", "title_original": "Kan ketodieten förbättra den psykiska hälsan?", "summary_original": "Kan ketodieten bota schizofreni? Det påstod i alla fall USA:s hälsominister Robert F Kennedy Jr nyligen. Experter reder ut hur bra ketodieten egentligen är för den mentala hälsan.", "link": "https://www.dn.se/sverige/kan-ketodieten-forbattra-den-psykiska-halsan/", "date_display": "2026-04-06", "date_iso": "2026-04-06T16:08:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Big waves and high water levels - see the pictures from Dave here", "summary": "When life throws you waves - go out and surf. In the port of Mölle, several people have taken out the board and taken advantage of storm Dave's dramatic waves. See the pictures from the Skåne coast here.", "title_original": "Stora vågor och högt vattenstånd – se bilderna från Dave här", "summary_original": "När livet ger dig vågor – gå ut och surfa. I hamnen i Mölle har flera personer plockat fram brädan och tagit vara på stormen Daves dramatisk vågor. Se bilderna från den skånska kusten här.", "link": "https://www.sydsvenskan.se/stora-vagor-och-hogt-vattenstand-se-bilderna-fran-dave-har/", "date_display": "2026-04-06", "date_iso": "2026-04-06T15:29:35+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Increased use of Ozempic could cause grocery stores billions in losses", "summary": "The use of the weight loss drug GLP-1, such as Ozempic, is increasing in Sweden. In 2025, the number of users tripled compared to the year before, says analyst William Lindquist. - It is increasing avalanche-like and there is no slowdown in sight, rather the opposite. Billions in reduced revenue The fact that more and more Swedes use appetite-suppressing medications can mean dramatic revenue losses for grocery stores, which Arbetet was the first to report on. William Lindquist has calculated what effects the Ozempic wave could have for the Swedish grocery trade.  According to a study from the US, people taking GLP-1 drugs reduce their food expenditure by over five percent.  - At the current level in Sweden, it would have meant a loss of sales in the grocery trade of SEK 1.7 billion every year, says Lindquist. 7.5 percent of Swedish households, corresponding to 350,000 households, use GLP-1 drugs today. And another 15 percent are interested in testing, says William Lindquist. - Then there will be major effects for large parts of Swedish trade. The drug not only suppresses cravings for food and sweets, alcohol consumption can also decrease. Effects in the USA: \"Ozempic menus\" The effects of GLP-1 are already clearly felt on the market, above all in the USA where use is more widespread.  - In the US, restaurants offer Ozempic menus with smaller portions and food manufacturers launch frozen meals tailored to target GLP-1 users. Food companies are seeing big changes, says William Lindquist, taking Mars as an example, the company that manufactures Snickers. - Mars sees GLP-1 as the strongest contributor to its reduced sales. The cause is mainly suppressed appetite and sweet tooth. \"More money for fruit and vegetables\" While product categories such as sweets, soft drinks and ice cream seem to be hit hardest, other consumption can be stimulated at the same time. - If we expect the sale of food to go down, we will have more money left over for example fruit and vegetables and healthier things. Do we save money within daily life?", "title_original": "Ökat användande av Ozempic kan ge mataffärer miljardförluster", "summary_original": "Användandet av viktminskningsläkemedlet GLP-1, som till exempel Ozempic, ökar i Sverige. Under 2025 tredubblades antalet användare jämfört med året innan, säger analytikern William Lindquist. – Det ökar lavinartat och det finns ingen avmattning i sikte, snarare tvärtom. Miljarder i minskade intäkter Att allt fler svenskar använder aptithämmande mediciner kan innebära dramatiska intäktsförluster för matbutikerna, vilket Arbetet var först att rapportera om. William Lindquist har på räknat på vad Ozempicvågen kan få för effekter för den svenska dagligvaruhandeln.  Enligt en studie från USA minskar personer som tar GLP-1-läkemedel sina matutgifter med över fem procent.  – Med den nuvarande nivån i Sverige hade det inneburit ett försäljningstapp i dagligvaruhandeln på 1,7 miljarder kronor varje år, säger Lindquist. 7,5 procent av svenska hushåll, motsvarande 350 000 hushåll, använder GLP-1-läkemedel idag. Och ytterligare 15 procent är intresserade av att testa, säger William Lindquist. – Då kommer det få stora effekter för stora delar svensk handel. Läkemedlet dämpar inte bara suget på mat och sötsaker, även alkoholkonsumtionen kan gå ner. Effekter i USA: ”Ozempicmenyer” Effekterna av GLP-1 märks redan tydligt på marknaden, framför allt i USA där användningen är mer utbredd.  – I USA erbjuder restauranger Ozempicmenyer med mindre portioner och matproducenter lanserar frysmåltider anpassade riktade till GLP-1-användare. Livsmedelsbolag ser stora förändringar, säger William Lindquist och tar Mars som exempel, företaget som tillverkar Snickers. – Mars ser GLP-1 som den starkast bidragande orsaken till sin minskade försäljning. Orsaken är främst dämpad aptit och sötsug. ”Mer pengar till frukt och grönt” Medan varukategorier som godis, läsk och glass verkar drabbas hårdast kan samtidigt annan konsumtion stimuleras. – Om vi räknar med att försäljningen av mat går ner kommer vi få mer pengar över till exempelvis frukt och grönt och nyttigare saker. Sparar vi pengar inom dagligvaruhandel kan vi lägga mer på mode och saker till hemmet. Jag tror vi kommer få se en omfördelning, säger William Lindquist. Även apoteken kan gynnas när GLP-1-läkemedlen blir mer tillgängliga. – Det man ser nu är att det går från sprutform till tablettform. Det innebär att man öppnar för en långt mycket större målgrupp. Många har sprutfobi och tycker det är lättare att ta tabletter. Det bådar gott för apoteken på sikt, även om vi är i et tidigt skede, säger Lindquist.", "link": "https://www.tv4.se/artikel/32tzn6OJ8YCQUKIImpOW9n/oekat-anvaendande-av-ozempic-kan-innebaera-miljardfoerluster-foer", "date_display": "2026-04-06", "date_iso": "2026-04-06T15:26:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/glp-1", "/ozempic", "/handel", "/hui-research", "/lakemedel", "/svensk-ekonomi"]}, {"id": 138, "title": "Masskrock on the E22 after a sandstorm: \"Like a fog bank\"", "summary": "16 vehicles were involved in the mass collision on the E22, SOS Alarm tells TV4. Five people have been taken to hospital, but the condition of the injured remains unclear. Another 20-25 people have been taken to temporary premises in the area to be examined by paramedics, according to SOS Alarm. According to the emergency services, a sandstorm may be behind the traffic accident.  - Visibility is poor for the cars when the sand from the fields blows onto the road, says the emergency services' alarm operator.  The police: About 20 vehicles are driving in the opposite direction - There is a collision in both directions. There are more than 13 vehicles involved, but not all of them need to be recovered. Traffic is completely at a standstill, says Evelina Olsson, police spokesperson at police region South. According to the police, around 20 cars in the queue turned and drove in the opposite direction after the collision.  - We urge everyone not to do this. We must deal with those who drive against the direction of travel, says Evelina Olsson.  \"Like driving into a fog bank\" TV4 Nyheterna has spoken to Renée Landén who was on her way home to Ronneby after celebrating Easter with her grandchildren in Kristianstad. When TV4 Nyheterna reaches her, she has been sitting alone in the car since shortly after 4 p.m.  - I see the clouds of smoke further ahead in the traffic. When I drove from Kristianstad, it was like driving in a heavy fog bank. It blows strongly with soil from the fields on the side of the road, says Renée Landén.  No forecast The police do not yet have any information on how the traffic accident occurred, but according to the emergency services, a sandstorm may be the cause.  - We are investigating this and talking to people on site. This is no ordinary traffic accident, says Evelina Olsson.  There is still no forecast for when traffic can be allowed to open again.", "title_original": "Masskrock på E22 efter sandstorm: ”Som en dimbank”", "summary_original": "16 fordon var inblandade i masskrocken på E22, uppger SOS Alarm för TV4. Fem personer har förts till sjukhus men skadeläget på de drabbade personerna är fortsatt oklart. Ytterligare mellan 20-25 personer har förts till tillfälliga lokaler i området för att undersökas av ambulanspersonal, enligt SOS Alarm. Enligt räddningstjänsten kan en sandstorm ligga bakom trafikolyckan.  – Det blir dålig sikt för bilarna när sanden från åkrarna blåser på vägen, säger räddningstjänstens larmoperatör.  Polisen: 20-tal fordon kör mot färdriktningen – Det är en krock i båda riktningarna. Det är fler än 13 fordon som är inblandade men alla behöver inte bärgas. Det är helt stopp i trafiken, säger Evelina Olsson, polisens presstalesperson på polisregion Syd. Enligt polisen vände ett 20-tal personbilar i bilkön och körde mot färdriktningen efter krocken.  – Vi uppmanar alla att inte göra detta. De som kör mot färdriktningen ska vi hantera, säger Evelina Olsson.  ”Som att köra in i en dimbank” TV4 Nyheterna har pratat med Renée Landén som var på väg hem till Ronneby efter påskfirande med barnbarnen i Kristianstad. När TV4 Nyheterna når henne har hon suttit ensam i bilen sedan strax efter 16-tiden.  – Jag ser rökmolnen längre fram i trafiken. När jag körde från Kristianstad var det som att köra i en kraftig dimbank. Det blåser kraftigt med jord från åkrarna vid sidan av vägen, säger Renée Landén.  Ingen prognos Polisen har ännu inga uppgifter om hur trafikolyckan inträffade men enligt räddningstjänsten kan en sandstorm vara orsaken.  – Vi håller på att utreda detta och pratar med folk på plats. Det här är ingen vanlig trafikolycka, säger Evelina Olsson.  Än finns ingen prognos på när trafiken kan släppas på igen.", "link": "https://www.tv4.se/artikel/YJjIKXaRVDqNazpZlbpYw/trafikstopp-efter-stor-krock-pa-e22-folk-koer-mot-faerdriktningen", "date_display": "2026-04-06", "date_iso": "2026-04-06T15:04:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/trafik", "/trafikolyckor", "/trafikolycka"]}, {"id": 139, "title": "Historic in night - has circled the moon: \"Sci-fi\"", "summary": "During the night of Tuesday Swedish time, the crew of the Artemis II expedition circled the moon. A historic expedition where they were further away from Earth than any human had been before.", "title_original": "Historiska i natt – har rundat månen: ”Sci-fi”", "summary_original": "Under natten till tisdag svensk tid rundade besättningen i expedition Artemis II månen. En historisk expedition där de var längre bort från jorden än någon människa varit tidigare.", "link": "https://www.svd.se/a/y55W9g/artemis-ii-rundar-manen-under-natten-mot-tisdag", "date_display": "2026-04-06", "date_iso": "2026-04-06T15:02:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 140, "title": "Swedish man dies in avalanche accident", "summary": "A Swedish man has died after an avalanche at a ski resort in Norwegian Hemsedal on Monday, Norwegian police confirm. Relatives have been notified.  - Two people have been confirmed dead. A Norwegian woman in her 20s and a Swedish man in his 30s, says Marius Fosvold, head of operations at the Norwegian police. The alarm came in at 11 o'clock. Seven people were swept away in the avalanche Of the group of seven people, four were swept away in the avalanche. - Two received cardiopulmonary resuscitation on the spot, but their lives could not be saved. Two were taken to the doctor's office and are not seriously injured, says Fosvold. An orange avalanche warning had been issued for the area on Easter Monday.  - There is a significant risk of avalanches in the area, says Fosvold. According to the police, the group had been on a peak trip outside the prime area.", "title_original": "Svensk man död i lavinolycka", "summary_original": "En svensk man har dött efter lavin på en skidort i norska Hemsedal under måndagen, bekräftar norsk polis. Anhöriga är underrättade.  – Två personer är bekräftat omkomna. En norsk kvinna i 20-årsåldern och en svensk man i 30-årsåldern, säger Marius Fosvold, operationsledare vid norska polisen. Larmet inkom vid 11-tiden. Sju personer drogs med i lavinen Av gruppen på sju personer drogs fyra med i skredet. – Två fick hjärt- och lungräddning på plats, men deras liv gick inte att rädda. Två kördes till läkarmottagningen och är inte allvarligt skadade, säger Fosvold. En orange varning för lavin hade utfärdats för området under annandag påsk.  – Det är betydlig snöskredsfara i området, säger Fosvold. Enligt polisen hade gruppen varit på en topptur utanför utmärkt område.", "link": "https://www.tv4.se/artikel/5xCYxdfiFOXA1ixGLRJkGd/svensk-man-doed-i-lavinolyckan-i-norge", "date_display": "2026-04-06", "date_iso": "2026-04-06T14:19:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/olycka", "/lavin", "/norge"]}, {"id": 141, "title": "Storm Dave canceled and moved church services in western Sweden", "summary": "In Hyssna in Västergötland, the sheet metal in the church tower came off", "title_original": "Stormen Dave gav inställda och flyttade gudstjänster i västra Sverige", "summary_original": "I Hyssna i Västergötland lossnade plåten i kyrkotornet", "link": "https://www.dagen.se/nyheter/stormen-dave-gav-instaellda-och-flyttade-gudstjaenster-i-vaestra-sverige/10283235", "date_display": "2026-04-06", "date_iso": "2026-04-06T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Israel: \"Powerful\" attack has been directed at gas plant in Iran", "summary": "The war escalates ahead of Trump's deadline", "title_original": "Israel: ”Kraftfullt” angrepp har riktats mot gasanläggning i Iran", "summary_original": "Kriget trappas upp inför Trumps tidsfrist", "link": "https://www.tv4.se/artikel/1W8EWLDd7qW2GwKVGITcOT/kriget-trappas-upp-infoer-trumps-tidsfrist", "date_display": "2026-04-06", "date_iso": "2026-04-06T13:10:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "Terrible winds on the coast - worst measured: \"Not wise\"", "summary": "Roof came loose and fell down • See the pictures • \"Shaked like thunder\"", "title_original": "Skräckvindar på kusten – värsta som uppmätts: ”Inte klokt”", "summary_original": "Tak lossnade och föll ner • Se bilderna • ”Skakade som om det var åska”", "link": "https://www.tv4.se/artikel/79AGHAEbXyrf5tmdCcHmL2/skraeckvindar-pa-kusten-vaersta-pa-45-ar-det-var-inte-klokt", "date_display": "2026-04-06", "date_iso": "2026-04-06T12:13:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 144, "title": "The Swedish Medicines Agency warns of \"life-saving\" airway cleaners", "summary": "The Swedish Medicines Agency and the CPR Council warn against the use of airway cleaners as an alternative aid when someone chokes - and believe that they can do more harm than good. Emergency nurse Camilla Thurell agrees. - We don't know enough about these. There is not enough evidence to say that they would be as safe as our guidelines for CPR in Sweden, she says. The airway cleaner should create a vacuum when placed over the mouth that should easily pull the object out when pressed. - The function itself may work, but we have to put this in context. The big thing and the important thing to point out is that it is not recommended by the industry and our guidelines in Sweden and not in Europe - yet, says Camilla Thurell. The delay is the critical moment In addition, it can take time to remember where you put your air purifier and manage to retrieve it before it is too late. - We have seconds, we have minutes before we have brain damage and actually death. The product is approved by various authorities and CE marked. But that is not enough, says Camilla Thurell. - A CE mark is only basic safety criteria for it to be sold. It is not a matter of it being recommended in guidelines, because then independent research and large studies are required. - It becomes a false sense of security, as if then me and my family are safe. But it doesn't jump out of the kitchen drawer. You must have knowledge. Everything that is about life or death you need to practice, says Camilla Thurell.", "title_original": "Läkemedelsverket varnar för ”livräddande” luftvägsrensare", "summary_original": "Läkemedelsverket och HLR-rådet varnar för användningen av luftvägsrensare som alternativt hjälpmedel när någon sätter i halsen – och menar att de kan göra mer skada än nytta. Akutsjuksköterskan Camilla Thurell håller med. – Vi vet inte tillräckligt  mycket om de här. Det finns inte tillräckligt mycket evidens för att säga att de skulle vara lika säkra som våra riktlinjer för hjärt-lungräddning i Sverige, säger hon. Luftvägsrensaren ska skapa ett vakuum när man sätter den över munnen som enkelt ska dra ut föremålet när man trycker till. – Funktionen i sig kanske fungerar, men vi måste sätta det här i ett sammanhang. Det stora och det viktiga att poängtera det är ju att den inte är rekommenderad av branschen och våra riktlinjer i Sverige och inte i Europa – än, säger Camilla Thurell. Fördröjningen kritiska momentet Dessutom kan det ta tid att komma ihåg var man lagt sin luftrensare och hinna hämta den innan det är försent. – Vi har sekunder, vi har minuter innan vi har hjärnskador och faktiskt död. Produkten är godkänd av olika myndigheter och CE-märkt. Men det räcker inte, säger Camilla Thurell. – En CE-märkning är bara grundläggande säkerhetskriterier för att den ska få säljas. Det handlar inte om att den är rekommenderad i riktlinjer för då krävs oberoende forskning och stora studier. – Det blir en falsk trygghet, som att då är jag och min familj trygg. Men den hoppar inte upp ur kökslådan. Du måste ha kunskap. Allt som handlar om liv eller död behöver du öva på, säger Camilla Thurell.", "link": "https://www.tv4.se/artikel/3b91NPijSBEQfL0YK5rVDi/laekemedelsverket-varnar-foer-livraeddande-luftvaegsrensare", "date_display": "2026-04-06", "date_iso": "2026-04-06T11:46:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/hlr", "/livraddning"]}, {"id": 145, "title": "Here the ship fights the storm - see the dramatic images", "summary": "The rescue manager: \"Exceptional circumstances\"", "title_original": "Här kämpar fartyget mot stormen – se dramatiska bilderna", "summary_original": "Räddningsledaren: ”Exceptionella omständigheter”", "link": "https://www.tv4.se/artikel/610kK4gBmmVU1yHA3Nm4b5/dramatiska-bilderna-haer-oevar-sjoefartsverket-mitt-i-stormen", "date_display": "2026-04-06", "date_iso": "2026-04-06T11:25:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 146, "title": "Hero Rat is honored with its own statue", "summary": "The stone statue was unveiled in Siem Reap, Cambodia, in conjunction with International Mine Awareness Day, which falls on April 4. Magawa, a giant African possum, lived to be eight years old – five of which he spent detecting mines and other explosives. During his career, which began in 2016, he found over 100 land mines and contributed to making large areas of the country safer, the BBC writes.  20 football pitches Using his keen sense of smell, Magawa was able to detect chemical substances in explosives and signal to his human colleagues, who then defused the mines.  In total, he searched more than 141,000 square meters of land - the equivalent of about 20 football pitches - and was able to search an area the size of a tennis court in just 20 minutes, according to the BBC.  Magawa was trained by the Belgian charity Apopo, which since the 1990s has been training so-called HeroRATS, and HeroDOGS, in detecting mines.  Thanks to their light weight, the rats are not heavy enough to trigger explosive charges, making them a safer option than humans when clearing mines. Awarded In 2020, Magawa was awarded the prestigious PDSA Gold Medal, often referred to as the \"George Cross for Animals\", for his life-saving efforts. He thus became the first rat to receive the award in the organization's history. Shortly after that, he retired and then, according to Apopo, \"started to take it a little easier\". Magawa passed away in 2022. But his legacy lives on. Another Apopo-trained rat, Ronin, set a new record in 2025 by detecting 109 landmines and 15 unexploded ordnance. Apopo's rats are also used in other missions. For example, they can detect tuberculosis significantly faster than traditional laboratory methods and have been trained to counter illegal wildlife trade in Tanzania. 1,000,000 live on mined land Despite progress, landmines, left over from the Vietnam War and subsequent conflicts in Cambodia in the 60s, 70s and 80s, remain a major problem.  According to the UN, live and", "title_original": "Hjälteråtta hedras med egen staty", "summary_original": "Stenstatyn avtäcktes i Siem Reap i Kambodja i samband med den internationella dagen för minmedvetenhet som infaller den 4 april. Magawa, en afrikansk jättepåsråtta, blev åtta år gammal – fem av dem arbetade han med att upptäcka minor och andra sprängämnen. Under sin karriär, som inleddes 2016, hittade han över 100 landminor och bidrog till att göra stora områden i landet säkrare, skriver BBC.  20 fotbollsplaner Med hjälp av sitt skarpa luktsinne kunde Magawa upptäcka kemiska ämnen i sprängmedel och signalera till sina mänskliga kollegor, som sedan oskadliggjorde minorna.  Totalt genomsökte han mer än 141 000 kvadratmeter mark – motsvarande ungefär 20 fotbollsplaner – och kunde söka av ett område stort som en tennisbana på bara 20 minuter, enligt BBC.  Magawa tränades av den belgiska välgörenhetsorganisationen Apopo, som sedan 1990-talet utbildar så kallade HeroRATS, och HeroDOGS, i att upptäcka minor.  Tack vare sin låga vikt är råttorna inte tillräckligt tunga för att utlösa sprängladdningar, vilket gör dem till ett säkrare alternativ än människor vid minröjning. Prisades År 2020 tilldelades Magawa den prestigefyllda PDSA-guldmedaljen, ofta kallad ”George Cross för djur”, för sin livräddande insats. Han blev därmed den första råttan att få utmärkelsen i organisationens historia. Strax efter det pensionerades han och började då, enligt Apopo, ”ta det lite lugnare”. Magawa avled 2022. Men arvet efter honom lever vidare. En annan Apopo-tränad råtta, Ronin, slog 2025 nytt rekord genom att upptäcka 109 landminor och 15 oexploderade sprängämnen. Apopos råttor används även i andra uppdrag. De kan till exempel upptäcka tuberkulos betydligt snabbare än traditionella laboratoriemetoder och har tränats för att motverka illegal handel med vilda djur i Tanzania. 1 000 000 vistas på minerad mark Trots framsteg är landminor, som blivit kvar efter Vietnamkriget och efterföljande konflikter i Kambodja under 60-, 70- och 80-talet, fortfarande ett stort problem.  Enligt FN lever och arbetar över en miljon människor i landet fortfarande på mark som är förorenad av minor och oexploderade stridsmedel. – Monumentet för Magawa är en påminnelse till det internationella samfundet om att det fortfarande finns arbete kvar att göra, sade Apopos programchef i Kambodja, Michael Raine, under invigningen av statyn.  Kambodja har som mål att vara fritt från minor till år 2030.", "link": "https://www.tv4.se/artikel/5FiumrRsHizeoDLZfc3yR5/haer-hedras-hjaelterattan-med-egen-staty", "date_display": "2026-04-06", "date_iso": "2026-04-06T10:30:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/rattor", "/kambodja"]}, {"id": 147, "title": "The virus mutation \"Cicada\" has reached Sweden: \"The protection seems to be enough\"", "summary": "A new variant of the coronavirus, BA.3.2 – also called the cicada variant – has been identified in about 23 countries since it was first detected in South Africa in late 2024, according to the US CDC. Despite information that in some countries the variant seems to spread more often among children, there is currently nothing to indicate an increased risk of serious illness, according to Ali Mirazimi, virus researcher at the Karolinska Institute. - There are new variants all the time. This one appeared in 2024 and, based on the information we have, has been identified in about 23 countries. It's really nothing remarkable, he says. Has been demonstrated in Sweden BA.3.2 has also been demonstrated in Sweden. According to the Public Health Agency, the variant has been identified in a limited number of patient samples since last winter and also measured in waste water. At the same time, the authority assesses that the spread of covid‑19 in Sweden is low and that BA.3.2 does not entail any increased risk of serious disease compared to other circulating variants. Current vaccines are expected to continue to provide protection against severe covid‑19. Despite the lack of monitoring, Mirazimi sees no risk from a preparedness perspective. - We still know that the vaccines work, and that the protection we have built up through vaccinations and previous infections is good enough. It poses no danger to society, he says. However, he believes that knowledge of new varieties is still important from a research point of view. - In terms of research, it is of course interesting to know which variants are circulating, says Mirazimi. Still omicron – protection is enough BA.3.2 still belongs to the omicron family, but has more mutations than some previous variants. Nevertheless, neither Swedish nor international data point to the variant causing more serious disease. - Based on the available data, it has not been seen to cause more serious disease. It still belongs to the omicron line. It has more mutations, but that's to be expected. The virus mutates to get around the immune system", "title_original": "Virusmutationen ”Cicada” har nått Sverige: ”Skyddet verkar räcka”", "summary_original": "En ny variant av coronaviruset, BA.3.2 – även kallad cicada‑varianten – har identifierats i omkring 23 länder sedan den först upptäcktes i Sydafrika i slutet av 2024, enligt den amerikanska smittskyddsmyndigheten CDC. Trots uppgifter om att varianten i vissa länder verkar spridas oftare bland barn finns det i nuläget inget som tyder på ökad risk för allvarlig sjukdom, enligt Ali Mirazimi, virusforskare vid Karolinska institutet. – Det kommer nya varianter hela tiden. Den här dök upp under 2024 och har, baserat på den information vi har, identifierats i omkring 23 länder. Det är egentligen inget märkvärdigt, säger han. Har påvisats i Sverige BA.3.2 har också påvisats i Sverige. Enligt Folkhälsomyndigheten har varianten identifierats i ett begränsat antal patientprover sedan i vintras och även uppmätts i avloppsvatten. Samtidigt bedömer myndigheten att smittspridningen av covid‑19 i Sverige är låg och att BA.3.2 inte innebär någon ökad risk för allvarlig sjukdom jämfört med andra cirkulerande varianter. Nuvarande vaccin förväntas fortsatt ge skydd mot svår covid‑19. Trots bristen på övervakning ser Mirazimi ingen risk ur ett beredskapsperspektiv. – Vi vet fortfarande att vaccinerna fungerar, och att det skydd vi byggt upp genom vaccinationer och tidigare infektioner är tillräckligt bra. Det innebär ingen fara för samhället, säger han. Däremot menar han att kunskap om nya varianter fortfarande är viktig ur forskningssynpunkt. – Forskningsmässigt är det så klart intressant att veta vilka varianter som cirkulerar, säger Mirazimi. Fortfarande omikron – skyddet räcker BA.3.2 tillhör fortsatt omikronfamiljen, men har fler mutationer än vissa tidigare varianter. Ändå pekar varken svenska eller internationella data på att varianten orsakar allvarligare sjukdom. – Baserat på de data som finns har man inte sett att den orsakar allvarligare sjukdom. Den tillhör fortfarande omikron‑linjen. Den har fler mutationer, men det är väntat. Viruset muterar för att ta sig runt immunförsvaret. Vårt skydd verkar fortfarande räcka, säger Mirazimi. Enligt CNN har forskare pekat på att barn kan vara överrepresenterade bland de fall där BA.3.2 identifierats. Men Mirazimi manar till försiktighet. – Det kan bero på att barn generellt inte har exponerats lika mycket för tidigare varianter. Men vi testar och sekvenserar så lite i dag att det är väldigt svårt att dra säkra slutsatser av sådana uppgifter, säger han. För den som oroas av rapporter om en ny variant är budskapet tydligt, enligt Mirazimi. – Man behöver inte vara orolig. Vi har ett väldigt bra skydd i Sverige. De flesta är vaccinerade, och även de som inte är det har sannolikt haft covid flera gånger. Så vi har ett väldigt bra skydd, säger han.", "link": "https://www.tv4.se/artikel/iZezstZszWWef9ufyq2BU/covidmutationen-cicada-har-natt-sverige-skyddet-verkar-raecka", "date_display": "2026-04-06", "date_iso": "2026-04-06T09:22:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/covid-19", "/virus", "/smitta", "/sjukdomar", "/sjukfranvaro"]}, {"id": 148, "title": "The expert: Shock increase in the price of petrol in the spring", "summary": "The price of petrol in Sweden has risen considerably during the winter and spring, where the average price is now close to SEK 19 per litre, and the diesel price at over SEK 23 per litre. The primary reason is the war in Iran and the escalating situation in the Middle East, which disrupts oil production and exports through areas such as the Strait of Hormuz. Gasoline price increased despite peace The only thing that can reverse the trend and bring the price down is peace and the US and the world agreeing with Iran that the Strait of Hormuz be opened, so that oil deliveries can be increased, says Christian Kopfer, commodity analyst at Arctic Securities. Regardless of whether there is peace tomorrow, prices will be at an elevated level. You need to build up stocks again, repair damage and get production up. It is not about prices as high as 110 dollars per barrel, but higher prices than 65-70 dollars per barrel, which was the price level before the Iran war began, is to be expected, he says. The fact that Russia's oil production has also been knocked out by around 10-20 percent has contributed to higher prices in the past week, according to Kopfer.  If the situation remains as it is now, we are heading towards a very serious economic situation, already in the summer, he says, adding that in that case prices will rise significantly. The price of diesel is soaring Since the unrest in the Middle East took off, the price of diesel has gone through a clearly greater rise than petrol. On February 28, the day the US attacked Iran, the price of diesel was SEK 17.30 per litre. Currently, the price per liter is SEK 23.40, which is an increase of around 38 percent since the start of the war. The reason is specific disruptions to the diesel supply, to an even greater extent than the crude oil supply, says Kopfer. You get even less diesel than you get simply from gasoline. According to Kopfer, it is not possible to give any advice to consumers who are worried about the high gas prices and how to fill up the car. However, people and companies can be made aware of the risks that exist, he says. That if this continues", "title_original": "Experten: Chockhöjning av bensinpriset under våren", "summary_original": "Bensinpriset i Sverige har stigit ordentligt under vintern och våren där snittpriset nu ligger på närmare 19 kronor litern, och dieselpriset på över 23 kronor litern. Den primära anledningen är kriget i Iran och den eskalerande situationen i Mellanöstern, som stör oljeproduktionen och exporten genom områden som Hormuzsundet. Höjt bensinpris trots fred Det enda som kan vända utvecklingen och få priset att sjunka är fred och att USA och världen kommer överens med Iran om att Hormuzsundet öppnas, så att man får upp oljeleveranserna, säger Christian Kopfer, råvaruanalytiker på Arctic Securities. Oavsett om det blir fred i morgon kommer priserna att vara på en förhöjd nivå. Man behöver bygga upp lager igen, reparera skador och få upp produktionen. Det handlar inte om så höga priser som 110 dollar per fat, men högre priser än 65–70 dollar per fat, som var prisnivån före Irankriget inleddes, är att vänta, säger han. Att Rysslands oljeproduktion dessutom slagits ut med cirka 10-20 procent har bidragit till att högre pris den senaste veckan, enligt Kopfer.  Om situationen ligger kvar som den gör nu går vi mot ett mycket allvarligt ekonomiskt läge, redan till sommaren, säger han, och tillägger att priserna i så fall kommer att stiga rejält. Dieselpriset rusar Sedan oroligheterna i Mellanöstern tog fart har priset på dieseln genomgått en tydligt större uppgång än bensinen. Den 28 februari, dagen då USA attackerade Iran, var dieselpriset 17,30 kronor per liter. I dagsläget ligger literpriset på 23,40 kronor vilket är en ökning på runt 38 procent sedan krigets start. Orsaken är specifika störningar på dieselutbudet, i ännu högre utsträckning än råoljeutbudet, säger Kopfer. Man får ut ännu mindre diesel än vad man får ut bensin helt enkelt. Det går, enligt Kopfer, inte att ge några råd till konsumenter som oroar sig över de höga bensinpriserna och hur man ska tanka bilen. Däremot kan man göra människor och företag medvetna om riskerna som finns, säger han. Att om detta fortsätter så kommer världsekonomin, Europas ekonomi och den svenska ekonomin ta avsevärd skada i sommar.", "link": "https://www.tv4.se/artikel/tt-260406-oljepris1-579f76ad/experten-vanj-dig-vid-hogt-bensinpris", "date_display": "2026-04-06", "date_iso": "2026-04-06T09:11:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["USA", "/usa", "/sverige", "/iran", "/handelsbanken", "/ekonomi"]}, {"id": 149, "title": "Many misconceptions about ADHD - here are the most common", "summary": "There are many misconceptions about what ADHD should look like. Many believe, for example, that people with ADHD have more energy than others. - Rather, they find it very difficult to portion out their energy so that it comes just enough during the day, but it comes in large portions. Then they are sometimes struck by exhaustion and extreme fatigue, outbursts and meltdowns, says Johanna Goa, behavioral scientist and therapist. \"Especially common in girls\" Goa also says that children with ADHD can keep it together for a whole school day, but when they get home they explode.  - It is very common, especially in girls. I tend to think that it's like shaking a Coke bottle. For every thing that is hard at school that actually takes a lot of effort but that may not be so clearly visible on the outside, this Coke bottle is shaken.  Then when you get home, it's like the lid off and explosion. - But it is also very important for the school to understand that this is what it looks like very often, says Johanna Goa. Difficulty directing focus - not concentration Another misconception is that people with ADHD cannot concentrate on anything. - You can do that very often, but you find it very difficult to direct your focus on what you should perhaps be focusing on. If it feels interesting and exciting, then it is often very easy to concentrate. - It doesn't have to be linked to ADHD, but it becomes more noticeable then because ADHD affects the dopamine flow, which is also affected by this. Combined diagnoses confuse Adhd is also something that is congenital.  - It has nothing to do with upbringing. If you have a combination of diagnoses, such as ADHD and autism, the symptoms can be confusing. - When you have both, it often becomes something completely different. It will be like a completely new diagnosis really.  Many times this adhd side may want stimulation and increased challenges, but then the autism may not really be able to handle that and is very easily overstimulated.", "title_original": "Många missuppfattningar om adhd – här är de vanligaste", "summary_original": "Det finns många felaktiga uppfattningar om hur adhd ska se ut. Många tror exempelvis att personer med adhd har mer energi än andra. – De har snarare väldigt svårt att portionera ut sin energi så att den kommer lagom under dagen, utan den kommer i stora portioner. Då slås de ibland av utmattning och extrem trötthet, utbrott och meltdowns, berättar Johanna Goa, beteendevetare och terapeut. ”Framförallt vanligt hos flickor” Goa säger också att barn med adhd kan hålla ihop det en hel skoldag, men när de kommer hem så exploderar de.  – Det är väldigt vanligt, framförallt hos flickor. Jag brukar tänka lite att det är som att man skakar en colaflaska. För varje sak som är jobbig i skolan som egentligen tar väldigt mycket kraft men som kanske inte syns så tydligt utåt så skakas den här colaflaskan.  Sen när man väl kommer hem, då är det liksom locket av och explosion. –  Men det är också väldigt viktigt för skolan att förstå att så här ser det väldigt ofta ut, säger Johanna Goa. Svårighet att rikta fokus – inte koncentration En annan missuppfattning är att personer med adhd inte kan koncentrera sig på någonting. –  Det kan man väldigt ofta, men man har däremot väldigt svårt att rikta sitt fokus på det som man kanske borde fokusera på. Om det känns intressant och spännande, då är det ofta väldigt lätt att koncentrera sig. – Det behöver inte vara kopplat till adhd men det blir mer påtagligt då eftersom adhd påverkar dopaminflödet som också påverkas av det här. Kombinerade diagnoser förvirrar Adhd är också något som är medfött.  – Det har ingenting med uppfostran att göra. Om man har en kombination av diagnoser, som adhd och autism, kan symptomen förvirra. – När man har båda så blir det ofta någonting helt annat. Det blir som en helt ny diagnos egentligen.  Många gånger kanske den här adhd-sidan vill ha stimulans och ökade utmaningar, men så kanske autismen egentligen inte riktigt klarar av det och blir väldigt lätt överstimulerad.", "link": "https://www.tv4.se/artikel/37nk53W1O2pqqjyttFr5c9/vaeldigt-manga-har-det-inom-sig", "date_display": "2026-04-06", "date_iso": "2026-04-06T08:28:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Hälsa", "/halsa", "/nyhetsmorgon", "/adhd", "/add", "/autism", "/skola", "/familj", "/foraldraskap", "/foraldrar", "/barn"]}, {"id": 150, "title": "Sweden is looking for foreign top researchers – but faces new obstacles", "summary": "Long processing times, uncertain conditions and difficulties for accompanying families mean that Sweden increasingly loses top foreign researchers to countries with simpler rules. \n The post Sweden is looking for foreign top researchers – but faces new obstacles appeared first on ABC Nyheter.", "title_original": "Sverige söker utländska toppforskare – men möter nya hinder", "summary_original": "Långa handläggningstider, osäkra tillstånd och svårigheter för medföljande familjer gör att Sverig   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
