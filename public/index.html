ow the High Court in Glasgow has singled her out as the killer. Suffered from postpartum depression Several text messages between the mother and Thea's grandmother show that Nicole Blain suffered from postpartum depression and had difficulty coping with life in the weeks after the birth, according to the channel. On the same day as the murder, the mother and the newborn were to meet the child's grandmother.  Suddenly the grandmother's phone rang, and on the other end a \"penetrating and extremely loud scream\" was heard from a child. And Nicole Blain didn't sound like she used to, according to the testimony. She mumbled that she \"doesn't know what to do\", that she found Thea with a bump on her head. Thea's grandmother and her husband urged her to call an ambulance. Blamed: Was another child When they then entered the hospital with the girl, the mother said that another child in the apartment had taken the girl out of her crib and dropped her on the ground. - I remember the trauma when I found my daughter. I will never get it out of my head. My baby died in my arms, she said in court. However, the prosecutor called Nicole Blain's explanation \"nonsense\" and believes that another child could never have caused such injuries to the infant. \"Injuries Associated with Car Crashes\" The autopsy showed that the toddler died of blunt force trauma, but there were also lacerations to her face and indications that someone had shaken her before her death. According to the coroner, she had injuries that are usually associated with car crashes and that would be very difficult for another child to do. The sentence has not been announced yet, but according to the judge, everything points towards it being life imprisonment.", "title_original": "Nicole dödade 19 dagar gamla dottern – skyllde på annat barn", "summary_original": "Nicole Blain, en 30-årig mamma i skotska Greenock, döms nu för mordet på sin 19 dagar gamla dotter. Spädbarnet avled med flera brutna revben och tre frakturer i skallbenet, skriver BBC. Mamman menar att hon sov under tiden och att ett annat barn måste orsakat dotterns död, men nu har Högsta domstolen i Glasgow pekat ut henne som mördaren. Led av förlossningsdepression Flera sms mellan mamman och Theas farmor visar på att Nicole Blain led av förlossningsdepression och hade svårt att hantera livet under veckorna efter födseln, enligt kanalen. Samma dag som mordet skedde skulle mamman och den nyfödda träffa barnets farmor.  Plötsligt ringde farmorns telefon, och på andra sidan hördes ett ”genomträngande och extremt högt skrik” från ett barn. Och Nicole Blain lät inte som hon brukade, enligt vittnesmålet. Hon mumlade att hon ”inte vet vad hon ska göra”, att hon hittat Thea med en bula på huvudet. Theas farmor och hennes man uppmanade henne att ringa ambulans. Skyllde ifrån sig: Var ett annat barn När de sedan kom in till sjukhuset med flickan menade mamman att ett annat barn i lägenheten tagit flickan ur hennes spjälsäng och tappat henne i marken. – Jag kommer ihåg traumat när jag hittade min dotter. Jag kommer aldrig att få det ur mitt huvud. Min bebis dog i mina armar, sade hon i rätten. Åklagaren kallade dock Nicole Blains förklaring för ”nonsens” och menar att ett annat barn aldrig hade kunnat orsaka sådana skador på spädbarnet. ”Skador som associeras med bilkrascher” Obduktionen visade att det lilla barnet dog av trubbigt våld, men det fanns även rivsår i ansiktet och indikationer på att någon skakat henne före hennes död. Enligt obducenten hade hon skador som oftast associeras med bilkrascher och som skulle vara mycket svårt för ett annat barn att ställa till med. Straffets har inte meddelats än, men enligt domaren pekar allt mot att det blir livstids fängelse.", "link": "https://www.tv4.se/artikel/2LRIXcMayj2ancvkUcViVm/nicole-doedade-19-dagar-gamla-dottern-skyllde-pa-annat-barn", "date_display": "2026-04-30", "date_iso": "2026-04-30T20:25:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/skottland", "/mord", "/brott-och-straff"]}, {"id": 123, "title": "Messy Walborg - girl got a rocket in the eye", "summary": "Walpurgis celebrations were chaotic in several places, and the police urged parents to pick up their children. A girl in her late teens has been taken to hospital after getting a rocket in her eye in Stockholm. In Uppsala, 96 people were taken into custody for drunkenness - but drug offenses decreased.", "title_original": "Stökig valborg – flicka fick raket i ögat", "summary_original": "Valborgsfirandet var stökigt på flera platser, och polisen uppmanade föräldrar att hämta sina barn. En flicka i nedre tonåren har förts till sjukhus efter att ha fått en raket i ögat i Stockholm. I Uppsala omhändertogs 96 personer för fylleri – men narkotikabrotten minskade.", "link": "https://www.dn.se/sverige/stokigt-valborgsfirande-i-stockholm-foraldrar-uppmanas-hamta-sina-barn/", "date_display": "2026-04-30", "date_iso": "2026-04-30T20:16:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The \"power factor\" behind the throne", "summary": "From loathed mistress to celebrated queen. During the royal couple's visit to the USA, it is now Britain's Queen Camilla who takes the seat.", "title_original": "”Maktfaktorn” bakom tronen", "summary_original": "Från avskydd älskarinna till hyllad drottning. Under kungaparets USA-besök är det nu Storbritanniens drottning Camilla som tar plats.", "link": "https://www.svd.se/a/OkyBqq/hon-ar-en-maktfaktor-bakom-tronen", "date_display": "2026-04-30", "date_iso": "2026-04-30T20:04:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 125, "title": "Their patients are deported: \"Help is available in Sweden\"", "summary": "Nursing staff at Karolinska University Hospital in Huddinge are protesting against patients being deported. \"Sometimes it can feel so powerless,\" says curator Sally Al-Tai to SvD.", "title_original": "Deras patienter utvisas: ”Hjälpen finns i Sverige”", "summary_original": "Vårdpersonal på Karolinska Universitetssjukhuset i Huddinge protesterar mot att patienter utvisas. ”Ibland kan det kännas så himla maktlöst”, säger kuratorn Sally Al-Tai till SvD.", "link": "https://www.svd.se/a/JOng96/vardpersonal-protesterar-mot-utvisningar", "date_display": "2026-04-30", "date_iso": "2026-04-30T20:04:20+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 126, "title": "Letter to the editor. Answer: Only electric cars make our air better", "summary": "RESPONSE TO POSTERS. Let's not be fooled into thinking that biofuel-powered vehicles would be particularly emission-free. To drive emission-free, the car needs to be powered by electricity, writes Jan Stenberg.", "title_original": "Insändare. Svar: Bara elbilar gör vår luft bättre", "summary_original": "SVAR PÅ INSÄNDARE. Låt oss inte luras att tro att biobränsledrivna fordon skulle vara särskilt utsläppsfria. För att köra utsläppsfritt behöver bilen drivas av el, skriver Jan Stenberg.", "link": "https://www.dn.se/insandare/svar-bara-elbilar-gor-var-luft-battre/", "date_display": "2026-04-30", "date_iso": "2026-04-30T19:52:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The king is celebrated: \"80 years and counting\"", "summary": "\"80 years and counting\", declared Chief Court Preacher Johan Dalman when the birthday celebration of King Carl XVI Gustaf began in the Palace Church. In the castle grounds, the king got to meet four-year-old Sally and receive flowers, before the defense overflight thundered over Stockholm.", "title_original": "Kungen firas: ”80 år and counting”", "summary_original": "”80 år and counting”, deklarerade överhovpredikant Johan Dalman då födelsedagsfirandet av kung Carl XVI Gustaf inleddes i Slottskyrkan. På borggården fick kungen träffa fyraåriga Sally och ta emot blommor, innan försvarets överflygning dånade över Stockholm.", "link": "https://www.dn.se/sverige/kungen-firas-80-ar-and-counting/", "date_display": "2026-04-30", "date_iso": "2026-04-30T19:42:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Skellefteå one game away from the SM gold", "summary": "Skellefteå has acquired a match ball in the SM final series in ice hockey. Rögle was defeated 3–2 in the fourth final match. Skellefteå can thus secure the SC title at home on Saturday. - Inspiring, something you've longed for all season, says Pär Lindholm to TV4 Play.", "title_original": "Skellefteå en match från SM-guldet", "summary_original": "Skellefteå har skaffat sig matchboll i SM-finalserien i ishockey. Rögle besegrades med 3–2 i den fjärde finalmatchen. Skellefteå kan därmed säkra SM-titeln hemma på lördag. – Inspirerande, något man längtat efter hela säsongen, säger Pär Lindholm till TV4 Play.", "link": "https://www.dn.se/sport/skelleftea-en-match-fran-sm-guldet/", "date_display": "2026-04-30", "date_iso": "2026-04-30T19:31:28+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Elderly man evicted - after love letter to neighbor", "summary": "An elderly man is now forced to move out of his apartment after showering his neighbor with messages and love letters, despite warnings from the landlord, Hem och Hyra writes. It was in 2016 that the man, who is now in his 80s, moved into the apartment in Jönköping. Around 2019, he began to take a liking to a female neighbor about 20 years younger. Went into the apartment uninvited He started sending text messages, messages via Messenger and also left handwritten love letters in the mailbox. Once he allegedly entered the woman's apartment. She was in the laundry and had another neighbor visiting. When the 80-year-old realized it, he went straight out. The woman says that she spoke up several times, perceived the man's approaches as unpleasant and that they made her feel unsafe in her apartment. Other neighbors have also said that the elderly man was perceived as threatening - and that he played loud music with the apartment door open. \"The stupid things must not be repeated\" In the end, after sending warning letters, the landlord chose to evict the man. He appealed on the grounds that he has bad finances after being robbed and forced to take out SMS loans, that he has changed his behavior towards the woman and that his \"stupidities should not be repeated\". The case was taken up in the Court of Appeal, which sided with the landlord. Now the 80-year-old is not allowed to stay after May 31.", "title_original": "Äldre man vräks – efter  kärleksbrev till grannen", "summary_original": "En äldre man tvingas nu att flytta från sin lägenhet efter att ha överöst sin granne med meddelanden och kärleksbrev, trots varningar från hyresvärden, skriver Hem och Hyra. Det var år 2016 som mannen, som nu är i 80-årsåldern, flyttade in i lägenheten i Jönköping. Ungefär 2019 började han fatta tycke för en ungefär 20 år yngre kvinnlig granne. Gick in oinbjuden i lägenheten Han började skicka sms, meddelanden via Messenger och lämnade även handskrivna kärleksbrev i brevlådan. En gång ska han ha gått in i kvinnans lägenhet. Hon var i tvättstugan och hade en annan granne på besök. När 80-åringen insåg det gick han direkt ut. Kvinnan säger att hon sagt ifrån flera gånger, uppfattat mannens närmanden som obehagliga och att de fått henne att känna sig otrygg i sin lägenhet. Andra grannar har dessutom berättat att den äldre mannen upplevts som hotfull – och att han spelat hög musik med öppen lägenhetsdörr. ”Dumheterna ska inte upprepas” Till slut, efter att ha skickat varningsbrev, valde hyresvärden att vräka mannen. Han överklagade med motiveringen att han har dålig ekonomi efter att ha blivit rånad och tvingats ta sms-lån, att han ändrat sitt beteende mot kvinnan och att hans ”dumheter inte ska upprepas”. Ärendet togs upp i hovrätten, som gick på hyresvärdens linje. Nu får inte 80-åringen bo kvar efter 31 maj.", "link": "https://www.tv4.se/artikel/HubrLqfndqqXfgXsHe0Rx/aeldre-man-vraeks-efter-kaerleksbrev-till-grannen", "date_display": "2026-04-30", "date_iso": "2026-04-30T19:22:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/bostad", "/hyresvard", "/hyresgast", "/hem-hyra"]}, {"id": 130, "title": "Record number of savages in the Riksdag - causing crisis and debate", "summary": "Since the beginning of the mandate period, nine Riksdag members have left or been expelled from their party - but chose to keep their Riksdag seat. This means that there are more political savages than ever. After Wednesday's voting coup, their influence has once again become the subject of debate.", "title_original": "Rekordmånga vildar i riksdagen – orsakar kris och debatt", "summary_original": "Sedan mandatperiodens början har nio riksdagsledamöter lämnat eller uteslutits ur sitt parti – men valt att behålla sin riksdagsplats. Det innebär att de politiska vildarna är fler än någonsin. Efter onsdagens röstningskupp har deras inflytande återigen blivit föremål för debatt.", "link": "https://www.dn.se/sverige/rekordmanga-vildar-i-riksdagen-orsakar-kris-och-debatt/", "date_display": "2026-04-30", "date_iso": "2026-04-30T19:00:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "First World War ship recovered - after over 100 years", "summary": "The United States' greatest loss of life at sea during the First World War occurred when the battleship Tampa was torpedoed by a German submarine in 1918. Now the Tampa has been found off the UK.", "title_original": "Första världskriget-fartyg återfunnet – efter över 100 år", "summary_original": "USA:s största förlust av människoliv till havs under första världskriget skedde när militärfartyget Tampa torpederades av en tysk ubåt 1918. Nu har Tampa återfunnits utanför Storbritannien.", "link": "https://www.dn.se/varlden/forsta-varldskriget-fartyg-aterfunnet-efter-over-100-ar/", "date_display": "2026-04-30", "date_iso": "2026-04-30T18:59:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Trump chooses between three different options - to strike again", "summary": "Citing sources for Axios • Iran's threat", "title_original": "Trump väljer mellan tre olika alternativ – för att slå till igen", "summary_original": "Uppger källor för Axios • Irans hot", "link": "https://www.tv4.se/artikel/4enSwpkCsLvanYcDDFTq8h/trump-vaeljer-mellan-tre-olika-alternativ-foer-att-sla-till-igen", "date_display": "2026-04-30", "date_iso": "2026-04-30T18:47:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 133, "title": "Therefore, the participant suddenly leaves the program", "summary": "Usually there is only one person who doesn't show up at breakfast in \"The Traitors\" because a murder has been committed during the night in the game. But in Thursday's episode, two players are missing.\n\n- Anyway. And then we have Simi, says host Dragomir Mrsic after explaining the first manfall. - She has left the game due to personal reasons. Private situation behind the defection Sara Johansson, executive producer at TV4, tells TV4 Nyheterna that in consultation with Simi Kaur it was concluded that she needed to cancel her participation. - She had a private situation that affected her participation, says Sara Johansson.\n\nIn an email, Simi Kaur writes that, just as it appears in the program and in Sara Johansson's answer, she left for personal reasons and \"not because of the program\".\n\n\"The contact with the production has been good and I am grateful for their support\", she writes further. \"Disaster\" Two faithful players leaving the game is tough for the others. The actor Dan Ekborg, who got to know the lawyer Simi Kaur at Häringe castle, describes it as a \"disaster\". - Simi and I have had a damn good relationship, and then she's gone. It was hard, he says in the program.\n\nQuitting in the middle of recording occurs from time to time in other competition reality programs on the channel, but it is the first time in the Swedish version of Förrädarna during the five seasons the program has been broadcast.", "title_original": "Därför lämnar deltagaren plötsligt programmet", "summary_original": "Vanligtvis är det bara en person som inte dyker upp vid frukosten i ”Förrädarna” eftersom ett mord har begåtts under natten i spelet. Men i torsdagens avsnitt är det två spelare som saknas.\n\n– Hur som helst. Och så har vi ju Simi, säger programledaren Dragomir Mrsic efter att ha förklarat det första manfallet. – Hon har lämnat spelet på grund av personliga skäl. Privat situation bakom avhoppet Sara Johansson, exekutiv producent på TV4, säger till TV4 Nyheterna att man i samråd med Simi Kaur kom fram till att hon behövde avbryta sin medverkan. – Hon hade en privat situation som påverkade hennes medverkan, säger Sara Johansson.\n\nI ett mejl skriver Simi Kaur att hon, precis som det framgår i programmet och i Sara Johanssons svar, lämnade av personliga skäl och ”inte på grund av programmet”.\n\n”Kontakten med produktionen har varit god och jag är tacksam för deras stöttning”, skriver hon vidare. ”Katastrof” Att två trogna spelare lämnar spelet är tufft för de andra. Skådespelaren Dan Ekborg, som lärde känna juristen Simi Kaur på Häringe slott, beskriver det som en ”katastrof”. – Simi och jag har haft en jävla bra relation, och sen är hon borta. Det var jobbigt, säger han i programmet.\n\nAvhopp mitt under inspelning förekommer då och då i andra tävlingsrealityprogram på kanalen men det är första gången i den svenska versionen av Förrädarna under de fem säsonger programmet har sänts.", "link": "https://www.tv4.se/artikel/6433R5uE0Kf0VaPOt9LOwA/daerfoer-laemnar-deltagaren-ploetsligt-programmet", "date_display": "2026-04-30", "date_iso": "2026-04-30T18:30:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/forradarna", "/tv4", "/tv4-play"]}, {"id": 134, "title": "This is how the king celebrated his 80th birthday", "summary": "\"A dinner that is prepared meticulously\" • They are among the guests", "title_original": "Så har kungen firat sin 80-årsdag", "summary_original": "”En middag som förbereds minutiöst” • De finns bland gästerna", "link": "https://www.tv4.se/artikel/7ddxsRWPaZUIg0agKDyv9v/sa-har-kungen-firat-sin-80-arsdag", "date_display": "2026-04-30", "date_iso": "2026-04-30T18:07:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem"]}, {"id": 135, "title": "Spread terror in the small town - filmed women \"out of curiosity\"", "summary": "It was all revealed when the neighbor of a surreptitiously filmed woman saw a man in his 40s on his surveillance camera, as he stood in the woman's garden and masturbated while filming her through a window. During a search of the man's home, a large number of videos were found showing naked and scantily clad women that had been surreptitiously filmed. Something that Ystads Allehanda was the first to report on.  The man is also suspected of, among other things, filming women during toilet visits in bathing suits through a hole that he is suspected of having drilled.  Masturbating outside the home: \"Terrible\" He also allegedly walked around Ystad at night and filmed women in their homes, according to the indictment. On one occasion, he is said to have masturbated to a woman who was sleeping naked on the sofa.  The woman who was filmed through a window states that she herself never saw the man, but that her father, who was away, received notices from the surveillance camera and saw what happened. The man is said to have moved away after the father shouted via the camera's speaker that he sees the man and that he should go away. \"Terrible that someone has come into our back and is looking at me,\" says the woman in questioning with the police.   The exposed woman states in questioning that she has anxiety after the incident and that she is afraid to be at home alone. \"When it's dark outside, it can feel like he's haunting me,\" she says in questioning. Naked women in the shower At a hostel, the man allegedly filmed several naked women in the shower by hiding between the floor and a wall that separated one shower area from another. He states that it was a \"fun thing\".  \"We got to know each other and went to the system. Others had sex and others recorded. It was like a fun thing,\" the man states in questioning. In addition, several similar videos were found in the man's seized mobile phone. Among other things, he allegedly filmed a girl under her skirt on an escalator. The same girl he allegedly filmed on the train while she was sleeping. \"In one of the films, I saw a naked bottom, older woman, I estimated the age e.g", "title_original": "Spred skräck i den lilla staden – filmade kvinnor ”av nyfikenhet”", "summary_original": "Det hela avslöjades när grannen till en smygfilmad kvinna såg en man i 40-årsåldern i sin övervakningskamera, då han stod i kvinnans trädgård och onanerade samtidigt som han filmade henne genom ett fönster. Vid en husrannsakan hemma hos mannen hittades ett stort antal filmer som visade nakna och lättklädda kvinnor som smygfilmats. Något som Ystads Allehanda var först med att rapportera om.  Mannen misstänks också för att bland annat ha filmat kvinnor under toalettbesök i bajamajor genom ett hål som han misstänks ha borrat upp.  Onanerade utanför bostaden: ”Jätteläskigt” Han ska också nattetid gått runt i Ystad och filmat kvinnor i deras hem, enligt åtalet. Vid ett tillfälle ska han ha onanerat till en kvinna som sov naken i soffan.  Kvinnan som filmades genom ett fönster uppger att hon själv aldrig såg mannen, men att hennes pappa, som var bortrest, fick notiser från övervakningskameran och såg vad som hände. Mannen ska ha avlägsnat sig efter att pappan via kamerans högtalare ropat att han ser mannen och att han ska ge sig i väg. ”Jätteläskigt att någon kommit in på vår baksida och står och kollar på mig”, säger kvinnan i förhör med polisen.   Den utsatta kvinnan uppger i förhör att hon har ångest efter händelsen och att hon är rädd för att vara hemma själv. ”När det är mörkt ute kan det kännas som han hemsöker mig”, säger hon i förhör. Nakna kvinnor i duschen På ett vandrarhem ska mannen ha filmat flera nakna kvinnor i duschen genom att gömma sig mellan golv och en vägg som separerade ett duschutrymme från ett annat. Han uppger att det var en ”kul grej”.  ”Vi lärde känna varandra och gick till systemet. Andra hade sex och andra spelade in. Det var som en kul grej”, uppger mannen i förhör. I mannens beslagtagna mobiltelefon hittades dessutom flera liknande filmer. Han ska bland annat ha filmat en tjej under kjolen på en rulltrappa. Samma tjej ska ha han ha filmat på tåget medan hon sov. \"En av filmerna såg jag en naken nertill, äldre kvinna, jag uppskattade åldern till runt 80 år. Kvinnan satt på toaletten och uträttade sina behov.” Den misstänkte mannen har delvis erkänt, men uppger i förhör att filmandet skedde av ”nyfikenhet” och inte i sexuellt syfte. Mannen åtalas nu för smygfilmning av totalt 17 fall av kränkande fotografering. Många av de kvinnor som filmats har inte kunnat identifieras.", "link": "https://www.tv4.se/artikel/2nTcRHcGkbxXJ8ZAUsOmQe/borrade-upp-hal-i-bajamajor-filmade-kvinnor-av-nyfikenhet", "date_display": "2026-04-30", "date_iso": "2026-04-30T17:13:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/brott", "/misstankt-brott"]}, {"id": 136, "title": "The forecast after the spring heat: \"Cold as far as I can see\"", "summary": "Walborg celebrants can enjoy sun and warmth - on Thursday, Arvika became the first in Sweden to have temperatures above 25 degrees. And on the first of May it will be even hotter. - It can be up to 27 degrees, says TV4 Nyhetern's meteorologist Ulrika Elvgren. There it will be freezing temperatures and fresh snow But already on Saturday it will be colder throughout the country. - Air is coming down from the north. We get back frosty nights - typical April weather through May. The summer heat should not be taken for granted, in other words. - It will definitely not be 25-degree heat. In the mountains, it will be below zero during the day and there may be fresh snow, perhaps not what you want now. - It will be a setback to the early summer heat that is playing a guest role now. Beautiful May is getting a little ugly, you could say. We go back to spring winter. \"Cold as far as I can see\" Something positive about this, says the meteorologist, is that nature needs some rain. - Although it may not be something we humans appreciate. And warmer temperatures are not in sight. - It's chilly as far as I can see. May begins coldly, except for the first of May then.", "title_original": "Prognosen efter vårvärmen:   ”Kyligt så långt jag kan se”", "summary_original": "Valborgsfirarna kan njuta av sol och värme – på torsdagen blev Arvika först i Sverige med att få temperaturer över 25 grader. Och på första maj blir det ännu varmare. – Det kan bli upp emot 27 grader, säger TV4 Nyheternas meteorolog Ulrika Elvgren. Där blir det minusgrader och nysnö Men redan på lördag blir det kallare i hela landet. – Det kommer ner luft norrifrån. Vi får tillbaka frostnätter – typiskt aprilväder fast i maj. Sommavärmen ska inte ta för givet, med andra ord. – Det blir definitivt ingen 25-gradig värme. I fjällen blir det minusgrader dagtid och kan bli nysnö, kanske inget man önskar nu. – Det blir ett bakslag på den försommarvärme som gästspelar nu. Sköna maj blir lite oskön, kan man säga. Vi går tillbaka till vårvinter. ”Kyligt så långt jag kan se” Något som är positivt med detta, säger meteorologen, är att det välbehövligt för naturen att få lite regn. – Även om det kanske inte är något vi människor uppskattar. Och varmare temperaturer finns inte i sikte. – Det är kyligt så långt jag kan se. Maj inleds kyligt, förutom första maj då.", "link": "https://www.tv4.se/artikel/69YEYuF7WhJpRmjPWmSgJw/njut-av-supervaermen-i-helgen-sedan-blir-skoena-maj-oskoen", "date_display": "2026-04-30", "date_iso": "2026-04-30T16:04:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/vader", "/vaderprognoser", "/valborg"]}, {"id": 137, "title": "The young guys thought they were going on a date - then \"Nathalie\" struck", "summary": "A 23-year-old man is now charged with three robberies in southern Stockholm during the summer and fall of 2025. The approach: To lure guys to the crime scene by pretending to be a girl on a dating app. Met on Hinge At the end of August, a guy in his 20s matches a \"Nathalie\". They have posted for a while on the dating app Hinge and later on Snapchat. Just as in the other two cases, they agree to meet in the Stockholm suburb of Vårby. But when he shows up at 11 p.m., an unknown man comes up, says he has a gun and forces him to withdraw 15,000 kroner. If he contacts the police, it will end badly for his family, says the robber. They take a taxi to Fruängen, another suburb in southern Stockholm, and withdraw the money. \"ADHD premium\" In October, the robber strikes again, under the name \"Maria\".  On the profile, Maria appears as a blonde 19-year-old girl. She writes that she has \"ADHD premium\" and that \"I offer the date, but you pay\". Again, the robber arranges a meeting with a guy in Vårby, goes to Fruängen and withdraws money. Then the plan fails. But when he tries again in November, things go wrong. Once again, he lures a guy in his 20s with the Tinder profile \"Maria\", and this time the robber has a friend with him. They grab hold of the guy, who manages to break free and starts running. One of the men says \"if you run, I'll shoot you\", but no shots are fired. After a while, the guy sees a police patrol, and then the robbers start running in the other direction. Now the man is charged with two counts of robbery, kidnapping and assault in a court case, and an attempted robbery. He has previously been convicted of almost exactly the same robberies, even then with the Tinder profile \"Maria\". The man denies any crime and claims that he himself is the victim of \"an elaborate robbery\" and that someone else sent the messages from his accounts.", "title_original": "Unga killarna trodde de skulle på dejt – då slog ”Nathalie” till", "summary_original": "En 23-årig man åtalas nu för tre rån i södra Stockholm under sommaren och hösten 2025. Tillvägagångssättet: Att locka killar till brottsplatsen genom att låtsas vara en tjej på en dejtingapp. Träffades på Hinge I slutet av augusti stämmer en kille i 20-årsåldern träff med en ”Nathalie”. De har skrivit ett tag på dejtingappen Hinge och senare på Snapchat. Precis som i de två andra fallen kommer de överens om att träffas i Stockholmsförorten Vårby. Men när han dyker upp vid 23-tiden kommer en okänd man fram, säger att han har en pistol och tvingar honom att ta ut 15 000 kronor. Om han kontaktar polisen kommer det att sluta illa för hans familj, säger rånaren. De tar en taxi till Fruängen, en annan förort i södra Stockholm, och tar ut pengarna. ”ADHD premium” I oktober slår rånaren till igen, under namnet ”Maria”.  På profilen framstår Maria som en blond 19-årig tjej. Hon skriver att hon har ”ADHD premium” och att ”jag bjuder på dejten, men du betalar”. Återigen stämmer rånaren träff med en kille i Vårby, åker till Fruängen och tar ut pengar. Då misslyckas planen Men när han ska försöka igen i november går det snett. Ännu en gång lockar han dit en kille i 20-årsåldern med Tinderprofilen ”Maria”, och den här gången har rånaren med sig en kumpan. De griper tag i killen, som lyckas rycka sig loss och börjar springa. En av männen säger ”springer du så skjuter jag dig”, men det kommer inget skott. Efter en stund får killen syn på en polispatrull, och då börjar rånarna springa åt andra hållet. Nu åtalas mannen för två fall av rån, människorov och övergrepp i rättssak, och ett rånförsök. Han har tidigare dömts för nästan exakt likadana rån, även då med Tinderprofilen ”Maria”. Mannen nekar till alla brott och hävdar att han själv är offret i ”en utstuderad rånhärva” och att någon annan skickat meddelandena från hans konton.", "link": "https://www.tv4.se/artikel/5SqAbhKVoyU1TC3EAIfj9E/unga-killarna-trodde-de-skulle-pa-dejt-da-slog-nathalie-till", "date_display": "2026-04-30", "date_iso": "2026-04-30T14:11:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/ran", "/tinder"]}, {"id": 138, "title": "The SD leader: \"I note completely senseless reactions\"", "summary": "", "title_original": "SD-ledaren: ”Jag noterar helt sanslösa reaktioner”", "summary_original": "", "link": "https://www.tv4.se/artikel/4WQAFnywrupVM5ay6JjtOt/jimmie-akesson-sansloesa-reaktioner", "date_display": "2026-04-30", "date_iso": "2026-04-30T12:24:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 139, "title": "The king began the 80th birthday with a service: \"A signal\"", "summary": "\"We pray for him and for the entire royal family and their important mission for Sweden\"", "title_original": "Kungen inledde 80-årsdagen med gudstjänst: ”En signal”", "summary_original": "”Vi ber för honom och för hela kungahuset och deras viktiga uppdrag för Sverige”", "link": "https://www.dagen.se/nyheter/kungen-inledde-80-arsdagen-med-gudstjaenst-en-signal/10321785", "date_display": "2026-04-30", "date_iso": "2026-04-30T12:06:57+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Joint Statement by the Nordic-Baltic Ministers (NB8) of Foreign Affairs", "summary": "We, the Ministers of Foreign Affairs and government representatives of the NB8, met in Kuressaare, Estonia on 29-30 April 2026, at a time of rapid change in the international security environment, with heightened geopolitical tensions, Russia continuing its war of aggression against Ukraine, and an urgent need for Europe to step up and take greater responsibility for shaping its future.", "title_original": "Joint Statement by the Nordic-Baltic Ministers (NB8) of Foreign Affairs", "summary_original": "We, the Ministers of Foreign Affairs and government representatives of the NB8, met in Kuressaare, Estonia on 29-30 April 2026, at a time of rapid change in the international security environment, with heightened geopolitical tensions, Russia continuing its war of aggression against Ukraine, and an urgent need for Europe to step up and take greater responsibility for shaping its future.", "link": "https://www.government.se/statements/2026/04/joint-statement-by-the-nordic-baltic-ministers-nb8-of-foreign-affairs/", "date_display": "2026-04-30", "date_iso": "2026-04-30T11:51:54+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement", "Nordic affairs", "Sweden's support to Ukraine", "Maria Malmer Stenergard", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 141, "title": "Here, the king is celebrated with a flyover: \"Very nice\"", "summary": "Fighter flights over Stockholm • Thousands followed on the spot", "title_original": "Här firas kungen med överflygning: ”Väldigt fint”", "summary_original": "Stridsflyg över Stockholm • Tusentals följde på plats", "link": "https://www.tv4.se/artikel/6fMtn1A0shXgUPk8MFdtqq/haer-firas-kungen-med-oeverflygning-vaeldigt-fint", "date_display": "2026-04-30", "date_iso": "2026-04-30T11:33:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 142, "title": "Now Jimmie Åkesson must appear in parliament", "summary": "", "title_original": "Nu måste Jimmie Åkesson dyka upp i riksdagen", "summary_original": "", "link": "https://www.tv4.se/artikel/7CJZYIzg5M4iaEi5fqdOY9/nu-maste-jimmie-akesson-dyka-upp-i-riksdagen", "date_display": "2026-04-30", "date_iso": "2026-04-30T11:18:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "Crisis meeting after the coup: \"Put the system out of whack\"", "summary": "", "title_original": "Krismöte efter kuppen: ”Satt systemet ur spel”", "summary_original": "", "link": "https://www.tv4.se/artikel/4ZnXmujnA31CU992qBmtUV/krismoete-i-riksdagen-efter-sd-s-kvitteringskupp", "date_display": "2026-04-30", "date_iso": "2026-04-30T11:00:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 144, "title": "Here are the top Swedish gangs who are hunted around the world", "summary": "Last fall, Spanish police raided two Swedish citizens who traveled to the Spanish sun coast to commit a murder. The strike was one of many within the Swedish-led operation \"Operation Grimm\". The effort began a year ago and is a collaboration between eleven European countries and Europol. The goal is to access digital recruitment, what the police call \"violence as a service\". - Operationally speaking, we have had very good results. We have almost 300 arrested in this system, which we call violence as a service, that is, where serious criminals use digital environments to recruit often young practitioners, says Tedodor Smedius, police superintendent at Noa. - We have also identified over 14,000 accounts linked to this system, he continues. Gang leaders are hunted worldwide The police are still searching for several gang leaders within \"Operation Grimm\" - and two of the three highest priority targets are Swedes, according to information in the material: Foxtrot-connected 27-year-old Mohamed Mohdhi and 21-year-old Ali Namdar. Mohamed Mohdhi, former rapper under the stage name \"Moewgli\", has been described as Rawa Majid's right-hand man. Ali Namdar has been detained in absentia for a number of serious crimes, among others in the case of the attempted murder of Iran expert Arvin Khoshnood. Ali Namdar is detained in absentia in the investigation into the assassination attempt on the political scientist and Iran expert Arvin Khoshnood last year. - He is in custody in his absence and is suspected of having instigated a number of different serious crimes consisting of explosions. He is suspected of being a recruiter for the criminal network Foxtrot, says prosecutor Helene Gestrin. Crime ads on social media A seized video shows how a young armed person shoots into a residence in Sweden. Another video shows a shooter firing shots at a residential gate. These are some of the crimes that are often ordered via the internet, from shootings at homes to murders and transporting drugs or weapons. Many who take on the assignments are children, in some cases as young as ten years old.  F", "title_original": "Här är svenska gängtopparna som jagas världen över", "summary_original": "I höstas slog spansk polis till mot två svenska medborgare som rest till spanska solkusten för att utföra ett mord. Tillslaget var ett av många inom den svenskledda insatsen ”Operation Grimm”. Insatsen inleddes för ett år sedan och är ett samarbete mellan elva europeiska länder och Europol. Målet är att komma åt den digitala rekryteringen, det som polisen kallar ”violence as a service”. – Rent operativt har vi fått väldigt bra resultat. Vi har nästan 300 gripna i det här systemet som vi kallar för violence as a service, alltså där grovt kriminella använder digitala miljöer för att rekrytera ofta unga utövare, säger Tedodor Smedius, polisindtendent på Noa. – Vi har också identifierat över 14 000 konton kopplat till det här systemet, fortsätter han. Gängtoppar jagas världen över Fortfarande söker polisen inom ”Operation Grimm” efter flera gängtoppar – och två av de tre mest högprioriterade målen är svenskar, enligt uppgifter i materialet: Foxtrot-kopplade 27-årige Mohamed Mohdhi och 21-åriga Ali Namdar. Mohamed Mohdhi, tidigare rappare under artistnamnet ”Moewgli”, har beskrivits som Rawa Majids högra hand. Ali Namdar har häktats i sin utevaro för en rad allvarliga brott, bland andra i målet om mordförsöket på Irankännaren Arvin Khoshnood. Ali Namdar är häktad i sin frånvaro i utredningen om mordförsöket på statsvetaren och Irankännaren Arvin Khoshnood i fjor. – Han är häktad i sin utevaro och misstänks för att ha anstiftat ett antal olika grova brott bestående av sprängningar. Han misstänks för att vara rekryterare åt det kriminella nätverket Foxtrot, säger åklagaren Helene Gestrin. Brottsannonser på sociala medier En beslagtagen video visar hur en ung beväpnad person skjuter in mot en bostad i Sverige. En annan video visar hur en skytt avlossar skott mot en bostadsport. Det är några av de brott som ofta beställs via nätet, från skott mot bostäder till mord och transporter av narkotika eller vapen. Många som tar uppdragen är barn, i vissa fall så unga som tio år.  För att komma åt det har regeringen lämnat in en lagrådsremiss som innebär att polisen från och med den 15 juli får rätt att beordra sociala medieplattformar att plocka ner brottsannonser inom en timme från att de anmäls. Annars riskerar plattformarna böter på upp till fem miljoner kronor per annons. – Vi vet att man försöker nå många barn genom mobiltelefonerna och då måste det här materialet identifieras och tas ner så fort det bara går. Och nu får polisen helt andra muskler att göra det. Faktiskt lika starka muskler som man redan har idag när det gäller att bekämpa terrorism, säger justitieministern Gunnar Strömmer.", "link": "https://www.tv4.se/artikel/6XrzK1pxAg5cOfwLl8GYBn/haer-aer-svenska-gaengtopparna-som-jagas-vaerlden-oever", "date_display": "2026-04-30", "date_iso": "2026-04-30T09:41:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/gangkriminalitet", "/gangkriminella", "/gangrekrytering", "/foxtrotnatverket"]}, {"id": 145, "title": "The lump election exposes the country's penchant for populism", "summary": "", "title_original": "Knölvalen blottar landets förkärlek för populism", "summary_original": "", "link": "https://www.tv4.se/artikel/3mcz6k1JwtmnaDaVSQ4dwM/knoelvalen-blottar-landets-foerkaerlek-foer-populism", "date_display": "2026-04-30", "date_iso": "2026-04-30T09:03:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 146, "title": "The spat is escalating – Trump may reduce troop strength in Germany", "summary": "Political and logistical challenges • \"No wonder things are going so badly\"", "title_original": "Ordbråket eskalerar – Trump kan dra ner truppstyrkan i Tyskland", "summary_original": "Politiska och logistiska utmaningar • ”Inte undra på att det går så dåligt”", "link": "https://www.tv4.se/artikel/1Rll4K6YUOypFD4uyVtpc1/ordbraket-eskalerar-trump-kan-dra-ner-truppstyrkan-i-tyskland", "date_display": "2026 nonymous\"", "summary": "", "title_original": "Kungen om sitt minne: ”Jag framstod som anonym”", "summary_original": "", "link": "https://www.tv4.se/artikel/tt-260430-kungen80tankar1-99764ef1/kungen-om-sitt-minne-jag-framstod-som-anonym", "date_display": "2026-04-30", "date_iso": "2026-04-30T06:58:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Kungligt", "/kungligt"]}, {"id": 150, "title": "Gnissel before May Day: \"Doesn't talk about what people should vote for\"", "summary": "This year's May Day celebration is particularly important for the Social Democrats. The election year raises the stakes as the labor movement gathers. During Friday, fifty representatives from the trade unions and the Social Democrats in 26 party districts will speak.\n\nThe bond between the LO unions and S is still strong, but in recent years it has started to creak in the red machinery.  The journal Arbetet was recently able to report that only two out of 13 unions give financial support to S. But from the top of the LO hierarchy, support for S is solid. This year, 30 million of the members' money is invested in the own election campaign that will support S.\n\n- It is no secret that we collaborate with the Social Democrats. We have backed up the qualifying deduction to end up in the health insurance committee, where the other side has no further interest. It could have been cleaned a long time ago. Now it's time to get the pension issue out, and other issues, and that journey remains, says LO chairman Johan Lindholm. The four demands on the party LO set four demands on S before the election campaign and a possible subsequent government negotiation:\n\nThe retirement allowance must be abolished, pensions must be increased substantially, crime at work must be combated and unemployment must be reduced.\n\n- I will make sure that the political content is as good as possible for Sweden's workers, says Johan Lindholm.\n\nS has promised to abolish the retirement allowance - to which the Center Party firmly says no. But the pressure from LO is firmly on the issue - now it's up to Magdalena Andersson to deliver.\n\n- It is a promise that it should be passed on. It should disappear if you win the election. Many elected representatives out there live by that promise.", "title_original": "Gnissel inför första maj: ”Talar inte om vad folk ska rösta på”", "summary_original": "Årets första-maj-firande är särskilt viktigt för Socialdemokraterna. Valåret höjer insatserna när arbetarrörelsen samlas. Under fredagen talar femtio representanter från facken och Socialdemokraterna i 26 partidistrikt.\n\nBandet mellan LO-förbunden och S är fortsatt starkt, men på senare år har det börjat gnissla i det röda maskineriet.  Tidskriften Arbetet kunde nyligen rapportera att endast två av 13 förbund ger ekonomiskt stöd till S. Men ifrån toppen av LO-hierarkin är stödet till S grundmurat. I år satsas 30 miljoner av medlemmarnas pengar på den egna valkampanjen som kommer att stödja S.\n\n– Det är ingen hemlighet att vi samverkar med Socialdemokraterna. Vi har baxat upp karensavdraget till att hamna i sjukförsäkringsutskottet, där den andra sidan inte vidare något intresse. Den hade kunnat vara avstädad för länge sedan. Nu gäller det att få ut pensionsfrågan, och andra frågor, och den resan återstår, säger LO-ordföranden Johan Lindholm. Fyra kraven på partiet LO ställer upp fyra krav på S inför valrörelsen och en eventuell efterföljande regeringsförhandling:\n\nKarensavdraget ska avskaffas, pensionerna ska höjas rejält, arbetslivskriminaliteten ska bekämpas och arbetslösheten ska ner.\n\n– Jag ska se till att det politiska innehållet är så bra som möjligt för Sveriges arbetare, säger Johan Lindholm.\n\nS har lovat att avskaffa karensavdraget - vilket Centerpartiet säger bestämt nej till. Men trycket från LO ligger fast i frågan - nu är det upp till Magdalena Andersson att leverera.\n\n– Det är ett löfte att det ska förpassas bort. Den ska försvinna om man vinner valet. Det löftet lever många förtroendevalda på där ute.", "link": "https://www.tv4.se/artikel/44dAb7bQSLLrqh04zDHizw/gnissel-mellan-s-och-lo-faergar-foersta-maj", "date_display": "2026-04-30", "date_iso": "2026-04-30T04:24:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Svensk politik", "/politik", "/valet-2022/socialdemokraterna", "/landsorganisationen-i-sverige-lo"]}, {"id": 151, "title": "Freedom of the press threatened - even Sweden loses: \"There is a way forward\"", "summary": "Laws and legal opportunities are used as weapons against journalists. Journalism is being criminalised, says Erik Larsson, spokesperson for RSF.  During the 25 years that RSF has measured press freedom in the world, the average score has gradually deteriorated. Now over half of the world's countries are in the two lowest categories, \"difficult\" or \"very difficult\" situation. According to Erik Larsson, it is the index's legal indicator that falls the most.  The United States is falling The change is taking place mainly in authoritarian states, where laws that are actually meant to fight terrorism or espionage are used to silence journalists. But the trend also seeps into democracies.  The United States is a country whose freedom of the press is crumbling. It has fallen seven positions in the index and now lands in place 64. Erik Larsson points to President Donald Trump's rhetoric as an explanation.  Trump attacks the media daily. He wants to portray himself as an outsider. The media should represent the elite who stand between him and the people.  Swedish press freedom also falls somewhat in the index. Sweden has moved back one position and is now in fifth place. Larsson is concerned about various laws that limit journalists' opportunities to work, such as bans on photography at police stations and other protected objects.  In addition, he describes a \"hostile media effect\". This means that the more radical people become, the harsher the media is criticized. At the bottom of the index is Eritrea for the third year in a row. The biggest decline was in Niger, which lost 37 places.  Has looked worse Despite grim numbers, there are countries that are climbing. Poland is cited as the prime example of a rapid turnaround. Their previous government attacked and controlled the media. Now their new government has wanted to restore what was lost. So they have climbed some 40 places in just a few years and are now in place 27, says Erik Larsson.  In addition, he emphasizes that historically it looks worse. He draws parallels to 1941 when Europe seemed to be devoured by aukt", "title_original": "Pressfriheten hotad – även Sverige tappar: ”Finns en väg framåt”", "summary_original": "Man använder sig av lagar och juridiska möjligheter som vapen mot journalister. Journalistiken kriminaliseras, säger Erik Larsson, talesperson för RSF.  Under de 25 år som RSF har mätt pressfriheten i världen har genomsnittspoängen successivt försämrats. Nu befinner sig över hälften av världens länder i de två lägsta kategorierna, ”svår” eller ”mycket svår” situation. Enligt Erik Larsson är det indexets juridiska indikator som sjunker mest.  USA dalar Förändringen sker främst i auktoritära stater, där lagar som egentligen är till för att bekämpa terrorism eller spionage används för att tysta journalister. Men trenden sipprar även in i demokratier.  USA är ett land vars pressfrihet krackelerar. Det har sjunkit sju placeringar i indexet och landar nu på plats 64. Erik Larsson pekar på president Donald Trumps retorik som en förklaring.  Trump går dagligen till angrepp mot medier. Han vill utmåla sig själv som en outsider. Medierna ska representera eliten som står mellan honom och folket.  Även den svenska pressfriheten faller något i index. Sverige har backat en placering och ligger nu på plats fem. Larsson oroar sig för olika lagar som inskränker journalisters möjligheter att jobba, som exempelvis avbildningsförbud på polishus och andra skyddsobjekt.  Dessutom beskriver han en ”hostile media effect”. Det innebär att ju radikalare människor blir, desto hårdare kritiseras medier. Längst ner på indexet finns Eritrea för tredje året i rad. Den största nedgången skedde i Niger som tappade 37 platser.  Har sett värre ut  Trots dystra siffror finns länder som klättrar. Polen nämns som det främsta exemplet på en snabb vändning. Deras tidigare regering angrep och kontrollerade medier. Nu har deras nya regering velat återställa det som gått förlorat. Så de har klättrat ett 40-tal placeringar på bara några få år och ligger nu på plats 27, säger Erik Larsson.  Dessutom betonar han att det historiskt sett värre ut. Han drar paralleller till 1941 då Europa såg ut att slukas av auktoritär makt, för att bara tio år senare ha ett totalförändrat läge. Om man tänker att det är kört, då kommer man definitivt att förlora. Historien har gång på gång visat att även i de mörkaste stunderna så finns det en väg framåt.", "link": "https://www.tv4.se/artikel/tt-260430-pressfrihetsindex1-aa5a2bff/pressfriheten-hotad-majoritet-av-landerna-roda", "date_display": "2026-04-30", "date_iso": "2026-04-30T04:00:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/donald-trump", "/norge", "/kina", "/sverige", "/nordkorea", "/danmark", "/iran", "/estland"]}, {"id": 152, "title": "Malina Abrahamsson:\nEveryone has stopped being sober - except me", "summary": "", "title_original": "Malina Abrahamsson:\nAlla har slutat vara nykterister – utom jag", "summary_original": "", "link": "https://www.dagen.se/kultur/malina-abrahamsson-alla-har-slutat-vara-nykterister-utom-jag/10284920", "date_display": "2026-04-30", "date_iso": "2026-04-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title"   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
