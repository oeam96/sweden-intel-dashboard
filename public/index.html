r being spotted wearing a pair that is clearly too big. Several recipients are said to feel pressured to use the shoes when staying near the president, even though they actually prefer more expensive brands. One minister reportedly joked that he had to put away his Louis Vuitton shoes to wear Florsheim instead. A scene in the Oval Room According to Vice President JD Vance, both he and Rubio received their shoes after a meeting in the Oval Room in December. During the meeting, Trump reportedly looked down at their feet and joked that they had \"bad shoes,\" before pulling out a catalog and asking the men in the room for their shoe sizes.  Rubio is said to have said size 46, Vance 48, and a third politician, whom Vance did not mention by name, stated size 40. Trump is then said to have leaned back and said that you \"can tell a lot of a man by his shoe size\". Rubio also has a previous connection, e.g", "title_original": "Trumps present till sina ”boys” skapar hysteri inne i Vita huset", "summary_original": "USA:s president Donald Trump har börjat ge bort finskor av oxford‑modell till ministrar, rådgivare och andra i sin innersta krets. Enligt Wall Street Journal kommer skorna från det amerikanska märket Florsheim och kostar runt 145 dollar. Enligt flera amerikanska medier har det blivit så vanligt att många i Vita huset känner sig tvungna att bära skorna när de träffar presidenten. – Alla killarna har dem, säger en Vita huset‑anställd till Wall Street Journal.  – Det är hysteriskt, för alla är rädda för att inte bära dem, säger en annan. En kärleksgåva Wall Street Journal skriver att Trump ofta kommenterar rådgivarnas skor under möten och försöker gissa deras storlek. Sedan ber han en assistent beställa ett par åt dem. Lådorna skickas till mottagarna – ibland med presidentens signatur på kartongen. Bland dem som fått ett par finns flera av Trumps närmaste: vicepresident JD Vance, utrikesminister Marco Rubio och försvarsminister Pete Hegseth. Även republikanska senatorer och profiler som Lindsey Graham och Sean Hannity sägs ha fått skor. På sociala medier har Marco Rubio blivit särskilt uppmärksammad efter att ha synts bära ett par som uppenbart är för stora. Flera mottagare ska känna sig pressade att använda skorna när de vistas nära presidenten, även om de egentligen föredrar dyrare märken. En minister har enligt rapporteringen skämtat om att han fått lägga undan sina Louis Vuitton‑skor för att i stället bära Florsheim. En scen i Ovala rummet Enligt vicepresident JD Vance fick både han och Rubio sina skor efter ett möte i Ovala rummet i december. Under mötet ska Trump ha tittat ner på deras fötter och skämtat om att de hade ”dåliga skor”, innan han tog fram en katalog och bad männen i rummet uppge sina skostorlekar.  Rubio ska ha sagt storlek 46, Vance 48, och en tredje politiker, som Vance inte nämnde vid namn, uppgav storlek 40. Trump ska då ha lutat sig tillbaka och sagt att man ”kan se mycket av en man på hans skostorlek”. Rubio har dessutom en tidigare koppling till märket. Under sin presidentkampanj 2016 bar han ett par Florsheim‑stövlar som blev omtalade efter spekulationer om att de var ett dyrt designerpar från Tom Ford – vilket de inte var, något som gav hans rivaler en möjlighet att reta honom, enligt Wall Street Journal.", "link": "https://www.tv4.se/artikel/6Xc0bc69KqdyflJIiCxNOx/trumps-gava-till-sina-boys-skapar-hysteri-i-vita-huset", "date_display": "2026-03-12", "date_iso": "2026-03-12T15:43:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/politik", "/usa", "/donald-trump", "/politiker", "/amerikansk-politik", "/modebranschen", "/mode-for-man", "/skor"]}, {"id": 139, "title": "Hailed after fight on stage - said she 'needs more oxygen'", "summary": "Just before the farewell tour \"Nu är det nåt stord gång\" almost the entire band was affected by the flu. Kikki Danielsson became sicker than the others, was hospitalized and several gigs were cancelled. The tour later resumed. But after Saturday's gig in Halmstad, the 73-year-old country and pop singer once again needed hospital treatment. In the past few days, it has been announced that the tour is being canceled completely because her health condition requires longer care. - It's not the kind of ending you want it to be, says conductor and pair horse Sören \"Sulo\" Karlsson to TV4 Nyheterna. - It is clear that it is a great sadness that it turned out the way it did, but above all it is sad that Kikki got sick. The farewell tour is for her. After all, she is the most important of all. \"Now I need more oxygen\" A concertgoer that TV4 Nyheterna has been in contact with says that Kikki Danielsson was \"noticeably fragile\", that she had to be led on and off the stage in Halmstad and several times gasped for breath. - She said on a couple of occasions: \"Oh, now I need more oxygen\", says the concertgoer. At the same time, it is said that there was a lot of humor in the way she talked about her health and her time in the hospital. Among other things, she wore her patient bracelet on stage – something Sören Karlsson says was part of a joke that they would be sponsored by the county council. - Humor is what has kept us together. We have worked together for 17 years and have a very special sense of humor that people like, he says. - There are no scripts, even if someone thinks there are. It's just because we're so incredibly fun together. Praised after the discharge The concertgoer describes the performance in Halmstad as nice and heartfelt and pays tribute to Kikki Danielsson. - She was noticeably exhausted but did her utmost to give the audience the best, says the concertgoer. - She is strong. She has an extreme will at the bottom. She would have completed this tour at any cost really. But now the price was probably a little too high, says Sören Karlsson. TV4 News", "title_original": "Hyllas efter kampen på scenen – sade att hon ”behöver mer syre”", "summary_original": "Strax innan avskedsturnén ”Nu är det nåt stort på gång” drabbades nästan hela bandet av influensa. Kikki Danielsson blev sjukare än de andra, lades in på sjukhus och flera spelningar ställdes in. Turnén återupptogs senare. Men efter lördagens spelning i Halmstad behövde den 73-åriga country- och schlagersångerskan återigen sjukhusvård. I dagarna kom beskedet att turnén ställs in helt eftersom hennes hälsotillstånd kräver längre vård. – Det är ju inte ett sånt slut man vill att det ska bli, säger kapellmästaren och parhästen Sören ”Sulo” Karlsson till TV4 Nyheterna. – Det är klart att det är en stor sorg att det blev som det blev, men framför allt är det tråkigt att Kikki blev sjuk. Det är ju för henne avskedsturnén är. Hon är ju trots allt viktigast av alla. ”Nu behöver jag mer syre” En konsertbesökare som TV4 Nyheterna har varit i kontakt med berättar att Kikki Danielsson var ”märkbart skör”, att hon fick ledas på och av scen i Halmstad och flera gånger kippade efter andan. – Hon sa vid ett par tillfällen: ”Oj, nu behöver jag mer syre”, säger konsertbesökaren. Samtidigt uppges det ha funnits mycket humor i hur hon pratade om sin hälsa och tiden på sjukhuset. Bland annat bar hon sitt patientarmband på scen – något Sören Karlsson berättar var en del i ett skämt om att de skulle vara sponsrade av landstinget. – Humorn är det som har hållit ihop oss. Vi har jobbat ihop i 17 år och har en väldigt speciell humor som folk gillar, säger han. – Det finns inga manus, även om någon tror att det är det. Det är bara för att vi är så otroligt roliga tillsammans. Hyllas efter urladdningen Konsertbesökaren beskriver spelningen i Halmstad som fin och hjärtlig och hyllar Kikki Danielsson. – Hon var märkbart tärd men gjorde sitt yttersta för att ge publiken det bästa, säger konsertbesökaren. – Hon är ju stark. Hon har en extrem vilja i botten. Hon hade fullföljt den här turnén till vilket pris som helst egentligen. Men nu var nog priset lite för högt, säger Sören Karlsson. TV4 Nyheterna har sökt Kikki Danielsson via hennes presskontakt, som meddelar att det inte finns någon möjlighet att prata med henne.", "link": "https://www.tv4.se/artikel/36aHwhdPxJK1wWYmFe3Xxu/hyllas-efter-kampen-pa-scenen-skrek-att-hon-behoever-mer-syre", "date_display": "2026-03-12", "date_iso": "2026-03-12T15:42:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/musik", "/personer/kikki-danielsson", "/konserter"]}, {"id": 140, "title": "The parish founder John van Dinther died after a long illness", "summary": "\"I want to thank you once again for all the support,\" says a farewell post on Facebook signed by himself", "title_original": "Församlingsgrundaren John van Dinther död efter lång tids sjukdom", "summary_original": "”Jag vill än en gång tacka för allt stöd”, står det i ett farvälinlägg på Facebook som är undertecknat av honom själv", "link": "https://www.dagen.se/nyheter/foersamlingsgrundaren-john-van-dinther-doed-efter-lang-tids-sjukdom/10248012", "date_display": "2026-03-12", "date_iso": "2026-03-12T14:40:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "First words from the new leader: Shall avenge the blood that was spilled", "summary": "\"Something of a lucky PR coup\"", "title_original": "Första orden från nya ledaren: Ska hämnas blodet som spillts", "summary_original": "”Något av en lyckosam PR-kupp”", "link": "https://www.tv4.se/artikel/r4zilR774n9lJmhm7R3FG/foersta-orden-fran-nya-ledaren-ska-haemnas-blodet-som-spillts", "date_display": "2026-03-12", "date_iso": "2026-03-12T14:10:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 142, "title": "Palestinian protester charged with incitement against ethnic group", "summary": "The man singled out Aron Verständig and Aron Flam as part of \"a powerful spider web\" and \"super Zionists\"", "title_original": "Palestinademonstrant åtalas för hets mot folkgrupp", "summary_original": "Mannen pekade ut Aron Verständig och Aron Flam som del i ”ett kraftigt spindelnät” och ”supersionister”", "link": "https://www.dagen.se/nyheter/palestinademonstrant-atalas-foer-hets-mot-folkgrupp/10248064", "date_display": "2026-03-12", "date_iso": "2026-03-12T13:22:22+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Civil duty back: \"Part of the reconstruction\"", "summary": "After 16 years of dormancy, conscription is now being reintroduced as part of the civil service. An increasingly troubled world, mainly regarding the war in Ukraine, is part of the reason why the conscription is now being withdrawn. - It is part of getting a more robust personnel supply and strengthening the parts of society that must function even during high alert and war. That is why it is part of the rebuilding of Sweden's total defence, says Ebba Huldén Bergström, coordinator at the Norwegian Duty and Enforcement Agency. The civil servants will be placed within the municipal rescue service and will be trained by the authorities for psychological defense (MPF) at the authority's facilities in Revinge and on Sandö. Only 28 percent women Civil service was already introduced in 2024, but then without conscription and thus without compulsory long basic education. People born in 2008 are the first to register for both conscription and civil service, and of the litter's 111,500 people, 180 people will be selected for the latter. 180 is quite a few, will there be more? - When MPF ​​submitted its government assignment last fall, they forecast that they could imagine training approximately 2,000 people. 180 is an initial number - and it is expected to be stepped up, says Ebba Huldén Bergström. Of the 30,000 who muster this year, 72 percent are men and the remaining 28 percent are women. Ebba Huldén Bergström says that she would have liked to see a more even distribution, but that there are several reasons why it looks the way it does. - One of them is that girls to a greater extent respond in a way in the enlistment documents that mean that you do not have the conditions to fulfill the requirements set for enlistment - and thus not get called up. Another is that girls want to do basic education to a lesser extent. It is a parameter that we take into account.  Siblings in full military service Just like military service, civil service is compulsory, which means that the person called must show up. - Otherwise, you can actually be prosecuted for breaching the duty of total defence. In the patterning process takes", "title_original": "Civilplikten tillbaka: ”En del av återuppbyggandet”", "summary_original": "Efter 16 års dvala återinförs nu mönstring till civilplikten. En allt oroligare värld, främst avseende kriget i Ukraina, är en del av orsaken till att mönstringen nu tas tillbaka. – Det är en del av att få en mer robust personalförsörjning och att förstärka de delarna av samhället som måste fungera även under höjd beredskap och krig. Det är därför det är en del av återuppbyggandet av Sveriges totalförsvar, säger Ebba Huldén Bergström, samordnare på Plikt- och prövningsverket. De civilpliktiga kommer placeras inom den kommunala räddningstjänsten och kommer utbildas av Myndigheter för psykologiskt försvar (MPF) på myndighetens anläggningar i Revinge och på Sandö. Bara 28 procent kvinnor Civilplikten infördes redan 2024, men då utan mönstring och därmed utan förpliktigande lång grundutbildning. Personer födda 2008 är de första som kommer mönstra till både värn- och civilplikten, och av kullens 111 500 personer kommer 180 personer tas ut för den senare. 180 är ganska få, kommer det bli fler? – När MPF lämnade in sitt regeringsuppdrag i höstas prognostiserade de att de kan tänka sig att utbilda ungefär 2 000 personer. 180 är en initial siffra – och den förväntas trappas upp, säger Ebba Huldén Bergström. Av de som 30 000 som mönstrar i år är 72 procent män och resterande 28 procent kvinnor. Ebba Huldén Bergström säger att hon gärna hade sett en jämnare fördelning, men att det finns flera orsaker till att det ser ut som det gör. – En av dem är att tjejer i större mån svarar på ett sätt i mönstringsunderlaget som gör att man inte har förutsättningar att uppfylla de krav som ställs vid mönstring – och därmed inte blir kallade. En annan är att tjejer i mindre utsträckning vill göra grundutbildning. Det är en parameter som vi tar hänsyn till.  Syskon inom totalförsvarsplikten Precis som värnplikten är civilplikten tvingande, vilket innebär att den som kallas måste inställa sig. – Annars kan man faktiskt åtalsanmälas för brott mot totalförsvarsplikten. I mönstringsprocessen tar vi dock hänsyn till inställningen, säger Ebba Huldén Bergström. Den största skillnaden från värnplikten är att den civilpliktige inte utbildas till soldat inom Försvarsmakten. – Värnplikten och civilplikten är syskon i lagstiftningen om totalförsvarsplikt. Inom civilplikten utbildas man inom den verksamhet man ska vara i. I det här fallet rör det sig om exempelvis räddningsledare inom räddningstjänsten. Inom kommunal räddningstjänst blir du räddningsperson från dag ett.", "link": "https://www.tv4.se/artikel/6zEgqzoqhgk8qYeR1b67x1/civilplikten-tillbaka-en-del-av-ateruppbyggandet", "date_display": "2026-03-12", "date_iso": "2026-03-12T10:24:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/civilt-forsvar", "/forsvarsmakten", "/myndigheten-for-civilt-forsvar-mcf"]}, {"id": 144, "title": "The police infiltrated drug networks in Västerbotten - three are convicted", "summary": "Originally the men did not come from Västerbotten, but in 2023 they took over a large part of the sale of narcotics in the region. The sale originated from Umeå and the men are said to have applied to the region in the hope of earning large sums of money.  - These are people who came from outside and saw an opportunity to take an area, said prosecutor Stina Stener in connection with the men being charged. The three men are now sentenced to between seven and eight years in prison. Two of them are sentenced for particularly serious drug offenses and the third for serious drug offences.  - The amounts of narcotics, such as the two defendants who are sentenced for particularly serious drug crimes, do not in themselves quite reach the level where the amount alone can justify such a classification, says court chairman Hans Sundberg. However, he believes that the network's capital of violence, that the purpose was purely financial and that people were indifferent to who bought the narcotics means that the classification is clearly justified. The police believe that the men have connections to the Dalen network and, according to the verdict, the business was conducted as part of the network. According to the investigation, one of the men must have had direct contact with the leader of the Dalen network, Mikael Tenezos, who was arrested in Mexico last year and extradited to Sweden.  Infiltrated by the police In November last year, the men were charged, in addition to the drug trade, but also for a series of crimes that came in the wake of the sale, including aggravated extortion and involving minors in crime.  Several young people have completed various assignments, such as salespeople, warehouse keepers and transporters. Several executors have already been sentenced in other cases and it was when one of the men, a 26-year-old who the police believe can be connected to the Dalen network, was looking for a new transporter that they fell into the police trap. \"Crown Princess Victoria\" asked the police to retrieve bombs The 26-year-old man posted an ad under the alias \"Crown Princess Victoria\" to carry out a mission where two explosive charges were to be transported from Skellefteå to Umeå.  \"KV has gifts in that chat", "title_original": "Polisen infiltrerade knarknätverk i Västerbotten – tre döms", "summary_original": "Ursprungligen kom inte männen från Västerbotten, men under 2023 tog de över en stor del av försäljningen av narkotika i regionen. Försäljningen utgick från Umeå och männen ska ha sökt sig till regionen i hopp om att tjäna stora summor pengar.  – Det är personer som kom utifrån och såg en möjlighet att ta ett område, sade åklagaren Stina Stener i samband med att männen åtalades. De tre männen döms nu till mellan sju och åtta års fängelse. Två av dem döms för synnerligen grovt narkotikabrott och den tredje för grovt narkotikabrott.  – De mängder narkotika, som de två tilltalade som döms för synnerligen grovt narkotikabrott, når i sig inte riktigt upp till den nivå där mängden ensam kan motivera en sådan rubricering, säger rättens ordförande Hans Sundberg. Dock menar han att nätverkets våldskapital, att syftet enbart varit ekonomiskt och att man varit likgiltig inför vem som köpt narkotikan gör att rubriceringen är klart motiverad. Polisen menar att männen har kopplingar till Dalennätverket och enligt domen bedrevs verksamheten som en del av nätverket. En av männen ska enligt utredningen haft direkt kontakt med Dalennätverkets ledare Mikael Tenezos, som greps i Mexiko förra året och utlämnades till Sverige.  Infiltrerades av polisen I november förra året åtalades männen, förutom narkotikahandeln, men även för en rad brott som kommit i spåren av försäljningen, bland annat grov utpressning och involverande av minderåriga i brottslighet.  Flera unga personer har genomfört olika uppdrag, som säljare, lagerhållare och transportörer. Flera utförare har redan dömts i andra mål och det var när en av männen, en 26-åring som polisen menar kan kopplas till Dalennätverket sökte en ny transportör som man gick i polisens fälla. ”Kronprinsessan Victoria” bad polisen hämta bomber Den 26-åriga mannen lade upp en annons genom aliaset ”Kronprinsessan Victoria” för att genomföra ett uppdrag där två sprängladdningar skulle fraktas från Skellefteå till Umeå.  ”KV har i den chatten presenterat olika jobb varav ett var att transportera sprängmedel från Skellefteå. Sprängmedlet ska bestå av laddningar på 10 gram styck”, skriver polisen i utredningen. Personen som svarade på annonsen kom från polisen, och tog på sig att utföra uppdraget. – Och det gjorde man, man körde upp till Skellefteå. Men naturligtvis så beslagtog man då sprängladdningarna, sade Stina Stener.  Greps i Portugal och Thailand Åklagaren menade att de tre männen kan kopplas till de alias som styrt försäljningen och de olika uppdragen. Bland annat genom alias som ”Tommy”, ”Ipren”, ”Bob” och ”Kronprinsessan Victoria” kan knytas till de åtalade.  Två av männen greps i Thailand respektive Portugal och utlämnades till Sverige. Enligt polisen gav gripandena en stor effekt på narkotikamarknaden i Västerbotten.  – Vi ser att det finns mindre narkotika i Västerbotten nu som en märkbar effekt av gripandena. Men efterfrågan på narkotika är fortsatt hög, därför följer vi noggrant utvecklingen, säger Thomas Palmgren, chef spaningsgruppen i polisområde Västerbotten. Döms för att ha anlitat polisen Den 24-åriga man som greps i Portugal i februari 2025 och utlämnades till Sverige döms för synnerligen grovt narkotikabrott. De andra två männen, 26-åringen och en 22-årig man döms, förutom för synnerligen grovt narkotikabrott respektive grovt narkotikabrott, för en rad andra brott. Bland annat involverande av minderåriga och brott mot lagen om brandfarliga och explosiva varor ”Bland annat för att ha anlitat polisens infiltratör till att hämta upp två sprängladdningar från Skellefteå, i syfte att pressa personer att betala påstådda skulder till dem”, skriver rätten i ett uttalande.", "link": "https://www.tv4.se/artikel/4zzsFL9BUVKCVli43MZ4n4/polisen-infiltrerade-knarknaetverk-i-vaesterbotten-tre-maen-doems", "date_display": "2026-03-12", "date_iso": "2026-03-12T10:07:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/umea", "/vasterbotten"]}, {"id": 145, "title": "The mother's kidney saved Jennifer: \"Life doesn't have to end\"", "summary": "Around 6,500 people in Sweden live with a transplanted kidney. One of them is Jennifer Jacobsson, who after suffering kidney failure received a new kidney from none other than her mother. Jennifer learned that she was suffering from an autoimmune disease that attacked her kidneys a few years ago. The doctors thought it would be at least ten years before she would need dialysis or a transplant. - But unfortunately, it went a little faster. In December 2024, I received a call where they said that my kidney function was so low that I needed a transplant, she says in Nyhetsmorgon. Mom matched It must have been dizzying? - Yes, it was the hardest time in this entire trip. It felt like my whole life passed in review. The future felt very uncertain. All the future dreams and goals you had, it felt like you had to give them up. It was so scary, says Jennifer. It was her own mother, Yvonne Gille, who had to donate one of her kidneys. - I thought I was too old and that someone your age was needed, she says. But in June they learned the mother was a match and the transplant took place in September. Everything has gone as it should and both are doing well. Has three kidneys Today, mother Yvonne lives with one kidney and Jennifer with three. - Many people think that they are taken out, but in the vast majority of cases they are left to sit. So then you have three - two that don't work and one that works. You can have up to four in your body, says Jennifer. They have named the donated kidney Sture. - We said we needed to have some joy in the midst of all this. Then we decided to name the kidney Sture, because it rhymes with kidney, says Yvonne. So on World Kidney Day, they want to take the opportunity to de-dramatize the horror surrounding transplants. - It is of course a major operation, but life does not have to end. I hope that even more people will take a stand on organ donation and understand how much of a difference it can make to a person, says Jennifer.", "title_original": "Mammans njure räddade Jennifer: ”Livet behöver inte ta slut”", "summary_original": "Omkring 6 500 personer i Sverige lever med en transplanterad njure. En av dem är Jennifer Jacobsson, som efter att ha drabbats av njursvikt fick en ny njure av ingen mindre än sin mamma. Jennifer fick veta att hon led av en autoimmun sjukdom som attackerade hennes njurar för några år sedan. Läkarna trodde det skulle dröja minst tio år innan hon skulle behöva dialys eller transplantation. – Men tyvärr så gick det lite snabbare. I december 2024 fick jag ett samtal där de sa att min njurfunktion var så låg att jag behövde en transplantation, säger hon i Nyhetsmorgon. Mamma matchade Det måste ha varit omtumlande? – Ja, det var den jobbigaste tiden i hela den här resan. Det kändes som att hela mitt liv passerade i revy. Framtiden kändes jätteosäker. Alla framtidsdrömmar och mål man hade, det kändes som att man skulle behöva ge upp dem. Det var så läskigt, säger Jennifer. Det blev hennes egen mamma, Yvonne Gille, som fick donera en av sina njurar. – Jag trodde att jag var för gammal och att det behövdes någon i din ålder, säger hon. Men i juni fick de veta att mamman var en match och transplantationen skedde i september. Allt har gått som det ska och båda mår bra. Har tre njurar I dag lever mamma Yvonne med en njure och Jennifer med tre. – Många tror att man tar ut dem, men i de allra flesta fall så låter man dem sitta. Så då har man tre – två som inte funkar och en som funkar. Man kan ha upp till fyra i kroppen, säger Jennifer. De har döpt den donerade njuren till Sture. – Vi sa att vi behövde ha lite glädje mitt i allt det här. Då bestämde vi oss för att döpa njuren till Sture, för att det rimmar på njure, säger Yvonne. Så här på Världsnjurdagen vill de passa på att avdramatisera skräcken kring transplantationer. – Det är ju såklart en stor operation, men livet behöver inte ta slut. Jag hoppas att ännu fler ska ta ställning till organdonation och förstå hur stor skillnad det kan göra för en människa, säger Jennifer.", "link": "https://www.tv4.se/artikel/4wG5FKnxZu8qvQUhqnGevS/mammans-njure-raeddade-jennifer-livet-behoever-inte-ta-slut", "date_display": "2026-03-12", "date_iso": "2026-03-12T09:22:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/sjukdomar", "/sjukvard", "/sjukvarden", "/transplantation", "/donation"]}, {"id": 146, "title": "The Payments Report 2026: Measures required to reduce vulnerability and increase inclusion in the payments market", "summary": "In order to reduce dependence on the outside world, the banks need to develop new payment services based on national and European systems. Primarily, banks must offer more services for instant payments, otherwise legislation should be introduced. To increase inclusion in the payment market, more payment methods are needed for those who do not have a payment account or experience digital exclusion. Access to cash services also needs to be improved, the Riksbank writes in the Payment Report published today.", "title_original": "Betalningsrapporten 2026: Åtgärder krävs för minskad sårbarhet och ökad inkludering på betalningsmarknaden", "summary_original": "För att minska omvärldsberoendet behöver bankerna utveckla nya betaltjänster som bygger på nationella och europeiska system. Primärt måste bankerna erbjuda fler tjänster för omedelbara betalningar, annars bör lagstiftning införas. För att öka inkluderingen på betalningsmarknaden behövs det fler betalsätt för de som saknar betalkonto eller upplever digitalt utanförskap. Tillgången till kontanttjänster behöver också förbättras, det skriver Riksbanken i Betalningsrapporten som publiceras idag.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/betalningsrapporten-2026-atgarder-kravs-for-minskad-sarbarhet-och-okad-inkludering-pa-betalningsmarknaden/", "date_display": "2026-03-12", "date_iso": "2026-03-12T08:00:30+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 147, "title": "The message after the Lamine case: \"Working on right now\"", "summary": "Seven-month-old Lamine was forcibly taken into care by Social Services after care discovered cracks in his skeleton. Despite conflicting medical assessments about how the injuries occurred, he is still placed in a family home as, according to the law, it is not possible to get a so-called \"second opinion\".  Now Social Services Minister Camilla Waltersson Grönvall announces that they want to strengthen legal certainty in this type of case.  - When you make a decision about custody, the decision must be based on what is in the best interests of the child, but of course also be legally secure, she says and continues: - That is the vast majority of decisions today in Sweden. But there are examples, as there are in all organizations and situations, of decisions that are not correct.  Reviewing legal certainty When Lamine was first examined, doctors made the assessment that the cracks in his skeleton were signs of child abuse. A later medical assessment, carried out at the parents' initiative, instead points out that the injuries may be due to osteoporosis and a hereditary disease that the mother has. Several doctors that TV4 Nyheterna spoke to believe that legal certainty needs to be improved. According to Camilla Waltersson Grönvall, work is now underway with several proposals: - One of the proposals is about enhanced psychiatric and medical competence, linked to both social welfare boards and courts. When the changes can become a reality is still unclear. - It is being prepared and worked on right now. So we will come back to that shortly, she says.", "title_original": "Beskedet efter Lamine-fallet: ”Arbetas med just nu”", "summary_original": "Sju månader gamla Lamine tvångsomhändertogs av Socialtjänsten efter att vården upptäckt sprickor i hans skelett. Trots motstridiga läkarbedömningar kring hur skadorna uppkommit är han fortsatt placerad i familjehem då det enligt lagen inte är möjligt att få en så kallad ”second opinion”.  Nu meddelar socialtjänstminister Camilla Waltersson Grönvall att man vill stärka rättssäkerheten i den här typen av ärenden.  – När man fattar beslut om ett omhändertagande, ska beslutet utgå ifrån vad som är barnets bästa, men naturligtvis också vara rättssäkert, säger hon och fortsätter: – Det är de allra flesta besluten i dag i Sverige. Men det finns exempel, som det gör i alla organisationer och situationer, på beslut som inte är korrekta.  Ser över rättssäkerheten När Lamine först undersöktes gjorde läkare bedömningen att sprickorna i hans skelett var tecken på barnmisshandel. En senare medicinsk bedömning, som gjorts på föräldrarnas initiativ, pekar i stället på att skadorna kan bero på benskörhet och en ärftlig sjukdom som mamman har. Flera läkare som TV4 Nyheterna talat med menar att rättssäkerheten behöver förbättras. Enligt Camilla Waltersson Grönvall pågår nu arbete med flera förslag: – Ett av förslagen handlar om en förstärkt psykiatrisk och medicinsk kompetens, kopplat till både socialnämnder och domstolar. När förändringarna kan bli verklighet är ännu oklart. – Det förbereds och arbetas med just nu. Så vi kommer att återkomma i närtid om det, säger hon.", "link": "https://www.tv4.se/artikel/4kX2DB3z9vfKGolyN4iEhh/beskedet-efter-lamine-fallet-arbetas-med-just-nu", "date_display": "2026-03-12", "date_iso": "2026-03-12T07:33:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/lvu-bebisen-lamine", "/lvu", "/socialtjansten"]}, {"id": 148, "title": "Concern among Swedish Iranians after the assassination attempt on Khoshnood", "summary": "Want to see the embassy closed down • \"We have tried to warn\"", "title_original": "Oro bland svenskiranier efter mordförsöket på Khoshnood", "summary_original": "Vill se ambassaden nedstängd • ”Vi har försökt varna”", "link": "https://www.tv4.se/artikel/4QR22rhJjqdzoVdIx393ue/oro-bland-svenskiranier-efter-mordfoersoek-pa-regimkritiker", "date_display": "2026-03-12", "date_iso": "2026-03-12T05:09:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 149, "title": "125 notifications against Melodifestivalen - most react to Christian parody", "summary": "According to the Review Board, it is the opening number in competition two that seems to have upset the most viewers", "title_original": "125 anmälningar mot Melodifestivalen – flest reagerar på kristen parodi", "summary_original": "Enligt Granskningsnämnden är det öppningsnumret i deltävling två som verkar ha upprört flest tittare", "link": "https://www.dagen.se/kultur/125-anmaelningar-mot-melodifestivalen-flest-reagerar-pa-kristen-parodi/10243929", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Aaron Lindström's mother after the crash: There is only God in this", "summary": "Swedish medal hope at the Paralympics is being treated in hospital after a violent fall.", "title_original": "Aaron Lindströms mamma efter kraschen: Det är bara Gud i detta", "summary_original": "Svenskt medaljhopp på Paralympics vårdas på sjukhus efter våldsamt fall.", "link": "https://www.dagen.se/nyheter/aaron-lindstroems-mamma-efter-kraschen-det-aer-bara-gud-i-detta/10244834", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "Episode 229: Kalle Moller", "summary": "The person of the day is hosted by the TV producer and YouTube profile Kalle Möller.", "title_original": "Avsnitt 229: Kalle Möller", "summary_original": "Dagens människa gästas av tv-producenten och youtubeprofilen Kalle Möller.", "link": "https://www.dagen.se/podd/avsnitt-229-kalle-moeller/10246701", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Beware of easy explanations and conspiracy theories", "summary": "When Christianity is reduced to conspiracy, fear and hatred, it is not the faith that is being defended but the dangerous ideological bubble that one is trapped in, writes Axel Otterberg.", "title_original": "Se upp för enkla förklaringar och konspirationsteorier", "summary_original": "När kristendom reduceras till konspiration, rädsla och hat är det inte tron man försvarar utan den farliga ideologiska bubbla man fastnat i, skriver Axel Otterberg.", "link": "https://www.dagen.se/debatt/se-upp-foer-enkla-foerklaringar-och-konspirationsteorier/10218606", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "Lemon pastry – with a feeling of spring", "summary": "\"A taste of the light coming back and the days getting longer\"", "title_original": "Citronbakelse – med en känsla av vår", "summary_original": "”En smak av att ljuset kommer tillbaka och att dagarna blir längre”", "link": "https://www.dagen.se/mat/citronbakelse-med-en-kaensla-av-var/10240097", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Shane was in prison until age 27: Saved from behind bars through Alpha", "summary": "Now he is the one who evangelizes in custody and in prisons in England • \"When Sweden's government sees that it has such a big impact, they will surely want Alpha everywhere in the prisons.\"", "title_original": "Shane satt på anstalter till 27 års ålder: Blev frälst bakom galler genom Alpha", "summary_original": "Nu är det han som evangeliserar i häkten och på fängelser i England • ”När Sveriges regering ser att det får ett så stort genomslag kommer de säkert vilja ha Alpha överallt i fängelserna.”", "link": "https://www.dagen.se/nyheter/shane-satt-pa-anstalter-till-27-ars-alder-blev-fraelst-bakom-galler-genom-alpha/10240511", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Emma Audas:\nFreedom requires saying no to yourself.", "summary": "Lent reminds us of a forgotten truth: life grows when we no longer put ourselves first.", "title_original": "Emma Audas:\nFrihet kräver att du säger nej till dig själv.", "summary_original": "Fastetiden påminner om en bortglömd sanning: livet växer när vi inte längre sätter oss själva först.", "link": "https://www.dagen.se/ledare/emma-audas-frihet-kraever-att-du-saeger-nej-till-dig-sjaelv/10238029", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Roma believers have become a force for growth in our congregation", "summary": "The experiences from our congregation are both exciting and challenging, because integration is never easy, write Alf Lax, Janne Peterson, Göte Sennerstam, Ivar Gustafsson and Roberto Josef.", "title_original": "Romska troende har blivit en växtkraft i vår församling", "summary_original": "Erfarenheterna från vår församling är både spännande och utmanande, för integration är aldrig enkelt, skriver Alf Lax, Janne Peterson, Göte Sennerstam, Ivar Gustafsson och Roberto Josef.", "link": "https://www.dagen.se/debatt/romska-troende-har-blivit-en-vaextkraft-i-var-foersamling/10149494", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Eurovision fans in Israel demand a protest against the middle winner Felicia", "summary": "\"Important to give tangible punishments when someone breaks the rules\"", "title_original": "Eurovisionfans i Israel kräver protest mot Mellovinnaren Felicia", "summary_original": "”Viktigt ge kännbara straff när någon bryter mot reglerna”", "link": "https://www.dagen.se/nyheter/eurovisionfans-i-israel-kraever-protest-mot-mellovinnaren-felicia/10246266", "date_display": "2026-03-12", "date_iso": "2026-03-12T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "This is how Ukraine continues to advance in the war: \"Behind enemy lines\"", "summary": "SpaceX's Internet service Starlink has been used extensively on the battlefield in Ukraine. With the help of Starlink, both Ukrainian and Russian drones have been able to connect and be guided towards their targets - until February. Then SpaceX chose to exclude Russia from the service, something that led to problems for Russia to be able to lead its troops and get a picture of the battlefield, writes the ISW think tank. Captured another 200 square kilometers In February, it was reported that Ukraine captured 200 square kilometers in the Dnipro region. The operations were described as tactical counterattacks and the biggest Ukrainian breakthrough since the counteroffensive three years earlier.  \"The recaptured area is almost as large as the Russian gains throughout December and is the largest area that Kiev's forces have retaken in such a short period since the counter-offensive that began in June 2023,\" wrote AFP, which analyzed the areas. According to several people in the Ukrainian military, they have now retaken at least 200 square kilometers more in the Dnipro region and liberated several communities, in total it is more than 400 square kilometers since January 2024. The advances have, among other things, taken place in the direction of the communities of Oleksandrivka and Huljajpole, where they have been successful before. At the same time, they continue to emphasize that it is not an organized counter-offensive. - This is about offensive measures to improve our tactical position and stabilize the front line in the area where the enemy is moving his forces, Dmytro Filatov, commander of Ukraine's 1st Independent Assault Regiment told Ukrainian Pravda. The picture below shows the offensive successes in the direction of Oleksandrivka. The advantages: Bad weather and connectivity In the offensive direction towards the community of Oleksandrivka, Ukraine is said to have advanced ten to eleven kilometers into previously occupied Russian territory. One of the success factors must have been that Ukraine took advantage of the bad weather conditions and knocked out the Russian drone defense.  - Under snow and", "title_original": "Så fortsätter Ukraina avancera i kriget: ”Bakom fiendens linjer”", "summary_original": "SpaceX:s internettjänst Starlink har använts flitigt på slagfältet i Ukraina. Med hjälp av Starlink har både ukrainska och ryska drönare kunnat koppla upp sig och styras mot sina mål – fram tills i februari. Då valde SpaceX att stänga ute Ryssland från tjänsten, något som lett till problem för Ryssland att kunna leda sina trupper och få en bild av slagfältet, skriver tankesmedjan ISW. Intagit ytterligare 200 kvadratkilometer I februari rapporterades att Ukraina intagit 200 kvadratkilometer i Dnipro-regionen. Operationerna beskrevs som taktiska motattacker och den största ukrainska landvinningen sedan motoffensiven tre år tidigare.  ”Det återtagna området är nästan lika stort som de ryska landvinningarna under hela december och är den största ytan som Kievs styrkor har återtagit under en så kort period sedan motoffensiven som inleddes i juni 2023”, skrev AFP som analyserat områdena. Enligt flera personer inom den ukrainska militären ska man nu ha återtagit minst 200 kvadratkilometer till i Dnipro-regionen och befriat flera samhällen, totalt handlar det om över 400 kvadratkilometer sedan januari 2024.  Framryckningarna har bland annat skett i riktning mot samhällena Oleksandrivka och Huljajpole, där man varit framgångsrik tidigare. Samtidigt betonar man fortsatt att det inte handlar om någon organiserad motoffensiv. – Detta handlar om offensiva åtgärder för att förbättra vår taktiska position och stabilisera frontlinjen i det område dit fienden flyttar sina styrkor, säger Dmytro Filatov, befälhavare för Ukrainas 1:a fristående anfallsregemente till ukrainska Pravda. På bilden nedan visas de offensiva framgångarna i riktning mot Oleksandrivka. Fördelarna: Dåligt väder och uppkoppling I den offensiva riktningen mot samhället Oleksandrivka ska Ukraina ha tagit sig tio till elva kilometer in på tidigare ockuperat ryskt område. En av framgångsfaktorerna ska ha varit att Ukraina utnyttjat de dåliga väderförhållandena och slagit ut det ryska drönarförsvaret.  – Under snö och dimma gick vi in bakom fiendens linjer och förstörde deras spaning, Mavic-drönarna, så att de inte skulle se vad som hände vid frontlinjen. Sedan rensade vi området, som vi snabbt passerade. I praktiken genomförde vi sabotageaktioner, säger Filatov.  Likt vid de tidigare offensiva aktionerna ska bortfallet av Starlink på den ryska sidan varit till stor fördel för Ukraina.  ”De ukrainska luftburna anfallsstyrkorna rapporterade att SpaceX:s blockering av Starlink-satellitanslutningen den 1 februari ytterligare försämrade den ryska lägesuppfattningen och försvårade rysk ledning och kontroll i riktning mot Oleksandrivka”, skriver ISW.", "link": "https://www.tv4.se/artikel/17MHxFJWYot7fLpHsKlfUX/sa-fortsaetter-ukraina-avancera-i-kriget-bakom-fiendens-linjer", "date_display": "2026-03-11", "date_iso": "2026-03-11T20:54:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/ukraina", "/dnipro", "/ryssland"]}, {"id": 159, "title": "Several politicians demand tougher measures - after TV4's revelation", "summary": "Iran's ambassador waves away claims • Wants diplomats expelled", "title_original": "Flera politiker kräver hårdare tag – efter TV4:s avslöjande", "summary_original": "Irans ambassadör viftar bort påståendena • Vill att diplomater utvisas", "link": "https://www.tv4.se/artikel/2govmbrDF5ydIWA1AHHkvD/flera-politiker-kraever-hardare-tag-efter-tv4-s-avsloejande", "date_display": "2026-03-11", "date_iso": "2026-03-11T20:53:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 160, "title": "The jury is floored by crystal salt, incense – and umami bomb", "summary": "For participant Jenny Krüger, crystals are calming and vibrational raising, and she sees it as her calling to help people find their own inner light. For the audition in \"Sweden's master chef\", she has therefore brought some of her favorite stones. The first thing she does at her station is to start clearing the room of some old energy. - Do you think we are old?, says Tom Sjöstedt. \"A form of meditation to cook and taste\" The jury sits with their eyes closed while Jenny Krüger explains that even cooking is a spiritual process for her. - It is a form of meditation to cook and taste, she says. She offers a tribute to late summer, based on Swedish ingredients and ends the dish by sprinkling some crystal salt over it. - Before you arrive, I think we should take a deep breath again and then let your heart open with curiosity and guide you to the food, she says. The jury is floored by the flavors Tommy Myllymäki states that Jenny Krüger comes in with a bit of a \"free spirit\" feeling and that it can initially be perceived as a bit flamboyant. - It is completely contradictory. Because what is on the plate, for me, is prepared with surgeon's precision and an enormous certainty of taste. It's yes, says the star chef. - That is an umami bomb of a rarely seen kind. Unbelievable how good it was. I am in shock, says Tom Sjöstedt. Tina Nordström joins the chorus of praise. - That was so damn good, she says. - From personality to what's on the plate, it's two different worlds. It just happened, really. I didn't see that coming, says Tom Sjöstedt.", "title_original": "Juryn golvas av kristallsalt, rökelser – och umamibomb", "summary_original": "För deltagaren Jenny Krüger är kristaller lugnande och vibrationshöjande och hon ser det som sitt kall att hjälpa människor att hitta sitt eget inre ljus. Till audition i ”Sveriges mästerkock” har hon därför tagit med några av sina favoritstenar. Det första hon gör vid sin station är att börja rena rummet från lite gammal energi. – Tycker du att vi är gamla?, säger Tom Sjöstedt. ”En form av meditation att få laga och smaka” Juryn sitter med slutna ögon medan Jenny Krüger förklarar att även matlagning är en spirituell process för henne. – Det är en form av meditation att få laga och smaka, säger hon. Bjuder gör hon på en hyllning till sensommaren, baserad på svenska råvaror och avslutar rätten med att riva lite kristallsalt över. – Innan ni kommer fram tycker jag att vi ska ta ett djupt andetag igen och så låter du ditt hjärta få öppna sig med nyfikenhet och guida dig fram till maten, säger hon. Juryn golvas av smakerna Tommy Myllymäki konstaterar att Jenny Krüger kommer in med lite ”free spirit”-känsla och att det inledningsvis kan uppfattas som lite flamsigt. – Det är helt motsägelsefullt. För det som ligger på tallriken, för mig, är tillagat med kirurgprecision och en enorm smaksäkerhet. Det är ja, säger stjärnkocken. – Det där är en umamibomb av sällan skådat slag. Otroligt vad gott det var. Jag är i chock, säger Tom Sjöstedt. Tina Nordström stämmer in i hyllningskören. – Det där var så jädrans bra, säger hon. – Från personlighet till det som ligger på tallriken är det två olika världar. Det bara hände, på riktigt. Det såg jag inte komma, säger Tom Sjöstedt.", "link": "https://www.tv4.se/artikel/2kz1fW1gEKbQs6YcrNhFDP/juryn-golvas-av-kristallsalt-och-roekelser", "date_display": "2026-03-11", "date_iso": "2026-03-11T19:30:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/sveriges-masterkock", "/tv4", "/tv4-play"]}, {"id": 161, "title": "Petter questioned by the police - about his children's book: \"Not about sex\"", "summary": "On Tuesday, the children's book author Petter Wallenberg was summoned for questioning by the police to answer questions about the hatred and threats generated by his children's book.  - It is great that the police are getting to the bottom of this, he says.  The book \"Among dragons and drag queens\" is based on modern interpretations of classic fairy tales. For nine years, the drag show theater company of the same name has toured Sweden and read the fairy tales to children, young people and adults. The performances have been praised, but Petter Wallenberg says that he has had to endure hatred and threats. - They have called us pedophiles, rapists, pigs and sick. Personally, I have been stalked, harassed and hanged. \"It's bizarre\" In the end, he chose to report the threats to the police and has since been interrogated continuously for several months. In the police interrogation, he has had it explained to him that those who report claim that they want to protect the children. - I have had to sit in police interrogations and explain: \"No, the drag show is not about sex, and the book is not a sex story for children,\" says Petter Wallenberg.  In total, he has testified in eight trials and believes that he was met with prejudice and criticism even there. - It is bizarre that we have a court that seriously asks if there is any link between drag and pedophilia, and defense lawyers who say: \"LGBTQ people really shouldn't be allowed to perform for children\". Has led to convictions So far, Petter Wallenberg has made 200 reports against the hatred directed at him, which has led to 20 convictions for incitement against ethnic groups. Now he has submitted the book to the police so they can understand what the hate is directed at.  - It is good that the police are getting to the bottom of this, but I think it is the first children's book that becomes part of a police investigation. Now he hopes it will lead to change.  - More people must dare to report, the police must gain more knowledge and politicians must start acting.", "title_original": "Petter förhörd av polis – om sin barnbok: ”Handlar inte om sex”", "summary_original": "På tisdagen blev barnboksförfattaren Petter Wallenberg kallad till förhör hos polisen för att svara på frågor om det hat och de hot som hans barnbok genererat.  – Det är jättebra att polisen går till botten med det här, säger han.  Boken ”Bland drakar och dragqueens” bygger på moderna tolkningar av klassiska sagor. I nio år har dragshow-teatersällskapet med samma namn turnerat runt i Sverige och läst sagorna för barn, unga och vuxna. Föreställningarna har prisats, men Petter Wallenberg berättar att han har fått utstå hat och hot. – De har kallat oss pedofiler, våldtäktsmän, svin och sjuka. Personligen har jag blivit förföljd, trakasserad och uthängd. ”Det är bisarrt” Till slut valde han att polisanmäla hoten och har sedan dess blivit förhörd löpande under flera månader. I polisförhören har han fått förklarat för sig att de som anmäler hävdar att de vill skydda barnen. – Jag har varit tvungen att sitta i polisförhör och förklara: ”Nej, dragshow handlar inte om sex, och boken är ingen sexsaga för barn”, säger Petter Wallenberg.  Totalt har han vittnat i åtta rättegångar och menar att han mötts av fördomar och kritik även där. – Det är bisarrt att vi har en domstol som på allvar frågar om det finns någon länk mellan drag och pedofili, och försvarsadvokater som säger: ”hbtq-personer borde verkligen inte få uppträda för barn”. Har lett till fällande domar Hittills har Petter Wallenberg gjort 200 anmälningar mot det hat som riktats mot honom, vilket har lett till 20 fällande domar för hets mot folkgrupp. Nu har han lämnat in boken till polisen för att de ska förstå vad hatet riktas mot.  – Det är bra att polisen går till botten med det här, men jag tror att det är den första barnboken som blir del av en polisundersökning. Nu hoppas han att det ska leda till förändring.  – Fler ska våga anmäla, polisen ska få mer kunskap och politiker ska börja agera.", "link": "https://www.tv4.se/artikel/1g1SpEWO1Vbb3AfLY87bWf/petter-foerhoerd-av-polis-om-sin-barnbok-handlar-inte-om-sex", "date_display": "2026-03-11", "date_iso": "2026-03-11T19:28:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/hbtqia", "/polisen"]}, {"id": 162, "title": "The expert warns of Ica's advice: \"You may die\"", "summary": "In Ica's food magazine Buffé, readers are advised to make use of potato peels and leftover potato pieces by fermenting them with salt in a jar. The tip is highlighted as a simple hack that should give increased umami taste and serve as a tasty base for sauces. Now, however, the council is receiving sharp criticism from food hygiene professor Marie‑Louise Danielsson‑Tham. - The worst thing that can happen is that you die, she says. Deadly nerve agent Danielsson-Tham refers to the risk of the bacterium clostridium botulinum, which is found naturally in soil and can appear on potato skins. In the event of incorrect fermentation, the bacteria can form botulinum toxin, a life-threatening nerve agent. - Potato skins are almost impossible to clean. Small soil particles can carry spores that then develop into bacteria if the conditions are wrong, she says. The botulinum toxin lacks taste, smell and color, which means that a home cook cannot detect that the food has become dangerous. - You don't notice it until it's too late, says Danielsson‑Tham. \"No heysan-hoppsan method\" She emphasizes that fermentation is a complicated method that requires knowledge, the right raw materials and control over hygiene, amount of salt and pH value. - Fermenting is not a hello-hoppsan method. Perfect raw materials, the right amount of salt, thorough cleaning and a quick pH reduction are required for the process to be safe, she says. According to her, it is not possible to achieve the required level of hygiene if peels or defective potato residues are used. - It must be raw materials in absolute top condition. Leftover pieces or shells are not suitable, says Danielsson-Tham. Sees a lack of knowledge Marie-Louise Danielsson‑Tham has previously called for recipe creators and newspapers to seek the help of food hygiene expertise before publishing advice. - I see a risk with anyone who lacks sufficient knowledge. You should have a food hygienist read this sort of thing before it goes to print, she says. She describes how fermentation has become increasingly popular, not least linked to food waste and home preparation.", "title_original": "Experten varnar för Icas tips: ”Det kan hända att man dör”", "summary_original": "I Icas mattidning Buffé tipsas läsarna om att ta vara på potatisskal och överblivna potatisbitar genom att fermentera dem med salt i en burk. Tipset lyfts fram som ett enkelt svinnhack som ska ge förhöjd umamismak och fungera som en smakrik bas till såser. Nu får rådet dock skarp kritik av livsmedelshygienprofessorn Marie‑Louise Danielsson‑Tham. – Det värsta som kan hända är att man dör, säger hon. Livsfarligt nervgift Danielsson‑Tham hänvisar till risken för bakterien clostridium botulinum, som finns naturligt i jord och kan förekomma på potatisskal. Vid felaktig fermentering kan bakterien bilda botulinustoxin, ett livsfarligt nervgift. – Potatisskal är nästintill omöjliga att få rena. Små jordpartiklar kan bära på sporer som sedan utvecklas till bakterier om förhållandena är fel, säger hon. Botulinustoxinet saknar smak, lukt och färg, vilket gör att en hemmakock inte kan upptäcka att maten blivit farlig. – Man märker det inte förrän det är för sent, säger Danielsson‑Tham. ”Ingen hejsan-hoppsan-metod” Hon betonar att fermentering är en komplicerad metod som kräver kunskap, rätt råvaror och kontroll över hygien, saltmängd och pH‑värde. – Att fermentera är ingen hejsan‑hoppsan‑metod. Det krävs perfekta råvaror, rätt saltmängd, noggrann rengöring och en snabb pH‑sänkning för att processen ska vara säker, säger hon. Enligt henne är det inte möjligt att uppnå den hygiennivå som krävs om man använder skal eller defekta potatisrester. – Det ska vara råvaror i absolut toppskick. Överblivna bitar eller skal är inte lämpliga, säger Danielsson-Tham. Ser brist på kunskap Marie-Louise Danielsson‑Tham har tidigare efterlyst att receptkreatörer och tidningar tar hjälp av livsmedelshygienisk expertis innan råd publiceras. – Jag ser en risk med alla som saknar tillräckliga kunskaper. Man borde låta en livsmedelshygieniker läsa igenom sånt här innan det går i tryck, säger hon. Hon beskriver hur fermentering blivit allt mer populärt, inte minst kopplat till matsvinn och hemberedskap. Samtidigt menar hon att kunskapen hos både läsare och receptskapare ofta är otillräcklig. – Det finns många gamla metoder som var självklara för tidigare generationer. De kunskaperna finns inte längre, säger hon. Ica: Tror läsarna förstår Hanna Dunér, chefredaktör på Buffé, understryker att alla recept faktakollas av bland annat en dietist, en hållbarhetsansvarig och en receptansvarig. ”Tipset är ett citat i en intervju med kocken Elvira Lindqvist om hur man kan ta tillvara på matsvinn. Det är menat just som ett tips och inte ett recept och det tror vi Buffés läsare förstår”, skriver hon i en kommentar till TV4 Nyheterna.", "link": "https://www.tv4.se/artikel/7Fswc4qF258mwQdfZXGfhh/experten-varnar-foer-icas-tips-det-kan-haenda-att-man-doer", "date_display": "2026-03-11", "date_iso": "2026-03-11T18:05:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/mat", "/matbutiker", "/matlagning", "/ica", "/forgiftning", "/gift"]}, {"id": 163, "title": "\"It is likely that an act will happen\" - Säpo's tactics after the Iran war", "summary": "According to information • \"Works incredibly intensively\"", "title_original": "”Sannolikt att dåd kommer ske” – Säpos taktik efter Irankriget", "summary_original": "Enligt uppgifter • ”Jobbar otroligt intensivt”", "link": "https://www.tv4.se/artikel/5gYUc1CftWOUI5jiD2HuWm/saepos-taktik-efter-irankriget-sannolikt-att-dad-kommer-ske", "date_display": "2026-03-11", "date_iso": "2026-03-11T16:25:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 164, "title": "As a Christian, I am ashamed of what the US is doing in the name of God", "summary": "Erik Helmerson: We cannot be surprised if Muslims react to the crusade rhetoric.", "title_original": "Jag skäms som kristen över vad USA gör i Guds namn", "summary_original": "Erik Helmerson: Vi kan inte förvånas om muslimer reagerar på korstågsretoriken.", "link": "https://www.dagen.se/ledare/jag-skaems-som-kristen-oever-vad-usa-goer-i-guds-namn/10242146", "date_display": "2026-03-11", "date_iso": "2026-03-11T10:15:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 165,       const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
