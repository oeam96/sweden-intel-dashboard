"/varningar", "/tiktok", "/virala-trender"]}, {"id": 144, "title": "Tävlingen fick göras om efter väderkaoset", "summary": "I måndagens ”Robinson” skulle deltagarna balansera en kula på en spade genom en bana. Den uppmärksamma tittaren kunde se hur det plötsligt fanns rep längs spadarna, vilket gjorde det lättare att hålla kulan på plats.\n\nJessica Lasses berättar att det berodde på det svåra vädret. ”Alltså det blåste typ storm. Sand piskades rakt in i ögonhålorna på oss och blästrade typ hela hornhinnan kändes det som. Vi var ju tvungna att hela tiden typ stå med uppspärrade ögon för blinkade du så kunde det komma en vind i det ögonblicket och då var kulan ur balans, och då var det bara att börja om”, skriver hon till TV4 Nyheterna. ”Irriterad” Efter vad som enligt Jessica Lasses kändes som en evighet pausade produktionen tävlingen på grund av den hårda blåsten och tog in spadarna. ”Vi hade nog stått kvar där än i dag om de inte gjort den där abrovinken med spadarna, vilket gjorde att spelet över huvud taget typ kunde genomföras”, skriver hon. Tävlingen testades dagen före, när vädret var betydligt lugnare. Enligt Jessica Lasses hade den hårda blåsten kunnat gynna ett lag om motståndarna fått problem med sikten. Men så blev det inte. ”Det hade såklart varit härligare om spadarna hade varit mer ”preppade” från start, men jobbigt vet jag inte om det var, det var nog mer en lättnad. Sen blir man ju såklart alltid irriterad när något ändras under spelets gång, beroende på när i spelet reglerna helt plötsligt ändras, och om det är för ens egna lags för eller nackdel”. I övrigt bra Bortsett från väderkaoset tyckte hon att det var en bra pristävling eftersom de varken behövde använda särskilt mycket styrka eller hjärna när deltagarnas personliga saker låg i potten. ”Vi snackar saker som bland annat hjälpte oss att fördriva tiden om vi kände oss uttråkade, men sen också saker som för vissa kanske påminde om ”hemma” i och med att vi är så otroligt bortkopplade från allt där, och då kan en bok, en läppolja och lite buljong vara en skön påminnelse om verkligheten på nåt konstigt sätt”.", "title_original": "Tävlingen fick göras om efter väderkaoset", "summary_original": "I måndagens ”Robinson” skulle deltagarna balansera en kula på en spade genom en bana. Den uppmärksamma tittaren kunde se hur det plötsligt fanns rep längs spadarna, vilket gjorde det lättare att hålla kulan på plats.\n\nJessica Lasses berättar att det berodde på det svåra vädret. ”Alltså det blåste typ storm. Sand piskades rakt in i ögonhålorna på oss och blästrade typ hela hornhinnan kändes det som. Vi var ju tvungna att hela tiden typ stå med uppspärrade ögon för blinkade du så kunde det komma en vind i det ögonblicket och då var kulan ur balans, och då var det bara att börja om”, skriver hon till TV4 Nyheterna. ”Irriterad” Efter vad som enligt Jessica Lasses kändes som en evighet pausade produktionen tävlingen på grund av den hårda blåsten och tog in spadarna. ”Vi hade nog stått kvar där än i dag om de inte gjort den där abrovinken med spadarna, vilket gjorde att spelet över huvud taget typ kunde genomföras”, skriver hon. Tävlingen testades dagen före, när vädret var betydligt lugnare. Enligt Jessica Lasses hade den hårda blåsten kunnat gynna ett lag om motståndarna fått problem med sikten. Men så blev det inte. ”Det hade såklart varit härligare om spadarna hade varit mer ”preppade” från start, men jobbigt vet jag inte om det var, det var nog mer en lättnad. Sen blir man ju såklart alltid irriterad när något ändras under spelets gång, beroende på när i spelet reglerna helt plötsligt ändras, och om det är för ens egna lags för eller nackdel”. I övrigt bra Bortsett från väderkaoset tyckte hon att det var en bra pristävling eftersom de varken behövde använda särskilt mycket styrka eller hjärna när deltagarnas personliga saker låg i potten. ”Vi snackar saker som bland annat hjälpte oss att fördriva tiden om vi kände oss uttråkade, men sen också saker som för vissa kanske påminde om ”hemma” i och med att vi är så otroligt bortkopplade från allt där, och då kan en bok, en läppolja och lite buljong vara en skön påminnelse om verkligheten på nåt konstigt sätt”.", "link": "https://www.tv4.se/artikel/2LHbNMt7NO9SMd2Ds466z3/taevlingen-fick-goeras-om-efter-vaederkaoset", "date_display": "2026-09-28", "date_iso": "2026-09-28T18:00:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 145, "title": "Kenneth tar ton bakom ratten – prisas som bästa busschaufför", "summary": "Kenneth började sjunga på bussen efter att hans särbo fått en cancerdiagnos. I en tuff tid blev sången ett sätt att hitta tillbaka till glädjen. \n\n– Man hittar det hos andra människor, säger han. Började med födelsedagssånger Till en början sjöng Kenneth födelsedagssånger för sina passagerare. Alla var inte övertygade. \n\n– Det var många som i början tyckte det var galet och lite tokigt. Men jag fortsatte, för det var också många som uppskattade det. \n\nSedan dess har det blivit fler sånger, även egenkomponerade sådanda. För Kenneth handlar det om att sprida glädje och omtanke bland människorna på bussen. \n\n– Vi är från alla möjliga delar av världen. Det är härligt att man kan sjunga för varandra. \n\nMen den som föredrar en tyst busstur behöver inte oro sig. Kenneth respekterar även de som inte vill höra honom sjunga.  – De ska få en njutbar resa utan att jag håller på och sjunger.  Prisad som Västsveriges bästa Nyligen fick Kenneth dessutom ett kvitto på att hans sätt bakom ratten uppskattas när han utsågs till Västsveriges bästa busschaufför. \n\nKenneth avslutar såklart på sitt eget sprudlande sätt – med en egenskriven låt. \n\n– Tack alla, för att vi alla finns!", "title_original": "Kenneth tar ton bakom ratten – prisas som bästa busschaufför", "summary_original": "Kenneth började sjunga på bussen efter att hans särbo fått en cancerdiagnos. I en tuff tid blev sången ett sätt att hitta tillbaka till glädjen. \n\n– Man hittar det hos andra människor, säger han. Började med födelsedagssånger Till en början sjöng Kenneth födelsedagssånger för sina passagerare. Alla var inte övertygade. \n\n– Det var många som i början tyckte det var galet och lite tokigt. Men jag fortsatte, för det var också många som uppskattade det. \n\nSedan dess har det blivit fler sånger, även egenkomponerade sådanda. För Kenneth handlar det om att sprida glädje och omtanke bland människorna på bussen. \n\n– Vi är från alla möjliga delar av världen. Det är härligt att man kan sjunga för varandra. \n\nMen den som föredrar en tyst busstur behöver inte oro sig. Kenneth respekterar även de som inte vill höra honom sjunga.  – De ska få en njutbar resa utan att jag håller på och sjunger.  Prisad som Västsveriges bästa Nyligen fick Kenneth dessutom ett kvitto på att hans sätt bakom ratten uppskattas när han utsågs till Västsveriges bästa busschaufför. \n\nKenneth avslutar såklart på sitt eget sprudlande sätt – med en egenskriven låt. \n\n– Tack alla, för att vi alla finns!", "link": "https://www.tv4.se/artikel/249y8zybydCifkOQqUm7oF/kenneth-tar-ton-bakom-ratten-prisas-som-baesta-busschauffoer", "date_display": "2026-09-28", "date_iso": "2026-09-28T17:40:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/sverigesvepet", "/busschauffor", "/vanersborg"]}, {"id": 146, "title": "Agnes Wold om nedlagda podden: ”De tycker väl att jag är jobbig”", "summary": "Podden startades av programledaren Christer Lundberg och läkaren och professorn Agnes Wold under pandemin 2021. Sedan dess har den fått omkring 120 000 återkommande lyssnare. Samtidigt har Wolds uttalanden i olika frågor flera gånger väckt debatt. I våras fick hon kritik efter ett uttalande om könsidentitet i programmet ”Hotspot”.  ”Ville väl göra den sämre” Enligt Wold började diskussionerna om poddens framtid redan för ett år sedan. Då fick redaktionen besked om att Sveriges Radio ville förändra formatet, bland annat genom att ta bort hennes namn ur titeln och låta fler läkare och kliniker medverka.  Wold tror att tanken var att stegvis fasa ut henne.\n\n– De ville väl göra den sämre så att den skulle kunna läggas ner sen, säger hon. \n\nHon kopplar också beslutet till den återkommande kritiken mot henne som person. \n\n– Det är ju folk som drevar hela tiden mot mig som person. Inte mot podden säger Wold.  Sveriges radio ger en annan bild  Sveriges Radio säger däremot att nedläggningen framför allt är en del av en större förändring av utbudet inom hälsa och medicin. \n\n– Vi kommer inte att producera podden ”Fråga Agnes Wold” från årsskiftet. Det här är ett större grepp som vi tar kring hälsoområdet, och det är ett utvecklingsarbete som har pågått väldigt länge, säger Mark Malmström, ansvarig för vetenskapsutbudet.  Han säger att debatten kring Wold är något Sveriges Radio behöver förhålla sig till, men att den inte är huvudskälet till beslutet. \n\n– Det är jätteviktigt för mig att medverkande kan och ska, om de vill, delta i den offentliga debatten, säger Malmström. \n\nAgnes Wold hoppas nu att podden kan fortsätta i någon form. \n\n– Vi vill naturligtvis fortsätta med den. Folk är väldigt glada i den här.", "title_original": "Agnes Wold om nedlagda podden: ”De tycker väl att jag är jobbig”", "summary_original": "Podden startades av programledaren Christer Lundberg och läkaren och professorn Agnes Wold under pandemin 2021. Sedan dess har den fått omkring 120 000 återkommande lyssnare. Samtidigt har Wolds uttalanden i olika frågor flera gånger väckt debatt. I våras fick hon kritik efter ett uttalande om könsidentitet i programmet ”Hotspot”.  ”Ville väl göra den sämre” Enligt Wold började diskussionerna om poddens framtid redan för ett år sedan. Då fick redaktionen besked om att Sveriges Radio ville förändra formatet, bland annat genom att ta bort hennes namn ur titeln och låta fler läkare och kliniker medverka.  Wold tror att tanken var att stegvis fasa ut henne.\n\n– De ville väl göra den sämre så att den skulle kunna läggas ner sen, säger hon. \n\nHon kopplar också beslutet till den återkommande kritiken mot henne som person. \n\n– Det är ju folk som drevar hela tiden mot mig som person. Inte mot podden säger Wold.  Sveriges radio ger en annan bild  Sveriges Radio säger däremot att nedläggningen framför allt är en del av en större förändring av utbudet inom hälsa och medicin. \n\n– Vi kommer inte att producera podden ”Fråga Agnes Wold” från årsskiftet. Det här är ett större grepp som vi tar kring hälsoområdet, och det är ett utvecklingsarbete som har pågått väldigt länge, säger Mark Malmström, ansvarig för vetenskapsutbudet.  Han säger att debatten kring Wold är något Sveriges Radio behöver förhålla sig till, men att den inte är huvudskälet till beslutet. \n\n– Det är jätteviktigt för mig att medverkande kan och ska, om de vill, delta i den offentliga debatten, säger Malmström. \n\nAgnes Wold hoppas nu att podden kan fortsätta i någon form. \n\n– Vi vill naturligtvis fortsätta med den. Folk är väldigt glada i den här.", "link": "https://www.tv4.se/artikel/2JxCy7UrsITAnb6SVWvZYT/agnes-wold-om-nedlagda-podden-de-tycker-vael-att-jag-aer-jobbig", "date_display": "2026-09-28", "date_iso": "2026-09-28T16:58:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/agnes-wold", "/bakterier", "/sjukvard", "/halsa", "/stadning"]}, {"id": 147, "title": "Stefan Holms attack delar nätet i två läger: ”Ett kulturkrig”", "summary": "Höjdhoppstjärnan Stefan Holm gick till fysisk attack mot journalisten och poddaren Emil Persson under lördagskvällen.\n\nEn händelse som nu utreds av polisen. Bråket har nu fått stor spridning i sociala medier, där debatten blivit allt hätskare och fyllts av hatiska kommentarer.  ”Ett kulturkrig” Journalisten och medieexperten Emanuel Karlsten menar att bråket blivit en symbolfråga i ett större ”kulturkrig” på nätet, där många tydligt väljer sida. – Det har blivit en slags konflikt mellan stad och land, men också en kamp mellan anti-woke-högern och woke-vänstern, där de oetablerade ställs mot de etablerade, säger Emanuel Karlsten. – Den ena sidan tycker att det här handlar om sunt förnuft. Och man står upp för sin sak och typ: sluta gråt, liksom din tönt ungefär. Och den andra sidan säger att det här är ett ociviliserat beteende som är olagligt, fortsätter han.\n\nAtt det går att sympatisera med båda sidor i konflikten har skapat den ”perfekta ammunitionen” för kulturkriget, menar Karlsten. – Man kan förstå båda sidor. Det är självklart orimligt att ta till våld. Samtidigt är det förståeligt att en pappa reagerar när han upplever att hans son utsätts för påhopp – och att det beror på pappans offentlighet. Stefan Holm mittemellan Stefan Holm själv hamnar någonstans mitt emellan de här grupperna, enligt Karlsten, som pekar på en längre Facebook-status. – Det framgår av hans långa Facebook-inlägg där han tar på sig stort ansvar och säger att han ska gå i terapi. Vilket ju absolut inte är i linje med hans supportrars argument. Karlsten beskriver också hur Holm och Persson kopplas till olika identiteter i debatten. – Stefan Holm talar med dialekt. Och det gör ju förvisso Emil också. Men Emil tillhör det där klustret kring Filip och Fredrik och mediebranschen – en ironisk, satirisk generation som har distans till allt och förkroppsligar bilden av den coola storstadsmänniskan. – Stefan Holm är mer trubbig och oreserverad. Det blir en symbol för många: att han är som vi, till skillnad från de där stockholmarna som inte fattar någonting. Överrapportering i medier Karlsten menar att händelsen i sig är liten, men att den blivit en stor nationell angelägenhet när både sociala medier och traditionella medier plockat upp den. – Det är ju en liten konflikt, ett krogbråk som man kan tänka, som blivit en sån stor nationell angelägenhet. En händelse som, enligt honom, har fått oproportionerligt stor uppmärksamhet i medierna. – Det är väl det som skapar den perfekta stormen, att det här är en ankdammsstory egentligen, som passar in i gamla mediers sätt att berätta om konflikter, fortsätter han.", "title_original": "Stefan Holms attack delar nätet i två läger: ”Ett kulturkrig”", "summary_original": "Höjdhoppstjärnan Stefan Holm gick till fysisk attack mot journalisten och poddaren Emil Persson under lördagskvällen.\n\nEn händelse som nu utreds av polisen. Bråket har nu fått stor spridning i sociala medier, där debatten blivit allt hätskare och fyllts av hatiska kommentarer.  ”Ett kulturkrig” Journalisten och medieexperten Emanuel Karlsten menar att bråket blivit en symbolfråga i ett större ”kulturkrig” på nätet, där många tydligt väljer sida. – Det har blivit en slags konflikt mellan stad och land, men också en kamp mellan anti-woke-högern och woke-vänstern, där de oetablerade ställs mot de etablerade, säger Emanuel Karlsten. – Den ena sidan tycker att det här handlar om sunt förnuft. Och man står upp för sin sak och typ: sluta gråt, liksom din tönt ungefär. Och den andra sidan säger att det här är ett ociviliserat beteende som är olagligt, fortsätter han.\n\nAtt det går att sympatisera med båda sidor i konflikten har skapat den ”perfekta ammunitionen” för kulturkriget, menar Karlsten. – Man kan förstå båda sidor. Det är självklart orimligt att ta till våld. Samtidigt är det förståeligt att en pappa reagerar när han upplever att hans son utsätts för påhopp – och att det beror på pappans offentlighet. Stefan Holm mittemellan Stefan Holm själv hamnar någonstans mitt emellan de här grupperna, enligt Karlsten, som pekar på en längre Facebook-status. – Det framgår av hans långa Facebook-inlägg där han tar på sig stort ansvar och säger att han ska gå i terapi. Vilket ju absolut inte är i linje med hans supportrars argument. Karlsten beskriver också hur Holm och Persson kopplas till olika identiteter i debatten. – Stefan Holm talar med dialekt. Och det gör ju förvisso Emil också. Men Emil tillhör det där klustret kring Filip och Fredrik och mediebranschen – en ironisk, satirisk generation som har distans till allt och förkroppsligar bilden av den coola storstadsmänniskan. – Stefan Holm är mer trubbig och oreserverad. Det blir en symbol för många: att han är som vi, till skillnad från de där stockholmarna som inte fattar någonting. Överrapportering i medier Karlsten menar att händelsen i sig är liten, men att den blivit en stor nationell angelägenhet när både sociala medier och traditionella medier plockat upp den. – Det är ju en liten konflikt, ett krogbråk som man kan tänka, som blivit en sån stor nationell angelägenhet. En händelse som, enligt honom, har fått oproportionerligt stor uppmärksamhet i medierna. – Det är väl det som skapar den perfekta stormen, att det här är en ankdammsstory egentligen, som passar in i gamla mediers sätt att berätta om konflikter, fortsätter han.", "link": "https://www.tv4.se/artikel/61BsVhh9Do3TaAj1RgyhN7/stefan-holms-attack-delar-naetet-i-tva-laeger-ett-kulturkrig", "date_display": "2026-09-28", "date_iso": "2026-09-28T13:29:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/kultur", "/stefan-holm"]}, {"id": 148, "title": "Talmannen är den svenska politikens Kristusgestalt", "summary": "Erik Helmerson: De använde talmansklubban till att slå varandra i huvudet.", "title_original": "Talmannen är den svenska politikens Kristusgestalt", "summary_original": "Erik Helmerson: De använde talmansklubban till att slå varandra i huvudet.", "link": "https://www.dagen.se/ledare/talmannen-aer-den-svenska-politikens-kristusgestalt/10553840", "date_display": "2026-09-28", "date_iso": "2026-09-28T13:10:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Riksdagen väljer Andreas Norlén till talman", "summary": "Vänsterpartiet ställde sig bakom Tidöpartiernas kandidat", "title_original": "Riksdagen väljer Andreas Norlén till talman", "summary_original": "Vänsterpartiet ställde sig bakom Tidöpartiernas kandidat", "link": "https://www.dagen.se/nyheter/riksdagen-vaeljer-andreas-norlen-till-talman/10554742", "date_display": "2026-09-28", "date_iso": "2026-09-28T13:03:33+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Soft wellness växer: ”Kroppen är gjord för både gas och broms”", "summary": "För den före detta landslagslöparen Helene Bourdin innebär Soft wellness och Pilates att hon håller sig skadefri också som motionär.\n\nHelene har flera SM-guld på 400 meter och har tävlat i både Finnkampen och EM.\n\n- När jag började med friidrott så handlade det mest om att träna så hårt som möjligt och så mycket som möjligt, säger Helene. Men jag var väldigt mycket skadad, det var ibland år i sträck som jag inte kunde träna fullt ut. Blev skadefri Till slut började hon och hennes tränare att utvärdera varje träningspass och se över upplägget. \n\nDå kom framgångarna.\n\nI dag, mer än 15 år efter karriären har Helene fortsatt att prioritera återhämtning och rörelseträning - som ett sätt att hålla sig skadefri.\n\n- Jag halkar lätt tillbaka i elittänket när jag till exempel vill gå ner på banan och ska springa för skojs skull, berättar hon. Och eftersom jag inte tränar lika mycket nu, så är skaderisken mycket större. Färre skador med rörelseträning Anna Ericson utbildar pilatestränare, är legitimerad naprapat och har följt trenden med Soft Wellness i många år.\n\n- Jag arbetar bland annat med idrottslag och jag ser med egna ögon vad rörelseträning kan göra för idrottare, inte som rehab efter skada utan för att undvika skada och stärka kroppen, förklarar hon.\n\n - Människan är gjord för både gas och broms. Men hjärnan kan inte skilja på olika sorters stress. Stress från överbelastning, för lite mat eller en dålig relation skapar kemiska processer i kroppen och i det i sin tur skapar inflammationer. Kompletterar med pilates Helene har vant sig vid att komplettera sin konditionsträning med pilates.\n\nAnna Ericson få ofta frågor av folk som tränar på hennes anläggning. \n\n- De brukar fråga mig vad de ska välja för träning, styrka eller kondition, berättar Anna. Då brukar jag svara; vad ska du välja, äta, sova eller dricka? Vi behöver alla delarna. Det är så kroppen läker och det är så vi skapar hälsa.", "title_original": "Soft wellness växer: ”Kroppen är gjord för både gas och broms”", "summary_original": "För den före detta landslagslöparen Helene Bourdin innebär Soft wellness och Pilates att hon håller sig skadefri också som motionär.\n\nHelene har flera SM-guld på 400 meter och har tävlat i både Finnkampen och EM.\n\n- När jag började med friidrott så handlade det mest om att träna så hårt som möjligt och så mycket som möjligt, säger Helene. Men jag var väldigt mycket skadad, det var ibland år i sträck som jag inte kunde träna fullt ut. Blev skadefri Till slut började hon och hennes tränare att utvärdera varje träningspass och se över upplägget. \n\nDå kom framgångarna.\n\nI dag, mer än 15 år efter karriären har Helene fortsatt att prioritera återhämtning och rörelseträning - som ett sätt att hålla sig skadefri.\n\n- Jag halkar lätt tillbaka i elittänket när jag till exempel vill gå ner på banan och ska springa för skojs skull, berättar hon. Och eftersom jag inte tränar lika mycket nu, så är skaderisken mycket större. Färre skador med rörelseträning Anna Ericson utbildar pilatestränare, är legitimerad naprapat och har följt trenden med Soft Wellness i många år.\n\n- Jag arbetar bland annat med idrottslag och jag ser med egna ögon vad rörelseträning kan göra för idrottare, inte som rehab efter skada utan för att undvika skada och stärka kroppen, förklarar hon.\n\n - Människan är gjord för både gas och broms. Men hjärnan kan inte skilja på olika sorters stress. Stress från överbelastning, för lite mat eller en dålig relation skapar kemiska processer i kroppen och i det i sin tur skapar inflammationer. Kompletterar med pilates Helene har vant sig vid att komplettera sin konditionsträning med pilates.\n\nAnna Ericson få ofta frågor av folk som tränar på hennes anläggning. \n\n- De brukar fråga mig vad de ska välja för träning, styrka eller kondition, berättar Anna. Då brukar jag svara; vad ska du välja, äta, sova eller dricka? Vi behöver alla delarna. Det är så kroppen läker och det är så vi skapar hälsa.", "link": "https://www.tv4.se/artikel/3aZ6RrfBxT8ylvROCIvCYg/soft-wellness-vaexer-kroppen-aer-gjord-foer-bade-gas-och-broms", "date_display": "2026-09-28", "date_iso": "2026-09-28T12:06:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport", "/halsa", "/soft-wellness", "/traning"]}, {"id": 151, "title": "Speech by Minister for Foreign Affairs Maria Malmer Stenergard at UNGA81", "summary": "Speech by Swedish Minister for Foreign Affairs Maria Malmer Stenergard at the 81st Session of the UN General Assembly. 25 September 2026, New York. \nCheck against delivery.", "title_original": "Speech by Minister for Foreign Affairs Maria Malmer Stenergard at UNGA81", "summary_original": "Speech by Swedish Minister for Foreign Affairs Maria Malmer Stenergard at the 81st Session of the UN General Assembly. 25 September 2026, New York. \nCheck against delivery.", "link": "https://www.government.se/speeches/2026/09/speech-by-minister-for-foreign-affairs-maria-malmer-stenergard-at-unga81/", "date_display": "2026-09-28", "date_iso": "2026-09-28T11:41:29+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard", "Sweden in the UN"]}, {"id": 152, "title": "Nvidias vd sågar AI-bolagen – uppmanar till att stänga ner", "summary": "I en intervju med New York Times pratar Nvidias VD, Jensen Huang, om de kontroversiella AI-intrången som rapporterats den senaste tiden, som TV4 Nyheterna tidigare rapporterat om, där AI-bolagen Open AI och Anthropic varnat för att riskerna med sina egna modeller. De vill att myndigheter ska gripa in och stävja den teknologi som de själva skapat. Jensen Huang säger nu att han anser att de borde stänga ner om de verkligen menar allvar med sina varningar. – Kostnaden för mänskligheten, skadan, är allt för stor. Aktieägarna, det juridiska ansvaret — det kan handla om civilrättsligt ansvar, det kan handla om straffrättsligt ansvar. Jag menar, ansvaret är enormt, säger han i intervjun. Synar bluffen AI-experten Paulina Modlitba menar att VD:ns utspel är ett sätt att syna AI-bolagens ”bluff”. Att få AI att verka farligare än vad den kanske är för att myndigheter ska dra i nödbromsen, för alla samtidigt. – Det är ingen som vill vara först med att dra i nödbromsen, för då finns risken att konkurrenterna fortsätter springa. Därför finns det ett starkt incitament att vilja se regleringar från exempelvis Trumpadministrationen eller på global nivå som gör att alla tvingas bromsa samtidigt, säger hon. Jensen Huang och Nvidia generellt är i en position där de är fria att säga vad de tycker och tänker eftersom de tillverkar i princip all hårdvara som krävs för AI-sektorn, menar hon. Enligt henne tjänar Nvidia på att ta positionen som den ansvarsfulle i branschen som säger till på skarpen när andra inte sköter sig. – Det är lite som att han drar ner byxorna på dem. Han tar en position som ändå utåt sett verkar vara väldigt tydligt emot dem och målar upp dem som ansvarslösa och oansvariga helt enkelt – och lite som idioter om man ska vara ärlig. Flera politiker runt om i världen har efterlyst starkare reglering för AI. USA:s president Donald Trump däremot har tidigare i september kallat farhågorna för en ”hoax”, en bluff.", "title_original": "Nvidias vd sågar AI-bolagen – uppmanar till att stänga ner", "summary_original": "I en intervju med New York Times pratar Nvidias VD, Jensen Huang, om de kontroversiella AI-intrången som rapporterats den senaste tiden, som TV4 Nyheterna tidigare rapporterat om, där AI-bolagen Open AI och Anthropic varnat för att riskerna med sina egna modeller. De vill att myndigheter ska gripa in och stävja den teknologi som de själva skapat. Jensen Huang säger nu att han anser att de borde stänga ner om de verkligen menar allvar med sina varningar. – Kostnaden för mänskligheten, skadan, är allt för stor. Aktieägarna, det juridiska ansvaret — det kan handla om civilrättsligt ansvar, det kan handla om straffrättsligt ansvar. Jag menar, ansvaret är enormt, säger han i intervjun. Synar bluffen AI-experten Paulina Modlitba menar att VD:ns utspel är ett sätt att syna AI-bolagens ”bluff”. Att få AI att verka farligare än vad den kanske är för att myndigheter ska dra i nödbromsen, för alla samtidigt. – Det är ingen som vill vara först med att dra i nödbromsen, för då finns risken att konkurrenterna fortsätter springa. Därför finns det ett starkt incitament att vilja se regleringar från exempelvis Trumpadministrationen eller på global nivå som gör att alla tvingas bromsa samtidigt, säger hon. Jensen Huang och Nvidia generellt är i en position där de är fria att säga vad de tycker och tänker eftersom de tillverkar i princip all hårdvara som krävs för AI-sektorn, menar hon. Enligt henne tjänar Nvidia på att ta positionen som den ansvarsfulle i branschen som säger till på skarpen när andra inte sköter sig. – Det är lite som att han drar ner byxorna på dem. Han tar en position som ändå utåt sett verkar vara väldigt tydligt emot dem och målar upp dem som ansvarslösa och oansvariga helt enkelt – och lite som idioter om man ska vara ärlig. Flera politiker runt om i världen har efterlyst starkare reglering för AI. USA:s president Donald Trump däremot har tidigare i september kallat farhågorna för en ”hoax”, en bluff.", "link": "https://www.tv4.se/artikel/oLQ1blERwqkcRUbwUnfGv/nvidias-vd-sagar-ai-bolagen-uppmanar-till-att-staenga-ner", "date_display": "2026-09-28", "date_iso": "2026-09-28T10:26:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ai", "/open-ai", "/donald-trump"]}, {"id": 153, "title": "Efter sexskandalen – Willow Creek söker en ny väg", "summary": "Efter skandalen kring grundaren vill den inflytelserika megakyrkan samla människor över politiska och teologiska skiljelinjer.", "title_original": "Efter sexskandalen – Willow Creek söker en ny väg", "summary_original": "Efter skandalen kring grundaren vill den inflytelserika megakyrkan samla människor över politiska och teologiska skiljelinjer.", "link": "https://www.dagen.se/nyheter/efter-sexskandalen-willow-creek-soeker-en-ny-vaeg/10553600", "date_display": "2026-09-28", "date_iso": "2026-09-28T10:03:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Lalehs längtan efter Gud lyser igenom mer än hon tror", "summary": "Albin Bohlin har läst artistens självbiografi 'Jag såg hur vi var stjärnor'.", "title_original": "Lalehs längtan efter Gud lyser igenom mer än hon tror", "summary_original": "Albin Bohlin har läst artistens självbiografi 'Jag såg hur vi var stjärnor'.", "link": "https://www.dagen.se/kultur/lalehs-laengtan-efter-gud-lyser-igenom-mer-aen-hon-tror/10553289", "date_display": "2026-09-28", "date_iso": "2026-09-28T09:19:50+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Tindra överlevde allvarlig ridolycka – räddades av sin vän", "summary": "Själva rutten hade hon ridit många gånger tidigare tillsammans med vännen Ebba Öström, som fanns vid hennes sida även denna dag. Plötsligt tappade Tindras häst, Gunnel, fotfästet och både häst och Tindra föll. – Jag hoppar av och hinner gå två-tre steg, och då ligger Tindra där och krampar, säger Ebba. Hon försökte först nå både sina och Tindras föräldrar, därefter ringde hon 112. – Jag är jättetacksam över Ebbas snabba agerande. Hon visste exakt vad hon skulle göra, att hon inte skulle ta av hjälmen, säger Tindra. Ebba beskriver hur svårt det varit att bearbeta händelsen, och att det tog tid att förstå att även hon själv drabbats av ett trauma. – Jag förnekade det lite i början. Jag kände inte att det var mitt trauma att ha, eftersom det var Tindra jag åkte till på traumaavdelningen, säger Ebba. Stark vänskap genom svårigheter Efter olyckan följde en lång och oviss tid på sjukhuset, där Tindra svävade mellan liv och död. Läkarna tvivlade på om hon någonsin skulle vakna – och om hon gjorde det, hur livet skulle bli därefter. Under rehabiliteringen, som var både fysisk och psykisk, fanns Ebba vid Tindras sida. De skapade nya minnen tillsammans, trots den svåra situationen. Ebba spenderade också några nätter bredvid Tindra på sjukhuset. Tillbaka i sadeln Ett och ett halvt år senare kämpar Tindra fortfarande med hjärntrötthet. – Det har blivit väldigt mycket bättre än vad alla har trott. Det har varit en kämpig resa, men jag är tacksam över att vara där jag är. Trots att många i hennes närhet var oroliga var det givet för Tindra att återvända till stallet och hästryggen. – Det var en självklarhet att hoppa upp i sadeln igen. Alla sa att jag aldrig skulle rida igen, men det har aldrig funnits på världskartan. Det är ju mitt liv och första gången jag satt på hästen var en vecka efter rehaben, säger Tindra. Vänskapen och hästarna har varit avgörande för båda. Tillsammans har de stöttat varandra genom svåra stunder och delar nu glädjen över att kunna rida ihop igen. – Det är aldrig så roligt som när vi rider ut. Vi pratar om allt och i skogen kommer alla hemligheter fram, säger Tindra.", "title_orig rodukter störa hudens naturliga barriär och mikrobiom, som funkar som en osynlig skyddsbarriär för att hålla huden frisk. Överanvändning kan öka risken för allergier och långvariga hudproblem. Petra Verga Kan förklarar att varje produkt som läggs på huden påverkar balansen av goda bakterier och immunförsvaret. – Allt vi lägger på huden påverkar mikrobiomet i någon utsträckning. Om vi lägger massa saker i onödan som vi inte behöver blir det en obalans som skapar besvär, säger hon. Viktigt med försiktighet Hudläkaren råder föräldrar att vara uppmärksamma på om barnen plötsligt får hudproblem efter att ha börjat med nya produkter. Om utslagen inte går över bör man söka vård. – En frisk barnhud behöver inte peelas. En ungdom med akne kan absolut behöva peeling. Var försiktig och gör det i samråd med en hudterapeut och ta även hjälp av vården, säger Petra Verga Kan.", "title_original": "Varnar: Starka hudvårdstrender kan skada ungas hud", "summary_original": "Hon ser en tydlig ökning av barn och tonåringar som använder starka produkter inspirerade av sociala medier. Bakom trenden ligger ofta marknadsföring och ideal som sprids på sociala plattformar. Petra Verga Kan berättar att hon möter både föräldrar och barn som har frågor om hudvård, och att hon ser fler fall av ospecifika hudirritationer hos yngre patienter. Särskilt känsliga är barn i åldern tio till tolv år, vars hud är tunnare och mer sårbar än vuxnas. Skador som kan uppstå De vanligaste problemen är eksem, rodnad och torrhet – ofta orsakade av överdriven användning av syror eller peeling. – Man vill uppnå så kallad ”glass skin”, som är ganska vanligt. Det kan leda till att huden blir röd, torr och fjällande, säger Petra Verga Kan.\n\nHon menar att bilder har skapats om hur en hud ska se ut, bilder som inte stämmer överens med verkligheten. – Problemet är att barn utsätter sina hudar för att uppnå det som marknaden skapar, de här hyperidealen. Ideal som inte är fysiskt möjliga att uppnå, som skapas med filter oc elaktig i insatsen. – Vi spanade på dem. De räknade med att skapa stor förstörelse på vårt fort. Vår samverkan med Storbritannien utgjorde ett fantastiskt arbete. Vi hade (de misstänkta gärningsmännen) under uppsikt under lång tid. Kopplingar till Iran Basen har använts av USA i kriget mot Iran och polisen undersöker nu om Iran har samröre med de gripna.  Trots Trumps ord om att männen varit under bevakning var det en vanlig privatpersons agerande som stoppade det som kunde ha slutat i ett blodbad. Tidigt på söndagsmorgonen var en kvinnlig lantbrukare från byn Whelford på väg hem från en fest när hon fick syn på tre vita skåpbilar parkerade längs en landsväg.  Hon fattade genast misstankar som stärktes ytterligare när hon såg en ”stor grupp män med huvor och rånarluvor” fly mot skogen, berättar hon i en intervju med nyhetsbyrån Press Association. Bonden, som vill vara anonym, ringde larmnumret och polisen anlände till platsen 15 minuter senare. Samtidigt uppmanade hon ortens invånare i en lokal WhatsApp-grupp att stanna inomhus och låsa sina dörrar. – Det verkar som att jag genom mitt agerande satte stopp för vad de nu än planerade. En rådig privatperson borde inte behöva upptäcka ovanlig aktivitet klockan ett på natten när flygbasen är i högsta beredskap. Jag tycker att det är helt otroligt, säger hon till PA. Höjd säkerhet De boende i området har varit vana vid störningar från demonstranter och en omfattande polisnärvaro ända sedan beslutet fattades att låta det amerikanska flygvapnet använda Fairford som bas för anfall mot Iran, skriver The Guardian. Under de senaste veckorna har invånarna dock märkt av kraftigt skärpta säkerhetsåtgärder, där basens grindar nyligen har barrikaderats. I en intervju med brittiska The Sun riktar bonden hård kritik mot myndigheterna. – Jag tycker det är helt fruktansvärt att det var jag som var tvungen att ringa dem, och att de inte visste om det själva. Det var skrämmande, fruktansvärt. De hade uppgifter om trovärdiga hot och hade stängt ner basen men ändå hände det här. Om vi ​​inte hade sett dem hade det kunnat sluta fruktansvärt, säger hon.", "title_original": "Bonde stoppade misstänkta terroristerna: ”Det är helt otroligt”", "summary_original": "På söndagen greps fem misstänkta terrorister i en stor polisinsats nära en av Storbritanniens viktigaste militära flygbaser, RAF Fairford.  Explosivt materiel ska ha hittats och enligt uppgifter till The Guardian rör det sig om hemgjorda sprängladdningar. Omkring 85 hushåll evakuerades. President Trump sade på söndagseftermiddagen att USA:s underrättelsetjänst varit delaktig i insatsen. – Vi spanade på dem. De räknade med att skapa stor förstörelse på vårt fort. Vår samverkan med Storbritannien utgjorde ett fantastiskt arbete. Vi hade (de misstänkta gärningsmännen) under uppsikt under lång tid. Kopplingar till Iran Basen har använts av USA i kriget mot Iran och polisen undersöker nu om Iran har samröre med de gripna.  Trots Trumps ord om att männen varit under bevakning var det en vanlig privatpersons agerande som stoppade det som kunde ha slutat i ett blodbad. Tidigt på söndagsmorgonen var en kvinnlig lantbrukare från byn Whelford på väg hem från en fest när hon fick syn på tre vita skåpbilar parkerade längs en landsväg.  Hon fattade genast misstankar som stärktes ytterligare när hon såg en ”stor grupp män med huvor och rånarluvor” fly mot skogen, berättar hon i en intervju med nyhetsbyrån Press Association. Bonden, som vill vara anonym, ringde larmnumret och polisen anlände till platsen 15 minuter senare. Samtidigt uppmanade hon ortens invånare i en lokal WhatsApp-grupp att stanna inomhus och låsa sina dörrar. – Det verkar som att jag genom mitt agerande satte stopp för vad de nu än planerade. En rådig privatperson borde inte behöva upptäcka ovanlig aktivitet klockan ett på natten när flygbasen är i högsta beredskap. Jag tycker att det är helt otroligt, säger hon till PA. Höjd säkerhet De boende i området har varit vana vid störningar från demonstranter och en omfattande polisnärvaro ända sedan beslutet fattades att låta det amerikanska flygvapnet använda Fairford som bas för anfall mot Iran, skriver The Guardian. Under de senaste veckorna har invånarna dock märkt av kraftigt skärpta säkerhetsåtgärder, där basens grindar nyligen har barrikaderats. I en intervju med brittiska The Sun riktar bonden hård kritik mot myndigheterna. – Jag tycker det är helt fruktansvärt att det var jag som var tvungen att ringa dem, och att de inte visste om det själva. Det var skrämmande, fruktansvärt. De hade uppgifter om trovärdiga hot och hade stängt ner basen men ändå hände det här. Om vi ​​inte hade sett dem hade det kunnat sluta fruktansvärt, säger hon.", "link": "https://www.tv4.se/artikel/6Gp6WhZGc7ZptrVfBYlvyw/bonde-stoppade-misstaenkta-terroristerna-det-aer-helt-otroligt", "date_display": "2026-09-28", "date_iso": "2026-09-28T05:40:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/storbritannien", "/iran"]}, {"id": 158, "title": "Succépartiet: Norrland kan bli lika rikt som Qatar eller Dubai", "summary": "Norrlandspartiet bildades den 17 december förra året och på bara nio månader har man lyckats locka så många väljare att man efter valet tagit plats i samtliga sju Västernorrländska kommuner och även regionfullmäktige. – Kommuner och regioner i Norrland får det allt tuffare. Höga elpriser, det dras ner på tåg och flyg och sjukvård läggs ner för dom som bor här. Jag tror att folk här är less på det och vi märker att det finns ett sug efter något nytt, en ny sorts politik, säger Elina Arab, partiledare för Norrlandspartiet. En av hjärtefrågorna för partiet är att staten ska ersätta Norrland för det man bidrar till för resten av landet form av vattenkraften, bland annat. – Om vi skulle ha samma system som i Norge där kommunerna får ta del av avkastningen från naturresurserna så skulle Västernorrland få tillbaka 500 miljoner kronor. Norrland skulle då vara lika rikt som Qatar eller Dubai, säger Robert Thunfors och fortsätter: – I Stockholm anser man att vi norrlänningar lever på bidrag och att kranskommunerna runt huvudstaden får ge pengar till oss – men skulle vi få behålla en andel av avkastningen av våra naturresurser så skulle vi klara oss alldeles utmärkt själva  Målsättningen: Ta plats i riksdagen Men siktet är inställt betydligt högre än bara Västernorrland. Under 2027 är målsättningen att starta upp lokalföreningar i alla övriga norrländska län och i valet 2034 hoppas ta plats i riksdagen. – Vi vill dessutom i förlängningen ha till ett självstyre. Ett eget Norrlandsparlament där riksdagen har gett makt att vi själva får styra över beskattningar, sjukvård och annat, säger Elina Arab. Norrlandspartiet är inte det enda lokala parti som gör stora framsteg utan liknande trend ses på flera platser runt om i landet. – Ofta gör lokala partier framsteg som vi sett i årets val när det finns frågor på orten som är engagerande. Exempelvis hot om nedläggning av samhällsservice eller byggen av vindkraftverk, säger statsvetaren Sofie Blombäck vid Mittuniversitetet. Finns det någon fara med att lokala småpartier bryter mark? – Ju fler partiet man har i en kommun desto svårare blir det att bilda stabila majoriteter, säger Sofie Blombäck.", "title_original": "Succépartiet: Norrland kan bli lika rikt som Qatar eller Dubai", "summary_original": "Norrlandspartiet bildades den 17 december förra året och på bara nio månader har man lyckats locka så många väljare att man efter valet tagit plats i samtliga sju Västernorrländska kommuner och även regionfullmäktige. – Kommuner och regioner i Norrland får det allt tuffare. Höga elpriser, det dras ner på tåg och flyg och sjukvård läggs ner för dom som bor här. Jag tror att folk här är less på det och vi märker att det finns ett sug efter något nytt, en ny sorts politik, säger Elina Arab, partiledare för Norrlandspartiet. En av hjärtefrågorna för partiet är at "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "Magnus Malm:\nPolitikernas utspel om Sverige som kristet land bygger på missuppfattningar", "summary": "Som man brukar säga: Den kristna kyrkan har inte blivit global, den har alltid varit global", "title_original": "Magnus Malm:\nPolitikernas utspel om Sverige som kristet land bygger på missuppfattningar", "summary_original": "Som man brukar säga: Den kristna kyrkan har inte blivit global, den har alltid varit global", "link": "https://www.dagen.se/kultur/magnus-malm-politikernas-utspel-om-sverige-som-kristet-land-bygger-pa-missuppfattningar/10543477", "date_display": "2026-09-28", "date_iso": "2026-09-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Boken hjälper verkligen att se sig själv på ett nytt sätt", "summary": "Matilda Westlund från Dagens ungdomspanel tipsar om det bästa hon läst, sett och hört den senaste tiden.", "title_original": "Boken hjälper verkligen att se sig själv på ett nytt sätt", "summary_original": "Matilda Westlund från Dagens ungdomspanel tipsar om det bästa hon läst, sett och hört den senaste tiden.", "link": "https://www.dagen.se/kultur/boken-hjaelper-verkligen-att-se-sig-sjaelv-pa-ett-nytt-saett/10543325", "date_display": "2026-09-28", "date_iso": "2026-09-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 164, "title": "Efter skadan – deltagaren tvingas åka hem", "summary": "I söndagens avsnitt av ”Robinson” undersöks Olle Aspberg av sjukvårdspersonal efter att ha skadat tummen under morgonen. – Det dunkar när man inte gör någonting, och sen när det nuddar då gör det jävligt ont, säger Olle i programmet. Efter en snabb undersökning på stranden väljer sjukvårdspersonalen att ta med Olle till sjukhus för ytterligare kontroller. Samtidigt uppmanas han att ta farväl av sina lagkamrater. – För gott? frågar Olle, utan att få något rakt svar från personalen. Han fortsätter: – Man är lite i chock. Det hade varit jävligt trist att lämna nu, men sånt är livet liksom. Det kanske blir comeback, vi får se. Tvingas lämna programmet Innan immunitetstävlingen drar i gång meddelar Martin Järborg lag Syd att Olle inte kommer att återvända till tävlingen. – Olle har skadat tummen, tas om hand av läkare. Han kommer inte komma tillbaka till Robinson, säger han. Besvikelsen är påtaglig och lagkamraten Juliette Bergkvist, som även brast ut i tårar när han åkte iväg, tycker det är tungt att förlora honom. – Det är alltid jobbigt när någon lämnar. Jag tror att Olle blev lite alla vårs lillebrorsa liksom, säger hon i programmet.", "title_original": "Efter skadan – deltagaren tvingas åka hem", "summary_original": "I söndagens avsnitt av ”Robinson” undersöks Olle Aspberg av sjukvårdspersonal efter att ha skadat tummen under morgonen. – Det dunkar när man inte gör någonting, och sen när det nuddar då gör det jävligt ont, säger Olle i programmet. Efter en snabb undersökning på stranden väljer sjukvårdspersonalen att ta med Olle till sjukhus för ytterligare kontroller. Samtidigt uppmanas han att ta farväl av sina lagkamrater. – För gott? frågar Olle, utan att få något rakt svar från personalen. Han fortsätter: – Man är lite i chock. Det hade varit jävligt trist att lämna nu, men sånt är livet liksom. Det kanske blir comeback, vi får se. Tvingas lämna programmet Innan immunitetstävlingen drar i gång meddelar Martin Järborg lag Syd att Olle inte kommer att återvända till tävlingen. – Olle har skadat tummen, tas om hand av läkare. Han kommer inte komma tillbaka till Robinson, säger han. Besvikelsen är påtaglig och lagkamraten Juliette Bergkvist, som även brast ut i tårar när han åkte iväg, tycker det är tungt att förlora honom. – Det är alltid jobbigt när någon lämnar. Jag tror att Olle blev lite alla vårs lillebrorsa liksom, säger hon i programmet.", "link": "https://www.tv4.se/artikel/6jCpge46x9o5TgFFa2hk00/efter-skadan-deltagaren-tvingas-aka-hem", "date_display": "2026-09-27", "date_iso": "2026-09-27T19:30:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/robinson", "/personer/martin-jarborg", "/tv-serier", "/tv4-play"]}, {"id": 165, "title": "Tilda, 21, vaknar inte på morgonen: ”Lite som att jag är död”", "summary": "Tilda Boisen, 21, har sedan tonåren haft svårt att komma upp ur sängen på morgonen. Om hennes egen biologiska klocka hade fått bestämma hade hon sovit till långt in på eftermiddagen. Men det går inte när det finns både skola och jobb att passa. – Jag har otroligt svårt att gå upp på morgonen. Det är lite som att jag är död egentligen. Jag har testat otroligt många olika saker, säger Tilda och listar sina hjälpmedel: – Jag har larm för döva som ringer i 100 decibel. Jag har testat vibrationsplattor under kudden så hela huvudet skakar. Alla mina lampor tänds samtidigt. Jag har testat larm på mobilen, på iPaden. Också larm där man måste lösa matteproblem för att de ska stängas av. Men jag vaknar inte. ”Som en krigszon” Tildas egen teori är att hon lyckas stänga av larmen i sömnen. – Men jag har inget minne av det överhuvudtaget. Hur ser en normal morgon ut för dig? – Senaste veckan har varit lite bättre, men en normal morgon brukar beskrivas lite som en krigszon av kompisar som har sovit över. Det vrålar larm och min katt jamar väldigt mycket, säger Tilda. Om hon har något väldigt viktigt på dagordningen får mamma och pappa som bor i närheten komma över och väcka henne. – Det är inte optimalt. Jag är 21 år och vuxen, och vill kunna gå upp i tid. När hon ska göra något särskilt viktigt, som att passa en flygtid, sover hon hos föräldrarna för att vara säker på att bli väckt på morgonen. Hur påverkar det här din vardag? – Väldigt negativt. Man måste ju upp på morgonen. Det är så samhället ser ut. Jag går i skolan och jag jobbar, och då börjar det ofta vid 8.30 eller vid 9 på morgonen. Det är min biologiska klocka inte alls inställd på, säger Tilda och fortsätter: – Jag har kommit sent flera gånger till saker jag tycker är viktiga. Jag missar saker och skapar också mycket frustration och konflikt.  Ska elchockas Tilda menar att det för henne inte ”bara är att gå upp”, som många kanske vill påtala. – Jag blir ofta väldigt besviken på mig själv också, för jag vill ju inget hellre än att bara kunna gå upp som en vanlig människa.  Nu hoppas hon att den senaste i raden av prylar ska vara henne behjälplig.  – Jag har för ett tag sedan köpt ett armband som ska ge mig elchocker på morgonen för att jag ska vakna. Det skulle komma igår, men det kommer nog om någon dag. Så det har blivit mitt sista hopp egentligen. Även om elstötar kan låta avskräckande, så har hon inte lämnats något annat val, känner hon. – Det är klart att det är lite obehagligt. Men så länge det funkar. Bara att jag själv skulle kunna känna att jag kan lita på mig själv och kan sova hemma.  – Det hade varit en enorm frihet. Det hade känts fantastiskt. P4 Extra var först med att berätta om Tildas morgontrötthet.", "title_original": "Tilda, 21, vaknar inte på morgonen: ”Lite som att jag är död”", "summary_original": "Tilda Boisen, 21, har sedan tonåren haft svårt att komma upp ur sängen på morgonen. Om hennes egen biologiska klocka hade fått bestämma hade hon sovit till långt in på eftermiddagen. Men det går inte när det finns både skola och jobb att passa. – Jag har otroligt svårt att gå upp på morgonen. Det är lite som att jag är död egentligen. Jag har testat otroligt många olika saker, säger Tilda och listar sina hjälpmedel: – Jag har larm för döva som ringer i 100 decibel. Jag har testat vibrationsplattor under kudden så hela huvudet skakar. Alla mina lampor tänds samtidigt. Jag har testat larm på mobilen, på iPaden. Också larm där man måste lösa matteproblem för att de ska stängas av. Men jag vaknar inte. ”Som en krigszon” Tildas egen teori är att hon lyckas stänga av larmen i sömnen. – Men jag har inget minne av det överhuvudtaget. Hur ser en normal morgon ut för dig? – Senaste veckan har varit lite bättre, men en normal morgon brukar beskrivas lite som en krigszon av kompisar som har sovit över. Det vrålar larm och min katt jamar väldigt mycket, säger Tilda. Om hon har något väldigt viktigt på dagordningen får mamma och pappa som bor i närheten komma över och väcka henne. – Det är inte optimalt. Jag är 21 år och vuxen, och vill kunna gå upp i tid. När hon ska göra något särskilt viktigt, som att passa en flygtid, sover hon hos föräldrarna för att vara säker på att bli väckt på morgonen. Hur påverkar det här din vardag? – Väldigt negativt. Man måste ju upp på morgonen. Det är så samhället ser ut. Jag går i skolan och jag jobbar, och då börjar det ofta vid 8.30 eller vid 9 på morgonen. Det är min biologiska klocka inte alls inställd på, säger Tilda och fortsätter: – Jag har kommit sent flera gånger till saker jag tycker är viktiga. Jag missar saker och skapar också mycket frustration och konflikt.  Ska elchockas Tilda menar att det för henne inte ”bara är att gå upp”, som många kanske vill påtala. – Jag blir ofta väldigt besviken på mig själv också, för jag vill ju inget hellre än att bara kunna gå upp som en vanlig människa.  Nu hoppas hon att den senaste i raden av prylar ska vara henne behjälplig.  – Jag har för ett tag sedan köpt ett armband som ska ge mig elchocker på morgonen för att jag ska vakna. Det skulle komma igår, men det kommer nog om någon dag. Så det har blivit mitt sista hopp egentligen. Även om elstötar kan låta avskräckande, så har hon inte lämnats något annat val, känner hon. – Det är klart att det är lite obehagligt. Men så länge det funkar. Bara att jag själv skulle kunna känna att jag kan lita på mig själv och kan sova hemma.  – Det hade varit en enorm frihet. Det hade känts fantastiskt. P4 Extra var först med att berätta om Tildas morgontrötthet.", "link": "https://www.tv4.se/artikel/2YhCMJrQtQx7bbO1J7vyx7/tilda-21-vaknar-inte-pa-morgonen-lite-som-att-jag-aer-doed", "date_display": "2026-09-27", "date_iso": "2026-09-27T18:05:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/halsa", "/somn", "/personligt", "/sova", "/unga-vuxna"]}, {"id": 166, "title": "GW:s förvåning över polisåtalet: ”Det är jättekonstigt”", "summary": "Tidigare i veckan åtalades en polis anställd inom polisregion Stockholm misstänkt för att ha våldtagit flera barn. Mannen, som är i 40-årsåldern, ska enligt åtalet också ha haft stora mängder barnpornografiskt material. Åklagaren har beskrivit materialet som av ”särskilt hänsynslös karaktär”. Mannen nekar till brott. Kriminologen och författaren Leif GW Persson konstaterar att omfattningen av de misstänkta brotten sticker ut. – Det är ganska mycket. Det här är svårt att uttala sig om, eftersom det mesta är sekretessbelagt. Han är under åtal men han är inte frihetsberövad. Jag förutsätter att han är tagen ur tjänst i avvaktan på hur det faller ut.  ”Normalt ska han sitta i finkan” Han ska även vid två tillfällen ha genomfört sexuella handlingar mot djur.  – Normalt ska han sitta i finkan. Åklagaren har naturligtvis fått frågan, men hon säger att utifrån proportionalitetsprincipen så finns det inte skäl att ha honom i finkan. Bland åklagarens bevisning finns chattkonversationer där mannen ska ha berättat om sexuella övergrepp, uttryckt sexuellt intresse för barn och delat barnpornografiskt material med andra personer. – Han har haft konversationer med likasinnade som, utan att man behöver dra ut alltför mycket, kan tolkas som att han vidgår det här som han nu är åtalad för. Men han nekar till det när han får frågan i förhör, säger GW Persson. ”Mycket ovanligt” Det är inte första gången poliser begår brott, men hur anmärkningsvärt är den här typen av grova brott? – Det här är i och för sig sällsynta brott. Det är mycket ovanligt. Men det har hänt att poliser dömts för våldtäkter tidigare, domar som har stått sig, och till och med sådana våldtäkter de begått i tjänsten. Det här är inte unikt i den meningen. Det som sticker ut i det aktuella fallet är enligt honom något annat. – Det som slår en när man tittar på det här ärendet är att han inte sitter frihetsberövad, med tanke på att det ändå är så pass allvarliga brott. Det är jättekonstigt.  Samtidigt betonar GW att stora delar av utredningsmaterialet är sekretessbelagt, vilket gör det svårt att bedöma varför åklagaren valt att inte begära mannen häktad. – Jag tror inte åklagaren har begått tjänstefel i sammanhanget. Hon måste ha goda grunder för att göra den här bedömningen, säger han.", "title_original": "GW:s förvåning över polisåtalet: ”Det är jättekonstigt”", "summary_original": "Tidigare i veckan åtalades en polis anställd inom polisregion Stockholm misstänkt för att ha våldtagit flera barn. Mannen, som är i 40-årsåldern, ska enligt åtalet också ha haft stora mängder barnpornografiskt material. Åklagaren har beskrivit materialet som av ”särskilt hänsynslös karaktär”. Mannen nekar till brott. Kriminologen och författaren Leif GW Persson konstaterar att omfattningen av de misstänkta brotten sticker ut. – Det är ganska mycket. Det här är svårt att uttala sig om, eftersom det mesta är sekretessbelagt. Han är under åtal men han är inte frihetsberövad. Jag förutsätter att han är tagen ur tjänst i avvaktan på hur det faller ut.  ”Normalt ska han sitta i finkan” Han ska även vid två tillfällen ha genomfört sexuella handlingar mot djur.  – Normalt ska han sitta i finkan. Åklagaren har naturligtvis fått frågan, men hon säger att utifrån proportionalitetsprincipen så finns det inte skäl att ha honom i finkan. Bland åklagarens bevisning finns chattkonversationer där mannen ska ha berättat om sexuella övergrepp, uttryckt sexuellt intresse för barn och delat barnpornografiskt material med andra personer. – Han har haft konversationer med likasinnade som, utan att man behöver dra ut alltför mycket, kan tolkas som att han vidgår det här som han nu är åtalad för. Men han nekar till det när han får frågan i förhör, säger GW Persson. ”Mycket ovanligt” Det är inte första gången poliser begår brott, men hur anmärkningsvärt är den här typen av grova brott? – Det här är i och för sig sällsynta brott. Det är mycket ovanligt. Men det har hänt att poliser dömts för våldtäkter tidigare, domar som har stått sig, och till och med sådana våldtäkter de begått i tjänsten. Det här är inte unikt i den meningen. Det som sticker ut i det aktuella fallet är enligt honom något annat. – Det som slår en när man tittar på det här ärendet är att han inte sitter frihetsberövad, med tanke på att det ändå är så pass allvarliga brott. Det är jättekonstigt.  Samtidigt betonar GW att stora delar av utredningsmaterialet är sekretessbelagt, vilket gör det svårt att bedöma varför åklagaren valt att inte begära mannen häktad. – Jag tror inte åklagaren har begått tjänstefel i sammanhanget. Hon måste ha goda grunder för att göra den här bedömningen, säger han.", "link": "https://www.tv4.se/artikel/4DqhX8iTOtwT2CwnI3oeOs/gw-s-foervaning-oever-polisatalet-det-aer-jaettekonstigt", "date_display": "2026-09-27", "date_iso": "2026-09-27T17:31:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/brott-och-straff", "/brott", "/brottsoffer", "/grovt-brott", "/misstankt-brott", "/straff", "/aklagare", "/stockholm"]}, {"id": 167, "title": "Läkarkritiken mot nya abortlagen: ”Blir inte jämlik sjukvård”", "summary": "En medicinsk abort består av två tabletter. I dag kan den ena tas hemma, medan den första måste sväljas på en abortmottagning under övervakning av vårdpersonal. Syftet med den nya lagen är att båda tabletterna ska kunna tas i hemmet. Men även om själva aborten kan genomföras hemma måste den gravida fortfarande hämta läkemedlen på en vårdinrättning som är godkänd för abortvård. Det är här kritiken uppstår. – Om man måste åka in till en klinik så faller hela det här. Det blir inte jämlik sjukvård. Vi har geografiska utmaningar i Sverige. En del har flera timmar till en mottagning, säger Kristina Gemzell Danielsson, professor och överläkare i obstetrik och gynekologi vid Karolinska Institutet.  ”Väldigt kritiska” Hon fortsätter: – Det är vi väldigt kritiska mot, för det kommer inte innebära någon förbättring i praktiken. Kritikerna anser att läkemedlen i stället borde kunna hämtas ut på exempelvis vårdcentraler eller apotek för att göra abortvården mer tillgänglig, särskilt för personer som bor långt från sjukhus och specialiserade mottagningar. Enligt dem skulle information och rådgivning i många fall kunna ges digitalt. Lann: ”Viktigt att vi tar ansvar” Men sjukvårdsminister Elisabet Lann (KD) menar att ett fysiskt möte fortfarande är viktigt. – Jag tycker att det är viktigt att vi tar ansvar för patientsäkerheten och att man säkrar att det är rätt person som får läkemedlen. Att man kan säkerställa graviditetens längd så att det inte visar sig att någon tar de här läkemedlen och det är fara för livet för den personen, säger hon. Regeringen har även undersökt möjligheten att låta personer hämta ut abortläkemedel på apotek. – Vi har tittat på möjligheten att hämta ut på apotek, men där skulle det krävas ytterligare utredning, säger Lann. Kritiken gäller inte bara läkemedelshanteringen. I utredningen som ligger till grund för lagförslaget diskuterades även Socialstyrelsens rättsliga råd, som den som vill göra abort efter graviditetsvecka 18 måste ansöka om tillstånd hos. Trots att flera abortkliniker och experter riktat kritik mot systemet innehåller regeringens förslag inga förändringar på området. – Det känns helt medeltida att det ska vara ett råd som över huvudet på den gravida ska fatta beslut om personens framtid, säger Kristina Gemzell Danielsson.", "title_original": "Läkarkritiken mot nya abortlagen: ”Blir inte jämlik sjukvård”", "summary_original": "En me ts att flera abortkliniker och experter riktat kritik mot systemet innehåller regeringens förslag inga förändringar på området. – Det känns helt medeltida att det ska vara ett råd som över huvudet på den gravida ska fatta beslut om personens framtid, säger Kristina Gemzell Danielsson.", "link": "https://www.tv4.se/artikel/2sb5ekSJSzih3AYx6sRQYG/laekarkritiken-mot-nya-abortlagen-blir-inte-jaemlik-sjukvard", "date_display": "2026-09-27", "date_iso": "2026-09-27T17:07:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/abort", "/elisabet-lann", "/valet-2022/kristdemokraterna", "/svensk-politik", "/lagar-och-regler", "/regeringen", "/barn"]}, {"id": 168, "title": "Humanisterna nekas återigen statliga bidrag som trossamfund", "summary": "Hoppas kunna ändra beslutet genom en överklagan", "title_original": "Humanisterna nekas återigen statliga bidrag som trossamfund", "summary_original": "Hoppas kunna ändra beslutet genom en överklagan", "link": "https://www.dagen.se/nyheter/humanisterna-nekas-aterigen-statliga-bidrag-som-trossamfund/10552879", "date_display": "2026-09-27", "date_iso": "2026-09-27T14:23:33+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 169, "title": "Här sätter tyska AfD stopp för nya minnesmärken över Förintelsen", "summary": "Inga fler 'snubbelstenar' får placeras ut i staden Heidenau efter politiskt beslut – stenar som placeras ut som minnesmärken över personliga öden", "title_original": "Här sätter tyska AfD stopp för nya minnesmärken över Förintelsen", "summary_original": "Inga fler 'snubbelstenar' får placeras ut i staden Heidenau efter politiskt beslut – stenar som placeras ut som minnesmärken över personliga öden", "link": "https://www.dagen.se/nyheter/haer-saetter-tyska-afd-stopp-foer-nya-minnesmaerken-oever-foerintelsen/10552903", "date_display": "2026-09-27", "date_iso": "2026-09-27T14:18:11+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 170, "title": "Aktivist attackerade Israel-monter på bokmässan - fick släpas iväg", "summary": "David Lega från Vänskapsförbundet Sverige-Israel menar att det är allvarligt att på det här sättet försöka tysta meningsmotståndare", "title_original": "Aktivist attackerade Israel-monter på bokmässan - fick släpas iväg", "summary_original": "David Lega från Vänskapsförbundet Sverige-Israel menar att det är allvarligt att på det här sättet försöka tysta meningsmotståndare", "link": "https://www.dagen.se/nyheter/aktivist-attackerade-israel-monter-pa-bokmaessan-fick-slaepas-ivaeg/10552539", "date_display": "2026-09-27", "date_iso": "2026-09-27T14:11:55+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 171, "title": "Sommarvärme i oktober – meteorologen: ”Väldigt ovanligt”", "summary": "Efter ett par blöta och kyliga dagar väntar ett rejält väderomslag. Enligt prognosen kan stora delar av Götaland och delar av Svealand få betydligt varmare väder än normalt för årstiden under nästa vecka.  – Att vi den första oktober skulle ha över 20 grader händer, men är mycket, mycket ovanligt, säger TV4:s meteorolog Madeleine Westin. Bakom omsvängningen ligger ett ovanligt djupt lågtryck över Island i kombination med ett högtryck över västra Ryssland. – Kombinationen gör att sydliga vindar för upp väldigt varm luft över oss, säger Madeleine Westin. Varm luft från Sydeuropa Den varma luften har sitt ursprung betydligt längre söderut.  – Det pressas upp varm luft som kommer från Nordafrika och vidare över Sydeuropa mot Sverige, säger Westin. I Malmö väntas temperaturen nå omkring 21 grader under tisdagen. Under onsdagen kan temperaturer kring 20 grader förekomma längs västkusten och på flera håll i södra Sverige. Även Stockholm kan få 17-18 grader, medan värmen väntas bli mindre påtaglig längre norrut. – Man kommer att känna att den här luften är varmare. Det är sydliga vindar och då upplevs det ofta mildare än om samma temperatur kommer med nordliga vindar, säger Westin. Håller i sig flera dagar Enligt prognosen stannar den ovanligt varma luften kvar under större delen av veckan.  – Jag skulle säga att den håller i sig över södra Sverige fram till nästa helg i alla fall, säger Madeleine Westin. Exakt hur ovanligt det är med temperaturen på över 20 är svårt att säga, menar hon. – Men det är väldigt ovanligt. Över 20 grader i början av oktober händer, men det är mycket, mycket ovanligt, säger hon och tillägger: – Det är extremt mycket högre än det normala.", "title_original": "Sommarvärme i oktober – meteorologen: ”Väldigt ovanligt”", "summary_original": "Efter ett par blöta och kyliga dagar väntar ett rejält väderomslag. Enligt prognosen kan stora delar av Götaland och delar av Svealand få betydligt varmare väder än normalt för årstiden under nästa vecka.  – Att vi den första oktober skulle ha över 20 grader händer, men är mycket, mycket ovanligt, säger TV4:s meteorolog Madeleine Westin. Bakom omsvängningen ligger ett ovanligt djupt lågtryck över Island i kombination med ett högtryck över västra Ryssland. – Kombinationen gör att sydliga vindar för upp väldigt varm luft över oss, säger Madeleine Westin. Varm luft från Sydeuropa Den varma luften har sitt ursprung betydligt längre söderut.  – Det pressas upp varm luft som kommer från Nordafrika och vidare över Sydeuropa mot Sverige, säger Westin. I Malmö väntas temperaturen nå omkring 21 grader under tisdagen. Under onsdagen kan temperaturer kring 20 grader förekomma längs västkusten och på flera håll i södra Sverige. Även Stockholm kan få 17-18 grader, medan värmen väntas bli mindre påtaglig längre norrut. – Man kommer att känna att den här luften är varmare. Det är sydliga vindar och då upplevs det ofta mildare än om samma temperatur kommer med nordliga vindar, säger Westin. Håller i sig flera dagar Enligt prognosen stannar den ov   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
