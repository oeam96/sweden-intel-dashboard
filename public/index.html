. Trumps svar: ”Lågt IQ” Trump har gått ut i ett inlägg på Truth Social, namngivit flera, däribland Carlson, Jones och Taylor-Greene, och kallar nu sina forna allierade ”galningar”, ”bråkstakar” och ”förlorare” med ”lågt IQ”. ”Som president skulle jag kunna få dem på min sida närhelst jag vill, men när de ringar svarar jag inte, för jag är för upptagen med utrikes- och inrikespolitik. Efter några gånger så blir de otäcka”, skriver presidenten.", "link": "https://www.tv4.se/artikel/72DCRSv9VatoDWerWcyeer/flera-maga-profiler-laemnar-trump-skeppet-en-rubbad-superskurk", "date_display": "2026-04-11", "date_iso": "2026-04-11T20:48:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["USA-valet 2024", "/usavalet-2024", "/donald-trump", "/utrikes"]}, {"id": 159, "title": "Yara, 20, thought she had a stomach bug - died days later", "summary": "The family was on their way home from a family reunion in Borås when Yara started to feel sick and vomit. But the next morning everything was as usual. - She ate breakfast as usual, says Yara's father Moustafa El Heidari. Around lunch, she developed a fever and the family called 1177. They also thought it was a stomach bug. But when she started having difficulty breathing, the family went to the emergency room, something Mölndals-Posten was the first to tell about. In the waiting room, Yara got worse. Her face turned blue and her arms and legs went cold, says Moustafa. - Suddenly she had a seizure and then all her organs failed. The condition quickly became critical, Yara's condition quickly deteriorated and the doctors could determine that she had suffered a septic shock, what was previously called blood poisoning. - She was lying on the bed and then we saw that her whole body was blue, meaning from her nose all the way down to her feet. Nine days followed in continued critical condition for Yara. She underwent surgery and received a so-called ECMO machine, which works like a lung and oxygenates the blood. Her condition improved somewhat, but doctors explained that large parts of her skin were burned and that her condition was still critical. Finally, the doctors announced that they could do no more. - Then I asked if they could wait just one more week. Maybe she would wake up so we could tell her how much we love her. But the doctors said that would only mean continued suffering and that if she woke up, she would not be the same Yara as before. At eight o'clock on the fourth of February the machines were shut down. - We saw everything. How my daughter took her last breath before my eyes. Moustafa and his wife kissed Yara on the forehead one last time. - I said that I love her very much and that she should say hello to my father. This is not the end, we will be reunited one day. Collection to save more in the future For the family, the time after Yara's death has been difficult. But they comfort each other within the family, and especially the family", "title_original": "Yara, 20, trodde hon var magsjuk – dog dagar senare", "summary_original": "Familjen var på väg hem från en släktträff i Borås när Yara började må illa och kräkas. Men morgonen efter var allt som vanligt. – Hon åt frukost som vanligt, säger Yaras pappa Moustafa El Heidari. Mot lunch fick hon feber och familjen ringde 1177. De trodde också att det handlade om magsjuka. Men när hon började få svårt att andas åkte familjen in till akuten, något Mölndals-Posten var först med att berätta om. I väntrummet blev Yara sämre. Ansiktet blev blått och hon blev kall i armar och ben, säger Moustafa. – Plötsligt fick hon ett krampanfall och då sviktade alla hennes organ. Tillståndet blev snabbt kritiskt Yaras tillstånd försämrades snabbt och läkarna kunde konstatera att hon drabbats av en septisk chock, det som tidigare kallades blodförgiftning. – Hon låg på sängen och då såg vi att hela hennes kropp var blå, alltså från näsan ända ner till fötterna. Nio dagar följde i fortsatt kritiskt tillstånd för Yara. Hon opererades och fick en så kallad ECMO-maskin, som fungerar som en lunga och syresätter blodet. Hennes tillstånd blev något bättre, men läkarna förklarade att stora delar av hennes hud var brännskadad och att situationen fortfarande var kritisk. Till slut meddelade läkarna att de inte kunde göra mer. – Då frågade jag om de kunde vänta bara en vecka till. Kanske skulle hon vakna så att vi kunde säga till henne hur mycket vi älskar henne. Men läkarna menade att det bara skulle innebära fortsatt lidande och att om hon vaknade skulle hon inte vara samma Yara som tidigare. Klockan åtta den fjärde februari stängdes maskinerna av. – Vi såg allt. Hur min dotter drog sitt sista andetag framför mina ögon. Moustafa och hans fru pussade Yara på pannan en sista gång. – Jag sa att jag älskar henne väldigt mycket och att hon skulle hälsa till min pappa. Det här är inte slutet, vi kommer att återförenas en dag. Insamling för att rädda fler i framtiden För familjen har tiden efter Yaras bortgång varit tung. Men de tröstar varandra inom släkten, och särskilt familjens yngsta tillskott på åtta månader. – Vi hade inga planer på ett till barn, men det har varit Guds omsorg. Han menar också att religionen varit en trygg punkt, eftersom han tror att de kommer att möta Yara igen. Han blir rörd när han beskriver hur Yara var i livet. – Yara var en väldigt varm person. Hon var kärleksfull och bemötte alltid folk med ett leende. Hon var verkligen en glädjespridare. Familjen har nu startat en insamling för att bidra till ny forskning om sepsis. – Jag hoppas att ett barn kan räddas med hjälp av den här kunskapen.", "link": "https://www.tv4.se/artikel/6JXWwMftlTOCW6CsEE5e2c/yara-20-trodde-hon-var-magsjuk-dog-dagar-senare", "date_display": "2026-04-11", "date_iso": "2026-04-11T17:36:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/sepsis", "/molndal"]}, {"id": 160, "title": "Neighbors in shock after horrific discovery: \"Don't understand anything\"", "summary": "The boy was found on Monday after neighbors in the village of Hagenbach in Alsace in eastern France heard noises from a van parked at a residential building, the BBC reports. The nine-year-old boy was found severely malnourished, with a blanket over him, among piles of trash and feces. He had been sitting in the same position for so long that he could not walk. The boy was locked up by his father when he was seven in November 2024 and had been there ever since. - What has just happened is terrible, we do not understand anything. It's horrible, there are no words, says neighbor Danielle to the French television channel BFM. Peed in bottles and pooped in bags The boy tells the police that the father fed him twice a day and left water bottles. He needed to pee in bottles and poop in bags, according to Le Parisien. The last time he showered was at the end of 2024. - It's unpleasant, it's the shocks to realize that this boy lived in that van like that, in such an uncomfortable position. It's really worrying, I'm speechless, says Lorraine, another neighbour, to BFM. The 43-year-old father believes the boy was locked up to protect him from his partner, who wanted to place him in a psychiatric clinic. The couple lived in the house next door together with the boy's 12-year-old sister and 10-year-old half-sister. - These are people I often run into when I'm walking the dog or out walking with my friends. We greet each other and at least recognize each other. It really feels strange, says neighbor Francesco. The children have been taken into care by the authorities. The father is now suspected of kidnapping and of not having given the boy enough food. He is being held by French police and has admitted that he locked the boy up. The man's partner is also suspected of failing to assist a minor in danger, but has been released on bail. The three children have been taken into the care of French authorities pending trial.", "title_original": "Grannarna i chock efter horribla upptäckten: ”Förstår ingenting”", "summary_original": "Pojken hittades i måndags efter att grannar i byn Hagenbach i Alsace i östra Frankrike hört ljud från en skåpbil som stod parkerad vid ett bostadshus, rapporterar BBC. Den nioårige pojken hittades kraftigt undernärd, med en filt över sig, bland högar av skräp och avföring. Han hade suttit så länge i samma position att han inte kunde gå. Pojken låstes in av sin pappa när han var sju år i november 2024 och hade suttit där sedan dess. – Det som precis har hänt är fruktansvärt, vi förstår ingenting. Det är horribelt, det finns inga ord, säger grannen Danielle till den franska tv-kanalen BFM. Kissade i flaskor och bajsade i påsar Pojken säger till polisen att pappan gett honom mat två gånger om dagen och lämnat vattenflaskor. Han behövde kissa i flaskorna och bajsa i påsar, enligt Le Parisien. Senaste gången han duschade var i slutet av 2024. – Det är obehagligt, det är chockerna att inse att den här pojken levde i den där skåpbilen på det sättet, i en så obekväm position. Det är verkligen oroande, jag är mållös, säger Lorraine, en annan granne, till BFM. Den 43-årige pappan menar att pojken låstes in för att skydda honom från hans partner, som ville placera honom på en psykiatrisk klinik. Paret bodde i huset bredvid tillsammans med pojkens 12-åriga syster och 10-åriga halvsyster. – Det här är människor jag ofta stöter på när jag rastar hunden eller är ute och går med mina vänner. Vi hälsar på varandra och känner åtminstone igen varandra. Det känns verkligen märkligt, säger grannen Francesco. Barnen har tagits om hand av myndigheter Pappan misstänks nu för kidnappning och för att inte ha gett pojken tillräckligt med mat. Han sitter gripen av fransk polis och har erkänt att han låst in pojken. Mannens partner är också misstänkt för underlåtenhet att hjälpa en minderårig i fara, men har släppts mot borgen. De tre barnen har tagits om hand av franska myndigheter i väntan på rättegång.", "link": "https://www.tv4.se/artikel/1jZyUic85QFYpmPscwUVv7/grannarna-i-chock-efter-upptaeckten-horribelt", "date_display": "2026-04-11", "date_iso": "2026-04-11T15:04:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/frankrike", "/barn"]}, {"id": 161, "title": "Dermatologists warn about the spring sun: Extra strong radiation", "summary": "The sun is expected to appear in large parts of the country during the weekend. It looks like it will be dry weather throughout Sweden and temperatures that will increase basically with each passing day.  - The sun will dominate this weekend. Towards next week, it also looks like it will be warmer, even if the frost doesn't let up completely, says TV4 meteorologist Ulrika Elvgren. After winter, many people want to take advantage of the light, but at the same time they are warned that the radiation can be extra strong where there is still snow. - We are not used to so much sun, and the remaining snow amplifies the sunlight, which makes the radiation much stronger, she says.  Dermatologist's advice Brenda Silva, dermatologist and operations manager Hudläkare i Väst, urges caution this weekend and that you think twice before sitting in the sun.  - It is important to have common sense. When the skin is unprepared, it is easy to burn yourself - which is not harmless.  She also reminds that the radiation does not only affect the skin in the summer, but also in the spring.  - One must not forget that UV radiation is harmful to our skin cells. If you burn yourself, then the risk of developing skin cancer doubles, says Brenda Silva.  \"Children's skin is more sensitive\" Brenda Silva recommends wearing a sun protection factor, but warns that this may mean a false sense of security. She advises parents to keep a special eye on the children, especially when they are in a pram. - Children's skin is significantly more sensitive and they burn more easily. There are many good solutions to give them shade, which one should use.  She sees that skin cancer is decreasing as more people become aware of the risks, while there are many trends linked to sunbathing.  - We have strong ideals that say you should be tan and heavily sun-kissed - which is dangerous in the long run, says Brenda Silva.", "title_original": "Hudläkare varnar för vårsolen: Extra stark strålning", "summary_original": "Solen väntas visa sig i stora delar av landet under helgen. Det ser ut att bli torrt väder i hela Sverige och temperaturer som ökar i princip för varje dag som går.  – Solen kommer att dominera i helgen. Mot nästa vecka ser det även ut som att det kommer bli varmare, även om frosten inte släpper helt, säger TV4:s meteorolog Ulrika Elvgren. Efter vintern är det många som vill ta vara på ljuset, men samtidigt varnas det för att strålningen kan vara extra stark där det fortfarande finns snö. – Vi är inte vana vid så mycket sol, dessutom förstärker den snö som är kvar solljuset, vilket gör att strålningen blir bra mycket starkare, säger hon.  Hudläkarens råd Brenda Silva, hudläkare och verksamhetschef Hudläkare i Väst, uppmanar till försiktighet i helgen och att man tänker en gång extra innan man sätter sig i solen.  – Det gäller att ha sunt förnuft. När huden är oförberedd är det lätt att man bränner sig – vilket inte är ofarligt.  Hon påminner också om att strålningen inte bara påverkar huden på sommaren, utan även under våren.  – Man får inte glömma att UV-strålning är skadligt för våra hudceller. Om man bränner sig, då fördubblas risken för att utveckla hudcancer, säger Brenda Silva.  ”Barnens hud är känsligare” Brenda Silva rekommenderar att man bär solskyddsfaktor, men flaggar för att det kan innebära en falsk trygghet. Hon råder föräldrar att hålla ett särskilt öga på barnen, speciellt när de ligger i barnvagn. – Barnens hud är betydligt känsligare och de bränner sig lättare. Det finns många bra lösningar för att ge dem skugga, som man bör använda.  Hon ser att hudcancern minskar i takt med att fler blir medvetna om riskerna, samtidigt som finns det många trender kopplade till att sola.  – Vi har starka ideal som säger att man ska vara brun och rejält solkysst – vilket är farligt i längden, säger Brenda Silva.", "link": "https://www.tv4.se/artikel/6xsPJSXfFzQOHiN0dU8VJw/varningen-i-varsolen-extra-stark-stralning-inte-ofarligt", "date_display": "2026-04-11", "date_iso": "2026-04-11T13:10:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Vädret", "/vadret", "/solskydd", "/vader"]}, {"id": 162, "title": "SD top's boot for Busch - after the words of Jimmie Åkesson", "summary": "The Liberals and Moderates have agreed to let the Sweden Democrats into a possible future government. Prime Minister Ulf Kristersson (M) also promised \"important ministerial posts\" to SD. KD leader Ebba Busch has been critical of ministerial posts being promised in that way. In an interview with SvD, Busch says that she has great respect for Åkesson, but that he does not work hard enough and would not be able to cope with the job as prime minister. - But if you compare our calendars during this mandate period, for example, then he doesn't work that much in relation to how much I or many others work, says Busch.  Andersson (SD): Does not post as much on Instagram SD leader Tobias Andersson is critical of the statement and says that he is disturbed that for several years people have tried to undermine Åkesson by claiming that he does not work hard enough. - Jimmie has not only worked for the Sweden Democrats but for our country and people for decades, says Andersson. He points out that Ebba Busch also works hard, but that Åkesson's work may not be as visible.  - I can note that Ebba is more concerned about posting pictures of what she does, Jimmie does a lot that you don't need to Instagram, says Andersson. \"I understand the game\" Tobias Andersson says he understands that Åkesson gets \"hits under the belt\" from other opponents such as the Social Democrats. - It becomes different when someone in the same team chooses to use this type of flawed argumentation, says Andersson. He believes that those who claim that Åkesson does not work hard and is \"lying on the couch in Sölvesborg\" are fundamentally wrong. - If you think that parliamentary votes are the most important thing, then you are fundamentally wrong. Jimmie is out in all our districts and meets all our members and voters, Andersson says. That the KD leader still chooses to criticize Åkesson, he believes, may have something to do with the upcoming government formation. He points out that the Sweden Democrats are today a large part of the government's foundation", "title_original": "SD-toppens känga till Busch – efter orden om Jimmie Åkesson", "summary_original": "Liberalerna och Moderaterna har gått med på att släppa in Sverigedemokraterna i en eventuell framtida regering. Statsminister Ulf Kristersson (M) lovade även ”viktiga ministerposter” till SD. KD-ledaren Ebba Busch har varit kritisk till att ministerposter lovas ut på det sättet. I en intervju med SvD säger Busch att hon har stor respekt för Åkesson, men att han inte jobbar tillräckligt hårt och inte skulle klara av jobbet som statsminister. – Men jämför man våra kalendrar under den här mandatperioden till exempel då jobbar han ju inte så mycket i relation till hur mycket jag eller många andra jobbar, säger Busch.  Andersson (SD): Lägger inte upp lika mycket på Instagram SD-toppen Tobias Andersson är kritisk till uttalandet och säger att han stör sig på att folk under flera år försökt underminera Åkesson genom att påstå att han inte jobbar tillräckligt hårt. – Jimmie har inte bara slitit för Sverigedemokraterna utan för vårt land och folk i decennier, säger Andersson. Han påpekar att även Ebba Busch jobbar hårt, men att Åkessons arbete kanske inte är lika synligt.  – Jag kan notera att Ebba är mer mån om att lägga upp bilder på det hon gör, Jimmie gör väldigt mycket som man inte behöver instagramma, säger Andersson. ”Jag förstår ju spelet” Att Åkesson får ”slag under bältet” från andra meningsmotståndare som Socialdemokraterna säger Tobias Andersson att han har förståelse för. – Det blir annorlunda när någon i samma lag väljer att nyttja den här typen av bristfällig argumentation, säger Andersson. Han menar att de som hävdar att Åkesson inte arbetar hårt och ”ligger på soffan i Sölvesborg” har fel i sak. – Om man tror att riksdagsvoteringar är det viktigaste så har man ju fel i sak. Jimmie är ute i alla våra distrikt och träffar alla våra medlemmar och väljare, säger Andersson. Att KD-ledaren ändå väljer att kritisera Åkesson tror han kan ha att göra med den kommande regeringsbildningen. Han pekar på att Sverigedemokraterna i dag är en stor del av regeringsunderlaget – men inte har några ministerposter. – När vi ska få ministrar efter valet kommer det huvudsakligen ske på bekostnad av KD och L. Det är klart att det finns egenintresse för de små partierna i Tidösamarbetet att försöka värna om sina egna ministerposter och tjänstemän, för de kommer bli färre när SD ingår i en regering, så jag förstår ju spelet, säger Andersson.  TV4 Nyheterna har sökt Kristdemokraterna och Ebba Busch för en kommentar.", "link": "https://www.tv4.se/artikel/QqjHqsSPDTbDrG4G26pWG/sd-toppens-kaenga-till-busch-efter-orden-om-jimmie-akesson", "date_display": "2026-04-11", "date_iso": "2026-04-11T12:12:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/politik", "/valet-2022/sverigedemokraterna", "/valet-2022/kristdemokraterna", "/ebba-busch"]}, {"id": 163, "title": "Trump's promise to employees - before he leaves as president", "summary": "In a conversation with his advisers in 2025, Trump said he would hold a press conference before leaving office as president, according to information provided by the WSJ. There he would announce mass pardons, but did not reveal which people it would apply to.  Several sources state that Trump said he would pardon anyone who was within 60 meters (200 feet) of the Oval Office. On another occasion, he reportedly joked that it applied to anyone within three meters (10 feet) of him. Pardoned by several allies The US president has the power to unconditionally pardon people - during this term Trump has used it 1,600 times to grant commutations or pardons. In several cases, it has concerned allies of the president or people who donated to his campaign. The 1,600 occasions can be compared to his last term as president. At the time, Trump issued fewer than 250 pardons and commutations. A large number of these are connected to those who were charged after the storming of the Capitol on December 6, 2021. The White House's response: Learn to take a joke. On several occasions, Trump is said to have raised the possibility of a pardon with employees in the White House - it is said to have mainly occurred when they expressed concern about being prosecuted or questioned in Congress as a result of a decision. Trump has often joked about things - which then actually come true and several employees state, according to the Wall Street Journal, that they believe he is serious this time. However, the White House says there is no substance to it. - The Wall Street Journal should learn to take a joke, but the president's pardon power is absolute, said White House press secretary Karoline Leavitt.  Biden opened the door for Trump Trump is not the only president who has made good use of the power to pardon people. At the end of Joe Biden's time as president, he chose to pardon several family members and officials, including his son Hunter Biden. The reason then was that he considered them a risk", "title_original": "Trumps löfte till medarbetarna – innan han lämnar som president", "summary_original": "I ett samtal med sina rådgivare under 2025 berättade Trump att han skulle hålla en presskonferens innan han lämnade ämbetet som president, enligt uppgifter till WSJ. Där skulle han meddela massbenådningar, men avslöjade inte vilka personer det skulle gälla.  Flera källor uppger att Trump sagt att han kommer benåda alla som varit inom 60 meter (200 fot) från Ovala rummet. Vid ett annat tillfälle ska han ha skämtat om att det gällde alla som befunnit sig inom tre meter (10 fot) av honom. Benådat flera allierade USA:s president har makten att ovillkorligt benåda personer – under denna mandatperiod har Trump använt den 1 600 gånger för att bevilja strafflindringar eller benådningar. I flera fall har det gällt allierade till presidenten eller personer som donerat till hans kampanj. De 1 600 tillfällena kan jämföras med hans förra mandatperiod som president. Då utfärdade Trump färre än 250 benådningar och strafflindringar. Ett stort antal av dessa är kopplade till de som åtalades efter stormningen av Kapitolium den 6 december 2021. Vita Husets svar: Lär er ta ett skämt Vid ett flertal tillfällen uppges Trump ha tagit upp möjligheten till benådning med medarbetare i Vita huset – det ska framförallt ha skett när de uttryckt oro över att kunna bli åtalade eller utfrågade i kongressen till följd av ett beslut. Trump har ofta skämtat om saker – som sedan faktiskt blir av och flera medarbetare uppger, enligt Wall Street Journal, att man tror att han menar allvar denna gång. Vita huset menar dock att det inte finns någon substans i det. – The Wall Street Journal borde lära sig att ta ett skämt, men presidentens benådningsmakt är absolut, sa Vita husets pressekreterare Karoline Leavitt.  Biden öppnade dörren för Trump Trump är inte den enda president som använt sig friskt av makten att benåda människor. I slutet av Joe Bidens tid som president valde han att benåda flera familjemedlemmar och tjänstemän, bland annat sin son Hunter Biden. Anledningen då var att han ansåg att de riskerade att granskas under Trumps tid vid makten. Men tidigare medarbetare i Bidens stab uppger nu att det kan ha skapat ett prejudikat som Trump kan komma att utnyttja. – Genom att testa gränserna för benådningsmakten öppnade Biden dörren på glänt, och vi kan inte nu klaga på att Donald Trump går igenom den, även om han slår upp den på vid gavel, säger Bidens tidigare kommunikationsrådgivare Michael LaRosa,", "link": "https://www.tv4.se/artikel/6VPSMJTD4a8qQAjmFIm1mn/trumps-loefte-till-medarbetarna-innan-han-laemnar-som-president", "date_display": "2026-04-11", "date_iso": "2026-04-11T11:17:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/usa", "/donald-trump", "/joebiden"]}, {"id": 164, "title": "National day of prayer for converts threatened with deportation", "summary": "Praying for security for those living in vulnerability and for wisdom for decision makers.", "title_original": "Nationell bönedag för konvertiter som hotas av utvisning", "summary_original": "Ber om trygghet för dem som lever i utsatthet och om vishet för beslutsfattare.", "link": "https://www.dagen.se/nyheter/nationell-boenedag-foer-konvertiter-som-hotas-av-utvisning/10293067", "date_display": "2026-04-11", "date_iso": "2026-04-11T07:49:09+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 165, "title": "Sebastian Stake Set:\nThe devil wants us to look down at our own shoes", "summary": "Remember to always keep your eyes fixed on Jesus, especially when doubt comes", "title_original": "Sebastian Stakset:\nDjävulen vill att vi tittar ner på våra egna skor", "summary_original": "Kom ihåg att alltid ha blicken fäst på Jesus, särskilt när tvivlet kommer", "link": "https://www.dagen.se/livsstil/sebastian-stakset-djaevulen-vill-att-vi-tittar-ner-pa-vara-egna-skor/10286029", "date_display": "2026-04-11", "date_iso": "2026-04-11T03:00:00+00:00", "source": "Dagen", "mini   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
