h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }

select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;

    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;

.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
.tag-type { background: #e9ecef; color: #495057; }
.tag-ministry { background: #e3f2fd; color: #0d47a1; }
.tag-old { background: #ffebee; color: #c62828; }

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {
    padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;

.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }
</style>

ls relation med USA. – En mindre provokativ ledning i Israel skulle vara en möjlighet att stoppa blödningen, säger en tidigare tjänsteman i Trumpadministrationen till nyhetssajten. – Det är en Netanyahu-trötthet här, säger han. Den tröttheten finns, enligt Politico, hos delar av MAGA-rörelsen som är emot USA:s krig i andra länder. Framför allt yngre republikaner kritiserar detta – något som vicepresident JD Vance har tagit till sig. I juli gick han ut och varnade Israel. – Donald Trump är den enda statschefen i världen som har sympatier för Israel just nu. Om jag satt i det israeliska kabinettet skulle jag kanske inte attackera den enda mäktiga allierade jag har kvar, sade han då. Demokraten: Stoppkloss för fred i Iran Även på den demokratiska sidan finns en frustration med Netanyahu. Den demokratiske senatorn Chris Murphy menar att Netayahu är en av de största anledningarna till att Trump inte kan dra sig ur Irankriget. – Om han (Netanyahu) väljs om, så kommer han att vara en väldigt inflytelserik röst i Trumps öra som fortsätter att trycka på för regimskifte i Iran, sade Murphy på onsdagen. Vill fimpa Ben-Gvir och Smotrich  En annan källa som är i kontakt med Trumps innersta cirkel säger till Politico att vissa Israelvänliga republikaner hoppas på att Netanyahu sitter kvar, men att hans mest extrema ministrar, försvarsminister Itamar Ben-Gvir och finansminister Bezalel Smotrich, ryker. Smotrich för en aggressiv bosättarpolitik på Västbanken, och Ben-Gvir arbetar för sämre villkor för palestinska fångar. – De gör livet svårt, säger källan, som menar att de två ministrarna underminerar alla Trumps visioner för hur han ska komma segrande ur en fred i Mellanöstern. Trumps raseri i somras: ”Galen!” Och Trumps egna Netanyuahustöd är kanske inte så solitt. Presidenten har många gånger varit frustrerad på Israels ledare, och i juni ska han ha skrikit åt premiärministern att han är ”helt jävla galen” i ett telefonsamtal. Detta efter att Israel trappat upp kriget i Libanon, något som störde fredsförhandlingarna med Iran. – Du skulle suttit i fängelse om det inte varit för mig. Jag räddar skinnet på dig. Alla hatar dig nu, sade han till Netanyahu då, enligt en källa till Axios.", "title_original": "Källor: ”Netanyahu-trötthet” i Trumpadministrationen", "summary_original": "Det är fortfarande oklart vem som ska regera Israel efter att landet gick till val i tisdags. Enligt källor till Politico har detta orsakat huvudvärk för en amerikanska politiker, i båda partierna, som hade hoppats på att sittande premiärminister Netanyahu skulle förlora valet. ”Skulle stoppa blödningen” USA:s president Donald Trump har varit tydlig i sitt stöd till Netanyahu, men politiker över hela spektrumet är kritiska mot Netanyahu, och anser att han bidragit till att förvärra Israels relation med USA. – En mindre provokativ ledning i Israel skulle vara en möjlighet att stoppa blödningen, säger en tidigare tjänsteman i Trumpadministrationen till nyhetssajten. – Det är en Netanyahu-trötthet här, säger han. Den tröttheten finns, enligt Politico, hos delar av MAGA-rörelsen som är emot USA:s krig i andra länder. Framför allt yngre republikaner kritiserar detta – något som vicepresident JD Vance har tagit till sig. I juli gick han ut och varnade Israel. – Donald Trump är den enda statschefen i världen som har sympatier för Israel just nu. Om jag satt i det israeliska kabinettet skulle jag kanske inte attackera den enda mäktiga allierade jag har kvar, sade han då. Demokraten: Stoppkloss för fred i Iran Även på den demokratiska sidan finns en frustration med Netanyahu. Den demokratiske senatorn Chris Murphy menar att Netayahu är en av de största anledningarna till att Trump inte kan dra sig ur Irankriget. – Om han (Netanyahu) väljs om, så kommer han att vara en väldigt inflytelserik röst i Trumps öra som fortsätter att trycka på för regimskifte i Iran, sade Murphy på onsdagen. Vill fimpa Ben-Gvir och Smotrich  En annan källa som är i kontakt med Trumps innersta cirkel mådde inte bra och kunde inte koncentrera mig på jobbet överhuvudtaget, säger han. Han tog sig till brottsplatsen där han träffade en person som kände sonen och som berättade att det var han som blivit skjuten. När han kom hem igen var polisen vid hans bostad. De berättade att sonen dött. Går det att beskriva hur du tänkte och kände då? – Nej jag hittar inga ord. Inte alls. Kroppen var helt slut. ”Hoppas de som mördat min son blir straffade” Adal var tidigt intresserad av musik och hade en begynnande rapkarriär under artistnamnet Adouli framför sig när han mördades. Men han hade också ett kriminellt förflutet. 18-åringen hade flera fällande domar i bagaget, men enligt polisen hade han dock ingen känd gängkoppling. Kelemu vill inte kommentarera sonens kriminella förflutna.  Vad hände med ditt liv efter mordet? – Det var tungt. Jag lever som vanligt folk, men det finns ingen glädje kvar. 24 timmar om dygnet tänker jag på honom. Vad ska jag leva för efter min sons död tänker jag ibland, men jag andas, jobbar.  – Jag är väldigt tacksam för svensk polis. Det har tagit många år och de har satsat många timmar. Nu hoppas jag att de som mördat min son blir straffade, säger Kelemu Debretsion.", "title_original": "18-årige Adal sköts till döds vid idrottsplats – gängtopp åtalad", "summary_original": "Tidigare i oktober åtalades gängtoppen Ildar ”Scar” Galiyev för tre mord och flera fall av grov brottslighet. Galiyev överlämnades till Sverige i februari i år efter att ha avtjänat ett fängelsestraff i Grekland. 26-åringen misstänks ha haft en ledande roll inom det kriminella Dalennätverket och åtalas bland annat för anstiftan till mordet på Mälarhöjdens idrottsplats i Fruängen i södra Stockholm. När TV4 Nyheterna träffar Kelemu Debretsion, pappa till 18-årige Adal Debretsion som sköts till döds i Fruängen i slutet av september 2023, minns han sin son med värme. – Han var väldigt social, trevlig och generös. Och glad, säger Kelemu Debretsion. Tog sig till brottsplatsen Kelemu var tle": "Ostmackan har fått hipsterstatus i Köpenhamn", "summary": "Köpenhamnarna får inte nog av BMO, alltså ostmacka. Trenden har både gett upphov till ostkris, kokbok och en nyhet på Burger Kings meny. Samtidigt är BMO:n en meme-vänlig gentrifieringssymbol på sociala medier.", "title_original": "Ostmackan har fått hipsterstatus i Köpenhamn", "summary_original": "Köpenhamnarna får inte nog av BMO, alltså ostmacka. Trenden har både gett upphov till ostkris, kokbok och en nyhet på Burger Kings meny. Samtidigt är BMO:n en meme-vänlig gentrifieringssymbol på sociala medier.", "link": "https://www.dn.se/varlden/ostmackan-har-fatt-hipsterstatus-i-kopenhamn/", "date_display": "2026-10-29", "date_iso": "2026-10-29T10:05:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 84, "title": "Lagarde avgår som ECB-chef i förtid", "summary": "En av finansvärldens tungviktare, Christine Lagarde, avgår i förtid som chef för Europeiska…", "title_original": "Lagarde avgår som ECB-chef i förtid", "summary_original": "En av finansvärldens tungviktare, Christine Lagarde, avgår i förtid som chef för Europeiska…", "link": "https://www.svd.se/a/KrV637/lagarde-avgar-som-ecb-chef-i-fortid?utm_medium=rss", "date_display": "2026-10-29", "date_iso": "2026-10-29T10:02:25+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "Sjukhusavlopp fulla av antibiotika: ”Väldigt utbrett problem”", "summary": "Att floder i Indien, med sina höga halter av antibiotika, utgör en grogrund för resistenta bakterier känner vi till. Men att resistenta bakterier också gynnas i avloppsrören på vanliga sjukhus, har nu för första gången slagits fast i en svensk studie från Göteborgs universitet. – Att förstå i vilka miljöer resistenta bakterier frodas, är avgörande för att vi ska förstå var vi bör sätta in åtgärder, säger Joakim Larsson som är professor vid institutionen för biomedicin vid Göteborgs universitet. Stark effekt i avloppen Forskarna har undersökt avloppsvattnet på tio sjukhus i Sverige och på alla ställen var halterna av antibiotika så hög att den kraftigt gynnade utvecklingen av resistenta bakterier. – Eftersom vi ser de här problemen överallt på alla sjukhus så tror vi att det här är ett väldigt utbrett problem. Kanske vid sjukhus över hela världen, säger Joakim Larsson. Därför är halterna höga Förklaringen till sjukhusavloppens höga halter är att en tredjedel av patienterna på sjukhus går på antibiotika, jämfört med en av 300 bland vanliga människor. I Västra Götaland har man redan börjat fundera kring hur man kan minska effekten som uppstår antibiotikan hamnar i avloppet. – Det kan vara att man försöker undvika antibiotika eller att tillsätta olika saker som gör att effekten inte uppstår, säger Per Rosander som är miljöstrateg på Västra Götalandsregionen. Kosttillskottet magnesium har i labbförsök visat sig binda till en av de mest problematiska antibiotikagrupperna. Nu tar forskaren prover från avloppsvattnet från Sahlgrenska sjukhuset i Göteborg och ser vad som händer i verkligheten. – Vi hoppas att det ska fungera lika bra i det riktiga avloppsvattnet här som det gör på labbet, avslutar Joakim Larsson.", "title_original": "Sjukhusavlopp fulla av antibiotika: ”Väldigt utbrett problem”", "summary_original": "Att floder i Indien, med sina höga halter av antibiotika, utgör en grogrund för resistenta bakterier känner vi till. Men att resistenta bakterier också gynnas i avloppsrören på vanliga sjukhus, har nu för första gången slagits fast i en svensk studie från Göteborgs universitet. – Att förstå i vilka miljöer resistenta bakterier frodas, är avgörande för att vi ska förstå var vi bör sätta in åtgärder, säger Joakim Larsson som är professor vid institutionen för biomedicin vid Göteborgs universitet. Stark effekt i avloppen Forskarna har undersökt avloppsvattnet på tio sjukhus i Sverige och på alla ställen var halterna av antibiotika så hög att den kraftigt gynnade utvecklingen av resistenta bakterier. – Eftersom vi ser de här problemen överallt på alla sjukhus så tror vi att det här är ett väldigt utbrett problem. Kanske vid sjukhus över hela världen, säger Joakim Larsson. Därför är halterna höga Förklaringen till sjukhusavloppens höga halter är att en tredjedel av patienterna på sjukhus går på antibiotika, jämfört med en av 300 bland vanliga människor. I Västra Götaland har man redan börjat fundera kring hur man kan minska effekten som uppstår antibiotikan hamnar i avloppet. – Det kan vara att man försöker undvika antibiotika eller att tillsätta olika saker som gör att effekten inte uppstår, säger Per Rosander som är miljöstrateg på Västra Götalandsregionen. Kosttillskottet magnesium har i labbförsök visat sig binda till en av de mest problematiska antibiotikagrupperna. Nu tar forskaren prover från avloppsvattnet från Sahlgrenska sjukhuset i Göteborg och ser vad som händer i verkligheten. – Vi hoppas att det ska fungera lika bra i det riktiga avloppsvattnet här som det gör på labbet, avslutar Joakim Larsson.", "link": "https://www.tv4.se/artikel/5RRWz0lVtPm02L475f2LTK/sjukhusavlopp-fulla-av-antibiotika-kommer-alltid-finnas-kvar", "date_display": "2026-10-29", "date_iso": "2026-10-29T10:01:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Läkemedel", "/lakemedel"]}, {"id": 86, "title": "Fler tegelstenar tas ner – föll från fjärde våningen", "summary": "Räddningstjänsten ryckte ut till centrala Landskrona under onsdagseftermiddagen efter att tegelstenar fallit från fjärde våningen. På torsdagen togs fler lösa stenar ner.", "title_original": "Fler tegelstenar tas ner – föll från fjärde våningen", "summary_original": "Räddningstjänsten ryckte ut till centrala Landskrona under onsdagseftermiddagen efter att tegelstenar fallit från fjärde våningen. På torsdagen togs fler lösa stenar ner.", "link": "https://ww vaken, Lars?”. Kombinerade pedagogik och musik Gullan Bornemark föddes i Härnösand 1927 och blev känd som en pionjär inom utvecklingen av barnsången i Sverige. Hon sade upp sig som musiklärare 1951 och startade då musiklekskolan Blåklockan i Malmö. Där kombinerades pedagogik och musik i en verksamhet som Bornemark drev till 2007, med hjälp av sin man och sina barn. – Folk tyckte att jag var lite tokig som sade upp mig från en fast tjänst. Men jag har stått på egna ben sedan dess och aldrig fått några bidrag. Jag höll på med Blåklockan i 56 år, sedan sade knäna stopp, sade Bornemark i en intervju med Skapnytt 2015. Sonen om sista tiden Till SVT berättar hennes son, musikern Dan Bornemark, om sista tiden.   – Hon har levt ett otroligt rikt liv. Hittat massor av drömmar som hon inte visste att hon hade. Sista tiden har varit en lång väntan på det hon tror är de finaste man kan uppnå, som en examen på att nu har jag levt klart. Det är otroligt att ha den synen på livet för då blir sista tiden ljus. Han fortsätter:  – Det är en jätteförlust såklart, och det finns alltid tusen frågor till man vill ställa och hundra låtar till som man skulle vilja skriva. Senast i augusti kom hon spontant på en visa, säger han till kanalen.  ”Musikalisk lekfullhet” Hon var sommarvärd i P1 2017 och tog året därpå emot Musikförläggarnas hederspris. Bornemark har också vunnit en Grammis för bästa barnalbum och blivit invald i Swedish Music Hall of Fame.  ”Med musikalisk lekfullhet som nyckel har karriären öppnat dörrar till skivprojekt, TV-framträdanden och sedan 2003 även den svenska psalmboken (psalm 799, ”Mista en vän”), men kärnan i Gullan Bornemarks gärning har alltid varit musikpedagogiken”, beskriver Swedish Music Hall of Fame henne på sin hemsida. Gullan Bornemark blev 98 år.", "title_original": "Gullan Bornemark är död – blev 98", "summary_original": "Textförfattaren och kompositören Gullan Bornemark är död, bekräftar hennes son för SVT.  Hennes låtskatt omfattar över 400 sånger, där utan bilar?", "summary_original": "LONDON. Efter decennier av motstånd har världens mest kända shoppinggata blivit fordonsfri. – Jag tror att folk kommer att sakna dubbeldäckarna, säger Osman som jobbar i en souvenirbutik vid Oxford Circus.", "link": "https://www.dn.se/varlden/blir-oxford-street-en-mindre-vulgar-gata-utan-bilar/", "date_display": "2026-10-29", "date_iso": "2026-10-29T08:54:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Lina tar hand om vilda smådjur hemma: ”Sovit under mina kläder”", "summary": "När fåglar, igelkottar och ekorrar behöver hjälp hör människor av sig till skolsköterskan Lina Wicksell. Efter en helgkurs i viltrehabilitering och tillstånd från länsstyrelsen och Naturvårdsverket tar hon hand om djuren hemma. Lina Wicksell har alltid gillat djur, berättar hon. När TV4 Nyheterna besöker henne i trädgården tar hon hand om tre ekorrar, och några igelkottar. Ekorrarna var bara ett par veckor gamla när de kom till henne och behövde matas med nappflaska. Till en början fick ekorrarna sova under Linas och hennes döttrars kläder. – Från början måste man försöka hitta nåt substitut till modersmjölken. Då ger vi valpmjölkersättning. Det funkar också med kattmjölk, säger Lina Wicksell. – Så småningom kan man introducera lite nötter. Det är ju hasselnötter, valnötter, pinjenötter, mandlar, fortsätter hon. Många djur samtidigt Som mest har Lina Wicksell samtidigt tagit hand om tolv ekorrar och 23 igelkottar.  Ekorrar är fridlysta och igelkottar är rödlistade. Den som inte är viltrehabiliterare får bara ta hand om ett skadat vilt djur i högst 48 timmar. Ekorrarna släpps inte ut i det vilda förrän i vår, när de är stora nog. De flesta igelkottarna är redo, men den som sover bör helst inte väckas. Lina Wicksell avråder från att ge igelkottar vanlig mjölk. – Den här mjölken vi dricker, med mjölkprotein, är ju inte bra. Då är det mycket bättre att erbjuda vatten. ntan på att den kommande regeringen leds en övergångsregering av den tidigare regeringen med Elisabet Svantesson (M) som finansminister. Senast den 12:e november ska hon lägga fram en övergångsbudget som riksdagen ska rösta om i december. Den ska vara neutral och innehålla få politiska nyheter, men ändå garantera att löner, samhällsviktiga verksamheter och lagstadgade utgifter betalas ut som vanligt. – Jag går till jobbet på morgonen, gör det jag ska göra, tar ansvar för att vi nu ska få en budget även för nästa år. Även om det inte är en helt vanlig budget såklart, så är det ändå en viktig budget, säger Svantesson.  Budgeten kan ändras i riksdagen Elisabeth Svantesson understryker att övergångsbudgeten bygger på principer som diskuterats med alla riksdagens partier. Samtidigt öppnar hon för att det politiska spelet kan ta fart när partierna får möjlighet att lägga egna motioner och ändringsförslag, även Moderaterna.  – Ja, i grund och botten. Man ska inte utesluta det, säger hon.  Samtal pågår mellan partierna, och framtida regeringsbildningar kan få betydelse för vilka tillägg som görs. Senast den 27 november ska alla motioner från partierna vara inlämnade, och om en majoritet samlas kan budgeten förändras. Det skedde 2018 då flera partier lade fram egna förslag och budgeten ändrades betydligt. Hur påverkas svenskarnas ekonomi?  En vanlig fråga från väljare är hur övergångsbudgeten påverkar deras ekonomi. Svantesson berättar att årets nivåer på olika anslag i huvudsak fortsätter in i nästa år. Uppenbart tillfälliga utgifter, som exempelvis kostnader för valet, försvinner.  – Det som är uppenbart tillfälligt och slutar, det som ska sluta i slutet på året, det försvinner.  Lagstadgade utgifter, som matmomsen, ligger kvar och samhällsviktiga satsningar som försvarsanslaget fortsätter enligt tidigare beslut.  – Det är väldigt mycket en statsapparat som bara måste fungera. Man måste ha pengar till löner och mycket annat, säger Svantesson.\n\nNär en ny regering tillträder kan den ändra i budgeten under våren. Fram till dess är det övergångsbudgeten och riksdagens beslut som styr svensk ekonomi.", "title_original": "Svantesson: Övergångsbudgeten ”bara måste fungera”", "summary_original": "46 dagar efter Riksdagsvalet har Sverige fortfarande ingen ny regering. I väntan på att den kommande regeringen leds en övergångsregering av den tidigare regeringen med Elisabet Svantesson (M) som finansminister. Senast den 12:e november ska hon lägga fram en övergångsbudget som riksdagen ska rösta om i december. Den ska vara neutral och innehålla få politiska nyheter, men ändå garantera att löner, samhällsviktiga verksamheter och lagstadgade utgifter betalas ut som vanligt. – Jag går till jobbet på morgonen, gör det jag ska göra, tar ansvar för att vi nu ska få en budget även för nästa år. Även om det inte är en helt vanlig budget såklart, så är det ändå en viktig budget, säger Svantesson.  Budgeten kan ändras i riksdagen Elisabeth Svantesson understryker att övergångsbudgeten bygger på principer som diskuterats med alla riksdagens partier. Samtidigt öppnar hon för att det politiska spelet kan ta fart när partierna får möjlighet att lägga egna motioner och ändringsförslag, även Moderaterna.  – Ja, i grund och botten. Man ska inte utesluta det, säger hon.  Samtal pågår mellan partierna, och framtida regeringsbildningar kan få betydelse för vilka tillägg som görs. Senast den 27 november ska alla motioner från partierna vara inlämnade, och om en majoritet samlas kan budgeten förändras. Det skedde 2018 då flera partier lade fram egna förslag och budgeten ändrades betydligt. Hur påverkas svenskarnas ekonomi?  En vanlig fråga från väljare är hur övergångsbudgeten påverkar deras ekonomi. Svantesson berättar att årets nivåer på olika anslag i huvudsak fortsätter in i nästa år. Uppenbart tillfälliga utgifter, som exempelvis kostnader för valet, försvinner.  – Det som är uppenbart tillfälligt och slutar, det som ska sluta i slutet på året, det försvinner. pa till att undvika 60 procent av utdöendet av arter, säger Doreen Robinson vid miljöorganet Unep vid en pressträff. Rapporten är den första globala uppskattningen inom området. Den bygger på vad länderna själva uppgett och på analyser och data som olika projekt lämnat in. Projekt pågår i 149 länder i nästan hela världen. Vi har sårbara och utrotningshotade arter som saigaantilopen, bergsgorillan och jaguaren som återvänder till sina ekosystem, säger Yelena Finegold vid FN:s jordbruksorganisation FAO vid pressträffen. Korridorer binder samman Natur kan försämras eller degraderas till följd av överexploatering, förstörelse, klimatförändringar, föroreningar och invasiva arter. Mellan 2015 och 2019 ökade andelen degraderad landyta globalt från 11,5 procent till 15,4. FN lyfter fram 35 flaggskeppsprojekt runt om i världen. Ett exempel är vildmarkskorridorer så att den skog som en gång i tiden sträckte sig över delar av Brasilien, Paraguay och Argentina, men som blivit fragmenterad, binds samman igen. Det gör att jaguaren och den gyllenhuvade lejontamarinen kan röra sig fritt mellan skogsområdena. I Kirgizistan är den sällsynta snöleoparden på väg tillbaka efter omfattande insatser, där ekoturism också blivit en viktig inkomstkälla. Längs den heliga floden Ganges i Indien renas numera avloppsvatten och industriavfall i nya reningsverk. I den viktiga dricksvattenkällan har även den skygga gangesdelfinen börjat återhämta sig. Fem nya projekt I samband med FN:s möte om biologisk mångfald har fem nya projekt utsetts, varav två är i stadsområden. I italienska Milano har tre miljoner träd planterats på tidigare industritomter och parkeringsplatser och i Seattle har invasiva växter gett plats åt inhemska när 831 hektar återställts.", "title_original": "Enorma mängder förstörd natur på väg att räddas", "summary_original": "Världens länder lovade 2022 att före 2030 återställa 1 miljard hektar förstörd mark till blomstrande natur. Halvvägs dit är siffran 252 miljoner hektar. Även igt, säger Stina Andrén, hållbarhetschef på Kiviks Musteri. Flera torra somrar Södra Sverige och inte minst Kivik har drabbats av flera torra somrar. I Kivik kom det bara 10 millimeter regn i somras. Det avsaltade havsvattnet kommer användas främst i företagets dagliga produktion, till exempel för att hålla rent i musteriet, men en del vatten kommer också att blandas i företagets fruktdrycker. – Det kommer vara i produkterna som innehåller vatten som cider, fruktdryck, en kräm eller en soppa, säger Stina Andrén. Hon poängterar att musten och vinet inte kommer att påverkas, då det inte innehåller något tillsatt vatten alls. – Must innehåller bara äpple, det är som att dricka ett äpple och som viner som bara innehåller druvor. Projektet beräknas vara färdigt i mars nästa år. Samhället måste bygga cirkulära vattensystem Christian Baresel är vattenexpert på det svenska miljöinsitutet IVL. Han förstår nödvändigheten i att Kiviks investerar i en avsaltningsanläggning. Han ser det dock som mer angeläget att exempelvis kommuner tar frågan om vattentillgång på större allvar, på grund av låga grundvattennivåer och sämre kvalitet på dricksvattnet. Till exempel att man bygger ut cirkulära system som skulle kunna rena och återanvända avloppsvatten. Industrin har redan tagit kliv och skapat sådana lösningar men han menar att det även bör införas på till exempel kommunal nivå. – Vi behöver ta det här på allvar. Det kommer att bli en utmaning, inte bara för Skåne och Gotland. Även i Stockholm förra året har vi sett en brist (på dricksvatten), säger Christian Baresel. –  Det är inte bara för att grundvattnet kan ta slut utan med klimatförändringarna ändras även kvaliteten. I Stockholm var kvaliteten på råvattnet i Mälaren så dåligt att dricksvattnet inte kunde renas så mycket som behövdes. Hade man då haft en högre återanvändning på gråvatten inom hushåll och avloppsvatten hade man inte haft de här kapacitetsproblemen. Men den här infrastrukturen bygger man inte på en natt, säger Ba tle": "Var det islamister som bombhotade tv-klassikern Fräcka fredag?", "summary": "Erik Helmerson: SVT glömde frågorna om terrorbrevets avsändare.", "title_original": "Var det islamister som bombhotade tv-klassikern Fräcka fredag?", "summary_original": "Erik Helmerson: SVT glömde frågorna om terrorbrevets avsändare.", "link": "https://www.dagen.se/ledare/var-det-islamister-som-bombhotade-tv-klassikern-fraecka-fredag/10601583", "date_display": "2026-10-29", "date_iso": "2026-10-29T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 146, "title": "Kräver hårdare tag mot regimen – efter avrättning av svensk-iranier", "summary": "Kourosh Keyvani reste på semester till Iran i somras för att träffa sin familj. Resan slutade med att den svensk-iranske tvåbarnspappan greps, dömdes till döden och avrättades, anklagad för spioneri. Hans fru beskriver anklagelserna som grundlösa och ”löjliga” och kritiserar Sverige och Utrikesdepartementet för att inte ha gjort tillräckligt för att rädda hennes man. Något som TV4 Nyheterna rapporterat om tidigare. Efter rapporteringen kommer nu krav från riksdagen på en hårdare linje mot Iran. KD-ledamoten Martin Hallander vill att varje avrättning ska få tydliga diplomatiska konsekvenser.  – Det är alldeles fruktansvärt. Det är helt omöjligt att förstå vad den här familjen har varit med om, säger Martin Hallander (KD).  Hårdare sanktioner Hallander (KD) menar att Sverige kan göra mycket i frågan - framför allt inom ramen för EU-samarbetet. Han vill bland annat att sanktionerna mot Iran skärps ytterligare och att möjligheterna att kringgå dem begränsas. – Vi finns med i ministerrådet i EU där vi har en röst och kan lyfta de här frågorna och ställa högre krav på kraftfullare sanktioner. Men framförallt måste vi också bli duktigare att trycka inom EU för att få bort möjligheten att kringgå sanktionerna så att det känns, säger han. Efter EU:s terrorstämpling av iranska revolutionsgardet, IRGC, vill KD-ledamoten att även personer som tillhör eller stöttar organisationen ska möta konsekvenser i Sverige – även om de verkar inom diplomatiska beskickningar.  Fokus på mänskliga rättigheter Partiet anser att fokus i högre grad bör riktas mot mänskliga rättigheter och det kraftigt ökade antalet avrättningar i Iran, snarare än mot olja, sjöfart, Hormuzsundet.  – Det är uppenbart att den islamiska republikens regim är mer rädd för sin egen befolkning än internationella sanktioner och internationella reaktioner. Ledamoten vill också ge oppositionsföreträdare internationell legitimitet och stödja krafter som verkar för ett maktskifte. Det kan bland annat handla om infrastruktur för internet och kommunikation.   – Det är inte tiden att vika ner utan då måste vi steppa upp och stötta befolkningen ännu mer och oppositionen ännu mer.", "title_original": "Kräver hårdare tag mot regimen – efter avrättning av svensk-iranier", "summary_original": "Kourosh Keyvani reste på semester till Iran i somras för att träffa sin familj. Resan slutade med att den svensk-iranske tvåbarnspappan greps, dömdes till döden och avrättades, anklagad för spioneri. Hans fru beskriver anklagelserna som grundlösa och ”löjliga” och kritiserar Sverige och Utrikesdepartementet för att inte ha gjort tillräckligt för att rädda hennes man. Något som TV4 Nyheterna rapporterat om tidigare. Efter rapporteringen kommer nu krav från riksdagen på en hårdare linje mot Iran. KD-ledamoten Martin Hallander vill att varje avrättning ska få tydliga diplomatiska konsekvenser.  – Det är alldeles fruktansvärt. Det är helt omöjligt att förstå vad den här familjen har varit med om, säger Martin Hallander (KD).  Hårdare sanktioner Hallander (KD) menar att Sverige kan göra mycket i frågan - framför allt inom ramen för EU-samarbetet. Han vill bland annat att sanktionerna mot Iran skärps ytterligare och att möjligheterna att kringgå dem begränsas. – Vi finns med i ministerrådet i EU där vi har en röst och kan lyfta de här frågorna och ställa högre krav på kraftfullare sanktioner. Men framförallt måste vi också bli duktigare att trycka inom EU för att få bort möjligheten att kringgå sanktionerna så att det känns, säger han. Efter EU:s terrorstämpling av iranska revolutionsgardet, IRGC, vill KD-ledamoten att även personer som tillhör eller stöttar organisationen ska möta konsekvenser i Sverige – även om de verkar inom diplomatiska beskickningar.  Fokus på mänskliga rättigheter Partiet anser att fokus i högre grad bör riktas mot mänskliga rättigheter och det kraftigt ökade antalet avrättningar i Iran, snarare än mot olja, sjöfart, Hormuzsundet.  – Det är uppenbart att den islamiska republikens regim är mer rädd för sin egen befolkning än internationella sanktioner och internationella reaktioner. Ledamoten vill också ge oppositionsföreträdare internationell legitimitet och stödja krafter som verkar för ett maktskifte. Det kan bland annat handla om infrastruktur för internet och kommunikation.   – Det är inte tiden att vika ner utan då måste vi steppa upp och stötta befolkningen ännu mer och oppositionen ännu mer.", "link": "https://www.tv4.se/artikel/2fmsqDmiGXYH6BimDBueNK/kraever-hardare-tag-mot-regimen-efter-avraettning-av-svensk-iranier", "date_display": "2026-10-28", "date_iso": "2026-10-28T21:26:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kristdemokraterna", "/valet-2022/kristdemokraterna", "/avrattningar", "/iran", "/inrikes"]}, {"id": 147, "title": "Latinorösten förde Trump till Vita huset – nu sviktar stödet", "summary": "Ångrar sina röster • ”Aldrig kunnat föreställa mig att han skulle sprida sådan terror”", "title_original": "Latinorösten förde Trump till Vita huset – nu sviktar stödet", "summary_original": "Ångrar sina röster • ”Aldrig kunnat föreställa mig att han skulle sprida sådan terror”", "link": "https://www.tv4.se/artikel/38gj7khkOGK72U9Dqiqiey/latinoroesten-foerde-trump-till-vita-huset-nu-sviktar-stoedet", "date_display": "2026-10-28", "date_iso": "2026-10-28T21:23:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 148, "title": "Kate, 20, förlorade drömjobbet efter PEth-test: ”Är nykterist”", "summary": "I maj bestämde sig 20-åriga Kate Ramos från Helsingborg för att försöka uppfylla barndomsdrömmen att bli flygvärdinna. Hon sökte jobb på SAS i Köpenhamn och gick snabbt framåt i rekryteringsprocessen. – Jag har drömt om att bli flygvärdinna sedan jag var liten. Jag älskar att resa och det är en stor anledning till att jag ville bli flygvärdinna.  I processen ingick bland annat att göra ett så kallat PEth-test som visar testpersonens alkoholkonsumtion under de senaste veckorna. Testsvaret skulle kommuniceras efter tre veckor och för Kate som är nykterist var det inget hon tänkte särskilt mycket på. Men sedan vände allt. ”Jag blev extremt chockad” Först två månader senare återkom rekryteringsföretaget och meddelade att gränsvärdet för testet överskridits och att Kate därför inte får jobbet på SAS, vilket SVT tidigare rapporterat om. Själva testet får inte göras om. – De sa att jag har misslyckats på grund av att testet gav utslag för regelbunden överkonsumtion av alkohol. Jag har ju aldrig druckit alkohol så jag blev extremt chockad. Men de sa att de aldrig gör fel, säger Kate. Två dagar senare återkom kliniken som genomförde testet som lät henne veta att det inte bara var PEth-testet som var orsaken till att hon inte fick jobbet. Vad de orsakerna är har Kate dock inte fått veta, säger hon. Sedan dess har hon försökt få svar på var det har gått snett. Hon har dessutom gjort ett nytt PEth-test i Sverige som inte visar spår av alkoholkonsumtion. – Min läkare sa att det sannolikt är ett felvärde i Danmark, säger Kate. SAS: Har följt våra regler Sedan rekryteringsprocessen inleddes har Kate skaffat en lägenhet i Hyllie för att minska pendlingsavståndet till Köpenhamn. Hon säger att hon har tackat nej till både högskoleutbildning och andra jobb och att hon dessutom tvekar på om hon fortfarande vill söka sig till flygsektorn efter allt som hänt. – Jag känner mig lurad och förstår inte hur detta kan hända. SAS uppger till TV4 Nyheterna att alla som anställs i bolagets säkerhetsklassade och operativa tjänster måste genomgå ett PeEth-test.  ”Vi har inga tankar om vad som gör att det blivit ett sådant här utslag. Hon har gjort testet på ett av våra godkända testcenter. Att hon sen gjort ett annat test kan vi inte förhålla oss till, utan vi har vårt godkända testcenter och de har följt våra regler” uppger SAS och tillägger att det endast är resultatet från PEth-testet som gjort att Kate inte fått jobbet. TV4 Nyheterna har kontaktat kliniken som säger att de följer en noggrann procedur. De uppger vidare att de inte kommenterar enskilda fall.", "title_original": "Kate, 20, förlorade drömjobbet efter PEth-test: ”Är nykterist”", "summary_original": "I maj bestämde sig 20-åriga Kate Ramos från Helsingborg för att försöka uppfylla barndomsdrömmen att bli flygvärdinna. Hon sökte jobb på SAS i Köpenhamn och gick snabbt framåt i rekryteringsprocessen. – Jag har drömt om att bli flygvärdinna sedan jag var liten. Jag älskar att resa och det är en stor anledning till att jag ville bli flygvärdinna.  I processen ingick bland annat att göra ett så kallat PEth-test som visar testpersonens alkoholkonsumtion under de senaste veckorna. Testsvaret skulle kommuniceras efter tre veckor och för Kate som är nykterist var det inget hon tänkte särskilt mycket på. Men sedan vände allt. ”Jag blev extremt chockad” Först två månader senare återkom rekryteringsföretaget och meddelade att gränsvärdet för testet överskridits och att Kate därför inte får jobbet på SAS, vilket SVT tidigare rapporterat om. Själva testet får inte göras om. – De sa att jag har misslyckats på grund av att testet gav utslag för regelbunden överkonsumtion av alkohol. Jag har ju aldrig druckit alkohol så g slutval i ”Bonde söker fru” och det märks. När Daniel Eliasson ska välja vilka tre tjejer han vill ha kvar på gården säger brevskrivaren Marielle Isaksson att även de har saker att säga till om. Bland annat har hon en önskelista över saker hon tycker att bonden kan bli bättre på. – Jag tycker att han sköter sig bra, men vi har kanske fler önskemål, säger hon i programmet. Brevskrivarens önskelista En av punkterna är att Daniel ska våga närma sig brevskrivarna mer. – Vi tjejer har diskuterat lite och vi skulle önska att Daniel vågade närma sig oss mer, eller kanske säga någon komplimang, säger Marielle. Hon säger att brevskrivarna försöker ge Daniel chanser men att han inte riktigt tar dem. – Vi servar lite, men han tar det liksom inte, säger hon. När Daniel bland annat hade egentid med Matilda Rantanen frågade hon rakt ut vad han tänkte och kände om henne. Bonden svarade med ord som ”snäll” och ”härlig” när hon kanske hellre hade velat ha en mer personlig komplimang. – Jag känner att vi har haft supertrevliga dagar och att det har varit ett fantastiskt sommarkollo med mina vänner. Men för att det här ska kännas mer som att jag dejtar Daniel behöver jag få lite egentid och bekräftelse från honom på att han vill ha mig här. ”Tycker lite synd om honom” Daniel hävdar att han ska bättra sig. Men när programledare Linda Lindorff frågar om han kan ge en komplimang i samband med att han ska välja vilka tjejer som ska få stanna kvar, säger han att det blir en sådan press. – Jag tycker lite synd om honom, för jag vet att det blir jobbigt. Samtidigt tänker jag att det var nödvändigt, säger Marielle. Enligt Daniel är det lite svårt att visa närhet, särskilt när det har gått så kort tid.  – Jag kanske behöver lite tid också, säger han. Att de blir färre på gården tycker han ändå ska bli skönt. – Konkurrensen kanske ökar lite, så det ska bli spännande att se.", "title_original": "Kan inte ge brevskrivarna komplimanger", "summary_original": "Det börjar närma sig slutval i ”Bonde söker fru” och det märks. När Daniel Eliasson ska välja vilka tre tjejer han vill ha kvar på gården säger brevskrivaren Marielle Isaksson att även de har saker att säga till om. Bland annat har hon en önskelista över saker hon tycker att bonden kan bli bättre på. – Jag tycker att han sköter sig bra, men vi har kanske fler önskemål, säger hon i programmet. Brevskrivarens önskelista En av punkterna är att Daniel ska våga närma sig brevskrivarna mer. – Vi tjejer har diskuterat lite och vi skulle önska att Daniel vågade närma sig oss mer, eller kanske säga någon komplimang, säger Marielle. Hon säger att brevskrivarna försöker ge Daniel chanser men att han inte riktigt tar dem. – Vi servar lite, men han tar det liksom inte, säger hon. När Daniel bland annat hade egentid med Matilda Rantanen frågade hon rakt ut vad han tänkte och kände om henne. Bonden svarade med ord som ”snäll” och ”härlig” när hon kanske hellre hade velat ha en mer personlig komplimang. – Jag känner att vi har haft supertrevliga dagar och att det har varit ett fantastiskt sommarkollo med mina vänner. Men för att det här ska kännas mer som att jag dejtar Daniel behöver jag få lite egentid och bekräftelse från honom på att han vill ha mig här. ”Tycker lite synd om honom” Daniel hävdar att han ska bättra sig. Men när programledare Linda Lindorff frågar om han kan ge en komplimang i samband med att han ska välja vilka tjejer som ska få stanna kvar, säger han att det blir en sådan press. – Jag tycker lite synd om honom, för jag vet att det blir jobbigt. Samtidigt tänker jag att det var nödvändigt, säger Marielle. Enligt Daniel är det lite svårt att visa närhet, särskilt när det har gått så kort tid.  – Jag kanske behöver lite tid också, säger han. Att de blir färre på gården tycker han ändå ska bli skönt. – Konkurrensen kanske ökar lite, så det ska bli spännande att se.", "link": "https://www.tv4.se/artikel/T7PmFfY5H36E1OXIc3khQ/kan-inte-ge-brevskrivarna-komplimanger", "date_display": "2026-10-28", "date_iso": "2026-10-28T20:30:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/bonde", "/tv4-play", "/tv4"]}, {"id": 150, "title": "Då blir månadskortet dubbelt så dyrt – i ditt län", "summary": "Den 1 juli halverades priset på 30-dagarsbiljetter med hjälp av statligt stöd. Prissänkningen gäller både vuxenbiljetter och biljetter för rabattgrupper såsom ungdomar, studenter och pensionärer. Villkoren varierar mellan trafikbolagen. Först ut är Skåne, Blekinge, Kalmar, Kronoberg och Jönköping, där den 2 november är sista dagen att köpa biljett till halva priset. I övriga län gäller de lägre priserna fram till december. Sista köpdag är inte alltid sista aktiveringsdag Hos Skånetrafiken ska rabatterade biljetter aktiveras inom 30 dagar från köpet. Köper du en biljett den 2 november, sista försäljningsdagen, kan du alltså vänta till den 2 december med att aktivera den. Då gäller biljetten till och med den 31 december. Hos SL är den 2 december sista dag för både köp och aktivering till halva priset. Från dagen därpå gäller ordinarie pris. En appbiljett som inte aktiverats i tid slutar gälla. SL uppger att man då försöker betala tillbaka pengarna. Biljetter på SL-kort aktiveras automatiskt den 2 december om det inte redan har gjorts. Den som har SL:s månadsprenumeration får det lägre priset även på decemberbiljetten. I fyra län kan biljetterna aktiveras senare I Norrbotten, Västerbotten, Västernorrland och Jämtland Härjedalen kan rabatterade biljetter aktiveras senare än den 2 december, så länge det sker inom 30 dagar från köpet. Men oavsett när biljetten aktiveras slutar den gälla den 31 december. För att få 30 dagars giltighet behöver den därför aktiveras senast den 2 december. Västtrafiks rabatt kan förlängas I Västra Götaland finns ett förslag om att förlänga försäljningen av rabatterade månadsbiljetter till den 29 december. Regionfullmäktige återremitterade förslaget den 6 oktober och något slutligt beslut har ännu inte fattats. Enligt nuvarande beslut är den 2 december sista dagen att köpa biljett till halva priset hos Västtrafik. Även i Halland förlängs rabatten med en månad, rapporterar Hallands Nyheter. Efter förlängningen är 2 december sista dagen att köpa en rabatterad biljett, medan 1 januari är sista dagen att aktivera biljetten. – Vi vet att vår tyngsta pendlingsrelation är mot Västra Götaland och vi har tidigare diskuterat att vi ska göra som dem, säger Gösta Bergenheim (M), ordförande i driftnämnden för kollektivtrafik, till tidningen.", "title_original": "Då blir månadskortet dubbelt så dyrt – i ditt län", "summary_original": "Den 1 juli halverades priset på 30-dagarsbiljetter med hjälp av statligt stöd. Prissänkningen gäller både vuxenbiljetter och biljetter för rabattgrupper såsom ungdomar, studenter och pensionärer. Villkoren varierar mellan trafikbolagen. Först ut är Skåne, Blekinge, Kalmar, Kronoberg och Jönköping, där den 2 november är sista dagen att köpa biljett till halva priset. I övriga län gäller de lägre priserna fram till december. Sista köpdag är inte alltid sista aktiveringsdag Hos Skånetrafiken ska rabatterade biljetter aktiveras inom 30 dagar från köpet. Köper du en biljett den 2 november, sista försäljningsdagen, kan du alltså vänta till den 2 december med att aktivera den. Då gäller biljetten till och med den 31 december. Hos SL är den 2 december sista dag för både köp och aktivering till halva priset. Från dagen därpå gäller ordinarie pris. En appbiljett som inte aktiverats i tid slutar gälla. SL uppger att man då försöker betala tillbaka pengarna. Biljetter på SL-kort aktiveras automatiskt den 2 december om det inte redan har gjorts. Den som har SL:s månadsprenumeration får det lägre priset även på decemberbiljetten. I fyra län kan biljetterna aktiveras senare I Norrbotten, Västerbotten, Västernorrland och Jämtland Härjedalen kan rabatterade biljetter aktiveras senare än den 2 december, så länge det sker inom 30 dagar från köpet. Men oavsett när biljetten aktiveras slutar den gälla den 31 december. För att få 30 dagars giltighet behöver den därför aktiveras senast den 2 december. Västtrafiks rabatt kan förlängas I Västra Götaland finns ett förslag om att förlänga försäljningen av rabatterade månadsbiljetter till den 29 december. Regionfullmäktige återremitterade förslaget den 6 oktober och något slutligt beslut har ännu inte fattats. Enligt nuvarande beslut är den 2 december sista dagen att köpa biljett till halva priset hos Västtrafik. Även i Halland förlängs rabatten med en månad, rapporterar Hallands Nyheter. Efter förlängningen är 2 december sista dagen att köpa en rabatterad biljett, medan 1 januari är sista dagen att aktivera biljetten. – Vi vet att vår tyngsta pendlingsrelation är mot Västra Götaland och vi har tidigare diskuterat att vi ska göra som dem, säger Gösta Bergenheim (M), ordförande i driftnämnden för kollektivtrafik, till tidningen.", "link": "https://www.tv4.se/artikel/35OZ9s7vhA6u63p2WPj0ph/da-blir-manadskortet-dubbelt-sa-dyrt-i-ditt-laen", "date_display": "2026-10-28", "date_iso": "2026-10-28T20:02:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kollektivtrafik", "/kollektivtrafik", "/inrikes", "/tunnelbana"]}, {"id": 151, "title": "Kvinna kidnappades – gärningsmän tog order av ”spöket”", "summary": "Händelsen utspelade sig i Stockholms län i början av april i år och började med att en kollega till kvinnan frågade om hon ville göra honom en tjänst för 1 500 kronor. Eftersom hon känt mannen i hela sitt liv och han dessutom försäkrade henne om att det inte rörde sig om något olagligt litade hon på kollegan och sa ja. Kvinnan skulle möta en släkting eller bekant till kollegan, och för att ta reda på om mannen hon mötte var rätt person skulle hon använda kodordet ”Messi”. Mannen följde då med till kvinnans bil och satte sig i passagerarsätet och tog fram ett pistolliknande föremål. Samtidigt hoppade två pojkar in i baksätet. Mannen frågade upprepade gånger om ”stashet” och uppmanade kvinnan att avslöja var det fanns. Under tiden gick pojkarna igenom bilen och rapporterade alla uppgifter till en fjärde person som kallades ”Spöket” som var med på telefon. Riktade pistol mot huvudet Enligt domen upprepade kvinnan att hon inte kände till något ”stash”, alltså en narkotikagömma. Gärningsmännen hotade att döda både henne och hennes familj om hon inte talade sanning. På order av ”Spöket” tog männen sedan med kvinnan på en mardrömsfärd. Kvinnan tvingades att köra runt med gärningsmännen i södra Stockholm, och när de kom fram till Skogås i Huddinge blev hon misshandlad med slag och sparkar. Gärningsmännen tog även hennes värdesaker. När de hade misshandlat kvinnan riktade en av gärningspersonerna en pistol mot hennes huvud, tog en bild och skickade bilden till kvinnans kollega. Efteråt tvingade de in kvinnan i bagageutrymmet och körde iväg. Efter en stund stannade de och kvinnan hörde gärningsmännen lämna bilen. Hon lyckades ta sig in i bilen och såg då att mannen kom tillbaka. Enligt domen ska han ha kastat bilnyckeln till henne och sagt ”glöm inte det var jag som räddade ditt liv” innan han gick iväg igen. Döms till fängelse I fredags dömdes mannen i Södertörns tingsrätt till fängelse i sex år för människorov. De båda pojkarna döms för människorov till sluten ungdomsvård i ett år och två månader respektive ett år och sju månader. Mannen och pojkarna ska betala skadestånd till kvinnan på totalt drygt 130 000 kronor.  Pojkarna döms dessutom för försök till människorov för en händelse som utspelade sig i januari i år. Enligt domen ska pojkarna ha tagit sig in i en mans lägenhet, hotat och slagit honom med ett vapenliknande föremål samt försökt stjäla hans telefon och plånbok.  Pojkarna ska tillsammans betala drygt 36 000 kronor i skadestånd till mannen.", "title_original": "Kvinna kidnappades – gärningsmän tog order av ”spöket”", "summary_original": "Händelsen utspelad . Det bara hände, jag tänkte inte så mycket på det. Jag gjorde mål, självklart ska jag fira, sade Zugelj till TV4 Play i paus och fortsatte: Det är lite annorlunda. Jag känner killarna (i Djurgården) men i slutändan är det fotboll, jag måste göra mitt bästa för mitt lag. I den andra halvleken böljade spelet fram och tillbaka och Djurgården fick även in en kvittering genom Bo Hegland. Den norska poängmaskinen nickade in ett inlägg från vänsterkanten och fortsätter dryga ut sin överlägsna ledning i allsvenskans poängliga. Några fler mål skulle inte göras på Gamla Ullevi och Djurgården tappade enormt viktiga poäng i den allsvenska toppstriden. Man är nu sex poäng bakom Sirius med fyra omgångar kvar. Sirius har också en match mindre spelad. IFK Göteborg ligger nia.", "title_original": "Egna spelaren förstörde i guldjakten – valde att fira vilt", "summary_original": "Djurgården reste till Göteborg för en livsviktig match, fortfarande med i kampen om SM-guldet. Stockholmslaget behövde en seger för att knappa in på serieledande Sirius och Hammarby. Matchen fick ett tidigt avbrott efter bara en minuts spel, sedan pyroteknik på läktarna fyllt planen med rök och skapat tät dimma. Satte tidig press När matchen väl kunde återupptas var det dock hemmalaget IFK Göteborg för hela slanten och Djurgårdsmålvakten Jacob Rinne fick verkligen göra skäl för lönen. Både en, två och tre gånger försökte Blåvitt-anfallaren Alexander Simmelhack spräcka Rinnes nolla, utan att lyckas. Men i den 40:e minuten kom så äntligen utdelningen för IFK Göteborg – och målskytten var speciell. Djurgårdens utlånade mittfältare Nino Zugelj vek in och avlossade ett perfekt skott med fem minuter kvar till halvtidsvilan. Djurgårdsmålvakten Jacob Rinne var chanslös och tvingades till slut kapitulera. ”Självklart ska jag fira” Och det var inte tal om något försiktigt firande direkt. Slovenen vrålade ut sin glädje efter sitt tredje mål i Blåvitt-tröjan. Det bara hände, jag tänkte inte så mycket på det. Jag gjorde a Vincis målning och pekar på flera detaljer: Mona Lisa saknar tydliga ögonbryn och ögonfransar dessutom har hon ett tunt hårfäste. \n\nEnligt läkaren kan det vara tecken på Alopeci, en autoimmun sjukdom som orsakar håravfall.  Doktor Mikael Sandström tycker att teorin är tänkbar. – Det är ganska väl underbyggt vad det gäller kliniska tecken med avsaknaden av ögonbryn, ögonfransar och hårfäste. Detaljerna som väcker misstankar Det är inte första gången Mona Lisas hälsa väcker spekulationer. Tidigare har bland annat sköldkörtelsjukdom, förhöjda kolestrolvärden och ansiktsförlamning föreslagits som möjliga förklaringar till hennes utseende.  Men att ställa en diagnos utifrån en 500 år gammal målning är förstås osäkert. \n\n– Det vet man inte säkert, konstaterar dr Mikael.\n\nHan berättar samtidigt att läkare ibland kan upptäcka tecken på sjukdomar bara genom att studera en persons utseende, något han själv upplevt vid flera tillfällen.", "title_original": "Nya teorin om Mona Lisa – kan ha lidit av autoimmun sjukdom", "summary_original": "Den italienske hudläkaren Luigi Laino har granskat Leonardo da Vincis målning och pekar på flera detaljer: Mona Lisa saknar tydliga ögonbryn och ögonfransar dessutom har hon ett tunt hårfäste. \n\nEnligt läkaren kan det vara tecken på Alopeci, en autoimmun sjukdom som orsakar håravfall.  Doktor Mikael Sandström tycker att teorin är tänkbar. – Det är ganska väl underbyggt vad det gäller kliniska tecken med avsaknaden av ögonbryn, ögonfransar och hårfäste. Detaljerna som väcker misstankar Det är inte första gången Mona Lisas hälsa väcker spekulationer. Tidigare har bland annat sköldkörtelsjukdom, förhöjda kolestrolvärden och ansiktsförlamning föreslagits som möjliga förklaringar till hennes utseende.  Men att ställa en diagnos utifrån en 500 år gammal målning är förstås osäkert. \n\n– Det vet man inte säkert, konstaterar dr Mikael.\n\nHan berättar samtidigt att läkare ibland kan upptäcka tecken på sjukdomar bara genom att studera en persons utseende, något han själv upplevt vid flera tillfällen.", "link": "https://www.tv4.se/artikel/68KMzcjuGDsGb4YRnqnWOn/nya-teorin-om-mona-lisa-kan-ha-lidit-av-autoimmun-sjukdom", "date_display": "2026-10-28", "date_iso": "2026-10-28T18:32:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/mona-lisa", "/konst", "/sjukdomar"]}, {"id": 155, "title": "Liam Nebel hade kontakt med 13-åring – minuter innan attacken", "summary": "En omfattande polisutredning har pågått sedan eftermiddagen den 21 augusti, när svärdattacken genomfördes på Brinellskolan.  Över 760 förhör har hittills hållits och analyser av material från brottsplatsundersökningarna och av beslagen pågår. – Min bedömning är att vi börjar få en klarare bild av händelseförloppet på skolan men mycket arbete återstår. Utredningen fortsätter och ett intensivt arbete pågår, bland annat ska ytterligare förhör och analyser genomföras. Det är redan ett mycket stort utredningsmaterial som fortsätter att växa varje dag. Det kommer att ta tid att slutföra, sammanställa och analysera allt material, säger senior åklagare Ann-Sofie Trossing i ett pressmeddelande i förra veckan. Den häktade utföraren, Liam Nebel, var aktiv i True Crime Community, TCC, en extremistisk och våldsdyrkande nätrörelse som bland annat glorifierar skolattentat. Kontakt precis innan svärdattacken Polisutredningen har visat att Liam Nebel har haft kontakt med flera ungdomar inom TCC-miljön. En av dem var en 13-årig pojke. Enligt handlingar och uppgifter som TV4 Nyheterna tagit del av hade 13-åringen och Liam Nebel kontakt i flera månader innan skoldådet i Fagersta. Liam Nebel, som uppges ha befunnit sig på en toalett på skolan innan han slog till, hade även kontakt med pojken ”bara några minuter innan attacken skedde”, enligt samma handlingar. Det är den sista kända kontakten han hade före dådet. – Jag lämnar inte några kommentarer om utredningen, säger Ann-Sofie Trossing. Hon vill inte bekräfta att Liam Nebel hade kontakt med en pojke precis innan han gick till svärdattack.  Den 13-årige pojken blev omedelbart omhändertagen av polis och lämnades över till socialtjänsten. Förvaltningsrätten beslutade nyligen att han ska vårdas enligt LVU, lagen om vård av unga. Beslutet bygger på ”flera mycket oroande och allvarliga uppgifter”, enligt socialnämnden. ”(Pojken) har sökt sig till och befunnit sig i en våldsbejakande kontext online där skolskjutningar och massdödande idoliseras. Det framgår också att han inte har varit passiv i dessa mycket skadliga miljöer utan han har själv agerat”, står det i handlingarna. Flera TCC-medlemmar misstänkta Innan omhändertagandet gjorde Säkerhetspolisen en orosanmälan om pojken efter att ha upptäckt 13-åringen på sin radar. Han utreddes i samband med det för grovt olaga hot efter att ha lagt ut ett Tiktok-inlägg med en bild på ett vapen och en hotfull text. Flera andra ungdomar har också utretts för brott eller omhändertagits av sociala myndigheter efter att polisen upptäckt att de haft kontakt med Liam Nebel eller rört sig i TCC-miljön. I vissa fall misstänks tonåringarna ha planerat egna attentat, bland annat en flicka som omhändertogs för förberedelse till mord men som inte kommer kunna åtalas eftersom hon var under 15 år vid tillfället. En annan tonåring som ska ha haft nära kontakt med Liam Nebel var 16 år och kunde därför gripas. Han misstänks ha uppmuntrat Liam Nebel till hans skoldåd och sitter häktad för medhjälp till mord och mordförsök i Fagersta. Samma 16-åring utreds även för förberedelse till mord efter att ha planerat en egen skolattack, enligt uppgifter till TV4 Nyheterna. En flicka dog och tre pojkar skadades i dådet på Brinellskolan.", "title_original": "Liam Nebel hade kontakt med 13-åring – minuter innan attacken", "summary_original": "En omfattande polisutredning har pågått sedan eftermiddagen den 21 augusti, när svärdattacken genomfördes på Brinellskolan.  Över 760 förhör har hittills hållits och analyser av material från brottsplatsundersökningarna och av beslagen pågår. – Min bedömning är att vi börjar få en klarare bild av händelseförloppet på skolan men mycket arbete återstår. Utredningen fortsätter och ett intensivt arbete pågår, bland annat ska ytterligare förhör och analyser genomföras. Det är redan ett mycket stort utredningsmaterial som fortsätter att växa varje dag. Det kommer att ta tid att slutföra, sammanställa och analysera allt material, säger senior åklagare Ann-Sofie Trossing i ett pressmeddelande i förra veckan. Den häktade utföraren, Liam Nebel, var aktiv i True Crime Community, TCC, en extremistisk och våldsdyrkande nätrörelse som bland annat glorifierar skolattentat. Kontakt precis innan svärdattacken Polisutredningen har visat att Liam Nebel har haft kontakt med flera ungdomar inom TCC-miljön. En av dem var en 13-årig pojke. Enligt handlingar och uppgifter som TV4 Nyheterna tagit del av hade 13-åringen och Liam Nebel kontakt i flera månader innan skoldådet i Fagersta. Liam Nebel, som uppges ha befunnit sig på en toalett på skolan innan han slog till, hade även kontakt med pojken ”bara några minuter innan attacken skedde”, enligt samma handlingar. Det är den sista kända kontakten han hade före dådet. – Jag lämnar inte några kommentarer om utredningen, säger Ann-Sofie Trossing. Hon vill inte bekräfta att Liam Nebel hade kontakt med en pojke precis innan han gick till svärdattack.  Den 13-årige pojken blev omedelbart omhändertagen av polis och lämnades över till socialtjänsten. Förvaltningsrätten beslutade nyligen att han ska vårdas enligt LVU, lagen om vård av unga. Beslutet bygger på ”flera mycket oroande och allvarliga uppgifter”, enligt socialnämnden. ”(Pojken) har sökt sig till och befunnit sig i en våldsbejakande kontext online där skolskjutningar och massdödande idoliseras. Det framgår också att han inte har varit passiv i dessa mycket skadliga miljöer utan han har själv agerat”, står det i handlingarna. Flera TCC-medlemmar misstänkta Innan omhändertagandet gjorde Säkerhetspolisen en orosanmälan om pojken efter att ha upptäckt 13-åringen på sin radar. Han utreddes i samband med det för grovt olaga hot efter att ha lagt ut ett Tiktok-inlägg med en bild på ett vapen och en hotfull text. Flera andra ungdomar har också utretts för brott eller omhändertagits av sociala myndigheter efter att polisen upptäckt att de haft kontakt med Liam Nebel eller rört sig i TCC-miljön. I vissa fall misstänks tonåringarna ha planerat egna attentat, bland annat en flicka som omhändertogs för förberedelse till mord men som inte kommer kunna åtalas eftersom hon var under 15 år vid tillfället. En annan tonåring som ska ha haft nära kontakt med Liam Nebel var 16 år och kunde därför gripas. Han misstänks ha uppmuntrat Liam Nebel till hans skoldåd och sitter häktad för medhjälp till mord och mordförsök i Fagersta. Samma 16-åring utreds även för förberedelse till mord efter att ha planerat en egen skolattack, enligt uppgifter till TV4 Nyheterna. En flicka dog och tre pojkar skadades i dådet på Brinellskolan.", "link": "https://www.tv4.se/artikel/17a62N80mm3IlVi2WkTAXH/liam-nebel-hade-kontakt-med-13-aring-minuter-innan-attacken", "date_display": "2026-10-28", "date_iso": "2026-10-28T18:27:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/skoldadet-i-fagersta", "/fagersta", "/goteborg", "/brott", "/tcc"]}, {"id": 156, "title": "Psykolog hoppar av ”Gift vid första ögonkastet”", "summary": "Den välkända tv-psykologen Anna Bennich gör debut som relationsexpert i årets upplaga av realityserien. Men nu avslöjar hon att det inte blir fler säsonger. Jag har känt mig ganska frustrerad och maktlös gällande några saker. En sådan är klippningen. Jag tycker att vi spelade in ett på många sätt fint relationsprogram i våras, men nu tycker jag att det är klippt på ett sätt som mest är smaskig reality och orättvist mot några av deltagarna, säger hon till DN. I den 15:e säsongen av GVFÖ har ”XL” lagts till i namnet. Paren är fler, avsnitten 16 i stället för 10 och för första gången bor alla deltagare under samma tak. Nytt  är också att paren löpande kan bestämma om de vill stanna kvar eller skilja sig. Anna Bennich menar att vissa deltagare fått stå tillbaka till förmån för andra och upplever att experterna i för hög grad ”sitter och nickar” i stället för att visa på hur de arbetar.", "title_original": "Psykolog hoppar av ”Gift vid första ögonkastet”", "summary_original": "Den välkända tv-psykologen Anna Bennich gör debut som relationsexpert i årets upplaga av realityserien. Men nu avslöjar hon att det inte blir fler säsonger. Jag har känt mig ganska frustrerad och maktlös gällande några saker. En sådan är klippningen. Jag tycker att vi spelade in ett på många sätt fint relationsprogram i våras, men nu tycker jag att det är klippt på ett sätt som mest är smaskig reality och orättvist mot några av deltagarna, säger hon till DN. I den 15:e säsongen av GVFÖ har ”XL” lagts till i namnet. Paren är fler, avsnitten 16 i stället för 10 och för första gången bor alla deltagare under samma tak. Nytt  är också att paren löpande kan bestämma om de vill stanna kvar eller skilja sig. Anna Bennich menar att vissa deltagare fått stå tillbaka till förmån för andra och upplever att experterna i för hög grad ”sitter och nickar” i stället för att visa på hur de arbetar.", "link": "https://www.tv4.se/artikel/tt-261028-gvfobennich1-47ba08c8/psykolog-hoppar-av-gift-vid-forsta-ogonkastet", "date_display": "2026-10-28", "date_iso": "2026-10-28T18:20:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/anna-bennich", "/konst", "/kultur", "/gift-vid-forsta-ogonkastet"]}, {"id": 157, "title": "Polisens varning inför Halloween: Då blir buset ett brott", "summary": "Äggkastning, skrämmande masker och leksaksvapen som misstas för riktiga. Halloweenbus kan leda till polisanmälningar och i värsta fall utgöra brott. Enligt Johanna Malm beror gränsdragningen på vad som hänt, avsikten bakom och hur den utsatta personen reagerar. Det kan handla om ofredande eller olaga hot. – Vi vill att föräldrarna tar ett snack med sina barn. Om det är äldre barn kanske man ska kolla vad de har för kvällsplaner.  Etikettexperten: ”Bus ska vara snällt” Vett- och etikettexperten Mats Danielsson tycker att Halloweenfirare ska visa hänsyn till både grannar och förbipasserande. – När man skadar eller när nån blir kränkt eller rädd har det gått för långt. Bus ska vara snällt. Hans råd till den som inte vill ha besök är enkelt: Släck lampan eller sätt upp en vänlig lapp på dörren. Familjens skräckfest – laddar med 1 600 godispåsar I Örby går familjen Jakobsson all in på halloween. Sedan augusti har de förberett årets firande med gravstenar, spöken och ett helt nytt spökhus i trädgården. Förra året gick 1 200 godispåsar åt. I år har familjen laddat upp med hela 1 600. – Vi tänker att det här är en lek och det är viktigt att alla som är med tycker att det är roligt. Annars är det inte en lek, säger Patrik Jakobsson.", "title_original": "Polisens varning inför Halloween: Då blir buset ett brott", "summary_original": "Äggkastning, skrämmande masker och leksaksvapen som misstas för riktiga. Halloweenbus kan leda till polisanmälningar och i värsta fall utgöra brott. Enligt Johanna Malm beror gränsdragningen på vad som hänt, avsikten bakom och hur den utsatta personen reagerar. Det kan handla om ofredande eller olaga hot. – Vi vill att föräldrarna tar ett snack med sina barn. Om det är äldre barn kanske man ska kolla vad de har för kvällsplaner.  Etikettexperten: ”Bus ska vara snällt” Vett- och etikettexperten Mats Danielsson tycker att Halloweenfirare ska visa hänsyn till både grannar och förbipasserande. – När man skadar eller när nån blir kränkt eller rädd har det gått för långt. Bus ska vara snällt. Hans råd till den som inte vill ha besök är enkelt: Släck lampan eller sätt upp en vänlig lapp på dörren. Familjens skräckfest – laddar med 1 600 godispåsar I Örby går familjen Jakobsson all in på halloween. Sedan augusti har de förberett årets firande med gravstenar, spöken och ett helt nytt spökhus i trädgården. Förra året gick 1 200 godispåsar åt. I år har familjen laddat upp med hela 1 600. – Vi tänker att det här är en lek och det är viktigt att alla som är med tycker att det är roligt. Annars är det inte en lek, säger Patrik Jakobsson.", "link": "https://www.tv4.se/artikel/7LExghvc5QMo9KGPCDDJkH/polisens-varning-infoer-halloween-bus-kan-bli-brott", "date_display": "2026-10-28", "date_iso": "2026-10-28T17:32:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/halloween", "/brott", "/vett-och-etikett", "/brott-och-straff"]}, {"id": 158, "title": "Turbokycklingar kan förbjudas i Danmark: ”Historiskt”", "summary": "Med hjälp av filmer från Djurens rätt kunde Kalla fakta i somras visa hur kycklingar av arten Ross 308 har svårt att gå, stå och andas på grund av att de växer så snabbt. Kycklingarna lever i ungefär 35 dagar och går under den tiden från att väga drygt 40 gram till att väga cirka 2 kilo. I Norge pågår ett arbete med att fasa ut arten ur kycklinguppfödning, och i Danmark har flera partier uttryckt en önskan om ett förbud mot så kallade turbokycklingar. Tidigare har bland annat regeringspartierna Socialistisk Folkepartiet, Radikale Venstre och Moderaterne gått ut med att de vill förbjuda turbokycklingar.  \"Vill arbeta för ett nationellt förbud\"  Nu säger landets djurskyddsminister, Christian Rajberg Madsen från danska Socialdemokraterna, att han vill att arten Ross 308 förbjuds. - Jag vill arbeta för ett nationellt förbud. Men det är klart att det ska undersökas både juridiskt och ekonomiskt, säger Rajberg Madsen till danska TV2.  I och med djurskyddsministerns uttalande tycks det nu finnas en politisk majoritet i Folketinget som vill verka för ett förbud mot turbokycklingar. Enligt Djurens rätt är detta historiskt. - Att den danska djurskyddsministern nu tydligt uttalar att turbokycklingar bör förbjudas, och att han har brett politiskt stöd för detta, är historiskt. Det visar att den politiska viljan för att sätta stopp för extremaveln är stark, och att allt fler partier inser att dagens system orsakar ett oacceptabelt lidande för miljontals kycklingar, säger Tina Hogevik, riksordförande för Djurens rätt, i ett pressmeddelande.  Vill se Sverige inspireras  Samtidigt uppmanar hon svenska politiker att ta efter Danmark - Vad väntar Sveriges politiker på egentligen? Vi har sett hur Danmark agerar, och tidigare i år även Norge. Nu gäller det att svenska partier växlar upp takten så att Sverige inte blir det sista skandinaviska landet kvar med turbokycklingarna, tillägger Hogevik.", "title_original": "Turbokycklingar kan förbjudas i Danmark: ”Historiskt”", "summary_original": "Med hjälp av filmer från Djurens rätt kunde Kalla fakta i somras visa hur kycklingar av arten Ross 308 har svårt att gå, stå och andas på grund av att de växer så snabbt. Kycklingarna lever i ungefär 35 dagar och går under den tiden från att väga drygt 40 gram till att väga cirka 2 kilo. I Norge pågår ett arbete med att fasa ut arten ur kycklinguppfödning, och i Danmark har flera partier uttryckt en önskan om ett förbud mot så kallade turbokycklingar. Tidigare har bland annat regeringspartierna Socialistisk Folkepartiet, Radikale Venstre och Moderaterne gått ut med att de vill förbjuda turbokycklingar.  \"Vill arbeta för ett nationellt förbud\"  Nu säger landets djurskyddsminister, Christian Rajberg Madsen från danska Socialdemokraterna, att han vill att arten Ross 308 förbjuds. - Jag vill arbeta för ett nationellt förbud. Men det är klart att det ska undersökas både juridiskt och ekonomiskt, säger Rajberg Madsen till danska TV2.  I och med djurskyddsministerns uttalande tycks det nu finnas en politisk majoritet i Folketinget som vill verka för ett förbud mot turbokycklingar. Enligt Djurens rätt är detta historiskt. - Att den danska djurskyddsministern nu tydligt uttalar att turbokycklingar bör förbjudas, och att han har brett politiskt stöd för detta, är historiskt. Det visar att den politiska viljan för att sätta stopp för extremaveln är stark, och att allt fler partier inser att dagens system orsakar ett oacceptabelt lidande för miljontals kycklingar, säger Tina Hogevik, riksordförande för Djurens rätt, i ett pressmeddelande.  Vill se Sverige inspireras  Samtidigt uppmanar hon svenska politiker att ta efter Danmark - Vad väntar Sveriges politiker på egentligen? Vi har sett hur Danmark agerar, och tidigare i år även Norge. Nu gäller det att svenska partier växlar upp takten så att Sverige inte blir det sista skandinaviska landet kvar med turbokycklingarna, tillägger Hogevik.", "link": "https://www.tv4.se/artikel/15HNWXBwYjkvME7YzPiNyj/turbokycklingar-kan-foerbjudas-i-danmark-historiskt", "date_display": "2026-10-28", "date_iso": "2026-10-28T17:32:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/utrikes", "/kalla-fakta-turbokycklingarna", "/kyckling", "/djurens-ratt", "/djur"]}, {"id": 159, "title": "Passagerare om tågkraschen: ”Människor kastades upp i luften”", "summary": "Dödstalet stiger • Premiärministern: ”Spanien är i sorg”", "title_original": "Passagerare om tågkraschen: ”Människor kastades upp i luften”", "summary_original": "Dödstalet stiger • Premiärministern: ”Spanien är i sorg”", "link": "https://www.tv4.se/artikel/7sNlJ7Tdy90oYt7Xg8HIdG/passagerare-om-tagkraschen-maenniskor-kastades-upp-i-luften", "date_display": "2026-10-28", "date_iso": "2026-10-28T17:15:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 160, "title": "Kanske kan valet i Israel bli början på något nytt och bättre", "summary": "Erik Helmerson: Netanyahu har inte gjort det lätt för oss Israelvänner.", "title_original": "Kanske kan valet i Israel bli början på något nytt och bättre", "summary_original": "Erik Helmerson: Netanyahu har inte gjort det lätt för oss Israelvänner.", "link": "https://www.dagen.se/ledare/kanske-kan-valet-i-israel-bli-boerjan-pa-nagot-nytt-och-baettre/10606074", "date_display": "2026-10-28", "date_iso": "2026-10-28T16:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 161, "title": "Väninnorna fick bröstcancer – efter varandra: ”Overkligt”", "summary": "På försommaren 2024 kände Maria Hedlund en knöl i bröstet och i november samma år fick hon ett cancerbesked.  – Det var totalt omvälvande i livet. Mitt i allt med jobb, träning, familj och vänner, att få ett sådant besked som hindrade allt. Att berätta för barnen var fruktansvärt och det var en väldigt orolig period, säger hon.  Behandlingen blev fysiskt och psykiskt utmanande. Men Maria höll fast vid att det fanns en plan, och att läkarna var proffs. Emelies upptäckt Vänskapen mellan Maria och Emelie har betytt mycket men när Maria blev sjuk blev det ännu tydligare. – Emelie har varit viktig för mig väldigt länge i livet. När man blir drabbad av en sådan här sak blir det ännu viktigare med alla runtomkring, säger Maria. Nästan ett år efter sin diagnos gav Maria en brösttvål till Emelie och några andra vänner. Syftet var att uppmana till att undersöka sig själv, precis så som Maria själv hade upptäckt sin cancer. – Jag har inte fyllt 40 så jag har inte gjort mammografi. Jag hade inte ens tänkt tanken på att känna efter, säger Emelie. Men samma kväll som hon fick tvålen undersökte hon sig i duschen och kände en knöl. – Jag skrev ju ett sms till Maria redan samma kväll: Jag känner någonting, men jag är paranoid. Det kan inte vara något. Först efter två månader sökte Emelie vård och diagnosen kom snabbt. Redan vid ultraljudet konstaterades att det var en cancerknöl. – På 1,5 timme satt jag med ett papper i bilen där det stod att jag skulle opereras för bröstcancer. Det var jättekonstigt när man tänker tillbaka på det, säger Emelie. Att stötta varandra Båda har gått igenom tuffa behandlingar med cellgifter och strålning. Maria och Emelie har haft två olika typer av bröstcancer men de trycker på vikten av att de hade varandra. \n\n– Man vill verkligen inte att någon ska behöva gå igenom det här för då visste jag ju vad som väntade Emelie också. Men det är också fint att vi har gjort det här ihop, säger Maria. Vänskapen har varit en trygghet genom hela processen. De har kunnat vara förbannade och ledsna tillsammans, utan att behöva lägga allt på familjen. – Det är klart att man är ledsen och arg hemma, men det har varit skönt att ha någon som man vet förstår på samma sätt, säger Emelie. ”Jättetacksam” De har haft samtal om vad som kunnat hända om Emelie inte fått tvålen i present av Maria. – Man börjar med mammografi när man är 40 och det är ett år kvar för mig. Tänk vad som hade hänt om jag inte märkt något förrän om ett år. Jag är jättetacksam över att jag upptäckte det ganska tidigt. Idag har de båda avslutat sina behandlingar och ser positivt på framtiden. \n\n– Man mår inte helt topp och hjärnan är inte med som den var innan. Det pågår mycket inombords men jag mår bra, säger Maria. Även Emelie säger att livet ser annorlunda ut. \n\n– Jag brukar säga till folk som frågar hur jag mår, att jag mår bra, men mitt bra kanske har ändrats lite. Jag mår bättre nu än under behandlingarna. Det kommer att få ta tid, men man känner sig starkare varje dag.", "title_original": "Väninnorna fick bröstcancer – efter varandra: ”Overkligt”", "summary_original": "På försommaren 2024 kände Maria Hedlund en knöl i bröstet och i november samma år fick hon ett cancerbesked.  – Det var totalt omvälvande i livet. Mitt i allt med jobb, träning, familj och vänner, att få ett sådant besked som hindrade allt. Att berätta för barnen var fruktansvärt och det var en väldigt orolig period, säger hon.  Behandlingen blev fysiskt och psykiskt utmanande. Men Maria höll fast vid att det fanns en plan, och att läkarna var proffs. Emelies upptäckt Vänskapen mellan Maria och Emelie har betytt mycket men när Maria blev sjuk blev det ännu tydligare. – Emelie har varit viktig för mig väldigt länge i livet. När man blir drabbad av en sådan här sak blir det ännu viktigare med alla runtomkring, säger Maria. Nästan ett år efter sin diagnos gav Maria en brösttvål till Emelie och några andra vänner. Syftet var att uppmana till att undersöka sig själv, precis så som Maria själv hade upptäckt sin cancer. – Jag har inte fyllt 40 så jag har inte gjort mammografi. Jag hade inte ens tänkt tanken på att känna efter, säger Emelie. Men samma kväll som hon fick tvålen undersökte hon sig i duschen och kände en knöl. – Jag skrev ju ett sms till Maria redan samma kväll: Jag känner någonting, men jag är paranoid. Det kan inte vara något. Först efter två månader sökte Emelie vård och diagnosen kom snabbt. Redan vid ultraljudet konstaterades att det var en cancerknöl. – På 1,5 timme satt jag med ett papper i bilen där det stod att jag skulle opereras för bröstcancer. Det var jättekonstigt när man tänker tillbaka på det, säger Emelie. Att stötta varandra Båda har gått igenom tuffa behandlingar med cellgifter och strålning. Maria och Emelie har haft två olika typer av bröstcancer men de trycker på vikten av att de hade varandra. \n\n– Man vill verkligen inte att någon ska behöva gå igenom det här för då visste jag ju vad som väntade Emelie också. Men det är också fint att vi har gjort det här ihop, säger Maria. Vänskapen har varit en trygghet genom hela processen. De har kunnat vara förbannade och ledsna tillsammans, utan att behöva lägga allt på familjen. – Det är klart att man är ledsen och arg hemma, men det har varit skönt att ha någon som man vet förstår på samma sätt, säger Emelie. ”Jättetacksam” De har haft samtal om vad som kunnat hända om Emelie inte fått tvålen i present av Maria. – Man börjar med mammografi när man är 40 och det är ett år kvar för mig. Tänk vad som hade hänt om jag inte märkt något förrän om ett år. Jag är jättetacksam över att jag upptäckte det ganska tidigt. Idag har de båda avslutat sina behandlingar och ser positivt på framtiden. \n\n– Man mår inte helt topp och hjärnan är inte med som den var innan. Det pågår mycket inombords men jag mår bra, säger Maria. Även Emelie säger att livet ser annorlunda ut. \n\n– Jag brukar säga till folk som frågar hur jag mår, att jag mår bra, men mitt bra kanske har ändrats lite. Jag mår bättre nu än under behandlingarna. Det kommer att få ta tid, men man känner sig starkare varje dag.", "link": "https://www.tv4.se/artikel/6go1krt3ViEscx5x8Xrflm/vaeninnorna-fick-broestcancer-efter-varandra", "date_display": "2026-10-28", "date_iso": "2026-10-28T11:32:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/cancer", "/vanskap"]}, {"id": 162, "title": "Minst 68 döda efter tågkrasch", "summary": "Två höghastighetståg kolliderade • Premiärministern: ”Bestört”", "title_original": "Minst 68 döda efter tågkrasch", "summary_original": "Två höghastighetståg kolliderade • Premiärministern: ”Bestört”", "link": "https://www.tv4.se/artikel/w9awPpfOjnuX1NptoUSrp/minst-tio-doeda-efter-tagkrasch-i-spanien", "date_display": "2026-10-28", "date_iso": "2026-10-28T09:16:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 163, "title": "Så gick det för Netanyahu i det israeliska valet", "summary": "Arne Lapidus: 'Röda linjer kan blockera bildandet av en ny regering i Israel'", "title_original": "Så gick det för Netanyahu i det israeliska valet", "summary_original": "Arne Lapidus: 'Röda linjer kan blockera bildandet av en ny regering i Israel'", "link"
