topher Nolan släpper ny film, och \"The Odyssey\", baserad på Homeros epos, är inget undantag. I rollerna syns bland andra Matt Damon och Anne Hathaway. Men mest diskussion har valet av Lupita Nyong'o som Helena av Troja väckt, speciellt inom ytterhögern i USA. Bland annat säger Matt Walsh, amerikansk konservativ kommentator: ”Det är historiskt helt orimligt att ge rollen till en afrikan, då skulle man lika gärna kunna göra Helena av Troja till kines. Han gör detta för att han vet att han skulle bli kallad rasist om han valde en vit kvinna” Delade meningar om antikens Grekland Samtidigt menar forskare att antikens Grekland inte var så \"vitt\" som folk verkar tro. – Det var inte det och det har vi vetat i flera hundra år, att skulpturer och tempel var bemålade. Men det krockar med idén som finns från renässansen och framåt, säger Ida Östenberg, professor i antikens kultur vid Göteborgs universitet.\n\nÄven Elon Musk har kritiserat filmen och anklagar Nolan för att ha \"skändat Homeros\" och menar att valet av skådespelare handlar om mångfaldskrav i jakten på en Oscar. Levande klassiker Både Christopher Nolan och Lupita Nyong'o har avfärdat kritiken och betonar att filmen är en konstnärlig tolkning av en myt.  – Poängen med de här verken, som Homeros, är att de alltid har omtolkats. Ända sedan antiken, säger Ida Östenberg. – Alla tider gör sina versioner och det är viktigt för att det innebär att det här verket inte bara är ett dött verk utan en levande kanon.", "link": "https://www.tv4.se/artikel/OgQnWcQ8jHSaFo7A4A9JN/ytterhoegern-rasar-mot-nolans-rollbesaettning-i-the-odyssey", "date_display": "2026-07-17", "date_iso": "2026-07-17T16:12:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/film", "/christopher-nolan", "/the-odyssey", "/lupita-nyongo"]}, {"id": 151, "title": "The Liberals serve wine in the polling booth - want to reach new voters", "summary": "Since the first of June, there is no longer a requirement to serve food in order to serve alcohol. This means that several different types of businesses can apply for a serving license from the municipality, something that the Liberals in Uppsala did and got approved, which P4 Uppland was the first to report on. In August, it will be possible to buy wine or beer in the Liberalerna Uppsala polling booth on Stora torget.  - We are doing this because we want to and because we can with the change in the law, says Liberals in Uppsala chairman and municipal councilor Eva Edwardsson. Want to reach new people Eva Edwardsson says that the polling booth can be open until 6 pm, while the alcohol permit is only valid from 5 pm, so it is only the last hour that alcohol will be available.  The party hopes to reach people who would not otherwise have come past the Liberals' polling booth.  - We want to add the possibility of discussing politics over a glass of beer or a glass of wine. Arousing criticism The Liberals' initiative has attracted criticism. Jan-Ove Ragnarsson is vice chairman of the temperance organization Movendi Sweden, as well as an active social democrat in Enköping, and one of those who spoke out critically. - Alcohol certainly does not belong in a polling booth, but also that you more or less exclude or in any case limit the availability of certain people, for example people with addictions. Jan-Ove Ragnarsson thinks society needs more alcohol-free environments. - If you want to have serious conversations, think politics is important and really want to meet voters face to face - you should at all consider the idea that there should be alcohol in such contexts, says Jan-Ove Ragnarsson. \"Sensitive chapter\" Eva Edwardsson has respect for the criticism that has come. She says that alcoholism is a serious social problem and that she understands that alcohol policy in Sweden is a \"sensitive chapter\".  - But we have to remember that it is the alcohol law that applies. It is important to say that people have a choice to visit our polling booth during the hours we s", "title_original": "Liberalerna serverar vin i valstugan – vill nå nya väljare", "summary_original": "Sedan första juni finns det inte längre något krav på att servera mat för att få servera alkohol. Detta betyder att flera olika typer av verksamheter kan ansöka om serveringstillstånd hos kommunen, något som Liberalerna i Uppsala gjort och fått godkänt, vilket P4 Uppland var först att rapportera om. I Liberalerna Uppsalas valstuga på Stora torget kommer det i augusti gå att köpa vin eller öl.  – Vi gör det här för att vi vill det och för att vi kan det med ändringen i lagen, säger Liberalerna i Uppsalas ordförande och kommunalråd Eva Edwardsson. Vill nå nya personer Eva Edwardsson säger att valstugan får ha öppet till 18 medan alkoholtillståndet gäller först från 17, så det är endast den sista timmen alkohol kommer att vara tillgängligt.  Partiet hoppas kunna nå personer som inte annars hade kommit förbi Liberalernas valstuga.  – Vi vill lägga till möjligheten att diskutera politik över ett glas öl eller ett glas vin. Väcker kritik Liberalernas initiativ har väckt kritik. Jan-Ove Ragnarsson är vice förbundsordförande för nykterhetsorganisationen Movendi Sverige, samt aktiv socialdemokrat i Enköping, och en av dem som uttalat sig kritiskt. – Alkohol hör verkligen inte hemma i en valstuga, men också att man mer eller mindre utestänger eller i alla fall begränsar tillgängligheten för vissa människor, exempelvis människor med beroende. Jan-Ove Ragnarsson tycker att samhället behöver fler alkoholfria miljöer. – Om man vill ha seriösa samtal, tycker politik är viktigt och verkligen vill möta väljare öga mot öga – ska man över huvud taget tänka tanken att det ska vara alkohol i sådana sammanhang, säger Jan-Ove Ragnarsson. ”Känsligt kapitel” Eva Edwardsson har respekt för kritiken som kommit. Hon säger att alkoholism är ett allvarligt samhällsproblem och att hon förstår att alkoholpolitiken i Sverige är ett ”känsligt kapitel”.  – Men vi måste tänka på att det är alkohollagen som gäller. Det är viktigt att säga att människor har ett val att besöka vår valstuga de timmar vi serverar alkohol, och det är så otroligt liten omfattning så vi ser inte att det kommer påverka någons alkoholkonsumtion.  Eva Edwardsson menar att det måste vara tillåtet för politiska partier att tillhandahålla alkohol enligt samma regler som gäller i övrigt i samhället.  – Vi tycker ju att det var bra att man tog bort matkravet och vi vill belysa att man under ordnade former med respekt för alkohollagens alla regler kan anordna ett litet event där man kan erbjuda allmänheten alkohol.", "link": "https://www.tv4.se/artikel/5zngY3Zk4EkjOXUKfPVUaf/liberalerna-serverar-vin-i-valstugan-vill-na-nya-vaeljare", "date_display": "2026-07-17", "date_iso": "2026-07-17T15:10:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/politik", "/uppsala", "/valstugor", "/valet-2022/liberalerna", "/alkohol", "/valet-2026"]}, {"id": 152, "title": "Watch as the fireball falls from burning wind turbines", "summary": "During Friday, there was a fire in a wind turbine in Bjälbo, outside Mjölby.  It was a fire in the engine room, 50 meters up in the air. The emergency services were on the scene, but had to keep a safe distance from the wind turbine to avoid objects that could possibly fall to the ground.  - We keep a little distance and will make sure to put out any fires that may arise on the ground, said Jonas Penton, alarm and control officer at the rescue service in eastern Götaland, to TV4 Nyheterna during the morning.  At 11.49, the rescue service wrote that the rotor blades had released and fallen to the ground.  Filmed the fireball Kristin Henrysson lives 300 meters from the wind turbine and was outside hanging laundry when she smelled smoke. She looked around and saw that the smoke appeared to be coming from the back of the neighbor's engine room.  - I called him and then he said that there was a fire in the wind turbine, says Kristin Henrysson.  She walked up to the wind turbine and saw a piece fall to the ground. When she then started filming, something that looks like a fireball fell down the wind turbine.  - The nasty thing was when this big piece fell down and it started to burn on the hill, she says.  According to Kristin Henrysson, the fire brigade has now left the scene.", "title_original": "Se när eldklotet faller från brinnande vindkraftverk", "summary_original": "Under fredagen har det brunnit i ett vindkraftverk i Bjälbo, utanför Mjölby.  Det rörde sig om en brand i maskinrummet, 50 meter upp i luften. Räddningstjänsten var på plats, men var tvungna att hålla ett säkerhetsavstånd till vindkraftverket för att undvika föremål som eventuellt skulle kunna falla till marken.  – Vi håller lite avstånd och kommer att se till att släcka ner bränder som eventuellt uppkommer på marken, sade Jonas Penton, larm- och ledningsbefäl på räddningstjänsten i östra Götaland, till TV4 Nyheterna under förmiddagen.  Vid 11.49 skrev räddningstjänsten att rotorbladen släppt och fallit till marken.  Filmade eldklotet Kristin Henrysson bor 300 meter från vindkraftverket och var ute och hängde tvätt när hon kände att det luktade rök. Hon kollade runt och såg att röken verkade komma från baksidan av grannens maskinhall.  – Jag ringde honom och då sade han att det brann i vindkraftverket, säger Kristin Henrysson.  Hon gick upp mot vindkraftverket och såg en bit falla ner mot marken. När hon sedan började filma föll något som ser ut som ett eldklot ner för vindkraftverket.  – Det otäcka var ju när den här stora biten ramlade ner och det började brinna på backen, säger hon.  Enligt Kristin Henrysson har brandkåren nu lämnat platsen.", "link": "https://www.tv4.se/artikel/2SOo5QHPYlMFtD3jlGyAGz/brinnande-vindkraftverk-kristin-sag-eldklotet-falla", "date_display": "2026-07-17", "date_iso": "2026-07-17T13:10:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brand", "/vindkraftverk", "/mjolby"]}, {"id": 153, "title": "One death after shooting in Aalborg", "summary": "It was a \"busy afternoon\", says police officer Claus Danø, according to BT, referring to the police press conference during the evening. This after a suspected perpetrator is said to have fired shots with a rifle at both civilians and police officers in northern Ålborg.\n\nA civilian was shot dead and found after the police firefight with the perpetrator. According to the police, the person was not hit by the police's shots. Perpetrator seriously injured The alarm came at 1:42 p.m. about a fire in a building in the Virkelyst industrial area. Shortly afterwards, the police received information that people had been shot at. When patrols arrived at the scene, the police were also fired upon, according to Danø. - During the shooting, the suspect is hit by police shots and seriously injured, he says at the press conference. In addition to the killed civilian and the gunshot-wounded perpetrator, a police officer has also been shot. According to Danø, the police officer was hit in the leg and is seriously injured. Both the suspected shooter and the police have been taken to hospital. No motive The police currently have no motive for the shooting and consider the incident to be isolated. It is still unclear if there is any connection between the deceased and the suspected perpetrator. - This has been a violent episode for the citizens. If you know anything about this incident, we would like to hear from you, says Danø. Police are expected to work at the scene throughout the night. Images from the area show police with reinforcement weapons, and Ekstra Bladet has published images where a black column of smoke rises from Virkelyst.", "title_original": "En död efter skottlossning i Ålborg", "summary_original": "Det var en ”hektisk eftermiddag”, säger polisen Claus Danø, enligt BT, med hänvisning till polisens presskonferens under kvällen. Det efter att en misstänkt gärningsman ska ha avlossat skott med ett gevär mot både civila och poliser i norra Ålborg.\n\nEn civilperson sköts till döds och hittades efter polisens eldstrid med gärningsmannen. Personen ska enligt polisen inte ha träffats av polisens skott. Gärningsmannen allvarligt skadad Larmet kom klockan 13.42 om en brand i en byggnad i industriområdet Virkelyst. Kort därefter fick polisen uppgifter om att personer blev beskjutna. När patruller anlände till platsen besköts även poliserna, enligt Danø. – Under skottlossningen träffas den misstänkte av polisskott och skadas allvarligt, säger han vid presskonferensen. Utöver den dödade civilpersonen och den skottskadade gärningsmannen har även en polis skottskadats. Enligt Danø träffades polisen i benet och är allvarligt skadad. Både den misstänkte skytten och polisen har förts till sjukhus. Inget motiv Polisen har i nuläget inget motiv till skottlossningen och betraktar händelsen som isolerad. Det är fortfarande oklart om det finns någon koppling mellan den avlidne och den misstänkte gärningsmannen. – Det här har varit en våldsam episod för medborgarna. Om du vet något om den här händelsen vill vi gärna höra från dig, säger Danø. Polisen väntas arbeta på platsen under hela natten. På bilder från området syns poliser med förstärkningsvapen, och Ekstra Bladet har publicerat bilder där en svart rökpelare stiger från Virkelyst.", "link": "https://www.tv4.se/artikel/6t8r6tkrnYaGzi7ATMyuog/larm-om-pagaende-skjutning-i-alborg", "date_display": "2026-07-17", "date_iso": "2026-07-17T12:24:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/skottlossning", "/skjutning", "/danmark", "/polisinsats"]}, {"id": 154, "title": "Andy Burnham elected as new Labor leader", "summary": "Burnham opened the speech by paying tribute to his predecessor Keir Starmer, who he says has taken Labor from \"its worst defeat to its best victory\".\n\n- I am ready, ready to lead the party and build on the foundation that Keir Starmer has laid, says Andy Burnham according to the BBC. He says that Britain in the 1980s took a series of missteps when \"political power was centralized and economic power was privatized\". Specifically, he mentions that Britain gave up control over housing, energy and transport, driving up costs for ordinary Britons. Today's politicians must, according to Burnham, admit that they have failed to challenge a political culture and economic model that \"simply does not work well enough for ordinary people\".\n\n- Change begins with honesty, he says. The new Labor leader says he has not yet decided who will make up his government, but promises it will \"reflect the voices of the whole party\". Burnham says he loves every part of Britain and promises that the apparatus of power in the country will be decentralized. In his speech, which ended with a standing ovation from the assembled party members, he promised to \"bring back hope\" as Labour's new leader.\n\n- I believe in all of you and I am convinced that we can do it.", "title_original": "Andy Burnham vald till ny Labourledare", "summary_original": "Burnham inledde talet med att hylla sin föregångare Keir Starmer som enligt honom har gjort att Labour har gått från ”sitt värsta nederlag till sin bästa seger”.\n\n– Jag är redo, redo att leda partiet och bygga vidare på den grund som Keir Starmer har lagt, säger Andy Burnham enligt BBC. Han säger att Storbritannien på 1980-talet tog en rad felsteg då ”den politiska makten centraliserades och den ekonomiska makten privatiserades”. Specifikt nämner han att Storbritannien gav upp kontrollen över bostäder, energi och transporter, vilket drivit upp kostnaderna för vanliga britter. Dagens politiker måste, enligt Burnham, erkänna att de har misslyckats med att utmana en politisk kultur och ekonomisk modell som ”helt enkelt inte fungerar tillräckligt bra för vanligt folk”.\n\n– Förändring börjar med ärlighet, säger han. Den nye Labourledaren säger att han ännu inte har bestämt vilka som ska ingå i hans regering, men lovar att den kommer ”spegla röster från hela partiet”. Burnham säger sig älska varje del av Storbritannien och lovar att maktapparaten i landet ska decentraliseras. I sitt tal, som avslutas med stående ovationer från de samlade partimedlemmarna, lovar han att ”ta tillbaka hoppet” som Labours nya ledare.\n\n– Jag tror på er alla och jag är övertygad om att vi kan göra det.", "link": "https://www.tv4.se/artikel/tt-260717-storbritburnhamtal1-2f0414e3/andy-burnham-jag-ar-redo", "date_display": "2026-07-17", "date_iso": "2026-07-17T12:24:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["BBC", "/bbc", "/utrikes", "/storbritannien", "/keir-starmer"]}, {"id": 155, "title": "Snoop in the garden pond - ate the goldfish Lisa, 3.5", "summary": "Kalle Nilson in Tvååker outside Varberg had just woken up after a nap in the hammock when he saw one of his three goldfish, Lisa, lying on the ground next to the garden pond. - I had recently filled up with water and thought: \"Damn, has it jumped up on land?\", he tells TV4 Nyheterna. When he was about to throw her back into the water, he discovered that it was not at all what he first thought - in fact, it was a snake that had fished her up.  - \"What should I do now?\" But then I thought that the snake must also have food. So I put it down and let it continue, says Kalle Nilson. \"Sizable hull size\" However, he did not think that the snook would succeed in swallowing the whole large goldfish. - He must have put too much food in his mouth. The day after the incident, Mikael Nilson went to see if they were still there. - But then both the snake and the fish were gone. So it probably got a real hull finish. Turned 3.5 years Even though he chose not to let nature take its course, it still felt sad to lose Lisa. - Yes, she was three and a half years old. So it was tragic. But I must promise to go and buy a new goldfish, he says. - It had already driven its fangs into her head, so I don't think she would have made it anyway.", "title_original": "Snok i trädgårdsdammen – åt upp guldfisken Lisa, 3,5", "summary_original": "Kalle Nilson i Tvååker utanför Varberg hade precis vaknat efter en tupplur i hängmattan när han såg en av sina tre guldfiskar, Lisa, ligga på marken intill trädgårdsdammen. – Jag hade nyligen fyllt på vatten och tänkte: ”Fan, har den hoppat upp på land?”, säger han till TV4 Nyheterna. När han skulle kasta tillbaka henne i vattnet upptäckte han att det inte alls var som han först trott – i själva verket var det en snok som hade fiskat upp henne.  – ”Vad ska jag nu göra?” Men så tänkte jag att snoken måste ju också ha mat. Så jag la ner den och lät den fortsätta, säger Kalle Nilson. ”Rejält skrovmål” Att snoken skulle lyckas sluka hela den stora guldfisken trodde han dock inte. – Han har nog tagit sig för mycket mat i munnen. Dagen efter händelsen gick Mikael Nilson för att titta om de var kvar. – Men då var både snoken och fisken borta. Så den fick nog sig ett rejält skrovmål. Blev 3,5 år Även om han valde att inte lägga sig i naturens gång kändes det ändå tråkigt att förlora Lisa. – Ja, hon var tre och ett halvt år. Så det var tragiskt. Men jag får väl lova att åka och köpa en ny guldfisk, säger han. – Den hade ju redan kört in huggtänderna i huvudet på henne, så jag tror inte att hon hade klarat sig ändå.", "link": "https://www.tv4.se/artikel/1bbUPb91HXLqXiWujr5nPq/snok-i-traedgardsdammen-at-upp-guldfisken-lisa-3-5", "date_display": "2026-07-17", "date_iso": "2026-07-17T12:15:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/husdjur", "/tradgard", "/orm", "/fisk", "/inrikes"]}, {"id": 156, "title": "The actor couple fell in love in secret - \"were unhappily in love\"", "summary": "When \"Til death do us part\" premieres on TV4, it's not just the drama in the box that engages. The series follows Malin and Tobias, a seemingly happily married couple whose lives are turned upside down when Tobias is suspected of murder and Malin, who is a family lawyer, takes it upon herself to defend her husband. But love didn't just stop there for Filip Berg and Aliette Opheim. Secret romance behind the scenes Both Filip and Aliette say that they went and were unsure of each other's feelings for several weeks. The relationship was kept secret, not only from colleagues but also from themselves. - We kept it a secret from each other, you went around and were a little unsure of the other, says Aliette Opheim. - I went around and was unhappily in love for four or five weeks, interjects Filip Berg. In the end, they became a couple, but the details of how it happened are a bit fuzzy. - We have talked about it. I have no idea, I don't know what happened, says Filip Berg. Aliette Opheim agrees but thinks it may have been her who took the first step. Support and understanding in everyday life They see working together as both love partners and colleagues as an advantage. They believe that the understanding of each other's professional lives is great, and that they can support each other both on and off the set. - There is no routine in our lives. You have a greater understanding of that if you live together with someone who does the same thing, says Aliette Opheim. She also explains that you don't have to be embarrassed about recording your own test footage before auditions. - You stand in the living room like an astronaut all of a sudden. Or a Viking, says Filip Berg. Chaos, flea hunting and new dreams After the recording, everyday life has been anything but glamorous for the couple. They have lived in a car, slept on a sofa with Filip's mother and even got lice. But now they finally have their own apartment, even if they don't have a kitchen yet. - It is such a fraud that we are sitting here and are reasonably whole and clean. It is so far from the truth, says Aliette Opheim.", "title_original": "Skådespelarparet blev kära i hemlighet – ”var olyckligt kär”", "summary_original": "När ”Tills döden skiljer oss” har premiär på TV4 är det inte bara dramatiken i rutan som engagerar. Serien följer Malin och Tobias, ett till synes lyckligt gift par vars liv vänds upp och ner när Tobias blir misstänkt för mord och Malin, som är familjeadvokat, tar på sig att försvara sin make. Men kärleken stannade inte bara i rutan för Filip Berg och Aliette Opheim. Hemlig romans bakom kulisserna Både Filip och Aliette berättar att de gick och var osäkra på varandras känslor under flera veckor. Relationen hölls hemlig, inte bara för kollegorna utan också för dem själva. – Vi höll det ju hemligt för varandra, man gick runt och var lite osäker på den andra, säger Aliette Opheim. – Jag gick ju runt och var olyckligt kär i fyra-fem veckor, inflikar Filip Berg. Till slut blev de ett par, men detaljerna kring hur det gick till är lite luddiga. – Vi har pratat om det. Jag har ingen aning, jag vet inte vad som hände, säger Filip Berg. Aliette Opheim instämmer men tror att det kan ha varit hon som tog första steget. Stöd och förståelse i vardagen Att arbeta tillsammans som både kärlekspartner och kollegor ser de som en fördel. De menar att förståelsen för varandras yrkesliv är stor, och att de kan stötta varandra både på och utanför inspelningen. – Det finns ju ingen rutin i våra liv. Det har man större förståelse för om man lever tillsammans med någon som gör samma sak, säger Aliette Opheim. Hon förklarar även att man slipper skämmas över att spela in egna provfilmningar inför auditions. – Man står i vardagsrummet som en astronaut helt plötsligt. Eller en viking, säger Filip Berg. Kaos, lusjakt och nya drömmar Efter inspelningen har vardagen varit allt annat än glamourös för paret. De har bott i en bil, sovit på en soffa hos Filips mamma och till och med fått löss. Men nu har de äntligen fått en egen lägenhet, även om de inte har något kök än. – Det är ett sådant bedrägeri att vi sitter här och är hyfsat hela och rena. Det är så långt ifrån sanningen, säger Aliette Opheim. Trots kaoset ser de fram emot att skapa ett hem tillsammans. – Vi hoppas på ett socialt hem där det är mycket middagar, vänner och familj. Det är i alla fall målet, säger Filip Berg.", "link": "https://www.tv4.se/artikel/41CUcyBO5O2SK4wJZVNSiM/skadespelarparet-blev-kaera-i-hemlighet-var-olyckligt-kaer", "date_display": "2026-07-17", "date_iso": "2026-07-17T10:19:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/filip-berg", "/aliette-opheim", "/skadespelare", "/karlek", "/svensk-film"]}, {"id": 157, "title": "The police are investigating whether the \"Gaza sign\" minimized the Holocaust", "summary": "On-duty policeman reported suspicion of incitement against group of people after pro-Palestinian demonstration.", "title_original": "Polisen utreder om ”Gazaskylt” förminskade Förintelsen", "summary_original": "Tjänstgörande polisman anmälde misstanke om hets mot folkgrupp efter pro-palestinsk demonstration.", "link": "https://www.dagen.se/nyheter/polisen-utreder-om-gazaskylt-foerminskade-foerintelsen/10445108", "date_display": "2026-07-17", "date_iso": "2026-07-17T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Economist's tip: This is how you save the holiday fund", "summary": "For many, the summer means much-needed time off and time for fun, but also a risk that the holiday fund will quickly run out. Everyday economist Magnus Hjelmér believes that small expenses can be an expensive surprise when everyday life returns. - It's the smaller things that pull away, like when we're at the beach and buying ice cream, says Hjelmér. Planning important for the economy According to Magnus Hjelmér, it is common to want to treat yourself a little extra during the holidays, but that many forget to plan for the increased expenses. It is rarely the big costs, such as accommodation and travel, that cause it because most people have already saved for these. Instead, it is the small, spontaneous purchases – such as ice cream, coffee and entrance tickets – that can quickly become a heavy burden on the private economy. - It sticks out when it is not needed. It can be more expensive than you can imagine, says Hjelmér. He believes that many households rarely save for the summer, in the same way that there is often a lack of a Christmas budget. When the holidays do come, a buffer is therefore often missing and expenses can easily be higher than planned. Many hope that the holiday pay will cover the costs, but when the small purchases are added up, the total is often unexpectedly high. This is how much you can save. A typical day at the beach, in the park or in the forest, where a family of four buys food, drinks, ice cream and coffee on site, can cost around SEK 600-650. If the same family instead brings a packed lunch and coffee from home, the cost will be around SEK 230. - What happens if we are at the beach ten times? Then it is 4,000 bucks. It will be a lot of money, says Hjelmér. He points out that small price differences quickly grow into large amounts. An ice cream from the kiosk can cost SEK 20, while the same ice cream in a multipack from the store can cost SEK eight. Budget with the family To avoid running out of money before the holiday is over, Hjelmér advises making a simple budget and involving the family in the planning. He suggests that you decide the day's budget already before the excursion and", "title_original": "Ekonomens tips: Så räddar du semesterkassan", "summary_original": "Sommaren innebär för många välbehövlig ledighet och tid för nöjen, men också en risk för att semesterkassan snabbt tar slut. Vardagsekonom Magnus Hjelmér menar att småutgifter kan bli en dyr överraskning när vardagen återvänder. – Det är de mindre sakerna som drar iväg, som när vi är på stranden och köper glass, säger Hjelmér. Planering viktig för ekonomin Enligt Magnus Hjelmér är det vanligt att man vill unna sig lite extra under semestern, men att många glömmer bort att planera för de ökade utgifterna. Det är sällan de stora kostnaderna, som boende och resor, som ställer till det eftersom de flesta redan har sparat till dessa. I stället är det de små, spontana köpen – som glass, fika och inträden – som snabbt kan bli en tung belastning på privatekonomin. – Det sticker iväg när det inte behövs. Det kan bli dyrare än man kan tänka sig, säger Hjelmér. Han menar att många hushåll sällan sparar inför sommaren, på samma sätt som det ofta saknas en julbudget. När semestern väl kommer saknas därför ofta en buffert och utgifterna kan lätt bli högre än planerat. Många hoppas att semesterlönen ska täcka kostnaderna, men när småköpen läggs ihop blir slutsumman ofta oväntat hög. Så mycket kan du spara En vanlig dag på stranden, i parken eller i skogen, där en familj på fyra personer köper mat, dryck, glass och kaffe på plats, kan kosta omkring 600–650 kronor. Om samma familj istället tar med sig matsäck och fika hemifrån landar kostnaden på cirka 230 kronor. – Vad händer om vi är på stranden tio gånger? Då är det 4 000 spänn. Det blir ju jättemycket pengar, säger Hjelmér. Han påpekar att små prisskillnader snabbt växer till stora belopp. En glass från kiosken kan kosta 20 kronor, medan samma glass i flerpack från butiken kan kosta åtta kronor. Budgetera med familjen För att undvika att pengarna tar slut innan semestern är över tipsar Hjelmér om att göra en enkel budget och involvera familjen i planeringen. Han föreslår att man bestämmer dagens budget redan innan utflykten och diskuterar med barnen vad pengarna ska räcka till. På så sätt lär sig barnen också att prioritera mellan olika nöjen. – Gör vi budgeten med barnen innan, då får man välja. Vill jag ha en glass eller chokladhjulet? Då får de lära sig att planera, säger vardagsekonomen. Tips för sommarkassan Hjelmér tipsar även om att frysa vattenflaskor dagen innan, och att en termos kan fungera lika bra till varmkorv som till glass. – Glass i termos går hur bra som helst och håller sig lätt fram till lunch. Han påminner även om att det kan löna sig att låna utrustning av varandra i stället för att köpa nytt. Samtidigt höjer han ett varningens finger: – Du vill ju inte vara kvarterets Ove, om du förstår vad jag menar. Men då får man också vara beredd att öppna sitt eget förråd, säger Hjelmér och syftar på den snåle grannen Ove Sundberg i tv-serien Solsidan.", "link": "https://www.tv4.se/artikel/KLnapkghQLebHCKpArGgq/ekonomens-tips-sa-raeddar-du-semesterkassan", "date_display": "2026-07-17", "date_iso": "2026-07-17T08:39:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/semester", "/privatekonomi", "/sommar", "/resor"]}, {"id": 159, "title": "Debate about the church is left-wing after the archbishop's summer talk", "summary": "Researcher Per Ewert: \"The Swedish church's criticism of the government always comes from the left.\"", "title_original": "Debatt om kyrkan är vänstervriden efter ärkebiskopens sommarprat", "summary_original": "Forskaren Per Ewert: ”Svenska kyrkans kritik mot regeringen sker alltid från vänster.”", "link": "https://www.dagen.se/nyheter/debatt-om-kyrkan-aer-vaenstervriden-efter-aerkebiskopens-sommarprat/10443417", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 160, "title": "High pressure for Christian camping", "summary": "Record summer and thumbs up • Benefit from sun, events - and \"warmer tourism\".", "title_original": "Högtryck för kristna campingar", "summary_original": "Rekordsommar och tumme upp • Gynnas av sol, event – och ”värmerturism”.", "link": "https://www.dagen.se/nyheter/hoegtryck-foer-kristna-campingar/10442860", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 161, "title": "Julia Forsberg:\nDo not stay where God meets you, but walk on with him", "summary": "How many times haven't we missed the point when we experienced God's appeal in our lives and instead of passing it on stayed behind?", "title_original": "Julia Forsberg:\nStanna inte kvar där Gud möter dig, utan vandra vidare med honom", "summary_original": "Hur många gånger har vi inte missat poängen när vi erfarit Guds tilltal i våra liv och i stället för att ge det vidare stannat kvar?", "link": "https://www.dagen.se/livsstil/julia-forsberg-stanna-inte-kvar-daer-gud-moeter-dig-utan-vandra-vidare-med-honom/10420763", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 162, "title": "Sweden must act for lasting peace in the Congo", "summary": "Now we see a need for Sweden to act to help the population of the Democratic Republic of the Congo (DRC), write representatives of the Peace Network in the Congo.", "title_original": "Sverige måste agera för varaktig fred i Kongo", "summary_original": "Nu ser vi ett behov av att Sverige agerar för att hjälpa befolkningen i Demokratiska Republiken Kongo (DRK), skriver representanter för Nätverket fred i Kongo.", "link": "https://www.dagen.se/debatt/sverige-maste-agera-foer-varaktig-fred-i-kongo/10440083", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 163, "title": "The armed forces cannot employ priests", "summary": "Öyvind Tholvsen: The churches and the Armed Forces must review their relations.", "title_original": "Försvarsmakten kan inte anställa präster", "summary_original": "Öyvind Tholvsen: Kyrkorna och Försvarsmakten måste se över sina relationer.", "link": "https://www.dagen.se/ledare/foersvarsmakten-kan-inte-anstaella-praester/10443401", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 164, "title": "Foster children start to count as family members in Madrid", "summary": "May become law throughout Spain • Interpreted as a contribution to the abortion debate.", "title_original": "Foster börjar räknas som familjemedlemmar i Madrid", "summary_original": "Kan bli lag i hela Spanien • Tolkas som inlägg i abortdebatten.", "link": "https://www.dagen.se/nyheter/foster-boerjar-raeknas-som-familjemedlemmar-i-madrid/10439169", "date_display": "2026-07-17", "date_iso": "2026-07-17T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 165, "title": "The call to Swedes: Be vigilant about fake banknotes", "summary": "Sweden's banknotes and coins are issued by the Riksbank. Statistics show that the number of counterfeit banknotes detected has varied in recent years. After the peak in 2020, the number has decreased, but fakes are still detected every year. \nThe organization Swedish Trade receives about a handful of reports a week via its security center.\n\n- Few people use cash. It is difficult to get an idea of ​​how many are counterfeit. But for us, the notifications we receive, we still receive a handful every week, says Nina Jelver, head of security at Swedish Trade. At the same time, the Riksbank emphasizes that the Swedish banknotes have strong protection against counterfeiting.\n\n- Our notes are extremely secure. They are practically impossible to copy. But you can make them very similar to a real banknote, says Riksbank Governor Erik Thedéen. According to Swedish Trade, the reduced use of cash has meant that fewer people recognize a genuine banknote. It is exploited by fraudsters, who often try to exchange a fake 500 note for smaller denominations or buy a cheap item to get genuine change back. The problem increases during the summer, when there are many summer workers with less experience in recognizing counterfeit notes manning the tills.\n\nThe most common sign of a counterfeit 500 note is that it is missing one of the note's security features. When the banknote is angled, the symbol should change from a crown to the letters \"KR\". It is an effect that is often missing on the copies.\n\nAnyone who discovers a counterfeit note should, if possible, keep it and file a police report. The note must be saved because the police may need to confiscate it.\n\nAt the same time, the governor of the Riksbank believes that the security of the Swedish banknotes stands up well internationally.\n\n- Very, very good. But we have the absolute highest standard you can have and of course we should have that, says Erik Thedéen.", "title_original": "Uppmaningen till svenskar: Var vaksam på falska sedlar", "summary_original": "Sveriges sedlar och mynt ges ut av Riksbanken. Statistik visar att antalet upptäckta falska sedlar varierat senaste åren. Efter toppen 2020 har antalet minskat, men förfalskningar upptäcks fortfarande varje år. \nOrganisationen Svensk Handel får in omkring en handfull anmälningar i veckan via sitt säkerhetscenter.\n\n– Det är få som använder kontanter. Det är svårt att få en uppfattning om hur många som är förfalskade. Men till oss, de anmälningar vi får så får vi ändå in en handfull varje vecka, säger Nina Jelver säkerhetschef på Svensk Handel. Samtidigt framhåller Riksbanken att de svenska sedlarna har ett starkt skydd mot förfalskning.\n\n– Våra sedlar är extremt säkra. De går i praktiken inte att kopiera. Men man kan göra dem väldigt lika en riktig sedel, säger riksbankschef Erik Thedéen. Enligt Svensk Handel har den minskade kontantanvändningen gjort att färre känner igen en äkta sedel. Det utnyttjas av bedragare, som ofta försöker växla en falsk 500-lapp till mindre valörer eller handla en billig vara för att få äkta växel tillbaka. Problemet ökar under sommaren när det är många sommarjobbare med mindre erfarenhet av att känna igen falska sedlar som bemannar kassorna.\n\nDet vanligaste kännetecknet på en förfalskad 500-lapp är att den saknar en av sedelns säkerhetsdetaljer. När sedeln vinklas ska symbolen skifta från en krona till bokstäverna \"KR\". Det är en effekt som ofta saknas på kopiorna.\n\nDen som upptäcker en falsk sedel bör, om det är möjligt, behålla den och göra en polisanmälan. Sedeln ska sparas eftersom polisen kan behöva ta den i beslag.\n\nRiksbankschefen anser samtidigt att de svenska sedlarnas säkerhet står sig väl internationellt.\n\n– Väldigt, väldigt bra. Men vi har den absolut högsta standarden man kan ha och det ska vi ha förstås, säger Erik Thedéen.", "link": "https://www.tv4.se/artikel/2v7Y3V2J4A7arT0T8Zj9Vl/uppmaningen-till-svenskar-vara-vaksam-pa-falska-sedlar", "date_display": "2026-07-16", "date_iso": "2026-07-16T21:00:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Inrikes", "/inrikes", "/brott", "/riksbanken", "/brott-och-straff", "/ekonomi"]}, {"id": 166, "title": "The victim of the Monaco bomb: Ukraine is behind", "summary": "It was on June 29 that a bomb exploded at a residential building in Monaco. Ukrainian oligarch Vadym Yermolayev, his wife and his 13-year-old son were injured. Now Yermolayev himself breaks the silence after the assassination attempt. \"There is no doubt\" \"Based on the evidence at our disposal, there is no doubt that officials from Ukraine's military intelligence service were directly involved,\" he writes in a statement that The Guardian has seen. The explosion, Yermolayev says, \"was powerful enough to destroy steel railings and destroy the stone steps outside our home. This was not a warning, but an attempt to kill me and my family. His wife has suffered \"catastrophic and permanent injuries,\" and his son has suffered burns, broken legs and other serious injuries, he says. His accusations come as Zelenskyi faces political problems at home after the unpopular decision to fire his defense minister, Mykhailo Fedorov. The suspected woman was murdered Immediately after the assassination attempt, the police called for a Ukrainian woman, Anastasiia Berezovska, who was found shot dead in Ukraine on July 7. Reut is an officer in the Ukrainian According to prosecutors, the men forced her into a car at gunpoint and killed her. One of Ukraine's richest men, Vadym Yermolayev, was identified as Ukraine's 39th richest man in 2020. At the time, the oligarch had a fortune of over 2.2 billion kroner, which he earned through wine and alcohol companies, which led to Ukrainian sanctions since Russia's full-scale invasion of Ukraine began.\n\nIn 2019, he renounced his Ukrainian citizenship and became a Cypriot citizen", "title_original": "Offret för Monacobomben: Ukraina ligger bakom", "summary_original": "Det var den 29 juni som en bomb exploderade vid ett bostadshus i Monaco. Den ukrainska oligarken Vadym Jermolajev, hans fru och hans 13-årige son skadades. Nu bryter Jermolajev själv tystnaden efter mordförsöket. ”Råder ingen tvekan” ”Baserat på bevisningen som står till vårt förfogande råder ingen tvekan om att tjänstemän fån Ukrainas militära underrättelsetjänst var direkt involverade”, skriver han i ett uttalande som The Guardian tagit del av. Explosionen, säger Jermolajev, ”var tillräckligt kraftfull för att förstöra stålräcken och förstöra stentrapporna utanför vårt hem. Det här var ingen varning, utan ett försök att döda mig och min familj. Hans fru har fått ”katastrofala och bestående skador”, och sonen har fått brännskador, brutna ben och andra allvarliga skador, säger han. Hans anklagelser kommer samtidigt som Zelenskyj har politiska problem på hemmaplan efter det impopulära beslutet att sparka sin försvarsminister Mychajlo Fedorov. Misstänkta bombkvinnan mördades Direkt efter mordförsöket efterlyste polisen en man med hatt som sågs på övervakningsbilder. Men sedan efterlyste Interpol en ukrainsk kvinna, Anastasiia Berezovska. De misstänkte att hon planterat bomben i entrén till Jermolajevs lägenhetshus ”klädd som en man”. Berezovska hittades ihjälskjuten i Ukraina den 7 juli. Två män har gripits för mordet på henne, Vladislav Reut och Oleksandr Zykovitj. Reut är officer i den ukrainska underrättelsetjänsten. Enligt åklagarna tvingade männen in henne i en bil under pistolhot, körde ut till ett skogsparti och dödade henne. En av Ukrainas rikaste Vadym Jermolajev pekades ut som Ukrainas 39:e rikaste år 2020. Då hade oligarken en förmögenhet på över 2,2 miljarder kronor – pengar som han tjänat via vin- och alkoholbolag. Hans företag bedrev dock verksamhet på den ockuperade Krimhalvön, vilket har lett till ukrainska sanktioner sedan Rysslands fullskaliga invasion av Ukraina började.\n\nÅr 2019 avsade han sig sitt ukrainska medborgarskap och blev cypriotisk medborgare av skatteskäl.", "link": "https://www.tv4.se/artikel/4zDvNTX3nwxmOckEcp8llY/offret-foer-monacobomben-ukraina-ligger-bakom", "date_display": "2026-07-16", "date_iso": "2026-07-16T20:58:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Utrikesnyheter", "/utrikes", "/ukraina", "/monaco"]}, {"id": 167, "title": "Sweden to contribute additional SEK 1.4 billion to World Bank operations in Ukraine", "summary": "The Government has today decided to provide SEK 1.4 billion in support to a new World Bank crisis facility that benefits Ukraine. This support enables new loans totalling approximately SEK 4.2 billion for the country’s reconstruction and recovery. The World Bank is a key actor for Ukraine’s reform efforts and economic resilience during Russia’s ongoing aggression. Sweden’s actions have been vital for the establishment of the new crisis facility.", "title_original": "Sweden to contribute additional SEK 1.4 billion to World Bank operations in Ukraine", "summary_original": "The Government has today decided to provide SEK 1.4 billion in support to a new World Bank crisis facility that benefits Ukraine. This support enables new loans totalling approximately SEK 4.2 billion for the country’s reconstruction and recovery. The World Bank is a key actor for Ukraine’s reform efforts and economic resilience during Russia’s ongoing aggression. Sweden’s actions have been vital for the establishment of the new crisis facility.", "link": "https://www.government.se/press-releases/2026/07/sweden-to-contribute-additional-sek-1.4-billion-to-world-bank-operations-in-ukraine", "date_display": "2026-07-16", "date_iso": "2026-07-16T08:30:09+00:00", "source": "Government.se", "ministry": "Ministry of Education and Research", "type": "Official Information", "age_tag": "3 days old", "tags": ["Press release", "International", "Ministry of Education and Research", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Lotta Edholm", "Benjamin Dousa"]}, {"id": 168, "title": "If the churches are silent, who will speak?", "summary": "Nationally, a clearer Christian societal voice is needed, writes Lars-Gunnar Sandberg.", "title_original": "Om kyrkorna tiger, vem ska då tala?", "summary_original": "Nationellt behövs en tydligare kristen samhällsröst, skriver Lars-Gunnar Sandberg.", "link": "https://www.dagen.se/debatt/om-kyrkorna-tiger-vem-ska-da-tala/10431344", "date_display": "2026-07-16", "date_iso": "2026-07-16T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 169, "title": "Emma Audas:\nIs it  ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
