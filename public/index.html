ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Is it God who said that he changed his mind on the marriage issue?", "summary": "A widespread EFK with a high ceiling and where individual parishes can completely run their own race in basic doctrinal matters, is such an EFK needed? writes Stefan Swärd in a reply.", "title_original": "Är det Gud som sagt att han ändrat sig i äktenskapsfrågan?", "summary_original": "Ett spretigt EFK med högt i tak och där enskilda församlingar helt kan köra sina egna race i grundläggande lärofrågor, behövs ett sådant EFK? skriver Stefan Swärd i en replik.", "link": "https://www.dagen.se/debatt/aer-det-gud-som-sagt-att-han-aendrat-sig-i-aektenskapsfragan/10333863", "date_display": "2026-05-12", "date_iso": "2026-05-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Islamist movement accused of crimes against humanity: \"I saw my sister murdered with an axe\"", "summary": "Christians the majority of the victims in the Amnesty survey of IS-loyal Islamist group.", "title_original": "Islamiströrelse anklagas för brott mot mänskligheten: ”Jag såg min syster mördas med en yxa”", "summary_original": "Kristna majoriteten av dödsoffren i Amnesty kartläggning av IS-trogen islamistgrupp.", "link": "https://www.dagen.se/nyheter/islamistroerelse-anklagas-foer-brott-mot-maenskligheten-jag-sag-min-syster-moerdas-med-en-yxa/10331929", "date_display": "2026-05-12", "date_iso": "2026-05-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Global Bible translation is moving forward – the entire Bible now in 795 languages", "summary": "But about 123 million people do not have access to any Bible text at all", "title_original": "Den globala bibelöversättningen går framåt – hela Bibeln nu på 795 språk", "summary_original": "Men omkring 123 miljoner människor har inte tillgång till någon bibeltext alls", "link": "https://www.dagen.se/nyheter/den-globala-bibeloeversaettningen-gar-framat-hela-bibeln-nu-pa-795-sprak/10338924", "date_display": "2026-05-12", "date_iso": "2026-05-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Fredrik Wenell:\nBeing born again is not a measurable process that the church can force", "summary": "Build relationships, show trust and stop trying to take control", "title_original": "Fredrik Wenell:\nAtt födas på nytt är ingen mätbar process som kyrkan kan tvinga fram", "summary_original": "Bygg relationer, visa tillit och sluta försöka ta kontrollen", "link": "https://www.dagen.se/kultur/fredrik-wenell-att-foedas-pa-nytt-aer-ingen-maetbar-process-som-kyrkan-kan-tvinga-fram/10325093", "date_display": "2026-05-12", "date_iso": "2026-05-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Sweden organises international youth forum on gender equality and democracy in Belarus", "summary": "On 11 May, the Ministry for Foreign Affairs, in cooperation with the Stockholm Centre for Eastern European Studies at the Swedish Institute of International Affairs, is organising a conference in Stockholm on youth and gender equality issues for a future democratic Belarus. The forum gathers youth representative of the Belarusian democratic movement and civil society representatives, decision-makers and experts from the EU and Sweden. The aim is to highlight the importance of young people’s political participation to the democratic development of Belarus.", "title_original": "Sweden organises international youth forum on gender equality and democracy in Belarus", "summary_original": "On 11 May, the Ministry for Foreign Affairs, in cooperation with the Stockholm Centre for Eastern European Studies at the Swedish Institute of International Affairs, is organising a conference in Stockholm on youth and gender equality issues for a future democratic Belarus. The forum gathers youth representative of the Belarusian democratic movement and civil society representatives, decision-makers and experts from the EU and Sweden. The aim is to highlight the importance of young people’s political participation to the democratic development of Belarus.", "link": "https://www.government.se/press-releases/2026/05/sweden-organises-international-youth-forum-on-gender-equality-and-democracy-in-belarus/", "date_display": "2026-05-11", "date_iso": "2026-05-11T15:30:49+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "EU", "International", "Ministry for Foreign Affairs", "International development cooperation", "Democracy and human rights", "Foreign and security policy", "Jessica Rosencrantz", "Benjamin Dousa"]}, {"id": 160, "title": "Government moves forward with assignment on international power cables", "summary": "The Government is now moving forward with an assignment for Svenska kraftnät, Sweden’s power grid authority, that allows for a planned renewal and upgrade of an electricity cable connection to Denmark to be put on hold. At the EU’s meeting of Energy Ministers in March, Swedish Minister for Energy, Business and Industry Ebba Busch announced that Sweden would halt new or upgraded electricity cable connections to continental Europe unless there was a shift in the focus of the legislation being negotiated in the European Commission’s European Grids Package.", "title_original": "Government moves forward with assignment on international power cables", "summary_original": "The Government is now moving forward with an assignment for Svenska kraftnät, Sweden’s power grid authority, that allows for a planned renewal and upgrade of an electricity cable connection to Denmark to be put   const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
