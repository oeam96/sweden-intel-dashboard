: "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Great pressure on the Equmenia church's vision conference - had to rent extra premises", "summary": "Great curiosity as the community developed a new concept for the annual conference", "title_original": "Stort tryck på Equmeniakyrkans visionskonferens – fick hyra in sig i extra lokaler", "summary_original": "Stor nyfikenhet då samfundet tagit fram nytt koncept till årlig konferens", "link": "https://www.dagen.se/nyheter/stort-tryck-pa-equmeniakyrkans-visionskonferens-fick-hyra-in-sig-i-extra-lokaler/10372581", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Protesters attacked police in Southampton", "summary": "An 18-year-old was stabbed so seriously that he died. The police had then chosen to arrest the teenager without helping him. After a recording of the incident was released, a protest in Southampton degenerated, with some protesters attacking police.", "title_original": "Demonstranter attackerade polis i Southampton", "summary_original": "En 18-åring knivhöggs så allvarligt att han avled. Polisen hade då valt att gripa tonåringen utan att hjälpa honom. Efter att en inspelning av händelsen släppts urartade en protest i Southampton, där vissa demonstranter angrep polisen.", "link": "https://www.dn.se/varlden/demonstranter-attackerade-polis-i-southampton/", "date_display": "2026-06-02", "date_iso": "2026-06-02T21:44:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "This is how the US has acted militarily in the world since Trump was re-elected", "summary": "Since President Donald Trump returned to the White House in 2025, the United States has been involved in numerous military operations around the world. Here's a rundown of the biggest raids and operations in Trump's second term.", "title_original": "Så har USA agerat militärt i världen sedan Trump blev omvald", "summary_original": "Sedan president Donald Trump återvände till Vita huset 2025 har USA varit involverad i flertalet militära insatser runt om i världen. Här är en sammanställning av de största angreppen och operationerna under Trumps andra mandatperiod.", "link": "https://www.dn.se/varlden/sa-har-usa-agerat-militart-i-varlden-sedan-trump-blev-omvald/", "date_display": "2026-06-02", "date_iso": "2026-06-02T21:27:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Bill Pulte Hunted Trump's Enemies - Becomes Director of Intelligence", "summary": "Bill Pulte becomes acting head of the US intelligence service, despite his lack of experience in the field. He was appointed by US President Donald Trump on Tuesday and has previously devoted himself to pursuing investigations against Trump's political opponents.", "title_original": "Bill Pulte jagade fiender åt Trump – blir chef för underrättelsetjänsten", "summary_original": "Bill Pulte blir tillförordad chef för den amerikanska underrättelsetjänsten, trots att han saknar erfarenhet på området. Han utsågs av USA:s president Donald Trump på tisdagen och har tidigare ägnat sig åt att driva utredningar mot Trumps politiska motståndare.", "link": "https://www.dn.se/varlden/bill-pulte-jagade-fiender-at-trump-blir-chef-for-underrattelsetjansten/", "date_display": "2026-06-02", "date_iso": "2026-06-02T21:22:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Very troubling – for the party that wants to see tougher action", "summary": "", "title_original": "Mycket besvärande – för partiet som vill se hårdare tag", "summary_original": "", "link": "https://www.tv4.se/artikel/IIc1mYYOi4Goft8zOK9vd/mycket-besvaerande-foer-partiet-som-vill-se-hardare-tag", "date_display": "2026-06-02", "date_iso": "2026-06-02T19:30:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 138, "title": "Here the participants are evacuated - tropical storm on the way", "summary": "Every competition during the final week of \"Robinson\" is about winning or losing, and the pressure is therefore constant. The weather does not want to be worse - and does its best to make it difficult for the participants. In Tuesday's episode, they are forced to leave their home base due to a tropical storm. - There is a real storm heading our way and therefore you will be evacuated to a safer shore, says program leader Anders Lundin. - It's always hard to move, but I've tried to arrange it so that it's a little more pleasant when you come anyway. \"Very unsafe\" According to participant Caroline Järgren, they are, to say the least, unhappy, wet and distressed. - It feels very unsafe and sad to have to be evacuated in a finals week, says Iki Gonzalez Magnusson. Once on the new beach, a taco buffet awaits to heal the wounds - something that makes the participants overjoyed. - That is not true. Damn that's good, says Jonas Källqvist. - It tastes like God. It tastes divine, says Caroline Järgren. Sonja Rudqvist can hardly believe her eyes. - This is a dish you can just push into yourself, push, push and push until you feel absolutely awful, says Amadeus Harrysson. The tacos only temporary joy Despite the tacos, the night in the new camp turns out to be terrible and the recharge for the next tough competition suffers. - The stalks were as painful as anything to sleep on. You are completely destroyed. You've slept for half a minute, says Amadeus Harrysson. - It really rained, damn it. I probably managed 40 seconds anyway, says Sonja Rudqvist. Amadeus Harrysson tells us that everyone is feeling pretty bad and that the weather took a toll. - We couldn't sleep properly. Everyone is tired, the clothes are wet. Right now nothing is good. Right now I want to go back home. And by that I don't mean home to Sweden, but home to our beach, he says. - It is noticeable that people are tired. It's a pile of worn out souls wandering around feeling like they don't know what they're doing. Especially now that we are evacuated. Then it becomes extra strange, says Sonja Ru", "title_original": "Här evakueras deltagarna – tropisk storm på väg", "summary_original": "Varje tävling under finalveckan i ”Robinson” handlar om att vinna eller försvinna, och pressen är därför konstant. Vädret vill inte vara sämre – och gör sitt bästa för att försvåra för deltagarna. I tisdagens avsnitt tvingas de lämna sin hemmabas på grund av en tropisk storm. – Det är en ordentlig storm på väg åt vårt håll och därför kommer ni att evakueras till en säkrare strand, säger programledare Anders Lundin. – Det är alltid jobbigt att flytta, men jag har försökt ordna så att det är lite trivsammare när ni kommer det i alla fall. ”Väldigt otryggt” Enligt deltagaren Caroline Järgren är de minst sagt oglada, blöta och bedrövade. – Det känns väldigt otryggt och tråkigt att behöva bli evakuerad i en finalvecka, säger Iki Gonzalez Magnusson. Väl på den nya stranden väntar en tacobuffé som plåster på såren – något som gör deltagarna överlyckliga. – Det är inte sant. Fy fan vad gott, säger Jonas Källqvist. – Det smakar som gud. Det smakar gudomligt, säger Caroline Järgren. Sonja Rudqvist tror knappt sina ögon. – Det här är en maträtt man bara kan trycka i sig, trycka, trycka och trycka tills man mår helt uruselt, säger Amadeus Harrysson. Tacosen bara tillfällig glädje Trots tacosen blir natten i det nya lägret hemsk och uppladdningen inför nästa tuffa tävling blir lidande. – Stjälkarna gjorde hur ont som helst att sova på. Man är helt förstörd. Man har sovit en halv minut, säger Amadeus Harrysson. – Det regnade ju verkligen satan. Jag fick nog ihop en 40 sekunder i alla fall, säger Sonja Rudqvist. Amadeus Harrysson berättar att alla mår rätt dåligt och att vädret tog hårt. – Vi kunde inte sova ordentligt. Alla är trötta, kläderna är blöta. Just nu är inget bra. Just nu vill jag tillbaka hem. Och då menar jag inte hem till Sverige, utan hem till vår strand, säger han. – Det märks att folk är slitna. Det är en hög slitna själar som vandrar runt och känner att de inte vet vad de håller på med. Särskilt nu när vi är evakuerade. Då blir det extra konstigt, säger Sonja Rudqvist.", "link": "https://www.tv4.se/artikel/7FzSxZp94pIHEoqrozAXMn/haer-evakueras-deltagarna-tropisk-storm-pa-vaeg", "date_display": "2026-06-02", "date_iso": "2026-06-02T17:57:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 139, "title": "The warning: Children can be taken out of Sweden - during the summer holidays", "summary": "After longer holidays, it is often at school that the first warning signs appear. At the same time, there can be several explanations for a student not showing up at the start of the semester, from misunderstandings about school obligations to the fact that the family has moved. Jurgita Ravaityte Kristoffersson, coordinator against honor oppression in the city of Västerås, says that the municipality has developed routines to map which students are missing and why.\n\n- Last year, after the summer holidays, there were 51 children who were missing, says Ravaityte Kristoffersson. She says that the municipality calls guardians, contacts families and in some cases makes home visits. If it is seen that the child may have lived in an honorable context, or if there was suspicion of this, the social service is contacted.\n\n- We made 29 reports of concern, says Ravaityte Kristoffersson. \"Very big dark story\" The dark story connected to honor-related violence and oppression is large according to the police.\n\n- It is a very large dark figure. If we talk about a context of honor, it is an environment where children and young people are socialized into not talking to outsiders about what happens in the family, says Jenny Edin, commissioner at the police's national operational department, Noa. Jenny Edin says that the Equality Authority previously had the task of mapping the scope, but that today it cannot be done at a national level. She says that a proposal has been made for a national reporting system, to get a clearer picture and to be able to prevent more abductions. New tools in investigations Recently, the Riksdag voted through tougher penalties for forced marriage. Police and prosecutors must also be given the opportunity to use covert means of coercion in investigations into child marriage crimes and forced marriages.\n\n- This will be incredibly important in these investigations, says Edin. According to the Ministry of Foreign Affairs, 86 people, including 57 children, were taken out of Sweden in 2025. At the same time, it is not always known to what extent the abductions take place in an honorable context.", "title_original": "Varningen: Barn kan föras ut ur Sverige – under sommarlovet", "summary_original": "Efter längre lov är det ofta i skolan som de första varningstecknen syns. Samtidigt kan det finnas flera förklaringar till att en elev inte dyker upp vid terminsstart, från missförstånd om skolplikt till att familjen flyttat. Jurgita Ravaityte Kristoffersson, samordnare mot hedersförtryck i Västerås stad, säger att kommunen har utvecklat rutiner för att kartlägga vilka elever som saknas och varför.\n\n– Förra året, efter sommarlovet, var det 51 barn som saknades, säger Ravaityte Kristoffersson. Hon berättar att kommunen ringer vårdnadshavare, kontaktar familjer och i vissa fall gör hembesök. Om man ser att barnet kan ha levt i en hederskontext, eller om det funnits misstanke om det, kontaktas socialtjänsten.\n\n– Vi gjort 29 orosanmälningar, säger Ravaityte Kristoffersson. ”Väldigt stort mörkertal” Mörkertalet kopplat till hedersrelaterat våld och förtryck är stort enligt polisen.\n\n– Det är ett väldigt stort mörkertal. Om vi pratar om en hederskontext så är det en miljö där barn och unga socialiseras in i att inte prata med utomstående om det som sker i familjen, säger Jenny Edin, kommissarie vid polisens nationella operativa avdelning, Noa. Jenny Edin säger att Jämställdhetsmyndigheten tidigare haft i uppdrag att kartlägga omfattningen, men att det i dag inte går att göra på nationell nivå. Hon berättar att ett förslag har lagts om ett nationellt inrapporteringssystem, för att få en tydligare bild och kunna förebygga fler bortföranden. Nya verktyg i utredningar Nyligen röstade riksdagen igenom hårdare straff för tvångsäktenskap. Polis och åklagare ska också få möjlighet att använda hemliga tvångsmedel i utredningar om barnäktenskapsbrott och äktenskapstvång.\n\n– Det här kommer att bli otroligt viktigt i de här utredningarna, säger Edin. Enligt UD fördes 86 personer, varav 57 barn, ut ur Sverige under 2025. Samtidigt är det inte alltid känt i hur stor utsträckning bortföranden sker i en hederskontext.", "link": "https://www.tv4.se/artikel/1SfBJhlpfwcUBMmbbpJY2l/barn-foersvinner-efter-sommarlovet", "date_display": "2026-06-02", "date_iso": "2026-06-02T17:12:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/brott-och-straff", "/polisen", "/tvangsaktenskap", "/konsstympning"]}, {"id": 140, "title": "The popular squeeze toy is suspected of containing poison", "summary": "Social media expert Daniel Paris explains that the phenomenon is based on so-called \"sensory branding\", where products are designed to appeal to several senses at the same time.  Concerns about the content At the same time, the products have come into focus following reports that some variants may contain harmful substances. Daniel Paris believes that the issue becomes especially important because the target group is often children. - Children play with them, touch them and can put them in their mouths. If it turns out that they contain toxins that are actually harmful, that is a completely different discussion, he says. He believes that both manufacturers and retailers have a responsibility to ensure that the products are safe. AI creates the feeling of a megatrend According to Daniel Paris, the trend is also driven by aggressive marketing where AI-generated content has become increasingly common. - Sometimes they are real children, sometimes not. Very often in clips that are perceived as genuine, it is actually AI we see, he says. He believes that it can be difficult to determine how big a trend really is when feeds are filled with similar content. - You can create a virality by almost spamming the internet. \"The flow is not there\" Daniel Paris says that he himself has seen marketing agreements where influencers are asked to describe products as viral and talked about, even when they are not. - It says in the agreement that you must say that the product is viral, that it is appreciated by celebrities and that it is everywhere. Although it is not, he says. He believes that much of what is perceived as spontaneous trends is in fact the result of paid campaigns. - The flow does not exist. Everything is just edited and paid for, almost. May be gone in a few weeks Microtrends often grow quickly, but disappear just as quickly. Despite that, many stores want to be the first to get the popular products in. - Everyone wants to be part of it, and the trade is almost fighting over who will buy them in first, says Daniel Paris. His advice to those who are thinking of getting on the trend is simple: - There's no point in seeing it as an inv", "title_original": "Populära klämleksaken misstänks innehålla gift", "summary_original": "Sociala medier-experten Daniel Paris berättar att fenomenet bygger på så kallad \"sensory branding\", där produkter utformas för att tilltala flera sinnen samtidigt.  Oro för innehållet Samtidigt har produkterna hamnat i fokus efter rapporter om att vissa varianter kan innehålla skadliga ämnen. Daniel Paris menar att frågan blir extra viktig eftersom målgruppen ofta är barn. – Barn leker med dem, tar på dem och kan stoppa dem i munnen. Om det visar sig att de innehåller gifter som faktiskt är skadliga så är det en helt annan diskussion, säger han. Han anser att både tillverkare och återförsäljare har ett ansvar att säkerställa att produkterna är säkra. AI skapar känslan av en megatrend Enligt Daniel Paris drivs trenden också av en aggressiv marknadsföring där AI-genererat innehåll blivit allt vanligare. – Ibland är det riktiga barn, ibland inte. Väldigt ofta i klipp som upplevs som äkta är det faktiskt AI vi ser, säger han. Han menar att det kan vara svårt att avgöra hur stor en trend egentligen är när flöden fylls av liknande innehåll. – Man kan skapa en viralitet genom att nästan spamma internet. \"Flödet finns inte\" Daniel Paris berättar att han själv sett marknadsföringsavtal där influencers uppmanas att beskriva produkter som virala och omtalade, även när de inte är det. – Det står i avtalet att du ska säga att produkten är viral, att den uppskattas av kändisar och att den är överallt. Fast den inte är det, säger han. Han menar att mycket av det som uppfattas som spontana trender i själva verket är resultatet av betalda kampanjer. – Flödet finns inte. Allt är bara redigerat och betalt, nästan. Kan vara borta om några veckor Mikrotrender växer ofta snabbt, men försvinner lika fort. Trots det vill många butiker vara först med att få in de populära produkterna. – Alla vill vara en del av det, och handeln nästan slåss om vem som ska köpa in dem först, säger Daniel Paris. Hans råd till den som funderar på att haka på trenden är enkelt: – Ingen idé att se det som en investering för framtiden. Det blir stendött om några veckor. Ja, om några dagar. Skit i det här.", "link": "https://www.tv4.se/artikel/3wHv50iTCFHmu1KsrnE4Ak/virala-klaemleksaken-misstaenks-innehalla-gift", "date_display": "2026-06-02", "date_iso": "2026-06-02T16:32:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/virala-trender", "/trender", "/barn", "/sociala-medier", "/ai", "/hajper"]}, {"id": 141, "title": "Russian attacks more difficult to stop: \"It's a matter of seconds\"", "summary": "On the night of Tuesday, Russia attacked Ukraine with over 600 drones and a dozen or so robots. At least 18 people have died, six in Kiev and 18 in Dnipro, according to Ukrainian authorities. Over a hundred are injured. Kyiv mayor Vitaly Klytchko describes it as a \"massive enemy attack\". In the Kyiv district of Podil, a multi-storey apartment building has partially collapsed after a Russian attack. It is still believed that people can be buried in the racial masses. Four possible reasons Former lieutenant colonel Jörgen Elfving sees four reasons why Russia is carrying out these attacks. - First, to break Ukrainian resistance. Secondly, to compensate for lack of success at the front line, he says in TV4 Nyhetsdagen. The third reason could be to avenge the Ukrainian drone attack on a boarding school on May 22, says Elfving. - The fourth reason could be to retaliate against the Ukrainian drone attacks from Rostov-na-Donu\n to the Crimea. Djupsjö: \"It's about seconds\" Roger Djupsjö, a teacher at the Norwegian Defense Academy, says that Ukraine has fairly effective methods of defending against cruise missiles and drones, but that the ballistic robots are more difficult - especially when hundreds of drones already overload the air defenses. - They are at incredibly high speeds. When they go up or are fired, the alarm is raised throughout Ukraine, because you don't know where they will go. It's about seconds from the launch to the robot hitting its target. It is really only the American system Patriot that is capable of stopping ballistic missiles, says Djupsjö, although the Franco-Italian system SAMP/T should also have that capacity. - But from the Ukrainian side only Patriot is mentioned, he says and continues: - The system can look deep into Russia, measure where the missile is heading and make sure to hit it. It is very sensitive. \"You manufacture and then you shoot\" The drone and robot attacks on cities are Russia's best method to try to get Ukraine to agree to its v", "title_original": "Ryska attacker mer svårstoppade: ”Det handlar om sekunder”", "summary_original": "Ryssland har natten mot tisdag attackerat Ukraina med över 600 drönare och ett dussintal robotar. Minst 18 personer har dött, sex i Kiev och 18 i Dnipro, enligt ukrainska myndigheter. Över hundra är skadade. Kievs borgmästare Vitalij Klytjko beskriver det som en ”massiv fiendeattack”. I Kievstadsdelen Podil har ett flera våningar högt lägenhetshus delvis kollapsat efter en rysk attack. Man tror fortfarande att folk kan ligga begravda i rasmassorna. Fyra möjliga skäl Före detta överstelöjtnant Jörgen Elfving ser fyra skäl till att Ryssland genomför de här attackerna. – För det första, att bryta ukrainsk motståndsvilja. För det andra, att kompensera för bristande framgångar vid frontlinjen, säger han i TV4 Nyhetsdagen. Den tredje anledningen kan vara att hämnas den ukrainska drönarattacken mot en internatskola den 22 maj, säger Elfving. – Det fjärde skälet skulle kunna vara att vedergälla de ukrainska drönarattackerna från Rostov-na-Donu\n till Krim. Djupsjö: ”Handlar om sekunder” Roger Djupsjö, lärare på Försvarshögskolan, säger att Ukraina har ganska effektiva metoder för att försvara mot kryssningsmissiler och drönare, men att de ballistiska robotarna är svårare – speciellt när hundratals drönare redan överbelastar luftvärnet. – De ligger på otroligt höga hastigheter. När de går upp eller avfyras blåser man larmet i hela Ukraina, för man vet inte var de ska ta vägen. Det handlar om sekunder från avfyrningen till att roboten träffar sitt mål. Det är egentligen bara det amerikanska systemet Patriot som klarar av att stoppa ballistiska missiler, säger Djupsjö, även om fransk-italienska systemet SAMP/T också ska ha den kapaciteten. – Men från ukrainsk sida nämns bara Patriot, säger han och fortsätter: – Systemet kan titta långt in i Ryssland, mäta var missilen är på väg och se till att träffa den. Det är väldigt finkänsligt. ”Man tillverkar och så skjuter man” Drönar- och robotattackerna mot städer är Rysslands bästa metod för att försöka få Ukraina att gå med på sina villkor nu när frontlinjen står still, säger Djupsjö. – Tittar man på den ryska tillverkningen är det ingen gammal ammunition nu. Man tillverkar och så skjuter man. Hade ryssarna kunnat hade de genomfört attacker varje natt, tror han. – Man väntar inte för att vara snäll – de har inte kapacitet att upprepa det fler gånger än man gör. De större robotarna kostar en hel del, då måste man utvärdera och analysera utfallet efter man skickat dem. Så länge kan Ryssland fortsätta Trots att anfallen kostar mycket pengar kommer de troligtvis att fortsätta, tror Djupsjö. – Tyvärr är sanktionerna mot Ryssland lite som en tesil, och så länge länder handlar med Ryssland så kommer de hålla på. Vi måste vara hårdare mot länderna man säljer via och se till att sanktionerna faktiskt hålls. För trots sanktioner och ett dyrt anfallskrig pekar inget mot att Ryssland skulle bli bankrutt inom den närmsta tiden, säger Roger Djupsjö. – Man kan inte jämföra med en västerländsk ekonomi. Säger Putin åt en fabrik att producera så gör den det. Man stödjer honom eller är man död. Och det systemet är på ett sätt mer hållbart än vårt – fram tills dagen det rasar totalt. – Det här är kampen just nu. Hur mycket lyckas Ryssland producera, och hur mycket lyckas vi producera tillsammans med Ukraina? Det är upp till bevis för väst.", "link": "https://www.tv4.se/artikel/1mxvrr6r5Om9iUmBezhOfF/ryska-attacker-alltmer-svarstoppade-det-handlar-om-sekunder", "date_display": "2026-06-02", "date_iso": "2026-06-02T16:25:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ukraina", "/ukraina", "/ukrainakonflikten", "/ryssland", "/utrikes", "/politik"]}, {"id": 142, "title": "Opening for Gripen F in the Swedish defense: \"Possibility in the future\"", "summary": "On Tuesday, the new Jas 39 Gripen F was premiered at Saab's premises in Linköping. The combat aircraft is a two-seater variant of the E-series and has been developed together with Brazil, which bought a total of 36 aircraft from Saab, eight of which are Gripen F. - We are very grateful that Brazil has borne the development costs together with Saab and that it is now an existing platform, says Minister of Defense På Jonson (M) to TV4 Nyheterna.  Delivering to Brazil Last fall, the first Gripen E was delivered to the Swedish Armed Forces. Now Pål Jonson is open to also the F-variant in the Swedish defence. - I know that the air force is looking at it, not least now with the opportunities created through Ukraine. It will be an opportunity for us in the future and an opportunity for Ukraine, says Pål Jonson. Already in 2014, Saab received a contract to deliver 36 Gripen planes to the Brazilian Air Force. Saab has also received orders from Thailand and Colombia for the Gripen F.", "title_original": "Öppnar för Gripen F i svenska försvaret: ”Möjlighet i framtiden”", "summary_original": "På tisdagen premiärvisades nya Jas 39 Gripen F i Saabs lokaler i Linköping. Stridsflygplanet är en tvåsitsig variant av E-serien och har utvecklats tillsammans med Brasilien som köp totalt 36 flygplan från Saab, varav åtta Gripen F. – Vi är jättetacksamma att Brasilien har tagit utvecklingskostnaderna tillsammans med Saab och att det nu är en befintlig plattform, säger försvarsminister På Jonson (M) till TV4 Nyheterna.  Levererar till Brasilien  I höstas levererades det första Gripen E till Försvarsmakten. Nu öppnar Pål Jonson för att även F-varianten i det svenska försvaret. – Jag vet att flygvapnet tittar på det, inte minst nu med de möjligheter som skapas genom Ukraina. Det kommer vara en möjlighet för oss i framtiden och en möjlighet för Ukraina, säger Pål Jonson. Redan 2014 fick Saab ett kontrakt för att leverera 36 Gripenplan till det brasilianska flygvapnet. Saab har även fått beställningar från Thailand och Colombia på Gripen F.", "link": "https://www.tv4.se/artikel/7EgMUKhMK7p6wp5AaK665/oeppnar-foer-gripen-f-i-svenska-foersvaret", "date_display": "2026-06-02", "date_iso": "2026-06-02T15:14:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/jas-gripen", "/forsvarsmakten"]}, {"id": 143, "title": "The royal family's support for Mette-Marit: \"Has private contact\"", "summary": "Crown Princess Victoria, Crown Prince Haakon of Norway and King Frederik of Denmark are close in age and have grown up together. According to author and royal house expert Roger Lundgren, Victoria has always seen the two of them as big brother candidates.\n\n- These three families hang out a lot in private. A lot of things that we don't see. They travel together, celebrate Easter and do a lot of things together, he tells TV4 Nyheterna. He believes that the relationship is partly based on close family ties, partly on the fact that they live similar, structured lives and that they simply like and can find security in each other. Against this background, according to Roger Lundgren, it is not surprising that Crown Princess Victoria is following the situation surrounding Crown Princess Mette-Marit's deteriorating health. - I think Victoria is there like any other friend. Talks, listens and tries to support her as much as she can, he says. Crown Princess Victoria follows the situation In an email to TV4 Nyheterna, the court's information director Margareta Thorgren writes that the news about the Norwegian crown princess's deteriorating health is really sad. \"Crown Princess Victoria follows the situation and they have private contact with each other,\" she writes. According to Roger Lundgren, Victoria is an expert in sending flowers with small, personal cards. - And with nice hand-drawn greetings and such. She has always been very good at that, he says. - She has enormous empathy for other people. \"Haft a tough spring\" According to the author and royal house expert, the monarchies live in symbiosis with each other and unrest in one royal house can affect others. - It is clear that this with the Norwegian royal house and with everything that has happened lately, and especially then... Mette-Marit has had a tough spring here, both with this Epstein stuff. But then there is the fact that she is very, very ill. And she has a son who will be sentenced in a couple of weeks here as well. So it's unlikely to alleviate the situation in any way. At the same time, he emphasizes that it is fundamentally about people", "title_original": "Kungafamiljens stöd till Mette-Marit: ”Har privat kontakt”", "summary_original": "Kronprinsessan Victoria, kronprins Haakon av Norge och kung Frederik av Danmark är nära i ålder och har vuxit upp tillsammans. Enligt författaren och kungahusexperten Roger Lundgren har Victoria alltid sett de två som något av storebrorskandidater.\n\n– De här tre familjerna umgås jättemycket privat. Mycket sådant som vi inte ser. De gör resor ihop, firar påsk och gör en massa saker tillsammans, säger han till TV4 Nyheterna. Han menar att relationen dels bygger på nära släktband, dels på att de lever liknande, inrutade liv och att de helt enkelt tycker om och kan finna trygghet i varandra. Mot den bakgrunden är det, enligt Roger Lundgren, inte förvånande att kronprinsessan Victoria följer situationen kring kronprinsessan Mette-Marits försämrade hälsa. – Jag tror att Victoria är där som vilken kompis som helst. Pratar, lyssnar och försöker stötta så mycket hon kan, säger han. Kronprinsessan Victoria följer situationen I ett mejl till TV4 Nyheterna skriver hovets informationschef Margareta Thorgren att beskedet om den norska kronprinsessans försämrade hälsa verkligen är tråkigt. ”Kronprinsessan Victoria följer situationen och de har privat kontakt mellan varandra”, skriver hon. Enligt Roger Lundgren är Victoria expert på att skicka blommor med små, personliga kort. – Och med fina handritade hälsningar och sådant. Det har hon alltid varit jätteduktig på, säger han. – Hon har ju en enorm empati för andra människor. ”Haft en tuff vår” Enligt författaren och kungahusexperten lever monarkierna i symbios med varandra och oro i ett kungahus kan påverka andra. – Det är klart att det här med norska kungahuset och med allt som har hänt den sista tiden, och framförallt då… Mette-Marit har ju haft en tuff vår här, både med de här Epstein-grejerna. Men sen är det ju det att hon är väldigt, väldigt sjuk. Och så har hon en son som ska få en dom om ett par veckor här också. Så det lär ju knappast på något vis mildra situationen. Samtidigt betonar han att det i grunden handlar om människor. – Just nu är det ju inte så mycket fokus på eventuella skandaler, utan helt och hållet på en medmänniska som är allvarligt sjuk.", "link": "https://www.tv4.se/artikel/5o6dlcb02wVPg8C7lXFmTf/kungafamiljens-stoed-till-mette-marit-har-privat-kontakt", "date_display": "2026-06-02", "date_iso": "2026-06-02T13:26:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/noje", "/utrikes", "/inrikes", "/kungligt", "/norge", "/norska-kungafamiljen", "/norska-kungahuset", "/svenska-kungafamiljen", "/kronprinsessan-victoria"]}, {"id": 144, "title": "The proposal: 15-year limit for social media", "summary": "Last autumn, the government appointed an investigation, led by Lisa Englund Krafft, which was tasked with reviewing the possibilities of introducing an age limit on social media. The first partial report has now been handed over to Social Affairs Minister Jacob Forssmed. And in it, an age limit of 15 years is proposed. Big challenge Children and young people under the age of 15 should not have access to logged-in mode on online platforms that enable users to discover, connect to, and communicate with each other, or where content can be shared or discovered. That's what Englund Krafft writes in the investigation. Screens and social media and their impact on the health of children and young people are one of the biggest challenges of our time, says Forssmed at a press conference. Research shows that social media affects young people's mental health in a negative way. Many children and young people are exposed to terrible things on their mobile phones, says Forssmed and adds: Protecting the health and safety of children and young people has been a priority task for me and the government. Age limits on social media have been introduced in several places in the world, and a total of work is underway on the issue in 35 countries, according to Unicef. Australia was the first to ban, when last December it introduced a 16-year age limit on ten different social media platforms, including Instagram, Tiktok and Snapchat. Since then, several countries have followed suit. The Philippines, Denmark and the UK are some of the countries that have plans to introduce stricter age limits on social media. Great support In Sweden, political support for an age limit is great. Social Democrats party leader Magdalena Andersson said last October that she wants to see a 15-year limit. We have previously regulated other addictive products. We need to do that here too, she said. In Sweden, there is currently a limit of 13 years for when children must have parental consent to create accounts on social media.", "title_original": "Förslaget: 15-årsgräns för sociala medier", "summary_original": "I höstas tillsatte regeringen en utredning, ledd av Lisa Englund Krafft, som fick i uppdrag att se över möjligheterna att införa en åldersgräns på sociala medier. Nu har det första delbetänkandet lämnats över till socialminister Jacob Forssmed. Och i det föreslås en åldersgräns på 15 år. Stor utmaning Barn och unga under 15 år ska inte ha tillgång till inloggat läge på onlineplattformar som gör det möjligt för användare att upptäcka, ansluta sig till, och kommunicera med varandra, eller där det går att dela eller upptäcka innehåll. Det skriver Englund Krafft i utredningen. Skärmar och sociala medier och deras påverkan på barn och ungas hälsa är en av vår tids största utmaningar, säger Forssmed på en presskonferens. Forskning visar att sociala medier påverkar ungas psykiska hälsa på ett negativt sätt. Många barn och unga får ta del av fruktansvärda saker i sina mobiler, säger Forssmed och tillägger: Att skydda barn och ungas hälsa och trygghet har varit en prioriterad uppgift för mig och regeringen. Åldersgränser på sociala medier har införts på flera ställen i världen och totalt pågår arbete i frågan i 35 länder, enligt Unicef. Australien var först ut med förbud, då man i december förra året införde en 16-års åldersgräns på tio olika sociala medie-plattformar, däribland Instagram, Tiktok och Snapchat. Sedan dess har flera länder följt efter. Filippinerna, Danmark och Storbritannien är några av länderna som har planer på att införa striktare åldersgränser på sociala medier. Stort stöd I Sverige är det politiska stödet för en åldersgräns stort. Socialdemokraternas partiledare Magdalena Andersson sade i oktober förra året att hon vill se en 15-årsgräns. Vi har tidigare reglerat andra beroendeframkallande produkter. Det behöver vi göra här också, sade hon. I Sverige finns i dag en gräns på 13 år för när barn måste ha föräldrars samtycke för att få skapa konton på sociala medier.", "link": "https://www.tv4.se/artikel/tt-260602-socialamedier1-02acad9e/forslaget-15-arsgrans-for-sociala-medier", "date_display": "2026-06-02", "date_iso": "2026-06-02T13:02:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Storbritannien", "/storbritannien", "/sverige", "/danmark", "/australien", "/magdalena-andersson", "/unicef", "/filippinerna", "/inrikes"]}, {"id": 145, "title": "Malina Abrahamsson:\nDoes the archbishop really want to be friends with the cultural elite?", "summary": "The church misses a chance to give solid food to those who hunger for something more than well-formulated universal considerations", "title_original": "Malina Abrahamsson:\nVill ärkebiskopen så gärna bli kompis med kultureliten?", "summary_original": "Kyrkan missar en chans att ge fast föda till den som hungrar efter någonting mer än välformulerade allmängiltiga betraktelser", "link": "https://www.dagen.se/kultur/malina-abrahamsson-vill-aerkebiskopen-sa-gaerna-bli-kompis-med-kultureliten/10374070", "date_display": "2026-06-02", "date_iso": "2026-06-02T12:13:22+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "The dog trainer rages after the dog attacks: \"Too damned\"", "summary": "Last Friday there was another dog attack with a fatal outcome in Stenungsund, when Margareta Olsson lost her chihuahua Poppy, 5. This just days after the farm dog Messi was bitten to death in the Lindwall family's garden in Trelleborg. The phenomenon causes dog trainer Fredrik Steen to react. - It's too damned. It happens way too often and it annoys me something terribly. The dog coach: Can usually be stopped Fredrik Steen emphasizes that an accident can always happen. - Situations can arise when you do everything right where things like this happen. You should have humility and respect for that. But in most cases when dogs kill other dogs, it could have been stopped, he says. - Usually there are no accidents. You are careless, have overconfidence in your own dog and so on. Almost all cases are about dog owners walking around with the dog loose when they should be on a leash. If we only followed the rules, accidents would decrease enormously, he says. - A dog is, after all, just an animal. Some dogs have characteristics such as a desire to hunt or other triggers that can speed up the dog. If we leash the dogs, we minimize the risk of this happening. \"Then the dog should not be bred\" Steen also believes that dogs from unregulated breeding are behind many of the incidents, ie when private individuals' dogs mate with each other without the medical examinations and mental tests required for regulated breeding. - You let them mate because you think it's fun, or financially beneficial with the puppies, he says. - But if you have a dog with a great desire to hunt or fight with other dogs, it should not be bred. The large amount of dogs that expose people and animals to horrors comes from unregulated breeding. The owners of the dogs that killed both Messi and Poppy have been reported to the County Administrative Board in Skåne and Västra Götaland respectively.", "title_original": "Hundcoachen rasar efter hundattackerna: ”För jävligt”", "summary_original": "I fredags skedde ytterligare en hundattack med dödlig utgång i Stenungsund, då Margareta Olsson blev av med sin chihuahua Poppy, 5. Detta bara dagar efter att gårdshunden Messi blivit ihjälbiten i familjen Lindwalls trädgård i Trelleborg. Fenomenet får hundcoachen Fredrik Steen att reagera. – Det är för jävligt. Det händer alldeles för ofta och det irriterar mig något fruktansvärt. Hundcoachen: Går oftast att stoppa Fredrik Steen betonar att en olycka alltid kan ske. – Situationer kan uppstå när man gör allt rätt där sådant här händer. Det ska man ha ödmjukhet och respekt för. Men i de flesta fall när hundar dödar andra hundar hade det gått att stoppa, säger han. – Oftast är det inga olyckor. Man är slarvig, har övertro på sin egen hund och så vidare. I stort sett alla fall handlar om hundägare som går omkring med hunden lös när de borde ha koppel. Skulle vi bara följa reglerna skulle olyckorna minska enormt, säger han. – En hund är trots allt bara ett djur. Vissa hundar har egenskaper som jaktlust eller andra triggers som kan sätta fart i hunden. Kopplar vi hundarna minimerar vi risken för att det ska kunna ske. ”Då borde hunden inte gå i avel” Steen tror även att hundar från den oreglerade aveln ligger bakom många av incidenterna, alltså när privatpersoners hundar parar sig med varandra utan de medicinska undersökningar och mentala tester som krävs för reglerad avel. – Man låter dem para sig för man tycker det är kul, eller ekonomiskt fördelaktigt med valparna, säger han. – Men har man en hund med stor lust att jaga eller slåss med andra hundar så borde den inte gå i avel. Den stora mängden hundar som utsätter människor och djur för hemskheter kommer från oreglerad avel. Ägarna till hundarna som dödade både Messi och Poppy har anmälts till Länsstyrelsen i Skåne respektive Västra Götaland.", "link": "https://www.tv4.se/artikel/1rbiYuf8i9ADpjR3mjeHLZ/hundcoachen-rasar-efter-hundattackerna-foer-jaevligt", "date_display": "2026-06-02", "date_iso": "2026-06-02T08:06:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Hundcoachen", "/hundcoachen", "/hundattack", "/hund", "/hundar", "/inrikes"]}, {"id": 147, "title": "No red prices for the first Swedish strawberries", "summary": "Between 85 and 99 kroner a liter for Swedish strawberries is not an unusual sight in stores today. There are many who think it is too expensive, but fruit and vegetable dealer Lukas Wojarski believes that it is normal. - Yes, I think so. I think that seems reasonable. This morning when I was out in Årsta, it had gone down a bit. It will fall a little and then it will rise a little towards midsummer when demand increases. That's usually how it is, he says. That's how much they should cost He draws parallels with coffee. - I paid SEK 43 for a coffee yesterday and thought it was very expensive. Then there are lots of different strawberries to choose from. You can take Dutch or Belgian, which are a little cheaper. But if you want Swedish, really good strawberries, they will probably be around 80 to 90 kroner, says Lukas Wojarski. The big festival of strawberries, Midsummer, is only two and a half weeks away. - I think you should pay 70 to 90 kroner for a good strawberry. I think that is reasonable. Must have Swedish? The cheaper, Dutch or Belgian strawberries are available all year round – so even in midsummer. - I don't think it's strange to eat them at all. But the taste that you associate with a strawberry - then you almost have to have a Swede, I think. If you buy the strawberries in the market square, they are a little cheaper than in the store, but then Lukas Wojarski thinks you should ask where they come from and what kind they are. - So you get the taste you like. All you have to do is dig in, summer is here.", "title_original": "Inga röda priser på de första svenska jordgubbarna", "summary_original": "Mellan 85 och 99 kronor litern för svenska jordgubbar är ingen ovanlig syn i butikerna i dag. Det är många som tycker att det är för dyrt, men frukt- och grönsakshandlare Lukas Wojarski menar att det är normalt. – Ja, det tror jag nog. Jag tycker att det verkar rimligt. Nu i morse när jag var ute i Årsta så hade det gått ner lite grann. Det kommer att falla lite och sen kommer det gå upp lite mot midsommar när efterfrågan ökar. Så brukar det vara, säger han. Så mycket bör de kosta Han drar paralleller till kaffet. – Jag betalade 43 kronor för en kaffe igår och tyckte det var jättedyrt. Sen finns det massa olika jordgubbar man kan välja. Man kan ta holländska eller belgiska, som är lite billigare. Men vill man ha svenska, riktigt bra jordgubbar så kommer de nog ligga runt 80 till 90 kronor, säger Lukas Wojarski. Jordgubbarnas stora högtid, midsommar, ligger bara två och en halv vecka bort. – Jag tycker att man ska betala 70 till 90 kronor för en bra jordgubbe. Det tycker jag är rimligt. Måste ha svenska? De billigare, holländska eller belgiska jordgubbarna finns att tillgå året runt – så även på midsommar. – Jag tycker inte det är konstigt att äta dem alls. Men den smaken som man förknippar med en jordgubbe – då måste man nästan ha en svensk, tycker jag. Om man handlar jordgubbarna på torget är de lite billigare än i butik, men då tycker Lukas Wojarski att man ska fråga var de kommer ifrån och vad det är för sort. – Så ni får den smaken ni tycker om. Det är bara att hugga in, sommaren är här.", "link": "https://www.tv4.se/artikel/3mZaNSO5Xj9DU5V3xZzdQG/inga-roeda-priser-pa-de-foersta-svenska-jordgubbarna", "date_display": "2026-06-02", "date_iso": "2026-06-02T07:26:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/mat", "/jordgubbar", "/midsommar", "/matpriserna"]}, {"id": 148, "title": "This is how Epa-dunk will get home sitters back to school", "summary": "The project is called Epa-dunk and is still in its infancy, but is expected to be scaled up in the autumn. The number of students who are away more than half of their school time has more than doubled compared to before the pandemic. Today, around 19,000 students in Sweden are counted as home-sitters, according to the parent network Rätten till Utbildning - and in Arvidsjaur the development looks the same.  To lower the threshold to school, the municipality lets epa-driving young people pick up students who cannot get there on their own.  - The problem is increasing just like in the rest of the country, that we get more and more people who don't come to school. The reason can vary a lot, but this is a way to get a little closer to the school, says Anna Lindblom, school counselor and initiator of project EPA-dunk.  Elsa picks up the students One of the young drivers is Elsa Lundgren. She picks up students who have difficulty getting away and drives them to school.  - I pick up people who have difficulty getting to school and drive them to school in the morning. I know what it's like to have a bit of a hard time getting to school, and then it still feels pretty good to be able to help people in that way. Because it's quite a small thing that can still make a difference.  Do you think it is easier for them that it is you who comes and not an adult?  - Yes, I think so, both go to school. Then you can talk about what is difficult and so on, says Elsa Lundgren, A-tractor driver.  To be extended until autumn The project currently only covers upper secondary school. In the autumn, it will be expanded with parts of the middle school and upper secondary school. The municipality admits that there is much more to do to get home sitters to come back and enjoy school, but sees the initiative as a new idea. At the same time, epa young people get to feel responsibility and an important task.  - If we get someone to come back, that's great. This is not the solution for everyone, but for some we hope, says Anna Lindblom. - It feels great to pick up the person. And once it gets to school, it feels great for both, I think. Both for me and", "title_original": "Så ska Epa-dunk få hemmasittare tillbaka till skolan", "summary_original": "Projektet kallas Epa-dunk och är än så länge i sin linda, men väntas till hösten skalas upp. Antalet elever som är borta mer än hälften av sin skoltid har mer än dubblerats jämfört med innan pandemin. I dag räknas omkring 19 000 elever i Sverige som hemmasittare, enligt föräldranätverket Rätten till Utbildning – och i Arvidsjaur ser utvecklingen likadan ut.  För att sänka tröskeln till skolan låter kommunen epa-körande ungdomar hämta elever som inte tar sig dit på egen hand.  – Problemet ökar precis som i övriga landet, att vi får fler och fler som inte kommer till skolan. Vad orsaken kan variera jättemycket men det här är ett sätt att komma lite nämnare skolan, säger Anna Lindblom, skolkurator och initiativtagare till projekt EPA-dunk.  Elsa hämtar eleverna  En av de unga förarna är Elsa Lundgren. Hon hämtar elever som har svårt att komma iväg och skjutsar dem till skolan.  – Jag hämtar folk som har svårt att komma till skolan och skjutsar dem till skolan på morgonen. Jag vet hur det är att ha det lite svårt att komma till skolan, och då känns det ändå ganska bra man kan hjälpa folk på det sättet. För det är en ganska liten grej som ändå kan göra skillnad.  Tror du det är lättare för dem att det är du som kommer och inte en vuxen?  – Ja jag tror det, båda går i skolan. Då kan man prata om det som är jobbigt och så vidare, säger Elsa Lundgren, A-traktorförare.  Utökas till hösten  Projektet omfattar i dag bara högstadiet. Till hösten ska det utökas med delar av mellanstadiet och gymnasiet. Från kommunen medger man att det finns mycket mer att göra för att få hemmasittare att komma tillbaka och trivas i skolan, men ser satsningen som ett nytänk. Samtidigt får epaungdomar känna ansvar och en viktig uppgift.  – Får vi någon att komma tillbaka så är det jättebra. Det här är inte lösningen för alla, men för några hoppas vi, säger Anna Lindblom. – Det känns jättebra att hämta personen. Och när den väl tar sig till skolan, känns jättebra för båda tror jag. Både för mig och den jag skjutsar, avslutar Elsa.", "link": "https://www.tv4.se/artikel/2parqzB0MlEbdx5mdutBVu/epa-dunk-ska-fa-hemmasittare-tillbaka-till-skolan", "date_display": "2026-06-02", "date_iso": "2026-06-02T07:13:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/epa", "/skolskjuts", "/hemmasittare"]}, {"id": 149, "title": "She becomes the new host of Farmen: \"Totally typecast\"", "summary": "After six years as presenter of \"The Farm\", Anna Brolin is changing the farm to the soccer field to cover the upcoming world championship in North America. Who would take over the baton has so far been unknown, but on Tuesday's Nyhetsmorgon, media profile and artist Carolina Gynning was presented as the new presenter. - I am so happy about this. I can't imagine a better summer job, she says. Carolina Gynning lives everyday on a farm with horses, pigs, goats and chickens and is well acquainted with the lifestyle. - I am totally typecast, because I live on a farm. I do all the things that the farmers will do every day. Except maybe I don't just eat porridge. It will be tough for them. \"It will be a Gynning show\" Carolina Gynning, who many associate with flair and glamour, must steel herself for life in a barracks, according to Anna Brolin. Otherwise, the advice is simple: be yourself. - Just as you are. It will be a Benefit Show. Be tough on them and then maybe you can comfort them. There will be tears and such, says Anna Brolin. How well the artist will stick to the script remains to be seen. - I'm good at plugging in scripts, but not so good at sticking to it. There may be a little script and a little improvisation. I also think that my strength lies in being good at being in the moment and improvising. It might be fun if I just talk straight. Anna Brolin agrees: - Just be yourself. It's good if you can go outside the script, because a lot of things will happen - and you also need to learn them. Anna Brolin on leaving For Anna Brolin, it feels a little sad to no longer be able to follow the people in the program and she will miss the friendships that arise. - They are so unexpected. And this year we also had a very unexpected love couple. That can only happen. I may miss that, being able to follow that drama. But since Anna Brolin is a real football geek, she thinks she also has the best summer job in the world this year covering the World Cup. –", "title_original": "Hon blir ny programledare för Farmen: ”Totalt typecastad”", "summary_original": "Efter sex år som programledare för ”Farmen” byter Anna Brolin gården mot fotbollsplanen för att bevaka det stundande världsmästerskapet i Nordamerika. Vem som skulle ta över stafettpinnen har hittills varit okänt, men i tisdagens Nyhetsmorgon presenterades medieprofilen och konstnären Carolina Gynning som ny programledare. – Jag är så glad för det här. Jag kan inte tänka mig ett bättre sommarjobb, säger hon. Carolina Gynning bor till vardags på en gård med hästar, grisar, getter och höns och är väl bekant med livsstilen. – Jag är totalt typecastad, för jag bor ju på en farm. Jag gör allt det som farmarna kommer att göra varje dag. Förutom att jag kanske inte bara äter gröt. Det kommer att bli tufft för dem. ”Det blir en Gynningshow” Carolina Gynning, som många förknippar med flärd och glamour, får enligt Anna Brolin stålsätta sig för livet i en barack. I övrigt är rådet enkelt: var dig själv. – Precis som du är. Det blir en Gynningshow. Var tuff mot dem och sen kanske man får trösta. Det kommer att bli tårar och sådant, säger Anna Brolin. Hur väl konstnären kommer att hålla sig till manus återstår att se. – Jag är bra på att plugga in manus, men inte så bra på att hålla mig till det. Det får bli lite manus och lite improvisation. Jag tror också att min styrka ligger i att jag är bra på att vara i nuet och improvisera. Det kan bli kul att jag bara pratar rakt ut. Anna Brolin instämmer: – Var bara dig själv. Det är bra om man kan gå utanför manus, för det kommer att hända en massa saker – och du behöver ju också läxa upp dem. Anna Brolin om att lämna För Anna Brolin känns det lite vemodigt att inte längre få följa människorna i programmet och hon kommer att sakna de vänskaper som uppstår. – De är så oväntade. Och i år hade vi dessutom ett väldigt oväntat kärlekspar. Sånt kan bara hända. Det kan jag sakna, att få följa den dramatiken. Men eftersom Anna Brolin är en riktig fotbollsnörd tycker hon att hon också har världens bästa sommarjobb i år att bevaka fotbolls-VM. – Det känns otroligt, säger hon.", "link": "https://www.tv4.se/artikel/6uGMQXR1cDKVtGk24CPkEi/hon-blir-ny-programledare-foer-farmen", "date_display": "2026-06-02", "date_iso": "2026-06-02T06:17:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/farmen", "/tv4", "/tv4-play"]}, {"id": 150, "title": "That's how expensive it will be to grill this summer - the price of meat has skyrocketed", "summary": "Grillsäsongen är här, men den som vill lägga nötkött på grillen får vara beredd att betala. Nötkött är nämligen den kategori som ökar mest i pris i matbutikerna, enligt Matpriskollens månadsstatistik. Den visar att de ordinarie priserna på livsmedel i dagligvarubutikerna sjönk med 0,2 procent i maj jämfört med april. Matpriserna ligger i dag 5,6 procent lägre än för ett år sedan, vilket delvis förklaras av momssänkningen den 1 april i år. But the meat continues to become more expensive. - What is at the top is beef. I think it has been at the top all year. Det är en följetong och den kommer vi nog att få fortsätta se ett tag framöver, säger Ulf Mazur, vd Matpriskollen. Nötkött har stuckit i väg Anledningen är att det finns för lite nötkreatur. - It already started in 2018 when mass slaughter was carried out. Then many farmers gave up and felt they could run grain instead. Everything has become more expensive and less secure. Then you might hold back and not invest. Helt plötsligt står vi här och har inte djur tillräckligt, säger Ulf Mazur. På ett år har nötkött gått upp 17 procent i pris. - The ground beef is up approximately 22 percent. And 50 to 60 percent of the meat we eat is minced. It's a nut that has gotten in the way. That's the tough part now, says Ulf Mazur in Nyhetsmorgon. Även annat animaliskt protein, som kyckling och fisk, ligger på topplistan över vilka produkter som ökat mest i pris i maj. How to get away cheaper We're entering the big barbecue season now with school graduations, student celebrations, National Day and midsummer - not to mention holidays. Hur ska man då tänka om man verkligen gillar att grilla? – Ungefär en tredjedel av folk grillar flera gånger i veckan nu. You have to start thinking anew. Think barbecue buffet instead, says Ulf Mazur. Han tipsar om att lägga annat på grillen än nötkött. Chicken costs approximately 100 to 150 kroner per kilo, compared to beef, such as flank steak which is somewhere around 230 and the beef fillet at over 500. - So it's in a division of its own. But sausages start at 60 kro", "title_original": "Så dyrt blir det att grilla i sommar – köttet har rusat i pris", "summary_original": "Grillsäsongen är här, men den som vill lägga nötkött på grillen får vara beredd att betala. Nötkött är nämligen den kategori som ökar mest i pris i matbutikerna, enligt Matpriskollens månadsstatistik. Den visar att de ordinarie priserna på livsmedel i dagligvarubutikerna sjönk med 0,2 procent i maj jämfört med april. Matpriserna ligger i dag 5,6 procent lägre än för ett år sedan, vilket delvis förklaras av momssänkningen den 1 april i år. Men köttet blir fortsatt dyrare. – Det som är i toppen är nötkött. Jag tror att det har varit i toppen hela året. Det är en följetong och den kommer vi nog att få fortsätta se ett tag framöver, säger Ulf Mazur, vd Matpriskollen. Nötkött har stuckit i väg Anledningen är att det finns för lite nötkreatur. – Det började redan 2018 när man fick masslakta. Då gav många bönder upp och kände att de kunde köra spannmål i stället. Allting har blivit dyrare och osäkrare. Då kanske man håller igen och inte investerar. Helt plötsligt står vi här och har inte djur tillräckligt, säger Ulf Mazur. På ett år har nötkött gått upp 17 procent i pris. – Nötfärsen är upp 22 procent ungefär. Och 50 till 60 procent av köttet vi äter är färs. Det är nöt som har stuckit i väg. Det är det tuffa nu, säger Ulf Mazur i Nyhetsmorgon. Även annat animaliskt protein, som kyckling och fisk, ligger på topplistan över vilka produkter som ökat mest i pris i maj. Så kommer du undan billigare Vi går ju in i den stora grillsäsongen nu med skolavslutningar, studentfiranden, nationaldag och midsommar – för att inte nämna semester. Hur ska man då tänka om man verkligen gillar att grilla? – Ungefär en tredjedel av folk grillar flera gånger i veckan nu. Man måste börja tänka nytt. Tänk grillbuffé i stället, säger Ulf Mazur. Han tipsar om att lägga annat på grillen än nötkött. Kyckling kostar ungefär 100 till150 kronor kilot, jämfört med oxköttet, som flankstek som ligger någonstans runt 230 och oxfilén på över 500. – Så det är ju i en egen division. Men korvar börjar på 60 kronor ungefär per kilo, upp till 100. Och fläskköttet, det är ju det som man grillar mest, ligger runt upp till en hundring per kilo. Och halloumi har ju fallit i pris.", "link": "https://www.tv4.se/artikel/2QIj7hVHXigItEGMaEYZDt/sa-dyrt-blir-det-att-grilla-i-sommar", "date_display": "2026-06-02", "date_iso": "2026-06-02T05:48:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/mat", "/matpriserna", "/matpriskollen", "/livsmedel", "/konsumentinformation", "/konsument"]}, {"id": 151, "title": "The sheet metal worker's concern about the canceled retirement allowance: \"Was devastating\"", "summary": "In the survey, the companies state, among other things, a great concern that short-term absences and thus costs will increase. Mattias Dahl as deputy CEO of Swedish Enterprise points to previous experiences. - After all, we tried in Sweden to remove the retirement allowance at the end of the 80s, and that very quickly led to runaway costs. He continues. - And now that this proposal comes up, well then we point to that history and that's what our members say. Controversial issue At the same time, the issue is dividing the Swedes. Union organizations such as LO and Kommunal look positively on an abolished deduction. The Social Democrats, who are behind the proposal, believe, among other things, that the current system is unfair and mainly benefits those who can work from home. Mikael Damberg, who is economic and political spokesperson for the Social Democrats, believes that certain groups, such as police officers, nurses or nannies, are hit particularly hard. - You have to be aware that the groups who have to do the work at work are hit hard financially by getting sick. Concerns about \"Monday sickness\" At the same time, there is a concern that more people will call in sick with so-called \"Monday sickness\", meaning that employees will stay at home even though they don't have to. At Lödde Plåt in Malmö, it is highlighted that the question of who is hit hardest by short-term absences can be seen from several perspectives. - That concept of justice is a difficult question that you have to think about. Is it fair to the co-workers who remain to take a heavier burden when someone who is not sick is on a short-term absence? The grace period was temporarily suspended during the corona pandemic. Now the Social Democrats continue to push the issue ahead of the election and at the same time address the concerns of small businesses. - We have seen that, not least for the small and medium-sized companies, there is a reason to actually proceed with a high-cost cover to protect them against high sick pay costs, says Mikael Damberg.", "title_original": "Plåtslagarens oro för slopat karensavdrag: ”Vore förödande”", "summary_original": "I undersökningen uppger företagen bland annat en stor oro för att korttidsfrånvaron och därmed kostnaderna ska öka. Mattias Dahl som vice vd på Svenskt Näringsliv pekar på tidigare erfarenheter. – Vi har ju prövat i Sverige att ta bort karensavdraget i slutet på 80-talet och det ledde väldigt snabbt till skenande kostnader. Han fortsätter. – Och nu när det här förslaget kommer upp, ja då pekar vi på den historiken och det är det våra medlemmar säger. Omdiskuterad fråga Samtidigt splittrar frågan svenskarna.Fackliga organisationer som LO och Kommunal ser positivt på ett slopat avdrag. Socialdemokraterna, som står bakom förslaget, menar bland annat att dagens system är orättvist och främst gynnar de som kan jobba hemifrån. Mikael Damberg som är ekonomisk-politisk talesperson för Socialdemokraterna anser att vissa grupper, som poliser, sjuksköterskor eller barnskötare, drabbas extra hårt. – Man måste vara medveten om de grupper som måste göra jobbet på jobbet drabbas hårt ekonomiskt av att bli sjuka. Oro för ”måndagssjuka” Samtidigt finns en oro att fler ska sjukskriva sig med så kallad ”måndagssjuka”, alltså att anställda stannar hemma trots att de inte behöver. På Lödde Plåt i Malmö lyfts att frågan om vem som drabbas hårdast vid korttidsfrånvaro kan ses ur flera perspektiv. – Det där med rättvisebegrepp är en svår fråga man måste fundera över. Är det rättvist mot arbetskamraterna som är kvar att ta en hårdare börda när någon som inte är sjuk är i korttidsfrånvaro? Karensavdraget upphörde tillfälligt under coronapandemin. Nu fortsätter Socialdemokraterna att driva frågan inför valet och bemöter samtidigt småföretagarnas oro. – Vi har ju sett att inte minst för de små och medelstora företagen finns det ett skäl att faktiskt gå fram med ett högkostnadsskydd för att skydda dem mot höga sjuklönekostnader, säger Mikael Damberg.", "link": "https://www.tv4.se/artikel/7zF0oyMxyweNYbdeyEVrOd/platslagarens-oro-foer-slopat-karensavdrag-vore-foeroedande", "date_display": "2026-06-02", "date_iso": "2026-06-02T04:05:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Arbetsmarknaden", "/arbetsmarknaden", "/arbetsliv", "/ekonomi", "/sjukfranvaro", "/sjukskrivningar"]}, {"id": 152, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Tomas Hagwall about his upbringing as a missionary child in Chile.", "title_original": "”Jag slås fortfarande av att vårt uppdrag var att omvända katoliker”", "summary_original": "Tomas Hagwall om sin uppväxt som missionärsbarn i Chile.", "link": "https://www.dagen.se/ isplay": "2026-06-02", "date_iso": "2026-06-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "After the leadership crisis in Uppsala Pentecost - he can become the new temporary director", "summary": "Richard Svensson on the interim board: He is a unifying force", "title_original": "Efter ledarkrisen i Uppsala Pingst – han kan bli ny tillfällig föreståndare", "summary_original": "Richard Svensson i interimsstyrelsen: Han är en samlande kraft", "link": "https://www.dagen.se/nyheter/efter-ledarkrisen-i-uppsala-pingst-han-kan-bli-ny-tillfaellig-foerestandare/10373218", "date_display": "2026-06-02", "date_iso": "2026-06-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Wanted to kill - with a homemade bomb in a red package: \"Be upset with him\"", "summary": "It was in January this year that a red package was found in the snow at a church in Rättvik. The package was in a white bag with the name of a school employee written on it. When the police opened it, it was found to contain a homemade bomb, which was built to detonate in the hands of whoever opened the package. - All handling of the bomb has been associated with danger to life, says senior prosecutor Jimmy Skogström, who leads the preliminary investigation, in a statement. The investigation was able to quickly connect the package to an 18-year-old student who attends the school where the employee works. Followed footprints in the snow Shortly before the find, the student had been seen by the employee's car with a package in hand. När den anställde ropade på 18-åringen sprang han från platsen.  The school employee and a colleague became suspicious and began to follow the student's footsteps in the fresh snow. The tracks led to a red package in a white bag that read \"UF GIVEAWAY\" and the employee's name. That's when the police were called. - He has left the bomb outside in a bag, which has meant great risks for people who have been nearby, says senior prosecutor Jimmy Skogström. I förhör nekar 18-åringen till att han försökt döda någon, men medger att han var upprörd på den skolanställde. Förvarade vapen på gymmet 18-åringen säger i förhör att han intresserade sig för vapen efter att ha sett en dokumentär på Youtube. \"I thought it was cool. I got a little interested in gun laws,\" he says, adding that he thinks Europe's gun laws are too restrictive. The man started using manuals from the internet to make his own weapons, including with a 3D printer. The 18-year-old kept several of the man's self-made weapons, which the police investigation assesses as functional, at a local gym. There he hid weapons, ammunition and weapon parts in a locked cabinet. Among other things, 3D-printed casings for hand grenades and pipe bombs, shrapnel and sulfuric acid were found. Charged with four attempted murders The high school student is now charged with four cases of attempted murder. Partly against the s", "title_original": "Ville döda – med hemgjord bomb i rött paket: ”Var upprörd på han”", "summary_original": "Det var i januari i år som ett rött paket hittades i snön vid en kyrka i Rättvik. Paketet låg i en vit påse med namnet på en skolanställd skrivet på. När polisen öppnade det visade det sig innehålla en hemmagjord bomb, som var byggd så att den skulle detonera i händerna på den som öppnade paketet. – All hantering av bomben har varit förenad med livsfara, säger senior åklagare Jimmy Skogström som leder förundersökningen i ett uttalande. Utredningen kunde snabbt koppla paketet till en 18-årig elev som går på den skola som den anställde jobbar på. Följde fotspår i snön Kort innan fyndet hade eleven setts vid den anställdes bil med ett paket i handen. När den anställde ropade på 18-åringen sprang han från platsen.  Den skolanställde och en kollega fattade misstankar och började följa elevens fotspår i nysnön. Spåren ledde till ett rött paket i en vit påse där det stod ”UF GIVEAWAY” och den anställdes namn. Det var då man ringde polisen. – Han har lämnat bomben utomhus i en påse, vilket har inneburit stora risker för människor som varit i närheten, säger senior åklagare Jimmy Skogström. I förhör nekar 18-åringen till att han försökt döda någon, men medger att han var upprörd på den skolanställde. Förvarade vapen på gymmet 18-åringen säger i förhör att han intresserade sig för vapen efter att ha sett en dokumentär på Youtube. ”Jag tyckte det var häftigt. Jag blev lite intresserad av vapenlagar”, säger han, och tillägger att han tycker att Europas vapenlagar är för restriktiva. Mannen började med hjälp av manualer från internet att tillverka egna vapen, bland annat med en 3D-printer. Flera av mannens egentillverkade vapen, som polisens utredning bedömer som funktionsdugliga, förvarade 18-åringen på ett lokalt gym. Där gömde han både vapen, ammunition och vapendelar i ett låst skåp. Bland annat hittades 3D-printade höljen till handgranater och rörbomber, splitter samt svavelsyra. Åtalas för fyra mordförsök Gymnasieeleven åtalas nu för fyra fall av mordförsök. Dels mot den skolanställde som misstänks vara måltavla, men också mot kollegan som var med när de hittade bomben. Även de två polismän som öppnade paketet riskerade att mista livet, menar åklagaren. Vid genomgång av 18-åringens dator och mobiltelefon hittade polisen material som tyder på ett stort intresse för grova våldsbrott.  – Jag har även bedrivit en förundersökning angående förberedelse till mord där godset i omklädningsskåpet misstänktes komma till brottslig användning mot en eller flera personer. Det har dock inte kunnat slås fast att det funnits några ytterligare konkreta mordplaner och därför har jag valt att lägga ned utredningen i den delen, säger åklagaren i uttalandet. Rättegången förväntas starta i mitten av juni.", "link": "https://www.tv4.se/artikel/5NMTo2MD3Bn3OSmBFtBh1c/ville-doeda-med-hemgjord-bomb-i-roett-paket-var-upproerd-pa-han", "date_display": "2026-06-01", "date_iso": "2026-06-01T22:00:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/rattvik", "/bomb"]}, {"id": 158, "title": "New customs duty on cheap products: \"Will be more expensive\"", "summary": "The new customs rules come into force on 1 July. The duty-free status for so-called low-value consignments is then removed. The decision means that a fee will be charged for packages that cost the equivalent of 150 euros (about SEK 1,600) or less and are sent to private individuals from countries outside the EU. - This is the equivalent of three euros (about SEK 32) per type of product in the shipment. And here there can easily be misunderstandings. If there are different types of goods, for example pens, erasers, notepads, then it will be three euros per item, says Carina Asplund, acting head of the Swedish Customs Administration's control department. Why not charge a percentage duty so that it does not risk being unfair? - This is an EU joint decision that has been negotiated by the member states and then you have landed at three euros per item. If you import as usual, it is a percentage, says Carina Asplund. Temu och Shein Enligt Tullverket har den tidigare tullfriheten bland annat medfört stora volymer av produkter som inte följer unionens säkerhetskrav och som kan vara farliga för svenska konsumenter. It is believed the new fee will hit users of Chinese online marketplaces Temu and Shein, which have long been criticized for selling products containing toxic chemicals. - The purpose of the change is to reduce the amount of potentially unsafe and dangerous products on the EU market. It will be more expensive for the consumer, says Carina Asplund. Do you see any risk that people start buying from, for example, middlemen to avoid the customs fee? - There is always a risk of circumvention, of course. But since it is an EU joint decision, this is a rule change that comes into force simultaneously in all EU countries. So regardless of where your goods arrive in the EU, the same regulations apply. But it is clear that there is such a risk and it is something we have to look at from our horizon of course. Will the decision mean extra work and administration for customs? Or county", "title_original": "Ny tullavgift mot billiga produkter: ”Kommer bli dyrare”", "summary_original": "De nya tullreglerna börjar att gälla den 1 juli. Tullfriheten för så kallade lågvärdeförsändelser tas då bort. Beslutet innebär att det kommer tas ut en avgift för paket som kostar motsvarande 150 euro (cirka 1 600 kronor) eller mindre och som skickas till privatpersoner från länder utan EU. – Det är motsvarande tre euro (cirka 32 kronor) per varusort i försändelsen. Och här kan det lätt bli missförstånd. Är det olika varusorter, till exempel pennor, suddgummin, anteckningsblock, så blir det tre euro per vara, säger Carina Asplund, tillförordnad chef på Tullverkets kontrollavdelning. Varför tar man inte ut någon procentuell tull så att det inte riskerar att bli orättvist? – Det här är ett EU-gemensamt beslut som har förhandlats fram av medlemsstaterna och då har man landat i tre euro per vara. Importerar du som vanligt så är det en procentsats, säger Carina Asplund. Temu och Shein Enligt Tullverket har den tidigare tullfriheten bland annat medfört stora volymer av produkter som inte följer unionens säkerhetskrav och som kan vara farliga för svenska konsumenter. Man tror att den nya avgiften kommer slå hårt mot användare av de kinesiska onlinemarknadsplatser Temu och Shein, som länge kritiserats för att sälja produkter innehållande giftiga kemikalier. – Syftet med förändringen är att minska mängden av eventuella osäkra och farliga produkter på EU:s marknad. Det kommer bli dyrare för konsumenten, säger Carina Asplund. Ser ni någon risk att man börjar handla från till exempel mellanhänder för att undkomma tullavgiften? – Det finns ju alltid en risk för kringgåenden, så är det ju. Men eftersom det är ett EU-gemensamt beslut så är det här en regeländring som träder i kraft samtidigt i alla EU-länder. Så oavsett var din vara ankommer till EU så är det samma regelverk som gäller. Men det är klart att det finns en sådan risk och det är någonting vi får titta på från vår horisont så klart. Kommer beslutet att innebära ett extra arbete och administration för tullen? Eller längre leveranstider? – Det är flöden vi kontrollerar redan i dag. Det som tillkommer är att kontrollera att man betalar korrekta avgifter helt enkelt. Det är inom befintliga resurser på Tullverket. Men det skulle kunna bli lite längre leveranstider. För det är någon som behöver deklarera det här gentemot Tullverket. Det kan behövas ytterligare resurser eftersom man då behöver ta ut den här tullen, så något längre ledtid skulle det kunna bli. En undersökning från Novus, som gjorts på uppdrag av Tullverket, visar att de nya tullreglerna kan få stora konsekvenser för svenskarnas köpbeteende.", "link": "https://www.tv4.se/artikel/4O7SF1lyFNysOEP07pE8Fm/ny-tullavgift-mot-billiga-produkter-kommer-bli-dyrare", "date_display": "2026-06-01", "date_iso": "2026-06-01T20:33:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/tullverket", "/tullar"]}, {"id": 159, "title": "What legal action is required for an online store?", "summary": "Att driva en webbutik i Sverige innebär mer än att enbart välja uträtt produkter och designa hemsida. \n The post  Vilka rättsliga åtgärder krävs för en onlinebutik?  appeared first on ABC News.", "title_original": "Vilka rättsliga åtgärder krävs för en onlinebutik?", "summary_original": "Att driva en webbutik i Sverige innebär mer än att enbart välja uträtt produkter och designa hemsida. \n The post  Vilka rättsliga åtgärder krävs för en onlinebutik?  appeared firs
