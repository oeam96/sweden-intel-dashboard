fteråt”.", "link": "https://www.tv4.se/artikel/7wlxCXivL3UFw9lubhiEGL/daerfoer-tvingas-flera-baera-bandage-sonja-om-smaertan-otroligt", "date_display": "2026-05-20", "date_iso": "2026-05-20T18:00:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 143, "title": "Emmie saved thousands - bought second hand for the wedding", "summary": "The sun was shining on that August day last year when Emmie and Mathias Öster said yes to each other in a church outside Gislaved in Småland. In order to keep the costs of the wedding down, they decided, with the help of family and friends, to cook the food themselves, fix the hair and bouquet and basically buy everything they needed second-hand. - This was the only thing I bought that was new for my wedding, says Emmie Öster and spins around in the white wedding dress that she bargained down to SEK 6,500. - We decided quite close to the same year and hadn't had time to save that much money. Then I think it's fun to shop second hand and have done it for my children. Why should you buy new when there is already so much nice second hand, says Emmie Öster. The prices that drove away For Emmie and Mathias, who invited 75 guests, the wedding bill landed at SEK 35,000 for everything, which can be considered a low price tag in the context. According to calculations from SEB, it is above all jewelery and watches that have become more expensive due to the high gold price. But also photographer and hairdresser prices have moved away. And on the total, the bank sees that wedding expenses rose more than the other price indices.\n\n- In the last four, five years, prices for a wedding have risen by 20-25 percent. This can be compared with the usual price increases in the economy, which have increased by 15-17 percent. So it is clear that the wedding costs have gone up in price, says Américo Fernández, private economist at SEB. \"Our rings are heirlooms\" Emielie Öster never had to worry about gold prices as she and her husband reused rings passed down in the family. - Our rings are heirlooms and it even says my grandfather's name Verner and the date they got married in 1958. Did you want to spend more money on something? - No, absolutely not! We are very happy with our day and had great fun. I got everything I needed.", "title_original": "Emmie sparade tusenlappar – köpte second hand till bröllopet", "summary_original": "Solen sken den där augustidagen förra året när Emmie och Mathias Öster sa ja till varandra i en kyrka utanför Gislaved i Småland. För att hålla nere kostnaderna för bröllopet bestämde de sig för att med hjälp av familj och vänner laga maten själva, fixa hår och bukett och köpa i princip allt de behövde begagnat. – Det här var det enda jag köpte som var nytt till mitt bröllop, säger Emmie Öster och snurrar runt i den vita bröllopsklänningen som hon prutade ner till 6 500 kronor. – Vi bestämde oss ganska tätt inpå samma år och hade inte hunnit spara så mycket pengar. Sedan tycker jag att det är roligt att handla second hand och har gjort det till mina barn. Varför ska man handla nytrt när det redan finns så mycket fint på second hand, säger Emmie Öster. Priserna som dragit iväg För Emmie och Mathias som bjöd 75 matgäster landade bröllopsnotan på 35 000 kronor för allt, vilket kan anses vara en låg prislapp i sammanhanget. Enligt beräkningar från SEB är det framför allt smycken och klockor som blivit dyrare på grund av det höga guldpriset. Men även fotograf- och frisörpriser har dragit iväg. Och på totalen ser banken att bröllopsutgifter stigit mer än övriga prisindex.\n\n– De senaste fyra, fem åren har priserna för ett bröllop stigit med 20-25 procent. Det kan jämföras med de vanliga prisuppgångarna i ekonomin som ökat 15-17 procent. Så det är tydligt att bröllopskostnaderna stuckit iväg i pris, säger Américo Fernández, privatekonom på SEB. ”Våra ringar är arvegods” Emielie Öster behövde aldrig bekymra sig över guldpriserna då hon och maken återanvände ringar som gått i arv i släkten. – Våra ringar är arvegods och det står till och med min farfars namn Verner och datumet de gifte sig 1958. Hade du velat lägga mer pengar på något? – Nej, absolut inte! Vi är jättenöjda med vår dag och hade jätteroligt. Jag fick allt jag behövde.", "link": "https://www.tv4.se/artikel/Uq3eYTuqwPhsKk5t8SCwl/emmie-sparade-tusenlappar-koepte-second-hand-till-broellopet", "date_display": "2026-05-20", "date_iso": "2026-05-20T17:57:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/brollop", "/privatekonomi", "/second-hand"]}, {"id": 144, "title": "SVT strikes back after the criticism of the Lundsberg documentary", "summary": "Lundsberg is one of Sweden's most famous boarding schools and over the years has had students from both business and royalty. The school has previously been the subject of scrutiny, including after the high-profile scandal in 2013 when students were branded with irons in connection with so-called peer punishment.  Now the school is once again in focus after SVT's documentary series, where testimonies about violence, racism and gross bullying have created a great debate.  The school reports SVT After the second episode of \"Documents from the inside: The heirs\" was released, Lundsberg reported SVT to the Review Board. The school management believes that the documentary violates the requirement for impartiality and objectivity. Producer Johannes Hallbom believes that the focus should be on the serious testimonies. - We are talking about students today who testify that you have to crawl around or are forced to put disgusting things in your mouth, or learn to relax so it hurts less when you are beaten, says Hallbom. He says that for a year he tried to get an interview with the school's management, but that they refused to participate until the days before publication. After contact with the school management, their behavior is also reported in the series.  Culture of silence and fear The reactions after the documentary have been strong. Many former students and parents have contacted us and told us about similar experiences. At the same time, there are those who do not recognize themselves in the picture given. The author Camilla Läckberg, whose son attends Lundsberg, says that the family has not experienced any problems during the time at the school. - He enjoys himself extremely well. Neither he nor we have seen any traces of what is highlighted in the documentary, she says. Johannes Hallbom believes that the reporting is balanced and that several perspectives are highlighted.  - It's fantastic if your child is doing well at a school. But here we are talking about those who have not had a good time. These violations and the events that have come up are so serious, says Hallbom. - The culture of silence that prevails, as a student", "title_original": "SVT slår tillbaka efter kritiken mot Lundsberg-dokumentär", "summary_original": "Lundsberg är en av Sveriges mest kända internatskolor och har genom åren haft elever från både näringsliv och kungahus. Skolan har tidigare varit föremål för granskning, bland annat efter den uppmärksammade skandalen 2013 då elever brännmärktes med strykjärn i samband med så kallade kamratbestraffningar.  Nu är skolan återigen i fokus efter SVT:s dokumentärserie, där vittnesmål om våld, rasism och grov mobbning har skapat stor debatt.  Skolan anmäler SVT Efter att det andra avsnittet av \"Dokument inifrån: Arvtagarna\" släppts har Lundsberg anmält SVT till Granskningsnämnden. Skolledningen menar att dokumentären bryter mot kravet på opartiskhet och saklighet. Producenten Johannes Hallbom menar att fokus borde ligga på de allvarliga vittnesmålen. – Vi pratar om elever i nutid som vittnar om att man ska krypa runt eller tvingas stoppa äckliga saker i munnen, eller få lära sig att slappna av så det gör mindre ont när man blir slagen, säger Hallbom. Han berättar att han under ett års tid försökt få till en intervju med skolans ledning, men att de tackat nej till medverkan fram till dagarna före publicering. Efter kontakt med skolledningen redovisas även deras bemötanden i serien.  Tystnadskultur och rädsla Reaktionerna efter dokumentären har varit starka. Många tidigare elever och föräldrar har hört av sig och berättat om liknande upplevelser. Samtidigt finns det de som inte känner igen sig i bilden som ges. Författaren Camilla Läckberg, vars son går på Lundsberg, säger att familjen inte har upplevt några problem under tiden på skolan. – Han trivs oerhört väl. Varken han eller vi har sett några spår av det som lyfts fram i dokumentären, säger hon. Johannes Hallbom menar att rapporteringen är balanserad och att flera perspektiv lyfts fram.  – Det är fantastiskt om ens barn har det bra på en skola. Men här pratar vi om dem som inte har haft det bra. De här kränkningarna och händelserna som kommit upp är så allvarliga, säger Hallbom. – Den tystnadskultur som råder, som elever vittnar om väldigt tydligt, är jobbig att bryta, för det kan få allvarliga konsekvenser. Dels för en själv, om man är vuxen, men också för ens barn. I det tredje och sista avsnittet av dokumentärserien, som släpps nästa vecka, utlovas fler avslöjanden om kulturen på skolan. Samtidigt fortsätter debatten om Lundsbergs framtid och om internatskolan ska få fortsätta bedriva undervisning.", "link": "https://www.tv4.se/artikel/7ktvIYZBlmQEZLttiT8EEi/svt-s-granskning-av-lundsberg-anmaeld", "date_display": "2026-05-20", "date_iso": "2026-05-20T17:07:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/lundsbergs-skola", "/mobbning", "/svt", "/granskning", "/tystnadskultur"]}, {"id": 145, "title": "Mc-top is shot with eight shots - teenager from Sweden is singled out", "summary": "It was at the end of December last year that the 17-year-old, a Syrian citizen, went from the south of Sweden to Cologne, Germany, to carry out the murder mission at the top of the motorcycle within the Hells Angels.\n\nAt the central station in the city, he rented a Volkswagen, and obtained the firearm that was to be used at the time of the murder.  Shot through the windshield Later that evening, the target drove his car, an Audi RS 3, and parked next to his home just before midnight. Dressed in a dark cap and a black hoodie, the suspected shooter waited for the target to come home.\n\nThe target remained in the car and called three people via Whatsapp video call talking about a car purchase when the shooter suddenly appeared and shot him eight times through the windshield.\n\nThe shot hit the motorcycle top in the head, neck and chest, in the right arm and in the hand. But he survived. European Arrest Warrant The shooter is said to have then run from the scene to the rental car, which he had parked nearby, and fled.\n\nThe German police issued a European arrest warrant to have the teenager handed over from Sweden. On Sunday, he was handed over to Germany.\n\nThe teenager has lived in Sweden for over ten years and had a job at a cleaning company.  He denies any wrongdoing. \"Since 5 months ago, I have been missing a residence permit and passport, in practice I would not have been able to travel there,\" the boy stated in the interrogation.  Placed on the death list Plans to eliminate the Hells Angels top were also in place in mid-October of the same year. But after tips from the Swedish police, another Swedish teenage boy could be arrested in a room he had rented. In connection with the arrest, weapons and ammunition were seized. According to the German prosecutor's office, the Swedish boy should have offered his services as a contract killer via social media, for payment - hired by an as yet unknown person to shoot the motorcycle top in Cologne. According to the German media, the biker must have been on a death list for a long time. At one point, he allegedly told the police that someone plac", "title_original": "Mc-topp sköts med åtta skott – tonåring från Sverige pekas ut", "summary_original": "Det var i slutet av december förra året som 17-åringen, en syrisk medborgare, åkte från södra Sverige till tyska Köln för att utföra morduppdraget på mc-toppen inom Hells Angels.\n\nPå centralstationen i staden hyrde han en Volkswagen, och skaffade sig skjutpvapnet som skulle användas vid mordtillfället.  Sköts genom vindrutan Senare samma kväll körde måltavlan sin bil, en Audi RS 3, och parkerade intill sin bostad strax före midnatt. Klädd i en mörk keps och en svart huvtröja väntade den misstänkta skytten på att måltavlan skulle komma hem.\n\nMåltavlan satt kvar i bilen och ringde upp tre personer via ett videosamtal på Whatsapp och pratade om ett bilköp när skytten plötsligt dök upp och sköt honom med åtta skott genom vindrutan.\n\nSkotten träffade mc-toppen i huvudet, halsen och bröstet, i högerarmen och i handen. Men han överlevde. Europeisk arresteringsorder Skytten ska därefter ha sprungit från platsen till hyrbilen, som han hade parkerat i närheten, och flytt.\n\nDen tyska polisen utfärdade en europeisk arresteringsorder för att få tonåringen överlämnad från Sverige. Under söndagen överlämnades han till Tyskland.\n\nTonåringen har varit bosatt i Sverige i över tio år och haft en anställning på en städfirma.  Han nekar till brott. ”Sedan 5 månader tillbaka saknar jag uppehållstillstånd och pass, i praktiken hade jag inte kunnat resa dit”, uppger  pojken i förhör.  Stått på dödslistan Planer på att eliminera Hells Angels-toppen fanns även i mitten av oktober samma år. Men efter tips från svensk polis kunde en annan svensk tonårspojke gripas i ett rum som han hade hyrt. I samband med gripandet beslagtogs vapen och ammunition. Enligt den tyska åklagarmyndigheten ska den svenska pojken ha erbjudit sina tjänster som kontraktsmördare via sociala medier, mot betalning – anlitad av en ännu okänd person för att skjuta mc-toppen i Köln. Enligt tyska medier ska mc-toppen ha stått på en dödslista under en längre tid. Vid ett tillfälle ska han ha berättat för polisen att någon placerat tre förbrukade patronhylsor på hans vindruta. Kopplas till ”Tartarus” Målet kopplas också till den internationellt efterlyste Dante Peykar, 41. Han är sedan tidigare häktad i sin utevaro misstänkt för inblandning i mordförsök i ”Sverige, Tyskland och på okänd plats”, enligt åklagaren.  41-åringen misstänks även ligga bakom aliaset ”Tartarus”, som ska ha orkestrerat fler mord, bland annat på Irankännaren Arvin Khoshnood.  Sedan i förra veckan finns 41-åringen, som är iransk och svensk medborgare, även på Europols ”most wanted”-lista över efterlysta personer.  Enligt uppgifter till Expressen befinner han sig i Iran.", "link": "https://www.tv4.se/artikel/58ZgN6HqzpCfKwMfOrr5Jj/mc-topp-skoets-med-atta-skott-tonaring-fran-sverige-pekas-ut", "date_display": "2026-05-20", "date_iso": "2026-05-20T16:55:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/hells-angels", "/mordforsok"]}, {"id": 146, "title": "The incident at the abortion vote is described as an answer to prayer", "summary": "The Riksdag members did not have to declare their color and vote", "title_original": "Händelsen vid omröstningen om abort beskrivs som ett bönesvar", "summary_original": "Riksdagsledamöterna behövde inte bekänna färg och rösta", "link": "https://www.dagen.se/nyheter/haendelsen-vid-omroestningen-om-abort-beskrivs-som-ett-boenesvar/10355903", "date_display": "2026-05-20", "date_iso": "2026-05-20T15:27:28+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 147, "title": "Malmö resident Matilda: \"The whole house started swaying sideways\"", "summary": "An earthquake with a magnitude of 3.9 has occurred at Køge, southwest of Copenhagen. The tremors are said to have been felt in the capital area and Roskilde. - It is a relatively large earthquake. It is rare for earthquakes of this magnitude in Denmark. This has not been seen for many years, says Björn Lund, senior lecturer in seismology at the Department of Geosciences at Uppsala University.  The earthquake occurred at 16:14 and Björn Lund must have seen it in real time. - We receive data from all over the world. I was sitting and looking at the screen just when it happened and then realized that something big had happened, he tells TV4 Nyheterna. Felt in Sweden: \"Extremely uncomfortable\" The shaking was also felt in Sweden. - I had just come home from work and laid down on the sofa when the whole house started rocking sideways for like ten seconds, says Matilda Dock, who lives in Malmö. She lives on the third floor of a five-story building in Limhamn, right by the Öresund Bridge. - It was very unpleasant and I didn't really understand what happened, says Matilda Dock. No injuries related to the quake have yet been reported.", "title_original": "Malmöbon Matilda: ”Hela huset började gunga i sidled”", "summary_original": "En jordbävning med magnituden 3,9 har inträffat vid Køge, sydväst om Köpenhamn. Skakningarna uppges ha känts Huvudstadsområdet och Roskilde. – Det är ett relativt stort skalv. Det är sällsynt med så här stora skalv i Danmark. Det har man inte sett på många år, säger Björn Lund, universitetslektor i seismologi vid Institutionen för geovetenskaper vid Uppsala universitet.  Skalvet inträffade klockan 16.14 och Björn Lund ska ha sett det i realtid. – Vi får in data från hela världen. Jag satt och tittade på skärmen precis när det hände och insåg då att något stort hade inträffat, säger han till TV4 Nyheterna. Kändes i Sverige: ”Jätteobehagligt” Skalvet kändes även i Sverige. – Jag hade precis kommit hem från jobbet och lagt mig i soffan när hela huset började gunga i sidled i typ tio sekunder, säger Matilda Dock som bor i Malmö. Hon bor på tredje våningen i ett femvåningshus på Limhamn, precis vid Öresundsbron. – Det var jätteobehagligt och jag fattade inte riktigt vad som hände, säger Matilda Dock. Det har ännu inte rapporterats om några skador kopplade till skalvet.", "link": "https://www.tv4.se/artikel/2YbSK2bwOSPo1eqewhEZnE/jordskalv-i-danmark-kaendes-i-malmoe", "date_display": "2026-05-20", "date_iso": "2026-05-20T14:47:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/danmark", "/jordskalv"]}, {"id": 148, "title": "The \"Aktuellt\" manager is leaving SVT", "summary": "Program manager Michael Kucera is leaving SVT, Journalisten reports. He is responsible for SVT Nyheter's community programs, such as \"Agenda\" and \"Aktuellt\". He has worked at SVT for almost 30 years and will now be one of the 85 employees who applied for and were granted a resignation offer in connection with the channel's cutbacks. Agenda's project manager Kajsa Gudmundson is also leaving. - Both Michael and Kajsa have done fantastic work at SVT. They are two highly valued managers with skillful and publicistically courageous leadership, says Anna Careborg, news and sports director at SVT, in a comment to SVT. Will \"start their own\" Michael Kucera tells Journalisten that he and Kajsa Gudmundson will now \"start their own\" together, but what type of business it will be is still unclear. - This is a decision that came very quickly, he tells the newspaper. In the past, several SVT profiles have chosen to leave the channel in connection with the savings package - Morgonstudio's Karin Magnusson, Ukraina corren Bengt Norborg and Kulturprofilen Kristofer Lundström are a few. Melodifestivalen's project manager Anders Wistbacka has also chosen to leave.", "title_original": "”Aktuellt”-chefen lämnar SVT", "summary_original": "Programchefen Michael Kucera lämnar SVT, rapporterar Journalisten. Han är ansvarig för SVT Nyheters samhällsprogram, så som ”Agenda” och ”Aktuellt”. Han har jobbat på SVT i nästan 30 år och blir nu en av de 85 anställda som sökt och beviljats ett avgångserbjudande i samband med kanalens nedskärningar. Även Agendas projektledare Kajsa Gudmundson lämnar. – Både Michael och Kajsa har gjort ett fantastiskt arbete på SVT. De är två mycket uppskattade chefer med ett skickligt och publicistiskt modigt ledarskap, säger Anna Careborg, nyhets- och sportdirektör på SVT, säger i en kommentar till SVT. Kommer ”starta eget” Michael Kucera uppger för Journalisten att han och Kajsa Gudmundson nu kommer att ”starta eget” tillsammans, men vad det blir för typ av verksamhet är ännu oklart. – Det här är ett beslut som kom väldigt hastigt, säger han till tidningen. Sedan tidigare har flera SVT-profiler valt att lämna kanalen i samband med sparpaketet – Morgonstudions Karin Magnusson, Ukraina-korren Bengt Norborg och Kulturprofilen Kristofer Lundström är några. Även Melodifestivalens projektledare Anders Wistbacka har valt att lämna.", "link": "https://www.tv4.se/artikel/5ID3BlVG5Rt4X3W7N9GTUC/aennu-ett-svt-avhopp", "date_display": "2026-05-20", "date_iso": "2026-05-20T14:06:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/noje", "/tv", "/svt", "/svt-varslet"]}, {"id": 149, "title": "Putin in China with hat in hand - is looking for three things", "summary": "Dixelius on the meeting between the world leaders: \"The Chinese can bargain\"", "title_original": "Putin i Kina med mössan i hand – är ute efter tre saker", "summary_original": "Dixelius om mötet mellan världsledarna: ”Kineserna kan pruta”", "link": "https://www.tv4.se/artikel/1eG7ePcD2zClQmPR5GYxSv/putin-i-kina-med-moessan-i-hand-aer-ute-efter-tre-saker", "date_display": "2026-05-20", "date_iso": "2026-05-20T13:11:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 150, "title": "They prayed the Our Father inside the Riksdag during the debate on abortion in the constitution", "summary": "'For me, the direction is that we need to have a prayer work and more clearly stand up for creation.'", "title_original": "De bad Fader vår inne i riksdagen under debatt om abort i grundlagen", "summary_original": "'För mig är inriktningen att vi behöver ha ett bönearbete och tydligare stå upp för skapelsen.'", "link": "https://www.dagen.se/nyheter/de-bad-fader-var-inne-i-riksdagen-under-debatt-om-abort-i-grundlagen/10354802", "date_display": "2026-05-20", "date_iso": "2026-05-20T13:07:16+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 151, "title": "Had sex in the Kärlekstunneln at Gröna lund - now the couple is sentenced", "summary": "It was in August 2025 that the man and woman started making out on their way into the Tunnel of Love, and once inside they had completed sex. Staff watched the whole process through camera surveillance and urged the couple to stop several times over the public address system. - The woman sits from the first camera to the end and rides the man. In one of the last camera angles, she stands up and I then see both of their genitals, says the female attraction host in questioning. In the boat behind the couple was a family with children. - They were really close to their boat. There is a little less than half a meter between the boats, says the attraction owner. Family with children sitting behind After the ride, the couple were taken care of by guards and taken away. The woman admits during questioning that they had sex, but says that they were not told to stop and that they did it when no one was looking.  - My thought was that no one saw us and that we did something secretly. I had a thought that these cameras would arrive after a while, so we wanted to hurry before we arrived, in the dark where no one sees us, says the woman in questioning. Now they are both sentenced for outrageous behavior. The woman must pay a fine and the man, who is also convicted of an attempted burglary, will be jailed for six months, according to the news agency Siren.", "title_original": "Hade sex i Kärlekstunneln på Gröna lund – nu döms paret", "summary_original": "Det var i augusti 2025 som mannen och kvinnan började hångla på väg in i Kärlekstunneln, och väl inne hade de fullbordat sex. Personal såg hela förloppet genom kameraövervakning och uppmanade paret att sluta flera gånger via högtalarsystemet. – Kvinnan sitter från den första kameran till slutet och rider mannen. I en av de sista kameravinklarna reser hon sig upp och jag ser då båda deras könsorgan, säger den kvinnliga attraktionsvärden i förhör. I båten bakom paret satt en barnfamilj. – De var riktigt nära deras båt. Det är lite mindre än en halv meter mellan båtarna, säger attraktionsvärden. Barnfamilj satt bakom Efter åkturen blev paret omhändertagna av vakter och fördes bort. Kvinnan erkänner i förhör att de hade sex, men menar att de inte blev tillsagda att sluta och att de gjorde det i när ingen såg.  – Min tanke var att ingen såg oss och att vi gjorde något i smyg. Jag hade en tanke på att dessa kameror skulle komma efter ett tag, så vi ville skynda innan vi kom, i mörkret där ingen ser oss, säger kvinnan i förhör. Nu döms de båda för förargelseväckande beteende. Kvinnan ska betala böter och mannen, som även döms för ett inbrottsförsök, får sex månaders fängelse, uppger nyhetsbyrån Siren.", "link": "https://www.tv4.se/artikel/3vCYL8ST6fHDFMyJk6F79z/par-hade-sex-i-kaerlekstunneln-doems", "date_display": "2026-05-20", "date_iso": "2026-05-20T12:55:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/grona-lund"]}, {"id": 152, "title": "Founded Yes till life - votes to include the right to abortion in the constitution", "summary": "KD's Mikael Oscarsson openly protested the decision but explained in the Riksdag debate why he will still vote yes to the proposal.", "title_original": "Grundade Ja till livet – röstar för att skriva in aborträtten i grundlagen", "summary_original": "KD:s Mikael Oscarsson protesterade öppet mot beslutet men förklarade i riksdagsdebatten varför han ändå kommer att rösta ja till förslaget.", "link": "https://www.dagen.se/nyheter/grundade-ja-till-livet-roestar-foer-att-skriva-in-abortraetten-i-grundlagen/10354128", "date_display": "2026-05-20", "date_iso": "2026-05-20T12:12:25+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 153, "title": "After the accusations on British television - this is what SVT thinks: \"Disgusting\"", "summary": "Due to the fact that two female participants in a recently released BBC documentary testified that there must have been sexual abuse during the filming of the British version of \"Married at First Sight\", SVT chooses to \"sharpen its eyes further\" before the upcoming recording this summer. - The point is that these are not new questions for us. This is sort of our top priority and has been for many years. But it's clear that when we hear about this, it's damn nasty, says SVT's program director Charles Franz to TV4 Nyheterna. Always worked with consent The dating program, where participants marry a stranger the first time they meet, is, according to Charles Franz, a delicate experiment in which the participants surrender completely to the production in the hope of finding love. - They must be taken care of from all aspects. So this is a constant discussion, not least safety, he says. Consent is clearly described in the participation agreements and the questions are something SVT works with every year right from the casting and throughout the production, and is in contact with most participants long afterwards to follow up that everyone is doing well. SVT's program manager does not comment further on the production or the incident in Great Britain, but says that it should always feel safe to apply for the program in Sweden. - We do everything to take care of our participants. \"Are we sharpening our eyes further\" Charles Franz is also asked if there are any guarantees that Swedish participants do not have to worry about sexual abuse. - So it must not happen, but there are no guarantees and therefore it is necessary to work on this all the time. Have you taken any special security measures for future recordings? - No, we have very clear measures in place already. But it is clear that when something like this comes up, we sharpen our eyes even more. No one is unaffected by such nasty things.", "title_original": "Efter anklagelserna i brittisk tv – så tänker SVT: ”Otäckt”", "summary_original": "Med anledning av att två kvinnliga deltagare i en nyligen släppt BBC-dokumentär vittnar om att det ska ha förekommit sexuella övergrep under inspelningen av den brittiska version av ”Gift vid första ögonkastet” väljer SVT att ”vässa blicken ytterligare” inför den kommande inspelningen i sommar. – Grejen är att det här är inga nya frågor för oss. Det här är liksom vår topprioritet och har varit det i många år. Men det är klart att när vi tar del av det här så är det jävligt otäckt, säger SVT:s programchef Charles Franz till TV4 Nyheterna. Arbetas hela tiden med samtycke Dejtingprogrammet, där deltagare gifter sig med en främling första gången de ses, är enligt Charles Franz ett delikat experiment där deltagarna överlämnar sig helt till produktionen i hopp om att hitta kärleken. – De måste tas om hand om ur alla aspekter. Så det här är ständigt en diskussion, inte minst säkerheten, säger han. Samtycke beskrivs tydligt i medverkandeavtalen och frågorna är något SVT arbetar med varje år redan från castingen och genom hela produktionen, och har kontakt med de flesta deltagare långt efteråt för att följa upp att alla mår bra. SVT:s programchef kommenterar inte produktionen eller händelsen i Storbritannien vidare, men säger att det alltid ska kännas tryggt att söka till programmet i Sverige. – Vi gör allt för att ta hand om våra deltagare. ”Vässar vi blicken ytterliggare” Charles Franz får också frågan om det finns några garantier för att svenska deltagare inte behöver oroa sig för sexuella övergrepp. – Alltså det får ju inte ske men det finns inga garantier och därför gäller det att jobba med det här hela tiden. Har ni vidtagit några särskilda säkerhetsåtgärder inför framtida inspelningar? – Nej, vi har väldigt tydliga åtgärder på plats redan. Men det är klart att när en sådan här grej kommer upp så vässar vi blicken ytterligare. Ingen är oberörd av såna här otäcka saker.", "link": "https://www.tv4.se/artikel/44EjralunQQE2UYK3t0VOH/efter-anklagelserna-i-brittisk-tv-sa-taenker-svt-otaeckt", "date_display": "2026-05-20", "date_iso": "2026-05-20T11:34:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/gift-vid-forsta-ogonkastet", "/svt"]}, {"id": 154, "title": "Torpedo's escape after the murders - ends in gun drama in car garage", "summary": "At the beginning of September, two men were found dead in a car in the Lunden district of Gothenburg. The men had been shot with two shots each and were found by members of the public. - There are two clean executions, says prosecutor Karin Lindell. According to the prosecution, one of the men was shot in the back of the head with two shots. The other man was hit in the neck and forehead. - They were found by the public in the car in which they were shot. The shots were fired from behind or obliquely from behind, says Karin Lindell. Chosen an adult Norwegian instead of a \"young lad\" The police and the prosecutor believe that the double murder can be linked to the ongoing gang conflict in the district of Biskopsgården. The conflict has been going on for a long time between those who are usually called the southern or northern Bishops' Garden. According to the investigation, the two men who were shot to death are considered to be connected to the north side.  The prosecutor today filed charges against a 35-year-old Norwegian man, who is said to have traveled to Sweden after he undertook the murder mission.  - I mean that he has been given a mission, that he is simply a torpedo, says Karin Lindell. At the same time, she highlights that the age of the accused man in this case stands out.  - Instead of hiring young guys, as is often the case in these cases, a Norwegian adult man has been given this assignment, says Karin Lindell. Flee to Norway – pulled a gun on the police The day after the double murder, a 35-year-old Norwegian man was arrested in a parking garage in Oslo. He is said to have driven past the customs control at Svinesund, on the border between Sweden and Norway.  The Norwegian police tried to control the car, then the man drove into a parking garage.  - He crossed the border and a police chase begins. When he goes into a garage in connection with the arrest, he threatens a police officer with the same weapon he had before, says Karin Lindell. There were surveillance cameras in the parking garage that captured the entire incident. The 35-year-old arrived in a car, half masked. With a bag over his shoulder and a gun in his hand, he continued on foot in the parking garage - then he met a", "title_original": "Torpedens flykt efter morden – slutar i pistoldrama i bilgarage", "summary_original": "I början på september hittades två män döda i en bil i stadsdelen Lunden i Göteborg. Männen hade blivit skjutna med två skott var och hittades av allmänheten. – Det är två rena avrättningar, säger åklagaren Karin Lindell. Enligt åtalet blev en av männen skjuten i bakhuvudet med två skott. Den andra mannen blev träffad i halsen och pannan. – De hittades av allmänheten i bilen som de blev skjutna i. Skotten avlossades bakifrån eller snett bakifrån, säger Karin Lindell. Valde en vuxen norrman istället för en ”ung grabb” Polisen och åklagaren menar att dubbelmordet kan koppas till den pågående gängkonflikten i stadsdelen Biskopsgården. Konflikten har pågått under en längre tid mellan de som brukar kallas södra eller norra Biskopsgården. Enligt utredningen bedöms de två männen som sköts till döds ha koppling till den norra sidan.  Åklagaren väckte i dag åtal mot en 35-årig norsk man, som ska ha rest till Sverige efter att han åtagit sig morduppdraget.  – Jag menar att han har fått ett uppdrag, att han är en torped helt enkelt, säger Karin Lindell. Samtidigt lyfter hon att åldern på den åtalade mannen i detta fall sticker ut.  – I stället för att anlita unga grabbar som det ofta är i de här fallen så har en norsk vuxen man fått det här uppdraget, säger Karin Lindell. Flydde till Norge – drog pistol mot polis Dagen efter dubbelmordet greps en norsk 35-årig man i ett parkeringsgarage i Oslo. Han ska ha kört förbi tullens kontroll vid Svinesund, på gränsen mellan Sverige och Norge.  Den norska polisen försökte kontrollera bilen, då körde mannen in ett parkeringsgarage.  – Han åkte över gränsen och en polisjakt inleds. När han åker in i ett garage i samband med gripandet hotar han en polis med samma vapen som han haft tidigare, säger Karin Lindell. I parkeringshuset fanns övervakningskameror som fångade hela händelsen. 35-åringen anlände i en bil, halvt maskerad. Med en väska över axeln och en pistol i handen rörde han sig vidare till fots i parkeringshuset – då mötte han en polisman. De två männen drog då pistol mot varandra.  – Men det är inga skott som avlossas, säger Karin Lindell. 35-åringen gick sedan ner på knäna, sträckte ut sina armar och lade sig på golvet. Samtidigt riktade polismannen sitt vapen mot honom. Senare anlände en kollega som griper mannen och satte handfängsel på honom. Åtalas i Sverige för brott i Norge Rättegången är planerad att inledas i början av juni. 35-åringen står åtalad för två fall av mord, grovt vapenbrott och grovt hot mot tjänsteman. De två senare åtalspunkterna inträffade i Norge i samband med att han greps i garaget.   Initialt frihetsberövades han i Norge för brotten i Oslo, men överlämnades till Sverige i oktober förra året. – Jag har övertagit lagföringen från Norge för att besluta om det, säger Karin Lindell.", "link": "https://www.tv4.se/artikel/3YaYtDBzWRzk7lzO2hiXjO/torpedens-flykt-efter-morden-slutar-i-pistoldrama-i-bilgarage", "date_display": "2026-05-20", "date_iso": "2026-05-20T11:09:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/goteborg", "/norge", "/biskopsgarden-goteborg"]}, {"id": 155, "title": "I'm the Foreign Minister of Sweden. Don't Overestimate Russia.", "summary": "Opinion piece by Minister for Foreign Affairs Maria Malmer Stenergard in The New York Times, 20 May 2026.", "title_original": "I'm the Foreign Minister of Sweden. Don't Overestimate Russia.", "summary_original": "Opinion piece by Minister for Foreign Affairs Maria Malmer Stenergard in The New York Times, 20 May 2026.", "link": "https://www.government.se/opinion-pieces/2026/05/im-the-foreign-minister-of-sweden.-dont-overestimate-russia", "date_display": "2026-05-20", "date_iso": "2026-05-20T10:07:35+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Opinion piece", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}, {"id": 156, "title": "S bleeds to the left – but completely according to plan", "summary": "The Left Party and the Green Party have reason to take the weekend a little earlier this week. The parties are growing steadily in TV4/Novu's latest opinion poll. The increase is statistically guaranteed. Forward with cooperatively produced cava from the wind powered wine cooler! At the same time, the Social Democrats lose 1.5 percentage points, to a large extent it is precisely the V and the MP that get voters from the S. Recently, both the V and the MP have gone hard with proposals about the billionaire tax and have taken the debate on wallet issues and energy issues in the shadow of the Iran war. The fact that the Social Democrats are now, in principle, back at the same level as the 2022 election results (30.9 in the latest survey – 30.3 in the 2022 election) can at first glance give cause for major concern for the S strategists. But not. Should not maximize votes The Social Democrats should not maximize votes. S must pick voters over the block boundary. Preferably from the Moderates. To be able to do that, the party needs to attract voters who are in the middle, leaning slightly to the right. The Social Democrats will therefore not want to speak so loudly about tax increases. It is also the reason why no one hears the S-profile Lawen Redar talk about the need to mix the population by building rental properties in residential areas anymore. This scares off the very voters who, according to wise people in S and M, will decide the election.\nThat S then bleeds to the left is completely according to plan. S loses voters who want that \"dangerous left turn\" that Ulf Kristersson & co warn of, but instead picks up middle voters who are not attracted by Jimmie Åkesson, even stricter migration policy and who feel that the economy is probably not doing as well as Elisabeth Svantesson claims. No warning lights flashing S's ability to attract voters from M provides a net addition to the opposition as a whole. Then it is even welcome for S part that voters take their pick and pack and go to V and MP. The Social Democrats do not need to stop the bleeding to the left as long as fresh blood flows in from the center.\nRight now none are blinking", "title_original": "S blöder vänsterut – men helt enligt planen", "summary_original": "Vänsterpartiet och Miljöpartiet har anledning att ta helg lite tidigare den här veckan. Partierna växer ordentligt i TV4/Novus senaste opinionsmätning. Ökningen är statistiskt säkerställd. Fram med kooperativ-producerade cavan ur vinkylen som drivs av vindkraft! Samtidigt tappar Socialdemokraterna 1,5 procentenheter, till stor del är det just V och MP som hämtar väljare ur S. Den senaste tiden har både V och MP gått ut hårt med utspel om miljardärskatt och tagit debatten om plånboksfrågor och energifrågor i skuggan av Irankriget. Att Socialdemokraterna nu, i princip, är tillbaka på samma nivå som valresultatet 2022 (30,9 i senaste mätningen – 30,3 i valet 2022) kan vid en första anblick ge anledning till huvudbry för S-strategerna. Men icke. Ska inte röstmaximera Socialdemokraterna ska inte röstmaximera. S ska plocka väljare över blockgränsen. Gärna från Moderaterna. För att kunna göra det behöver partiet locka väljare som befinner sig i mitten, med lutning svagt åt höger. Socialdemokraterna kommer därför inte att vilja tala så högt om skattehöjningar. Det är också orsaken till att ingen längre hör S-profilen Lawen Redar tala om behovet av att blanda befolkningen genom att bygga hyresrätter i villaområden. Sådant skrämmer bort just de väljare som enligt kloka personer i S och M kommer att avgöra valet.\nAtt S då blöder vänsterut är helt enligt plan. S tappar väljare som vill ha den där ”farliga vänstersvängen” som Ulf Kristersson & co varnar för, men plockar i stället hem mittenväljare som inte lockas av Jimmie Åkesson, ännu stramare migrationspolitik och som känner att ekonomin nog inte går så bra som Elisabeth Svantesson påstår. Inga varningslampor blinkar S förmåga att locka väljare från M ger ett nettotillskott till oppositionen som helhet. Då är det till och med välkommet för S del att väljare tar sitt pick och pack och går till V och MP. Socialdemokraterna behöver inte stoppa blödningen vänsterut så länge friskt blod flödar in från mitten.\nJust nu blinkar inga varningslampor på Sveavägen 68.", "link": "https://www.tv4.se/artikel/4zlDSEinc48qTUWBgWGTQ2/bloeder-vaeljare-vaensterut-men-helt-enligt-s-planen", "date_display": "2026-05-20", "date_iso": "2026-05-20T09:28:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/politik", "/novus", "/valet-2022/socialdemokraterna"]}, {"id": 157, "title": "The test revealed a 100 percent DNA match: \"I was completely shocked\"", "summary": "A dna test shows that Jessica Ritzén and her sister Susan are identical identical twins - not fraternal twins as they were told at birth in 1970. - For me, it was like the coin fell. We are not super identical, but still more alike than ordinary siblings. I was very happy. It felt like something fell into place, says Susan Ritzén. It also became emotional for big sister Jessica, who was born eight minutes before Susan. - I was completely shocked. I started to cry. I was overjoyed, but I could also feel: Why haven't I been told this before? Stronger together - and apart They grew up believing they were fraternal twins and therefore no more alike than ordinary siblings. When the dna test showed that they are identical, it changed a lot. - If I had known that we were identical twins, I would not have limited myself and thought that \"Susan is good at painting\". Then I thought: \"If she can, I can.\" I think that is a strength today, says Jessica. The discovery has made her feel stronger both in herself and in her twinship. - I can feel that we are much, much stronger, but also that I am much stronger. Just to know. Very strange. Like I know myself better. \"On the same wavelength\" Little sister Susan feels that Jessica now embraces twinhood in a new way. - In some way, Jessica has resisted and thought it was silly. When we were younger there were two twin boys who were quite cute. Then I said we could go on a twin date. It was the most ridiculous thing she had ever heard, says Susan. Both feel that the relationship has changed. - Jessica has come closer. You are not so opposite in all things to do with twins. - I actually like you more. It's really weird. Maybe because you are like me now? Jessica says. - I've always felt that I love you more than you love me, but now I think we're on the same wavelength, says Susan.", "title_original": "Testet avslöjade 100 procent dna-match: ”Blev helt chockad”", "summary_original": "Ett dna-test visar att Jessica Ritzén och systern Susan är identiska enäggstvillingar – inte tvåäggstvillingar som de fick veta vid födseln 1970. – För mig var det som att polletten trillade ner. Vi är inte superidentiska, men ändå mer lika än vanliga syskon. Jag blev jätteglad. Det kändes som att något föll på plats, säger Susan Ritzén. Det blev känslosamt även för storasyster Jessica, som föddes åtta minuter före Susan. – Jag blev helt chockad. Jag började gråta. Jag blev jätteglad, men jag kunde också känna: Varför har jag inte fått veta det här tidigare? Starkare ihop – och isär De växte upp i tron att de var tvåäggstvillingar och därmed inte mer lika än vanliga syskon. När dna-testet visade att de är identiska förändrade det mycket. – Hade jag vetat att vi var enäggstvillingar hade jag inte begränsat mig och tänkt att ”Susan är duktig på att måla”. Då hade jag tänkt: ”Kan hon, så kan väl jag.” Det tycker jag är en styrka i dag, säger Jessica. Upptäckten har gjort att hon känner sig starkare både i sig själv och i tvillingskapet. – Jag kan känna att vi:et är väldigt mycket starkare, men också att jag är mycket starkare. Bara av att få veta. Jättekonstigt. Som att jag känner mig själv bättre. ”På samma våglängd” Lillasyster Susan upplever att Jessica nu omfamnar tvillingskapet på ett nytt sätt. – På något sätt har Jessica hållit emot och tyckt att det har varit fånigt. När vi var yngre fanns det två tvillingkillar som var ganska söta. Då sa jag att vi kunde gå på tvillingdejt. Det var det löjligaste hon hade hört, säger Susan. Båda känner att relationen har förändrats. – Jessica har kommit närmare. Du är inte så motvalls i allt som har med tvillingar att göra. – Jag tycker faktiskt om dig mer. Det är jättekonstigt. Kanske för att du är som jag nu? säger Jessica. – Jag har alltid känt att jag älskar dig mer än vad du älskar mig, men nu tror jag att vi är på samma våglängd, säger Susan.", "link": "https://www.tv4.se/artikel/52R6SqZpi46i77dD1vm0pJ/testet-avsloejade-100-procent-dna-match-blev-helt-chockad", "date_display": "2026-05-20", "date_iso": "2026-05-20T09:20:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/livsoden", "/familj"]}, {"id": 158, "title": "The foreign minister's words about Putin - warns the US the day before the NATO meeting", "summary": "Foreign Minister Maria Malmer Stenergard (M) has published a column in the New York Times with the headline \"I am Sweden's foreign minister. Russia's economy is more vulnerable than it seems\". In the New York Times text, she writes that the Swedish government commissioned several studies that show that Russia has been affected by sanctions, contrary to what they say. \"Must not overestimate\" \"We cannot afford to underestimate Russia's strength and ability to harm Ukraine and NATO allies, for example by sharing information with Iran, but we must not overestimate it either,\" she writes in the column. Stenergard writes that the Russians claim that their economy grew by 13 percent between 2020 and 2024, but that Swedish data show that it instead declined by approximately 8 percent. At the end of the text, she reminds that Russia's economy is smaller than Texas. \"Continuing pressure on Russia is the best way to get Mr. Putin to participate in serious peace negotiations,\" she writes. NATO meeting on Friday The text comes the day before a major NATO meeting in Helsingborg, where the alliance's foreign ministers, including the US's ditto Marco Rubio, will participate. It will be the first major NATO meeting that Sweden hosts.", "title_original": "Utrikesministerns ord om Putin – varnar USA dagen före Natomötet", "summary_original": "Utrikesminister Maria Malmer Stenergard (M) har publicerat en kolumn i New York Times med rubriken ”Jag är Sveriges utrikesminister. Rysslands ekonomi är sårbarare än det verkar”. I New York Times-texten skriver hon att den svenska regeringen tillsatt flera undersökningar som visar att Ryssland påverkats av sanktioner, till skillnad från vad de säger. ”Får inte överskatta” ”Vi har inte råd att underskatta Rysslands styrka och förmåga att skada Ukraina och Natoallierade, exempelvis genom att dela information med Iran, men vi får inte överskatta den heller”, skriver hon i kolumnen. Stenergard skriver att ryssarna hävdar att deras ekonomi växt med 13 procent mellan 2020 och 2024, men att svensk data visar att den istället backat med ungefär 8 procent. I slutet av texten påminner hon om att Rysslands ekonomi är mindre än Texas. ”Att fortsätta pressa Ryssland är det bästa sättet att få Mr. Putin att delta i seriösa fredsförhandlingar”, skriver hon. Natomöte på fredagen Texten kommer dagen före ett stort Natomöte i Helsingborg, där alliansens utrikesministrar, inklusive USA:s dito Marco Rubio, ska delta. Det blir det första stora Natomötet som Sverige är värd för.", "link": "https://www.tv4.se/artikel/5YIpNIp5QxLDdVVilU9oWQ/utrikesministerns-ord-om-putin-varnar-usa-dagen-foere-natomoetet", "date_display": "2026-05-20", "date_iso": "2026-05-20T07:44:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/politik", "/maria-malmer-stenergard", "/usa", "/ryssland", "/ukrainakonflikten"]}, {"id": 159, "title": "Putin's unexpected actions - during the visit: \"Feels like three autumns\"", "summary": "Hailed Xi Jinping - quoted Chinese poetry", "title_original": "Putins oväntade utspel – under besöket: ”Känns som tre höstar”", "summary_original": "Hyllade Xi Jinping – citerade kinesisk poesi", "link": "https://www.tv4.se/artikel/6CqLMmNXYj6YZwEWRxzSl4/putin-hyllar-samarbetet-med-kina", "date_display": "2026-05-20", "date_iso": "2026-05-20T04:35:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 160, "title": "\"It suddenly felt terrible that I was going to pour water on the ants\"", "summary": "Klara Härgestam has deepened her faith in God through her research on the forest", "title_original": "”Det kändes plötsligt hemskt att jag skulle hälla vatten på myrorna”", "summary_original": "Klara Härgestam har fördjupat sin gudstro genom sin forskning om skogen", "link": "https://www.dagen.se/familj/det-kaendes-ploetsligt-hemskt-att-jag-skulle-haella-vatten-pa-myrorna/10340402", "date_display": "2026-05-20", "date_iso": "2026-05-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Why should only one kind of religious experience be considered genuine?", "summary": "Tolerance and humility are a result of pluralism - but not the driving force, writes Dan Silfwerin in a concluding remark.", "title_original": "Varför ska endast en sorts religiösa upplevelser anses genuina?", "summary_original": "Tolerans och ödmjukhet är ett resultat av pluralismen – men inte den drivande kraften, skriver Dan Silfwerin i en slutreplik.", "link": "https://www.dagen.se/debatt/varfoer-ska-endast-en-sorts-religioesa-upplevelser-anses-genuina/10323551", "date_display": "2026-05-20", "date_iso": "2026-05-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "Dare we stop and seek the silence?", "summary": "In order to find direction and the way forward in a time like this - amidst all the statements, fak e was a shift in the focus of the legislation being negotiated in the European Commission’s European Grids Package.", "link": "https://www.government.se/press-releases/2026/05/government-moves-forward-with-assignment-on-international-power-cables/", "date_display": "2026-05-11", "date_iso": "2026-05-11T13:08:41+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "9 days old", "tags": ["Press release", "EU", "Ministry of Climate and Enterprise", "Energy", "Ebba Busch"]}, {"id": 189, "title": "Pål Jonson to take part in EU Foreign Affairs Council defence minister configuration", "summary": "On 12 May, EU defence ministers will meet in Brussels within the framework of the EU Foreign Affairs Council. Continued EU support to Ukraine, the situation in the Middle East and its implications for European defence and security, and strengthening European defence preparedness are on the agenda. Minister for Defence Pål Jonson will represent Sweden at the meeting.", "title_original": "Pål Jonson to take part in EU Foreign Affairs Council defence minister configuration", "summary_original": "On 12 May, EU defence ministers will meet in Brussels within the framework of the EU Foreign Affairs Council. Continued EU support to Ukraine, the situation in the Middle East and its implications for European defence and security, and strengthening European defence preparedness are on the agenda. Minister for Defence Pål Jonson will represent Sweden at the meeting.", "link": "https://www.government.se/press-releases/2026/05/pal-jonson-to-take-part-in-eu-foreign-affairs-council-defence-minister-configuration/", "date_display": "2026-05-11", "date_iso": "2026-05-11T10:04:21+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "10 days old", "tags": ["Press release", "EU", "Ministry of Defence", "Pål Jonson", "Military defence", "International defence cooperation"]}, {"id": 190, "title": "Prime Minister receives President of Germany Frank-Walter Steinmeier", "summary": "Germany is Sweden’s most important trading partner, and the world’s fourth-largest economy. On Wednesday 6 May, Prime Minister Ulf Kristersson received Germany’s Federal President Frank-Walter Steinmeier in Stockholm for a meeting on regional security policy, total defence and cooperation between Sweden and Germany.", "title_original": "Prime Minister receives President of Germany Frank-Walter Steinmeier", "summary_original": "Germany is Sweden’s most important trading partner, and the world’s fourth-largest economy. On Wednesday 6 May, Prime Minister Ulf Kristersson received Germany’s Federal President Frank-Walter Steinmeier in Stockholm for a meeting on regional security policy, total defence and cooperation between Sweden and Germany.", "link": "https://www.government.se/articles/2026/05/prime-minister-receives-president-of-germany-frank-walter-steinmeier/", "date_display": "2026-05-07", "date_iso": "2026-05-07T11:29:26+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "13 days old", "tags": ["EU", "Prime Minister's Office", "Economic policy", "Foreign and security policy", "Article", "Innovation", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Total defence", "Jessica Rosencrantz"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
