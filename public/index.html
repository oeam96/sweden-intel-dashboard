ll hans hotellrum. Hon säger att hon misstänker att hennes drink blev spetsad och att hon till följd av det förlorade kontrollen över sin kropp. – När jag kom fram till hans hotellrum var jag redan handlingsförlamad och kunde varken röra armarna eller kroppen. Han våldtog mig och strypte mig. Medan han strypte mig förlorade jag medvetandet och jag trodde att jag skulle dö, säger Drewes enligt The Guardian. Tidigare anklagelser mot Swalwell Tidigare har Ally Sammarco och Annika Albrecht trätt fram och berättat om sina anklagelser i CBS News. – Han trodde att han var oåtkomlig och att han kunde agera utan konsekvenser, säger Sammarco. Sammarco och Albrecht säger att deras mål inte bara varit att få Swalwell att lämna politiken, utan att han inte ska kunna skada fler. – För mig är rättvisa först uppnådd när han aldrig mer kan skada en kvinna och när han har fått ta konsekvenserna för de kvinnor han har skadat, säger Albrecht.", "link": "https://www.tv4.se/artikel/7coygbDeb6IFaULVUJAeDb/ny-anklagelse-mot-kongressman-flera-kvinnor-har-traett-fram", "date_display": "2026-04-14", "date_iso": "2026-04-14T20:51:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/politik", "/sexuella-trakasserier", "/sexuellt-ofredande", "/sexuella-overgrepp", "/sexualbrott", "/sexulbrott", "/sexuellt-vald", "/usa"]}, {"id": 124, "title": "The young centre-back sees himself: \"I make a far too weak effort\"", "summary": "GOTHENBURG. Sweden had a three-back line that played a total of seven national football matches. Then it became 1–0 to 1–2 in the WC qualifier against Denmark. A self-critical Elma Junttila Nelhage saws herself: - I'm making a far too weak effort.", "title_original": "Unga mittbacken sågar sig själv: ”Jag gör en alldeles för svag insats”", "summary_original": "GÖTEBORG. Sverige hade en trebackslinje som spelat totalt sju fotbollslandskamper. Då blev 1–0 till 1–2 i VM-kvalet mot Danmark. En självkritisk Elma Junttila Nelhage sågar sig själv: – Jag gör en alldeles för svag insats.", "link": "https://www.dn.se/sport/unga-mittbacken-sagar-sig-sjalv-jag-gor-en-alldeles-for-svag-insats/", "date_display": "2026-04-14", "date_iso": "2026-04-14T20:40:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Europe sketches on the Hormuz plan - without the US", "summary": "European countries sketch a plan for how a broad coalition of countries will secure ship traffic through the Strait of Hormuz. But one country is excluded from the plan: the United States, sources told The Wall Street Journal.", "title_original": "Europa skissar på Hormuzplan – utan USA", "summary_original": "Europeiska länder skissar på en plan för hur en bred koalition av länder ska säkra fartygstrafiken genom Hormuzsundet. Men ett land exkluderas från planen: USA, uppger källor för amerikanska The Wall Street Journal.", "link": "https://www.dn.se/varlden/europa-skissar-pa-hormuzplan-utan-usa/", "date_display": "2026-04-14", "date_iso": "2026-04-14T20:29:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Vera Herngren: \"Almost all our friends are children of divorce\"", "summary": "In SVT's new series \"Skilsmässobarn\" the bonus family's complex relationships are depicted, with old wounds and new roles. - It's exciting to see what a bonus family looks like when those who were children during the divorce are now adults, says Vera Herngren, who plays Alba and is one of the series' scriptwriters.", "title_original": "Vera Herngren: ”Nästan alla våra vänner är skilsmässobarn”", "summary_original": "I SVT:s nya serie ”Skilsmässobarn” skildras bonusfamiljens komplexa relationer, med gamla sår och nya roller. – Det är spännande att se hur en bonusfamilj ser ut när de som var barn under skilsmässan nu är vuxna, säger Vera Herngren, som spelar Alba och är en av seriens manusförfattare.", "link": "https://www.dn.se/kultur/vera-herngren-nastan-alla-vara-vanner-ar-skilsmassobarn/", "date_display": "2026-04-14", "date_iso": "2026-04-14T20:14:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The mother of the suspected murderer: \"The police executed my son\"", "summary": "It has been just over three months since 57-year-old Annica was killed in Boden. The crime, which took place on Christmas Day last year, received a lot of attention and shook the community.  The perpetrator must have come to the family's villa to buy an item via a sales site when he attacked. One of Annica's daughters was only able to alert the police after several hours - by then her mother had been murdered and her sister, who arrived later at the home, had been beaten.  One of the daughters was seriously injured and when the police arrived at the home a threatening situation arose, the perpetrator was shot dead by the police. The investigation against the police officers was dropped The actions of the police officers were investigated, but in January the prosecutor decided to drop the preliminary investigation. The two police officers were judged to have acted in emergency defense as the perpetrator allegedly attacked with a knife at close range.  Tiffany is the mother of the man who was shot dead by the police and is suspected of murdering Annica. According to Tiffany, her son was again committed to psychiatry in December, but was discharged before Christmas. - So it's so terrible, the whole process has left a deep mark on me, says Tiffany. \"The police executed my son\" The prosecutor has judged that the police acted in emergency defense because the perpetrator was armed with a knife. The preliminary autopsy report shows he was shot in the chest and neck.\n\nHe was shot from behind, in the neck. How do you feel about it?  - It is an execution. The police executed my son. It was clearly stated on the autopsy, a preliminary report. It was a preliminary report from the autopsy. It wasn't quite clear, says Tiffany. The prosecutor who investigated the actions of the police disagrees with Tiffany's description and believes that the case does not need to be investigated further. \n\n- They would protect themselves from serious, possibly fatal knife violence, says Deputy Chief Prosecutor Bengt Åsbäck at the Special Prosecutor's Chamber, which investigates the actions of police officers. How can it be self-defense if you shoot someone from behind?\n\n- It could be that the person has twisted in context", "title_original": "Mamman till misstänkte mördaren: ”Polisen avrättade min son”", "summary_original": "Det har gått drygt tre månader sedan 57-åriga Annica dödades i Boden. Dådet, som skedde på juldagen förra året, fick stor uppmärksamhet och skakade samhället.  Gärningsmannen ska ha kommit till familjens villa för att köpa en vara via en säljsajt när han gick till attack. En av Annicas döttrar kunde först larma polisen efter flera timmar – då hade hennes mamma mördats och hennes syster, som anlände senare till bostaden, blivit misshandlad.  En av döttrarna skadades allvarligt och när polisen kom till bostaden uppstod en hotfull situation, gärningsmannen sköts till döds av polisen. Utredningen mot poliserna lades ner Polisernas agerande utreddes, men i januari beslutade åklagaren att lägga ner förundersökningen. De två poliserna bedömdes ha agerat i nödvärn då gärningsmannen ska ha gått till attack med kniv på nära håll.  Tiffany är mamma till den man som sköts till döds av polisen och misstänks ha mördat Annica. Enligt Tiffany var hennes son återigen tvångsintagen inom psykiatrin i december, men skrevs ut före julhelgen. – Alltså det är så hemskt, hela förloppet har satt ett djupt spår i mig, säger Tiffany. ”Polisen avrättade min son” Åklagaren har bedömt att poliserna agerade i nödvärn eftersom gärningsmannen var knivbeväpnad. Den preliminära obduktionsrapporten visar att han sköts i bröst och nacke.\n\nHan sköts bakifrån, i nacken. Hur känner du kring det?  – Det är en avrättning. Polisen avrättade min son. Det stod tydligt på obduktionen, en preliminär rapport. Det var en preliminär rapport från obduktionen. Det var inte riktigt klart, säger Tiffany. Åklagaren som utrett polisernas agerande håller inte med om Tiffanys beskrivning och menar att fallet inte behöver utredas mer. \n\n– De skulle freda sig själva från ett allvarligt, kanske dödligt knivvåld, säger vice chefsåklagare Bengt Åsbäck vid särskilda åklagarkammaren som utreder polisers agerande. Hur kan det vara självförsvar om man skjuter någon bakifrån?\n\n– Det kan vara att personen har vridit sig i sammanhanget. Det är fullt möjligt. Det förändrar inte på något sätt min bedömning, säger Bengt Åsbäck. Tror mer vård hade kunnat göra skillnad Tiffany säger att hon har vänt sig till en advokat för att få klarhet i hur sonen dog. Hon säger också att hon önskar att han hade fått mer psykiatrisk vård.\n\n– Personen som skulle hjälpa honom trodde inte att det var så allvarligt. Jag flaggade att det var allvarligt. Hans hälsa försämrades så fort den senaste tiden, säger Tiffany. Om hennes son hade fått mer vård tror hon att dådet hade kunnat förhindras.  – Absolut. Det hade kunnat hindra allt som har hänt.", "link": "https://www.tv4.se/artikel/5FtrEodVBsFODUuXmfdVkD/mamman-till-misstaenkte-moerdaren-polisen-avraettade-min-son", "date_display": "2026-04-14", "date_iso": "2026-04-14T19:58:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/boden", "/mord", "/misstankt-mord"]}, {"id": 128, "title": "Woman won Picasso painting in lottery", "summary": "A French woman has won a Picasso painting worth one million euros in a lottery with 120,000 contestants. The proceeds from the lottery go to Alzheimer's disease research.", "title_original": "Kvinna vann Picassomålning på lotteri", "summary_original": "En fransk kvinna har vunnit en Picassomålning värd en miljon euro på ett lotteri med 120 000 tävlande. Intäkterna från lotteriet går till forskning om Alzheimers sjukdom.", "link": "https://www.dn.se/varlden/kvinna-vann-picassomalning-pa-lotteri/", "date_display": "2026-04-14", "date_iso": "2026-04-14T19:45:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Messy when Rögle won on knock – on the way to the final", "summary": "Rögle is on his way to the SM final after a knockout victory. Three goals in 76 seconds in the first period decided the fourth SC semi-final against Växjö. Rögle won a messy match 4–1, leads 3–1 in matches and can decide on Thursday.", "title_original": "Stökigt när Rögle vann på knock – på väg mot final", "summary_original": "Rögle är på väg mot SM-final efter en knockoutseger. Tre mål på 76 sekunder i första perioden avgjorde den fjärde SM-semifinalen mot Växjö. Rögle vann en stökig match med 4–1, leder med 3–1 i matcher och kan avgöra på torsdag.", "link": "https://www.dn.se/sport/stokigt-nar-rogle-vann-pa-knock-pa-vag-mot-final/", "date_display": "2026-04-14", "date_iso": "2026-04-14T19:39:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Sex, drugs and money laundering – the scandals shaking Buddhism in Thailand", "summary": "BANGKOK/TRAT. Sex, money laundering and drugs. How holy are Thailand's monks, really? The question is asked after a series of scandals involving monks broke. - Buddhism in Thailand is facing its biggest test so far, says Jaturong Jongarsa, a researcher in Buddhism.", "title_original": "Sex, droger och penningtvätt – skandalerna som skakar buddismen i Thailand", "summary_original": "BANGKOK/TRAT. Sex, penningtvätt och droger. Hur heliga är egentligen Thailands munkar? Frågan ställs efter att en rad skandaler med munkar inblandade briserat. – Buddism i Thailand står inför sitt största test hittills, säger Jaturong Jongarsa, forskare i buddism.", "link": "https://www.dn.se/varlden/sex-droger-och-penningtvatt-skandalerna-som-skakar-buddismen-i-thailand/", "date_display": "2026-04-14", "date_iso": "2026-04-14T19:37:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Letter to the editor. Answer: Pahlavi has never distanced himself from his father's methods", "summary": "RESPONSE TO POSTERS. It is also noteworthy that Reza Pahlavi is portrayed as a unifying democratic force. The real change in Iran does not come from outside, but grows out of the Iranian people's own struggles, writes the exiled Iranian Ferydoon Tahmasebie.", "title_original": "Insändare. Svar: Pahlavi har aldrig tagit avstånd från sin fars metoder", "summary_original": "SVAR PÅ INSÄNDARE. Det är också anmärkningsvärt att Reza Pahlavi framställs som en samlande demokratisk kraft. Den verkliga förändringen i Iran kommer inte utifrån, utan växer ur det iranska folkets egna kamper, skriver exiliraniern Ferydoon Tahmasebie.", "link": "https://www.dn.se/insandare/svar-pahlavi-har-aldrig-tagit-avstand-fran-sin-fars-metoder/", "date_display": "2026-04-14", "date_iso": "2026-04-14T19:32:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Swedish loss in the World Cup qualifier against Denmark - despite a dream start: \"Laughing\"", "summary": "GOTHENBURG. Sweden's soccer ladies lacked routine from hundreds of international matches at Gamla Ullevi. Then there was a heavy 1-2 loss against Denmark in the World Cup qualifiers - despite a dream start. - It's laughable. We were absolutely the better team, says Swedish goalscorer Monica Jusu Bah.", "title_original": "Svensk förlust i VM-kvalet mot Danmark – trots drömstart: ”Skrattretande”", "summary_original": "GÖTEBORG. Sveriges fotbollsdamer saknade rutin från hundratals landskamper på Gamla Ullevi. Då blev det en blytung 1–2-förlust mot Danmark i VM-kvalet – trots en drömstart. – Det är skrattretande. Vi var absolut det bättre laget, säger svenska målskytten Monica Jusu Bah.", "link": "https://www.dn.se/sport/svensk-forlust-i-vm-kvalet-mot-danmark-trots-dromstart/", "date_display": "2026-04-14", "date_iso": "2026-04-14T18:52:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Suspected recruitment attempt by eight-year-olds on the football field", "summary": "When some eight-year-old boys played soccer at Stuvsta IP in Huddinge municipality this weekend, they were approached by several older youths on the sports field. The police assess that it may be an attempt to recruit the children to gang crime. The children told their parents that the older youths made contact by talking to them and giving them money. The conversations must have contained inappropriate questions, while the young people behaved in a friendly manner. - These guys had given them money and talked very inappropriately, but had still, in some way, been nice and contact-seeking, says a father to one of the children.  The children must also have been filmed and photographed. Towards the end of the meeting, the youths are said to have said that the children could get expensive headphones at a later date if they were seen again. - They get confirmation that they are good at football. The children's perception was that these were fun and nice guys. Their view of this was very innocent, says one mother. \"You get pissed\" When the children told their parents about the incident, they reacted immediately. The parents contacted the police and also informed other guardians in the area, as well as the school and actors around the sports field. - You get pissed off. The first reaction is frustration – a feeling of \"leave the children alone, they just want to play football\", says the mother. The father of one of the children describes that the incident caused both concern and recognition. - It is obvious that this can happen everywhere in Sweden. You hear about that all the time, so you're shocked but not really surprised, he says.  Police warning The incident is known to the police in Huddinge. Based on the information provided by the parents, the police assess that it may be a case of suspected gang recruitment. According to Mitt i, the police have now increased their presence in the area.  \"The police and the municipality take this type of event very seriously and work together to maintain safety in Stuvsta,\" writes municipal police officer Anna Schelin in an email to TV4 Nyheterna. According to pol", "title_original": "Misstänkt rekryteringsförsök av åttaåringar på fotbollsplan", "summary_original": "När några åttaåriga pojkar spelade fotboll på Stuvsta IP i Huddinge kommun i helgen blev de kontaktade av flera äldre ungdomar på idrottsplatsen. Polisen bedömer att det kan röra sig om ett försök att rekrytera barnen till gängkriminalitet. Barnen berättade för sina föräldrar att de äldre ungdomarna tog kontakt genom att prata med dem och ge dem pengar. Samtalen ska ha innehållit olämpliga frågor, samtidigt som ungdomarna uppträdde vänligt. – De här killarna hade gett dem pengar och pratat väldigt olämpligt, men hade ändå, på något sätt, varit schyssta och kontaktsökande, säger en pappa till ett av barnen.  Barnen ska också ha blivit filmade och fotograferade. Mot slutet av mötet ska ungdomarna ha sagt att barnen kunde få dyra hörlurar vid ett senare tillfälle om de sågs igen. – De får bekräftelse på att de är bra på fotboll. Barnens uppfattning var ju att det här var roliga och trevliga killar. Deras bild av det här var väldigt oskyldigt, säger en mamma. ”Man blir förbannad” När barnen berättade om händelsen för sina föräldrar reagerade de direkt. Föräldrarna kontaktade polisen och informerade även andra vårdnadshavare i området, samt skolan och aktörer runt idrottsplatsen. – Man blir förbannad. Första reaktionen är frustration – en känsla av att ”låt barnen vara, de vill bara spela fotboll”, säger mamman. Pappan till ett av barnen beskriver att händelsen väckte både oro och igenkänning. – Det är uppenbart att det här kan försiggå överallt i hela Sverige. Det hör man om hela tiden, så man är chockad fast inte jätteförvånad, säger han.  Polisens varning Händelsen är känd av polisen i Huddinge. Utifrån de uppgifter som föräldrarna lämnat bedömer polisen att det kan röra sig om en misstänkt gängrekrytering. Enligt Mitt i har polisen nu utökat sin närvaro i området.  ”Polisen och kommunen ser mycket allvarligt på den här typen av händelser och samverkar för att bibehålla tryggheten i Stuvsta”, skriver kommunpolisen Anna Schelin i ett mejl till TV4 Nyheterna. Enligt polisen är just vår och sommar en period då vuxna bör vara extra uppmärksamma. ”När det är varmare ute och fint väder är mer barn och unga ute, så trenden följer nog årstiderna generellt”, skriver Schelin.  Polisen uppmanar föräldrar att agera snabbt och dela information för att minska risken för rekrytering till kriminalitet. I det här fallet bedömer polisen att föräldrarna agerat helt rätt och att deras agerande bör fungera som ett exempel. ”Informera polisen och sin hemkommun, aktuell förening och andra vårdnadshavare i ens kontaktnät, så att vi alla tillsammans kan samverka och jobba för att förebygga att rekryteringar äger rum bland våra barn och unga”, skriver Schelin.", "link": "https://www.tv4.se/artikel/44xgPrFvL7VM1xX1Ypg6nn/polisen-varnar-naer-vaermen-kommer-misstaenkt-rekryteringsfoersoek-pa", "date_display": "2026-04-14", "date_iso": "2026-04-14T18:26:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vader", "/foraldrar", "/kriminalitet", "/stockholm", "/gangkriminalitet", "/barn"]}, {"id": 134, "title": "Letter to the editor. Noted by DN's readers on April 14", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Tuesday, April 14.", "title_original": "Insändare. Noterat av DN:s läsare den 14 april", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll tisdagen den 14 april.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-14-april/", "date_display": "2026-04-14", "date_iso": "2026-04-14T18:04:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "DN Debate. \"Democracy is already under threat - the Riksdag must not make it worse\"", "summary": "DN DEBATE. In several ways, the Riksdag does a better job today than in the past. But when lawmakers, from right to left, repeatedly ignore serious criticism from the nation's most qualified judges, flawed laws are enacted. When KU's reviews are watered down by compromises, the core of democracy is threatened. This is where the Riksdag must step up, five researchers write in a new SNS report.", "title_original": "DN Debatt. ”Demokratin är redan hotad – riksdagen får inte göra det värre”", "summary_original": "DN DEBATT. På flera sätt gör riksdagen ett bättre jobb i dag än förr. Men när lagstiftarna, från höger till vänster, återkommande ignorerar allvarlig kritik från landets mest kvalificerade domare stiftas bristande lagar. När KU:s granskningar urvattnas av kompromisser hotas demokratins kärna. Här måste riksdagens skärpa sig, skriver fem forskare i en ny SNS-rapport.", "link": "https://www.dn.se/debatt/demokratin-ar-redan-hotad-riksdagen-far-inte-gora-det-varre/", "date_display": "2026-04-14", "date_iso": "2026-04-14T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Russian students lured to 'safe' drone forces", "summary": "Russian students are being pressured to join the country's new drone forces - and lured with promises of \"safe\" services far from the front. But the enormous death tolls testify that no locations in the war are harmless.", "title_original": "Ryska studenter lockas till ”säkra” drönarstyrkor", "summary_original": "Ryska studenter pressas att ansluta sig landets nya drönarstyrkor – och lockas med löften om ”säkra” tjänster långt från fronten. Men de enorma dödstalen vittnar om att inga placeringar i kriget är ofarliga.", "link": "https://www.dn.se/varlden/ryska-studenter-lockas-till-sakra-dronarstyrkor/", "date_display": "2026-04-14", "date_iso": "2026-04-14T17:52:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Sweden loses to Denmark in the World Cup qualifier", "summary": "On Tuesday, Sweden faced Denmark at home at Gamla Ullevi in ​​the WC qualifiers. Blue and yellow national team captain Tony Gustavsson started without star Johanna Rytting Kaneryd, who is struggling with an injury, while seasoned Fridolina Rolfö again had to start on the bench. Instead, Hammarby's Sofia Reidy was the big splash in the eleven, when she had to make her A national team debut. Sweden was close to getting off to a dream start. Felicia Schröder took a finish in a good position in the first minute, but had to see the ball sail into the post. A few minutes later, Blågult was close again, but then Danish players stood in the way at the goal line. In the end, Sweden got to celebrate. Schröder heeled the ball forward to Monica Jusu Bah, who then pushed the ball into the goal to make it 1-0. In the 25th, Blågult was close again, when Stina Blackstenius reached the top of a post and nodded in the post. Despite Sweden's chance advantage, it was Denmark who got to celebrate the next time. Star player Pernille Harder met a tackle in the penalty area and made it 1-1 after 30 minutes of play. The tie ended after the first half. At the beginning of the second half, Denmark went on a tough streak. Harder collided with Julia Zigiotti Olme and was then forced to change. \"Bad news for Denmark. Completely groggy and with an ice pack on her head, Harder is sitting on the Danish bench, but she is quickly taken down to the dressing room,\" wrote Danish TV2 in connection with the change. Sweden then continued to threaten. Blackstenius came up with another opportunity, but shot narrowly wide. Later, Denmark was also close, but that time it was Cecilie Fløe's turn to dot the timber. The match looked set to end 1-1, but in overtime Janni Thomsen got free on a counterattack and decided 2-1 for Denmark. Sweden thus lost the rival meeting in the WC qualifier. Sweden has four points after three matches, while Denmark has seven points after as many rounds.", "title_original": "Sverige förlorar mot Danmark i VM-kvalet", "summary_original": "Sverige ställdes under tisdagen mot Danmark hemma på Gamla Ullevi i VM-kvalet. Blågula förbundskaptenen Tony Gustavsson startade utan stjärnan Johanna Rytting Kaneryd, som sliter med en skadekänning, samtidigt som rutinerade Fridolina Rolfö åter fick inleda på bänken. I stället var Hammarbys Sofia Reidy den stora skrällen i elvan, då hon fick göra A-landslagsdebut. Sverige var nära att få en drömstart. Felicia Schröder tog i första minuten ett avslut i ett bra läge, men fick se bollen segla in i stolpen. Några minuter senare var Blågult nära igen, men då stod danska spelare i vägen vid mållinjen. Till slut fick Sverige fira. Schröder klackade fram bollen till Monica Jusu Bah, som sedan tryckte in bollen i mål till 1-0. I 25:e var Blågult nära igen, då Stina Blackstenius nådde högst på ett inlägg och nickade i stolpen. Trots Sveriges chansövertag, så var det Danmark som fick jubla nästa gång. Stjärnspelaren Pernille Harder mötte ett inspel i straffområdet och satte 1-1 efter 30 minuters spel. Likaläget stod sig sedan första halvlek ut. I början av andra halvlek åkte Danmark på en tuff smäll. Harder skallade ihop med Julia Zigiotti Olme och tvingades sedan till byte. \"Dåliga nyheter för Danmark. Helt groggy och med en ispåse på huvudet sitter Harder på den danska bänken, men hon tas snabbt vidare ner till omklädningsrummet\", skrev danska TV2 i samband med bytet. Sverige fortsatte därefter att hota. Blackstenius kom till en ny möjlighet, men sköt tätt utanför mål. Senare var även Danmark nära, men den gången var det Cecilie Fløes tur att pricka virket. Matchen såg ut att sluta 1-1, men på övertid kom Janni Thomsen fri på en kontring och avgjorde till 2-1 för Danmark. Sverige förlorade därmed rivalmötet i VM-kvalet. Sverige har fyra poäng efter tre matcher, medan Danmark står på sju poäng efter lika många omgångar.", "link": "https://www.tv4.se/artikel/hdBFfonBF3MiPHE8L9Clc/sverige-leder-mot-danmark", "date_display": "2026-04-14", "date_iso": "2026-04-14T17:26:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotboll", "/damlandslaget-i-fotboll", "/vm-kval"]}, {"id": 138, "title": "Peter Alestig: The view of climate activists has changed", "summary": "The new UN letter in the \"Clara\" case is harsh criticism of how climate activists are treated in Sweden. It is the latest sign of how quickly the power's view of climate activists has changed in the West. What has happened?", "title_original": "Peter Alestig: Synen på klimataktivister har svängt", "summary_original": "Det nya FN-brevet i fallet ”Clara” är hård kritik mot hur klimataktivister behandlas i Sverige. Det är det senaste tecknet på hur snabbt maktens syn på klimataktivister har förändrats i västvärlden. Vad är det som har hänt?", "link": "https://www.dn.se/sverige/peter-alestig-synen-pa-klimataktivister-har-svangt/", "date_display": "2026-04-14", "date_iso": "2026-04-14T17:17:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Trump criticizes Meloni - \"Unacceptable\"", "summary": "New attack after the quarrel with the Pope • \"I thought she had courage\"", "title_original": "Trump kritiserar Meloni – ”Oacceptabel”", "summary_original": "Ny attack efter bråket med påven • ”Jag trodde hon hade mod”", "link": "https://www.tv4.se/artikel/6EmlBUgjL2h5dLKADPV0dS/trump-kritiserar-meloni-oacceptabel", "date_display": "2026-04-14", "date_iso": "2026-04-14T16:48:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 140, "title": "The big change in The Traitors: \"I don't know if I can tell\"", "summary": "The traitors have become one of TV4's most popular entertainment programs. The participants are divided into two groups: loyalists and traitors, and all compete for a large winning sum. The task of the faithful is to expose the traitors and the task of the traitors is to eliminate the faithful. New for this year's season In previous editions, viewers have known who the traitors are. But before this season, the audience has asked to guess who is the traitor, just like the participants in the program. Joachim Brobeck is the producer for the program and says that the production has taken notice of the request.  - Many say: \"God, how funny it would be if you didn't know who the traitors were\" and we actually have news that I don't know if I can tell you. In the first program, it is one of the traitors that you will not know who it is this time, which we call the secret traitor.  Swedish version with its own stamp The traitors is an international format, but Brobeck emphasizes that the Swedish team has adapted the program to stand out in the Swedish television market. - When we got this on our table in Sweden, we wanted to make a version that suits the Swedish climate and at the same time make something new that also stands out in the crowd from other TV programs. The premiere of the new season of The Traitors is broadcast Thursday evening on TV4. Among the participants are actor Dan Ekborg, artist Miriam Bryant, former party leader Mona Sahlin, sports journalist Johan Kücükaslan together with profiles such as Anna Anka, space physicist Patrik Norqvist and Torbjörn Averås Skorup.", "title_original": "Stora förändringen i Förrädarna: ”Vet inte om jag får berätta”", "summary_original": "Förrädarna har blivit ett av TV4:s mest populära underhållningsprogram. Deltagarna delas in i två grupper: trogna och förrädare, och alla tävlar om en stor vinstsumma. De trognas uppgift är att avslöja förrädarna och förrädarnas uppgift är eliminera de trogna. Nyhet för årets säsong I tidigare upplagor har tittarna vetat om vilka som är förrädare. Men inför denna säsong har publiken efterfrågat att själva få gissa vem som är förrädare, precis som deltagarna i programmet. Joachim Brobeck är producent för programmet och berättar att produktionen tagit fasta på önskemålet.  – Många säger: \"Gud, vad roligt det vore om man inte visste vilka förrädarna var\" och vi har faktiskt en nyhet som jag inte vet om jag får berätta. I första programmet är det en av förrädarna som man inte kommer att veta vem det är den här gången, som vi kallar för den hemliga förrädaren.  Svensk version med egen prägel Förrädarna är ett internationellt format, men Brobeck betonar att det svenska teamet har anpassat programmet för att sticka ut på den svenska tv-marknaden. – När vi fick det här på vårt bord i Sverige ville vi göra en version som passar det svenska klimatet och samtidigt göra någonting nytt som också sticker ut i mängden från andra tv-program. Premiären av den nya säsongen av Förrädarna sänds torsdag kväll i TV4. Bland deltagarna finns skådespelaren Dan Ekborg, artisten Miriam Bryant, tidigare partiledaren Mona Sahlin, sportjournalisten Johan Kücükaslan tillsammans med profiler som Anna Anka, rymdfysikern Patrik Norqvist och Torbjörn Averås Skorup.", "link": "https://www.tv4.se/artikel/r1WGLKjWhjiOi1zx4wJFt/stora-foeraendringen-i-foerraedarna-vet-inte-om-jag-far-beraetta", "date_display": "2026-04-14", "date_iso": "2026-04-14T16:10:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/forradarna", "/underhallning"]}, {"id": 141, "title": "The Hells Angels are trying to collect multi-million sums - several crimes", "summary": "The conflict must have arisen in connection with a deal in a company some time ago. The purchase must have gone awry and one entrepreneur must have demanded from the other between eleven and twelve million kroner. When the money was not paid, the Kronofogden should initially have been involved in handling the dispute. Then, according to the suspects, it turned into extortion. Knife men forced their way into the home The man with the payment demand then began to receive threats in 2024. Among other things, he received home visits from people armed with guns who mentioned the millions, according to information to TV4 Nyheterna. In March 2025, the man was attacked in his home and robbed by two perpetrators with a knife. - They have forced their way into the plaintiff's home, abused, threatened and seized his phone, says prosecutor Eva-Lena Jansson. During the same spring, the man and his relatives also received a number of threatening messages demanding payment. Among other things, that their house would otherwise be blown up, that the son in the family would be shot and that they would \"cut off his body parts and kidnap him\", according to the prosecutor. A gang criminal man was sentenced last autumn to two and a half years in prison for two counts of attempted extortion. Last week, charges were brought for aggravated robbery after the assault in the man's home. - The person who was convicted of attempted extortion is the same person I am now prosecuting for inciting aggravated robbery. There is an alleged disputed debt at the bottom, but the person I have prosecuted has no debt relationship of his own to the plaintiffs, says Eva-Lena Jansson. Information: Foreign mobile number Despite the verdict and the new indictment, the extortion racket has continued and flared up again in recent weeks, according to information to TV4 Nyheterna. The police must have received information that the criminal motorcycle gang Hells Angels \"bought\" the alleged multi-million debt and must have tried to collect the money, sources state. The vulnerable family and other close relatives have reportedly received several threats and the police have been forced to move several people to an undisclosed location. Also at", "title_original": "Hells Angels försöker driva in mångmiljonbelopp – flera dåd", "summary_original": "Konflikten ska ha uppstått i samband med en affär i ett bolag för en tid sedan. Köpet ska ha gått snett och den ena entreprenören ska ha krävt den andra på mellan elva och tolv miljoner kronor. När pengarna inte betaldes ska Kronofogden till en början ha kopplats in för att hantera tvisten. Sedan ska det ha övergått till utpressning, enligt misstankarna. Knivmän trängde sig in i hemmet Mannen med betalningskravet började då få hot under 2024. Bland annat fick han hembesök av pistolbeväpnade personer som nämnde miljonerna, enligt uppgifter till TV4 Nyheterna. I mars 2025 överfölls mannen i sin bostad och rånades av två gärningsmän med kniv. – De har trängt sig in i målsägandens bostad, misshandlat, hotat och tillgripit hans telefon, säger åklagare Eva-Lena Jansson. Under samma vår fick mannen och hans anhöriga även en mängd hotfulla meddelanden med krav på betalning. Bland annat att deras hus annars skulle sprängas, att sonen i familjen skulle skjutas och att man skulle ”skära av honom kroppsdelar och kidnappa honom”, enligt åklagaren. En gängkriminell man dömdes i höstas till två och ett halvt års fängelse för två fall av försök till grov utpressning. I förra veckan väcktes åtal för det grova rånet efter överfallet i mannens bostad. – Den person som dömdes för försök till utpressning är samma person som jag nu åtalar för anstiftan till grovt rån. Det finns en påstådd tvistig skuld i botten men den person som jag har åtalat har inget eget skuldförhållande till målsägandena, säger Eva-Lena Jansson. Uppgifter: Utländskt mobilnummer Trots domen och det nya åtalet har utpressningshärvan fortsatt och blossat upp igen de senaste veckorna, enligt uppgifter till TV4 Nyheterna. Polisen ska ha fått uppgifter om att det kriminella mc-gänget Hells Angels ”köpt” den påstådda mångmiljonskulden och ska ha försökt driva in pengarna, uppger källor. Den utsatta familjen och andra nära anhöriga ska ha fått flera hot och polisen har tvingats flytta flera personer till hemlig ort. Även polisbevakning har satts in vid olika bostäder runt om i Sverige, enligt uppgifter till TV4 Nyheterna. Tidigare i mars inträffade flera mordbränder vid platser som kopplas till mannen. I ett av fallen, som handlar om en bilbrand vid en anhörigs hus, kunde en manlig skådespelare som medverkat i kända tv-produktioner gripas. Han sitter nu häktad misstänkt för mordbrand. – Personen påträffades i anslutning till platsen efter snabbt agerande av polisen. Målsäganden ringer polisen som ger sig ut och det är inte särskilt många bilar som färdas vid den här platsen, vid den här tiden. Han nekar till brott, säger kammaråklagare Joel Henning. Enligt uppgifter till TV4 Nyheterna har mannens anhöriga efter bilbranden tagit emot ytterligare hotfulla sms från ett utländskt nummer. – Det finns en misstanke om att det är ett försök till grov utpressning och vi tror att mordbranden är kopplad till någon person som vill ha pengar. Målsägandena har blivit utsatta för brott, inte bara vid det här tillfället, säger Joel Henning.", "link": "https://www.tv4.se/artikel/1cfzFNkpCbu6ItLrq3fPTb/hells-angels-foersoeker-driva-in-mangmiljonbelopp-flera-dad", "date_display": "2026-04-14", "date_iso": "2026-04-14T16:08:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/dalarna", "/brott", "/hells-angels"]}, {"id": 142, "title": "The neighbor's anger became a neighbor's feud - the anger against the Postcode Lottery", "summary": "Öland is hosting Postcode Lottery's Granny for the first time. On April 2, it became clear that postcode 387 72 in Löttorp won, and SEK 101 million is to be distributed between lottery ticket buyers in the area. But the Postal Code Lottery has decided that the winning party, the so-called Grannyran, will be moved to Borgholm, which Ölandsbladet was the first to report. - It feels completely sick. We are doing very well in northern Öland. And it's a bit ruined if you move the party. We become extras in someone else's celebration, says Löttorp resident Katja Ingeman, who wrote an open letter on Facebook about the matter. \"It's Löttorp's party\" The granny race is already to be celebrated on Sunday and the Postcode Lottery justifies the move to Borgholm with logistical reasons.  The postal code lottery also offers free buses for lottery winners the 4.5 miles from Löttorp. \"The choice of Borgholm as a filming location for Grannyran is based on a collective assessment of several factors where we want to arrange a big party for all Öland residents\", writes Jonathan Nordin, executive producer at TV4 in a written response. But Katja Ingeman believes that many Löttorp residents will boycott Grannyran if it takes place in Borgholm. - I have spoken to many people who say: \"I'm not going the hell\". And several Borgholm residents I've spoken to also think it's embarrassing. It's Löttorp's party, says Katja Ingeman. The municipal council contacted Festen i Borgholm will be visited by, among others, the Melodifestival participant Lilla Al-Fadji. Borgholm municipal councilor Ilko Corkovic (S) tells Ölandsbladet that several islanders demand that the municipality act, even though it is the Postcode Lottery that owns the question of where the winning party should take place. - I personally think that the party should be in Löttorp, but it is not my decision to make, Corkovic tells Ölandsbladet. \"The bus can be turned around\" Despite the fact that the Granny Run will take place in less than a week, Katja Ingeman still hopes that the Postcode Lottery will change its mind. And if there are problems with logistics or accommodation, she says the local population is ready", "title_original": "Grannyran blev grannfejd – vreden mot Postkodlotteriet", "summary_original": "Öland står för första gången värd för Postkodlotteriets Grannyra. Den 2 april blev det klart att postnummer 387 72 i Löttorp vunnit, och 101 miljoner kronor ska fördelas mellan lottköpare i området. Men Postkodlotteriet har beslutat att vinstfesten, den så kallade Grannyran, ska förläggas till Borgholm, vilket Ölandsbladet var först med att rapportera. – Det känns helt sjukt. Vi klarar oss väldigt bra på norra Öland. Och det förstörs lite om man flyttar festen. Vi blir statister i någon annans firande, säger Löttorpsbon Katja Ingeman som skrivit ett öppet brev på Facebook om saken. ”Det är Löttorps fest” Grannyran ska firas redan på söndag och Postkodlotteriet motiverar flytten till Borgholm med logistiska skäl.  Postkodlotteriet erbjuder även gratis bussar för lottvinnare de 4,5 milen från Löttorp. ”Valet av Borgholm som inspelningsplats för Grannyran bygger på en samlad bedömning av flera faktorer där vi vill arrangera en stor fest för alla Ölandsbor\", skriver Jonathan Nordin, exekutiv producent på TV4 i ett skriftligt svar. Men Katja Ingeman tror att många Löttorpbor kommer att bojkotta Grannyran om den äger rum i Borgholm. – Jag har pratat med många som säger: ”Jag åker fan inte\". Och flera Borgholmsbor jag pratat med tycker också att det är pinsamt. Det är Löttorps fest, säger Katja Ingeman. Kommunalrådet kontaktat Festen i Borgholm kommer att gästas av bland annat Melodifestivaldeltagaren Lilla Al-Fadji. Kommunalrådet i Borgholm Ilko Corkovic (S) säger till Ölandsbladet att flera ölänningar kräver att kommunen ska agera, trots att det är Postkodlotteriet som äger frågan om var vinstfesten ska äga rum. – Jag tycker personligen att festen borde vara i Löttorp, men det är inte mitt beslut att fatta, säger Corkovic till Ölandsbladet. ”Bussen går att vända” Trots att Grannyran ska äga rum om mindre än en vecka hoppas Katja Ingeman fortfarande att Postkodlotteriet ska ändra sig. Och om det är problem med logistik eller boenden säger hon att ortsbefolkningen är redo att lösa detta. – Löttorp är inget fancy-pancy ställe med femstjärniga hotell. Men nog ska vi kunna ordna sovplatser, transporter och vad som nu behövs. Och den där bussen går att vända på. Den kan lika gärna gå från Borgholm till Löttorp, tycker jag, säger Katja Ingeman. Men Postkodlotteriet verkar inte ha några planer att byta ort. ”Arbetet med att arrangera en så här stor tv-inspelning är ett stort och omfattande arbete. Vi ser fram emot att välkomna alla Ölandsbor till söndagens inspelningar i Borgholm\", skriver Jonathan Nordin, exekutiv producent på TV4.", "link": "https://www.tv4.se/artikel/Q0ixTvKAk5TYtE8YHRpS6/grannyran-blev-grannfejd-vreden-mot-postkodlotteriet", "date_display": "2026-04-14", "date_iso": "2026-04-14T15:48:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/postkodlotteriet", "/tv4", "/oland"]}, {"id": 143, "title": "Increases are a blow to pension savers - \"Plan not followed\"", "summary": "Today it became known that a consortium headed by the Wallenberg family is investing SEK 15.1 billion in the troubled steel manufacturer Stegra. Since last autumn, the company has been short of money, and has been hunting for new investors in order to complete a production facility in Boden for fossil-free steel. The entry of the Wallenberg family means more secure financial ground for Stegra. But also a financial setback for existing shareholders who see their ownership diluted when the company issues new shares. One of the losers is pension giant AMF, which previously invested two billion kroner and held just under six percent of the shares in Stegra. - It is clear that there will be a dilution, and we have not calculated exactly what it will be yet. It is an investment that did not go according to plan. But at the same time it was almost expected, investments of this kind in the early phase rarely go according to plan, says Katarina Romberg, head of asset management at AMF. Research criticism AMF also invested SEK 1.95 billion in the bankrupt battery manufacturer Northvolt. That money was lost. Several researchers have been critical of the hype surrounding the green transition. For example, professor Magnus Henreksson wrote on DN Debatt: \"Northvolt and Stegra show what happens when the public gives away money on the basis of elegant powerpoint presentations and beautiful promises - without follow-up or demands for financial compensation.\"  \"Too early to evaluate\" But Katarina Romberg thinks that AMF has reason to be satisfied with the investment in Stegra, despite the dilution. - Our task is not to help the green transition, but to secure a high return for our savers. Here we need to be long-term and it is too early to evaluate Stegra yet. Have you shown sufficient care for the pension savers' money when it comes to Stegra? - Yes, we have. This is a high risk investment and is in a small part of our portfolio where we make this type of investment with the expectation of high returns. And we are very happy to Stegra", "title_original": "Stegra blir smäll för pensionssparare - ”Inte följt plan”", "summary_original": "Idag blev det känt att ett konsortium med familjen Wallenberg i spetsen investerar 15,1  miljarder kronor i problemtyngda ståltillverkaren Stegra. Bolaget har sedan i höstas haft ont om pengar, och jagat nya investerare för att kunna slutföra en produktionsanläggning i Boden för fossilfritt stål. Familjen Wallenbergs intåg innebär säkrare ekonomisk mark för Stegra. Men också ett ekonomiskt bakslag för befintliga aktieägare som får se sitt ägande spädas ut, när bolaget trycker nya aktier. En av förlorarna är pensionsjätten AMF, som tidigare investerat två miljarder kronor och haft knappt sex procent av aktierna i Stegra. – Det är klart att det blir en utspädning, och vi har inte räknat ut exakt vad den blir än. Det är en investering som inte följt plan. Men samtidigt var det nästan väntat, investeringar av det här slaget i tidig fas följer sällan plan, säger Katarina Romberg, kapitalförvaltningschef på AMF. Forskarkritik AMF investerade också 1,95 miljarder kronor i konkursade batteritillverkaren Northvolt. De pengarna gick förlorade. Flera forskare har varit kritiska till hypen kring den gröna omställningen. Så här skrev exempelvis professor Magnus Henreksson på DN Debatt: \"Northvolt och Stegra visar vad som sker när det allmänna ger bort pengar på basis av eleganta powerpointpresentationer och fagra löften – utan uppföljning eller krav på finansiell motprestation.\"  \"För tidigt att utvärdera\" Men Katarina Romberg tycker att AMF har skäl att vara nöjd med investeringen i Stegra, trots utspädningen. – Vår uppgift är inte att hjälpa den gröna omställningen, utan att säkra en hög avkastning för våra sparare. Här behöver vi vara långsiktiga och det är för tidigt att utvärdera Stegra ännu. Har ni visat tillräcklig omsorg om pensionsspararnas pengar när det gäller Stegra? – Ja, det har vi. Det här är en högrisk-investering och finns i en liten del av vår portfölj där vi gör den här typen av investeringar med förväntan om hög avkastning. Och vi är väldigt glada att Stegra fått sin finansiering på plats.", "link": "https://www.tv4.se/artikel/1Vk346LaX1Br52Lvwk0Uqg/stegra-blir-smaell-foer-pensionssparare-inte-foeljt-plan", "date_display": "2026-04-14", "date_iso": "2026-04-14T15:04:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/stegra", "/wallenberg", "/svensk-ekonomi"]}, {"id": 144, "title": "The Pope succession a nightmare for the \"Trump Whisperer\" Meloni", "summary": "The row has rattled her Catholic base", "title_original": "Påvehärvan en mardröm för ”Trumpviskaren” Meloni", "summary_original": "Bråket har fått hennes katolska väljarbas att rasa", "link": "https://www.tv4.se/artikel/5Xi8WPUoETmGTqEcpRNNYT/pavehaervan-en-mardroem-foer-trumpviskaren-meloni", "date_display": "2026-04-14", "date_iso": "2026-04-14T14:49:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 145, "title": "It is proposed that they become the new vice-superintendents in Pentecost", "summary": "New leadership trio within Pingst FFS now presented", "title_original": "De föreslås bli nya vice föreståndare i Pingst", "summary_original": "Nya ledartrion inom Pingst FFS nu presenterad", "link": "https://www.dagen.se/nyheter/de-foereslas-bli-nya-vice-foerestandare-i-pingst/10297424", "date_display": "2026-04-14", "date_iso": "2026-04-14T13:43:15+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 146, "title": "Tick ​​alarm on Öland - unusual species is spreading", "summary": "At Karum's alvar, the county administration in Kalmar county has recently warned of an extreme increase in ticks around the \"Noaks ark\" burial ground. Behind the increase is suspected to be the Trubbnose tick - a species that is now spreading to more places in Sweden.   According to SVA, the Norwegian Veterinary Institute, the species was previously mainly found on Gotland and in Kalmar County, but in 2025 it was reported from more places in southern Sweden.  The ticks in Karum's alvar have now been sent to the Norwegian Veterinary Institute (SVA) for analysis, but exactly what diseases the blunt-nosed tick can carry is not yet completely clear: - I have seen that both Rickettsia bacteria and the parasite Babesia have been found on the blunt-nosed tick. But it is a bit unclear whether it can carry TBE and Lyme disease yet, says Thérese Janzèn, tick researcher at Södertörn University. Why there has been such an extreme number of ticks right at the burial ground is still unclear. On neighboring land, the same problem did not exist, according to the county administrative board in Kalmar county. According to Janzèn, this could be due to several factors. –Ticks can lay 2,000 to 3,000 eggs. If the larvae remain in the same place, there can be very many ticks in the same area. In addition, Trubbnosed ticks are particularly fond of sheep and cows. If the animals are kept on limited pasture, this can also contribute to a high concentration of ticks, she says.  Can carry diseases This year, in addition to the blunt-nosed tick, the SVA will take an extra look at the migratory bird tick that comes here with migratory birds, because it can carry the Crimean-Congoatt tick virus, which causes a deadly hemorrhagic fever.  \nSVA will also look carefully at the species variegated dog tick, which comes here via humans or dogs. The species can carry a parasite that can cause dogs to become anemic and, in the worst case, die. It is believed to become more common in Sweden with a warmer climate.  At the same time, the spread of the TBE virus to the north is being followed. So far, the coast of Norrland is relatively spared - but on the other side of the Baltic Sea along the coast of Finland f", "title_original": "Fästinglarm på Öland – ovanlig art sprider sig", "summary_original": "Vid Karums alvar har länsstyrelsen i Kalmar län nyligen varnat för en extrem ökning av fästingar kring gravfältet ”Noaks ark”. Bakom ökningen misstänks Trubbnosfästingen ligga – en art som nu sprider sig till fler ställen i Sverige.   Enligt SVA, Statens veterinärmedicinska anstalt, har arten tidigare främst funnits på Gotland och i Kalmar län, men under 2025 rapporterades den från fler platser i södra Sverige.  Fästingarna i Karums alvar har nu skickats till Statens veterinärmedicinska anstalt (SVA) för analys, men exakt vilka sjukdomar Trubbnosfästingen kan bära på är ännu inte helt klarlagt:  – Jag har sett att man har hittat både Rickettsia-bakteri och parasiten Babesia på trubbnosfästingen. Men det är lite oklart om den kan bära på TBE och borrelia ännu, säger Thérese Janzèn, fästingforskare på Södertörns högskola. Varför det blivit en så extremt många fästingar just vid gravfältet är fortfarande oklart. På närliggande marker fanns inte samma problem, enligt länsstyrelsen i Kalmar län. Enligt Janzèn kan det bero på flera faktorer. –Fästingar kan lägga 2 000 till 3 000 ägg. Om larverna stannar kvar på samma plats kan det bli väldigt många fästingar i samma område. Dessutom gillar Trubbnosfästingar särskilt får och kor. Om djuren hålls på ett begränsat bete kan även det bidra till en hög koncentration fästingar, säger hon.  Kan föra med sig sjukdomar I år kommer SVA, förutom trubbnosfästingen, att kika extra på flyttfågelfästingen som kommer hit med flyttfåglar, eftersom den kan bära på fästingviruset Krim-Kongoatt som orsakar en dödlig blödarfeber.  \nÄven arten brokig hundfästing, som kommer hit via människan eller hundar kommer SVA titta noggrant på. Arten kan föra med sig en parasit som kan leda till att hundar får blodbrist och i värsta fall dör. Den tros bli vanligare i Sverige takt med ett varmare klimat.  Samtidigt följs TBE-virusets spridning norrut. Än så länge är Norrlandskusten relativt förskonad – men på andra sidan Östersjön längs med Finlands kust finns redan TBE. Därför tror Anna Omazic, forskare på SVA, Statens veterinärmedicinska anstalt att det bara är en tidsfråga innan viruset etablerar sig på den här sidan av havet.  Forskarna vill nu få in fler fynd – särskilt av ovanliga arter. – Vi är beroende av att människor rapporterar. Det är så vi kan upptäcka förändringar i tid, säger Omazic. 2026 - ett nytt fästingår? Under 2025 kom över 10 000 fästingrapporter in från allmänheten till SVA – ett rekord. Men det betyder inte säkert att fästingarna blivit fler. – Vi bad aktivt människor att skicka in fästingar för analys. Det ökade engagemanget spelar stor roll, säger Omazic. Frågan många ställer sig nu är om 2026 blir ett nytt ”fästingår”. – Vi kommer ha fästingar i år igen. Men hur många det blir vet vi inte. Fästingar är tåliga och kan överleva kyla, säger hon.", "link": "https://www.tv4.se/artikel/5IQPGkLSxkxyJwdIfC2B7X/faestinglarm-pa-oeland-ovanlig-art-sprider-sig", "date_display": "2026-04-14", "date_iso": "2026-04-14T13:35:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/tbe", "/borrelia", "/sva", "/fastingsmitta", "/fastingar", "/oland"]}, {"id": 147, "title": "Time to encourage those who are cohabiting to get married", "summary": "The marriage instituted by God is better than a cohabitation relationship where you often \"take each other for granted\" without any binding promises, writes Alf B Svensson.", "title_original": "Dags att uppmuntra dem som är sambo att gifta sig", "summary_original": "Äktenskapet som är instiftat av Gud är bättre än ett samboförhållande där man ofta ”tar varandra på öppet köp” utan några bindande löften, skriver Alf B Svensson.", "link": "https://www.dagen.se/debatt/dags-att-uppmuntra-dem-som-aer-sambo-att-gifta-sig/10281434", "date_display": "2026-04-14", "date_iso": "2026-04-14T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 148, "title": "Pop group Licence reunites - 'maybe some kind of world record'", "summary": "Jana Persson about why the band starts playing again after more than 40 years", "title_original": "Popgruppen Licence återförenas – ”kanske något slags världsrekord”", "summary_original": "Jana Persson om varför bandet börjar spela igen efter mer än 40 år", "link": "https://www.dagen.se/kultur/popgruppen-licence-aterfoerenas-kanske-nagot-slags-vaerldsrekord/10296736", "date_display": "2026-04-14", "date_iso": "2026-04-14T13:04:23+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 149, "title": "New explosion in Södertälje", "summary": "A new explosion has occurred in the Geneta district of Södertälje. The object that exploded caused damage to a building and a car.  - We have received an alarm about a loud bang and are on site in Geneta to investigate what happened, says Susanna Rinaldo, press spokesperson at the police. Police and ambulance are on the scene, and at the moment there should be no danger to the public. The police state that no one has been injured and that a preliminary investigation has been launched into public dangerous devastation and violation of the Act on Flammable and Explosive Goods.  - Right now we are working to look for perpetrators, says Daniel Wikdahl, police spokesperson. Third attack in five days Last yesterday, there was an explosion outside a grocery store in the same area. Then it was, according to information, a thermos bomb that exploded. Also last Friday, there was an arson attack against the same store. - We are investigating a connection between the attacks. It should be said that it is not the same store that was exposed before, but they are close to each other, says Daniel Wikdahl. TV4 Nyheterna has spoken to people who were at the scene when the explosion occurred.  - I was inside the store shopping before. I had managed to get about 20 meters out of the store when I heard the bang, and then I ran back immediately, says a resident in the area.", "title_original": "Ny explosion i Södertälje", "summary_original": "En ny explosion har inträffat i Södertäljestadsdelen Geneta. Föremålet som exploderat har orsakat skador på en byggnad och en bil.  – Vi har fått larm om en kraftig smäll och är på plats i Geneta för att undersöka vad som hänt, säger Susanna Rinaldo, presstalesperson vid polisen. Polis och ambulans är på platsen, och i nuläget ska det inte vara någon fara för allmänheten. Polisen uppger att ingen har skadats och att man inlett en förundersökning om allmänfarlig ödeläggelse och brott mot lagen om brandfarliga och explosiva varor.  – Just nu arbetar vi med att leta efter gärningspersoner, säger Daniel Wikdahl, presstalesperson polisen. Tredje attentatet på fem dagar Senast i går skedde en explosion utanför en matbutik i samma område. Då var det, enligt uppgifter, en termosbomb som exploderade. Även i fredags skedde ett brandattentat mot samma butik. – Vi undersöker ett samband mellan attentaten. Det ska sägas att det inte är samma butik som utsatts tidigare, men de ligger i närheten av varandra, säger Daniel Wikdahl. TV4 Nyheterna har talat med människor som var på platsen då explosionen inträffade.  – Jag var inne i butiken och handlade innan. Jag hade hunnit runt 20 meter ut ur butiken när jag hörde smällen, och då sprang jag tillbaka direkt, säger en boende i området.", "link": "https://www.tv4.se/artikel/2RtpDr0UbzQuySENiGdYgD/ny-explosion-i-soedertaelje", "date_display": "2026-04-14", "date_iso": "2026-04-14T12:27:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/sodertalje", "/sprangningar", "/explosion"]}, {"id": 150, "title": "EFK motion: Congregations should share views on marriage or leave", "summary": "17 pastors want the Evangelical Free Church to be clearer about requirements for congregations' membership in the denomination.", "title_original": "EFK-motion: Församlingar bör dela äktenskapssyn eller lämna", "summary_original": "17 pastorer vill att Evangeliska frikyrkan ska bli tydligare kring krav på församlingars medlemskap i samfundet.", "link": "https://www.dagen.se/nyheter/efk-motion-foersamlingar-boer-dela-aektenskapssyn-eller-laemna/10296399", "date_display": "2026-04-14", "date_iso": "2026-04-14T11:41:12+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 151, "title": "The Riksdag's EKR council was not allowed to take a position on the Jas deal with Thailand", "summary": "Martin Lundmark, researcher at the Swedish Defense Academy, believes that the Riksdag's export control council should have been allowed to approve the latest arms export to Thailand. - The Export Control Council is ISP's body to make an assessment of an export deal like this. That they were not called in is surprising, says Martin Lundmark.  Cold facts have been able to reveal that the Total Defense Research Institute (FOI) warned of serious risks with a sale of war material to Thailand, long before the deal was approved. These risks were also something that ISP knew about before giving the green light to the deal. Jacob Risberg (MP), who is a substitute in the Riksdag's Export Control Council, had not seen the report from the FOI before the deal was approved by the ISP. - This is the kind of information that we should always get to show that perhaps we should not export military equipment to this type of country, he says.  Jacob Risberg believes that there are things in the FOI report that show that there are great risks of Swedish technology ending up astray to countries that we absolutely should not have that type of technology.  Thailand already has 12 Jas 39 Gripen of an older model. Since the country has previously bought the aircraft and other defense equipment from Sweden, ISP classified the new deal as a follow-on delivery. Martin Lundmark at the Norwegian Defense Academy is doubtful whether it was right. - After all, this was a rebuilt aircraft - another version of the aircraft, which in my opinion cannot be considered a follow-on delivery, he says.  Neither ISP nor FMV want to appear for an interview. FMV writes that it is not their task to assess any risks. ISP emphasizes that an overall assessment must be made when exporting, but that individual deals are not commented upon.", "title_original": "Riksdagens EKR-råd fick inte ta ställning till Jas-affären med Thailand", "summary_original": "Martin Lundmark, forskare vid försvarshögskolan, anser att riksdagens exportkontrollråd borde ha fått tycka till om den senaste vapenexporten till Thailand. – Exportkontrollrådet är ISP:s organ för att för att göra en bedömning av en sådan här tänkt exportaffär. Att de inte kallades in är förvånande, säger Martin Lundmark.  Kalla fakta har kunnat avslöja att Totalförsvarets forskningsinstitut (FOI) varnade för allvarliga risker med en försäljning av krigsmaterial till Thailand, långt före det att affären godkändes. Dessa risker var också något som ISP kände till innan de gav grönt ljus till affären. Jacob Risberg (MP), som är ersättare i riksdagens Exportkontrollråd, hade inte sett rapporten från FOI innan affären godkändes av ISP. – Det här är ju sådan information som vi alltid bör få för att visa att den här typen av länder kanske vi inte bör exportera krigsmateriel till, säger han.  Jacob Risberg anser att det framkommer saker i FOI rapporten som visar att det finns stora risker att svensk teknik hamnar på villovägar till länder som vi absolut inte ska ha den typen av teknik.  Thailand har sedan tidigare 12 stycken Jas 39 Gripen av en äldre modell. Eftersom landet tidigare har köpt flygplanen, och annan försvarsmateriel från Sverige, klassade ISP den nya affären som en följdleverans. Martin Lundmark på försvarshögskolan är tveksam till om det var rätt. – Det här var ju ett ombyggt flygplan– en annan version av flygplanet, som enligt mig inte kan anses vara en följdleverans, säger han.  Varken ISP eller FMV vill ställa upp på en intervju. FMV skriver att det inte är deras uppdrag att bedöma eventuella risker. ISP betonar att det ska göras en samlad bedömning vid export, men att man inte kommenterar enskilda affärer.", "link": "https://www.tv4.se/artikel/wtuGBUB0OqOfZYGNQE5d3/riksdagen-fick-inte-ta-staellning-till-jas-affaeren-med-thailand", "date_display": "2026-04-14", "date_iso": "2026-04-14T11:28:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/kalla-fakta", "/jas-gripen", "/forsvarets-materielverk-fmv", "/foi", "/thailand"]}, {"id": 152, "title": "Boy died in explosion - two charged", "summary": "The persons are also charged with inciting serious public destruction, inciting a violation of the Act on Flammable and Explosive Goods, serious crime, and involving a minor in crime. It was around 21:00 on August 22 last year that a powerful explosion took place in Östberga in southern Stockholm. Afterwards, a 15-year-old boy from Stockholm was found dead at the scene. The prosecutor believes that the boy was going to commit an explosive act and he is suspected of having been recruited to the act. The investigation has shown that this person has been recruited by a person who can be connected to a criminal network which, according to the police, is part of a network in Visättra, says prosecutor Lukas Tigerstrand. Played football According to Tigerstrand, the 15-year-old boy was drawn in via his group of friends at school. - The investigation says that he had a friend who is a witness in the investigation who went to school with one of the people I have charged with incitement. The evidence simply says that through this friend he has gotten to know the third person who has mediated the contact to a criminal network in Visättra, says Lukas Tigerstrand.  A car was damaged in the explosion, but there is no indication that the owner was the target. Judging from the investigation, it was a homemade explosive charge with a stub. - We have carried out a technical investigation at the site and there we have found traces of pentyl, which is a powerful explosive. And none of the people involved are licensed to handle pentyl. So we therefore conclude that they have built their own bomb, says Tigerstrand. The prosecutor states that there are several types of evidence in the case, including witness statements, material from telephones and surveillance images. Alleged to have threatened witnesses The defendants deny crimes, although some have admitted certain elements. The 22-year-old is also charged with aggravated assault in a court case together with another man as he is said to have attacked and threatened witnesses to get them to keep quiet about the incident. Additional e", "title_original": "Pojke dog i explosion – två åtalas", "summary_original": "Personerna åtalas även för anstiftan till grov allmänfarlig ödeläggelse, anstiftan till brott mot lagen om brandfarliga och explosiva varor, grovt brott, samt involverande av en underårig i brottslighet. Det var vid 21-tiden den 22 augusti förra året som en kraftig explosion ägde rum Östberga i södra Stockholm. Efteråt hittades en 15-årig pojke från Stockholm död vid platsen. Åklagaren menar att pojken skulle utföra ett sprängdåd och han misstänks ha blivit rekryterad till dådet. Utredningen har visat att den här personen har blivit rekryterad av en person som kan kopplas till ett kriminellt nätverk som enligt polisens uppfattning ingår i ett nätverk i Visättra, säger åklagaren Lukas Tigerstrand. Spelade fotboll Enligt Tigerstrand blev den 15-årige pojken indragen via sitt kompisgäng i skolan. –  Utredningen talar för att han har haft en kompis som är vittne i utredningen som har gått i skolan tillsammans med en av dem som jag har åtalat för anstiftan. Bevisningen talar helt enkelt för att han genom den här Vännen har lärt känna den tredje personen som har förmedlat kontakten till ett kriminellt nätverk i Visättra, säger Lukas Tigerstrand.  I sprängningen skadades en bil, men inget pekar på att ägaren var måltavla. Av utredningen att döma så rörde det sig om en hembyggd sprängladdning med stubin. – Vi har ju genomfört en teknisk undersökning på platsen och där har vi hittat spår av pentyl som är ett kraftfullt sprängmedel. Och ingen av de inblandade har tillstånd att hantera pentyl. Så därför drar vi slutsatsen att man har byggt en egen bomb, säger Tigerstrand. Åklagaren uppger att det finns flera typer av bevisning i målet, bland annat vittnesuppgifter, material från telefoner och övervakningsbilder. Ska ha hotat vittnen De åtalade förnekar brott, även om några har medgett vissa moment. 22-åringen åtalas även för grovt övergrepp i rättssak tillsammans med en annan man då han ska ha angripit och hotat vittnen för att få dem att hålla tyst om händelsen. Ytterligare en 16-årig pojke åtalas för medhjälp till dådet, samtidigt som han också är målsägande.", "link": "https://www.tv4.se/artikel/tt-260414-ostbergaexplosion1-ac007115/pojke-dog-i-explosion-tva-atalas", "date_display": "2026-04-14", "date_iso": "2026-04-14T10:46:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott", "/brott", "/stockholm", "/sverige", "/inrikes", "/brott-och-straff"]}, {"id": 153, "title": "That's why you can sneeze - out of horniness: \"A little revealing\"", "summary": "One in five starts sneezing when the sex drive hits, something P4 Sjuhärad reported on. - There will be a slight overreaction of the nerve fibers. It is believed that the nerve fibers that run from the nose to the brain run quite close to the other connections. It is a hormonally and reflexively triggered sneeze, says doctor Mikael Sandström. Light-sneezing even more common Even more common is the photic sneeze - that you have to sneeze when you turn your eyes towards bright light. One third of all people suffer from photic sneezing. - Then the pupil contracts and there is a signal to nearby nerves that leads to an irritation - which leads to a sneeze, says Mikael Sandström. Then the sneezing may be due to excitement Something that can reveal the horny sneeze is if there is a single sudden sneeze, which does not seem to have anything to do with allergies or a cold. - A single sneeze at a dating table can be revealing. A single sudden sneeze can be a stimulus to \"other activity\" as well. At the same time, Mikael Sandström points out, one should not overinterpret someone's sneezing. - You can sneeze for other reasons than being horny.", "title_original": "Därför kan du nysa – av kåthet: ”Lite avslöjande”", "summary_original": "En av fem börjar nysa när sexlusten faller på, något P4 Sjuhärad rapporterat om. – Det blir en liten överreaktion av nervtrådarna. Man tror att de nervtrådar som går från näsan till hjärnan går ganska nära de andra kopplingarna. Det är en hormonellt och reflektoriskt utlöst nysning, säger doktor Mikael Sandström. Ljus-nysning ännu vanligare Ännu vanligare är den fotiska nysningen – att man måste nysa när man vänder blicken mot skarpt ljus. En tredjedel av alla människor drabbas av fotiska nysningar. – Då drar pupillen ihop sig och det blir en signal till närliggande nerver som leder till en retning – som leder till en nysning, säger Mikael Sandström. Då kan nysningen bero på upphetsning Något som kan avslöja den kåta nysaren är om det kommer en enda plötslig nysning, som inte verkar ha att göra med allergier eller förkylning. – En singelnysning vid ett dejtingbord kan vara avslöjande. En enda plötslig nysning kan vara stimulans till ”övrig aktivitet” också. Samtidigt, poängterar Mikael Sandström, ska man inte övertolka någons nysningar. – Man kan nysa av andra skäl än att man är kåt.", "link": "https://www.tv4.se/artikel/2Ef9JE5dsKBYiqF13eW9q2/daerfoer-kan-du-nysa-av-kathet-lite-avsloejande", "date_display": "2026-04-14", "date_iso": "2026-04-14T09:52:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Hälsa", "/halsa", "/sex", "/medicin", "/personer/mikael-sandstrom"]}, {"id": 154, "title": "Many ships stuck in the Gulf of Finland: \"Just outside our doorstep\"", "summary": "The naval ship Kindral Kurvits is on routine patrol around the island of Vaindloo, almost halfway between Estonia and Finland. Normally, about 10 tankers at a time are here waiting to go further into the Gulf of Finland to pick up oil in Russia. But after Ukraine's drone attacks a month ago against the facilities in Primorsk and Ust-Luga, which reduced oil capacity, about 30 are now parked here. - The risks of maritime pollution become quite high when the number of ships here increases. Besides that, this just means that there are more ships that we need to keep an eye on, says Aleksander Espenberg, press officer at the Estonian Navy.  Often false-flagged The Shadow Fleet's ships are often false-flagged in order to circumvent the Western countries' ban on importing both oil and gas from Russia. Old and poorly maintained, they are nonetheless vital parts of the economic bloodstream that funds Moscow's continued attacks on Ukraine. And despite the sanctions, oil and gas still account for around a third of the revenue in Russia's state budget. - It's definitely not something we like to see here, right outside our doorstep. But even if you don't love it, is there anything you can do about it? - According to the international law of the sea, the ships have the right to stay here in Estonia's exclusive economic zone. So we simply have no possibility to ask them to leave here, says Aleksander Espenberg.  That's why they don't act A Russian military ship passes close to the ships. According to Estonia, Russia nowadays always has one, sometimes two, out on patrol in the Gulf of Finland. Because of Russia's increasingly obvious military presence around the shadow fleet, the navy therefore refrains from acting against ships that - within quotation marks - are only suspected of not having their papers in order. Although the law of the sea still provides the opportunity to intervene when a ship is not believed to be properly flagged, explains the top commander at the base in Tallinn. - Russia has made it clear that they see their shadow fleet as a national security interest that they will protect mil", "title_original": "Många fartyg fast i finska viken: ”Precis utanför vår tröskel”", "summary_original": "Marinfartyget Kindral Kurvits rutinpatrullerar runt ön Vaindloo, nästan mitt emellan Estland och Finland. Normalt ligger ungefär 10 tankers åt gången här i väntan på att längre in i Finska viken hämta olja i Ryssland. Men efter Ukrainas drönarattacker för en månad sedan mot anläggningarna i Primorsk och Ust-Luga som dragit ner oljekapaciteten är nu ett 30-tal parkerade här. – Riskerna för maritima föroreningar blir ganska höga när antalet fartyg här ökar. Vid sidan av det innebär detta bara att det är fler fartyg som vi behöver ha koll på, säger Aleksander Espenberg, pressofficer vid Estlands marin.  Ofta falskflaggade  Skuggflottans fartyg är ofta falskflaggade för att kunna runda västländernas förbud mot att importera både olja och gas från Ryssland. Gamla och dåligt underhållna är de likväl vitala delar i det ekonomiska blodomlopp som finansierar Moskvas fortsatta attacker mot Ukraina. Och trots sanktionerna står olja och gas alltjämt för runt en tredjedel av intäkterna i Rysslands statsbudget. - Det är definitivt inget vi älskar att se här, precis utanför vår tröskel. Men även om ni inte älskar det, finns det något kan ni göra något åt det? – Enligt den internationella havsrätten har fartygen rätt att stanna här i Estlands exklusiva ekonomiska zon. Så vi har helt enkelt ingen möjlighet att be dem att åka härifrån, säger Aleksander Espenberg.  Därför agerar man inte  Ett ryskt militärfartyg stryker förbi nära fartygen. Enligt Estland har Ryssland numera alltid ett, ibland två, ute på patrull i Finska viken. På grund av Rysslands allt tydligare militära närvaro runt skuggflottan avstår marinen därför från att agera mot fartyg som - inom citationstecken - bara misstänks för att inte ha sina papper i ordning. Även om havsrätten alltjämt ger möjlighet att ingripa när ett fartyg inte tros vara rätt flaggat, förklarar den högsta chefen på basen i Tallinn. – Ryssland har gjort klart att de ser sin skuggflotta som ett nationellt säkerhetsintresse som de kommer skydda militärt. Risken för militär upptrappning är därför för stor för att vi ska överväga fördelarna med att beslagta ett av fartygen, säger Ivo Värk, Estlands marinchef. Framför allt ses fartygen som hotande miljökatastrofer och risker för sjösäkerheten. Tidigare har de också misstänkts för flera fall av sabotage mot kablar, genom att ha låtit sina ankare släpa på havsbotten. Marinen bedömer att skuggflottan totalt består av mellan 800 och 1000 fartyg, men betonar samtidigt att det inte finns någon enhetlig definition och att olika länder därför gör olika beräkningar. Och även om bevakningen nu förbättrats finns i Estland fortfarande en känsla av att ligga steget efter dessa pusselbitar som gör att Ryssland fortsatt kan tjäna pengar på sina naturtillgångar. – Självklart skulle vi vilja veta mer om dem. För att göra det försöker vi etablera bättre informationsutbyte med andra länder. Och ja, vår lägesbild har förbättrats, men det är fortfarande en lång väg kvar att gå, säger Ardo Riibon, operationschef vid Estlands marin.", "link": "https://www.tv4.se/artikel/54SiBGJanjUiNDcr2A5ITp/manga-fartyg-fast-i-finska-viken-precis-utanfoer-var-troeskel", "date_display": "2026-04-14", "date_iso": "2026-04-14T09:19:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/politik", "/skuggflottan", "/ryssland", "/estland"]}, {"id": 155, "title": "Teachers taped over students' mouths - acquitted", "summary": "According to the police investigation, the female teacher's actions must have gone on for several months at a school in Gothenburg. It was discovered last year when a child in primary school told one of the school staff. The parents then reported the incident to the police and it turned out that ten students had been affected. When the children became too loud during the lessons, the teacher taped their mouths shut. Some of the students were also given post-it notes, on which the teacher had written a zero, on their foreheads. Disagreeing district court The teacher told the police investigation that the reason was that she wanted to create study unrest and that no other method worked. The woman was charged with minor assault and molestation against a total of ten children. Today the verdict was handed down. The Gothenburg district court believes that it is proven that the teacher taped the students' mouths, but that it did not cause any pain or violate their peace in a perceptible way.  \"The prosecutor has also failed to show that the teacher had intent on the acts,\" writes the court. The woman was therefore acquitted of the charges. However, the court disagreed. The judge and a jury wanted to convict the teacher of seven counts of molestation, saying her actions were reckless.", "title_original": "Lärare tejpade för elevers munnar – frias", "summary_original": "Den kvinnliga lärarens agerande ska enligt polisutredningen ha pågått i flera månader på en skola i Göteborg. Det uppdagades förra året när ett barn i lågstadiet berättade för en ur skolpersonalen. Föräldrarna polisanmälde då händelsen och det visade sig att tio elever hade drabbats. När barnen blev för högljudda under lektionerna tejpade läraren igen deras munnar. Vissa av eleverna fick också post-it-lappar, som läraren hade skrivit en nolla på, på pannan. Oenig tingsrätt Läraren har i polisutredningen berättat att anledningen var att hon ville skapa studiero och att ingen annan meto
