dra ställen än kontoret. Biltillverkaren Volvo Cars har helt slopat hemarbete. Även Scania har skärpt reglerna för distansarbete. Oro hos arbetsgivare Sveriges Ingenjörer förstår att arbetsgivare vill ha sina anställda på plats. Vi hör att arbetsgivare är lite oroliga för innovationskraften och kreativiteten. Arbetsgivare ser en stor vinst i att många träffas och har möjlighet att utbyta idéer och tankar på ett sätt som är svårt att göra när man är på distans, säger Ulrika Lindstrand. Facket framhåller att ökad närvaro på kontoret, för dem som kan arbeta på distans, riskerar att leda till att fler kvinnor behöver gå ner i tid.", "title_original": "Larmar: Kvinnor kan tvingas gå ner i tid när hemarbete stoppas", "summary_original": "År 2019 jobbade 11 procent av de kvinnliga ingenjörerna deltid, bland männen var motsvarande siffra 4 procent. Sedan dess har deltidsarbetet framför allt hos kvinnor gått ner. Förra året jobbade 7 procent av kvinnorna deltid, visar undersökningen från fackförbundet Sveriges Ingenjörer. Exakt vad som ligger bakom den sjunkande siffran är svårt att slå fast. Sveriges Ingenjörer pekar på att distansarbetet framför allt har gjort det möjligt för kvinnor att gå upp till heltid. Det finns en stor vinning i det, förutom det ekonomiska. Att just kunna hinna med att jobba heltid för att du har möjlighet att vara mer flexibel i hur du förlägger din arbetstid, säger Ulrika Lindstrand, förbundsordförande för Sveriges Ingenjörer. Fler stoppar hemarbete Anledningen till att man väljer att gå ner i tid skiljer sig åt mellan könen, enligt undersökningen. Kvinnor anger oftare familjeskäl, exempelvis att kunna hämta barnen. Män uppger i större utsträckning att de vill trappa ner inför pensionen. Även fackförbundet Akavia, med jurister, ekonomer och samhällsvetare, har sett en liknande trend sedan 2019. Bland kvinnor har andelen deltidsarbetare gått från 9 procent 2019 till 6 procent 2025. Men på senare tid har fler arbetsgivare valt att begränsa möjlighete   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
