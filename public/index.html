ce": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "DN's music editor: Here is February's best music", "summary": "Dreamy pop songs, soundtrack to a controversial film and evocative disco lines. Hannes, Charli XCX and Lykke Li are behind some of the most important music releases from the past month, according to DN's music editorial.", "title_original": "DN:s musikredaktion: Här är februaris bästa musik", "summary_original": "Drömska poplåtar, soundtrack till en omdiskuterad film och suggestiva discostråkar. Hannes, Charli XCX och Lykke Li står bakom några av de viktigaste musiksläppen från den gångna månaden, enligt DN:s musikredaktion.", "link": "https://www.dn.se/kultur/dns-musikredaktion-har-ar-februaris-basta-musik/", "date_display": "2026-02-28", "date_iso": "2026-02-28T14:57:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Neighbors in Tel Aviv agree: This is something that must be done", "summary": "Today's broadcaster Arne Lapidus reports directly from Israel • Explosions are heard nearby.", "title_original": "Grannarna i Tel Aviv överens: Det här är något som måste göras", "summary_original": "Dagens utsände Arne Lapidus rapporterar direkt från Israel • Smällar hörs i närheten.", "link": "https://www.dagen.se/nyheter/grannarna-i-tel-aviv-oeverens-det-haer-aer-nagot-som-maste-goeras/10227801", "date_display": "2026-02-28", "date_iso": "2026-02-28T14:42:59+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Christian Iranians in exile hope for a brighter future for the people after the attacks", "summary": "Pastor Hossein Bahrami: \"We pray for God to protect ordinary people in Iran\"", "title_original": "Kristna exiliranier hoppas på ljusare framtid för folket efter attackerna", "summary_original": "Pastor Hossein Bahrami: ”Vi ber för att Gud ska skydda vanliga människor i Iran”", "link": "https://www.dagen.se/nyheter/kristna-exiliranier-hoppas-pa-ljusare-framtid-foer-folket-efter-attackerna/10227619", "date_display": "2026-02-28", "date_iso": "2026-02-28T13:58:48+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "The attack on Iran: This we know", "summary": "Israel and the US have joined forces to attack Iran. The attack – as well as counterattacks – is ongoing. This is what we know so far.", "title_original": "Attacken mot Iran: Detta vet vi", "summary_original": "Israel och USA har gått till gemensam attack mot Iran. Angreppet – liksom motattacker – pågår. Detta är vad vi hittills vet.", "link": "https://www.dagen.se/nyheter/attacken-mot-iran-detta-vet-vi/10227743", "date_display": "2026-02-28", "date_iso": "2026-02-28T13:23:02+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Iran to attack in several countries: \"Powerful blows\"", "summary": "Strikes back after US and Israeli airstrikes in the morning", "title_original": "Iran till angrepp i flera länder: ”Kraftiga slag”", "summary_original": "Slår tillbaka efter flygangrepp från USA och Israel på morgonen", "link": "https://www.dagen.se/nyheter/iran-till-angrepp-i-flera-laender-kraftiga-slag/10227729", "date_display": "2026-02-28", "date_iso": "2026-02-28T13:15:35+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Camilla on the unusual syndrome: \"Hope they find a solution\"", "summary": "Every winter, Camilla Jensen gets problems with her fingers. The cause is Raynaud's syndrome, which causes the fingers to change colour, she loses sensation and gets pain.  - As soon as I get the slightest bit cold, my fingers turn completely chalky white. But it is not only in the winter that she is affected, says Camilla Jensen. She can feel it even when it's hot, if the weather changes. - It can be 30 degrees outside, but when it starts to wind or rain, I immediately feel that my fingers are getting cold. If I've worked out, I have to change within five minutes. According to 1177, it is unknown what causes the phenomenon, but there is a certain heredity. If you work a lot with machines that vibrate, have a high stress level or have some other illness, it can lead to Raynaud's syndrome. Pain when sensation returns Camilla Jensen has tried tricks like electric gloves and hand warmers to no avail, and dresses as much as she can. - People think I'm going on a polar expedition, then they panic when they see my fingers. Once she warms up again, it means great pain in her fingers. - It feels like a thousand needles and really hurts. It's a huge problem for me. \"I hope they find a solution\" Camilla Jensen has sought care and participated in research studies at Sahlgrenska University Hospital in Gothenburg, but has not received any answers. - They don't know much. I got an ointment, but it hardly helped. The ointment widened the blood vessels, but a side effect was that Camilla got a migraine. Her solution is simply not to get cold. - I have to adapt a lot. I always have to warm up the car beforehand and can never stand still and talk outside. Alex Relander, doctor and general specialist at Jakobsberg University Medical Center, explains that the fingers change color when oxygen-rich blood is driven away. The phenomenon affects people in different ways.  - It is most common in young women and often debuts in adolescence or young adulthood.   At the moment, Camilla Jensen has no way of dealing with her condition. - I have no tricks to solve this,", "title_original": "Camilla om ovanliga syndromet: ”Hoppas att de hittar en lösning”", "summary_original": "Varje vinter får Camilla Jensen problem med sina fingrar. Orsaken är Raynauds syndrom som gör att fingrarna skiftar färg, hon tappar känseln och får ont.  – Så fort jag blir det minsta lilla kall så blir fingrarna helt kritvita. Men det är inte bara på vintern som hon drabbas, berättar Camilla Jensen. Hon kan känna av det även när det är varmt, om vädret slår om. – Det kan vara 30 grader ute, men när det börjar blåsa eller regna känner jag direkt att fingrarna blir kalla. Har jag tränat måste jag byta om inom fem minuter. Enligt 1177 är det okänt vad fenomenet beror på, men det finns en viss ärftlighet. Om man jobbar mycket med maskiner som vibrerar, har hög stressnivå eller har någon annan sjukdom kan det leda till Raynauds syndrom. Smärta när känseln kommer tillbaka Camilla Jensen har testat knep som elektriska vantar och handvärmare utan resultat, och klär på sig så mycket hon kan. – Folk tror att jag ska ut på polarexpedition, sen får de panik när de ser mina fingrar. När hon väl blir varm igen innebär det stor smärta i fingrarna. – Det känns som tusen nålar och gör riktigt ont. Det är ett jätteproblem för mig. ”Hoppas de hittar en lösning” Camilla Jensen har sökt vård och deltagit i forskningsstudier vid Sahlgrenska Universitetssjukhuset i Göteborg, men har inte fått några svar. – De vet inte så mycket. Jag fick en salva, men den hjälpte knappt. Salvan vidgade blodkärlen, men en biverkning var att Camilla fick migrän. Hennes lösning är helt enkelt att inte bli kall. – Jag får anpassa mig mycket. Jag måste alltid värma upp bilen i förväg och kan aldrig stå still och prata utomhus. Alex Relander, läkare och allmänspecialist vid Jakobsbergs Universitetsvårdcentral, förklarar att fingrarna byter färg när syrerikt blod drivs bort. Fenomenet drabbar personer på olika sätt.  – Det är vanligast hos unga kvinnor och debuterar ofta i tonåren eller i ung vuxen ålder.   I nuläget har Camilla Jensen inget sätt att hantera sin åkomma. – Jag har inga knep för att lösa detta, men jag hoppas att de hittar en lösning.", "link": "https://www.tv4.se/artikel/ouKuMsX7OpvZnuKNbHbPw/camilla-om-ovanliga-syndromet-hoppas-att-de-hittar-en-loesning", "date_display": "2026-02-28", "date_iso": "2026-02-28T11:44:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/sjukdomar", "/vintervader", "/kyla"]}, {"id": 134, "title": "Ingrosso: \"Enjoys not being harassed every day\"", "summary": "It was between October 2024 and May 2025 that the man stalked and sent hundreds of messages to Bianca Ingrosso that contained both insults and threats. Despite being blocked, the man created new fake accounts on social media, more than 40 in total and the attempts at contact went from a few times a week to several times every day.\n\nThe man also physically stalked her by appearing outside her home, workplace and waiting in various places. Last year, against his denial in the district court, the then 38-year-old man was sentenced to five months in prison for unlawful persecution, a sentence that was upheld by the Svea Court of Appeal.  \"Psychically terrorized\" In the new season of Wahlgren's world, you get to follow Bianca and the family during and after the trial. For Bianca, it wasn't the threats themselves that were worst, but the psychological strain of being constantly exposed.  - The troublesome thing is not what he writes to me, but the troublesome thing is being in someone else's psyche...... It's a \"wacko\" brain. That's what's been the hardest part about this whole thing. That you feel psychologically terrorized, she says in the series. \n\nIn Nyhetsmorgon, she talks about how the time was afterwards.  - I've really put it behind me and just enjoy not being harassed every day and not having to follow someone's rules every five minutes and overthinking that I can't open windows. Loneliness during the trial In the TV series there is a scene where Bianca expresses loneliness because no relatives were present during the first day of the trial and the courtroom was full of journalists. Bianca says she didn't ask anyone to come.\n\n- I am one of those people who never asks for help, never asks for a hug, makes no demands on anyone. I have not told anyone that this is the trial. That feeling wasn't so great. I looked out over a full courtroom but couldn't make eye contact with a single person I know.\n\nAfter the trial, she has begun to reevaluate her way of asking for support. Pernilla Wahlgren said", "title_original": "Ingrosso: ”Njuter av att inte trakasseras varje dag”", "summary_original": "Det var mellan oktober 2024 till maj 2025 som mannen stalkade och skickade hundratals meddelanden till Bianca Ingrosso som innehöll både kränkningar och hot. Trots blockeringar skapade mannen nya falska konton på sociala medier, totalt över 40 stycken och försöken till kontakt gick från några gånger i veckan till flera gånger varje dag.\n\nMannen stalkade även henne fysiskt genom att dyka upp utanför hennes hem, arbetsplats och väntade på olika platser. Förra året dömdes den då 38-årige mannen mot sitt nekande i tingsrätten för olaga förföljelse till fängelse i fem månader, en dom som Svea Hovrätt fastställde.  ”Psykiskt terroriserad” I den nya säsongen av Wahlgrens värld får man följa Bianca och familjen i och efter rättegången. För Bianca var det inte hoten i sig som var värst, utan den psykiska påfrestningen av att ständigt vara utsatt.  – Det jobbiga är inte vad han skriver till mig utan det jobbiga är att vara i någon annans psykiska......Det är en \"wacko\" hjärna. Det är det som har varit jobbigast med hela den här grejen. Att man känner sig psykiskt terroriserad, säger hon i serien. \n\nI Nyhetsmorgon berättar hon om hur tiden varit efteråt.  – Jag har verkligen lagt det bakom mig och bara njuter av att inte vara trakasserad varje dag och inte behöva följa någons regler var femte minut och övertänka att jag inte kan öppna fönster. Ensamhet under rättegången  I tv-serien finns en scen där Bianca uttrycker ensamhet eftersom ingen närstående var på plats under den första rättegångsdagen och rättegångssalen var full av journalister. Bianca berättar att hon inte bad någon att komma.\n\n– Jag är en av de personerna som aldrig ber om hjälp, aldrig ber om en kram, inte ställer några krav på någon. Jag har inte sagt till någon att det är den här rättegången. Den känslan var inte så härlig. Jag tittade ut över en full rättssal men kunde inte möta blicken med en enda person jag känner.\n\nEfter rättegången har hon börjat omvärdera sitt sätt att be om stöd. Pernilla Wahlgren säger att det var tufft att som mamma följa Biancas situation under rättegången. \n\n– Jag är jättelättad, för det var en jobbig period under lång tid. Sedan var det också så fint att se hur så många som följer dig och även folk som kanske har haft sämre förutfattade meningar om dig innan att de ändrade sig och slöt upp och du fick så mycket stöd. Att hon vågade ta tag i det och gå till rättegång är också en viktig förebild för andra unga tjejer och killar som ofta råkar ut för den här typen av trakasserier.", "link": "https://www.tv4.se/artikel/6KoR4pxpWxjrjaQmHe8Avm/bianca-ingrosso-om-tuffa-tiden-efter-stalkern", "date_display": "2026-02-28", "date_iso": "2026-02-28T11:11:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/personer/pernilla-wahlgren", "/personer/bianca-ingrosso", "/wahlgrens-varld"]}, {"id": 135, "title": "Adele Raemer and her grandson had to seek shelter when the air raid alert went off in Israel", "summary": "\"It will probably be a few days in the shelter\"", "title_original": "Adele Raemer och hennes barnbarn fick söka skydd när flyglarmet gick i Israel", "summary_original": "”Det kommer nog att bli några dagar i skyddsrummet”", "link": "https://www.dagen.se/nyheter/adele-raemer-och-hennes-barnbarn-fick-soeka-skydd-naer-flyglarmet-gick-i-israel/10227445", "date_display": "2026-02-28", "date_iso": "2026-02-28T10:29:17+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Expert: \"Pandora's box is wide open\"", "summary": "The attack on Iran was expected – the goal is regime change", "title_original": "Expert: ”Pandoras box är vidöppen”", "summary_original": "Anfallet mot Iran var väntat – målet är regimskifte", "link": "https://www.dagen.se/nyheter/expert-pandoras-box-aer-vidoeppen/10227347", "date_display": "2026-02-28", "date_iso": "2026-02-28T08:16:12+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Israel and the US attack Iran", "summary": "To be confirmed from both countries • Exemption permit issued in Israel", "title_original": "Israel och USA i anfall mot Iran", "summary_original": "Bekräftas från båda länderna • Undantagstillstånd utfärdat i Israel", "link": "https://www.dagen.se/nyheter/israel-och-usa-i-anfall-mot-iran/10227306", "date_display": "2026-02-28", "date_iso": "2026-02-28T08:01:46+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Clinton was grilled about Epstein - gave answers about the woman in the jacuzzi", "summary": "The hearing was held in Chappaqua near the Clintons' home in New York. The day before, Hillary Clinton was interrogated, a move she herself calls \"partisan political theater\" as both she and Bill say she doesn't even remember meeting Epstein. Hillary was also asked about both UFOs and the \"Pizzagate\" conspiracy theory. Committee chairman James Comer describes the hearing with Bill Clinton as productive.  Nancy Mace, Republican representative from South Carolina, told a press conference outside the venue that he answered all the questions.  - His lawyers told him to shut up, but he kept going, she says.  On the other hand, she believes, there are things in the Clinton couple's testimony that do not add up. Which ones she doesn't go into.  The woman in the bathtub During the hearing, Bill Clinton was asked about the woman he was photographed next to in a jacuzzi, a woman he says he does not remember but knows he has not had sex with.   He was also confronted with reports that he flew on Jeffrey Epstein's private jet on 27 occasions and that Epstein visited the White House 17 times during his presidency. - I myself grew up with domestic violence. \"Had I had the slightest idea what Epstein was doing, I would not only have refused to fly on his plane - I would have reported him,\" he replied.  Could be Trump's turn After the hearing, Democrats on the committee came out and said now is the time for Trump to testify.  Bill Clinton is the first former president to be questioned by Congress in over 40 years.  - A new precedent has been set today, said Ro Khanna, representative from California. - Now we have established the \"Clinton rule\". When a president and family are called to Congress, you have to testify. That means Trump has to come here and explain what he knows about Epstein.  The Clintons received the summons last August. They initially refused to testify but relented when Republicans threatened to impeach them in contempt of court.", "title_original": "Clinton grillades om Epstein – gav svar om kvinnan i jacuzzin", "summary_original": "Förhöret hölls i Chappaqua nära paret Clintons hem i New York. Dagen innan förhördes Hillary Clinton, ett tilltag hon själv kallar ”partipolitisk teater” då både hon och Bill menar att hon inte ens minns att hon träffat Epstein. Hillary frågades dessutom om både UFO:n och konspirationsteorin ”Pizzagate”. Kommitténs ordförande James Comer beskriver förhöret med Bill Clinton som produktivt.  Nancy Mace, republikansk representant från Southern Carolina, sade till ett pressuppbåd utanför lokalen att han svarade på alla frågor.  – Hans advokater sade åt honom att hålla käften men han körde på, säger hon.  Däremot, menar hon, finns det saker i paret Clintons vittnesmål som inte går ihop. Vilka går hon inte in på.  Kvinnan i badkaret Under utfrågningen fick Bill Clinton frågor om den kvinna han fotades bredvid i en jacuzzi, en kvinna han säger att han inte minns men vet att han inte har haft sex med.   Han konfronterades också med uppgifter om att han flugit med Jeffrey Epsteins privatflygplan vid 27 tillfällen och att Epstein besökte Vita huset 17 gånger under hans presidenttid. – Jag har själv vuxit upp med våld i hemmet. Hade jag haft minsta aning om vad Epstein gjorde hade jag inte bara tackat nej till att flyga med hans plan – jag hade anmält honom, svarade han.  Kan bli Trumps tur Efter förhöret gick demokraterna i kommittén ut och sade att det nu är dags för Trump att vittna.  Bill Clinton är den första expresidenten som förhörs av kongressen på över 40 år.  – Ett nytt prejudikat har satts i dag, sade Ro Khanna, representant från Kalifornien. – Nu har vi etablerat ”Clinton-regeln”. När en president med familj kallas till kongressen så måste man vittna. Det betyder att Trump måste komma hit och förklara vad han vet om Epstein.  Paret Clinton fick kallelsen i augusti förra året. De vägrade först att vittna men gav med sig när republikanerna hotade att anklaga dem för ohörsamhet mot rätta.", "link": "https://www.tv4.se/artikel/2Ob4p9Dj36TRT9pRjA5gSd/clinton-grillades-om-epstein-gav-svar-om-kvinnan-i-jacuzzin", "date_display": "2026-02-28", "date_iso": "2026-02-28T07:25:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/bill-clinton", "/jeffrey-epstein", "/epstein-dokumenten"]}, {"id": 139, "title": "Classic tiramisu", "summary": "The kitchen's dinner offers a classic tiramisu - a timeless Italian dessert. Layers of quick coffee-dipped Savoyard biscuits and an airy mascarpone cream provide a perfect balance between sweetness and coffee, topped with a generous layer of cocoa. Easy to prepare in a large form and perfect to leave in the fridge for a few hours before serving - the taste only gets better if it is allowed to sit for a few hours. For Roy Fare's recipe", "title_original": "Klassisk tiramisu", "summary_original": "Kökets middag bjuder på en klassisk tiramisu - en tidlös italiensk dessert. Lager av snabbt kaffedoppade savoiardikex och en luftig mascarponekräm ger en perfekt balans mellan sötma och kaffe, toppad med ett generöst lager kakao. Enkel att förbereda i stor form och perfekt att låta stå i kylen några timmar innan servering – smaken blir bara bättre om den får stå till sig några timmar. Till Roy Fares recept", "link": "https://www.tv4.se/artikel/6FC7y9W2dLyF1Y5hl0R89w/klassisk-tiramisu", "date_display": "2026-02-28", "date_iso": "2026-02-28T06:46:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/kokets-helgtips", "/koket", "/roy-fares"]}, {"id": 140, "title": "Trump: Ayatollah Khamenei is dead", "summary": "Ayatollah Ali Khamenei's body has been found, Israeli sources told Reuters. In a post on Truth social, Donald Trump states that the Ayatollah is dead. The UN Secretary-General regrets that the opportunity for diplomacy was \"wasted\".", "title_original": "Trump: Ayatolla Khamenei är död", "summary_original": "Ayatolla Ali Khameneis kropp har hittats, enligt israeliska källor till Reuters. I ett inlägg på Truth social slår Donald Trump fast att ayatollan är död. FN:s generalsekreterare beklagar att möjligheten till diplomati ”slösats bort”.", "link": "https://www.svd.se/a/zOE95r/israel-har-attackerat-iran", "date_display": "2026-02-28", "date_iso": "2026-02-28T06:32:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Världen"]}, {"id": 141, "title": "The hidden trail in the Palm murder - revealed with the help of AI technology", "summary": "The documentary \"Hidden Traces of the Palm Murder\" follows a group of researchers and computer scientists who use AI to analyze the parts of the now closed police investigation that have been made public.   The AI ​​has compared different versions of masked documents and searched for connections between people in the gigantic investigative material. - We have found interesting connections thanks to this way of working. We can sort down or filter down to a certain number of people who are extra interesting, says engineer Jerry Dahlsberg in the documentary.  AI points towards elite soldiers The AI's analysis is that a small group of Swedish elite soldiers with good access to weapons could be involved in the crime. One of them has been called Lt. X in reports on the investigation. The police's Palme group received an early tip about him and he was investigated with the help of the Security Police and the Armed Forces' security department.  - During the week before the Palm murder, a secret military exercise took place on Gotland. It consisted of paratroopers. This exercise ended on the same day that Palme was murdered, in the middle of the day, and a number of people who had taken part in the exercise were flown to Stockholm. One of them was Lt. X, says Gunnar Wall, journalist and author who has written about the prime minister's assassination for many years. In the documentary, Lieutenant X and other participants are stated to have given conflicting information about the times of the trip and where they were on the night of the murder. It is shown that their different testimonies about what time they arrived home on February 28 and when they heard about the murder do not match.  Missing logs and radar images The documentary The hidden traces of the Palm murder also mentions that military air transports at the time were documented, but that some transports during the night of the murder are missing from the War Archive. Recorded radar images are also missing on the evening in question.  - There are logs for military air transports that were made in Sweden at this time. But precisely for the evening of the murder, the decisive leaf is missing, says Gunnar Wall, journalist and author. The documentary", "title_original": "Dolda spåret i Palmemordet – avslöjas med hjälp av AI-teknik", "summary_original": "Dokumentären \"Palmemordets dolda spår\" följer en grupp forskare och datavetare som använder AI för att analysera de delar av den numera nedlagda polisutredningen som har gjorts offentliga.   AI:n har jämfört olika versioner av maskade dokument och sökt kopplingar mellan personer i det gigantiska utredningsmaterialet. – Vi har hittat intressanta kopplingar tack vare det här arbetssättet. Vi kan sortera ned eller filtrera ned till vissa antal personer som är extra intressanta, säger ingenjören Jerry Dahlsberg i dokumentären.  AI pekar mot elitsoldater AI:ns analys är att en liten grupp svenska elitsoldater med god tillgång till vapen skulle kunna vara inblandade i dådet. En av dem har i rapporter om utredningen kallats för Löjtnant X. Polisens Palmegrupp fick tidigt tips om honom och han utreddes med hjälp av Säkerhetspolisen och Försvarsmaktens säkerhetsavdelning.  – Under veckan före Palmemordet pågick det en hemlig militärövning på Gotland. Den bestod av fallskärmsjägare. Den här övningen avslutades samma dag som Palme mördades, mitt på dagen, och ett antal personer som hade varit med på övningen flögs till Stockholm. En av dem var Löjtnant X, säger Gunnar Wall, journalist och författare som under många år skrivit om statsministermordet. I dokumentären uppges Löjtnant X och andra deltagare ha lämnat motstridiga uppgifter om tiderna för resan och var de befann sig under mordkvällen. Det visas att deras olika vittnesmål om vilken tid de kom hem den 28 februari och när de fick höra om mordet inte stämmer överens.  Saknade loggar och radarbilder Dokumentären Palmemordets dolda spår tar också upp att militära flygtransporter vid tiden dokumenterades, men att vissa transporter under mordkvällen saknas i Krigsarkivet. Även inspelade radarbilder saknas den aktuella kvällen.  – Det finns loggar för militära flygtransporter som gjordes i Sverige vid den här tiden. Men just för mordkvällen saknas det avgörande bladet, säger Gunnar Wall journalist och författaren. Dokumentären beskriver hur teamet får kontakt med en person i Löjtnant X:s närhet, som vittnar om att fallskärmsjägaren en gång efter att ha druckit mycket visade upp ett likadant vapen som det Palme dödades med. – Det var en Magnum. Jag glömmer det aldrig. Han sa att \"Det var en sån här som sköt Olof Palme\", säger personen.  Dokument visar att polisens Palmegrupp arbetade intensivt med uppgifter om svenska militärer åren innan utredningen lades ned. Den utpekade Löjtnant X förnekade i alla polisförhör inblandning i mordet och hävdade att han hade alibi för natten. Han utvandrade från Sverige på 90-talet och är i dag avliden.", "link": "https://www.tv4.se/artikel/7kv1xcsWJFSZ0bMRACFg1Z/dolda-sparet-i-palmemordet-avsloejas-med-hjaelp-av-ai-teknik", "date_display": "2026-02-28", "date_iso": "2026-02-28T05:38:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/palmemordet", "/ai"]}, {"id": 142, "title": "Julia Forsberg:\nJesus is never jealous", "summary": "\"Let us take Jesus as an example, let us receive with joy and give generously\"", "title_original": "Julia Forsberg:\nJesus är aldrig missunnsam", "summary_original": "”Låt oss ta Jesus som föredöme, låt oss ta emot i glädje och ge generöst”", "link": "https://www.dagen.se/livsstil/julia-forsberg-jesus-aer-aldrig-missunnsam/10217826", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 143, "title": "Martina Möllås and Ola Hedén's new fair makes the mind dance", "summary": "Urban Thoms shares three music favorites from the beginning of 2026", "title_original": "Martina Möllås och Ola Hedéns nya mässa får sinnet att dansa", "summary_original": "Urban Thoms delar med sig av tre musikfavoriter från början av 2026", "link": "https://www.dagen.se/kultur/martina-moellas-och-ola-hedens-nya-maessa-far-sinnet-att-dansa/10220150", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "\"It's been a long hunt to find myself\"", "summary": "Ola Whistler Sahlén, formerly Ola Joyce, in a great interview about the mystery that never let go of him, and the path to the priesthood.", "title_original": "”Det har varit en lång jakt på att få tag på mig själv”", "summary_original": "Ola Whistler Sahlén, tidigare Ola Joyce, i stor intervju om mysteriet som aldrig släppt taget om honom, och vägen till prästyrket.", "link": "https://www.dagen.se/livsstil/det-har-varit-en-lang-jakt-pa-att-fa-tag-pa-mig-sjaelv/10173977", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 145, "title": "Finally, EU politicians are taking the hatred against Christians seriously", "summary": "Erik Helmerson: But don't let the fight for religious freedom degenerate into a culture war.", "title_original": "Äntligen tar EU-politikerna hatet mot kristna på allvar", "summary_original": "Erik Helmerson: Men låt inte kampen för religionsfrihet urarta i kulturkrig.", "link": "https://www.dagen.se/ledare/aentligen-tar-eu-politikerna-hatet-mot-kristna-pa-allvar/10220652", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "John Piper's pro-refugee posts received backlash from Christians in the US", "summary": "A quote from Leviticus about caring for the stranger sparked an outcry among Christians.", "title_original": "John Pipers flykting­vänliga inlägg fick mothugg från kristna i USA", "summary_original": "Ett citat från Tredje Mosebok om att ta hand om främlingen väckte ramaskri bland kristna.", "link": "https://www.dagen.se/nyheter/john-pipers-flyktingvaenliga-inlaegg-fick-mothugg-fran-kristna-i-usa/10226532", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 147, "title": "Historic decision: The European Parliament voted to use the term Christophobia", "summary": "Alice Teodorescu Måwe (KD) disappointed with politicians who voted no on the issue.", "title_original": "Historiskt beslut: Europaparlamentet röstade för att använda begreppet kristofobi", "summary_original": "Alice Teodorescu Måwe (KD) besviken över politiker som röstade nej i frågan.", "link": "https://www.dagen.se/nyheter/historiskt-beslut-europaparlamentet-roestade-foer-att-anvaenda-begreppet-kristofobi/10218591", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 148, "title": "Gaping reality stars destroy American Traitors", "summary": "Today's culture editor Daniel Wistrand gives his best TV, film and podcast tips", "title_original": "Gapiga realitystjärnor förstör amerikanska Förrädarna", "summary_original": "Dagens kulturredaktör Daniel Wistrand ger sina bästa tv, film och podd-tips", "link": "https://www.dagen.se/kultur/gapiga-realitystjaernor-foerstoer-amerikanska-foerraedarna/10217461", "date_display": "2026-02-28", "date_iso": "2026-02-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Dark numbers: 90,000 Ukrainians disappeared since the start of the war", "summary": "More than 90,000 Ukrainians are officially registered as missing following Russia's full-scale invasion, according to new figures. The information comes from Ukraine's Commissioner for Missing Persons and has been reported by Ukrainian Pravda. - These are depressing figures, but not particularly surprising, says Joakim Paasikivi, military expert. Paasikivi assesses that the majority of those registered are probably soldiers, but that civilians are also covered. One explanation could be that Ukrainian forces have retreated from areas where fighting previously took place. When it is not possible to retrieve the fallen, they can instead be registered as missing, according to Paasikivi. \"A tragic consequence\" - There is a dark story there too, we know that the Russians have not declared all the prisoners of war they have taken, says Paasikivi. He sees it as most likely that a majority of the missing are dead, but that a clearer assessment requires that the war be ended or that the situation be stabilized. - It is required that there be some kind of peace and stabilization or a standstill so that it can be clarified. The situation is common in war and involves a great deal of uncertainty, which hits relatives hard. - It is a tragic consequence, with everyone missing, it is a large amount of personal tragedies, says Joakim Paasikivi. Difficult to compare with other wars Paasikivi believes that some people who are registered as missing may be difficult to ever find again. - If you get hit by a grenade, there is very little left. Then it is more difficult to identify the person. He also says that the numbers are difficult to compare with other conflicts because the scale of the war is unprecedented in modern times. - This war can really only be compared to the Second World War. There is nothing like it to be found almost. The outlook for how many of those registered will return is difficult to assess. - In Ukraine and in previous wars, it has also happened that people who were categorized as missing or even fallen have later returned from captivity, says Jo", "title_original": "Mörka siffrorna: 90 000 ukrainare försvunna sedan krigets start", "summary_original": "Mer än 90 000 ukrainare är officiellt registrerade som försvunna efter Rysslands fullskaliga invasion, enligt nya siffror. Uppgifterna kommer från Ukrainas kommissionär för försvunna personer och har rapporterats av ukrainska Pravda. – Det är beklämmande siffror, men inte särskilt överraskande, säger Joakim Paasikivi, militärexpert. Paasikivi bedömer att majoriteten av de registrerade troligen är soldater, men att även civila omfattas. En förklaring kan vara att ukrainska styrkor har backat från områden där strider tidigare pågått. När man inte kan hämta stupade kan de i stället registreras som saknade, enligt Paasikivi. ”En tragisk konsekvens” – Det finns ett mörkertal där också, vi vet att ryssarna inte har uppgett alla krigsfångar de har tagit, säger Paasikivi. Han ser det som mest troligt att en majoritet av de saknade är stupade, men att en tydligare bedömning kräver att kriget avslutas eller att läget stabiliseras. – Det krävs att det blir någon slags fred och stabiliseras eller ett stillestånd så att man kan få klarhet i det. Situationen är vanlig i krig och innebär en stor osäkerhet som drabbar anhöriga hårt. – Det är en tragisk konsekvens, med alla saknade så är det en stor mängd personliga tragedier, säger Joakim Paasikivi. Svårt att jämföra med andra krig Paasikivi menar att vissa personer som registreras som försvunna kan vara svåra att någonsin finna igen. – Blir man träffad av en granat, blir det väldigt lite kvar. Då är det svårare att identifiera personen. Han säger också att siffrorna är svåra att jämföra med andra konflikter eftersom krigets omfattning saknar motstycke i modern tid. – Det här kriget går egentligen bara att jämföra med andra världskriget. Det finns inget liknande att hitta nästan. Utsikterna för hur många av de registrerade som kommer återvända är svåra att bedöma. – I Ukraina och i tidigare krig har det också hänt att folk som kategoriserats som försvunna eller till och med stupade senare har kommit tillbaka ur fångenskap, säger Joakim Paasikivi.", "link": "https://www.tv4.se/artikel/2SCHL8CpiN62xazqooeNpT/moerka-siffrorna-90-000-ukrainare-foersvunna-sedan-krigets-start", "date_display": "2026-02-27", "date_iso": "2026-02-27T21:34:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/joakim-paasikivi"]}, {"id": 150, "title": "Here, the bride and groom are surprised by Medina - in the middle of the wedding", "summary": "Sami Rekik and Ali Jammali of the hip-hop duo Medina were in their hotel room in Kristianstad, preparing for Melodifestivalen's third competition, when they suddenly received a call from a member of the team - that a drop-in wedding was taking place nearby.  - Spontaneous as we are, we threw on our shoes and ran down to the church, but we were still a little worried, says Sami Rekik.  In a TikTok video shared by the duo themselves on their social media, Medina can be seen walking straight into the church with balloons and roses in her hands and starting to sing her competition song \"Viva L'Amore\" to the bride and groom at the altar. - You don't always want to jump in and ruin an important moment. It was a gamble, but we thought it will certainly be appreciated, says Sami Rekik.  The duo says they were unsure how the surprise - and their music - would be received. - When they saw us coming, they probably didn't quite understand what happened at first. They stood there a little awkwardly, says Ali Jammali.  - It was a little because of the reaction that they looked so exposed that made me a little worried, that they might not like this. I then thought that it is best that we leave the flower and stick, says Sami Rekik.  Afterwards, the bride and groom got in touch and said they appreciated the unexpected surprise. - It was a lot of fun, says Ali Jammali.  Later that evening, Medina competed in Melodifestivalen with \"Viva L'Amore\" - and made it to the final, which will be decided on March 7 in Stockholm.", "title_original": "Här överraskas brudparet av Medina – mitt i vigseln", "summary_original": "Sami Rekik och Ali Jammali i hiphopduon Medina befann sig på sitt hotellrum i Kristianstad och förberedde sig inför Melodifestivalens tredje deltävling när de plötsligt fick ett samtal från en person i teamet – om att en drop in-vigsel pågick i närheten.  – Spontana som vi är slängde vi på oss skorna och sprang ner till kyrkan, men vi var ändå lite oroliga, säger Sami Rekik.  I en TikTok-video som duon själva delat på sina sociala medier syns Medina kliva rakt in i kyrkan med ballonger och rosor i händerna och börja sjunga sin tävlingslåt ”Viva L’Amore” för brudparet vid altaret. – Det är inte alltid man vill hoppa in och förstöra ett viktigt moment. Det var en chansning, men vi tänkte att det kommer säkert att uppskattas, säger Sami Rekik.  Duon berättar att de var osäkra på hur överraskningen – och deras musik – skulle tas emot. – När de såg oss komma fattade de nog inte riktigt vad som hände först. De stod lite tafatt där, säger Ali Jammali.  – Det var lite på grund av reaktionen att de såg så ställda ut som gjorde mig lite orolig, att de kanske inte gillar det här. Jag tänkte då att det är bäst att vi lämnar blomman och sticker, säger Sami Rekik.  Efteråt hörde brudparet av sig och berättade att de uppskattade den oväntade överraskningen. – Det var väldigt kul, säger Ali Jammali.  Senare samma kväll tävlade Medina i Melodifestivalen med ”Viva L’Amore” – och tog sig vidare till finalen, som avgörs den 7 mars i Stockholm.", "link": "https://www.tv4.se/artikel/4rvgebZnTgz15HwO39rc0l/haer-oeverraskas-brudparet-av-medina-mitt-i-vigseln", "date_display": "2026-02-27", "date_iso": "2026-02-27T19:24:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/efter-fem", "/melodifestivalen", "/gift"]}, {"id": 151, "title": "The armed forces confirm: The drone in Malmö was Russian", "summary": "It took off from the Russian signal reconnaissance ship Zhigulevsk in the Sound and carried out an illegal flight. \"The navy acted quickly to disrupt the drone,\" the authority writes in a press release. - This type of action is not surprising from the Russian side, but it is a serious incident that shows the importance of us maintaining constant vigilance. Our units have acted in an exemplary and professional manner, says Ewa Skoog Haslum, head of the Swedish Armed Forces' operations management, in the press release. After disrupting the drone, the navy followed the ship out of Swedish waters. Now it is in the Baltic Sea. \"The incident involves a violation of the access regulation and is a violation of Swedish airspace. It is, of course, serious and irresponsible,\" writes Defense Minister Pål Jonsson on X. \"We have systems for drones\" That a Russian signals intelligence vessel travels in Swedish waters does not in itself constitute a violation of the law, says Elin Berg, communicator at the Defense Forces, to TV4 Nyheterna. - It is a serious incident precisely because they have committed a violation of the access regulation. Since then, we have not made the assessment that there is any danger to anything worth protecting in the current situation, says Berg. What does jamming a drone mean in practice? - I can't go into any technical details, but we have systems on our ships to disrupt drones. It is a capability that is integrated into the marine units that we have, says Elin Berg, communicator at the Swedish Armed Forces. Why do that instead of shooting it down? - There is nothing I can answer, unfortunately.", "title_original": "Försvarsmakten bekräftar: Drönaren i Malmö var rysk", "summary_original": "Den lyfte från det ryska signalspaningsfartyget Zhigulevsk i Öresund och genomförde en olovlig flygning. ”Marinen agerade snabbt för att störa ut drönaren”, skriver myndigheten i ett pressmeddelande. – Den här typen av agerande är inte förvånande från rysk sida men det är en allvarlig incident som visar på vikten av att vi upprätthåller en ständig vaksamhet. Våra förband har agerat exemplariskt och professionellt, säger Ewa Skoog Haslum, chef för Försvarsmaktens operationsledning, i pressmeddelandet. Efter att ha stört ut drönaren följde marinen efter fartyget ut från svenskt vatten. Nu befinner det sig i Östersjön. ”Händelsen innebär en överträdelse av tillträdesförordningen och är en kränkning av svenskt luftrum. Det är självfallet allvarligt och ansvarslöst”, skriver försvarsminister Pål Jonsson på X. ”Vi har system för drönare” Att ett ryskt signalspanarskepp färdas på svenskt vatten utgör inget lagbrott i sig, säger Elin Berg, kommunikatör på Försvarsmakten, till TV4 Nyheterna. – Det är en allvarlig incident just eftersom att de har gjort en överträdelse av tillträdesförordningen. Sedan har inte vi gjort bedömningen att det är någon fara mot någonting skyddsvärt i dagsläget, säger Berg. Vad betyder det i praktiken att störa ut en drönare? – Jag kan inte gå in på några tekniska detaljer, men vi har system på våra fartyg för att störa ut drönare. Det är en förmåga som är integrerad i de marina förbanden som vi har, säger Elin Berg, kommunikatör på Försvarsmakten. Varför gör man det istället för att skjuta ner den? – Det är ingenting som jag kan svara på, tyvärr.", "link": "https://www.tv4.se/artikel/6B1WPuh1DC3NvzPLU9Bb4p/droenaren-i-malmoe-var-rysk", "date_display": "2026-02-27", "date_iso": "2026-02-27T19:13:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/forsvarsmakten", "/dronare"]}, {"id": 152, "title": "The good news: Spring is here", "summary": "Now it is meteorological spring in parts of southern Sweden - including Malmö, Lund and Helsingborg in Skåne, but also Utklippan in Blekinge and Östergarnsholm on Gotland. Meteorological spring occurs when there are spring-like temperatures for at least seven days in a row in one place, that is, an average temperature above zero degrees. - It is a little later than usual, says meteorologist Lasse Rydqvist on Klart. Stockholmers can get spring this week Further north it may take a little longer. - For example, in Stockholm we only have two days in a row. If you get a day that ends up below zero, you have to start over. Most commonly, Götaland, Svealand and the southern parts of Norrland have spring at the end of March at the latest. But in the very northernmost parts of Sweden, it can sometimes take as long as May. \"Enormously high temperatures\" Earlier in the day, TV4 News meteorologist Madeleine Westin described the heat coming to Sweden. - The temperatures are enormously high. You could say that it is real spring winds that are blowing in over Sweden right now, said Madeleine Westin in TV4's Nyhetsdagen. African warmth helped by British low pressure The plus degrees are due to mild air from down in southern Europe and Africa, with a low pressure on the British Isles directing the lift flow upwards in the direction of Sweden. But the African heat does not reach the whole country. - The further north you go, the temperatures naturally drop. In Östersund and to the north, it has been below zero.", "title_original": "Glädjebeskedet: Våren är här", "summary_original": "Nu är det meteorologisk vår i delar av södra Sverige – bland annat Malmö, Lund och Helsingborg i Skåne, men även Utklippan i Blekinge och Östergarnsholm på Gotland. Meteorologisk vår inträffar när det är vårlika temperaturer minst sju dygn i streck på en plats, det vill säga en medeltemperatur över noll grader. – Det är lite senare än brukligt, säger meteorologen Lasse Rydqvist på Klart. Stockholmarna kan få vår i veckan Längre norrut kan det dröja lite längre. – Exempelvis i Stockholm har vi bara två dygn i rad. Får man ett dygn som hamnar under nollgradigt så måste man ju börja om. Vanligast är att Götaland, Svealand och de södra delarna av Norrland har vår senast i slutet av mars. Men i de allra nordligaste delarna av Sverige kan det ibland dröja så länge som till maj. ”Enormt höga temperaturer” Tidigare under dagen beskrev TV4 Nyheternas meteorolog Madeleine Westin värmen som kommer till Sverige. – Det är enormt höga temperaturer. Man skulle kunna säga att det är riktiga vårvindar som drar in över Sverige just nu, sade Madeleine Westin i TV4 Nyhetsdagen. Afrikansk värme som får hjälp av brittiskt lågtryck Plusgraderna beror på mild luft nerifrån Sydeuropa och Afrika, med ett lågtryck på de brittiska öarna som styr lyftflödet uppåt i riktning mot Sverige. Men den afrikanska värmen når inte upp i hela landet. – Ju längre norrut man kommer faller temperaturerna naturligtvis. I Östersund och norrut har det varit minusgrader.", "link": "https://www.tv4.se/artikel/MzimU7HOvL4YgoLQUveWs/varen-aer-haer", "date_display": "2026-02-27", "date_iso": "2026-02-27T18:49:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Vädret", "/vadret", "/vader", "/var"]}, {"id": 153, "title": "GW: People in black threatened my family - lawyer involved", "summary": "Messiah Hallberg's answer in SVT: \"Shipped home half a ton of apples...\"", "title_original": "GW: Svartklädda personer hotade min familj - kopplar in advokat", "summary_original": "Messiah Hallbergs svar i SVT: ”Fraktade hem ett halvt ton äpplen...”", "link": "https://www.tv4.se/artikel/1A4X1wbmNxBbBKAHZy05qi/gw-svartklaedda-personer-hotade-min-familj-kopplar-in-advokat", "date_display": "2026-02-27", "date_iso": "2026-02-27T18:10:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 154, "title": "Stockholm city acts after increase in Nazi graffiti", "summary": "At the beginning of the year, several schools raised the alarm about Nazi graffiti on their premises. In connection with that, researcher Christer Mattsson, an expert on right-wing extremism at the University of Gothenburg, explained that the development follows a well-known pattern. - I would interpret it as being related to the attention that has been around new far-right groups, not least the active clubs, which in turn generate a curiosity and then you move that aesthetic out to the outside world, he said then. The city faces a new system According to the city of Stockholm's own statistics - which show an increase in far-right graffiti by 140 percent in three years - the problem is now so extensive that the city chooses to introduce a new central system to quickly detect patterns and prioritize vulnerable schools. Stockholm's student councilor Emilia Bjuggren (S) describes the increase as a reflection of societal development. - I think it is clear that we have an increasingly harsh social climate, and where extremism is becoming more normalized and accepted in our society. That kind of problem also finds its way into the school, she says. According to the city, graffiti cleanup works today, but follow-up is being strengthened. - What we are tightening is the central collection of notifications to strengthen the preventive work. We want to be able to have patrols and youth teams in place so that we stop the graffiti before it even happens, says Bjuggren. \"A huge challenge\" The new system should make it easier to see patterns quickly and direct rounds to schools that are most affected. - Unfortunately, we already see that it is more common in areas where the police assess that the right-wing extremist environments are growing, she says. Researcher Christer Mattsson warns that today's graffiti often consists of subtle symbols and memes. The city is also trying to meet that. - It is a huge challenge to stay up to date. That's why we have a lexicon produced together with the Center against Violent Extremism, which is constantly updated, says Bjuggren.", "title_original": "Stockholm stad agerar efter ökning av nazistiskt klotter", "summary_original": "I början av året larmade flera skolor om nazistiskt klotter i sina lokaler. I samband med det förklarade forskaren Christer Mattsson, expert på högerextremism vid Göteborgs universitet, att utvecklingen följer ett välkänt mönster. – Jag skulle tolka det som att det hör ihop med den uppmärksamhet som har varit kring nya högerextrema grupper, inte minst aktivklubbarna, som i sin tur genererar en nyfikenhet och så flyttar man den estetiken ut till omvärlden, sade han då. Staden inför nytt system Enligt Stockholms stads egen statistik – som visar en ökning av högerextremt klotter med 140 procent på tre år – är problemet nu så omfattande att staden väljer att införa ett nytt centralt system för att snabbt upptäcka mönster och prioritera utsatta skolor. Stockholms skolborgarråd Emilia Bjuggren (S) beskriver ökningen som en spegling av samhällsutvecklingen. – Jag tänker att det är tydligt att vi har ett allt hårdare samhällsklimat, och där extremism blir mer normaliserat och accepteras i vårt samhälle. Den typen av problem letar sig också in i skolan, säger hon. Saneringen av klotter fungerar i dag enligt staden, men uppföljningen förstärks. – Det vi skärper är den centrala insamlingen av anmälningarna för att stärka det förebyggande arbetet. Vi vill kunna ha ronderingar och ungdomsteam på plats så att vi stoppar klottret innan det ens sker, säger Bjuggren. ”En jätteutmaning” Det nya systemet ska göra det lättare att se mönster snabbt och rikta ronderingar till skolor som drabbas mest. – Tyvärr ser vi redan att det är vanligare i områden där polisen bedömer att de högerextrema miljöerna växer, säger hon. Forskaren Christer Mattsson varnar för att dagens klotter ofta består av subtila symboler och memes. Även det försöker staden möta. – Det är en jätteutmaning att hålla sig uppdaterad. Därför har vi ett lexikon framtaget tillsammans med Centrum mot våldsbejakande extremism som hela tiden uppdateras, säger Bjuggren.", "link": "https://www.tv4.se/artikel/1XeZ3Zi4PwrQvvC97F17Pe/stockholm-stad-agerar-efter-oekning-av-nazistiskt-klotter", "date_display": "2026-02-27", "date_iso": "2026-02-27T17:04:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/nazism", "/skola", "/stockholm", "/hogerextremism", "/politiker", "/svensk-politik"]}, {"id": 155, "title": "Teodorescu Måwe (KD) cancels first trip to Israel", "summary": "Tensions in Israel – Iranian missile strike imminent if US attacks Iran • Aircraft carriers and fighter jets – massive US military force in Middle East.", "title_original": "Teodorescu Måwe (KD) ställer in första resan till Israel", "summary_original": "Spänt i Israel – iranskt raketangrepp överhängande om USA attackerar Iran • Hangarfartyg och stridsflygplan – massiv militär amerikansk styrka i Mellanöstern.", "link": "https://www.dagen.se/nyheter/teodorescu-mawe-kd-staeller-in-foersta-resan-till-israel/10226993", "date_display": "2026-02-27", "date_iso": "2026-02-27T16:54:39+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Apple campaign against Leif GW Persson's summer cottage: \"It's SVT\"", "summary": "The professor rages: \"Of course it will be reported to the police.\"", "title_original": "Äppelaktion mot Leif GW Perssons sommarstuga: ”Det är SVT”", "summary_original": "Professorn rasar: ”Det kommer att polisanmälas naturligtvis.”", "link": "https://www.tv4.se/artikel/2jbhKKNXOHy2bXlEVx6GVF/aepple-aktion-mot-leif-gw-perssons-sommarstuga-det-aer-svt", "date_display": "2026-02-27", "date_iso": "2026-02-27T16:30:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 157, "title": "Tram has crashed in Milan – two dead and over 50 injured", "summary": "Spårvagnen, som trafikerar linje 9, ska ha kört i hög hastighet i en kurva innan den mejade ner ett trafikljus och kraschade rakt in i byggnaden. At least two people, both men in their 60s, have died and over 50 were injured, several of them seriously. According to information to Corriere Della Sera, some people have been hit and stuck under the tram. Föraren: ”Jag kände mig sjuk” Vad som orsakade olyckan är ännu oklart, men två teorier är sjukdomsfall hos föraren eller ett fel i växelsystemet. In questioning with the police, the experienced driver has said that he felt ill. ”Jag kände mig sjuk”, sa han i förhör Polisen har inlett en utredning om vållande till annans död, men föraren ska ännu inte vara gripen. \"It was terrible\" The accident happened around 4 pm near Porta Venezia and several rescue units were alerted. - I thought it was an earthquake. I sat down and fell to the floor, along with the other passengers. It was terrible. Luckily I only hit my knee, but the man next to me was bleeding from the head, one of the passengers told Corriere Della Sera. The tram was of a new model and was put into service only a few weeks ago. The carriage is 25 meters long, consists of three carriages and has room for 66 passengers.", "title_original": "Spårvagn har kraschat i Milano – två döda och över 50 skadade", "summary_original": "Spårvagnen, som trafikerar linje 9, ska ha kört i hög hastighet i en kurva innan den mejade ner ett trafikljus och kraschade rakt in i byggnaden. Minst två personer, båda män i 60-årsåldern, har dött och över 50 skadades, flera av dem allvarligt. Enligt uppgifter till Corriere Della Sera ska några personer har blivit påkörda och fastnat under spårvagnen. Föraren: ”Jag kände mig sjuk” Vad som orsakade olyckan är ännu oklart, men två teorier är sjukdomsfall hos föraren eller ett fel i växelsystemet. I förhör med polisen har den erfarne föraren sagt att han mådde illa. ”Jag kände mig sjuk”, sa han i förhör Polisen har inlett en utredning om vållande till annans död, men föraren ska ännu inte vara gripen. ”Det var fruktansvärt” Olyckan inträffade omkring klockan 16 i närheten av Porta Venezia och flera räddningsenheter larmades. – Jag trodde att det var en jordbävning. Jag satt ner och föll till golvet, tillsammans med de andra passagerarna. Det var fruktansvärt. Som tur var slog jag bara i knät, men mannen bredvid mig blödde från huvudet, säger en av passagerarna till Corriere Della Sera. Spårvagnen var av en ny modell och togs i bruk för bara några veckor sedan. Vagnen är 25 meter lång, består av tre vagnar och har plats för 66 passagerare.", "link": "https://www.tv4.se/artikel/6hGCXRGugEa8RpRhv2i2N9/sparvagn-har-sparat-ur-i-milano", "date_display": "2026-02-27", "date_iso": "2026-02-27T15:37:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/milano", "/italien", "/olycka"]}, {"id": 158, "title": "GW: \"I have no objections\"", "summary": "First words after the verdict • Offered to pay legal costs", "title_original": "GW: ”Jag har inga invändningar”", "summary_original": "Första orden efter domen • Erbjöd sig att betala rättegångskostnader", "link": "https://www.tv4.se/artikel/4jEMKzS7M2naGb0UnpU63w/gw-har-inga-invaendningar-mot-domen", "date_display": "2026-02-27", "date_iso": "2026-02-27T14:43:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 159, "title": "Diakonia: The worst scenario is if the government shuts down Sida", "summary": "The authority's director general was allowed to go on the day • \"Really hope that this change of management goes well.\"", "title_original": "Diakonia: Värsta scenariot är om regeringen lägger ned Sida", "summary_original": "Myndighetens generaldirektör fick gå på dagen • ”Hoppas verkligen att det här ledningsskiftet blir bra.”", "link": "https://www.dagen.se/nyheter/diakonia-vaersta-scenariot-aer-om-regeringen-laegger-ned-sida/10225272", "date_display": "2026-02-27", "date_iso": "2026-02-27T13:24:14+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Saws the veterinary industry: \"There is a very big shortage\"", "summary": "Just over a year ago, the Swedish Competition Authority was tasked by the government to investigate the veterinary market, after flaws in price-fixing were seen. Several media, including TV4 Nyheterna, have reported on rampant prices on the veterinary market and a lack of price information, which means that pet owners are forced to pay thousands of kroner more than expected. - The problem today is that pet owners are often faced with very large price ranges, meaning that the treatment for this cat or dog can cost anywhere from SEK 10,000 to SEK 50,000, says Leif Nordqvist, investigator at the Swedish Competition Authority. The investigator: Can set any prices The authority has now concluded that there are major problems with price transparency in the veterinary market. This leads to a lack of competition, in a market where prices have risen by over 40 percent in five years. When it comes to emergency cases during evenings and weekends at animal hospitals, there is basically a monopoly. - The clinics and animal hospitals do not really compete on price. They compete with other things. Why don't they compete on price? - Because you don't need it. The Swedish Competition Authority proposes that the government draw up national treatment recommendations and that the clinics be clearer with their prices. - Today, the clinics have their own treatment recommendations, and we think this is a very big shortcoming. The lack of treatment recommendations makes it very difficult for pet owners to compare.  The authority also wants animal healthcare services to be included in the Consumer Services Act, which would mean a cap on certain additional fees. It would also mean that animal owners can report veterinary matters to ARN, and few disputes will be tried purely legally. Venture capital companies own the market The veterinary industry is dominated by two large players. Evidensia is owned by the Swedish venture capital company EQT, together with other investors such as Nestlé. Anicura is owned by the family-owned company Mars Petcare. Venture capital companies have made several billions from animal care in Sweden", "title_original": "Sågar veterinärbranschen: ”Det är en väldigt stor brist”", "summary_original": "För drygt ett år sedan fick Konkurrensverket i uppdrag av regeringen att utreda veterinärmarknaden, efter att man sett brister i pristranparens. Flera medier, bland annat TV4 Nyheterna, har rapporterat om skenande priser på veterinärmarknaden och bristande prisinformation, något som gör att djurägare tvingas betala tusentals kronor mer än väntat. – Problemet idag är att djurägarna ofta möts av väldigt stora prisspann, alltså att behandlingen för den här katten eller hunden kan kosta kanske allt från 10 000 till 50 000 kronor, säger Leif Nordqvist, utredare Konkurrensverket. Utredaren: Kan sätta vilka priser som helst Nu slår alltså myndigheten fast att det finns stora problem när det gäller pristransparens på veterinärmarknaden. Det leder till bristande konkurrens, på en marknad där priserna rusat med över 40 procent på fem år. När det gäller akuta ärenden under kvällar och helger på djursjukhus råder i princip monopol. – Klinikerna och djursjukhusen konkurrerar egentligen inte med pris. De konkurrerar med andra saker. Varför konkurrerar de inte med pris? – För att man inte behöver det. Konkurrensverket föreslår att regeringen tar fram nationella behandlingsrekomentationer och att klinikerna blir tydligare med sina priser. – Idag har klinikerna egna behandlingsrekommendationer, och det tycker vi är en väldigt stor brist. Avsaknaden av behandlingsrekommendationer gör att det är väldigt svårt att jämföra för djurägarna.  Myndigheten vill också att djursjukvårdstjänster ska ingå i konsumenttjänstlagen, vilket skulle innebära ett tak för vissa tilläggsavgifter. Det skulle också göra att djurägare kan anmäla veterinärärenden till ARN, och få tvister prövade rent rättsligt. Riskkapitalbolag äger marknaden Veterinärbranschen domineras av två stora aktörer. Evidensia ägs av det svenska riskkapitalbolaget EQT, tillsammans med andra investerare såsom Nestlé. Anicura ägs av det familjeägda bolaget Mars Petcare. Riskkapitalbolagen har tjänat flera miljarder på djurvården i Sverige.  Här uppmanar Konkurrensverket klinikerna att vara tydligare med sin kedjetillhörighet. Två till synes konkurrerande kliniker kan vara ägda av samma bolag.", "link": "https://www.tv4.se/artikel/4e87CNhki1ptoqEyUjAgXy/hard-kritik-mot-veterinaerbranschen-en-vaeldigt-stor-brist", "date_display": "2026-02-27", "date_iso": "2026-02-27T13:16:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/veterinar", "/djur"]}, {"id": 161, "title": "New girl against Zelmerlöw: \"Can have a sugary drink without ice\"", "summary": "Lilla Al-Fadji, or Felipe Leiva Wenger as he is actually called, competes with the song \"Delulu\" in Melodifestivalen. \"Delulu\" is an abbreviation of the English word delusional and refers to having delusions or delusions of grandeur. - And it is something that I have embraced in this life, says Lilla Al-Fadji to TV4 Nyheterna. People often call him \"delulu\", but that much of the \"deluluness\" he invented has actually become reality. - I think, who will believe in yourself if you don't do it yourself? So believe as much as possible and so, what do they usually say? Aim for the moon, land on Mars. Promises \"flashness\" and glitter His number promises energy, movement, \"flashness\", glitter and much more. The big question is whether he is there to win or to give Sweden the show it has been missing for a long time. - I would say the latter. The former, I have already won mentally. I'm already in Vienna eating vienna bread. So I think, yup, it's about giving the fattest show the universe has ever seen. Sanna Nielsen, who won the competition in 2014, as well as the international k-pop artist Alexa, who won the American Song Contest 2022, are competing in the fifth and final competition before the final. - If I'm going to be completely honest, everyone is, everyone is very threatening. I can't get away with that. Everyone goes around making threats all the time in hotels. So I think it can be an even match. You never know, anyone can come in and scream, he says. \"Sending them a swish if I win\" Last year the comedy group KAJ won, and afterwards favorites Måns Zelmerlöw and John Lundvik were disappointed. Zelmerlöw said that he could not measure up to what KAJ does, while Lundvik thought that Melodifestivalen had become more and more like Eurovision, with more \"crazy\" entries. Little Al-Fadji appreciates humor in the competition. - I love humor. I love to laugh all the way to the bank. So, absolutely, more laughs, more, more of everything else too. He does not believe that Zelmerlöw and Lundvik would", "title_original": "Nya piken mot Zelmerlöw: ”Kan få en sockerdricka utan is”", "summary_original": "Lilla Al-Fadji, eller Felipe Leiva Wenger som han egentligen heter, tävlar med låten ”Delulu” i Melodifestivalen. ”Delulu” är en förkortning av engelskans delusional och syftar på att ha vanföreställningar eller storhetsvansinne. – Och det är någonting som liksom jag har omfamnat här i livet, säger Lilla Al-Fadji till TV4 Nyheterna. Folk kallar honom ofta ”delulu”, men att mycket av den ”deluluness” han hittat på faktiskt blivit verklighet. – Jag tänker, vem ska tro på en själv om man inte gör det själv? Så tro så stort som möjligt och så, vad brukar man säga? Sikta mot månen, landa på Mars. Utlovar ”flashness” och glitter Hans nummer utlovar energi, rörelse, ”flashness”, glitter och mycket mer. Den stora frågan är om han är där för att vinna eller för att ge Sverige den show man länge har saknat. – Jag skulle säga det sistnämnda. Det förstnämnda, jag har redan vunnit mentalt. Jag är redan i Wien och käkar wienerbröd. Så jag tror att, japp, det handlar om att ge den fetaste showen som har universum någonsin sett. I den femte och sista deltävlingen inför finalen tävlar bland andra Sanna Nielsen, som vann tävlingen 2014, samt den internationella k-pop-artisten Alexa som vann American Song Contest 2022. – Om jag ska vara helt ärlig så är ju alla, alla är väldigt hotfulla. Det kan jag inte sticka under stol med. Alla går runt och hotar hela tiden på hotell. Så jag tror det kan bli en jämn match. Man vet inte, vem som helst kan komma in och skrälla, säger han. ”Skickar dem en swish om jag vinner” I fjol vann humorgruppen KAJ, och efteråt var favorittippade Måns Zelmerlöw och John Lundvik besvikna. Zelmerlöw menade att han inte kunnat mäta sig med det KAJ gör, medan Lundvik tyckte att Melodifestivalen blivit allt mer lik Eurovision, med fler ”crazy” bidrag. Lilla Al-Fadji uppskattar humor i tävlingen. – Jag älskar humor. Jag älskar att skratta hela vägen till banken. Så, absolut, mer skratt, mer, mer av allt det andra också. Han tror inte att Zelmerlöw och Lundvik skulle bli lika upprörda om han vinner i år. – Nej, jag tror, jag skickar till dem en swish om jag vinner. Så kan vi gå och köpa en varsin sockerdricka utan is. För att lyckas med samma bragd som KAJ har han till och med börjat studera finska på distans. – Nu har jag varvat hela lexikonet. Så munimian, Lilla Al-Fadji, yksi, kaksi, kolme, nelia, viis, hallouksa, norli, och så vidare.", "link": "https://www.tv4.se/artikel/5Ea7WnXSUZxIx2bzeSzdIp/nya-piken-mot-zelmerloew-kan-fa-en-sockerdricka-utan-is", "date_display": "2026-02-27", "date_iso": "2026-02-27T11:52:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/musik", "/melodifestivalen", "/svt"]}, {"id": 162, "title": "Pakistan Strikes Afghanistan: 'Scope Unparalleled'", "summary": "Pakistan says that the country's military has attacked targets in Kabul and Kandahar in Afghanistan on Thursday. The airstrikes came just hours after Afghan forces attacked Pakistani border forces. According to Afghanistan's Taliban government, Pakistani warplanes have hit several targets in the capital Kabul, in Kandahar and in the Paktia province. Loud explosions and flights were heard over Kabul during the night, according to AFP reporters on the ground. Tensions have increased Sten Widmalm, professor of political science, says that Thursday's attacks are part of a larger pattern. - It is an escalation that has been going on for a long time. This goes back to several previous conflicts, but in recent times tensions have clearly increased, he says. He points in particular to Pakistan's tougher line towards Afghan refugees, which has created great strain in Afghanistan. - It is connected with the fact that Pakistan has tried to get many Afghan refugees to return. It has increased pressure at the border and created local tensions. \"Extent that is unique\" Widmalm emphasizes that the night's attack stands out. - It is not usual for Pakistan to strike far into Afghanistan towards Kabul, Paktia and Kandahar. They have crossed the line before, but this is a scale that is unique, he says. He describes the action as a clear marking. - You want to show that you decide and that you put your foot down. This is cross-border warfare and meets the criteria for what we would call a war, says Widmalm. The Taliban are militarily weaker The Taliban regime's retaliatory attacks during the night have largely been carried out by local military groups and militant networks. According to Widmalm, it is precisely these groups that play a major role in the conflict. - There are militant organizations with their own agendas. Several have visions of Islamic rule over the region. Now when Pakistan hits them, they hit back, he says. But on a military level, the balance of power is clear. - The Taliban do not have the resources", "title_original": "Pakistan slår mot Afghanistan: ”Omfattning som är unik”", "summary_original": "Pakistan uppger att landets militär under torsdagen har attackerat mål i Kabul och Kandahar i Afghanistan. Flyganfallen skedde bara timmar efter att afghanska styrkor attackerat pakistanska gränsstyrkor. Enligt Afghanistans talibanstyre ska pakistanska stridsflyg ha slagit mot flera mål i huvudstaden Kabul, i Kandahar samt i Paktia-provinsen. Höga explosioner och flyg hördes över Kabul under natten, enligt AFP:s reportrar på plats. Spänningarna har ökat Sten Widmalm, professor i statsvetenskap, säger att torsdagens attacker ingår i ett större mönster. – Det är en upptrappning som varit på gång under en längre tid. Det här går tillbaka till flera tidigare konflikter, men under senare tid har spänningarna ökat tydligt, säger han. Han pekar särskilt på Pakistans hårdare linje mot afghanska flyktingar, något som skapat stora påfrestningar i Afghanistan. – Det hänger ihop med att Pakistan har försökt få många afghanska flyktingar att återvända. Det har ökat trycket vid gränsen och skapat lokala spänningar. ”Omfattning som är unik” Widmalm betonar att nattens angrepp sticker ut. – Det är inte vanligt att Pakistan slår långt in i Afghanistan mot Kabul, Paktia och Kandahar. Man har slagit över gränsen tidigare, men det här är en omfattning som är unik, säger han. Han beskriver agerandet som en tydlig markering. – Man vill visa att man bestämmer och att man sätter ner foten. Det här är gränsöverskridande krigföring och uppfyller kriterierna för vad vi skulle kalla ett krig, säger Widmalm. Talibanerna står militärt svagare Talibanstyrets svarsangrepp under natten har i stor utsträckning genomförts av lokala militära grupper och militanta nätverk. Enligt Widmalm är det just dessa grupper som spelar stor roll i konflikten. – Det finns militanta organisationer med egna agendor. Flera har visioner om ett islamiskt styre över regionen. Nu när Pakistan slår mot dem slår de tillbaka, säger han. Men på ett militärt plan är styrkeförhållandet tydligt. – Talibanerna har inte resurserna att sätta sig emot Pakistan. Pakistans armé fungerar och är organiserad. Talibanernas struktur är betydligt lösare och bygger mer på lokala grupperingar och uppgörelser, säger Widmalm. Då kan läget förändras  Sten Widmalm bedömer att utvecklingen sannolikt inte kommer fortsätta i samma takt.  – Det finns många aktörer som har intresse av att det här inte eskalerar. Jag tror att Kina ganska snabbt kommer att säga ifrån. – Kina är det land som har störst intresse av att kyla ner detta snabbt. Enligt Widmalm är risken för en större konflikt i nuläget begränsad – men läget kan förändras snabbt. – Om Pakistan börjar skylla detta på Indien vet man inte vad som händer, säger han.", "link": "https://www.tv4.se/artikel/5IRNdiI9c5Jnf8fWM7IK6H/pakistan-slar-mot-afghanistan-omfattning-som-aer-unik", "date_display": "2026-02-27", "date_iso": "2026-02-27T10:55:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/afghanistan", "/pakistan", "/politiker", "/krig", "/mellanostern"]}, {"id": 163, "title": "Therefore, sperm swim faster in the summer", "summary": "Researchers from the UK, Canada and Denmark analyzed sperm samples from 15,581 men in Denmark and Florida aged 18 to 45 between 2018-2024. The aim has been to investigate which factors affect the movement speed of the sperm - an important aspect in fertility investigations.  - This is a study that can give us a little more knowledge about how we can work with infertility and involuntary childlessness, which we see that the World Health Organization (WHO) claims is an increasingly common problem, says Kalle Norwald, psychotherapist and sexologist who has taken part in the study. Faster sperm in June and July The results show that sperm swim faster during June and July, both in Denmark and Florida. But the researchers could not see that it was the outdoor temperature that was behind the difference. \n\n- It is rather about us moving more during the summer months, says Norwald. Sperm had the lowest ability during the colder months, December to January. This despite climatic and demographic differences. Lifestyle an important factor According to Norwald, it is likely that lifestyle factors such as increased physical activity, more time outdoors and reduced stress during the holidays play a major role in sperm quality.  - When you have involuntary childlessness or it takes a long time to get pregnant, you need to pull all the strings. If you tried during the winter months without results, this could be part of the explanation, says Kalle Norwald.  Several factors affect fertility Norwald points out that sperm speed is only one of many factors that affect fertility. - It is actually only 50 percent of an embryo, a future fetus that then becomes a child. So this study really only shows the sperm cells and nothing on the egg cells but it could be a part. The study's conclusion shows that understanding these seasonal patterns could improve fertility treatments by optimizing the timing of treatment. It would also provide better guidance to couples trying to conceive.", "title_original": "Därför simmar spermier snabbare på sommaren", "summary_original": "Forskare från Storbritannien, Kanada och Danmark analyserade spermaprover från 15 581 män i Danmark och Florida i åldrarna 18 till 45, mellan 2018-2024. Syftet har varit att undersöka vilka faktorer som påverkar spermiernas rörelsehastighet – en viktig aspekt vid fertilitetsutredningar.  – Det här är en studie som kan ge oss lite mer kunskap kring hur vi kan jobba med infertilitet och ofrivillig barnlöshet som vi ser att Världshälsoorganisationen (WHO) går ut med är ett allt vanligare problem, säger Kalle Norwald, psykoterapeut och sexolog som har satt sig in i studien. Snabbare spermier i juni och juli  Resultaten visar att spermier simmar snabbare under juni och juli, både i Danmark och Florida. Men forskarna kunde inte se att det var utomhustemperaturen som låg bakom skillnaden. \n\n– Det handlar snarare om att vi rör på oss mer under sommarmånaderna, säger Norwald. Lägst förmåga hade spermier under de kallare månaderna, december till januari. Detta trots klimatiska och demografiska skillnader. Livsstil en viktig faktor Enligt Norwald är det troligt att livsstilsfaktorer som ökad fysisk aktivitet, mer tid utomhus och minskad stress under semestern spelar stor roll för spermiernas kvalitet.  – När man har en ofrivillig barnlöshet eller det tar lång tid att bli gravid behöver man rycka i alla trådar. Om man försökt under vinterhalvåret utan resultat kan det här vara en del av förklaringen, säger Kalle Norwald.  Flera faktorer påverkar fertiliteten  Norwald påpekar att spermiernas hastighet bara är en av många faktorer som påverkar fertiliteten. – Det är faktiskt bara 50 procent av ett embryo, ett blivande foster som sedan blir ett barn. Så den här studien visar egentligen bara på spermiecellerna och ingenting på äggceller men det kan vara en del. Studiens slutsats visar att förståelse för dessa säsongsmönster skulle kunna förbättra fertilitetsbehandlingar genom att optimera tidpunkten för behandling. Det skulle också ge par som försöker bli gravida bättre vägledning.", "link": "https://www.tv4.se/artikel/5QMZiqK0wEKu4yOUNIXH2r/forskning-visar-spermier-simmar-snabbare-pa-sommaren", "date_display": "2026-02-27", "date_iso": "2026-02-27T10:05:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/graviditet", "/forskning", "/halsa"]}, {"id": 164, "title": "Timbrotoppen's criticism: \"Put out the rug for people\"", "summary": "Kopsch believes that the Swedish migration policy has gone from openness and welcoming to closed doors and that the consequences have become both inhumane and economically damaging. He particularly highlights deportations of migrant workers and their children. - We have had different types of legislation that have made it possible to get here. Partly a very free labor immigration that came in 2008. Alongside that, the change of track, that those who apply for asylum in Sweden but are refused, have the opportunity to change to a work permit. These people have been given a promise and the politicians have been clear that we want people to come here and work in Swedish companies. That legislation has since been scrapped without transitional provisions enabling them to remain.\n\nKopsch has partly traveled around the country and met people who are to be deported, partly he has also made videos on social media about people in the same situation. Thus was born the book itself, where these cases are highlighted. \"Of course people get pissed off\" In the book, Kopsch proposes a so-called establishment amnesty, where the track changers should be able to get a permanent residence permit. He believes that it was never intended that this group would be affected by the new rules. \n\n- These are people we want to keep in Sweden. Of course we will not deport them. It's very bad for the Swedish economy and we won't be able to manage healthcare if we deport them, says Kopsch. \n\nHe says he understands the outrage people have when teenage deportations happen. - Politicians say: We must deport murderers and rapists, then you read in the newspaper that here we have a rapist whom we should not deport. The same day you read: Here we have an 18-year-old girl with good high school grades and a Swedish boyfriend, we are going to deport her. It's clear that people get pissed off when you read things like that. \"Never been easy to vote\"
