 ofta inga allvarliga reaktioner, men om djuret blir allmänpåverkat eller svullnar bör veterinär kontaktas. Fästingar finns både i norr och söder, även taigafästing i Norrland, som kan bära TBE. Fästingbett kan irritera huden. Även knott kan bli ett problem, framför allt i norra Sverige. Hundägare som inte är vana kan bli överraskade av hur besvärligt det kan vara.  - Man kan se röda små prickar över hela huden på hunden. Det kliar ganska ordentligt och kan ge reaktioner. Då är det bra att ta med första hjälpen, så som hydrokortisonsalva. Men än bättre är att skydda, det finns olika sprejer som faktiskt även kan funka ganska bra för oss människor. Sen ska man väl inte ha dem ute i skymning eller gryning för då är knotten som mest aktiv.  Faror i vatten och vid grillning Drunkning kan dessutom ske snabbt, särskilt vid skärgård och båtliv. En flytväst och en plan för hur hunden ska hjälpas upp ur vattnet kan vara avgörande. - En god simmare till hund kan bli trött. Det är också bra att öva på inkallning, tycker jag så att man inte bara sticker iväg.  Vid bad kan algblomning vara farligt. Hunden ska också duschas och tvättas av om den badat i misstänkt vatten.  – Då finns det olika sajter som du kan titta på. Du kan titta hos länsstyrelsen, SMHI eller Havs och vattenmyndigheten, där de har information om var det är algblomning. Det är inte alltid du ser det här på ytan.  Misstänker man att hunden fått i sig algblomningsvatten är rådet att åka till veterinär direkt.  – Det är något som kommer ganska fort och ganska farligt och kan påverka både levern och nervsystemet, säger Marie Jury. Tips om olyckan är framme Veterinären rekommenderar ett första hjälpen-kit både hemma och på resa, med förband för att kunna lägga om sår. En krage eller tratt hemma kan underlätta om hunden börjar slicka eller riva på sår. – Det är också viktigt att lära sig grunderna i HLR för hund.", "link": "https://www.tv4.se/artikel/Qu8M3iwTsdVULyfuNt87Y/sommarfaror-foer-hunden-sa-skyddar-du-den", "date_display": "2026-06-19", "date_iso": "2026-06-19T08:21:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/djur", "/hundar"]}, {"id": 168, "title": "Former top diplomat: Putin is losing the war", "summary": "The view of the war is changing: \"Trump loves winners\" • Points out Putin's problems", "title_original": "Tidigare toppdiplomaten: Putin håller på att förlora kriget", "summary_original": "Synen på kriget förändras: ”Trump älskar vinnare” • Pekar ut Putins problem", "link": "https://www.tv4.se/artikel/1HZmrDvqFUFYn2YPRWGNPX/tidigare-toppdiplomaten-putin-haller-pa-att-foerlora-kriget", "date_display": "2026-06-19", "date_iso": "2026-06-19T08:06:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna"]}, {"id": 169, "title": "Estimated new meeting place at Torp", "summary": "\"It's a challenge: How do we meet those who have difficulty with large groups?\"", "title_original": "Uppskattad ny mötesplats på Torp", "summary_original": "”Det är en utmaning: Hur möter vi dem som har svårt med stora grupper?”", "link": "https://www.dagen.se/nyheter/uppskattad-ny-moetesplats-pa-torp/10403118", "date_display": "2026-06-19", "date_iso": "2026-06-19T06:13:38+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 170, "title": "Interview with the new EFK leader at Torp attracted many laughs", "summary": "Linnéa Åberg about her experience at the big EFK conference: \"I was also a teenager here, and ran around all day.\"", "title_original": "Intervju med nya EFK-ledaren på Torp lockade till många skratt", "summary_original": "Linnéa Åberg om sin erfarenhet av den stora EFK-konferensen: ”Jag har också varit tonåring här, och sprungit runt och dygnat.”", "link": "https://www.dagen.se/nyheter/intervju-med-nya-efk-ledaren-pa-torp-lockade-till-manga-s eport \"A Swedish Strategy for Biodiversity and Ecosystem Services\" aims to halt and reverse the loss of biodiversity in Sweden. It  is Sweden’s contribution to the United Nations Convention on Biological Diversity (CBD) and the Kunming–Montreal Framework for biodiversity.", "link": "https://www.government.se/reports/2026/06/a-swedish-strategy-for-biodiversity-and-ecosystem-services/", "date_display": "2026-06-18", "date_iso": "2026-06-18T11:07:11+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "2 days old", "tags": ["Report", "International", "Ministry of Climate and Enterprise", "Environment and climate", "Sweden in the UN"]}, {"id": 180, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "Inflation in Sweden is low and the economic situation is somewhat weaker than normal. At the same time, the supply disruptions linked to the war in the Middle East have led to increased inflationary pressure and the risks of inflation becoming too high have increased. The management assesses that it is well balanced to now leave the key interest rate unchanged at 1.75 percent, but the probability that the interest rate will be raised later this year has increased compared to the assessment in March.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Inflationen i Sverige är låg och konjunkturläget är något svagare än normalt. Samtidigt har utbudsstörningarna kopplade till kriget i Mellanöstern lett till att inflationstrycket stigit och riskerna för att inflationen ska bli för hög har ökat. Direktionen bedömer att det är välavvägt att nu lämna styrräntan oförändrad på 1,75 procent, men sannolikheten för att räntan höjs senare i år har ökat jämfört med bedömningen i mars.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent4/", "date_display": "2026-06-17", "date_iso": "2026-06-17T07:31:08+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "4 days old", "tags": []}, {"id": 181, "title": "Government receives new state aid application for nuclear power", "summary": "A new application for state aid to build nuclear power reactors has been submitted to the Government. The application was submitted by Studsvik, which is seeking to establish reactors in the municipalities of Nyköping and Valdermarsvik. This is the third application for state aid received by the Government.", "title_original": "Government receives new state aid application for nuclear power", "summary_original": "A new application for state aid to build nuclear power reactors has been submitted to the Government. The application was submitted by Studsvik, which is seeking to establish reactors in the municipalities of Nyköping and Valdermarsvik. This is the third application for state aid received by the Government.", "link": "https://www.government.se/press-releases/2026/06/government-receives-new-state-aid-application-for-nuclear-power/", "date_display": "2026-06-17", "date_iso": "2026-06-17T07:28:57+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 182, "title": "US–Sweden Cancer Summit focuses on closer cooperation", "summary": "On 9 June, leading researchers, decision-makers, healthcare actors and patient organisations from Sweden and the US gathered in Stockholm for the US–Sweden Cancer Summit 2026: Metastasis – from mechanism to cure.", "title_original": "US–Sweden Cancer Summit focuses on closer cooperation", "summary_original": "On 9 June, leading researchers, decision-makers, healthcare actors and patient organisations from Sweden and the US gathered in Stockholm for the US–Sweden Cancer Summit 2026: Metastasis – from mechanism to cure.", "link": "https://www.government.se/articles/2026/06/ussweden-cancer-summit-focuses-on-closer-cooperation/", "date_display": "2026-06-16", "date_iso": "2026-06-16T14:35:27+00:00", "source": "Government.se", "ministry": "Ministry of Health and Social Affairs", "type": "Official Information", "age_tag": "4 days old", "tags": ["International", "Ministry of Health and Social Affairs", "Medical care", "Article", "Government’s priorities", "Elisabet Lann"]}, {"id": 183, "title": "Inauguration of Ukraine’s Unity Hub in Sweden", "summary": "On 15 June, a hub for Ukrainians in Sweden is being inaugurated. The Hub is a new meeting place that will provide support, guidance and information to Ukrainians in Sweden. Minister for Migration Johan Forssell will attend the inauguration together with Deputy Minister of Social Policy, Family and Unity of Ukraine for European Integration Ilona Havronska and representatives of the International Centre for Migration Policy Development (ICMPD), Swedish government agencies, civil society and the Ukrainian diaspora.", "title_original": "Inauguration of Ukraine’s Unity Hub in Sweden", "summary_original": "On 15 June, a hub for Ukrainians in Sweden is being inaugurated. The Hub is a new meeting place that will provide support, guidance and information to Ukrainians in Sweden. Minister for Migration Johan Forssell will attend the inauguration together with Deputy Minister of Social Policy, Family and Unity of Ukraine for European Integration Ilona Havronska and representatives of the International Centre for Migration Policy Development (ICMPD), Swedish government agencies, civil society and the Ukrainian diaspora.", "link": "https://www.government.se/press-releases/2026/06/inauguration-of-ukraines-unity-hub-in-sweden/", "date_display": "2026-06-15", "date_iso": "2026-06-15T15:17:44+00:00", "source": "Government.se", "ministry": "Ministry of Justice", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "EU", "International", "Ministry of Justice", "Integration", "Migration and asylum", "Sweden's support to Ukraine", "Johan Forssell"]}, {"id": 184, "title": "New support package for democratic development in Eastern Europe", "summary": "The Government has presented a new support package with a focus on democracy and strengthened civil society in Eastern Europe for SEK 30 million for 2026–2028, of which SEK 17 million is earmarked for 2026. The support includes well-established civil society organisations in Europe, with which Sweden has had excellent cooperation over a long time.", "title_original": "New support package for democratic development in Eastern Europe", "summary_original": "The Government has presented a new support package with a focus on democracy and strengthened civil society in Eastern Europe for SEK 30 million for 2026–2028, of which SEK 17 million is earmarked for 2026. The support includes well-established civil society organisations in Europe, with which Sweden has had excellent cooperation over a long time.", "link": "https://www.government.se/press-releases/2026/06/new-support-package-for-democratic-development-in-eastern-europe/", "date_display": "2026-06-15", "date_iso": "2026-06-15T14:26:33+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Democracy and human rights", "Benjamin Dousa"]}, {"id": 185, "title": "Sweden provides SEK 120 million to WHO with focus on Ebola outbreak in Democratic Republic of the Congo", "summary": "Sweden is providing SEK 120 million to support the World Health Organization’s work to achieve better global health, which is of great importance to global health security and people in crisis-affected areas. The WHO’s role is of vital importance and centra  application was submitted by Blykalla, a company seeking to establish a new nuclear power plant in Norrsundet, outside Gävle. This is the second application for state aid received by the Government.", "link": "https://www.government.se/press-releases/2026/06/state-aid-application-for-nuclear-power-project-outside-gavle/", "date_display": "2026-06-10", "date_iso": "2026-06-10T06:00:16+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 190, "title": "Maria Malmer Stenergard visits Saudi Arabia, Qatar and the United Arab Emirates", "summary": "On 8–10 June, Minister for Foreign Affairs Maria Malmer Stenergard is visiting Saudi Arabia, Qatar and the United Arab Emirates. The visit will focus on the regional crisis and Sweden’s bilateral relations with the Gulf States.", "title_original": "Maria Malmer Stenergard visits Saudi Arabia, Qatar and the United Arab Emirates", "summary_original": "On 8–10 June, Minister for Foreign Affairs Maria Malmer Stenergard is visiting Saudi Arabia, Qatar and the United Arab Emirates. The visit will focus on the regional crisis and Sweden’s bilateral relations with the Gulf States.", "link": "https://www.government.se/press-releases/2026/06/maria-malmer-stenergard-visits-saudi-arabia-qatar-and-the-united-arab-emirates/", "date_display": "2026-06-09", "date_iso": "2026-06-09T12:45:23+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 191, "title": "Sweden bolsters initiatives in support of free and fair elections and democracy in Eastern Europe", "summary": "The Government has prese ", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry of Defence", "Pål Jonson", "Military defence", "Strengthen Sweden’s security", "Government’s priorities", "Total defence"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
