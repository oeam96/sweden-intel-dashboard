_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/utrikes", "/ekonomi", "/politik", "/hem-och-hushall", "/mode", "/halsa", "/shein", "/temu", "/kina"]}, {"id": 165, "title": "The government wants to toughen the penalties for child recruitment", "summary": "The bill means that the crime \"involvement of a minor in crime\" gets a new, more serious degree \"gross involvement of a minor in crime\". The punishment is proposed to be up to four years in prison for the normal degree and between two and eight years for a serious crime. - The penalties are far too low today. Really dangerous people who recruit children for, for example, assassination missions get away far too cheaply, says Minister of Justice Gunnar Strömmer (M) to TV4 Nyheterna. But the punishment can be significantly higher than that, if it is linked to organized crime, then it can be doubled - and involve a maximum sentence of 16 years in prison. - We think it is very important to attack those who recruit children and young people into the criminal gangs with a completely different force than so far, says Gunnar Strömmer. New crime The government also wants \"attempts to seriously involve minors in crime\" to be criminalised. Another change is that even minors who recruit younger children can be sentenced. - Even a 17-year-old who recruits a 13-year-old or a 12-year-old must be able to receive a punishment for it. That's how serious it is when children are drawn into serious gang crime, says Strömmer.\n\nAt the same time, the government points out that the increased penalties will increase the pressure on the Correctional Service, which is therefore being expanded to be able to handle more inmates.\n\nThe proposal is now being sent out for consultation and is proposed to enter into force on March 1, 2027.", "title_original": "Regeringen vill skärpa straffen för barnrekrytering", "summary_original": "Lagförslaget innebär att brottet ”involvering av underårig i brottslighet” får en ny grövre grad ”grovt involverande av underårig i brottslighet”. Straffet föreslås bli upp till fyra års fängelse för normalgraden och mellan två och åtta år för grovt brott. – Det är alldeles för låga straff i dag. Riktigt farliga personer som rekryterar barn till exempelvis morduppdrag kommer undan alldeles för billigt, säger justitieminister Gunnar Strömmer (M) till TV4 Nyheterna. Men straffet kan bli betydligt högre än så, om det kopplas till organiserad brottslighet, då kan det komma att fördubblas – och handla om ett maxstraff på 16 års fängelse. – Vi tycker att det är väldigt viktigt att med en helt annan kraft än hittills komma åt de som rekryterar barn och unga in i de kriminella gängen, säger Gunnar Strömmer. Nytt brott Regeringen vill också att ”försök till grovt involverande av underårig i brottslighet” ska kriminaliseras. En annan förändring är att även minderåriga som rekryterar yngre barn ska kunna dömas. – Även en 17-åring som rekryterar en 13-åring eller en 12-åring måste kunna få ett straff för det. Så allvarligt är det när barn dras in i grov gängkriminalitet, säger Strömmer.\n\nRegeringen pekar samtidigt på att straffskärpningarna kommer att öka trycket på Kriminalvården, som därför byggs ut för att kunna hantera fler intagna.\n\nFörslaget skickas nu ut på remiss och föreslås träda i kraft den 1 mars 2027.", "link": "https://www.tv4.se/artikel/3n243KZxu33VcBHP1j9aVu/regeringen-vill-skaerpa-straffen-foer-barnrekrytering", "date_display": "2026-07-01", "date_iso": "2026-07-01T14:45:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/valet-2026", "/politik", "/brott-och-straff", "/gunnar-strommer"]}, {"id": 166, "title": "Joint statement of the Nordic-Baltic Prime Ministers", "summary": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "title_original": "Joint statement of the Nordic-Baltic Prime Ministers", "summary_original": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "link": "https://www.government.se/statements/2026/07/joint-statement-of-the-nordic-baltic-prime-ministers/", "date_display": "2026-07-01", "date_iso": "2026-07-01T11:58:31+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "1 day old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Civil defence", "Military defence", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 167, "title": "Government overhauls development assistance to Africa, Latin America and Asia", "summary": "The Government has adopted nine new development assistance strategies which will provide a total of around SEK 6 billion for development cooperation in Africa, Latin America and Asia. The new development assistance will be based on evidence of what works and produces concrete results.", "title_original": "Government overhauls development assistance to Africa, Latin America and Asia", "summary_original": "The Government has adopted nine new development assistance strategies which will provide a total of around SEK 6 billion for development cooperation in Africa, Latin America and Asia. The new development assistance will be based on evidence of what works and produces concrete results.", "link": "https://www.government.se/press-releases/2026/07/government-overhauls-development-assistance-to-africa-latin-america-and-asia/", "date_display": "2026-07-01", "date_iso": "2026-07-01T11:50:02+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Benjamin Dousa", "The reform agenda - Development assistance for a n"]}, {"id": 168, "title": "Offline card payments - now the possibilities are expanding", "summary": "As of today, July 1, 2026, expanded opportunities to pay by card offline will be introduced when purchasing essential goods. The measure strengthens the resilience of the payment system and is based on an agreement between the Riksbank and market participants.", "title_original": "Offlinebetalningar med kort - nu utökas möjligheterna", "summary_original": "Från och med i dag, 1 juli 2026, införs utökade möjligheter att betala med kort offline vid köp av livsnödvändiga varor. Åtgärden stärker betalningssystemets motståndskraft och bygger på en överenskommelse mellan Riksbanken och marknadsaktörer.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/offlinebetalningar-med-kort---nu-utokas-mojligheterna/", "date_display": "2026-07-01", "date_iso": "2026-07-01T07:31:02+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "2 days old", "tags": []}, {"id": 169, "title": "The expert: \"Take care to refuel - this autumn it will be more expensive\"", "summary": "The temporary tax reduction of three kroner per liter is the largest in a long time. Together with a lower oil price, it has pushed fuel prices down to levels not seen for many years. - Many will probably be happy when they think and notice that it doesn't cost as much, says Claes Hemberg. When the petrol price was at its highest, it was around 23-24 kroner a litre. Today it is around SEK 14. Therefore, higher prices are expected this autumn. But the low prices will not last long. The temporary tax cut ends in the autumn, and then petrol and diesel prices are expected to rise again. In addition, developments on the oil market can quickly affect the price at the pump. According to Hemberg, there is still uncertainty surrounding transport through the Strait of Hormuz, while new EU rules are expected to make fossil fuels more expensive in the long term. - It will not be cheaper to drive a petrol car in the future - on the contrary, he says.\n\nAccording to Hemberg, the lower fuel prices mean a welcome addition for many households this summer. But those who want to take advantage of the lower prices should not wait too long. - If you want to celebrate the low petrol prices, now is the time.", "title_original": "Experten: ”Passa på att tanka – i höst blir det dyrare”", "summary_original": "Den tillfälliga skattesänkningen på tre kronor per liter är den största på länge. Tillsammans med ett lägre oljepris har den pressat ned drivmedelspriserna till nivåer som inte setts på många år. – Många kommer nog bli glada när de tankar och märker att det inte kostar lika mycket, säger Claes Hemberg. När bensinpriset var som högst låg det kring 23–24 kronor litern. I dag ligger det runt 14 kronor. Därför väntar högre priser i höst  Men de låga priserna blir inte långvariga. Den tillfälliga skattesänkningen upphör under hösten och då väntas bensin- och dieselpriserna stiga igen. Dessutom kan utvecklingen på oljemarknaden snabbt påverka priset vid pump. Enligt Hemberg finns fortfarande en osäkerhet kring transporterna genom Hormuzsundet, samtidigt som nya EU-regler på sikt väntas göra fossila drivmedel dyrare. – Det blir inte billigare att köra bensinbil framöver – tvärtom, säger han.\n\nEnligt Hemberg innebär de lägre drivmedelspriserna ett välkommet tillskott för många hushåll i sommar. Men den som vill dra nytta av de lägre priserna bör inte vänta alltför länge. – Vill man fira de låga bensinpriserna är det dags nu.", "link": "https://www.tv4.se/artikel/50AoWwIiQJaqlsWH5MiviC/experten-passa-pa-att-tanka-i-hoest-blir-det-dyrare", "date_display": "2026-07-01", "date_iso": "2026-07-01T07:19:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/hem-och-hushall", "/bensin", "/bensinpris", "/svensk-ekonomi"]}, {"id": 170, "title": "The party election more complicated than the debate gives the impression of", "summary": "For the Christian voter, the question is therefore hardly just about which party has the best policy on a single issue right now, write Stefan Svensson and Pernilla Wendesten (KD), in a reply.", "title_original": "Partivalet mer komplicerat än debatten ger intryck av", "summary_original": "För den kristne väljaren handlar därför frågan knappast bara om vilket parti som har den bästa politiken i en enskild fråga just nu, skriver Stefan Svensson och Pernilla Wendesten (KD), i en replik.", "link": "https://www.dagen.se/debatt/partivalet-mer-komplicerat-aen-debatten-ger-intryck-av/10414809", "date_display": "2026-07-01", "date_iso": "2026-07-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 171, "title": "They strike a blow for the home churches within EFK", "summary": "\"We have seen healing spirits and have read the Bible together with people who had no faith to begin with.\"", "title_original": "De slår ett slag för hemkyrkorna inom EFK", "summary_original": "”Vi har fått se helanden och har fått läsa Bibeln tillsammans med människor som inte haft någon tro från början.”", "link": "https://www.dagen.se/nyheter/de-slar-ett-slag-foer-hemkyrkorna-inom-efk/10404424", "date_display": "2026-07-01", "date_iso": "2026-07-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 172, "title": "Dismay among employees after Läkarmissionen's cutbacks", "summary": "Local trade union: The problems should have been noticed earlier", "title_original": "Bestörtning bland anställda efter Läkarmissionens neddragningar", "summary_original": "Lokala fackklubben: Problemen borde ha uppmärksammats tidigare", "link": "https:// rman on a new cover album", "summary": "\"Without him, Christian music would have looked very different\"", "title_original": "GF-aktuelle Enok tolkar Larry Norman på nytt coveralbum", "summary_original": "”Utan honom så hade den kristna musiken sett väldigt annorlunda ut”", "link": "https://www.dagen.se/kultur/gf-aktuelle-enok-tolkar-larry-norman-pa-nytt-coveralbum/10415371", "date_display": "2026-06-30", "date_iso": "2026-06-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 183, "title": "For S, political rhetoric is more important than the Bible's message", "summary": "The Social Democrats' alliance with Islamists within, among other things, the Muslim Brotherhood is well documented, writes Svenåke Boström in a concluding remark.", "title_original": "För S är politisk retorik viktigare än Bibelns budskap", "summary_original": "Socialdemokraternas allians med islamister inom bland annat Muslimska brödraskapet är väl dokumenterad, skriver Svenåke Boström i en slutreplik.", "link": "https://www.dagen.se/debatt/foer-s-aer-politisk-retorik-viktigare-aen-bibelns-budskap/10413703", "date_display": "2026-06-30", "date_iso": "2026-06-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 184, "title": "\"The peonies speak of the beauty of God\"", "summary": "Roine and Eva-Britt live in a flourishing dream among 120 different varieties of peonies", "title_original": "”Pionerna talar om Guds skönhet”", "summary_original": "Roine och Eva-Britt lever i en blomstrande dröm bland 120 olika pionsorter", "link": "https://www.dagen.se/livsstil/pionerna-talar-om-guds-skoenhet/10399417", "date_display": "2026-06-30", "date_iso": "2026-06-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 185, "title": "Poland signs agreement to procure submarines from Saab and deepen strategic cooperation with Sweden", "summary": "Sweden and Poland have successfully finalised negotiations on Poland’s procurement of three A26 submarines from Saab. This agreement is a significant step in strengthening Poland’s maritime capability, while also helping the countries deepen their collaboration on security and industrial policy.", "title_original": "Poland signs agreement to procure submarines from Saab and deepen strategic cooperation with Sweden", "summary_original": "Sweden and Poland have successfully finalised negotiations on Poland’s procurement of three A26 submarines from Saab. This agreement is a significant step in strengthening Poland’s maritime capability, while also helping the countries deepen their collaboration on security and industrial policy.", "link": "https://www.government.se/press-releases/2026/06/poland-signs-agreement-to-procure-submarines-from-saab-and-deepen-strategic-cooperation-with-sweden/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:43:44+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "3 days old", "tags": ["Press release", "EU", "Prime Minister's Office", "Ministry of Defence", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard", "Pål Jonson", "Ulf Kristersson", "Military defence"]}, {"id": 186, "title": "Joint statement of the Republic of Poland and the Kingdom of Sweden on the Baltic Sea Pact", "summary": "Concluding the first Polish-Swedish Intergovernmental Consultations on 29 June 2026, in Gdynia, Poland and Sweden agreed to deepen their bilateral security and defence cooperation in the Baltic Sea region by launching the Baltic Sea Pact.", "title_original": "Joint statement of the Republic of Poland and the Kingdom of Sweden on the Baltic Sea Pact", "summary_original": "Concluding the first Polish-Swedish Intergovernmental Consultations on 29 June 2026, in Gdynia, Poland and Sweden agreed to deepen their bilateral security and defence cooperation in the Baltic Sea region by launching the Baltic Sea Pact.", "link": "https://www.government.se/statements/2026/06/joint-statement-of-the-republic-of-poland-and-the-kingdom-of-sweden-on-the-baltic-sea-pact/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:43:14+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "3 days old", "tags": ["EU", "Prime Minister's Office", "Statement", "Ulf Kristersson", "Military defence"]}, {"id": 187, "title": "Joint Declaration from the Polish-Swedish Intergovernmental Consultations Gdynia", "summary": "The Republic of Poland and the Kingdom of Sweden are close Baltic Sea neighbours, Allies and partners, tied together by shared history, geography and responsibility for their strategically important region. Our Governments meet on 29 June 2026 for the first time in the format of Intergovernmental Consultations, a year and a half after the signing of the renewed Strategic Partnership between Poland and Sweden (Harpsund, 28 November 2024).", "title_original": "Joint Declaration from the Polish-Swedish Intergovernmental Consultations Gdynia", "summary_original": "The Republic of Poland and the Kingdom of Sweden are close Baltic Sea neighbours, Allies and partners, tied together by shared history, geography and responsibility for their strategically important region. Our Governments meet on 29 June 2026 for the first time in the format of Intergovernmental Consultations, a year and a half after the signing of the renewed Strategic Partnership between Poland and Sweden (Harpsund, 28 November 2024).", "link": "https://www.government.se/statements/2026/06/joint-declaration-from-the-polish-swedish-intergovernmental-consultations-gdynia/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:42:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_t  state aid application for nuclear power project outside Malmö", "summary_original": "The Government has received another application for state aid to build new nuclear power reactors in Sweden. The application was submitted by Nordic Baseload Power for a project at Barsebäck in Kävlinge outside Malmö. This is the fourth such application received by the Government.", "link": "https://www.government.se/press-releases/2026/06/government-receives-state-aid-application-for-nuclear-power-project-outside-malmo/", "date_display": "2026-06-22", "date_iso": "2026-06-22T11:17:31+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "10 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
