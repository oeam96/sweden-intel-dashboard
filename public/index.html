- Perhaps you have been part of the student council, involved in the scouts or trained the younger members of the football team? There is much that you may not think of yourself that you can highlight as strengths and experiences.", "title_original": "Expertens tips: Så kniper du sommarjobbet", "summary_original": "Det finns 50 000 lediga sommarjobb att söka på Arbetsförmedlingens jobbplattform Platsbanken. Det är ungefär lika många som förra året – så en ökande arbetslöshet i samhället generellt märks i alla fall inte på sommarjobben. – Inte vad gäller efterfrågan av arbetskraft på sommaren i och med att verksamheter som behöver lösa sin sommarbemanning och säsongsbetonade arbeten existerar i samma utsträckning nu som tidigare, säger Alexandra Sjöberg, jobbsökarexpert på Arbetsförmedlingen. Sök på andra orter Man är inte sent ute om man börjar nu, menar hon, men säger också att det är dags att sätta fart om man vill säkra ett sommarjobb. De flesta sommarjobben finns inom vård och omsorg, men även inom industri, försäljning, hotell och restaurang. Det handlar om tjänster som städare, serveringspersonal, undersköterskor och vårdbiträden. För att maxa sina chanser att få ett sommarjobb menar Alexandra Sjöberg att det är viktigt att tänka brett – både när det gäller yrke och geografi. – Var lite öppen. Ibland låser vi oss och blir vår egen värsta fiende för att vi har förutfattade meningar. Just sommarjobben är så läckra att de dyker upp på platser där man kanske inte annars hade tänkt sig att jobba, som ute i skärgården eller på Gotland. Följ upp din ansökan Att våga ta kontakt är också viktigt. – Ja, men gå in i en affär och sök. Då når man de så kallade dolda jobben om man själv är proaktiv i sitt arbetssökande. Men också när du har en ansökan ute, så kan man faktiskt ringa och följa upp sitt cv och sin ansökan. Då blir man mer än den här handlingen man har skickat in. Alexandra Sjöberg menar att man ska anpassa sin ansökan efter jobbet man söker och lyfta fram erfarenheter som passar just det jobbet. Men om det är ens första jobb kanske man inte har så mycket erfarenhet? – Du kanske har varit med i elevrådet, engagerad i scouterna eller tränat de yngre i laget på fotbollen? Det finns mycket som du kanske själv inte tänker på som du kan lyfta som styrkor och erfarenheter.", "link": "https://www.tv4.se/artikel/qvkUoE2jxGBE9lqgfjjLs/expertens-tips-sa-lyckas-du-fa-sommarjobb", "date_display": "2026-04-02", "date_iso": "2026-04-02T05:49:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/sommarjobb", "/sommar", "/ungdomar", "/barn-och-unga", "/arbete", "/arbetsmarknaden", "/arbetsformedlingen", "/arbetsloshet", "/arbetslos"]}, {"id": 152, "title": "Orange fog over the whole island - risk groups are warned", "summary": "Pictures from the cities of Heraklion and Chania show an almost cinematic appearance. The background is strong winds over North Africa. The wind has dragged sand particles from the Sahara north across the Mediterranean. The thick orange fog is so dense that air traffic over the Greek island is being diverted. The phenomenon is enhanced by the fact that it is hot and rainy, local media reports.  Warns at-risk groups Crete's Civil Defense Authority urges residents to avoid non-essential travel. The recommendation is primarily aimed at people with illnesses as well as children and the elderly. Meteorologists estimate that the fog may remain over the island for most of the Easter weekend and only lift on Sunday evening, when winds from North Africa are expected to subside.", "title_original": "Orange dimma över hela ön – riskgrupper varnas", "summary_original": "Bilder från städerna Heraklion och Chania visar ett nästan filmiskt sken. Bakgrunden är kraftiga vindar över Nordafrika. Blåsten har dragit med sig sandpartiklar från Sahara norrut över Medelhavet. Den tjocka orangea dimman är så tät att flygtrafik över den grekiska ön dirigeras om. Fenomenet förstärks av att det är varmt och regnigt, rapporterar lokala medier.  Varnar riskgrupper Kretas myndighet för civilt försvar uppmanar invånare att undvika resor som inte är nödvändiga. Rekommendationen riktas framför allt till personer med sjukdomar samt barn och äldre. Meteorologer bedömer att dimman kan ligga kvar över ön nästan hela påskhelgen och lätta först på söndag kväll, när vindarna från Nordafrika väntas avta.", "link": "https://www.tv4.se/artikel/7rtJBMNUWyEMLYlRcNChnM/orange-dimma-oever-hela-oen-riskgrupper-varnas", "date_display": "2026-04-02", "date_iso": "2026-04-02T05:17:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/kreta", "/vaderfenomen"]}, {"id": 153, "title": "Denies negotiations with the US: \"Irrational demands\"", "summary": "Ready for ground invasion", "title_original": "Nekar till förhandlingar med USA: ”Irrationella krav”", "summary_original": "Redo för markinvasion", "link": "https://www.tv4.se/artikel/3Oyx7CTwaZAF2oaukctatd/nekar-till-foerhandlingar-med-usa-irrationella-krav", "date_display": "2026-04-02", "date_iso": "2026-04-02T04:37:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 154, "title": "Nasa's Artemis II was delayed last night - to circle the moon", "summary": "At 00.35, Swedish time, the US space agency Nasa's manned expedition Artemis II began with a rocket launch. Astronauts will now take a turn around the moon and then come back to Earth. Although the astronauts will not land on the moon, it is the first space journey in 53 years with the goal of the moon. The launch also took place from the Kennedy Space Center in Florida – the same place where the Apollo missions had their beginnings in the 1960s and 1970s. The astronauts are expected to be the people who have been farthest from Earth ever when they circle the moon and turn home to then land in the Pacific Ocean, AP writes. With their noses at the moon some 400,000 kilometers away, Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen left Earth to the roar of the spacecraft's Space Launch System (SLS) engines. A short time later, NASA announced that the astronauts had reached Earth's orbit and that SLS had been disconnected. Five minutes into the flight, Commander Wiseman saw the group's objective: We have a beautiful moonrise, we're heading straight for it, he said from the capsule. Many spectators had gathered outside the cordoned off area to see the launch in place. Nasa also had a live broadcast for space enthusiasts worldwide. The capsule with the astronauts in it will remain in Earth's orbit for just over a day before it continues on around the moon.", "title_original": "Nasas Artemis II sköts upp i natt – ska runda månen", "summary_original": "Klockan 00.35, svensk tid inleddes USA:s rymdstyrelse Nasas bemannade expedition Artemis II med en raketuppskjutning. Astronauter ska nu ta en sväng runt månen och sedan komma tillbaka till jorden. Trots att astronauterna inte ska landa på månen är det den första rymdresan på 53 år med målet månen. Uppskjutningen skedde också från Kennedy Space Center i Florida – samma plats där Apollo-uppdragen hade sin början på 1960- och 1970-talen. Astronauterna beräknas bli de personer som befunnit sig längst ifrån jorden någonsin när man rundar månen och vänder hemåt för att sedan landa i Stilla havet, skriver AP. Med nosen mot månen omkring 400 000 kilometer bort lämnade Reid Wiseman, Victor Glover, Christina Koch och Jeremy Hansen jorden till dånet från motorerna på farkostens Space Launch System (SLS). En kort stund senare meddelade Nasa att astronauterna nått jordens omloppsbana och att SLS kopplats bort. Fem minuter in i flygningen såg befälhavaren Wiseman gruppens mål: Vi har en vacker månuppgång, vi är på väg rakt mot den, sade han från kapseln. Många åskådare hade samlats utanför det avspärrade området för att se uppskjutningen på plats. Nasa hade dessutom en direktsändning för rymdintresserade världen över. Kapseln med astronauterna i ska ligga kvar i jordens omloppsbana i drygt ett dygn innan den fortsätter vidare runt månen.", "link": "https://www.tv4.se/artikel/tt-260402-rymdenmanresa1-9e7d2a56/har-lyfter-manraketen-ingen-har-varit-langre-bort", "date_display": "2026-04-02", "date_iso": "2026-04-02T04:12:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["USA", "/usa", "/florida", "/inrikes"]}, {"id": 155, "title": "Sven-Erik Mattiasson: I have been to all Swedish cities", "summary": "Jämtland Evangelist's editor turns 90 - continues to spread the message of Jesus", "title_original": "Sven-Erik Mattiasson: Jag har varit i alla svenska städer", "summary_original": "Jämtlandsevangelistens redaktör fyller 90 år – fortsätter att sprida budskapet om Jesus", "link": "https://www.dagen.se/familj/sven-erik-mattiasson-jag-har-varit-i-alla-svenska-staeder/10263916", "date_display": "2026-04-02", "date_iso": "2026-04-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Sweet oat chickens for Easter", "summary": "Do crafts together with the children, and enjoy something sweet after the meal •", "title_original": "Söta havrekycklingar till påsk", "summary_original": "Pyssla tillsammans med barnen, och njut av något sött efter maten •", "link": "https://www.dagen.se/mat/soeta-havrekycklingar-till-pask/10269475", "date_display": "2026-04-02", "date_iso": "2026-04-02T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Unacceptable that every seventh Christian in the world is persecuted", "summary": "Regional challenges in security policy and stability mean that more and more European co   let currentType = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
