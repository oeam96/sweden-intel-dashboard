 "date_display": "2026-08-05", "date_iso": "2026-08-05T04:19:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "Ann-Mari traveled 80 miles for her knee surgery", "summary": "IRON. Health care is one of the voters' most important issues. Where in the country you live can determine the waiting time for an operation. The regions in the north send patients south for hundreds of millions – to try to shorten long queues. - It does not solve fundamental, structural problems, says Pia Näsvall, director of health and medical care in Region Västerbotten.", "title_original": "Ann-Mari reste 80 mil för sin knäoperation", "summary_original": "JÖRN. Sjukvården hör till väljarnas viktigaste frågor. Var i landet du bor kan avgöra väntetiden för en operation. Regionerna i norr skickar patienter söderut för hundratals miljoner – för att försöka korta långa köer. – Det löser inte grundläggande, strukturella problem, säger Pia Näsvall, hälso- och sjukvårdsdirektör i Region Västerbotten.", "link": "https://www.dn.se/sverige/ann-mari-reste-80-mil-for-sin-knaoperation/", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:19:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "The TV profile Linda Hammar is dead", "summary": "Linda Hammar became famous through the series \"In another part of Köping\", which began to be broadcast on TV4 in 2007. On Monday, she passed away after a period of illness. \"This is unreal to write, but it must be done. On Monday, my beloved sister Linda fell asleep in the hospital in Köping. I was by her side when she took her last breath. I hope she felt our boundless love,\" writes her brother Filip Hammar in a post on Instagram. Affected by cancer In the post, Filip Hammar tells us that his sister was diagnosed with cancer a couple of years ago, but that she remained just as happy and positive until the end. \"I was with her when the doctor told me what to expect. Linda listened and then said: 'This will probably be fine,'\" he writes. Until his death in 2022, Linda Hammar was 53 engaged to Lars-Åke Fransson, whom she met in connection with the television recordings. The series depicts everyday life in a group home for people with intellectual disabilities and was produced by Filip Hammar. \"Linda was a world champion at eliciting the redeeming the laughter, even though the situation was characterized by darkness. But the upcoming battle that the doctor gently explained she had ahead of her, she has now lost. We knew what was coming. Maybe Linda knew that too,\" writes Filip Hammar. Linda Hammar was 53 years old.", "title_original": "Tv-profilen Linda Hammar är död", "summary_original": "Linda Hammar blev känd genom serien ”I en annan del av Köping”, som började sändas på TV4 år 2007. I måndags gick hon bort efter en tids sjukdom. ”Det här är overkligt att skriva, men det måste göras. I måndags somnade min älskade syster Linda in på sjukhuset i Köping. Jag var vid hennes sida när hon tog sitt sista andetag. Jag hoppas hon kände vår gränslösa kärlek”, skriver hennes bror Filip Hammar i ett inlägg på Instagram. Drabbad av cancer I inlägget berättar Filip Hammar att systern för ett par år sedan diagnostiserades med cancer, men att hon förblev lika glad och positiv in i det sista. ”Jag var med henne när läkaren berättade om vad som nu väntade. Linda lyssnade och sa sen: ”Det blir nog bra det här”, skriver han. Blev 53 år Linda Hammar var fram till hans död 2022 förlovad med Lars-Åke Fransson, som hon träffade i samband med tv-inspelningarna. Serien skildrar vardagen på ett gruppboende för personer med intellektuella funktionsnedsättningar och producerades av Filip Hammar. ”Linda var världsmästare på att locka fram det förlösande skrattet, även om situationen präglades av mörker. Men den kommande kampen som läkaren försiktigt förklarade att hon hade framför sig, den har hon nu förlorat. Vi visste vad som väntade. Kanske visste Linda det också”, skriver Filip Hammar. Linda Hammar blev 53 år.", "link": "https://www.tv4.se/artikel/6eEqHAjxuuJFdR5BRIrmqd/linda-hammar-aer-doed", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:18:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/noje", "/i-en-annan-del-av-koping", "/koping"]}, {"id": 106, "title": "Trump: Open Hormuz or be 'hit very hard'", "summary": "Iran will be \"very hard hit\" if the Strait of Hormuz is not reopened very soon. That's what Donald Trump said in an interview with Fox News on the night of Wednesday. At the same time, information abounds that the US, Iran and Oman are approaching an agreement on a reopening of the strait.", "title_original": "Trump: Öppna Hormuz eller bli ”mycket hårt anfallet”", "summary_original": "Iran kommer att bli ”mycket hårt anfallet” om inte Hormuzsundet öppnas igen väldigt snart. Det sade Donald Trump i en intervju med Fox News under natten mot onsdagen. Samtidigt florerar uppgifter om att USA, Iran och Oman närmar sig en uppgörelse om en återöppning av sundet.", "link": "https://www.svd.se/a/y59AjK/kallor-narmar-sig-ett-avtal-om-hormuzsundet", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:17:24+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 107, "title": "Heat and drought are putting pressure on Europe's nuclear power", "summary": "Extreme heat and dried up rivers in Europe are pushing several countries to close nuclear reactors and reduce electricity production. The nuclear power plants are not built for this heat, says an expert.", "title_original": "Värme och torka pressar Europas kärnkraft", "summary_original": "Extremvärme och uttorkade floder i Europa pressar flera länder att stänga kärnkraftsreaktorer och minska elproduktionen. Kärnkraftverken är inte byggda för den här värmen, menar en expert.", "link": "https://www.svd.se/a/vr9Rjl/varme-och-torka-pressar-europas-karnkraft", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:15:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 108, "title": "Volvo's new secret model and seven new electric cars this autumn", "summary": "The automotive world is in the midst of a brutal technological shift. Europe is fighting back with everything it has – while Chinese challengers are pouring in. The competition is cutthroat. DN's Jonas Fröberg lists the eight most important cars of the autumn. One is Volvo's new secret EX50.", "title_original": "Volvos nya hemliga modell och sju nya elbilar i höst", "summary_original": "Bilvärlden är mitt i ett brutalt teknikskifte. Europa slår tillbaka med allt man har – samtidigt som kinesiska utmanare väller in. Konkurrensen är mördande. DN:s Jonas Fröberg listar höstens åtta viktigaste bilar. En är Volvos nya hemliga EX50.", "link": "https://www.dn.se/ekonomi/volvos-nya-hemliga-modell-och-sju-nya-elbilar-i-host/", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:14:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Viktor Karlsson: Was Trump really just an oil sheik?", "summary": "Trump's new gimmick raises the question of which title best describes him.", "title_original": "Viktor Karlsson: Var Trump egentligen bara en oljeshejk?", "summary_original": "Trumps nya fiffel väcker frågan om vilken titel som beskriver honom bäst.", "link": "https://www.dn.se/ledare/viktor-karlsson-var-trump-egentligen-bara-en-oljeshejk/", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:02:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Swedes fly more abroad", "summary": "Large forest fires in Southern Europe and continued unrest in the Middle East do not seem to have scared Swedish travelers. Air traffic abroad increased, Swedavia's figures for July show. - We see a strong increase in most destinations, says Elizabeth Axtelius at Swedavia.", "title_original": "Svenskarna flyger mer utomlands", "summary_original": "Stora skogsbränder i Sydeuropa och fortsatt oro i Mellanöstern verkar inte ha skrämt svenska resenärer. Flygtrafiken utomlands ökade, visar Swedavias siffror för juli. – Vi ser en stark ökning på flertalet destinationer, säger Elizabeth Axtelius på Swedavia.", "link": "https://www.dn.se/ekonomi/svenskarna-flyger-mer-utomlands/", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:01:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "The best Stockholm tips August 5: Monteverdi's masterpiece and famous synthpop duo", "summary": "Here you will find today's highlights from DN's calendar, selected by DN's Anders Haraldsson. And here is the full calendar.", "title_original": "De bästa Stockholmstipsen 5 augusti: Monteverdis mästerverk och känd synthpopduo", "summary_original": "Här hittar du dagens höjdpunkter ur DN:s kalendarium, valda av DN:s Anders Haraldsson. Och här är hela kalendariet.", "link": "https://www.dn.se/kultur/de-basta-stockholmstipsen-5-augusti-monteverdis-masterverk-och-kand-synthpopduo/", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Pride is better than self-censorship", "summary": "Gathering, being visible, becoming more and more and turning up the volume rather than being silent is the best way to secure people's right to live and love in freedom.", "title_original": "Stolthet är bättre än självcensur", "summary_original": "Att samlas, synas, bli fler och fler och skruva upp volymen snarare än att tystna är det bästa sättet att trygga människors rätt att få leva och älska i frihet.", "link": "https://www.svd.se/a/0pr6bg/stolthet-ar-battre-an-sjalvcensur", "date_display": "2026-08-05", "date_iso": "2026-08-05T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 113, "title": "Grilling drives up the price of meat", "summary": "The long-term shortage of slaughter animals and high demand during the grilling season cause the price of beef to continue rising in July, according to Matpriskollen.", "title_original": "Grillande driver upp köttpriset", "summary_original": "Den långvariga bristen på slaktdjur och hög efterfrågan under grillsäsongen får priset på nötkött att fortsätta stiga i juli, enligt Matpriskollen.", "link": "https://www.svd.se/a/ExB1XG/grillande-svenskar-driver-upp-kottpriset", "date_display": "2026-08-05", "date_iso": "2026-08-05T03:45:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 114, "title": "\"Many would feel - shit, what happened?\"", "summary": "The Liberals must double their support in a matter of weeks. Now Simona Mohamsson deals with SD voters in the hunt for votes. For her, the most important thing is that the party arouses any emotions at all: \"I don't mind people hating the Liberals.\"", "title_original": "”Många skulle känna – shit, vad hände?”", "summary_original": "Liberalerna måste dubbla sitt stöd på några veckor. Nu dealar Simona Mohamsson med SD-väljare i jakten på röster. För henne är det viktigaste att partiet alls väcker några känslor: ”Jag har inget emot att folk hatar Liberalerna.”", "link": "https://www.svd.se/a/wr9Gd5/simona-mohamsson-jagar-stodroster-for-att-radda-kvar-liberalerna-inget-emot-att-folk-hatar-l", "date_display": "2026-08-05", "date_is  \"My head went completely black\"", "title_original": "Kyrkan slarvade bort Carinas mammas aska", "summary_original": "Kyrkogårdsförvaltningen ringde efter ett år: Ska ni inte begrava henne snart? • ”Det blev alldeles svart i mitt huvud”", "link": "https://www.dagen.se/nyheter/kyrkan-slarvade-bort-carinas-mammas-aska/10463224", "date_display": "2026-08-05", "date_iso": "2026-08-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Steven Crosson:\nI never saw God in all those diaper changes", "summary": "We prayed for each other. With each other. God became part of the rhythm of everyday life.", "title_original": "Steven Crosson:\nJag såg aldrig Gud i alla dessa blöjbyten", "summary_original": "Vi bad för varandra. Med varandra. Gud blev en del av vardagens rytm.", "link": "https://www.dagen.se/ledare/steven-crosson-jag-sag-aldrig-gud-i-alla-dessa-bloejbyten/10430675", "date_display": "2026-08-05", "date_iso": "2026-08-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "\"It definitely has its advantages with an unusual name\"", "summary": "Congratulations on your name day Ulrik Josefsson!", "title_original": "”Det har absolut sina fördelar med ett ovanligt namn”", "summary_original": "Grattis på namnsdag Ulrik Josefsson!", "link": "https://www.dagen.se/familj/det-har-absolut-sina-foerdelar-med-ett-ovanligt-namn/10394659", "date_display": "2026-08-05", "date_iso": "2026-08-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Big fire in Laholm - one arrested", "summary": "An apartment building in central Laholm suffered an extensive fire during the night. A person has been arrested on suspicion of aggravated arson.", "title_original": "Storbrand i Laholm – en gripen", "summary_original": "Ett lägenhetshus i centrala Laholm drabbades under natten av en omfattande brand. En person har gripits misstänkt för grov mordbrand.", "link": "https://www.svd.se/a/QJ8ePP/storbrand-i-laholm-en-gripen", "date_display": "2026-08-05", "date_iso": "2026-08-05T00:23:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 125, "title": "Lula rages after diplomatic visa revoked", "summary": "The Brazilian government is sharply criticizing the United States after it revoked the visa of Brazil's ambassador to Washington.", "title_original": "Lula rasar efter indraget diplomatvisum", "summary_original": "Den brasilianska regeringen riktar skarp kritik mot USA efter att landet återkallat visumet för Brasiliens ambassadör i Washington.", "link": "https://www.svd.se/a/gkJMvJ/lula-rasar-efter-indraget-visum", "date_display": "2026-08-05", "date_iso": "2026-08-05T00:07:48+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 126, "title": "Man arrested at Trump's golf course", "summary": "A man has been arrested on suspicion of having filmed and photographed the security planning at a golf course that US President Donald Trump was to visit. A loaded weapon was later found in the man's car.", "title_original": "Man gripen vid Trumps golfbana", "summary_original": "En man har gripits misstänkt för att ha filmat och fotat säkerhetsplaneringen vid en golfbana som USA:s president Donald Trump skulle besöka. I mannens bil hittades senare ett skarpladdat vapen.", "link": "https://www.svd.se/a/6q5OP8/man-gripen-vid-trumps-golfbana-bar-ammunition", "date_display": "2026-08-04", "date_iso": "2026-08-04T23:44:53+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 127, "title": "Several fires in a short time - the police are investigating serious arson", "summary": "Several small fires broke out in different places in Märsta in Sigtuna municipality during Tuesday evening. The police have launched a preliminary investigation into aggravated arson and are investigating the events. - It's a lead we're working on, and it's up to the investigation to find out if it's true, says police spokesperson Robert Sennerdal. The emergency services were alerted to several locations in and around central Märsta. According to the rescue service, there were between five and six fire cases during the evening, while additional smaller fires were discovered nearby. Among other things, the fires have been reported from areas at Söderborgsgatan, Pinbackshallen, Sundveda and Steningehöjden. - There have been quite a few smaller fires. We have had the help of a police helicopter in the work, says Tommy Wållberg, commanding officer at the rescue service. \"Unusually many fires\" One of the fires is said to have covered around 5,000 square meters, but during the evening all fires were under control. The emergency services respond to the large number of alarms within a limited area. - There are an unusual number of fires in the same area, says Wållberg. - It doesn't feel natural. At the same time, he emphasizes that there is a high risk of fire in the county. - It is quite unusual, even though we have a very high risk of fire right now. Extra resources called in Due to the many alarms, the rescue service strengthened its preparedness during the evening. - We have had a number of the nearest stations deployed and have covered up with forces all the way from Uppsala, says Wållberg. At 10 p.m., the emergency services stated that the situation had begun to calm down, but that they were still vigilant. The police do not yet have a suspected perpetrator and do not want to go into details about the investigation. According to Robert Sennerdal, the events are taken very seriously. - As we have drawn up a report, we take it seriously, he says.", "title_original": "Flera bränder på kort tid – polisen utreder grov mordbrand", "summary_original": "Flera mindre bränder bröt ut på olika platser i Märsta i Sigtuna kommun under tisdagskvällen. Polisen har inlett en förundersökning om grov mordbrand och utreder händelserna. – Det är ett spår vi arbetar efter, och det får utredningen utvisa om det stämmer, säger polisens presstalesperson Robert Sennerdal. Räddningstjänsten larmades till ett flertal platser i och omkring centrala Märsta. Enligt räddningstjänsten handlade det om mellan fem och sex brandärenden under kvällen, samtidigt som ytterligare mindre bränder upptäcktes i närheten. Bränderna har bland annat rapporterats från områden vid Söderborgsgatan, Pinbackshallen, Sundveda och Steningehöjden. – Det har varit en hel del mindre bränder. Vi har haft hjälp av polishelikopter i arbetet, säger Tommy Wållberg, ledningsbefäl vid räddningstjänsten. ”Ovanligt många bränder” En av bränderna uppges ha omfattat omkring 5 000 kvadratmeter, men under kvällen var samtliga bränder under kontroll. Räddningstjänsten reagerar på det stora antalet larm inom ett begränsat område. – Det är ovanligt många bränder på samma område, säger Wållberg. – Det känns inte naturligt. Samtidigt betonar han att det råder hög brandrisk i länet. – Det är ganska ovanligt, även om vi har jättehög brandrisk just nu. Extra resurser inkallade Med anledning av de många larmen förstärkte räddningstjänsten sin beredskap under kvällen. – Vi har haft ett antal av de närmaste stationerna insatta och har täckt upp med styrkor ända från Uppsala, säger Wållberg. Vid 22-tiden uppgav räddningstjänsten att läget börjat lugna ned sig, men att man fortsatt är vaksam. Polisen har ännu ingen misstänkt gärningsperson och vill inte gå in på detaljer om utredningsarbetet. Enligt Robert Sennerdal tas händelserna på stort allvar. – I och med att vi har upprättat en anmälan så tar vi det på allvar, säger han.", "link": "https://www.tv4.se/artikel/5sci2VdtSxBcOPcHV0xalc/flera-braender-pa-kort-tid-polisen-utreder-brott", "date_display": "2026-08-04", "date_iso": "2026-08-04T20:52:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/marsta", "/polisen", "/raddningstjansten", "/raddningsinsats", "/brander"]}, {"id": 128, "title": "Zelenskyy: Aiming for peace before winter", "summary": "Huovinen: Possible – but there is an obstacle", "title_original": "Zelenskyj: Siktar på fred före vintern", "summary_original": "Huovinen: Möjligt – men det finns ett hinder", "link": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "date_display": "2026-08-04", "date_iso": "2026-08-04T20:26:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 129, "title": "Left his mother injured on the floor for four days - sentenced", "summary": "The 65-year-old son moved in with his mother when she could no longer support herself. Among other things, he would help with medicines, cooking and shopping. When she fell on January 18 this year in the hall of the home in a town in Västra Götaland, the son left her lying on the floor, even though he was staying in the apartment. For four days. On January 22, he chose to call 112 after the property manager visited their home and discovered the woman sick on the floor. - She no longer reacts. But she breathes freely and easily. (...) You can say that it is in between coma, awake, unconscious, sleep. (...) She is here in the hall, he told SOS Alarm. \"Involved severe pain\" When the ambulance arrived, the condition of the elderly woman was serious. Among other things, she had contracted severe infections that turned into sepsis, what was previously called blood poisoning. - (The woman) was in her own faeces and urine, said one of the paramedics during questioning. After a few days in the hospital, the woman died. The son was charged with aggravated assault, for having caused \"extensive suffering and pain\", and causing the death of another after being her so-called guarantor of protection. \"(The mother) has been emaciated, assessed by paramedics as malnourished, and has been lying on a hard surface for such a long time that a large pressure ulcer has appeared at the lower back. She has not received help with toilet visits or hygiene, which meant that she was forced to lie in her own feces and urine in the immediate vicinity of the pressure ulcer, which in addition to a medical risk of infection certainly also meant severe pain. (The son) in turn was fully aware of how painful it has been for (the mother) to lie for so long on the hard surface,\" writes the district court. \"Especially ruthlessness and brutality\" The district court has now convicted the son of serious assault but acquitted him of causing the death of another because the autopsy could not show any causal link between his actions and the mother's death. \"(The son) is criminal", "title_original": "Lät sin mamma ligga skadad på golvet i fyra dagar – döms", "summary_original": "Sonen i 65-årsåldern flyttade in hos sin mamma när hon inte längre kunde klara sig själv. Han skulle bland annat hjälpa till med mediciner, matlagning och att handla. När hon den 18 januari i år ramlade i hallen i hemmet på en ort i Västra Götaland lät sonen henne ligga kvar på golvet, trots att han vistades i lägenheten. I fyra dagar. Den 22 januari valde han att ringa 112 efter att fastighetsskötaren besökt deras hem och upptäckt kvinnan sjuk på golvet. – Hon reagerar inte längre. Men hon andas ledigt och lätt. (...) Man kan säga att det är mitt emellan koma, vaken, medvetslös, sömn. (...) Hon ligger här i hallen, sa han till SOS Alarm. ”Inneburit kraftig smärta” När ambulansen kom fram var tillståndet för den äldre kvinnan allvarligt. Hon hade bland annat fått svåra infektioner som övergått till sepsis, det som tidigare kallades blodförgiftning. – (Kvinnan) låg i sin egen avföring och urin, sa en av ambulanspersonalen i förhör. Efter några dagar på sjukhuset dog kvinnan. Sonen åtalades för grov misshandel, för att ha orsakat ”ett omfattande lidande och smärta”, och vållande till annans död efter att ha varit hennes så kallade skyddsgarant. ”(Mamman) har varit magerlagd, av ambulanspersonal bedömd som undernärd, och har legat på ett hårt underlag under så lång tid att ett större trycksår uppstått vid ländryggen. Hon har inte fått hjälp med toalettbesök eller hygien vilket inneburit att hon tvingats ligga i sin egen avföring och urin i omedelbar närhet till trycksåret vilket utöver en medicinsk risk för infektion med all säkerhet också inneburit kraftig smärta. (Sonen) har i sin tur varit fullständigt medveten om hur smärtsamt det varit för (mamman) att ligga så länge på det hårda underlaget”, skriver tingsrätten. ”Särskilt hänsynslöshet och råhet” Tingsrätten har nu dömt sonen för grov misshandel men friat honom från vållande till annans död eftersom obduktionen inte kunnat visa något orsakssamband mellan hans agerande och mammans död. ”(Sonen) är straffrättsligt ansvarig för det lidande och den smärta som de ca fyra dygnen utan nödvändig vård och smärtlindring som hans underlåtenhet att tillkalla vård inneburit för (mamman). Genom att opåkallat utsätta sin egen åldriga mamma för ett långdraget och onödigt lidande har han visat både särskilt hänsynslöshet och råhet och han ska därför fällas till ansvar för grov misshandel”, skriver rätten i domen. Sonen bedömdes lida av en allvarlig psykisk störning och påföljden blev därför rättspsykiatrisk vård med särskild utskrivningsprövning.", "link": "https://www.tv4.se/artikel/6PaB35CQ66YXeTB3MFNlnT/laet-sin-mamma-ligga-skadad-pa-golvet-i-fyra-dagar-doems", "date_display": "2026-08-04", "date_iso": "2026-08-04T20:13:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/brott", "/vastra-gotaland"]}, {"id": 130, "title": "Once again, Jomshof gives Kristersson a headache in a difficult position", "summary": "The Quisling row makes history repeat itself", "title_original": "På nytt ger Jomshof Kristersson huvudvärk i ett svårt läge", "summary_original": "Quisling-bråket får historien att upprepa sig", "link": "https://www.tv4.se/artikel/43qHL1V3TFVJcimx9YVuwj/pa-nytt-ger-jomshof-kristersson-huvudvaerk-i-ett-svart-laege", "date_display": "2026-08-04", "date_iso": "2026-08-04T19:20:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 131, "title": "August 4: Don't miss today's news", "summary": "Storm after Jomshof's (SD) quisling act, the price of preventive HIV drugs shines and the pilot is suspected after the Tjörn accident - here are five news from the day.", "title_original": "4 augusti: Missa inte dagens nyheter", "summary_original": "Storm efter Jomshofs (SD) quisslingutspel, priset på förebyggande hiv-läkemedel skenar och lotsen misstänks efter Tjörnolyckan – här är fem nyheter från dagen.", "link": "https://www.dn.se/varlden/4-augusti-missa-inte-dagens-nyheter/", "date_display": "2026-08-04", "date_iso": "2026-08-04T19:12:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "The bank top about Trump's new payment service: Terrible", "summary": "Trump Media's new Truth API service gives investors who pay them $100,000 a month faster access to Trump's social media updates. The arrangement upsets bank CEO Robert Bergqvist, who believes that Trump may start sending out more market-influencing news to show how valuable the new service is.", "title_original": "Banktoppen om Trumps nya betaltjänst: Fruktansvärt", "summary_original": "Trump Medias nya tjänst Truth API ger investerare som betalar dem 100 000 dollar i månaden snabbare tillgång till Trumps uppdateringar på sociala medier. Upplägget upprör banktoppen Robert Bergqvist som tror att Trump kan börja skicka ut fler marknadspåverkande nyheter för att visa hur värdefull den nya tjänsten är.", "link": "https://www.dn.se/ekonomi/banktoppen-om-trumps-nya-betaltjanst-fruktansvart/", "date_display": "2026-08-04", "date_iso": "2026-08-04T19:00:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Political scientist on the quisling dispute: \"Sandbox effect - everyone risks being dragged along\"", "summary": "Richard Jomshof (SD) called both S leader Magdalena Andersson and Aftonbladet's political editor-in-chief Anders Lindberg quislings - and the result was a firestorm of criticism. An expected and calculated one, according to political expert Henrik Ekengren Oscarsson. - Demonizing opponents engages their own, he says.", "title_original": "Statsvetare om quislingbråket: ”Sandlådeeffekt – alla riskerar dras med”", "summary_original": "Richard Jomshof (SD) kallade både S-ledaren Magdalena Andersson och Aftonbladets politiske chefredaktör Anders Lindberg för quislingar – och resultatet blev kritikstorm. En förväntad och beräknad sådan, enligt politiske experten Henrik Ekengren Oscarsson. – Demonisering av motståndare engagerar de egna, säger han.", "link": "https://www.dn.se/sverige/statsvetare-om-quislingdramat-sandladeeffekt-alla-riskerar-dras-med/", "date_display": "2026-08-04", "date_iso": "2026-08-04T19:00:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Stroud's statement about the resignation: \"Seems like that now\"", "summary": "He has been the man of rumors all summer. But now it seems that Elliot Stroud has actually played his last game for Mjällby.", "title_original": "Strouds besked om avskedet: ”Verkar så nu”", "summary_original": "Han har varit ryktenas man hela sommaren. Men nu verkar det som om Elliot Stroud faktiskt har gjort sin sista match för Mjällby.", "link": "https://www.dn.se/sport/strouds-besked-om-avskedet-verkar-sa-nu/", "date_display": "2026-08-04", "date_iso": "2026-08-04T18:53:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Ingmar Nevéus: Uncanny similarities between 2026 and the time before the First World War", "summary": "Are the wars in Ukraine and Iran weaving together into a larger, broader conflict? Several recent events indicate that. The perspective where the world's great powers are divided into aggressive alliances is disturbing – and eerily reminiscent of the prelude to the First World War.", "title_original": "Ingmar Nevéus: Kusliga likheter mellan 2026 och tiden före första världskriget", "summary_original": "Håller krigen i Ukraina och Iran på att vävas samman till en större, vidare konflikt? Flera händelser på sistone tyder på det. Perspektivet där världens stormakter delas upp i aggressiva allianser oroar – och påminner kusligt om förspelet till första världskriget.", "link": "https://www.dn.se/varlden/ingmar-neveus-kusliga-likheter-mellan-2026-och-tiden-fore-forsta-varldskriget/", "date_display": "2026-08-04", "date_iso": "2026-08-04T18:45:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Blood Rot, part 46 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 46 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-46-av-57/", "date_display": "2026-08-04", "date_iso": "2026-08-04T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "DN Debate. \"The scars from adolescence persist into middle age\"", "summary": "DN DEBATE. In a unique study, we have followed 1,000 Swedes from junior high school to middle age. The conclusions are clear: A deficient school environment increases the risk of mental illness, even well into old age. And unemployment early in adulthood often leaves lifelong scars. But there is hope. Early interventions can change everything, write six researchers and experts.", "title_original": "DN Debatt. ”Ärren från tonårstiden lever kvar upp i medelåldern”", "summary_original": "DN DEBATT. I en unik studie har vi följt 1 000 svenskar från högstadiet till medelåldern. Slutsatserna är tydliga: En bristfällig skolmiljö ökar risken för psykisk ohälsa, även långt upp i åldrarna. Och arbetslöshet tidigt i vuxenlivet får ofta livslånga spår. Men det finns hopp. Tidiga insatser kan ändra allt, skriver sex forskare och experter.", "link": "https://www.dn.se/debatt/arren-fran-tonarstiden-lever-kvar-upp-i-medelaldern/", "date_display": "2026-08-04", "date_iso": "2026-08-04T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Cold shower for Mjällby - lost in the final minutes", "summary": "Mjällby went towards a dream result against Slovan Bratislava. But unlucky management and a nightmare ending ruined the Europafest at Strandvallen.", "title_original": "Kalldusch för Mjällby – tappade i slutminuterna", "summary_original": "Mjällby gick mot ett drömresultat mot Slovan Bratislava. Men en oturlig styrning och en mardrömsavslutning sabbade Europafesten på Strandvallen.", "link": "https://www.dn.se/sport/kalldusch-for-mjallby-tappade-i-slutminuterna/", "date_display": "2026-08-04", "date_iso": "2026-08-04T17:58:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "The dog coach warns of the popular breed: \"Getting a little cheated\"", "summary": "The dog breed miniature american shepherd, often called MAS, has surged in popularity in recent years and was the sixth most registered dog breed in Sweden in 2025. At the same time, the number of dogs that need to be relocated is increasing, something that the site Hundnytt previously reported on.  Now experts warn that many buyers get the wrong idea of ​​what the breed actually requires. - Absolutely that there are many who have a bad idea. They think of a dog as a dog, and this is supposed to be some mini-variety and then it's an equals sign with lighter or simpler, says Mirre Linkfeldt, dog breeder. Since the breed was approved by the Swedish Kennel Club in 2018, the number of registrations has increased sharply. From 333 registered dogs that year to nearly 3,000 in 2025. But behind the development, according to the Swedish Miniature American Shepherd Club, there is a growing downside. More and more dogs are being rehomed and many owners seem not to have been prepared for the needs of the breed. \"Getting a little tricked\" According to dog coach Fredrik Steen, many people are attracted by the dog's appearance and size. - You get a little cheated: Oh, how small! Blue-eyed, cute, fur ball. I think this one suits me. But buying a MAS is like buying a German Shepherd or a Malinois. So extremely demanding breeds, he says. Fredrik Steen believes that the problem is not unique to MAS. - Many people don't want a Rottweiler, many people don't want a large Labrador or German Shepherd, because it's a lot of work, and then they turn to companion dogs, he says. But the concept can be misleading, according to him. - That concept is a bit of a hoax. A companion dog, whether it's a Chihuahua or a MAS, needs just as much activity. The call: Read up before buying In order to reduce the risk of future relocations, both buyers and breeders need to take greater responsibility, says Mirre Linkfeldt. - You need to read up, and of course the breeders also need to sell to the right people and maybe also refuse if it sounds like the dog doesn't fit based on how you describe what you are going to do with the dog, she says.", "title_original": "Hundcoachen varnar för populära rasen: ”Blir lite lurad”", "summary_original": "Hundrasen miniature american shepherd, ofta kallad MAS, har rusat i popularitet de senaste åren och var den sjätte mest registrerade hundrasen i Sverige 2025. Samtidigt ökar antalet hundar som behöver omplaceras, något som sajten Hundnytt tidigare rapporterat om.  Nu varnar experter för att många köpare får fel bild av vad rasen faktiskt kräver. – Absolut att det finns många som har dålig koll. De tänker hund som hund, och det här ska ju vara någon minivariant och då är det ett lika med-tecken med lättare eller enklare, säger Mirre Linkfeldt, hunduppfödare. Sedan rasen godkändes av Svenska Kennelklubben 2018 har antalet registreringar ökat kraftigt. Från 333 registrerade hundar det året till närmare 3 000 under 2025. Men bakom utvecklingen finns enligt Svenska Miniature American Shepherdklubben en växande baksida. Allt fler hundar omplaceras och många ägare verkar inte ha varit förberedda på rasens behov. ”Blir lite lurad” Enligt hundcoachen Fredrik Steen lockas många av hundens utseende och storlek. – Man blir lite lurad: Åh, vad liten! Blåögd, söt, pälsboll. Den här tror jag passar mig. Men köper man en MAS är det som att köpa en schäfer eller en malinois. Alltså extremt krävande raser, säger han. Fredrik Steen menar att problemet inte är unikt för MAS. – Många vill inte ha en rottweiler, många vill inte ha en stor labrador eller schäfer, för att det är mycket jobb, och då vänder man sig till sällskapshundar, säger han. Men begreppet kan vara missvisande, enligt honom. – Det begreppet blir lite lureri. En sällskapshund, oavsett om det är en chihuahua eller en MAS, behöver lika mycket aktivitet. Uppmaningen: Läs på innan köpet För att minska risken för framtida omplaceringar behöver både köpare och uppfödare ta större ansvar, menar Mirre Linkfeldt. – Man behöver läsa på, och givetvis behöver också uppfödarna sälja till rätt personer och kanske också neka om det låter som att masen inte passar utifrån hur ni beskriver vad ni ska göra med hunden, säger hon.", "link": "https://www.tv4.se/artikel/4knOkNzrvrNHTnV7OBLtVr/hundcoachen-varnar-foer-populaera-rasen-blir-lite-lurad", "date_display": "2026-08-04", "date_iso": "2026-08-04T17:44:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Hundar", "/hundar", "/hundcoachen", "/djur", "/djur-och-natur", "/inrikes"]}, {"id": 140, "title": "World War II shells exploded from the fires", "summary": "The French bushfires sent bomb squads to the south-west village of Le Porge on Monday as World War II shells began exploding. 400 grenades were found.", "title_original": "Granater från andra världskriget exploderade av bränderna", "summary_original": "De franska skogsbränderna fick bombtekniker att rycka ut till byn Le Porge i sydväst på måndagen – granater från andra världskriget började explodera. 400 granater hittades.", "link": "https://www.dn.se/varlden/granater-fran-andra-varldskriget-exploderade-av-branderna/", "date_display": "2026-08-04", "date_iso": "2026-08-04T17:24:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Details: Woman raped in restaurant - staff arrested", "summary": "The police were alerted to Kungsbacka municipality late on Monday evening. A woman had reported that she had been raped. - It happened at a restaurant, sometime last night. I don't intend to specify more, says Sonja Seligmann, the public prosecutor who is investigating the case. Personnel suspected The police launched an operation and were able to arrest a man suspected of rape early on Tuesday morning. According to information to TV4 Nyheterna, he works at the restaurant. - The suspect, a man, has been arrested. It was information that came to light and was passed on to the police that led to the arrest, says Sonja Seligmann. How does he react to the suspicions? - I can't quite answer that. The prosecutor is otherwise tight-lipped about the case and cannot comment on whether the suspect and the victim were unknown to each other. The police are now working further with, among other things, technical investigations. - You hold an interrogation and then you see how to proceed, says Sonja Seligmann.", "title_original": "Uppgifter: Kvinna våldtagen på restaurang – personal anhållen", "summary_original": "Polisen larmades till Kungsbacka kommun sent på måndagskvällen. En kvinna hade anmält att hon utsatts för en våldtäkt. – Det skedde på en restaurang, någon gång i går kväll. Mer tänker jag inte specificera, säger Sonja Seligmann, jouråklagare som utreder ärendet. Personal misstänkt Polisen inledde en insats och kunde tidigt på tisdagsmorgonen gripa en man misstänkt för våldtäkt. Enligt uppgifter till TV4 Nyheterna arbetar han på restaurangen. – Den misstänkte, en man, är anhållen. Det var uppgifter som framkom och förmedlades till polisen som ledde till gripandet, säger Sonja Seligmann. Hur ställer han sig till misstankarna? – Det kan jag inte helt svara på. Åklagaren är i övrigt fåordig om ärendet och kan inte heller kommentera om den misstänkte och den utsatta har varit okända för varandra. Polisen arbetar nu vidare med bland annat tekniska undersökningar. – Man håller förhör och sen ser man hur man ska gå vidare, säger Sonja Seligmann.", "link": "https://www.tv4.se/artikel/6DxVTkmCdSHj6B8CCIjAs5/uppgifter-kvinna-valdtagen-pa-restaurang-personal-gripen", "date_display": "2026-08-04", "date_iso": "2026-08-04T15:01:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/kungsbacka", "/valdtakt", "/brott"]}, {"id": 142, "title": "Kristersson: \"You just don't say that\"", "summary": "SD responds to criticism of Jomshof's quisling statements: \"Throwing stones into glass houses\"", "title_original": "Kristersson: ”Så säger man bara inte”", "summary_original": "SD svarar efter kritiken mot Jomshofs quisling-uttalanden: ”Kastar sten i glashus”", "link": "https://www.tv4.se/artikel/2YZ08cJvc9xyMNsVkl0ZcH/kristersson-sa-saeger-man-bara-inte", "date_display": "2026-08-04", "date_iso": "2026-08-04T14:05:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "Forssell stands by the criticism against Spain", "summary": "The EU's extraordinary meeting on Tuesday was important to get control of the emergency situation after 80,000 migrants made it to the exclave of Ceuta in one day, according to Migration Minister Johan Forssell (M). - We have 80 dead, so it is a very tragic situation, he tells TV4 Nyheterna. According to Forssell, the meeting was also necessary to reduce the risk of something similar happening again. - The important thing now is that Spain secures its border. It has been done in an efficient way and that it is not repeated again, so that we are not standing here again in a day or in a week and have an even bigger and more difficult situation, he says. Gets the nod from Spanish intelligence Most assessors and analysts who have spoken out have highlighted a combination of factors that could be behind it. One is that Morocco has several reasons to put pressure on Spain and use migration as a weapon. It also happened in 2021, for example. Another is that smugglers pushed and spread incorrect information about the possibilities of coming to Spain and the EU. Even though Ceuta is a Spanish exclave, it is not possible to travel from there to Spain without a passport or visa.  On Monday, Ceuta's conservative leader Juan Jesús Vivas was the first official in Spain to openly accuse neighboring Morocco of what happened. - People do not see this as a migration crisis, but as an attack on the territorial integrity of our country, he told El País newspaper, adding that the perception is that Morocco allowed it to happen and \"even encouraged it\". \"Perceptions of Spanish migration policy\" Migrants on the ground have told Le Monde that posts on social media that Europe has \"opened the gates\" prompted thousands to seek the exclave. Johan Forssell stands by his criticism of Spain's migration policy as the decisive factor. - The latest reports we have received, for example from Spain's intelligence service, show that there were actually beliefs, sometimes correct and sometimes incorrect, about the", "title_original": "Forssell står fast vid kritiken mot Spanien", "summary_original": "EU:s extrainsatta möte på tisdagen var viktigt för att få kontroll över den akuta situationen efter att 80 000 migranter tagit sig till exklaven Ceuta på ett dygn, enligt migrationsminister Johan Forssell (M). – Vi har 80 döda, så det är en väldigt tragisk situation, säger han till TV4 Nyheterna. Enligt Forssell var mötet också nödvändigt för att minska risken för att något liknande inträffar igen. – Det viktiga nu är att Spanien säkrar sin gräns. Man har gjort det på ett effektivt sätt och att det inte upprepas igen, så att vi inte står här om en dag igen eller om en vecka och har en ännu större och svårare situation, säger han. Får medhåll från spansk underrättelsetjänst De flesta bedömare och analytiker som uttalat sig har lyft fram en kombination av faktorer som kan ligga bakom. En är att Marocko har flera skäl att sätta press på Spanien och använda migration som ett vapen. Det skedde till exempel också 2021. En annan är att smugglare drivit på och spridit felaktig information om möjligheterna att komma till Spanien och EU. Även om Ceuta är en spansk exklav går det inte att resa pass- och visumlöst därifrån till Spanien.  Under måndagen var Ceutas konservative ledare Juan Jesús Vivas den förste makthavaren i Spanien att öppet anklaga grannlandet Marocko för det som inträffat. – Folk ser inte detta som en migrationskris, utan som en attack mot vårt lands territoriella integritet, sa han till tidningen El País och tillade att uppfattningen är att Marocko lät det hända och ”till och med uppmuntrade det”. ”Föreställningar om spanska migrationspolitiken” Migranter på plats har uppgett för Le Monde att inlägg på sociala medier om att Europa ”öppnat portarna” fick tusentals att söka sig till exklaven. Johan Forssell står fast vid sin kritik mot Spaniens migrationspolitik som den avgörande faktorn. – De senaste rapporterna vi har fått, till exempel från Spaniens underrättelsetjänst, visar att det faktiskt var föreställningar, ibland korrekta och ibland felaktiga, om den spanska migrationspolitiken som väldigt snabbt fick stor spridning. Det bidrog till att tiotusentals personer korsade gränsen på bara ett dygn, säger han. Tidigare i år gav Spanien invandrare som befunnit sig utan tillstånd i landet i minst fem månader möjlighet att ansöka om uppehållstillstånd, ett beslut som vissa pekar ut som ett skäl till händelserna i Ceuta. Ansökningstiden för amnestin löpte ut i juni, och 1,2 miljoner personer har skickat in en ansökan.  Jämförs med situationen i Finland Att migranter används som ett verktyg i hybridkrigföring är inte något nytt, framhåller Forssell. Han pekar bland annat på situationen vid Finlands gräns mot Ryssland, där Moskva anklagats för att styra asylsökande mot gränsövergångarna. – Om det är på det sättet, hur kommer det i så fall att det har lyckats? Vad är det för sårbarheter som finns i systemet? Och en sån sårbarhet här, det är ju otvivelaktigt de pull-faktorer som finns i migrationspolitiken i Spanien och som vi är väldigt många medlemsstater som har pekat på att det kan få konsekvenser – inte bara för Spanien utan för Europa som helhet. Forssell har tidigare sagt att händelsen kan ha varit koordinerad, men menar att det inte befriar den spanska regeringen från ansvar. – Uppenbarligen har det funnits en sårbarhet i form av en migrationspolitik där man ger en väldigt stor amnesti till personer utan asylskäl. Annars hade vi inte sett att detta kunnat genomföras, säger han.", "link": "https://www.tv4.se/artikel/6BtuCdQ6Bm0aeZ617vYwqo/forssell-star-fast-vid-kritiken-mot-spanien", "date_display": "2026-08-04", "date_iso": "2026-08-04T13:33:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ceuta", "/migrantkrisen-i-spanien", "/eu", "/johan-forssell"]}, {"id": 144, "title": "Jomshof (SD): \"Even Magdalena Andersson is a quisling\"", "summary": "The C leader: \"Completely unacceptable\" • Requires Kristersson response", "title_original": "Jomshof (SD): ”Även Magdalena Andersson är en quisling”", "summary_original": "C-ledaren: ”Fullständigt oacceptabelt” • Kräver Kristersson-svar", "link": "https://www.tv4.se/artikel/3rKCrnxL4hxxVWcbHHLzzp/jomshof-sd-aeven-magdalena-andersson-aer-en-quisling", "date_display": "2026-08-04", "date_iso": "2026-08-04T12:28:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Svensk politik", "/politik"]}, {"id": 145, "title": "Internal dissatisfaction with Trump: \"Want him to go somewhere else\"", "summary": "Several Republican senators see Donald Trump as a growing political burden ahead of the midterm elections this fall. This is reported by The Hill, which describes growing dissatisfaction within the Republican Party with the president's low approval ratings and recurring conflicts with party colleagues. According to the newspaper, several Republican senators warn that the president's actions could hinder the party's ability to maintain control of the Senate. Among other things, they point to his declining support among independent voters. Historically low numbers Jan Hallenberg, professor emeritus of political science and US expert, says that the concern within the party is both real and widespread. He refers to opinion polls that show that about a quarter of independent voters support Trump, while about two-thirds are critical. - It is a terrible drop, he says. According to Hallenberg, many Republican candidates would prefer to keep Trump at a distance during the election campaign. - Most of the candidates would like him to go somewhere else or stay at Mar-a-Lago. Some do not dare to speak out because he is still so strong within the party. Hallenberg believes that Trump has gone from being an asset to becoming a burden for the Republicans. - Before this election, he is their biggest problem, he says. Dissatisfaction with the economy He compares Trump's opinion situation with the situation after the storming of the Capitol on January 6, 2021. - He is in several opinion polls at 32, 33, 34 percent. The only person to have lower numbers at this point in a presidential term is Richard Nixon during Watergate. He is a burden. According to Hallenberg, the criticism is mainly about voters' dissatisfaction with the economy. - They are dissatisfied that he does not focus on inflation and the high prices. Instead, he rebuilds the White House or embarks on war adventures in the Middle East. Voters think the economy is the most important issue, but Trump isn't talking about it. Could cost Republicans power That Republican senators now", "title_original": "Interna missnöjet med Trump: ”Vill att han åker någon annanstans”", "summary_original": "Flera republikanska senatorer ser Donald Trump som en växande politisk belastning inför mellanårsvalet i höst. Det rapporterar The Hill, som beskriver ett växande missnöje inom det republikanska partiet med presidentens låga opinionssiffror och återkommande konflikter med partikamrater. Enligt tidningen varnar flera republikanska senatorer för att presidentens agerande kan försvåra partiets möjligheter att behålla kontrollen över senaten. De pekar bland annat på hans minskande stöd bland oberoende väljare. Historiskt låga siffror Jan Hallenberg, professor emeritus i statsvetenskap och USA-expert, säger att oron inom partiet är både verklig och utbredd. Han hänvisar till opinionsmätningar som visat att omkring en fjärdedel av de oberoende väljarna stöder Trump, medan ungefär två tredjedelar är kritiska. – Det är ett fruktansvärt sänke, säger han. Enligt Hallenberg vill många republikanska kandidater helst hålla Trump på avstånd under valrörelsen. – De flesta kandidaterna skulle vilja att han skulle åka någon annanstans eller stanna i Mar-a-Lago. En del vågar inte säga emot därför att han ändå är så stark inom partiet. Hallenberg menar att Trump gått från att vara en tillgång till att bli en belastning för republikanerna. – Inför det här valet är han deras största problem, säger han. Missnöje med ekonomin Han jämför Trumps opinionsläge med situationen efter stormningen av Kapitolium den 6 januari 2021. – Han ligger i flera opinionsmätningar på 32, 33, 34 procent. Den enda som haft lägre siffror den här tiden av en presidentperiod är Richard Nixon under Watergate. Han är en belastning. Enligt Hallenberg handlar kritiken främst om väljarnas missnöje med ekonomin. – De är missnöjda med att han inte fokuserar på inflationen och de höga priserna. I stället bygger han om Vita huset eller ger sig in i krigsäventyr i Mellanöstern. Väljarna tycker att ekonomin är den viktigaste frågan, men Trump pratar inte om det. Kan kosta Republikanerna makten Att republikanska senatorer nu öppet kritiserar Trump är uppseendeväckande, men inte unikt, enligt Hallenberg. – Mot slutet av en presidentperiod börjar det egna partiet ofta tröttna på presidenten. Men eftersom Trump varit så oerhört stark inom Republikanerna känns det här mer ovanligt än det egentligen är, säger han. Om Demokraterna tar kontroll över kongressens båda kamrar efter mellanårsvalet väntar också hårdare granskning av Trump och hans administration, enligt Hallenberg. – Då blir det mycket svårare att få igenom lagförslag och budgetar. Dessutom kommer Demokraterna att kunna hålla omfattande utfrågningar där man kallar in ministrar och kräver att de redovisar olika beslut. Han tror också att Demokraterna skulle rikta fokus mot Trumps affärsintressen. – De kommer att undersöka de här kryptoföretagen som han har tjänat en miljard dollar på. Vad är detta för någonting? Ska en president verkligen göra så här?", "link": "https://www.tv4.se/artikel/3SfYSguN5r9z9vgoRiE31c/interna-missnoejet-med-trump-vill-att-han-aker-nagon-annanstans", "date_display": "2026-08-04", "date_iso": "2026-08-04T11:19:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/donald-trump", "/usa", "/mellanarsvalet-usa", "/politiker", "/amerikansk-politik", "/usavalet", "/demokraterna", "/republikanerna"]}, {"id": 146, "title": "The Social Democrats' opinion on same-sex weddings is pure chaos", "summary": "Jakob Norrhall: The question is theological – not labor law.", "title_original": "Socialdemokraternas åsikt om samkönade vigslar är rena kaoset", "summary_original": "Jakob Norrhall: Frågan är teologisk – inte arbetsrättslig.", "link": "https://www.dagen.se/ledare/socialdemokraternas-asikt-om-samkoenade-vigslar-aer-rena-kaoset/10464986", "date_display": "2026-08-04", "date_iso": "2026-08-04T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 147, "title": "The Swedish Fifa top breaks the silence: \"Sad\"", "summary": "\"We have all been thrown into chaos\"", "title_original": "Svenske Fifa-toppen bryter tystnaden: ”Sorgligt”", "summary_original": "”Vi har alla kastats in i ett kaos”", "link": "https://www.tv4.se/artikel/tt-260804-fifaaffargrafstrom1-e9301693/svenske-toppen-i-internt-meddelande-sorgligt", "date_display": "2026-08-04", "date_iso": "2026-08-04T09:28:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport"]}, {"id": 148, "title": "V-member praised terrorist - the answer: \   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
