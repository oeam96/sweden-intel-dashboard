”, avslutar man inlägget. Officiella VM-låten möts av kritik TV4 Nyheterna har tidigare berättat om att Sveriges officiella VM-låt ”Leva för alltid” har mötts av kritik – både från svenska fotbollssupportrar och musikrecensenter. Olof Lundh anser bland annat att någon med större fotbollsengagemang borde ha fått göra den och kallar Thomas Stenströms låt för ett riktigt ”stolpskott”. Samtidigt påpekar han att det är vanligt att mästerskapslåtar missar målet och att tidspressen i det här fallet sannolikt har påverkat kvaliteten. På kultursidorna har låten bland annat beskrivits som ”slapp och cynisk” och att ”extasen uteblir”. SVT Kulturnyheterna har dessutom uppmärksammat att låtens refräng är återanvänd från en tv-serie.", "link": "https://www.tv4.se/artikel/5dRk8MMWUfdcJRgqXC49av/stenstroem-ratas-tv4-vaeljer-annan-vm-lat", "date_display": "2026-05-26", "date_iso": "2026-05-26T15:40:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotboll", "/fotbolls-vm-2026", "/musik", "/tv4", "/tv4-play", "/personer/thomas-stenstrom"]}, {"id": 143, "title": "Economists see the government's moves: \"Very short-term reform\"", "summary": "The expert's objection: \"The common man doesn't have it tough\"", "title_original": "Ekonomer sågar regeringens drag: ”Väldigt kortsiktig reform”", "summary_original": "Expertens invändning: \"Gemene man har det inte tufft\"", "link": "https://www.tv4.se/artikel/1tqpQ3w9Pzk3m9jhyJKaLV/ekonomer-sagar-regeringens-drag-vaeldigt-kortsiktig-reform", "date_display": "2026-05-26", "date_iso": "2026-05-26T13:18:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 144, "title": "Haakon: Mette-Marit has gotten worse", "summary": "On Tuesday, Crown Prince Haakon met the press after the Abel Prize award ceremony in Oslo. The questions to the prince spanned a wide spectrum and touched, among other things, Norway's chances in this summer's football World Cup and Mette-Marit's contacts with Epstein. But also the crown princess's illness. - The Crown Princess is seriously ill. I think she has gotten significantly worse, so I am worried about her health, says Crown Prince Haakon to the Norwegian media and adds: - She uses oxygen in everyday life, but it is not a perfect solution. Mette-Marit has suffered from pulmonary fibrosis since 2018 – a chronic disease that causes scar tissue to form in the lungs and that impairs oxygen absorption for the sufferer.  Approaching lung transplant Already in December last year, Mette-Marit told openly in an interview with NRK that the disease had worsened during the past autumn. - I have spent a large part of this six months at Jessheim or at the National Hospital taking new tests, and then we had a number of conversations this autumn about lung transplantation. That is what is new, that we are beginning to approach that step, said the Crown Princess at the time. Queen Sonja is also struggling with health problems. She is currently on sick leave for heart fibrillation and heart failure and has, among other things, been forced to forgo the royal couple's trip to Western Norway, where King Harald is now. - I think it is impressive how both the king and the queen continue to carry out their official commitments. And I think they do a lot more than you would expect. So I am very impressed by that, says Crown Prince Haakon. \"Finding himself in a difficult situation\" Ole-Jørgen Schulsrud-Hansen is a historian and court expert on Norwegian TV2. He believes that it is natural but also a necessity for the royal family and not least Crown Prince Haakon to be transparent about Mette-Marit's illness. - The Norwegian royal house is in a somewhat difficult situation in terms of illnesses, with Princess Astrid's illness, the Queen's illness and not least the Crown Princess's chronic l", "title_original": "Haakon: Mette-Marit har blivit sämre", "summary_original": "Kronprins Haakon mötte på tisdagen pressen efter Abelprisutdelningen i Oslo. Frågorna till prinsen spände över ett brett spektrum och rörde bland annat Norges chanser i sommarens fotbolls-VM och Mette-Marits kontakter med Epstein. Men också kronprinsessans sjukdomstillstånd. – Kronprinsessan är allvarligt sjuk. Jag tycker att hon har blivit betydligt sämre, så jag är orolig för hennes hälsa, säger Kronprins Haakon till norska medier och tillägger: – Hon använder syrgas i vardagen, men det är ingen fullgod lösning. Mette-Marit har lidit av lungfibros sedan 2018 – en kronisk sjukdom som gör att det bildas ärrvävnad i lungorna och som försämrar syreupptagningen för den drabbade.  Närmar sig lungtransplantation Redan i december förra året berättade Mette-Marit öppenhjärtigt i en intervju med NRK om att sjukdomen förvärrats under den gångna hösten. – Jag har tillbringat en stor del av det här halvåret på Jessheim eller på Rikssjukhuset med att ta nya tester, och sedan har vi haft ett antal samtal i höst om lungtransplantation. Det är det som är nytt, att vi börjar närma oss det steget, sade kronprinsessan då. Även drottning Sonja sliter med hälsoproblem. Hon är för tillfället sjukskriven för hjärtflimmer och hjärtsvikt och har bland annat tvingats avstå kungaparets resa till Vestlandet där kung Harald nu befinner sig. – Jag tycker det är imponerande hur både kungen och drottningen fortsätter att utföra sina officiella åtaganden. Och jag tycker att de gör mycket mer än man kan förvänta sig. Så jag är väldigt imponerad av det, säger kronprins Haakon. ”Befinner sig i en svår situation” Ole-Jørgen Schulsrud-Hansen är historiker och hovexpert på norska TV2. Han menar att det är naturligt men också en nödvändighet att kungahuset och inte minst kronprins Haakon är transparenta med Mette-Marits sjukdom. – Det norska kungahuset befinner sig i en lite svår situation vad gäller sjukdomar, med prinsessan Astrids sjukdom, drottningens sjukdom och inte minst kronprinsessans kroniska lungsjukdom, säger han och tillägger: – Så det är väldigt mycket ansvar som vilar på kronprinsens skuldror.  Monarkin och kungahusets roll är att vara synliga för att kunna fungera på bästa möjliga sätt, förklarar han. – Jag tycker att det är fint att kronprinsen möter pressen i en situation som inte är regisserad, och att han svarar så gott han kan på pressens frågor. Det är ju inget som är vidare vanligt i de andra europeiska monarkierna. Så att kronprinsen gör det, det är värt att sätta pris på, säger Ole-Jørgen Schulsrud-Hansen. Större ansvar vilar på kronprinsen Han hoppas nu att arbetsbördan inte blir för tung på kronprinsen själv. – Vi kan skatta oss lyckliga att vi har en kronprins med så pass hög arbetskapacitet. Men vad gör vi i Norge om han skulle bli sjuk? Då hade det bara varit prins Sverre Magnus som kunde steppa upp och göra ett jobb. Hur påverkas kungahuset av Mette-Marits sjukdom? – Det påverkar mycket. Det har det gjort i flera år redan, men skillnaden är att om de dåliga dagarna förr var i mindretal så är nu de bra dagarna istället i mindretal, säger Ole-Jørgen Schulsrud-Hansen och tillägger: – Så rent arbetsmässigt påverkar det monarkin mer nu än tidigare. Då är det bra att kronprinsen är tydlig och säger att man helt enkelt måste följa läkarnas råd och ta mer hänsyn till sjukdomen. Trots att både kung Harald och drottning Sonja närmar sig 90 år,  och sliter med hälsan båda två, så tror han inte att de kommer abdikera och lämna över makten till sonen. – Det sker nog inte. Kungen har varit tydlig med att det inte ens är en fråga för honom.", "link": "https://www.tv4.se/artikel/CVYEnd7NH0U15gUeurQL2/haakon-mette-marit-har-blivit-saemre", "date_display": "2026-05-26", "date_iso": "2026-05-26T13:17:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/norge", "/norska-kungahuset", "/mette-marit", "/kung-harald"]}, {"id": 145, "title": "Faith in MFF's sporting management is gone", "summary": "In early December, Malmö FF presented Henrik Rydström's replacement. The Spaniard Miguel Ángel Ramírez was given the task of managing the club, which had a sporting and financial hardship in 2025, where Rydström was fired. After two matches in the Europa League, four cup matches and nine Allsvenskan matches, it's over for the Spaniard. Sure, he had a title from South America but also a checkered past and apart from some cynical fighting efforts in Stockholm, the imprint was a failure. Four losses in a row in the Allsvenskan with 13 goals conceded and efforts that were overall weak, the decision is perhaps not so strange. If it weren't for the sporting leadership in the form of Daniel Andersson failing to recognize himself via the firing of the coach. When MFF presented Ramirez as coach, Andersson spoke about the long and extensive process when he was selected as the new head coach. He was a strong leader who could handle tough pressure, stood for the game you want to play and was keen on developing young talent. \"We started with about 50 names, then we met 13-14 coaches in a first stage, we met six or seven again, met three again and then a final meeting. In the meantime, of course, we have taken references. It feels solid and good, feels like we have found the right one,\" Andersson said that day in December. Of course, Andersson was not alone. Many internally point to Jaime Segura who is said to have lobbied for the Spanish coach. Then there was a board that was involved and also the new CEO Jimmy Rosengren was presented in advance. Then it still happens that the responsibility falls more on Daniel Andersson than anyone else. \"The question is whether Daniel Andersson can stay after this?\" You can point to injuries to key players such as Pontus Jansson, Anders Christiansen and even Robin Olsen when you look at a weak spring where Mjällby trailed MFF in the cup and you are now slipping in the Allsvenskan, but that is not a sufficient explanation. Malmö FF has too big and good a squad not to perform better. Man drop", "title_original": "Tron på MFF:s sportsliga ledning är borta", "summary_original": "I början av december presenterade Malmö FF Henrik Rydströms ersättare. Spanjoren Miguel Ángel Ramírez fick uppdraget att styra upp klubben som haft ett sportsligt och ekonomiskt tungt 2025 där Rydström fått sparken. Efter två matcher i Europa League, fyra cupmatcher och nio allsvenska matcher är det över för spanjoren. Visst, han hade en titel från Sydamerika men också ett brokigt förflutet och bortsett från några cyniska kämpainsatser i Stockholm var avtrycket misslyckat. Fyra förluster i rad i allsvenskan med 13 insläppta mål och insatser som totalt sett var svaga är beslutet kanske inte så konstigt. Om det inte vore för att den sportsliga ledningen i form av Daniel Andersson underkänner sig själv via sparkningen av tränaren. När MFF presenterade Ramirez som tränare talade Andersson om den långa och omfattande processen när man vaskat fram honom som ny huvudtränare. Han var stark ledare som klarade tuff press, stod för det spel man vill spela och var vass på att utveckla unga talanger. ”Vi började väl med ett 50-tal namn, sen har vi träffat 13-14 tränare i ett första skede, sex-sju har vi träffat igen, träffat tre igen och sen en sista träff. Under tiden har vi såklart tagit referenser. Det känns gediget och bra, känns som att vi har hittat riktigt rätt”, sa Andersson den där dagen i december. Givetvis var Andersson inte ensam. Många internt pekar på Jaime Segura som ska ha lobbat för den spanske tränaren. Sedan fanns en styrelse som var delaktig och även nya vd:n Jimmy Rosengren blev presenterad i förväg. Sedan blir det ändå så att ansvaret landar mer på Daniel Andersson än någon annan. ”Frågan är om Daniel Andersson kan vara kvar efter det här?” Man kan peka på skador på tongivande spelare som Pontus Jansson, Anders Christiansen och även Robin Olsen när man ser på en svag vår där Mjällby kölhalade MFF i cupen och man nu sladdar i allsvenskan, men det är inte en tillräcklig förklaring. Malmö FF har en för stor och bra trupp för att inte prestera bättre. Man släpper framför allt in för många enkla mål. En ny tränare kan komma in. På många sätt ett fint uppdrag där man har allt att vinna. Lite Graham Potter-liknande läge. Allt är nerkört kring Malmö FF och någon som kan svensk fotboll, kan Malmö och kanske är vassare på ledarskap och relationer kommer se möjligheten att lyfta MFF. Sedan blir det inte lätt när kostnadsmassan krockar med minskande intäkter, inget Europa och få försäljningar. En annan fråga är om Daniel Andersson kan vara kvar efter det här? De senaste årens svaga värvningar faller mycket på honom och nu den här noggranna tränarrekryteringen som åker ut innan VM-uppehållet är här. Något gick fel i rekryteringen om man på fem månader upptäcker att allt är fel med spanjoren. Klart att man kan peka på att Daniel Andersson haft dubbla jobb under flera år efter att ha tagit ett kliv upp 2021. Man försökte ersätta honom som sportchef med Andreas Georgsson men det havererade. Sedan skulle Ola Toivonen skolas in i rollen, men det havererade också. Det har varit svårare än man trott vilket lett till dubbeljobb för Andersson. Lundh: Han tryckte antagligen på knappen Under måndagen kom beskedet att Malmö till slut köper loss nye sportchefen Philip Berglund från rollen som scoutingchef i Hammarby. Egentligen skulle han börjat i augusti, men är redo att gå i gång i nästa vecka. Vilket betyder att han redan är i gång och antagligen tryckt på knappen för att sparka Ramirez. Under tisdagen publicerade Aftonbladet interna dokument som aviserade hårda tag under nye ordföranden Zlatko Rihter. Där man ska utvärdera allt och alla och även införa AI för att lyfta Malmös verksamhet. Det kanske är nödvändigt med hårda tag från en som gjort karriär i näringslivet och är känd för hårda nypor. Konstigt nog nämns inte Daniel Andersson i artikeln och då nämns han kanske inte heller i dokumentet. Kanske ser man värdet av Andersson i en roll ovanför tre sportchefer med ansvar för herr, dam respektive ungdom. Att Andersson är kopplingen till föreningens identitet. Eller så är han utsuddad i dokumentet och planerna? Malmö FF har det senaste året fått se vd:n Niclas Carlnén säga upp sig och ordföranden Anders Pålsson inte få förnyat förtroende för en sista period på ett till två år. Kanske blir det för mycket att även rycka bort Andersson som haft många roller, men som sedan 2014 varit sportsligt ansvarig. Vi lär se framåt hur det blir. Klart är att Daniel Andersson är en av arkitekterna som gjorde Malmö FF till en stormakt i svensk klubbfotboll och som radade upp titlar, gruppspel i Europa och stora försäljningar. Han har på många sätt förtjänat möjligheterna att få köra på. Att han orkat är i sig fascinerande sett till att det är en krävande livsstil som många har mer eller mindre välgrundade åsikter om. Ändå blir det en rejäl prövning för Malmö FF och Daniel Andersson sett till misslyckandet med Miguel Ángel Ramírez. Går det att glida ur det och bara vara övergripande sportsligt ansvarig? Sett till trycket på spelare, ledare och Malmö som klubb är det mycket tveksamt om Daniel Andersson kan köra på som vanligt.", "link": "https://www.tv4.se/artikel/4IXdOBazxzhLlN6Ubrg8r/tron-pa-mff-s-sportsliga-ledning-aer-borta", "date_display": "2026-05-26", "date_iso": "2026-05-26T13:09:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/sport", "/fotboll", "/malmo-ff", "/allsvenskan", "/svensk-fotboll", "/personer/olof-lundh"]}, {"id": 146, "title": "Ferrari's new electric car is mocked - then the stock plummets", "summary": "Ferrari is now taking the step into electric cars and yesterday presented the Ferrari Luce. When trading opened, the stock plummeted by more than seven percent. In social media, the car is mocked for its design and its price of the equivalent of around six million kroner. On X, one user, who has over a million followers, writes: \"I never thought I'd say this about Ferrari, but this is the ugliest electric car design ever.\" Some compare the design to a toy car and one user writes that \"it looks terrible\". Motor journalist Maths Nilsson at Carup is also surprised by the design. - It is a bold move by Ferrari. That they dare to make it so different.  To develop the design of the new electric car, Ferrari has enlisted the help of former Apple designer Jony Ive, who helped create the iPhone. - It is very different from other Ferrari cars. The question is whether people want to pay six million for it. People on the stock exchange don't seem to think so, says Maths Nilsson. Conspiracy theories spread According to Nilsson, there are even conspiracy theories that Ferrari does not really want to sell the car in any larger volumes. - I felt it immediately - maybe they don't want to sell it. There are no fools who work at Ferrari. You probably ignore a short-term decline in the stock market. Rather, he believes that the car can be important for the brand and to show that Ferrari is keeping up with the transition to electric drive. - It looks good to have an electric car in the range. But so far it has been difficult to sell electric cars in the sports segment. He also points to a fundamental problem for exclusive electric sports cars. - An old Tesla accelerates faster than a Ferrari. Then someone can buy a used electric car that is faster than the Ferrari. It will be difficult to justify the price. Should hum and vibrate And owning a Ferrari is about more than just speed.  - You want it to hum and vibrate. The sound and smell are important. It becomes a little more genderless when it's an electric car, says Maths Nilsson. Ferrari's classic V12-, V8- and V6-m", "title_original": "Ferraris nya elbil hånas – då rasar aktien", "summary_original": "Ferrari tar nu steget in bland elbilarna och presenterade igår Ferrari Luce. När handeln öppnade rasade aktien med över sju procent. I sociala medier hånas bilen för sin design och sitt pris på motsvarande omkring sex miljoner kronor. På X skriver en användaren, som har över en miljon följare: ”Jag trodde aldrig jag skulle säga detta om Ferrari, men det här är den fulaste designen på en elbil någonsin.” Några jämför designen med en leksaksbil och en användare skriver att ”den ser hemsk ut”. Motorjournalisten Maths Nilsson på Carup är också förvånad över designen. – Det är ett djärvt grepp av Ferrari. Att de vågar göra den så annorlunda.  För att ta fram designen på den nya elbilen har Ferrari tagit hjälp av den tidigare Apple-designern Jony Ive, som var med och skapade Iphone. – Den skiljer sig väldigt mycket från andra Ferraribilar. Frågan är om folk vill betala sex miljoner för den. Det verkar inte folk på börsen tycka, säger Maths Nilsson. Konspirationsteorier sprids Enligt Nilsson finns det till och med konspirationsteorier om att Ferrari egentligen inte vill sälja bilen i några större volymer. – Jag kände det direkt – de kanske inte vill sälja den. Det är inga dumskallar som jobbar på Ferrari. Man struntar nog i en kortsiktig nedgång på börsen. Han tror snarare att bilen kan vara viktig för varumärket och för att visa att Ferrari hänger med i omställningen till eldrift. – Det ser bra ut att ha en elbil i sortimentet. Men hittills har det varit svårt att sälja elbilar i sportsegmentet. Han pekar också på ett grundproblem för exklusiva sportbilar med eldrift. – En gammal Tesla accelererar snabbare än en Ferrari. Då kan någon köpa en begagnad elbil som är snabbare än Ferrarin. Det blir svårt att motivera priset. Ska brumma och vibrera Och att äga en Ferrari handlar om mer än bara farten.  – Man vill att den ska brumma och vibrera. Ljudet och lukten är viktiga. Det blir lite mer könlöst när det är en elbil, säger Maths Nilsson. Ferraris klassiska V12-, V8- och V6-motorer är samtidigt en stor del av märkets identitet. – Det är det som är viktigt för Ferrari. Och det är säkert billigare för dem att tillverka också. – Det mest spännande är att de går tillbaka till knappar istället för pekskärmar. Iphone-människorna har förstått att det är lika farligt med pekskärm i bilen som att rattsurfa, säger Maths Nilsson. Bilen ska börja säljas i Europa under 2027.", "link": "https://www.tv4.se/artikel/3mteuL7pomfqclFLs6lU3a/ferraris-nya-elbil-hanas-da-rasar-aktien", "date_display": "2026-05-26", "date_iso": "2026-05-26T11:38:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/bilar", "/elbilar", "/ferrari", "/borsen", "/aktier"]}, {"id": 147, "title": "Perhaps not such a pretty strategy - but it is effective", "summary": "", "title_original": "Kanske inte så vacker strategi – men den är effektiv", "summary_original": "", "link": "https://www.tv4.se/artikel/7crOi9oTSodXHlNz7tJCeE/kanske-inte-sa-vacker-strategi-men-effektiv", "date_display": "2026-05-26", "date_iso": "2026-05-26T11:18:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 148, "title": "Artisan truck delivered narcotics hidden in paint cans", "summary": "A seemingly ordinary tradesman's car was rolling around in the Stockholm area - but beneath the surface was hidden an advanced drug distribution. When Customs swooped in, it was discovered that cannabis resin had been hidden in paint cans, an approach that stands out even in an investigation characterized by sophisticated smuggling methods.  The investigation started after a seizure just over a year ago, when 138 kilos of cannabis resin from Spain were found at a freight terminal in Södertälje. The tracks further led to an extensive network with branches both in Sweden and internationally. The smuggling took place, among other things, in vehicles with advanced cargo compartments, where both cars and trucks were used.  - It was the truck that made us aware of another criminal gang. When the vehicle with the cocaine arrived at a warehouse in Bålsta, the gates were opened by a now 36-year-old man who we soon realized was a leading organizer, says Linnea Schoug, operations leader at the Customs Department's Criminal Division East, in a press release. Paint splatter throughout the car It was, however, the discovery in the craftsman's car that gave the investigation new momentum. The 41-year-old craftsman is suspected of having had the role of warehouse keeper and distributor. According to the investigation, he delivered narcotics to various locations in Stockholm County, while the activity was hidden behind a legitimate job.  The man was arrested when he was going to pay with his mobile phone at the checkout of a grocery store. - A customs official decides to take the mobile phone out of his hand in open mode before he has time to turn it off. While this is happening, the 41-year-old is arrested by several officials, says Linnea Schoug.  During an inspection of the man's company car, customs officers found paint splashes throughout the vehicle. When the paint cans were opened, there were carefully packaged narcotics. In total, over 18 kilos of cannabis were found, also hidden in garbage bags and in a bag marked as plaster.  Six defendants The Swedish Customs Service has been able to uncover a well-organized network with a clear leadership. Assignments must have been conveyed via encrypted apps, where couriers were sent u", "title_original": "Hantverkarbil levererade narkotika gömt i färgburkar", "summary_original": "En till synes vanlig hantverkarbil rullade runt i Stockholmsområdet – men under ytan dolde sig en avancerad narkotikadistribution. När Tullverket slog till upptäcktes att cannabisharts gömts i färgburkar, ett tillvägagångssätt som sticker ut även i en utredning präglad av sofistikerade smugglingsmetoder.  Utredningen startade efter ett beslag för drygt ett år sedan, då 138 kilo cannabisharts från Spanien hittades på en godsterminal i Södertälje. Spåren ledde vidare till ett omfattande nätverk med förgreningar både i Sverige och internationellt. Smugglingen skedde bland annat i fordon med avancerade lönnutrymmen, där både personbilar och lastbilar användes.  – Det var lastbilen som gjorde att vi fick upp ögonen för ett annat kriminellt gäng. När fordonet med kokainet anlände till ett lager i Bålsta öppnades grindarna av en nu 36-årig man som vi rätt snart förstod var en ledande organisatör, berättar Linnea Schoug, insatsledare på Tullverkets kriminalavdelning Öst, i ett pressmeddelande. Färgstänk i hela bilen Det var dock upptäckten i hantverkarbilen som gav utredningen ny fart. Den 41-årige hantverkaren misstänks ha haft rollen som lagerhållare och distributör. Enligt utredningen levererade han narkotika till olika platser i Stockholms län, samtidigt som verksamheten doldes bakom ett legitimt arbete.  Mannen greps när han skulle betala med sin mobil i kassan på en livsmedelsbutik. – En tulltjänsteman beslutar att ta mobilen ur handen på honom i öppet läge innan han hinner stänga av den. Samtidigt som detta sker så grips 41-åringen av flera tjänstemän, säger Linnea Schoug.  Vid en kontroll av mannens firmabil fann tulltjänstemän färgstänk i hela fordonet. När färgburkarna öppnades låg där noggrant förpackad narkotika. Totalt hittades över 18 kilo cannabis, även gömt i sopsäckar och i en påse märkt som gips.  Sex åtalas Tullverket har kunnat avslöja ett välorganiserat nätverk med en tydlig ledning. Uppdrag ska ha förmedlats via krypterade appar, där kurirer skickats ut för att transportera och leverera narkotika.  Myndighetens operation mot narkotikahärvan har resulterat i att omkring 310 kilo cannabis, 116 kilo kokain och drygt 51 kilo amfetamin tagits i beslag till ett beräknat gatuvärde på cirka 168 miljoner kronor.  Nu åtalas sex personer vid Solna tingsrätt, misstänkta för bland annat synnerligen grova narkotikabrott. Totalt har hittills 14 personer dömts i ärendet, till sammanlagt 82 års fängelse.", "link": "https://www.tv4.se/artikel/4x4TkPr8jXKePyv8f9HG7K/hantverkarbil-levererade-narkotika-goemt-i-faergburkar", "date_display": "2026-05-26", "date_iso": "2026-05-26T10:59:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/narkotika", "/grovt-narkotikabrott", "/narkotikabrott", "/narkotikasmuggling", "/tullverket"]}, {"id": 149, "title": "SSAB opens the building - points out dust and viruses", "summary": "It was at the beginning of the year that reports of various cases of illness began to come from the construction site on Svartön in Luleå. Slowly, the number of sick people - with symptoms such as nausea, nosebleeds and headaches - grew more and more, and finally SSAB stopped work completely on April 3. Since then, the company has carried out a large number of different measurements. According to SSAB, however, the controls have not found any concentrations above the applicable limit values, neither in air, gases nor soil beyond what was previously known. Instead, they point to a combination of dust, low humidity and respiratory viruses. We have an exposure to fine-grained dust, well below the limit values ​​set by the Swedish Work Environment Authority. But we also have low humidity, cold and wind in combination with the occurrence of seasonal respiratory viruses during the months in question, says Carl Orrling, technical director at the steel giant. Additional cases It has previously been reported that around 25 workers have fallen ill with various symptoms in connection with earthworks at the site. Mainly it has been about people who drove vehicles, but office workers have also been affected. Since then, a few more cases have become known. To date, 34 people have reported various forms of symptoms. We have been very clear that we encourage everyone to report symptoms of illness, says Carl Orrling. It is a very important part of this work that we, as the client, also stand for openness and transparency. One of the sick workers had toxic gases in his blood, his employer previously told SVT. However, SSAB does not want to comment on individual cases. \"Controlled restart\" The restart of construction will begin in stages starting on Wednesday, in areas not affected by the reported symptoms of the disease. It will be a very controlled restart, says Carl Orrling. In no way do we want to make it appear that we are rushing this restart. But we ensure that everyone who will work in the area receives the necessary information and also good information", "title_original": "SSAB öppnar bygget – pekar ut damm och virus", "summary_original": "Det var i början av året som rapporter om olika sjukdomsfall började komma från byggarbetsplatsen på Svartön i Luleå. Sakta blev antalet sjuka – med symptom som illamående, näsblod och huvudvärk – fler och fler och till slut stoppade SSAB arbetet helt den 3 april. Sedan dess har bolaget genomfört ett stort antal olika mätningar. Enligt SSAB har kontrollerna dock inte hittat några halter över gällande gränsvärden, varken i luft, gaser eller mark utöver vad som tidigare var känt. I stället pekar man på en kombination av damm, låg luftfuktighet och luftvägsvirus. Vi har en exponering mot finkornigt damm, långt under de gränsvärden som är satta av Arbetsmiljöverket. Men vi har också låg luftfuktighet, kyla och vind i kombination med att det förekommit säsongsbetonade luftvägsvirus under de aktuella månaderna, säger Carl Orrling, teknisk direktör på ståljätten. Ytterligare fall Det har tidigare rapporterats om att omkring 25 arbetare har insjuknat med olika symptom i samband med markarbeten på platsen. Främst har det handlat om personer som kört fordon, men även kontorsanställda har drabbats. Sedan dess har ytterligare några fall blivit kända. Till dags datum är det 34 personer som rapporterat in olika former av symptom. Vi har varit väldigt tydliga med att vi uppmuntrar alla att rapportera in sjukdomssymptom, säger Carl Orrling. Det är en väldigt viktig del av det här arbetet att vi som byggherre också står för en öppenhet och transparens. En av de sjuka arbetarna hade giftiga gaser i blodet, har hans arbetsgivare tidigare uppgett för SVT. SSAB vill dock inte kommentera enskilda fall. ”Kontrollerad återstart” Återstarten av bygget inleds stegvis med start på onsdagen, på områden som inte berörts av de rapporterade sjukdomssymptomen. Det blir en väldigt kontrollerad återstart, säger Carl Orrling. Vi vill inte på något sett låta påskina att vi stressar fram den här återstarten. Utan vi säkerställer att alla som ska jobba på området får erforderlig information och även goda instruktioner. Samtidigt jobbar vi också nära de fackliga representanterna.", "link": "https://www.tv4.se/artikel/tt-260526-svarton1-a9b3a95a/ssab-oppnar-bygget-pekar-ut-damm-och-virus", "date_display": "2026-05-26", "date_iso": "2026-05-26T09:30:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sverige", "/sverige", "/lulea", "/norrbotten", "/arbete", "/ssab", "/inrikes", "/arbetsmiljoverket"]}, {"id": 150, "title": "Urban Widholm calls for missing diploma: \"I carry it everywhere\"", "summary": "The award-winning zealot recently lost his diploma during a trip • \"It is of immense importance for the fundraising for Ukraine.\"", "title_original": "Urban Widholm efterlyser försvunnet diplom: ”Jag har med det överallt”", "summary_original": "Den prisbelönta eldsjälen tappade nyligen sitt diplom under en resa • ”Det har en oerhörd betydelse för insamlingen till Ukraina.”", "link": "https://www.dagen.se/livsstil/urban-widholm-efterlyser-foersvunnet-diplom-jag-har-med-det-oeverallt/10363583", "date_display": "2026-05-26", "date_iso": "2026-05-26T09:03:50+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "School bus hit by train in Belgium - pupils and staff dead", "summary": "A train has crashed straight into a school bus in Belgium, about a kilometer from the Buggenholt train station.  - The train was therefore already braking. The train driver applied the emergency brakes but was unable to avoid a collision, says Thomas Baeken from the country's train operator Infrabel to VRT News. Four people – two high school students, the bus driver and a teacher – have died, writes Reuters. All subjects came from a special education school. The children were 12 and 15 years old, the teacher 27 and the driver 49. - We are not yet releasing any information about the victims, says An Berger at the police to VRT. Drove out despite barriers The school bus is said to have driven onto the railway tracks despite the barriers being down and the traffic lights shining red. Why and how the bus ended up on the track will now be investigated. VRT News states that there were a total of seven school children, a teacher and a driver on the school bus, which is of a smaller variety.  There were around 100 passengers on the train who were evacuated by the emergency services, none of them were physically injured.  \"Everything happened in a few seconds,\" says one of the passengers to HLN. \"Today, Europe mourns\" Condolences are coming from several quarters after the accident. European Commission President Ursula von der Leyen says she is devastated. \"My deepest condolences go to the families of the victims and their loved ones. Today, Europe mourns with Belgium,\" she writes on X.", "title_original": "Skolbuss påkörd av tåg i Belgien – elever och personal döda", "summary_original": "Ett tåg har kraschat rakt in i en skolbuss i Belgien, omkring en kilometer från tågstationen Buggenholt.  – Tåget höll därför redan på att bromsa. Lokföraren nödbromsade men lyckades inte undvika en kollision, säger Thomas Baeken från landets tågoperatör Infrabel till VRT News. Fyra personer – två gymnasieelever, busschauffören och en pedagog – har dött, skriver Reuters. Alla personer kom från en specialpedagogisk skola. Barnen var 12 och 15 år gamla, pedagogen 27 år och chauffören 49. – Vi släpper ännu ingen information om offren, säger An Berger vid polisen till VRT. Körde ut trots bommar Skolbussen ska ha kört ut på järnvägsspåren trots att bommarna var nere och trafikljusen lyste rött. Varför och hur bussen kom ut på spåret ska nu utredas. VRT News uppger att det befann sig totalt sju skolbarn, en pedagog och en förare på skolbussen, som är av en mindre variant.  På tåget befann sig omkring 100 passagerare som evakuerades av räddningstjänsten, ingen av dem kom till fysisk skada.  ”Allt hände på några sekunder”, säger en av passagerarna till HLN. ”I dag sörjer Europa” Kondoleanser kommer från flera håll efter olyckan. EU-kommissionens ordförande Ursula von der Leyen säger att hon är förkrossad. ”Mina djupaste kondoleanser går till offrens familjer och deras nära och kära. I dag sörjer Europa med Belgien”, skriver hon på X.", "link": "https://www.tv4.se/artikel/6MY2U58BfGS4T82WyWqxvs/skolbuss-pakoerd-av-tag-i-belgien-flera-uppges-doeda", "date_display": "2026-05-26", "date_iso": "2026-05-26T08:33:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/belgien"]}, {"id": 152, "title": "Dangerous child car seats are pointed out in a major test: \"Terrible\"", "summary": "Some models pass the crash tests very well, while others fail both in crash protection and in terms of unwanted chemicals. Of particular concern is that new substandard models continue to appear - often generic products from China sold under several different names. - We have been testing car seats for 25 plus years and almost every year we find bad models. It is very strange that the industry is not getting better, says Ronny Karlsson, test manager Råd & Rön.  Warning for life-threatening baby restraints In this year's test, a special warning was issued for the Kinderkraft baby restraint, which performed so poorly that a warning expired even before the results were published. In the crash test, the chair detached from its base. This means that the child risks coming loose and being thrown freely into the car, with a high risk of serious injuries. - When it looks like this in our crash test, then we can't wait. Then we have to go out earlier. It's terrible, says Ronny Karlsson. Also last autumn, Råd & Rön warned that the Reecle 360 ​​combi chair came off completely in crash tests. The new test shows that the same chair is still sold, but under different names - and is judged to be just as dangerous. Worst in test Kinderkraft Mink Pro 2 is the worst among baby restraints. Even in the car seat category there are models with serious flaws. There, a Maxi-Cosi seat ends up in last place, due to weak protection in frontal collisions and high levels of PFAS chemicals. - The crash test is the most important. At the same time, many children spend many hours in the chairs. Then we don't want them to contribute to the chemical cocktail that the children are exposed to, says Ronny Karlsson. When the child has outgrown the rear-facing seat, the next step is usually a booster seat, or a booster cushion. Here, Karlsson emphasizes that a booster seat provides much better protection.  In this year's test, a Thule chair, the Palm model, received the lowest rating in that category.  - It is worse but not warning level in any way, says Ronny Karlsson and continues: - I understand that it can be problematic to come up with e", "title_original": "Farliga bilbarnstolar pekas ut i stort test: ”Fruktansvärt”", "summary_original": "Vissa modeller klarar krockproven mycket bra, medan andra brister både i krockskyddet och i fråga om oönskade kemikalier. Särskilt oroande är att nya undermåliga modeller fortsätter att dyka upp – ofta generiska produkter från Kina som säljs under flera olika namn. – Vi har testat bilbarnstolar i 25 plus år och nästan varenda år så hittar vi dåliga modeller. Det är jättemärkligt att branschen inte blir bättre, säger Ronny Karlsson, testchef Råd & Rön.  Varning för livsfarligt babyskydd I årets test varnar man särskilt för babyskyddet Kinderkraft, som presterade så dåligt att en varning gick ut redan innan resultaten publicerades. I krocktestet lossnade stolen från sin bas. Det innebär att barnet riskerar att komma loss och kastas fritt i bilen, med hög risk för allvarliga skador. – När det ser ut så här i vårt krocktest, då kan vi inte vänta. Då måste vi gå ut tidigare. Det är fruktansvärt, säger Ronny Karlsson. Även i höstas varnade Råd & Rön för att kombistolen Reecle 360 lossnade helt i krocktester. I det nya testet framgår att samma stol fortfarande säljs, men under andra namn – och bedöms vara lika farlig. Sämst i test Sämst bland babyskydd är alltså Kinderkraft Mink Pro 2. Även i kategorin bilbarnstolar finns modeller med allvarliga brister. Där hamnar en Maxi-Cosi-stol på sista plats, på grund av svagt skydd i frontalkrock samt höga halter av PFAS-kemikalier. – Krocktesten är det viktigaste. Samtidigt är det många barn som tillbringar många timmar i stolarna. Då vill vi inte att de ska bidra till kemikaliecocktailen som barnen utsätts för, säger Ronny Karlsson. När barnet vuxit ur den bakåtvända stolen är nästa steg vanligtvis bältesstol, eller en bälteskudde. Här understryker Karlsson att en bältesstol ger ett mycket bättre skydd.  I årets test fick en Thule-stol, modellen Palm, lägst betyg i den kategorin.  – Den är sämre men inte varningsnivå på något sätt, säger Ronny Karlsson och fortsätter: – Jag förstår ju att det kan vara problematiskt att komma med en tolvåring sittande i en bältesstol till skolan. Men det är värt det, jag lovar. OBS! Grafiken i klippet innehåller ett fel. Bilderna på babyskydden har förväxlats. Här ovan är den korrekta. Hela testet finns på Råd & Rön.", "link": "https://www.tv4.se/artikel/3365QZyqraLV5IoEFRmAFg/stort-test-varnar-flera-farliga-bilbarnstolar", "date_display": "2026-05-26", "date_iso": "2026-05-26T05:51:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/rad-ron", "/sakerhet", "/barn", "/bilar", "/bilolycka"]}, {"id": 153, "title": "The GES children remake the classic WC song", "summary": "Simon Strömstedt has teamed up with Kid Eriksson and his band Tjuvjakt - as well as Julia Glenmark Bolund for this year's soccer World Cup. On Friday, they release the new version of \"When we dig gold in the USA\", with newly written rap verses by Tjuvjakt's Jesper Swärd and Arvid Lundquist. When Sweden secured the WC spot on March 31, Simon Strömstedt and Kid Eriksson had the same idea. I spoke to Simon immediately afterwards and he said exactly the same thing. There was a lot of back and forth, but then we drove, says Kid Eriksson. \"The legacy\" For Simon Strömstedt and Kid Eriksson, it was important that Julia Glenmark be included, even though she is not a singer, but a nurse. If \"the legacy\" is to be perfected, Julia must be there and I know she can sing, says Simon Strömstedt. \"When we dig for gold in the USA\" became a classic that was sung by 50,000 in Rålambshovsparken when the WC team was received in Stockholm after the WC bronze 32 years ago. Now the children are as old as Anders Glenmark, Thomas \"Orup\" Eriksson and Niklas Strömstedt were then - and the fathers can also be heard on the new song. The old choir parts have been mixed into the new version. We made a boy band with our dads when they were the same age as we are now. It's like an episode of \"Black mirror\", says Kid Eriksson, shaking his head. But there is already an official World Cup song \"Live forever\" by Thomas Stenström, so the GES children had to call the Football Association's hand when they wanted help. They have dissed us. We tried to get some national team jerseys. But it was over. We say we are the official unofficial World Cup song, says Kid Eriksson. \"Come to Rålis!\" He believes both songs can find their audience. Thomas' song has a feeling that I really understand. It's just that it doesn't deliver the feeling that many people want, this exciting feeling. I believe and hope that our song might be able to provide that. Kid Eriksson and Simon Strömstedt say that the GES fathers have supported the process. Anders Glenmark even has a comma", "title_original": "GES-barnen gör om klassiska VM-låten", "summary_original": "Simon Strömstedt har slagit sig ihop med Kid Eriksson och hans band Tjuvjakt – samt Julia Glenmark Bolund inför årets fotbolls-VM. På fredag släpper de den nya versionen av ”När vi gräver guld i USA”, med nyskrivna rapverser av Tjuvjakts Jesper Swärd och Arvid Lundquist. När Sverige säkrade VM-platsen den 31 mars fick Simon Strömstedt och Kid Eriksson samma idé. Jag pratade med Simon direkt efteråt och han sade exakt samma sak. Det var mycket fram och tillbaka, men sedan körde vi, säger Kid Eriksson. ”The legacy” För Simon Strömstedt och Kid Eriksson var det viktigt att Julia Glenmark skulle vara med, fastän hon inte är sångerska, utan sjuksköterska. Om ”the legacy” ska bli fulländad så måste ju Julia vara med och jag vet att hon kan sjunga, säger Simon Strömstedt. ”När vi gräver guld i USA” blev en klassiker som sjöngs av 50 000 i Rålambshovsparken när VM-laget togs emot i Stockholm efter VM-bronset för 32 år sedan. Nu är barnen lika gamla som Anders Glenmark, Thomas ”Orup ”Eriksson och Niklas Strömstedt var då – och papporna hörs även på den nya låten. De gamla körstämmorna har mixats in i den nya versionen. Vi har gjort ett pojkband med våra pappor när de var lika gamla som vi är nu. Det är som ett avsnitt av ”Black mirror\", säger Kid Eriksson och skakar på huvudet. Men det finns ju redan en officiell VM-låt ”Leva för alltid” av Thomas Stenström, så GES-barnen fick kalla handen av Fotbollförbundet när de ville ha hjälp. De har dissat oss. Vi försökte få fram lite landslagströjor. Men det var kört. Vi säger att vi är den officiella inofficiella VM-låten, säger Kid Eriksson. ”Kom till Rålis!” Han tror att båda låtarna kan hitta sin publik. Thomas låt har en känsla som jag verkligen förstår. Det är bara att det att den inte klaffar med den känslan som många vill ha, just den här peppande känslan. Jag tror och hoppas att vår låt kanske kan ge det. Kid Eriksson och Simon Strömstedt berättar att GES-papporna har stöttat processen. Anders Glenmark har till och med kommit med råd om produktionen. Trion gjorde en avskedskonsert 2022, men kanske kan de tvingas upp på scenen igen, tror Kid Eriksson. Jag respekterar förstås att de inte vill köra igen, men om vi får ett brons i år då får de fan komma till ”Rålis”! Den nya versionen släpps på fredag.", "link": "https://www.tv4.se/artikel/tt-260526-graverguld1-59c22027/ges-barnen-slapper-egen-nar-vi-graver-guld-i-usa", "date_display": "2026-05-26", "date_iso": "2026-05-26T05:37:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/personer/anders", "/musik", "/usa", "/stockholm", "/sverige", "/konst", "/svenska-fotbollforbundet", "/kultur", "/personer/niklas-stromstedt"]}, {"id": 154, "title": "Julia's electricity grid fee has gone up almost 50 percent: \"Unfair\"", "summary": "Electricity grid fees have increased more in municipalities where the electricity grid companies have introduced impact fees. This is shown in this year's Nils Holgersson report on electricity consumption in the country. The municipality with the largest increase is Mölndal. There, the electricity grid fee has increased by 46.8 percent since last year, which can be compared with the national average of 8 percent. - They think that the costs should be the same throughout Sweden. It's what you think is generally fair, says Mölndal resident Jan Ambren to TV4 Nyheterna. The government scrapped requirements Power charges mean that customers who use a lot of electricity at the same time also pay more. In this way, it should discourage customers from, for example, using several household appliances at the same time. In municipalities where the system has been introduced, the average electricity grid fee has increased by 11.3 percent, compared to 5.4 percent in municipalities without an impact fee. Power charges were to be introduced throughout the country from 1 January 2027, but in March this year the government chose to scrap that requirement. \"Unfair\" Despite that, some electricity grid companies have chosen to keep the power charges, including Mölndal Energi, which manages the electricity grid in Mölndal. It sticks in the eyes of the residents. - Unfair is what I feel. The municipalities that implemented this the fastest will suffer, says Julia Persdotter.  - It feels boring and I also think it is strange with this effect fee. They say you don't need it anymore, but still the electricity companies don't have to remove it, says Kajsa Rådevik. Mölndal Energi declines an interview, but writes in an email that their customers who were included in the survey had a relatively low fee previously and therefore the increase looks large in percentage terms.", "title_original": "Julias elnätsavgift har gått upp nästan 50 procent: ”Orättvist”", "summary_original": "Elnätsavgifterna har ökat mer i kommuner där elnätsbolagen infört effektavgifter. Det visar årets Nils Holgersson-rapport över elförbrukningen i landet. Kommunen med den största ökningen är Mölndal. Där har elnätsavgiften ökat med 46,8 procent sedan förra året, vilket kan jämföras med rikets snitt på 8 procent. – Man tycker ju att det ska vara samma kostnader över hela Sverige. Det är det som man tycker är allmänt rättvist, säger Mölndalsbon Jan Ambren till TV4 Nyheterna. Regeringen slopade krav Effektavgifter innebär att kunder som använder mycket el på en och samma gång också betalar mer. På så sätt ska det avskräcka kunder från att exempelvis använda flera hushållsapparater samtidigt. I kommuner där systemet har införts har den genomsnittliga elnätsavgiften ökat med 11,3 procent, jämfört med 5,4 procent i kommuner utan effektavgift. Effektavgifter skulle införas i hela landet från 1 januari 2027, men i mars i år valde regeringen att slopa det kravet. ”Orättvist” Trots det har en del elnätsbolag valt att behålla effektavgifterna, däribland Mölndal Energi som förvaltar elnätet i Mölndal. Det sticker i ögonen på invånarna. – Orättvist är väl det som jag känner. De kommunerna som implementerade det här snabbast blir lidande, säger Julia Persdotter.  – Det känns tråkigt och jag tycker det är konstigt också med den här effektavgiften. Man säger att man inte behöver ha den längre, men ändå behöver inte elbolagen ta bort den, säger Kajsa Rådevik. Mölndal Energi avböjer intervju, men skriver i ett mejl att deras kunder som ingick i undersökningen hade en relativt låg avgift tidigare och därför ser höjningen stor ut procentuellt.", "link": "https://www.tv4.se/artikel/2hRZAUhQPL1mBj5ahrLh4M/elnaetsavgiften-upp-naestan-50-procent-oraettvist", "date_display": "2026-05-26", "date_iso": "2026-05-26T04:46:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/elnatsavgifter", "/elmarknaden", "/ekonomi/elpriset"]}, {"id": 155, "title": "Principal Linnea does not want to avoid questions that create conflict", "summary": "Lovisa Bergdahl has read What I talk about when I talk about the school by Linnea Lindquist", "title_original": "Rektor Linnea vill inte undvika frågor som skapar konflikt", "summary_original": "Lovisa Bergdahl har läst Vad jag pratar om när jag pratar om skolan av Linnea Lindquist", "link": "https://www.dagen.se/kultur/rektor-linnea-vill-inte-undvika-fragor-som-skapar-konflikt/10231737", "date_display": "2026-05-26", "date_iso": "2026-05-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Stefan Swärd: \"Has now left 42 years of involvement in EFK\"", "summary": "The EFK profile deeply disappointed after the congressional decision on same-sex relationships", "title_original": "Stefan Swärd: ”Har nu lämnat 42 års engagemang inom EFK”", "summary_original": "EFK-profilen djupt besviken efter kongressbeslutet om samkönade relationer", "link": "https://www.dagen.se/nyheter/stefan-swaerd-har-nu-laemnat-42-ars-engagemang-inom-efk/10362665", "date_display": "2026-05-26", "date_iso": "2026-05-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "1,800 Pentecostal congregations in Ukraine are to use the Swedish pastoral care book", "summary": "Otto and Lena Rimå's book has just been translated and will now be distributed in the country.", "title_original": "1 800 pingstförsamlingar i Ukraina ska använda svensk själavårdsbok", "summary_original": "Otto och Lena Rimås bok har precis översatts och ska nu spridas i landet.", "link": "https://www.dagen.se/nyheter/1-800-pingstfoersamlingar-i-ukraina-ska-anvaenda-svensk-sjaelavardsbok/10355923", "date_display": "2026-05-26", "date_iso": "2026-05-26T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The school group in Gothenburg was right - despite the \"establishment of God's kingdom\" in the statutes", "summary": "Brandström's school gets the right to take over a Christian preschool despite an earlier refusal from Gothenburg's politicians - who saw the excessively Christian statutes.", "title_original": "Skolkoncern i Göteborg fick rätt – trots ”upprättandet av Guds rike” i stadgarna", "summary_original": "Brandströmska skolan får rätt att ta över en kristen förskola trots ett tidigare nej från Göteborgs politiker – s isplay": "2026-05-20", "date_iso": "2026-05-20T10:07:35+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "7 days old", "tags": ["Opinion piece", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}, {"id": 179, "title": "Chance to share SEK 61 million", "summary": "Three times a year it's Granny. This is when a postal code wins a large sum of money which is distributed among all neighbors who have one or more lottery tickets. But not everyone knows that the Postal Code Lottery also organizes a Sommaryra that works in the same way. This year, SEK 61 million will be drawn in a winning postcode and postcode.  I look forward to celebrating the Sommaryran winner. We charge for folk festival, music, cheers and prize checks. Come and celebrate with us, says Rickard Sjöberg, program manager.  Buy a Postcode Lottery The Postcode Lottery's Summer Festival is being organized for the fifth time this year and, as usual, it will be a festive event with musical entertainment, TV recording and fun for young and old. For a chance to win, you need to buy a Postcode Lottery no later than the end of May.  But we start by backing the tape to 2024. Then Sommaryran landed in Vara. The prize pool was SEK 48 million and eleven neighbors could call themselves millionaires when the evening was over.  I want to renovate the barn roof, said Anders, who won over five million kroner.  As company on stage, he had his father Lennart and mother Gunnel. Together, mother and son won over eight million kroner. Now we can take children and grandchildren on a wonderful trip, she said.  During the audience's cheers, Jessica also stepped onto the stage. She won over three million kroner.  How does it feel? asked Rickard Sjöberg.  It feels very good, now I just want to live well, she said.  Last year Sommaryran went to Johanneshov and the result was 19 new millionaires. Sofia received one of the evening's biggest checks of just over SEK 2.8 million. Together with her family, she looked forward to traveling and buying a summer cottage.  We would like to buy a summer house, she said.  Buy a Postcode Lottery Over a million Swedes participate in the Postcode Lottery - for three simple reasons: Chance to win money, cars or products.   Win with your neighbors: Shared joy is double joy.  Contribute to a better world: Over a billion to charity every year.  Age limit 18 years. Stödli", "title_original": "Chans att dela på 61 miljoner kronor", "summary_original": "Tre gånger om året är det Grannyra. Det är då ett postnummer vinner en stor summa pengar som fördelas mellan alla grannar som har en, eller flera lotter. Men det är inte alla som vet att Postkodlotteriet även anordnar en Sommaryra som fungerar på samma sätt. I år ska 61 miljoner kronor lottas ut i ett vinnande postnummer och postkod.  Jag ser fram emot att fira Sommaryrans vinnare. Vi laddar för folkfest, musik, jubel och vinstcheckar. Kom och fira med oss, säger Rickard Sjöberg, programledare.  Köp en Postkodlott Postkodlotteriets Sommaryra arrangeras för femte gången i år och i sedvanlig ordning blir det ett festligt evenemang med musikunderhållning, TV-inspelning och roligheter för stora och små. För chans att vinna behöver du köpa en Postkodlott senast sista maj.  Men vi börjar med att backa bandet till 2024. Då landade Sommaryran i Vara. Vinstpotten låg på 48 miljoner kronor och elva grannar kunde kalla sig för miljonärer när kvällens var slut.  Jag vill renovera ladugårdstaket, sa Anders som vann över fem miljoner kronor.  Som sällskap på scenen hade han sin pappa Lennart och mamma Gunnel. Tillsammans vann mor och son över åtta miljoner kronor. Nu kan vi ta med barn och barnbarn på en härlig resa, sa hon.  Under publikens jubel klev även Jessica upp på scenen. Hon vann över tre miljoner kronor.  Hur känns det? frågade Rickard Sjöberg.  Det känns väldigt br   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
