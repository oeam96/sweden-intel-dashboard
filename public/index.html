trump/", "date_display": "2026-04-26", "date_iso": "2026-04-26T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "Highest oil price since the beginning of April", "summary": "The price of crude oil is rising on the world market. Canceled peace talks between the US and Iran and a raised price forecast from Goldman Sachs push the price to the highest level in almost three weeks.", "title_original": "Högsta oljepriset sedan början av april", "summary_original": "Priset på råolja lyfter på världsmarknaden. Inställda fredssamtal mellan USA och Iran och en höjd prisprognos från Goldman Sachs pressar upp priset till den högsta nivån på nästan tre veckor.", "link": "https://www.svd.se/a/m0M80q/ny-uppgang-av-oljepriset", "date_display": "2026-04-26", "date_iso": "2026-04-26T22:49:33+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 109, "title": "The TV profile's trick to quit smoking: push-ups", "summary": "The heart attack became the motivation to continue training. Ahmed Berhan, 41, gets boarded by 15-year-olds at the gym, but porridge and skipping rope are his secret weapons.", "title_original": "Tv-profilens trick för att sluta röka: armhävningar", "summary_original": "Hjärtinfarkten blev motivationen att fortsätta träningen. Ahmed Berhan, 41, blir brädad av 15-åringar på gymmet, men gröt och hopprep är hans hemliga vapen.", "link": "https://www.svd.se/a/OkkpLA/tv-profilens-trick-for-att-sluta-roka-armhavningar", "date_display": "2026-04-26", "date_iso": "2026-04-26T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 110, "title": "Tame Impala try their hand at the arena rock format - it goes like this", "summary": "The highs are soaring - but the lows are deep when Tame Impala play to a packed Avicii arena. The former indie darling tries his hand at the arena rock format - that's how it goes. The sharp swings between euphoria and idleness make the unnecessarily long concert uneven, DN's Mattias Dahlström thinks.", "title_original": "Tame Impala försöker sig på arenarock-formatet – det går sådär", "summary_original": "Höjdpunkterna är skyhöga – men dalarna är djupa när Tame Impala spelar inför ett fullsatt Avicii arena. Den tidigare indieälsklingen försöker sig på arenarock-formatet – det går sådär. De tvära kasten mellan eufori och tomgång gör den onödigt långa konserten ojämn, tycker DN:s Mattias Dahlström.", "link": "https://www.dn.se/kultur/tame-impala-forsoker-sig-pa-arenarock-formatet-det-gar-sadar/", "date_display": "2026-04-26", "date_iso": "2026-04-26T22:11:14+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Arrested for assault in relationship", "summary": "A 40-year-old man in Perstorp was arrested on Sunday, suspected of assaulting a person with whom he has a relationship.", "title_original": "Gripen för misshandel i relation", "summary_original": "En 40-årig man i Perstorp greps under söndagen, misstänkt för misshandel av en person som han har en relation till.", "link": "https://www.hd.se/perstorp/gripen-for-misshandel-i-relation/", "date_display": "2026-04-26", "date_iso": "2026-04-26T21:28:28+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Strange Manifesto: \"Friendly Federal Killer\"", "summary": "The designated shooter calls himself the \"friendly federal killer\" in a manifesto. Here is the 31-year-old from California who is suspected of the assassination attempt against Donald Trump at a gala dinner in Washington DC.", "title_original": "Märkliga manifestet: ”Vänlige federala mördaren”", "summary_original": "Den utpekade skytten kallar sig själv för den ”vänlige federala mördaren” i ett manifest. Här är 31-åringen från Kalifornien som misstänks för attentatsförsöket mot Donald Trump vid en galamiddag i Washington DC.", "link": "https://www.hd.se/varlden/skrev-hatiskt-manifest-vanlige-federala-mordaren/", "date_display": "2026-04-26", "date_iso": "2026-04-26T21:05:42+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Supercomputer from the 17th century can be sold for a record price", "summary": "An astrolabe, or \"17th century smartphone\", is to be auctioned at Sotheby's in London. The price tag for the instrument that determined time and direction can end up at up to SEK 33 million.", "title_original": "Superdator från 1600-talet kan säljas för rekordpris", "summary_original": "Ett astrolabium, eller ”1600-talets smartphone”, ska auktioneras ut på Sotheby's i London. Prislappen för instrumentet som bestämde tid och riktning, kan hamna på upp till 33 miljoner kronor.", "link": "https://www.dn.se/varlden/superdator-fran-1600-talet-kan-saljas-for-rekordpris/", "date_display": "2026-04-26", "date_iso": "2026-04-26T20:56:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Podcaster may have solved Roxanne's murder - after 44 years", "summary": "In 1982, 16-year-old Roxanne Sharp was found dead in a wooded area in Covington, USA. She had been raped and murdered, and the body had been dumped at the site. Lack of evidence and few witness statements meant that the police never succeeded in linking anyone to the murder. The breakthrough came only in 2023, when investigators reopened the case, held new interviews and were able to send the DNA found at the scene for analysis.  In 2025, the podcast \"Who Killed Roxanne\" was released, which went through the case. A tip number was also linked to the podcast, which led to new information and new witness information.  Four men arrested Last week, four men, all over 60, were arrested. Two of them were already in prison for other crimes, while one was arrested in Ohio and one at his home in Covington. All of them come from Covington and are said to have had connections with each other in 1982. They are suspected of aggravated rape and murder. The podcast was crucial A police officer who worked on the case said during a press conference that there was a \"culture built on fear\" in the city, which made the investigation difficult. He also highlighted the importance of the podcast for the investigation. - It played a decisive role in giving us the information we needed. \"Cold cases don't solve themselves\" Even though so many years have passed since Roxanne Sharp was murdered, the police have continued to work to find the culprits. \"This case is a clear example of what persistence, cooperation and technological advances in investigative work can achieve,\" said prosecutor Collin Sims in a statement.  \"For over four decades, the victim and her family have waited for answers. Today's arrests demonstrate our unwavering commitment to justice.\" Covington Police Chief Michael Ferrell said during a press conference that \"cold cases don't solve themselves.\" - They are cleared because people show up, year after year, and refuse to give up. That's exactly what our authorities have done - and today Roxanne and her family have finally received the justice they've been waiting for.", "title_original": "Poddare kan ha löst mordet på Roxanne – efter 44 år", "summary_original": "1982 hittades 16-åriga Roxanne Sharp död i ett skogsområde i Covington, USA. Hon hade blivit våldtagen och mördad, och kroppen hade dumpats på platsen. Brist på bevis och få vittnesuppgifter gjorde att polisen aldrig lyckades knyta någon till mordet. Genombrottet kom först 2023, när utredare tog upp fallet på nytt, höll nya förhör och kunde skicka den DNA som fanns på platsen för analys.  2025 släpptes podcasten ”Who Killed Roxanne”, som gick igenom fallet. Till podcasten kopplades också ett tipsnummer, vilket ledde till ny information och nya vittnesuppgifter.  Fyra män gripna I förra veckan greps fyra män, alla över 60 år. Två av dem satt redan i fängelse för andra brott, medan en greps i Ohio och en i sitt hem i Covington. Samtliga kommer från Covington och ska ha haft kopplingar till varandra 1982. De misstänks för grov våldtäkt och mord. Podcasten var avgörande En polis som arbetat med fallet sa under en presskonferens att det funnits en ”kultur byggd på rädsla” i staden, vilket försvårat utredningen. Han lyfte också podcastens betydelse för utredningen. – Den spelade en avgörande roll för att ge oss den information vi behövde. ”Cold cases löser inte sig själva” Trots att det gått så många år sedan Roxanne Sharp mördades har polisen fortsatt att arbeta med att hitta de skyldiga. ”Det här fallet är ett tydligt exempel på vad uthållighet, samarbete och tekniska framsteg i utredningsarbetet kan åstadkomma”, säger åklagaren Collin Sims i ett uttalande.  ”I över fyra decennier har offret och hennes familj väntat på svar. Dagens gripanden visar vårt orubbliga engagemang för att skipa rättvisa.” Covingtons polischef Michael Ferrell sa under en presskonferens att ”cold cases inte löser sig själva”. – De klaras upp för att människor dyker upp, år efter år, och vägrar ge upp. Det är precis vad våra myndigheter har gjort – och i dag har Roxanne och hennes familj till slut fått den rättvisa de väntat så länge på.", "link": "https://www.tv4.se/artikel/5BPcn5pXzhUt3ctCYkRk4p/poddare-kan-ha-loest-mordet-pa-roxanne-efter-44-ar", "date_display": "2026-04-26", "date_iso": "2026-04-26T20:15:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/brott-och-straff", "/roxanne-sharp", "/louisiana", "/mord", "/valdtakt", "/usa"]}, {"id": 115, "title": "New Donald Duck record: SEK 150,600", "summary": "A copy of the first issue of \"Kalle Anka & C:o\" from 1948 has been sold on Tradera. The price? SEK 150,600.", "title_original": "Nytt Kalle Anka-rekord: 150 600 kronor", "summary_original": "Ett exemplar av första numret av ”Kalle Anka & C:o” från 1948 har sålts på Tradera. Priset? 150 600 kronor.", "link": "https://www.hd.se/noje/nytt-kalle-anka-rekord-150-600-kronor/", "date_display": "2026-04-26", "date_iso": "2026-04-26T20:07:41+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Wave of kidnappings sweeps France", "summary": "A wave of kidnappings sweeps France. The goal: to get hold of cryptocurrency. The development is linked to an employee of the French tax authority who is suspected of having sold on information to criminals.", "title_original": "Våg av kidnappningar sveper över Frankrike", "summary_original": "En våg av kidnappningar sveper över Frankrike. Målet: att få tag på kryptovaluta. Utvecklingen kopplas till en anställd på den franska skattemyndigheten som misstänks ha sålt vidare information till kriminella.", "link": "https://www.svd.se/a/6qPPpW/vag-av-krypto-kidnappningar-sveper-over-frankrike", "date_display": "2026-04-26", "date_iso": "2026-04-26T20:01:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 117, "title": "The largest military exercise in several years in Sweden", "summary": "Military convoys, planes and ships can be seen in parts of the country when Aurora 26 gets under way on Monday. Above all, traffic can be affected in southern Sweden and on Gotland.", "title_original": "Största militärövningen på flera år i Sverige", "summary_original": "Militära kolonner, flyg och fartyg kan märkas i delar av landet när Aurora 26 drar i gång på måndag. Framför allt kan trafiken påverkas i södra Sverige och på Gotland.", "link": "https://www.svd.se/a/oEMvlV/aurora-26-sa-paverkas-trafiken-av-militarovningen", "date_display": "2026-04-26", "date_iso": "2026-04-26T20:01:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 118, "title": "Björn af Kleen: Is the 31-year-old one of the ranks of \"disturbingly normal\" political perpetrators of violence?", "summary": "NEW YORK. Everything at the White House Correspondents' Dinner in Washington was extraordinary. Except for the 31-year-old suspect who fired the shots. He appears eerily normal.", "title_original": "Björn af Kleen: Är 31-åringen en i raden av ”oroande normala” politiska våldsverkare?", "summary_original": "NEW YORK. Allt på Vita husets korrespondentmiddag i Washington var extraordinärt. Förutom den misstänkte 31-åringen som avlossade skotten. Han framstår som kusligt normal.", "link": "https://www.dn.se/varlden/bjorn-af-kleen-ar-31-aringen-en-i-raden-av-oroande-normala-politiska-valdsverkare/", "date_display": "2026-04-26", "date_iso": "2026-04-26T19:46:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "This has happened: The shooting during the gala dinner", "summary": "A man armed with several weapons tried to enter a gala dinner in Washington DC where President Donald Trump was in attendance. Here is the event in brief.", "title_original": "Detta har hänt: Skottlossningen under galamiddagen", "summary_original": "En man beväpnad med flera vapen försökte ta sig in på en galamiddag i Washington DC där president Donald Trump närvarade. Här är händelsen i korthet.", "link": "https://www.dn.se/varlden/detta-har-hant-skottlossningen-under-galamiddagen/", "date_display": "2026-04-26", "date_iso": "2026-04-26T19:45:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "This is what we know about the suspected shooter's manifesto", "summary": "The man suspected of shooting at the Washington Hilton has written a manifesto. There, the 31-year-old mocks the hotel's security and says that no one reacted when he entered \"with several weapons\", reports Reuters.", "title_original": "Detta vet vi om misstänkta skyttens manifest", "summary_original": "Mannen som misstänkts för skotten på Washington Hilton har skrivit ett manifest. Där hånar 31-åringen hotellets säkerhet och säger att ingen reagerade på när han gick in ”med flera vapen”, rapporterar Reuters.", "link": "https://www.dn.se/varlden/detta-vet-vi-om-misstankta-skyttens-manifest/", "date_display": "2026-04-26", "date_iso": "2026-04-26T19:36:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Trump's dilemma - according to an expert: No time to get caught up in the attack", "summary": "Atarodi: The clock continues to tick in Iran • \"Must not become a secondary issue\"", "title_original": "Trumps dilemma – enligt expert: Inte tid att fastna i attentatet", "summary_original": "Atarodi: Klockan fortsätter ticka i Iran • ”Får inte bli en underordnad fråga”", "link": "https://www.tv4.se/artikel/15kezmWyY8C9ql7F5jxF4F/trumps-dilemma-enligt-expert-inte-tid-att-fastna-i-attentatet", "date_display": "2026-04-26", "date_iso": "2026-04-26T19:35:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 122, "title": "Two sharp objects in central Gothenburg", "summary": "A large police operation took place for several hours at the central station in Gothenburg on Sunday evening, where two sharp objects were found. Two people under 18 have been arrested, the Public Prosecutor's Office announces.", "title_original": "Två skarpa föremål i centrala Göteborg", "summary_original": "En stor polisinsats pågick under flera timmar vid centralstationen i Göteborg på söndagskvällen, där två skarpa föremål hittades. Två personer under 18 har anhållits, meddelar Åklagarmyndigheten.", "link": "https://www.svd.se/a/M75PV0/insats-i-centrala-goteborg-omrade-avsparrat", "date_display": "2026-04-26", "date_iso": "2026-04-26T19:05:41+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 123, "title": "The Helsingborger was at the Trump dinner when the shots were fired: \"Like in a movie\"", "summary": "Elina Devini from Helsingborg was at a gala dinner with Trump in Washington last night when an outsider entered the building and opened fire.  - It could have ended so badly, she says.", "title_original": "Helsingborgaren var på Trump-middagen när skotten avfyrades: ”Som i en film”", "summary_original": "Elina Devini från Helsingborg befann sig på galamiddag med Trump i Washington i natt när en utomstående tog sig in i byggnaden och öppnade eld.  – Det hade kunnat sluta så illa, säger hon.", "link": "https://www.hd.se/helsingborg/helsingborgaren-var-pa-trump-middagen-nar-skotten-avfyrades-som-i-en-film/", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:57:15+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Two sharp objects in central Gothenburg - girls arrested", "summary": "A police operation was underway at Nordstan in central Gothenburg during Sunday evening. - There we have made a larger cordon due to a suspected dangerous object, says Otto Eriksson, officer on duty at the police. The police tell Aftonbladet that it is about two sharp objects. - The bomb shelter will handle the objects in a safe manner, says police spokesperson Adam Isakson Samara to the newspaper. What kind of object it is, the police do not want to go into. Stop in public transport According to information to Aftonbladet, two girls under the age of 18 have been arrested. They are suspected of involvement in the incident. Police cannot confirm any arrests, but say they are investigating the incident as a serious offense against the Flammable and Explosive Goods Act. - We urge people to respect our closures and we work as fast as we can to be able to lift the closures, says Otto Eriksson. Västtrafik stopped both buses and trams during the operation.", "title_original": "Två skarpa föremål i centrala Göteborg – flickor gripna", "summary_original": "En polisinsats pågick vid Nordstan i centrala Göteborg under söndagskvällen. – Där har vi gjort en större avspärrning med anledning av ett misstänkt farligt föremål, säger Otto Eriksson, vakthavande befäl vid polisen. Polisen uppger för Aftonbladet att det rör sig om två skarpa föremål. – Bombskyddet kommer hantera föremålen på ett säkert sätt, säger polisens presstalesperson Adam Isakson Samara till tidningen. Vad det är för typ av föremål vill polisen inte gå in på. Stopp i kollektivtrafiken Enligt uppgifter till Aftonbladet har två flickor under 18 år gripits. De misstänks för inblandning i händelsen. Polisen kan inte bekräfta några gripanden, men säger att de utreder händelsen som grovt brott mot lagen om brandfarliga och explosiva varor. – Vi uppmanar folk att respektera våra avspärrningar och vi jobbar så fort vi kan för att kunna häva avspärrningarna, säger Otto Eriksson. Västtrafik stoppade både bussar och spårvagnar under insatsen.", "link": "https://www.tv4.se/artikel/7jJxhdNjwDY1fZPRbVtmjo/stor-polisinsats-i-centrala-goeteborg", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:40:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/goteborg", "/brott-och-straff"]}, {"id": 125, "title": "Sandra Stiskalo: Can King Charles quench Trump's wrath?", "summary": "LONDON. Almost 60 years ago, many wanted to see Crown Prince Charles married to Richard Nixon's beautiful daughter. Now the British king travels to the United States to heal a bromance.", "title_original": "Sandra Stiskalo: Kan kung Charles släcka Trumps vrede?", "summary_original": "LONDON. För knappt 60 år sedan ville många se kronprins Charles gift med Richard Nixons undersköna dotter. Nu reser den brittiska kungen till USA för att läka en bromance.", "link": "https://www.dn.se/varlden/sandra-stiskalo-kan-kung-charles-slacka-trumps-vrede/", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:28:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "The king is \"relieved\" that Trump is unharmed - but the state visit is being reviewed", "summary": "LONDON. Buckingham Palace and the British government are discussing King Charles and Queen Camilla's trip to the US after the shooting in Washington. Acting US Attorney General Todd Blanche is \"absolutely confident\" that the royal couple will be safe.", "title_original": "Kungen ”lättad” över att Trump är oskadd – men statsbesöket ses över", "summary_original": "LONDON. Buckingham Palace och den brittiska regeringen diskuterar kung Charles och drottning Camillas resa till USA efter skjutningen i Washington. USA:s tillförordnade justitieminister Todd Blanche är ”helt övertygad” om att kungaparet kommer att vara säkra.", "link": "https://www.dn.se/varlden/kungen-lattad-over-att-trump-ar-oskadd-men-statsbesoket-ses-over/", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:28:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Adults forced 13-year-old to his knees - filmed his apology", "summary": "It was at the end of February that a 13-year-old boy was stopped by three men in a parking lot at a preschool in Eskilstuna, where he was waiting for his mother. - Then they came and said \"jump into the car or we'll beat you\", says the 13-year-old in a police interrogation.  According to the interrogation, the background was a previous conflict between the boy and a boy of the same age, who is related to one of the men. The men confronted him because, according to their information, he had previously hit the boy and demanded that he apologize. - I felt scared and forced to jump into the car, so I did, he says. Taken to the forest The boy was then driven to a forest area outside Eskilstuna. - Then this guy picked up his mobile phone and said \"get down on your knees and say sorry. Otherwise we'll beat you\", says the boy. The 13-year-old did as he was told and apologized while being filmed. He was then driven home by the men. According to the police interrogation, he was warned before he was released. - Before I jumped out of the car, they said \"if you say this to anyone, then it will get much worse and we will beat you if you say this to anyone\", says the 13-year-old. \"I solved it my way\" The boy went home and told his sister and mother about the incident, who in turn contacted the police. The sister also chose to write to and confront one of the men on Snapchat. \"Thought you were more honest and more mature than you look,\" writes the sister. The man replied that he \"has respect\" and that he was only talking to the boy. \"I solved it my way, I thought it went great,\" he writes. Sentenced to prison The men denied committing the crime, but the Eskilstuna district court judges that the boy's story is supported by, among other things, the mobile film and other evidence. Two of the men are sentenced to prison for one year and six months each for unlawful deprivation of liberty and gross unlawful coercion. The third, who was a minor at the time of the crime, is sentenced to youth care and youth service. All must pay SEK 45,000 in damages to the 13-year-old and mobile phone", "title_original": "Vuxna tvingade ner 13‑åring på knä – filmade hans ursäkt", "summary_original": "Det var i slutet av februari som en 13‑årig pojke stoppades av tre män på en parkering vid en förskola i Eskilstuna, där han väntade på sin mamma. – Då kom de och sa ”hoppa in i bilen annars så slår vi dig”, säger 13-åringen i ett polisförhör.  Bakgrunden var enligt förhören en tidigare konflikt mellan pojken och en jämnårig kille, som är släkt med en av männen. Männen konfronterade honom eftersom han, enligt deras uppgifter, tidigare ska ha slagit pojken och krävde att han skulle be om ursäkt. – Jag kände mig rädd och tvingad att hoppa in i bilen så jag gjorde det, säger han. Fördes till skogen Pojken kördes därefter till ett skogsområde utanför Eskilstuna. – Sen tog den här killen upp sin mobil och sa \"gå ner på knän och säg förlåt. Annars slår vi dig\", säger pojken. 13‑åringen gjorde som han blev tillsagd och bad om ursäkt medan han filmades. Därefter kördes han hem av männen. Enligt polisförhöret varnades han innan han släpptes av. – Innan jag hoppade av bilen så sa de \"om du säger det här till någon, då kommer det bli mycket värre och vi kommer slå dig om du säger det här till någon\", säger 13-åringen. ”Jag löste det på mitt sätt”  Pojken gick hem och berättade om händelsen för sin syster och mamma, som i sin tur kontaktade polisen. Systern valde också att skriva till och konfrontera en av männen på Snapchat. ”Trodde du var ärligare o mer mogen än vad du ser ut”, skriver systern. Mannen svarade att han ”har respekt” och att han bara pratat med pojken. ”Jag löste det på mitt sätt jag tyckte det gick jättebra”, skriver han. Döms till fängelse Männen nekade till brott, men Eskilstuna tingsrätt bedömer att pojkens berättelse får stöd av bland annat mobilfilmen och annan bevisning. Två av männen döms till fängelse i ett år och sex månader vardera för olaga frihetsberövande och grovt olaga tvång. Den tredje, som var minderårig vid brottet, döms till ungdomsvård och ungdomstjänst. Samtliga ska betala 45 000 kronor i kränkningsersättning till 13‑åringen och mobiltelefonen som användes vid filmningen förverkas.", "link": "https://www.tv4.se/artikel/13y88ZlDpvHjEx9UPFv8fl/vuxna-tvingade-ner-13-aring-pa-knae-filmade-hans-ursaekt", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:27:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/polisen", "/fangelse", "/straff"]}, {"id": 128, "title": "Keep an eye on AI? Here are the words that are good to grasp", "summary": "AI has in a short time become everyday for large parts of society. With technology comes words and expressions that may need an explanation. Here is a list of some of the AI ​​words that are good to know.", "title_original": "Koll på AI? Här är orden som är bra att fatta", "summary_original": "AI har på kort tid blivit vardag för stora delar av samhället. Med tekniken kommer ord och uttryck som kan behöva en förklaring. Här är en lista över några av AI-orden som är bra att känna till.", "link": "https://www.hd.se/sverige/koll-pa-ai-har-ar-orden-som-ar-bra-att-fatta/", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:16:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "DN Debate. \"An embarrassing betrayal of Sweden's Alzheimer's patients\"", "summary": "DN DEBATE. A historic breakthrough has occurred in dementia research: a new drug that can slow Alzheimer's. And Sweden opts out of it. The NT council's no is based on a health economic calculation with fundamental flaws. Perhaps our patients are simply worth a little less than those with MS and breast cancer, write 35 leading Alzheimer's researchers and doctors.", "title_original": "DN Debatt. ”Ett pinsamt svek mot Sveriges alzheimerpatienter”", "summary_original": "DN DEBATT. Ett historiskt genombrott har skett inom demensforskningen: ett nytt läkemedel som kan bromsa alzheimer. Och Sverige väljer bort det. NT-rådets nej grundas på en hälsoekonomisk kalkyl med fundamentala brister. Kanske är våra patienter helt enkelt värda lite mindre än dem med ms och bröstcancer, skriver 35 ledande alzheimerforskare och läkare.", "link": "https://www.dn.se/debatt/ett-pinsamt-svek-mot-sveriges-alzheimerpatienter/", "date_display": "2026-04-26", "date_iso": "2026-04-26T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "This is how the scams work: \"Silent robberies\"", "summary": "Scams where the elderly are tricked into handing over gold have increased. At the same time, the cases are not covered by insurance, as they are classified as fraud and not theft. - These are silent robberies, where defenseless people are misled in an almost hypnotic approach, says Björn Seeth at the police's national fraud centre.", "title_original": "Så går bedrägerierna till: ”Tysta rån”", "summary_original": "Bedrägerier där äldre blir lurade att lämna ifrån sig guld har ökat. Samtidigt omfattas fallen inte av försäkringar, då det rubriceras som just bedrägerier och inte stöld. – Det här är tysta rån, där försvarslösa människor blir vilseledda i nästan ett hypnotiskt tillvägagångssätt, säger Björn Seeth vid polisens nationella bedrägericentrum.", "link": "https://www.dn.se/ekonomi/sa-gar-bedragerierna-till-tysta-ran/", "date_display": "2026-04-26", "date_iso": "2026-04-26T17:54:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Inger was tricked into handing over his gold", "summary": "Inger Larsson, 78, received a text message about an order she had not placed. Just over an hour later, she had been tricked into giving up all her gold jewellery, worth around 200,000 kroner. - I was cut and very stressed.", "title_original": "Inger blev lurad att lämna över sitt guld", "summary_original": "Inger Larsson, 78, fick ett sms om en beställning som hon inte gjort. En dryg timme senare hade hon blivit lurad att lämna ifrån sig alla sina guldsmycken, värda omkring 200 000 kronor. – Jag var skärrad och väldigt stressad.", "link": "https://www.dn.se/ekonomi/inger-blev-lurad-att-lamna-over-sitt-guld/", "date_display": "2026-04-26", "date_iso": "2026-04-26T17:54:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "The \"high season of hand surgeons\" has begun - here are the worst dangers", "summary": "A severed finger is something that most people never want to have to deal with, but during the spring the cases increase as more people work in the garden. If disaster strikes, there are false myths and dangerous traps to avoid.  - I hardly dare to mention it, but some people think that you should put your finger in your mouth. It's the worst thing you can do, says Per Fredrikson, specialist doctor in hand surgery. His advice is to seek care immediately, without stressing. In some cases, it has been possible to sew a cut finger back a whole day later.  - You shouldn't put your finger directly on the ice either. The severed body part must be cleaned, wrapped in something clean and moist and then placed in a plastic bag, he says.  \"Frozen bread and avocado kernels\" Many hand injuries occur in the kitchen. Per Fredrikson warns against washing thin glasses by hand and using sharp knives for anything other than cutting.  - Two culprits are frozen bread and avocado kernels. When you peel them off with the tip of a knife, you easily injure your hand, he says. If you happen to cut a body part into several parts, you should collect as much as you can. - Sometimes we can use the \"spare parts\" that are available. Then we have to be creative and think about how to patch it together best, says Per Fredrikson. Busting the myth During the pandemic, Per Fredrikson thought that the number of severed fingers would increase in line with the number of home carpenters - but he was wrong.  - We were nervous because wooden decks were being built like never before. But we never saw that peak and I think it's about people having time, he says. Per Fredrikson says that fingers are sensitive and that it is not unusual for patients to come in with a severed finger. However, the myth that you can bite off a finger as easily as a carrot is not true. - That is not true, in that case you have a very bad finger. Fingers usually have a strong structure, but they are often in a sensitive environment, he says.", "title_original": "”Handkirurgernas högsäsong” har börjat – här är värsta farorna", "summary_original": "Ett avhugget finger är något som de flesta aldrig vill behöva hantera, men under våren ökar fallen då fler arbetar i trädgården. Om olyckan är framme, finns det felaktiga myter och farliga fällor att undvika.  – Jag vågar knappt nämna det, men vissa tror att man ska stoppa fingret i munnen. Det är det sämsta man kan göra, säger Per Fredrikson, specialistläkare inom handkirurgi. Hans råd är att söka vård direkt, utan att stressa. I vissa fall har det gått att sy fast ett kapat finger ett helt dygn senare.  – Man ska inte lägga fingret direkt mot is heller. Den avkapade kroppsdelen ska göras ren, lindas in i något rent och fuktigt för att sedan läggas i en plastpåse, säger han.  ”Fruset bröd och avokadokärnor” Många handskador uppstår i köket. Per Fredrikson varnar för att handdiska tunna glas och använda vassa knivar till annat än att skära.  – Två bovar är fruset bröd och avokadokärnor. När man pillar bort dem med en knivspets skadar man lätt handen, säger han. Om man råkar kapa en kroppsdel i flera delar bör man samla ihop så mycket man bara kan. – Ibland kan vi använda de ”reservdelar” som finns. Då får vi vara kreativa och tänka hur man kan lappa ihop det bäst, säger Per Fredrikson. Slår hål på myten Under pandemin trodde Per Fredrikson att antalet avhuggna fingrar skulle öka i takt med antalet hemmasnickrare – men han hade fel.  – Vi var nervösa eftersom det byggdes trädäck som aldrig förr. Men vi såg aldrig den peaken och jag tror att det handlar om att folk hade tid på sig, säger han. Per Fredrikson säger att fingrar är känsliga och att det inte är helt ovanligt att patienter kommer in med ett avkapat finger. Däremot stämmer inte myten om att man kan bita av ett finger lika lätt som en morot. – Det stämmer inte, i så fall har man ett väldigt dåligt finger. Fingrar har i regel stark struktur, men de är ofta i en känslig miljö, säger han.", "link": "https://www.tv4.se/artikel/1VvQp7EKqAFida0RtcC3GX/handkirurgernas-hoegsaesong-har-boerjat-haer-aer-vaersta-farorna", "date_display": "2026-04-26", "date_iso": "2026-04-26T17:53:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/tradgard", "/sjukvard", "/forskning"]}, {"id": 133, "title": "Martin Liby Troein: Busch and Andersson are flirting - but something much bigger is going on", "summary": "Ebba Busch and Magdalena Andersson's flirtation is received as something new and big. But it is a side track – this is about the Moderates.", "title_original": "Martin Liby Troein: Busch och Andersson flörtar – men något mycket större är på gång", "summary_original": "Ebba Buschs och Magdalena Anderssons flört tas emot som något nytt och stort. Men den är ett sidospår – det här handlar om Moderaterna.", "link": "https://www.dn.se/ledare/martin-liby-troein-busch-och-andersson-flortar-men-nagot-mycket-storre-ar-pa-gang/", "date_display": "2026-04-26", "date_iso": "2026-04-26T17:13:29+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Malin Fransson: It is necessary for the Sims to be able to compete with influencers", "summary": "Many elite swimmers have single-handedly created the conditions for a good professional life after their sports career. But the International Swimming Federation has failed to provide them with opportunities to earn money while they chase medals and success.", "title_original": "Malin Fransson: Det krävs för att simmarna ska kunna konkurrera med influerare", "summary_original": "Många elitsimmare har på egen hand skapat förutsättningar för ett bra yrkesliv efter idrottskarriären. Men Internationella simförbundet har misslyckats med att ge dem möjligheter att tjäna pengar under tiden som de jagar medaljer och framgångar.", "link": "https://www.dn.se/sport/malin-fransson-det-kravs-for-att-simmarna-ska-kunna-konkurrera-med-influerare/", "date_display": "2026-04-26", "date_iso": "2026-04-26T17:08:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Gratitude to God when the mission organization The Navigators celebrated 70 years", "summary": "'I am completely fulfilled by all the life stories,' says Kristina Avaheden, national leader", "title_original": "Tacksamhet till Gud när missionsorganisationen Navigatörerna firade 70 år", "summary_original": "'Jag är helt uppfylld av alla livsberättelser', säger Kristina Avaheden, nationell ledare", "link": "https://www.dagen.se/nyheter/tacksamhet-till-gud-naer-missionsorganisationen-navigatoererna-firade-70-ar/10312336", "date_display": "2026-04-26", "date_iso": "2026-04-26T16:57:31+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Denmark avoids the shadow fleet - in fear of Russians and Chinese", "summary": "Russia has used the so-called shadow fleet to export oil and circumvent the Western sanctions imposed since the full-scale invasion. The ships have been described as an important part of Russian oil exports and a way to keep the Russian economy alive.  However, the shadow fleet has experienced stronger pressure against it recently in Europe as several countries such as Sweden, Great Britain, France and Belgium have carried out actions where ships have been boarded. At the moment, two stateless ships suspected of belonging to the fleet are anchored outside Trelleborg after being boarded by Swedish authorities.  At the same time, criticism has been directed at Denmark - because they did not act as hard. Criticized for acting passively Danska Politiken reports, among other things, that the American think tank Cepa is critical of Denmark's actions in an analysis.  \"Danish officials have determined that closing the strait is not possible, and even more modest proposals have time and again stalled - due to fear of escalation and lack of capacity,\" writes the author of the analysis Meelis Oidsalu, former head of Estonia's Ministry of Defense.  The Swedish EU parliamentarian Jonas Sjöstedt (V) also calls for more action from the Danish side.  - In my eyes, it is Sweden and Finland that lead the way. I would like to see more action from Denmark, says Sjöstedt to Politiken. Can fight back against Maersk Despite its size, Denmark is considered one of the world's largest shipping nations, led by the shipping company Maersk. The shipping company is one of the world's largest and accounts for a large part of global container traffic. And the Danish merchant fleet is singled out as a reason why Denmark has not chosen to act as aggressively against the shadow fleet – such actions could backfire against Danish shipping globally.  - As a global shipping nation, we have to think about our own ships. If we start stopping ships in the Baltic Sea, it may also happen that the Chinese and Russians start stopping Maer", "title_original": "Danmark undviker skuggflottan – i rädsla för ryssar och kineser", "summary_original": "Ryssland har använt sig av den så kallade skuggflottan för att kunna frakta ut olja och kringgå de västerländska sanktioner som införts sedan den fullskaliga invasionen. Fartygen har beskrivits som en viktig del i den ryska oljeexporten och ett sätt för att hålla den ryska ekonomin vid liv.  Skuggflottan har dock upplevt ett hårdare tryck mot sig den senaste tiden i Europa då flera länder som Sverige, Storbritannien, Frankrike och Belgien har genomfört aktioner där fartyg bordats. För tillfället ligger två statslösa fartyg som misstänks tillhöra flottan ankrade utanför Trelleborg efter att de bordats av svenska myndigheter.  Samtidigt har kritik riktats mot Danmark – då man inte agerat lika hårt. Kritiseras för att ha agerat passivt Danska Politiken rapporterar bland annat att den amerikanska tankesmedjan Cepa i en analys är kritiska till Danmarks agerande.  ”Danska tjänstemän har slagit fast att en stängning av sunden inte är möjlig, och även mer blygsamma förslag har gång på gång kört fast – på grund av rädsla för eskalering och bristande kapacitet”, skriver författaren av analysen Meelis Oidsalu, tidigare chef på Estlands försvarsdepartement.  Även den svenska EU-parlamentarikern Jonas Sjöstedt (V) efterlyser mer handling från danskt håll.  – I mina ögon är det Sverige och Finland som går i täten. Jag skulle gärna se mer handling från Danmark, säger Sjöstedt till Politiken. Kan slå tillbaka mot Maersk Trots sin storlek räknas Danmark som en av världens största sjöfartsnationer med rederiet Maersk i spetsen. Rederiet är ett av världens största och står för en stor del av den globala containertrafiken. Och den danska handelsflottan pekas ut som en anledning till att Danmark inte valt att agera lika aggressivt mot skuggflottan – sådana aktioner skulle kunna slå tillbaka mot dansk sjöfart globalt.  – Som en global sjöfartsnation måste vi tänka på våra egna fartyg. Om vi börjar stoppa fartyg i Östersjön kan det också hända att kineserna och ryssarna börjar stoppa Maersk-fartyg på andra håll i världen,” säger Jessica Larsen, forskare på Danska institutet för internationella studier. De danska myndigheterna vill inte svara på om man varit i kontakt med Maersk, men uppger att flera initiativ har inletts för att stärka sjösäkerhet.  ”Danska myndigheter övervakar noggrant fartyg som passerar genom de danska sunden”, skriver det danska näringsdepartementet i ett svar till Politiken.  Forskaren Jessica Larsens analys får dock medhåll från andra inom forskarvärlden, bland annat Yevgeniy Golovchenko vid Köpenhamns universitet. – Om det nu är Danmark som börjar bryta mot internationell rätt finns det naturligtvis en risk att det kan drabba dansk sjöfart runt om i världen, säger Golovchenko till Politiken. De svenska myndigheterna har flertalet gånger framlyft att de bordningar man genomfört inte brutit mot internationell rätt, då fartygen varit statslösa eller misstänks ha begått andra brott. Datan visar – fartyg har valt andra rutter Samtidigt som Danmark inte valt att agera lika hårt har flera skepp börjat ändra sin rutt. Förra veckan rapporterade TV4 Nyheterna att fler fartyg valt att undvika svenska farvatten och istället valt att segla en annan rutt söder om danska Bornholm. Amerikanska Bloomberg har också sammanställt data under april som visar att 13 av 22 sanktionerade fartyg valde rutten söder om Danmark, istället för den vanliga passagen norr om ön.  Ett liknande mönster har även synts i Engelska kanalen, där sanktionerade fartyg valt att segla norr om Skottland, efter att britterna hotat med att beslagta fartyg.", "link": "https://www.tv4.se/artikel/4GA3T2gkdkO9QEhooc9ItG/danmark-undviker-skuggflottan-i-raedsla-foer-ryssar-och-kineser", "date_display": "2026-04-26", "date_iso": "2026-04-26T16:57:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/skuggflottan", "/ostersjon", "/danmark", "/ryssland", "/tyskland", "/frankrike", "/storbritannien"]}, {"id": 137, "title": "Suspected shooter's manifesto: \"I want to throw up; I want to cry\"", "summary": "Left writing • Trump: \"He hates Christians\"", "title_original": "Misstänkte skyttens manifest: ”Jag vill kräkas; jag vill gråta”", "summary_original": "Lämnade skrift • Trump: ”Han hatar kristna”", "link": "https://www.tv4.se/artikel/2Rb3biKTIvttbvjAKpJ6xy/naer-man-laeser-hans-manifest-sa-hatar-han-kristna", "date_display": "2026-04-26", "date_iso": "2026-04-26T16:37:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 138, "title": "The experts: This is how Trump can turn the shooting to his advantage", "summary": "\"Will reinforce the image of himself\" • Points out the big risk", "title_original": "Experterna: Så kan Trump vända skjutningen till sin fördel", "summary_original": "”Kommer att förstärka bilden av sig själv” • Pekar ut stora risken", "link": "https://www.tv4.se/artikel/7HbFiZH1ANUuqGE3QluHWD/experterna-sa-kan-trump-vaenda-skjutningen-till-sin-foerdel", "date_display": "2026-04-26", "date_iso": "2026-04-26T14:08:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 139, "title": "The derby king kept Djurgården's ghost alive", "summary": "Before the football match at 3 Arena, Hammarby had eight straight games against Djurgården without a loss, including the most recent 1-0 victory in the Swedish Cup quarter-final in March. That streak was extended to nine after \"Bajen's\" Nahir Besara equalized at 1-1 after an hour of play with an outside side. The hit was the team captain's second in the Allsvenskan this year. I do my thing, try to lead the team. I play my way and keep calm, says the offensive midfielder to TV4.  The 35-year-old has now scored against Djurgården in five of the last nine games, two of which ended goalless. The Norwegian continues to deliver Table seven Djurgården, on the other hand, started Sunday's derby best and Kristian Lien continues to deliver going forward. The new Norwegian striker certainly scored his third Allsvenskan goal in five games in the ninth minute. After a short break due to Bengal burning in the second half, third in the table Hammarby took over, with the effect that Besara drew 1–1 which was the final score. \"Much better than them\" Too bad we can't come away with a win. We are doing very well. Djurgården is a really good team, but at the same time we are much better than them today, says Besara. Djurgården's new team captain Adam Ståhl, who had been absent due to a viral illness, made a comeback when he jumped into the tied match. It felt like we got very low. You can give it to Hammarby. They did well and got us low, he tells TV4. Djurgården's assistant coach Christer Mattiasson was shown to the stands in the second half after receiving a red card from the head referee and future World Cup referee Glenn Nyberg. According to TV4, the reason was that Mattiasson said something that Nyberg reacted to. Djurgården's last victory against Hammarby came almost four years ago, in July 2022. Then it was 1–0 in one of the meetings in the Allsvenskan.", "title_original": "Derbykungen höll liv i Djurgårdens spöke", "summary_original": "Inför fotbollsmatchen på 3 arena hade Hammarby åtta raka matcher mot Djurgården utan förlust, varav den senaste 1–0-segern i Svenska cupen-kvartsfinalen i mars. Den sviten utökades till nio efter att ”Bajens” Nahir Besara kvitterat till 1–1 efter en timmes spel med en yttersida. Fullträffen var lagkaptenens andra i allsvenskan i år. Jag gör min grej, försöker leda laget. Jag spelar på mitt sätt och behåller ett lugn, säger den offensive mittfältaren till TV4.  35-åringen har nu gjort mål mot Djurgården i fem av de senaste nio matcherna varav två slutat mållöst. Norrmannen fortsätter leverera Tabellsjuan Djurgården inledde däremot söndagens derby bäst och Kristian Lien fortsätter att leverera framåt. Den nye norske anfallaren satte säkert sitt tredje allsvenska mål på fem matcher i den nionde minuten. Efter en kortare uppehåll på grund av bengalbränning i den andra halvleken tog tabelltrean Hammarby över, med effekten att Besara gjorde 1–1 vilket blev slutresultatet. ”Mycket bättre än dem” Tråkigt att vi inte kan komma härifrån med en vinst. Vi gör mycket bra. Djurgården är ett riktigt bra lag men samtidigt är vi mycket bättre än dem i dag, säger Besara. Djurgårdens nye lagkapten Adam Ståhl, som varit borta på grund av virussjukdom, gjorde comeback när han hoppade in i den oavgjorda matchen. Det kändes som att vi blev väldigt låga. Man får ge det till Hammarby. De gjorde det bra och fick oss låga, säger han till TV4. Djurgårdens assisterande tränare Christer Mattiasson blev uppvisad på läktaren i andra halvlek efter att ha fått rött kort av huvuddomaren och kommande VM-domaren Glenn Nyberg. Enligt TV4 var anledningen att Mattiasson sagt något som Nyberg reagerade på. Djurgårdens senaste seger mot Hammarby kom för knappt fyra år sedan, i juli 2022. Då blev det 1–0 i ett av mötena i allsvenskan.", "link": "https://www.tv4.se/artikel/tt-260426-allsv1-da84c24f/derbykungen-holl-liv-i-djurgardens-derbyspoke", "date_display": "2026-04-26", "date_iso": "2026-04-26T14:01:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/hammarby-if", "/tv4", "/fotboll"]}, {"id": 140, "title": "40 percent of young men in the US go to church: 'Change in the religious climate'", "summary": "Young Republicans behind the lion's share of the increase", "title_original": "40 procent av unga män i USA går till kyrkan: 'Förändring i det religiösa klimatet'", "summary_original": "Unga republikaner bakom lejonparten av ökningen", "link": "https://www.dagen.se/nyheter/40-procent-av-unga-maen-i-usa-gar-till-kyrkan-foeraendring-i-det-religioesa-klimatet/10316595", "date_display": "2026-04-26", "date_iso": "2026-04-26T13:10:21+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Prayer Network Enters Prayer and Fasting to End Abortion in the Constitution", "summary": "Swedish prayer leader Eva Barck: God has done miracles in the past", "title_original": "Bönenätverk går in i bön och fasta för att stoppa abort i grundlagen", "summary_original": "Sverigebönens ledare Eva Barck: Gud har gjort mirakel förr", "link": "https://www.dagen.se/nyheter/boenenaetverk-gar-in-i-boen-och-fasta-foer-att-stoppa-abort-i-grundlagen/10316553", "date_display": "2026-04-26", "date_iso": "2026-04-26T12:17:32+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Swedish pedophile ruled over child abuse in Kenya - remotely", "summary": "According to a judgment in Borås district court, the man in his 50s had extensive contact with people abroad, including in Kenya, via encrypted chat apps, and participated in and directed sexual abuse of children remotely from Sweden in real time. The man is convicted of, among other things, rape of a child, attempted and aggravated rape of a child, and aggravated child pornography. The crimes were committed in 2023 and 2024 and took place largely over the internet. Controlled abuse via chat The man used encrypted chat apps, especially Telegram, to make contact, plan and coordinate the abuse. The district court finds that he took the initiative, controlled what was to happen and participated in real time, even though he was in Sweden. The district court takes up that the man was in contact via chat with a woman in Kenya, who, in exchange for payment, assaulted a three-year-old girl.  The investigation also shows that the man used several accounts and digital identities, as well as various payment services, to carry out and hide payments connected to the crimes. The sentence also covers other sexual crimes that are not directly linked to Kenya. The material seized and examined is described as very serious. The judgment states that the criminal inspector who reviewed the material assessed parts of the content as the worst he had seen in his years as an inspector. Dismisses explanations The man has denied any crime, but the district court considers that the evidence is comprehensive and coherent. The court rejects his explanations and states that the crime was planned and systematic. In addition to the prison sentence, the man must pay SEK 265,000 in damages to the child who was the plaintiff in the case. He must also pay a fee to the Crime Victims' Fund. Confiscated electronic equipment, such as mobile phones and computers, will be confiscated, and the man will remain in custody pending the execution of the sentence.", "title_original": "Svensk pedofil styrde över barnövergrepp i Kenya – på distans", "summary_original": "Enligt en dom i Borås tingsrätt hade mannen i 50‑årsåldern via krypterade chattappar omfattande kontakt med personer utomlands, bland annat i Kenya, och deltog i samt styrde sexuella övergrepp mot barn på distans från Sverige i realtid. Mannen döms bland annat för våldtäkt mot barn, försök och stämpling till våldtäkt mot barn samt grovt barnpornografibrott. Brotten begicks under 2023 och 2024 och skedde till stor del över internet. Styrde övergrepp via chatt Mannen använde krypterade chattappar, framför allt Telegram, för att ta kontakt, planera och samordna övergreppen. Tingsrätten slår fast att han tog initiativ, styrde vad som skulle ske och deltog i realtid, trots att han befann sig i Sverige. Tingsrätten tar upp att mannen via chatt hade kontakt med en kvinna i Kenya, som mot betalning utförde övergrepp mot en treårig flicka.  Utredningen visar också att mannen använde flera konton och digitala identiteter, samt olika betaltjänster, för att genomföra och dölja betalningar kopplade till brotten. Domen omfattar även andra sexualbrott som inte är direkt kopplade till Kenya. Det material som beslagtagits och granskats beskrivs som mycket allvarligt. I domen återges att den kriminalinspektör som granskat materialet bedömde delar av innehållet som det värsta han sett under sina år som granskare. Avfärdar förklaringar Mannen har nekat till brott, men tingsrätten anser att bevisningen är omfattande och sammanhängande. Domstolen avfärdar hans förklaringar och slår fast att brottsligheten varit planerad och systematisk. Utöver fängelsestraffet ska mannen betala 265 000 kronor i skadestånd till barnet som varit målsägande i målet. Han ska även betala avgift till Brottsofferfonden. Beslagtagen elektronisk utrustning, såsom mobiltelefoner och datorer, ska förverkas, och mannen ska sitta kvar i häkte i väntan på att straffet verkställs.", "link": "https://www.tv4.se/artikel/6PSDVKlHy4hOOSJCHG04EF/svensk-pedofil-styrde-oever-barnoevergrepp-i-kenya-pa-distans", "date_display": "2026-04-26", "date_iso": "2026-04-26T11:54:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/valdtakt", "/sexuellt-ofredande", "/sexuella-overgrepp", "/sexuella-trakasserier", "/sexualbrott-mot-barn", "/sexualbrott", "/sexulbrott"]}, {"id": 143, "title": "Emelie's sight was saved by amniotic membrane from a pregnant woman", "summary": "At first, Emelie Bogaeus didn't think to seek treatment, but when she got a lot of pain in her eye, she decided to go in.  - Then the eye had started to turn gray and I couldn't see anything, she says. It turned out that she had a serious infection on the left cornea from a bacteria that could have made her blind.  - Then the cornea was so very thin because this bacteria had eaten 80 percent of the cornea, says Emelie Bogaeus. The bacterium is common, but as long as it is on the eye, it is harmless. - But if it gets into the eye, that's when it becomes dangerous for us. It can do that if you have a wound or tear on the cornea, says Emelie Bogaeus. \"It made me panicky\" After treatment with antibiotic drops, a wound remained on the surface of the cornea which was difficult to heal and therefore she had to undergo an operation.  - It caused panic. But I just had to lie down and meditate and breathe, all the birth tricks, says Emelie Bogaeus. It was thanks to pieces of amniotic membrane that her eye could be saved. - It was scarring and a significant thinning. Therefore, the cornea was transplanted later to be able to have much better vision, says senior physician Marios Panagiotopoulos. Pregnant women donate placentas The eye clinic in Örebro was the first in the country to use the method in the early 2000s. The process is dependent on pregnant women who are scheduled to have a caesarean section and who have volunteered to donate their placenta.  - You have to take special pieces. In the case of a planned caesarean section, it is easier to take advantage of this particular placenta or amniotic membrane, says Marios Panagiotopoulos. - The donation is completely harmless for both the child and the mother.  150 operations are performed per year Marios Panagiotopoulos tells us that the amniotic membrane has special properties to suppress infection and inflammation and can also help heal wounds that are difficult to heal - as in Emelie's case. Pieces from the placenta are then cut out and deep-frozen for increased durability. You can then put a piece on the cornea when it has thawed.  - Fetus", "title_original": "Emelies syn räddades av fosterhinna från gravid kvinna", "summary_original": "Emelie Bogaeus tänkte först inte söka vård men när hon fick väldigt ont i ögat så valde hon att åka in.  – Då hade ögat börjat bli grått och jag såg ingenting, berättar hon. Det visade sig att hon råkat ut för en allvarlig infektion på vänster hornhinna av en bakterie som kunde gjort henne blind.  – Då var hornhinnan så himla tunn för den här bakterien hade ätit upp 80 procent av hornhinnan, säger Emelie Bogaeus. Bakterien är vanlig, men så länge den är på ögat så är den ofarlig. – Men om den kommer in i ögat, det är då den blir farlig för oss. Det kan den göra om man har något sår eller nån reva på hornhinnan, säger Emelie Bogaeus. ”Det gjorde panikont” Efter behandling med antibiotikadroppar fanns ett sår kvar på ytan av hornhinnan som hade svårt att läka och därför fick hon genomgå en operation.  – Det gjorde panikont. Men jag fick bara ligga och meditera och andas, alla förlossningsknep, säger Emelie Bogaeus. Det var tack vare bitar av en fosterhinna som hennes öga kunde räddas. – Det var en ärbildning och en rejäl förtunning. Därför blev hornhinnan transplanterad sen för att kunna få mycket bättre syn, säger överläkare Marios Panagiotopoulos. Gravida kvinnor donerar moderkakor Ögonkliniken i Örebro var de första i landet som använde metoden i början på 2000-talet. Processen är beroende gravida kvinnor som ska göra planerat kejsarsnitt och som anmält sig frivilligt till att donera sin moderkaka.  – Man måste ta speciella bitar. Vid ett planerat kejsarsnitt är det lättare att ta tillvara på just den här moderkakan eller fosterhinnan, säger Marios Panagiotopoulos. – Donationen är helt ofarlig för både barnet och mamman.  Görs 150 operationer per år Marios Panagiotopoulos berättar att fosterhinnan har speciella egenskaper för att dämpa infektion och inflammation och kan även hjälpa till att läka svårläkta sår – som i Emelies fall. Bitar från moderkakan klipps då ut och djupfryses för ökad hållbarhet. Man kan då lägga en bit på hornhinnan när den tinat upp.  – Fosterhinnan brukar försvinna inom några veckor. Under den tiden kan den verka på ytan och hjälpa till med läkningen så att du återställer normala förhållanden i hornhinnan. Vi gör ungefär 150 sådana operationer varje år, säger han. I dag, nästan två år efter att Emelies öga blev grått, kan hon se på båda ögonen. – Jag har absolut nedsatt syn, men hjärnan är också helt otrolig på att anpassa sig och hitta rätt. Jag ser bra, säger hon.", "link": "https://www.tv4.se/artikel/2P6uC8rjs9GEkD0MqiYa9W/emelies-syn-raeddades-av-fosterhinna-fran-gravid-kvinna", "date_display": "2026-04-26", "date_iso": "2026-04-26T11:46:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/halsa", "/nyhetsmorgon", "/sjukdomar", "/graviditet", "/sjukvard"]}, {"id": 144, "title": "11 models in test: Here are the best running shoes of the year", "summary": "The experts' advice is clear: Alternate between several pairs of shoes if you run often. We test eleven of this year's novelties. Here are the shoes with the best running feel, shock absorption and stability.", "title_original": "11 modeller i test: Här är årets bästa löparskor", "summary_original": "Experternas råd är tydligt: Varva mellan flera par skor om du springer ofta. Vi testar elva av årets nyheter. Här är skorna med bäst löpkänsla, stötdämpning och stabilitet.", "link": "https://www.svd.se/a/433gb6/elva-modeller-i-test-har-ar-arets-basta-loparskor", "date_display": "2026-04-26", "date_iso": "2026-04-26T11:35:05+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 145, "title": "The Iran war may cause more people to take \"sleepovers\": \"Strong demand\"", "summary": "The Iran war and tours around the Strait of Hormuz have caused jet fuel prices in Europe to become historically expensive, as TV4 Nyheterna previously reported. The uncertainty has led to more Swedes booking holidays at home. Boom at the camping chain Johan Söör, CEO of Scandinavia's largest camping chain First camp, says that online bookings of camping sites have increased by 20 percent compared to the same period last year. - It is true that bookings increased when the conflict took off in early March, says Söör. - And there is continued strong demand for the summer, 13 percent more than last year, for First camp's Swedish destinations. He sees a connection between the conflict and the increased bookings. - Absolutely. Partly there is the uncertainty in the outside world, that you look after your own direct safety, but also fuel prices and other things. \"High interest in the search engines\" Even at Visit Sweden, the state company that is supposed to promote Swedish tourism, you notice this. - There is a high interest in the search engines. Often people book with shorter notice today, but now we see an increased booking situation early in the season, says Visit Sweden's CEO Susanne Andersson. She believes that the Swedes learned \"svemestra\" during the pandemic, when the term first became popular. - We have become better at discovering Sweden. How to make the most of your vacation At the same time, she believes that many Swedes can still get better at discovering their homeland, and not just the most famous landmarks or hiking trails. - Dare to explore what we actually have! What is available in Sweden corresponds to much of what we think we can get when we go to another country. We have incredibly fine sandy beaches on Österlen, rock baths on the West Coast and so on. Andersson recommends taking the children to a farm shop and seeing how they produce their food. - Say they make cheese. Then the cheese is seven times tastier in the evening because you remember what you experienced during the day, she says. - We have so much that is free too. If you think, you plan correctly and", "title_original": "Irankriget kan göra att fler tar ”svemester”: ”Stark efterfrågan”", "summary_original": "Irankriget och turerna kring Hormuzsundet har gjort att flygbränslepriserna i Europa blivit historiskt dyra, vilket TV4 Nyheterna tidigare rapporterat om. Osäkerheten har lett till att fler svenskar bokat semester på hemmaplan. Boom hos campingkedjan Johan Söör, vd på Skandinaviens största campingkedja First camp, säger att onlinebokningarna av campingplatser ökat med 20 procent jämfört med samma period förra året. – Det stämmer att bokningarna ökade när konflikten tog fart i början av mars, säger Söör. – Och det är en fortsatt stark efterfrågan för sommaren, 13 procent mer än förra året, på First camps svenska destinationer. Han ser ett samband mellan konflikten och de ökade bokningarna. – Absolut. Dels är det osäkerheten i omvärlden, att man ser till sin egen direkta säkerhet, men också bränslepriser och annat. ”Högt intresse i sökmotorerna” Även på Visit Sweden, det statliga bolaget som ska främja svensk turism, märker man av detta. – Det är ett högt intresse i sökmotorerna. Ofta bokar man med kortare varsel idag, men nu ser vi ett ökat bokningsläge tidigt på säsongen, säger Visit Swedens vd Susanne Andersson. Hon tror att svenskarna lärde sig ”svemestra” under pandemin, när begreppet blev populärt första gången. – Vi har blivit duktigare på att upptäcka Sverige. Så maxar du svemestern Samtidigt tror hon att många svenskar fortfarande kan bli bättre på att upptäcka hemlandet, och inte bara de allra kändaste landmärkena eller vandringslederna. – Våga utforska vad vi faktiskt har! Det som finns i Sverige svarar upp till mycket av det vi tror att vi kan få när vi åker till ett annat land. Vi har otroligt fina sandstränder på Österlen, klippbad på Västkusten och så vidare. Andersson rekommenderar att ta med barnen till en gårdsbutik och se hur de producerar sin mat. – Säg att de gör ost. Då blir osten sju gånger godare på kvällen för att du kommer ihåg det du upplevde på dagen, säger hon. – Vi har så ofantligt mycket som är gratis också. Tänker man, planerar rätt och lägger pengarna på rätt saker kan man få en väldigt prisvärd semester.", "link": "https://www.tv4.se/artikel/6ywk8BE4rBoZP073mu9g7D/irankriget-kan-goera-att-fler-tar-svemester-stark-efterfragan", "date_display": "2026-04-26", "date_iso": "2026-04-26T09:57:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/semester", "/sommar"]}, {"id": 146, "title": "The terror researcher's concern: \"That Trump cancels the fall election\"", "summary": "Hans Brun about the deed of the night", "title_original": "Terrorforskarens oro: ”Att Trump ställer in höstens val”", "summary_original": "Hans Brun om nattens dåd", "link": "https://www.tv4.se/artikel/d3rT3rGxR4g16dHAXheY4/terrorforskarens-oro-att-trump-staeller-in-hoestens-val", "date_display": "2026-04-26", "date_iso": "2026-04-26T09:22:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 147, "title": "Calling himself the \"friendly federal killer\"", "summary": "31-year-old Cole Tomas Allen is singled out as the man who stormed the hotel where the White House gala dinner was held. In a manifesto that the shooter left behind, it appears that he was willing to \"kill everyone in the room\".", "title_original": "Kallar sig själv ”vänlige federala mördaren”", "summary_original": "31-årige Cole Tomas Allen pekas ut som mannen som stormade hotellet där Vita husets galamiddag hölls. I ett manifest som skytten lämnade efter sig framkommer det att han var villig att ”döda alla i rummet”.", "link": "https://www.svd.se/a/vrk6Jm/cole-tomas-allen-misstankt-for-skjutning-pa-galamiddag", "date_display": "2026-04-26", "date_iso": "2026-04-26T09:20:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Världen"]}, {"id": 148, "title": "Amanda Rincon Jonegård on the divorce: God knows how much we have fought", "summary": "The influencer and pastor's daughter from 'Love is Blind' about the breakup from husband Sergio", "title_original": "Amanda Rincon Jonegård om skilsmässan: Gud vet hur mycket vi har kämpat", "summary_original": "Influeraren och pastorsdottern från 'Love is Blind' om uppbrottet från maken Sergio", "link": "https://www.dagen.se/nyheter/amanda-rincon-jonegard-om-skilsmaessan-gud-vet-hur-mycket-vi-har-kaempat/10316532", "date_display": "2026-04-26", "date_iso": "2026-04-26T07:48:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Pink glove divides the folk sport - the profile plummets: \"Parody\"", "summary": "The pink glove has a fabric webbing between the thumb and index finger and resembles an ice hockey puck glove. It has been marketed as a breakthrough for floorball goalies and has been picked up by several retailers ahead of the upcoming season. After debate, the International Floorball Federation (IFF) is now stopping the glove from all official match play, as it is against the sport's regulations, reports Floorball magazine. - It's fun when there's a bit of a stir in the pot, but here it feels like it might be better to have pot mitts than floorball gloves, says former floorball star Niklas Jihde to TV4 Nyheterna. \"What's the next thing?\" The current Viaplay presenter believes that the glove is extremely strange. He finds it difficult to understand that it even went so far that it was believed that it could be used at the highest level - and that the manufacturer also got retailers to take in the product. - I mean, wow, there are rules in floorball regarding equipment just like in ice hockey. You can't come up with a pair of shin guards that cover the entire target, he says. - What's the next thing? That the goalkeeper can stand with a Batman cape on his back too? In its decision, the IFF urges manufacturers to coordinate innovative products with the association before they reach the market in order to avoid something similar happening again, according to Innebandymagazinet. - That you only believe that you should be able to make a glove in 2026 to sell and play with. It sounds very strange, considering how it is designed too, says Niklas Jihde. The manufacturer does not agree The manufacturer behind the glove, however, shares neither Niklas Jihde's criticism nor the IFF's assessment. To Innebandymagazinet, the company says that the design is not about making the goalkeeper bigger. - We believe that the decision is based on a wrong interpretation of how the product works in actual match situations, says the founder of the company Andis Blinds. Niklas Jihde thinks it is positive that the sport comes into focus and draws a parallel to the WC 2004, when", "title_original": "Rosa handske delar folksporten – profilen rasar: ”Parodi”", "summary_original": "Den rosa handsken har en tygsimhud mellan tummen och pekfingret och påminner om en ishockeyplockhandske. Den har marknadsförts som en banbrytande nyhet för innebandymålvakter och tagits in av flera återförsäljare inför den kommande säsongen. Efter debatt stoppar nu Internationella Innebandyförbundet (IFF) handsken från allt officiellt matchspel, eftersom den strider mot sportens regelverk, rapporterar Innebandymagazinet. – Det är kul när det rörs om lite i grytan, men här känns det som att det kanske är bättre att det blir grytvantar än innebandyhandskar, säger den före detta innebandystjärnan Niklas Jihde till TV4 Nyheterna. ”Vad är nästa grej?” Den numera Viaplay-programledaren menar att handsken är ytterst märklig. Han har svårt att förstå att det ens gått så långt att man trott att den skulle kunna användas på högsta nivå – och att tillverkaren dessutom fått återförsäljare att ta in produkten. – Jag menar, vafan, det finns ju regler i innebandy kring utrustning precis som i ishockey. Du kan ju inte komma med ett par benskydd som täcker hela målet, säger han. – Vad är nästa grej? Att målvakten kan stå med en Batman-mantel på ryggen också? IFF uppmanar i sitt beslut tillverkare att framöver stämma av innovativa produkter med förbundet innan de når marknaden för att undvika att något liknande sker igen, enligt Innebandymagazinet. – Att man bara tror att man ska kunna göra en handske 2026 för att sälja och lira med. Det låter jättekonstigt, med tanke på hur den är utformad också, säger Niklas Jihde. Tillverkaren håller inte med Tillverkaren bakom handsken delar dock varken Niklas Jihdes kritik eller IFF:s bedömning. Till Innebandymagazinet säger företaget att designen inte handlar om att göra målvakten större. – Vi anser att beslutet bygger på en felaktig tolkning av hur produkten fungerar i faktiska matchsituationer, säger grundaren av företaget Andis Blinds. Niklas Jihde tycker att det är positivt att sporten hamnar i fokus och drar en parallell till VM 2004, när landslaget plötsligt behövde spela i linne. – Med massa bleka innebandyspelare från Sverige som skulle ha de där linnena. Det blev ju uppmärksamhet kring det. Men det här tycker jag nästan blir åt det negativa hållet, säger han. – Det är nästan bara parodi att visa att sporten inte har kommit längre än vad den har.", "link": "https://www.tv4.se/artikel/2lnnkF0VhvspzgxDunx09b/rosa-handske-delar-innebandyvaerlden-profiler-rasar-parodi", "date_display": "2026-04-26", "date_iso": "2026-04-26T07:36:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport", "/innebandy", "/trender"]}, {"id": 150, "title": "Beckett the dog has been attacked by wild boar – several times", "summary": "During his seven years of life, the search dog Beckett has been attacked by wild boar on a couple of occasions. Most recently, he was impaled in the groin and had to be rushed to the vet. Search hunter and owner Torkel Norling believes that the damage can be difficult to detect.  - It could just be a drop of blood in the fur, then the bites could have gone in and cut further under the skin. But it can be very serious, so you have to go in and check it out, he says.  This time it went well for Beckett, who is of the East Siberian Laika breed.\n\n- He was cheerful and happy, but it could still have gone badly, continues Torkel Norling. Hunting dogs particularly affected According to the animal insurance company Agria, the number of dogs injured by wild boar increased by 30 percent last year. Above all, it was hunting dogs that were affected and with a growing wild boar tribe, researchers believe that it is a development that we must learn to live with. - If the number of wild boar increases, we must also increase the number of hours we spend in the forest to shoot wild boar. Then of course there is an increased risk of them being injured, says Giorgia Ausilio, researcher at SLU's experimental station Grimsö. Preventive measures There are also preventive measures to take, such as making sure the dog is properly trained and has a safety vest. For Torkel Norling, who almost daily tracks down and approaches injured game, they, like first aid kits and GPS trackers, are an obvious part of the work equipment. But master does not believe in any zero vision.\n\n- It will always happen, but the risks are much smaller if we take our responsibility. Hunters take their responsibility, search hunters take their responsibility to be as efficient as possible and dog owners avoid the densest vegetation where the wild boar searches daily, says Torkel Norling while emphasizing that we must help make the wild boar more shy of humans.\n\n- Don't feed them with composts and such, he concludes.", "title_original": "Hunden Beckett har attackerats av vildsvin – flera gånger", "summary_original": "Eftersökshunden Beckett har under sina sju levnadsår attackerats av vildsvin vid ett par tillfällen. Senast spetsades han i ljumsken och fick köras akut till veterinären. Eftersöksjägaren och husse Torkel Norling menar att skadorna kan vara svåra att upptäcka.  – Det kan vara en bloddroppe i pälsen bara, sedan kan beten ha gått in och skurit längre in under huden. Men det kan vara väldigt allvarligt, så man måste åka in och kolla det, säger han.  Den här gången gick det bra för Beckett, som är av rasen östsibirisk lajka.\n\n– Han var pigg och glad, men det kunde likväl gått illa, fortsätter Torkel Norling. Jakthundar särskilt drabbade Enligt djurförsäkringsbolaget Agria ökade antalet hundar som skadades av vildsvin i fjol med 30 procent. Framför allt var det jakthundar som drabbades och med en växande vildsvinsstam menar forskare att det är en utveckling som vi måste lära oss att leva med. – Ökar antalet vildsvin så måste vi också öka antal timmar vi tillbringar i skogen för att skjuta vildsvin. Då blir det såklart en ökad risk att de skadas, säger Giorgia Ausilio, forskare vid SLU:s försöksstation Grimsö. Förebyggande åtgärder  Det finns samtidigt förebyggande åtgärder att vidta, som att se till att hunden är rätt tränad och har skyddsväst. För Torkel Norling, som så gott som dagligen spårar upp och närmar sig skadat vilt, är de, liksom förstahjälpenkit och gps-spårare en självklar del av arbetsutrustningen. Men någon nollvision tror husse inte på.\n\n– Det kommer alltid hända, men riskerna är mycket mindre om vi tar vårt ansvar. Jägare tar sitt ansvar, eftersöksjägare tar sitt ansvar att vara så effektiva som möjligt och hundägare undviker den allra tätaste vegetationen där vildsvinen söker daglega, säger Torkel Norling samtidigt som han understryker att vi måste hjälpas åt att göra vildsvinen mer skygga för människor.\n\n– Mata inte in dem med komposter och så där, avslutar han.", "link": "https://www.tv4.se/artikel/3W4ES10GsoCSX9ZufenbiY/hunden-beckett-har-attackerats-av-vildsvin-flera-ganger", "date_display": "2026-04-26", "date_iso": "2026-04-26T06:55:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/vildsvin", "/hundar", "/slu", "/jakt"]}, {"id": 151, "title": "Trump on suspected shooter: He hates Christians", "summary": "US President Donald Trump was evacuated and taken to safety", "title_original": "Trump om misstänkte skytten: Han hatar kristna", "summary_original": "USA:s president Donald Trump evakuerades och fördes i säkerhet", "link": "https://www.dagen.se/nyheter/trump-om-misstaenkte-skytten-han-hatar-kristna/10316512", "date_display": "2026-04-26", "date_iso": "2026-04-26T06:06:14+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "The latest chapter in th
