klighet – åsnan Gozo har landat", "summary": "För två månader sedan var Sophia Olsson Jacobsen på festresa till Malta med sina vänner. Efter några glas bubbel slog hon till på ett minst sagt oväntat köp – en åsna!  Dagen efter mindes hon knappt vad som hade hänt. Men köpet var på riktigt och nu har Gozo, döpt efter den maltesiska ön, äntligen kommit till Sverige. – Han trivs bra. Han har smält in väldigt bra i sitt lilla hus som vi har byggt till honom. Han verkar kolugn, berättar Sophia. Oväntad reskompis på vägen Resan från Malta blev längre än planerat. Gozo blev kvar i Italien ett tag, men fick sällskap av ytterligare en åsna som också var på väg till Sverige. \n\n– Han hade ett jättebra resesällskap. Det var värt att vänta, säger Sophia. ”Det känns i plånboken” Att spontanshoppa en åsna är en sak. Att ta hand om den är en annan. \nGozo är fortfarande ung och har nyligen skilts från sin mamma. Nu väntar både omvårdnad, mockning och en hel del gos. \n\n– Man har ju ett ansvar. Han är mer som en fölunge. Åsnor är smarta och envisa och har mycket tankar, säger Sophia. \n\nOch trots att spontaninköpet kostar både tid och pengar verkar hon inte ångra sig. \n\n– Det får man ta när man gör dumma saker i livet. Strålande beslut! Gozo debuterar som Rudolf Den 5 december väntar nästa äventyr. Då ska Gozo besöka Åbytravet tillsammans med Sophia och vännerna. Där ska han både få träffa besökare och gå i luciatåg, som Rudolf med röda mulen. \n\n– Gozo kommer att göra succé säger Sophia.", "title_original": "Fylleköpet blev verklighet – åsnan Gozo har landat", "summary_original": "För två månader sedan var Sophia Olsson Jacobsen på festresa till Malta med sina vänner. Efter några glas bubbel slog hon till på ett minst sagt oväntat köp – en åsna!  Dagen efter mindes hon knappt vad som hade hänt. Men köpet var på riktigt och nu har Gozo, döpt efter den maltesiska ön, äntligen kommit till Sverige. – Han trivs bra. Han har smält in väldigt bra i sitt lilla hus som vi har byggt till honom. Han verkar kolugn, berättar Sophia. Oväntad reskompis på vägen Resan från Malta blev längre än planerat. Gozo blev kvar i Italien ett tag, men fick sällskap av ytterligare en åsna som också var på väg till Sverige. \n\n– Han hade ett jättebra resesällskap. Det var värt att vänta, säger Sophia. ”Det känns i plånboken” Att spontanshoppa en åsna är en sak. Att ta hand om den är en annan. \nGozo är fortfarande ung och har nyligen skilts från sin mamma. Nu väntar både omvårdnad, mockning och en hel del gos. \n\n– Man har ju ett ansvar. Han är mer som en fölunge. Åsnor är smarta och envisa och har mycket tankar, säger Sophia. \n\nOch trots att spontaninköpet kostar både tid och pengar verkar hon inte ångra sig. \n\n– Det får man ta när man gör dumma saker i livet. Strålande beslut! Gozo debuterar som Rudolf Den 5 december väntar nästa äventyr. Då ska Gozo besöka Åbytravet tillsammans med Sophia och vännerna. Där ska han både få träffa besökare och gå i luciatåg, som Rudolf med röda mulen. \n\n– Gozo kommer att göra succé säger Sophia.", "link": "https://www.tv4.se/artikel/7tACdFOhFu4cMSaFuCHApj/fyllekoepet-blev-verklighet-asnan-gozo-har-landat", "date_display": "2026-11-10", "date_iso": "2026-11-10T17:17:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/djur", "/livsoden"]}, {"id": 154, "title": "Rubio hoppfull: ”Väldigt produktiva – men mycket återstår”", "summary": "På tisdagen inleddes trilaterala fredssamtal mellan Ukraina, Ryssland och USA i Abu Dhabi i Förenade Arabemiraten. Enligt ukrainska underrättelsekällor varade samtalen i drygt fyra timmar. Under eftermiddagen svensk tid kommenterade USA:s utrikesminister Marco samtalen och beskrev dem som ”mycket produktiva” – men tillade att mycket arbete kvarstår. – Det är inte något som står i begrepp att lösas inom 24 timmar, men det som verkligen är viktigt är att européerna deltar i samtalen, sade Rubio. Ryssland säger nej Både Rubio och USA:s sändebud Jared Kushner har under dagen uttryckt att ett av målen med mötet är att de trilaterala samtalen på sikt ska utökas och direkt involvera Europa. – Vi tror att en multilateralt format är avgörande för att göra framsteg, säger Kushner. Europa deltar dock inte direkt i samtalen då Ryssland sagt nej till europeiskt deltagande och istället hänvisat till ”separata kommunikationskanaler” mellan Europa, Ukraina och USA. Storbritannien, Frankrike, Tyskland och Italien samt Nato- och EU-representanter uppges ha varit på plats för ”koordineringsmöten” med Ukraina. Bildt: Självklart att Europa ska involveras Tidigare stats- och utrikesminister Carl Bildt säger att det är en självklarhet att Europa ska involveras när europeisk säkerhetsordning diskuteras. Att ryssarna säger nej beror på att de redan vet var Europa står i frågan. – Vi har en säkerhetsordning och har undertecknat massvis med bra avtal med ryssarna genom decennierna. Problemet är att Ryssland våldför sig på dessa principer. Det är inte fråga om nya principer vi behöver – utan respekt för de principer vi har. Det är ett budskap som Ryssland inte vill höra. ”Avledande manöver – Putin vill trappa upp” Samtidigt har Ryssland har åter trappat upp sina attacker mot energiinfrastrukturen i Ukraina. Bara timmar före samtalen inleddes genomförde Ryssland flera attacker mot Ukraina. Nio personer har dödats och sex regioner har varit strömlösa efter attackerna, rapporterar Kyiv Independent.  Carl Bildt tvivlar starkt på att Ryssland alls vill se någon fred.  – Från rysk sida är samtalen något av en avledande manöver. Allt som vi ser och hör tyder på att Putin snarare vill trappa upp kriget mot Ukraina, säger Carl Bildt i Nyhetsdagen. – Han vill föra förhandlingar om något som inte handlar om att stoppa kriget. Då har han fått med sig amerikanarna på att diskutera europeisk säkerhetsordning utan att européerna är närvarande – vilket lindrigt uttryck är något anmärkningsvärt.", "title_original": "Rubio hoppfull: ”Väldigt produktiva – men mycket återstår”", "summary_original": "På tisdagen inleddes trilaterala fredssamtal mellan Ukraina, Ryssland och USA i Abu Dhabi i Förenade Arabemiraten. Enligt ukrainska underrättelsekällor varade samtalen i drygt fyra timmar. Under eftermiddagen svensk tid kommenterade USA:s utrikesminister Marco samtalen och beskrev dem som ”mycket produktiva” – men tillade att mycket arbete kvarstår. – Det är inte något som står i begrepp att lösas inom 24 timmar, men det som verkligen är viktigt är att européerna deltar i samtalen, sade Rubio. Ryssland säger nej Både Rubio och USA:s sändebud Jared Kushner har under dagen uttryckt att ett av målen med mötet är att de trilaterala samtalen på sikt ska utökas och direkt involvera Europa. – Vi tror att en multilateralt format är avgörande för att göra framsteg, säger Kushner. Europa deltar dock inte direkt i samtalen då Ryssland sagt nej till europeiskt deltagande och istället hänvisat till ”separata kommunikationskanaler” mellan Europa, Ukraina och USA. Storbritannien, Frankrike, Tyskland och Italien samt Nato- och EU-representanter uppges ha varit på plats för ”koordineringsmöten” med Ukraina. Bildt: Självklart att Europa ska involveras Tidigare stats- och utrikesminister Carl Bildt säger att det är en självklarhet att Europa ska involveras när europeisk säkerhetsordning diskuteras. Att ryssarna säger nej beror på att de redan vet var Europa står i frågan. – Vi har en säkerhetsordning och har undertecknat massvis med bra avtal med ryssarna genom decennierna. Problemet är att Ryssland våldför sig på dessa principer. Det är inte fråga om nya principer vi behöver – utan respekt för de principer vi har. Det är ett budskap som Ryssland inte vill höra. ”Avledande manöver – Putin vill trappa upp” Samtidigt har Ryssland har åter trappat upp sina attacker mot energiinfrastrukturen i Ukraina. Bara timmar före samtalen inleddes genomförde Ryssland flera attacker mot Ukraina. Nio personer har dödats och sex regioner har varit strömlösa efter attackerna, rapporterar Kyiv Independent.  Carl Bildt tvivlar starkt på att Ryssland alls vill se någon fred.  – Från rysk sida är samtalen något av en avledande manöver. Allt som vi ser och hör tyder på att Putin snarare vill trappa upp kriget mot Ukraina, säger Carl Bildt i Nyhetsdagen. – Han vill föra förhandlingar om något som inte handlar om att stoppa kriget. Då har han fått med sig amerikanarna på att diskutera europeisk säkerhetsordning utan att européerna är närvarande – vilket lindrigt uttryck är något anmärkningsvärt.", "link": "https://www.tv4.se/artikel/1G1ZZ4ppof5JqG3dRthaHo/rubio-hoppfull-vaeldigt-produktiva-men-mycket-aterstar", "date_display": "2026-11-10", "date_iso": "2026-11-10T16:29:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/usa", "/ryssland"]}, {"id": 155, "title": "Kristersson får en vecka till", "summary": "Fortsätter sondera • Kängan mot S: ”Desperation”", "title_original": "Kristersson får en vecka till", "summary_original": "Fortsätter sondera • Kängan mot S: ”Desperation”", "link": "https://www.tv4.se/artikel/rNVZzMXpbK2nIp4Psmd7Y/kristersson-far-en-vecka-till-skyldighet-gentemot-medborgarna", "date_display": "2026-11-10", "date_iso": "2026-11-10T16:05:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/"]}, {"id": 156, "title": "Restauranger skriker efter personal – kräver utbildningsplatser", "summary": "Sedan 2025 får kommunerna prognoser från Skolverket för att anpassa antalet platser på gymnasiet och Komvux efter arbetsmarknadens behov. Men branschorganisationen Visitas bedömning skiljer sig från Skolverkets. Visita vill se fler platser i åtta av landets 21 regioner. – Vi är lite bekymrade över Skolverkets bedömning i flera av de här regionerna som de har gjort bedömningar i. Vi tycker att man inte tar tillräcklig hänsyn till arbetsmarknadens nuvarande behov och det framtida rekryteringsbehovet för besöksnäringen, säger Peter Thomelius, chef för kompetensförsörjning på Visita. Fler platser efterfrågas I Malmö har kommunen lyssnat in branschens behov. I vår startar Komvux en ny utbildning med inriktning på servering. – Det finns enormt behov av att rekrytera personal inom restaurangbranschen. Den senaste statistiken visar att det kommer att finnas behov inom de närmaste fem åren av 137 000 arbetare inom restaurangbranschen i hela Sverige, säger Matteo Valencic, yrkeslärare vid Malmö restaurangskola Komvux. På restaurangutbildningen utbildas elever till ett yrke där jobben är många, och flera har redan fått arbete före examen. Eleven Rabia Bilisi har redan fått jobb efter utbildningen. – Jag ska börja jobba när jag är färdig här i utbildningen. Det känns jättebra, faktiskt. Jättekul, säger Rabia Bilisi. Karriärmöjligheter i branschen Matteo Valencic säger att det också krävs att fler ser möjligheterna att utvecklas och stanna kvar i branschen. – Själv kan man starta som servitör eller bara bära tallrikar. Man kan bli restaurangchef, man kan bli mat- och dryckeschef, man kan bli stor chef på en stor restaurangkoncern, säger Matteo Valencic, yrkeslärare vid Malmö restaurangskola Komvux. – Det är svårt kanske i början. Men när man lär sig så det inte så svårt. Så jag tänkte faktiskt så, säger Rabia Bilisi.", "title_original": "Restauranger skriker efter personal – kräver utbildningsplatser", "summary_original": "Sedan 2025 får kommunerna prognoser från Skolverket för att anpassa antalet platser på gymnasiet och Komvux efter arbetsmarknadens behov. Men branschorganisationen Visitas bedömning skiljer sig från Skolverkets. Visita vill se fler platser i åtta av landets 21 regioner. – Vi är lite bekymrade över Skolverkets bedömning i flera av de här regionerna som de har gjort bedömningar i. Vi tycker att man inte tar tillräcklig hänsyn till arbetsmarknadens nuvarande behov och de r en timmes polisjakt fångades två misstänkta kvinnor.", "link": "https://www.dagen.se/nyheter/nattliga-koppartjuvar-slog-till-mot-allianskyrkan-i-vaernamo/10626143", "date_display": "2026-11-10", "date_iso": "2026-11-10T15:18:11+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Utredning om misstänkt valfusk kopplad till ortodox församling nedlagd", "summary": "Eritreansk-ortodox församling i centrum för polisutredning.", "title_original": "Utredning om misstänkt valfusk kopplad till ortodox församling nedlagd", "summary_original": "Eritreansk-ortodox församling i centrum för polisutredning.", "link": "https://www.dagen.se/nyheter/utredning-om-misstaenkt-valfusk-kopplad-till-ortodox-foersamling-nedlagd/10625279", "date_display": "2026-11-10", "date_iso": "2026-11-10T15:16:42+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Åkesson varnar Kristersson: ”Misstroendevapnet finns där”", "summary": "Hävdar att en regering behöver SD:s stöd • ”Det är kärnvapnet”", "title_original": "Åkesson varnar Kristersson: ”Misstroendevapnet finns där”", "summary_original": "Hävdar att en regering behöver SD:s stöd • ”Det är kärnvapnet”", "link": "https://www.tv4.se/artikel/5NOAf8tk4sQ4ts4MPHoLLv/akesson-varnar-kristersson-misstroendevapnet-finns-daer", "date_display": "2026-11-10", "date_iso": "2026-11-10T13:24:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/"]}, {"id": 160, "title": "Katolsk skola förlorar tillstånd", "summary": "Skolinspektionen drar tillbaka tillståndet för en katolsk skola i Göteborg", "title_original": "Katolsk skola förlorar tillstånd", "summary_original": "Skolinspektionen drar tillbaka tillståndet för en katolsk skola i Göteborg", "link": "https://www.dagen.se/nyheter/katolsk-skola-foerlorar-tillstand/10626660", "date_display": "2026-11-10", "date_iso": "2026-11-10T13:16:35+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "16-åring döms – mördade Gent för 2 000 kronor: ”Hänsynslöshet”", "summary": "På söndagskvällen den 5 juli sköts 19-åriga Gent Maksutaj till döds utomhus på Kvarngärdet i Uppsala. Han träffades av två skott och avled på platsen.  Flera personer blev vittne till mordet. – Jag såg en kropp framför en bil. Folk försökte prata med honom, men fick inget svar. Det var jättesorgligt, säger vittnet Sina Taklimi.  Vittnen såg en misstänkt gärningsperson lämna platsen på cykel. Några timmar senare greps en 16-årig pojke på en snabbmatsrestaurang, misstänkt för mordet på Gent.  Nu har han dömts till fyra år och sex månaders fängelse för mord, förberedelse till mord, grovt vapenbrott samt brott mot lagen om brandfarliga och explosiva varor. Han ska dessutom utvisas från Sverige och betala 390 000 kronor i skadestånd till Gents anhöriga. ”Enligt tingsrättens bedömning har brottet haft sin bakgrund i organiserad brottslighet och det har gällt ett beställningsuppdrag från okända uppdragsgivare i en krypterad app”, skriver Uppsala tingsrätt i ett pressmeddelande. Tvingades filma Polisens förundersökning visar att 16-åringen skulle agera narkotikakund i syfte att skjuta säljaren.  – Utredningen har visat att skytten har befunnit sig i Uppsala i flera dagar för att söka efter sitt tilltänkta offer, och att hans primära mål har varit en annan person än den 19-åring som senare blir ihjälskjuten, säger senior åklagare Mia Sjöstedt i ett pressmeddelande.  Uppdraget var att döda en specifik person vars bild hade skickats till 16-åringen via den krypterade chattjänsten Signal. När han fick syn på mannen som han trodde skulle sälja narkotika filmade han honom och skickade videon till personerna i chatten, som bekräftade att det var rätt person – vilket det inte var.  Mannen som 16-åringen såg var 19-åriga Gent Maksutaj. Pojken försökte först undvika att genomföra skjutningen genom att låtsas ha glömt pengar, men gruppen började då hota honom ytterligare. Han följde då efter Gent och sköt honom från cirka fem meters håll. ”Personerna i telefonen beordrade honom att åka tillbaka och filma offret. När han kom tillbaka såg han att offret rörde sig, varpå han tvingades skjuta en andra gång från cirka en meters håll”, står det i förundersökningen. Greps på Burger King När han skickade över videon fick han frågor om mannen var död. ”Aa”, skrev 16-åringen, varpå de andra svarade med skratt – inklusive skytten själv. Efter mordet cyklade 16-åringen mot Uppsala centralstation, där han lämnade cykeln. Han hade blivit lovad att någon skulle hämta upp honom, men ingen dök upp. Istället fick han hoppa på ett tåg mot Stockholm, där han bland annat skulle göra sig av med vapnet och hämta upp sin betalning – 2 000 kronor. Klockan 02.44, ett par timmar efter mordet, greps han på en Burger King-restaurang i centrala Stockholm.  Ytterligare två personer åtalades för inblandning i mordet. En 33-åring döms nu för grovt vapenbrott för innehav och transport av vapnet som användes vid mordet till fem års fängelse. En 17-åring frikänns från ett åtal om grovt skyddande av brottsling, vilket avsett påstått skyddande av 16-åringen.", "title_original": "16-åring döms – mördade Gent för 2 000 kronor: ”Hänsynslöshet”", "summary_original": "På söndagskvällen den 5 juli sköts 19-åriga Gent Maksutaj till döds utomhus på Kvarngärdet i Uppsala. Han träffades av två skott och avled på platsen.  Flera personer blev vittne till mordet. – Jag såg en kropp framför en bil. Folk försökte prata med honom, men fick inget svar. Det var jättesorgligt, säger vittnet Sina Taklimi.  Vittnen såg en misstänkt gärningsperson lämna platsen på cykel. Några timmar senare greps en 16-årig pojke på en snabbmatsrestaurang, misstänkt för mordet på Gent.  Nu har han dömts till fyra år och sex månaders fängelse för mord, förberedelse till mord, öra sig av med vapnet och hämta upp sin betalning – 2 000 kronor. Klockan 02.44, ett par timmar efter mordet, greps han på en Burger King-restaurang i centrala Stockholm.  Ytterligare två personer åtalades för inblandning i mordet. En 33-åring döms nu för grovt vapenbrott för innehav och transport av vapnet som användes vid mordet till fem års fängelse. En 17-åring frikänns från ett åtal om grovt skyddande av brottsling, vilket avsett påstått skyddande av 16-åringen.", "link": "https://www.tv4.se/artikel/1jXWH3gByeZ5iJqVMFSg8m/16-aring-fick-2-000-kronor-foer-mordet-pa-gent-doems", "date_display": "2026-11-10", "date_iso": "2026-11-10T13:01:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/brott-och-straff", "/uppsala", "/skjutning"]}, {"id": 162, "title": "Varannan kvinna drabbas av urinvägsinfektion", "summary": "Urinvägsinfektion drabbar ungefär hälften av alla kvinnor någon gång i livet. Enligt Helena Kopp Kallner, gynekolog och forskare, ligger förklaringen i kvinnans anatomi. – Bakterierna kommer lättare in eftersom kvinnors urinrör är kortare än männens, säger hon. Sex ökar risken för urinvägsinfektion Infektionen är vanligare hos kvinnor som har sex, eftersom bakterier lättare hamnar nära urinröret. Även klimakteriet innebär en ökad risk eftersom slemhinnorna blir tunnare och immunförsvaret i slemhinnan försämras. – Lokalt östrogen är en oerhört effektiv åtgärd för att förhindra upprepade urinvägsinfektioner hos kvinnor i klimakteriet, säger Helena Kopp Kallner. Hon betonar även vikten av att söka vård om äldre kvinnor plötsligt blir förvirrade. – Det är framför allt ålderspensionärer som kan bli väldigt förvirrade när de får urinvägsinfektion. En av de första sakerna man utesluter är just urinvägsinfektion, säger Kopp Kallner.  Kyla och tranbärsjuice – vad stämmer? Att sitta kallt orsakar inte urinvägsinfektion, menar Helena Kopp Kallner, som säger att det saknas riktigt tydlig evidens för det. – Det är inte farligt att sitta på en kall sten, säger hon. Tranbärsjuice har länge ansetts förebygga infektion, men trots många studier ger forskningen inget entydigt stöd. Enligt Helena Kopp Kallner är det inget man kan rekommendera generellt. – Man kan inte säga: du ska absolut dricka tranbärsjuice, då får du aldrig urinvägsinfektion, säger hon. Symtom att vara uppmärksam på De vanligaste symtomen är sveda vid urinering, täta trängningar och smärta i nedre delen av magen. – Det här kan göra så ont att kvinnorna bara sitter och nästan skriker rakt ut på toaletten, säger Helena Kopp Kallner. Grumlig eller illaluktande urin och blod i urinen kan också förekomma. Helena Kopp Kallner förklarar att blod i urinen är vanligt hos unga kvinnor vid vissa bakterieinfektioner, men att kvinnor över 40 år bör utredas om de får dessa symtom. – Det är helt enkelt för att utesluta att det är något elakartat som ligger bakom att man får blod i urinen, säger hon. När ska man söka vård? Ungefär 30 procent av urinvägsinfektioner kan läka ut av sig själva. Men vid svåra symtom, blod i urinen eller om besvären inte går över, bör man söka vård. – Sitter man och vrålar på toaletten och det kommer blod och man kan inte sova, då ska man ha rätt att söka vård, säger Helena Kopp Kallner.", "title_original": "Varannan kvinna drabbas av urinvägsinfektion", "summary_original": "Urinvägsinfektion drabbar ungefär hälften av alla kvinnor någon gång i livet. Enligt Helena Kopp Kallner, gynekolog och forskare, ligger förklaringen i kvinnans anatomi. – Bakterierna kommer lättare in eftersom kvinnors urinrör är kortare än männens, säger hon. Sex ökar risken för urinvägsinfektion Infektionen är vanligare hos kvinnor som har sex, eftersom bakterier lättare hamnar nära urinröret. Även klimakteriet innebär en ökad risk eftersom slemhinnorna blir tunnare och immunförsvaret i slemhinnan försämras. – Lokalt östrogen är en oerhört effektiv åtgärd för att förhindra upprepade urinvägsinfektio : "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/gynekolog", "/vard", "/sjukvard", "/kvinnlig-sjukvard", "/lakare", "/infektioner"]}, {"id": 163, "title": "Misstänkt mutbrott i Kungälv – stor polisinsats vid stadshuset", "summary": "På tisdagsmorgonen har polisen genomfört en insats på flera adresser i Kungälvs kommun med anledning av misstänkt grov ekonomisk brottslighet. Flera enheter har befunnit sig i stadshuset och det finns kopplingar till ett kommunalt bolag. – Två personer har anhållits misstänkta för givande och tagande av muta. En tredje har hämtats till förhör misstänkt för medhjälp till givande och tagande av muta, säger Jens Andersson, presstalesperson på polisen. Har genomfört husrannsakningar Polisen skriver på sin hemsida att man inte utesluter att fler personer kommer att frihetsberövas framöver.  Husrannsakningar genomförs också inom ramen för utredningen och till TV4 Nyheterna bekräftar polisen att det gjorts beslag.  – Alla de här utredningsinsatserna, husrannsakan och annat är ju i syfte att säkra bevisning och spår till utredningen, säger Jens Andersson, presstalesperson på polisen. ”Stort arbete som ligger framför oss” Polisen kommenterar inte om insatsen även omfattar andra orter men uppger att materialet eventuellt kan kopplas till andra brott.  – Det kommer att vara ett stort material som vi har att gå igenom för att kunna styrka brott och eventuellt också uppdaga annan brottslighet. Det är ett stort arbete som ligger framför oss, säger Jens Andersson, presstalesperson på polisen.", "title_original": "Misstänkt mutbrott i Kungälv – stor polisinsats vid stadshuset", "summary_original": "På tisdagsmorgonen har polisen genomfört en insats på flera adresser i Kungälvs kommun med anledning av misstänkt grov ekonomisk brottslighet. Flera enheter har befunnit sig i stadshuset och det finns kopplingar till ett kommunalt bolag. – Två personer har anhållits misstänkta för givande och tagande av muta. En tredje har hämtats till förhör misstänkt för medhjälp till givande och tagande av muta, säger Jens Andersson, presstalesperson på polisen. Har genomfört husrannsakningar Polisen skriver på sin hemsida att man inte utesluter att fler personer kommer att frihetsberövas framöver.  Husrannsakningar genomförs också inom ramen för utredningen och till TV4 Nyheterna bekräftar polisen att det gjorts beslag.  – Alla de här utredningsinsatserna, husrannsakan och annat är ju i syfte att säkra bevisning och spår till utredningen, säger Jens Andersson, presstalesperson på polisen. ”Stort arbete som ligger framför oss” Polisen kommenterar inte om insatsen även omfattar andra orter men uppger att materialet eventuellt kan kopplas till andra brott.  – Det kommer att vara ett stort material som vi har att gå igenom för att kunna styrka brott och eventuellt också uppdaga annan brottslighet. Det är ett stort arbete som ligger framför oss, säger Jens Andersson, presstalesperson på polisen.", "link": "https://www.tv4.se/artikel/1mIe6wTE59uyhoitDgbOQs/misstaenkt-mutbrott-i-kungaelv-stor-polisinsats-vid-stadshuset", "date_display": "2026-11-10", "date_iso": "2026-11-10T09:57:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/kungalv", "/ekobrott", "/ekonomisk-brottslighet"]}, {"id": 164, "title": "Storbanken varnar: Nu väntar tuffare ekonomiska tider", "summary": "Sveriges ekonomiska tillväxt har gått oväntat snabbt, vilket nu innebär en betydligt lugnare takt framöver, skriver Swedbank i sin nya konjunkturprognos. Medan landets bnp väntas stiga med 2,6 procent i år skruvas den siffran ned till 1,9 procent det kommande året. Inflationen enligt KPIF-måttet kommer att stiga till 2,3 procent 2027, det vill säga över Riksbankens inflationsmål på 2,0 procent. Det gör att den räntehöjning som Riksbanken nyligen genomförde följs av ytterligare en under 2027. Banken poängterar dock att riskerna främst finns på uppsidan och att kriget i Mellanöstern kan bidra till fler räntehöjningar. ”Högre inflation och stigande räntor gör att hushållens köpkraft stärks i långsammare takt, vilket håller tillbaka den inhemska efterfrågan”, skriver Swedbank i rapporten. Livsmedel allt dyrare Detta innebär bland annat att hushållen kan vänta sig en snabbare ökning när det gäller livsmedelspriserna som en konsekvens av högre produktions- och transportkostnader. Räntehöjningar ger en effekt på bostadsmarknaden. Medan bostadspriserna väntas stiga med drygt 3,5 procent i år dämpas uppgången till omkring 2 procent årligen 2027–2028. När det gäller arbetslösheten sker heller ingen radikal nedgång, den väntas sjunka från 8,7 procent i år till 8,3 procent nästa år. I avtalsrörelsen har facken inom industrin redan meddelat sitt lönekrav i form av 3,9 procent med utgångspunkt i ett ettårigt avtal. Swedbank spår dock att man i slutänden enas om ett tvåårigt avtal där löneökningstakten blir 3,3 procent per år. ”Vi bedömer att en löneökningstakt på drygt 3 procent långsiktigt är förenlig med inflation kring målet på 2 procent, det vill säga reallöneökningar på drygt 1 procent per år”, skriver banken.", "title_original": "Storbanken varnar: Nu väntar tuffare ekonomiska tider", "summary_original": "Sveriges ekonomiska tillväxt har gått oväntat snabbt, vilket nu innebär en betydligt lugnare takt framöver, skriver Swedbank i sin nya konjunkturprognos. Medan landets bnp väntas stiga med 2,6 procent i år skruvas den siffran ned till 1,9 procent det kommande året. Inflationen enligt KPIF-måttet kommer att stiga till 2,3 procent 2027, det vill säga över Riksbankens inflationsmål på 2,0 procent. Det gör att den räntehöjning som Riksbanken nyligen genomförde följs av ytterligare en under 2027. Banken poängterar dock att riskerna främst finns på uppsidan och att kriget i Mellanöstern kan bidra till fler räntehöjningar. ”Högre inflation och stigande räntor gör att hushållens köpkraft stärks i långsammare takt, vi  "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "Ditt kräsna barn kan ha allvarlig ätstörning – tusentals drabbas", "summary": "Melinda Sjöstrands 5-åriga son Louie har diagnosen ARFID, undvikande/restriktiv ätstörning. Han kan äta pasta om det är rätt sort och utan tillbehör, eller vitt bröd utan pålägg. Melinda, som själv varit kräsen med mat, märkte redan när han var liten att svårigheterna var mer omfattande. – Han kanske äter en rostmacka om dagen. Louie har vitaminbrister och får tillskott. För familjen är en utmaning att få ihop vardagen med tre barn, där Louie inte äter samma mat som de andra. Stora begränsningar Personer med ARFID kan undvika mat på grund av smak, konsistens eller lukt, eller av rädsla för att kvävas eller kräkas. Ofta finns inget intresse för mat. Ätstörningen handlar inte om vikt eller kroppsuppfattning. Till skillnad från vanlig kräsenhet kan begränsningarna orsaka verklig skada, till exempel näringsbrist, dålig tillväxt eller behov av sondmatning. Mellan 5 och 20 procent av unga som söker vård för ätstörningar uppskattas ha ARFID. – Folk dömer en väldigt fort. Ni har daltat med honom som barn. Han är bara kräsen. Men det här är ju inte frivilligt hos vare sig oss eller honom, säger Melinda Sjöstrand. Studerar arv och erfarenheter En tidigare studie vid Karolinska institutet har visat att ärftligheten är hög. I en ny studie har forskare under två år samlat in DNA-prover och enkäter för att få reda på mer om uppkomsten. – Vi vet fortfarande väldigt lite om orsakerna så därför har vi under två år samlat in DNA-prover och enkäter från över 1 600 barn med ARFID och en jämförelsegrupp och där kommer vi nu undersöka hur genetiska faktorer tillsammans med olika erfarenheter i livet påverkar risken för att utveckla sjukdomen, säger Lisa Dinkler. För Melinda Sjöstrand innebar diagnosen en bekräftelse. – Det var jätteskönt att veta. Jag visste det från början men nu fick jag det liksom svart på vitt att det är de ren. Flera decimeter snö Det är framför allt över Norrlandskusten, östra Svealand och mellersta Norrland som de största snömängderna kan komma. Lokalt kan det bli flera decimeter snö, även i delar av Stockholmstrakten, där väglaget är extra känsligt. – Det är svårt att säga exakta detaljer, men räkna med att fredag den 13:e verkligen kan göra skäl för sitt namn, säger Ulrika Elvgren. Snön och de fallande temperaturerna kan leda till problem i trafiken på flera håll i landet. – Det är bra att se till att man har bytt däck, följa väderläget och avstå från att ge sig ut om man inte måste. I värsta fall finns risk för att man blir stillastående. Kalla grader Från mitten av veckan väntas också temperaturerna sjunka, med dagstemperaturer kring nollan eller någon minusgrad. När snöfallet tar fart kan kylan dessutom bita sig fast ytterligare. Efter snöfallet väntas det kalla vädret hålla i sig under helgen. – Stora delar av Sverige kan få vinterväder, säger Ulrika Elvgren. I början av nästa vecka ser det än så länge ut att bli mildare väder.", "title_original": "Här hotar snökaos: ”Fredag den 13:e kan göra skäl för sitt namn”", "summary_original": "Vintern är på väg att ta ett ordentligt grepp om landet.  Redan under tisdagskvällen väntas snön dra in över Dalarna, Härjedalen och Jämtland. Därefter breder ett mer omfattande snöfall ut sig över mellersta Sverige. Prognosen är fortfarande osäker, men mycket pekar på att snöfallet förvärras under torsdagen och fortsätter in på fredagen. – På fredag verkar det mer eller mindre bli snö på marken i större delen av hela landet, säger TV4:s meteorolog Ulrika Elvgren. Flera decimeter snö Det är framför allt över Norrlandskusten, östra Svealand och mellersta Norrland som de största snömängderna kan komma. Lokalt kan det bli flera decimeter snö, även i delar av Stockholmstrakten, där väglaget är extra känsligt. – Det är svårt att säga exakta detaljer, men räkna med att fredag den 13:e verkligen kan göra skäl för sitt namn, säger Ulrika   function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
