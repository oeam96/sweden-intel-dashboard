, "title_original": "Påven hedrade migranter på USA:s födelsedag", "summary_original": "Påven Leo XIV ägnade den 4 juli genom att åka till Lampedusa och hedra de tiotusentals migranter som dött när de försökt nå frihet och välstånd i Europa.", "link": "https://www.sydsvenskan.se/varlden/paven-hedrade-migranter-pa-usas-fodelsedag/", "date_display": "2026-07-04", "date_iso": "2026-07-04T21:33:35+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "The Danish foreign minister speaks out about the dead police", "summary": "Danish Foreign Minister Løkke Rasmussen comments on the fatal beating by the Swedish police in Copenhagen.", "title_original": "Danske utrikesministern uttalar sig om döde polisen", "summary_original": "Danmarks utrikesminister Løkke Rasmussen kommenterar dödsmisshandeln av den svenske polisen i Köpenhamn.", "link": "https://www.hd.se/sverige/danske-utrikesministern-uttalar-sig-om-dode-polisen/", "date_display": "2026-07-04", "date_iso": "2026-07-04T21:33:15+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "The Danish foreign minister speaks out about the dead police", "summary": "Danish Foreign Minister Løkke Rasmussen comments on the fatal beating by the Swedish police in Copenhagen.", "title_original": "Danske utrikesministern uttalar sig om döde polisen", "summary_original": "Danmarks utrikesminister Løkke Rasmussen kommenterar dödsmisshandeln av den svenske polisen i Köpenhamn.", "link": "https://www.sydsvenskan.se/sverige/danske-utrikesministern-uttalar-sig-om-dode-polisen/", "date_display": "2026-07-04", "date_iso": "2026-07-04T21:33:15+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 87, "title": "The Left Party in the Pride Train: \"All of Malmö hates the police\"", "summary": "Pride parades are usually characterized by love and inclusion. The slogans from the Left Party's part of the Pride Parade were perhaps therefore somewhat unexpected.  But according to Tove Karnerud, chairman of the Left Party in Malmö, the words \"All of Malmö hates the police\" should not be interpreted literally. Instead, they should be seen as a protest against the racism and homophobia that exists within the authority, she states for Sydsvenskan. - We know that there is racism in the police as in many other places, and so there are certain repressive things that we don't like. But of course we don't hate the police as an authority or anything like that. The Left Party does not have such a policy, says Tove Karnerud to the newspaper. Defending the words According to Tove Karnerud, Pride is as much an opportunity to show love as it is a continued fight for various rights. She states that police protests have also formed a significant part of Pride's history. She therefore does not buy that the words would not belong in the parade. - I see absolutely no contradiction to both enjoying joy and celebrating our victories, but at the same time continuing to protest against what we see as problems in society, she says to Sydsvenskan. Gunnar Strömmer: \"Absolutely scandalous\" Sweden's Minister of Justice Gunnar Strömmer is critical of the words.  \"It is actually completely scandalous. To begin with, the context is quite poorly chosen for such messages. Pride stands for the exact opposite of hate - and police are there to guarantee the freedom and safety of everyone who participates,\" he writes in a post on Facebook. Tove Karnerud states for Sydsvenskan that she did not experience any problems from the police who guarded the parade. According to Strömmer, however, the biggest problem is the message itself, that the Left Party in Malmö would hate the police. \"I think of all the thousands of police officers who wake up every day, go to work and do everything they can to keep the rest of us safe and secure, and to keep our children from being drawn into crime and misery. And who, in their basic mission, toil day and night for", "title_original": "Vänsterpartiet i Pridetåget: ”Hela Malmö hatar polisen”", "summary_original": "Prideparader brukar vanligtvis kännetecknas av kärlek och inkludering. Slagorden från Vänsterpartiets del av Pridetåget var kanske därför något oväntade.  Men enligt Vänsterpartiet i Malmös ordförande Tove Karnerud ska orden ”Hela Malmö hatar polisen” inte tolkas bokstavligt. Istället ska de ses på som en protest mot den rasism och homofobi som finns inom myndigheten, uppger hon för Sydsvenskan. – Vi vet ju att det finns rasism inom polisen som på många andra ställen, och så det finns vissa repressiva grejer som vi inte gillar. Men vi hatar så klart inte polisen som myndighet eller så. En sådan politik har inte Vänsterpartiet, säger Tove Karnerud till tidningen. Försvarar orden Enligt Tove Karnerud är Pride lika mycket en möjlighet att visa kärlek som en fortsatt kamp för olika rättigheter. Hon uppger att även polisprotester utgjort en betydande del av Prides historia. Att orden inte skulle höra hemma i paraden köper hon därför inte. – Jag ser absolut ingen motsättning mot att både njuta av glädje och fira våra segrar, men samtidigt fortsätta protestera mot det som vi ser som problem i samhället, säger hon till Sydsvenskan. Gunnar Strömmer: ”Helt skandalöst” Sveriges justitieminister Gunnar Strömmer är kritisk till orden.  ”Det är faktiskt helt skandalöst. Till att börja med är ju sammanhanget rätt illa valt för sådana budskap. Pride står för raka motsatsen till hat – och poliser finns där för att garantera friheten och tryggheten för alla som deltar”, skriver han i ett inlägg på facebook. Tove Karnerud uppger för Sydsvenskan att hon inte upplevde några problem från de poliser som bevakade paraden. Enligt Strömmer är dock det största problemet budskapet i sig, att Vänsterpartiet i Malmö skulle hata polisen. ”Jag tänker på alla tusentals poliser som vaknar varje dag, går till jobbet och gör allt de kan för att alla vi andra ska vara trygga och säkra, och för att våra barn inte ska dras in i brottslighet och elände. Och som i sitt grunduppdrag sliter dag och natt för att Sverige ska förbli ett fritt och öppet samhälle. De förtjänar inte hat. Utan respekt, uppskattning och allas vår omsorg”, skriver han. ”Kliv fram, förklara er och ta ansvar”, avslutar han inlägget och riktar sig till partiledarna i Vänsterpartiet och Socialdemokraterna, Nooshi Dadgostar (V) och Magdalena Andersson (S). TV4 Nyheterna har sökt Tove Karnerud.", "link": "https://www.tv4.se/artikel/1Lkxixmy3zNpeRwNj4pdlM/vaensterpartiet-i-pridetaget-hela-malmoe-hatar-polisen", "date_display": "2026-07-04", "date_iso": "2026-07-04T20:42:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/valet-2022/vansterpartiet", "/valet-2022/moderaterna", "/gunnar-strommer", "/pride", "/malmo", "/polisen"]}, {"id": 88, "title": "Surveillance video shows: Hiding in utility room", "summary": "Careful planning preceded the Russian couple's proposal atop the Empire State Building earlier this week. To get the 443 meters into the air, they had to cut open padlocks, loosen fasteners - and spend the night in a secret room.", "title_original": "Övervakningsfilm visar: Gömde sig i driftrum", "summary_original": "Noggrann planering föregick det ryska parets frieri på toppen av Empire State Building tidigare i veckan. För att ta sig de 443 metrarna upp i luften behövde de klippa upp hänglås, lossa fästen – och övernatta i ett hemligt rum.", "link": "https://www.svd.se/a/oE9JzR/friade-pa-toppen-av-empire-state-building-sa-gick-det-till", "date_display": "2026-07-04", "date_iso": "2026-07-04T20:03:21+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 89, "title": "\"Sis was the gateway to hell\"", "summary": "Katarina remembers her son Viktor's absent eyes. The smell of sweat when she found him after the escape. Little did she know then that he would soon be suspected of murder.", "title_original": "”Sis var inkörsporten till helvetet”", "summary_original": "Katarina minns sonen Viktors frånvarande ögon. Lukten av svett när hon hittade honom efter rymningen. Då visste hon inte att han snart skulle bli misstänkt för mord.", "link": "https://www.svd.se/a/k0poMv/sis-var-inkorsporten-till-helvetet", "date_display": "2026-07-04", "date_iso": "2026-07-04T20:02:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 90, "title": "The home nation eliminated - Morocco through to the quarter-finals", "summary": "Priced victory - key player injured", "title_original": "Hemmanationen utslagen – Marocko vidare till kvartsfinal", "summary_original": "Dyrköpt seger – nyckelspelaren skadad", "link": "https://www.tv4.se/artikel/4QTnJZCqGLp8X70giqqjNq/hemmanationen-utslagen-marocko-vidare-till-kvartsfinal", "date_display": "2026-07-04", "date_iso": "2026-07-04T20:02:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport"]}, {"id": 91, "title": "Man sentenced after shocking discovery: Had 217 grams of the deadly drug - in the ceiling", "summary": "The deadly drug was found by chance in connection with an investigation by the Environmental Crime Agency last winter. When the ceiling of one of the suspected eco-criminals' offices in the Stockholm area was searched, tablets and a small amount of powder were found. At the time, they did not know what kind of substance it was, but initially suspected that it was only doping preparations. But when the analysis results came, the investigators got a shock. It involved 184 grams of powder with a purity of 80 percent and 24,682 tablets containing nitazene. Together, the seizure corresponded to around 217 grams of active substance of the extremely potent drug. Ten years in prison The substance is a thousand times stronger than morphine, several hundred times worse than heroin and much stronger than fentanyl. Since 2019, when the deadly drug began to spread, the Swedish Customs Service has only made a few seizures of the substance. The new synthetic opioid has claimed hundreds of lives in Europe.  - It could be a grain of salt, then you have taken an overdose, said Erik Lindeman, chief physician at the Poison Information Center who also testified during the trial, to TV4 Nyheterna earlier. Metonitazen, which belongs to the nitazene drug group, is estimated to have caused 40 deaths in Sweden since 2020. - We often get calls when people have overdosed on various substances and need hospital treatment. But we are rarely asked about nitazenes and fentanyls in particular. The people who take these tablets are found dead, and do not have time to call the Poisons Information Centre. On Friday, a 45-year-old man, previously convicted murderer, was sentenced for the discovery of 217 grams of nitazene. He was also convicted of, among other things, a number of serious money laundering offences, accounting offenses and fraud. The sentence was ten years in prison. Could manufacture 100,000 death tablets The seizure is described as significant because several Swedish authorities have for several years tried to prevent the spread of nitazene in Sweden. According to the man himself, he was going to resell the narcotics, but has stated that he did not know that it was about skr", "title_original": "Man döms efter skräckfynd: Hade 217 gram av dödsdrogen –  i taket", "summary_original": "Den livsfarliga drogen hittades av en slump i samband med en utredning av Ekobrottsmyndigheten i vintras. När man sökte igenom innertaket på en av de misstänkta ekobrottslingarnas kontor i Stockholmsområdet hittades tabletter och en mindre mängd pulver. Man visste inte då vad det handlade om för substans utan misstänkte till en början att det enbart var dopingpreparat. Men när analyssvaren kom fick utredarna en chock. Det handlade om 184 gram pulver med en renhetsgrad på 80 procent och 24 682 tabletter innehållande nitazen. Tillsammans motsvarade beslaget omkring 217 gram aktiv substans av den extremt potenta drogen. Tio års fängelse Substansen är tusen gånger starkare än morfin, flera hundra gånger värre än heroin och mycket starkare effekt än fentanyl. Sedan 2019, när dödsdrogen började spridas, har Tullverket bara gjort ett fåtal beslag av substansen. Den nya syntetiska opioiden har skördat hundratals liv i Europa.  – Det kan röra sig om ett saltkorn, så har du tagit en överdos, sa Erik Lindeman, överläkare på Giftinformationscentralen som också vittnade under rättegången, till TV4 Nyheterna tidigare. Metonitazen, som tillhör droggruppen nitazener, bedöms ha orsakat 40 dödsfall i Sverige sedan 2020. – Vi blir ofta uppringda när folk överdoserat olika substanser och behöver sjukhusvård. Men just nitazener och fentanyler blir vi sällan tillfrågade om. Människorna som tar de här tabletterna hittas döda, och hinner inte ringa Giftinformationscentralen. På fredagen dömdes en man i 45-årsåldern, tidigare dömd mördare, för fyndet av 217 gram nitazener. Han fälldes även för bland annat en rad grova penningtvättsbrott, bokföringsbrott och bedrägerier. Straffet blev tio års fängelse. Kunde tillverka 100 000 dödstabletter Beslaget beskrivs som betydelsefullt eftersom flera svenska myndigheter under flera år försökt förhindra en spridning av nitazener i Sverige. Enligt mannen själv skulle han sälja vidare narkotikan men har uppgett att han inte visste att det handlade om skräckdrogen, något tingsrätten inte tror på. I stället menar domstolen att det varit ”synnerligen hänsynslöst” att mannen blandat ut drogen till tabletter för att sälja vidare dessa. ”Om det skulle hamna tre saltkorn av den aktiva substansen i en tablett innehåller den en trippeldos. Det går alltså inte att bereda detta hemma med våg och degblandare. (...) Tabletter tillverkade på detta sätt blir därmed extremt farliga i missbrukarledet”, skriver tingsrätten i domen. Domstolen framhåller också att mannen tillverkat närmare 25 000 tabletter och haft möjlighet att tillverka ytterligare drygt 100 000, vilket bedöms ha inneburit en mycket stor fara.  ”Sammanfattningsvis har gärningen alltså avsett en synnerligen stor mängd narkotika och varit av synnerligen farlig och hänsynslös art varför brottet ska rubriceras som ett synnerligen grovt narkotikabrott”, står det i domen.", "link": "https://www.tv4.se/artikel/4hyCkrTmFiRCkZocR5KGIu/man-doems-efter-skraeckfyndet-217-gram-av-doedsdrog", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:55:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/narkotikabrott", "/brott", "/stockholm"]}, {"id": 92, "title": "Expensive victory for Morocco - the star out injured", "summary": "Morocco is through to the quarter-finals of the World Cup. The nation can thank Azzedine Ounahi for that. He became a big hero by scoring two of the goals in the 3–0 win over Canada in Houston.", "title_original": "Dyrköpt seger för Marocko – stjärnan ut skadad", "summary_original": "Marocko är vidare till kvartsfinal i VM. Det kan nationen tacka Azzedine Ounahi för. Han blev stor hjälte genom att göra två av målen i 3–0-segern över Kanada i Houston.", "link": "https://www.sydsvenskan.se/sport/ounahis-stora-show-hjalte-for-marocko/", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:53:05+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 93, "title": "Here, three busloads of volunteers from Malmö and Lund are helping out at Roskilde", "summary": "At this year's Roskilde edition, significantly more Danish and Norwegian can be heard than Swedish on the campsites and in the public areas. Last year, there were twice as many northern hornbills as Swedes who visited the festival. But among the volunteers, the Swedish representation looks better - not least from Mejeriet, which this year has bused 136 tagged young Lunda and Malmö residents to serve beer to thirsty visitors and guard passages.", "title_original": "Här hjälper tre busslaster med volontärer från Malmö och Lund till på Roskilde", "summary_original": "På årets Roskilde-upplaga hörs det betydligt mer danska och norska än svenska på campingarna och i publikhaven. Förra året var det dubbelt så många norrbaggar som svenskar som besökte festivalen. Men bland volontärerna ser den svenska representationen bättre ut – inte minst från Mejeriet, som i år har bussat ner 136 taggade unga Lunda- och Malmöbor för att servera öl till törstiga besökare och vakta passager.", "link": "https://www.sydsvenskan.se/dygnet-runt/har-hjalper-tre-busslaster-med-mejeriet-volontarer-till-pa-roskilde/", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:46:36+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Jonstorp residents are advised to boil their drinking water", "summary": "The work to fix the water leak in Jonstorp is now complete, Höganäs municipality writes on its website. However, as a safety measure, residents are advised to boil drinking water \"until further notice.\"", "title_original": "Jonstorpsbor rekommenderas att koka dricksvattnet", "summary_original": "Arbetet med att laga vattenläckan i Jonstorp är nu slutfört, skriver Höganäs kommun på sin sajt. Men som en säkerhetsåtgärd rekommenderas invånarna att koka dricksvattnet ”tills vidare.”", "link": "https://www.hd.se/hoganas/jonstorpsbor-rekommenderas-att-koka-dricksvattnet/", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:46:22+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Expensive victory for Morocco - the star out injured", "summary": "Morocco is through to the quarter-finals of the World Cup. The nation can thank Azzedine Ounahi for that. He became a big hero by scoring two of the goals in the 3–0 win over Canada in Houston.", "title_original": "Dyrköpt seger för Marocko – stjärnan ut skadad", "summary_original": "Marocko är vidare till kvartsfinal i VM. Det kan nationen tacka Azzedine Ounahi för. Han blev stor hjälte genom att göra två av målen i 3–0-segern över Kanada i Houston.", "link": "https://www.hd.se/sport/ounahis-stora-show-hjalte-for-marocko/", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:32:06+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Ounahi's big show – hero for Morocco", "summary": "Morocco is through to the quarter-finals of the World Cup. The nation can thank Azzedine Ounahi for that. He became a big hero by scoring two of the goals in the 3–0 win over Canada in Houston.", "title_original": "Ounahis stora show – hjälte för Marocko", "summary_original": "Marocko är vidare till kvartsfinal i VM. Det kan nationen tacka Azzedine Ounahi för. Han blev stor hjälte genom att göra två av målen i 3–0-segern över Kanada i Houston.", "link": "https://www.dn.se/sport/ounahis-stora-show-hjalte-for-marocko/", "date_display": "2026-07-04", "date_iso": "2026-07-04T19:17:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "SMHI warns: There will be torrential rain here", "summary": "Sunday's downpour warning in eastern Svealand also covers parts of southern Gävleborg and is valid between 11:00 a.m. and 6:00 p.m. \"During Sunday, showers are expected which, mainly in the afternoon, can become heavy and produce large amounts of rain in a short time, 30-50 millimeters. Locally with thunder. During the evening, the showers will subside,\" writes SMHI. The authority urges residents in the area to seal their basements, clear gutters and move items that could be damaged by the amounts of rain. Roads and viaducts may also be flooded. Motorists planning to hit the roads are therefore advised to take care and avoid driving through the water accumulations. \"Travel times may be longer as there may be poor visibility and risk of hydroplaning. Allow more time for your journey and adjust your speed,\" writes SMHI. Rain warning for central Norrland SMHI has also issued a yellow warning for rain in central Norrland. The warning area includes Umeå, Örnsköldsvik and Lycksele and applies from 16.00 on Sunday 5 July to 06.00 on Monday 6 July. \"During Sunday and Monday, rain or showers can produce large amounts of rain, 50-80 millimeters, possibly more. The rain can initially locally be downpour-like,\" writes SMHI. Within the area, however, large variations in the amount of rain are expected. There, too, road users are asked to allow more time for their journeys and adjust their speed. Tourists are advised to wash themselves in the sea At the same time as the rain is expected to pour down over parts of central and northern Sweden, SMHI announces that there is a risk of groundwater shortage in large parts of Götaland. The counties covered are: Västra Götaland, Jönköping, Kalmar, Gotland, Kronoberg, Skåne and Blekinge. Due to the water shortage, Region Gotland, in collaboration with a number of hotels, has issued an appeal to tourists visiting the island to wash themselves in the sea instead, reports Aftonbladet. A special salt water soap can therefore be picked up at the tourist office in Visby and at the hotels that have entered into the collaboration. For Halland County", "title_original": "SMHI varnar: Här blir det skyfall", "summary_original": "Söndagens skyfallsvarning i östra Svealand omfattar även delar av södra Gävleborg och gäller mellan klockan 11.00 och 18.00. ”Under söndagen väntas skurar som främst på eftermiddagen kan bli kraftiga och ge stora regnmängder på kort tid, 30-50 millimeter. Lokalt med åska. Under kvällen mattas skurarna av”, skriver SMHI. Myndigheten uppmanar boende inom området att täta sina källare, rensa hängrännor och flytta föremål som kan skadas av regnmängderna. Vägar och viadukter kan också översvämmas. Trafikanter som planerar att ge sig ut på vägarna uppmanas därför att ta det försiktigt och undvika att köra genom vattenansamlingarna. ”Restider kan bli längre då det kan vara dålig sikt och risk för vattenplaning. Avsätt längre tid för din resa och anpassa hastigheten”, skriver SMHI. Regnvarning för mellersta Norrland SMHI har även utfärdat en gul varning för regn i mellersta Norrland. Varningsområdet omfattar bland annat Umeå, Örnsköldsvik och Lycksele och gäller från klockan 16.00 på söndagen den 5 juli till klockan 06.00 på måndagen den 6 juli. ”Under söndag och måndag regn eller skurar kan ge stora regnmängder, 50-80 millimeter, möjligen mer. Regnet kan till en början lokalt vara skyfallsliknande”, skriver SMHI. Inom området väntas dock stora variationer i mängden regn. Även där uppmanas trafikanter avsätta längre tid för sina resor och anpassa hastigheten. Turister uppmanas tvätta sig i havet Samtidigt som regnet väntas ösa ner över delar av mellersta och norra Sverige meddelar SMHI att det råder risk för grundvattenbrist i stora delar av Götaland. Länen som omfattas är: Västra Götaland, Jönköping, Kalmar, Gotland, Kronoberg, Skåne och Blekinge. Med anledning av vattenbristen har Region Gotland, i samarbete med ett antal hotell, gått ut med en uppmaning till turister som besöker ön att istället tvätta sig i havet, rapporterar Aftonbladet. En särskild saltvattenstvål finns därför att hämta ut på turistbyrån i Visby och på de hotell som ingått samarbetet. För Hallands län gäller risk för vattenbrist i vattendrag med bland annat låga flöden i Lagan, Viskan, och Ätran.", JD Vance på självständighetsdagen hårt åt landets kritiker.", "link": "https://www.svd.se/a/JOvP08/jd-vance-kritiserade-kritiker-under-firandet", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:24:44+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 106, "title": "Americans celebrate America's 250th birthday in Washington", "summary": "WASHINGTON DC. Despite 40-degree heat in Washington DC and the cancellation of the 4th of July parade, Americans are making the pilgrimage to the capital and the celebration of America's 250th birthday. DN meets three participants. - The President owns this moment. I salute him for that, says African-American Carlos Canty.", "title_original": "Amerikaner firar USA:s 250-årsdag i Washington", "summary_original": "WASHINGTON DC. Trots 40-gradig hetta i Washington DC och inställd 4 juli-parad vallfärdar amerikaner till huvudstaden och firandet av USA:s 250-årsdag. DN träffar tre deltagare. – Presidenten äger det här ögonblicket. Jag saluterar honom för det, säger afroamerikanska Carlos Canty.", "link": "https://www.dn.se/varlden/amerikaner-firar-usas-250-arsdag-i-washington/", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:11:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "Blood Rot, part 15 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 15 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-15-av-57/", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "DN Debate. \"Life is full of risks - live with it\"", "summary": "DN DEBATE. What are you going to die of today? The possibilities are endless, as a loud chorus of commercial players is happy to inform. We are told to check our health, get into better habits - simply keep death at bay. And happy to pay a penny on the way. No wonder we feel worse than ever, writes public health scientist Karl Gauffin.", "title_original": "DN Debatt. ”Livet är fyllt av risker – lev med det”", "summary_original": "DN DEBATT. Vad ska du dö av i dag? Möjligheterna är oändliga, vilket en högljudd kör av kommersiella aktörer gärna upplyser om. Vi uppmanas kolla hälsan, skaffa oss bättre vanor – helt enkelt hålla döden på avstånd. Och gärna betala en slant på vägen. Inte konstigt att vi mår sämre än någonsin, skriver folkhälsovetaren Karl Gauffin.", "link": "https://www.dn.se/debatt/livet-ar-fyllt-av-risker-lev-med-det/", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Helsingborg woman pretended to hug boyfriend - stabbed him in the back", "summary": "The woman pretended to give her boyfriend a hug. But instead she stabbed him in the back with a folding knife. Now she is sentenced to prison.", "title_original": "Helsingborgskvinna låtsades krama pojkvän – högg honom i ryggen", "summary_original": "Kvinnan låtsades vilja ge sin pojkvän en kram. Men istället högg hon honom i ryggen med en fällkniv. Nu döms hon till fängelse.", "link": "https://www.hd.se/helsingborg/helsingborgskvinna-latsades-krama-pojkvan-hogg-honom-i-ryggen/", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Helsingborg woman pretended to hug boyfriend - stabbed him in the back", "summary": "The woman pretended to give her boyfriend a hug. But instead she stabbed him in the back with a folding knife. Now she is sentenced to prison.", "title_original": "Helsingborgskvinna låtsades krama pojkvän – högg honom i ryggen", "summary_original": "Kvinnan låtsades vilja ge sin pojkvän en kram. Men istället högg hon honom i ryggen med en fällkniv. Nu döms hon till fängelse.", "link": "https://www.sydsvenskan.se/skane/helsingborgskvinna-latsades-krama-pojkvan-hogg-honom-i-ryggen/", "date_display": "2026-07-04", "date_iso": "2026-07-04T18:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Melania Trump strengthens her agenda: \"Is focused\"", "summary": "With her \"Fostering the Future\" initiative, Melania Trump has stepped away from her previously relatively hidden role as first lady. Children's rights are on her agenda. - She only talks about subjects that no one can get angry about, says Professor Erik Åsard.", "title_original": "Melania Trump stärker sin agenda: ”Är fokuserad”", "summary_original": "Med sitt initiativ ”Fostering the Future” har Melania Trump gjort avsteg från sin tidigare relativt undanskymda roll som presidentfru. På hennes agenda står barns rättigheter. – Hon talar bara om ämnen som ingen kan bli arg över, säger professorn Erik Åsard.", "link": "https://www.dn.se/varlden/melania-trump-starker-sin-agenda-ar-fokuserad/", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:57:21+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Løkke Rasmussen laughs and praises the USA", "summary": "On Saturday, the United States celebrates its 250th anniversary as a nation. For Denmark's Foreign Minister Lars Løkke Rasmussen, developments in the USA have in some respects been a \"personal disappointment\".", "title_original": "Løkke Rasmussen risar och rosar USA", "summary_original": "Under lördagen firar USA 250-årsjubileum som nation. För Danmarks utrikesminister Lars Løkke Rasmussen har utvecklingen i USA i vissa avseenden varit en ”personlig besvikelse”.", "link": "https://www.svd.se/a/aJ3rVO/loekke-rasmussen-risar-och-rosar-usa", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:57:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 113, "title": "China's \"silver fox\" wants to win over Sweden in the EU", "summary": "Foreign Minister Wang Yi is on a unique Nordic tour. The powerful Chinese diplomat wants to find win-win solutions, says UI professor Björn Jerdén - \"but that comes with risks.\"", "title_original": "Kinas ”silverräv” vill vinna över Sverige i EU", "summary_original": "Utrikesminister Wang Yi är på unik Nordenturné. Den mäktige kinesiska diplomaten vill hitta win-win-lösningar, säger UI-professorn Björn Jerdén – ”men det kommer med risker.”", "link": "https://www.svd.se/a/OkWR0A/wang-yi-forsta-kinesiska-utrikesminister-att-besoka-sverige-pa-22-ar", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:56:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 114, "title": "\"The caterpillar from hell\" is spreading in Denmark", "summary": "A poisonous caterpillar has caused terror in Odense, Denmark. Residents are raising the alarm about allergic reactions and rashes - some have even fled their homes. Now the residents are demonstrating against the authorities' handling of the \"caterpillar from hell\".", "title_original": "”Larven från helvetet” sprids i Danmark", "summary_original": "En giftig larv har satt skräck i danska Odense. Boende larmar om allergiska reaktioner och utslag – vissa har till och med flytt sina hem. Nu demonstrerar invånarna mot myndigheternas hantering av ”larven från helvetet”.", "link": "https://www.svd.se/a/y5meXE/giftig-larv-satter-skrack-i-danmark", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:55:21+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 115, "title": "Trump's spectacular celebration is threatened by heat", "summary": "On Saturday, the celebration of America's 250th anniversary is expected to reach its crescendo when Trump has promised a long speech - and hundreds of thousands of fireworks. At the same time, the national day is threatened by the heat - and in several places celebrations have already had to be cancelled.", "title_original": "Trumps spektakulära firande hotas av hetta", "summary_original": "Under lördagen väntas firandet av USA:s 250-årsjubileum nå sitt crescendo när Trump utlovat ett långt tal – och hundratusentals fyrverkerier. Samtidigt hotas nationaldagen av värmen – och på flera platser har festligheter redan fått ställas in.", "link": "https://www.svd.se/a/0p3wk2/usa-fyller-250-trumps-firande-hotas-av-rekordvarme", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:54:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 116, "title": "Fast cars and yachts - the Chinese businessman's promise of regime change funded luxury living in the US", "summary": "With promises to bring down the Communist Party, Chinese businessman Guo Wengui tricked Chinese exiles in the United States into investing billions. Behind him he had heavy figures in the Trump sphere. But it was all a sham to finance a life of excess, according to a verdict handed down this week. Guo denies the allegations.", "title_original": "Snabba bilar och lustjakter – kinesiske affärsmannens löfte om regimskifte finansierade lyxliv i USA", "summary_original": "Med löften om att få kommunistpartiet på fall lurade den kinesiska affärsmannen Guo Wengui exilkineser I USA att investera miljardbelopp. Bakom sig hade han tunga personer i Trumpsfären. Men allt var en bluff för att finansiera ett liv i överflöd, enligt en dom som föll i veckan. Guo nekar till anklagelserna.", "link": "https://www.dn.se/varlden/snabba-bilar-och-lustjakter-kinesiske-affarsmannens-lofte-om-regimskifte-finansierade-lyxliv-i-usa/", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:47:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "The purple, the couch potatoes and ordinary people – these are the voters that the electoral generals are fighting for", "summary": "Baudin, Borgs and Bäckström. The men who steer the electoral movement in the three largest parties are fighting for the desirable middle voters. If the election goes badly, it is they themselves who can smoke. - Had I wished that the gap would have narrowed? Yes, of course. But it is in the real election campaign that it is decided, says the Moderates' election general Martin Borgs.", "title_original": "De lila, soffliggarna och vanliga människor – det är väljarna som valgeneralerna slåss om", "summary_original": "Baudin, Borgs och Bäckström. Männen som rattar valrörelsen i de tre största partierna slåss om de åtråvärda mittenväljarna. Går det dåligt i valet är det de själva som kan ryka. – Hade jag önskat att gapet skulle ha minskat? Ja, självklart. Men det är i den riktiga valrörelsen det avgörs, säger Moderaternas valgeneral Martin Borgs.", "link": "https://www.dn.se/sverige/de-lila-soffliggarna-och-vanliga-manniskor-det-ar-valjarna-som-valgeneralerna-slass-om/", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:18:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Large overview: Here is the easiest way to find student housing this autumn", "summary": "Even though the school year is over, many students are still in Uppsala. One of them is Jona Lindhe, who lives in a student apartment with his girlfriend.  - It's like a security to know that you have somewhere to live. You have somewhere to cook, you can be inside in the winter when it's cold. It's really great, he says.  From small to medium good chance in Uppsala, the chance of getting a student residence has gone from small to medium good, which according to the municipal housing company has several reasons. It is about construction, improved coordination between the housing brokers and increased checks on who is really studying and thus has the right to a student residence.  Solves for many \"Average chance\" roughly means according to Jenny Wikström, expert on student housing at Uppsalahem: - It solves for many during the first semester. So that's the condition: Dare to accept the place and come to Uppsala! Very good chance at a majority of study locations. But in several other classic and attractive study locations, such as Lund and Linköping, the chance for student accommodation is now very good. The only places where it is still difficult are Kiruna and Gothenburg. Different variants Stina Olén at Studentbostadsföretagen comments on the situation in Gothenburg. - Here we have a continued need for construction to catch up with what is in demand. \n\nBut as a student you still have to be open to different accommodation options, such as student corridors or living a bit outside the city centre. But the chance to upgrade your accommodation from a corridor room to your own apartment during the study years is great.  Hanad Abdullahi in Uppsala knows that.  - To go from the corridor life to his first one. It was a step into adulthood that was quite pleasant.", "title_original": "Stor genomgång: Här hittar du enklast studentbostad i höst", "summary_original": "Trots att läsåret är slut befinner sig fortfarande många studenter kvar i Uppsala. En av dem är Jona Lindhe som bor i en studentlägenhet tillsammans med sin flickvän.  - Det är som en trygghet att veta att man har någonstans att leva. Man har någonstans att laga mat, man kan vara inne på vintern när det är kallt. Det är superskönt verkligen, säger han.  Från liten till medelgod chans i Uppsala har chansen att få en studentbostad gått från liten till medelgod, vilket enligt det kommunala bostadsbolaget har flera orsaker. Det handlar om byggande, förbättrad samordning mellan bostadsförmedlarna samt ökade kontroller av vem som verkligen studerar och därmed har rätt till en studentbostad.  Löser sig för många \"Medelgod chans\" betyder ungefär enligt Jenny Wikström, sakkunnig på studentbostäder på Uppsalahem: - Det löser sig för väldigt många under den första terminen. Så det är medskicket: Våga tacka ja till platsen och kom till Uppsala! Mycket god chans på en majoritet studieorter. Men i flera andra klassiska och attraktiva studieorter, som Lund och Linköping, är chansen till studentboende numera mycket god. De enda orter där det fortfarande är svårt är Kiruna och Göteborg. Olika varianter Stina Olén på Studentbostadsföretagen kommenterar situationen i Göteborg. - Här har vi ett fortsatt byggbehov för att komma i kapp med det som efterfrågas. \n\nMen du måste fortfarande som student vara öppen för olika alternativ av boenden, som studentkorridor eller att bo en bit utanför centrum. Men chansen att under studieåren uppgradera sitt boende från ett korridorsrum till en egen lägenhet är stor.  Det vet Hanad Abdullahi i Uppsala.  - Att gå från korridorslivet till sin första etta. Det var ett steg in i vuxenlivet som var ganska trevlig.", "link": "https://www.tv4.se/artikel/2kWEMWZwXyuAdTt5x8Ba46/stor-genomgang-haer-aer-det-enklast-att-hitta-studentbostad-i-hoest", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:10:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/bostader", "/student"]}, {"id": 119, "title": "Leader: This is how Sweden can benefit from fewer children being born", "summary": "With smart policies, Sweden can come out of the declining birth rate stronger. However, the government is doing the opposite of what is needed.", "title_original": "Ledare: Så kan Sverige vinna på att det föds färre barn", "summary_original": "Med smart politik kan Sverige gå stärkt ur det sjunkande barnafödandet. Regeringen gör dock motsatsen till vad som behövs.", "link": "https://www.dn.se/ledare/sa-kan-sverige-vinna-pa-att-det-fods-farre-barn/", "date_display": "2026-07-04", "date_iso": "2026-07-04T17:08:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Forward leaves Rögle: \"Has meant more to me than anything else\"", "summary": "Emily Gustafson leaves after three seasons in the green jersey. - It has been three of the happiest years of my life, she says on Rögle's website.", "title_original": "Forward lämnar Rögle: ”Har betytt mer för mig än något annat”", "summary_original": "Emily Gustafson lämnar efter tre säsonger i den gröna tröjan. – Det har varit tre av de lyckligaste åren i mitt liv, säger hon på Rögles webbplats.", "link": "https://www.hd.se/sport/back-lamnar-rogle-har-betytt-mer-for-mig-an-nagot-annat/", "date_display": "2026-07-04", "date_iso": "2026-07-04T16:44:23+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Chinese top visit to Stockholm - trade in focus", "summary": "Chinese Foreign Minister Wang Yi was received by Prime Minister Ulf Kristersson (M) and Foreign Minister Maria Malmer Stenergard (M) in Stockholm on Saturday - the first visit by a Chinese foreign minister to Sweden in 22 years. The trade relationship with China was one of the most important items on the agenda.", "title_original": "Kinesiskt toppbesök i Stockholm – handel i fokus", "summary_original": "Kinas utrikesminister Wang Yi togs emot av statsminister Ulf Kristersson (M) och utrikesminister Maria Malmer Stenergard (M) i Stockholm under lördagen – det första besöket som en kinesisk utrikesminister gör till Sverige på 22 år. Handelsrelationen till Kina var en av de viktigaste punkterna på dagordningen.", "link": "https://www.hd.se/sverige/kinas-utrikesminister-i-sverige-ukraina-pa-agendan/", "date_display": "2026-07-04", "date_iso": "2026-07-04T16:38:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Britain's Department of Culture leaves Musk's social platform in protest", "summary": "Britain's Culture Secretary has written her final post on X. Now her entire department is leaving Elon Musk's social platform - in protest against an \"unhealthy\" environment characterized by \"disinformation\".", "title_original": "Brittiska kulturdepartementet lämnar Musks sociala plattform i protest", "summary_original": "Storbritanniens kulturminister har skrivit sitt sista inlägg på X. Nu lämnar hela hennes departement Elon Musks sociala plattform – i protest mot en ”ohälsosam” miljö som präglas av ”desinformation”.", "link": "https://www.dn.se/kultur/brittiska-kulturdepartementet-lamnar-musks-sociala-plattform-i-protest/", "date_display": "2026-07-04", "date_iso": "2026-07-04T16:36:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Danes demonstrate against the \"caterpillar from hell\"", "summary": "In Odense, Denmark, a demonstration is taking place on Saturday to draw attention to the problems with the \"caterpillar from hell\". \"No to caterpillars, yes to people,\" reads a placard.", "title_original": "Danskar demonstrerar mot ”larven från helvetet”", "summary_original": "I danska Odense pågår på lördagen en demonstration för att uppmärksamma problemen med ”larven från helvetet”. ”Nej till larver, ja till människor”, står det på ett plakat.", "link": "https://www.dn.se/varlden/danskar-demonstrerar-mot-larven-fran-helvetet/", "date_display": "2026-07-04", "date_iso": "2026-07-04T16:27:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Chinese top visit to Stockholm - trade in focus", "summary": "During a provisional press meeting outside the Ministry of Foreign Affairs in central Stockholm, Foreign Minister Maria Malmer Stenergard told TT that the EU is more united now than before when it comes to the issue of the trade relationship with China. The statement is made against the background that the EU's 27 member states want to pursue a tougher policy to reduce China's trade influence in the union. We are united that we must achieve competition on equal terms. The EU is also ready to take steps to achieve it. It is important that our Swedish companies can compete on equal terms globally, says Maria Malmer Stenergard to TT. The war in Ukraine China has positioned itself as a potential peace broker in the Ukraine war. At the same time, the country is accused of partly supporting Russia financially in its warfare, and partly training Russian soldiers - an accusation that the EU recently directed at Beijing. The war in Ukraine was a key issue raised by the foreign minister during the meeting with Wang Yi, but no clear progress has been made in the discussion. Malmer Stenergard does not want to comment on the response she received from Wang Yi. But it is clear that we have two different views on the issue, she says. Gui Minhai Sweden's demand that the Swedish-Chinese publisher Gui Minhai be released was also a clear point during today's meeting. Minhai, who was arrested in 2015 on charges of \"providing intelligence to a foreign power\", has been detained in China for more than ten years. We are told that he is in good health. We will continue to work for his release, says Maria Malmer Stenergard.", "title_original": "Kinesiskt toppbesök i Stockholm – handel i fokus", "summary_original": "Under en provisorisk pressträff utanför utrikesdepartementet i centrala Stockholm, säger utrikesministern Maria Malmer Stenergard till TT att EU är mer enat nu än tidigare när det gäller frågan om handelsrelationen till Kina. Uttalandet sker mot bakgrund av att EU:s 27 medlemsländer vill driva en hårdare politik för att minska Kinas handelsinflytande i unionen. Vi är enade om att vi måste få till konkurrens på lika villkor. EU är också berett att vidta åtgärder för att uppnå det. Det är viktigt att våra svenska företag kan konkurrera på lika villkor globalt, säger Maria Malmer Stenergard till TT. Kriget i Ukraina Kina har positionerat sig som en potentiell fredsmäklare i Ukrainakriget. Samtidigt anklagas landet för att dels stötta Ryssland ekonomiskt i sin krigföring, dels träna ryska soldater – en anklagelse som EU nyligen riktat mot Peking. Kriget i Ukraina var en nyckelfråga som utrikesministern lyfte under mötet med Wang Yi, men några tydliga framsteg har inte uppnåtts i diskussionen. Malmer Stenergard vill inte kommentera vilken respons hon fick från Wang Yi. Men det är uppenbart att vi har två olika syn på frågan, säger hon. Gui Minhai Även Sveriges krav på att den svensk-kinesiske förläggaren Gui Minhai ska friges var en tydlig punkt under dagens möte. Minhai som greps 2015, anklagad för att ha ”försett främmande makt med underrättelser”, har varit frihetsberövad i Kina i mer än tio år. Vi får höra att han är vid god hälsa. Vi kommer fortsätta att arbeta för att han ska släppas, säger Maria Malmer Stenergard.", "link": "https://www.tv4.se/artikel/tt-260704-kinamote1-61bc3626/kinesiskt-toppbesok-i-stockholm-handel-i-fokus", "date_display": "2026-07-04", "date_iso": "2026-07-04T16:18:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ulf Kristersson", "/ulf-kristersson", "/ukraina", "/ryssland", "/brott", "/stockholm", "/kina", "/sverige", "/maria-malmer-stenergard", "/inrikes", "/utrikespolitik"]}, {"id": 125, "title": "Jonna Bornemark: We need a policy that dares to see our existential crisis", "summary": "Existential crises usually affect individuals, where one is forced to question what was previously taken for granted. But with climate threats, democracy crisis and AI development, it is now happening at the societal level. So where are the policies that meet it? writes the philosopher Jonna Bornemark ahead of the autumn parliamentary elections.", "title_original": "Jonna Bornemark: Det behövs en politik som vågar se vår existentiella kris", "summary_original": "Existentiella kriser brukar drabba enskilda personer, där man tvingas ifrågasätta det som tidigare tagits för givet. Men med klimathot, demokratikris och AI-utveckling sker det nu på samhällsnivå. Så var finns politiken som möter det? skriver filosofen Jonna Bornemark inför höstens riksdagsval.", "link": "https://www.dn.se/kultur/jonna-bornemark-det-behovs-en-politik-som-vagar-se-var-existentiella-kris/", "date_display": "2026-07-04", "date_iso": "2026-07-04T15:34:53+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Despite a dream start - Halmstad remains at the bottom", "summary": "Hussein Carneil gave his Halmstad a festive start when the Allsvenskan restarted. But the joy was short-lived, Västerås turned around and won.", "title_original": "Trots drömstart – Halmstad kvar i botten", "summary_original": "Hussein Carneil gav sitt Halmstad en kalasstart när allsvenskan återstartade. Men glädjen blev kortvarig, Västerås vände och vann.", "link": "https://www.hd.se/sport/trots-dromstart-halmstad-kvar-i-botten/", "date_display": "2026-07-04", "date_iso": "2026-07-04T15:31:58+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "1,100 firefighters are fighting fires in Portugal", "summary": "Around 1,100 firefighters are battling in the heat to control a growing wildfire in Portugal.", "title_original": "1 100 brandmän bekämpar brand i Portugal", "summary_original": "Omkring 1 100 brandmän kämpar i hettan för att få kontroll över en växande terrängbrand i Portugal.", "link": "https://www.hd.se/varlden/1-100-brandman-bekampar-brand-i-portugal/", "date_display": "2026-07-04", "date_iso": "2026-07-04T15:26:56+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Helsingborg residents taste unusual cans", "summary": "A luxury dinner that fits in your pocket - with a shelf life of several years. Preserves don't have to be as monotonous and boring as many people think. Isaac West is the student in Helsingborg who knows most about the finest in canning.", "title_original": "Helsingborgare provsmakar ovanliga konservburkar", "summary_original": "En lyxmiddag som får plats i fickan – med en hållbarhet på flera år. Konserver behöver inte vara så enahanda och trista som många tror. Isaac West är studenten i Helsingborg som vet det mesta om det finaste i konservväg.", "link": "https://www.hd.se/helsingborg/helsingborgare-provsmakar-ovanliga-konservburkar/", "date_display": "2026-07-04", "date_iso": "2026-07-04T15:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Protesting - against the insect: \"No to larvae, yes to humans\"", "summary": "Recently, the oak processionary spider, popularly known as the \"caterpillar from hell\", has taken over the Danish city of Odense. The caterpillar has caused itching, rashes and allergic reactions – and has even caused residents to flee their homes. As a result, residents gathered in Odense, Denmark, on Saturday for a demonstration against the municipality's handling of the oak processionary pinnacle. - I have seen placards that say \"We want our lives back without larvae\" and \"No to larvae, yes to humans\", Danish TV2's reporter Carl Neimann reported from the demonstration. \"Must be taken seriously\" Other placards showed messages such as \"away with the caterpillar and send it back to hell\" and \"the caterpillar is holding us hostage in our homes\". Among the participants was Martin Christensen, who hopes that the issue will receive more attention. - We have this problem, and it must be taken seriously right from the start, preferably before it spreads to Copenhagen, he says to TV2. Behind the demonstration is the \"Medborg network against the oak procession spinner\".  One of the organizers is Alexander Boe, who previously surveyed the situation in his area and concluded that a large majority of households were affected by symptoms such as itching and rashes. Requires concrete measures Now the network wants to see action from the municipality. - Now it's about us focusing on making sure that this dialogue is actually translated into concrete action, he says. According to him, a citizens' meeting on Friday left many residents with the same question: how experiences from other countries should be translated into concrete measures in Odense. - This is not about us being against something. It's about us focusing on something that affects many people, he says.", "title_original": "Protesterar – mot insekten: ”Nej till larver, ja till människor”", "summary_original": "På senare tid har ekprocessionspinnaren, i folkmun känd som ”larven från helvetet”, intagit den danska staden Odense. Larven har orsakat klåda, utslag och allergiska reaktioner – och har till och med fått invånare att fly sina hem. Som en följd av det samlades därför boende i danska Odense under lördagen för en demonstration mot kommunens hantering av ekprocessionspinnaren. – Jag har sett plakat där det står ”Vi vill ha tillbaka våra liv utan larver” och ”Nej till larver, ja till människor”, rapporterade danska TV2:s reporter Carl Neimann från demonstrationen. ”Måste tas på allvar” Andra plakat visade budskap som ”bort med larven och skicka tillbaka den till helvetet” och ”larven håller oss som gisslan i våra hem”. Bland deltagarna fanns Martin Christensen, som hoppas att frågan ska få större uppmärksamhet. – Vi har det här problemet, och det måste tas på allvar redan från början, helst innan det hinner sprida sig till Köpenhamn, säger han till TV2. Bakom demonstrationen står ”Medborgarnätverket mot ekprocessionsspinnaren”.  En av organisatörerna är Alexander Boe, som tidigare kartlagt situationen i sitt område och kommit fram till att en stor majoritet av hushållen drabbats av symtom som klåda och utslag. Kräver konkreta åtgärder Nu vill nätverket se handling från kommunen. – Nu handlar det om att vi fokuserar på att se till att den här dialogen faktiskt omsätts i konkret handling, säger han. Enligt honom lämnade ett medborgarmöte på fredagen många boende med samma fråga: hur erfarenheter från andra länder ska omsättas i konkreta åtgärder i Odense. – Det här handlar inte om att vi är emot något. Det handlar om att vi fokuserar på något som påverkar många människor, säger han.", "link": "https://www.tv4.se/artikel/2P4XRlCbCp4a83tnWtyjxr/protesten-mot-skraeckkrypet-nej-till-larver-ja-till-maenniskor", "date_display": "2026-07-04", "date_iso": "2026-07-04T14:47:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/danmark", "/politiker", "/djur", "/djur-och-natur"]}, {"id": 130, "title": "Landskrona Bois was defeated away by Örby", "summary": "", "title_original": "Landskrona Bois besegrades borta av Örby", "summary_original": "", "link": "https://www.hd.se/sport/hemmaplan/landskrona-bois-besegrades-borta-av-orby/", "date_display": "2026-07-04", "date_iso": "2026-07-04T14:12:42+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Swedish volunteer injured in Russian drone attack: \"It went very quickly\"", "summary": "The attack occurred at a gas station after the aid organization Send Forward to Ukraine made a delivery. - It happened very quickly and there were no flight alarms, so it was difficult to predict that this would happen, says Kristina Leivik. Had to help the injured on the spot A group of volunteers had stopped to refuel when a Shahed drone suddenly crashed and the Swedish volunteer suffered shrapnel injuries, something P4 Sörmland was the first to report on. - The person was slightly injured, but parts of our team had to give first aid on the spot to people who were very injured, says Kristina Leivik. The group had left their 31st emergency convoy when the attack occurred. - We had finished our deliveries, both civilian and military, and were on our way west, says Kristina Leivik. \"Will continue our work\" The team is traveling on Saturday to get to safety, but the incident will not stop their future work: \"We will not give up! Terror must not win,\" the organization writes in a statement. - We will seek security now but then we will continue our work. It feels even more important when something like this happens. For the civilians who are on the ground in Ukraine and live in this every day, says Kristina Leivik.  The organization Send on to Ukraine supports Ukraine both civilly and militarily and has carried out a large number of trips to Ukraine with various supplies and vehicles.", "title_original": "Svensk volontär skadad i rysk drönarattack: ”Gick väldigt snabbt”", "summary_original": "Attacken inträffade vid en bensinstation efter att hjälporganisationen Skicka vidare till Ukraina genomfört en leverans. – Det gick väldigt snabbt och det gick inga flyglarm, så det var svårt att förutse att detta skulle hända, säger Kristina Leivik. Fick hjälpa skadade på plats En grupp volontärer hade stannat för att tanka när en Shahed-drönare plötsligt slog ner och den svenska volontären fick splitterskador, något P4 Sörmland var först att rapportera om. – Personen skadades lindrigt, men delar av vårt team fick ge första hjälpen på plats till människor som var väldigt skadade, säger Kristina Leivik. Gruppen hade lämnat sin 31:a nödkonvoj när attacken inträffade. – Vi hade avslutat våra leveranser, både civila och militära, och var på väg västerut, säger Kristina Leivik. ”Kommer fortsätta vårt arbete” Teamet reser under lördagen för att sätta sig i säkerhet, men händelsen kommer inte att stoppa deras framtida arbete: ”Vi ger inte upp! Terrorn får inte vinna”, skriver organisationen i ett uttalande. – Vi kommer att söka säkerhet nu men sedan kommer vi fortsätta vårt arbete. Det känns ännu viktigare när sådant här händer. För de civila som finns på plats i Ukraina och lever i det här varje dag, säger Kristina Leivik.  Organisationen Skicka vidare till Ukraina stöttar Ukraina både civilt och militärt och har genomfört ett stort antal resor till Ukraina med olika förnödenheter och fordon.", "link": "https://www.tv4.se/artikel/76H7bHCk8WuXdjJd2wkN17/svensk-volontaer-skadad-i-ukraina", "date_display": "2026-07-04", "date_iso": "2026-07-04T10:11:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten"]}, {"id": 132, "title": "Tom's wife fell ill with Alzheimer's: \"She both exists and does not exist\"", "summary": "Love took them both by storm when they met just over 30 years ago. At the time, Lena was a woman in the middle of life who loved her job and travel and who always saw the positive in life.  - It was like an explosion, love at first sight. We were always together and suddenly one is gone. The disease crept up, but in the fall of 2022 it was no longer possible to turn a blind eye to the fact that something was not right when Lena began to have a personality change.  - Yes, ugh, she became aggressive. At first it was just a few slaps, but then there were ten a day and it ended with a police intervention. And only then was she investigated and diagnosed with Alzheimer's, says Tom Westman.  Since then, Lena lives in a nursing home for people with dementia, where the couple meet almost daily. The emptiness and sadness remain, but Tom is not alone in his situation.  Finding support According to the National Association of Relatives, there are currently around 1.7 million adults who care for or support a relative. And to cope, Tom has found strength in the association's member group.  - It is an incredible support. Because there we can talk freely about joy and sorrow and we can both laugh and cry together. Can you give any advice to others who have a relative become very ill? \n\n- Seek the support that is available because you will benefit from it. Alone is not strong.", "title_original": "Toms fru insjuknade i Alzheimers: \"Hon både finns och inte finns\"", "summary_original": "Kärleken tog dem båda med storm när de träffades för drygt 30 år sedan. Då var Lena en kvinna mitt i livet som älskade sitt jobb och resor och som alltid såg det positiva i tillvaron.  – Det var som en explosion, kärlek vid första ögonkastet. Vi var alltid ihop och plötsligt är en borta. Sjukdomen smög sig på men hösten 2022 gick det inte längre att blunda för att något inte stod rätt till då Lena börjat bli personlighetsförändrad.  – Ja, usch, hon blev aggressiv. Först var det bara någon dask, men sedan blev det tio om dagen och det slutade med ett polisingripande. Och först då blev hon utredd och fick diagnosen Alzheimer, berättar Tom Westman.  Sedan dess bor Lena på ett äldreboende för demenssjuka där paret träffas nästan dagligen. Tomheten och sorgen finns kvar, men Tom är inte ensam om sin situation.  Finner stöd  Enligt Anhörigas riksförbund finns idag runt 1,7 miljoner vuxna som vårdar eller stöttar en anhörig. Och för att orka har Tom hittat styrka hos förbundets medlemsgrupp.  – Det är ett oerhört stöd. För där kan vi prata fritt om glädje och sorg och vi kan både skratta och gråta ihop. Kan du ge något råd till andra som får en anhörig som blir väldigt sjuk? \n\n– Sök det stöd som finns för man kommer att ha nytta av det. Ensam är inte stark.", "link": "https://www.tv4.se/artikel/NdhjcbVmowQL1Xt7K7Cb5/toms-fru-insjuknade-i-alzheimers-hon-bade-finns-och-inte-finns", "date_display": "2026-07-04", "date_iso": "2026-07-04T08:51:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/alzheimers", "/vard"]}, {"id": 133, "title": "Every sixth woman feels pain during intercourse: \"Not normal\"", "summary": "Hanna Hellgren often meets women who seek treatment for other ailments and where conversations about pain during intercourse only come up later. - It is an intimate matter to talk about. Patients or people who have these difficulties may feel ashamed and may not know what help is available. Then you avoid it and hope someone else asks the question, she says.  Several possible causes The causes of pain during intercourse are many. Infections such as bacterial vaginosis are common but often involve more complex conditions such as vulvodynia.  - Vulvodynia is a collective term for if you have pain in the abdomen and this is the most common cause of intercourse pain. The most common is to visit a health centre, but in some places in Sweden you apply directly to a gynecological clinic. The doctor does something and checks how it looks with the mucous membranes.  Hanna Hellgren says that sometimes medical treatment is relevant, but many times it is other professional groups such as physiotherapists, counselors and midwives who help.  Other common causes of intercourse pain are dry mucous membranes, eczema, birth injuries, endometriosis and vaginismus. - It is not always so easy to say that it is one thing. Often it's an interaction between different things you've been involved in, says Hellgren. Recommendations Hellgren also recommends relaxation exercises, exploring one's sexuality and using so-called dilators, i.e. tools in different sizes. - You want to teach the body that the touch that takes place in the abdomen is not dangerous. It doesn't have to hurt. The partner can play a big role A committed partner can be an important support and can help to acquire knowledge and find solutions, says Hellgren.  - Many women I meet in both my role as a doctor and as a sex coach think: \"Okay, I'm in pain. This is my problem. I have to solve this\". But sex is never something that one person has to deliver, but it is an interaction, an experience that you create together.\n\nShe emphasizes that sex b", "title_original": "Var sjätte kvinna känner smärta vid samlag: ”Inte normalt”", "summary_original": "Hanna Hellgren möter ofta kvinnor som söker för andra besvär och där samtalen om smärta vid samlag kommer fram först senare. –  Det är en intim fråga att prata om. Patienter eller personer som har de här svårigheterna kanske skäms och så kanske man inte vet vilken hjälp som finns att få. Då undviker man det och hoppas någon annan ställer frågan, säger hon.  Flera möjliga orsaker Orsakerna till smärta vid samlag är många. Infektioner som bakteriell vaginos är vanliga men ofta handlar det om mer komplexa tillstånd som vulvodyni.  – Vulvodyni är ett samlingsbegrepp för om man har smärtor i underlivet och det här är den vanligaste orsaken till samlagssmärtor. Det vanligaste är att besöka vårdcentral men i vissa ställen i Sverige söker man direkt till en gynekologisk mottagning. Läkaren gör en del och kollar hur det ser ut med slemhinnor.  Hanna Hellgren säger att det ibland är aktuellt med medicinsk behandling men många gånger är det andra yrkesgrupper som fysioterapeuter, kuratorer och barnmorskor som hjälper till.  Andra vanliga orsaker till samlagssmärtor är torra slemhinnor, eksem, förlossningsskador, endometrios och vaginism. – Det är inte alltid så lätt att säga att det är en sak. Ofta är det ett samspel mellan olika saker man har varit med om, säger Hellgren. Rekommendationer Hellgren rekommenderar också avslappningsövningar, att utforska sin sexualitet och att använda så kallade dilatorer, alltså redskap i olika storlekar. – Man vill lära kroppen att beröringen som sker i underlivet inte är farlig. Den behöver inte göra ont. Partnern kan spela stor roll En engagerad partner kan vara ett viktigt stöd och som kan hjälpa till att skaffa kunskap och hitta lösningar, menar Hellgren.  – Många kvinnor jag träffar i både som rollen som läkare och som sexcoach tänker: ”Okej, jag har ont. Det här är mitt problem. Jag måste lösa det här”. Men sex är aldrig någonting som en person ska leverera utan det är ju ett samspel, en upplevelse man skapar ihop.\n\nHon betonar att sex behöver inte alltid innebära penetration utan att det finns många sätt att ha ett bra sexliv även om smärtan finns kvar. – Många uthärdar eller tänker att det gör ont ibland eller i början men så ska det inte vara. Det ska vara smärtfritt och väldigt skönt.", "link": "https://www.tv4.se/artikel/4E2iwRb6QPI3JfezYiSfXy/var-sjaette-kvinna-kaenner-smaerta-vid-samlag", "date_display": "2026-07-04", "date_iso": "2026-07-04T08:44:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/sex", "/sjukvard"]}, {"id": 134, "title": "Khamenei's funeral begins today - millions are expected to attend", "summary": "Large security requirement: \"There is a risk\"", "title_original": "Khameneis begravning inleds i dag – miljontals väntas delta", "summary_original": "Stort säkerhetspådrag: ”Finns en risk”", "link": "https://www.tv4.se/artikel/5V8J4XGhlH3FeYtHeSkgst/miljontals-vaentas-delta-vid-khameneis-begravning", "date_display": "2026-07-04", "date_iso": "2026-07-04T07:28:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon"]}, {"id": 135, "title": "The union confirms: \"Using methods that are not okay\"", "summary": "", "title_original": "Facket bekräftar: ”Använder metoder som inte är okej”", "summary_original": "", "link": "https://www.tv4.se/artikel/5xEdMMrZ85LIWXmBug9eLE/facket-bekraeftar-anvaender-metoder-som-inte-aer-okej", "date_display": "2026-07-04", "date_iso": "2026-07-04T07:13:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 136, "title": "Abuse of power and bullying at Tre: \"A hell to work there\"", "summary": "Ten employees tell • Tobias raised a problem - got fired • Manager caught Miranda on the ass", "title_original": "Maktmissbruk och mobbning på Tre: ”Ett helvete att jobba där”", "summary_original": "Tio anställda berättar • Tobias lyfte problem – fick sparken • Chef tog Miranda på rumpan", "link": "https://www.tv4.se/artikel/4eApijIyZTmNDDG7UBnZin/maktmissbruk-och-mobbning-pa-tre-det-var-ett-helvete-att-jobba-daer", "date_display": "2026-07-04", "date_iso": "2026-07-04T07:09:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 137, "title": "Lemon pie with elderberry mousse", "summary": "Today's weekend tip offers an elegant pie-shaped cake where fresh lemon cream meets smooth elderberry mousse and a beautifully splashed floral pattern of fluffy and sweet Italian meringue.  See Roy Fare's Recipe", "title_original": "Citronpaj med flädermousse", "summary_original": "Dagens helgtips bjuder på en elegant tårta i pajform där frisk citronkräm möter len flädermousse och ett vackert spritsat blommönster av fluffig och söt italiensk maräng.  Se Roy Fares Recept", "link": "https://www.tv4.se/artikel/2WTrHiRAgrww0Z4hhC5WpS/citronpaj-med-flaedermousse", "date_display": "2026-07-04", "date_iso": "2026-07-04T05:31:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/kokets-helgtips", "/roy-fares", "/koket"]}, {"id": 138, "title": "I have a hard time understanding the Norway hatred", "summary": "\"Outright ridiculous\" • Little brother overtakes big brother", "title_original": "Jag har svårt att fatta Norge-hatet", "summary_original": "”Direkt löjligt” • Lillebror kör om storebror", "link": "https://www.tv4.se/artikel/368s6ovtePvmddzfIGL4CW/jag-har-svart-att-fatta-norge-hatet", "date_display": "2026-07-04", "date_iso": "2026-07-04T04:24:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 139, "title": "Cape Verde out – forcing Argentina into extra time", "summary": "Praised by Argentina's national team captain: \"A really tough match\"", "title_original": "Kap Verde utslaget – tvingade Argentina till förlängning", "summary_original": "Hyllades av Argentinas förbundskapten: ”En riktigt tuff match”", "link": "https://www.tv4.se/artikel/6FMRE0KMoxg6SKe3UsqSoO/kap-verde-utslaget-tvingade-argentina-till-foerlaengning", "date_display": "2026-07-04", "date_iso": "2026-07-04T04:21:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport"]}, {"id": 140, "title": "Cries of revenge during Khamenei's funeral: \"Death to the US\"", "summary": "During the days of the ceremony, many will be on the lookout for Khamenei's son Mojtaba Khamenei. He was appointed supreme leader a week after his father was killed. So far, however, he has not appeared in public but has only communicated through written statements. Mojtaba Khamenei is said to have been injured, but the extent of his injuries has not been clarified. The courtyard is filled with people, and people walk several kilometers to get to the place. People at the scene are shouting \"death to the US\" and \"revenge\", according to AFP. We came because we promised the supreme leader that we would stand by his side until the end, says the 37-year-old university professor Reza. For a long time we shouted that we would sacrifice our lives for the leader, but it was he who sacrificed himself for us.  Khamenei will lie in repose in the parade until Monday, when a procession will pass through the capital, Tehran.  Ongoing for six days Extensive traffic restrictions have been introduced. The funeral of the ayatollah, who was killed in US-Israeli strikes on the first day of the war, is to last six days. According to Iranian authorities, between 15 and 20 million people are expected to participate in Tehran alone over the next three days. Ali Khamenei ruled the country from 1989 until his death at the age of 86.", "title_original": "Rop på hämnd under Khameneis begravning:  ”Död åt USA”", "summary_original": "Under de dagar ceremonin pågår kommer många att hålla utkik efter Khameneis son Mojtaba Khamenei. Han utsågs till högste ledare en vecka efter att fadern dödats. Hittills har han dock inte framträtt offentligt utan har endast kommunicerat genom skriftliga uttalanden. Mojtaba Khamenei sägs ha skadats, men omfattningen av hans skador har inte klargjorts. Gårdsplanen är fylld med folk, och människor går flera kilometer för att ta sig till platsen. Personer på platsen ropar ”död åt USA” och ”hämnd”, enligt AFP. Vi kom eftersom vi lovade den högste ledaren att vi skulle stå vid hans sida in i det sista, säger den 37-årige universitetsprofessorn Reza. Under lång tid ropade vi att vi skulle offra våra liv för ledaren, men det var han som offrade sig för oss.  Khamenei kommer att ligga på lit de parade fram till måndag, då en procession kommer att passera genom huvudstaden Teheran.  Pågår i sex dagar  Omfattande trafikbegränsningar har införts. Begravningen av ayatollan, som dödades i amerikansk-israeliska anfall på krigets första dag, ska pågå i sex dagar. Enligt iranska myndigheter väntas mellan 15 och 20 miljoner människor delta enbart i Teheran de kommande tre dagarna. Ali Khamenei styrde landet från 1989 till sin död vid 86 års ålder.", "link": "https://www.tv4.se/artikel/tt-260704-irankhamenei1-1e4f61ec/rop-pa-hamnd-under-khameneis-begravning", "date_display": "2026-07-04", "date_iso": "2026-07-04T02:56:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Irankriget", "/irankriget", "/utrikes", "/usa", "/krig", "/iran", "/irak", "/teheran"]}, {"id": 141, "title": "Taylor Swift and Travis Kelce have married - in front of 1,000 guests", "summary": "On screens outside appeared the text “JUST&T MARRIED”, in a pun with the couple's first names. Swift's brother Austin Swift had a role equivalent to a bridesmaid. Kelce's brother Jason Kelce was the marshal. It is stated that the couple worked \"in close collaboration\" with a designer from Christian Dior to create the wedding clothes. Many famous people had previously made their way to Madison Square Garden where the wedding celebration between Taylor Swift and Travis Kelce was expected to be held. Star dense among the guests \nAmong other things, the actor Hugh Grant arrived together with his Swedish wife Anna Eberstein. Artist Benson Boone and talk show host Jimmy Kimmel were also spotted arriving, as well as singer Camila Cabello and model Karlie Kloss. The two 36-year-olds began their rewritten romance in 2023. Travis Kelce plays American football, and plays for the NFL team Kansas City Chiefs. According to previous information from AP, the wedding party can last until ten o'clock, Swedish time. There are reports that Stevie Nicks will perform during the celebration. Phones are also said to have been banned in the venue, according to The Guardian. Lit in blue The Empire State Building in New York lit up in blue to mark the wedding, and an account linked to the building writes \"her something blue\" on the X, referring to the phrase that the bride should have something old, something new, something borrowed and something blue in connection with a wedding. The star couple is not the first to host a wedding in Madison Square Garden. As early as 1974, Sly Stone got married there, and in 1982, 2,075 couples were married at the same time during a mass wedding arranged by the Moon sect. Taylor Swift fans stood outside Madison Square Garden for hours as the wedding guests arrived.", "title_original": "Taylor Swift och Travis Kelce har gift sig – inför 1 000 gäster", "summary_original": "På skärmar utanför syntes texten “JUST&T MARRIED”, i en ordlek med parets förnamn. Swifts bror Austin Swift hade en roll som motsvarade en brudtärna. Kelces bror Jason Kelce var marskalk. Det uppges att paret arbetat ”i nära samarbete” med en designer från Christian Dior för att skapa bröllopskläderna. Många kända personer hade tidigare tagit sig till Madison Square Garden där bröllopsfirandet mellan Taylor Swift och Travis Kelce väntades hållas. Stjärntätt bland gästerna \nBland annat anlände skådespelaren Hugh Grant tillsammans med sin svenska fru Anna Eberstein. Artisten Benson Boone och pratshowvärden Jimmy Kimmel sågs också komma till platsen, såväl som sångaren Camila Cabello och modellen Karlie Kloss. De båda 36-åringarna inledde sin omskrivna romans 2023. Travis Kelce spelar amerikansk fotboll, och spelar för NFL-laget Kansas City Chiefs. Bröllopsfesten kan enligt tidigare uppgifter från AP pågå ända fram till klockan tio, svensk tid. Det finns uppgifter om att Stevie Nicks kommer att uppträda under firandet. Telefoner uppges också ha förbjudits i lokalen, enligt The Guardian. Lyste i blått Empire State Building i New York lyste i blått för att uppmärksamma bröllopet, och ett konto kopplat till byggnaden skriver ”hennes något blått” på X, syftandes till uttrycket att bruden ska ha något gammalt, något nytt, något lånat och något blått i samband med ett bröllop. Stjärnparet är inte det första att ställa till med bröllop i Madison Square Garden. Redan 1974 gifte sig Sly Stone där, och 1982 vigdes 2 075 par samtidigt under ett massbröllop arrangerat av Moonsekten. Taylor Swift-fans stod utanför Madison Square Garden i timmar medan gästerna till bröllopet anlände.", "link": "https://www.tv4.se/artikel/tt-260704-taylorswift1-1db8d036/taylor-swift-och-travis-kelce-har-gift-sig", "date_display": "2026-07-03", "date_iso": "2026-07-03T22:57:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/konst", "/taylor-swift", "/kultur", "/hugh-grant", "/jimmy-kimmel"]}, {"id": 142, "title": "Details: US warned Iran of Israeli assassination plot", "summary": "The US feared Israel might try to kill two of Iran's top political figures during sensitive peace talks earlier this year. This is stated by the New York Times, which refers to current and former US officials. According to the newspaper, concerns grew in the spring when the United States and Iran held talks about a possible agreement that could lead to a cease-fire and continued negotiations on Iran's nuclear energy program. Warned Iran through other countries The people of particular concern to US officials were Iranian Foreign Minister Abbas Araghchi and Speaker Mohammad Bagher Ghalibaf. Both have played significant roles in Iran-US relations since the war broke out. According to the New York Times, the United States was so concerned about the risk of an Israeli attack that American representatives warned Iran about the threat via other countries in the region. The background must have been that early in the conflict, Israel prioritized striking the Iranian leadership. At the same time, the US began to increasingly focus on the possibilities of reaching a political solution, according to the newspaper. The New York Times describes how the US presented its goal as reaching an agreement and avoiding new fighting. At the same time, many in Israel are said to have opposed a settlement that did not lead to regime change or a significant weakening of Iran's military capabilities. Information on target list The Wall Street Journal reported back in March that Arag
