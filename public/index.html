.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }

select { padding-right: 30px; }

.card {

y": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 37, "title": "Hundreds of robots against Gulf states - several injured", "summary": "At least one person has been killed, and several have been injured, after what is officially described as an \"incident\" at Abu Dhabi airport. During Saturday, Iran fired hundreds of robots and drones at the United Arab Emirates and other Gulf states - with several injured people and landmarks as a result.", "title_original": "Hundratals robotar mot gulfstater – flera skadade", "summary_original": "Minst en person har dödats, och flera har skadats, efter vad som från officiellt håll beskrivs som en ”incident” vid flygplatsen i Abu Dhabi. Under lördagen har Iran avfyrat hundratals robotar och drönare mot Förenade arabemiraten och andra gulfstater – med flera skadade personer och landmärken som följd.", "link": "https://www.sydsvenskan.se/varlden/hundratals-robotar-mot-gulfstater-flera-skadade/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:20:04+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 38, "title": "Can Myhlback defend the Vasalopp title?", "summary": "Alvar Myhlback and Stina Nilsson are chasing a new double victory, the influencer Julia Franzén is SVT's riding profile and tighter controls in the hunt for skate cheats. It's time for the Vasaloppet. Here is a guide to the Swedish classic race.", "title_original": "Kan Myhlback försvara Vasaloppstiteln?", "summary_original": "Alvar Myhlback och Stina Nilsson jagar ny dubbelseger, influencern Julia Franzén är SVT:s åkande profil och skärpta kontroller i jakten på skejtfuskande. Det är dags för Vasaloppet. Här är en guide till det svenska klassikerloppet.", "link": "https://www.svd.se/a/ExQm2o/guide-forsvarar-myhlback-vasaloppstiteln", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:19:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 39, "title": "Iranian media confirm: Ali Khamenei is dead", "summary": "The country's top leader was killed in the American and Israeli attacks", "title_original": "Iranska medier bekräftar: Ali Khamenei är död", "summary_original": "Landets högste ledare dödades i de amerikanska och israeliska attackerna", "link": "https://www.dagen.se/nyheter/iranska-medier-bekraeftar-ali-khamenei-aer-doed/10228263", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:17:23+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 40, "title": "Iran: Ayatollah is dead - new attacks on Israel", "summary": "Iran confirms that the country's supreme leader Ayatollah Khamenei is dead. The ayatollah's daughter and granddaughter were also killed in the Israeli-American attacks. At the same time, Iran reportedly launched a new wave of attacks against Israel and American bases in the area on Sunday.", "title_original": "Iran: Ayatollan är död – nya attacker mot Israel", "summary_original": "Iran bekräftar att landets högsta ledare ayatolla Khamenei är död. Även ayatollans dotter och barnbarn dödades i de israelisk-amerikanska attackerna. Samtidigt ska Iran ha inlett en ny våg av attacker mot Israel och amerikanska baser i området på söndagen.", "link": "https://www.svd.se/a/e7JeX4/iran-bekraftar-ayatolla-ali-khamenei-dod", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:06:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 41, "title": "Time to declare - here are the tips for beginners", "summary": "This week, the Swedish Tax Agency will start sending out the declarations to everyone with a digital mailbox. For those who get stressed and worried at the sight - and don't really understand what needs to be done - help is available.", "title_original": "Dags att deklarera – här är tipsen för nybörjare", "summary_original": "I veckan börjar Skatteverket skicka ut deklarationerna till alla med digital brevlåda. För den som blir stressad och orolig vid åsynen – och inte riktigt förstår vad som behöver göras – finns hjälp att få.", "link": "https://www.svd.se/a/7p6y1B/dags-att-deklarera-har-ar-tipsen-for-nyborjare", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:04:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 42, "title": "Time to declare - here are the tips for beginners", "summary": "A survey conducted last year by Verian on behalf of Familjens jurist showed that 18 percent of respondents felt uncertain about the declaration. It was usually about not knowing which information might need to be checked and possibly corrected.  The greatest uncertainty was among young people between the ages of 18 and 29, where nearly 40 percent stated that they were unsure of the content of the declaration.   Johan Schauman, who is a declaration expert at the Swedish Tax Agency, encounters people every year who worry about the declaration. I feel that there is a general stress and unfamiliarity connected to taxes and the Swedish Tax Agency, he says. Unnecessary worry Many worry unnecessarily, Johan Schauman thinks.  We have worked for a long time to lower the threshold, so that you just have to open, check and approve. It's not like it used to be when you had a hundred binders and went on for three nights, he says. Nowadays, most things are already filled in on the declaration form, and for declaration debutants it is often only about two pieces of information that need to be checked: income from employment, i.e. salary, and whether you have possibly received interest on savings.  It may be good to check that the amount of the salary is correct. Was it what was expected? Does it agree with the salary specifications? If it is not correct, you can ask your employer to correct it, says Johan Schauman. At the very least, however, you may need to supplement the declaration if you have sold shares, rented out a private residence, or want to make deductions for travel to and from work. And if you feel the slightest bit unsure, you can call the Swedish Tax Agency's declaration information to get help checking specific things in the declaration, says Schauman.", "title_original": "Dags att deklarera – här är tipsen för nybörjare", "summary_original": "En undersökning som genomfördes förra året av Verian på uppdrag av Familjens jurist visade att 18 procent av de tillfrågade kände sig osäkra inför deklarationen. Det handlade oftast om att man inte visste vilka uppgifter som kan behöva kontrolleras och eventuellt korrigeras.  Störst var osäkerheten bland unga mellan 18 och 29 år där nära 40 procent uppgav att de var osäkra på deklarationens innehåll.   Johan Schauman som är deklarationsexpert på Skatteverket stöter varje år på personer som oroar sig för deklarationen. Jag upplever att det finns en generell stress och ovana som är kopplad till skatter och Skatteverket, säger han. Onödig oro Många känner oro i onödan, tycker Johan Schauman.  Vi har jobbat länge för att sänka tröskeln, så att det bara är att öppna, kolla och godkänna. Det är inte som förr när man hade hundra pärmar och höll på i tre nätter, säger han. Det mesta är numera redan ifyllt på deklarationsblanketten och för deklarationsdebutanter handlar det ofta bara om två uppgifter som behöver kollas: inkomst av tjänst, alltså lön, och om man eventuellt fått ränta på sparande.  Det kan vara bra att kontrollera så beloppet på lönen stämmer. Var det det man hade förväntat sig? Stämmer det överens med lönespecifikationerna? Om det inte skulle stämma kan man be sin arbetsgivare rätta till det, säger Johan Schauman. Minsta lilla Däremot kan man behöva komplettera deklarationen om man sålt aktier, hyrt ut privatbostad, eller vill göra avdrag för resor till och från jobbet. Och om man känner sig minsta lilla osäker så kan man ringa Skatteverkets deklarationsupplysning för att få hjälp med att kolla på specifika saker i deklarationen, säger Schauman.", "link": "https://www.tv4.se/artikel/tt-260301-ungdeklaration1-3d4d9b77/dags-att-deklarera-har-ar-tipsen-for-nyborjare", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:04:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Privatekonomi", "/privatekonomi", "/skatteverket", "/ekonomi"]}, {"id": 43, "title": "Increased risk of terrorist attacks - also in Sweden", "summary": "Terror expert: Iran can use its \"proxies\" to attack targets in Europe", "title_original": "Ökad risk för terrorangrepp – även i Sverige", "summary_original": "Terrorexpert: Iran kan använda sina ”ombud” för att attackera mål i Europa", "link": "https://www.dagen.se/nyheter/oekad-risk-foer-terrorangrepp-aeven-i-sverige/10228239", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:02:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 44, "title": "Are we worrying about crime unnecessarily?", "summary": "Swedes worry about being exposed to abuse and sexual crimes - at the same time, new statistics show that this type of crime is decreasing. So, is the fear unwarranted? \"Worry is inevitable, but we overestimate certain risks,\" says psychologist Kristin Tollstedt.", "title_original": "Oroar vi oss för brott i onödan?", "summary_original": "Svenskar oroar sig för att bli utsatta för misshandel och sexualbrott – samtidigt visar ny statistik att den typen av brott minskar. Så, är ängslan obefogad? ”Oro är oundviklig, men vi överskattar vissa risker”, säger psykologen Kristin Tollstedt.", "link": "https://www.svd.se/a/gkERx5/oroar-vi-oss-for-brott-i-onodan", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:01:11+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 45, "title": "Arguments on the bus led to fights", "summary": "A young man was arrested in Staffanstorp during the night to Sunday on suspicion of assault.", "title_original": "Bråk på buss ledde till slagsmål", "summary_original": "En yngling greps i Staffanstorp under natten mot söndag misstänkt för misshandel.", "link": "https://www.sydsvenskan.se/staffanstorp/brak-pa-buss-ledde-till-slagsmal/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:00:58+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 46, "title": "Ingmar Nevéus: The war against Iran can make the \"winner\" Trump a loser", "summary": "NEW YORK. Iran's Supreme Leader Ali Khamenei is dead and Donald Trump is celebrating it as a historic victory. But America's latest military adventure may soon make both him and the Republicans losers at home.", "title_original": "Ingmar Nevéus: Kriget mot Iran kan göra ”vinnaren” Trump till en förlorare", "summary_original": "NEW YORK. Irans högste ledare Ali Khamenei är död och Donald Trump firar det som en historisk seger. Men snart kan USA:s senaste militära äventyr göra både honom och Republikanerna till förlorare på hemmaplan.", "link": "https://www.dn.se/varlden/ingmar-neveus-kriget-mot-iran-kan-gora-vinnaren-trump-till-en-forlorare/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:00:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 47, "title": "Let them play musicals, said Orsing!", "summary": "Helsingborg's cultural council would debate the cuts that are now affecting the City Theater and cultural life. It was, to say the least, disappointing.", "title_original": "Låt dem spela musikaler, sa Orsing!", "summary_original": "Helsingborgs kulturfullmäktige skulle debattera nedskärningarna som nu drabbar Stadsteatern och kulturlivet. Det }, {"id": 50, "title": "The politicians do not have to like Bisan Edwan's views for her to stay in Lund", "summary": "Within a couple of weeks, the culture and leisure committee in Lund will make a decision about the controversial sanctuary author.", "title_original": "Politikerna behöver inte gilla Bisan Edwans åsikter för att hon ska få stanna i Lund", "summary_original": "Inom ett par veckor tar kultur- och fritidsnämnden i Lund beslut om den omstridda fristadsförfattaren.", "link": "https://www.sydsvenskan.se/kultur/politikerna-behover-inte-gilla-bisan-edwans-asikter-for-att-hon-ska-fa-stanna-i-lund/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 51, "title": "Only one local taxi company has received permission to stand at Lund C", "summary": "Soon the barriers will be lowered at the taxi rank at Lund C. Only one of the local taxi companies has so far received permission to stand here - other Lund drivers are banned. - It becomes a monopoly. We will sue the municipality, says taxi driver Saleh Khattab.", "title_original": "Bara ett lokalt taxibolag har fått tillstånd att stå vid Lund C", "summary_original": "Snart fälls bommarna på taxiplatsen vid Lund C. Bara ett av de lokala taxibolagen har än så länge fått tillstånd att stå här – andra Lundachaufförer är utestängda. – Det blir monopol. Vi kommer att stämma kommunen, säger taxichauffören Saleh Khattab.", "link": "https://www.sydsvenskan.se/lund/bara-ett-lokalt-taxibolag-har-fatt-tillstand-att-sta-vid-lund-c/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 52, "title": "What do you know about autofiction?", "summary": "Autofiction has in the 21st century become one of our most popular and at the same time contested literary genres. Here you test your knowledge and sharpen your arguments in the lively debate about autofiction. Do the Bildningsquizet - a collaboration between Sydsvenskan and Malmö University.", "title_original": "Vad kan du om autofiktion?", "summary_original": "Autofiktion har under 2000-talet blivit en av våra mest populära och samtidigt ifrågasatta litterära genrer. Här testar du dina kunskaper och vässar dina argument i den livliga debatten om autofiktion. Gör Bildningsquizet – ett samarbete mellan Sydsvenskan och Malmö universitet.", "link": "https://www.sydsvenskan.se/quiz/vad-kan-du-om-autofiktion/", "date_display": "2026-03-01", "date_iso": "2026-03-01T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 53, "title": "Thankfully, Ebba Andersson escaped Tommy Salo's treatment", "summary": "Esk's eleven week 9. DN-sport's columnist Johan Esk about the week that has been.", "title_original": "Tack och lov slapp Ebba Andersson råka ut för Tommy Salos behandling", "summary_original": "Esks elva vecka 9. DN-sportens krönikör Johan Esk om veckan som varit.", "link": "https://www.dn.se/sport/tack-och-lov-slapp-ebba-andersson-raka-ut-for-tommy-salos-behandling/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:50:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 54, "title": "Skied to school in minus 35 – now the Vasaloppet awaits Riitta-Leena, 74 years old", "summary": "Riitta-Leena Karlsson is 74 years old and will ride the Vasaloppet's nine miles. - My goal is to reach the finish line alive. She'll learn to do that. During his Finnish upbringing, the trips to and from school could provide skiing winters with 80 miles.", "title_original": "Skidade till skolan i 35 minus – nu väntar Vasaloppet för Riitta-Leena, 74 år", "summary_original": "Riitta-Leena Karlsson är 74 år och ska åka Vasaloppets nio mil. – Mitt mål är att komma i mål levande. Det lär hon klara. Under sin finska uppväxt kunde turerna till och från skolan ge skidvintrar med 80 mil.", "link": "https://www.dn.se/sport/skidade-till-skolan-i-35-minus-nu-vantar-vasaloppet-for-riitta-leena-74-ar/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:50:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 55, "title": "Leaders: Orbán, Trump and Putin all want to crush Europe", "summary": "Hungary is going to the polls soon – and for the first time in a long time, it looks like Viktor Orbán is in danger of losing. Another player has stepped in to save him.", "title_original": "Ledare: Orbán, Trump och Putin vill alla krossa Europa", "summary_original": "Ungern går snart till val – och för första gången på länge ser det ut som att Viktor Orbán riskerar att förlora. En annan spelare har gett sig in för att rädda honom.", "link": "https://www.dn.se/ledare/orban-trump-och-putin-vill-alla-krossa-europa/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:45:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 56, "title": "Stupid women who can't take a joke.", "summary": "Apolitical?", "title_original": "Dumma kvinnor som inte kan ta ett skämt.", "summary_original": "Opolitiskt?", "link": "https://www.sydsvenskan.se/opinion/moa-berglof/dumma-kvinnor-som-inte-kan-ta-ett-skamt/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:35:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 57, "title": "Increased risk of terrorist attacks - also in Sweden", "summary": "In the short term, the attacks against Iran may lead to an increased risk of attacks and assassinations in Sweden. In the longer term, however, a new regime in Iran could lead to a radically improved security situation, according to terror expert Hans Brun.", "title_original": "Ökad risk för terrorangrepp – även i Sverige", "summary_original": "På kort sikt kan attackerna mot Iran medföra en ökad risk för angrepp och attentat i Sverige. På längre sikt kan däremot en ny regim i Iran leda till ett radikalt förbättrat säkerhetsläge, enligt terrorexperten Hans Brun.", "link": "https://www.dn.se/sverige/okad-risk-for-terrorangrepp-aven-i-sverige/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:34:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 58, "title": "Strong bang on Eriksfältsgatan - residents were evacuated", "summary": "During Saturday evening, the police received an alarm about a loud bang on Eriksfältsgatan. Findings at the scene indicate that it was a hand grenade that exploded. Residents were evacuated to a nearby school.", "title_original": "Kraftig smäll på Eriksfältsgatan – boende evakuerades", "summary_original": "Polisen fick under lördagskvällen larm om en kraftig smäll på Eriksfältsgatan. Fynd på platsen pekar på att det är en handgranat som exploderat. Boende evakuerades till en närliggande skola.", "link": "https://www.sydsvenskan.se/malmo/kraftig-small-pa-eriksfaltsgatan-polisen-sparrar-av/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:31:16+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 59, "title": "Does the success of the HIF talent continue?", "summary": "A challenging 16-year-old, a missing general and an offensive language genius. Here are three talking points before HIF's cup match against Sirius.", "title_original": "Fortsätter HIF-talangens succé?", "summary_original": "En 16-åring som utmanar, en general som saknas och ett offensivt språkgeni. Här är tre snackisar inför HIF:s cupmatch mot Sirius.", "link": "https://www.hd.se/sport/fortsatter-hif-talangens-succe/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 60, "title": "Was paralyzed after the severe accident on E4: \"Doesn't take anything for granted anymore\"", "summary": "When IBK Lund's player bus overturned on the E4, Pontus Linde was thrown onto the highway. When he woke up in the hospital two weeks later, his legs were paralyzed. Now he talks for the first time about the accident that turned his life upside down. - I don't want to be defeated in any way, I want to turn it into something good, says 37-year-old Pontus Linde.", "title_original": "Blev förlamad efter svåra olyckan på E4: ”Tar inget för givet längre”", "summary_original": "När IBK Lunds spelarbuss välte på E4:an kastades Pontus Linde ut på motorvägen. När han vaknade på sjukhuset två veckor senare var han förlamad i benen. Nu berättar han för första gången om olyckan som vände livet upp och ned. – Jag vill inte bli besegrad på något sätt, jag vill omvandla det till något bra, säger 37-årige Pontus Linde.", "link": "https://www.sydsvenskan.se/sport/blev-forlamad-efter-svara-olyckan-pa-e4-tar-inget-for-givet-langre/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:25:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 61, "title": "Have the Laestadians cracked the social code?", "summary": "Minimum with screen, maximum with children. Has Sweden's fastest growing congregation cracked the code for something that the rest of society struggles with? SvD follows the construction of the Laestadians' new mega-church just outside Stockholm.", "title_original": "Har Laestadianerna knäckt samhällskoden?", "summary_original": "Minimalt med skärm, maximalt med barn. Har Sveriges snabbast växande församling knäckt koden för något som resten av samhället kämpar med? SvD följer bygget av laestadianernas nya megakyrka strax utanför Stockholm.", "link": "https://www.svd.se/a/KMdApy/laestadianerna-bygger-kyrka-vid-e4-an-har-de-knackt-koden", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:23:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 62, "title": "The Ayatollah's death gives Iran a chance for a new spring", "summary": "The announcement of Ayatollah Khamenei's death is extremely significant. It could be the final nail in the coffin for Iran's 47-year-old Islamic regime.", "title_original": "Ayatollans död ger Iran chans till ny vår", "summary_original": "Beskedet om ayatolla Khameneis död är oerhört betydelsefullt. Det kan komma att bli sista spiken i kistan för Irans 47-åriga islamiska regim.", "link": "https://www.svd.se/a/wrAV75/ayatollans-dod-ger-iran-chans-till-ny-var", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:19:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 63, "title": "New Iranian attacks on Israel", "summary": "Explosions at US military bases in the Middle East", "title_original": "Nya iranska attacker mot Israel", "summary_original": "Explosioner på amerikanska militärbaser i Mellanöstern", "link": "https://www.dagen.se/nyheter/nya-iranska-attacker-mot-israel/10228220", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:15:12+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "\"Young people are more negative towards homosexuals - but the trend can be reversed.\"", "summary": "People in decision-making positions in politics, in workplaces and in organizations have simply not bothered to ensure that LGBTQ+ people and heterosexuals should be considered of equal value., writes Joakim Månsson Bengtsson, initiator of Lundapride and board member of the Green Party in Eslöv.", "title_original": "”Unga är mer negativa till homosexuella – men utvecklingen kan vändas.”", "summary_original": "Personer i beslutsfattande ställning inom politik, på arbetsplatser och i organisationer har helt enkelt inte brytt sig om att säkerställa att hbtq+-personer och heterosexuella ska anses som lika värda., skriver Joakim Månsson Bengtsson, initiativtagare till Lundapride och styrelseledamot i Miljöpartiet i Eslöv.", "link": "https://www.sydsvenskan.se/opinion/unga-har-blivit-mer-negativa-till-homosexuella-men-utvecklingen-gar-att-vanda/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:05:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 65, "title": "Increased risk of terrorist attacks - also in Sweden", "summary": "In the short term, the attacks against Iran may lead to an increased risk of attacks and assassinations in Sweden. In the longer term, however, a new regime in Iran could lead to a radically improved security situation, according to terror expert Hans Brun.", "title_original": "Ökad risk för terrorangrepp – även i Sverige", "summary_original": "På kort sikt kan attackerna mot Iran medföra en ökad risk för angrepp och attentat i Sverige. På längre sikt kan däremot en ny regim i Iran leda till ett radikalt förbättrat säkerhetsläge, enligt terrorexperten Hans Brun.", "link": "https://www.svd.se/a/7p6yQK/okad-risk-for-terrorangrepp-aven-i-sverige", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:00:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 66, "title": "Murder is closer now than it was then", "summary": "The murder of Olof Palme serves as an emblem of our common approach to knowledge. It probably made it easier for the man in the fluttering coat to get away.", "title_original": "Mordet är närmare nu än det var då", "summary_original": "Mordet på Olof Palme tjänar som ett emblem för vårt gemensamma förhållningssätt till kunskap. Troligen underlättade det för mannen i fladdrande rock att komma undan.", "link": "https://www.svd.se/a/3pEmKv/palmemordet-ar-narmare-nu-an-da", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 67, "title": "Would get more people to take the bus – not a super success for the express line", "summary": "The Skåneexpress would encourage more people to travel by public transport between Malmö and Falsterbonäset. But since bus 15 started rolling three years ago, passengers on the line have become fewer - and criticism has been pouring in.  After massive protests against heavy double-decker trucks on the residential streets of Skanör, the line was redrawn this summer. Now residents in both Skanör and Falsterbo feel cut off.", "title_original": "Skulle få fler att ta bussen – ingen supersuccé för expresslinjen", "summary_original": "Skåneexpressen skulle få fler att åka kollektivt mellan Malmö och Falsterbonäset. Men sedan buss 15 började rulla för tre år sedan har resenärerna på linjen blivit färre – och kritiken haglat.  Efter massiva protester mot tunga dubbeldäckare på villagatorna i Skanör drogs linjen om i somras. Nu känner sig boende i både Skanör och Falsterbo avskurna.", "link": "https://www.sydsvenskan.se/vellinge/superbussen-blev-ingen-supersucce-alla-kan-inte-bli-nojda/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 68, "title": "Haksabanovic's tough challenge: \"It doesn't help\"", "summary": "Sead Haksabanovic is competing with Anders Christiansen and Arnor Sigurdsson for playing time in Malmö FF, but is still waiting to start a competitive match this year. - I will get my chance and then it is up to me to take it, he says.", "title_original": "Haksabanovics tuffa utmaning: ”Det hjälper ju inte till”", "summary_original": "Sead Haksabanovic konkurrerar med Anders Christiansen och Arnor Sigurdsson om speltid i Malmö FF, men väntar fortfarande på att få starta en tävlingsmatch i år. – Jag kommer att få min chans och då är det upp till mig att ta den, säger han.", "link": "https://www.sydsvenskan.se/sport/haksabanovics-tuffa-utmaning-det-hjalper-ju-inte-till/", "date_display": "2026-03-01", "date_iso": "2026-03-01T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "Seven foods that make you feel good", "summary": "Forget expensive supplements. Invest in good and nutritious food instead. But which foods are both cheap and contain the best balance of the substances the body needs? Below you can read about seven raw materials that make the body feel good.", "title_original": "Sju livsmedel som får dig att må bra", "summary_original": "Glöm dyra kosttillskott. Satsa på god och näringsriktig mat i stället. Men vilka livsmedel är både billiga och innehåller den bästa balansen av de ämnen kroppen behöver? Här nedan kan du läsa om sju råvaror som får kroppen att må bra.", "link": "https://www.dn.se/sverige/sju-livsmedel-som-far-dig-att-ma-bra/", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:54:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "Just over 100-year-old house in Röstånga sold", "summary": "", "title_original": "Drygt 100 år gammalt hus i Röstånga sålt", "summary_original": "", "link": "https://www.hd.se/svalov/drygt-100-ar-gamalt-hus-i-rostanga-salt/", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:51:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "President and officials take over from Khamenei", "summary": "Iranian President Masoud Pezeshkian and two other senior officials will lead Iran in the transition after the death of Ali Khamenei, state television reports.", "title_original": "President och tjänstemän tar över efter Khamenei", "summary_original": "Irans president Masoud Pezeshkian och två andra högt uppsatta tjänstemän kommer att leda Iran i övergången efter Ali Khameneis död, rapporterar statlig tv.", "link": "https://www.svd.se/a/JOQ3L4/president-och-tjansteman-tar-over-efter-khamenei", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:07:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 72, "title": "The attack on Iran: This we know", "summary": "Israel and the US have joined forces to attack Iran. The attack – as well as counterattacks – is ongoing. This is what we know so far.", "title_original": "Attacken mot Iran: Detta vet vi", "summary_original": "Israel och USA har gått till gemensam attack mot Iran. Angreppet – liksom motattacker – pågår. Detta är vad vi hittills vet.", "link": "https://www.svd.se/a/ln3er3/attacken-mot-iran-detta-vet-vi", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:00:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 73, "title": "Letter to the editor. Recognize Ramadan as a Swedish holiday in the same way as Christmas", "summary": "LETTER TO THE EDITOR. If we truly value inclusivity, all people's religious holidays should be respected in the same way. If we take the Muslim fasting month of Ramadan seriously as part of Swedish social life, it strengthens the cohesion of the whole of Sweden, writes Rahman Mrida.", "title_original": "Insändare. Erkänn ramadan som svensk högtid på samma sätt som julen", "summary_original": "INSÄNDARE. Om vi verkligen värdesätter inkludering bör alla människors religiösa högtider respekteras på samma sätt. Om vi tar den muslimska fastemånaden ramadan på allvar som en del av det svenska samhällslivet stärker det hela Sveriges sammanhållning, skriver Rahman Mrida.", "link": "https://www.dn.se/insandare/erkann-ramadan-som-svensk-hogtid-pa-samma-satt-som-julen/", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "Peo Thyrén planned an artist trip to the Pope - became a Catholic himself", "summary": "The musician in big Daily interview • 'Now I feel for the first time that I have a spiritual home'.", "title_original": "Peo Thyrén planerade artistresa till påven – blev själv katolik", "summary_original": "Musikern i stor Dagenintervju • 'Nu känner jag för första gången att jag har ett andligt hem'.", "link": "https://www.dagen.se/livsstil/peo-thyren-planerade-artistresa-till-paven-blev-sjaelv-katolik/10215717", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Now comes the epochal shift: Fewer than half of Swedes join the Church of Sweden", "summary": "The new reality as a folk church in the minority was discussed at the symposium.", "title_original": "Nu kommer epokskiftet: Färre än hälften av svenskarna med i Svenska kyrkan", "summary_original": "Den nya verkligheten som folkkyrka i minoritet diskuterades på symposium.", "link": "https://www.dagen.se/nyheter/nu-kommer-epokskiftet-faerre-aen-haelften-av-svenskarna-med-i-svenska-kyrkan/10222537", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Norduppland church in Tierp starts network for house congregations", "summary": "Pastor Micael Lahtinen: \"We want to see the first congregation live again in our time.\"", "title_original": "Nordupplandskyrkan i Tierp startar nätverk för husförsamlingar", "summary_original": "Pastor Micael Lahtinen: ”Vi vill se den första församlingen leva igen i vår tid.”", "link": "https://www.dagen.se/nyheter/nordupplandskyrkan-i-tierp-startar-naetverk-foer-husfoersamlingar/10224775", "date_display": "2026-03-01", "date_iso": "2026-03-01T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "Trump warns Iran: We will strike hard", "summary": "Iran's Revolutionary Guard has threatened a \"savage\" response to the weekend's attacks. Now Donald Trump responds with a warning: \"We will strike with a force never seen before.\"", "title_original": "Trump varnar Iran: Vi kommer att slå till hårt", "summary_original": "Irans revolutionsgarde har hotat med ett ”vilt” svar på helgens attacker. Nu svarar Donald Trump med en varning: ”Vi kommer att slå till med en kraft som aldrig setts tidigare.”", "link": "https://www.svd.se/a/d4wjGB/trump-nu-blir-forhandlingar-lattare", "date_display": "2026-03-01", "date_iso": "2026-03-01T03:52:25+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 78, "title": "House in Teckomatorp sold - big increase in value", "summary": "", "title_original": "Hus i Teckomatorp sålt – stor värdeökning", "summary_original": "", "link": "https://www.hd.se/svalov/hus-i-teckomatorp-salt-stor-vardeokning/", "date_display": "2026-03-01", "date_iso": "2026-03-01T03:05:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 79, "title": "13 nuns in Skåne are looking for a new location for their convent", "summary": "Disturbing surroundings, too small a chapel among the reasons for a future move.", "title_original": "13 nunnor i Skåne söker ny plats för sitt kloster", "summary_original": "Störande omgivning, för litet kapell bland skälen till en framtida flytt.", "link": "https://www.dagen.se/nyheter/13-nunnor-i-skane-soeker-ny-plats-foer-sitt-kloster/10220658", "date_display": "2026-03-01", "date_iso": "2026-03-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "Iranian media confirm: Ali Khamenei is dead", "summary": "Iranian state media reports that the country's supreme leader, Ali Khamenei, is dead.", "title_original": "Iranska medier bekräftar: Ali Khamenei är död", "summary_original": "Iranska statliga medier rapporterar att landets högste ledare, Ali Khamenei, är död.", "link": "https://www.dn.se/varlden/iranska-medier-bekraftar-ali-khamenei-ar-dod/", "date_display": "2026-03-01", "date_iso": "2026-03-01T01:57:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "Iranian media confirm: Ali Khamenei is dead", "summary": "Iranian state media reports that the country's supreme leader, Ali Khamenei, is dead. The country's army chief and defense minister have also been killed in the attacks.", "title_original": "Iranska medier bekräftar: Ali Khamenei är död", "summary_original": "Iranska statliga medier rapporterar att landets högste ledare, Ali Khamenei, är död. Även landets arméchef och försvarsminister har dödats i attackerna.", "link": "https://www.svd.se/a/d4wj4A/iranska-medier-khameneis-dotter-dod", "date_display": "2026-03-01", "date_iso": "2026-03-01T00:32:50+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 82, "title": "New Iranian attacks on Israel", "summary": "Israel's military says it is fighting Iranian robots that were fired at the country on Sunday. Iran has launched a new wave of attacks against Israel and US military bases, state media reports.", "title_original": "Nya iranska attacker mot Israel", "summary_original": "Israels militär uppger att den bekämpar iranska robotar som avfyrats mot landet under söndagen. Iran har inlett en ny våg av attacker mot Israel och amerikanska militärbaser, rapporterar statliga medier.", "link": "https://www.svd.se/a/wrA4gL/israel-kvinna-dodad-i-irans-attack", "date_display": "2026-03-01", "date_iso": "2026-03-01T00:08:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 83, "title": "Israel: New wave of attacks against Iran", "summary": "Explosions are heard in Iran's capital Tehran. Israel's military says it is attacking Iranian robotic and air defense positions. At the same time, the Iranian Revolutionary Guard is threatening a \"savage\" response to the attacks.", "title_original": "Israel: Ny våg av attacker mot Iran", "summary_original": "Explosioner hörs i Irans huvudstad Teheran. Israels militär uppger att man attackerar iranska robot- och luftförsvarspositioner. Samtidigt hotar det iranska revolutionsgardet med ett ”vilt” svar på attackerna.", "link": "https://www.svd.se/a/xrg78j/over-100-uppges-dodade-i-skolattack", "date_display": "2026-02-28", "date_iso": "2026-02-28T23:30:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 84, "title": "Hundreds of robots against Gulf states - several injured", "summary": "At least one person has been killed, and several have been injured, after what is officially described as an \"incident\" at Abu Dhabi airport. During Saturday, Iran fired hundreds of robots and drones at the United Arab Emirates and other Gulf states - with several injured people and landmarks as a result.", "title_original": "Hundratals robotar mot gulfstater – flera skadade", "summary_original": "Minst en person har dödats, och flera har skadats, efter vad som från officiellt håll beskrivs som en ”incident” vid flygplatsen i Abu Dhabi. Under lördagen har Iran avfyrat hundratals robotar och drönare mot Förenade arabemiraten och andra gulfstater – med flera skadade personer och landmärken som följd.", "link": "https://www.svd.se/a/Pd4EoX/en-dod-vid-incident-pa-flygplats", "date_display": "2026-02-28", "date_iso": "2026-02-28T23:28:29+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 85, "title": "Sold below starting price: \"Reasonable values\"", "summary": "The price rally for holiday homes has stopped. Around half are now sold for below the starting price, recent statistics show. But just because the price lands lower does not mean that the buyer made a good deal, says an analyst.", "title_original": "Säljs under utgångspris: ”Rimliga värden”", "summary_original": "Prisrallyt på fritidshus har stannat av. Omkring hälften säljs nu för under utgångspriset, visar färsk statistik. Men bara för att priset landar lägre betyder det inte att köparen gjort en bra affär, säger en analytiker.", "link": "https://www.svd.se/a/43oO9a/saljs-under-utgangspris-rimliga-varden", "date_display": "2026-02-28", "date_iso": "2026-02-28T23:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 86, "title": "Suspected of hitting his partner - man arrested in Klippan", "summary": "The police were called to Klippan on Saturday evening after a man hit his partner. He is suspected of assault and breach of child protection.", "title_original": "Misstänks ha slagit sin partner – man gripen i Klippan", "summary_original": "Polisen larmades till Klippan under lördagskvällen efter att en man slagit sin partner. Han misstänks för misshandel och barnfridsbrott.", "link": "https://www.hd.se/klippan/misstanks-ha-slagit-sin-partner-man-gripen/", "date_display": "2026-02-28", "date_iso": "2026-02-28T23:03:58+00:00", "source": "Helsingborgs Dagblad (HD)", "m ar 1989, och Iran gick på knä efter ett av vår tids längsta och blodigaste krig. Men Khamenei, som fick sin ayatollatitel mer på politiska grunder än på religiösa, skulle prägla sitt land och sin region som få andra Mellanösternledare.", "link": "https://www.dn.se/varlden/den-skickliga-maktspelaren-khameneis-sista-ar-var-en-mardrom/", "date_display": "2026-02-28", "date_iso": "2026-02-28T22:20:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 92, "title": "He kept Iran's revolution alive with an iron fist", "summary": "Many believed that the Islamic Republic of Iran could not possibly survive its creator, Ayatollah Ruhollah Khomeini. But his successor managed to keep the strict rule intact for over 35 years. In his wake, however, Ayatollah Ali Khamenei leaves a divided country, with a population largely opposed to the regime he has represented since 1989.", "title_original": "Han höll Irans revolution vid liv med järnhand", "summary_original": "Många trodde att Irans islamiska republik omöjligen kunde överleva dess skapare, ayatolla Ruhollah Khomeini. Men hans arvtagare lyckades hålla det strikta styret intakt i över 35 år. Som eftermäle lämnar dock ayatolla Ali Khamenei ett splittrat land, med en befolkning som till stor del motsätter sig regimen han representerat sedan 1989.", "link": "https://www.svd.se/a/8pJjw2/han-holl-irans-revolution-vid-liv-med-jarnhand", "date_display": "2026-02-28", "date_iso": "2026-02-28T22:20:07+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 93, "title": "Meira Omar and Robin Bengtsson continue from the qualifiers", "summary": "Meira Omar and Robin Bengtsson made it through the final qualifier, which was previously called Andra chansen, in Melodifestivalen.", "title_original": "Meira Omar och Robin Bengtsson vidare från kvalet", "summary_original": "Meira Omar och Robin Bengtsson tog sig vidare från finalkvalet, det som tidigare hette Andra chansen, i Melodifestivalen.", "link": "https://www.hd.se/meira-omar-gar-vidare-fran-finalkvalet/", "date_display": "2026-02-28", "date_iso": "2026-02-28T22:07:40+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Meira Omar and Robin Bengtsson continue from the qualifiers", "summary": "Meira Omar and Robin Bengtsson made it through the final qualifier, which was previously called Andra chansen, in Melodifestivalen.", "title_original": "Meira Omar och Robin Bengtsson vidare från kvalet", "summary_original": "Meira Omar och Robin Bengtsson tog sig vidare från finalkvalet, det som tidigare hette Andra chansen, i Melodifestivalen.", "link": "https://www.sydsvenskan.se/noje/meira-omar-gar-vidare-fran-finalkvalet/", "date_display": "2026-02-28", "date_iso": "2026-02-28T22:07:40+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Sanna Nielsen and Lilla Al-Fadji to the final", "summary": "The feelings are everywhere, says Sanna Nielsen to TT afterwards. Sanna Nielsen has been tipped to go to the final ever since it became known that she would participate with the contribution \"Waste your love\". But it looked uncertain for a long time when Lilla Al-Fadji – Sanna Nielsen's son's favourite, she says – was the first to be announced as a finalist. It was a long wait before it became clear that she won the second final place. It is always terrible to sit in the green room. You know you have to suffer through it and hope for the best, says Sanna Nielsen. It is the eighth time that Sanna Nielsen has participated in Melodifestivalen and 25 years since she participated for the first time - then as a sixteen-year-old. Last year, she was inducted into the Hall of Fame and that also gave birth to the idea of ​​joining again. Lilla Al-Fadji first to the final Already after the genre rep on Friday evening, Lilla Al-Fadji with \"Delulu\" was number one with the audience in Melodifestivalsklubben's survey. Still, many were surprised that he charmed viewers so much. Little Al-Fadji himself was visibly shocked in the greenroom to be the first finalist to be called up. In the song I sing \"Vi tar 'Delulu' till Eurovision\" so I already know what's going on, but I have a short memory because I'm a short man. So I had forgotten that I had thought that. So I was reminded again, he explains to TT afterwards. The comic character is made by hip-hop artist Felipe Andres Leiva Wenger, better known as \"Fille\" in Ison & Fille. He has co-written the song together with Edward af Sillén and Daniel Réhn, who both wrote the script for last year's Melodifestival. Terese in the box office Before the first finalist was announced, host Hampus Nessvold finally made an entrance as his comedy character Terese in the box office after doing other sketches in the first four weeks of this year's Melodifestival tour - to the cheers of the audience. Caroline af Ugglas and the song \"Please, please\" were inducted into the Hall of Fame and af Ugglas also appeared on stage and performed the contribution from 2009. Meira Omar and Robin Bengt", "title_original": "Sanna Nielsen och Lilla Al-Fadji till final", "summary_original": "Känslorna är överallt, säger Sanna Nielsen till TT efteråt. Sanna Nielsen har varit tippad att gå till final ända sedan det blev känt att hon skulle medverka med bidraget ”Waste your love”. Men det såg länge osäkert ut då Lilla Al-Fadji – Sanna Nielsens sons favorit, säger hon – var först att utropas till finalist. Det blev en lång väntan innan det blev klart att hon knep den andra finalplatsen. Det är alltid fruktansvärt att sitta i greenroom. Man vet att man ska genomlida det och hoppas på det bästa, säger Sanna Nielsen. Det är åttonde gången som Sanna Nielsen deltar i Melodifestivalen och 25 år sedan hon medverkade för första gången – då som sextonåring. I fjol valdes hon in i Hall of fame och det födde också idén att vara med igen. Lilla Al-Fadji först till final Redan efter genrepet på fredagskvällen låg Lilla Al-Fadji med ”Delulu” etta hos publiken i Melodifestivalsklubbens undersökning. Ändå blev många förvånade att han charmade tittarna såpass. Lilla Al-Fadji själv var märkbart chockad i greenroom över att bli den första finalisten som ropades upp. I låten sjunger jag \"Vi tar ’Delulu’ till Eurovision\" så jag vet ju redan vad som händer, men jag har kort minne eftersom jag är en kort man. Så jag hade glömt bort att jag hade tänkt det. Så jag blev påmind igen, förklarar han för TT efteråt. Humorfiguren görs av hiphopartisten Felipe Andres Leiva Wenger, mer känd som \"Fille\" i Ison & Fille. Han har varit med och skrivit låten tillsammans med självaste Edward af Sillén och Daniel Réhn, som båda skrev manus till fjolårets Melodifestival. Terese i kassan Innan den första finalisten tillkännagavs gjorde programledaren Hampus Nessvold slutligen entré som sin humorfigur Terese i kassan efter att ha gjort andra sketcher under de första fyra veckorna av årets Melodifestivalsturné – till publikens jubel. Caroline af Ugglas och låten ”Snälla, snälla” valdes in i Hall of fame och af Ugglas dök också upp på scenen och framförde bidraget från 2009. Meira Omar och Robin Bengtsson Allra sist i kväll röstades ytterligare två finalister fram från det så kallade finalkvalet, bestående av alla treor från respektive deltävlingar. Och där drog fjolårsfinalisten Meira Omar (”Dooset daram”) och 2017 års vinnare Robin Bengtsson (”Honey honey”) det längsta strået.", "link": "https://www.tv4.se/artikel/5g7ZucSPa8i86Ozzs30nPL/sanna-nielsen-och-lilla-al-fadji-till-final", "date_display": "2026-02-28", "date_iso": "2026-02-28T22:06:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Melodifestivalen", "/melodifestivalen", "/kultur"]}, {" important points during the regular season sprint.", "title_original": "Checklistan inför slutspelet: ”Annars blir det som en käftsmäll”", "summary_original": "En smäll på hemmaplan och ett nytt poängtapp. Det drar ihop sig inför SM-slutspelet – här listar Anton Bengtsson Rögles viktigaste punkter under grundseriespurten.", "link": "https://www.hd.se/sport/checklistan-infor-slutspelet-annars-blir-det-som-en-kaftsmall/", "date_display": "2026-02-28", "date_iso": "2026-02-28T20:43:12+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "Iran confirms: Ayatollah Khamenei is dead", "summary": "Iran's Supreme Leader Ayatollah Ali Khamenei is dead. This is confirmed by state Iranian media, Reuters reports. \"This is the greatest chance for the Iranian people to take back their country,\" writes Donald Trump on Truth Social. During Sunday, Iran attacked around 30 military targets.", "title_original": "Iran bekräftar: Ayatolla Khamenei är död", "summary_original": "Irans högste ledare ayatolla Ali Khamenei är död. Det bekräftar statlig iransk media, rapporterar Reuters. ”Detta är den största chansen för det iranska folket att ta tillbaka sitt land”, skriver Donald Trump på Truth Social. Under söndagen attackerade Iran ett 30-tal militära mål.", "link": "https://www.dn.se/varlden/khamenei-uppges-ha-dodats-i-attack/", "date_display": "2026-02-28", "date_iso": "2026-02-28T20:28:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "Sanna Nielsen and Lilla Al-Fadji to the final in Melodifestivalen", "summary": "The comic character Lilla Al-Fadji charmed the viewers and advances to the final with the song \"Delulu\", just as it was predicted in the public vote after the genre rep. Veteran Sanna Nielsen took the second final place. From the final qualifier, Meira Omar and Robin Bengtsson go on to the final.", "title_original": "Sanna Nielsen och Lilla Al-Fadji till final i Melodifestivalen", "summary_original": "Humorfiguren Lilla Al-Fadji charmade tittarna och tar sig vidare till final med låten ”Delulu”, precis som det tippades i publikomröstningen efter genrepet. Veteranen Sanna Nielsen tog den andra finalplatsen. Från finalkvalet går Meira Omar och Robin Bengtsson vidare till final.", "link": "https://www.dn.se/kultur/sanna-nielsen-och-lilla-al-fadji-till-final-i-melodifestivalen/", "date_display": "2026-02-28", "date_iso": "2026-02-28T20:24:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "International law expert: The attacks on Iran illegal", "summary": "US and Israeli attacks on Iran are against international law, according to Mark Klamberg, professor of international law. - If you start from the way international law is formulated, and the practice that has developed around it, then this is illegal, he tells TT.", "title_original": "Folkrättsexpert: Attackerna mot Iran olagliga", "summary_original": "USA:s och Israels attacker mot Iran strider mot folkrätten, enligt Mark Klamberg, professor i folkrätt. – Om man utgår från hur folkrätten är formulerad, och den praxis som växt fram kring den, så är det här olagligt, säger han till TT.", "link": "https://www.svd.se/a/9pzx2q/folkrattsexpert-attackerna-mot-iran-olagliga", "date_display": "2026-02-28", "date_iso": "2026-02-28T20:14:15+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 108, "title": "Tangne's insight: \"Bite us in the ass in the end\"", "summary": "Dan Tangnes thought that his team lost its identity against Örebro. - We went around and looked for some shortcuts, says Rögletränaren.", "title_original": "Tangnes insikt: ”Bet oss i arslet i slutändan”", "summary_original": "Dan Tangnes tyckte att hans lag tappade bort sin identitet mot Örebro. – Vi åkte runt och letade lite genvägar, säger Rögletränaren.", "link": "https://www.hd.se/sport/tangnes-insikt-bet-oss-i-arslet-i-slutandan/", "date_display": "2026-02-28", "date_iso": "2026-02-28T20:06:50+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Decided: They squeeze the last places in the Middle Final", "summary": "Sanna Nielsen has returned after twelve years and - as the odds promised - goes directly to the final next week. Even the rascal Lilla Al-Fadji goes to the final. From the final qualifier, Robin Bengtsson and Meira Omar went on to the final.", "title_original": "Avgjort: De kniper sista platserna i Mellofinalen", "summary_original": "Sanna Nielsen har återvänt efter tolv år och går – som oddsen lovade – direkt vidare till finalen nästa vecka. Även skrällen Lilla Al-Fadji går till final. Från finalkvalet gick Robin Bengtsson och Meira Omar vidare till finalen.", "link": "https://www.svd.se/a/6q9VGL/melodifestivalen-i-sundsvall-ar-i-gang", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:37:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 110, "title": "Netanyahu: The attacks lead to peace", "summary": "The American and Israeli attacks on Iran will lead to peace. This is what Israeli Prime Minister Benjamin Netanyahu says in a speech to the nation.", "title_original": "Netanyahu: Attackerna leder till fred", "summary_original": "De amerikanska och israeliska attackerna mot Iran kommer att leda till fred. Det säger Israels premiärminister Benjamin Netanyahu i ett tal till nationen.", "link": "https://www.svd.se/a/ExQKrA/netanyahu-attackerna-leder-till-fred", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:26:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 111, "title": "The art of drinking with an open mind", "summary": "What separates an art experience from the enjoyment of a glass of wine? The question connects Immanuel Kant with today's wine journalism - and lays bare how taste in the literal sense has become perhaps the most refined cultural marker of our time.", "title_original": "Konsten att dricka med ett öppet sinne", "summary_original": "Vad skiljer en konstupplevelse från njutningen av ett glas vin? Frågan förbinder Immanuel Kant med dagens vinjournalistik – och blottlägger hur smak i bokstavlig mening blivit vår tids kanske mest raffinerade kulturmarkör.", "link": "https://www.svd.se/a/6qnLxW/vinkannarna-ar-var-tids-upphojda-smakdomare", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 112, "title": "Trump needs to find a quick end", "summary": "The US attack on Iran aims to bring down the Iranian government. But just as important to the Trump administration is avoiding a protracted war – an attack has weak support among Americans, and there are elections this fall.", "title_original": "Trump måste hitta ett snabbt slut", "summary_original": "Det amerikanska anfallet mot Iran har som mål att fälla den iranska regeringen. Men lika viktigt för Trumpadministrationen är att undvika ett utdraget krig –  en attack har svagt stöd bland amerikanerna, och det är val i höst.", "link": "https://www.svd.se/a/ExQKyA/usa-s-anfall-mot-iran-med-det-kontroversiella-malet-om-regimskifte", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:03:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 113, "title": "Brings in millions - yet the Vasaloppet goes backwards", "summary": "Sponsor millions and 60,000 skiers willing to pay. Ändå gick Vasaloppet AB med förlust förra året. How is that possible?", "title_original": "Drar in miljoner – ändå går Vasaloppet back", "summary_original": "Sponsormiljoner och 60 000 betalningsvilliga skidåkare. Ändå gick Vasaloppet AB med förlust förra året. Hur är det möjligt?", "link": "https://www.svd.se/a/XMbojr/vasaloppet-ab-sa-mycket-pengar-drar-loppet-in", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:01:13+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 114, "title": "DN Debate. \"How are you going to conjure up 65,600 employees in elderly care?\"", "summary": "DN DEBATE. Who does the Tidö government imagine will take care of our elderly? Sweden is crying out for healthcare workers - yet my colleagues who are already doing the job are being deported, and increased salary requirements make it impossible to recruit new ones. How are you going? Either you have to admit your mistake and let people stay in the country or raise our wages, writes Sandra Vilppala, care assistant.", "title_original": "DN Debatt. ”Hur ska ni trolla fram 65 600 anställda inom äldreomsorgen?”", "summary_original": "DN DEBATT. Vilka är det Tidöregeringen föreställer sig ska ta hand om våra äldre? Sverige skriker efter vårdpersonal – ändå utvisas mina kollegor som redan gör jobbet, och höjda lönekrav gör det omöjligt att rekrytera nya. Hur ska ni ha det? Antingen får ni erkänna ert misstag och låta människor stanna i landet eller höja våra löner, skriver Sandra Vilppala, vårdbiträde.", "link": "https://www.dn.se/debatt/hur-ska-ni-trolla-fram-65-600-anstallda-inom-aldreomsorgen/", "date_display": "2026-02-28", "date_iso": "2026-02-28T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Hit their hotel: 'Flames several meters high'", "summary": "Debris from a drone crashed at a hotel on the luxury island of Palm Jumeirah in Dubai, causing a large fire with plumes of smoke visible over the city. Four people have been taken to hospital. \"It's unreal,\" says Silver Rosenfeldt, who lives at the hotel.", "title_original": "Slog ned på deras hotell: ”Lågor på flera meter”", "summary_original": "Rester från en drönare slog ned vid ett hotell på lyxön Palm Jumeirah i Dubai, och orsakade en stor brand vars rökpelare syntes över staden. Fyra personer har förts till sjukhus. ”Det är overkligt”, säger Silver Rosenfeldt som bor på hotellet.", "link": "https://www.svd.se/a/Ok8a23/familjen-bor-pa-hotell-fairmont-i-dubai-entren-traffades-av-dronare-fran-iran", "date_display": "2026-02-28", "date_iso": "2026-02-28T18:43:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 116, "title": "Svahn on the five-mile chaos: \"It's not going to happen like that\"", "summary": "Linn Svahn is critical of Sweden's handling of the closing Olympic five-mile where only two out of five possible blue-yellow skiers made it to the start. - I don't think it should happen like that, she tells Viaplay after the World Cup victory in Falun.", "title_original": "Svahn om femmilskaoset: ”Ska inte gå till så”", "summary_original": "Linn Svahn är kritisk till Sveriges hantering av den avslutande OS-femmilen där endast två av fem möjliga blågula skidåkare kom till start. – Jag tycker inte att det ska gå till så, säger hon till Viaplay efter världscupsegern i Falun.", "link": "https://www.dn.se/sport/svahn-om-femmilskaoset-ska-inte-ga-till-sa/", "date_display": "2026-02-28", "date_iso": "2026-02-28T18:15:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Karin Eriksson: Should Trump secure victory for Mette Frederiksen?", "summary": "On March 24, the Danes will go to the voting booths. Social Democratic Prime Minister Mette Frederiksen's best campaign worker may become US President Donald Trump.", "title_original": "Karin Eriksson: Ska Trump säkra segern åt Mette Frederiksen?", "summary_original": "Den 24 mars ska danskarna gå till röstbåsen. Den socialdemokratiska statsministern Mette Frederiksens bästa valarbetare kan bli USA:s president Donald Trump.", "link": "https://www.dn.se/varlden/karin-eriksson-ska-trump-sakra-segern-at-mette-frederiksen/", "date_display": "2026-02-28", "date_iso": "2026-02-28T18:08:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Fear of new attacks – Iranians are fleeing the big cities", "summary": "After the attacks on Iran, unrest and chaos have erupted in the country's major cities. Residents are fleeing to safer places, schools have been closed and many fear new attacks. - We have nowhere to go and will die here, says Minou 32.", "title_original": "Oro för nya attacker – iranier flyr storstäderna", "summary_original": "Efter attackerna mot Iran har oro och kaos utbrutit i landets storstäder. Invånare flyr till säkrare platser, skolor har stängts och många är rädda för nya angrepp. – Vi har ingenstans att ta vägen och kommer dö här, säger Minou 32.", "link": "https://www.dn.se/varlden/oro-for-nya-attacker-iranier-flyr-storstaderna/", "date_display": "2026-02-28", "date_iso": "2026-02-28T18:01:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Relief and concern among Iranians in Sweden: \"Just want the regime gone\"", "summary": "Iranians in Sweden are worried about what will happen after the US and Israeli bombings. At the same time, there is hope among regime critics - who believe that the attacks could be the beginning of the end for the Revolutionary Guard.", "title_original": "Lättnad och oro bland iranier i Sverige: ”Vill bara ha bort regimen”", "summary_original": "Iranier i Sverige är oroliga för vad som kommer hända efter USA:s och Israels bombningar. Samtidigt finns ett hopp bland regimkritikerna – som tror att attackerna kan vara början på slutet för Revolutionsgardet.", "link": "https://www.dn.se/sverige/lattnad-och-oro-bland-iranier-i-sverige-vill-bara-ha-bort-regimen/", "date_display": "2026-02-28", "date_iso": "2026-02-28T17:44:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Experts: Instability and chaos await if the regime falls", "summary": "Should the regime in Iran fall, an internal, unstable power vacuum awaits and a Middle East in which Israel will play a key role. To hope for an early democratic development where \"the people\" get the power and everything will be fine, is to hope for far too much, say experts. Furthermore, there is no doubt that the attacks violate international law.", "title_original": "Experter: Instabilitet och kaos väntar om regimen faller", "summary_original": "Skulle regimen i Iran falla väntar ett internt, instabilt maktvakuum och ett Mellanöstern där Israel får en nyckelroll. Att hoppas på en snar demokratisk utveckling där ”folket” får makten och allt bli bra, är att hoppas på för alldeles för mycket, menar experter. Dessutom råder det ingen tvekan om att anfallen strider mot internationell rätt.", "link": "https://www.dn.se/varlden/experter-instabilitet-och-kaos-vantar-om-regimen-faller/", "date_display": "2026-02-28", "date_iso": "2026-02-28T17:11:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Djurgården collapsed again against Leksand", "summary": "For the second time in two months, Leksand Djurgården was silent in the Avicii arena in SHL ice hockey. The last 5-0 was followed up with 5-2 on Saturday after the Dala team scored four straight goals and the home team collapsed again despite a dream start.", "title_original": "Djurgården kollapsade igen mot Leksand", "summary_original": "För andra gången på två månader tystade Leksand Djurgården i Avicii arena i SHL-ishockeyn. 5–0 senast följdes upp med 5–2 under lördagen efter att dalalaget gjort fyra raka mål och hemmalaget kollapsat på nytt trots en drömstart.", "link": "https://www.dn.se/sport/djurgarden-kollapsade-igen-mot-leksand/", "date_display": "2026-02-28", "date_iso": "2026-02-28T17:05:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "The meteorologist's warning before the Vasaloppet: \"It can get messy\"", "summary": "For many of Sweden's exercisers, the first Sunday in March is a time of celebration, with countless hours of training and other preparations. Everything to optimize their performance in the prestigious race. But not even the most dedicated skier can influence the weather, and on the night of Sunday, up to ten centimeters of snow is expected to fall over Sälen and Mora. SMHI has issued a yellow warning. Over northernmost Uppland and Värmland, the rain that moves in from the south turns into snow. - In the middle of the day tomorrow, and actually already from the morning, there is snow in the whole area. It is slowly moving east, but the western edge will not reach Sälenfjällen until somewhere around 3 pm in the afternoon, says TV4's meteorologist Martin Hagman. - So those who go between 8 am and 3 pm will have snow all the time from the morning - and quite a lot of snowfall besides, he adds. \"Do the best we can\" Vasaloppet's sports director Tommy Höglund believes that it is a matter of careful consideration of how late you can draw the tracks before Sunday's race. - We will do the best we can but have to make a balance for how late we should draw the tracks. If we draw the tracks too late, they will not have time to freeze together and will be crushed. If we leave too soon, the tracks will have time to snow again, he explains. The plan is to draw the tracks at midnight and then make a new assessment tomorrow morning. - Even if there is only three centimeters of snow, we will drive with scooters and a sled with weights that press the snow down into the track, says Tommy Höglund and adds: - We will also have track patrols the last mile and redo the tracks during the day - but then of course they won't have time to freeze. He also reminds that it is not only on the ski track that the weather warning applies. - It also applies on the roads, so it's important that people get high and leave in good time so that everyone makes it to the start, says the sports manager. No record times to be expected But it is not only the amount of snow that risks causing problems for the more than 14,000 registered for Sunday's race. - There is an easterly wind here. The", "title_original": "Meteorologens varning inför Vasaloppet: ”Kan bli stökigt”", "summary_original": "För många av Sveriges motionärer är den första söndagen i mars en högtidsstund, med otaliga timmar av träning och andra förberedelser. Allt för att optimera sin prestation i det prestigefulla loppet. Men inte ens den mest hängivne skidåkaren kan påverka vädret, och natten mot söndag väntas upp mot tio centimeter snö falla över Sälen och Mora. SMHI har utfärdat en gul varning. Över nordligaste Uppland och Värmland övergår regnet som drar in söderifrån i snö. – Mitt på dagen imorgon, och egentligen redan från morgonen så är det snö i hela det området. Det rör sig sakta österut men den västliga kanten når inte till Sälenfjällen förrän någonstans runt 15 på eftermiddagen, säger TV4:s meteorolog Martin Hagman. – Så de som åker mellan klockan 8 och klockan 15 kommer att ha snö hela tiden från morgonen – och ganska ymnigt snöfall dessutom, tillägger han. ”Gör så gott vi kan” Vasaloppets sportchef Tommy Höglund menar att det handlar om en noga avvägning för hur sent man kan dra spåren inför söndagens lopp. – Vi kommer att göra så gott vi kan men måste göra en avvägning för hur sent vi ska dra spåren. Drar vi spåren för sent så hinner de inte frysa ihop och blir sönderkörda. Drar vi för tidigt så hinner spåren snöa igen, förklarar han. Planen är att dra spåren vid midnatt och sedan göra en ny bedömning imorgon bitti. – Även om det bara kommer tre centimeter snö så kommer vi köra med skotrar och en släde med vikter som pressar ner snön i spåret, säger Tommy Höglund och tillägger: – Vi kommer också ha spårpatruller sista milen och dra om spåren under dagen – men då hinner de såklart inte frysa ihop. Han påminner också om att det inte bara är i skidspåret vädervarningen gäller. – Den gäller även på bilvägarna så det gäller att folk tar höjd och åker i god tid så att alla hinner fram till start, säger sportchefen. Inga rekordtider att vänta Men det är inte bara snömängderna som riskerar att ställa till det för de över 14 000 anmälda till söndagens lopp. – Det är ostvind här. Det blir inte rak motvind eftersom de åker lite sydost. Och ingen jättevind, men dock motvind och det behövs ju inte mycket motvind när man åker skidor för att det ska kännas, säger Martin Hagman. Motvinden gäller framförallt på förmiddagen innan den vrider om från ost, upp till nord för att sedan bli västlig. – Så att täten kommer ju få motvind. Det blir inga rekordtider, konstaterar han. –  Så småningom så kommer den att komma västerifrån. Men då är den är väldigt svag, säger Martin Hagman. ”Inte någon höjdare” Enligt meteorologen har årets Vasaloppsåkare haft otur. – Vi har haft en lång period av vinterväder. Och så exakt nu, när de ska åka, så blir det så här. Det är inte någon höjdare, säger Martin Hagman. En liten tröst för de som håller igång länge under söndagen är att snöfallet kommer att ge med sig fram mot kvällen, uppger han.  Samtidigt som snön vräker ner över Sveriges mellersta delar ser våren ut att ta ett rejält grepp om Götaland och Svealand. I veckan ser det nämligen ut att kunna bli barmark upp till Dalälven, trots att lite kallare luft är på ingång igen. – Nu är det så pass bra drag i solen på dagarna att även om du har fem till tio minus på nätterna så blir det fem till sju grader varmt på dagarna. Så det är ju mildare luft och en annan vädertyp så att den snön som finns i södra Sverige kommer bli barmark nu närmsta veckan, säger Martin Hagman och tillägger: – Det kan finnas fläckvis med snö kvar i Norduppland fram i nästa vecka, men i princip kommer det gå fort. I alla fall i Götaland och södra och mellersta Svealand.", "link": "https://www.tv4.se/artikel/7IYe1FPztKn765YPgGojOU/meteorologens-varning-infoer-vasaloppet-kan-bli-stoekigt", "date_display": "2026-02-28", "date_iso": "2026-02-28T17:00:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vadret", "/sport", "/vasaloppet", "/snoovader", "/smhi", "/vadervarningar"]}, {"id": 123, "title": "Iran strikes back after US and Israeli attack", "summary": "Iran's regime was the target of targeted attacks by Israel and the United States, and Israeli Prime Minister Benjamin Netanyahu says there are \"many signs\" that Ayatollah Ali Khamenei is dead. In retaliation, Iran has fired missiles at Israel and US bases in the Middle East.", "title_original": "Iran slår tillbaka efter USA:s och Israels attack", "summary_original": "Irans regim var målet för Israels och USA:s riktade attacker och den israeliska premiärministern Benjamin Netanyahu säger att det finns ”många tecken” på att ayatollan Ali Khamenei är död. Som vedergällning har Iran avfyrat missiler mot Israel och amerikanska baser i Mellanöstern.", "link": "https://www.dn.se/varlden/iran-slar-tillbaka-efter-usas-och-israels-attack/", "date_display": "2026-02-28", "date_iso": "2026-02-28T16:45:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Svahn won in front of the King: \"He brings luck to our team\"", "summary": "FALUN. The Olympic champion in sprints, Linn Svahn, had a great performance and won when the World Cup restarted with sprints at Lugnet in Falun. In the stands at the finish line stood King Carl XVI Gustaf with a satisfied smile. - It feels like he brings luck to our team, so we hope he continues to visit us, Svahn said in the victory interview at the arena.", "title_original": "Svahn vann framför Kungen: ”Han för tur till vårt lag”", "summary_original": "FALUN. OS-mästarinnan i sprint, Linn Svahn, hade stor uppvisning och vann när världscupen startade om med sprint på Lugnet i Falun. På läktaren vid målrakan stod kung Carl XVI Gustaf med ett nöjt leende. – Det känns som att han för tur till vårt lag, så vi hoppas att han fortsätter att besöka oss, sa Svahn i segerintervjun på arenan.", "link": "https://www.dn.se/sport/efter-os-guldet-svahn-vinnare-aven-i-falun/", "date_display": "2026-02-28", "date_iso": "2026-02-28T16:24:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Professor: \"Spirals in the abdominal cavity must be surgically removed\"", "summary": "It is unusual for an IUD to end up in the abdominal cavity. When this happens, it must be located and surgically removed. Otherwise, there is a risk that it will cause problems in the long run. - We always take things out of the body that shouldn't be there, says Helena Kopp Kallner, professor at Karolinska Institutet.", "title_original": "Professor: ”Spiraler i bukhålan ska opereras bort”", "summary_original": "Att en spiral hamnar i bukhålan är ovanligt. När det sker ska den lokaliseras och opereras bort. Annars finns risken att den på sikt orsakar besvär. – Vi tar alltid ut saker ur kroppen som inte ska vara där, säger Helena Kopp Kallner, professor vid Karolinska institutet.", "link": "https://www.dn.se/sverige/professor-spiraler-i-bukhalan-ska-opereras-bort/", "date_display": "2026-02-28", "date_iso": "2026-02-28T15:58:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Cecilia's spiral is in the abdominal cavity - since 15 years: \"It hurts so much\"", "summary": "DOROTHEA. The copper IUD was inserted incorrectly 15 years ago. It ended up in the abdominal cavity and is now stuck in the intestinal wall. Cecilia Nilsson has had severe pain for several years. When she sought help to remove the IUD - it was first a cross stop. - I was so sad and disappointed, she says.", "title_original": "Cecilias spiral finns i bukhålan – sedan 15 år: ”Gör så ont”", "summary_original": "DOROTEA. Kopparspiralen sattes in fel för 15 år sedan. Den hamnade i bukhålan och sitter nu fast i tarmväggen. Cecilia Nilsson har haft svåra smärtor i flera år. När hon sökte hjälp för att få bort spiralen – blev det först tvärstopp. – Jag var så ledsen och besviken, säger hon.", "link": "https://www.dn.se/sverige/cecilias-spiral-finns-i-bukhalan-sedan-15-ar-gor-sa-ont/", "date_display": "2026-02-28", "date_iso": "2026-02-28T15:58:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Israel and the US attack Iran - chat with DN's reporters", "summary": "Israel and the US have attacked Iran. Will the regime in Iran fall? How does the outside world react? DN's readers have chatted with DN's correspondents Emma Bouvin and Ingmar Nevéus about the conflict.", "title_original": "Israel och USA attackerar Iran – chatta med DN:s reportrar", "summary_original": "Israel och USA har attackerat Iran. Kommer regimen i Iran att falla? Hur reagerar omvärlden? DN:s läsare har chattat med DN:s korrespondenter Emma Bouvin och Ingmar Nevéus om konflikten.", "link": "https://www.dn.se/varlden/israel-och-usa-attackerar-iran-chatta-med-dns-reportrar/", "date_display": "2026-02-28", "date_iso": "2026-02-28T15:12:49+00:00", "sour
