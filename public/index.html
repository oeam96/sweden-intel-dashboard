a", "link": "https://www.tv4.se/artikel/37Lh2KRQLj1H7FqqM5hHBq/sa-startar-sverige-mot-tunisien", "date_display": "2026-06-15", "date_iso": "2026-06-15T01:36:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 143, "title": "The Russian threat after the border: \"Then it will explode in front of your nose\"", "summary": "Early in the morning, soldiers from Britain's Royal Marine Corps were winched down onto Smyrto's ship deck from helicopters. For six hours, the operation went on aboard the boat. In images from the operation, soldiers with automatic weapons pointed in front of them can be seen making their way through dark corridors and into cabins below deck. The oil tanker is flagged in Cameroon and was in the English Channel at the time of the operation after sailing in from the east on Saturday. The ship has since been transported to Weymouth where it is now anchored. \"This operation deals another blow to Russia and reminds those fueling Putin's war in Ukraine that they cannot hide,\" said Prime Minister Keir Starmer after the operation. \"Pirates\" On X, Ukrainian President Volodymyr Zelenskyi thanked Britain for taking important measures against the Russian shadow fleet. \"Europe urgently needs to take legislative measures to enable not only the detention of tankers and restrictions on oil transport, but also the confiscation of the oil they transport,\" Zelenskyy wrote. But in Russia there is a different sound in the barking. Dmitry Rogozin is a senator from Zaporizhzhya, former head of Roscosmos and former Russian ambassador to NATO.  On Telegram, he calls Great Britain \"pirates\" and believes that it is surprising that Keir Starmer has the guts to brag about it on social media. \"Slamming in front of their noses\" The Swedish coast guard has also attacked Russian shadow vessels on several occasions during the spring. Most recently at the beginning of May, when the vessel Jin Hui was boarded outside Trelleborg. Dmitry Rogozin is getting tired of that kind of intervention. He believes that Russia should now mount mines and triggers on the shadow ships - so that they can be sunk if a foreign power tries to board them. \"The detonation must take place if the corresponding order is given or if the tanker deviates from its route and is forced to enter a foreign port. If it slams a couple of times in front of their noses, with oil spills and d", "title_original": "Ryska hotet efter bordningen: ”Då smäller det framför näsan”", "summary_original": "Tidigt på morgonen vinschades soldater ur Storbritanniens kungliga marinkår ner på Smyrtos fartygsdäck från helikoptrar. I sex timmar pågick operationen ombord båten. På bilder från insatsen kan soldater med automatvapen riktade framför sig ses ta sig fram genom dunkla korridorer och in i hytter under däck. Oljetankern är flaggad i Kamerun och befann sig vid tidpunkten för insatsen på Engelska kanalen efter att ha seglat in österifrån på lördagen. Fartyget har sedan dess transporterats till Weymouth där det nu ligger förankrat. – Den här operationen utdelar ännu ett slag mot Ryssland och påminner dem som göder Putins krig i Ukraina om att de inte kan gömma sig, sade premiärminister Keir Starmer efter insatsen. ”Pirater” På X tackade Ukrainas president Volodymyr Zelenskyj Storbritannien för att landet vidtog viktiga åtgärder mot den ryska skuggflottan. ”Europa behöver snarast vidta lagstiftningsåtgärder för att möjliggöra inte bara kvarhållande av tankfartyg och restriktioner för oljetransporter, utan även konfiskering av den olja de transporterar”, skrev Zelenskyj. Men i Ryssland är det annat ljud i skällan. Dmitrij Rogozin är senator i Zaporizjzja, tidigare Roskosmos-chef och före detta rysk ambassadör i Nato.  På Telegram kallar han Storbritannien för ”pirater” och menar att det är uppseendeväckande att Keir Starmer har mage att skryta om saken i sociala medier. ”Smäller framför näsan på dem” Även den svenska kustbevakningen har vid flera tillfällen slagit till mot ryska skuggfartyg under våren. Senast i början på maj, då fartyget Jin Hui bordades utanför Trelleborg. Den sortens interventioner börjar Dmitrij Rogozin få nog av. Han anser att Ryssland nu borde montera minor och utlösare på skuggfartygen – så att de kan sänkas om en främmande makt försöker gå ombord. ”Detonationen ska ske om motsvarande order ges eller om tankfartyget avviker från sin rutt och tvingas gå in i en främmande hamn. Om det ett par gånger smäller framför näsan på dem, med oljeutsläpp och de miljökonsekvenser som följer, kommer de genast att tänka om”, skriver han i inlägget.", "link": "https://www.tv4.se/artikel/7BqafAfJkxTaXdru3iZzqp/ryska-hotet-efter-bordningen-da-smaeller-det-framfoer-naesan", "date_display": "2026-06-14", "date_iso": "2026-06-14T20:15:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ryssland", "/sanktioner-mot-ryssland", "/ukrainakonflikten", "/vladimir-putin", "/storbritannien"]}, {"id": 144, "title": "\"When I received the Holy Spirit, I was the one who pushed the conversations about faith\"", "summary": "Johanna Bode led a seminar on the Spirit at Nyhemsvekkan's youth weekend", "title_original": "”När jag fick den helige Ande var det jag som pushade samtalen om tro”", "summary_original": "Johanna Bode ledde seminarium om Anden på Nyhemsveckans ungdomshelg", "link": "https://www.dagen.se/nyheter/naer-jag-fick-den-helige-ande-var-det-jag-som-pushade-samtalen-om-tro/10394425", "date_display": "2026-06-14", "date_iso": "2026-06-14T18:19:32+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 145, "title": "The cameras capture the panic at Ica: \"Run! A naked man with a knife!\"", "summary": "It starts as a completely normal afternoon in Borås at the beginning of April. But suddenly several people in the parking lot of Ica City Knalleland see a man walking alongside the cars. - There is a man who walks completely naked in the parking lot here, with a large knife in his hand, says a person to SOS alarm. He walks into the shop with determined steps and starts shouting. That's when several people see that he is bloody along his legs and on his head. - My image of him is that he had very short hair and walked very awkwardly, that he hangs with his shoulders. He held the knife straight down along the side of the body, says a person in questioning. - He just walked around and kind of smiled sheepishly. The fire alarm goes off in the store and people start rushing out in panic. A woman stands in the dairy section of the store with headphones and begins to see people fleeing the store. A woman with a pram comes forward. - Whereupon I take off my headphones and I hear someone shout, \"Run! It's a naked man with a knife!\".  Keeping an eye on the police Police and an ambulance are called to the scene and several police officers enter the store - heavily armed with automatic weapons. They make their way in and finally see the man, whereupon they point their guns at him and ask him to drop the knife. - Then I see how he grips the knife a little harder again and slowly begins to walk in our direction and has locked eyes on us, says one of the police officers during interrogation. One of the officers uses the stun gun twice and the man falls to the ground. When they then try to talk to him, he is noticeably absent and difficult to connect with. They ask him why he went naked to Ica and he replies that he \"felt like it\". What were you thinking then? - Murdering people. How did you get here? - Through your mother. Admits all crimes The man is taken to hospital and then arrested. Now he is being charged with twelve counts of illegal threats and serious crime against the Knife Act. He is also suspected of threatening an official. The man admits to all the crimes. In questioning, he describes how he had a psychotic period and wanted to be arrested by the police that day", "title_original": "Kamerorna fångar paniken på Ica: ”Spring! En naken man med kniv!”", "summary_original": "Det börjar som en helt vanlig eftermiddag i Borås i början av april. Men plötsligt ser flera personer på parkeringen till Ica City Knalleland en man komma gående längs bilarna. – Det är en man som går helt naken på parkering här, med en stor kniv i handen, säger en person till SOS alarm. Han går in i butiken med bestämda steg och börjar skrika. Det är då flera personer ser att han är blodig längs benen och på huvudet. – Min bild av honom är att han hade väldigt kort hår och gick väldigt grottigt, att han hänger med axlarna. Han höll kniven rakt ner längs sidan av kroppen, säger en person i förhör. – Han gick bara runt och typ log skumt. Brandlarmet utlöses i butiken och människor börjar rusa ut i panik. En kvinna står i mejeriavdelningen i butiken med hörlurar och börjar se hur människor flyr butiken. En kvinna med barnvagn kommer fram. – Varpå jag tar av mig mina hörlurar och jag hör någon skrika, \"Spring! Det är naken man med kniv!\".  Spänner blicken i polisen Polis och ambulans larmas till platsen och flera poliser går in i butiken – tungt beväpnade med automatvapen. De tar sig in och ser till slut mannen, varpå de riktar sina vapen mot honom och ber honom släppa kniven. – Sen ser jag hur han greppar ett hårdare tag om kniven igen och börjar sakta gå i vår riktning och har låst blicken emot oss, säger en av poliserna i förhör. En av poliserna använder elchockvapen två gånger och mannen faller till marken. När de sedan försöker prata med honom är han märkbart borta och svår att få kontakt med. De frågar honom varför han gick naken till Ica och han svara att han ”kände för det”. Vad hade du för tanke då? – Att mörda folk. Hur tog du dig hit? – Genom din morsa. Erkänner alla brott Mannen körs till sjukhus och anhålls sedan. Nu åtalas han för tolv fall av olaga hot och grovt brott mot knivlagen. Han misstänks också för hot mot tjänsteman. Mannen erkänner samtliga brott. I förhör beskriver han hur han haft en psykotisk period och ville bli gripen av polis den där eftermiddagen. – Jag förstod inte riktigt vad jag höll på med. – Jag gick runt där vid fruktdisken. Då tog jag fram kniven och visade en hotfullhet. Så sprang alla iväg och så gick larmet. Så gick jag runt och hetsade. Till slut kom polisen och då gömde jag mig. Sedan kastade jag en burk med oliver i marken. Sedan kom de, då var det något i mig som sa att jag skulle attackera mot polisen. Han hade innan dess klottrat ner en affär och skurit sig själv. Han menar också att han aldrig ville skada någon eller mörda någon. – Men det var absolut ingen plan att jag skulle göra något sånt. Men det var som att det\nonda i mig tog över och sade så.", "link": "https://www.tv4.se/artikel/64khV6RWAN4jN18GpUE9Z8/kamerorna-fangar-paniken-pa-ica-spring-en-naken-man-med-kniv", "date_display": "2026-06-14", "date_iso": "2026-06-14T16:16:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/knivdad", "/boras", "/brott-och-straff"]}, {"id": 146, "title": "Sports Minister Jakob Forssmed (KD) releases last-minute World Cup song", "summary": "With less than a day until kick-off, Jakob Forssmed releases a new, country-smelling, World Cup song that he hopes will spur on the national football team", "title_original": "Idrottsminister Jakob Forssmed (KD) släpper sista-minuten-VM-låt", "summary_original": "Med mindre än ett dygn till avspark släpper Jakob Forssmed en ny, countrydoftande, VM-låt som han hoppas ska sporra fotbollslandslaget", "link": "https://www.dagen.se/nyheter/idrottsminister-jakob-forssmed-kd-slaepper-sista-minuten-vm-lat/10394373", "date_display": "2026-06-14", "date_iso": "2026-06-14T15:02:27+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 147, "title": "C sources: Planning an election coup - wants to twist the important issue in the election", "summary": "The Center Party in Nacka has stealthily started the election campaign through a local summer campaign, where the entire focus is on school issues. There are three posters, all of which relate to school-related topics. Municipal councilor Johan Krogh (C) says that the choice of subject is not a coincidence. - The school is one of the largest expenditure items in the municipality's budget and generally one of the most important issues in the election. Then this campaign has nothing to do with the Liberals. But it could certainly be that it attracts voters who define themselves as liberal, says Johan Krogh (C). A wasted vote The campaign in Nacka is not centrally coordinated with the Center Party. But several sources for TV4 state that the Center Party intends to invest heavily in school issues in the election campaign, in the hope of being able to win over liberal voters. The fact that L was for a long time below the four percent barrier to the Riksdag also means that the Center Party hopes to get a discussion going on that a liberal vote would be a wasted vote. Niels Paarup-Petersen, school policy spokesperson, confirms large parts of the information. - It is clear that we will talk a lot about school in the election campaign. We are already seeing many former Liberals come to us because they like our school policy. If we can get one percent of the Liberals' voters in the election, it makes a huge difference. Then the center of gravity ends up in the center of politics, and not on the right or left side, says Niels Paarup-Petersen (C). The Liberals not worried The Liberals themselves say they welcome being challenged as a school party, and are not particularly worried by the Center Party's attempts. - It is good if more parties want to talk about school issues. I think that will benefit us in the long run. But if the Center Party is going to try to build trust here in just a few months, yes - I think it will be difficult for them, says Lotta Edholm (L), Minister of Secondary Education, Higher Education and Research. \"Not just game theory\" Historically, there have been many attempts to twist competitors' parade questions before an election. A recent example is that Kristde", "title_original": "C-källor: Planerar en valkupp – vill sno den viktiga frågan i valet", "summary_original": "Centerpartiet i Nacka har smygstartat valrörelsen genom en lokal sommarkampanj, där hela fokuset ligger på skolfrågor. Tre affischer finns, som alla rör skolrelaterade ämnen. Kommunalrådet Johan Krogh (C) säger att ämnesvalet inte är en slump. – Skolan är en av de största utgiftsposterna i kommunens budget och generellt en av de viktigaste frågorna i valet. Sedan har den här kampanjen ingenting med Liberalerna att göra. Men det kan säkert vara så att den attraherar väljare som definierar sig själva som liberala, säger Johan Krogh (C). En bortkastad röst Kampanjen i Nacka är inte samordnad med Centerpartiet centralt. Men flera källor till TV4 gör gällande att Centerpartiet tänker satsa stort på skolfrågor i valrörelsen, i förhoppningen om att kunna ta liberala väljare. Det faktum att L under lång tid legat under fyraprocents-spärren till riksdagen, gör också att Centerpartiet hoppas kunna få till en diskussion om att en liberal röst skulle vara en bortkastad röst. Niels Paarup-Petersen, skolpolitisk talesperson bekräftar stora delar av uppgifterna. – Det är klart att vi kommer att prata mycket skola i valrörelsen. Vi ser redan att många tidigare liberaler går till oss för att de gillar vår skolpolitik. Kan vi ta en procent av Liberalernas väljare i valet gör det jättestor skillnad. Då hamnar tyngdpunkten i mitten av politiken, och inte på höger- eller vänsterkanten, säger Niels Paarup-Petersen (C). Liberalerna inte oroade Liberalerna själva säger att de välkomnar att utmanas som skolparti, och är inte särskilt oroade av Centerpartiets försök. – Det är väl bra om fler partier vill prata skolfrågor. Det tror jag kommer att gynna oss på sikt. Men om Centerpartiet ska försöka bygga ett förtroende här på bara några månader, ja - jag tror att det blir svårt för dem, säger Lotta Edholm (L), gymnasie- högskole- och forskningsminister. ”Inte bara spelteori” Historiskt har det varit många försök att sno konkurrenters paradfrågor inför ett val. Ett nyligt exempel är att Kristdemokraterna utmanade Centerpartiet och försökte bli \"det nya landsbygdspartiet\". Det gav dock inget större avtryck i valresultatet 2022, där KD tappade en procent jämfört med föregående val. Mer framgångsrikt var när Moderaterna 2006 utmålade sig själva som \"Sveriges enda arbetarparti\" och vann statsministerposten från Socialdemokraterna. – Det viktiga för att lyckas tror jag är att visa väljarna att det inte bara handlar om spelteori och taktiserande, utan att vi ärligt tycker att skolan är bland de viktigaste frågorna. Och att vi har lösningar och policys för att lösa de problem som skolan faktiskt har idag, säger Niels Paarup-Petersen, skolpolitisk talesperson för Centerpartiet. – Jag tror det beror mycket på vad man har för förtroende i en fråga från början. Och i Novus opinionsundersökningar så har Centerpartiet historiskt sett haft väldigt dåliga förtroendesiffror när det gäller just skolfrågor, säger Lotta Edholm (L), gymnasie- högskole- och forskningsminister.", "link": "https://www.tv4.se/artikel/PmtO20wB7llPTN64OYXWL/c-kaellor-planerar-en-valkupp-vill-sno-den-viktiga-fragan-i-valet", "date_display": "2026-06-14", "date_iso": "2026-06-14T13:27:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Valet 2026", "/valet-2026", "/inrikes", "/valet-2022/centerpartiet", "/valet-2022/liberalerna", "/skolpolitik", "/politik"]}, {"id": 148, "title": "Court says no to Seyfo monument in Södertälje", "summary": "The municipality's decision to erect a monument to the genocide of Christians in 1915 was appealed by a resident of Turkish origin", "title_original": "Domstol säger nej till Seyfo-monument i Södertälje", "summary_original": "Kommunens beslut att resa ett monument över folkmordet på kristna år 1915 överklagades av en invånare med turkiskt påbrå", "link": "https://www.dagen.se/nyheter/domstol-saeger-nej-till-seyfo-monument-i-soedertaelje/10393996", "date_display": "2026-06-14", "date_iso": "2026-06-14T11:36:42+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "GW on the violent act in Alvesta: \"Ended in the worst possible way\"", "summary": "The alarm about the incident came in to the police at 10.38 on Saturday morning. When patrols arrived at the scene, they found two seriously injured girls, who are now being treated in hospital. Shortly afterwards, the suspected perpetrator was found dead.  The police have been reticent with information, which Leif GW Persson believes is common in this type of event. The police are waiting with information According to Leif GW Persson, there are two main reasons why the police are delaying releasing information: partly to protect the investigation, partly because relatives must be notified before information reaches the public. - There is no risk that the public could be harmed in this case considering that the only possible perpetrator is dead, says Leif GW Persson. He believes that the police's restraint can sometimes create concern. - It worries people unnecessarily, says Leif GW Persson. - But the public need not worry that it is the beginning of something worse, he continues. \"Often no warning signs\" Leif GW Persson emphasizes that he does not know more about the act of violence, but he has his theory. - Such events, if it is now as it usually is. I don't know because you didn't say anything. But I get that it's a family drama that ended in the worst possible way, says GW. - It is difficult, especially if it is previously unpunished people. Often families who live quite isolated from the outside world. No warning signals have occurred. It is almost an exception that it does so, he continues.", "title_original": "GW om våldsdådet i Alvesta: ”Slutat på värsta tänkbara sätt”", "summary_original": "Larmet om händelsen kom in till polisen vid 10.38 på lördagsförmiddagen. När patruller anlände till platsen påträffades två allvarligt skadade flickor, som nu vårdas på sjukhus. Kort därefter hittades den misstänkta gärningsmannen död.  Polisen har varit återhållsam med information, vilket Leif GW Persson menar är vanligt vid den här typen av händelser. Polisen avvaktar med information Enligt Leif GW Persson finns det två huvudsakliga skäl till att polisen dröjer med att lämna ut uppgifter: dels för att skydda utredningen, dels för att anhöriga ska underrättas innan information når allmänheten. – Det är ingen risk för att allmänheten kan komma till skada i det här fallet med tanke på att den enda tänkbara gärningspersonen är död, säger Leif GW Persson. Han menar att polisens återhållsamhet ibland kan skapa oro. – Det oroar folk i onödan, säger Leif GW Persson. – Men allmänheten behöver inte oroa sig för att det är inledningen på nåt värre, fortsätter han. ”Ofta inga varningssignaler” Leif GW Persson understryker att han inte vet mer om våldsdådet, men han har sin teori. – Sådana händelser, om det nu är som det brukar vara. Jag vet ju inte det i och med att man inte sagt någonting. Men jag får för mig att det är ett familjedrama som slutat på värsta tänkbara sätt, säger GW. – Det är svårt, särskilt om det är tidigare ostraffade personer. Ofta familjer som lever ganska avskilda från omvärlden. Inga varningssignaler har gått fram. Det är närmast undantag att det gör det, fortsätter han.", "link": "https://www.tv4.se/artikel/6HX5jD4Vkt6kyoA7oXUCYW/leif-gw-persson-om-skjutningen-i-alvesta-ett-familjedrama-av-vaersta-slag", "date_display": "2026-06-14", "date_iso": "2026-06-14T11:15:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/brott-och-straff", "/personer/leif-gw-persson", "/alvesta"]}, {"id": 150, "title": "Big test: Here are the best food herring for midsummer", "summary": "The tasting panel, led by Erik Videgård, consisted of the dog coach Fredrik Steen, the cleaning expert Marléne Eriksson and the presenter Arantxa Álvarez. The task was simple: to blind test five kinds of edible sardines and assess taste, texture and appearance. It quickly became apparent that the differences between the herrings were greater than the panel had expected. First up was Klädesholmen, which received a cool reception. The panel thought the herring was too salty and lacked depth of flavour. Fredrik Steen was particularly critical of the consistency. - It looked like herring, but I would have liked a bit more chewing resistance and spice, says Arantxa Álvarez. Divided opinions about several varieties The classic food herring from Abba received significantly better reviews. The panel appreciated the balance between saltiness and acidity, which was enough for a second place in the test. The Ica herring had a tougher time. Despite its fine appearance, it was criticized for being tasteless and containing a lot of bone. When Garant was served, the mood quickly changed. Both Marléne Eriksson and Arantxa Álvarez highlighted the mild flavor and the well-balanced seasoning. - Perfect beginner herring, says Arantxa Álvarez.  Marléne Eriksson agreed with the assessment and also highlighted the herring's mild taste.  Garant took home the victory The last herring, Coop, created the biggest disagreement of the day. Arantxa Álvarez gave the highest rating and praised both taste and texture, while Fredrik Steen was significantly less impressed. - It was like getting cat food in the mouth, he says. When the points were tallied it was clear that Garant was the winner of the test, with Abba in second place. Klädesholmen and Ica ended up lower on the list. At the same time, the panel was able to state that all food herrings do not taste as much midsummer.", "title_original": "Stort test: Här är bästa matjessillen till midsommar", "summary_original": "Smakpanelen, ledd av Erik Videgård, bestod av hundcoachen Fredrik Steen, städexperten Marléne Eriksson och programledaren Arantxa Álvarez. Uppgiften var enkel: att blindtesta fem sorters matjessill och bedöma smak, konsistens och utseende. Det visade sig snabbt att skillnaderna mellan sillarna var större än panelen hade väntat sig. Först ut var Klädesholmen, som fick ett svalt mottagande. Panelen tyckte att sillen var för salt och saknade djup i smaken. Fredrik Steen var särskilt kritisk till konsistensen. – Den såg ut som sill, men jag hade velat ha lite mer tuggmotstånd och krydda, säger Arantxa Álvarez. Delade åsikter kring flera sorter Den klassiska matjessillen från Abba fick betydligt bättre omdömen. Panelen uppskattade balansen mellan sälta och syra, vilket räckte till en andraplats i testet. Ica-sillen hade det tuffare. Trots ett fint utseende fick den kritik för att vara smaklös och innehålla mycket ben. När Garant serverades svängde stämningen snabbt. Både Marléne Eriksson och Arantxa Álvarez lyfte fram den milda smaken och den välbalanserade kryddningen. – Perfekt nybörjarsill, säger Arantxa Álvarez.  Marléne Eriksson instämde i omdömet och lyfte också fram sillens milda smak.  Garant tog hem segern Den sista sillen, Coop, skapade dagens största oenighet. Arantxa Álvarez gav högsta betyg och hyllade både smak och konsistens, medan Fredrik Steen var betydligt mindre imponerad. – Det var som att få in kattmat i truten, säger han. När poängen räknats samman stod det klart att Garant blev testets vinnare, med Abba på andra plats. Klädesholmen och Ica hamnade längre ner på listan. Panelen kunde samtidigt konstatera att alla matjessillar inte smakar lika mycket midsommar.", "link": "https://www.tv4.se/artikel/4qZOGbxPt6FQpDflYbnIX5/smakpanelen-haer-aer-sillen-som-lyfter-midsommarbordet", "date_display": "2026-06-14", "date_iso": "2026-06-14T10:36:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Smakpanelen", "/smakpanelen", "/midsommar", "/sill", "/mat", "/tester", "/nyhetsmorgon"]}, {"id": 151, "title": "Charging for parents to sit with their children - airlines are being investigated", "summary": "The Irish low-cost airline Ryanair is being investigated by Britain's competition authority after the company introduced a fee that parents are forced to pay to sit next to their children, reports Sky News. According to the airline's terms and conditions, parents must pay to sit next to children between the ages of two and eleven, who must sit with at least one of their parents. The fee is £8 per flight, corresponding to approximately SEK 100. May contravene the Consumer Protection Act The authority is investigating whether the fee may be about so-called \"drip pricing\", where mandatory fees are not immediately clear. It may run afoul of rules that require businesses to display a total price including all unavoidable charges, so consumers can compare prices and understand the true cost. At the same time, the authority states that the investigation is at an early stage and that the authority has not yet drawn any conclusions about whether the airline broke the law. Ryanair is the only major airline flying from Britain to impose such a fee, according to the country's competition authority. Calling the investigation a \"scam\" Ryanair describes the investigation as a \"scam\". \"Like all adults who select a reserved seat, adults traveling with children pay a reserved seat fee, but can select reserved seats next to them for up to four children on the same booking free of charge,\" a Ryanair spokesperson told Sky News. How the investigation proceeds depends on what evidence comes to light, the competition authority states.", "title_original": "Tar betalt för att föräldrar ska få sitta med sina barn – flygbolag utreds", "summary_original": "Det irländska lågprisflygbolaget Ryanair utreds av Storbritanniens konkurrensmyndighet efter att bolaget infört en avgift som föräldrar tvingas betala för att få sitta bredvid sina barn, rapporterar Sky News. Enligt flygbolagets villkor måste föräldrar betala för att få sitta bredvid barn mellan två och elva år, som ska sitta med minst en av sina föräldrar. Avgiften är på 8 pund per flygning, motsvarande cirka 100 kronor. Kan strida mot konsumentskyddslagen  Myndigheten utreder om avgiften kan handla om så kallad ”drip pricing”, där obligatoriska avgifter inte är omedelbart tydliga. Det kan strida mot regler som kräver att företag visar ett totalpris inklusive alla oundvikliga avgifter, så att konsumenter kan jämföra priser och förstå den verkliga kostnaden. Samtidigt uppger myndigheten att utredningen är i ett tidigt skede och att myndigheten ännu inte har dragit några slutsatser om huruvida flygbolaget brutit mot lagen. Ryanair är det enda stora flygbolag som flyger från Storbritannien som inför en sådan avgift, enligt landets konkurrensmyndighet. Kallar utredningen för ”bluff” Ryanair beskriver utredningen som en ”bluff”. – Precis som alla vuxna som väljer en reserverad plats betalar vuxna som reser med barn en avgift för en reserverad plats, men kan välja reserverade platser bredvid dem för upp till fyra barn på samma bokning utan kostnad, säger en talesperson för Ryanair till Sky News. Hur utredningen går vidare beror på vilka bevis som kommer fram, uppger konkurrensmyndighet.", "link": "https://www.tv4.se/artikel/6BQWqsVxPvMYjbqimcpl3q/tar-betalt-foer-att-foeraeldrar-ska-fa-sitta-med-sina-barn-flygbolag-utreds", "date_display": "2026-06-14", "date_iso": "2026-06-14T08:46:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/flygbolag", "/flygresor"]}, {"id": 152, "title": "That's what happened to the couples in GVFÖ - kissed another woman at a party", "summary": "What really happened after the camera lights went out? In \"Married at first sight - what happened next?\" the four couples meet again, a year after they were matched with each other. During the course of the program, it appears that none of the couples are together anymore. Henrik Fransson and Jasmine Rosell have gone their separate ways since he kissed another woman at a party, something that caused Jasmine to end the relationship. In the episode, he hopes to get a second chance, but Jasmine stands by her decision. They stayed together the longest John Anväg and Anna Lallo are the couple who stayed together the longest - they filed for divorce just over six months after they agreed to continue being married. Anna Lallo says that she never had such strong feelings for John as he did for her. Sébastian Nemorin and Amanda Reventlid broke up and left the program before the decision day. In the episode, they meet again and talk about what went wrong – Sébastian's unwanted sexual innuendos caused her to leave the relationship. \"We were a little too different\" Sofie Cassman Eklöf and Emilia Blomqvist continued to date a few months after the filming of the season, but then broke up. The relationship stopped at friendship rather than feelings of love, Sofie tells TT: - We were a little too different for it to last in the long run. We also lacked some depth in our relationship. But I hold no grudge against Emilia, on the contrary. I'm glad we did this trip together. Married at first sight - what happened next is broadcast on SVT Play and shown on SVT1 at 20.30 on Monday.", "title_original": "Så gick det för paren i GVFÖ – kysste annan kvinna på fest", "summary_original": "Vad hände egentligen efter att kameralamporna slocknade? I ”Gift vid första ögonkastet – vad hände sen?” möts de fyra paren igen, ett år efter att de blev matchade med varandra. Under programmets gång framgår det att inget av paren längre är tillsammans. Henrik Fransson och Jasmine Rosell har gått skilda vägar sedan han kysste en annan kvinna på en fest, något som fick Jasmine att avsluta relationen. I avsnittet hoppas han på att få en andra chans, men Jasmine står fast vid sitt beslut. De höll ihop längst John Anväg och Anna Lallo är det par som höll ihop längst – de lämnade in skilsmässoansökan dryga halvåret efter att de sagt ja till att fortsätta vara gifta. Anna Lallo berättar att hon aldrig fick lika starka känslor för John som han fick för henne. Sébastian Nemorin och Amanda Reventlid gjorde slut och lämnade programmet före beslutsdagen. I avsnittet möts de igen och pratar om vad som gick fel – Sébastians oönskade sexuella anspelningar fick henne att lämna relationen. ”Vi var lite för olika” Sofie Cassman Eklöf och Emilia Blomqvist fortsatte att dejta några månader efter inspelningen av säsongen, men gjorde sedan slut. Relationen stannade vid vänskap snarare än kärlekskänslor, berättar Sofie för TT: – Vi var lite för olika för att det skulle hålla i det långa loppet. Vi saknade också lite djup i vår relation. Men jag hyser inget agg mot Emilia, tvärtom. Jag är glad att vi gjorde den här resan ihop. Gift vid första ögonkastet – vad hände sen sänds på SVT Play och visas på SVT1 klockan 20.30 på måndagen.", "link": "https://www.tv4.se/artikel/tt-260614-gvfo1-df6c3975/sa-gick-det-for-paren-i-gvfo", "date_display": "2026-06-14", "date_iso": "2026-06-14T05:20:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/gift-vid-forsta-ogonkastet", "/svt"]}, {"id": 153, "title": "The storm felled millions of trees - now the pest threatens to strike", "summary": "What started with the storm Johannes now risks developing into a much bigger problem. When over eleven million cubic meters of forest were blown over during the winter, ideal conditions were simultaneously created for the spruce bark borer. The fallen firs act as a perfect nursery for the insect. There, the bark beetles can lay their eggs and develop undisturbed during the summer.  The Norwegian Forestry Agency follows developments closely in the hardest hit areas in Dalarna, Gävleborg and Västernorrland. Can spread to healthy forest The biggest concern is not the already fallen trees, but what happens next year. If the population of spruce bark beetles grows large enough, they can leave the windfalls and begin to attack living spruces.\n\n- Weakened trees are what they attack in the first place. But if the population of the spruce bark beetle becomes too large, they will also venture into standing forest and try to reproduce there, says Magnus Martinsson.\n\nPrevious outbreaks have shown the consequences it can have. After the dry summers of 2018, large parts of the country were affected by extensive bark beetle damage. Since then, the losses for Swedish forest owners are estimated at around SEK 14 billion. The males come first On the storm-felled trees you can already see clear signs of activity. Small holes in the bark reveal that the first bark borers have arrived.\n\n- It seems that only the males have arrived here yet. It's the males that burrow in and make a small chamber where they want to mate with the females, says Magnus Martinsson.\n\nWhen the females are attracted to the tree, the next phase of the insects' life cycle begins. The larvae then develop under the bark before a new generation of bark borers leaves the tree later in the summer. The fir's defense is not always enough. Normally, the fir has its own defense against attacks. When the bark beetle burrows in, the tree tries to squeeze out resin to drown the insects. But weakened trees have a harder time resisting. And if many bark beetles attack at the same time, even healthy firs can give way.\n\nThat is why forest owners now", "title_original": "Stormen fällde miljoner träd – nu hotar skadeinsekten att slå till", "summary_original": "Det som började med stormen Johannes riskerar nu att utvecklas till ett betydligt större problem. När över elva miljoner kubikmeter skog blåste omkull under vintern skapades samtidigt idealiska förhållanden för granbarkborren. De nedfallna granarna fungerar som en perfekt barnkammare för insekten. Där kan barkborrarna lägga sina ägg och utvecklas ostört under sommaren.  Skogsstyrelsen följer utvecklingen noga i de hårdast drabbade områdena i Dalarna, Gävleborg och Västernorrland. Kan sprida sig till frisk skog Det största orosmomentet är inte de redan nedfallna träden, utan vad som händer nästa år. Om populationen av granbarkborrar växer sig tillräckligt stor kan de lämna vindfällena och börja angripa levande granar.\n\n– Försvagade träd är det som de angriper i första hand. Men om populationen av granbarkborren blir för stor kommer de även att ge sig på stående skog och försöka föröka sig där, säger Magnus Martinsson.\n\nTidigare utbrott har visat vilka konsekvenser det kan få. Efter torksomrarna 2018 drabbades stora delar av landet av omfattande barkborreskador. Sedan dess uppskattas förlusterna för svenska skogsägare till omkring 14 miljarder kronor. Hanarna kommer först På de stormfällda träden syns redan tydliga tecken på aktivitet. Små hål i barken avslöjar att de första barkborrarna har anlänt.\n\n– Det verkar bara vara hanarna som har kommit hit än. Det är hanarna som borrar sig in och gör en liten kammare där de vill para sig med honorna, säger Magnus Martinsson.\n\nNär honorna lockas till trädet börjar nästa fas i insekternas livscykel. Därefter utvecklas larverna under barken innan en ny generation barkborrar lämnar trädet senare under sommaren. Granens försvar räcker inte alltid Normalt har granen ett eget försvar mot angreppen. När barkborren borrar sig in försöker trädet pressa ut kåda för att dränka insekterna. Men försvagade träd har svårare att stå emot. Och om många barkborrar angriper samtidigt kan även friska granar ge vika.\n\nDet är därför skogsägare nu uppmanas att snabbt ta hand om stormfälld skog.\n\n– Nu är de inne i trädet som vi står vid här. Om sju till åtta veckor ungefär är de nya granbarkborrarna färdigutvecklade. Hinner man få ut virket innan dess kan de oskadliggöras och då minskar risken för att det blir en explosion nästa år, säger Magnus Martinsson. Oväntad detalj om skogens värsting Trots sitt rykte som en av skogsbrukets värsta skadeinsekter har granbarkborren en betydligt mer oväntad sida.\nDen går faktiskt att äta. Rostad med lite salt beskrivs den ibland som ett proteinrikt snacks. Något som Magnus Martinsson själv har testat.\n\n– Jag har provat, men det är inget jag rekommenderar. Det var inte särskilt gott, säger han.", "link": "https://www.tv4.se/artikel/3I55Od45lM7OZopYNXUny/stormen-faellde-miljoner-traed-nu-hotar-skadeinsekten-att-sla-till", "date_display": "2026-06-14", "date_iso": "2026-06-14T04:53:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/stormen-johannes", "/trad", "/skog", "/insekter", "/sundsvall"]}, {"id": 154, "title": "Anton Ahlmark:\nJesus' friends were not men to brag about around dinner tables", "summary": "Who decides who gets to be in God's kingdom?", "title_original": "Anton Ahlmark:\nJesu vänner var inga man skröt om runt middagsborden", "summary_original": "Vem avgör vem som får vara med i Guds rike?", "link": "https://www.dagen.se/livsstil/anton-ahlmark-jesu-vaenner-var-inga-man-skroet-om-runt-middagsborden/10387659", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Southern Baptists voted to bar women from pastoring", "summary": "The decision comes three years after Saddleback Church was expelled.", "title_original": "Sydstatsbaptisterna röstade för att hindra kvinnor från att vara pastorer", "summary_original": "Beslutet kommer tre år efter att Saddleback Church uteslöts.", "link": "https://www.dagen.se/nyheter/sydstatsbaptisterna-roestade-foer-att-hindra-kvinnor-fran-att-vara-pastorer/10389405", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Swedish youth go to the USA to evangelize during the soccer World Cup", "summary": "YWAM's Anders Carlsson: We felt that we want to give back a little.", "title_original": "Svenska ungdomar åker till USA för att evangelisera under fotbolls-VM", "summary_original": "YWAM:s Anders Carlsson: Vi kände att vi vill ge tillbaka lite.", "link": "https://www.dagen.se/nyheter/svenska-ungdomar-aker-till-usa-foer-att-evangelisera-under-fotbolls-vm/10390523", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "MUCF after halving the state subsidy to the free churches: The government may have to change the rules", "summary": "Growth projects with pastors who \"traveled around to support small and financially weak rural congregations\" can no longer be financed.", "title_original": "MUCF efter halverat statsbidrag till frikyrkorna: Regeringen kan behöva ändra reglerna", "summary_original": "Tillväxtprojekt med pastor som ”rest runt för att stödja små och ekonomiskt svaga glesbygdsförsamlingar” kan inte längre finansieras.", "link": "https://www.dagen.se/nyheter/mucf-efter-halverat-statsbidrag-till-frikyrkorna-regeringen-kan-behoeva-aendra-reglerna/10392018", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "'With Jesus, success looks completely different - it's about peace'", "summary": "Swedish Daniel Sandell's gospel music is a success in Los Angeles - For the Day, he tells about the struggle and the encounter with God that changed everything.", "title_original": "'Med Jesus ser framgång helt annorlunda ut – det handlar om frid'", "summary_original": "Svenske Daniel Sandells gospelmusik gör succé i Los Angeles – För Dagen berättar han om kampen och gudsmötet som förändrade allt.", "link": "https://www.dagen.se/kultur/med-jesus-ser-framgang-helt-annorlunda-ut-det-handlar-om-frid/10325276", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "Fredrik Wenell:\nIs the Alpha Conference in London a hidden political force?", "summary": "'There is an irredeemable political force in the worship of Jesus'", "title_original": "Fredrik Wenell:\nÄr Alphakonferensen i London en dold politisk kraft?", "summary_original": "'Det ligger en oförlöst politisk kraft i tillbedjan av Jesus'", "link": "https://www.dagen.se/kultur/fredrik-wenell-aer-alphakonferensen-i-london-en-dold-politisk-kraft/10388734", "date_display": "2026-06-14", "date_iso": "2026-06-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Putin's Dilemma - Approaching Nightmare Decision: 'Huge Risk'", "summary": "According to the Kyiv Independent, Russia's system for recruiting new soldiers is approaching breaking point. Ukrainian authorities state that the Kremlin may be forced to call in tens of thousands of new soldiers - a step that risks having major political consequences. - If Russia really begins a military mobilization, it is a sign that the regime is under enormous pressure and is politically deadlocked, says Max Bergmann, analyst at the Center for Strategic and International Studies (CSIS), to the news site.  30,000 soldiers a month Since the extensive mobilization in the fall of 2022, when around 300,000 reservists were ordered into the war, the Kremlin has tried to avoid a new wave in which civilians are forced into the army. Instead, they have invested in contract soldiers, high bonuses and other financial incentives. But according to several estimates, Russia needs to recruit over 30,000 new soldiers a month to be able to continue the fighting at the same pace. At the beginning of 2026, recruitment was well below that level, despite increased bonuses and debt write-offs. At the same time, an important source of new soldiers is dwindling: the prisons. The number of inmates has fallen sharply since the start of the war, partly after prisoners were offered contracts at the front. Exceeding the recruitment pace To fill the ranks, the authorities have stepped up the pressure on society. Students are said to be encouraged to sign contracts, companies may be required to contribute recruits and reservists are called to checks that in practice act as mobilization, according to the Kyiv Independent.  - Since the end of 2025, the Russian losses have started to exceed the recruitment rate, which means that the Kremlin will have to recruit more personnel just to be able to maintain the ground offensives at the same rate as Russia did in 2025, says Kateryna Stepanenko, Russia analyst at the Institute for the Study of War think tank. The first wave of mobilization in 2022 led to protests and hundreds of thousands of Russians leaving the country. Several assessors believe that a new", "title_original": "Putins dilemma – närmar sig mardrömsbeslut: ”Enorm risk”", "summary_original": "Rysslands system för att få fram nya soldater närmar sig enligt Kyiv Independent en bristningsgräns. Ukrainska myndigheter uppger att Kreml kan tvingas kalla in tiotusentals nya soldater – ett steg som riskerar att få stora politiska konsekvenser. – Om Ryssland verkligen inleder en militär mobilisering är det ett tecken på att regimen befinner sig under enorm press och är politiskt fastlåst, säger Max Bergmann, analytiker vid Center for Strategic and International Studies (CSIS), till nyhetssajten.  30 000 soldater i månaden Sedan den omfattande mobiliseringen hösten 2022, då omkring 300 000 reservister beordrades ut i kriget, har Kreml försökt undvika en ny våg där civila tvingas in i armén. I stället har man satsat på kontraktssoldater, höga bonusar och andra ekonomiska incitament. Men enligt flera uppskattningar behöver Ryssland rekrytera över 30 000 nya soldater i månaden för att kunna fortsätta striderna i samma takt. I början av 2026 låg rekryteringen långt under den nivån, trots höjda bonusar och skuldavskrivningar. Samtidigt sinar en viktig källa till nya soldater: fängelserna. Antalet intagna har minskat kraftigt sedan kriget började, delvis efter att fångar erbjudits kontrakt vid fronten. Överstiger rekryteringstakten För att fylla på leden har myndigheterna trappat upp pressen i samhället. Studenter uppges uppmuntras att skriva kontrakt, företag kan få krav på att bidra med rekryter och reservister kallas till kontroller som i praktiken fungerar som mobilisering, enligt Kyiv Independent.  – De ryska förlusterna har sedan slutet av 2025 börjat överstiga rekryteringstakten, vilket innebär att Kreml kommer att behöva rekrytera mer personal bara för att kunna upprätthålla markoffensiverna i samma takt som Ryssland gjorde under 2025, säger Kateryna Stepanenko, Rysslandsanalytiker vid tankesmedjan Institute for the Study of War. Den första mobiliseringsvågen 2022 ledde till protester och att hundratusentals ryssar lämnade landet. Flera bedömare anser att en ny mobilisering skulle vara ännu känsligare i dag, när ekonomin är pressad och många börjar känna av kriget. – Det är en enorm risk för Putin, en satsning som kan utsätta honom själv och hans regim för fara, säger Max Bergmann. Ett dilemma En ny mobilisering skulle innebära att kriget i högre grad drabbar vanliga ryssar, något Kreml påstås försökt undvika. Flera experter pekar på två möjliga lägen då Kreml kan ta steget: vid en allvarlig kris på fronten eller om Ryssland väljer att trappa upp kriget och ställa om ekonomin till fullt fokus på krigsproduktion. Samtidigt understryks att inget av scenarierna bedöms som nära förestående. Även om en mobilisering genomförs är det oklart vilken effekt den skulle få. Ukrainas styrkor har stärkt sina positioner, bland annat genom ökad användning av drönare, och Rysslands framryckningar har bromsat in.", "link": "https://www.tv4.se/artikel/5CBk3kOTToAq6tcQUpbqCz/putins-dilemma-naermar-sig-mardroemsbeslut-enorm-risk", "date_display": "2026-06-13", "date_iso": "2026-06-13T19:58:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/putin", "/vladimir-putin", "/ryssland", "/ukrainakonflikten", "/ukraina"]}, {"id": 161, "title": "This is how a peace agreement can affect Swedish wallets", "summary": "\"Then the worries would pick up speed again\"", "title_original": "Så kan ett fredsavtal påverka svenska plånböcker", "summary_original": "”Då skulle oron ta fart igen”", "link": "https://www.tv4.se/artikel/DsF3YnnJL9JvpZXAF9Nzf/expert-sa-kan-ett-fredsavtal-paverka-svenska-planboecker", "date_display": "2026-06-13", "date_iso": "2026-06-13T17:05:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 162, "title": "Sources within Tidö: Several bills risk failure", "summary": "This week the announcement came from the government that the proposal to lower the age of criminal liability from 15 to 13 years will not be put forward for a vote in the Riksdag. The reason was that the government and the Sweden Democrats lacked sufficient support in the Riksdag for the proposal to pass. This is because several members of the Liberals have announced that they will not vote for the proposal and that the Riksdag's offset system has failed. In addition, there is the uncertainty factor in the political wilds with which the Tidö parties are drawn.  But ahead of this summer's parliamentary work, there may be more obstacles for Ulf Kristersson's government. Several sources within the Tidö parties point to upcoming proposals on family immigration. Recently, the government presented a legislative council referral on stricter requirements for family immigration, and sources within the Liberals indicate that several members are doubtful about a number of strictures. \"Opening up for resistance\" A source within the Liberals says that stricter requirements which mean that it will be very difficult for asylum seekers to bring relatives to Sweden may result in several L members once again sitting crosswise. - You have seen how the government is backing down now with the 13-year-olds. It opens the door to resistance, says a source. Nor has the government's promised halt to the attention-grabbing teenage expulsions been passed through the Riksdag.\nIf members of the Liberal Party perceive that the difference from today's situation, when teenagers are deported from Sweden, is too small, then the proposal may have difficulty getting through the Riksdag. - Sensitivity is required from the government and the Sweden Democrats if any changes are to go through, says a source. The members of the Liberals that party leader Simona Mohamsson (L) cannot count as safe pushers in the Riksdag are said to be Jakob Olofsgård, Helene Odenjung, Malin Danielsson and Cecilia Rönn. All of them have opposed Mohamsson's line about bringing the Sweden Democrats into government next term. Playing down the risks On Monday, the Riksdag r", "title_original": "Källor inom Tidö: Flera lagförslag riskerar falla", "summary_original": "I veckan kom beskedet från regeringen att förslaget om att sänka straffbarhetsåldern från 15 till 13 år inte kommer att läggas fram för omröstning i riksdagen. Anledningen var att regeringen och Sverigedemokraterna saknade tillräckligt stort stöd i riksdagen för att förslaget skulle kunna gå igenom. Detta eftersom flera ledamöter i Liberalerna aviserat att man inte kommer att rösta för förslaget och att riksdagens kvittningssystem har fallit. Därtill finns osäkerhetsfaktorn i de politiska vildar som Tidöpartierna dras med.  Men inför sommarens riksdagsarbete kan det finnas fler hinder för Ulf Kristerssons regering. Flera källor inom Tidöpartierna pekar på kommande förslag om anhöriginvandring. Nyligen la regeringen fram en lagrådsremiss om skärpta krav för anhöriginvandring och källor inom Liberalerna pekar på att flera ledamöter ställer sig tveksamma till ett antal skärpningar. ”Öppnar upp för motstånd” En källa inom Liberalerna berättar att skärpta krav som innebär att det blir mycket svårt för asylsökande att få anhöriga till Sverige kan resultera i att flera L-ledamöter återigen sätter sig på tvären. – Man har sett hur regeringen backar nu med 13-åringarna. Det öppnar upp för motstånd, säger en källa. Inte heller regeringens utlovade stopp av de uppmärksammade tonårsutvisningarna har fri lejd genom riksdagen.\nOm det från ledamöter i Liberalernas håll uppfattas som att skillnaden från dagens läge, då tonåringar utvisas ur Sverige, blir för liten så kan förslaget få svårt att gå igenom riksdagen. – Det krävs lyhördhet från regeringen och Sverigedemokraterna om några förändringar ska kunna gå igenom, säger en källa. De ledamöter i Liberalerna som partiledaren Simona Mohamsson (L) inte kan räkna in som säkra knapptryckare i riksdagen uppges vara Jakob Olofsgård, Helene Odenjung, Malin Danielsson och Cecilia Rönn. Samtliga har ställt sig emot Mohamssons linje om att ta in Sverigedemokraterna i regering nästa mandatperiod. Spelar ner riskerna På måndag ska riksdagen rösta om höjda krav på så kallad vandel, alltså levnadssätt, för utlänningar som ansöker om uppehållstillstånd. Levnadssättet ska vara ”skötsamt”, enligt förslaget, som delar av Liberalerna tidigare ställt sig ifrågasättande till. Men enligt högt uppsatta källor inom Tidöpartierna anses omröstningen vara säkrad. En del personer inom L spelar ner riskerna med att de fyra går emot regeringens politik. En ledande liberalpartist påpekar att de inte uppfattas som vildar i praktiken. Men det havererade kvittningssystemet, som tidigare möjliggjorde för ledamöter inom L som hade avvikande åsikter, gör att det blir betydligt svårare för L att strategiskt kunna räkna bort ledamöter i riksdagsomröstningarna. – Sverigedemokraterna var korkade när de fuskade. Det skadade förtroendet i systemet, som har fungerat. När man nu tvingar upprorsmakarna att gå till omröstning så finns det förslag som de inte kommer att trycka igenom, slår en högt uppsatt person i Liberalerna fast.", "link": "https://www.tv4.se/artikel/E2ZyJIjVA68WxnyVAuuxH/tidoekaellor-problemen-kan-bli-fler-foer-kristerssons-regering", "date_display": "2026-06-13", "date_iso": "2026-06-13T15:51:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/valet-2026", "/politik", "/tidopartier", "/riksdagen"]}, {"id": 163, "title": "Solemn and powerful as the royal couple thanked God in church after 50 years of marriage", "summary": "Bishop Johan Dalman brought everyone from the first click to now describing the king and queen's love as a tasty vintage wine", "title_original": "Högtidligt och mäktigt då kungaparet tackade Gud i kyrkan efter 50 år som gifta", "summary_original": "Biskop Johan Dalman tog med alla från det första klicket till att nu beskriva kungen och drottningens kärlek som ett välsmakande årgångsvin", "link": "https://www.dagen.se/nyheter/hoegtidligt-och-maektigt-da-kungaparet-tackade-gud-i-kyrkan-efter-50-ar-som-gifta/10393388", "date_display": "2026-06-13", "date_iso": "2026-06-13T12:03:27+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 164, "title": "Josefin L d that image. But uncertainty has increased again, which the companies believe risks delaying the already protracted recovery.", "title_original": "Riksbankens företagsundersökning:  ”En ny svart svan” som riskerar att fördröja återhämtningen", "summary_original": "Enligt de svenska storföretagen är konjunkturläget fortfarande svagt. Innan kriget i Mellanöstern bröt ut upplevde man att konjunkturen försiktigt förbättrades. Kriget tycks inte nämnvärt ha påverkat den bilden. Men osäkerheten har ökat igen, vilket företagen menar riskerar att försena den redan utdragna återhämtningen.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbankens-foretagsundersokning--en-ny-svart-svan-som-riskerar-att-fordroja-aterhamtningen/", "date_display": "2026-06-09", "date_iso": "2026-06-09T07:30:22+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "6 days old", "tags": []}, {"id": 185, "title": "New inquiry appointed to facilitate divestment of property holdings that threaten national security", "summary": "To mitigate security threats posed by certain property holdings, an inquiry has been appointed to propose changes to the Expropriation Act, i.e. the legislation under which a property owner may be compelled to transfer their property holding. The purpose is to ensure that Sweden’s Government can act when a property is at risk of being used in a way that threatens national security.", "title_original": "New inquiry appointed to facilitate divestment of property holdings that threaten national security", "summary_original": "To mitigate security threats posed by certain property holdings, an inquiry has been appointed to propose changes to the Expropriation Act, i.e. the legislation under which a property owner may be compelled to transfer their property holding. The purpose is to ensure that Sweden’s Government can act when a property is at risk of being used in a way that threatens national security.", "link": "https://www.government.se/press-releases/2026/06/new-inquiry-appointed-to-facilitate-divestment-of-property-holdings-that-threaten-national-security/", "date_display": "2026-06-08", "date_iso": "2026-06-08T04:00:27+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "7 days old", "tags": ["Press release", "International", "Ministry of Defence", "Pål Jonson", "Military defence", "Strengthen Sweden’s security", "Government’s priorities", "Total defence"]}, {"id": 186, "title": "Here are the questions that SD does not want to answer", "summary": "", "title_original": "Här är frågorna som SD inte vill svara på", "summary_original": "", "link": "https://www.tv4.se/artikel/41u22GYipto8cHrQov2llN/haer-aer-fragorna-som-sd-inte-vill-svara-pa", "date_display": "2026-06-08", "date_iso": "2026-06-08T03:55:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "7 days old", "tags": ["Inrikes", "/inrikes"]}, {"id": 187, "title": "Maria Malmer Stenergard met with Ukrainian Minister of Foreign Affairs Andrii Sybiha in Kristianstad", "summary": "On Wednesday 20 May, Minister for Foreign Affairs Maria Malmer Stenergard travelled to Kristianstad along with Ukrainian Minister of Foreign Affairs Andrii Sybiha for a bilateral meeting, a walkabout and a ceremony. Mr Sybiha then undertook other visits in southern Sweden before attending the meeting of NATO Ministers of Foreign Affairs in Helsingborg.", "title_original": "Maria Malmer Stenergard met with Ukrainian Minister of Foreign Affairs Andrii Sybiha in Kristianstad", "summary_original": "On Wednesday 20 May, Minister for Foreign Affairs Maria Malmer Stenergard travelled to Kristianstad along with Ukrainian Minister of Foreign Affairs Andrii Sybiha for a bilateral meeting, a walkabout and a ceremony. Mr Sybiha then undertook other visits in southern Sweden before attending the meeting of NATO Ministers of Foreign Affairs in Helsingborg.", "link": "https://www.government.se/articles/2026/06/maria-malmer-stenergard-met-with-ukrainian-minister-of-foreign-affairs-andrii-sybiha-in-kristianstad/", "date_display": "2026-06-05", "date_iso": "2026-06-05T09:47:28+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "10 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Article", "Sweden's support to Ukraine", "Maria Malmer Stenergard"]}, {"id": 188, "title": "The monetary policy meeting in September takes place in Gothenburg", "summary": "The Riksbank's executive board holds its monetary policy meeting in Gothenburg on 23 September. The meeting takes place in the premises of the County Administrative Board of Västra Götaland. The decision is announced the following day, 24 September at 9.30am. On the same day, at 10:30 a.m., a press conference about the decision will be held at the West Swedish Chamber of Commerce at Parkgatan 49 in Gothenburg.", "title_original": "Det penningpolitiska mötet i september äger rum i Göteborg", "summary_original": "Riksbankens direktion håller sitt penningpolitiska möte i Göteborg den 23 september. Mötet äger rum i Länsstyrelsen Västra Götalands lokaler. Beslutet offentliggörs dagen därpå, den 24 september klockan 9.30. Samma dag, klockan 10.30, hålls en pressträff om beslutet på Västsvenska Handelskammaren på Parkgatan 49 i Göteborg.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/det-penningpolitiska-motet-i-september-ager-rum-i-goteborg/", "date_display": "2026-06-03", "date_iso": "2026-06-03T09:51:12+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "12 days old", "tags": []}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
