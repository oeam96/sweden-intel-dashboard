splay": "2026-07-12", "date_iso": "2026-07-12T20:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Konst", "Kultur"]}, {"id": 112, "title": "At least 27 dead in Bangkok bar fire", "summary": "At least 27 people have been killed and 60 injured in a massive fire at a bar in Bangkok. Beer trays and a table reportedly blocked the bar's emergency exits, according to Bangkok's governor.", "title_original": "Minst 27 döda i brand på bar i Bangkok", "summary_original": "Minst 27 personer har omkommit och 60 skadats i en omfattande brand på en bar i Bangkok. Ölbackar och ett bord ska ha blockerat barens nödutgångar, enligt Bangkoks guvernör.", "link": "https://www.dn.se/varlden/minst-27-doda-i-brand-pa-bar-i-bangkok/", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:53:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Professor: \"The caterpillar from hell\" is spread via tree imports", "summary": "\"The caterpillar from hell\" continues to create chaos in Denmark. Ecology professor Christer Björkman believes that it has the greatest chance of establishing itself in Sweden via the import of oak. - For every tree we take in, there is a probability that it comes with eggs, he says.", "title_original": "Professorn: ”Larven från helvetet” sprids via trädimport", "summary_original": "”Larven från helvetet” fortsätter att skapa kaos i Danmark. Ekologiprofessorn Christer Björkman menar att den har störst chans att etablera sig i Sverige via import av ek. – För varje träd vi tar in så finns det ju en sannolikhet att det följer med ägg, säger han.", "link": "https://www.dn.se/varlden/professorn-larven-fran-helvetet-sprids-via-tradimport/", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:48:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Beer buckets blocked the emergency exit - suffocated", "summary": "A massive fire broke out at a bar in the Thai capital on Sunday. At least 27 people have died, and at least another 60 have been injured.", "title_original": "Ölbackar blockerade nödutgången – kvävdes", "summary_original": "En kraftig brand utbröt på en bar i Thailands huvudstad på söndagen. Minst 27 personer har dött, och ytterligare minst 60 har skadats.", "link": "https://www.svd.se/a/M7dqyB/minst-27-personer-doda-i-brand-pa-bar-i-bangkok", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:46:01+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 115, "title": "Experts: Swedish rules make it difficult for non-European talents", "summary": "The government wants to make the country more attractive for highly qualified labour. But several experts believe that Sweden's rules for non-European innovators make labor immigration more difficult. - We could miss out on the next Spotify or Klarna if we don't change the rules, says Carl Bergkvist at the Stockholm Chamber of Commerce.", "title_original": "Experter: Svenska regler försvårar för utomeuropeiska talanger", "summary_original": "Regeringen vill göra landet mer attraktivt för högkvalificerad arbetskraft. Men flera experter menar att Sveriges regler för utomeuropeiska innovatörer försvårar arbetskraftsinvandringen. – Vi kan gå miste om nästa Spotify eller Klarna om vi inte ändrar på reglerna, säger Carl Bergkvist på Stockholms handelskammare.", "link": "https://www.dn.se/ekonomi/experter-svenska-regler-forsvarar-for-utomeuropeiska-talanger/", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:42:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Sinner defended title in London – beat Zverev", "summary": "Jannik Sinner, 24, secured the second straight Wimbledon title of his career. In the final, the Italian defeated Alexander Zverev 3–1 in sets. - It feels incredible, I will never take anything for granted, says the world number one in the victory interview.", "title_original": "Sinner försvarade titeln i London – slog Zverev", "summary_original": "Jannik Sinner, 24, säkrade karriärens andra raka Wimbledon-titel. I finalen besegrade italienaren Alexander Zverev med 3–1 i set. – Det känns otroligt, jag kommer aldrig ta något för givet, säger världsettan i segerintervjun.", "link": "https://www.dn.se/sport/sinner-forsvarade-titeln-i-london-slog-zverev/", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:09:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Woman found dead - man suspected of murder", "summary": "", "title_original": "Kvinna hittad död – man misstänks för mord", "summary_original": "", "link": "https://www.svd.se/a/wrxbBd/kvinna-hittad-dod-man-misstanks-for-mord", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:03:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 118, "title": "July 12: Don't miss the most important news of the day", "summary": "US Senator Lindsey Graham is dead, it could be 30 degrees next week and 5-year-old Edda found a sharp grenade – here's the news you can't miss from the day.", "title_original": "12 juli: Missa inte dagens viktigaste nyheter", "summary_original": "Den amerikanska senatorn Lindsey Graham är död, nästa vecka kan det bli 30 grader och 5-åriga Edda hittade en skarp granat – här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/12-juli-missa-inte-dagens-viktigaste-nyheter/", "date_display": "2026-07-12", "date_iso": "2026-07-12T19:01:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Extreme fire risk in parts of the country", "summary": "The risk of forest fires in the next few days is high in almost half of the country, in some parts extremely high. Already on Sunday, a number of fires occurred around Sweden.", "title_original": "Extrem brandrisk i delar av landet", "summary_original": "Risken för skogsbränder de närmaste dagarna är stor i nästan halva landet, i vissa delar extremt stor. Redan under söndagen inträffade ett antal bränder runt om i Sverige.", "link": "https://www.dn.se/sverige/extrem-brandrisk-i-delar-av-landet/", "date_display": "2026-07-12", "date_iso": "2026-07-12T18:48:29+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "\"They are such idiots\" - French reactions to the boules scandal", "summary": "PARIS. A corruption scandal shakes France's national sport boule – in French called pétanque. Four national team players are suspected of having participated in a \"fixed\" match for payment. - They are such idiots. Who cheats at boules? exclaims 69-year-old Guy Lopez, who is one of 300,000 active players in France.", "title_original": "”De är sådana idioter” – franska reaktioner på bouleskandalen", "summary_original": "PARIS. En korruptionsskandal skakar Frankrikes nationalsport boule – på franska kallad pétanque. Fyra landslagsspelare misstänks ha deltagit i en ”fixad” match mot betalning. – De är sådana idioter. Vem fuskar i boule? utbrister 69-årige Guy Lopez, som är en av 300 000 aktiva spelare i Frankrike.", "link": "https://www.dn.se/sport/de-ar-sadana-idioter-franska-reaktioner-pa-bouleskandalen/", "date_display": "2026-07-12", "date_iso": "2026-07-12T18:02:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "DN Debate. \"The countryside can just as easily be the engine of the transition\"", "summary": "DN DEBATE. The countryside is often portrayed as condemned to the car and petrol. But it could be just the opposite. Sweden has done it in the past. After the oil crisis of the 70s, oil dependence was pushed back. With the electricity, the area and the resources in place, the countryside can once again be in the lead for electrification, writes Erland Mårald, professor of the history of ideas.", "title_original": "DN Debatt. ”Landsbygden kan lika gärna vara motorn i omställningen”", "summary_original": "DN DEBATT. Landsbygden framställs gärna som dömd till bilen och bensinen. Men det skulle kunna vara precis tvärtom. Sverige har nämligen gjort det förr. Efter 70-talets oljekris pressades oljeberoendet tillbaka. Med elen, ytan och resurserna på plats kan landsbygden åter gå i bräschen för elektrifieringen, skriver Erland Mårald, professor i idéhistoria.", "link": "https://www.dn.se/debatt/landsbygden-kan-lika-garna-vara-motorn-i-omstallningen/", "date_display": "2026-07-12", "date_iso": "2026-07-12T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Blood Rot, part 23 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 23 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-23-av-57/", "date_display": "2026-07-12", "date_iso": "2026-07-12T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "This is how you dress for work this summer", "summary": "Shorts and flip-flops, suit and loafers. What is actually okay to wear to work when the temperature rises?", "title_original": "Så klär du dig på jobbet i sommar", "summary_original": "Shorts och flip-flops, kostym och loafers. Vad är egentligen okej att ta på sig på jobbet när temperaturen stiger?", "link": "https://www.dn.se/sverige/sa-klar-du-dig-pa-jobbet-i-sommar/", "date_display": "2026-07-12", "date_iso": "2026-07-12T17:42:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "New tours around the planned luxury building - documents may be falsified", "summary": "Thousands of people have demonstrated in recent weeks and most recently this weekend in the capital Tirana against the planned luxury resort project linked to Jared Kushner.  The resort is planned in Zvernec on the mainland and on the nearby island of Sazan.  Artur Shehu, who sold the coastal land to the planned resort, is now suspected of money laundering and drug smuggling, according to documents from Albania's special anti-corruption and crime agency SPAK, which Reuters has seen.  In the investigation, Shehu and people in his circle are suspected of having smuggled cocaine from South America to European ports and then laundered the profits through real estate deals, including with the help of false ownership documents. Shehu denies all allegations through his lawyer. The US Department of Justice would not comment on whether it had received any requests from Albania to locate or arrest him. No suspicions against Kushner In April, Shehu sold the pristine coastal strip in Albania where the planned resort is to be built to Albania Land Development – ​​a company owned by the developers behind the Kushner-backed project, Sazan Real Estate Development, and other investors.  The documents do not contain allegations of wrongdoing against US President Donald Trump's son-in-law Kushner, Sazan Real Estate Development, Albania Land Development or other investors in the resort project. Reuters has found no evidence that any of the investors were aware of the allegations against Shehu when they bought the land from him.  Protests since May Affinity Partners presented in 2024 plans for a luxury resort in Albania, on the island of Sazan and on the coast of Vjosa-Narta - an area with many endangered species and important nesting sites for flamingos, among others. The project, to be built in Zvernec and at Sazan, has faced major protests in Tirana since the end of May, with criticism of the environmental impact and suspected corruption, as well as calls for the resignation of Prime Minister Edi Rama. Jared Kushner is one of the investors and Rama has supported the project", "title_original": "Nya turer kring planerade lyxbygget – dokument kan vara förfalskade", "summary_original": "Tusentals personer har de senaste veckorna och senast nu under helgen demonstrerat i huvudstaden Tirana mot det planerade lyxresortprojektet med koppling till Jared Kushner.  Resorten planeras i Zvernec på fastlandet och på den närliggande ön Sazan.  Artur Shehu, som sålde kustmarken till den planerade resorten, misstänks nu för penningtvätt och narkotikasmuggling, Detta enligt handlingar från Albaniens särskilda anti-korruptions- och brottsmyndighet SPAK, som Reuters tagit del av.  I utredningen misstänks Shehu och personer i hans krets ha smugglat kokain från Sydamerika till europeiska hamnar och därefter tvättat vinsterna genom fastighetsaffärer, bland annat med hjälp av falska ägandedokument. Shehu förnekar alla anklagelser via sin advokat. USA:s justitiedepartement vill inte kommentera om man fått någon begäran från Albanien om att lokalisera eller gripa honom. Inga misstankar mot Kushner  I april sålde Shehu den orörda kustremsan i Albanien, där den planerade resorten ska byggas, till Albania Land Development – ett bolag som ägs av utvecklarna bakom det Kushner-stödda projektet, Sazan Real Estate Development, samt andra investerare.  Handlingarna innehåller inga anklagelser om felaktigt agerande mot USA:s president Donald Trumps svärson Kushner, Sazan Real Estate Development, Albania Land Development eller andra investerare i resortprojektet. Reuters har inte funnit något som tyder på att någon av investerarna kände till misstankarna mot Shehu när de köpte marken av honom.  Protester sedan maj Affinity Partners presenterade 2024 planer på ett lyxresort i Albanien, på ön Sazan och vid kusten i Vjosa–Narta – ett område med många hotade arter och viktiga häckningsplatser för bland annat flamingos. Projektet, som ska byggas i Zvernec och på Sazan, har mött stora protester i Tirana sedan slutet av maj, med kritik mot miljöpåverkan och misstänkt korruption samt krav på premiärminister Edi Ramas avgång. Jared Kushner är en av investerarna och Rama har stött projektet. Samtidigt har boende i Zvernec i över tio år tvistat i domstol om vem som äger marken och försöker stoppa bygget.", "link": "https://www.tv4.se/artikel/ZoSstnLhiDENhF9aNiIoG/nya-turer-kring-kritiserade-resortbygget-dokument-kan-vara-foerfalskade", "date_display": "2026-07-12", "date_iso": "2026-07-12T17:05:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/albanien", "/jared-kushner"]}, {"id": 125, "title": "Sandra Stiskalo: Londoners can't believe their eyes when the squirrels sweep", "summary": "LONDON. It was only a matter of time before the squirrels discovered the fruit and candy flavored e-cigarettes. The weeping squirrels have unleashed their anger against invasive rodents in the UK.", "title_original": "Sandra Stiskalo: Londonborna tror inte sina ögon när ekorrarna vejpar", "summary_original": "LONDON. Det var bara en tidsfråga innan ekorrarna skulle upptäcka de frukt- och godissmakande e-cigaretterna. De vejpande ekorrarna har spätt på agget mot invasiva gnagare i Storbritannien.", "link": "https://www.dn.se/varlden/sandra-stiskalo-londonborna-tror-inte-sina-ogon-nar-ekorrarna-vejpar/", "date_display": "2026-07-12", "date_iso": "2026-07-12T16:41:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Trump threatens journalist - questioned his health", "summary": "New York Times journalist Maggie Haberman questioned Donald Trump's health. The president promises that \"she will have to pay a price\" for her way of reporting.", "title_original": "Trump hotar journalist – ifrågasatte hans hälsa", "summary_original": "Maggie Haberman, journalist på New York Times, ifrågasatte Donald Trumps hälsa. Presidenten lovar att ”hon kommer att få betala ett pris” för sitt sätt att rapportera.", "link": "https://www.dn.se/varlden/trump-hotar-journalist-ifragasatte-hans-halsa/", "date_display": "2026-07-12", "date_iso": "2026-07-12T16:34:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Death threats against Sørloth after the loss: \"Commit suicide\"", "summary": "The girlfriend appeals to the public after the storm of hate on social media", "title_original": "Dödshot mot Sørloth efter förlusten: ”Begå självmord”", "summary_original": "Flickvännen vädjar till allmänheten efter hatstormen på sociala medier", "link": "https://www.tv4.se/artikel/6quIJg6hzX3PoeBiKKUiCr/hatstorm-mot-sorloth-efter-vm-foerlusten-bega-sjaelvmord", "date_display": "2026-07-12", "date_iso": "2026-07-12T15:24:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 128, "title": "Peak season for home burglaries – how to deter the thief", "summary": "Weeks 29 and 30 are two of the Swedes' most popular holiday weeks. When many people leave their homes for the summer cottage, the trip abroad or a few weeks' leave, the number of empty homes also increases. It can make certain houses and apartments more attractive to burglars, according to the Theft Prevention Association. - They won't be able to spy on an apartment, but they look a few times and see that no one is home. It's a bit of a \"crime of opportunity\", says Jacek Paszkowski, advisory manager at the Theft Protection Association. In order to reduce the risk of burglary, it is therefore important to make the home look inhabited. Timers for lights, help from neighbors and small signs of activity can make the thief choose another target. The biggest mistake is that the home signals that no one is home. - If you live in a villa, you can leave something outside so that it looks like someone is actually at home, says Jacek Paszkowski. It's not just about locking the door before leaving. At least as important is to create uncertainty for whoever is possibly scouting the area. - They make an assessment of the chance of getting away with the crime. If there are too many uncertainty factors for them, they choose not to act, says Paszkowski. Do a proper review According to the Theft Protection Association, many of the most important measures are also the simplest. - The important thing is to really check that all windows are closed. It happens that you have secured everything on the lower level but forgot a window on the upper floor. Perhaps there is also a ladder left outside. That's why it's good to do a proper review before you go, says Paszkowski and adds: - The measures are so easy to do and still leave a relatively large amount of protection to deter the thief. At the same time, the number of residential burglaries has decreased in recent years. The police's work against itinerant theft gangs has contributed to the development, but according to Paszkowski, the national statistics should not be seen as a conclusion for one's own risk. - When you look more closely at the statistics, you see", "title_original": "Högsäsong för bostadsinbrott – så avskräcker du tjuven", "summary_original": "Vecka 29 och 30 är två av svenskarnas mest populära semesterveckor. När många lämnar sina hem för sommarstugan, utlandsresan eller några veckors ledighet ökar också antalet tomma bostäder. Det kan göra vissa hus och lägenheter mer attraktiva för inbrottstjuvar, enligt Stöldskyddsföreningen. – De kommer inte att orka spana på en lägenhet, utan de tittar några gånger och ser att det inte är någon hemma. Det är lite ”crime of opportunity”, säger Jacek Paszkowski, rådgivningschef på Stöldskyddsföreningen. För att minska risken för inbrott gäller det därför att få bostaden att se bebodd ut. Timers till lampor, hjälp från grannar och små tecken på aktivitet kan få tjuven att välja ett annat mål. Det största misstaget är att bostaden signalerar att ingen är hemma. – Om man bor i villa kan man lämna någonting framme så att det ser ut som att någon faktiskt är hemma, säger Jacek Paszkowski. Det handlar inte bara om att låsa dörren innan man åker. Minst lika viktigt är att skapa osäkerhet för den som eventuellt spanar på området. – De gör en bedömning av chansen att komma undan med brottet. Blir det för många osäkerhetsfaktorer för dem väljer de att inte agera, säger Paszkowski. Gör en ordentlig genomgång Enligt Stöldskyddsföreningen är många av de viktigaste åtgärderna också de enklaste. – Det viktiga är att verkligen kontrollera att alla fönster är stängda. Det händer att man har säkerställt allt på nedre plan men glömt ett fönster på övervåningen. Kanske står det dessutom en stege kvar utanför. Därför är det bra att göra en ordentlig genomgång innan man åker, säger Paszkowski och tillägger: – Åtgärderna är så enkla att göra och lämnar ändå ett förhållandevis stort skydd för att avskräcka tjuven. Samtidigt har antalet bostadsinbrott minskat de senaste åren. Polisens arbete mot kringresande stöldligor har bidragit till utvecklingen, men enligt Paszkowski bör den nationella statistiken inte ses som ett facit för den egna risken. – När man tittar närmare på statistiken ser man att det skiljer sig mycket mellan olika delar av landet. I vissa områden har inbrotten minskat kraftigt medan de har ökat i andra områden, säger han. Var försiktig på sociala medier Under semestern väljer många att dela bilder och uppdateringar från resor och utflykter. Det är något som Stöldskyddsföreningen tycker att man bör tänka efter kring. – Att sprida alltför brett om att man ska vara borta under en längre tid är ingenting vi rekommenderar, säger Paszkowski. Han säger att tjuvar ofta gör en riskbedömning innan de slår till och att det därför kan vara klokt att fundera över vilken information man delar offentligt. Men så länge man följer råden minskar risken för inbrott, enligt Jacek Paszkowski. – De stegen är ju då så pass bra att det skrämmer bort väldigt många av tjuvarna att inte ens testa, säger han.", "link": "https://www.tv4.se/artikel/4qR60KHq6sSqXu8ceD5FRx/hoegsaesong-foer-bostadsinbrott-sa-avskraecker-du-tjuven", "date_display": "2026-07-12", "date_iso": "2026-07-12T14:47:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/inbrott", "/straff", "/stold", "/stolder", "/stoldskyddsforeningen", "/semester"]}, {"id": 129, "title": "This is why you suffer from the unusual disease \"broken heart\"", "summary": "The first time Anna-Lena Brundin fell ill was in 2017. She suddenly had severe chest pains, cold sweats and had difficulty breathing. After calling 1177, she was sent to the emergency room where the doctors first suspected a heart attack. But the examinations showed that the coronary arteries of the heart were free of narrowings. Instead, she was diagnosed with Takotsubo – then a relatively unknown heart disease. \n\n- They were absolutely sure it was a heart attack. But when they saw my heart and everything, no, there were no strictures. So it wasn't a heart attack, says Anna-Lena Brundin.  Stress can be a triggering factor Both times Anna-Lena was affected, she had been unusually nervous before a performance. Afterwards, the symptoms came when she was in the car on the way home.\n\n- Very strange, she says. Takutsubo, first described in Japan in the 1990s, is an acute condition in which the heart temporarily weakens, often after a severe stress attack. The symptoms are almost identical to heart attacks, and the disease mainly affects women between the ages of 60 and 80. - The cause is a sharp increase in stress hormones in the body, typically adrenaline, says Daniel Lindholm, cardiologist and heart researcher.  Can be life-threatening Most people make a full recovery, but in the acute phase the condition can be serious.\n\n- We have a mortality of around five percent in the first month, says Daniel Lindholm. \n\nAnna-Lena now tries to avoid stress in order to reduce the risk of being affected again.  - I've always thought I'm very cool, and not so sensitive in that way, but apparently I am, she says. \n\nResearch into Takutsubo continues and healthcare has become better at recognizing and treating the condition. But much is still unknown about why some are affected.", "title_original": "Därför drabbas man av ovanliga sjukdomen ”brustet hjärta”", "summary_original": "Första gången Anna-Lena Brundin insjuknade var 2017. Hon fick plötsligt kraftiga bröstsmärtor, kallsvettades och hade svårt att andas. Efter samtal med 1177 skickades hon till akuten där läkarna först misstänkte hjärtinfarkt. Men undersökningarna visade att hjärtats kranskärl var utan förträngningar. I stället fick hon diagnosen Takotsubo – då en relativt okänd hjärtsjukdom. \n\n– De var helt säkra på att det var hjärtinfarkt. Men när de såg mitt hjärta och allting, nej, det var inga förträngningar. Så det var inte hjärtinfarkt, berättar Anna-Lena Brundin.  Stress kan vara en utlösande faktor  Båda gångerna Anna-Lena drabbades hade hon varit ovanligt nervös inför en föreställning. Efteråt kom symtomen när hon satt i bilen på väg hem.\n\n– Väldigt konstigt, säger hon. Takutsubo, som först beskrevs i Japan på 1990-talet, är ett akut tillstånd där hjärtat tillfälligt försvagas ofta efter ett kraftigt stresspåslag. Symtomen är nästan identiska med hjärtinfarkt, och sjukdomen drabbar främst kvinnor mellan 60 och 80 år. – Orsaken är en kraftig ökning av stresshormoner i kroppen, typiskt adrenalin, säger Daniel Lindholm, kardiolog och hjärtforskare.  Kan vara livshotande  De flesta återhämtar sig helt, men i den akuta fasen kan tillståndet vara allvarligt.\n\n– Vi har en mortalitet på cirka fem procent första månaden, säger Daniel Lindholm. \n\nAnna-Lena försöker nu undvika stress föra att minska risken för att drabbas igen.  – Jag har alltid trott att jag är väldigt cool, och inte så känslig på det sättet, men det är jag tydligen, säger hon. \n\nForskningen om Takutsubo fortsätter och sjukvården har blivit bättre på att känna igen och behandla tillståndet. Men mycket är fortfarande okänt kring varför vissa drabbas.", "link": "https://www.tv4.se/artikel/sTsys2mczWlROw3jyyYKH/anna-lena-brundin-drabbades-tva-ganger-av-brustet-hjaerta", "date_display": "2026-07-12", "date_iso": "2026-07-12T11:34:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/hjartinfarkt", "/hjarta", "/hjart-och-karlsjukdomar", "/hjart-lungfonden"]}, {"id": 130, "title": "How long does the summer heat last: \"Then the temperatures rise\"", "summary": "Many parts of Europe are now feeling the high temperatures, above all in France where the red heat warning is still in place. - Yesterday (Saturday) there were at least, as far as I can find, no highs above 40 degrees in France, so things are going in the right direction anyway, says meteorologist Elisabet Danielsson. Saturday was also warm in Sweden, the hottest in Arvika at 29.6 degrees and all over the west coast the temperatures were above 28 degrees. Cooler air during Sunday Cooler air will move in over the country during Sunday. But after the cold front, rising temperatures and mostly sun remain, possibly a few thin clouds. - Then the temperatures start to rise. When the temperatures rise, the West Coast is still at the top and also around northern Svealand the heat will be noticeable. By Tuesday, 27-28 degrees are expected - but also 30 degrees in some places. At the same time, SMHI is flagging high temperatures in parts of Västra Götaland and southwestern Svealand.  - Towards the middle of the week, it will probably be up to 30 degrees locally, states Elisabet Danielsson. SMHI urges extra caution as the heat can increase the risk of health problems, especially for risk groups such as people with underlying illnesses, the elderly and young children. \"Almost a whole week anyway\" The heat prevails over almost the entire country, with the exception of the northernmost parts, which do not quite reach the same temperatures.  The heat looks like it will stay for a couple more days. - It looks like it will remain like this until Friday. But that it will then become a little more unstable again towards the weekend, but almost a whole week, in any case, it looks like we will get, says Elisabet Danielsson.", "title_original": "Så länge stannar sommarvärmen: ”Då stiger temperaturerna”", "summary_original": "Det är många delar av Europa som nu känner av de höga temperaturerna, framför allt i Frankrike där den röda värmevarningen fortsatt ligger kvar. – I går (lördag) var det åtminstone, vad jag kan hitta, inga toppnoteringar över 40 grader i Frankrike, så det går lite åt rätt håll i alla fall, säger meteorologen Elisabet Danielsson. Lördagen var även varm i Sverige, allra varmast i Arvika på 29,6 grader och över hela västkusten var temperaturerna upp över 28 grader. Svalare luft under söndagen Under söndagen drar sig svalare luft in över landet. Men efter kallfronten återstår stigande temperaturer och mestadels sol, möjligtvis några tunna slöjmoln. – Då börjar nu temperaturerna att stiga. När graderna stiger ligger Västkusten fortsatt i topp och även runt norra Svealand kommer hettan märkas av. Framme på tisdagen väntas 27-28 grader – men även 30 grader på vissa platser. Samtidigt flaggar SMHI för höga temperaturer i delar av Västra Götaland och sydvästra Svealand.  – Mot mitten av veckan blir det lokalt antagligen upp mot 30 grader, konstaterar Elisabet Danielsson. SMHI uppmanar till extra försiktighet eftersom värmen kan öka risken för hälsoproblem, särskilt för riskgrupper som personer med underliggande sjukdomar, äldre och små barn. ”Nästan en hel vecka i alla fall” Hettan står sig över nästan hela landet, med undantag för de nordligaste delarna som inte riktigt kommer upp i samma temperaturer.  Värmen ser ut att ligga kvar ett par dagar till. – Det ser ut som att det ligger kvar så här fram till på fredag. Men att det sedan blir lite ostadigare igen fram emot helgen, men nästan en hel vecka i alla fall ser det ut som att vi får, säger Elisabet Danielsson.", "link": "https://www.tv4.se/artikel/5OBhrbMCCPnPOVaWOjLXkh/sa-laenge-stannar-sommarvaermen-da-stiger-temperaturerna", "date_display": "2026-07-12", "date_iso": "2026-07-12T11:25:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Vädret", "/vadret", "/sommarvader", "/vaderprognoser", "/sommar"]}, {"id": 131, "title": "Houses in Malmö clean stormwater - halving the consumption of drinking water", "summary": "The purified day water is used for washing, toilets and irrigation. The result is that the residents get by on 65 liters of drinking water per person per day, less than half of the Swedish average of 140 litres. In the basement is the purification system.\n\n- We get stormwater from the street into these tanks. It is led further to this tank, where there is a ceramic filter that cleans it. It is then collected in this tank where it is pumped out to our toilets and the laundry room. We irrigate with it outside, but we are not allowed to drink it, says Ludvig Haav, resident and project manager. EU project since six years The EU-funded project started six years ago and is a collaboration between, among others, Lund University of Technology and VA Syd.\n\n- Even though we had good access to drinking water, you can clearly see that there is a change. You need to do this type of project to test and be prepared for this type of change. We cannot use the drinking water as we do today. It is still a food that we use to flush the toilets, says Helena Tsiparis, project developer, Sweden Water Research.\n\nLudvig Haav says that since it is the first house, many checks have been carried out.\n\n- As we are the first out, they were very careful with the water quality. There have been many bacteria tests and salt tests and tests of everything possible. I hope the next house doesn't have to do that now that we've done it all, says Ludvig Haav, resident and project manager. Rules and standards need to be developed The technology exists, but according to Helena Tsiparis regulations, business models and building standards need to be developed. At the same time, the water shortage has made the issue increasingly topical.\n\n- I definitely believe that just as we are now, we will see a development of solutions. There is another incentive when we are in this kind of crisis, where we have no drinking water, says Helena Tsiparis, project developer, Sweden Water Research. Want to share with", "title_original": "Hus i Malmö renar dagvatten – halverar förbrukningen av dricksvatten", "summary_original": "Det renade dagvattnet används till tvätt, toaletter och bevattning. Resultatet är att de boende klarar sig på 65 liter dricksvatten per person och dag, mindre än hälften av det svenska snittet på 140 liter. I källaren står reningssystemet.\n\n– Vi får dagvatten från gatan ner i de här tankarna. Det leds vidare till den här tanken, där det ligger ett keramiskt filter som renar det. Sen samlas det upp i den här tanken där det pumpas ut till våra toaletter och tvättstugan. Vi bevattnar med det utomhus, men vi får inte dricka det, säger Ludvig Haav, boende och projektledare. EU-projekt sedan sex år Projektet som är EU-finansierat, startade för sex år sedan och är ett samarbete mellan bland annat Lunds Tekniska Högskola och VA Syd.\n\n– Även om vi haft god tillgång till dricksvatten så ser man ju så klart att det finns en förändring. Man behöver göra den här typen av projekt för att testa och kunna vara förberedd på den typen av förändringar. Vi kan inte använda dricksvattnet så som vi gör idag. Det är ändå ett livsmedel som vi använder för att spola toaletterna, säger Helena Tsiparis, projektutvecklare, Sweden Water Research.\n\nLudvig Haav säger att eftersom det är det första huset har det genomförts många kontroller.\n\n– I och med att vi är först ut så var de väldigt noggranna med vattenkvaliteten. Det har varit många bakterietester och salttester och tester av allt möjligt. Det hoppas jag att nästa hus inte behöver göra nu när vi har gjort alla, säger Ludvig Haav, boende och projektledare. Regler och normer behöver utvecklas Tekniken finns, men enligt Helena Tsiparis behöver regelverk, affärsmodeller och byggnormer utvecklas. Samtidigt har vattenbristen gjort frågan allt mer aktuell.\n\n– Jag tror definitivt att just som vi befinner oss nu så kommer vi se en utveckling av lösningar. Det finns ett annat incitament när vi befinner oss i den här typen av kris, där vi inte har något dricksvatten, säger Helena Tsiparis, projektutvecklare, Sweden Water Research. Vill dela med till andra På Röda Oasen finns i dag ett överskott av renat dagvatten och förhoppningen är att fler ska kunna ta del av det.\n\n– Vi bor 40 personer här, men den skulle klara nästan 400 personers behov till toalett och tvätt. Det hade varit jätteroligt om vi kunde dela det vi har med fler, säger Ludvig Haav, boende och projektledare.\n\nFör att undvika missförstånd när andra måste spara vatten har man satt upp skyltar.\n\n– Det ser inte bra ut även om vi har hur mycket som helst, säger Ludvig Haav, boende och projektledare.", "link": "https://www.tv4.se/artikel/2AUMXpzUaTXMAK5F2pS46/hus-i-malmoe-renar-dagvatten-halverar-foerbrukningen-av-dricksvatten", "date_display": "2026-07-12", "date_iso": "2026-07-12T10:31:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Malmö", "/malmo", "/dricksvatten", "/inrikes", "/miljo", "/vattenbrist", "/hem-och-hushall"]}, {"id": 132, "title": "After the storm of criticism: \"Just being myself - then I happen to provoke\"", "summary": "When the influencer Hanna Friberg changed the Swedish national team shirt during the soccer World Cup, it caused strong reactions. Critics called it disrespectful and some equated it to tearing up the Swedish flag. She herself says that the aim was never to provoke. - Many people think that everything we influencers do is calculated. But I'm just myself. I do what I think is fun. Then I happen to provoke, says Friberg.\n\nShe says that the idea was just to make the shirt more personal.\n\n- I thought it was fun to do something different with the Sweden jersey. Everyone else had the classic model and I wanted to do something different. Death threats after the food box comment It's not the first time Hanna ends up in bad weather. The comment that guys who bring a lunch box is a \"ick\" led to a big drive and death threats. \n\n- The first 24 hours it felt a little uncomfortable. But then it became the funnest thing in the world. All companies jumped on board and did campaigns.\n\nShe says that the years as a public figure have made her less sensitive to criticism.\n\n- People will always have opinions. You can't be liked by everyone. \"I am very different too\" Hanna started blogging as early as 15 years old and describes herself as a person who has always followed her own path. - I've probably always been quite unbridled and tried to focus on what I think is fun and makes me feel good. She believes that it is this attitude that has enabled her to withstand both criticism and success. Although her Instagram often shows a seemingly perfect surface, Hanna says she wants to convey a deeper message through YouTube and podcasts. - I try to encourage young girls to have a little more joy in life. Because I'm damn good at it, says Hanna. She also wants to broaden the image of herself and no longer be associated only with her dating life. - I am also very different.", "title_original": "Efter kritikstormen: ”Är bara mig själv – sen råkar jag provocera”", "summary_original": "När influencern Hanna Friberg klippte om den svenska landslagströjan under fotbolls-VM väckte det starka reaktioner. Kritiker kallade det respektlöst och vissa likställde det med att klippa sönder den svenska flaggan. Själv säger hon att syftet aldrig var att provocera. – Många tror att allt vi influencers gör är kalkylerat. Men jag är bara mig själv. Jag gör det jag tycker är kul. Sen råkar jag provocera, säger Friberg.\n\nHon berättar att tanken bara var att göra tröjan mer personlig.\n\n– Jag tyckte det var kul att göra något annat med Sverigetröjan. Alla andra hade den klassiska modellen och jag ville göra något annorlunda. Dödshot efter matlådekommentaren Det är inte första gången Hanna hamnar i blåsväder. Kommentaren om att killar som har med sig matlåda är en ”ick” ledde till ett stort drev och dödshot. \n\n– De första 24 timmarna kändes det lite obehagligt. Men sen blev det världens roligaste grej. Alla företag hoppade på och gjorde kampanjer.\n\nHon säger att åren som offentlig person gjort henne mindre känslig för kritik.\n\n– Folk kommer alltid ha åsikter. Man kan inte vara omtyckt av alla. ”Jag är mycket annat också” Hanna började blogga redan som 15-åring och beskriver sig själv som en person som alltid gått sin egen väg. – Jag har nog alltid varit ganska obrydd och försökt fokusera på det jag tycker är kul och mår bra av. Hon menar att det är den inställningen som gjort att hon klarat både kritik och framgång. Trots att hennes Instagram ofta visar upp en till synes perfekt yta säger Hanna att hon vill förmedla ett djupare budskap genom Youtube och podcast. – Jag försöker peppa unga tjejer till lite mer livsglädje. För det är jag jävligt bra på, säger Hanna. Hon vill också bredda bilden av sig själv och inte längre bara förknippas med sitt dejtingliv. – Jag är mycket annat också.", "link": "https://www.tv4.se/artikel/3Tw6QaXTgPw0yHkyuBZmPU/hanna-friberg-att-inte-bry-sig-goer-en-bara-bra", "date_display": "2026-07-12", "date_iso": "2026-07-12T09:36:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/influencers", "/fotbolls-vm-i-qatar"]}, {"id": 133, "title": "\"Of course it is possible to understand the disappointment from the Norwegian side\"", "summary": "", "title_original": "”Klart att det går att förstå besvikelsen från norskt håll”", "summary_original": "", "link": "https://www.tv4.se/artikel/4fDgdOaOOYpvmYTb8O6sF8/klart-att-det-gar-att-foersta-besvikelsen-fran-norskt-hall", "date_display": "2026-07-12", "date_iso": "2026-07-12T08:31:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 134, "title": "Bank manager sees effect of employees' lunch training", "summary": "The employees believe that training makes them more productive. But few are allowed to do so during working hours. The solution may be simpler than many think, according to a CEO.", "title_original": "Bankchef ser effekt av anställdas lunchträning", "summary_original": "De anställda tror att träning gör dem mer produktiva. Men få tillåts göra det på arbetstid. Lösningen kan vara enklare än många tror, enligt en vd.", "link": "https://www.svd.se/a/lnvGgy/vd-rorelse-pa-arbetstid-lattare-att-na-an-manga-tror", "date_display": "2026-07-12", "date_iso": "2026-07-12T04:22:34+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Livet"]}, {"id": 135, "title": "Argentina ready for World Cup semi-final - after red card and extra time", "summary": "Now set against England", "title_original": "Argentina klart för VM-semifinal – efter rött kort och förlängning", "summary_original": "Ställs nu mot England", "link": "https://www.tv4.se/artikel/hyLYAHW9ZomjRdfB0lYIb/argentina-klart-foer-vm-semifinal-efter-roett-kort-och-foerlaengning", "date_display": "2026-07-12", "date_iso": "2026-07-12T04:16:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 136, "title": "Nurse Martina in the Congo of the Ebola outbreak: \"Don't be afraid\"", "summary": "Martina Gustavsson is in the capital Kinshasa waiting to go home to Sweden. She has just spent a month in North Kivu in eastern Congo-Kinshasa – one of the areas hardest hit by the ongoing Ebola outbreak. But before she can get on the plane home, she must have been symptom-free for a number of days to ensure that she is not infected. She was also here in 2019 when over 2,000 people died from the disease. But this time it's different because the outbreak is driven by the unusual bundibugyo virus variant, which lacks a vaccine and treatment. I think this will go on for a long time, unfortunately, says Martina Gustavsson. Spreads to more areas The disease, which according to some assessors may have circulated undetected since February, continues to spread to several areas in Central and East Africa. The worst affected provinces are North Kivu and Ituri in northeastern Congo-Kinshasa. According to the World Health Organization (WHO), almost 650 people have died and over 1,800 have been confirmed infected. Martina Gustavsson is sent by Doctors Without Borders (MSF), which runs several clinics and Ebola treatment centers. Since the middle of June, together with local staff, she has trained healthcare employees in how to protect themselves and reduce the risk of infection. She has also helped build isolation units at health clinics where people can be received and tested to avoid the infection spreading to other patients. It is a challenging job where things like running water and soap are not always available. Infection tracking is difficult because villages can be in hard-to-reach areas. The health centers smell of chlorine solution that is used to clean equipment. The air is dusty and it's 30 degrees, says Martina Gustavsson, who on a daily basis conducts research in global disaster medicine at the Karolinska Institutet. Billions against the infection WHO has launched an effort, worth the equivalent of almost five billion kroner, to fight the current outbreak. In Bunia in the country", "title_original": "Sjuksköterskan Martina i ebolautbrottets Kongo: ”Är inte rädd”", "summary_original": "Martina Gustavsson är i huvudstaden Kinshasa i väntan på att få åka hem till Sverige. Hon har precis tillbringat en månad i Nordkivu i östra Kongo-Kinshasa – ett av de områden som har drabbats hårdast av det pågående ebolautbrottet. Men innan hon får sätta sig på planet hem måste hon ha varit symtomfri ett antal dagar för att säkerställa att hon inte är smittad. Hon var även här 2019 då över 2 000 personer avled av sjukdomen. Men den här gången är det annorlunda eftersom utbrottet drivs av den ovanliga virusvarianten bundibugyo, som saknar vaccin och behandling. Jag tror att det här kommer att pågå länge tyvärr, säger Martina Gustavsson. Sprids till fler områden Sjukdomen, som enligt vissa bedömare kan ha cirkulerat oupptäckt sedan februari, fortsätter att spridas till flera områden i Central- och Östafrika. De värst drabbade provinserna är Nordkivu och Ituri i nordöstra Kongo-Kinshasa. Enligt Världshälsoorganisationen (WHO) har nästan 650 människor avlidit och över 1 800 bekräftats smittade. Martina Gustavsson är utsänd av Läkare utan gränser (MSF) som driver flera kliniker och ebolabehandlingscenter. Sedan mitten av juni har hon tillsammans med lokal personal utbildat sjukvårdsanställda i hur man skyddar sig och minskar smittorisken. Hon har också hjälpt till att bygga upp isoleringsenheter på hälsokliniker där man kan ta emot och testa människor för att undvika att smittan sprids till andra patienter. Det är ett utmanande arbete där saker som rinnande vatten och tvål inte alltid är tillgängliga. Smittspårning är svårt eftersom byar kan ligga i svårtillgängliga områden. På hälsocentren doftar det av klorinlösning som man använder för att rengöra utrustning. Luften är dammig och det är 30 grader varmt, berättar Martina Gustavsson, som till vardags forskar inom global katastrofmedicin på Karolinska institutet. Miljarder mot smittan WHO har dragit i gång en insats, värd motsvarande nästan fem miljarder kronor, för att bekämpa det aktuella utbrottet. I Bunia i landets östra delar pågår kliniska försök för att hitta ett vaccin och en behandlingsmetod mot virusvarianten bundibugyo. Men ansträngningarna att begränsa virusets spridning hämmas av våld och väpnade konflikter mellan militanta grupper, som har drivit miljontals civila på flykt. Det är viktigt att vinna folks förtroende och få dem att söka vård i tid, säger Martina Gustavsson.", "link": "https://www.tv4.se/artikel/tt-260712-kongokinebolasvensk1-d4de6893/svenska-martina-i-ebolautbrottets-kongo-inte-radd", "date_display": "2026-07-12", "date_iso": "2026-07-12T04:00:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/sverige", "/folkhalsomyndigheten", "/kongo-kinshasa"]}, {"id": 137, "title": "Shipwreck - Norway gets to row home from the World Cup after a super shocker", "summary": "England are through to the semi-finals", "title_original": "Skeppsbrott – Norge får ro hem från VM efter superrysare", "summary_original": "England är klart för semifinal", "link": "https://www.tv4.se/artikel/4bIHOE8qPE5DUYsizA9o2s/stoekigt-vaeder-i-oslo-infoer-vm-matchen", "date_display": "2026-07-11", "date_iso": "2026-07-11T20:08:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 138, "title": "Sponges will clean 40,000 tons of toxic environmental pollution", "summary": "The hazardous waste at the industrial site looks like dirty gravel mixed with blobs of black lava. It is not possible to walk on the ground - it is sunken and you can sink down.  - Many of these polyaromatic hydrocarbons are carcinogenic. You could say they belong to the worse environmental toxins, says Magnus Ivarsson, researcher and founder of Mycomine. A fight against the clock Nynäs has 20 years to clean up all the pollution. An environmental judgment has established that. - We must ensure that the land is in such condition that it can be used for other things than as a landfill, says Peter Eriksson, head of engineering at Nynäs. The fungus \"eats\" the acid tar Nynäs has started to burn some of the acid tar, but this leads to carbon dioxide emissions. Therefore, the mushroom alternative is now being tested. Of course, it's not about chanterelles, but it's a kind of mushroom that grows in liquid. It is poured into tanks and mixed with the acid tar. - The fungi neutralize the dangerous in the acid sludge and turn it into something clean, explains Magnus Ivarsson. Becomes a soil conditioner The end product is biochar, which can be used in cultivation.  - You could say it's like manure. It is material that we make to increase volumes in agriculture, says Magnus Ivarsson. Complete decomposition Tests have shown that almost 100 percent of the material breaks down without any carbon dioxide emissions. In the long term, it is also hoped to be able to clean other pollutants, such as PFAS. Is there anything negative about this method? - Of course, it costs quite a lot of money to keep up with this. But at the same time we must remember that this is an environmental debt that we have to take care of so that we can do our best to take care of the pollution we have caused once upon a time, answers Peter Eriksson.", "title_original": "Svampar ska rena 40 000 ton giftiga miljöföroreningar", "summary_original": "Det farliga avfallet på industriområdet ser ut som smutsigt grus blandat med blobbar av svart lava. Det går inte att gå på marken - den är sank och man kan sjunka ner.  – Många av de här polyaromatiska kolvätena är cancerogena. De tillhör de värre miljögifterna skulle man kunna säga, säger Magnus Ivarsson, forskare och grundare av Mycomine. En kamp mot klockan Nynäs har 20 år på sig att rena alla föroreningarna. Det har en miljödom slagit fast. – Vi ska säkerställa att marken är i sådant skick att den går att använda till andra saker än som en deponi, säger Peter Eriksson, ingenjörschef på Nynäs. Svampen \"äter\" syratjäran En del av syratjäran har Nynäs börjat bränna upp, men det leder till koldioxidutsläpp. Därför testas nu svampalternativet. Det handlar förstås inte om kantareller, utan det är en sorts svamp som växer i vätska. Den hälls i tankar och blandas med syratjäran. – Svamparna neutraliserar det farliga i syraslammet och gör om det till någonting rent, förklarar Magnus Ivarsson. Blir till jordförbättringsmedel Slutprodukten blir biokol, som man kan använda vid odling.  – Det är som gödsel kan man säga. Det är material som vi gör för att öka volymerna inom jordbruket, säger Magnus Ivarsson. Fullständig nedbrytning Tester har visat att nästan 100 procent av materialet ner utan att det blir några koldioxidutsläpp. På sikt hoppas man också kunna rena andra föroreningar, som PFAS. Finns det ingenting negativt med den här metoden? – Det kostar naturligtvis ganska mycket pengar att hålla på med det här. Men samtidigt ska vi komma ihåg att det här är en miljöskuld som vi måste ta hand om så att vi får göra vårt bästa för att ta hand om den förorening vi har orsakat en gång i tiden, svarar Peter Eriksson.", "link": "https://www.tv4.se/artikel/5YTDAzeQRUPO6pIyreB8nk/svampar-ska-rena-40-000-ton-giftiga-miljoefoeroreningar", "date_display": "2026-07-11", "date_iso": "2026-07-11T18:01:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/svampar", "/svamp", "/svampforgiftning", "/miljo"]}, {"id": 139, "title": "Nine-year-old boy may be alive during riots", "summary": "According to the Washington Post, the rescue of the 9-year-old has been characterized by uncertainty. Rescue teams from Portugal and Spain carried out tests around the ninth day after the quake, but found no signs of life. The conclusion then was that it was too late. But two days later, a Venezuelan team made a different assessment. They believed someone in what remained of the sixth-floor apartment answered questions with knocks and scrapes. A Mexican rescue force that later joined says its sound tests also point to conscious responses from within the racial masses. - We have had contact with him. We know that these are conscious responses, says mission leader Miguel García. The earthquakes, with magnitudes of 7.2 and 7.5 and only 39 seconds between tremors, struck on June 24. Hundreds of buildings were destroyed and thousands are still missing. Over 4,300 people are reported to have died, according to Reuters. \"Think we will succeed\" It is believed that the boy may have survived in an air pocket with sufficient oxygen. The distance to the boy is estimated to be around six meters, but without heavy equipment, the work has largely been done by hand with hammers, picks and shovels. According to the reports, rescuers tried to insert a small camera through a crack and claim to have seen a face and blinking eyes in the darkness - but no one could confirm the identity. On day 16, the effort was hampered when heavy rains caused tunnels that had been dug to collapse again. Despite that, new tests still indicate signs of life - and the rescue work has had to start over. - I feel it. More and more I feel that I am close, and I believe that we will succeed, says the father.", "title_original": "Nioårig pojke kan vara vid liv under rasmassor", "summary_original": "Enligt Washington Post har räddningsinstatsen av 9-åringen präglats av osäkerhet. Räddningsteam från Portugal och Spanien genomförde tester omkring den nionde dagen efter skalven, utan att hitta livstecken. Slutsatsen blev då att det var för sent. Men två dagar senare gjorde ett venezuelanskt team en annan bedömning. De menade att någon i vad som återstår av lägenheten på sjätte våningen svarade på frågor med knackningar och skrap. En mexikanskt räddningsstyrka som senare anslöt, säger att deras ljudtester också pekar på medvetna svar inifrån rasmassorna. – Vi har haft kontakt med honom. Vi vet att det här är medvetna svar, säger insatsledaren Miguel García. Jordbävningarna, med magnitud 7,2 och 7,5 och bara 39 sekunder mellan skalven, slog till den 24 juni. Hundratals byggnader förstördes och tusentals är fortfarande saknade. Över 4 300 människor rapporteras ha dött, enligt Reuters. ”Tror att vi kommer att lyckas” Man tror att pojken kan ha överlevt i en luftficka med tillräckligt syre. Avståndet till pojken uppskattas till omkring sex meter, men utan tung utrustning har arbetet till stor del skett för hand med hammare, hackor och spadar. Enligt uppgifterna har räddare försökt föra in en liten kamera genom en springa och säger sig ha sett ett ansikte och blinkande ögon i mörkret – men ingen kunde bekräfta identiteten. Dag 16 försvårades insatsen när kraftiga regn gjorde att tunnlar som grävts fram rasade igen. Trots det uppges nya tester fortsatt indikera livstecken – och räddningsarbetet har fått börja om. – Jag känner det. Mer och mer känner jag att jag är nära, och jag tror att vi kommer att lyckas, säger pappan.", "link": "https://www.tv4.se/artikel/2t54tFiuxaKPaOANuCaXCC/9-arig-pojke-kan-leva-under-rasmassor-16-dagar-efter-jordbaevningarna", "date_display": "2026-07-11", "date_iso": "2026-07-11T17:27:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/jordbavningarna-i-venezuela", "/venezuela"]}, {"id": 140, "title": "So the traces of Orbán's rule must be swept away - quickly", "summary": "One of the biggest successes is an agreement with the European Commission to unlock 16.4 billion euros in previously frozen aid funds. To gain access to the money, Hungary has, among other things, adopted a new anti-corruption and transparency reform and promised to strengthen the rule of law. - Above all, it is about the requirements for functioning principles of the rule of law, which they believe have not worked before in Hungary, says Hungary expert Anders Blomqvist. Major changes in legislation The new government has also pushed through a constitutional change that limits the prime minister's term of office to eight years, counted from 1990. This means that Viktor Orbán cannot return to power - and that Péter Magyar himself can only serve eight years at most. Another major change is the reshaping of the Hungarian media landscape. The state news channel M1 has temporarily stopped its news broadcasts as part of a major restructuring of the public service. - Magyar's words are harsh. He has said that it was a factory of lies, says Blomqvist. Fidesz in ruins The former government party Fidesz has suffered a total collapse. But at the same time, there are right-wing extremist groups in parliament, which are critical of the new government. - Orbán does not even remain in parliament. There is a B team there that is hardly a functioning opposition. - They are completely incomprehensible, think that everything has gone right and try to defend the whole system to the last. \"Then it can become more sensitive\" Even the extreme right-wing groups are critical and believe that a new type of concentration of power around Péter Magyar can emerge - that politics will become too person-fixated. - It is too early to say whether there is any truth in it. But he has done what he promised and what he was elected on. He has not committed any violations, although some organizations have criticized Magyar for trying to depose the president and that some constitutional changes are going too quickly, says Anders Blomqvist and continues: - The st", "title_original": "Så ska spåren av Orbáns styre sopas bort – snabbt", "summary_original": "En av de största framgångarna är en uppgörelse med EU-kommissionen om att låsa upp 16,4 miljarder euro i tidigare frysta stödmedel. För att få tillgång till pengarna har Ungern bland annat antagit en ny antikorruptions- och transparensreform och lovat att stärka rättsstatsprinciperna. – Framför allt handlar det om kraven på fungerande rättsstatsprinciper, som man menar inte har fungerat tidigare i Ungern, säger Ungernexperten Anders Blomqvist. Stora förändringar i lagstiftningen Den nya regeringen har också drivit igenom en konstitutionell förändring som begränsar premiärministerns mandatperiod till åtta år, räknat från 1990. Det innebär att Viktor Orbán inte kan återvända till makten – och att Péter Magyar själv som mest kan sitta i åtta år. En annan stor förändring är omstöpningen av det ungerska medielandskapet. Den statliga nyhetskanalen M1 har tillfälligt stoppat sina nyhetssändningar som del av en större omstöpning av public service. – Magyars ord är hårda. Han har sagt att det var lögnfabriker, säger Blomqvist. Fidesz i spillror Det tidigare regeringspartiet Fidesz har drabbats av en total kollaps. Men samtidigt finns högerextrema grupper i parlamentet, som är kritiska till den nya regeringen. – Orbán sitter inte ens kvar i parlamentet. Det sitter ett B-lag där som knappt är en fungerande opposition. – De är helt oförstående, tycker att allting har gått rätt till och försöker försvara hela systemet in i det sista. ”Då kan det bli mer känsligt” Även de högerextrema grupperna är kritiska och menar att det kan växa fram en ny typ av maktkoncentration kring Péter Magyar – att politiken blir för personfixerad. – Det är för tidigt att säga om det finns någon sanning i det. Men han har gjort det han lovade och det han gick till val på. Han har inte gjort några överträdelser, även om vissa organisationer har kritiserat Magyar för att försöka avsätta presidenten och att vissa konstitutionella förändringar går för snabbt, säger Anders Blomqvist och fortsätter: – Den stora frågan han ännu inte har tagit tag i är budgeten. Det är också där det så småningom blir en prioriteringsfråga – och då kan det bli mer känsligt. Framöver planeras flera reformer, enligt Blomqvist, att införas. Bland annat en förmögenhetsskatt för de rikaste och ökat socialt stöd till ekonomiskt utsatta grupper.", "link": "https://www.tv4.se/artikel/qCz8wwERyPiC4SCYJKrjG/sa-ska-sparen-av-orbans-styre-sopas-bort-snabbt", "date_display": "2026-07-11", "date_iso": "2026-07-11T14:34:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ungern", "/viktor-orban", "/peter-magyar"]}, {"id": 141, "title": "The friends were chosen for Bad Bunny's La Casita: \"Was unreal\"", "summary": "After a dramatic online ticket hunt, friends Wilma Sandberg and Gabrielle Roscoe finally managed to secure their seats to Bad Bunny's concert. Once inside the arena, they were surprised when a person from the artist's team suddenly asked if they wanted to come with them to \"La Casita\".\n\n- It was surreal! says Wilma Sandberg to TV4 Nyheterna.\n\n- I have never had so much adrenaline in my body. We took each other's hands and were on our way there. I looked at Wilma and said I don't think you've ever squeezed my hand so hard, says Gabrielle Roscoe. Exclusive invitation mid-concert “La Casita” is part of the stage production where Bad Bunny and his crew invite a select few fans to experience the concert up close. The space is designed like a living room, with an open bar and a location that allows you to get close to the star.\n\nWilma and Gabrielle had to hand in their phones before going in, and estimate there were about 20-25 people in there.\n\n- It's like a house where Bad Bunny invites visitors or fans to experience the concert. You can stand there and dance - and he will get there, says Gabrielle Roscoe.\n\nFor Wilma and Gabrielle, it was an unexpected and emotional experience.\n\n- It was one of the best concerts I've been to. Or: it's the best so far, says Wilma Sandberg.\n\n- We have been to many together, but this beats everything. It was a concert like no other, says Gabrielle Roscoe. \"The tip is to just go there\" The friends would have liked to have gone to Bad Bunny's second concert in Stockholm the next day, but are content with the memories of the evening.\n\n- We said it: we have so many memories of his songs together. And precisely that we got to do this together! says Gabrielle Roscoe. On social media, it has become a trend to try to be selected for La Casita. Wilma and Gabrielle have no surefire tricks - but they do have one piece of advice: - I think the tip is to just go there, dress up so you feel beautiful, have fun and enjoy yourself, Gabrielle Roscoe. - When you have maximum joy and just enjoy yourself", "title_original": "Vännerna blev utvalda till Bad Bunnys La Casita: ”Var overkligt”", "summary_original": "Efter en dramatisk biljettjakt online lyckades vännerna Wilma Sandberg och Gabrielle Roscoe till slut säkra sina platser till Bad Bunnys konsert. Väl inne i arenan blev de överraskade när en person ur artistens team plötsligt frågade om de ville följa med till “La Casita”.\n\n– Det var overkligt! säger Wilma Sandberg till TV4 Nyheterna.\n\n– Jag har aldrig haft så mycket adrenalin i kroppen. Vi tog varandras händer och var på väg dit. Jag kollade på Wilma och sa att jag tror aldrig du har klämt min hand så hårt, säger Gabrielle Roscoe. Exklusiv inbjudan mitt under konserten “La Casita” är en del av scenproduktionen där Bad Bunny och hans crew bjuder in ett fåtal utvalda fans för att uppleva konserten på nära håll. Utrymmet är utformat som ett vardagsrum, med fri bar och ett läge som gör att man kommer nära stjärnan.\n\nWilma och Gabrielle fick lämna in sina telefoner innan de gick in, och uppskattar att det var omkring 20–25 personer där inne.\n\n– Det är som ett hus där Bad Bunny bjuder in besökare eller fans för att uppleva konserten. Man får stå där och dansar – och han kommer ju dit, säger Gabrielle Roscoe.\n\nFör Wilma och Gabrielle blev det en oväntad och känslosam upplevelse.\n\n– Det var en av de bästa konserterna jag varit på. Eller: det är den bästa hittills, säger Wilma Sandberg.\n\n– Vi har varit på många tillsammans, men det här slår allt. Det var en konsert utan dess like, säger Gabrielle Roscoe. ”Tipset är att bara gå dit” Vännerna hade gärna gått på Bad Bunnys andra konsert i Stockholm dagen efter, men nöjer sig med minnena från kvällen.\n\n– Vi sa det: vi har så många minnen till hans låtar tillsammans. Och just att vi fick göra det här tillsammans! säger Gabrielle Roscoe. På sociala medier har det blivit en trend att försöka bli utvald till La Casita. Wilma och Gabrielle har inga säkra knep – men ett råd har de: – Jag tror att tipset är att bara gå dit, klä upp er så ni känner er fina, ha kul och njut, Gabrielle Roscoe. – När man har maximal glädje och bara njuter då kanske det händer. Många var där själva och då kanske det är ett tips att inte vara så många, säger Wilma Sandberg.", "link": "https://www.tv4.se/artikel/4mYsig3pfK0XT3yKxcO56V/vaennerna-blev-utvalda-till-bad-bunnys-la-casita-var-overkligt", "date_display": "2026-07-11", "date_iso": "2026-07-11T12:54:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/musik", "/bad-bunny", "/stockholm", "/konserter", "/strawberry-arena"]}, {"id": 142, "title": "Shots fired during Farmen filming: \"Very unpleasant\"", "summary": "A recording of TV4's long-running \"Farmen\" in Björkfors in Kinda municipality received an unexpected and \"scary\" visit on the night of Friday.  - Two four-wheelers appeared at one of our filming locations. They drove around and were messy. Our staff on site went out and confronted them and asked them to leave the place, which they did at first, but came back and continued to be rowdy, says Joel Bendrik, executive producer at Farmen. \"Powerful\" It was the second time they had brought any kind of weapon. It is currently unclear exactly what type of weapon it was. The police describe the object as \"a weapon-like object\". - It feels difficult to speculate because I wasn't there and it was very dark, but witnesses on the spot say that there was a bang. So you can imagine that it was not an air weapon, but something else, a little more powerful. The shots are said to have been aimed at a nearby paddock with animals, but neither people nor animals have been injured. - No, no animals have been injured and no people either, luckily. It is also unclear what purpose the men had with the action. - No, they were mostly just there and disturbing. They had nothing directly on their minds other than to wreak havoc. Security properly increased After the incident, the participants have been offered several talks with a psychologist, but security on site has also been significantly increased. - Of course there is always security and staff on site. Now we've just kind of taken it a few levels up.\n\nThe police drew up a report of aggravated weapons offense and illegal threats without a suspect. A criminal investigation was also carried out at the scene and interviews with the people on site. An investigation is ongoing, according to the police. - The perpetrators were wearing helmets and full gear, so it was probably difficult to see what they looked like, says Johnny Gustavsson, police spokesperson.", "title_original": "Skott avlossade under Farmen-inspelning: ”Väldigt obehagligt”", "summary_original": "En inspelning av TV4:s långkörare ”Farmen” i Björkfors i Kinda kommun fick oväntat och ”skrämmande” besök natten mot fredag.  – Det dök upp två fyrhjulingar på en av våra inspelningsplatser. De körde runt och var stökiga. Vår personal på plats gick ut och konfronterade dem och bad dem lämna platsen, vilket de då först gjorde, men kom tillbaka och fortsatte vara stökiga, säger Joel Bendrik, exekutiv producent på Farmen. ”Kraftfullt” Det var andra gången de tog med sig någon form av vapen. Det är i nuläget oklart exakt vad det var för typ av vapen. Polisen beskriver objektet som ”ett vapenliknande föremål”. – Det känns svårt att spekulera i och med att jag inte var där och det var väldigt mörkt, men vittnen på plats säger att det smällde. Så man kan ju tänka sig att det inte var luftvapen, utan något annat, lite mer kraftfullt. Skotten ska ha riktas mot en närliggande hage med djur, men varken människor eller djur har skadats. – Nej, inga djur har skadats och inga människor heller, som tur är. Det är också oklart vilket syfte männen hade med aktionen. – Nej, de var mest bara där och störde. De hade inget direkt på hjärtat mer än att härja runt. Skruvat upp säkerheten ordentligt Efter händelsen har deltagarna erbjudits flera samtal med psykolog, men säkerheten på plats har också höjts ordentligt. – Självklart finns det alltid säkerhet och personal på plats. Nu har vi liksom tagit det några nivåer till upp bara.\n\nPolisen upprättade en anmälan om grovt vapenbrott och olaga hot utan misstänkt person. Det gjordes även en brottsundersökning på platsen och förhör med personerna på plats. Utredning pågår, enligt polisen. – Gärningspersonerna var klädda med hjälm och fullt ställ så det var nog svårt att se hur de såg ut, säger Johnny Gustavsson, polisens presstalesperson.", "link": "https://www.tv4.se/artikel/79eZzyS0H5p9tbPFdhMuHD/skott-avlossade-mot-gard-under-pagaende-farmen-inspelning", "date_display": "2026-07-11", "date_iso": "2026-07-11T09:53:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nöje", "/noje", "/farmen", "/tv4"]}, {"id": 143, "title": "Maja's brother Måns took his own life: \"He was let down by the care\"", "summary": "Måns Lagmark was a valued soccer goalkeeper and a person who was always there for others. But behind the cheerful facade, he struggled for over ten years with mental illness and autism, a struggle that worsened when the school's routines disappeared.\n\n- He was the kindest person in the world. There is not a single person who has anything bad to say about him, says sister Maja Lagmark. \"He was let down\" Despite Måns repeatedly asking for help, he never got the support he needed. According to Maja, he was bounced between different parts of the care, without anyone taking overall responsibility. - He was enrolled in adult psychiatry. They blamed the habilitation. No one took responsibility. We got no help, she says. Suicide expert Ulla-Karin Nyberg believes that the story reflects a larger problem. - To bounce a person between different agencies when what is needed is cooperation and security is a system error. We are organized in a way that doesn't work for these people. \"How sick do you have to be to get help?\" After the brother's death, grief has been mixed with guilt and questions about everything that could have been done differently. - You put a lot of blame on yourself after an event like this. But I said all those things that you think: \"If only I said it one more time.\" He knew I loved him, says Maja. Ulla-Karin Nyberg emphasizes that relatives must become a natural part of care. - We have to cooperate with relatives and relatives. They are the only ones who know how changed the person is. You cannot see that in a single meeting. Want Mån's story to make a difference Today, Maja chooses to openly talk about her brother's death in the hope that other families will not have to go through the same thing. - No one is taken seriously. A lot of people say the same thing. If I can make a difference for someone else, it's worth it, she says. Ulla-Karin Nyberg calls for more coordination and greater resources within psychiatry. - Mental illness can be a life-threatening condition. We must treat it with the same seriousness as other life-threatening diseases.", "title_original": "Majas bror Måns tog sitt liv: ”Han blev sviken av vården”", "summary_original": "Måns Lagmark var en uppskattad fotbollsmålvakt och en person som alltid fanns där för andra. Men bakom den glada fasaden kämpade han i över tio år med psykisk ohälsa och autism, en kamp som förvärrades när skolans rutiner försvann.\n\n– Han var världens snällaste. Det finns inte en enda person som har något ont att säga om honom, säger systern Maja Lagmark. ”Han blev sviken” Trots att Måns upprepade gånger bad om hjälp fick han aldrig det stöd han behövde. Enligt Maja bollades han mellan olika delar av vården, utan att någon tog ett samlat ansvar. – Han var inskriven på vuxenpsykiatrin. De skyllde på habiliteringen. Ingen tog ansvar. Vi fick ingen hjälp, säger hon. Suicidexperten Ulla-Karin Nyberg menar att berättelsen speglar ett större problem. – Att bolla en person mellan olika instanser när det som behövs är samarbete och trygghet är ett systemfel. Vi är organiserade på ett sätt som inte fungerar för de här människorna. ”Hur sjuk ska man vara för att få hjälp?” Efter broderns död har sorgen blandats med skuld och frågor om allt som kunde ha gjorts annorlunda. – Man lägger mycket skuld på sig själv efter en sådan här händelse. Men jag sa allt det där som man tänker: ”Om jag bara sa det en gång till.” Han visste att jag älskade honom, säger Maja. Ulla-Karin Nyberg betonar att närstående måste bli en självklar del av vården. – Vi måste samarbeta med närstående och anhöriga. De är de enda som vet hur förändrad personen är. Det kan man inte se i ett enstaka möte. Vill att Måns berättelse ska göra skillnad I dag väljer Maja att öppet berätta om sin brors död i hopp om att andra familjer ska slippa gå igenom samma sak. – Ingen tas på allvar. Väldigt många säger samma sak. Om jag kan göra förändring för någon annan, så är det värt det, säger hon. Ulla-Karin Nyberg efterlyser mer samordning och större resurser inom psykiatrin. – Psykisk ohälsa kan vara ett livshotande tillstånd. Vi måste behandla det med samma allvar som andra livshotande sjukdomar.", "link": "https://www.tv4.se/artikel/5AzF0k95YAXlYc53xURD9o/maja-foerlorade-sin-bror-i-suicid-han-blev-sviken-av-varden", "date_display": "2026-07-11", "date_iso": "2026-07-11T07:58:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/psykisk-ohalsa", "/suicid", "/sjalvmord", "/sjukvard", "/psykologi", "/livsoden"]}, {"id": 144, "title": "Powerful typhoon in Taiwan - thousands forced to leave their homes", "summary": "More than 14,000 people have fled their homes and businesses remain closed in Taiwan as Typhoon Bavi moves toward the island on Saturday, AFP reports. \"Everyone is afraid of the bad weather and stays indoors, but I only went out because I have orders,\" a shop owner told AFP. Most of the more than 14,000 evacuees in Taiwan come from the north and east of the island, Reuters reports. Air traffic has been hit hard: 920 international flights and all 280 domestic flights were cancelled. Almost all cities and counties declared a typhoon holiday on Saturday, which meant that offices and schools remained closed, while high-speed trains continued to run but with reduced traffic.  Wind speeds of 180 kilometers per hour After hitting Guam and the Northern Mariana Islands on Monday as a super typhoon, Bavi was downgraded to a typhoon as it moved across the Pacific Ocean. Taiwan's meteorological agency warned of \"extremely heavy downpour\" over northern Taiwan and \"dangerous waves\" of up to 10 meters high along the coast as Bavi approached the northern part of the island. Over 27,000 households are reported to be without electricity.  \"The typhoon's impact will be more significant during the day today,\" CWA meteorologist Jason Cheng told AFP. Bavi's maximum average wind speed dropped to 144 kilometers per hour on Saturday, with gusts of around 180 kilometers per hour, according to the Taiwan Meteorological Agency. On its way to China At the same time, the storm has caused widespread disruption in Japan's Okinawa, where over 18,000 households and facilities lost power. Airlines have canceled dozens of flights, affecting more than 26,000 passengers.  In the Philippines, heavy rains linked to Bavi have triggered landslides on the island of Mindanao, where at least 15 people are said to have died. In addition, a large number of ports remain closed and hundreds of ships are sheltered due to \"adverse weather conditions\". As the typhoon now approaches China, state media are warning of exceptionally heavy rains in eastern Zhejiang and northeastern Fujian. In Xiaguan in Zhejiang it is stated", "title_original": "Kraftfull tyfon i Taiwan – tusentals tvingas lämna sina hem", "summary_original": "Över 14 000 personer har flytt sina hem och affärer håller stängt i Taiwan när tyfonen Bavi rör sig mot ön på lördagen, rapporterar AFP. ”Alla är rädda för det svåra vädret och stannar inomhus, men jag gick ut bara för att jag har beställningar,” säger en butiksägare till AFP. De flesta av de över 14 000 evakuerade i Taiwan kommer från norra och östra delen av ön, rapporterar Reuters. Flygtrafiken har slagits hårt: 920 internationella flyg och alla 280 inrikesflyg ställdes in. Nästan alla städer och län utlyste tyfonledighet på lördagen, vilket innebar att kontor och skolor höll stängt, medan höghastighetstågen fortsatte gå men med reducerad trafik.  Vindhastighet på 180 kilometer i timmen Efter att ha träffat Guam och Nordmarianerna på måndagen som en supertyfon nedgraderades Bavi till en tyfon när den rörde sig över Stilla havet. Taiwans meteorologiska myndighet varnade för ”extremt kraftigt skyfall” över norra Taiwan och ”farliga vågor” på upp till 10 meters höjd längs kusten när Bavi närmade sig öns norra del. Över 27 000 hushåll rapporteras vara utan el.  ”Tyfonens påverkan kommer att bli mer betydande under dagtid idag,” säger CWA:s meteorolog Jason Cheng till AFP. Bavis maximala medelvindhastighet sjönk till 144 kilometer i timmen på lördagen, med byvindar på omkring 180 kilometer i timmen, enligt Taiwans meteorologiska myndighet. På väg mot Kina Samtidigt har ovädret orsakat omfattande störningar i Japans Okinawa, där över 18 000 hushåll och anläggningar förlorat ström. Flygbolag har ställt in dussintals flyg, vilket påverkat mer än 26 000 passagerare.  I Filippinerna har kraftiga regn kopplade till Bavi utlöst jordskred på ön Mindanao, där minst 15 personer uppges ha omkommit. Dessutom är ett stort antal hamnar fortsatt stängda och hundratals fartyg ligger i skydd på grund av “ogynnsamma väderförhållanden”. När tyfonen nu närmar sig Kina varnar statliga medier för exceptionellt kraftiga regn i östra Zhejiang och nordöstra Fujian. I Xiaguan i Zhejiang uppges hela befolkningen på över 10 000 personer ha evakuerats och i hela landet har över 900 000 personer lämnat sina hem, enligt AFP.", "link": "https://www.tv4.se/artikel/3h2AZKpNipUTWnEhc4nIkY/kraftfull-tyfon-i-taiwan-tusentals-tvingas-laemna-sina-hem", "date_display": "2026-07-11", "date_iso": "2026-07-11T06:20:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/utrikes", "/taiwan", "/klimat", "/vader"]}, {"id": 145, "title": "One arrested after suspected shooting", "summary": "Shortly after ten o'clock on Friday evening, the police received several calls about loud bangs in the district of Sätra in Gävle. The person who has been found injured has been taken to hospital by ambulance. - It is unclear in what way the person is injured. The only thing I know is that he w
