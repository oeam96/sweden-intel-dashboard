räver guld i USA", "link": "https://www.dagen.se/dokument/sa-har-gud-tagit-klivet-in-i-svenska-landslaget-infoer-fotbolls-vm/10331265", "date_display": "2026-06-12", "date_iso": "2026-06-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Trump: Has \"ended the war\"", "summary": "", "title_original": "Trump: Har ”avslutat kriget”", "summary_original": "", "link": "https://www.tv4.se/artikel/tt-260612-iranoro1-68443c4f/trump-har-avslutat-kriget", "date_display": "2026-06-12", "date_iso": "2026-06-12T00:38:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Irankriget", "/irankriget"]}, {"id": 161, "title": "Win for the home team - defeated South Africa in the opener", "summary": "In the World Cup premiere, host nation Mexico was pitted against South Africa. Venue was the Aztec Stadium in Mexico City.  It was immediately clear which of the teams was playing at home. When Mexico had the ball there were cheers in the stands. When South Africa held possession? Then there was a hurricane.  Mexico took the lead early The host nation created a sharp chance early in the match. Raul Jimenez pushed off at the edge of the penalty area, but keeper Ronwen Williams was quickly down and managed to parry. Mexico took the lead after nine minutes and it was Julián Quiñones who scored the first goal of the tournament. He did it after the saber in South Africa. - It's a loose build-up to the game, even if Mexico are good at stepping up in their pressing game. But it is far too generous of South Africa, said TV4's expert commentator Jens Fjellström. Mexico and Quiñones had bids for more in the first act. The goal scorer hit the post a couple of minutes before the break. The score was 1-0 at halftime. Double red carded Early in the second act, South Africa's Sphephelo Sithole was red carded after bringing down Brian Gutiérrez who was about to be cleared. - Clearly, said Fjellström and continued: - Not the smoothest defensive game. The offense happened just outside the penalty area. The free kick did not turn into any major danger. Raul Jimenez increased Mexico's lead to 2-0 after just over 65 minutes of play. The 35-year-old headed in a cross and was visibly moved by his goal. - He looked like he had tears in his eyes, said Fjellström. South Africa were then shown a second red card of the match after Themba Zwane had a hand in Roberto Alvarado's face.  Another sending off in stoppage time The match ended 2-0. In added time, Mexico's César Montes was also sent off after tripping. - So stupidly done, said Fjellström. In the next group stage match, Mexico faces South Korea while South Africa takes on the Czech Republic.", "title_original": "Vinst för hemmanationen – besegrade Sydafrika i premiären", "summary_original": "I VM-premiären ställdes värdnationen Mexiko mot Sydafrika. Spelplats var Aztekastadion i Mexico City.  Det var tydligt direkt vilket av lagen som spelade på hemmaplan. När Mexiko ägde boll var det jubel på läktarplats. När Sydafrika innehade possession? Då var det en visselorkan.  Mexiko tog ledningen tidigt Värdnationen skapade en vass chans tidigt i matchen. Raul Jimenez tryckte av i höjd med straffområdeskanten, men keepern Ronwen Williams var snabbt nere och lyckades parera. Mexiko tog ledningen efter nio minuter och det var Julián Quiñones som gjorde första målet i turneringen. Han gjorde det efter sjabbel i Sydafrika. – Det är slapp speluppbyggnad, även om Mexiko är duktiga på att kliva i sitt presspel. Men det är alldeles för generöst av Sydafrika, sa TV4:s expertkommentator Jens Fjellström. Mexiko och Quiñones hade bud på mer i den första akten. Målskytten prickade stolpen ett par minuter före paus. Ställningen var 1-0 i halvtid. Åkte på dubbla röda kort Tidigt i den andra akten åkte Sydafrikas Sphephelo Sithole på rött kort efter att ha fällt Brian Gutiérrez som var på väg att bli fri. – Solklart, sa Fjellström och fortsatte: – Inte det smidigaste försvarsspelet. Förseelsen skedde precis utanför straffområdet. Frisparken blev inte till någon större farlighet. Raul Jimenez ökade på Mexikos ledning till 2-0 efter dryga 65 minuters spel. 35-åringen nickade in ett inspel och var märkbart rörd över sitt mål. – Han såg ut att ha tårar i gången, sa Fjellström. Sydafrika åkte sen på ett andra rött kort i matchen efter att Themba Zwane haft en hand i ansiktet på Roberto Alvarado.  Ytterligare en utvisning på tillägstid Matchen slutade 2-0. På tilläggstid blev även Mexikos César Montes utvisad efter ha lagt ett fälleben. – Så korkat gjort, sa Fjellström. I nästa gruppspelsmatch ställs Mexiko mot Sydkorea medan Sydafrika tar sig Tjeckien.", "link": "https://www.tv4.se/artikel/7bXObAC5GtkCuiy3tKWGQc/droemstart-foer-hemmanationen-besegrade-sydafrika", "date_display": "2026-06-11", "date_iso": "2026-06-11T21:08:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport", "/fotbolls-vm-2026", "/fotboll", "/mexiko", "/sydafrika"]}, {"id": 162, "title": "Top German military: Russia may attack in 2029 - or earlier", "summary": "Since Russia's full-scale invasion of Ukraine in 2022, more and more European countries have begun to equip their defense forces. Nowhere has this trend been felt more clearly than in Germany, whose history has complicated everything spelled military rearmament. Now that's over. At the end of 2025, the Bundestag voted yes to reintroduce conscription, and this year alone the defense budget has grown by 33 percent compared to last year.  Drones shot down over Latvia Now the country's top army commander, Lieutenant General Christian Freuding, is warning that the country must be prepared for an attack from Russia by 2029 at the latest - or even earlier. - We must be prepared. We must be prepared to fight, says Christian Freuding to Politico.  There is a broad consensus among the countries of the NATO defense alliance: Russia may go on the attack before the 20th century is over. Countries in Russia's vicinity, such as the Baltic countries, are already exposed to Russia's attacks. As recently as Monday, a suspected Russian drone was shot down over Latvia. - 2029 is not a German timeline. It is intelligence information approved by NATO. All 32 NATO countries agree that Russia may have the ability to invade an ally by 2029,\" says Freuding. \"Must strengthen our capabilities every day\" Germany has taken many steps to speed up the procurement of weapons and increase production capacity in the defense industry. However, the majority of developments have taken place within the framework of long-term weapons programs, which normally take several years to develop, produce and put into service. The country must therefore look for solutions interim solutions. - Speed is crucial now. We have to strengthen our ability to be combat ready already tonight every day, says Freuding.", "title_original": "Tysk toppmilitär: Ryssland kan attackera 2029 – eller tidigare", "summary_original": "Sedan Rysslands fullskaliga invasion av Ukraina 2022 har alltfler europeiska länder börjat rusta sina försvarsmakter. Ingenstans har denna trend märkts tydligare än i Tyskland, vars historia har gjort allt som stavas militär upprustning komplicerat. Nu är det slut med det. I slutet av 2025 röstade förbundsdagen ja till att återinföra värnplikten, och bara i år har försvarsbudgeten växt med 33 procent jämfört med förra året.  Drönare sköts ner över Lettland Nu varnar landets högste arméchef, generallöjtnant Christian Freuding, för att landet måste vara förberett på en attack från Ryssland senast 2029 – eller redan tidigare. – Vi måste vara förberedda. Vi måste vara beredda på att kämpa, säger Christian Freuding till Politico.  Det råder bred konsensus bland länderna inom försvarsalliansen Nato: Ryssland kan gå till attack innan 20-talet är över. Redan nu utsätts länder i Ryssland närhet såsom de baltiska länderna för Rysslands attacker. Så sent som måndags sköts en misstänkt rysk drönare ner över Lettland. – 2029 är inte en tysk tidslinje. Det är underrättelseinformation som Nato godkänt. Alla 32 Natoländer är överens om att Ryssland kan ha förmågan att invadera en allierad år 2029”, säger Freuding. ”Måste stärka vår förmåga varje dag” Tyskland har vidtagit många åtgärder för att snabba på upphandlingen av vapen och öka produktionskapaciteten inom försvarsindustrin.  Majoriteten av utvecklingen har dock skett inom ramen för långsiktiga vapenprogram, vilka normalt tar flera år att utveckla, producera och ta i bruk. Landet måste därför leta efter lösningar interimslösningar. – Snabbhet är avgörande nu. Vi måste stärka vår förmåga att kunna vara stridsberedda redan i kväll varje dag, säger Freuding.", "link": "https://www.tv4.se/artikel/507uJT62ukskUFpwGfYhxC/tysk-toppmilitaer-ryssland-kan-attackera-2029-eller-tidigare", "date_display": "2026-06-11", "date_iso": "2026-06-11T20:56:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/tyskland", "/nato", "/ryssland", "/krig"]}, {"id": 163, "title": "Continued decline for the free churches according to the Free Church Survey", "summary": "At the same time, Öyvind Tholvsen warns against interpreting the results as a refutation of the thesis of an ongoing Jesus trend.", "title_original": "Fortsatt nedgång för frikyrkorna enligt Frikyrkoundersökningen", "summary_original": "Öyvind Tholvsen varnar samtidigt för att tolka resultat som ett motbevis för tesen om en pågående Jesustrend.", "link": "https://www.dagen.se/nyheter/fortsatt-nedgang-foer-frikyrkorna-enligt-frikyrkoundersoekningen/10388828", "date_display": "2026-06-11", "date_iso": "2026-06-11T13:48:04+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 164, "title": "S     const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
