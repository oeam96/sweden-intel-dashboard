body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }

button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;
    height: auto;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
.tag-type { background: #e9ecef; color: #495057; }
.tag-ministry { background: #e3f2fd; color: #0d47a1; }
.tag-old { background: #ffebee; color: #c62828; }

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {
    padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;

.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }
</style>

-handelsavtalet-med-israel/", "date_display": "2026-10-09", "date_iso": "2026-10-09T11:46:38+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 63, "title": "Franska borgmästaren skyddar demonstranter mot polisen", "summary": "Tidigare i veckan spreds ett dramatiskt klipp där borgmästaren för Saint-Denis, en förort norr om centrala Paris, sköldar elever som demonstrerar mot poliser som trycker på. Han står med utsräckta armar iklädd en grå, knäppt kostym mellan de unga demonstranterna och de kravallklädda poliserna för att hålla isär dem.  I klippets hör man hur borgmästaren, Bally Bagayoko, skriker ”arrêter, arrêter, arrêter”, franska för \"sluta\". En annan vuxen hörs skrika ”s'il vous plaît\", franska för ”snälla”, upprepade gånger när polisen tycks försöka ta sig igenom folksamlingen. Utsatt för tårgas I ett ytterligare klipp får borgmästaren ögondroppar av demonstranter efter att ha utsatts för tårgas som polisen använt. Han hålls i medan folk häller ögondroppar i hans ögon. I en intervju med CBS News berättar han vad som hände.  – Jag kom dit för att visa mitt stöd för eleverna som demonstrerade och blev eskorterad av 300 till 400 elever, så jag stod längst fram. Där blev vi träffade med tårgas, vilket kvävde oss, följt av att polisen stormade mot oss. När jag såg poliserna ställde jag mig emellan för att be polisen sluta. Eleverna var helt skräckslagna, säger han till CBS. Polisens övervåld Borgmästaren Bally Bagayoko menar att poliserna varit för aggressiva.  – Min ståndpunkt var tydlig: jag ville inte att någon skulle komma till skada, och framför allt vill jag inte att elevernas rimliga krav ska mötas med våld, säger han till CBS News. Han är även kritisk till hur den franska presidenten, Emmanuel Macron, hanterat studentprotesterna.\n\n– Han hanterar det här som en amatör. Den här situationen måste deskaleras, och presidenten måste säga ”stopp”, säger han. Sedan protesterna började för över tre veckor sedan har över sex tusen människor har blivit anhållna. Nästan 90 procent av de anhållna är minderåriga, enligt CBS News. Eleverna som demonstrerar begär mer resurser till gymnasieskolor och pekar på undermåliga lokaler, överfulla klassrum och lärare som inte ersätts vid frånvaro. Skolor runt om i landet har hållits stängda på grund av protesterna.", "title_original": "Franska borgmästaren skyddar demonstranter mot polisen", "summary_original": "Tidigare i veckan spreds ett dramatiskt klipp där borgmästaren för Saint-Denis, en förort norr om centrala Paris, sköldar elever som demonstrerar mot poliser som trycker på. Han står med utsräckta armar iklädd en grå, knäppt kostym mellan de unga demonstranterna och de kravallklädda poliserna för att hålla isär dem.  I klippets hör man hur borgmästaren, Bally Bagayoko, skriker ”arrêter, arrêter, arrêter”, franska för \"sluta\". En annan vuxen hörs skrika ”s'il vous plaît\", franska för ”snälla”, upprepade gånger när polisen tycks försöka ta sig igenom folksamlingen. Utsatt för tårgas I ett ytterligare klipp får borgmästaren ögondroppar av demonstranter efter att ha utsatts för tårgas som polisen använt. Han hålls i medan folk häller ögondroppar i hans ögon. I en intervju med CBS News berättar han vad som hände.  – Jag kom dit för att visa mitt stöd för eleverna som demonstrerade och blev eskorterad av 300 till 400 elever, så jag stod längst fram. Där blev vi träffade med tårgas, vilket kvävde oss, följt av att polisen stormade mot oss. När jag såg poliserna ställde jag mig emellan för att be polisen sluta. Eleverna var helt skräckslagna, säger han till CBS. Polisens övervåld Borgmästaren Bally Bagayoko menar att poliserna varit för aggressiva.  – Min ståndpunkt var tydlig: jag ville inte att någon skulle komma till skada, och framför allt vill jag inte att elevernas rimliga krav ska mötas med våld, säger han till CBS News. Han är även kritisk till hur den franska presidenten, Emmanuel Macron, hanterat studentprot ummary_original": "Efter Bokmässan känner sig Björn Werner gammal, urlakad och tunnhårig.", "link": "https://www.svd.se/a/gd6y5a/medelaldern-slog-till-hittade-botemedlet?utm_medium=rss", "date_display": "2026-10-09", "date_iso": "2026-10-09T11:34:52+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "Efter konkursen: Oklart hur shower i Helsingborg påverkas", "summary": "Två konserter med Julius Production väntar i Helsingborgs konserthus i höst och vinter. Efter nöjesbolagets konkursbesked är det fortfarande oklart vad som händer med föreställningarna.", "title_original": "Efter konkursen: Oklart hur shower i Helsingborg påverkas", "summary_original": "Två konserter med Julius Production väntar i Helsingborgs konserthus i höst och vinter. Efter nöjesbolagets konkursbesked är det fortfarande oklart vad som händer med föreställningarna.", "link": "https://www.hd.se/noje/efter-konkursen-oklart-hur-shower-i-helsingborg-paverkas/", "date_display": "2026-10-09", "date_iso": "2026-10-09T11:28:18+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "Jag påminns om det mörka Bob Dylan-jubileet och mitt blodtryck stiger", "summary": "För tio år sedan fick Dylan världens finaste litteraturpris. En trumpifiering av Nobelpriset, ryade kollegan Per Svensson.  Rakel Chukri inser att hon hade lyckats förtränga olycksåret. Men nu kommer minnena tillbaka.", "title_original": "Jag påminns om det mörka Bob Dylan-jubileet och mitt blodtryck stiger", "summary_original": "För tio år sedan fick Dylan världens finaste litteraturpris. En trumpifiering av Nobelpriset, ryade kollegan Per Svensson.  Rakel Chukri inser att hon hade lyckats förtränga olycksåret. Men nu kommer minnena tillbaka.", "link": "https://www.sydsvenskan.se/kultur/jag-paminns-om-det-morka-bob-dylan-jubileet-och-mitt-blodtryck-stiger/", "date_display": "2026-10-09", "date_iso": "2026-10-09T11:20:07+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "Autistiske Anton fick flytta efter år i mardrömsboende – tvingas tillbaka", "summary": "Anton Gustafsson är i färd med att klå sin pappa Hans i Yatzy. De sitter vid köksbordet i Hans hus i Sjuntorp utanför Trollhättan. Här i barndomshemmet är Anton bara på besök. Han bor ungefär 40 minuter bort på ett LSS-boende i Nossebro. Ett boende han nu kan tvingas lämna. – Det vill jag inte, så jag säger nej till det. Det känns inte så bra om jag skulle flytta tillbaka dit. Jag trivs jättebra där jag bor. Därför vill jag bo kvar där, säger Anton Gustafsson. Oro varje dag Anton har autism och en hjärnskada efter syrebrist i samband med födseln. Han lider dessutom av psykossjukdom. När han fyllde 18 flyttade Anton in på ett LSS-boende i hemkommunen Trollhättan. För familjen blev det boendet en mardröm. – Vi har ju gått och lagt oss varje dag och undrat om han ska leva imorgon, säger Antons mamma, Maria Thonander. Pappa Hans Gustafsson fyller i: – I princip har vi haft en kontakt eller ett problem nästan varje dag under de här sex åren. Varje dag och alltid en oro. Mardrömsboende Anton behöver mycket stöd i vardagen. Hans föräldrar ville att han skulle bo på ett stängt boende där han kunde ha konstant kontakt med personal. Men istället hamnade han i en egen lägenhet. Den fylldes snart av mögel, smuts och småkryp. Anton skulle få rena kläder framhängda varje dag. Men när hans föräldrar hälsade på kunde de hitta honom klädd i smutsig vinterjacka mitt i sommaren. När Antons föräldrar ifrågasatte om Anton fick den hjälp han hade rätt till svarade kommunen att Anton är myndig och har avböjt hjälpen. – De har bara frågat Anton, ”Nu är det dusch idag. Ja, det tar jag sen. Jaha, du vill inte duscha? Nej, det tar jag sen”. Man har ju frågat Anton de ledande frågorna utifrån vad de velat ha för svar, säger Maria Thonander. Under åren på boendet har Anton fått flera kroppsskador. Skavsår på fötterna som inte har upptäckts. Brännskador i huden. Antons psykiska mående har också stadigt försämrats och under åren har han försökt ta sitt liv flera gånger. Det sista försöket för två år sedan. – Då valde vi att köra upp Anton till akutpsykiatrisk avdelning. De la in Anton inom 45 minuter, säger Maria. ”Tagit ett beslut över våra huvuden” Efter att han blev inlagd gick Trollhättans stad med på en förflyttning då man inte kunde uppfylla Antons behov av vård. Han fick plats på ett privat boende utanför kommunen i Nossebro. Där har han nu bott i två år och trivs bra. Men för två veckor sedan fick pappa Hans, som är Antons gode man, ett telefonsamtal. – De har tagit ett beslut över våra huvuden. De har inte gjort någon återkoppling till vare sig boende, läkare, mig eller Anton. Jag fick bara ett telefonsamtal att Anton skall flyttas, säger Hans Gustafsson. Trollhättans stad vill säga upp platsen i Nossebro och flytta tillbaka Anton till ett nystartat boende i Trollhättan. Kommunen vill inte kommentera specifika fall utan svarar hur det generellt fungerar. – Man ska kunna bo i sin egen kommun. Man ska ha den rättigheten. Det handlar också om att ta hand om våra resurser, en extern plats kostar ju mer pengar. Vi ska kunna ge alla våra Trollhättebor samma möjligheter, säger Veronica Fransson, verksamhetschef funktionsstöd inom Trollhättans stad. Ska överklaga Antons föräldrar tänker överklaga beslutet och är beredda att ta kommunen till rätten för att försöka ge Anton rätt att stanna i Nossebro. – De har ju behandlat honom så illa, värre än ett husdjur. Det liknar ingenting det de har gjort mot honom. Det förlåter jag aldrig, säger Hans Gustafsson.", "title_original": "Autistiske Anton fick flytta efter år i mardrömsboende – tvingas tillbaka", "summary_original": "Anton Gustafsson är i färd med att klå sin pappa Hans i Yatzy. De sitter vid köksbordet i Hans hus i Sjuntorp utanför Trollhättan. Här i barndomshemmet är Anton bara på besök. Han bor ungefär 40 minuter bort på ett LSS-boende i Nossebro. Ett boende han nu kan tvingas lämna. – Det vill jag inte, så jag säger nej till det. Det känns inte så bra om jag skulle flytta tillbaka dit. Jag trivs jättebra där jag bor. Därför vill jag bo kvar där, säger Anton Gustafsson. Oro varje dag Anton har autism och en hjärnskada efter syrebrist i samband med födseln. Han lider dessutom av psykossjukdom. När han fyllde 18 flyttade Anton in på ett LSS-boende i hemkommunen Trollhättan. För familjen blev det boendet en mardröm. – Vi har ju gått och lagt oss varje dag och undrat om han ska leva imorgon, säger Antons mamma, Maria Thonander. Pappa Hans Gustafsson fyller i: – I princip har vi haft en kontakt eller ett problem nästan varje dag under de här sex åren. Varje dag och alltid en oro. Mardrömsboende Anton behöver mycket stöd i vardagen. Hans föräldrar ville att han skulle bo på ett stängt boende där han kunde ha konstant kontakt med personal. Men istället hamnade han i en egen lägenhet. Den fylldes snart av mögel, smuts och småkryp. Anton skulle få rena kläder framhängda varje dag. Men när hans föräldrar hälsade på kunde de hitta honom klädd i smutsig vinterjacka mitt i sommaren. När Antons föräldrar ifrågasatte om Anton fick den hjälp han hade rätt till svarade kommunen att Anton är myndig och har avböjt hjälpen. – De har bara frågat Anton, ”Nu är det dusch idag. Ja, det tar jag sen. Jaha, du vill inte duscha? Nej, det tar jag sen”. Man har ju frågat Anton de ledande frågorna utifrån vad de velat ha för svar, säger Maria Thonander. Under åren på boendet har Anton fått flera kroppsskador. Skavsår på fötterna som inte har upptäckts. Brännskador i huden. Antons psykiska mående har också stadigt försämrats och under åren har han försökt ta sitt liv flera gånger. Det sista försöket för två år sedan. – Då valde vi att köra upp Anton till akutpsykiatrisk avdelning. De la in Anton inom 45 minuter, säger Maria. deriksen. Han vill att statsministern ska komma till Mariannelund i Småland för att träffa honom och familjen. ”Så jag, som Christians pappa vill träffa dig, som Danmarks Statsminister, vill att du och jag möts, öga för öga, och där och då får du förklara för mig hur man bara ger 12 månader för ett mord.” ”Mina tårar är slut, familjen kämpar i ett mörker, barn och barnbarn vacklar fram i ett system som tydligen har urholkats”, skriver han. Christian Zedigs pappa uppmanar också människor att dela inlägget för att sprida hans budskap. Han avslutar med att skriva att han väntar på svar från statsministerns kansli. Döms till ett års fängelse Domen har väckt starka reaktioner eftersom Christian Zedig dog av skadorna, samtidigt som gärningsmannen inte dömdes för mord eller dråp. Åtalet gällde misshandel enligt dansk lag. Att mannen dömdes för misshandel i stället för mord eller dråp har att göra med hur gärningen bedömts juridiskt i Danmark. Att ett våldsdåd leder till döden innebär inte automatiskt att det bedöms som mord eller dråp. Även uppsåtet och omständigheterna kring våldet har betydelse. – I Sverige tittar vi ju på vilken skada ett offer får, men när man pratar om det här ”enkla våldet” i Danmark, så tittar man på själva handlandet och alltså inte särdeles mycket på effekten hos offret, vilket verkligen är annorlunda, sade Johanna Björkman i en intervju tidigare i Efter fem. Mannens försvarare har uppgett till SVT att han inte kommer att överklaga domen. Familjen har krävt närmare 1,9 miljoner danska kronor i skadestånd. Den frågan ska avgöras senare. Vi söker Christian Zedigs pappa.", "title_original": "Zedigs pappa kräver möte med danska statsministern", "summary_original": "Christian Zedig, 32, arbetade som polis i Eksjö och var tvåbarnspappa. Den 30 juni i år var han i Köpenhamn tillsammans med vänner för att se fotbolls-VM-matchen mellan Norge och Elfenbenskusten. I samband med ett bråk på platsen försökte Christian Zedig ingripa. Enligt åtalet kastade den n blad i Nyhetsmorgon. Hon visar hur hon tränar teknik genom att skjuta en pil på två meters avstånd – på tävling är avståndet 28 meter och tavlan är bara 36 centimeter i diameter. – Då är det inte mycket som krävs för att den ska hamna utanför, säger hon. Det är träff som gäller, men då kyudo är en gren inom budo – samlingsnamnet för japanska kampsporter och kampkonster – bedöms även estetik och teknik. – Vi graderar också. Vi tränar för att bli bättre tekniskt. Vi graderar och gör prov där vår stil och vårt utförande bedöms, säger Christine Alveblad. Lär henne balans i livet Hon kom i kontakt med sporten när hon följde med sin pappa på en tävling i västerländskt bågskytte. – Då var det en där som visade upp kyudo och jag fastnade för hur vackert det var. Balans och fokus är viktiga när man utövar kyudo. – Kyudo lär mig mycket. Det krävs mycket balans i kyudo. Nu är jag i en fas där jag jobbar med att få balans även i min vardag, i mitt privata liv. Balansen i livet har kyudo lärt mig. Pilbågen är cirka två meter lång, men Christine Alveblad har den kortaste varianten av bågar. På fötterna har hon speciella strumpor och hon stöder bågen mot fötterna när hon inte använder den. – Jag visar respekt för mitt vapen genom att inte ha det på golvet.", "title_original": "Hon är första kvinnan att bli svensk mästare i kyudo", "summary_original": "I lördags blev Christine Alveblad historisk som första kvinna att vinna SM-guld i den annorlunda sporten kyudo, japanskt bågskytte. Svenska mästerskap i kyudo har arrangerats varje år sedan 2007, och till skillnad från de flesta andra idrotter arrangeras mästerskapet i könsneutrala klasser. Det här är alltså första gången en kvinna blir svensk mästare i det individuella skyttet. Vad betyder den här vinsten för dig, i dag och framåt? – Den betyder jättemycket. Nu är det bara att sikta ännu högre. Eller mitt i prick, allra helst, säger hon. Även utförande bedöms Sporten är ovanlig, bara ett hundratal i Sverige utövar den. – Den är dest tag": "today", "tags": []}, {"id": 134, "title": "Ska direktsända avrättning – Trump säger ja", "summary": "Nidal Malik Hasan dömdes till döden efter att ha skjutit ihjäl 13 personer och skadat 32 vid militärbasen Fort Hood i Texas 2009. Nu planerar USA:s militär att direktsända hans avrättning. – Vi ska se till att människor kan titta på det, att det blir offentligt, eftersom människor behöver förstå att den här typen av handlingar får allvarliga konsekvenser, sade USA:s försvarsminister Pete Hegseth i en intervju med mediekanalen Human Events. Dömdes till döden 2013 Nidal Malik Hasan var psykiater inom den amerikanska armén när han den 5 november 2009 började skjuta mot militär personal på Fort Hood. Tretton personer dödades och 32 skadades. Under rättegången berättade Hasan att han motsatte sig USA:s militära insatser i muslimska länder och att han ville försvara talibanerna i Afghanistan.  Hasan dömdes till döden vid en militär rättegång 2013. Han har sedan dess suttit fängslad i Kansas och överklagat domen. Enligt amerikanska medier ska han avrättas genom arkebusering den 3 december på Fort Hood, där attacken ägde rum. Trump godkänner President Donald Trump har godkänt att Hasan avrättas genom arkebusering och enligt amerikanska medier har försvarsdepartementet också bekräftat planerna på att direktsända avrättningen. Om avrättningen genomförs blir det den amerikanska militärens första avrättning sedan 1961. Hasans advokat har kritiserat planerna på att genomföra avrättningen på Fort Hood och har uppgett att han överväger rättsliga åtgärder för att försöka stoppa eller skjuta upp den. ”Härmar han Isis?” Planerna på att direktsända avrättningen har mött kritik i USA. – Det är vedervärdigt. Härmar han Isis?, säger Chris Murphy, demokratisk senator för Connecticut, i en intervju med CNN. Även Alyssa Farah Griffin, tidigare kommunikationschef i Vita huset under Trump, har kritiserat planerna. Hon säger att hon sår bakom dödsstraff, särskilt för terrorister, men anser att direktsända avrättningar är skadliga för samhället.", "title_original": "Ska direktsända avrättning – Trump säger ja", "summary_original": "Nidal Malik Hasan dömdes till döden efter att ha skjutit ihjäl 13 personer och skadat 32 vid militärbasen Fort Hood i Texas 2009. Nu planerar USA:s militär att direktsända hans avrättning. – Vi ska se till att människor kan titta på det, att det blir offentligt, eftersom människor behöver förstå att den här typen av handlingar får allvarliga konsekvenser, sade USA:s försvarsminister Pete Hegseth i en intervju med mediekanalen Human Events. Dömdes till döden 2013 Nidal Malik Hasan var psykiater inom den amerikanska armén när han den 5 november 2009 började skjuta mot militär personal på Fort Hood. Tretton personer dödades och 32 skadades. Under rättegången berättade Hasan att han motsatte sig USA:s militära insatser i muslimska länder och att han ville försvara talibanerna i Afghanistan.  Hasan dömdes till döden vid en militär rättegång 2013. Han har sedan dess suttit fängslad i Kansas och överklagat domen. Enligt amerikanska medier ska han avrättas genom arkebusering den 3 december på Fort Hood, där attacken ägde rum. Trump godkänner President Donald Trump har godkänt att Hasan avrättas genom arkebusering och enligt amerikanska medier har försvarsdepartementet också bekräftat planerna på att direktsända avrättningen. Om avrättningen genomförs blir det den amerikanska militärens första avrättning sedan 1961. Hasans advokat har kritiserat planerna på att genomföra avrättningen på Fort Hood och har uppgett att han överväger rättsliga åtgärder för att försöka stoppa eller skjuta upp den. ”Härmar han Isis?” Planerna på att direktsända avrättningen har mött kritik i USA. – Det är vedervärdigt. Härmar han Isis?, säger Chris Murphy, demokratisk senator för Connecticut, i en intervju med CNN. Även Alyssa Farah Griffin, tidigare kommunikationschef i Vita huset under Trump, har kritiserat planerna. Hon säger att hon sår bakom dödsstraff, särskilt för terrorister, men anser att direktsända avrättningar är skadliga för samhället.", "link": "https://www.tv4.se/artikel/3bEuMNkh5hoQPlJBomhi6J/ska-direktsaenda-avraettning-trump-saeger-ja", "date_display": "2026-10-09", "date_iso": "2026-10-09T05:22:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/dodsstraff", "/pete-hegseth"]}, {"id": 135, "title": "Detta vet vi om det misstänkta pestfallet", "summary": "Vad har hänt? Den kvinnliga laboratorieteknikern arbetade vid ett pestforskningsinstitut och dog på ett sjukhus utanför Irkutsk den 2 oktober. Samma dag rapporterade lokala medier om dödsfallet. Lokaltidningen Bajkalfolket skrev att pest misstänktes ligga bakom och nämnde ett trasigt provrör som en tänkbar orsak till smittan, dock utan utförligare detaljer. Tidningen uppgav samtidigt att 200 personer som kvinnan varit i kontakt med satts i karantän. Enligt borgmästaren i Sjelechov, staden där kvinnan dog, försattes även ett lokalt sjukhus i karantän. Har tonat ner uppgifterna Hur har Ryssland reagerat? Ryska myndigheter har förnekat eller tonat ner uppgifterna om lungpest. De har uppgett att kvinnan dog i en ”lunginflammation av okänt ursprung”, men nekat till att hon smittats av något hon arbetade med. I ett uttalande till Världshälsoorganisationen (WHO) uppgav Rospotrebnadzor, Rysslands federala hälsomyndighet, att inga fall av pest registrerats i Irkutsk-regionen. Omvärldens reaktioner Hur har omvärlden reagerat? Rysslands informationshantering har väckt frågor hos Världshälsoorganisationen (WHO). Vi förstår inte hur hon blev smittad. Vi behöver information i ett snabbare tempo, och mer regelbundet, sade Maria Van Kerkhove, WHO:s chef för epidemi- och pandemihantering, på onsdagen. Vi har ställt frågor till våra kollegor i Ryssland. Det ska ärligt sägas att de har svarat, men vi har ställt fler uppföljande frågor. På torsdagen nekade Rospotrebnadzor till obekräftade uppgifter om att en andra person skulle ha blivit sjuk efter att ha varit i kontakt med den kvinnliga laboratorieteknikern. Myndigheten gav inga uppföljande svar om laboratorieteknikerns död, inte heller anledningen till att flera sjukhus i regionen enligt oberoende ryska medier har försatts i karantän. Även USA och EU har krävt att få mer utförlig information – hittills utan kända resultat. USA:s Donald Trump har uppgett att han har ett inplanerat telefonsamtal om det misstänkta pestfallet med Rysslands Vladimir Putin. Folkhälsomyndigheten: Inte skäl till särskilda åtgärder Hur har Sverige reagerat? Sveriges socialminister Jakob Forssmed (KD) uppger i en kommentar till TT på torsdagen att regeringen och Folkhälsomyndigheten följer utvecklingen noga. I nuläget bedömer Folkhälsomyndigheten inte att det finns skäl till några särskilda åtgärder. Enligt Forssmed arbetar Sverige via internationella organ för att Ryssland ska lämna ut mer information.", "title_original": "Detta vet vi om det misstänkta pestfallet", "summary_original": "Vad har hänt? Den kvinnliga laboratorieteknikern arbetade vid ett pestforskningsinstitut och dog på ett sjukhus utanför Irkutsk den 2 oktober. Samma dag rapporterade lokala medier om dödsfallet. Lokaltidningen Bajkalfolket skrev att pest misstänktes ligga bakom och nämnde ett trasigt provrör som en tänkbar orsak till smittan, dock utan utförligare detaljer. Tidningen uppgav samtidigt att 200 personer som kvinnan varit i kontakt med satts i karantän. Enligt borgmästaren i Sjelechov, staden där kvinnan dog, försattes även ett lokalt sjukhus i karantän. Har tonat ner uppgifterna Hur har Ryssland reagerat? Ryska myndigheter har förnekat eller tonat ner uppgifterna om lungpest. De har uppgett att kvinnan dog i en ”lunginflammation av okänt ursprung”, men nekat till att hon smittats av något hon arbetade med. I ett uttalande till Världshälsoorganisationen (WHO) uppgav Rospotrebnadzor, Rysslands federala hälsomyndighet, att in ral News", "type": "News", "age_tag": "today", "tags": []}, {"id": 149, "title": "Trump Jr:s exfru i muthärva – ville ha 100 000 dollar", "summary": "Kimberly Guilfoyle var en nyckelmedlem i Donald Trumps kampanjteam, och hon var fram till 2024 fästmö till presidentens son, Donald Trump Jr. Kort efter att den relationen upphörde föreslog president Trump att hon skulle bli Förenta Staternas ambassadör till Grekland. Enligt Wall Street Journal tog Guilfoyle då kontakt med den republikanske sponsorn Eric Deters, för att bli av med en kreditkortsskuld på 100 000 dollar. – Det var bara tjänster och gentjänster. Hon var så desperat att få mig att skicka de där hundratusen att hon sa: ”Om du gör det här för mig... så är jag din ride or die [ett uttryck för extrem lojalitet] i Trump-världen”, säger Eric Deters i en intervju med tv-programmet Good Morning America. ”Kommer inte att synas” Deters har låtit Wall Street Journal ta del av ett antal textmeddelanden från Guilfoyle, som styrker hans anklagelser. I ett av textmeddelandena ger hon instruktioner om hur betalningen skulle göras för att inte väcka uppmärksamhet. ”Det kommer inte att synas någonstans om du gör en överföring till American Express, det är allt som kommer att stå”, lyder ett av meddelandena. ”Sluta skriv” Orsaken till att Kimberly Guilfoyle var så angelägen om att bli av med sin kreditkortsskuld var att hon stod inför en kongressutfrågning, innan hon kunde godkännas som ambassadör till Grekland.  I ett av textmeddelandena bannade hon även Eric Deter för att han fäste för mycket i skrift, och talade med andra personer. ”Säg inte att vi har någon uppgörelse. Vilken mardröm du kommer bokstavligen att kosta mig min ambassadörstjänst sluta skriv [sic]” lyder ett annat meddelande. Ifrågasätter äktheten Kimberly Guilfoyles advokater har i amerikanska medier ifrågasatt om de redovisade textmeddelandena är äkta, men utan att vara mer specifika än så. Deter hävdar i sin tur att ambassadören flera gånger tidigare föreslagit liknande upplägg med pengar för tjänster, men att han då blivit besviken. – Hon levererade aldrig på något, säger Eric Deter till Wall Street Journal. ”Vårt jobb är inte att svara” USA:s utrikesminister Marco Rubio fick idag frågor om anklagelserna mot ambassadören, men avböjde att kommentera: – Vårt jobb är inte att svara varje gång någon ger media något utan förvarning, sa Rubio på en presskonferens under torsdagen.", "title_original": "Trump Jr:s exfru i muthärva – ville ha 100 000 dollar", "summary_original": "Kimberly Guilfoyle var en nyckelmedlem i Donald Trumps kampanjteam, och hon var fram till 2024 fästmö till presidentens son, Donald Trump Jr. Kort efter att den relationen upphörde föreslog president Trump att hon skulle bli Förenta Staternas ambassadör till Grekland. Enligt Wall Street Journal tog Guilfoyle då kontakt med den republikanske sponsorn Eric Deters, för att bli av med en kreditkortsskuld på 100 000 dollar. – Det var bara tjänster och gentjänster. Hon var så desperat att få mig att skicka de där hundratusen att hon sa: ”Om du gör det här för mig... så är jag din ride or die [ett uttryck för extrem lojalitet] i Trump-världen”, säger Eric Deters i en intervju med tv-programmet Good Morning America. ”Kommer inte att synas” Deters har låtit Wall Street Journal ta del av ett antal textmeddelanden från Guilfoyle, som styrker hans anklagelser. I ett av textmeddelandena ger hon instruktioner om hur betalningen skulle göras för att inte väcka uppmärksamhet. ”Det kommer inte att synas någonstans om du gör en överföring till American Express, det är allt som kommer att stå”, lyder ett av meddelandena. ”Sluta skriv” Orsaken till att Kimberly Guilfoyle var så angelägen om att bli av med sin kreditkortsskuld var att hon stod inför en kongressutfrågning, innan hon kunde godkännas som ambassadör till Grekland.  I ett av textmeddelandena bannade hon även Eric Deter för att han fäste för mycket i skrift, och talade med andra personer. ”Säg inte att vi har ligt domen. Munken ska då ha lockat barnen med glass, choklad, läsk, godis, leksaker och böcker – till en tempelbostad eller bönerum där han förgrep sig på dem. Offrens föräldrar ska ha befunnit sig i rummen intill och rätten menar att munken missbrukat sitt förtroende. Rättegången uppmärksammades stort i Australien där flera av kvinnorna vittnade om att de fortfarande, 25 till 30 år senare, lever med psykiska trauman. Enligt medier i Australien riskerar 71-åringen att bli utvisad efter att ha avtjänat sitt fängelsestraff. Han ska ha uppgett att han då är ”villig att återvända till Sverige”. Svensken har under rättegången nekat till brott och hävdat att han inte ens minns några av målsägandena.", "title_original": "Svensk munk dömd för 30 år gamla sexbrott mot barn", "summary_original": "Härvan av sexövergreppen uppdagades när flera kvinnor trädde fram för några år sedan och berättade vad de utsatts för som barn. Gärningsmannen som pekades ut är en i dag 71-årig buddhistmunk som under en tid bott i Sverige och har svenskt medborgarskap, enligt flera australienska medier. Polisen inledde då en utredning och efter en juryrättegång fälldes svensken för 17 av 19 åtalspunkter som rörde totalt sex flickor under 16 år, flera av dem mellan fyra och tolv år. Under torsdagen dömdes han till 13 års fängelse. Tidigast kan han friges villkorligt om drygt nio år. ”Villig att återvända till Sverige” Brotten ägde rum mellan 1994 och 2002 i samband med att flickorna besökte templen eller söndagsskolan tillsammans med sina föräldrar, enligt domen. Munken ska då ha lockat barnen med glass, choklad, läsk, godis, leksaker och böcker – till en tempelbostad eller bönerum där han förgrep sig på dem. Offrens föräldrar ska ha befunnit sig i rummen intill och rätten menar att munken missbrukat sitt förtroende. Rättegången uppmärksammades stort i Australien där flera av kvinnorna vittnade om att de fortfarande, 25 till 30 år senare, lever med psykiska trauman. Enligt medier i Australien riskerar 71-åringen att bli utvisad efter att ha avtjänat sitt fängelsestraff. Han ska ha uppgett att han då är ”villig att återvända till Sverige”. Svensken har under rättegången nekat till brott och hävdat att han inte ens minns några av målsägandena.", "link": "https://www.tv4.se/artikel/34laEXqSnnTed0v8atrDNv/svensk-munk-doemd-foer-30-ar-gamla-sexbrott-mot-barn", "date_display": "2026-10-08", "date_iso": "2026-10-08T19:42:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/utrikes", "/australien", "/brott", "/sexualbrott"]}, {"id": 151, "title": "Nio av tio granskade elsparkcyklar får inte köras: ”Finns ju ingen lag”", "summary": "Morgan Pettersson har åtalats för att ha köpt en elsparkcykel till sin son som gick att köra snabbare än de tillåtna 20 kilometer i timmen.  I en genomgång som Motorförarnas Helnykterhetsförbund, MHF, gjorde 2025 klarar bara 13 av 122 granskade fordon hos de fyra största återförsäljarna av elsparkcyklar kraven för att få framföras på allmän väg. Det innebär att nio av tio fordon inte uppfyllde kraven.  – Motoreffekten är generellt för hög. Problemet är att det inte är olagligt att sälja men du har som konsument inte rätt att framföra dessa på allmän väg, säger Tomas Jonsson, trafiksäkerhetsansvarig på MHF.  ”Finns ju ingen lag”  Användningen av elsparkcyklar ökar kraftigt i Sverige. Och med det har olyckorna också ökat i rekordfart. Under 2025 omkom sju personer och 6 624 personer skadades i elsparkcykelolyckor. Nästan hälften av de allvarligt skadade elsparkcyklisterna är under 25 år och omkring två tredjedelar är män. Lagstiftningen har inte uppdaterats i samma takt som svenskarna köpt de eldrivna sparkcyklarna.    – Det finns ju ingen lag. Det här är ju en produktkategori som har kommit upp och man har stått alldeles för handfallen, säger Tomas Jonsson. För att en elsparkcykel ska få räknas som en cykel och köras i allmän trafik får den ha en maximal hastighet på 20 kilometer i timmen och en kontinuerlig effekt på högst 250 watt. Fordon som inte uppfyller kraven får inte köras på allmän väg. Trots det är det inte olagligt att sälja fordonen. Får en vuxen person med körkort köra de här elsparkcyklarna? – Nej, absolut inte. Den är ju olaglig att framföra överhuvudtaget. Det behöver i så fall vara på inhägnat område, säger Tomas Jonsson. MHF vill se skärpta regler för elsparkcyklar och har bland annat föreslagit att polisen ska få större möjligheter att beslagta fordon. Organisationen vill också införa en promillegräns för elsparkcyklister. Transportstyrelsen ser över reglerna Transportstyrelsen har nu påbörjat en översyn av reglerna för elsparkcyklar för att se över om lagstiftningen behöver förändras. Arbetet ska vara klart i början av 2028. – Transportstyrelsen är bekymrade över att elsparkcyklar som inte är tillåtna i allmän trafik ändå används där. Det är ett trafiksäkerhetsproblem som vi tar på allvar, säger Niklas Strand, utredare på Transportstyrelsen och arbetar med elsparkcyklar.", "title_original": "Nio av tio granskade elsparkcyklar får inte köras: ”Finns ju ingen lag”", "summary_original": "Morgan Pettersson har åtalats för att ha köpt en elsparkcykel till sin son som gick att köra snabbare än de tillåtna 20 kilometer i timmen.  I en genomgång som Motorförarnas Helnykterhetsförbund, MHF, gjorde 2025 klarar bara 13 av 122 granskade fordon hos de fyra största återförsäljarna av elsparkcyklar kraven för att få framföras på allmän väg. Det innebär att nio av tio fordon inte uppfyllde kraven.  – Motoreffekten är generellt för hög. Problemet är att det inte är olagligt att sälja men du har som konsument inte rätt att framföra dessa på allmän väg, säger Tomas Jonsson, trafiksäkerhetsansvarig på MHF.  ”Finns ju ingen lag”  Användningen av elsparkcyklar ökar kraftigt i Sverige. Och med det har olyckorna också ökat i rekordfart. Under 2025 omkom sju personer och 6 624 personer skadades i elsparkcykelolyckor. Nästan hälften av de allvarligt skadade elsparkcyklisterna är under 25 år och omkring två tredjedelar är män. Lagstiftningen har inte uppdaterats i samma takt som svenskarna köpt de eldrivna sparkcyklarna.    – Det finns ju ingen lag. Det här är ju en produktkategori som har kommit upp och man har stått alldeles för handfallen, säger Tomas Jonsson. För att en elsparkcykel ska få räknas som en cykel och köras i allmän trafik får den ha en maximal hastighet på 20 kilometer i timmen och en kontinuerlig effekt på högst 250 watt. Fordon som inte uppfyller kraven får inte köras på allmän väg. Trots det är det inte olagligt att sälja fordonen. Får en vuxen person med körkort köra de här elsparkcyklarna? – Nej, absolut inte. Den är ju olaglig att framföra överhuvudtaget. Det behöver i så fall vara på inhägnat område, säger Tomas Jonsson. MHF vill se skärpta regler för elsparkcyklar och har bland annat föreslagit att polisen ska få större möjligheter att beslagta fordon. Organisationen vill också införa en promillegräns för elsparkcyklister. Transportstyrelsen ser över reglerna Transportstyrelsen har nu påbörjat en översyn av reglerna för elsparkcyklar för att se över om lagstiftningen behöver förändras. Arbetet ska vara klart i början av 2028. – Transportstyrelsen är bekymrade över att elsparkcyklar som inte är tillåtna i allmän trafik ändå används där. Det är ett trafiksäkerhetsproblem som vi tar på allvar, säger Niklas Strand, utredare på Transportstyrelsen och arbetar med elsparkcyklar.", "link": "https://www.tv4.se/artikel/5zQo75dZUxldUzmk3y5mPO/nio-av-tio-granskade-elsparkcyklar-far-inte-koeras-finns-ju-ingen-lag", "date_display": "2026-10-08", "date_iso": "2026-10-08T18:49:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/elsparkcyklar", "/trafik"]}, {"id": 152, "title": "Har Trump glömt Nobel?", "summary": "– Jaha, är det nu på fredag, svarade Trump.\n\nDet var som om frågan hade kommit från en alltför näsvis suppleant i bostadsrättsföreningens styrelse, vid ett olyckligt möte i soprummet han helst velat undvika. Som om det gällde den årliga höststädningen av innergården.\n\n– Det hade jag ingen aning om, fortsatte Trump.  – Men du har rätt, det är den tiden på året.  Bara det att frågan i Ovala rummet under onsdagen inte handlade om att ta in dynorna och torka av grillen. Den gällde det som för ett år sedan, var det enda Trump pratade om: Nobels fredspris.  – Ångrar du några av besluten du tagit bakom det där skrivbordet? frågade journalisten. ”Räddat miljontals liv” Först var det som att skivan hackade lite. Sedan kom den igång. Han har fått priset. Den förtjusande unga damen Maria Corina Machado tillägnade honom sitt. Han som mäklat fred i åtta krig och räddat miljontals liv. Ingen har någonsin varit så förtjänt av det som honom. – Obama hade inte gjort något när han fick det. Han vet inte ens vad han fick det för, sade Trump innan han tog ytterligare någon fråga om något helt annat och sedan begav sig till Texas och ännu ett kampanjmöte för en senatsplats Republikanerna aldrig hade kunnat föreställa sig skulle vara i riskzonen att torska i mellanårsvalet om mindre än en månad. Andra tongångar för ett år sedan För ett år sedan drev Trump en helt annan kampanj. Då stod han på toppen av sitt presidentskap. Han hade återvänt till Vita huset med en jordskredsseger i ryggen och var fast besluten att göra upp med en besatthet från dåtiden: Han skulle få Nobels fredspris. Kriget i Ukraina som han under valkampanjen hade lovat att lösa på 48 timmar fortsatte visserligen men i FN:s generalförsamling presenterade han sig alltjämt som den store fredsmäklaren och sade att alla tyckte att han borde få priset. Kort därefter lanserade han sitt eget fredsråd. I år nämnde han inte Nobel. Kanske hade det varit lite väl magstarkt till och med för Trump, att göra det i samma tal som han hotade med att utplåna Iran. För i dag är fredsmäklaren fast i ett krig han själv startade men inte vet hur han ska avsluta. En av anledningarna till att varken bettingbolagen eller han själv tror att han får priset i år. – De (Nobelkommittén, reds.anm) har ett rykte om sig att inte ge priset till sådana som jag, sade han under onsdagen. Kan ge politisk huvudvärk Men fredagens tillkännagivande skulle ändå kunna ge Trump politisk huvudvärk. Bland de nominerade finns till exempel Minneapolis och dess invånare, för motståndet och protesterna mot ICE och migrationspolisens räder där Renée Good och Alex Pretti sköts till döds. Hamnar priset i Minnesota skulle det i Vita huset betraktas som en direkt norsk krigsförklaring. Andra nominerade som skulle väcka Trumps vrede är Kanadas premiärminister Mark Carney, påve Leo och Francesca Albanese. Besattheten finns kvar Men vi gör fel om vi tror att besattheten försvunnit. När röken från mellanårsvalet lagt sig kommer Trump att vara en lame duck, den nuvarande totala kontrollen av kongressen – ett minne blott. Då blir utrikespolitiken en ventil där han fortfarande kan agera fritt. Open AI:s vd Sam Altman har sagt att Trump förtjänar Nobels fredspris tillsammans med Xi Jinping om USA och Kina kan landa i ett gemensamt avtal om säkerhet kring AI. Kriget i Ukraina fortsätter. Trumps löfte ligger kvar. Det är inte så att det saknas problem att lösa. Det jag försöker säga är att Trumps tröst är att innergården städas vid den här tiden nästa år också. Och att styrelsen kanske kan tänka sig att se genom fingrarna på tidigare förseelser.  Eller så putsar han bara mutan från Maria Corina Machado och det påhittade fredspriset från kompisen Gianni Infantino och tar något med fire power. Hade jag varit regimen i Havanna hade jag hoppats att Trump hellre vill ha ett eget diplom, än en ö.", "title_original": "Har Trump glömt Nobel?", "summary_original": "– Jaha, är det nu på fredag, svarade Trump.\n\nDet var som om frågan hade kommit från en alltför näsvis suppleant i bostadsrättsföreningens styrelse, vid -fredspris"]}, {"id": 153, "title": "Trubadur stoppades för ”befarad ordningsstörning” – innan spelning", "summary": "När William Sundman Sääf har tråkigt spelar han musik på tunnelbanans gröna och röda linjer i Stockholm. För vissa är det ett uppskattat inslag i vardagen, medan andra väljer att lämna vagnen. Enligt SL:s ordningsregler är det inte tillåtet att spela musik i kollektivtrafiken. Tunnelbanetrubaduren har vid flera tillfällen blivit avvisad. I ett, av Sundman Sääf, nyligen publicerat klipp på Instagram syns hur ordningsvakter återigen kräver att han kliver av tåget, den här gången innan han ens hunnit ta upp gitarren ur fodralet. Enligt vakterna fanns det en befarad risk att han kommer att störa ordningen. I klippet kallar Sundman Sääf vakterna för ”fascistjävlar”. Till slut kommer polisen och ber honom och hans entourage att lämna perrongen. SL uppger för TV4 Nyheterna att trafikledningen tömde ett tåg och lät andra tåg passera stationen utan att stanna under ungefär 20 minuter, samtidigt som ordningsvakterna ”hanterade situationen på platsen”. Trubaduren: ”Säger att jag gör deras dag” Sundman Sääf berättar för TV4 Nyheterna att han tidigare publicerade tid och plats för spelningen på Instagram. – Ingenting i universum händer ju på Alvik klockan 20.30 en onsdag. Så det är väldigt osannolikt att de skulle ha två vakter och typ fyra trygghetsvärdar där innan vi kom, av en slump. Men det var ingenting de sa, att vi är här för er skull, säger han. Enligt Sundman Sääf är det en tolkningsfråga om han planerade att störa ordningen eller inte. – Vi planerade att sjunga lite. Han menar att kultur i det offentliga rummet snarare skapar möten mellan människor. – Det är ju en trevlig sak. Varje gång jag spelar i tunnelbanan kommer det fram någon och säger tack så mycket, att jag gjorde deras dag. Jag tycker att det är fint. Det är mer värt att göra någons dag än att göra tio personer småirriterade i fem minuter, säger han. Att SL avvisar personer och stänger av stationer för ordningsstörningar som inte har ägt rum än får i dag kritik på DN:s kultursidor. Där skriver advokaten Peter Hellman att ”alla andra resenärer har fått sin resa påverkad på grund av vakternas uppfattning om en presumtiv konsert”, och kräver att SL ber Sääf om ursäkt. SL: ”Spelat vid upprepade tillfällen” SL:s pressavdelning vill inte svara på frågor om tunnelbanetrubaduren i telefon, men presschefen Andreas Strömberg svarar i en skriftlig kommentar till TV4 Nyheterna. Förklaringen till att SL inte tillåter musikframträdanden är att de kan uppfattas som störande, kan göra det svårare att uppfatta information i högtalarna och att gångar kan blockeras om människor samlas för att lyssna. Han uppger att ordningslagen stöder att man får avvisa någon även om ordningsstörningarna bara är befarade och alltså inte har skett än. ”Vi förstår att människor reagerar, både på hur ingripandet genomfördes och på att trafiken påverkades”, skriver Strömberg. ”Trubaduren har vid upprepade tillfällen spelat musik i SL-trafiken utan tillstånd och känner till att detta strider mot våra ordningsregler. Tidigare händelser kan vara en del av bedömningen, men det är alltid omständigheterna vid det aktuella tillfället som avgör om det finns skäl att ingripa”. Följer upp hanteringen av trubaduren På frågan om det är rimligt att hindra folks hemresor för att någon kanske ska ha konsert, svarar SL att de ”har ett ansvar för att kollektivtrafiken ska vara trygg och säker för alla resenärer”. Andreas Strömberg skriver att trafiken måste fungera smidigt och att man därför ibland ”vidtar tillfälliga trafikåtgärder”, som att låta tåg passera utan att stanna. De kan däremot inte bekräfta att anledningen till trafikledningens beslut att stänga av Alviks tunnelbana och placera ordningsvakter där var på grund av trubadurens konsert. ”Det är en etablerad åtgärd som trafikledningen kan besluta om för att upprätthålla säkerheten. Vi har samtidigt förståelse för att sådana beslut påverkar våra resenärer. Åtgärderna måste vara motiverade utifrån den aktuella situationen och stå i proportion till behovet. Därför följer vi också upp hur situationen i Alvik hanterades”, skriver han. Sörmlandstrafiken: ”Hjärtligt välkomna till oss” Några mil söderut resonerar man dock annorlunda. ”Ni är hjärtligt välkomna till oss, pop-upkonsert är det bästa vi vet och det skulle vara en ära att få en bussresa förgylld av er”, skriver Sörmlandstrafiken i en kommentar under Sundman Sääfs inlägg. Sofia Westerlund, kommunikationsansvarig, låg bakom kommentaren. – Vi har ju inte så mycket tunnelbanor här nere, men på våra bussar har vi haft anordnat en hel del konserter som våra resenärer uppskattat hur mycket som helst, säger hon till TV4 Nyheterna. Samtidigt vill hon inte säga något negativt om SL, utan menar att Sörmlandstrafiken ”har stor respekt för att det är svårt att dra gränser”. – Det är komplext: Var går gränsen för när man stör och när man tillför? Vi resonerar som så att om man inte vill delta i en konsert kan man sätta sig i ett säte en bit bort.", "title_original": "Trubadur stoppades för ”befarad ordningsstörning” – innan spelning", "summary_original": "När William Sundman Sääf har tråkigt spelar han musik på tunnelbanans gröna och röda linjer i Stockholm. För vissa är det ett uppskattat inslag i vardagen, medan andra väljer att lämna vagnen. Enligt SL:s ordningsregler är det inte tillåtet att spela musik i kollektivtrafiken. Tunnelbanetrubaduren har vid flera tillfällen blivit avvisad. I ett, av Sundman Sääf, nyligen publicerat klipp på Instagram syns hur ordningsvakter återigen kräver att han kliver av tåget, den här gången innan han ens hunnit ta upp gitarren ur fodralet. Enligt vakterna fanns det en befarad risk att han kommer att störa ordningen. I klippet kallar Sundman Sääf vakterna för ”fascistjävlar”. Till slut kommer polisen och ber honom och hans entourage att lämna perrongen. SL uppger för TV4 Nyheterna att trafikledningen tömde ett tåg och lät andra tåg pa iver Strömberg. ”Trubaduren har vid upprepade tillfällen spelat musik i SL-trafiken utan tillstånd och känner till att detta strider mot våra ordningsregler. Tidigare händelser kan vara en del av bedömningen, men det är alltid omständigheterna vid det aktuella tillfället som avgör om det finns skäl att ingripa”. Följer upp hanteringen av trubaduren På frågan om det är rimligt att hindra folks hemresor för att någon kanske ska ha konsert, svarar SL att de ”har ett ansvar för att kollektivtrafiken ska vara trygg och säker för alla resenärer”. Andreas Strömberg skriver att trafiken måste fungera smidigt och att man därför ibland ”vidtar tillfälliga trafikåtgärder”, som att låta tåg passera utan att stanna. De kan däremot inte bekräfta att anledningen till trafikledningens beslut att stänga av Alviks tunnelbana och placera ordningsvakter där var på grund av trubadurens konsert. ”Det är en etablerad åtgärd som trafikledningen kan besluta om för att upprätthålla säkerheten. Vi har samtidigt förståelse för att sådana beslut påverkar våra resenärer. Åtgärderna måste vara motiverade utifrån den aktuella situationen och stå i proportion till behovet. Därför följer vi också upp hur situationen i Alvik hanterades”, skriver han. Sörmlandstrafiken: ”Hjärtligt välkomna till oss” Några mil söderut resonerar man dock annorlunda. ”Ni är hjärtligt välkomna till oss, pop-upkonsert är det bästa vi vet och det skulle vara en ära att få en bussresa förgylld av er”, skriver Sörmlandstrafiken i en kommentar under Sundman Sääfs inlägg. Sofia Westerlund, kommunikationsansvarig, låg bakom kommentaren. – Vi har ju inte så mycket tunnelbanor här nere, men på våra bussar har vi haft anordnat en hel del konserter som våra resenärer uppskattat hur mycket som helst, säger hon till TV4 Nyheterna. Samtidigt vill hon inte säga något negativt om SL, utan menar att Sörmlandstrafiken ”har stor respekt för att det är svårt att dra gränser”. – Det är komplext: Var går gränsen för när man stör och när man tillför? Vi resonerar som så att om man inte vill delta i en konsert kan man sätta sig i ett säte en bit bort.", "link": "https://www.tv4.se/artikel/1LVHJB5ocCQGYpqpfgEx3j/trubadur-stoppades-av-sl-foer-befarad-ordningsstoerning-innan-spelning", "date_display": "2026-10-08", "date_iso": "2026-10-08T18:02:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/sl", "/tunnelbana", "/musik", "/stockholm"]}, {"id": 154, "title": "Urban har ätit på samma restaurang 10 000 gånger: ”Underbar personal”", "summary": "Urban Efraimsson har jobbat på Södra Älvsborgs sjukhus i Borås sedan 1981. De senaste 45 åren har han gått till sjukhusets lunchrestaurang varje arbetsdag, förutom vid fyra-fem undantag då han tagit med sig matlåda i stället.  – Det slog mig för ett tag sedan. Jag räknade bakåt och man jobbar ju 225 dagar per år. Så räknar jag 45 år, och då blir det 10 000 gånger i september, säger han. Meny och gemenskap lockar Restaurangen har fyra rätter varje dag och ett bra salladsbord, berättar Urban. Men det är inte bara maten som lockar.  – De har också en underbar personal så man dras dit. Vi har haft många goda samtal också så det har varit väldigt trevligt. Han uppskattar att han genom åren lagt mellan 600 000 och 700 000 kronor på sina luncher. – Men 1981 kostade lunchen tolv kronor.  Lite stammisrabatt har det också blivit med åren. – Ja, det har jag nog fått. När man har fyllt 65 får man lite också. Fortsätter gärna Trots att han nu närmar sig pensionen tänker han fortsätta gå till restaurangen. – Jag jobbar ett par år till och sedan hälsar jag på dem så det blir nog ett tag till.", "title_original": "Urban har ätit på samma restaurang 10 000 gånger: ”Underbar personal”", "summary_original": "Urban Efraimsson har jobbat på Södra Älvsborgs sjukhus i Borås sedan 1981. De senaste 45 åren har han gått till sjukhusets lunchrestaurang varje arbetsdag, förutom vid fyra-fem undantag då han tagit m   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
