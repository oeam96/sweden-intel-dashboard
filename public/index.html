 positivt att barn hör av sig till oss på Bris, fortsätter Maria Frisk. Psykisk ohälsa Nästan hälften av samtalen handlade om psykisk ohälsa och ångest är nu den vanligaste anledningen till att barn söker stöd.  – Det är nästan hälften av alla samtal som handlar om psykisk ohälsa. Ångest är det som sticker ut nu. Man ser att barn inte får stöd i tid, det pratar många barn om, säger Maria Frisk. Bris har tagit fram ett par citat från barn som hört av sig under sommaren, för att ge exempel på hur det kan låta. ”Jag har ingen vuxen att berätta för, mina föräldrar skulle blivit jättearga och finns ju ingen lärare heller eftersom det är sommarlov”, säger ett barn. ”Jag vill knappt ha sommarlov, är bara hemma o är ledsen. Känner mig tom och har ingen ork till något. Går på medicin för ångest osv och har tyvärr börjat vapea nu o har börjat må sämre. Jag har väldigt mycket tankar och känns som att min hjärna går på högvarv hela tiden”, säger ett annat. Behöver agera innan det eskalerar Till Bris kan man ringa oavsett vad det är man vill prata om. Det kan vara från det lilla till det stora, förklarar generalsekreteraren. – När de ringer till oss berättar en del barn att det är första gången de pratar med en vuxen om det de upplever som jobbigt. Det här visar just att det under sommarlovet, när lärarna och andra vuxna inte finns, blir svårt. Vi behöver ge rätt stöd i rätt tid till barn, innan det eskalerar, säger Maria Frisk.", "link": "https://www.tv4.se/artikel/21yqW7t3X0Fvarh2DxQfJo/markant-oekning-av-samtal-till-bris-under-sommaren", "date_display": "2026-08-20", "date_iso": "2026-08-20T07:04:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/nyhetsmorgon", "/bris", "/barn", "/barnomsorg"]}, {"id": 145, "title": "Dare to think about how you want your everyday life to look this autumn", "summary": "Maybe time for some granola? Here is a recipe.", "title_original": "Våga fundera över hur du vill att din vardag ska se ut denna höst", "summary_original": "Kanske dags för lite granola? Här är ett recept.", "link": "https://www.dagen.se/mat/vaga-fundera-oever-hur-du-vill-att-din-vardag-ska-se-ut-denna-hoest/10412414", "date_display": "2026-08-20", "date_iso": "2026-08-20T07:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "Large test of digestive biscuits - harmful substances in the popular variety", "summary": "Digestive biscuits are a popular item and all the major food chains have their own varieties. The consumer magazine Råd & rön has tested 14 varieties. In eight of the biscuits, the added fat mainly consists of sunflower oil. Gothenburg biscuits also contain a small amount of olive oil, around two percent. Six of the biscuit types are instead made with palm oil. Lowers the rating Digestive biscuits with palm oil have greater problems with harmful substances than biscuits with sunflower oil - hence the fact that the three worst biscuits in the test all contain precisely palm oil. In last place we actually find the British original, McVitie's Digestives The Original. In second last place is McVitie's Digestive whole grain and in third worst place is Eldorado's Digestive made from whole grain wheat. - The biscuits with palm oil don't taste as good. The original received comments such as \"sad and boring\", \"tastes more like a lady's biscuit than what you imagine a digestive biscuit to be\", says Anna Edberg, test manager Råd & rön. That's why it's bad The oils used in the biscuits are refined to remove, among other things, taste, smell and free fatty acids, which can otherwise cause the product to go rancid. During the purification process, the oils are heated to high temperatures, which can lead to the formation of unwanted substances, for example 3-MCPD and glycidol. A high intake of 3-MCPD can be harmful to the kidneys and can also affect male fertility. The substance is also considered to be carcinogenic, so is glycidol. - These are things you don't want in your biscuits, says Anna Edberg. A child weighing 15 kilograms can eat eight crackers a day of Eldorado's crackers, which measured the highest levels of 3-MCPD in the test. The same child can eat 88 biscuits per day of the best of the test. In the clip above, you can see which biscuits were the best in the test.", "title_original": "Stort test av digestivekex – skadliga ämnen i populära sorten", "summary_original": "Digestivekex är en populär vara och alla de stora matkedjorna har sina egna varianter. Konsumenttidningen Råd & rön har testat 14 sorter. I åtta av kexen består det tillsatta fettet främst av solrosolja. Göteborgskex innehåller dessutom en mindre mängd olivolja, cirka två procent. Sex av kexsorterna är i stället tillverkade med palmolja. Drar ner betyget Digestivekex med palmolja har större problem med skadliga ämnen än kex med solrosolja – därav att testets tre sämsta kex alla innehåller just palmolja. På sista plats hittar vi faktiskt det brittiska originalet, McVitie's Digestives The Original. På näst sista plats hamnar McVitie's Digestives fullkorn och på tredje sämsta plats återfinns Eldorados Digestive av fullkornsvete. – Kexen med palmolja smakar inte lika gott. Originalet fick kommentarer som ”trist och tråkig”, ”smakar mer mariekex än vad man tänker sig ett digestivekex”, säger Anna Edberg, testansvarig Råd & rön. Därför är det dåligt Oljorna som används i kexen raffineras för att avlägsna bland annat smak, lukt och fria fettsyror, som annars kan göra att produkten härsknar. Vid reningsprocessen värms oljorna upp till höga temperaturer, vilket kan leda till att oönskade ämnen bildas, exempelvis 3-MCPD och glycidol. Ett högt intag av 3-MCPD kan vara skadligt för njurarna och kan även påverka fertiliteten hos män. Ämnet bedöms även vara cancerframkallande, så även glycidol. – Det är saker man inte vill ha i sina kex, säger Anna Edberg. Ett barn som väger 15 kilo kan äta åtta kex per dag av Eldorados kex, som uppmätte de högsta halterna av 3-MCPD i testet. Samma barn kan äta 88 kex per dag av testets bästa. I klippet ovan ser du vilka kex som var bäst i test.", "link": "https://www.tv4.se/artikel/561Gm2Ka0Ys5oyn3Nu4EEp/stort-test-av-digestivekex-originalet-saemst", "date_display": "2026-08-20", "date_iso": "2026-08-20T05:13:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/mat", "/tester", "/rad-ron", "/konsumentinformation", "/konsument"]}, {"id": 147, "title": "Trump's threat: \"Economic D-Day\"", "summary": "Iran is trying to maintain control of traffic in the Strait of Hormuz and continues to attack ships transporting oil and other goods to and from neighboring countries.  At the same time, the Iranian regime is trying to persuade US allies in the region that the partnership costs more than it tastes. Iran's chief negotiator Mohammad Bagher Ghalibaf is currently touring the region with the message that it is time for a new era in the Middle East. Economic threats In the US, the president is frustrated that Iran has not approved any agreement on peace. Last night he made new threats.  \"This will be economic warfare and isolation on an unprecedented scale. Their navy is gone, their air force is destroyed, their military factories are in ruins, their currency is worthless and their country is hanging by a thread,\" writes Donald Trump on Truth Social. Trump is also directly targeting those who do business with the regime. \"Today I am also announcing that ALL countries that allow their financial institutions, companies, airports, or government entities to provide any kind of lifeline to Iran will themselves face HUGE financial consequences.\" The president cites, among other things, oil smuggling, barter trade lines, exchange offices and boulevards as examples.  \"Everything must be stopped NOW. You know who you are. This will be an ECONOMIC D-DAY,\" he writes. Suspending all trade The United Arab Emirates announced yesterday that it was suspending all trade with Iran, after it said it had come under fire from Iranian robots for the first time in months. The country has been an important trading partner for isolated Iran.  Whether the US influenced the decision is unclear.\n\nThe other day, neighboring Oman was the first to receive threats from the ally in Washington. Donald Trump promised to \"bomb the crap out of Oman\" if the country settles with Iran to control traffic in the Strait of Hormuz.", "title_original": "Trumps hot: ”Ekonomisk Dagen D”", "summary_original": "Iran försöker behålla kontrollen över trafiken i Hormuzsundet och fortsätter angreppen mot fartyg som transporterar olja och andra varor till och från grannländerna.  Samtidigt försöker den iranska regimen övertala USA:s allierade i regionen att partnerskapet kostar mer än det smakar. Irans chefsförhandlare Mohammad Bagher Ghalibaf är just nu på rundresa i regionen med budskapet att det är dags för en ny era i Mellanöstern. Ekonomiska hot I USA är presidenten frustrerad över att Iran inte godkänt någon överenskommelse om fred. I natt kom han med nya hot.  ”Detta kommer att bli ekonomisk krigföring och isolering i en aldrig tidigare skådad skala. Deras flotta är borta, deras flygvapen är förstört, deras militära fabriker ligger i spillror, deras valuta är värdelös och deras land hänger i en skör tråd”, skriver Donald Trump på Truth Social. Trump riktar sig också direkt till de som handlar med regimen. ”I dag tillkännager jag också att ALLA länder som tillåter sina finansinstitut, företag, flygplatser eller statliga enheter att tillhandahålla någon form av livlina till Iran själva kommer att möta ENORMA ekonomiska konsekvenser”. Presidenten lyfter bland annat oljesmuggling, byteshandelslinjer, växlingskontor och bulvaner som exempel.  ”Allt måste stoppas NU. Ni vet vilka ni är. Detta kommer att bli en EKONOMISK DAGEN D”, skriver han. Avbryter all handel Förenade Arabemiraten meddelade i går att man avbryter all handel med Iran, efter att man säger sig ha beskjutits av iranska robotar för första gången på flera månader. Landet har varit en viktig handelspartner för det isolerade Iran.  Om USA påverkat beslutet är oklart.\n\nGrannlandet Oman var häromdagen först ut att få hot från den allierade i Washington. Donald Trump lovade att ”bomba skiten ur Oman”, om landet gör upp med Iran om att kontrollera trafiken i Hormuzsundet.", "link": "https://www.tv4.se/artikel/5syHz4tnqWjvOGOz1BaC2u/trumps-nya-hot-en-ekonomisk-dagen-d", "date_display": "2026-08-20", "date_iso": "2026-08-20T05:11:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/irankriget", "/donald-trump", "/usa"]}, {"id": 148, "title": "Rushing to vaccination reception after the measles outbreak", "summary": "On Wednesday, Vaccindirekt saw a 450 percent increase in the number of doses compared to the corresponding Wednesday last year. - These are mainly people who were born in the 70s or earlier where two doses of measles were not offered in the childhood vaccination programme. So then there are requests for supplementing the vaccination coverage, says Charlotta Zacharias, doctor at Vaccindirekt, specialized in travel medicine and vaccinology. - But the other thing that is new, which I have not experienced before, is that young people without any protection come for measles vaccination. People who were born after 1980, and who were actually offered two doses of measles vaccine in the program, but who for various reasons have not completed these vaccinations and who now wish to supplement their protection as adults. Do you see a connection with the outbreak? - We see a strong connection with the outbreak. The outbreak has occurred and then these people review their measles protection and either want to get a supplementary dose or get protection against measles, says Charlotta Zacharias. \"The best type of vaccine\" Vaccination coverage for the childhood vaccine program in Sweden is 95 percent. The program includes two doses of a combination vaccine against rubella, measles and mumps. If you were born after 1982, you must have received two doses of measles vaccine through the program and thus have lifelong protection. For the years 1960 to 1982, however, it is not certain that you received two doses, for these it may therefore be relevant to supplement the protection. Those born before 1960 are most likely to have had the measles and are then protected for that reason.  If you are unsure whether you have received two doses before, there is no obstacle to getting vaccinated once more. - There is no argument against it. After all, this is a very safe vaccine. It is what is called a live attenuated vaccine. And it's the best kind of vaccine that we have because it excites the immune system very, very well and then you get this life loan", "title_original": "Rusning till vaccinationsmottagning efter mässlingsutbrottet", "summary_original": "Vaccindirekt såg under onsdagen en 450-procentig ökning av antalet doser jämfört med motsvarande onsdag förra året. – Det är framförallt personer som är födda på 70-talet eller tidigare där det inte erbjudits två mässlingsdoser i barnvaccinationsprogrammet. Så då finns det önskemål om komplettering av vaccinationsskyddet, säger Charlotta Zacharias, läkare på Vaccindirekt, specialiserad på resemedicin och vaccinologi. – Men det andra som är nytt, som jag inte har varit med om tidigare, det är att unga människor utan något skydd kommer för mässlingsvaccination. Personer som är födda efter 1980, och som egentligen erbjudits två doser mässlingsvaccin i programmet, men som av olika skäl inte har genomfört dessa vaccinationer och som nu önskar som vuxna att komplettera sitt skydd. Ser ni ett samband med utbrottet? – Vi ser ett starkt samband med utbrottet. Utbrottet har skett och då ser de här personerna över sitt mässlingsskydd och vill antingen få en kompletterande dos eller få ett skydd mot mässling, säger Charlotta Zacharias. ”Den bästa typen av vaccin” Vaccinationstäckningen för barnvaccinprogrammet i Sverige är 95 procent. I programmet ingår två doser av ett kombinationsvaccin mot röda hund, mässlingen och påssjuka. Är man född efter 1982 ska man genom programmet ha fått två doser vaccin mot mässling och har således ett livslångt skydd. För årgångarna 1960 till 1982 är det däremot inte säkert att man fått två doser, för dessa kan det därför vara aktuellt att komplettera skyddet. Födda innan 1960 har med allra största sannolikhet haft mässlingen och är då skyddade av den anledningen.  Är man osäker på om man har fått två doser sedan tidigare finns det inget hinder att vaccinera sig ytterligare en gång. – Det finns inget argument emot det  Det här är ju ett väldigt säkert vaccin. Det är vad man kallar ett levande försvagat vaccin. Och det är den bästa typen av vaccin som vi har, därför att den retar upp immunsystemet väldigt, väldigt bra och då får man den här livslånga immuniteten och det vet man efter två doser. Så varför inte? säger Matti Sällberg, vaccinforskare vid Karolinska Institutet. ”Inte urakut” Socialminister Jakob Forssmed (KD) säger i ett uttalande att han ”ser allvarligt” på mässlingsutbrottet.  ”Folkhälsomyndigheten samordnar arbetet på nationell nivå och har nära dialog med de regionala smittskyddsenheterna, som arbetar med att begränsa smittspridningen”, säger Forssmed. Socialdepartementet har i daglig kontakt med Folkhälsomyndigheten om situationen och myndighetens bedömning är att det handlar om ett begränsat utbrott i en grupp av ovaccinerade personer. Risken bedöms som låg att sjukdomen skulle spridas i någon större omfattning i Sverige. Johanna Rubin är tillförordnad enhetschef vid enheten för vaccinationer på FHM. Hon anser att det inte finns någon anledning att rusa till mottagningarna. – Som en allmän medborgare behöver man inte vara orolig, men man kan ta chansen att reflektera över sitt vaccinationsskydd  och tänka: ”Ja, det där kan jag behöva fylla på i sinom tid eller när det passar”, säger hon och tillägger: – Men det är inte urakut nu för någon som inte är direkt berörd av utbrottet.", "link": "https://www.tv4.se/artikel/4NJIFDoefAYEFSKzduieFR/rusning-till-vaccinationsmottagning-efter-maesslingsutbrottet", "date_display": "2026-08-20", "date_iso": "2026-08-20T04:12:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/massling", "/virus", "/vaccin", "/folkhalsomyndigheten"]}, {"id": 149, "title": "Before compulsory voting and compulsory democracy education", "summary": "These two efforts can contribute to higher voter turnout, more voices and ideas being heard, writes Sudhagar Raghupathy.", "title_original": "Inför röstplikt och obligatorisk demokratiutbildning", "summary_original": "Dessa två insatser kan bidra till högre valdeltagande, fler röster och idéer som blir hörda, skriver Sudhagar Raghupathy.", "link": "https://www.dagen.se/debatt/infoer-roestplikt-och-obligatorisk-demokratiutbildning/10483321", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Being politically unattached is not lacking a compass", "summary": "Esther Flores Sedman: We want to let the Christian faith shape our view of both man and society.", "title_original": "Att vara politisk obunden är inte att sakna kompass", "summary_original": "Esther Flores Sedman: Vi vill låta den kristna tron forma vår blick på både människan och samhället.", "link": "https://www.dagen.se/ledare/att-vara-politisk-obunden-aer-inte-att-sakna-kompass/10485760", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "The choice is not between good and evil", "summary": "A meaningful political debate requires that we believe each other to want society well, writes Elisabet Lann (KD).", "title_original": "Valet står inte mellan det goda och det onda", "summary_original": "En meningsfull politisk debatt förutsätter att vi tror varandra om att vilja samhället väl, skriver Elisabet Lann (KD).", "link": "https://www.dagen.se/debatt/valet-star-inte-mellan-det-goda-och-det-onda/10483178", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Carola goes on a mission and takes revenge on the men who tried to control her", "summary": "Today's Daniel Wistrand has seen the documentary \"Carola!\" which premieres in theaters on August 21.", "title_original": "Carola missionerar och tar revansch på männen som försökt kontrollera henne", "summary_original": "Dagens Daniel Wistrand har sett dokumentären ”Carola!” som har biopremiär den 21 augusti.", "link": "https://www.dagen.se/kultur/carola-missionerar-och-tar-revansch-pa-maennen-som-foersoekt-kontrollera-henne/10483761", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "Dick Harrison:\nWould Jesus have voted for Magdalena Andersson?", "summary": "Imposing a political identity on Jesus is neither new nor original", "title_original": "Dick Harrison:\nSkulle Jesus ha röstat på Magdalena Andersson?", "summary_original": "Att pådyvla Jesus en politisk identitet är varken nytt eller originellt", "link": "https://www.dagen.se/ledare/dick-harrison-skulle-jesus-ha-roestat-pa-magdalena-andersson/10482330", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Nooshi Dadgostar (V) never came to the Equmenia church hearing", "summary": "The first time since 1968 that a party leader misses the community's event - a press conference in the Riksdag preceded the hearing in Vårgårda.", "title_original": "Nooshi Dadgostar (V) kom aldrig till Equmeniakyrkans utfrågning", "summary_original": "Första gången sedan 1968 som en partiledare missar samfundets evenemang – pressträff i riksdagen gick före utfrågningen i Vårgårda.", "link": "https://www.dagen.se/nyheter/nooshi-dadgostar-v-kom-aldrig-till-equmeniakyrkans-utfragning/10485888", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Summer special: Nicolina and Jonatan Brandström", "summary": "'Idol-Nico\" and father Jonatan in a conversation about life after Idol, daring to invest in music and about what it's like to share both stage and faith with his father.", "title_original": "Sommarspecial: Nicolina och Jonatan Brandström", "summary_original": "'Idol-Nico” och pappa Jonatan i ett samtal om livet efter Idol, att våga satsa på musiken och om hur det är att dela både scen och tro med sin pappa.", "link": "https://www.dagen.se/podd/sommarspecial-nicolina-och-jonatan-brandstroem/10487394", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "The chairman of the board on the crisis in Heart: \"We have learned a lot\"", "summary": "Board chairman Edward Sköllerfalk on the economic crisis in connection with the \"It's enough gala\" against gang violence.", "title_original": "Styrelseordföranden om krisen i Heart: ”Vi har lärt oss väldigt mycket”", "summary_original": "Styrelseordförande Edward Sköllerfalk om den ekonomiska krisen i samband med ”Det räcker-galan” mot gängvåldet.", "link": "https://www.dagen.se/nyheter/styrelseordfoeranden-om-krisen-i-heart-vi-har-laert-oss-vaeldigt-mycket/10484654", "date_display": "2026-08-20", "date_iso": "2026-08-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "A month has passed since the fire in Drammen: \"Have lost everything\"", "summary": "On the slope down towards the Drammenelva where the Stenseth residential area is located, the skeletons of cars and burnt-out houses can still be seen. Thomas Evjen, involved in the Red Cross in Drammen, talks about an entire community that has disappeared. - This was no small house fire. It is an entire neighborhood, an entire small community that is now gone. The feelings you get from all those evacuated there are something else when it comes to so many people, and so many houses, he says. Anne Marie Aasen and Petter Berggren look through the fence at the ruins that were their home a month ago. Heirlooms, photos, memories from a lifetime. Everything is now just ashes on a slope. - I guess it's part of the grieving process. It's very emotional. Now it's just rubbish here, but what was here before... I think it's about getting it out of the body, processing it, says Petter Berggren. \"Has lost everything\" Anne Marie was abroad when the fire broke out and quickly spread from house to house. - I have lost everything. All the memories. All. I had a gold bangle after my mother. She died when I was 19. I got it from her the last summer she was alive. I used it every day and when we were going to Turkey I left it at home because I thought it was safest, says Anne Marie. In peacetime, Norway has not seen a fire this big in over a hundred years. - What you think can happen, but you hope it doesn't. It happened in Drammen. It is painful, says Kjell Arne Hermansen, chairman of the municipal board in Drammen (Høyre). Unclear cause of fire What caused the fire is not yet clear, but the design of the residential area with narrow streets and green areas meant that it could spread quickly. Just as in the fire in Arboga where houses were completely destroyed, the area in Drammen consisted of older terraced houses with worse fire protection than modern buildings. - We have plenty of this type of terraced house that was built in the 1970s and 80s throughout Norway. So it is not distinctive for Drammen. We have several areas", "title_original": "En månad har gått sedan branden i Drammen: ”Har förlorat allt”", "summary_original": "I sluttningen ner mot Drammenelva där bostadområdet Stenseth är beläget syns fortfarande skeletten av bilar och nedbrända huskroppar. Thomas Evjen, engagerad i Röda Korset i Drammen, talar om ett helt samhälle som försvunnit. – Det här var ingen liten husbrand. Det är ett helt grannskap, ett helt litet samhälle som nu är borta. De känslorna du får från alla de som evakuerats det är något annat när det handlar om så många människor, och så många hus, säger han. Anne Marie Aasen och Petter Berggren blickar genom stängslet mot de ruiner som för en månad sen var deras hem. Arvegods, foton, minnen från ett helt liv. Allt är nu bara aska på en slänt. – Det är väl en del av sorgeprocessen antar jag. Det är väldigt känslosamt. Nu är det ju bara skräp som ligger här, men det som fanns här innan... Jag tror att det handlar om att få det ut ur kroppen, att bearbeta det, säger Petter Berggren. ”Har förlorat allt” Anne Marie befann sig utomlands när branden bröt ut och snabbt spred sig från hus till hus. – Jag har förlorat allt. Alla minnen. Allt. Jag hade en armring i guld efter min mamma. Hon dog när jag var 19 år. Den fick jag av henne den sista sommaren hon levde. Den använde jag varje dag och när vi skulle till Turkiet lämnade jag den hemma för jag tänkte att det var tryggast, säger Anne Marie. I fredstid har Norge inte sett en så här stor brand på över hundra år. – Det man tänker kan hända men hoppas inte gör det. Det hände i Drammen. Det är smärtsamt, säger Kjell Arne Hermansen, kommunstyrelsens ordförande i Drammen (Høyre). Oklar brandorsak Vad som orsakat branden är ännu inte klarlagt men bostadsområdets utformning med smala gator och grönområden gjorde att den kunde sprida sig snabbt. Precis som i branden i Arboga där hus totalförstördes bestod området i Drammen av äldre radhus med sämre brandskydd än moderna byggnader. – Vi har gott av den här typen av radhus som byggdes på 1970- och 80-talet i hela Norge. Så det är inte utmärkande för Drammen. Vi har flera områden här där vi nu tittar på beredskap och säkerheten. När något sånt händer måste vi titta på om det finns något vi kan göra för att göra det säkrare för människor som bor i sådana hus, säger Kjell Arne Hermansen. Petter Berggren uppger att han flera gånger, redan innan branden, slogs av tanken att en brand skulle kunna uppstå i området. – Sättet det är byggt på... Det var ju nästan oundvikligt, säger han. – Ingen hade kunnat tro att det skulle bli så stort. Det hade ingen kunnat föreställa sig ens i sin vildaste fantasi, fyller Anne Marie i. – Det var ett väldigt fint område, säger Petter Berggren.", "link": "https://www.tv4.se/artikel/21R7bkIXSLYsbYk1b5MOMj/en-manad-har-gatt-sedan-branden-i-drammen-har-foerlorat-allt", "date_display": "2026-08-19", "date_iso": "2026-08-19T20:37:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/drammen", "/brand", "/norge", "/raddningstjansten"]}, {"id": 158, "title": "The signal is crystal clear: The attack is a message to Turkey", "summary": "Israel has several fronts going on at the same time: Gaza, Iran, Lebanon and the West Bank. The one mentioned the least is Syria. But suddenly we have a situation that puts the spotlight on that front. Israel and Syria's relations have always been special. Before the fall of dictator Bashar al Assad on December 8, 2024, Syria was used as a route for weapons shipments between Iran and Hezbollah in Lebanon. Israel didn't like it, but at the same time the two governments stayed on opposite sides. After Assad's fall, the transport route disappeared, as Syria's new leadership does not take kindly to Iran-backed Hezbollah in Lebanon. But Israel has no confidence in the new Syrian leadership, who are partly open defenders of Palestine and partly have roots in terrorist organisations. A ticking bomb In the first nights after Assad's fall, countless Israeli bombs fell on various bases inside Syria and it has continued on and off. Later, with the help of the United States, the situation has calmed down but is seen as a ticking time bomb because Israel has deployed troops in more places than the Golan Heights, which Israel has occupied since 1967. Earlier this year, however, it was decided that the two countries would try to introduce a mechanism to avoid conflicts. Now Israel believes that Syria has broken their agreement by planning the presence of Turkish military at the Abu Duhur air base near Idlib. The signal is crystal clear At the time of the attack, there should not have been any Turks on the base and no one was injured, however there was material damage. And the signal is crystal clear: the attack is a message to Turkey.  Turkey condemns the attack and believes that Israel is only taking the opportunity to bomb its neighboring countries.  Israel's official argument is lame because there is already a Turkish military presence in Syria. Among other things, it is Turks who are training the new Syrian army. The reason is probably more complex. Partly it is probably about the autumn elections in Israel, partly about Turkey starting a military alliance with Saudi Arabia and Pakistan. It is an alliance trio that", "title_original": "Signalen är glasklar: Attacken är ett budskap till Turkiet", "summary_original": "Israel har flera fronter på gång samtidigt: Gaza, Iran, Libanon och Västbanken. Den som nämns minst är Syrien. Men plötsligt har vi en situation som sätter strålkastarljus på den fronten. Israel och Syriens relationer har alltid varit speciella. Före diktatorn Bashar al Assads fall den 8 december 2024 användes Syrien som rutt för vapentransporter mellan Iran och Hezbollah i Libanon. Det gillade inte Israel men samtidigt höll de båda regeringarna sig på var sin kant. Efter Assads fall försvann transportrutten, eftersom Syriens nya ledning inte ser med blida ögon på Iran-stöttade Hezbollah i Libanon. Men Israel känner inget förtroende för den nya syriska ledningen, som dels är öppna försvarare av Palestina, dels har rötter i terrororganisationer. En tickande bomb De första nätterna efter Assads fall föll det otaliga israeliska bomber över olika baser inne i Syrien och det har fortsatt till och från. Senare, med USA:s hjälp, har situationen lugnat ner sig men ses som en tickande bomb eftersom Israel placerat trupper på fler ställen än Golanhöjderna som Israel ockuperat sedan 1967. Tidigare i år bestämdes dock att de båda länderna skulle försöka införa en mekanism för att undvika konflikter. Nu menar alltså Israel att Syrien brutit deras överenskommelse genom att planera turkisk militärs närvaro på Abu Duhur-flygbasen i närheten av Idlib. Signalen är glasklar Vid attacken ska det inte ha befunnit sig några turkar på basen och ingen person skadades, däremot blev det materiell skada. Och signalen är glasklar: attacken är ett budskap till Turkiet.  Turkiet fördömer attacken och menar att Israel bara passar på att bomba sina grannländer.  Israels officiella argument är haltande eftersom det redan finns turkisk militär närvaro i Syrien. Det är bland annat turkar som utbildar den nya syriska armén. Orsaken är nog mer komplex. Dels handlar det säkert om höstens val i Israel, dels om att Turkiet inlett en militär allians med Saudiarabien och Pakistan. Det är en allianstrio som måste stressa Israel rejält. Alla är tydliga Palestinaförespråkare, sammantaget mycket militär makt och till och med kärnvapen. Israel vill tydligt markera mot Turkiet att de inte ska lukta mer makt i regionen. Militär konfrontation? Men kan det bli en militär konfrontation mellan Israel och Turkiet? Frågan är hur USA kommer att agera. Trump har lång relation med Netanyahu men allt talar för att den har varit spänd den senaste tiden. Trump hyllar också ofta Recep Tayyip Erdogan och berömmer hans ledarstil. Det kommer att bli intressant hur han kommer att agera gentemot dessa två herrar. En direkt militär konfrontation är fortfarande osannolik. Men efter 7 oktoberattacken och kriget mot Iran håller maktbalansen i regionen på att förändras – och relationen mellan Israel och Turkiet kan bli en av de viktigaste följetongerna att hålla koll på.", "link": "https://www.tv4.se/artikel/5aDbGICQwYkSoGfvSvKdeB/signalen-aer-glasklar-attacken-aer-ett-budskap-till-turkiet", "date_display": "2026-08-19", "date_iso": "2026-08-19T20:08:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/irankriget", "/donald-trump", "/usa", "/turkiet"]}, {"id": 159, "title": "China opens route in the Northeast Passage - halving travel time", "summary": "The Northeast Passage is a sea route between Asia and Europe that runs through the Arctic Ocean. The passage has been of interest for several centuries but has mostly been inaccessible to regular sea traffic due to severe weather conditions and sea ice. However, climate change has extended the time it is possible to operate the Northeast Passage, which is a significantly shorter alternative to the conventional sea route between Asia and China through the Suez Canal. In recent years, the great powers' interest in the Arctic has grown. China has long had the ambition to establish a new \"silk road\" through the Arctic Ocean - and now the country has taken a big step in that direction. More than halving the journey After a test journey in 2025, China has now launched a now regular line for container traffic through the Northeast Passage, reports The Guardian. The route is to be operated once a week and this weekend the first vessel left the port of Ningbo in eastern China to sail to Felixstowe in the UK. For China, the establishment of the line is a success. The travel time is more than halved compared to the sea route via the Red Sea and the Suez Canal, and China is also increasing its presence in the Arctic. Major risks The turmoil in the Middle East with wars and militia groups attacking ships in the Red Sea is said to be what accelerated the process of the Northeast Passage. At the same time, it will take some time before the Northeast Passage can seriously compete with other sea routes, writes The Guardian. The journey is associated with both high costs and risks. An oil spill would be a disaster for the sensitive environment.  The passage is also unavailable to countries that are behind the sanctions against Russia. The water is heavily militarized by Russia, and in order to pass the ships, it is necessary for Russian icebreakers to drive up a chute most of the year. That, in turn, would mean extensive payments to Russia, which would be in violation of the sanctions.", "title_original": "Kina öppnar rutt i Nordostpassagen – halverar restiden", "summary_original": "Nordostpassagen är en sjöväg mellan Asien och Europa som går genom Norra ishavet. Passagen har varit av intresse i flera århundraden men har för det mesta varit otillgänglig för reguljär sjötrafik på grund av svåra väderförhållanden och havsis. Klimatförändringarna har dock förlängt tiden då det är möjligt att trafikera Nordostpassagen, som är ett avsevärt kortare alternativ till den konventionella sjövägen mellan Asien och Kina genom Suezkanalen. På senare år har stormakternas intresse för Arktis växt. Kina har länge haft ambitionen att etablera en ny ”sidenväg” genom ishavet – och nu har landet tagit ett stort steg i den riktningen. Mer än halverar resan Efter en provresa 2025 har Kina nu lanserat en nu reguljär linje för containertrafik genom Nordostpassagen,  rapporterar The Guardian. Sträckan ska trafikeras en gång i veckan och i helgen lämnade det första fartyget hamnen i Ningbo i östra Kina för att segla mot Felixstowe i Storbritannien. För Kina är inrättandet av linjen en framgång. Restiden mer än halveras jämfört med sjövägen via Röda havet och Suezkanalen och dessutom ökar Kina sin närvaro i Arktis. Stora risker Oroligheterna i Mellanöstern med krig och milisgrupper som attackerar fartyg i Röda havet uppges vara det som snabbat på processen med Nordostpassagen. Samtidigt kommer det dröja innan Nordostpassagen på allvar kan konkurrera med andra sjövägar, skriver The Guardian. Resan är förknippad med både höga kostnader och risker. Ett oljeutsläpp skulle vara en katastrof för den känsliga miljön.  Passagen är dessutom otillgänglig för länder länder som står bakom sanktionerna mot Ryssland. Vattnet är starkt militariserat av Ryssland och för att kunna framföra fartygen krävs att ryska isbrytare kör upp en ränna större delen av året. Det skulle i sin tur betyda omfattande betalningar till Ryssland, vilket skulle strida mot sanktionerna.", "link": "https://www.tv4.se/artikel/6BkD84oIhSJDCQTiSoz6Mh/kina-oeppnar-rutt-i-nordostpassagen-halverar-restiden", "date_display": "2026-08-19", "date_iso": "2026-08-19T19:30:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/arktis", "/kina", "/ryssland"]}, {"id": 160, "title": "Israel builds gallows with audience seats", "summary": "In March, the Israeli parliament, the Knesset, voted through a bill allowing the death penalty. In practice, it can only be used against Palestinians as it is used in military courts, where Israeli citizens cannot be tried. The bill has been appealed by lawyers and human rights groups to the Supreme Court of Israel.  Ben-Gvir: The gallows is taking shape The proposal for the death penalty was put forward by the ultra-nationalist party Jewish Power, which is led by Minister of National Security Itamar Ben-Gvir. This week, the party uploaded a video of its leader Ben-Gvir at a construction site at a high-security prison, where he says a gallows is being built. - We fulfill what we promised, says Ben-Gvir.  The minister has promised worse conditions for prisoners convicted of terrorism, something he believes has now been fulfilled by death row and the gallows starting to take shape.  He also states that a place for spectators will be built - something he claims is completely normal in other countries, including the United States, The Telegraph reports. Massive criticism of Ben-Gvir's statements The far-right minister Ben-Gvir was also criticized earlier this week for his statements about the treatment of Palestinians. In a podcast he recently said he wants more people in Gaza to be killed.  - I think targeted killings should be carried out in Gaza, take out 30-40 people every night, Ben-Gvir said, adding that they are not a people who deserve to live.  The statement led to strong criticism – including from Sweden. Foreign Minister Maria Malmer Stenergard wrote in a statement that she reacted with \"disgust to this terrible statement\". \"Sweden's government has done absolutely right in taking the initiative to introduce EU sanctions against extremist Israeli ministers - such as Ben-Gvir,\" wrote Malmer Stenergard.", "title_original": "Israel bygger galge med publikplatser", "summary_original": "I mars röstade det israeliska parlamentet Knesset igenom ett lagförslag som tillåter dödsstraff. I praktiken kan det bara användas mot palestinier då den används i militärdomstolar, där israeliska medborgare inte kan dömas. Lagförslaget har överklagats av jurister och människorättsgrupper till Högsta domstolen i Israel.  Ben-Gvir: Galgen börjar ta form Förslaget om dödsstraff lades fram av det ultranationalistiska partiet Judisk makt som leds av ministern för nationell säkerhet Itamar Ben-Gvir. I veckan laddade partiet upp en video på sin ledare Ben-Gvir på en byggarbetsplats vid ett högsäkerhetsfängelse, där han uppger att man håller på att bygga en galge. – Vi uppfyller det vi lovade, säger Ben-Gvir.  Ministern har lovat sämre villkor för terrordömda fångar, något han menar att man nu uppfyllt genom att dödsceller och galgen börjar ta form.  Han uppger även att det ska byggas en plats för åskådare – något han hävdar är helt normalt i andra länder, bland annat USA, rapporterar The Telegraph. Massiv kritik mot Ben-Gvirs uttalanden Den högerextrema ministern Ben-Gvir har tidigare i veckan även blivit omskriven för sina uttalanden om behandlingen av palestinier. I en podcast sade han nyligen att vill att fler människor i Gaza ska dödas.  – Jag tycker att riktade dödsskjutningar borde utföras i Gaza, ta bort 30–40 personer varje natt  sade Ben-Gvir och tillade att de inte är ett folk som förtjänar att leva.  Uttalandet ledde till stark kritik – bland annat från Sverige. Utrikesminister Maria Malmer Stenergard skrev i ett uttalande att hon reagerade med ”avsmak på detta fruktansvärda uttalande”. ”Sveriges regering har gjort helt rätt i att ta initiativ till att införa EU-sanktioner mot extremistiska israeliska ministrar – sådana som Ben-Gvir”, skrev Malmer Stenergard.", "link": "https://www.tv4.se/artikel/78t8FpF42nygZu2gOgb3Ah/israel-bygger-galge-foer-att-haenga-terrordoemda-palestinier", "date_display": "2026-08-19", "date_iso": "2026-08-19T18:55:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/israel", "/gaza"]}, {"id": 161, "title": "UN report: Climate change drives up coffee prices", "summary": "Coffee prices continue to fluctuate strongly on the world market. According to a new report from the UN food agency FAO, extreme weather in important growing countries is one of the main causes. Drought, frost and heavy rain have in recent years affected coffee production in several of the world's largest producing countries. When harvests decline while demand remains at high levels, prices rise. FAO states in the report that climate-related disturbances continue to affect the market for coffee, but also for tea and cocoa. Despite global coffee production reaching high levels, plantations are becoming increasingly vulnerable. The two most common types of coffee, arabica and robusta, are affected in different ways by changing weather conditions. Arabica is sensitive to rising temperatures, while robusta needs large amounts of water and risks lower yields during periods of drought. Dissatisfaction among farmers In Colombia, coffee farmer Eusebio Alonso notices the changes. - It is not like before, when there was a lot of coffee that was harvested. I once harvested 312 kilos in one day. Nowadays, nobody harvests 300 kilos. At the most, they can reach 100 kilos, he says. According to the FAO, several extreme weather events in recent years have hit coffee production in important growing areas. - There was a drought in the most important key areas where coffee is produced, which led to a reduced supply and in turn a sudden increase in the price of coffee internationally, says El Mamoun Amrouk, senior economist at the UN's food agency FAO. The UN's proposal To reduce vulnerability, FAO points to the need for more resilient crops. It can be about new technology, improved cultivation methods and measures against pests and diseases. The organization also calls for increased transparency in the market. According to the FAO, growers need better information about harvests, stocks, trade and consumption in order to plan their operations. The goal is to create a more stable market and at the same time strengthen livelihoods for the millions of people", "title_original": "FN-rapport: Klimatförändringar driver upp kaffepriserna", "summary_original": "Kaffepriserna fortsätter att svänga kraftigt på världsmarknaden. Enligt en ny rapport från FN:s livsmedelsorgan FAO är extremväder i viktiga odlingsländer en av de främsta orsakerna. Torka, frost och kraftiga regn har under de senaste åren påverkat kaffeproduktionen i flera av världens största producentländer. När skördarna minskar samtidigt som efterfrågan ligger kvar på höga nivåer stiger priserna. FAO konstaterar i rapporten att klimatrelaterade störningar fortsätter att påverka marknaden för kaffe, men också för te och kakao. Trots att den globala kaffeproduktionen når höga nivåer blir odlingarna allt mer sårbara. De två vanligaste kaffesorterna, arabica och robusta, påverkas på olika sätt av förändrade väderförhållanden. Arabica är känslig för stigande temperaturer, medan robusta behöver stora mängder vatten och riskerar lägre skördar under perioder med torka. Missnöje bland bönderna I Colombia märker kaffebonden Eusebio Alonso av förändringarna. – Det är inte som förr, då det var mycket kaffe som skördades. Jag skördade en gång 312 kilo på en dag. Numera är det ingen som skördar 300 kilo. Som mest kan de komma upp till 100 kilo, säger han. Enligt FAO har flera extrema väderhändelser de senaste åren slagit mot kaffeproduktionen i viktiga odlingsområden. – Det var torka i de viktigaste nyckelområdena där kaffe produceras, vilket ledde till en minskad tillgång och i sin tur plötslig ökning av kaffepriset internationellt, säger El Mamoun Amrouk, senior ekonom vid FN:s livsmedelsorgan FAO. FN:s förslag För att minska sårbarheten pekar FAO på behovet av mer motståndskraftiga odlingar. Det kan handla om ny teknik, förbättrade odlingsmetoder och åtgärder mot skadedjur och sjukdomar. Organisationen efterlyser också ökad transparens på marknaden. Enligt FAO behöver odlare bättre information om skördar, lager, handel och konsumtion för att kunna planera sin verksamhet. Målet är att skapa en stabilare marknad och samtidigt stärka försörjningen för de miljontals människor som är beroende av kaffeodling världen över.", "link": "https://www.tv4.se/artikel/01cxYnFtt1RD6Z0aQuygVN/fn-rapport-klimatfoeraendringar-driver-upp-kaffepriserna", "date_display": "2026-08-19", "date_iso": "2026-08-19T18:29:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/colombia", "/kaffe", "/pengar"]}, {"id": 162, "title": "David Hellenius on profanity on TV: \"Then I would have been jailed\"", "summary": "A review carried out by TV4 Nyheterna shows that the number of profanity in reality television has doubled in a few years. In one of this year's episodes of \"Sweden's master chef\", for example, different variants of \"damn\", \"damn\" and \"damn\" appeared about 28 times. When Edvin Törnblom went through the script for Friday's premiere of \"Let's dance\", he reacted to the word \"bastards\" appearing. - I think swearing has been toned down a bit. \"Damn\" may not be perceived as as much of a swear word today as it was a few years ago, he says. Changed in the script David Hellenius, who has been a presenter for almost three decades and led Let's dance for several years, however chose to change the word in the script from \"bastards\" to \"devils\". He believes that the acceptance of profanity on television has changed, but that the tone is still significantly freer in the podcast world, where Törnblom is more used to working. There, it is more accepted to swear and use, for example, sex words. - If I had said a sex word in Let's dance, I would have gone to prison, he says. Who swears matters At the same time, he believes that the viewers' reaction was influenced by who said it. - If you, Edvin, had said a sex word on Friday, people would have said: \"So these young people.\" But if I did, the reaction would have been: “Oh my God”. Although David Hellenius is easily dragged along by his younger colleague, he has no great desire to get rid of his job. - It feels like we can find a new conversation and a new tone, he says. - But you have to choose: Should I be canceled or do I want to hang out with the young people? Do you know how difficult that decision is?", "title_original": "David Hellenius om svordomar i TV: ”Då hade jag fått fängelse”", "summary_original": "En genomgång som TV4 Nyheterna gjort visar att antalet svordomar i reality-tv har fördubblats på några år. I ett av årets avsnitt av ”Sveriges mästerkock” förekom exempelvis olika varianter av ”jävlar”, ”jävligt” och ”jävla” omkring 28 gånger. När Edvin Törnblom gick igenom manuset inför fredagens premiär av ”Let's dance” reagerade han på att ordet ”jävlar” förekom. – Jag tror att svordomar har dämpats ner lite. ”Jävlar” kanske inte uppfattas som lika mycket av en svordom i dag som för några år sedan, säger han. Ändrade i manuset David Hellenius, som har varit programledare i snart tre decennier och lett Let’s dance under flera år, valde dock att ändra ordet i manuset från ”jävlar” till ”jäklar”. Han menar att acceptansen för svordomar i tv har förändrats, men att tonen fortfarande är betydligt friare i poddvärlden, där Törnblom är mer van att arbeta. Där är det i högre grad accepterat att svära och använda exempelvis könsord. – Hade jag sagt ett könsord i Let's dance hade jag åkt i fängelse, säger han. Vem som svär spelar roll Samtidigt tror han att tittarnas reaktion hade påverkats av vem som sagt det. – Hade du, Edvin, sagt något könsord på fredag hade folk sagt: ”De här unga alltså.” Men om jag gjorde det hade reaktionen varit: ”Åh herregud”. Trots att David Hellenius lätt dras med av sin yngre kollega har han ingen större lust att bli av med sitt jobb. – Det känns som att vi kan hitta ett nytt snack och en ny ton, säger han. – Men man får välja: Ska jag bli cancelled eller vill jag hänga med de unga? Vet du hur svårt det beslutet är?", "link": "https://www.tv4.se/artikel/2kw5HcDeoqNSg0PcmYNx9K/david-hellenius-om-svordomar-i-tv-da-hade-jag-fatt-faengelse", "date_display": "2026-08-19", "date_iso": "2026-08-19T18:02:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/reality", "/tv4", "/tv4-play", "/personer/david-hellenius", "/edvin-tornblom", "/let-s-dance"]}, {"id": 163, "title": "The expert: \"We've stopped using public shame piles\"", "summary": "This weekend, the Tidö parties appointed a constitutional committee to review the defamation legislation. They are critical of the fact that people who tell about sexual abuse and warn others about it can be convicted of defamation. All parties in the Riksdag are behind the investigation and want to see a change in the legislation. The issue was brought to a head when the debater Jonatan Alfvén was put on trial today after publishing information about several convicted pedophiles in his social media. - I may take part in public documents, but I may not discuss them. Then I can be prosecuted for defamation, says Alfvén, who denies any crime. The expert: Does not belong in a state of law Freedom of expression expert Nils Funcke is critical of the committee's proposed changes and believes that \"public shame piles\" do not belong in a modern state of law. - The state has a monopoly on prosecuting, punishing and trying to rehabilitate these people. In today's defamation legislation, there is a provision stating that people should not be sentenced if the statements are considered \"justifiable\". The assessment is based, among other things, on whether there is a public interest. - There may of course be situations where it is justified to go out and warn of a dangerous person, whether it is a pedophile or a perpetrator of violence who has escaped from a prison. Then there is a strong public interest in telling about it. Can be convicted of defamation - regardless of whether it is true or not In Sweden - unlike many other countries - a person can be convicted of defamation even if the information is true. - Just because something is true, there is not necessarily a strong public interest in it coming out, says Nils Funcke. - We have that arrangement so that public shame piles do not develop. It is required that it is justifiable to provide information about an individual who is then exposed to the disrespect of others. He also believes that there is a risk that the legislators will start with this group and then go on to single out all possible people in society who are considered dangerous and", "title_original": "Experten: ”Offentliga skampålar har vi slutat med”", "summary_original": "I helgen tillsatte Tidöpartierna en grundlagskommitté för att se över förtalslagstiftningen. De är kritiska till att personer som berättar om sexuella övergrepp och varnar andra för detta kan dömas för förtal. Samtliga riksdagspartier står bakom utredningen och vill se en förändring av lagstiftningen. Frågan sattes på sin spets när debattören Jonatan Alfvén i dag ställdes inför rätta efter att ha publicerat uppgifter om flera dömda pedofiler i sina sociala medier. – Jag får ta del av offentliga handlingar, men jag får inte samtala om dem. Då kan jag åtalas för förtal, säger Alfvén, som nekar till brott. Experten: Hör inte hemma i en rättsstat Yttrandefrihetsexperten Nils Funcke är kritisk till kommitténs föreslagna förändringar och menar att ”offentliga skampålar” inte hör hemma i en modern rättsstat. – Staten har monopol på att lagföra, straffa och försöka rehabilitera de här personerna. I dagens förtalslagstiftning finns en skrivning om att personer inte ska dömas om uttalandena anses vara ”försvarliga”. Bedömningen baseras bland annat på om det finns ett allmänintresse. – Det kan naturligtvis finnas situationer där det är motiverat att gå ut och varna för en farlig person, vare sig det handlar om en pedofil eller en våldsverkare som har rymt från ett fängelse. Då finns det ett starkt allmänintresse av att berätta om det. Kan dömas för förtal – oavsett om det är sant eller inte I Sverige – till skillnad från många andra länder – kan en person dömas för förtal även om uppgifterna är sanna. – Bara för att någonting är sant finns det inte nödvändigtvis ett starkt allmänintresse att det kommer ut, säger Nils Funcke. – Vi har den ordningen för att det inte ska utvecklas offentliga skampålar. Det krävs att det är försvarligt att lämna uppgifter om en enskild som då utsätts för andras missaktning. Han menar också att det finns en risk att lagstiftarna börjar med den här gruppen och sedan går vidare till att peka ut alla möjliga personer i samhället som anses farliga och därmed får hängas ut. – Ambitionen är att man ska försöka få de här personerna på banan igen, så att de bryter det destruktiva levernet och kommer tillbaka till samhället. Men risken, om det blir en exponering från allmänheten, är att de här individerna aldrig får en chans att komma tillbaka till samhällslivet. Kritisk mot SD:s pressträff Han är också kritisk till att Sverigedemokraterna anordnade en presskonferens utanför Stockholms tingsrätt i samband med Jonatan Alfvéns rättegång. – Att en del av regeringsunderlaget börjar demonstrera under pågående rättsprocesser och därmed lägger sig i domstolens självständiga prövning är direkt olämpligt. – Det verkar som om Sverigedemokraterna redan har gått i opposition när de agerar på det här sättet, i stället för att vara tillfreds med att lagstiftningen nu ses över.", "link": "https://www.tv4.se/artikel/268aKFLr8AR4Pd2Vxftuix/experten-offentliga-skampalar-har-vi-slutat-med", "date_display": "2026-08-19", "date_iso": "2026-08-19T16:21:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/yttrandefrihet", "/pedofil"]}, {"id": 164, "title": "The neighbor feud escalated - now the preschool is forced to deploy security guards", "summary": "A preschool in Västerås has been subject to repeated harassment for almost a year. This after a feud that \"derailed\" with neighbors in the same property.  Among other things, the neighbors are said to have photographed staff and children at the preschool. Something that the newspaper VLT was the first to report on. Police and guards have been called to the preschool on repeated occasions. - The staff has been harassed, people have filmed in the farm and filmed staff, and expressed themselves in an inappropriate way, says Ulrika Adamsson, operations manager for preschool operations in Västerås to TV4 Nyheterna. - The employees are worried and find it stressful, continues Adamsson. The origin: Conflict over outdoor furniture The origin of the whole thing is a conflict over the preschool's outdoor furniture. About a year ago, a neighbor moved the furniture to his yard. When the preschool staff moved the furniture back, the conflict began.  - Nobody talks about the origin anymore. It has now completely derailed, says Ulrika Adamsson. The incidents have forced the municipality to take several security measures. The staff have now received their own security alarms with direct connection to security guards. After repeated harassment of the staff, the preschool and the housing company have also been forced to deploy their own guards during the day.  - The staff have received clear safety instructions. In some cases, the police are called directly.   There is also double staffing when opening and closing, adds Adamsson.  Kept the children at home The conflict calmed down during the winter, but in connection with the outdoor furniture being moved out again, it gained momentum and has now escalated. Now it has gone so far that it happened that parents even kept the children at home.  - It has happened that some guardians have kept their children at home because of the worries, says Ulrika Adamsson. Now the municipality is drawing up a plan to be able to relocate the business should the conflict escalate further.  - It would be a drastic measure. But safety comes first. The events", "title_original": "Grannfejden eskalerade – nu tvingas förskola sätta in väktare", "summary_original": "En förskola i Västerås har utsatts för återkommande trakasserier under närmare ett års tid. Detta efter en fejd som ”spårat ur” med grannar i samma fastighet.  Grannarna ska bland annat ha fotograferat personal och barn på förskolan. Något som tidningen VLT var först med att rapportera om. Polis och väktare har larmats till förskolan vid upprepade tillfällen. – Personalen har blivit ofredad, man har filmat in på gården och filmat personal, och uttryckt sig på ett olämpligt sätt, säger Ulrika Adamsson, verksamhetschef för förskoleverksamheten i Västerås till TV4 Nyheterna. – Medarbetarna är oroliga och tycker att det är påfrestande, fortsätter Adamsson. Upprinnelsen: Konflikt om utemöbler Upprinnelsen till det hela är en konflikt om förskolans utemöbler. För ungefär ett år sedan flyttade en granne möblerna till sin gård. När förskolans personal flyttade tillbaka möblerna var konflikten igång.  – Upprinnelsen är det ingen som pratar om längre. Det har nu spårat ur totalt, säger Ulrika Adamsson. Händelserna har tvingat kommunen att vidta flera säkerhetsåtgärder. Personalen har nu fått egna trygghetslarm med direktkoppling till väktare. Efter återkommande trakasserier mot personalen har förskolan och bostadsbolaget även tvingats sätta in egna väktare på dagtid.  – Personalen har fått tydliga säkerhetsinstruktioner. I vissa fall ringer man direkt till polisen.   Det är även dubbelbemanning vid öppning och stängning, tillägger Adamsson.  Hållit barnen hemma Konflikten lugnade ner sig under vintern, men i samband med att utemöblerna flyttades ut igen tog den fart och har nu eskalerat. Nu har det gått så pass långt att det förekommit att föräldrar till och med hållit barnen hemma.  – Det har förekommit att enstaka vårdnadshavare hållit sina barn hemma på grund av oron, säger Ulrika Adamsson. Nu tar kommunen fram en plan för att kunna flytta verksamheten om konflikten skulle eskalera ytterligare.  – Det skulle vara en drastisk åtgärd. Men säkerheten går före allt. Händelserna har polisanmälts, men de flesta ärendena har lagts ned, enligt kommunen. Polisen i region Mitt uppger för TV4 Nyheterna att man känner till situationen, men inte vill kommentera händelserna närmare i nuläget. ”Polisen har kännedom om situationen, men bedömer i nuläget att inget brott har begåtts. Löpande bedömningar görs alltid, men för närvarande har polisen inga ytterligare kommentarer”, skriver Maria Hall, presstalesperson vid polisen i region Mitt.", "link": "https://www.tv4.se/artikel/224krt6JOZ2dbsqlk0bYuG/grannfejden-eskalerade-nu-tvingas-foerskola-saetta-in-vaektare", "date_display": "2026-08-19", "date_iso": "2026-08-19T16:16:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/forskola", "/barn", "/vasteras"]}, {"id": 165, "title": "Great support for Jonatan Alfvén when the trial against him began", "summary": "SD wants to pardon the child rights activist in the event of a possible conviction.", "title_original": "Stort stöd för Jonatan Alfvén när  rättegången mot honom inleddes", "summary_original": "SD vill benåda barnrättsaktivisten vid en eventuellt fällande dom.", "link": "https://www.dagen.se/nyheter/stort-stoed-foer-jonatan-alfven-naer-raettegangen-mot-honom-inleddes/10485941", "date_display": "2026-08-19", "date_iso": "2026-08-19T14:02:50+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "Every second Swede regrets what they never said to a relative on their deathbed", "summary": "\"It's heavy and it's a little depressing that there are so many people who regret it.\"", "title_original": "Varannan svensk ångrar det som de aldrig sa till en anhörig på dödsbädden", "summary_original": "”Det är tungt och det är lite beklämmande att det är så många som å r små kapell och missionshus på sin pågående turné", "link": "https://www.dagen.se/kultur/samuel-ljungblahd-vi-hoppas-den-svenska-glesbygden-ska-fa-bli-lite-mer-andefylld/10483009", "date_display": "2026-08-19", "date_iso": "2026-08-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 170, "title": "Bishop: That the seminar was canceled had nothing to do with Joel Halldorf", "summary": "Denies that criticism of the subject or any speaker caused the inspiration day in Skara on migration to be cancelled.", "title_original": "Biskop: Att seminariet ställdes in hade inget med Joel Halldorf att göra", "summary_original": "Förnekar att kritik mot ämnet eller någon talare gjorde att inspirationsdagen i Skara om migration ställdes in.", "link": "https://www.dagen.se/nyheter/biskop-att-seminariet-staelldes-in-hade-inget-med-joel-halldorf-att-goera/10482944", "date_display": "2026-08-19", "date_iso": "2026-08-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 171, "title": "Let the grief take its time - broaden the bereavement allowance", "summary": "Days of mourning must be taken when the grief weighs the most, write Simona Mohamsson, Lina Nordquist and Patrik Karlson (L).", "title_original": "Låt sorgen ta sin tid – bredda sorgepengen", "summary_original": "Sorgedagar måste gå att ta ut när sorgen tynger som mest, skriver Simona Mohamsson, Lina Nordquist och Patrik Karlson (L).", "link": "https://www.dagen.se/debatt/lat-sorgen-ta-sin-tid-bredda-sorgepengen/10480399", "date_display": "2026-08-19", "date_iso": "2026-08-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 172, "title": "Man who caused 14-year-old girl's death is sentenced to forensic psychiatric care", "summary": "Must also pay damages to the next of kin.", "title_original": "Man som vål   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
