h handlingen har förskjutits mot centrala delen av Malmö.", "link": "https://www.sydsvenskan.se/kultur/festen-gor-comeback-och-bjuder-pa-malmoporr-i-kubik/", "date_display": "2026-04-13", "date_iso": "2026-04-13T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Members' money stuck in \"The good bank\": \"Already a zombie bank\"", "summary": "The non-profit JAK bank's debts to its members are growing. At the current rate, it will take 94 years before everyone has gotten their money back. - I would say that JAK is already a zombie bank, says economist Viktor Elliot.", "title_original": "Medlemmarnas pengar fast i ”Den goda banken”: ”Redan en zombiebank”", "summary_original": "Den icke vinstdrivande JAK-bankens skulder till sina medlemmar växer. I nuvarande takt dröjer det 94 år innan alla har fått tillbaka sina pengar. – Jag skulle säga att JAK redan är en zombiebank, säger ekonomiforskaren Viktor Elliot.", "link": "https://www.dn.se/ekonomi/medlemmarnas-pengar-fast-i-den-goda-banken-redan-en-zombiebank/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:57:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "So he became Viktor Orbán's biggest challenger", "summary": "He was for a long time one of Viktor Orbán's own within the governing Fidesz party. Then he broke all ties and became the main opponent of the party. This is Péter Magyar.", "title_original": "Så blev han Viktor Orbáns största utmanare", "summary_original": "Han var länge en av Viktor Orbáns egna inom regeringspartiet Fidesz. Sedan bröt han alla band och blev partiets främsta motståndare. Det här är Péter Magyar.", "link": "https://www.svd.se/a/BxMkGE/sa-blev-han-viktor-orbans-storsta-utmanare", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:44:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 97, "title": "It was a resounding yes to Europe.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Det blev ett rungande ja till Europa.", "summary_original": "Valvinnaren Péter Magyar.", "link": "https://www.sydsvenskan.se/opinion/moa-berglof/det-blev-ett-rungande-ja-till-europa/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:42:47+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "The truth about lying is that it is sometimes necessary", "summary": "One should not venture with untruth. But white lies do no harm, do they? Torbjörn Elensky reads two new books and finds that in our time the lie has truly become central to political life.", "title_original": "Sanningen om lögnen är att den behövs ibland", "summary_original": "Man ska inte fara med osanning. Men vita lögner tar väl ingen skada av? Torbjörn Elensky läser två nya böcker och finner att lögnen i vår tid sanner­ligen har blivit central i det politiska livet.", "link": "https://www.svd.se/a/lnnB2y/recension-lognare-av-daniel-andersson-och-sanningen-om-lognen-av-anders-tornvall", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Litteratur", "Kultur"]}, {"id": 99, "title": "The Dionysian in Lorca becomes unredeemed", "summary": "Lorca's story of the childless Yerma is staged in an attempt to depart from Spanish folklore. At Västmanland's theatre, two worlds are pitted against each other - boldly but irredeemably.", "title_original": "Det dionysiska hos Lorca blir oförlöst", "summary_original": "Lorcas berättelse om den barnlösa Yerma iscensätts i ett försök att lämna spansk folklore. På Västmanlands teater ställs två världar mot varandra – djärvt men oförlöst.", "link": "https://www.svd.se/a/V6g9AW/yerma-pa-vastmanlands-teater-recenseras", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Scen", "Kultur"]}, {"id": 100, "title": "The state has caused the problem outside of Ängelholm – now the state must also solve it", "summary": "THE COLUMN: The armed forces have polluted Ängelholm's reserve water source - but want to avoid the bill. Now both the environment and trust in the state are at risk of being affected, writes Kristina Cekanovic.", "title_original": "Staten har orsakat problemet utanför Ängelholm – nu måste staten också lösa det", "summary_original": "KOLUMNEN: Försvarsmakten har förorenat Ängelholms reservvattentäkt – men vill slippa notan. Nu riskerar både miljön och förtroendet för staten att drabbas, skriver Kristina Cekanovic.", "link": "https://www.hd.se/opinion/ledare/staten-har-orsakat-problemet-utanfor-angelholm-nu-maste-staten-ocksa-losa-det/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "Filippa Kindblom: Do you call that running?", "summary": "The running tracks are full of young girls running slowly. Provocatively slow, the men think. But it works. Now young girls have become the largest group of runners.", "title_original": "Filippa Kindblom: Kallar du det att springa?", "summary_original": "Det kryllar av unga tjejer i löparspåren som springer långsamt. Provocerande långsamt, tycker männen. Men det fungerar. Nu har unga tjejer blivit den största löpargruppen.", "link": "https://www.dn.se/sport/filippa-kindblom-kallar-du-det-att-springa/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:28:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "\"What were people thinking when they saw me running so slowly?\"", "summary": "A wave of girls is taking to the running tracks, and with it a trend is growing: To run - slowly. Slow running influencer Malin Gabrielsson says that the training form became a kind of revenge. - At the beginning I thought it was hard to think about what people who saw me thought when I ran so slowly. But I had given birth to two children and gained 30 kilos in both pregnancies.", "title_original": "”Vad tänkte folk som såg mig springa så långsamt?”", "summary_original": "En tjejvåg drar fram i löparspåren och med den växer en trend: Att springa – sakta. Slow running-influencern Malin Gabrielsson säger att träningsformen blev ett slags revansch. – I början tyckte jag det var jobbigt att tänka på vad folk som såg mig tänkte när jag sprang så långsamt. Men jag hade ju fött två barn och gått upp 30 kilo i båda graviditeterna.", "link": "https://www.dn.se/sport/vad-tankte-folk-som-sag-mig-springa-sa-langsamt/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:27:53+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Takes crisis measures – which may not even be noticed", "summary": "The government's spring budget is presented today", "title_original": "Tar till krisåtgärder – som kanske inte ens märks", "summary_original": "Idag presenteras regeringens vårbudget", "link": "https://www.tv4.se/artikel/580uIwRLKVd63ts2h1tVus/irankriget-tvingar-till-krisatgaerder", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:26:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Svensk politik", "/politik"]}, {"id": 104, "title": "Trump and Putin no longer have a friend in the mail", "summary": "", "title_original": "Trump och Putin har inte längre en vän på posten", "summary_original": "", "link": "https://www.tv4.se/artikel/5eNdVo0fbIOXrZAOYaeCGZ/trump-och-putin-har-inte-laengre-en-vaen-pa-posten", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:24:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 105, "title": "The Shah's son visits the Riksdag: \"Very naive\"", "summary": "For some, he symbolizes the only hope for Iran. Others see Reza Pahlavi as the son of a dictator, who has not sufficiently distanced himself from the police state his father ruled in pre-revolutionary Iran. Even before Monday's visit to Sweden's Riksdag, Reza Pahlavi has caused debate.", "title_original": "Shahens son besöker riksdagen: &quot;Väldigt naivt”", "summary_original": "För vissa symboliserar han det enda hoppet för Iran. Andra ser Reza Pahlavi som son till en diktator, som inte tagit tillräckligt avstånd från den polisstat som hans pappa styrde i Iran före revolutionen. Redan innan måndagens besök i Sveriges riksdag har Reza Pahlavi orsakat debatt.", "link": "https://www.svd.se/a/L43W3V/shahens-son-besoker-riksdagen-valdigt-naivt", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:19:21+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 106, "title": "Follow developments in Iran and the Middle East", "summary": "", "title_original": "Följ utvecklingen i Iran och Mellanöstern", "summary_original": "", "link": "https://www.sydsvenskan.se/varlden/folj-utvecklingen-i-iran-har/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:15:06+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "Man dead after shooting - gray van allegedly left the scene", "summary": "Two people have been shot at Adolfsberg in Helsingborg last night. A man in his 20s is dead and a woman of the same age is badly shot. - We are investigating what happened. We have technicians on site, door knocking is in progress and a larger cordon has been set up, says the police officer on duty Patric Thelander. TT writes that both people are known to the police from before. According to information to TV4 Nyheterna, a gray van has been seen leaving the scene in connection with the shooting, but no one has yet been arrested. Relatives of the deceased man have been notified.", "title_original": "Man död efter skjutning – grå skåpbil ska ha lämnat platsen", "summary_original": "Två personer har blivit skjutna på Adolfsberg i Helsingborg i natt. En man i 20-årsåldern är död och en kvinna i samma ålder är svårt skottskadad. – Vi håller på att utreda vad som har hänt. Vi har tekniker på plats, dörrknackning pågår och en större avspärrning är gjord, säger polisens vakthavande befäl Patric Thelander. TT skriver att båda personerna är kända av polisen sedan tidigare. Enligt uppgifter till TV4 Nyheterna har en grå skåpbil setts lämna platsen i samband med skottlossningen, men ingen är ännu gripen. Anhöriga till den avlidna mannen är underrättade.", "link": "https://www.tv4.se/artikel/5M0hVtMJJAAZZHIEiypKat/en-doed-och-en-svart-skadad-efter-skottlossning", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:10:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/helsingborg", "/mord", "/misstankt-mord"]}, {"id": 108, "title": "The doctor's insight about stress helped more than herself", "summary": "The doctor was often contacted by people with sleep problems, headaches and exhaustion. One thing helped both herself and many of her patients.", "title_original": "Läkarens insikt om stress hjälpte fler än henne själv", "summary_original": "Läkaren blev ofta kontaktad av personer med sömnproblem, huvudvärk och utmattning. En sak hjälpte både henne själv och många av hennes patienter.", "link": "https://www.svd.se/a/K88O3M/lakarens-insikt-om-hjarnvila-rad-mot-somnproblem-huvudvark-och-utmattning", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:02:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 109, "title": "Ingmar Nevéus: Magyar is a \"secret box\" - no one knows what he really wants", "summary": "Viktor Orbán leaving the stage is an event of great importance far beyond Hungary's borders. Now Hungary and all of Europe are waking up and asking themselves: Who really is Péter Magyar? And what does he want?", "title_original": "Ingmar Nevéus: Magyar är en ”hemlig låda” – ingen vet vad han egentligen vill", "summary_original": "Att Viktor Orbán lämnar scenen är en händelse av stor betydelse långt utanför Ungerns gränser. Nu vaknar Ungern och hela Europa upp och frågar sig: Vem är egentligen Péter Magyar? Och vad vill han?", "link": "https://www.dn.se/varlden/ingmar-neveus-magyar-ar-en-hemlig-lada-ingen-vet-vad-han-egentligen-vill/", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:01:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Here are the proposals in the spring budget", "summary": "The government presents a spring budget of SEK 7.7 billion. Here are the suggestions:", "title_original": "Här är förslagen i vårbudgeten", "summary_original": "Regeringen presenterar en vårbudget på 7,7 miljarder kronor. Här är förslagen:", "link": "https://www.svd.se/a/lnK9wG/har-ar-forslagen-i-varbudgeten", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:00:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 111, "title": "Here are the proposals in the spring budget", "summary": "", "title_original": "Här är förslagen i vårbudgeten", "summary_original": "", "link": "https://www.tv4.se/artikel/tt-260413-budgetlista1-b3149e4b/har-ar-forslagen-i-varbudgeten", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:00:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Elisabeth Svantesson", "/elisabeth-svantesson"]}, {"id": 112, "title": "Ukraine's resistance inspires us all", "summary": "Russia's war brings nothing good, but Ukraine's creative resistance and Europe's assistance have awakened unsuspected strengths among both countries and peoples.", "title_original": "Ukrainas motstånd inspirerar oss alla", "summary_original": "Rysslands krig medför ingenting gott, men Ukrainas kreativa motstånd och Europas assistans har väckt oanade styrkor bland både länder och folk.", "link": "https://www.svd.se/a/k0v0wj/ukrainas-motstand-en-inspiration-for-hela-eu", "date_display": "2026-04-13", "date_iso": "2026-04-13T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 113, "title": "Voters' concerns are unfortunately justified.", "summary": "AI can be used to fake sound and image very realistically.", "title_original": "Väljarnas oro är tyvärr befogad.", "summary_original": "AI kan användas till att fejka ljud och bild mycket verklighetstroget.", "link": "https://www.sydsvenskan.se/opinion/valjarnas-oro-ar-tyvarr-befogad/", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:58:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Magyar gets a supermajority", "summary": "", "title_original": "Magyar får supermajoritet", "summary_original": "", "link": "https://www.svd.se/a/aJO3l7/magyar-far-supermajoritet", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:48:50+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 115, "title": "Victory setback for Trump and Putin", "summary": "A spectacular victory for Peter Magyar gives him a strong mandate to rebuild Hungary and bring the country back into the EU again. But it is still too early for Europe to breathe a sigh of relief.", "title_original": "Segern bakslag för Trump och Putin", "summary_original": "En spektakulär seger för Peter Magyar ger honom ett starkt mandat att bygga om Ungern och föra landet tillbaka till EU igen. Men än är det för tidigt för Europa att andas ut.", "link": "https://www.svd.se/a/vrlwBw/valet-i-ungern-2026-historisk-seger-men-peter-magyar-blir-tuff", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:46:40+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 116, "title": "The bishop appeals: Say no to child prisons", "summary": "Say no to 13-year-olds in prison. That's the message as people across the country gather to protest the government's plans for youth detention. The Church of Sweden is one of the organizations behind the demonstrations. - It is a united Christian voice that questions the humanity and reasonableness of this policy, says Bishop Andreas Holmberg.", "title_original": "Biskopen vädjar: Säg nej till barnfängelser", "summary_original": "Säg nej till 13-åringar i fängelse. Det är budskapet när människor runt om i landet samlas för att protestera mot regeringens planer på ungdomsfängelser. Svenska kyrkan är en av organisationerna som står bakom manifestationerna. – Det är en samfälld kristen röst som ifrågasätter mänskligheten och rimligheten i den här politiken, säger biskop Andreas Holmberg.", "link": "https://www.svd.se/a/oEK93R/biskopen-vadjar-sag-nej-till-barnfangelser", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:45:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 117, "title": "\"Those with ideas can be a boost for welfare\"", "summary": "The idea-driven organizations need to be given a better opportunity to run welfare activities. We therefore want to reserve the operation of certain nursing homes to associations and foundations, write Ebba Busch and Erik Slottner, KD.", "title_original": "”De idéburna kan bli ett lyft för välfärden”", "summary_original": "De idéburna organisationerna behöver få bättre möjlighet att driva välfärdens verksamheter. Vi vill därför reservera driften av vissa äldreboenden till föreningar och stiftelser, skriver Ebba Busch och Erik Slottner, KD.", "link": "https://www.svd.se/a/M7A5OE/kristdemokraterna-de-ideburna-aktorerna-bor-ges-storre-utrymme-i-valfarden", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:45:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Debatt"]}, {"id": 118, "title": "Leader: Orbán has lost - Putin and Trump have gone on a starburst", "summary": "Viktor Orbán has undermined EU cooperation and cleared the Kremlin's affairs. The importance for Europe of Sunday's Hungarian election results cannot be overstated.", "title_original": "Ledare: Orbán har förlorat – Putin och Trump har åkt på en stjärnsmäll", "summary_original": "Viktor Orbán har undergrävt EU-samarbetet och ränt Kremls ärenden. Det går inte att överdriva betydelsen för Europa av söndagens ungerska valresultat.", "link": "https://www.dn.se/ledare/orban-har-forlorat-putin-och-trump-har-akt-pa-en-stjarnsmall/", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:28:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Alex Schulman: I come to the farm and remember who I was last summer", "summary": "Mouse droppings in the kitchen drawers, empty Spanish wine bottles, drafts of a new novel. It is spooky to open a summer house after winter.", "title_original": "Alex Schulman: Jag kommer till lantstället och minns vem jag var förra sommaren", "summary_original": "Musspillning i kökslådorna, tomma spanska vinflaskor, utkast till en ny roman. Det är spöklikt att öppna ett sommarhus efter vintern.", "link": "https://www.dn.se/sverige/alex-schulman-jag-kommer-till-lantstallet-och-minns-vem-jag-var-forra-sommaren/", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:19:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Åberg's hope disappeared in the water: \"Worst blow\"", "summary": "Ludvig Åberg sprinted strongly at the start of the final round of the US Masters. Then all hope disappeared with two visits to the water in \"Amen Corner\". - It was probably the worst shot of the whole week, says Åberg about the miss on hole 12.", "title_original": "Åbergs hopp försvann i vattnet: ”Sämsta slaget”", "summary_original": "Ludvig Åberg spurtade starkt i början av slutrundan i US Masters. Sedan försvann allt hopp med två vattenbesök i ”Amen Corner”. – Det var nog det sämsta slaget på hela veckan, säger Åberg om missen på hål 12.", "link": "https://www.svd.se/a/q6ymR0/abergs-hopp-forsvann-i-vattnet-samsta-slaget", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:15:49+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 121, "title": "Letter to the editor. High ratings say nothing about the quality of schools", "summary": "LETTER TO THE EDITOR. The report from the Freedom of Choice Commission is more or less a work commissioned by for-profit independent schools. The biggest advantage for students in the independent schools is that they more often have parents with post-secondary education, writes Iwan Langermo.", "title_original": "Insändare. Höga betyg säger inget om skolors kvalitet", "summary_original": "INSÄNDARE. Rapporten från Valfrihetskommissionen är mer eller mindre ett beställningsverk av vinstdrivande friskolor. Den största fördelen för elever i friskolorna är att de oftare har föräldrar med eftergymnasial utbildning, skriver Iwan Langermo.", "link": "https://www.dn.se/insandare/hoga-betyg-sager-inget-om-skolors-kvalitet/", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Soul Children celebrates 25 years: \"We will change the world\"", "summary": "The choir movement Soul Children has grown from 20 people to several thousand in 25 years - and the development continues. Now the founder Ragnhild Hiis Ånestad has even bigger plans.", "title_original": "Soul Children firar 25 år: ”Vi ska förändra världen”", "summary_original": "Körrörelsen Soul Children har vuxit från 20 personer till flera tusen på 25 år – och utvecklingen fortsätter. Nu har grundaren Ragnhild Hiis Ånestad ännu större planer.", "link": "https://www.dagen.se/kultur/soul-children-firar-25-ar-vi-ska-foeraendra-vaerlden/10285962", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "At the retreat, I truly feel like the crown of creation", "summary": "Erik Helmerson: For once, I can think to the point.", "title_original": "På retreaten känner jag mig som skapelsens krona på riktigt", "summary_original": "Erik Helmerson: För en gångs skull kan jag tänka till punkt.", "link": "https://www.dagen.se/ledare/pa-retreaten-kaenner-jag-mig-som-skapelsens-krona-pa-riktigt/10284196", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The free churches' membership statistics are stagnating - no denomination is growing", "summary": "No major increases, no significant decreases, as Dagen reviews the membership statistics in the Swedish free churches.", "title_original": "Frikyrkornas medlemsstatistik står och stampar – inget samfund växer", "summary_original": "Inga större ökningar, inga betydande minskningar, då Dagen går igenom medlemsstatistiken i de svenska frikyrkorna.", "link": "https://www.dagen.se/nyheter/frikyrkornas-medlemsstatistik-star-och-stampar-inget-samfund-vaexer/10272658", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "The government is moving ahead with proposals on abortion at home", "summary": "Abortions must be able to be carried out \"in a calm and safe environment at home\", states Minister of Health Elisabet Lann (KD).", "title_original": "Regeringen går vidare med förslag om abort i hemmet", "summary_original": "Aborter ska kunna genomföras ”i en lugn och trygg miljö i hemmet”, uppger sjukvårdsminister Elisabet Lann (KD).", "link": "https://www.dagen.se/nyheter/regeringen-gar-vidare-med-foerslag-om-abort-i-hemmet/10293632", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Court gives Salvation Army temporary right - may have alcohol ban", "summary": "The authority Ivo is not allowed to stop the alcohol ban on sheltered accommodation - right now.", "title_original": "Domstol ger Frälsningsarmén tillfälligt rätt – får ha alkoholförbud", "summary_original": "Myndigheten Ivo får inte stoppa alkoholförbud på skyddade boenden – just nu.", "link": "https://www.dagen.se/nyheter/domstol-ger-fraelsningsarmen-tillfaelligt-raett-far-ha-alkoholfoerbud/10292628", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The priest and the convert in place when the Iranian opposition leader speaks", "summary": "The Riksdag is today visited by Reza Pahlavi, son of Iran's former shah", "title_original": "Prästen och konvertiten på plats när iranske oppositionsledaren talar", "summary_original": "Riksdagen gästas i dag av Reza Pahlavi, son till Irans tidigare shah", "link": "https://www.dagen.se/nyheter/praesten-och-konvertiten-pa-plats-naer-iranske-oppositionsledaren-talar/10291682", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "More than 7,000 attended Hillsong services during Easter", "summary": "Seventy people were baptized in Hillsong's six churches in Sweden", "title_original": "Fler än 7 000 besökte Hillsongs gudstjänster under påsken", "summary_original": "Sjuttiotal personer döptes i Hillsong sex kyrkor i Sverige", "link": "https://www.dagen.se/nyheter/fler-aen-7-000-besoekte-hillsongs-gudstjaenster-under-pasken/10293501", "date_display": "2026-04-13", "date_iso": "2026-04-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Halloumi is threatened by a virus outbreak in Cyprus", "summary": "Foot-and-mouth disease row threatens Cyprus halloumi production, Politico reports.", "title_original": "Halloumin hotas av virusbråk på Cypern", "summary_original": "Bråk om mul- och klövsjuka hotar produktionen av halloumi från Cypern, rapporterar Politico.", "link": "https://www.svd.se/a/16oRkQ/halloumin-hotas-av-cypriotiskt-virusbrak", "date_display": "2026-04-13", "date_iso": "2026-04-13T01:54:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 130, "title": "Man dead in shooting in Helsingborg", "summary": "A man in his 20s has been killed in a shooting in Helsingborg, and a woman has been injured. A large area was cordoned off during the night.  - The crime scene technicians are ready at the scene, says Filip Annas, the police's press spokesperson during the morning.", "title_original": "Man död i skjutning i Helsingborg", "summary_original": "En man i 20-årsåldern har dödats i en skottlossning i Helsingborg, och en kvinna har skadats. Ett stort område spärrades av under natten.  – Kriminalteknikerna är klara på platsen, säger Filip Annas polisens presstalesperson under morgonen.", "link": "https://www.svd.se/a/wr3nEL/en-dod-efter-skjutning-i-helsingborg", "date_display": "2026-04-13", "date_iso": "2026-04-13T01:43:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 131, "title": "Are Trump's tactic of playing crazy?", "summary": "On the night of the eighth of April, the world holds its breath. Donald Trump has said that unless Iran opens the Strait of Hormuz, he will bomb the country back to the Stone Age and wipe out an entire civilization. But is Trump serious - or is his threat part of a tactic that the US has also used in previous conflicts? And has he gone too far now? Program manager: Maria Hansson Botin. With Björn af Kleen, US correspondent at DN. Producer: Måns Mosesson.", "title_original": "Är Trumps taktik att spela galen?", "summary_original": "Natten till den åttonde april håller världen andan. Donald Trump har sagt att om inte Iran öppnar Hormuzsundet kommer han att bomba landet tillbaka till stenåldern och utplåna en hel civilisation. Men menar Trump allvar – eller är hans hot del av en taktik som USA har använt sig av även i tidigare konflikter? Och har han gått för långt nu? Programledare: Maria Hansson Botin. Med Björn af Kleen, USA-korrespondent på DN. Producent: Måns Mosesson.", "link": "https://www.dn.se/podd/spotlight/ar-trumps-taktik-att-spela-galen/", "date_display": "2026-04-12", "date_iso": "2026-04-12T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Åberg's hope disappeared in the water: \"Worst blow\"", "summary": "Ludvig Åberg sprinted strongly at the start of the final round of the US Masters. Then all hope disappeared with two visits to the water in \"Amen Corner\". - It was probably the worst shot of the whole week, says Åberg about the miss on hole 12.", "title_original": "Åbergs hopp försvann i vattnet: ”Sämsta slaget\"", "summary_original": "Ludvig Åberg spurtade starkt i början av slutrundan i US Masters. Sedan försvann allt hopp med två vattenbesök i ”Amen Corner”. – Det var nog det sämsta slaget på hela veckan, säger Åberg om missen på hål 12.", "link": "https://www.dn.se/sport/abergs-hopp-forsvann-i-vattnet-samsta-slaget/", "date_display": "2026-04-12", "date_iso": "2026-04-12T21:44:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Handing over power after 16 years: \"Would be welcome in Moscow\"", "summary": "The experts on Hungary and Orbán's future", "title_original": "Lämnar över makten efter 16 år: ”Skulle vara välkommen i Moskva”", "summary_original": "Experterna om Ungern och Orbáns framtid", "link": "https://www.tv4.se/artikel/3NSIbQWY5BHxsBnU2xWCZu/foerlorade-makten-efter-16-ar-skulle-vara-vaelkommen-i-moskva", "date_display": "2026-04-12", "date_iso": "2026-04-12T21:27:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ungern", "/ungern"]}, {"id": 134, "title": "16 years of rule are over for Orbán – five points about the elections in Hungary", "summary": "After 16 years of rule, Viktor Orbán admits defeat in the parliamentary elections in Hungary. Challenger Péter Magyar from the Tisza party looks set to become the country's new prime minister. Here are five questions about Sunday's election.", "title_original": "16 års styre är över för Orbán – fem punkter om valet i Ungern", "summary_original": "Efter 16 års styre erkänner sig Viktor Orbán besegrad i parlamentsvalet i Ungern. Utmanaren Péter Magyar från partiet Tisza ser ut att bli landets nya premiärminister. Här är fem frågor om söndagens val.", "link": "https://www.dn.se/varlden/16-ars-styre-ar-over-for-orban-fem-punkter-om-valet-i-ungern/", "date_display": "2026-04-12", "date_iso": "2026-04-12T20:56:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Warns of new blow to world economy: \"Extremely serious\"", "summary": "Trump's words are predicted to cause the market to react", "title_original": "Varnar för ny smäll mot världsekonomin: ”Ytterst allvarligt”", "summary_original": "Trumps ord spås få marknaden att reagera", "link": "https://www.tv4.se/artikel/3FoySSW6teJm9sEAKi6TGB/varnar-foer-ny-smaell-mot-vaerldsekonomin-ytterst-allvarligt", "date_display": "2026-04-12", "date_iso": "2026-04-12T20:28:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 136, "title": "Leader congratulates Magyar on victory: \"Hungary chose Europe\"", "summary": "European leaders applaud the change of power in Hungary. Opposition leader Péter Magyar's victory marks \"a new chapter in Hungarian history\", writes Ulf Kristersson when the last votes are counted.", "title_original": "Ledare gratulerar Magyar till segern: ”Ungern valde Europa”", "summary_original": "Europeiska ledare applåderar maktskiftet i Ungern. Oppositionsledaren Péter Magyars seger markerar ”ett nytt kapitel i Ungerns historia”, skriver Ulf Kristersson när de sista rösterna räknas.", "link": "https://www.dn.se/varlden/ledare-gratulerar-magyar-till-segern-ungern-valde-europa/", "date_display": "2026-04-12", "date_iso": "2026-04-12T20:12:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "The leaders cheer: \"Victory for democracy\"", "summary": "\"Have chosen Europe\" • Ulf Kristersson's congratulations", "title_original": "Ledarna jublar: ”Seger för demokratin”", "summary_original": "”Har valt Europa” • Ulf Kristerssons gratulation", "link": "https://www.tv4.se/artikel/57axWXgaplWHlOxHw9MvOB/ledarna-jublar-efter-resultatet-ungern-har-valt-europa", "date_display": "2026-04-12", "date_iso": "2026-04-12T20:05:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 138, "title": "Jessica: When the leg turns blue, I ask Doctor AI", "summary": "A blue foot becomes a yellow lump in the emergency room. This means that Jessica has to wait half a day for the doctor. But at least she gets an unexpected compliment.", "title_original": "Jessica: När benet blir blått frågar jag Doktor AI", "summary_original": "En blå fot blir en gul plupp på akuten. Det betyder att Jessica får vänta ett halvt dygn på läkaren. Men hon får i alla fall en oväntad komplimang.", "link": "https://www.dn.se/kultur/jessica-nar-benet-blir-blatt-fragar-jag-doktor-ai/", "date_display": "2026-04-12", "date_iso": "2026-04-12T20:04:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "School in Sundsvall is closed after a major fire", "summary": "An apartment building with eight apartments burned down in Sundsvall on Sunday. A nearby school will be closed on Monday.", "title_original": "Skola i Sundsvall håller stängt efter storbrand", "summary_original": "Ett flerfamiljshus med åtta lägenheter har brunnit ned i Sundsvall under söndagen. En skola som ligger i närheten kommer att hålla stängt under måndagen.", "link": "https://www.dn.se/sverige/skola-i-sundsvall-haller-stangt-efter-storbrand/", "date_display": "2026-04-12", "date_iso": "2026-04-12T19:41:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Annika doesn't go out in the evening - because of wild boar: \"Hard work\"", "summary": "Several neighbors talk about an invasion of wild boar in the Frösunda area outside Stockholm - something that Mitti was the first to report on. The wild boar destroys the neighbours' plots, tears up the farmers' fields and tears up football pitches in search of food. Annika Skoog has lived in the area since the 80s and has never experienced anything like this before. - The pigs weren't here when we moved in, but they have arrived in the last five years. It has been an explosion. She shows around the garden, where the boar has left large craters. She has, as far as possible, raked and put back the grass. - There will be a lot that they turn upside down, big bastard. Aggressive sows The camera surveillance from the house sounds the alarm when the wild boar comes, and then she goes out to scare them away. They come in groups of six to eight individuals, and it is above all the sows that she is worried about. - They get scared and run away if you don't get between the coots and the sows. Then you get attacked, probably, because they are protecting their young. - All the groups came every week until I managed to scare them away properly. Generally speaking, she stays inside in the evenings, something that other neighbors in Mitti also testify to. - I avoid being out in the evenings, I have no need for it. - I also thought it was hard to go out in the forest last summer when I was picking mushrooms and berries. You don't know if you'll run into a gang that's under a tree or something like that. Big beasts visiting The last visit was four nights ago, when six wild boars were caught on film. Annika Skoog estimates that the largest animals have a height at the withers of 70–80 centimeters and weigh around 200 kilos. A neighbor has contacted the municipality, which replied that the landowners themselves are responsible for the problem, writes Mitti. Several in the neighborhood have set up alarms, electric fences and contacted the hunting team. - As a farmer, the only thing I can do is ask the hunters to come and shoot. But I think the state should take me", "title_original": "Annika går inte ut på kvällen – på grund av vildsvin: ”Jobbigt”", "summary_original": "Flera grannar berättar om en invasion av vildsvin i området Frösunda utanför Stockholm – något som Mitti var först att rapportera om. Vildsvinen förstör grannarnas tomter, bökar sönder böndernas åkrar och river upp fotbollsplaner i jakt på föda. Annika Skoog har bott i området sedan 80-talet och har aldrig tidigare varit med om något liknande. – Grisarna fanns inte här när vi flyttade in, utan de har kommit de senaste fem åren. Det har blivit en explosion. Hon visar runt i trädgården, där vildsvinen har lämnat stora kratrar efter sig. Hon har, i den mån det gått, krattat och lagt tillbaka gräset. – Det blir jättemycket som de vänder upp och ner på, stora sjok. Aggressiva suggor Kameraövervakningen från huset larmar när vildsvinen kommer, och då ger hon sig ut för att skrämma bort dem. De kommer i grupper om sex till åtta individer, och det är framför allt suggorna hon är orolig för. – De blir rädda och springer iväg om man inte kommer emellan kultingarna och suggorna. Då blir man ju anfallen, förmodligen, eftersom de skyddar sina ungar. – Alla grupper kom varje vecka tills jag lyckades skrämma bort dem ordentligt. Generellt sett håller hon sig inne på kvällarna, något som även andra grannar vittnar om i Mitti. – Jag undviker att vara ute på kvällarna, jag har inget behov av det. – Jag tyckte också att det var jobbigt att gå ut i skogen i somras när jag plockade svamp och bär. Man vet inte om man stöter på något gäng som ligger under en gran eller något sådant. Stora bjässar på besök Det senaste besöket var för fyra nätter sedan, då sex vildsvin fångades på film. Annika Skoog uppskattar att de största djuren har en mankhöjd på 70–80 centimeter och väger omkring 200 kilo. En granne har hört av sig till kommunen, som svarat att markägarna själva ansvarar för problemet, skriver Mitti. Flera i grannskapet har satt upp larm, elstängsel och kontaktat jaktlaget. – Som lantbrukare är det enda jag kan göra att be jägarna komma och skjuta. Men jag tycker att staten borde ta mer ansvar för alla skador vildsvinen orsakar, säger lantbrukaren Fredrik Andersson till tidningen.", "link": "https://www.tv4.se/artikel/2Yj85YPF2atA2DUlcp15HU/annika-gar-inte-ut-pa-kvaellen-pa-grund-av-vildsvin-jobbigt", "date_display": "2026-04-12", "date_iso": "2026-04-12T15:41:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vildsvin", "/sollentuna"]}, {"id": 141, "title": "Before the blockade in the Strait of Hormuz: \"With immediate effect\"", "summary": "The message from Trump • Will use the navy", "title_original": "Inför blockad i Hormuzsundet: ”Med omedelbar verkan”", "summary_original": "Beskedet från Trump • Ska använda flottan", "link": "https://www.tv4.se/artikel/2mHAEi2bLnvZRbw8jWcJmq/trump-infoer-blockad-i-hormuzsundet-med-omedelbar-verkan", "date_display": "2026-04-12", "date_iso": "2026-04-12T14:48:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 142, "title": "Mysterious terrorist group surprises researchers: \"No one knows about\"", "summary": "A new, unknown group has recently claimed several attacks against Jewish targets and American interests in Europe, reports CNN. But there are many indications that the organization - which calls itself Harakat Ashab al-Yamin al-Islamia - may be a construct with connections to Iran, according to terror researcher Hans Brun. - No one knows this group from before. I myself have spoken to several leading researchers in the US and no one has heard of it until now, he says. The group appeared in connection with the greatly increased tension between Iran, the United States and Israel, and has claimed responsibility for a series of acts of violence in Europe via social media.  \"Opportunities to harm the West\" The group's lack of history makes him suspicious. - Terrorist groups often have a history and they don't just appear like this out of thin air, but there is often a context from which they start, he says. - There is a lot of evidence that this is a front and that this is a way for Iran to discreetly push and remind that they have the opportunity to harm the West in many different ways. He describes it as part of Iran's long-term strategy to use means other than regular military force. - Iran can never defeat the US militarily because the US is a supermarket. However, they can use other methods, what we call asymmetric methods, says Brun. The aim is, according to Brun, to raise the costs for the opponent. - It is a way of causing political and economic damage that the opponent cannot handle, he says. Risk for Sweden Whether the group exists in practice is less important than what it is used for, he believes. - The function is the most important thing. This is a way of reminding oneself and uttering a threat. By using proxies, Iran can at the same time avoid being singled out directly. - Iran can always wash its hands and officially say that it has nothing to do with this. Then you get this political fig leaf that you can hide behind. This type of attack is", "title_original": "Mystiska terrorgruppen förvånar forskare: ”Ingen som känner till”", "summary_original": "En ny, okänd grupp har den senaste tiden tagit på sig flera attacker mot judiska mål och amerikanska intressen i Europa, det rapporterar CNN. Men mycket tyder på att organisationen – som kallar sig Harakat Ashab al‑Yamin al‑Islamia – kan vara en konstruktion med kopplingar till Iran, enligt terrorforskaren Hans Brun. – Det är ingen som känner till den här gruppen sedan tidigare. Jag har själv pratat med flera ledande forskare i USA och ingen har hört talas om den förrän nu, säger han. Gruppen dök upp i samband med den kraftigt ökade spänningen mellan Iran, USA och Israel, och har via sociala medier hävdat ansvar för en rad våldsdåd i Europa.  ”Möjligheter att skada västvärlden” Att gruppen saknar historik gör honom misstänksam. – Ofta har terrorgrupper en historik och de dyker inte bara upp så här i tomma intet utan det finns ofta ett sammanhang som de utgår ifrån, säger han. – Väldigt mycket talar för att det här är en front och att det här är ett sätt för Iran att lite diskret trycka till och påminna om att de har möjlighet att skada västvärlden på många olika sätt. Han beskriver det som en del av Irans långsiktiga strategi att använda andra medel än reguljärt militärt våld. – Iran kan aldrig besegra USA militärt eftersom USA är en supermarkt. Däremot kan de använda andra metoder, det som vi kallar för asymmetriska metoder, säger Brun. Syftet är, enligt Brun, att höja kostnaderna för motståndaren. – Det är ett sätt att orsaka politiska och ekonomiska skador som motståndaren inte kan hantera, säger han. Risk för Sverige Om gruppen existerar i praktiken är mindre viktigt än vad den används till, menar han. – Funktionen är det viktigaste. Det här är ett sätt att göra sig påmind och uttala ett hot. Genom att använda ombud kan Iran samtidigt undvika att pekas ut direkt. – Iran kan hela tiden två sina händer och officiellt säga att de inte har någonting med det här att göra. Då får man det här politiska fikonlövet som man kan gömma sig bakom. Den här typen av attacker är redan en del av vardagen i Europa, enligt Brun, och Sverige är inget undantag. – Det finns en risk att det genomförs attacker i Sverige. I första hand mot judiska eller israeliska mål och mot oppositionella som är ett politiskt problem för regimen i Iran.", "link": "https://www.tv4.se/artikel/1OrLKpV8aQ6LrTcBwEuNXO/mystiska-terrorgruppen-foervanar-forskare-ingen-som-kaenner-till", "date_display": "2026-04-12", "date_iso": "2026-04-12T14:26:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/brott-och-straff", "/terrorism", "/terrorhot", "/terrordad", "/experter", "/hans-brun"]}, {"id": 143, "title": "Wants to leave Sweden after the threats: \"Will not live a long life\"", "summary": "In the documentary \"Strejkarna\" the Swedish climate movement \"Fridays for future\" is portrayed as a school strike outside the Riksdag to draw attention to the climate issue. Several of them testify about how it felt like the entire climate issue was being applied to a group of young people with worries about the future. - If you zoom out, the situation is so damn absurd, that you still have to laugh at it. It was like some neurodivergent children who got the responsibility of the whole world on their shoulders while the fossil lobby, politicians and the media worked against one, says Greta Thunberg in an interview with the newspaper Dagens ETC. \"Will not live a long life\" In connection with the Iran-backed terrorist group Hamas' attack on Israel on October 7 and the subsequent war in Gaza, the view of the movement changed. Many who had previously praised their efforts turned against them. The development has taken its toll on Thunberg and the others in the movement. One of the documentary's scenes depicts Thunberg's journey with the Freedom flotilla to break Israel's blockade of Gaza. She testifies about the pressure she lives under. - I will not live a long life, I have accepted that. But I'd rather do everything I can to improve things, instead of living in some false comfort, says Thunberg, Dagens ETC reports. Considering leaving the country Many of the activists no longer feel safe in Sweden because of threats and hatred. Greta Thunberg is no exception. She is currently studying to become a nurse and is considering leaving Sweden. She doesn't want to go into where she wants to move, and she says it might be a mobile existence. - The plan is to mostly live in a backpack and sleep on friends' kitchen floors.", "title_original": "Vill lämna Sverige efter hoten: ”Kommer inte leva ett långt liv”", "summary_original": "I dokumentären ”Strejkarna” skildras den svenska klimatrörelsen ”Fridays for future” som skolstrejkade utanför riksdagen för att uppmärksamma klimatfrågan. Flera av dem vittnar om hur det kändes som att hela klimatfrågan lämpades över på en grupp ungdomar med framtidsoro. – Zoomar man ut så är ju situationen så jävla absurd, att man ändå måste skratta åt det. Det var liksom några neurodivergenta barn som fick hela världens ansvar på sina axlar samtidigt som fossillobbyn, politiker och media arbetade mot en, säger Greta Thunberg i en intervju med tidningen Dagens ETC. ”Kommer inte leva ett långt liv” I samband med den Iranstödda terrorgruppen Hamas attack mot Israel 7 oktober och det efterföljande kriget i Gaza förändrades synen på rörelsen. Många som tidigare hyllat deras insatser vände sig mot dem. Utvecklingen har tärt på Thunberg och de andra i rörelsen. En av dokumentärens scener skildrar Thunbergs resa med Freedom flotilla för att bryta Israels blockad av Gaza. Hon vittnar om pressen hon lever under. – Jag kommer inte leva ett långt liv, det har jag accepterat. Men jag gör hellre allt jag kan för att förbättra saker, i stället för att leva i någon falsk bekvämlighet, säger Thunberg rapporterar Dagens ETC. Överväger att lämna landet Många av aktivisterna känner sig inte längre trygga i Sverige på grund av hot och hat. Greta Thunberg är inget undantag. Hon studerar numera till undersköterska och funderar på att lämna Sverige. Var hon vill flytta vill hon inte gå in på, och hon säger att det kanske blir en rörlig tillvaro. – Planen är väl mest att leva i en ryggsäck och sova på vänners köksgolv.", "link": "https://www.tv4.se/artikel/2kZbZ3OaXKK972g2Yu7Fp7/vill-laemna-sverige-efter-hoten-kommer-inte-leva-ett-langt-liv", "date_display": "2026-04-12", "date_iso": "2026-04-12T11:51:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/greta-thunberg", "/klimatkrisen"]}, {"id": 144, "title": "GW's rage against \"culture bearers\" - 40 years after the brutal massacre", "summary": "The two doctors who were singled out in the murder of Catrine da Costa will now apply for compensation from the state. According to Leif GW Persson, it is both reasonable and necessary. - That's what remains, to get some reasonable justice on this. All thinking people realize that they have nothing to do with this, but their lives have been shattered, he says. The doctors lost their credentials and, according to GW Persson, have never received any real compensation. - Their identification cards were withdrawn, it was not possible to appeal. But they haven't gotten any right on that either. Then there remains the fact that you would still receive compensation, he says. An apology According to him, financial compensation would also mean an acknowledgment of guilt on the part of the state. - It also means an apology. They say that we have made a mistake and therefore you will now receive financial compensation.  How big the compensation can be remains to be seen. In the mentioned Kevin case, the two brothers received one million kroner each. - The doctors should reasonably receive significantly more. Given that their lives have been shattered over a 40-year period. The money they lost is probably many millions in earned income, says GW Persson. He emphasizes that the financial damage is only part of the whole. - Difficult to put a price on that, of course, plus all the other suffering that has come with it, he says. Leif GW Persson is deeply critical of how the state and the legal community handled the investigation. - The investigation was frankly deplorable. It was slanderous from day one. There was a complete lack of evidence, he says. Feminist issue The case became a highly charged social debate and a central feminist issue. Above all, representatives of the radical feminist movement argued for the doctors' guilt and saw the murder in a larger context of men's violence against women and exploitation in prostitution. - It brought with it an awful lot of cultural carriers who don't have a clue about police work or law", "title_original": "GW:s ilska mot ”kulturbärare” –    40 år efter brutala styckmordet", "summary_original": "De två läkare som pekades ut i styckmordet på Catrine da Costa kommer nu att ansöka om ersättning från staten. Enligt Leif GW Persson är det både rimligt och nödvändigt. – Det är det som återstår, att få någon rimlig rätsida på det här. Alla tänkande människor inser väl att de inte har någonting med det här att göra, men deras liv har slagits sönder, säger han. Läkarna förlorade sina legitimationer och har enligt GW Persson aldrig fått någon verklig upprättelse. – Deras legitimationer drogs in, det gick inte att överklaga. Men det har man inte fått någon rätsida på heller. Då återstår det här med att man ändå skulle få en kompensation, säger han. En ursäkt En ekonomisk ersättning skulle enligt honom också innebära ett erkännande av skuld från statens sida. – Det innebär samtidigt en ursäkt. Man säger att vi har gjort fel och därför så får ni nu ekonomisk kompensation.  Hur stor ersättningen kan bli återstår att se. I det omtalade Kevinfallet fick de två bröderna en miljon kronor var. – Läkarna borde rimligen få betydligt mer. Med tanke på att deras liv slagits sönder under en 40-årsperiod. De pengar som de förlorat är säkert många miljoner i arbetsinkomst, säger GW Persson. Han betonar att den ekonomiska skadan bara är en del av helheten. – Svårt att sätta pris på det naturligtvis, plus alla de andra lidanden som har följt med, säger han. Leif GW Persson är djupt kritisk till hur staten och rättssamhället hanterat utredningen. – Utredningen var rent ut sagt bedrövlig. Det var ju förtalsmässigt från första dagen. Det saknades helt bevisning, säger han. Feministisk stridsfråga Fallet kom att bli en starkt laddad samhällsdebatt och en central feministisk stridsfråga. Framför allt företrädare för den radikalfeministiska rörelsen argumenterade för läkarnas skuld och såg styckmordet i ett större sammanhang av mäns våld mot kvinnor och exploatering inom prostitution. – Det fick med sig en förskräcklig massa kulturbärare som inte har en susning om polisarbete eller juridik för den delen. De gav sitt starka, oreserverade stöd till det här övergreppet, säger GW Persson. Han menar att det hade sett annorlunda ut om de två männen inte var läkare.  – Hade de varit rörmokare hade det aldrig blivit någon rättssak av detta, säger han.  – Det var själva korken som det hela hängde på. Det mår den väl göra i något slags politiskt sammanhang, men det har ingenting att göra i det rättsliga sammanhanget. Som bevisning är det obefintligt.", "link": "https://www.tv4.se/artikel/28NKXcDKNCX7Dg9eGvvJ1D/gw-s-ilska-mot-kulturbaerare-40-ar-efter-brutala-styckmordet", "date_display": "2026-04-12", "date_iso": "2026-04-12T10:53:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/da-costa-fallet", "/rattsfall", "/personer/leif-gw-persson", "/lakare"]}, {"id": 145, "title": "Linnéa had a fit of laughter at BB - then she was forcibly taken into custody", "summary": "Linnéa Karlsson already started speaking incoherently in the hospital after her first birth, had fits of laughter and could not sleep. Although her husband raised the alarm several times, it took a while before the care staff understood the seriousness. When Linnéa was finally committed to a psychiatric ward, she had not slept for several days. - It was terrible to have to part with my son. I felt alone and didn't understand that I was sick, she says. Higher risk of being affected again After a week of treatment with rest and medication, Linnéa was able to return home. But she only processed the trauma afterwards. - For my family, the trauma was when I was sick, but for me it started when I woke up and realized what had happened, says Linnéa. When she became pregnant again, she knew that the risk of getting pregnant again was high - about 50 percent higher than if she had not been pregnant before. But this time she received support from specialist maternity care early in the pregnancy and a clear plan was in place should the symptoms return. - I am an optimist, but my husband was very worried. We talked a lot and I received fantastic help from the care, says Linnéa Karlsson. Important warning signs Lovisa Järnmark, senior physician in psychiatry and active in specialist maternity care, believes that postpartum psychosis often develops quickly, usually within the first weeks after childbirth. - Incredible sleep difficulties, anxiety and personality changes are important signals that something is not right, says Lovisa Järnmark. She emphasizes that there is a big difference between ordinary fatigue and the restlessness and anxiety that can occur in psychosis. The condition often requires emergency care, where sleep therapy, medication and sometimes electrical therapy may be relevant. The importance of help Lovisa Järnmark emphasizes the importance of relatives being aware of changes and seeking help in case of concern. - You should not leave the woman alone with the child if you suspect postpartum psychosis, but seek emergency help, says Lovisa Järnmark. For Linnéa Karlsson, it was decisive.", "title_original": "Linnéa fick skrattanfall på BB – sedan blev hon tvångsintagen", "summary_original": "Redan på BB efter första förlossningen började Linnéa Karlsson prata osammanhängande, fick skrattanfall och kunde inte sova. Trots att hennes man slog larm flera gånger dröjde det innan vården förstod allvaret. När Linnéa till slut blev tvångsintagen på psykiatrisk avdelning hade hon inte sovit på flera dygn. – Det var jättehemskt att behöva skiljas från min son. Jag kände mig ensam och förstod inte att jag var sjuk, säger hon. Högre risk att drabbas igen Efter en veckas behandling med vila och medicin kunde Linnéa återvända hem. Men traumat bearbetade hon först efteråt. – För min familj var traumat när jag var sjuk, men för mig började det när jag vaknade upp och insåg vad som hänt, säger Linnéa. När hon blev gravid igen visste hon att risken för att drabbas på nytt var hög – omkring 50 procent högre än om hon inte hade drabbats tidigare. Men den här gången fick hon stöd från specialistmödravården redan tidigt i graviditeten och en tydlig plan fanns om symtomen skulle komma tillbaka. – Jag är en optimist, men min man var väldigt orolig. Vi pratade mycket och jag fick fantastisk hjälp av vården, säger Linnéa Karlsson. Viktiga varningssignaler Lovisa Järnmark, överläkare i psykiatri och verksam inom specialistmödravården, menar att förlossningspsykos ofta utvecklas snabbt, vanligtvis inom de första veckorna efter förlossningen. – Otroliga sömnsvårigheter, ångest och personlighetsförändring är viktiga signaler på att något inte stämmer, säger Lovisa Järnmark. Hon betonar att det är stor skillnad mellan vanlig trötthet och den rastlöshet och ångest som kan uppstå vid psykos. Tillståndet kräver ofta akut vård, där sömnbehandling, läkemedel och ibland elbehandling kan bli aktuellt. Vikten av hjälp Lovisa Järnmark understryker vikten av att närstående är uppmärksamma på förändringar och söker hjälp vid oro. – Man ska inte lämna kvinnan ensam med barnet om man misstänker förlossningspsykos, utan söka akut hjälp, säger Lovisa Järnmark. För Linnéa Karlsson var det avgörande. – Man har väldigt låg sjukdomsinsikt under en psykos. Jag tyckte inte att jag var sjuk, säger hon. Vill öka kunskapen I dag föreläser Linnéa om psykisk ohälsa för att fler ska våga söka hjälp och för att öka kunskapen om förlossningspsykos. – Att jag kan sitta här och prata om det visar att man kan bli frisk. Jag vill att andra ska veta att det går att ta sig igenom det, säger Linnéa Karlsson.", "link": "https://www.tv4.se/artikel/4o8KlId6ENVYfarqeGv2yG/linnea-drabbades-av-foerlossningspsykos-tva-ganger-kaende-mig", "date_display": "2026-04-12", "date_iso": "2026-04-12T10:49:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/forlossning", "/sjukvard"]}, {"id": 146, "title": "Have boarded a new ship outside Ystad - the fourth in a short time", "summary": "The vessel Hui Yuan was discovered by the Coast Guard's flight southeast of Gotland on Saturday and is suspected of violating the environmental code. According to the Coast Guard, the ship must have been seen flushing carbon residues into the sea, which is against the provisions of the Environmental Code. Hui Yuan was boarded by order of the Prosecutor's Office outside Ystad at eight o'clock on Sunday morning. \"Shipping should know that the Swedish authorities work together to maintain order at sea. We act to increase maritime safety and protect the environment. If there is a suspicious vessel, we intervene based on the prevailing conditions,\" says Daniel Stenling, deputy head of the Coast Guard's operational department, in the press release. Has accepted a penalty order A preliminary investigation was started and the master has been served with suspicion of crime. - He has admitted that he knew the rules and has accepted a penalty order of 50 daily fines of SEK 500 - that is, SEK 25,000 in total, says Håkan Andersson, senior prosecutor at the national unit for environmental and work environment cases. The bulk carrier anchored off Ystad pending an investigation, according to the Coast Guard. - For our part, the matter has been acted out. We will issue penalty orders and must be approved according to standard procedures. The investigation phase is complete and we have no interest in the ship being detained, says Håkan Andersson. Was en route from Russia The bulk carrier Hui Yuan is registered in Panama and was en route from Russia to Las Palmas in Spain when they were boarded. - This is the fourth operation in a fairly short time, says Karin Cars, press spokesperson at the Coast Guard. All ships have been boarded after leaving ports in Russia. Several of the ships have been part of the so-called shadow fleet that transports oil from Russia. However, Hui Yuan has not been suspected of being part of the Shadow Fleet. - It is nothing that I have handled within the framework of this, says Håkan Andersson.", "title_original": "Har bordat nytt fartyg utanför  Ystad – det fjärde på kort tid", "summary_original": "Fartyget Hui Yuan upptäcktes av Kustbevakningens flyg sydost om Gotland under lördagen och misstänks för brott mot miljöbalken. Enligt Kustbevakningen ska fartyget ha setts spola kolrester ner i havet, vilket strider mot bestämmelserna i miljöbalken. Hui Yuan bordades på order av Åklagarmyndigheten utanför Ystad vid åttatiden på söndagsmorgonen. ”Sjöfarten ska veta att svenska myndigheter tillsammans upprätthåller ordningen till sjöss. Vi agerar för att öka sjösäkerheten och skydda miljön. Finns ett misstänkt fartyg ingriper vi utifrån rådande förutsättningar”, säger Daniel Stenling, biträdande chef för Kustbevakningens operativa avdelning, i pressmeddelandet. Har accepterat strafföreläggande En förundersökning inleddes och befälhavaren har blivit delgiven misstanke om brott. – Han har erkänt att han kände till reglerna och har accepterat ett strafföreläggande om 50 dagsböter på 500 kronor – det vill säga 25 000 kronor totalt, säger Håkan Andersson, senior åklagare vid riksenheten för miljö- och arbetsmiljömål. Bulkfartyget ankrade utanför Ystad i väntan på utredning, enligt Kustbevakningen. – För vår del är saken utagerad. Vi kommer att utfärda strafföreläggande och ska godkännas efter gängse rutiner. Utredningsfasen är klar och vi har inget intresse i att fartyget hålls kvar, säger Håkan Andersson. Var på väg från Ryssland Bulkfartyget Hui Yuan är registrerat i Panama och var på väg från Ryssland till Las Palmas i Spanien när de bordades. – Det här är den fjärde insatsen på ganska kort tid, säger Karin Cars, presstalesperson på Kustbevakningen. Samtliga fartyg har bordats efter att de lämnat hamnar i Ryssland. Flera av fartygen har ingått i den så kallade skuggflottan som fraktar olja från Ryssland. Hui Yuan har dock inte misstänks ingå skuggflottan. – Det är ingenting som jag har hanterat inom ramen för det här, säger Håkan Andersson.", "link": "https://www.tv4.se/artikel/iJipD6LGaKjRrKdU6caNB/kustbevakningen-har-bordat-nytt-fartyg", "date_display": "2026-04-12", "date_iso": "2026-04-12T07:56:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/skuggflottan"]}, {"id": 147, "title": "Here, the Swedish invention rides in the archipelago - can carry bombs", "summary": "Russia's invasion of Ukraine has changed the way wars are fought. Cheap drones and autonomous systems are used in droves – both in the air and at sea. At the same time, the war has shown how vulnerable modern technology can be. That satellite navigation is disrupted or manipulated is already commonplace in the Baltic Sea, something that both aviation and shipping repeatedly report on.  - The problem with GPS is that it is very easy to disrupt the system. Therefore, the drone boats can navigate without it, says Gustaf von Grothusen, CEO and co-founder of the company behind the technology.  Thousands of autonomous boats The researchers behind the technology imagine a future where many autonomous boats move in the archipelago. In peacetime they could be used for surveillance and reconnaissance.  - There is a lot of espionage in the Stockholm archipelago. Autonomous systems can move there and detect changes in the environment, says Andreas Jakobsson, professor of mathematical statistics at Lund University of Technology.  Can be equipped with bombs Should the situation become more conflict-ridden, the craft can also carry various types of weapon systems and perform kamikaze missions. One idea is that they should be able to block narrow straits or attack enemy ships. - A large part of this is a deterrent effect. That you know you can't get in, because then you'll be lowered, says Andreas Jakobsson. Inspiration from Ukraine The development is largely driven by the experiences from the war in Ukraine. There, drones are used on a huge scale – often cheap systems that are produced in large quantities. Defense experts believe that future warfare may be less about single large ships and more about swarms of autonomous systems.  - In the future, you will probably have to have cheap systems that can be mass-produced and be in many places at the same time, says Andreas.  Can protect soldiers For Gustaf von Grothusen there is also a more personal driving force. He himself serves as a combat boat commander within the amphibious regiment. During exercises in the archipelago, he began to think about how the technology would work", "title_original": "Här åker svenska uppfinningen i skärgården – kan bära på bomber", "summary_original": "Rysslands invasion av Ukraina har förändrat hur krig utkämpas. Billiga drönare och autonoma system används i massor – både i luften och till havs. Samtidigt har kriget visat hur sårbar modern teknik kan vara. Att satellitnavigation störs eller manipuleras är också redan nu vardag i Östersjön, något som både flyg och sjöfart återkommande rapporterar om.  – Problemet med GPS är att det är väldigt enkelt att störa ut systemet. Därför kan drönarbåtarna navigera utan det, säger Gustaf von Grothusen, vd och medgrundare till företaget bakom tekniken.  Tusentals autonoma båtar Forskarna bakom tekniken föreställer sig en framtid där många autonoma båtar rör sig i skärgården. I fredstid skulle de kunna användas för övervakning och spaning.  – Det sker en hel del spionverksamhet i Stockholms skärgård. Autonoma system kan röra sig där och upptäcka förändringar i miljön, säger Andreas Jakobsson, professor i matematisk statistik vid Lunds tekniska högskola.  Kan bestyckas med bomber Om situationen skulle bli mer konfliktfylld kan farkosterna också bära olika typer av vapensystem och utföra kamikaze-uppdrag. En idé är att de ska kunna blockera smala sund eller angripa fientliga fartyg. – En stor del av det här är ju en avskräckande effekt. Att man vet att det inte går att ta sig in för då blir man sänkt, säger Andreas Jakobsson. Inspiration från Ukraina Utvecklingen drivs till stor del av erfarenheterna från kriget i Ukraina. Där används drönare i enorm skala – ofta billiga system som produceras i stora mängder. Försvarsexperter menar att framtidens krigföring kan handla mindre om enstaka stora fartyg och mer om svärmar av autonoma system.  – I framtiden måste man troligen ha billiga system som kan massproduceras och finnas på många platser samtidigt, säger Andreas.  Kan skydda soldater För Gustaf von Grothusen finns också en mer personlig drivkraft. Han tjänstgör själv som stridsbåtschef inom amfibieregementet. Under övningar i skärgården började han fundera på hur tekniken skulle kunna minska riskerna för soldater.  – Om vi har bättre teknik kanske vi inte behöver ha lika mycket folk ute i terrängen. Då kan autonoma system ta en del av de farliga uppgifterna, säger han.", "link": "https://www.tv4.se/artikel/1s32LHVB0DKHIGoOu4d7hz/haer-aker-droenarbat-i-svenskt-vatten-kan-baera-pa-bomber", "date_display": "2026-04-12", "date_iso": "2026-04-12T07:31:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/svenska-forsvaret", "/dronarbatar", "/kriget-i-ukraina/svenskaberedskapen"]}, {"id": 148, "title": "Trump went to the UFC gala - while \"the world is on fire\"", "summary": "Criticized for the election – amid peace talks in Islamabad • Applause and boos", "title_original": "Trump gick på UFC-gala – medan ”världen står i brand”", "summary_original": "Kritiseras för valet – mitt under fredssamtalen i Islamabad • Applåder och burop", "link": "https://www.tv4.se/artikel/4wVpyfoLvohBM5yZZiXOuj/trump-gick-pa-ufc-gala-medan-vaerlden-star-i-brand", "date_display": "2026-04-12", "date_iso": "2026-04-12T06:31:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 149, "title": "\"Get an answer right away: You will become strong, tight, athletic\"", "summary": "Using AI as a PT is basically free. But maybe it takes more than likely answers to build muscle—and someone who doesn't just agree.", "title_original": "”Får svar direkt: Du ska bli stark, tight, atletisk”", "summary_original": "Att använda AI som PT är i princip gratis. Men kanske krävs mer än sannolika svar för att bygga muskler – och någon som inte bara håller med.", "link": "https://www.svd.se/a/ArLyan/ai-som-pt-tranade-med-chat-gpt-brot-ny-mark", "date_display": "2026-04-12", "date_iso": "2026-04-12T04:16:52+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Livet"]}, {"id": 150, "title": "He received an award for his active bridge-building between church and academia", "summary": "Samuel Rubenson received this year's Anders Nygren prize: I am very surprised as my work has always been critical of Anders Nygren and the tradition from him", "title_original": "Han fick pris för sitt aktiva brobyggande mellan kyrka och akademi", "summary_original": "Samuel Rubenson fick årets Anders Nygren-pris: Jag är väldigt överraskad då mitt arbete alltid varit kritiskt mot just Anders Nygren och traditionen från honom", "link": "https://www.dagen.se/familj/han-fick-pris-foer-sitt-aktiva-brobyggande-mellan-kyrka-och-akademi/10284887", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "\"I try to remind people of the value they themselves represent\"", "summary": "Kjell Olof Bohlin publishes his first book of poems after many years of poetry writing - Göte Strandsjö one of those who previously encouraged him", "title_original": "”Jag försöker påminna människor om det värde de själva utgör”", "summary_original": "Kjell Olof Bohlin ger ut sin första diktbok efter många års diktskrivande – Göte Strandsjö en av de som tidigare uppmuntrat honom", "link": "https://www.dagen.se/familj/jag-foersoeker-paminna-maenniskor-om-det-vaerde-de-sjaelva-utgoer/10260771", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "The Church of Sweden will soon be a minority church", "summary": "\"How does an institution behave that suddenly has to earn its place instead of inheriting it?\" asks Martin Ånestrand, who has read \"A quiet whisper - The Swedish Church in the time of becoming a minority\"", "title_original": "Svenska kyrkan är snart en minoritetskyrka", "summary_original": "”Hur beter sig en institution som plötsligt måste förtjäna sin plats i stället för att ärva den?” frågar sig Martin Ånestrand som har läst ”En stilla susning – Svenska kyrkan i minoritetsblivandets tid”", "link": "https://www.dagen.se/kultur/svenska-kyrkan-aer-snart-en-minoritetskyrka/10283700", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "\"We are like paired horses, we push forward in the same direction\"", "summary": "After 17 years on the mission field in Southeast Asia, Daniel and Paulina Brolin lead a Swedish Pentecostal congregation.", "title_original": "”Vi är som parhästar, vi trycker framåt åt samma håll”", "summary_original": "Efter 17 år på missionsfältet i Sydostasien leder Daniel och Paulina Brolin en svensk pingstförsamling.", "link": "https://www.dagen.se/livsstil/vi-aer-som-parhaestar-vi-trycker-framat-at-samma-hall/10290529", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Now worshipers are allowed to visit Jerusalem's sanctuaries again", "summary": "With a fragile ceasefire in effect, the city's holy sites are reopening.", "title_original": "Nu får bedjare besöka Jerusalems helgedomar igen", "summary_original": "Med bräckligt eldupphör i kraft öppnar stadens heliga platser på nytt.", "link": "https://www.dagen.se/nyheter/nu-far-bedjare-besoeka-jerusalems-helgedomar-igen/10293340", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "The KD leader: \"Ormyngel's offspring\" can be said instead of \"packet\"", "summary": "Ebba Busch defends words against immigrants who commit crimes with Bible words - mixed from two Bible translations.", "title_original": "KD-ledaren: ”Ormyngels avföda” kan sägas i stället för ”packet”", "summary_original": "Ebba Busch försvarar ord mot invandrare som begår brott med bibelord – som blandats från två bibelöversättningar.", "link": "https://www.dagen.se/nyheter/kd-ledaren-ormyngels-avfoeda-kan-saegas-i-staellet-foer-packet/10293243", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Tired of modern hymns?", "summary": "Here are five Christian indie artists you should check out", "title_original": "Har du tröttnat på modern lovsång?", "summary_original": "Här är fem kristna indieartister du borde spana in", "link": "https://www.dagen.se/kultur/har-du-troettnat-pa-modern-lovsang/10286043", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Church leaders in Hungary feel worried and appeal for calm ahead of the election", "summary": "The Methodist pastor who ordained Viktor Orbán disapproves of the prime minister's Christian nationalism.", "title_original": "Kyrkoledare i Ungern känner oro och vädjar om lugn inför valet", "summary_original": "Metodistpastorn som vigde Viktor Orbán underkänner premiärministerns kristna nationalism.", "link": "https://www.dagen.se/nyheter/kyrkoledare-i-ungern-kaenner-oro-och-vaedjar-om-lugn-infoer-valet/10293111", "date_display": "2026-04-12", "date_iso": "2026-04-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Several MAGA profiles leave the Trump ship: \"A deranged supervillain\"", "summary": "The American far-right conspiracy theorist Alex Jones, who has been an important part of the MAGA movement, is now of the opinion that Donald Trump \"is under the influence of demons\" and behaves like a \"supervillain\". Alex Jones is known for his platform Infowars, where Trump has been a guest several times. On the site, where he often has live broadcasts, he has said things such as that the school shooting in Sandy Hook was \"completely fake\" and that a chemical bomb from the Pentagon made the majority of America's frogs gay. \"Deranged supervillain\" Alex Jones has praised Trump over the years. But now he distances himself from the president, above all after his threat that \"a civilization will die\" the other day, when he was referring to Iran. \"Trump literally sounds like a deranged supervillain from a Marvel movie. THIS IS NOT WHAT WE VOTED FOR!!\" wrote Alex Jones in a post on X. And he's not alone. Several MAGA profiles such as Marjorie Taylor-Greene and Tucker Carlson have distanced themselves from the president after dissatisfaction with how he handled the Epstein documents, but also because of the Iran war. Trump's response: \"Low IQ\" Trump has gone out in a post on Truth Social, naming several, including Carlson, Jones and Taylor-Greene, and now calling his former allies \"lunatics\", \"troublemakers\" and \"losers\" with \"low IQ\". \"As president, I could get them on my side whenever I want, but when they call I don't answer, because I'm too busy with foreign and domestic politics. After a few times, they get nasty,\" writes the president.", "title_original": "Flera MAGA-profiler lämnar Trump-skeppet: ”En rubbad superskurk”", "summary_original": "Den amerikanske högerextrema konspirationsteoretikern Alex Jones, som varit en viktig del av MAGA-rörelsen, är nu av uppfattningen att Donald Trump ”är under påverkan av demoner” och beter sig som en ”superskurk”. Alex Jones är känd för sin plattform Infowars där Trump gästat flera gånger. På sajten, där han ofta har livesändningar, har han bland annat sagt saker som att skolskjutningen i Sandy Hook var ”helt fejkad” och att en kemikaliebomb från Pentagon gjort majoriteten av USA:s grodor homosexuella. ”Rubbad superskurk” Alex Jones har genom åren hyllat Trump. Men nu tar han alltså avstånd från presidenten, framför allt efter dennes hot om att ”en civilisation kommer att dö” häromdagen, då han syftade på Iran. ”Trump låter bokstavligen som en rubbad superskurk från en Marvelfilm. DET HÄR ÄR INTE VAD VI RÖSTADE PÅ!!”, skrev Alex Jones i ett inlägg på X. Och han är inte ensam. Flera MAGA-profiler som Marjorie Taylor-Greene och Tucker Carlson har tagit avstånd från presidenten efter missnöje med hur han hanterat Epsteindokumenten, men även på grund av Irankriget
