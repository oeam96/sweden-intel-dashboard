king, I can think that it is problematic that economic knowledge is low so that you do not understand what it is. When she raises the reasoning, she is often met with criticism. - The reactions I usually get are that I'm a party pooper, people say \"let me be happy for my money\". But that's not what I mean, it's clear that you should be happy, she says. Felicia Schön understands that her opinion can be provocative, but believes that her intentions are good. - It is clear that I understand that you are happy when you receive a lump sum. But what I want to spread is how not to be taken advantage of by the system.", "title_original": "Experten förklarar: Därför ska du INTE jubla över återbäringen", "summary_original": "I början av mars får många sin skatteåterbäring och ser det som ”gratis pengar”, enligt sparekonomen Felicia Schön på Avanza bank. Hon menar tvärtom att det är ett bevis på att man lånat ut pengar till staten – helt gratis. – Många ser det ju som en gåva, men det är verkligen en tankevurpa. Kan gå miste om avkastning Felicia Schön säger att hög skatteåterbäring bara är ett glädjebesked om pengarna ändå inte hade sparats. Annars vill man få tillbaka en låg summa. – Rent ekonomiskt är en hög siffra inte så önskvärt. Egentligen vill man ligga någonstans runt plus minus noll i skatteåterbäring, säger Felicia Schön. Enligt henne använder många skatteåterbäringen som ett slags sparande, exempelvis till semestern. Men hon menar att det vore bättre att investera pengarna. – Snittet för skatteåterbäringen är 13 000 kronor. Räknar man med snittavkastningen på 7 procent så är det ungefär 1 000 kronor på ett år, säger Felicia Schön. ”Jag är en party pooper” Har du digital brevlåda kommer deklarationen 2–6 mars, annars med posten senast 15 april. Felicia Schön menar att missuppfattningen kring skatteåterbäringen är oroande. – Generellt sett kan jag tycka att det är problematiskt att den ekonomiska kunskapen är låg så att man inte förstår vad det är för någonting. När hon lyfter resonemanget möts hon ofta av kritik. – Reaktionerna som jag brukar få är att jag är en party pooper, folk säger ”låt mig få vara glad för mina pengar”. Men det är inte det jag menar, det är klart att man ska få bli glad, säger hon. Felicia Schön förstår att hennes åsikt kan vara provocerande, men menar att hennes intentioner är goda. – Det är klart att jag förstår att man blir glad när man får en klumpsumma. Men det som jag vill sprida är hur man inte ska bli utnyttjad av systemet.", "link": "https://www.tv4.se/artikel/75Vzd3EbbvdKUylg5649I4/experten-foerklarar-daerfoer-ska-du-inte-jubla-oever-aterbaeringen", "date_display": "2026-03-03", "date_iso": "2026-03-03T15:18:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Ekonomi", "/ekonomi", "/skatteverket", "/skatteaterbaring", "/sparande", "/privatekonomi", "/deklaration"]}, {"id": 164, "title": "Iran war day four: Spiral of violence in the region", "summary": "The attacks spread to more countries", "title_original": "Irankriget dag fyra: Våldsspiral i regionen", "summary_original": "Attackerna sprider sig till fler länder", "link": "https://www.dagen.se/nyheter/irankriget-dag-fyra-valdsspiral-i-regionen/10233168", "date_display": "2026-03-03", "date_iso": "2026-03-03T15:09:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 165, "title": "That is why the US chose to attack Iran", "summary": "Political scientist: \"It is difficult to see that there will be a happy outcome\"", "title_original": "Därför valde USA att slå till mot Iran", "summary_original": "Statsvetare: ”Att det blir en lycklig utgång är svårt att se”", "link": "https://www.dagen.se/nyheter/daerfoer-valde-usa-att-sla-till-mot-iran/10230811", "date_display": "2026-03-03", "date_iso": "2026-03-03T15:05:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "In the war against Iran, Netanyahu is supported by his critics", "summary": "Arne Lapidus: If it leads to the breaking of the rule of the fanatical ayatollahs, it is worth the sacrifices, people say.", "title_original": "I kriget mot Iran får Netanyahu stöd från sina kritiker", "summary_original": "Arne Lapidus: Om det leder till att de fanatiska ayatollornas välde bryts är det värt uppoffringarna, säger folk.", "link": "https://www.dagen.se/nyheter/i-kriget-mot-iran-far-netanyahu-stoed-fran-sina-kritiker/10232767", "date_display": "2026-03-03", "date_iso": "2026-03-03T15:04:45+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 167, "title": "Are the attacks on Iran justified?", "summary": "The collapse of the board and the possible disintegration of the country may well worsen the situation significantly for the Iranian people, regardless of how unjust or tyrannical the regime may be, writes Johan Eddebo.", "title_original": "Är angreppen på Iran rättfärdiga?", "summary_original": "Styrets kollaps och landets eventuella sönderfall kan mycket väl försämra situationen avsevärt för det iranska folket, oavsett hur orättfärdig eller tyrannisk regimen må vara, skriver Johan Eddebo.", "link": "https://www.dagen.se/debatt/aer-angreppen-pa-iran-raettfaerdiga/10231251", "date_display": "2026-03-03", "date_iso": "2026-03-03T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 168, "title": "Naked family man fought back against intruders - in the middle of the night", "summary": "One August night, a family in Uppsala woke up to the patio door being smashed downstairs. The father ran down the stairs, with no clothes on, where he found two masked robbers.  Some sort of scuffle ensued and the father received a deep knife wound in one arm, before the duo fled the scene. The man, who sells exclusive goods in his shop in Uppsala, was a carefully planned target and the robbery attempt was preceded by solid planning. The prosecutor has been able to prove this via decrypted chats that TV4 Nyheterna has seen. Got weapons and \"printer's flat\" The two men, one in his 20s, the other in his 25s, had undertaken the robbery on behalf of other men. In the chats, it is clear how the principals produced weapons, an address and a so-called \"printer's apartment\" for the robbers. \"Brothers, when you go in, say o take everyone's phones in there and turn them off immediately, hit them hard from the beginning so they end up in shock and fasten them somewhere o check everything in the house o check their crypto whatever it is take everything, pair gold watches take everything\", writes the client. \"The tab kmr has loose shots in it, so if you push it, it explodes BUT no one gets hurt,\" they write further.  The father scared the robbers The robbery did not go at all as expected. The father of the family tells in questioning how he immediately started shouting at the robbers, which he believes made them both \"shocked and scared\".  The father has previously been the victim of a robbery against his shop, when he had a shotgun pointed at his head on two occasions.  \"Now they're coming,\" was one of the first things he said to his wife before rushing down the stairs. - Since 2015, I have been waiting for this. When Sweden changed with a lot of crime and everything. So, in a sense, you can say that I have feared that this will happen, he says in the police interrogation. Teenage daughter's horror His wife was upstairs when it happened and his teenage daughter was sleeping in the basement. She describes what she felt when she heard the glass shattering and the roar that followed. - I sat and shook the whole thing", "title_original": "Naken familjefar slog tillbaka mot inkräktare – mitt i natten", "summary_original": "En augustinatt vaknade en familj i Uppsala av att altandörren krossades på nedervåningen. Pappan sprang ner för trappan, utan kläder på kroppen, där han fann två maskerade rånare.  Något form av handgemäng uppstod och pappan fick ett djupt knivsår i ena armen, innan duon flydde platsen. Mannen, som säljer exklusiva varor i sin butik i Uppsala, var ett noga uttänkt mål och rånförsöket föregicks av gedigen planering. Det har åklagaren kunnat bevisa via dekrypterade chattar som TV4 Nyheterna har tagit del av. Fick vapen och ”tryckarlägenhet” De två männen, den ena i 20-årsåldern, den andra är i 25-årsåldern, hade åtagit sig rånet på uppdrag av ytterligare män. I chattarna framgår hur uppdragsgivarna tog fram vapen, adress och en så kallad ”tryckarlägenhet” åt rånarna. ”Bröder när ni går in säg till o ta allas lurar där inne o stänga av dom direkt, slå till dom hårt från början så de hamnar i chock o spän fast dom nånstans o kolla över allt i huset o kolla deras krypto vad det än är ta allt, para guld klockor ta allt”, skriver uppdragsgivaren. ”Tabben kmr ha lösa skott i så om ni trycker av det smäller MEN ingen skadas”, skriver man vidare.  Pappan skrämde rånarna Rånet gick inte alls som förväntat. Familjefadern berättar i förhör hur han direkt började skrika åt rånarna, vilket han tror gjorde dem både ”chockade och rädda”.  Pappan har tidigare varit utsatt för rån mot sin butik, då han vid två tillfällen fått hagelgevär riktat mot sitt huvud.  ”Nu kommer de”, var bland det första han sa till sin fru innan han rusade ner för trappan. – Sen 2015 har jag gått och väntat på det här. När Sverige förändrades med väldigt mycket kriminalitet och allting. Så på sätt och vis kan man säga att jag har fruktat att detta ska ske, berättar han i polisförhöret. Tonårsdotterns skräck Hans fru var på övervåningen när det skedde och hans tonårsdotter sov i källaren. Hon beskriver vad hon kände när hon hörde glaset som krossades och vrålen som kom därefter. – Jag satt ju och skakade hela tiden. Jag var bara rädd att de skulle komma ner till mig. Eller att de skulle skada min   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
