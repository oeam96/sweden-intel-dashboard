on's bitterness is about to become a burden for the party.", "title_original": "Amanda Sokolnicki: Att Tidö förlorar kan vara räddningen för Moderaterna", "summary_original": "Visst ser Moderaterna vad som är på väg att hända? Ulf Kristerssons bitterhet är på väg att bli en belastning för partiet.", "link": "https://www.dn.se/ledare/amanda-sokolnicki-att-tido-forlorar-kan-vara-raddningen-for-moderaterna/", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:34:28+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Graham Potter: \"The Jantelage suits me\"", "summary": "Graham Potter has gone from reviled Premier League coach to Swedish World Cup hope. Now the man who once made Östersund believe in miracles will try to repeat the feat with the national team.", "title_original": "Graham Potter:  ”Jantelagen passar mig”", "summary_original": "Graham Potter har gått från utskälld Premier League-tränare till svenskt VM-hopp. Nu ska mannen som en gång fick Östersund att tro på mirakel försöka göra om bedriften med landslaget.", "link": "https://www.svd.se/a/7pVeJ4/graham-potter-om-fotbolls-vm-jantelagen-passar-mig", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:33:15+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 97, "title": "After the dry spring: \"A tough summer awaits Gotland\"", "summary": "Rain is needed for the water on Gotland to be sufficient this summer. The levels in the lakes where the municipality takes its drinking water are below normal and the groundwater well below normal. - It is a tough summer we are facing, says Susanne Bjeregaard Pettersson at Region Gotland. Gotlänningar are already the most frugal in Sweden with drinking water. Last year, they got rid of 123 liters per person per day, according to the region. There is still a long way to go to reach the target this term of 112 liters per person per day. In the long term, Susanne Bjergegaard Petterson wants consumption to drop to 100 litres. - In the long term, we want to work more with sustainability. But both that and this summer require us to reduce liters per person per day, says Bjergegaard Pettersson. Getting tougher The challenges of getting enough water increase as the climate changes. It will certainly rain more, but probably in the winter. The bedrock on Gotland has no large underground reservoirs that can then store the water. Above ground, large areas are dug up and the rainwater therefore flows into the Baltic Sea. And the summers will be hotter. - With climate change, we currently have a huge amount of pressure on us to create new plans to cope with the development going forward, says Meit Fohlin (S), chairman of the regional board. Therefore, a preliminary study must now be carried out for another desalination plant on Gotland, something that Gunilla Rosenqvist sees risks with. She is a professor of ecology at Blue Centre, a collaboration between Uppsala University, Region Gotland and the County Board of Gotland. - A desalination plant is expensive and requires a lot of chemicals. I'm also worried that it makes people stop saving water because they think that a technical solution is enough, says Gunilla Rosenqvist. Wants to see legal protection She instead wants to strengthen the legal protection of groundwater and drinking water systems by making them national interests. It is already, for example, the cement production in Slite, an activity that negatively affects the groundwater", "title_original": "Efter den torra våren: ”En tuff sommar väntar på Gotland”", "summary_original": "Det behövs regn för att vattnet på Gotland ska räcka i sommar. Nivåerna i sjöarna där kommunen tar sitt dricksvatten är under det normala och grundvattnet mycket under det normala. – Det är en tuff sommar vi står inför, säger Susanne Bjeregaard Pettersson på Region Gotland. Gotlänningarna är redan sparsammast i Sverige med dricksvatten. Förra året gjorde de av med 123 liter per person och dygn, enligt regionen. Det är långt kvar till målet den här mandatperioden på 112 liter per person och dygn. På sikt vill Susanne Bjergegaard Petterson att förbrukningen ska ner till 100 liter. – Långsiktigt vill vi jobba mer med hållbarhet. Men både det och denna sommar kräver att vi minskar liter per person och dygn, säger Bjergegaard Pettersson. Blir allt tuffare Utmaningarna med att få vattnet att räcka ökar när klimatet förändras. Det kommer visserligen regna mer, men troligen på vintern. Berggrunden på Gotland har inga stora underjordiska resorvoarer som då kan lagra vattnet. Ovan jord är stora områden utdikade och regnvattnet rinner därför ut i Östersjön. Och somrarna kommer att bli varmare. – Med klimatförändringar har vi just nu ett jättestort tryck på oss att skapa nya planer för att klara utvecklingen framåt, säger Meit Fohlin (S), regionstyrelsens ordförande. Därför ska det nu göras en förstudie för ytterligare en avsaltningsanläggning på Gotland, något som Gunilla Rosenqvist ser risker med. Hon är professor i ekologi på Blått Centrum, ett samarbete mellan Uppsala Universitet, Region Gotland och Länsstyrelsen i Gotland. – Ett avsaltningsverk är dyrt och kräver mycket kemikalier. Jag är också orolig för att det får människor att sluta spara på vatten för att de tänker att en teknisk lösning räcker, säger Gunilla Rosenqvist. Vill se juridiskt skydd Hon vill istället stärka grundvattnets och drickvattenstäkternas juridiska skydd genom att göra dem till riksintressen. Det är redan till exempel cementtillverkningen i Slite, en verksamhet som negativt påverkar grundvattnet på Gotland. – Jag tycker definitivt att vi ska göra vatten till ett riksintresse. Vi kan klara oss utan mycket men inte utan vatten, säger professor Gunilla Rosenqvist.", "link": "https://www.tv4.se/artikel/1gqKNq37b0jFF2WpeogofH/efter-den-torra-varen-en-tuff-sommar-vaentar-pa-gotland", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:31:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vadret", "/gotland", "/vattenbrist", "/vatten"]}, {"id": 98, "title": "Number one on the top of the book: How much of life can you actually live on social media?", "summary": "Vincenzo Latronico's novel \"Perfektion\" is one of the books you shouldn't miss in week 24.", "title_original": "Etta på boktoppen: Hur mycket av livet kan man egentligen leva på sociala medier?", "summary_original": "Vincenzo Latronicos roman ”Perfektion” är en av böckerna du inte ska missa vecka 24.", "link": "https://www.sydsvenskan.se/kultur/etta-pa-boktoppen-hur-mycket-av-livet-kan-man-egentligen-leva-pa-sociala-medier/", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 99, "title": "USA dominated - after Paraguay's own goal", "summary": "A Paraguayan own goal started the American goal celebration in the host nation's World Cup opener. After dominating throughout the match, the USA eventually emerged victorious 4–1. - It means everything to us, says Christian Pulisic.", "title_original": "USA dominerade – efter Paraguays självmål", "summary_original": "Ett paraguayanskt självmål inledde den amerikanska målfesten i värdlandets VM-premiär. Efter att ha dominerat genom hela matchen stod USA slutligen som segrare med 4–1. – Det betyder allt för oss, säger Christian Pulisic.", "link": "https://www.svd.se/a/6qXv93/usa-dominerade-premiar-efter-paraguays-sjalvmal", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:25:52+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 100, "title": "Oh la la, I'll dedicate the summer to that", "summary": "Do you intend to devote yourself to gardening or invest in social leisure activities this summer? The research indicates that you made a wise choice regardless.", "title_original": "Oh la la, det ska jag viga sommaren åt", "summary_original": "Tänker du ägna dig åt trädgårdsarbete eller satsa på sociala fritidsaktiviteter i sommar? Forskningen indikerar att du oavsett vilket gjort ett klokt val.", "link": "https://www.svd.se/a/lnOJRL/emma-frans-forskning-visar-vilka-hobbyer-som-gynnar-halsan-mest", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:24:41+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 101, "title": "Neymar does not play in Brazil's World Cup premiere: \"He is only there for the money\"", "summary": "MORRISTOWN. Neymar did not show up for Brazil training on Friday. The national team captain Carlo Ancelotti now confirms what everyone already suspected: the world star will not play in the opener against Morocco. Brazilian journalists that DN spoke to in New Jersey do not believe that he will play at all during the World Cup.", "title_original": "Neymar spelar inte i Brasiliens VM-premiär: ”Han är med bara för pengarnas skull”", "summary_original": "MORRISTOWN. Neymar dök inte upp på Brasiliens träning på fredagen. Förbundskaptenen Carlo Ancelotti bekräftar nu vad alla redan anade: världsstjärnan spelar inte i premiären mot Marocko. Brasilianska journalister som DN talar med i New Jersey tror inte att han kommer att spela alls under VM.", "link": "https://www.dn.se/sport/neymar-spelar-inte-i-brasiliens-vm-premiar-han-ar-med-bara-for-pengarnas-skull/", "date_display": "2026-06-13", "date_iso": "2026-06-13T04:19:32+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "This is how FC Rosengård will take the next step: \"Finding the best players faster\"", "summary": "Ted Knutson is the one who will find the right pl urce": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The Foo Fighters continue to have their hearts with them", "summary": "After three hours with Foo Fighters, DN's Matilda Källén is slightly nauseous - but satisfied. On stage, it becomes clear that the band is Dave Grohl's heart project, even 32 years after its inception.", "title_original": "Foo Fighters fortsätter att ha hjärtat med sig", "summary_original": "Efter tre timmar med Foo Fighters är DN:s Matilda Källén lätt illamående – men belåten. På scen blir det tydligt att bandet är Dave Grohls hjärteprojekt, även 32 år efter starten.", "link": "https://www.dn.se/kultur/foo-fighters-fortsatter-att-ha-hjartat-med-sig/", "date_display": "2026-06-12", "date_iso": "2026-06-12T21:50:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Substitutes saved Canada in the World Cup opener", "summary": "Two minutes on the field was enough for substitute Cyle Larin to save Canada's first World Cup point in history. The host nation picked up a point after a 1-1 draw against Bosnia-Herzegovina in Toronto.", "title_original": "Inhoppare räddade Kanada i VM-premiären", "summary_original": "Två minuter på planen räckte för inhopparen Cyle Larin att rädda Kanadas första VM-poäng i historien. Värdnationen fick med sig en poäng efter 1–1 mot Bosnien-Hercegovina i Toronto.", "link": "https://www.dn.se/sport/inhoppare-raddade-kanada-i-vm-premiaren/", "date_display": "2026-06-12", "date_iso": "2026-06-12T21:02:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Space X up 19 percent first day", "summary": "", "title_original": "Space X upp 19 procent första dagen", "summary_original": "", "link": "https://www.svd.se/a/e7dvoO/space-x-stangde-pa-19-procent", "date_display": "2026-06-12", "date_iso": "2026-06-12T20:09:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 130, "title": "Left or right? Most people go in the same direction", "summary": "Do you turn counterclockwise or clockwise when you encounter an obstacle? New research shows that there is a direction that most people choose.", "title_original": "Vänster eller höger? De flesta går åt samma håll", "summary_original": "Svänger du moturs eller medurs när du möter ett hinder? Ny forskning visar att det finns en riktning som de flesta väljer.", "link": "https://www.svd.se/a/BxbqBw/vanster-eller-hoger-de-flesta-gar-ofta-moturs", "date_display": "2026-06-12", "date_iso": "2026-06-12T19:53:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 131, "title": "China: Spy turtles map our water", "summary": "China has come out and warned that foreign powers are monitoring and mapping its waters. The spies singled out are turtles and fish, The Guardian reports.", "title_original": "Kina: Spionsköldpaddor kartlägger vårt vatten", "summary_original": "Kina har gått ut och varnat för att främmande makter övervakar och kartlägger deras vatten. Spionerna som pekas ut är sköldpaddor och fiskar, rapporterar The Guardian.", "link": "https://www.dn.se/varlden/kina-spionskoldpaddor-kartlagger-vart-vatten/", "date_display": "2026-06-12", "date_iso": "2026-06-12T19:26:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "The Kremlin's move will reverse the trend – worries Ukraine", "summary": "Attrition airstrikes, overload attacks and more help from China - three factors that Russia hopes will reverse the trend on the front. But Ukraine's technological advantage means that the Kremlin's forces are stuck, according to military expert Roger Djupsjö.", "title_original": "Kremls drag ska vända trenden – oroar Ukraina", "summary_original": "Nötande luftangrepp, överbelastningsattacker och mer hjälp från Kina – tre faktorer som Ryssland hoppas ska vända trenden vid fronten. Men Ukrainas tekniska övertag gör att Kremls styrkor kör fast, enligt militärexperten Roger Djupsjö.", "link": "https://www.dn.se/varlden/kremls-drag-ska-vanda-trenden-oroar-ukraina/", "date_display": "2026-06-12", "date_iso": "2026-06-12T19:16:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "The experts on the agreement: \"For real this time\"", "summary": "\"The conditions for Trump to get a better deal now are non-existent\"", "title_original": "Experterna om avtalet: ”På riktigt den här gången”", "summary_original": "”Förutsättningarna för Trump att få en bättre deal nu är obefintliga”", "link": "https://www.tv4.se/artikel/4I91Js03dqhzu3bk8qiEPH/experterna-om-avtalet-pa-riktigt-den-haer-gangen", "date_display": "2026-06-12", "date_iso": "2026-06-12T18:42:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 134, "title": "Businesses charge for the government's free services: \"Unfair\"", "summary": "TV4 Nyheterna has previously reported on several companies that charge for providing services that state authorities offer free of charge. Unlike other companies, which often focus on a single service such as leaving the Church of Sweden or making a change of address, the Digitalization Initiative offers help in a number of different applications. When Gunnar Wretling needed an extract from the debit register, he came across their website, which gave the impression of belonging to an authority. For SEK 149, he received help with the application - despite the fact that the same service is both free and quicker to get directly through the police. - It is actually dishonest to deceive people in this way, he says to TV4 Nyheterna. \"Fooled and angry\" The Swedish Consumer Agency has received over 100 reports against the Digitization Initiative and has initiated a supervisory case to review the company's contractual terms and the claims used in the marketing.\n\nSeveral of the notifications come from people who paid SEK 895 for help with filing for divorce. The fee does not include the district court's processing fee of SEK 900. When Laila Perman was about to divorce and received papers from the Digitalization initiative that she herself could have ordered for free from the district court, she was annoyed. - I felt cheated and angry with them. They offer a service that you can otherwise easily fix yourself via the authorities. It is not that difficult to contact the authorities and get the same paper yourself. I think it's a bit of false marketing, she says. She finds it remarkable that they were the first option that came up when she googled. - I think it is a shame that such companies are allowed to exist. Not illegal Offering a service for payment that would otherwise have been free for the consumer to perform himself is not illegal. However, it is important that the company clearly informs that the service costs money, according to Sandra Troedsson, lawyer at the Swedish Consumer Agency. - The most important thing here is that consumers do not get", "title_original": "Företag tar betalt för statens gratistjänster: ”Oärligt”", "summary_original": "TV4 Nyheterna har tidigare rapporterat om flera företag som tar betalt för att förmedla tjänster som statliga myndigheter erbjuder utan kostnad. Till skillnad från andra företag, som ofta fokuserar på en enskild tjänst som att lämna Svenska kyrkan eller göra en adressändring, erbjuder Digitaliseringsintiativet hjälp i en rad olika ansökningar. När Gunnar Wretling behövde ett utdrag ur belastningsregistret kom han över deras hemsida som gav intrycket av att tillhöra en myndighet. För 149 kronor fick han hjälp med ansökan – trots att samma tjänst är både gratis och går snabbare att få direkt via polisen. – Det är faktiskt oärligt att lura folk på det här sättet, säger han till TV4 Nyheterna. ”Lurad och arg” Konsumentverket har tagit emot över 100 anmälningar mot Digitaliseringsinitiativet och har inlett ett tillsynsärende för att granska företagets avtalsvillkor samt de påståenden som används i marknadsföringen.\n\nFlera av anmälningarna kommer från personer som betalat 895 kronor för hjälp med att ansöka om skilsmässa. Avgiften inkluderar inte tingsrättens handläggningsavgift på 900 kronor. När Laila Perman skulle skilja sig och fick hem papper från Digitaliseringsinitiativet som hon själv kunde ha beställt gratis från tingsrätten blev hon irriterad. – Jag kände mig lurad och arg på dem. De erbjuder en tjänst som man annars kan fixa själv lätt via myndigheter. Så svårt är det inte att kontakta myndigheterna och få samma papper själv. Jag tycker att det är lite falsk marknadsföring, säger hon. Att de var det första alternativet som kom upp när hon googlade tycker hon är anmärkningsvärt. – Jag tycker att det är synd att sådana företag får finnas. Inte olagligt Att erbjuda en tjänst mot betalning som på andra vägar hade varit gratis för konsumenten att utföra själv är inte olagligt. Däremot är det viktigt att företaget tydligt informerar om att tjänsten kostar pengar, enligt Sandra Troedsson, jurist på Konsumentverket. – Det viktigaste här är att konsumenterna inte får bli vilseledda av tjänsten. Det behöver finnas tydlig information om att den tjänsten kostar pengar och att det är tydligt för konsumenten att det inte är en myndighet, säger hon. TV4 Nyheterna har vid upprepade tillfällen sökt Digitaliseringsinitiativet. I ett mejlsvar skriver företaget att de arbetar med att underlätta ansökningsprocesser.  ”Det är en frivillig tjänst som många önskar ta del av då de själva inte har möjlighet att sköta det administrativa arbetet”, står det.", "link": "https://www.tv4.se/artikel/ODu5G5BUHi0IYYodL5Gw3/foeretag-tar-betalt-foer-statens-gratistjaenster-oaerligt", "date_display": "2026-06-12", "date_iso": "2026-06-12T18:10:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/svenska-kyrkan", "/myndigheter"]}, {"id": 135, "title": "That's how much you get hissed during the World Cup", "summary": "The 2026 FIFA World Cup will be played in the United States, Mexico and Canada. This means that several of the matches are played at night, and Sweden's opening match against Tunisia is one of them. The match starts at four o'clock on Monday morning and tens of thousands of Swedes are expected to warm themselves with coffee, tea and gather in their homes to follow the match. One in seven people is bothered The property management company Sveriges Bostadsrättscentrum has conducted a survey in which they asked 2,000 people about what bothers them. The survey shows that one in seven condominium owners are disturbed by loud TV sounds from neighbors. But there is a difference between feeling disturbed and the fact that it is actually a legal disturbance.  For it to count as a disturbance in the meaning of the law, the noise must be so serious that it affects health or deteriorates the living environment in a way that one should not reasonably have to endure.  Normal life noises must be accepted Therese af Jochnick points out that residents of apartment buildings must expect certain life sounds, such as barking dogs, children playing or occasional parties. However, most condominium associations have rules of order that say it must be quiet after 10 p.m. But when World Cup matches are played in the middle of the night, it can be difficult to stick to these times.  - It is not very appropriate to organize a big party at 4 a.m. in the apartment and watch the World Cup. If you are going to have people over for a party, post a note in the stairwell, call around to the neighbors and give out your details. The purpose of informing the neighbors is that they can plan for the evening or contact you directly if it gets too loud, says Therese af Jochnick.  Check the association's rules of procedure It is important to know what applies in your housing association. Although 10 pm is a purely legal limit for when it should be quiet, the rules can vary.  - Keep an eye on the city statutes and rules of order that apply. Use common sense and show some respect for your neighbors and you'll be fine", "title_original": "Så mycket får du väsnas under fotboll-VM", "summary_original": "Världsmästerskapet i fotboll 2026 spelas i USA, Mexiko och Kanada. Det betyder att flera av matcherna spelas nattetid och Sveriges premiärmatch mot Tunisien är en av dem. Matchen börjar klockan fyra på måndag morgon och tiotusentals svenskar väntas värma på kaffe, te och samlas i hemmen för att följa matchen. Var sjunde person stör sig Fastighetsförvaltningsföretaget Sveriges Bostadsrättscentrum har gjort en undersökning där de frågat 2 000 personer om vad de stör sig på. Undersökningen visar att var sjunde bostadsrättsägare stör sig på höga TV-ljud från grannar. Men det är skillnad på att känna sig störd och att det faktiskt rör sig om en rättsligt störning.  För att det ska räknas som en störning i lagens mening krävs det att ljudet är så pass allvarligt att det påverkar hälsan eller försämrar bostadsmiljön på ett sätt som man inte skäligen ska behöva tåla.  Vanliga levnadsljud måste accepteras  Therese af Jochnick påpekar att boende i flerbostadshus måste räkna med vissa levnadsljud, som skällande hundar, barn som leker eller enstaka fester. De flesta bostadsrättsföreningar har dock ordningsregler som säger att det ska vara lugnt efter klockan 22. Men när VM-matcher spelas mitt i natten kan det bli svårt att hålla sig till dessa tider.  – Det är inte jättelämpligt att anordna en stor baluns klockan 04.00 i lägenheten och titta på VM. Är det så att du ska ha människor hemma på en fest, sätt upp en lapp i trapphuset, ring runt till grannarna och lämna ut dina uppgifter. Syftet med att informera grannarna är att de kan planera för kvällen eller kontakta dig direkt om det blir för högljutt, säger Therese af Jochnick.  Kolla föreningens ordningsregler Det är viktigt att känna till vad som gäller i just din bostadsrättsförening. Även om klockan 22 är en gräns rent rättsligt för när det ska vara tyst, kan reglerna variera.  – Ha koll på stad stadgarna och ordningsreglerna som gäller. Tillämpa sunt förnuft och visa lite respekt för dina grannar, så kommer det att gå jättebra, säger Therese af Jochnick. På midsommardagen ställs Sverige mot Nederländerna klockan 19.00 medan landslagets sista gruppspelsmatch mot Japan börjar 01.00 den 26 juni. Se fotbolls-VM i TV4 Play.", "link": "https://www.tv4.se/artikel/6OcmbV5y0asrHFmi8hkCll/sa-mycket-far-du-vaesnas-som-granne-under-fotboll-vm", "date_display": "2026-06-12", "date_iso": "2026-06-12T16:46:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/fotbolls-vm-2026", "/bostad"]}, {"id": 136, "title": "Responding to criticism after the chaos in the subway: \"Old technology\"", "summary": "The moderates' Christofer Fjellner and Axel Conradi went out on Friday and demanded crisis meetings with the chairman of the regional board in Stockholm, Aida Hadzialic (S), to hold her accountable for the recent chaos in the subway. The opposition politicians said, among other things, that the board concealed how bad the problems in the subway actually were, and were critical of the fact that it took so long to get the errors fixed. For TV4 Nyheterna, Hadzialic announces, via her press secretary, that she is not the right person to respond to the criticism and instead refers to Jakop Dalunde, traffic regional councilor for the Green Party in Stockholm, who is responsible for public transport. According to Dalunde, the very basic problem is that the subway's signaling system is very old. - The red line is from the 60s and the green from the 80s. The challenge lies in the fact that it is very, very old technology, says Jakop Dalunde (MP). Agrees with the criticism He underlines that defective components have actually been replaced over time, but that it happened too late. - It has been difficult to solve the problems even for the experts brought in from the company that manufactured this old technology. I think the most important lesson is that this signaling system should have been replaced a long, long time ago. Region Stockholm made an attempt in 2013, but that process failed. Now we are in such a process again.  - The most recent decision we made to replace the entire signaling system for the subway, we made that in the fall of 2025, he says.  The problems with the red line have been going on for almost two weeks, and affect almost 500,000 Stockholmers every day.  - There are many of us who depend on the subway every day, myself included. And it is incredibly unfortunate that this old technology has remained in our system. It should have been replaced a long time ago. We now take that responsibility.  He admits that the region has not been transparent enough in informing its colleagues in politics about how to ensure that something like this does not happen again.  - It is", "title_original": "Svarar på kritiken efter kaoset i tunnelbanan: ”Gammal teknik”", "summary_original": "Moderaternas Christofer Fjellner och Axel Conradi gick på fredagen ut och krävde krismöten med regionstyrelsens ordförande i Stockholm, Aida Hadzialic (S), för att ställa henne till svars för den senaste tiden kaos i tunnelbanan. Oppositionspolitikerna menade bland annat att styret mörkat hur illa problemen i tunnelbanan faktiskt varit, och var kritiska till att det dragit ut på tiden att få felen åtgärdade. För TV4 Nyheterna meddelar Hadzialic, via sin pressekreterare, att hon inte är rätt person att bemöta kritiken och hänvisar istället till Jakop Dalunde, trafikregionråd för Miljöpartiet i Stockholm, som ansvarar för kollektivtrafiken. Enligt Dalunde är själva grundproblemet att tunnelbanans signalsystem är mycket gammalt. – Röda linjens är från 60-talet och gröna från 80-talet. Utmaningen ligger i att det är mycket, mycket gammal teknik, säger Jakop Dalunde (MP). Instämmer i kritiken Han understryker att defekta komponenter med tiden faktiskt har bytts ut, men att det skett försent. – Det har varit svårt att lösa problemen även för de experter som tagits in från det företag som tillverkat den här gamla tekniken. Jag tycker att den viktigaste lärdomen är att det här signalsystemet borde ha bytts ut för länge, länge sedan. Region Stockholm gjorde 2013 ett försök, men den processen havererade. Nu är vi uppe i en sån process igen.  – Det senaste beslutet som vi tog om att byta ut hela signalsystemet för tunnelbanan, det tog vi hösten 2025, berättar han.  Problemen med röda linjen har pågått i snart två veckor, och går dagligen ut över närmare 500 000 stockholmare.  – Vi är många som är beroende av tunnelbanan varje dag, mig själv inkluderad. Och det är otroligt olyckligt att den här gamla tekniken funnits kvar i vårt system. Den borde ha bytts ut för längesen. Det ansvaret tar vi nu.  Han vidgår att man från regionens sida inte varit transparenta nog med att informera sina kollegor i politiken om hur man säkerställer att något liknande inte inträffar igen.  – Det är kritik jag delvis instämmer i. Det är något vi arbetar vidare med. Vi hade kunnat vara bättre i informationsflödet, säger han. Lovar stegvis förbättring Enligt Jakop Dalunde har man nu fått positiva signaler på att det kan ske en stegvis förbättring under nästa vecka.  Hur säkerställer ni att det inte händer igen?  – När den omedelbara situationen är över då måste vi gå till botten med vad som hände. Hur kunde det gå så här fel? Han menar att en bidragande faktor på ett generellt plan har varit att Trafikförvaltningens organisation med åren slimmats, för att vid behov istället ta in expertis i form av konsulter. – Det tycker jag är en problematisk utveckling. Den här mandatperioden har vi påbörjat processen att reversera den processen för att göra oss mindre konsultberoende och har mer djup teknisk expertis i den egna organisationen. Det gör att vi har stärkt rådighet, att vi blir en starkare organisation och att vi också har stärkt beredskap, säger han och tillägger: – Det är svårt att säga om det hade kunnat underlätta den här situationen. Men likväl så tycker jag att vi måste bli mindre konsultberoende och ha mer expertis i den egna organisationen.", "link": "https://www.tv4.se/artikel/1l07OJvPSP70Whvb3KH89g/svarar-pa-kritiken-efter-kaoset-i-tunnelbanan-gammal-teknik", "date_display": "2026-06-12", "date_iso": "2026-06-12T16:12:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/stockholm", "/stockholm-stad", "/tunnelbana", "/kollektivtrafik", "/valet-2022/socialdemokraterna", "/valet-2022/moderaterna"]}, {"id": 137, "title": "Elon Musk the world's first dollar billionaire", "summary": "The space company Space X is going from being privately owned to becoming a public company - where anyone can buy shares.  The interest in the share from has been enormous. Before the listing, bids were made for around SEK 950 billion from small savers, according to Bloomberg. Added to that are institutional investors – banks, insurance companies and pension companies – who wanted a piece of the pie. In total, the valuation of the company landed at around SEK 16,800 billion, according to the Financial Times. The biggest IPO ever – by far. - If someone had said that this would happen, then I would have said, you must smoke really good crack, says Elon Musk in connection with the stock market introduction. The world's richest person, Elon Musk, owns about 42 percent of the company or 4.8 billion shares, according to CBS. The introductory price was set at $135 per share - making Elon Musk the world's first dollar billionaire even before the first day of trading. Elon Musk in numbers: 10,826,000,000,000 kroner But the stock rose as trading began to pick up, rising by 20 percent around 6:00 p.m. This means that Elon Musk's fortune has grown by SEK 1,300 billion to SEK 10,826 billion.  - But you shouldn't forget that he doesn't have this money in hand. They are linked to his holdings in the company, says Robert Oldstrand, equity strategist at Swedbank. Let's put these numbers into context. A million seconds is a little over eleven days. A billion seconds is about 31 and a half years. A trillion seconds is about 31,709 years. Elon Musk's fortune is now greater than the poorest half of the world's population - combined, according to Oxfam. He emphasized during his speech at Space X is different from other space companies. Their goal is to \"take the fiction out of science-fiction\" and take anyone to the moon and Mars.  - There are always problems on earth. There are always things that we wish were better, that we want to solve and that we should solve. But there must also be things that make one excited about the future, that make one", "title_original": "Elon Musk världens första dollarbiljonär", "summary_original": "Rymdbolaget Space X går från att vara privatägt till att bli ett offentligt bolag – där vem som helst kan köpa aktier.  Intresset för aktien från har varit enormt. Innan noteringen lades bud på omkring 950 miljarder kronor från småsparare, enligt Bloomberg. Till det kommer institutionella investerare – banker, försäkringsbolag och pensionsbolag – som velat ha en bit av kakan. Totalt landade värderingen av bolaget på omkring 16 800 miljarder kronor, enligt Financial Times. Den största börsnoteringen någonsin – med råge. – Om någon hade sagt att det här skulle hända, då skulle jag sagt, du måste röka riktigt bra crack, säger Elon Musk i samband med börsintroduktionen. Världens rikaste person, Elon Musk, äger omkring 42 procent av bolaget eller 4,8 miljarder aktier, enligt CBS. Introduktionskursen sattes på 135 dollar per aktie – vilket gjorde Elon Musk till världens första dollarbiljonär redan innan första handelsdagen. Elon Musk i siffror: 10 826 000 000 000 kronor Men aktien steg när handeln började ta fart och steg med 20 procent omkring 18:00. Det innebär att Elon Musks förmögenhet har vuxit med 1 300 miljarder till 10 826 miljarder kronor.  – Men man ska inte glömma bort att han har ju inte de här i reda pengar. De är kopplade till hans innehav i bolaget, säger Robert Oldstrand, aktiestrateg på Swedbank. Låt oss sätta dessa siffror i kontext. En miljon sekunder är lite drygt elva dagar. En miljard sekunder är omkring 31 och ett halvt år. En biljon sekunder är omkring 31 709 år. Elon Musks förmögenhet är nu större än den fattigaste hälften av jordens befolkning – tillsammans, enligt Oxfam. Han betonade under sitt tal på Space X skiljer sig från andra rymdbolag. Deras mål är att ”ta bort fiction från science-fiction” och ta vem som helst till månen och mars.  – Det finns alltid problem på jorden. Det finns alltid saker som vi önskar vore bättre, som vi vill lösa och som vi borde lösa. Men det måste också finnas saker som gör en exalterad över framtiden, som gör en glad när man  vaknar på morgonen.  – Det är framtiden som SpaceX vill ge till dig. Oron för svenska aktier Molly Guggenheimer, aktiestrateg på Danske Bank, tycker hela situationen är hejdlös. – Jag hörde någon säga att det är som när Telia börsintroducerades år 2000 fast i hela världen. Men hon är mer nyfiken på vad som händer om 15 handelsdagar, när SpaceX börjar tas in i Nasdaqs index. Eftersom börsvärdet på SpaceX är så högt måste passiva fonder anpassa sig.  – Det finns en prestige att ha Space X noterad vilket gjorde att man kringgick en del regler. Det innebär att de kommer behöva sälja i andra bolag för att köpa Space X-aktier. Det kommer sannolikt även påverka svenska bolag. – Det skulle kunna påverka svenska industribolag framåt, det blir ju ett säljtryck, vilket gör att de kan gå ner.", "link": "https://www.tv4.se/artikel/755SPiWd2wa2KImQyT7lhS/elon-musk-vaerldens-foersta-dollarbiljonaer", "date_display": "2026-06-12", "date_iso": "2026-06-12T16:10:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/borsen", "/elon-musk", "/spacex"]}, {"id": 138, "title": "Ranelid om Norska AI-scandalen: \"Lättsinne och slarv\"", "summary": "The book depicts the power struggle between Norwegian football manager Lise Klaveness and Fifa president Gianni Infantino. But obvious traces of AI have meant that the book has now been stopped by the major Norwegian publisher Cappelen Damm. Among other things, the author, Niels Røine, forgot to delete a direct reply from a chatbot: \"Of course - here you get the text...\", the running text says. Additionally, notes from the AI ​​have been left behind. There are also over 30 quotes from famous football profiles - which cannot be verified. Daniel Sandström, at Bonnierförlagen, tells TT that it is difficult to guard against AI cheating. The Swedish author Björn Ranelid believes, however, that it is immediately noticeable when an author has used AI. According to Ranelid, the book's author has not understood that the machine has no chance against humans. - If I were to compete against a robot in a 60 meter race, I would win straight away, he says, among other things, about using AI in his writing. \"Recklessness and carelessness\" He calls what Røine dealt with \"cheating\". - In addition, it is the case that no quality writer of rank would commit such an act of niddling. Because it is an act of bullying against prospective readers, critics, book buyers and booksellers, says Björn Ranelid. He believes that it is ultimately about ethics and morality. - Those ethics and morals must also be part of your writing. That means you should be able to express yourself in joy, he says. How can this happen? How has no one discovered this cheat? - It is frivolity and carelessness on the part of the publisher. Having to live with the shame He believes, however, that the evil in this case could bring something good with it in the long run. - People who sit as editors and also those who are proofreaders and of course publishers will be more observant in the future. So I see it as something good in the bad. The author will also have to live with the shame, he says. - And this can never be washed away. Without any artistic activity for my part", "title_original": "Ranelid om norska AI-skandalen: ”Lättsinne och slarv”", "summary_original": "I boken skildras maktkampen mellan den norska fotbollschefen Lise Klaveness och Fifa-presidenten Gianni Infantino. Men uppenbara spår av AI har gjort att boken nu stoppats av det norska storförlaget Cappelen Damm. Bland annat har författaren, Niels Røine, glömt att radera en direkt replik från en chattbot: ”Självklart – här får du texten...”, står det i den löpande texten. Dessutom har anteckningar från AI:n lämnats kvar. Likaså återfinns över 30 citat från kända fotbollsprofiler – som inte går att verifiera. Daniel Sandström, på Bonnierförlagen, uppger för TT att det är svårt att helgardera sig mot AI-fusk. Den svenska författaren Björn Ranelid menar dock att det märks omedelbart när en författare använt sig av AI. Enligt Ranelid har bokens författare inte förstått att maskinen är chanslös mot människan. – Om jag skulle tävla mot en robot i ett 60 meterslopp så vinner jag direkt, säger han bland annat om att använda sig av AI i sitt författarskap. ”Lättsinne och slarv” Det Røine sysslat med kallar han för ”fusk”. – Dessutom är det så att ingen kvalitetsförfattare av rang skulle begå ett sådant nidingsdåd. För det är ett nidingsdåd mot presumtiva läsare kritiker, bokköpare och bokhandlare, säger Björn Ranelid. Han menar att det ytterst handlar om etik och moral. – Den etiken och moralen ska även vara en del av ditt författarskap. Det vill säga att du ska i glädje kunna formulera dig, säger han. Hur kan det här ske? Hur har ingen upptäckt det här fusket? – Det är ett lättsinne och slarv från förlagets sida. Får leva med skammen Han menar dock att det onda i det här fallet skulle kunna föra något gott med sig på sikt. – Människor som sitter som redaktörer och dessutom de som är korrekturläsare och naturligtvis förläggare kommer att vara mer observanta i framtiden. Så jag ser det som något gott i det onda. Författaren kommer dessutom att behöva leva med skammen, påtalar han. – Och det går ju aldrig att tvätta bort detta. Utan all konstnärlig verksamhet för min del handlar om ärlighet, att arbeta hårt och flitigt och ärligt och dessutom kunna förkovra sig i skrift och i tal.", "link": "https://www.tv4.se/artikel/Y3ERYRrOjznZ7lDR3DLa4/ranelid-om-norska-ai-skandalen-laettsinne-och-slarv", "date_display": "2026-06-12", "date_iso": "2026-06-12T15:11:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/inrikes", "/noje", "/litteratur", "/ai", "/teknik", "/ny-teknik", "/personer/bjorn-ranelid", "/norge"]}, {"id": 139, "title": "US and Iran agree on peace deal", "summary": "Iran and mediator Pakistan confirm", "title_original": "USA och Iran överens om fredsavtal", "summary_original": "Iran och medlaren Pakistan bekräftar", "link": "https://www.tv4.se/artikel/3vElZVqQ51eQP0enmhqumV/trump-rasar-mot-iran-mycket-ohederliga-maenniskor", "date_display": "2026-06-12", "date_iso": "2026-06-12T14:47:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 140, "title": "The fear on Lendrick Street after the riots: \"Too bad\"", "summary": "\"I'm scared when I'm in town, I look over my shoulder\"", "title_original": "Rädslan på Lendrick Street efter upploppen: ”För jävligt”", "summary_original": "”Jag är rädd när jag är inne i stan, jag tittar mig över axeln”", "link": "https://www.tv4.se/artikel/1QnxcnnmRDJYDeGFHngBLE/raedslan-pa-lendrick-street-efter-upploppen-foer-jaevligt", "date_display": "2026-06-12", "date_iso": "2026-06-12T14:06:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Belfast", "/belfast"]}, {"id": 141, "title": "That's why viewers missed Shakira – TV4 didn't know when she went on", "summary": "Before the opening match of the World Cup between Mexico and South Africa at the Aztec Stadium in Mexico City, many viewers expected to see Shakira perform this year's World Cup song \"Dai dai\" together with Burna Boy. Instead, there was studio talk on TV4 during parts of the opening ceremony. Afterwards, several viewers criticized the channel for not being able to see the world artist's performance. TV4's sports manager Johan Cederqvist tells TV4 Nyheterna that they received different information from Fifa about when the artists would go on and what the program would look like. - To put it mildly, we were surprised when she performed already 80 minutes before kick-off. Once we discovered it, we actually thought it was some kind of rehearsal. It would have been more reasonable for her to be the main act just before kick-off, he says. A lot this year According to Johan Cederqvist, there is a lot to keep track of this year for the channel. - It's an awful lot, and it's an awful lot for the Fifa organizers as well because it's the world's biggest championship and also the biggest of all time this time, with more countries and more teams. And it's also the first day. - It is clear that there is a huge amount of issues that they are trying to deal with, that we are trying to deal with, and all the communication there as well. Available to watch afterwards To viewers who feel they were snubbed at perhaps the biggest performance of the evening, he says: - We understand that it would have been the most fun to see it live, but it is also possible to watch it now afterwards on TV4 Play and I hope they take the opportunity to do so. Johan Cederqvist says, however, that many people have gotten in touch and said that the content was appreciated afterwards. - We have posted it on our social channels as well and on TV4 Play it is free. We've already had a million views on the material. - It's incredibly fun that there is such an enormous amount of interest and that that interest goes far beyond the group that usually watches sports also on an everyday basis, so it's really cool.", "title_original": "Därför missade tittarna Shakira – TV4 visste inte när hon gick på", "summary_original": "Inför öppningsmatchen i VM mellan Mexiko och Sydafrika på Aztekastadion i Mexico City väntade sig många tittare att få se Shakira framföra årets VM-låt ”Dai dai” tillsammans med Burna Boy. I stället blev det studioprat i TV4 under delar av invigningsceremonin. Efteråt riktade flera tittare kritik mot kanalen för att de inte fick se världsartistens uppträdande. TV4:s sportchef Johan Cederqvist säger till TV4 Nyheterna att de fick olika besked från Fifa om när artisterna skulle gå på och hur programmet skulle se ut. – Vi blev milt sagt överraskade när hon uppträdde redan 80 minuter innan avspark. När vi väl upptäckte det trodde vi faktiskt att det var någon typ av repetition. Det hade varit mer rimligt att hon var huvudnumret precis innan avspark, säger han. Extra mycket i år Enligt Johan Cederqvist är det extra mycket att hålla reda på i år för kanalen. – Det är oerhört mycket, och det är oerhört mycket för Fifa-arrangörerna också i och med att det är världens största mästerskap och dessutom det största genom tiderna den här gången, med fler länder och fler lag. Och det är dessutom första dagen. – Det är klart att det uppstår en enorm mängd frågor som de försöker hantera, som vi försöker hantera, och all kommunikation där också. Finns att se i efterhand Till tittare som känner att de blev snuvade på kvällens kanske största framträdande säger han: – Vi förstår att det hade varit roligast att se det live, men det går också att se det nu i efterhand på TV4 Play och jag hoppas att de passar på att göra det. Johan Cederqvist säger dock att många har hört av sig och berättat att innehållet varit uppskattat i efterhand. – Vi har lagt upp det på våra sociala kanaler också och på TV4 Play ligger det fritt. Vi har redan haft en miljon visningar på materialet. – Det är otroligt kul att det är så enormt stort intresse och att det intresset går långt utanför den grupp som vanligtvis tittar på sport också på vardaglig basis, så det är sjukt häftigt.", "link": "https://www.tv4.se/artikel/1FPflD5tR9N5QksMuHAlaN/daerfoer-missade-tittarna-shakira-tv4-visste-inte-naer-hon-gick-pa", "date_display": "2026-06-12", "date_iso": "2026-06-12T14:02:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotbolls-vm-2026", "/noje", "/utrikes", "/fotboll", "/tv4", "/tv4-play"]}, {"id": 142, "title": "Details: Mysterious boat disturbed the Coast Guard", "summary": "The incident occurred in Varberg on Wednesday morning and is covered by confidentiality. According to information to TV4 Nyheterna, a boat from the Coast Guard discovered that someone had disturbed their equipment on board. The patrol alerted the police. - We refer the matter to the Police Authority. Our patrol in Varberg noted a GPS disturbance which they reported to the police, says Karin Cars, communicator at the Coast Guard, and states that the incident did not affect their operations. Man and woman detained after operation The police launched an operation and detained a man from Finland and a woman from Russia, according to information given to TV4 Nyheterna. The police are investigating suspicions that they traveled on a boat and used jamming equipment against the Coast Guard. After questioning, both were released. The police in the West region confirm that the preliminary investigation is ongoing linked to socially important activities, but do not want to state the crime classification. - We can confirm that we have drawn up a report regarding an incident in Varberg. No persons are detained in the case. As there is pre-investigation confidentiality, we cannot provide more information on the case at this time, after the decision of the pre-investigation manager, says Christian Brattgård, police commissioner and press spokesperson in region West. The security police, Säpo, does not want to comment on the matter but refers to the police.", "title_original": "Uppgifter: Mystisk båt störde ut Kustbevakningen", "summary_original": "Händelsen inträffade i Varberg på onsdagsförmiddagen och omfattas av sekretess. Enligt uppgifter till TV4 Nyheterna ska en båt från Kustbevakningen upptäckt att någon stört ut deras utrustning ombord. Patrullen larmade polisen. – Vi hänvisar till Polismyndigheten i det här ärendet. Vår patrull i Varberg noterade en gps-störning som de polisanmälde, säger Karin Cars, kommunikatör på Kustbevakningen, och uppger att händelsen inte påverkade deras verksamhet. Man och kvinna frihetsberövade efter insats Polisen inledde en insats och frihetsberövade en man från Finland och en kvinna från Ryssland, enligt uppgifter till TV4 Nyheterna. Polisen utreder misstankar om de färdats på en båt och använt störningsutrustning mot Kustbevakningen. Efter förhör släpptes båda. Polisen i region Väst bekräftar att förundersökningen pågår kopplat till samhällsviktig verksamhet men vill inte uppge brottsrubriceringen. – Vi kan bekräfta att vi har upprättat en anmälan kring en händelse i Varberg. Inga personer är frihetsberövade i ärendet. Då det råder förundersökningssekretess kan vi inte lämna mer information i ärendet just nu, efter beslut av förundersökningsledaren, säger Christian Brattgård, poliskommissarie och presstalesperson i region Väst. Säkerhetspolisen, Säpo, vill inte kommentera ärendet utan hänvisar till polisen.", "link": "https://www.tv4.se/artikel/75zWBKJPy7t35CGCCkodtq/uppgifter-mystisk-bat-stoerde-ut-kustbevakningen", "date_display": "2026-06-12", "date_iso": "2026-06-12T12:58:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/varberg", "/brott", "/kustbevakningen"]}, {"id": 143, "title": "Maria Malmer Stenergard receives Panama’s Minister of Foreign Affairs Javier Martínez-Acha Vásquez", "summary": "On 11 June, Sweden’s Minister for Foreign Affairs Maria Malmer Stenergard received Panama’s Minister of Foreign Affairs Javier Martínez-Acha Vásquez. Topics of discussion for the meeting included current developments in Panama and internationally, digitalisation issues and trade.", "title_original": "Maria Malmer Stenergard receives Panama’s Minister of Foreign Affairs Javier Martínez-Acha Vásquez", "summary_original": "On 11 June, Sweden’s Minister for Foreign Affairs Maria Malmer Stenergard received Panama’s Minister of Foreign Affairs Javier Martínez-Acha Vásquez. Topics of discussion for the meeting included current developments in Panama and internationally, digitalisation issues and trade.", "link": "https://www.government.se/articles/2026/06/maria-malmer-stenergard-receives-panamas-minister-of-foreign-affairs-javier-martinez-acha-vasquez/", "date_display": "2026-06-12", "date_iso": "2026-06-12T11:45:56+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["International", "Ministry for Foreign Affairs", "Trade and investment promotion", "Digital policy", "Article", "Innovation", "Maria Malmer Stenergard"]}, {"id": 144, "title": "\"The fuel man\" cut hoses - on 13 sandwiches: \"My fault\"", "summary": "At the end of June last year, 13 petrol stations in western Sweden were exposed to vandalism in the form of cut petrol hoses.  The owner of a pub in Vårgårda got petrol all over himself when he was going to control the sabotage and suffered long-term health problems.  - I was completely drowned and got it in both my mouth, nose and eyes, he says in a police interrogation. In addition, several customers got gas on themselves while refueling, but are said to have suffered no physical injuries. \"I'm ashamed of what I've done\" Surveillance images from several supermarkets show a Volvo rolling in and an unmasked man getting out. The man then cuts petrol hoses with plastic pipe cutters before leaving the scene.  On some of the sandwiches, he also goes into the store and hands over a handwritten letter. On the envelope it says \"FORGIVE\" or \"TO THE OWNER OF THE STAND\" and in the four different letters it says basically the same thing: \"HELLO YOU. I apologize for the sabotage of your stand. It was poorly done by me. The plan was that the state would get it. Because it's too expensive to fill up and there will be more ethanol in the fuel. It went wrong right from the start. I'm ashamed of what I've done. It was my fault. Post a note that I am ashamed of it. To your customers that they know. FROM THE FUEL MAN\" Even in the police interrogation, the man says that he is ashamed of what he has done, but that he still thinks it is \"bad for the state to pour more ethanol into the fuel\". 260,000 in damages At eleven of the stations the man cut three hoses, at one petrol station he cut four hoses and at another he cut a hose. The sabotage took place over the course of two days, between June 28 and 30, 2025. The \"fuel man\", who is 25 years old, is now convicted of 13 cases of damage, one case of causing bodily harm and two cases of causing danger to another.  The penalty was a suspended sentence and daily fines of SEK 8,000. In addition, he must pay just over SEK 260,000 in damages to both pub owners and affected customers. The man has admitted to", "title_original": "”Bränslemannen” klippte slangar – på 13 mackar: ”Fel av mig”", "summary_original": "I slutet av juni förra året blev 13 bensinmackar i Västsverige utsatta för skadegörelse i form av kapade bensinslangar.  Ägaren till en mack i Vårgårda fick bensin över hela sig när han skulle kontrollera sabotaget och fick långvariga hälsoproblem.  – Jag blev helt dränkt och fick det i både mun, näsa och ögon, säger han i ett polisförhör. Dessutom fick flera kunder bensin på sig när de tankade, men ska inte ha fått några fysiska skador. ”Jag skäms över vad jag har gjort” På övervakningsbilder från flera mackar syns hur en Volvo rullar in och en omaskerad man kliver ut. Mannen klipper sedan sönder bensinslangar med en plaströrsax innan han lämnar platsen.  På några av mackarna går han också in i butiken och lämnar över ett handskrivet brev. På kuvertet står det ”FÖRLÅT” eller ”TILL ÄGAREN AV MACKEN” och i de fyra olika breven står det i princip samma sak: ”HEJ DU. Jag ber om ursäkt för sabotaget på din mack. Det var dåligt gjort av mig. Planen var att staten skulle få det. För att det är för dyrt att tanka och det ska komma mer etanol i bränslet. Det gick fel redan i början. Jag skäms över vad jag har gjort. Det var fel av mig. Sätt upp en lapp att jag skäms över det. Till era kunder att dom vet. FRÅN BRÄNSLE-MANNEN” Även i polisförhör säger mannen att han skäms för det han har gjort, men att han fortfarande tycker att det är ”dåligt av staten att hälla i mer etanol i bränslet”. 260 000 i skadestånd Vid elva av stationerna klippte mannen sönder tre slangar, vid en bensinstation klippte han sönder fyra slangar och vid en annan klippte han sönder en slang. Sabotagen skedde under två dygns tid, mellan den 28 och 30 juni 2025.  ”Bränslemannen”, som är i 25-årsåldern, döms nu för 13 fall av skadegörelse, ett fall av vållande till kroppsskada och två fall av framkallande av fara för annan.  Påföljden blev villkorlig dom och dagsböter på 8 000 kronor. Dessutom ska han betala drygt 260 000 kronor i skadestånd till såväl mackägare som drabbade kunder. Mannen har erkänt samtliga fall av skadegörelse, men döms mot sitt nekande när det kommer till resterande brott.", "link": "https://www.tv4.se/artikel/1cwxDQGmtAOBMsj8Gs3wDr/braenslemannen-klippte-slangar-pa-13-mackar-fel-av-mig", "date_display": "2026-06-12", "date_iso": "2026-06-12T11:44:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/branslepriset"]}, {"id": 145, "title": "Mine hole sealed off again - police confirm murder investigation", "summary": "It was about four years ago that a woman was found badly injured in a mine hole in Norberg. 41-year-old Taher Amini was later sentenced to life imprisonment and deportation for aggravated rape and attempted murder after pushing a woman down a mine hole in Norberg.  Now the police have blocked off the mine hole again to carry out investigations regarding a suspected murder.  - We will conduct investigations at the scene, but it will not take place within the next few days because it is a difficult and difficult environment to access, says police spokesperson Stefan Larsson to TV4 Nyheterna. It is the police's Cold Case Unit that is investigating the case, which is said to have occurred several years ago. But the police do not want to comment further, citing an ongoing preliminary investigation. - I can say that it's the same geographical area, but I can't go any closer than that, says Stefan Larsson. Discovered by passers-by The woman who was pushed down survived the fall of 24 meters and lay injured in the mine hole for about a day, before she was discovered by chance by passers-by and could be rescued.  After the fall, according to the woman, the man started throwing bricks at her.  He then disappeared to later return with rope. He said he would save her, but the woman didn't trust him and wouldn't let him help her. Then he must have picked up more bricks and thrown them down the hole.  Said that he killed his wife According to information in the preliminary investigation, the woman and the man got to know each other in an asylum accommodation.  The woman is said to have stated in the police interrogation that the man, before he pushed her down the mine hole, told her that he had killed his ex-wife. It also appears from the preliminary investigation that the ex-wife was reported missing in 2019. The police then did not investigate any crime in connection with the disappearance.  The couple's common child was placed in a family home after the man was arrested.", "title_original": "Gruvhålet avspärrat på nytt – polisen bekräftar mordutredning", "summary_original": "Det var för cirka fyra år sedan som en kvinna hittades svårt skadad i ett gruvhål i Norberg. 41-årige Taher Amini dömdes senare till livstids fängelse och utvisning för grov våldtäkt och mordförsök efter att ha knuffat ner en kvinna i ett gruvhål i Norberg.  Nu har polisen spärrat av gruvhålet på nytt för att genomföra undersökningar gällande ett misstänkt mord.  – Vi kommer genomföra undersökningar på platsen, men det kommer inte ske inom de närmaste dagarna eftersom det är en svårtillgänglig och besvärlig miljö, säger polisens presstalesperson Stefan Larsson till TV4 Nyheterna. Det är polisens enhet för Kalla fall som utreder fallet som ska ha inträffat för flera år sedan. Men polisen vill inte kommentera närmare med hänvisning till en pågående förundersökning. – Jag kan säga att det är samma geografiska område, men kan inte gå in närmare än så, säger Stefan Larsson. Upptäcktes av förbipasserande Kvinnan som knuffades ner överlevde fallet på 24 meter och låg skadad i gruvhålet i ungefär ett dygn, innan hon av en slump upptäcktes av förbipasserande och kunde räddas.  Efter fallet började mannen enligt kvinnan kasta tegelstenar mot henne.  Därefter försvann han för att senare återkomma med rep. Han sade att han skulle rädda henne, men kvinnan litade inte på honom och lät honom inte hjälpa henne. Då ska han ha hämtat fler tegelstenar och kastat ned i hålet.  Sagt att han dödat sin fru Enligt uppgifter i förundersökningen har kvinnan och mannen lärt känna varandra på ett asylboende.  Kvinnan ska i polisförhör uppgett att mannen innan han knuffade ner henne i gruvhålet berättat att han dödat sin exfru. Det framgår också av förundersökningen att exfrun anmäldes försvunnen 2019. Polisen utredde då inget brott i samband med försvinnandet.  Parets gemensamma barn placerades på familjehem efter att mannen greps.", "link": "https://www.tv4.se/artikel/4xXJBXLrX5joV1EIHQP2jB/gruvhalet-i-norberg-avspaerrat-pa-nytt-bekraeftar-ny-mordutredning", "date_display": "2026-06-12", "date_iso": "2026-06-12T09:35:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/gruvdramat-i-norberg", "/mord"]}, {"id": 146, "title": "Details: Police alerted to 'hit list' in Belfast", "summary": "Contained the address that has now been attacked • TV4 Nyheterna on the spot", "title_original": "Uppgifter: Polisen varnades om ”attacklista” i Belfast", "summary_original": "Innehöll adressen som nu attackerats • TV4 Nyheterna på plats", "link": "https://www.tv4.se/artikel/30PU5tM3d72lui8xczZXQm/uppgifter-polisen-varnades-om-attacklista-i-belfast", "date_display": "2026-06-12", "date_iso": "2026-06-12T09:07:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 147, "title": "Report: Russian advances against NATO \"in the relatively near future\"", "summary": "According to the Defense Committee, there is a risk of a rapid deterioration of the security policy situation, they state in a new report. They also emphasize that the quality and competence must be increased and the defense must find more suppliers.  \"An armed attack against Sweden or our allies cannot be ruled out. Nor can it be ruled out that military means of power or threats of such might be used against Sweden or our allies,\" they write in their report.  Russian advances Russia is judged to be able to make military advances against NATO \"in the relatively near future\", in order to test NATO's cohesion and the credibility of Article Five. This despite the fact that the Russians do not really have enough military strength for an attack on NATO. Before, it was assessed that there was a risk that Russia would test NATO after the war in Ukraine is over, but now it is believed that it could happen earlier. The report also concludes that Sweden's security situation continues to deteriorate and that Russia is stepping up its military presence around the Baltic Sea. Delivery delays At the same time, problems with delivery delays are raised. \"Quality deficiencies and a lack of competence in the defense industry must be remedied by the suppliers, and the supplier base needs to be broadened by the FMV (Defence Materiel Agency) to reduce the risk of supply disruptions,\" writes the report. \"The defense committee assesses that there may be reasons to review whether more extensive breaches of contract should have negative consequences for the defense industry and to also task FMV with improving its forecasting tools,\" they write further. All parties agree All eight Riksdag parties stand behind the report as a whole, according to Chairman Jörgen Berglund, although he notes that there are \"a number of dissenting opinions\". That image is confirmed by, among others, Hanna Gunnarson, the Left Party's defense policy spokesperson.  - We are essentially in agreement and it is very important in defense and security policy that we continue to be so. The important thing for me is that", "title_original": "Rapport: Ryska framstötar mot Nato ”i relativ närtid”", "summary_original": "Enligt Försvarsberedningen finns en risk för en snabb försämring av det säkerhetspolitiska läget, uppger de i en ny rapport. De betonar också att kvaliteten och kompetensen måste höjas och försvaret måste hitta fler leverantörer.  ”Ett väpnat angrepp mot Sverige eller våra allierade kan inte uteslutas. Det kan heller inte uteslutas att militära maktmedel eller hot om sådana kan komma att användas mot Sverige eller våra allierade”, skriver de i sin rapport.  Ryska framstötar Ryssland bedöms kunna göra militära framstötar mot Nato ”i relativ närtid”, för att testa Natos sammanhållning och trovärdigheten i artikel fem. Detta trots att ryssarna egentligen inte har tillräckligt med militär styrka för ett angrepp mot Nato. Innan har man bedömt att det fanns en risk att Ryssland testar Nato efter att kriget i Ukraina är över, men nu tror man alltså att det kan ske tidigare. Beredningen drar även slutsatserna att Sveriges säkerhetsläge fortsätter att försämras och att Ryssland trappar upp sin militära närvaro runt Östersjön. Leveransförseningar Samtidigt lyfts problem med leveransförseningar. ”Kvalitetsbrister och brist på kompetens vid försvarsindustrin måste åtgärdas av leverantörerna, och leverantörsbasen behöver breddas av FMV (Försvarets materielverk) för att minska risken för leveransstörningar”, skriver beredningen. ”Försvarsberedningen bedömer att det kan finnas skäl att se över om mer omfattande avtalsbrott bör få negativa konsekvenser för försvarsindustrin och att även ge FMV i uppdrag att förbättra sina prognosverktyg”, skriver de vidare. Alla partier eniga Samtliga åtta riksdagspartier står bakom rapporten som helhet, enligt ordförande Jörgen Berglund, även om han konstaterar att det finns ”ett antal avvikande meningar”. Den bilden bekräftas av bland andra Hanna Gunnarson, Vänsterpartiets försvarspolitiska talesperson.  – Vi är i huvudsak överens och det är väldigt viktigt i försvars- och säkerhetspolitiken att vi fortsätter vara det. Det viktiga för mig är att vi satsar på det civila försvaret, och ser till att vi har en välfungerande välfärd och infrastruktur som fungerar i vardagen för att kunna fungera i kris, eller i värsta fall kris, säger Hanna Gunnarson (V).", "link": "https://www.tv4.se/artikel/47qfvYyG6oDWQMfUQHxVnL/rapport-ryska-framstoetar-mot-nato-i-relativ-naertid", "date_display": "2026-06-12", "date_iso": "2026-06-12T08:59:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/forsvarsmakten", "/nato", "/forsvaret"]}, {"id": 148, "title": "Hoffsten praises the wheelchair: \"Among the funnest things I've done\"", "summary": "After over 30 years with the disease MS, Louise Hoffsten has learned to adapt her life to her body's new conditions. The disease has gradually gotten worse, but she also describes how her view of aids has changed. - I have been able to accept using aids. There will be a lot of different aids in my life, and that's great, she says. Today, she uses, among other things, a walker and sees the aids as a way to continue being active both in everyday life and in her work as an artist. Attended wheelchair training In order to learn how to handle his situation better, Hoffsten also chose to attend wheelchair training. Something that turned out to be an unexpectedly positive experience. - It was one of the funnest things I've ever done in my life. It is a highlight, she says. Previously, she associated the wheelchair with limitations. Today, she sees it as the opposite. - You must not forget that it is an aid so that you can be active in life and keep going. Continues to tour Despite the illness, Louise Hoffsten continues to be on stage. Several gigs await this summer, including on the west coast, where both the audience and the food attract. - My life is very good, she says. At the same time, she has recently released recordings that had been forgotten for over 20 years. But it is not nostalgia that drives her, but the desire to continue creating. - I feel more free now. Now I do what I want, says Louise Hoffsten.", "title_original": "Hoffsten hyllar rullstolen: ”Bland det roligaste jag gjort”", "summary_original": "Efter över 30 år med sjukdomen MS har Louise Hoffsten lärt sig att anpassa livet efter kroppens nya förutsättningar. Sjukdomen har gradvis blivit sämre, men hon beskriver samtidigt hur hennes syn på hjälpmedel förändrats. – Jag har kunnat acceptera att använda hjälpmedel. Det blir en massa olika hjälpmedel i mitt liv, och det är jättebra, säger hon. I dag använder hon bland annat rollator och ser hjälpmedlen som ett sätt att fortsätta vara aktiv både i vardagen och i arbetet som artist. Gick rullstolsutbildning För att lära sig hantera sin situation bättre valde Hoffsten även att gå en rullstolsutbildning. Något som visade sig bli en oväntat positiv upplevelse. – Det var bland det roligaste jag gjort i mitt liv. Det är en höjdpunkt, säger hon. Tidigare förknippade hon rullstolen med begränsningar. I dag ser hon den som motsatsen. – Man får inte glömma att det är ett hjälpmedel så att du kan vara aktiv i livet och hålla igång. Fortsätter att turnera Trots sjukdomen fortsätter Louise Hoffsten att stå på scen. I sommar väntar flera spelningar, bland annat på västkusten, där både publiken och maten lockar. – Mitt liv är väldigt bra, säger hon. Samtidigt har hon nyligen släppt inspelningar som legat bortglömda i över 20 år. Men det är inte nostalgin som driver henne, utan lusten att fortsätta skapa. – Jag känner mig mer fri nu. Nu gör jag vad jag vill, säger Louise Hoffsten.", "link": "https://www.tv4.se/artikel/2afprpX5s68fXhISztQ3Mb/louise-hoffsten-jag-trodde-rullstolen-var-det-vaersta-som-kunde-haenda", "date_display": "2026-06-12", "date_iso": "2026-06-12T08:47:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/personer/louise-hoffsten", "/musik", "/livsoden", "/sjukdomar"]}, {"id": 149, "title": "The meteorologist's message: Here it can be 25 degrees in midsummer", "summary": "In southern Sweden, the midsummer weather thus looks to be warmer than what we have been used to lately. At the same time, the low pressure is expected to continue to affect the northern part of the country, where temperatures look set to land between 14 and 18 degrees. - The unsettled weather looks set to remain over the northern half of the country, says Westin. The low pressure is expected to move in from the west, while a high pressure over the continent will help push up warmer air over southern Sweden. The forecast is still uncertain, but the latest calculations point to classic midsummer weather with both glimpses of sun and local rain showers. Scientists warn of the World Cup heat At the same time, eyes are directed towards North America, where the football World Cup will be played this summer. There, it is not rain but heat that worries the experts. Scientists have warned that the heat stress could become extreme in several of the championship's arenas. The assessment is based on analyzes of 20 years of weather data where temperature, humidity, wind, solar radiation and clothing have been weighed together. - When the temperature reaches 28 degrees, it becomes an enormous strain on the body, says Westin. The arenas in Dallas and parts of Mexico are considered particularly vulnerable. In Dallas, where Sweden has its WC camp, the perceived temperature can periodically be even higher. - When you reach 30, it is a strain on the heart. Therefore, scientists have gone out and warned Fifa about this, says Westin. According to the meteorologist, it is not just the temperature on the thermometer that matters. The combination of heat, high humidity and strong sun causes the load on the body to be significantly greater than the numbers alone show. However, some matches are played in indoor arenas, which can reduce the risks for both players and spectators. But on the open arenas, the heat is expected to be a factor to be reckoned with throughout the championship.", "title_original": "Meteorologens besked: Här kan det bli 25 grader på midsommar", "summary_original": "I södra Sverige ser alltså midsommarvädret ut att bli varmare än vad vi vant oss vid den senaste tiden. Samtidigt väntas lågtrycken fortsätta att påverka norra delen av landet, där temperaturerna ser ut att landa mellan 14 och 18 grader. – Det ostadiga vädret ser ut att ligga kvar över den norra halvan av landet, säger Westin. Lågtrycken väntas dra in västerifrån medan ett högtryck över kontinenten hjälper till att pressa upp varmare luft över södra Sverige. Prognosen är fortfarande osäker, men de senaste beräkningarna pekar på ett klassiskt midsommarväder med både solglimtar och lokala regnskurar. Forskare varnar för VM-hettan Samtidigt riktas blickarna mot Nordamerika där fotbolls-VM spelas i sommar. Där är det inte regn utan värme som oroar experterna. Forskare har varnat för att värmestressen kan bli extrem på flera av mästerskapets arenor. Bedömningen bygger på analyser av 20 års väderdata där temperatur, luftfuktighet, vind, solinstrålning och klädsel vägts samman. – När temperaturen når 28 grader blir det en oerhörd påfrestning för kroppen, säger Westin. Särskilt utsatta bedöms arenorna i Dallas och delar av Mexiko vara. I Dallas, där Sverige har sitt VM-läger, kan den upplevda temperaturen periodvis bli ännu högre. – När man når upp mot 30 är det en påfrestning för hjärtat. Därför har forskare gått ut och varnat Fifa för det här, säger Westin. Enligt meteorologen är det inte bara temperaturen på termometern som spelar roll. Kombinationen av värme, hög luftfuktighet och stark sol gör att belastningen på kroppen blir betydligt större än vad siffrorna ensamma visar. Vissa matcher spelas dock på inomhusarenor, vilket kan minska riskerna för både spelare och publik. Men på de öppna arenorna väntas värmen bli en faktor att räkna med under hela mästerskapet.", "link": "https://www.tv4.se/artikel/1BYivbiQQ2skpjCX17r5wY/vaeder-madde-haer-kan-det-bli-25-grader-pa-midsommar", "date_display": "2026-06-12", "date_iso": "2026-06-12T07:29:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/vadret", "/vader", "/vaderprognoser", "/fotbolls-vm-2026"]}, {"id": 150, "title": "The government: More authorities may be allowed to shoot down drones", "summary": "Today, only the Police Agency of the country's civil authorities is allowed to intervene against enemy drones. With reference to the current security policy situation, the government now wants to review which additional actors should receive similar mandates. - It could be about more actors being given the authority to, for example, shoot down drones. But it can also be about gaining the ability to fight drones electronically or to use other types of countermeasures, says Carl-Oskar Bohlin.  - In short, it's about protecting activities that are important to society.  The Coast Guard an example Carl-Oskar Bohlin leaves the question of how it should look organizationally and which specific authorities should be covered to the investigator, former Air Force Chief Mats Helgesson. He points to the Coast Guard as an example.  - We have already taken measures and steps to, for example, give the Coast Guard a strengthened ability for self-protection. It could also mean in the future that one gets better powers and abilities to fight drones. Will review drone use The investigation will also look at what the need for, for example, tracking drones looks like and how the own use of them can increase among activities within the civil defense.  – Emergency services, healthcare, transport of resources and use of drones for surveillance. The investigator will look at all that in order to come up with proposals for legislative changes that need to be implemented, says Carl-Oskar Bohlin.  The investigation will present its proposals in October next year.", "title_original": "Regeringen: Fler myndigheter kan få skjuta ner drönare", "summary_original": "I dag är det bara Polismyndigheten av landets civila myndigheter som får ingripa mot fientliga drönare. Med hänvisning till det rådande säkerhetspolitiska läget vill regeringen nu se över vilka ytterligare aktörer som bör få liknande mandat. – Det kan handla om att fler aktörer får befogenheter att till exempel skjuta ned drönare. Men det kan också handla om att få förmåga att bekämpa drönare elektroniskt eller att använda andra typer av motmedel, säger Carl-Oskar Bohlin.  – Kort sagt handlar det om att skydda samhällsviktig verksamhet.  Kustbevakningen ett exempel Frågan om hur det ska se ut organisatoriskt och vilka specifika myndigheter som ska omfattas lämnar Carl-Oskar Bohlin över till utredaren, tidigare flygvapenchefen Mats Helgesson. Han pekar på Kustbevakningen som ett exempel.  – Vi har redan tagit mått och steg för att exempelvis ge Kustbevakningen en förstärkt förmåga till självskydd. Det skulle också i framtiden kunna betyda att man får bättre befogenheter och förmågor att bekämpa drönare. Ska se över drönaranvändning  Utredningen ska också titta på hur behovet av till exempel spårning av drönare ser ut och hur den egna användningen av dem kan öka bland verksamheter inom det civila försvaret.  – Räddningstjänst, sjukvård, transporter av resurser och användning av drönare för övervakning. Allt det kommer utredaren att titta på för att ta fram förslag på lagändringar som behöver genomföras, säger Carl-Oskar Bohlin.  Utredningen ska presentera sina förslag i oktober nästa år.", "link": "https://www.tv4.se/artikel/37ubk6f6UgVMigCAs7yXFU/regeringen-fler-myndigheter-ska-fa-skjuta-ner-droenare", "date_display": "2026-06-12", "date_iso": "2026-06-12T04:30:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Svensk politik", "/politik", "/civilt-forsvar", "/dronare", "/regeringen", "/inrikes"]}, {"id": 151, "title": "The mission house that almost died had a successful summer party", "summary": "The passionate David Magnusson renovated the chapel all by himself: I hope that the small congregation will be allowed to remain", "title_original": "Missionshuset som nästan dog hade lyckad sommarfest", "summary_original": "Eldsjälen David Magnusson renoverade kapellet helt själv: Jag hoppas att den lilla församlingen ska få finnas kvar", "link": "https://www.dagen.se/familj/missionshuset-som-naestan-dog-hade-lyckad-sommarfest/10370456", "date_display": "2026-06-12", "date_iso": "2026-06-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Here is Dagen's Christian starting eleven", "summary": "They play in different national teams, but have one thing in common, their Christian faith • Have Jesus as their personal coach", "title_original": "Här är Dagens kristna startelva", "summary_original": "De spelar i olika landslag, men har en sak gemensamt, sin kristna tro •  Har Jesus som sin personliga coach", "link": "https://www.dagen.se/dokument/haer-aer-dagens-kristna-startelva/10377206", "date_display": "2026-06-12", "date_iso": "2026-06-12T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "The Church has no political ideology – it has Christ", "summary": "The church has often felt best when it was close enough to society to be able to influence it, but at the same time free enough to also be able to criticize it, writes Jacob Rudenstrand.", "title_original": "Kyrkan har ingen politisk ideologi – den har Kristus", "summary_original": "Kyrkan har ofta mått bäst när den stått tillräckligt nära samhället för att kunna påverka det, men samtidigt tillräckligt fri för att också kunna kritisera det, skriver Jacob Rudenstrand.", "link": "https://www.dagen.se/debatt/kyrkan-har-ingen-politisk-ideologi-de
