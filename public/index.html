 blev liggande på baksidan av ett av husen. Delar av flygplanet spreds över tomten och på ett hustak. Orsaken utreds Orsaken till kraschen är okänd. FAA och den amerikanska haverikommissionen NTSB ska nu utreda händelsen. Röda korset hjälper familjerna som fått sina hem skadade.", "link": "https://www.tv4.se/artikel/76fefiEYECO73rqtCD8g4u/flygplan-kraschade-in-i-tva-villor-hamnade-i-traedgard", "date_display": "2026-03-04", "date_iso": "2026-03-04T21:40:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/flygplan", "/arizona", "/krasch", "/olycka"]}, {"id": 126, "title": "US arsenal at war: 'Massive effort'", "summary": "Warships, attack drones and stealth bombers. Here are some of the high-tech weapons and equipment that the US has used so far to attack Iran. - It is a massive effort with military resources from the US air force and navy, says Andreas Hörnedal, research leader at FOI.", "title_original": "USA:s vapenarsenal i kriget: ”Massiv insats”", "summary_original": "Krigsfartyg, attackdrönare och smygbombplan. Här är några av de högteknologiska vapen och den utrustning som USA hittills använt för att attackera Iran. – Det är en massiv insats med militära resurser från USA:s flygvapen och flotta, säger Andreas Hörnedal, forskningsledare på FOI.", "link": "https://www.dn.se/varlden/usas-vapenarsenal-i-kriget-massiv-insats/", "date_display": "2026-03-04", "date_iso": "2026-03-04T21:24:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Expert: Can be longer, more expensive and more difficult to fly", "summary": "Thousands of Swedes have been stranded as a result of the conflict in the Middle East. If the attacks continue, air travelers will in the long run suffer from longer, more expensive journeys - while flying is not completely harmless, says aviation expert Jan Ohlsson. The Swedish Transport Agency states, on the other hand, that it is safe to fly as long as the airspace is open.", "title_original": "Expert: Kan bli längre, dyrare och svårare att flyga", "summary_original": "Tusentals svenskar har blivit strandade till följd av konflikten i Mellanöstern. Om anfallen fortsätter kommer flygresenärer på sikt drabbas av längre, dyrare resor – samtidigt som det inte är helt ofarligt att flyga, menar flygexperten Jan Ohlsson. Transportstyrelsen uppger å andra sidan att det är säkert att flyga så länge luftrummen är öppna.", "link": "https://www.dn.se/varlden/expert-kan-bli-langre-dyrare-och-svarare-att-flyga/", "date_display": "2026-03-04", "date_iso": "2026-03-04T21:19:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "He is the only one who dares to defy Trump", "summary": "", "title_original": "Han är den ende som vågar trotsa Trump", "summary_original": "", "link": "https://www.tv4.se/artikel/2Se9mJ9XSQISzxXF3P4GKw/han-aer-den-ende-som-vagar-att-trotsa-trump", "date_display": "2026-03-04", "date_iso": "2026-03-04T20:47:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 129, "title": "Jonas Sjöstedt: Should the Kurds side with the US again?", "summary": "The Kurds liberated large areas of Syria from IS's reign of terror. Then they were abandoned by their allies in the West. Is history at risk of repeating itself in Iran? Jonas Sjöstedt, MEP for the Left Party, has visited the threatened self-government in Rojava.", "title_original": "Jonas Sjöstedt: Ska kurderna ställa upp på USA:s sida igen?", "summary_original": "Kurderna befriade stora områden av Syrien från IS terrorvälde. Sedan övergavs de av sina allierade i väst. Riskerar historien att upprepa sig i Iran? Jonas Sjöstedt, europaparlamentariker för Vänsterpartiet, har besökt det hotade självstyret i Rojava.", "link": "https://www.dn.se/kultur/jonas-sjostedt-ska-kurderna-stalla-upp-pa-usas-sida-igen/", "date_display": "2026-03-04", "date_iso": "2026-03-04T20:44:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Anders Haraldsson: Here are the 9 best events in Stockholm", "summary": "Cult-proclaimed porn is brought to life, right-wing extremist ideas spread, and which is the most realistic disaster? DN's Anders Haraldsson guides here to the most interesting concerts, exhibitions and premieres - book before it's too late. See even more daily tips and events here.", "title_original": "Anders Haraldsson: Här är de 9 bästa evenemangen i Stockholm", "summary_original": "Kultförklarad porrfilm väcks till liv, så sprids högerextrema idéer och vilken är den mest realistiska katastrofen? DN:s Anders Haraldsson guidar här till de mest sevärda konserterna, utställningarna och premiärerna – boka innan det är för sent. Se ännu fler dagliga tips och evenemang här.", "link": "https://www.dn.se/kultur/anders-haraldsson-har-ar-de-9-basta-evenemangen-i-stockholm-2/", "date_display": "2026-03-04", "date_iso": "2026-03-04T20:38:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "\"We only demanded our right and received bullets in response\"", "summary": "Kathmandu-Hariyon. She became a figurehead for the Generation Z demonstrations. Rakshya Bam, 26, was asked by the army chief who she wanted as Nepal's next prime minister. - The politicians have seen the power of us young people, she says. But the students had to pay a high price during the revolt.", "title_original": "”Vi krävde bara vår rätt och fick kulor som svar”", "summary_original": "Katmandu-Hariyon. Hon blev en frontfigur för demonstrationerna från Generation Z. Rakshya Bam, 26, fick frågan från arméchefen om vem hon ville ha som Nepals nästa premiärminister. – Politikerna har sett kraften från oss unga, säger hon. Men studenterna fick betala ett högt pris under revolten.", "link": "https://www.dn.se/varlden/vi-kravde-bara-var-ratt-och-fick-kulor-som-svar/", "date_display": "2026-03-04", "date_iso": "2026-03-04T19:59:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Anna-Lena Laurén: Friedrich Merz is now Trump's favorite European", "summary": "BERLIN. Merz's visit to the White House was a success. Suddenly, Germany - which Trump has always despised - is the new favorite of the American president. But that can change quickly.", "title_original": "Anna-Lena Laurén: Friedrich Merz är nu Trumps favoriteuropé", "summary_original": "BERLIN. Merz besök i Vita huset var en framgång. Plötsligt är Tyskland – som Trump alltid har föraktat – den amerikanska presidentens nya gunstling. Men det kan ändras snabbt.", "link": "https://www.dn.se/varlden/anna-lena-lauren-friedrich-merz-ar-nu-trumps-favoriteurope/", "date_display": "2026-03-04", "date_iso": "2026-03-04T19:45:28+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "\"Now I have two boobs again\"", "summary": "The artist talks openly about the new fight against the disease, and above all about the psychological pressure during the time between examinations, surgery and the announcement. - This has been a tougher journey, actually physically but above all mentally, to get it back again after 20 years. Months of uncertainty After the mammogram, she was called back for more examinations. Then followed months of uncertainty. - It has been four months with new examinations, meetings with doctors, surgery and another month of uncertainty. Has it spread? When the news finally came, she could breathe a sigh of relief. - When I learned that it had not spread, I began to be able to look ahead again and feel: Now we are driving. The support that carried her At the same time, she describes how important the support from family and friends was during the difficult time. - I have had an absolutely incredible network of loved ones who have sent text messages and said: Now we go for walks, Facetime and everything possible. Now she looks ahead again. The anniversary tour that was supposed to celebrate 40 years as an artist had to be postponed during the treatment, but next year Nanne Grönvall plans to make up for the celebration and that with a bang.\n\n- It will be a big party, at a big Circus with lots of guest artists.", "title_original": "”Nu har jag två boobs igen”", "summary_original": "Artisten berättar öppet om den nya kampen mot sjukdomen, och framförallt om den psykiska pressen under tiden mellan undersökningar, operation och besked. – Det här har varit en tuffare resa, egentligen fysiskt men framför allt psykiskt, att få tillbaka det igen efter 20 år. Månader av ovisshet Efter mammografin kallades hon tillbaka för fler undersökningar. Därefter följde månader av ovisshet. – Det har varit fyra månader med nya undersökningar, möten med läkare, operation och ovisshet ytterligare en månad. Har det spridits? När beskedet till slut kom kunde hon andas ut. – När jag fick veta att det inte hade spridit sig började jag kunna titta framåt igen och känna: Nu kör vi. Stödet som bar henne  Samtidigt beskriver hon hur viktigt stödet från familj och vänner varit under den svåra tiden. – Jag har haft ett helt otroligt nätverk av nära och kära som har skickat sms och sagt: Nu tar vi promenader, Facetime och allt möjligt. Nu blickar hon framåt igen. Jubileumsturnén som skulle fira 40 år som artist fick skjutas upp under behandlingen, men nästa år planerar Nanne Grönvall att ta igen firandet och det med råge.\n\n– Det kommer bli ett big party, på stora Cirkus med massor av gästartister.", "link": "https://www.tv4.se/artikel/5WbIPjq2qFbAdHq1ziYRnA/nanne-groenvall-om-operationen-nu-har-jag-tva-boobs-igen", "date_display": "2026-03-04", "date_iso": "2026-03-04T19:35:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Musik", "/musik", "/efter-fem", "/halsa", "/brostcancer", "/nanne-gronvall", "/show"]}, {"id": 134, "title": "Matilda Källén: It is logical that as a straight woman I appreciate the love of two hockey guys", "summary": "Now Matilda Källén is one of all those stuck in front of the hockey boys' romance, and she wonders a little amazed how it happened. But maybe it's just nice to escape the traditional gaze on women?", "title_original": "Matilda Källén: Det är logiskt att jag som heterokvinna uppskattar två hockeykillars kärlek", "summary_original": "Nu är Matilda Källén en av alla dem som fastnat framför hockeykillarnas romans och hon undrar lite förundrat hur det gick till. Men kanske är det bara skönt att slippa den traditionella blicken på kvinnan?", "link": "https://www.dn.se/kultur/matilda-kallen-det-ar-logiskt-att-jag-som-heterokvinna-uppskattar-tva-hockeykillars-karlek/", "date_display": "2026-03-04", "date_iso": "2026-03-04T19:26:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Now the spring heat is thundering over the country - SMHI is redrawing the map", "summary": "The updated seasonal map from SMHI now shows that large parts of southern Sweden have crossed the border for meteorological spring. After several days with temperatures above zero degrees in a row, this evening the definition of spring reaches all the way up to northernmost Uppland. SMHI's criteria are based on seven days of spring temperature, something that the mild weather of the last day has meant that increasingly large areas now meet the requirements. Unusually early TV4 News meteorologist Peter Kondrup describes the situation as unusual. - It is at least a week earlier than normal, maybe ten days, he says. He explains that until today there has only been meteorological spring in isolated parts of the country. After Wednesday's heat, it will be a completely different map. - It's only parts of Skåne and the West Coast so far. Now it suddenly becomes a large area over Götaland and southern and eastern Svealand. There is a real surge across southern and central Sweden, says Kondrup. On Tuesday, the year's highest temperature so far was also recorded: 15.8 degrees in Kristianstad. This is how the weather will be in the next few days. The air temperature is expected to be between 10 and 14 degrees in the south for the next week. In several places in both Götaland and Svealand, the temperature has already been close to ten degrees, and up to nine degrees in southernmost Norrland. - During Thursday it will certainly also rise to around, or in any case up to 10 degrees. Much like on Wednesday, says Kondrup. A temporary dip is expected on Saturday as a cold front passes. But already on Sunday, the spring heat will return again. - Then we can have double digits all the way up the Norrland coast and maybe up to 12-13 degrees again. Maybe even hotter, he says. 20‑degree feeling Despite the fact that the air does not reach summer temperatures, the sun can create significantly higher perceived heat. - If you sit leeward against a sunny wall, it can feel like 15-20 degrees, says Kondrup. The difference largely depends on how hot the wall gets. - A house wall can be, if it is dark, perhaps up to 20-30 degrees hot. A l", "title_original": "Nu dundrar vårvärmen in över landet – SMHI ritar om kartan", "summary_original": "Den uppdaterade årstidskartan från SMHI visar nu att stora delar av södra Sverige har passerat gränsen för meteorologisk vår. Efter flera dygn med temperaturer över noll grader i följd når vårdefinitionen i kväll hela vägen upp till nordligaste Uppland. SMHI:s kriterier bygger på sju dygn med vårtemperatur, något som det senaste dygnets milda väder gjort att allt större områden nu uppfyller kraven. Ovanligt tidigt TV4 Nyheternas meteorolog Peter Kondrup beskriver läget som ovanligt. – Det är åtminstone en vecka tidigare än normalt, kanske tio dagar, säger han. Han förklarar att det fram till i dag bara varit meteorologisk vår i enstaka delar av landet. Efter onsdagens värme blir det en helt annan karta. – Det är bara delar av Skåne och Västkusten hittills. Nu blir det helt plötsligt ett stort område över Götaland och södra och östra Svealand. Det är ett rejält skutt upp över södra och mellersta Sverige, säger Kondrup. Under tisdagen noterades dessutom årets hittills högsta temperatur: 15,8 grader i Kristianstad. Så blir vädret närmaste dagarna Lufttemperaturen väntas ligga mellan 10 och 14 grader i söder den närmaste veckan. På flera håll i både Götaland och Svealand har temperaturen redan legat nära tio grader, och upp mot nio grader i sydligaste Norrland. – Under torsdagen kommer det säkerligen också gå upp i runt, eller i alla fall uppemot 10 grader. Ungefär som under onsdagen, säger Kondrup. En tillfällig dipp väntas på lördagen när en kallfront passerar. Men redan på söndag kommer vårvärmen tillbaka igen. – Då kan vi ha tvåsiffrigt ända upp över hela Norrlandskusten och kanske upp mot 12–13 grader igen. Kanske ännu varmare, säger han. 20‑graderskänsla Trots att luften inte når sommartemperaturer kan solen skapa betydligt högre upplevd värme. – Sätter man sig i lä mot en solig vägg kan det kännas som 15–20 grader, säger Kondrup. Skillnaden beror till stor del på hur varm väggen blir. – En husvägg kan ju bli, om den är mörk, kanske upp mot 20–30 grader varm. En ljus vägg upp mot 20 grader, säger han. Uppmaningen: Sätt dig i solen Men vinden gör stor skillnad. – Det är under förutsättning att man sitter i lä. När vinden kommer åt så kyler den, då blir det ungefär som termometern visar, säger han. Kondrup pekar särskilt ut söndagen som idealisk för uteserveringar och solhäng. – Ta av jackan, sätt dig i lä och njut av en kaffe eller en drink i solen, säger han.", "link": "https://www.tv4.se/artikel/4M5BM7Xdu3yqP7jIvMAt9w/nu-dundrar-varvaermen-in-oever-landet-smhi-ritar-om-kartan", "date_display": "2026-03-04", "date_iso": "2026-03-04T19:00:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vadret", "/vader", "/vaderprognoser", "/var", "/vartecken", "/sol", "/sola", "/solskydd"]}, {"id": 136, "title": "The politician's proposal - to prevent unnecessary meetings", "summary": "The idea emerged when municipal politician Elmer Eriksson (M) reacted to how much working time is spent on meetings where few or no decisions are made. There are around 15,000 employees in Umeå municipality and, according to Eriksson, around 17 percent of working time is spent on meetings. He estimates that even a small reduction in meeting time could free up large sums. - In round numbers, it could be almost SEK 220 million. That money could be spent on the seniors or school students instead, he says in a proposal that was first raised in a submission in the Västerbottens-Kuriren. Want to make the cost visible In order to get more people to think about it, Eriksson wants the cost to be visible already when a meeting is booked. In the system, the number of participants and the length of the meeting must be automatically converted into money. - Then a price picture should come up immediately that tells you how much the meeting costs. Then you get food for thought, he says. The hope is that fewer people will be called to meetings and that the meetings that are held will be shorter and more focused. - Maybe next time you should take fewer people who are not really needed, or make sure that the meeting goes faster. Large meetings can be expensive According to Eriksson, large meetings with many participants can quickly add up in costs. He estimates that each working hour per person costs around SEK 500, including social security contributions. - Then you realize what the meeting actually costs. Maybe next time they should bring fewer people, or talk faster. He emphasizes that the proposal is not about stopping necessary meetings, but about using the municipality's resources more efficiently. - You can be a little tighter both in number of people and in time, and spend the money on the residents, says Elmer Eriksson.", "title_original": "Politikerns förslag – för att förebygga onödiga möten", "summary_original": "Idén växte fram när kommunpolitikern Elmer Eriksson (M) reagerade på hur mycket arbetstid som går åt till möten där få eller inga beslut fattas. I Umeå kommun finns omkring 15 000 anställda och enligt Eriksson går runt 17 procent av arbetstiden åt till möten. Han uppskattar att även en mindre minskning av mötestiden skulle kunna frigöra stora summor. – I runda tal kan det handla om nästan 220 miljoner kronor. De pengarna kunde man lägga på seniorerna eller skoleleverna i stället, säger han i ett förslag som lyftes först i en insändare i  Västerbottens-Kuriren. Vill synliggöra kostnaden För att få fler att tänka efter vill Eriksson att kostnaden ska synas redan när ett möte bokas. I systemet ska antal deltagare och mötets längd automatiskt räknas om till pengar. – Då ska det komma upp en prisbild direkt som talar om vad mötet kostar. Då får man en tankeställare, säger han. Förhoppningen är att färre personer kallas till möten och att de möten som hålls blir kortare och mer fokuserade. – Kanske skulle man nästa gång ta färre personer som egentligen inte behövs, eller se till att mötet går snabbare. Stora möten kan bli dyra Enligt Eriksson kan stora möten med många deltagare snabbt dra iväg i kostnad. Han räknar med att varje arbetstimme per person kostar omkring 500 kronor inklusive sociala avgifter. – Då inser man vad mötet faktiskt kostar. Kanske skulle man nästa gång ta med färre personer, eller prata fortare. Han betonar att förslaget inte handlar om att stoppa nödvändiga möten, utan om att använda kommunens resurser mer effektivt. – Man kan vara lite tajtare både i antal människor och i tid, och lägga pengarna på invånarna, säger Elmer Eriksson.", "link": "https://www.tv4.se/artikel/33RoMorMjXupWFly6Au8C5/politiker-vill-saetta-prislapp-pa-moeten", "date_display": "2026-03-04", "date_iso": "2026-03-04T17:43:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/politik", "/motesetik", "/arbete", "/arbetstid"]}, {"id": 137, "title": "Fraudsters' attempts to trick the stranded: \"People are so disgusting\"", "summary": "Swedish family torn apart • \"Appears like vultures\"", "title_original": "Bedragarnas försök att lura de strandsatta: ”Folk är så vidriga”", "summary_original": "Svenska familjen skärrad • ”Dyker upp som gamar”", "link": "https://www.tv4.se/artikel/58kaeHuO6BytgoxmLbVTYd/bedragarnas-foersoek-att-lura-de-strandsatta-folk-aer-sa-vidriga", "date_display": "2026-03-04", "date_iso": "2026-03-04T16:33:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 138, "title": "The police are raising the alarm about the criminal trend - which is carried out by children", "summary": "On Tuesday evening, the police arrested a 16-year-old boy who tried to set fire to a villa in Malmö. The same villa had been subjected to an arson attack last week.  Recently, three teenage girls and a 20-year-old man with links to the criminal network Foxtrot were sentenced for several fires. The girls carried out and planned fire attacks in Hässleholm, Eslöv and Örebro. They also filmed when they carried out the missions.  And the number of fire attacks has increased, according to the police. In early February, a family with small children had to be evacuated via the balcony after flammable liquid was poured through their letterbox in Helsingborg and lit. The door must also have been bolted from the outside with a plank. Three men are in custody on suspicion of the incident. In Malmö, Christmas Day ended with a violent fire and smoke build-up in an apartment building in Söderkulla, where around 50 residents were affected.  The fire was extinguished before it spread. A 17-year-old boy was arrested with burns after setting himself on fire when he lit a fire. \"A modus\" in Malmö According to the police, the recent dozen serious arsons at various addresses in Malmö are connected to an ongoing gang conflict. Rasem Chebil, operational manager of the investigation section at Malmö police, describes arson attacks as a recurring approach. - We have seen that it is a mode that has become here lately. It could be that there has been a poor supply of weapons, poor access to explosives or that you simply just scare someone into doing a certain thing and then it might have been easier to use arson attacks.  - It could also be that it is easier to get the young people to carry out arson attacks than to throw a hand grenade or shoot someone, says Rasem Chebil. Risk for innocents Around 10,000 fires are started every year, a significant part of which in schools and homes. There are no clear statistics on the number of serious arsons linked to organized crime, but the police are taking the development seriously. - The risk is that children will get hurt, d", "title_original": "Polisen larmar om kriminella trenden – som utförs av barn", "summary_original": "Under tisdagskvällen grep polisen en 16-årig pojke som försökte sätta eld på en villa i Malmö. Samma villa hade utsatts för ett brandattentat i förra veckan.  Nyligen dömdes tre tonårsflickor och en 20-årig man med kopplingar till det kriminella nätverket Foxtrot för flera bränder. Flickorna utförde och planerade brandattacker i Hässleholm, Eslöv och Örebro. De filmade även när de utförde uppdragen.  Och antalet brandattacker har ökat, enligt polisen. I början av februari fick en småbarnsfamilj evakueras via balkongen efter att brandfarlig vätska hälldes in genom deras brevinkast i Helsingborg och tändes på. Dörren ska också ha reglats utifrån med en planka. Tre män sitter häktade misstänkta för händelsen. I Malmö slutade juldagen med en våldsam brand och rökutveckling i ett flerfamiljshus på Söderkulla, där ett 50-tal boende berördes.  Branden kunde släckas innan den spred sig. En 17-årig pojke greps med brännskador efter att själv ha börjat brinna när han tände eld. ”En modus” i Malmö Den senaste tidens tiotal grova mordbränder på olika adresser i Malmö har enligt polisen koppling till en pågående gängkonflikt. Rasem Chebil, operativ chef för utredningssektionen vid Malmöpolisen, beskriver brandattentat som ett återkommande tillvägagångssätt. – Vi har sett att det är en modus som har blivit här sista tiden. Det kan ju vara så att det har varit dålig vapentillgång, dålig tillgång till sprängmedel eller att man helt enkelt bara skrämma någon att göra en viss sak och då kanske det varit enklare att använda sig av brandattentat.  – Det kan även vara så att det är enklare att få ungdomarna att utföra brandattentat än att kasta en handgranat eller skjuta någon, säger Rasem Chebil. Risk för oskyldiga Runt 10 000 bränder är anlagda varje år, varav en betydande del i skolor och bostäder. Det finns ingen tydlig statistik över antalet grova mordbränder kopplade till just organiserad brottslighet, men polisen ser allvarligt på utvecklingen. – Risken är ju att barn far illa, de här ungdomarna som utför de här, att de skadar sig själva men framför allt att man skadar andra människor och att man även skadar oskyldiga människor. Vi har ju sett också att man har tagit fel på adresser. Ungdomarna har nog blivit groomade att tro att det här är tryggt att göra medan de här anstiftarna eller beställarna egentligen inte bryr sig om ungdomarna, säger Rasem Chebil.", "link": "https://www.tv4.se/artikel/5lEndSZGbimUVWO0wu67Zz/polisen-larmar-om-kriminella-trenden-som-utfoers-av-barn", "date_display": "2026-03-04", "date_iso": "2026-03-04T16:18:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/malmo"]}, {"id": 139, "title": "He is acquitted of accusations of conversion therapy - may affect Sweden", "summary": "Christian man says he got rid of his homosexuality and was accused of using conversion therapy - unique court case could affect several EU countries.", "title_original": "Han frias från anklagelser om omvändelseterapi - kan påverka Sverige", "summary_original": "Kristen man säger att han blivit av med sin homosexuella läggning och stod åtalad för att ha tillämpat omvändelseterapi – unikt rättsfall kan påverka flera EU-länder.", "link": "https://www.dagen.se/nyheter/han-frias-fran-anklagelser-om-omvaendelseterapi-kan-paverka-sverige/10234151", "date_display": "2026-03-04", "date_iso": "2026-03-04T14:50:53+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "The robot attack could hasten the downfall – for Iran's regime", "summary": "Lieutenant Colonel: \"Most serious incident to date\"", "title_original": "Robotattacken kan snabba på undergången – för Irans regim", "summary_original": "Överstelöjtnant: ”Allvarligaste incidenten hittills”", "link": "https://www.tv4.se/artikel/6Wfgyhsr5Q5oXaj72pDU5y/robotattacken-kan-snabba-pa-undergangen-foer-irans-regim", "date_display": "2026-03-04", "date_iso": "2026-03-04T14:04:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 141, "title": "In the wind - after the comment about abortions", "summary": "A concertgoer recently shared a video on Tiktok from a Zara Larsson concert and wrote: \"I didn't know I was pregnant here, but at least my baby got to hear Midnight sun before I aborted.\" Zara Larsson jokingly replied: \"I killed the performance and then you killed it after the performance purrrrrr\" and republished the clip on her own account. The response has been interpreted by some as the pop star encouraging someone to kill a fetus. One person comments, among other things, that he \"is not against abortion, but gets a bad feeling from celebrating them\". Another person questions what's really funny about the answer. The world star continues to make headlines In January, when Zara Larsson was hitting the US, she made a similar move on social media. Then she directed criticism at the American migration police ICE and wrote, among other things, \"I love abortions\". TV4's popular culture reporter Astrid Strokirk is not surprised that the pop star is once again going viral because of something she said or wrote. - That woman is chronically online and replies to almost every comment. It feels like as her career grows, so does her confidence, which I think is fun to see, she tells TV4 Nyheterna. The Swedish artist was nominated this year for the first time for a Grammy for the album \"Midnight sun\". Her collaborative song with PinkPantheress is currently number one in the world, and she has just embarked on a tour of the US and Canada with over 30 sold out shows. - That she dares to go back to the Lush Life time when she posted the iconic Instagram post with a condom on her leg. I have missed that kind of angry behavior from her in recent years, says Astrid Strokirk. \"Could in the worst case lead to a boycott\" On Wednesday, Zara Larsson performs in Los Angeles, and her joking comment about abortion has sparked a series of reactions on social media. - Perhaps the outcome is not seen with warm eyes in a conservative USA, such outcomes can in the worst case lead to", "title_original": "I blåsväder – efter kommentaren om aborter", "summary_original": "En konsertbesökare delade nyligen en video på Tiktok från en Zara Larsson‑konsert och skrev: ”Jag visste inte att jag var gravid här, men åtminstone fick mitt barn höra Midnight sun innan jag gjorde abort.” Zara Larsson svarade skämtsamt: ”I killed the performance and then you killed it after the performance purrrrrr” och återpublicerade klippet på sitt eget konto. Svaret har av vissa tolkats som att popstjärnan uppmuntrar någon att döda ett foster. En person kommenterar bland annat att hen ”inte är emot abort, men får en dålig känsla av att fira dem”. En annan person ifrågasätter vad som egentligen är roligt med svaret. Världsstjärnan fortsätter skapa rubriker I januari, när Zara Larsson höll på att slå i USA, gjorde hon ett liknande utspel på sociala medier. Då riktade hon kritik mot den amerikanska migrationspolisen ICE och skrev bland annat ”I love abortions”. TV4:s populärkulturreporter Astrid Strokirk är inte förvånad över att popstjärnan återigen blir viral på grund av något hon sagt eller skrivit. – Den kvinnan är kroniskt online och svarar på nästan varenda kommentar. Det känns som att i takt med att hennes karriär växer, växer också självförtroendet, vilket jag tycker är kul att se, säger hon till TV4 Nyheterna. Den svenska artisten nominerades i år för första gången till en Grammy för albumet ”Midnight sun”. Hennes samarbetslåt med PinkPantheress ligger just nu etta i världen, och hon har precis inlett en turné i USA och Kanada med över 30 utsålda spelningar. – Att hon vågar gå tillbaka till Lush Life‑tiden när hon la upp det ikoniska instagraminlägget med en kondom på benet. Jag har saknat den typen av riviga beteende från henne de senaste åren, säger Astrid Strokirk. ”Kan i värsta fall leda till en bojkott” Under onsdagen uppträder Zara Larsson i Los Angeles, och hennes skämtsamma kommentar om abort har väckt en rad reaktioner i sociala medier. – Eventuellt ses inte utspelet med blida ögon i ett konservativt USA, sådana här utspel kan i värsta fall leda till en bojkott, säger Astrid Strokirk. De flesta i kommentarsfälten fortsätter dock på samma tema som Zara Larsson. ”The baby never saw the sun but at least it saw midnight sun”, skriver ett fan, och Astrid Strokirk har svårt att se att utspelet skulle få några konsekvenser för Larssons utsålda Nordamerika‑turné. – Publiken hon attraherar har samma typ av mörka humor, säger hon. TV4 Nyheterna har sökt Zara Larsson.", "link": "https://www.tv4.se/artikel/2MT2Gg8fwQs2myBFAt2SZF/zara-larsson-i-blasvaeder-efter-kommentar-om-aborter", "date_display": "2026-03-04", "date_iso": "2026-03-04T12:57:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/musik", "/utrikes", "/personer/zara-larsson", "/ice", "/abort"]}, {"id": 142, "title": "The dietitian's trick: How to get children to eat vegetables", "summary": "Both children and adults should eat around 500 grams of fruit and vegetables a day. In addition, legumes, such as beans and lentils, are recommended as a daily part of the diet.  Common mistake When it comes to getting children to eat more greens, persistence is often lacking. A common mistake is that parents give up too quickly. Introducing new flavors takes time – and requires patience. - It may not always go home the first time, but second, third, tenth. So have a little patience, says Karoline Pettersson, dietitian. She advises letting the children explore the food - feel, squeeze and taste at their own pace. You should preferably serve vegetables when the children are hungriest and not be afraid to mix fruit and vegetables. It's easy to just serve the classics, like carrot and cucumber, but there's not that much nutrition in cucumber. Five colors on the plate Instead of focusing only on the vegetables, Karoline Pettersson suggests that you talk about the colors on the plate and aim for five colors at every meal. Often a regular meal consists of about three colors – for example potatoes, meat or fish and a sauce. The challenge is to get it up to five, and let the extra colors come from vegetables. - There is usually a lot of nutrition in color. Another tip is to look for colors together with the children - and if they are old enough, take them to the store and make it a color hunt. That way, it will be easier to encourage vegetables. The dietitian also recommends making it more fun by varying how the vegetables are served. - Find slightly different ways to serve. It can be sticks or just presented in different bowls, says Karoline Pettersson.", "title_original": "Dietistens knep: Så får du barnen att äta grönsaker", "summary_original": "Både barn och vuxna bör äta omkring 500 gram frukt och grönt om dagen. Dessutom rekommenderas baljväxter, som bönor och linser, som en daglig del av kosten.  Vanliga misstaget När det handlar om att få barn att äta mer grönt brister det ofta i uthållighet. Ett vanligt misstag är att föräldrar ger upp för snabbt. Att introducera nya smaker tar tid – och kräver tålamod. – Det kanske inte alltid går hem första gången, men andra, tredje, tionde. Så ha lite tålamod, säger Karoline Pettersson, dietist. Hon tipsar om att låta barnen utforska maten – känna, klämma och smaka i sin egen takt. Man ska gärna servera grönsaker när barnen är som hungrigast och inte vara rädd för att blanda frukt och grönt. Det är lätt att man bara serverar de klassiska, som morot och gurka, men i gurka finns det inte så mycket näring. Fem färger på tallriken I stället för att fokusera på enbart grönsakerna föreslår Karoline Pettersson att man pratar om färgerna på tallriken och siktar på fem färger vid varje måltid. Ofta består en vanlig måltid av ungefär tre färger – till exempel  potatis, kött eller fisk och en sås. Utmaningen är att få upp det till fem, och låta de extra färgerna komma från grönsaker. –  I färg finns oftast mycket näring. Att annat tips att leta färger tillsammans med barnen – och om de är tillräckligt stora, ta med dem till butiken och gör det till en färgjakt. På det sätter blir det lättare att uppmuntra till grönsaker. Dietisten rekommenderar också att göra det roligare genom att variera hur grönsakerna serveras. – Hitta lite olika sätt att servera på. Det kan vara stavar eller bara lägga fram i olika skålar, säger Karoline Pettersson.", "link": "https://www.tv4.se/artikel/2BE9O5Nux5Pwji7z7AGXpb/dietistens-knep-sa-far-du-barnen-att-aeta-groensaker", "date_display": "2026-03-04", "date_iso": "2026-03-04T12:55:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/gronsaker", "/barn", "/foraldrar", "/familj"]}, {"id": 143, "title": "The popular TV4 program is making a comeback", "summary": "\"Talang\" has been paused and returned several times since its premiere on Swedish television in 2007. Now TV4 announces in its social media that the program is once again making a comeback. \"Do you or a friend have a talent that will take Sweden by storm? Tag them in the comment field now,\" reads a post on Instagram. When the program was last broadcast, in 2023, it was led by Pär Lernström and the jury consisted of David Batra, Helena Bergström, Johanna Nordström and Viktor Norén. Whether the same constellation returns is still unclear, as TV4 has not released any further information. According to information to TV4 Nyheterna, Talent is back in the table in 2027. This is Talent The program is a Swedish version of the British publication \"Britain's Got Talent\" and involves people with different kinds of skills applying to the program and presenting them in front of a jury. If they consider the talent to be of a sufficiently high level, the participant may continue in the competition. Several well-known profiles have had their breakthrough in Talang, including Zara Larsson who won as a 10-year-old in 2008, Jon Henrik Fjällgren with his cheering in 2014 and the memory champion Jonas von Essen who came in second place in 2018.", "title_original": "Populära TV4-programmet gör comeback", "summary_original": "”Talang” har pausats och återvänt flera gånger sedan premiären i svensk tv 2007. Nu meddelar TV4 i sina sociala medier att programmet ännu en gång gör comeback. ”Har du en eller en kompis en talang som kommer ta Sverige med storm? Tagga dem i kommentarsfältet nu”, står det i ett inlägg på Instagram. När programmet senast sändes, 2023, leddes det av Pär Lernström och juryn bestod av David Batra, Helena Bergström, Johanna Nordström och Viktor Norén. Om samma konstellation återvänder är ännu oklart, då TV4 inte gått ut med ytterligare information. Enligt uppgifter till TV4 Nyheterna är Talang tillbaka i tablån 2027. Det här är Talang Programmet är en svensk version av den brittiska förlagan ”Britain’s Got Talent” och går ut på att personer med olika sorters färdigheter söker till programmet och visar upp dem inför en jury. Om de anser att talangen håller tillräckligt hög nivå får deltagaren gå vidare i tävlingen. Flera välkända profiler har fått sitt genombrott i Talang, däribland Zara Larsson som vann som 10‑åring 2008, Jon Henrik Fjällgren med sitt jojkande 2014 och minnesmästaren Jonas von Essen som kom på en andraplats 2018.", "link": "https://www.tv4.se/artikel/345im7EGxSNQ5pTjjdO1Mj/populaera-tv4-programmet-goer-comeback", "date_display": "2026-03-04", "date_iso": "2026-03-04T12:19:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["TV", "/tv", "/talang", "/tv4-play", "/tv4"]}, {"id": 144, "title": "Increased protection for the civilian population in the Baltic Sea and Nordic region", "summary": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland. This enables the temporary movement of people across borders in the event of crisis or, in the worst-case scenario, war.", "title_original": "Increased protection for the civilian population in the Baltic Sea and Nordic region", "summary_original": "Sweden has signed a memorandum of understanding on protecting the civilian population of the Baltic Sea region and the Nordic countries, together with Denmark, Estonia, Finland, Germany, Iceland, Latvia, Lithuania, Norway and Poland. This enables the temporary movement of people across borders in the event of crisis or, in the worst-case scenario, war.", "link": "https://www.government.se/press-releases/2026/03/increased-protection-for-the-civilian-population-in-the-baltic-sea-and-nordic-region/", "date_display": "2026-03-04", "date_iso": "2026-03-04T12:01:20+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "International", "Ministry of Defence", "Emergency preparedness", "Carl-Oskar Bohlin", "Civil defence", "Strengthen Sweden’s security", "Total defence"]}, {"id": 145, "title": "The Social Insurance Agency is proposed to have a \"contribution police\"", "summary": "The contribution crime investigation proposes that Försäkringskassan should have its own crime-fighting activity. It shall consist of a criminal investigation part and an intelligence activity to prevent, prevent and detect benefit crimes. Between 40 and 50 people are supposed to work with Försäkringskassan's crime-fighting. It is proposed that they have their workplaces in police stations in eight locations in the country. The mandate to fight crime is becoming powerful, and Försäkringskassan must manage it in the best way, says investigator Mikael Westberg. Hold hearings The authority is proposed to be able to hold hearings, participate in house searches, conduct surveillance and conduct register searches to uncover grant crimes and closely related crimes such as document forgery and false certification. The mandate also includes being allowed to execute seizures and monetary seizures and remote searches via the internet to search for electronically stored documents. If we go ahead with this, you could say that Försäkringskassan will become a kind of benefits police, says Social Security Minister Anna Tenje (M). But the criminal investigations are also proposed to continue to be led by prosecutors, who can then use the Social Insurance Agency's criminal investigators for help. The authority is also not given the right to use force, which means that its personnel cannot arrest anyone or carry out house searches on their own. There will be no change to the police's monopoly on violence, says Westberg. Abandoned The background to the proposals is that the police were not able to prioritize crime of benefit to a sufficient extent and that competence was lacking. Society has not managed to deal with the problem, says the investigator. A rough estimate is that Försäkringskassan and the Pensions Authority wrongly pay out various allowances and contributions for SEK 11 billion every year. Half are judged to be due to deliberately incorrectly submitted information. Every year, 8,000-9,000 grant violations are reported, but 75 percent of those investigations are closed. The investigator estimates that it would cost SEK 140 million to build up Försäkringskas", "title_original": "Försäkringskassan föreslås få en ”bidragspolis”", "summary_original": "Bidragsbrottsutredningen föreslår att Försäkringskassan ska få en egen brottsbekämpande verksamhet. Den ska bestå av en brottsutredande del och en underrättelseverksamhet för att förebygga, förhindra och upptäcka bidragsbrott. Mellan 40 och 50 personer är tänkt att arbeta med Försäkringskassans brottsbekämpning. De föreslås ha sina arbetsplatser i polishus på åtta orter i landet. Mandatet att bekämpa brott blir kraftfullt, och det måste Försäkringskassan förvalta på bästa sätt, säger utredaren Mikael Westberg. Hålla förhör Myndigheten föreslås kunna hålla förhör, medverka vid husrannsakan, bedriva spaning och göra registersökningar för att avslöja bidragsbrott och näraliggande brott som urkundsförfalskning och osant intygande. Mandatet omfattar även att få verkställa beslag och penningsbeslag och genomsökning på distans via internet för att söka efter elektroniskt lagrade handlingar. Om vi går vidare med detta så skulle man kunna säga att Försäkringskassan blir en slags bidragspolis, säger socialförsäkringsminister Anna Tenje (M). Men brottsutredningarna föreslås även i fortsatt ledas av åklagare, som då kan ta Försäkringskassans brottsutredare till hjälp. Myndigheten får inte heller rätt att utöva våld, vilket innebär att dess personal inte kan gripa någon eller genomföra husrannsakan på egen hand. Det blir ingen ändring av polisens våldsmonopol, säger Westberg. Läggs ned Bakgrunden till förslagen är att polisen inte kunnat prioritera bidragsbrott i tillräcklig utsträckning och att kompetens saknats. Samhället har inte lyckats att komma till rätta med problemet, säger utredaren. En grov uppskattning är att Försäkringskassan och Pensionsmyndigheten felaktigt betalar ut olika ersättningar och bidrag för 11 miljarder kronor varje år. Hälften bedöms bero på medvetet felaktigt inlämnade uppgifter. Varje år anmäls 8 000-9 000 bidragsbrott, men 75 procent av de utredningarna läggs ned. Utredaren bedömer att det skulle kosta 140 miljoner kronor att bygga upp Försäkringskassans brottsbekämpande verksamhet och att den verksamheten skulle kosta 170 miljoner kronor per år att driva. Utredningen föreslår att förslagen träder i kraft den 1 januari 2028.", "link": "https://www.tv4.se/artikel/tt-260304-bidragsbrott1-98a2faca/forsakringskassan-foreslas-fa-en-bidragspolis", "date_display": "2026-03-04", "date_iso": "2026-03-04T10:48:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott", "/brott", "/forsakringskassan", "/pensionsmyndigheten", "/inrikes"]}, {"id": 146, "title": "Politicians collapse during debate: \"Oh my gosh, what's going on?\"", "summary": "It was M politician Jesper Skalberg Karlsson who suddenly collapsed. - Oh, oh, oh, what's going on, said Lahti and ran towards him. Skalberg Karlsson must be awake and talkative, according to SVT. \"Got quite a loss of energy\" Jesper Skalberg Karlsson commented on the incident in a comment to SVT. - In today's debate about the energy policy, I had a pretty serious loss of energy myself. Unpleasant of course, but under the circumstances I feel fine. Received very good help from colleagues and employees of the Riksdag. The positive thing is that maybe more people see my incredible speech and open their eyes to the Moderates' energy policy.", "title_original": "Politiker faller ihop under debatt: ”Ojojoj, vad händer?”", "summary_original": "Det var M-politikern Jesper Skalberg Karlsson som plötsligt ramlade ihop. – Oj, oj, oj, vad händer, sade Lahti och sprang fram mot honom. Skalberg Karlsson ska vara vaken och talbar, enligt SVT. ”Fick ganska ordentligt energitapp” Jesper Skalberg Karlsson kommenterade händelsen i en kommentar till SVT. – I dagens debatt om energipolitiken fick jag ett ganska ordentligt energitapp själv. Så klart obehagligt men efter omständigheterna mår jag bra. Fick mycket fin hjälp av kollegor och riksdagens medarbetare. Det positiva är att kanske fler ser mitt otroliga anförande och får upp ögonen Moderaternas energipolitik.", "link": "https://www.tv4.se/artikel/3QKC76GlCiI4MMG7x826KZ/m-politiker-foell-ihop-i-riksdagen", "date_display": "2026-03-04", "date_iso": "2026-03-04T10:30:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/politik", "/svensk-politik", "/olycka"]}, {"id": 147, "title": "Nurse stole patients' jewelry - sentenced to prison", "summary": "Danderyd's hospital has been affected by a series of thefts for several years. Patients' valuables and jewelry mysteriously disappeared again and again. The Stockholm police finally decided to do a survey and were able to call in the suspect, a woman in her 50s who worked as a nurse at the hospital and had major problems with her personal finances. She was charged earlier this winter for three grand thefts in 2020 and 2025 at Danderyd.  In April 2020. A watch worth almost SEK 3,000 belonging to an elderly patient who is now dead. In November 2024. Two gold bracelets worth just over SEK 7,500 from an 85-year-old patient. The patient told us that it was important jewelry that she intended to wear \"until I die.\" In July 2025. A gold necklace with an opal worth about 6,000. The patient was in his 80s. The nurse later resold the valuables. Sick and old patients According to the prosecutor, the thefts were serious as the patients were in a particularly vulnerable situation due to age and illness. The woman also abused her position of trust as an employee, according to the prosecutor. The woman was also charged with another theft in the Stockholm area, a case of aggravated embezzlement and aggravated embezzlement to a value of approximately SEK 1,050,000 after pawning stolen goods on over 100 occasions. The assistant nurse has partially confessed to the crimes and explained that she had a gambling addiction which she financed through the sale of the stolen items. The district court sentenced her today to two years in prison for all charges except one case of aggravated robbery. - The sentence of two years in prison reflects the recklessness and systematicity of the assistant nurse's criminality consisting in the vulnerability of the crime victims and the extent of the assistant nurse's sale and pawning of presumably stolen items where the owners could not be identified. The district court does not dispute that the motive for the crimes may have had its basis in the assistant nurse's gambling addiction, but this has not affected the district court's assessment in", "title_original": "Undersköterska stal patienters smycken – döms till fängelse", "summary_original": "Danderyds sjukhus har under flera år varit drabbad av en serie stölder. Patienters värdesaker och smycken försvann gång på gång mystiskt. Stockholmspolisen valde till slut att göra en kartläggning och kunde ringa in misstänkt, en kvinna i 50-årsåldern som arbetade som undersköterska på sjukhuset och haft stora problem med sin privatekonomi. Hon åtalades tidigare i vinter för tre grova stölder under 2020 och 2025 på Danderyd.  I april 2020. En klocka värd närmare 3 000 kronor tillhörande en äldre patient som i dag är död. I november 2024. Två guldarmband till ett värde av drygt 7 500 kronor från en patient i 85-årsåldern. Patienten berättade att det var viktiga smycken som hon tänkte ha på sig ”tills jag dör”. I juli 2025. Ett guldhalsband med en opal värd omkring 6 000. Patienten var i 80-årsåldern. Undersköterskan sålde senare vidare värdesakerna. Sjuka och gamla patienter Enligt åklagaren var stölderna grova då patienterna befann sig i en särskilt utsatt situation på grund av ålder och sjukdom. Kvinnan missbrukade också sin förtroendeställning som anställd, menar åklagaren. Kvinnan åtalades även för ytterligare en stöld i Stockholmsområdet, ett fall av grovt häleri och grovt näringshäleri till ett värde av cirka 1 050 000 kronor efter att vid över 100 tillfällen ha pantsatt stöldgods. Undersköterskan har delvis erkänt brotten och förklarat att hon haft ett spelmissbruk som hon finansierade genom försäljningen av de stulna föremålen. Tingsrätten dömde henne i dag till två års fängelse för samtliga åtalspunkter förutom ett fall av grovt häleri. – Domen på två års fängelse speglar hänsynslösheten och systematiken i undersköterskans brottslighet bestående i brottsoffrens utsatthet och omfattningen av undersköterskans försäljning och pantsättning av antagligt stulna föremål där ägarna inte kunnat identifieras. Tingsrätten ifrågasätter inte att motivet för brotten kan ha haft sin grund i undersköterskans spelberoende, men detta har inte påverkat tingsrättens bedömning i fråga om ansvar och påföljd, säger rättens ordförande chefsrådmannen Louise Conradi i ett uttalande.", "link": "https://www.tv4.se/artikel/2bG5MLFSl05BJr0FLIic7A/kvinna-doems-foer-patientstoelderna-pa-danderyd", "date_display": "2026-03-04", "date_iso": "2026-03-04T10:03:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/danderyd", "/brott", "/stold"]}, {"id": 148, "title": "The Salvation Army's new leader gets to take over the vision of doubling the number of members", "summary": "Lisbeth Andersen to Dagen: \"We will do what we can, then it is God who gives the plant.\"", "title_original": "Frälsningsarméns nya ledare får ta över vision om att dubbla medlemsantalet", "summary_original": "Lisbeth Andersen till Dagen: ”Vi ska göra vad vi kan, sedan är det Gud som ger växten.”", "link": "https://www.dagen.se/nyheter/fraelsningsarmens-nya-ledare-far-ta-oever-vision-om-att-dubbla-medlemsantalet/10232854", "date_display": "2026-03-04", "date_iso": "2026-03-04T09:44:16+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 149, "title": "Was recruited to do a PhD - expelled in the final year: \"Despaired\"", "summary": "Fahima is a PhD student in linguistics at the University of Gothenburg since 2021. PhD students are employed by universities and study 80 percent. The other 20 percent work for the university by, for example, teaching. Two-thirds into her PhD, Fahima applied to have the 20 percent off in order to focus on her research. Center for Justice: \"Self-dealing on the part of the state\" The university said yes, but six months later, Fahima received from the Swedish Migration Agency a rejection of her application for a new residence permit and a notification that she would be deported. The justification was that she was not studying full-time. Fahima has appealed the decision and her case has been taken up by the Center for Justice. - This is almost some kind of self-goal on the part of the state. Fahima has been recruited to conduct research to be carried out over five years. They finance this research and then when she is almost done after four years, then she is deported in a rather unpredictable way, even though she has done everything right, says Alexander Troedsson, lawyer at the Center for Justice. The Swedish Migration Agency stands firm But the Swedish Migration Agency does not agree that Fahima has done everything right and stands by its interpretation of the law. - We can only state that we have made our decision. She does not study full-time, she does not intend to study full-time. Therefore, we cannot grant her a residence permit. From our perspective, there is absolutely no doubt about it, says Jesper Tengroth, press manager at the Swedish Migration Agency.\n\nFahima herself is in shock over what happened:\n- I didn't know that something like this could happen in Sweden, where you hear that PhD students are needed, she says.", "title_original": "Rekryterades för att doktorera – utvisas sista året: ”Förtvivlad”", "summary_original": "Fahima är doktorand inom lingvistik vid Göteborgs universitet sedan 2021. Doktorander är anställda av lärosäten och studerar 80 procent. Övriga 20 procent arbetar de för lärosätet med att exempelvis undervisa. Två tredjedelar in i sin doktorand ansökte Fahima om att få ledigt på de 20 procenten för att kunna fokusera på sin forskning. Centrum för rättvisa: ”Självmål från statens sida” Universitetet sa ja, men sex månader senare fick Fahima från Migrationsverket avslag på sin ansökan om nytt uppehållstillstånd och besked om att hon skulle utvisas. Motiveringen var att hon inte studerade på heltid. Fahima har överklagat beslutet och hennes fall har plockats upp av Centrum för rättvisa. – Det här är ju närmast något slags självmål från statens sida. Man har rekryterat Fahima för att bedriva forskning som ska genomföras under fem år. Man finansierar den här forskningen och sen när hon nästan är klar efter fyra år, då utvisas hon på ett ganska oförutsägbart sätt, trots att hon har gjort allt rätt, säger Alexander Troedsson, jurist vid Centrum för Rättvisa. Migrationsverket står fast Men Migrationsverket håller inte med om att Fahima har gjort allt rätt och står fast vid sin tolkning av lagen. – Vi kan bara konstatera att vi har fattat vårt beslut. Hon studerar inte på heltid, hon har inte för avsikt att studera på heltid. Därmed kan inte vi bevilja henne uppehållstillstånd. Ur vårt perspektiv finns det ingen som helst tvekan kring det, säger Jesper Tengroth, presschef på Migrationsverket.\n\nFahima själv är i chock över det inträffade:\n– Jag visste inte att något sånt här kunde hända i Sverige där man får höra att det behövs doktorander, säger hon.", "link": "https://www.tv4.se/artikel/ZhUi9uZlS6K51f5hWXUZQ/rekryterades-foer-att-doktorera-utvisas-sista-aret-foertvivlad", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:53:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/migrationspolitik", "/migrationsverket"]}, {"id": 150, "title": "Mello star to hospital: \"Disaster\"", "summary": "Östberg is now discharged, but his participation in the final on Saturday is threatened. He has suffered from acute gout and had to be admitted to hospital with a week to go until the final in the Friends arena in Stockholm.  It is now uncertain whether Östberg will be able to participate in the final. It's a disaster if I can't be there. We have been charging for so many months. But health must come first, he tells Aftonbladet.  Brandsta City Släckers competes with the contribution \"Rakt in i elden\".", "title_original": "Mello-stjärnan till sjukhus: ”Katastrof”", "summary_original": "Östberg är nu utskriven, men hans medverkan i finalen på lördag är hotad. Han har drabbats av akut gikt och fick läggas in på sjukhus med en vecka kvar till finalen i Friends arena i Stockholm.  Det är nu osäkert om Östberg kommer att kunna medverka i finalen. Det är katastrof om jag inte kan vara med. Vi har laddat i så många månader. Men hälsan måste få gå först, säger han till Aftonbladet.  Brandsta City Släckers tävlar med bidraget ”Rakt in i elden”.", "link": "https://www.tv4.se/artikel/tt-260304-brandsta1-6f0b2392/brandsta-city-slackers-stjarna-till-sjukhus", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:49:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/musik", "/stockholm", "/sverige", "/aftonbladet", "/konst", "/kultur", "/melodifestivalen"]}, {"id": 151, "title": "New recommendations for the public's readiness to pay", "summary": "The prevailing global situation and Sweden's high degree of digitization can lead to vulnerabilities in the payment system. It is therefore important that the public ensure that they have different ways to pay, such as cash, payment cards and access to payment services via mobile phone.", "title_original": "Nya rekommendationer för allmänhetens betalningsberedskap", "summary_original": "Det rådande omvärldsläget och Sveriges höga grad av digitalisering kan medföra sårbarheter i betalningssystemet. Det är därför viktigt att allmänheten ser till att ha olika sätt att betala på, så som kontanter, betalkort och tillgång till betaltjänster via mobiltelefon.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/nya-rekommendationer-for-allmanhetens-betalningsberedskap/", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:30:55+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "today", "tags": []}, {"id": 152, "title": "Urges: Time to fill up the \"war coffers\" with cash", "summary": "The dramatic development in the Middle East since Saturday is an example of the deteriorating global situation, according to First Deputy Governor of the Riksbank Aino Bunge. It is not something that prompted this particular communication. But it is clear, it shows the concern that exists in the outside world, she tells TT. One week The thousand in cash must cover payments for one week's purchases of essential goods. But the amount may need to be adapted to the specific needs of different households. It is a recommendation. It is based on the Swedish Consumer Agency's calculations of how much food one usually gets rid of per month, says Bunge. Working Swish in the mobile phone and payment cards from two different networks are also recommended. But according to Bunge, the Riksbank has not taken a position on how much bank funds households should have access to digitally or with physical card transactions. The Riksbank also wants to see that households use cash at regular intervals to keep the cash system going, but they do not say how often this should be done. After all, there are those who use cash on a daily basis. I think at least once a month sounds good, but we have no particular recommendation, says Bunge. Have stock When Russia attacked Ukraine on a full scale in 2022, Swedish households made an unusually large number of cash withdrawals. And measurements show that \"just over 40 percent\" of households already today have at least one thousand Swedish kroner per adult at home. According to Bunge, there is no risk that the cash will not be enough if the remaining almost 60 percent of the adults in the country are to top up with cash. We have stocks of cash. Then it's not like I'm urging everyone to run out now and withdraw cash. After all, this is a preparedness we must build over time, she says.", "title_original": "Uppmanar: Dags att fylla på ”krigskassan” med kontanter", "summary_original": "Den dramatiska utvecklingen i Mellanöstern sedan i lördags är ett exempel på det försämrade omvärldsläget, enligt förste vice riksbankschef Aino Bunge. Det är inte något som föranledde just den här kommunikationen. Men det är klart, det visar på den oro som finns i omvärlden, säger hon till TT. En vecka Tusenlappen i kontanter ska täcka betalningar för en veckas inköp av livsnödvändiga varor. Men beloppet kan behöva anpassas till vad olika hushåll har för specifika behov. Det är en rekommendation. Det bygger på Konsumentverkets beräkningar av hur mycket mat man brukar göra sig av med per månad, säger Bunge. Fungerande Swish i mobilen och betalkort från två olika nätverk rekommenderas också. Men hur mycket bankmedel hushållen bör ha tillgång till digitalt eller med fysiska korttransaktioner har Riksbanken inte tagit ställning till, enligt Bunge. Riksbanken vill även se att hushållen använder kontanter med jämna mellanrum för att hålla i gång kontantsystemet, men de säger inte hur ofta det bör göras. Det finns ju de som använder kontanter dagligen. Jag tycker minst en gång i månaden låter bra, men vi har ingen särskild rekommendation, säger Bunge. Har lager När Ryssland anföll Ukraina i full skala 2022 gjorde svenska hushåll ovanligt många och stora kontantuttag. Och mätningar visar att ”strax över 40 procent” av hushållen redan i dag har minst en tusenlapp per vuxen hemma. Någon risk att kontanterna inte ska räcka till om resterande nästan 60 procent av de vuxna i landet ska fylla på med kontanter finns inte, enligt Bunge. Vi har lager av kontanter. Sedan är det ju inte så att jag uppmanar alla att springa ut nu och ta ut kontanter. Det här är ju en beredskap vi ska bygga över tid, säger hon.", "link": "https://www.tv4.se/artikel/tt-260304-kontantberedskap1-47988ede/riksbanken-dags-att-fylla-pa-med-kontanter", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:30:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ukraina", "/ukraina", "/ryssland", "/privatekonomi", "/ekonomi"]}, {"id": 153, "title": "Here are the worst municipalities for vulnerable women: \"Disinterest\"", "summary": "The Women's Peace Barometer is based on a survey of the country's 290 municipalities. The assessment is based on the municipalities' own data. A total of 182 municipalities have responded, while approximately 100 have not - I guess that indicates a lack of interest. Or that you don't know what functions you have. You simply don't have a good grasp of what the work looks like, says Olga Persson, chairman of Unizon. Among the municipalities that top the list are Trollhättan, Eskilstuna, Södertälje, Västerås, Lidköping and Lund. What these have in common is that they invest resources, have coordinated plans and make use of civil society's knowledge. They also have routines for children in sheltered housing to be able to go to school, which is otherwise often lacking. - You take it seriously. An independent women's shelter is financed. They make use of the power and knowledge of civil society. \"Doesn't care enough\" The six worst ranked are Bjuv, Ydre, Åtvidaberg, Bromölla, Sotenäs and Boxholm. According to Persson, they have not invested enough in support and protection for women and children. The preventive work is also lacking.  - I want them to read the women's peace barometer and start working, says Olga Persson. This is the sixth Women's Peace Barometer. In some areas the work is progressing, but in serious ways it is going backwards, above all in the operational work. - I guess you don't care enough about the lives of women and children. It is incredibly sad to see that this is not a priority, just like other serious crime. The minister on the criticism Equality Minister Nina Larsson (L) describes the situation as serious and points out that the government has increased state subsidies to the municipalities and women's shelters. But she admits that more is needed. - The support for the vulnerable women needs to be equal across the country, regardless of where you live, says Nina Larsson (L), Minister for Gender Equality. She also emphasizes that the municipalities must take greater responsibility and work more systematically.  - Municipalities cannot sit back and pretend", "title_original": "Här är sämsta kommunerna för utsatta kvinnor: ”Ointresse”", "summary_original": "Kvinnofridsbarometern bygger på en enkät till landets 290 kommuner. Bedömningen utgår från kommunernas egna uppgifter. Totalt har 182 kommuner svarat, medan ungefär 100 inte har gjort det – Jag antar att det tyder på ointresse. Eller att man inte vet vilka funktioner man har. Man har helt enkelt dålig koll på hur arbetet ser ut, säger Olga Persson, ordförande för Unizon. Bland de kommuner som toppar listan finns Trollhättan, Eskilstuna, Södertälje, Västerås, Lidköping och Lund. Gemensamt för dessa är att de satsar resurser, har samordnade planer och tar tillvara civilsamhällets kunskap. De har även rutiner för att barn i skyddat boende ska kunna gå i skolan, vilket annars ofta brister. – Man tar det på allvar. Man finansierar en självständig kvinnojour. Man tar tillvara på civilsamhällets kraft och kunskap. ”Bryr sig inte tillräckligt” De sex sämst rankade är Bjuv, Ydre, Åtvidaberg, Bromölla, Sotenäs och Boxholm. Enligt Persson har de inte satsat tillräckligt på stöd och skydd för kvinnor och barn. Det förebyggande arbetet brister också.  – Jag vill att de ska läsa kvinnofredsbarometern och sätta igång och arbeta, säger Olga Persson. Detta är den sjätte Kvinnofridsbarometern. På vissa områden går arbetet framåt, men på allvarliga sätt går det bakåt, framför allt i det operativa arbetet. – Jag antar att man inte bryr sig tillräckligt mycket om kvinnors och barns liv. Det är otroligt sorgligt att se att det här inte är en prioritering, precis som annan grov brottslighet. Ministern om kritiken Jämställdhetsminister Nina Larsson (L) beskriver situationen som allvarlig och pekar på att regeringen har höjt statsbidragen till kommunerna och kvinnojourerna. Men hon medger att det krävs mer. – Stödet för de utsatta kvinnorna behöver vara likvärdigt över hela landet, oavsett var du bor, säger Nina Larsson (L) jämställdhetsminister Hon betonar också att kommunerna måste ta större ansvar och arbeta mer systematiskt.  – Kommunerna kan ju inte luta sig tillbaka och låtsas som om problemet inte finns, genom att inte ens svara på en enkätundersökning. Det här gör skillnad för alldeles för många kvinnor som utsätts för mäns våld mot kvinnor och deras barn.", "link": "https://www.tv4.se/artikel/5XeWkQRF6SpEnjxf31IkOi/kommunerna-som-aer-saemst-pa-stoed-till-valdsutsatta-kvinnor", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:29:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mäns våld mot kvinnor", "/mansvaldmotkvinnor", "/jamstalldhet", "/kvinnovald", "/nyhetsmorgon"]}, {"id": 154, "title": "Chevre chaud salad", "summary": "Today's dinner tip offers a dish of chèvre au gratin on toast, served with a crunchy, tangy and hearty salad. The cheese is wonderfully creamy and easily melted, while the salad with pears, tomatoes, bacon and walnuts completes the dish. An easily prepared dinner with finesse! See Jennie Walldén's recipe", "title_original": "Sallad chèvre chaud", "summary_original": "Dagens middagstips bjuder på en rätt med gratinerad chèvre på rostat bröd, serverad med en krispig, syrlig och matig sallad. Osten blir härligt krämig och lätt smält, medan salladen med päron, tomater, bacon och valnötter gör rätten komplett. En lättlagad middag med finess! Se Jennie Walldéns recept", "link": "https://www.tv4.se/artikel/3Ds1parEgNapwoNACLBgqW/sallad-chevre-chaud", "date_display": "2026-03-04", "date_iso": "2026-03-04T08:07:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/personer/jennie-wallden"]}, {"id": 155, "title": "Teachers are warned - pushed and shouted at children who pooped on themselves", "summary": "A 55-year-old woman who works at a private preschool in Sörmland is now being warned by the Swedish School Administration and the Teachers' Responsibility Board after mishandling several children. She yelled at a preschooler that it's \"disgusting to poop on yourself,\" and told her colleague that she wasn't going to change the child's underwear until the parents came to pick them up, so they would understand that the child needed a diaper.  The parents testify that the child felt bad and hid when the preschool teacher's name was mentioned at home. Yelled at children who lacked the ability to speak She dragged another preschooler out the door and left the child alone outside when the child would not get dressed. A third child is said to have been shouted at by the woman, pushed out through a door and closed the door again. When a child who lacks speech and needs extra support made noises to communicate with her, she yelled at the child to be quiet. She is said to have harshly sat the same child at another table and pushed the child's chair in so that it was impossible to leave. Another three children have been shouted at and dragged around in a harsh manner. The woman also allegedly shouted that she wanted to throw children against the wall. Several parents say that their children say that she is always angry and that they are afraid of her. Corrective talks don't seem to have helped Before she worked at the private preschool, she worked for the municipality but resigned in 2019. Before the dismissal, her bosses had a \"corrective talk\" with her, after she left the children's group during working hours, spoke badly of the children's guardians in front of them - and turned their chairs against the wall if they didn't behave. She also didn't let them eat enough sandwiches to fill them up. The woman disputes the allegations.", "title_original": "Lärare varnas – knuffades och skrek på barn som bajsat på sig", "summary_original": "En kvinna i 55-årsåldern som jobbar på en privat förskola i Sörmland varnas nu av Skolverket och Lärarnas ansvarsnämnd efter att ha felbehandlat flera barn. Till ett förskolebarn skrek hon att det är ”äckligt att bajsa på sig”, och sade till sin kollega att hon inte tänkte byta underkläder på barnet tills föräldrarna kom och hämtade, så att de skulle förstå att barnet behövde blöja.  Föräldrarna vittnar om att barnet mådde dåligt och gömde sig när förskollärarens namn nämndes hemma. Skrek åt barn som saknade talförmåga Hon släpade ett annat förskolebarn utanför dörren och lämnade barnet ensamt utomhus när barnet inte ville klä på sig. Ett tredje barn ska kvinnan ha skrikit på, knuffat ut genom en dörr och stängt dörren om. När ett barn som saknar talspråk och behöver extra stöd gjorde ljud för att kommunicera med henne skrek hon åt barnet att vara tyst. Samma barn ska hon hårdhänt ha satt vid ett annat bord och skjutit in barnets stol så att det inte gick att gå därifrån. Ytterligare tre barn har skrikits på och släpats omkring på ett hårdhänt sätt. Kvinnan ska också ha skrikit att hon vill slänga barn i väggen. Flera föräldrar säger att deras barn säger att hon alltid är arg och att de är rädda för henne. Korrigerande samtal verkar inte ha hjälpt Innan hon jobbade på den privata förskolan så jobbade hon kommunalt men sade upp sig år 2019. Innan uppsägningen hade hennes chefer ett ”korrigerande samtal” med henne, efter att hon lämnat barngruppen på arbetstid, talat illa om barnens vårdnadshavare framför dem – och vänt deras stolar mot väggen om de inte uppförde sig. Hon lät dem heller inte äta tillräckligt många smörgåsar så att de skulle bli mätta. Kvinnan bestrider anklagelserna.", "link": "https://www.tv4.se/artikel/7CO5WsjLwsKmWeE60szmFx/foerskollaerare-varnas-skrek-pa-barn-som-bajsade-pa-sig", "date_display": "2026-03-04", "date_iso": "2026-03-04T07:25:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/forskola", "/larare", "/barn", "/utbildning"]}, {"id": 156, "title": "Pastor held two funerals with broken ribs", "summary": "Karl-Henrik Wallerstein slipped and fell on the way to the proceedings: \"Thought I would break my neck.\"", "title_original": "Kyrkoherde höll två begravningar med brutna revben", "summary_original": "Karl-Henrik Wallerstein halkade omkull på väg till förrättningarna: ”Trodde jag skulle bryta nacken.”", "link": "https://www.dagen.se/livsstil/kyrkoherde-hoell-tva-begravningar-med-brutna-revben/10225595", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "See AI as a fellow musician – not a replacement", "summary": "For a lonely musician, AI can be the difference between giving up and continuing, writes Erik Thunberg in a reply.", "title_original": "Se AI som medmusiker – inte ersättare", "summary_original": "För en ensam musiker kan AI vara skillnaden mellan att ge upp och att fullfölja, skriver Erik Thunberg i en replik.", "link": "https://www.dagen.se/debatt/se-ai-som-medmusiker-inte-ersaettare/10224977", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Sebastian Stakset receives a cultural award from the Clapham Institute", "summary": "\"For his evangelistic boldness and tireless efforts as a Christian voice.\"", "title_original": "Sebastian Stakset får kulturutmärkelse av Claphaminstitutet", "summary_original": "”För sin evangelistiska frimodighet och outtröttliga insats som kristen röst.”", "link": "https://www.dagen.se/nyheter/sebastian-stakset-far-kulturutmaerkelse-av-claphaminstitutet/10230892", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "We don't bother with the children in the church, but with disengaged parents", "summary": "Erik Helmerson: Lord, give me the ability to speak to You even when I scream and cry", "title_original": "Vi stör oss inte på barnen i kyrkan utan på oengagerade föräldrar", "summary_original": "Erik Helmerson: Herre, ge mig förmågan att tala med Dig även till skrik och gråt", "link": "https://www.dagen.se/ledare/vi-stoer-oss-inte-pa-barnen-i-kyrkan-utan-pa-oengagerade-foeraeldrar/10233282", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Children in the pews: disturbance or blessing?", "summary": "In this episode of Dagens färlar, we discuss the children's place in the church room • Jim Lagerlöf, consultant within the Catholic Pedagogical Committee, is a guest on the podcast.", "title_original": "Barn i bänkraderna: störningsmoment eller välsignelse?", "summary_original": "I detta avsnitt av Dagens föräldrar diskuterar vi barnens plats i kyrkorummet • Jim Lagerlöf, konsulent inom Katolska pedagogiska nämnden gästar podden.", "link": "https://www.dagen.se/podd/barn-i-baenkraderna-stoerningsmoment-eller-vaelsignelse/10233511", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Successful year for the Christian publishers and booksellers", "summary": "Libri's publisher reports a 200 percent increase in Bible sales", "title_original": "Succéår för de kristna förlagen och bokhandlarna", "summary_original": "Libris förlag rapporterar ökning av bibelförsäljningen med 200 procent", "link": "https://www.dagen.se/kultur/succear-foer-de-kristna-foerlagen-och-bokhandlarna/10231048", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "\"I find it difficult to understand those who dislike children in the church service\"", "summary": "Jim Lagerlöf, father of small children and committed Catholic, on letting children be children, even in the Sunday service", "title_original": "”Jag har svårt att förstå dem som ogillar barn i gudstjänsten”", "summary_original": "Jim Lagerlöf, småbarnspappa och engagerad katolik, om att låta barn vara barn, även i söndagens gudstjänst", "link": "https://www.dagen.se/livsstil/jag-har-svart-att-foersta-dem-som-ogillar-barn-i-gudstjaensten/10230955", "date_display": "2026-03-04", "date_iso": "2026-03-04T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "The expert explains: Therefore, you should NOT celebrate the refund", "summary": "At the beginning of March, many people receive their tax refund and see it as \"free money\", according to savings economist Felicia Schön at Avanza bank. On the contrary, she believes that it is proof that money has been lent to the state - completely free of charge. - Many see it as a gift, but it's really a toss-up. May miss out on returns Felicia Schön says that a high tax refund is only good news if the money hadn't been saved anyway. Otherwise, you want to get a low amount back. - Financially speaking, a high figure is not that desirable. Actually, you want to be somewhere around plus or minus zero in tax refund, says Felicia Schön. According to her, many people use the tax refund as a kind of savings, for example for the holidays. But she believes that it would be better to invest the money. - The average tax refund is SEK 13,000. If you calculate the average return of 7 percent, that's about SEK 1,000 in a year, says Felicia Schön. \"I'm a party pooper\" If you have a digital mailbox, the declaration will arrive March 2-6, otherwise by mail no later than April 15. Felicia Schön believes that the misconception surrounding the tax refund is worrying. - Generally spea
