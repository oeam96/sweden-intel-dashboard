/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {

.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */

{"id": 35, "title": "Denmark's government: New \"crown prince\"", "summary": "Mette Frederiksen's third Danish government consists of eleven women and ten men, according to a press release. That Peter Hummelgaard becomes the new finance minister is interpreted as him being Frederiksen's \"crown prince\". - We have waited a long time, but it has been worth it, rejoices the party's youth leader.", "title_original": "Danmarks regering: Ny ”kronprins”", "summary_original": "Mette Frederiksens tredje danska regering består av elva kvinnor och tio män, visar ett pressmeddelande. Att Peter Hummelgaard blir ny finansminister tolkas som att han är Frederiksens ”kronprins”. – Vi har väntat länge, men det har det varit värt, jublar partiets ungdomsledare.", "link": "https://www.sydsvenskan.se/varlden/danmarks-regering-lokke-kvar-som-utrikesminister/", "date_display": "2026-06-03", "date_iso": "2026-06-03T10:48:10+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 36, "title": "The cold was a tumor – which covered half of Thomas' palate", "summary": "Thomas Andersson thought he had a prolonged cold with a sore throat in August and September last year. When he didn't get better, he called 1177 and the nurse asked him to take a picture down his throat. - That's when I realized that it didn't belong there. It was something other than a sore throat. You even saw it yourself? - Absolutely. It was clearly visible. It was a tumor that covered half my palate. Too bad to talk It turned out to be HPV-related throat cancer. An intensive treatment phase began with weekly radiation. He was given the opportunity to have advanced medical care at home - which he did not understand the point of at first, but allowed himself to be persuaded by a nurse. - Two days later, I woke up on Sunday morning after week four and was in so much pain that I couldn't speak. I had to text my partner to get help, says Thomas Andersson. A special mask was produced especially for him, which was very tight on his face. - For the first time I got a claustrophobic feeling. After each treatment I had marks on my face because it is so tight. I could only breathe through my nose. The son got vaccinated. At the end of March this year, he received the news that he is cancer-free. - It was an emotional conversation. I was out for a walk. I had to sit down on the curb and cry to understand what I had heard. At the same time that Thomas was affected by cancer, his son received a call for vaccination against the HPV virus. - My fantastic partner Linda filled the car with teenagers and went to Karolinska and had them vaccinated. He wants to urge everyone who can to take the vaccine. - My advice is just: Get going! Take this free shot, and you won't have to go through what I have unfortunately gone through now.", "title_original": "Förkylningen var en tumör – som täckte halva Thomas gom", "summary_original": "Thomas Andersson trodde att han hade en långdragen förkylning med halsont i augusti och september förra året. När han inte blev bättre ringde han 1177 och sköterskan bad honom ta en bild ner i halsen. – Där insåg jag att det inte hörde hemma där. Det var något annat än halsont. Du såg det till och med själv? – Absolut. Den syntes tydligt. Det var en tumör som täckte halva min gom. För ont för att kunna prata Det visade sig vara HPV-relaterad svalgcancer. En intensiv behandlingsfas inleddes med strålning varje vecka. Han fick möjlighet att ha avancerad sjukvård i hemmet – vilket han först inte förstod vitsen med, men lät sig övertalas av en sjuksköterska. – Två dagar efteråt vaknade jag upp på söndagsmorgonen efter vecka fyra och hade så ont att jag inte kunde prata. Jag var tvungen att texta till min sambo för att få hjälp, säger Thomas Andersson. En särskild mask togs fram speciellt för honom, som satt väldigt tajt på hans ansikte. – För första gången fick jag en klaustrofobisk känsla. Efter varje behandling hade jag märken i ansiktet, för den är så tajt. Jag kunde endast andas genom näsan. Sonen vaccinerade sig Den sista mars i år fick han beskedet att han är cancerfri. – Det var ett känslosamt samtal. Jag var ute och tog en promenad. Jag var tvungen att sätta mig ner på trottoarkanten och gråta för att förstå vad jag hade hört. I samma veva som Thomas drabbades av cancer fick hans son en kallelse till vaccination mot HPV-viruset. – Min fantastiska sambo Linda fyllde bilen med tonåringar och åkte till Karolinska och fick dem vaccinerade. Han vill uppmana alla som kan att ta vaccinet. – Mitt tips är bara: I väg! Ta den här gratissprutan, så slipper ni gå igenom det jag tyvärr har gått igenom nu.", "link": "https://www.tv4.se/artikel/4R4DZw4WtsYLO39ZxktAcp/han-drabbades-av-hpv-relaterad-svalgcancer", "date_display": "2026-06-03", "date_iso": "2026-06-03T10:46:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/cancervard", "/cancer", "/vaccin", "/hpv", "/sjukdomar", "/sjukvard", "/sjukvarden"]}, {"id": 37, "title": "DN Debate Replicas. \"Sweden is still a country that researchers go to\"", "summary": "DN DEBATE REPLIES. Lotta Edholm (L), Minister of Higher Education and Research: Closing loopholes is not an attack on serious international students.", "title_original": "DN Debatt Repliker. ”Sverige är fortfarande ett land som forskare söker sig till”", "summary_original": "DN DEBATT REPLIK. Lotta Edholm (L), högskole- och forskningsminister: Att täppa till kryphål är inte ett angrepp på seriösa internationella studenter.", "link": "https://www.dn.se/debatt/sverige-ar-fortfarande-ett-land-som-forskare-soker-sig-till/", "date_display": "2026-06-03", "date_iso": "2026-06-03T10:40:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 38, "title": "Now begins Sweden Rock: \"More than just music\"", "summary": " ginal": "Moderaterna är garanten för en okontrollerad HVB-marknad. Det är uppenbart när socialtjänstministern försvarar en icke fungerande marknad, skriver Alexander Ojanne (S) i en slutreplik.", "link": "https://www.svd.se/a/k0pnoB/kriminalitet-pa-hvb-skydda-privata-foretag-ar-viktigast-for-m-skriver-s-politiker", "date_display": "2026-06-03", "date_iso": "2026-06-03T09:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Debatt"]}, {"id": 67, "title": "OECD fears global recession - but Sweden is growing", "summary": "The global economy is characterized by the Middle East conflict and an energy price shock, which has already slowed down growth. But the Swedish economy is growing, according to a forecast update from the Western economic cooperation organization OECD.", "title_original": "OECD befarar global recession – men Sverige växer", "summary_original": "Den globala ekonomin präglas av Mellanösternkonflikten och en energiprischock, som redan bromsat tillväxten. Men svensk ekonomi växer, enligt en prognosuppdatering från den västerländska ekonomiska samarbetsorganisationen OECD.", "link": "https://www.sydsvenskan.se/ekonomi/oecd-befarar-global-recession-men-sverige-vaxer/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:51:44+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 68, "title": "Three properties in Landsbygd went for 2,500,000", "summary": "", "title_original": "Tre fastigheter i Landsbygd gick för 2 500 000", "summary_original": "", "link": "https://www.hd.se/bastad/tre-fastigheter-i-landsbygd-gick-for-2-500-000/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:48:36+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "That's how satisfied the Swedes are with their sex life", "summary": "About half of Swedes are satisfied with their sex life. But in certain age groups, half of the women state that they have no interest in sex. This is evident from a new report from the Public Health Agency.", "title_original": "Så nöjda är svenskarna med sexlivet", "summary_original": "Omkring hälften av svenskarna är nöjda med sitt sexliv. Men i vissa åldersgrupper uppger hälften av kvinnorna att de saknar intresse för sex. Det framgår av en ny rapport från Folkhälsomyndigheten.", "link": "https://www.sydsvenskan.se/sverige/sa-nojda-ar-svenskarna-med-sexet/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:46:22+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "The space disaster sounds all too good", "summary": "The disaster with the space shuttle Challenger has become chamber opera. Sadly, the space suit is too tight, but the singers and musicians do a great job.", "title_original": "Rymdkatastrofen klingar alltför väl", "summary_original": "Katastrofen med rymdskytteln Challenger har blivit kammaropera. Tråkigt nog sitter rymddräkten för trångt, men sångare och musiker gör en storartad insats.", "link": "https://www.svd.se/a/zO4wxO/challenger-med-kamraterna-pa-folkoperan-recenseras", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:45:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Scen", "Kultur"]}, {"id": 71, "title": "Different cultures meet at Lustholmen", "summary": "The festival at Skeppsholmen in Stockholm includes, among other things, an Afro-Nordic look at our mythology and a fortune-telling ventriloquist doll.", "title_original": "På Lustholmen möts olika kulturer", "summary_original": "Festivalen på Skeppsholmen i Stockholm innehåller bland annat en afronordisk blick på vår mytologi och en spåkunnig buktalardocka.", "link": "https://www.svd.se/a/L4PrrJ/lustholmen-ar-festivalen-for-samtida-dans-pa-skeppsholmen", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:42:40+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Scen", "Kultur"]}, {"id": 72, "title": "Another 15 arrested in global drug bust", "summary": "A further 15 people have been arrested, of which 14 in Sweden, in the international police operation \"Candy\", the police write on their website.", "title_original": "Ytterligare 15 gripna i global knarkhärva", "summary_original": "Ytterligare 15 personer har gripits, varav 14 i Sverige, i den internationella polisoperationen ”Candy”, skriver polisen på sin hemsida.", "link": "https://www.sydsvenskan.se/sverige/ytterligare-15-gripna-i-global-knarkharva/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:42:03+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.sydsvenskan.se/nya-agare-till-villa-O-SG1/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:41:57+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "Here are the new participants in \"Hotel Romantik\"", "summary": "SVT's \"Hotel Romantik\" is back with 24 new seniors - twelve men and twelve women - who are looking for love.", "title_original": "Här är nya deltagarna i ”Hotell Romantik”", "summary_original": "SVT:s ”Hotell Romantik” är tillbaka med 24 nya seniorer – tolv män och tolv kvinnor – som letar efter kärleken.", "link": "https://www.sydsvenskan.se/noje/har-ar-nya-deltagarna-i-hotell-romantik/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:41:51+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "\"Short film\" found in the investigation", "summary": "SD member is suspected of child pornography • Unclear where it was found", "title_original": "”Kort film” hittad i utredningen", "summary_original": "SD-ledamot misstänks för barnpornografibrott • Oklart var den hittades", "link": "https://www.tv4.se/artikel/52rlAH5kbtZMBMClbYBnxm/kort-film-hittad-i-utredningen", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:29:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 76, "title": "The US and Iran escalate in the Gulf - \"The war is over\"", "summary": "The US has fired at several Iranian targets in the Gulf and Iran has responded by attacking neighboring countries in the region. Both sides claim self-defense or counterfire – negotiations on a ceasefire are still deadlocked. - The war is over now, says Foreign Minister Marco Rubio anyway.", "title_original": "USA och Iran eskalerar i Gulfen – ”Kriget är över”", "summary_original": "USA har skjutit mot flera iranska mål i Gulfen och Iran har svarat med att attackera grannländer i regionen. Bägge parter hävdar självförsvar eller moteld – förhandlingarna om vapenvila är fortsatt fastkörda. – Kriget är över nu, säger ändå utrikesminister Marco Rubio.", "link": "https://www.dn.se/varlden/usa-och-iran-eskalerar-i-gulfen-kriget-ar-over/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:26:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "New documentary about Carola in cinemas this summer", "summary": "A new documentary about one of Sweden's most popular artists is coming to cinemas this summer. August 21 is the premiere of \"Carola!\".", "title_original": "Ny dokumentär om Carola på bio i sommar", "summary_original": "En ny dokumentär om en av Sveriges mest folkkära artister kommer på bio i sommar. Den 21 augusti är det premiär för ”Carola!”.", "link": "https://www.hd.se/noje/ny-dokumentar-om-carola-pa-bio-i-sommar/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:15:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Over 20 dead in hotel fire in Delhi", "summary": "Over 20 lives have been claimed and around 40 injured in a hotel fire in Delhi, Indian authorities report.", "title_original": "Över 20 döda i hotellbrand i Delhi", "summary_original": "Över 20 liv har krävts och ett 40-tal skadats i en hotellbrand i Delhi, rapporterar indiska myndigheter.", "link": "https://www.sydsvenskan.se/varlden/over-20-doda-i-hotellbrand-i-delhi/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:14:05+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 79, "title": "Report: China's attempt to control Swedish media failed", "summary": "\"Represent China's history well\" - that's the winged phrase that Beijing wants journalists, opinion leaders and influencers from around the world to live by. Through hidden threats, the Chinese embassy tried to intimidate Swedish journalists into obedience. A new report shows that aggressiveness has had the opposite effect.", "title_original": "Rapport: Kinas försök att styra svenska medier misslyckades", "summary_original": "”Återge Kinas historia väl” – så lyder den bevingade frasen som Peking vill få omvärldens journalister, opinionsbildare och influerare att leva efter. Genom dolda hot försökte den kinesiska ambassaden skrämma svenska journalister till lydnad. En ny rapport visar att aggressiviteten fått motsatt effekt.", "link": "https://www.dn.se/varlden/rapport-kinas-forsok-att-styra-svenska-medier-misslyckades/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:09:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "Price collapse for Akzo Nobel", "summary": "The Dutch paint group Akzo Nobel, with around 900 employees in five locations in Sweden, collapses on the Amsterdam stock exchange.", "title_original": "Kurskollaps för Akzo Nobel", "summary_original": "Den nederländska färgkoncernen Akzo Nobel, med cirka 900 anställda på fem orter i Sverige, kollapsar på Amsterdambörsen.", "link": "https://www.hd.se/ekonomi/kurskollaps-for-akzo-nobel/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:06:35+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "Traffic is flowing again after a truck crash on the E6 outside Helsingborg", "summary": "There were long queues on the E6 outside Helsingborg on Wednesday morning after two trucks collided.", "title_original": "Trafiken flyter igen efter lastbilskrock på E6 utanför Helsingborg", "summary_original": "Det var långa köer på E6 utanför Helsingborg under onsdagsmorgonen efter att två lastbilar kolliderat.", "link": "https://www.hd.se/trafik/lastbilkrock-pa-e4-utanfor-helsingborg/", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:02:52+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "The suspicions against the SD member remain", "summary": "", "title_original": "Misstankarna mot SD-ledamoten kvarstår", "summary_original": "", "link": "https://www.svd.se/a/8p9gWW/misstankarna-mot-sd-ledamoten-kvarstar", "date_display": "2026-06-03", "date_iso": "2026-06-03T08:00:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 83, "title": "Here, the mysterious men disappear into the sewers of New York", "summary": "Equipped with headlamps, shovels, waders and other protective gear, they descend into New York's sewer system. No one knows what they're doing down there. Even the police - who have carried out several investigations - are questioning.", "title_original": "Här försvinner de mystiska männen ner i New Yorks avlopp", "summary_original": "Utrustade med pannlampor, spadar, vadarbyxor och annan skyddsutrustning tar de sig ner i New Yorks avloppssystem. Ingen vet vad de gör där nere. Även polisen – som genomfört flera undersökningar – står frågande.", "link": "https://www.dn.se/varlden/har-forsvinner-de-mystiska-mannen-ner-i-new-yorks-avlopp/", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:58:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 84, "title": "New documentary about Carola in cinemas this summer", "summary": "A new documentary about one of Sweden's most popular artists is coming to cinemas this summer. August 21 is the premiere of \"Carola!\".", "title_original": "Ny dokumentär om Carola på bio i sommar", "summary_original": "En ny dokumentär om en av Sveriges mest folkkära artister kommer på bio i sommar. Den 21 augusti är det premiär för ”Carola!”.", "link": "https://www.sydsvenskan.se/noje/ny-dokumentar-om-carola-pa-bio-i-sommar/", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:52:21+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "The plan: New arena in Stockholm", "summary": "", "title_original": "Planen: Ny arena i Stockholm", "summary_original": "", "link": "https://www.svd.se/a/5pLxyE/planen-ny-arena-i-stockholm", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:45:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 86, "title": "Denmark's government: New \"crown prince\"", "summary": "Mette Frederiksen's third Danish government consists of eleven women and ten men, according to a press release. That Peter Hummelgaard becomes the new finance minister is interpreted as him being Frederiksen's \"crown prince\". - We have waited a long time, but it has been worth it, rejoices the party's youth leader.", "title_original": "Danmarks regering: Ny ”kronprins”", "summary_original": "Mette Frederiksens tredje danska regering består av elva kvinnor och tio män, visar ett pressmeddelande. Att Peter Hummelgaard blir ny finansminister tolkas som att han är Frederiksens ”kronprins”. – Vi har väntat länge, men det har det varit värt, jublar partiets ungdomsledare.", "link": "https://www.svd.se/a/vr3MVX/danmarks-regering-loekke-kvar-som-utrikesminister", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:41:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 87, "title": "OECD fears global recession - but Sweden is growing", "summary": "The global economy is characterized by the Middle East conflict and an energy price shock, which has already slowed down growth. But the Swedish economy is growing, according to a forecast update from the Western economic cooperation organization OECD.", "title_original": "OECD befarar global recession – men Sverige växer", "summary_original": "Den globala ekonomin präglas av Mellanösternkonflikten och en energiprischock, som redan bromsat tillväxten. Men svensk ekonomi växer, enligt en prognosuppdatering från den västerländska ekonomiska samarbetsorganisationen OECD.", "link": "https://www.svd.se/a/8p9gXr/oecd-befarar-global-recession-men-sverige-vaxer", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:38:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 88, "title": "Make summer jobs tax-free - give Malmö's young people a first chance", "summary": "Summer jobs are many young people's first job, the Center Party wants it to be tax-free for the young person and the employer.", "title_original": "Gör sommarjobben skattefria – ge Malmös unga en första chans", "summary_original": "Sommarjobb är många ungas första jobb, Centerpartiet vill att det ska bli skattefritt för den unga och arbetsgivaren.", "link": "https://www.sydsvenskan.se/malmo/gor-sommarjobben-skattefria-ge-malmos-unga-en-forsta-chans/", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 89, "title": "Creamy pappardelle with romanesco", "summary": "Today's dinner tip offers an Italian pasta with romanesco, anchovies, garlic and parmesan. Fresh dill and a little squeezed lemon juice give the dish freshness. Quick, easy to prepare and really good! See Tina Nordström's recipe", "title_original": "Krämig pappardelle med romanesco", "summary_original": "Dagens middagstips bjuder på en italiensk pasta med romanesco, sardeller, vitlök och parmesan. Färsk dill och lite pressad citronsaft ger rätten fräschör. Snabbt, lättlagat och riktigt gott! Se Tina Nordströms recept", "link": "https://www.tv4.se/artikel/5NDXw50lqox10l8NpZTg13/kraemig-pappardelle-med-romanesco", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:22:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/personer/tina-nordstrom", "/koket", "/kokets-middag"]}, {"id": 90, "title": "Waiting for winter electricity prices - just in time for the holidays", "summary": "Summer is here. But rising winter prices prevail in the Swedish electricity market. \"There are three different factors that interact here,\" says electricity market expert Christian Holtz.", "title_original": "Väntar vinterpriser på el – lagom till semestern", "summary_original": "Sommaren är här. Men på den svenska elmarknaden råder stigande vinterpriser. ”Det finns tre olika faktorer som samspelar här,” säger elmarknadsexperten Christian Holtz.", "link": "https://www.svd.se/a/16ja9K/hoga-elpriser-i-svergie-i-sommar-har-ar-forklaringen", "date_display": "2026-06-03", "date_iso": "2026-06-03T07:01:11+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 91, "title": "They tipped off the police about the member", "summary": "SD politicians are investigated for child pornography crimes • Over 28,000 reports from Sweden last year", "title_original": "De tipsade polisen om ledamoten", "summary_original": "SD-politiker utreds för barnpornografibrott • Över 28 000 rapporter från Sverige förra året", "link": "https://www.tv4.se/artikel/DvpKAUIiTvygdX0qGkxVI/de-tipsade-polisen-om-ledamoten-ett-oerhoert-svart-arbete", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:56:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes"]}, {"id": 92, "title": "Republican victory: Alabama gets to redraw the electoral map", "summary": "The US Supreme Court gives Alabama the green light to redraw the electoral map - despite a lower court finding that the change discriminates against black voters. The decision is a victory for Donald Trump.", "title_original": "Republikansk seger: Alabama får rita om valkartan", "summary_original": "USA:s högsta domstol ger Alabama grönt ljus att rita om valkartan – trots att en lägre instans konstaterat att ändringen diskriminerar svarta väljare. Beslutet är en seger för Donald Trump.", "link": "https://www.sydsvenskan.se/varlden/republikansk-seger-alabama-far-rita-om-valkartan/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:50:45+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 93, "title": "Source: Space X price tag ready", "summary": "The price tag will be $135 per share when Space X is expected to go public shortly, according to reports. That gives a value of close to 1,800 billion dollars.", "title_original": "Källa: Prislappen på Space X klar", "summary_original": "Prislappen blir 135 dollar per aktie när Space X väntas gå till börsen inom kort, enligt uppgift. Det ger ett värde på närmare 1 800 miljarder dollar.", "link": "https://www.sydsvenskan.se/ekonomi/kalla-prislappen-pa-space-x-klar/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:49:33+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Tomas Ramberg: The scandal strikes against Åkesson's personal crusade", "summary": "That a high-ranking Sweden Democrat is suspected of child pornography offenses is a severe blow not only to SD, but to Jimmie Åkesson personally. In no other issue has he shown such strong personal commitment as in the fight against sex crimes affecting children. That a person close to the top of the party is suspected of precisely this destroys the SD leader's credibility in that fight.", "title_original": "Tomas Ramberg: Skandalen slår mot Åkessons personliga korståg", "summary_original": "Att en högt uppsatt sverigedemokrat misstänks för barnpornografibrott är en svår smäll inte bara för SD, utan för Jimmie Åkesson personligen. I ingen annan fråga har han visat så starkt personligt engagemang som i kampen mot sexbrott som drabbar barn. Att en person nära partitoppen misstänks för just detta raserar SD-ledarens trovärdighet i den kampen.", "link": "https://www.dn.se/sverige/tomas-ramberg-skandalen-slar-mot-akessons-personliga-korstag/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:30:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Sebastian Nowacki: My speedos are a declaration of war against modesty", "summary": "The further away from Sweden he is, the smaller his swimming trunks become. Sebastian Nowacki has a long and passionate relationship with his speedos, but he doesn't dare to use them at home.", "title_original": "Sebastian Nowacki: Mina speedos är en krigsförklaring mot lagom", "summary_original": "Ju längre bort från Sverige han är, desto mindre blir hans badbyxor. Sebastian Nowacki har ett långt och passionerat förhållande till sina speedos, men han vågar inte använda dem på hemmaplan.", "link": "https://www.dn.se/kultur/sebastian-nowacki-mina-speedos-ar-en-krigsforklaring-mot-lagom/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:22:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Microsoft releases its own AI", "summary": "Good morning! More news at Microsoft's annual Build conference, Mythos is coming to Sweden, and President Trump signs a decree for AI security.", "title_original": "Microsoft släpper egen AI", "summary_original": "God morgon! Flera nyheter på Microsofts årliga Buildkonferens, Mythos kommer till Sverige, och president Trump skriver under ett dekret för AI-säkerhet.", "link": "https://www.svd.se/a/9pq9RW/microsoft-slapper-sin-forsta-resonerande-ai-modell", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:21:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 97, "title": "Works well - but not for very long", "summary": "In the rest of Europe, work continues well into July. By then the Stockholmer has already turned off the light. Nobody is interested in doing anything between midsummer and the start of school.", "title_original": "Jobbar bra – men inte särskilt länge", "summary_original": "I resten av Europa pågår arbete långt in i juli. Då har stockholmaren redan släckt lampan. Ingen är intresserad av att uträtta något mellan midsommar och skolstart.", "link": "https://www.svd.se/a/0pLdk2/marcus-dunberg-svensken-jobbar-bra-men-inte-sarskilt-lange", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:08:44+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Perfect Guide"]}, {"id": 98, "title": "Widespread attacks last night - worst during the ceasefire", "summary": "The night's attacks began with the American military on Tuesday, with the naval target robot \"Hellfire\", shooting at a Botswana-flagged oil tanker on its way to the island of Kharg. The military's Central Command, Centcom, says the ship did not comply with the US blockade of Iranian ports and ignored warnings. According to Centcom, the ship's engine room was hit, which meant that it could not continue towards Iran. Iran responded by firing missiles at a Liberian-flagged ship, which according to the degree of revolution should be connected to the United States - whereupon the Americans attacked the island of Qeshm, located in the Strait of Hormuz.  The move prompted Iran in turn to fire robots and drones at US bases in Kuwait and Bahrain. The attack reportedly targeted \"a US air and helicopter base\" in the region, as well as a US military base in Bahrain. However, the US claims that Iran's attacks were \"failed\" and that the drones and robots could be shot back by the US without \"hitting their targets\". Shaky ceasefire The attacks come after Iran on Monday pulled out of talks with the US due to Israel's continued attacks on Lebanon. Donald Trump has subsequently claimed that negotiations are indeed continuing, and that he believes an agreement to reopen the Strait of Hormuz and extend the ceasefire with Iran is possible \"in the coming week\".  The president is also said to have pressured Israel to back off from its offensive in Lebanon. On Tuesday, Trump allegedly scolded the country's Prime Minister Benjamin Netanyahu and called him crazy, according to a source for Axios. Iran has not yet responded to the US's latest proposal for an agreement between the countries, state-run Iranian Mehr reports. However, discussions on the proposal are said to be ongoing. At the same time, Mohammad Jafar Asadi, deputy head of the Khatam al-Anbiya military headquarters, stated that a renewed war with the US is \"inevitable\". Despite the current ceasefire, the countries have repeatedly exchanged attacks with each other.", "title_original": "Omfattande attacker i natt – värsta under vapenvilan", "summary_original": "Nattens attacker inleddes med att den amerikanska militären på tisdagen, med sjömålsroboten ”Hellfire”, sköt mot en Botswana-flaggad oljetanker på väg mot ön Kharg. Militärens centralkommando, Centcom, uppger att fartyget inte följde den amerikanska blockaden av iranska hamnar och ignorerade varningar. Enligt Centcom ska fartygets maskinrum träffats vilket gjorde att den inte kunde fortsätta mot Iran. Iran svarade med att avfyra missiler mot ett Liberia-flaggat fartyg, som enligt revolutionsgradet ska vara kopplat till USA – varpå amerikanerna attackerade ön Qeshm, belägen i Hormuzsundet.  Draget fick Iran att i sin tur avfyra robotar och drönare mot amerikanska baser i Kuwait och Bahrain. Attacken ska ha riktat sig mot ”en amerikansk flyg- och helikopterbas” i regionen, såväl som en amerikanska örlogsbas i Bahrain. USA hävdar dock att Irans attacker var ”misslyckade” och att drönarna och robotarna kunde genskjutas av USA utan att ”nå sina mål”. Skakig vapenvila Attackerna kommer efter att Iran i måndags drog sig ur samtalen med USA på grund av Israels fortsatta attacker mot Libanon. Donald Trump har därefter hävdat att förhandlingarna visst fortgår, och att han tror att en en överenskommelse om att öppna Hormuzsundet igen och förlänga vapenvilan med Iran är möjlig ”under den kommande veckan”.  Presidenten ska också ha pressat Israel att backa från sin offensiv i Libanon. Under tisdagen ska Trump ha skällt ut landets premiärminister Benjamin Netanyahu och kallat honom för galen, enligt en källa till Axios. Iran har ännu inte svarat på USA:s senaste förslag till överenskommelse mellan länderna, rapporterar statliga iranska Mehr. Diskussionerna om förslaget uppges dock vara pågående. Samtidigt uppgav Mohammad Jafar Asadi, vice chef för det militära högkvarteret Khatam al-Anbiya, att ett förnyat krig med USA är ”oundvikligt”. Trots den rådande vapenvilan har länderna återkommande utbytt attacker med varandra.", "link": "https://www.tv4.se/artikel/FuJ7v0Pcily9lXYE74P3W/omfattande-attacker-i-natt-vaersta-under-vapenvilan", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:03:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/irankriget", "/usa", "/iran"]}, {"id": 99, "title": "Kullabo had a serious drug cocktail in his blood when the police arrived", "summary": "On the evening of January 15, the police received a call about a 25-year-old man arguing in the home. It has now led to him being prosecuted for minor drug and doping offences.", "title_original": "Kullabo hade rejäl drogcocktail i blodet när polisen kom", "summary_original": "På kvällen den 15 januari fick polisen larm om en man i 25-årsåldern som bråkade i hemmet. Det har nu lett till att han åtalats för ringa narkotika- och dopningsbrott.", "link": "https://www.hd.se/hoganas/kullabo-hade-rejal-drogcocktail-i-blodet-nar-polisen-kom/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:01:19+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 100, "title": "High lawyer's fee is appealed by JK", "summary": "The Chancellor of Justice, JK, wants the Court of Appeal to lower the compensation for a lawyer who was compensated for the same work twice.", "title_original": "Hög advokatersättning överklagas av JK", "summary_original": "Justitiekanslern, JK, vill att hovrätten ska sänka ersättningen för en advokat som fick ersättning för samma arbete två gånger.", "link": "https://www.sydsvenskan.se/lund/hog-advokatersattning-overklagas-av-jk/", "date_display": "2026-06-03", "date_iso": "2026-06-03T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "Villa from 1918 of 135 square meters sold - for 6.4 million", "summary": "", "title_original": "Villa från 1918 på 135 kvadratmeter såld – för 6,4 miljoner", "summary_original": "", "link": "https://www.hd.se/helsingborg/villa-fran-1918-pa-135-kvadratmeter-sald-for-64-miljoner/", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:55:36+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "Calming down the Swedes - ahead of the holidays: \"Shaky but quite stable\"", "summary": "The holiday is approaching and for those who have planned a flight abroad, there is perhaps some concern. Because there have been a lot of reports about lack of aviation fuel, risk of canceled flights and more expensive tickets. How do you view the risk of canceled flights? - Now for the summer, I don't think that risk is particularly great. There is a high demand during the summer, many people want to go out and travel. I think everyone will do everything to meet the demand that exists, says Elizabeth Axtelius, aviation marketing manager at Swedavia. Buying from other places She believes that Swedavia has jet fuel at all its airports and that you get deliveries at a normal rate.  In Europe, they are not as dependent on oil from the Middle East, but buy from other places such as the USA and Africa. - Refinery capacity has increased. Here and now we don't see any risk of that, but it is clear that this crisis will continue and if you look further into the future, there may of course be challenges, says Elizabeth Axtelius in Nyhetsmorgon. Looks better than expected The risk of the jet fuel running out has decreased in recent weeks, she believes. - The border has been moved forward. Partly because they have found other, alternative production and supply chains. In addition, we are entering a high season, now demand is strong. Then you don't cancel as many flights. How should one think as a traveler? It's still a bit shaky. - Yes, it's a bit shaky. But pretty stable, I'd say. I think that if you feel unsure, you can talk to your airline, travel agency or tour operator, says Elizabeth Axtelius.", "title_original": "Lugnar svenskarna – inför semestern: ”Skakigt men ganska stabilt”", "summary_original": "Semestern närmar sig och för den som planerat in en flygresa utomlands finns det kanske en viss oro. För det har ju rapporterats en hel del om brist på flygbränsle, risk för inställda avgångar och dyrare biljetter. Hur ser du på risken för inställda flyg? – Nu till sommaren så tror inte jag att den risken är speciellt stor. Det är en hög efterfrågan under sommaren, många vill ut och resa. Jag tror att alla kommer göra allt för att möta den efterfrågan som finns, säger Elizabeth Axtelius, flygmarknadschef på Swedavia. Köper från andra ställen Hon menar att Swedavia har flygbränsle på alla sina flygplatser och att man får leveranser i normal takt.  I Europa är man inte lika beroende av olja från Mellanöstern, utan köper från andra ställen som USA och Afrika. – Raffinaderikapaciteten har ökat. Så här och nu ser vi inte någon risk för det, men det är klart att fortsätter den här krisen och man tittar längre fram så kan det såklart bli utmaningar, säger Elizabeth Axtelius i Nyhetsmorgon. Ser bättre ut än väntat Risken för att flygbränslet ska ta slut har minskat de senaste veckorna, menar hon. – Gränsen har flyttats fram. Dels för att man har hittat andra, alternativa produktions- och leveranskedjor. Dessutom går vi in i en högsäsong, nu är efterfrågan stark. Då ställer man inte in så många flyg. Hur ska man tänka som resenär? Det är ändå lite skakigt. – Ja, det är lite skakigt. Men ganska stabilt, skulle jag vilja säga. Jag tycker att om man känner sig osäker så kan man prata med sitt flygbolag, resebyrå eller researrangör, säger Elizabeth Axtelius.", "link": "https://www.tv4.se/artikel/34qoQIuRQiw7AHMWXtjMtu/daempar-svenskarnas-semesteroro-lite-skakigt-men-ganska-stabilt", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:52:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/semester", "/flygbransle", "/flygresor", "/flygplan", "/flygbolag", "/installda-flyg", "/flygplats", "/flygtrafik"]}, {"id": 103, "title": "Man in Höör had hundreds of thousands of kroner in his underpants - arrested", "summary": "A man has been arrested with several SEK 100,000 in cash - in his underpants.", "title_original": "Man i Höör hade hundratusentals kronor i kalsongerna – greps", "summary_original": "En man har gripits med flera 100 000 kronor i kontanter – i kalsongerna.", "link": "https://www.hd.se/skane/man-i-hoor-hade-hundratusentals-kronor-i-kalsongerna-greps/", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:50:12+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "That's how satisfied the Swedes are with sex", "summary": "About half of Swedes are satisfied with their sex life. But in certain age groups, half of the women state that they have no interest in sex. This is evident from a new report from the Public Health Agency.", "title_original": "Så nöjda är svenskarna med sexet", "summary_original": "Omkring hälften av svenskarna är nöjda med sitt sexliv. Men i vissa åldersgrupper uppger hälften av kvinnorna att de saknar intresse för sex. Det framgår av en ny rapport från Folkhälsomyndigheten.", "link": "https://www.hd.se/sverige/sa-nojda-ar-svenskarna-med-sexet/", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:47:35+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "After Trump's new tariff threats: No drama", "summary": "Foreign Trade Minister Benjamin Dousa (M) plays down the Trump administration's new tariff game. - My picture is that there does not seem to be any drama for Sweden and Europe, he tells TT.", "title_original": "Efter Trumps nya tullhot: Ingen dramatik", "summary_original": "Utrikeshandelsminister Benjamin Dousa (M) spelar ned Trumpregeringens nya tullutspel. – Min bild är att det inte tycks vara någon dramatik för Sveriges och Europas del, säger han till TT.", "link": "https://www.svd.se/a/rrnQjw/ny-tulloffensiv-fran-usa-mot-60-lander", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:45:38+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 106, "title": "Drones at \"Putin's Davos\" - attack on oil terminal", "summary": "Black plumes of smoke rise from the oil terminal in St. Petersburg. The Ukrainian attack coincides with the start of the St. Petersburg Economic Forum, where the United States is participating for the first time in nearly a decade. The attack is described as an embarrassment for Russian President Vladimir Putin.", "title_original": "Drönare vid ”Putins Davos” – attack mot oljeterminal", "summary_original": "Svarta rökpelare stiger från oljeterminalen i S:t Petersburg. Den ukrainska attacken sammanfaller med starten på S:t Petersburgs ekonomiska forum, där USA deltar för första gången på nästan ett årtionde. Angreppet beskrivs som en pinsamhet för Rysslands president Vladimir Putin.", "link": "https://www.svd.se/a/PdP1Gb/dronare-vid-putins-davos-attack-mot-oljeterminal", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:44:48+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 107, "title": "I don't need any other flag than the Swedish one", "summary": "THE COLUMN: What juret”, har avlidit, rapporterar amerikanska medier.", "link": "https://www.svd.se/a/zO4my5/disneysangaren-peabo-bryson-dod", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:20:35+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 110, "title": "Had a huge amount - in the underpants", "summary": "A man has been arrested with several SEK 100,000 in cash - in his underpants.", "title_original": "Hade jättesumma – i kalsongerna", "summary_original": "En man har gripits med flera 100 000 kronor i kontanter – i kalsongerna.", "link": "https://www.svd.se/a/j0LG7A/hade-hundratusentals-kronor-i-kalsongerna-greps", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:15:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 111, "title": "Here, young people can afford – and can't afford – to buy a villa", "summary": "New rules should make it easier for younger people to buy homes - but in many Swedish municipalities, couples aged 25-35 cannot afford a villa, an analysis from SEB shows. - I see it as a positive development, but it also becomes clear which municipalities are out of reach, says private economist Américo Fernández.", "title_original": "Här har unga råd – och inte råd – att köpa villa", "summary_original": "Nya regler ska göra det lättare för yngre att köpa bostäder – men i många svenska kommuner har par i åldrarna 25–35 år inte råd med en villa, visar en analys från SEB. – Jag ser det som en positiv utveckling, men det blir också tydligt vilka kommuner som är utom räckhåll, säger privatekonomen Américo Fernández.", "link": "https://www.dn.se/ekonomi/har-har-unga-rad-och-inte-rad-att-kopa-villa/", "date_display": "2026-06-03", "date_iso": "2026-06-03T05:04:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": , "title_original": "Därför streamar de illegal ip-tv: ”Ett uttryck för missnöje”", "summary_original": "Ny undersökning: Svenskarna splittrade i frågan om kriminalisering", "link": "https://www.tv4.se/artikel/37ressoL9pI3VAUTtnXRBG/daerfoer-streamar-de-illegal-ip-tv-ett-uttryck-foer-missnoeje", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:50:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes"]}, {"id": 117, "title": "Listen: The Liberals want to raise school fees in Helsingborg", "summary": "", "title_original": "Lyssna: Liberalerna vill höja skolpengen i Helsingborg", "summary_original": "", "link": "https://www.hd.se/skane/lyssna-flera-restauranger-i-helsingborg-fick-rutorna-sonderslagna/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:41:53+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "The lawyer warns: \"There are very big risks for the customers\"", "summary": "Wants to stop illegal ip-tv • A billion-dollar industry - which fuels crime", "title_original": "Juristen varnar: ”Det finns väldigt stora risker för kunderna”", "summary_original": "Vill stoppa illegala ip-tv • En miljardindustri – som göder brottslighet", "link": "https://www.tv4.se/artikel/6q0Qm2FnwJ6cAPZDuG2mhW/juristen-varnar-det-finns-vaeldigt-stora-risker-foer-kunderna", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:36:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 119, "title": "Man shot dead by police after car chase in Nynäshamn", "summary": "A man in his 30s was shot dead by police after a car chase on Route 73 on Tuesday evening. The man is now being investigated for attempted murder in three cases. Three minors were traveling in the car, all close to the man. Two of them were taken to hospital, their condition is stable. - We see it as an isolated incident, says senior prosecutor Rebecka Boholm.", "title_original": "Man ihjälskjuten av polis efter biljakt i Nynäshamn", "summary_original": "En man i 30-årsåldern sköts till döds av polis efter en biljakt på väg 73 under tisdagskvällen. Mannen utreds nu för försök till mord i tre fall. I bilen färdades tre minderåriga personer, alla närstående till mannen. Två av dem fördes till sjukhus, deras tillstånd är stabilt. – Vi ser det som en isolerad händelse, säger senior åklagare Rebecka Boholm.", "link": "https://www.dn.se/sverige/man-ihjalskjuten-av-polis-efter-biljakt-i-nynashamn/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:34:05+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Air travel is increasing - despite the global situation", "summary": "Demand for air travel continued to strengthen during May via state-owned Swedavia's ten airports, recent statistics show.", "title_original": "Flygresandet ökar – trots omvärldsläget", "summary_original": "Efterfrågan på flygresor fortsatte under maj att stärkas via statliga Swedavias tio flygplatser, visar färsk statistik.", "link": "https://www.hd.se/ekonomi/flygresandet-okar-trots-omvarldslaget/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:33:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Football World Cup 2026 schedule: Matches and times", "summary": "48 teams – a record number – are participating in this summer's soccer World Cup in North America. Here you will find the schedule and results for all 104 matches - from the group stage to the final. You also get an overview of the arenas and how the heat can affect the players.", "title_original": "Spelschema fotbolls-VM 2026: Matcher och tider", "summary_original": "48 lag – rekordmånga – deltar i sommarens fotbolls-VM i Nordamerika. Här hittar du spelschema och resultat för samtliga 104 matcher – från gruppspel till final. Du får också koll på arenorna och på hur värmen kan påverka spelarna.", "link": "https://www.dn.se/sport/spelschema-fotbolls-vm-2026-matcher-och-tider/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:03:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Facts on the question: Which immigrants are integrated the fastest?", "summary": "Some immigrants quickly get jobs and high incomes. Others remain marginalized for years. Who establish themselves the fastest - and why? DN's Kristoffer Örstadius continues to investigate important social issues in Facts in the Question.", "title_original": "Fakta i frågan: Vilka invandrare integreras snabbast?", "summary_original": "Vissa invandrare får snabbt jobb och höga inkomster. Andra blir kvar i utanförskap i åratal. Vilka etablerar sig snabbast – och varför? DN:s Kristoffer Örstadius fortsätter att undersöka viktiga samhällsfrågor i Fakta i frågan.", "link": "https://www.dn.se/sverige/fakta-i-fragan-vilka-invandrare-integreras-snabbast/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:01:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Is the opposition cowardly before the election?", "summary": "One by one, the opposition parties are giving up some of their favorites - which they will not pursue in negotiations. Why do they do that, and what kind of questions are they letting go?", "title_original": "Håller oppositionen på att fega ur inför valet?", "summary_original": "Ett efter ett ger oppositionspartierna upp några av sina käpphästar – som de inte kommer driva i förhandlingar. Varför gör de så, och vad är det för frågor de släpper?", "link": "https://www.dn.se/podd/alskade-politik/haller-oppositionen-pa-att-fega-ur-infor-valet/", "date_display": "2026-06-03", "date_iso": "2026-06-03T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Richard Swartz: Physical strength and obedience trumped everything at my boarding school", "summary": "We were constantly hungry and the only thing that mattered was physical strength; in the evenings we boxed in the corridors. Time at boarding school wasn't cheap - and we all wished our parents hadn't been able to afford it. THE COLUMN. Richard Swartz is a journalist and independent columnist on Dagens Nyheter's editorial page.", "title_original": "Richard Swartz: Fysisk styrka och lydnad trumfade allt på mitt internat", "summary_original": "Vi var ständigt hungriga och det enda som betydde något var fysisk styrka; på kvällarna boxades vi i korridorerna. Tiden på internatet var inte billig – och vi önskade alla att våra föräldrar inte hade haft råd. KOLUMNEN. Richard Swartz är journalist och fristående kolumnist på Dagens Nyheters ledarsida.", "link": "https://www.dn.se/ledare/richard-swartz-fysisk-styrka-och-lydnad-trumfade-allt-pa-mitt-internat/", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:36:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Cramps at different ages – this is normal to feel", "summary": "It cracks, creaks, scratches and in the worst case it really hurts. How many ailments is it normal to have at different ages? Which ones can you accept and which ones can you do something about?", "title_original": "Krämpor vid olika åldrar – det här är normalt att känna", "summary_original": "Det knakar, knarrar, stretar och i värsta fall gör det rejält ont. Hur mycket krämpor är det normalt att ha vid olika åldrar? Vilka får du acceptera och vilka går det att göra något åt?", "link": "https://www.dn.se/insidan/krampor-vid-olika-aldrar-det-har-ar-normalt-att-kanna/", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:14:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Details: Police shot dead father - to save his child", "summary": "The police received an alert about a suspected kidnapping and attempted murder in the Stockholm area shortly after 8pm on Tuesday. A large police resource was dispatched and at 10 pm the car was found on national highway 73, Nynäsvägen, south of Stockholm. - After a short pursuit, this car drove into the guardrail on road 73 and stopped. And in connection with that, a police officer also opened fire and the driver of this car died, says Carina Skagerlind, press spokesperson at the Stockholm police region. According to information to TV4 Nyheterna, the person shot dead is a man in his 30s. In the car were his three children and the police shot the father to end the danger to them, according to the suspects. - The preliminary investigation concerns attempted murder in three cases. The suspected perpetrator, a man in his 30s, is confirmed deceased. The plaintiffs are three minors who are close to the suspect, and who traveled in the car with him. Two of them have injuries but their condition is stable. We see it as an isolated incident and there are no additional suspects in the case. Now the investigation continues with customary measures and with regard to the confidentiality of the preliminary investigation, I will not comment on the case further, says senior prosecutor Rebecka Boholm in a press release.  Details: Two children taken to hospital The police shooting is being investigated by the Special Investigations Department, which always happens when a police officer fires his weapon. The police are therefore sparing with details.  Was he armed?  - We will not go into that. Partly because we are working on a preliminary investigation into kidnapping and attempted murder. But there is also an ongoing investigation led by Special Investigations, says Carina Skagerlind. Two children were injured in the incident and taken to hospital, according to information given to TV4 Nyheterna. - Not life-threatening, but so injured that they went to the hospital in an ambulance. They are not suspected of any crime and otherwise I will not give any details about who they are and why they were in this car. \"Tea", "title_original": "Uppgifter: Polis sköt ihjäl pappa – för att rädda hans barn", "summary_original": "Polisen fick larm om ett misstänkt människorov och mordförsök i Stockholmsområdet strax efter klockan 20 på tisdagen. En stor polisresurs skickades ut och vid 22-tiden hittades bilen på riksväg 73, Nynäsvägen, söder om Stockholm. – Efter ett kort förföljande åkte den här bilen in i räcket på väg 73 och stannade. Och i samband med det sköt också en polis verkanseld och föraren av den här bilen avled, säger Carina Skagerlind, presstalesperson vid polisregion Stockholm. Enligt uppgifter till TV4 Nyheterna är den ihjälskjutne en man i 30-årsåldern. I bilen fanns hans tre barn och polisen sköt pappan för att avbryta faran mot dem, enligt misstankarna. – Förundersökningen gäller försök till mord i tre fall. Den misstänkte gärningspersonen, en man i 30-årsåldern, är bekräftat avliden. Målsägandena är tre minderåriga personer som är närstående till den misstänkte, och som färdades i bilen tillsammans med honom. Två av dem har skador men deras tillstånd är stabilt. Vi ser det som en isolerad händelse och det finns ingen ytterligare misstänkt i ärendet. Nu fortsätter utredningen med sedvanliga åtgärder och med hänsyn till förundersökningssekretessen kommer jag inte kommentera ärendet närmare, säger senior åklagare Rebecka Boholm i ett pressmeddelande.  Uppgifter: Två barn förda till sjukhus Polisskjutningen utreds av avdelningen för Särskilda utredningar, vilket alltid sker när en polis avlossar sitt vapen. Polisen är därför sparsamma med detaljer.  Var han beväpnad?  – Det kommer vi inte att gå in på. Dels för att vi arbetar med en förundersökning om människorov och försök till mord. Men det pågår också en utredning som leds av Särskilda utredningar, säger Carina Skagerlind. Två barn skadades i händelsen och fördes till sjukhus, enligt uppgifter till TV4 Nyheterna. – Inte livshotande, men så pass skadade att de åkte ambulans till sjukhus. De är inte misstänkta för något brott och i övrigt kommer jag inte ge några detaljer om vilka de är och varför de var i den här bilen. ”Tekniker, helikopter och drönare” Väg 73 var på onsdagsmorgonen avstängd på grund av utredningsarbete på platsen. – Vi gör en noggrann undersökning av platsen, efter det kommer den bil som den misstänkta föraren har kört att bärgas till en plats för fortsatt teknisk undersökning, säger Carina Skagerlind. Polisen har haft ett stort antal resurser på plats under natten och morgonen. – Att hålla avspärrningen av en så här stor väg kräver en del polisresurser. Men även tekniker, helikopter och drönare som har skapat sig en bild av brottsplatsen. Den skjutne mannens anhöriga har underrättats, enligt polisen.", "link": "https://www.tv4.se/artikel/3wPlWgcdbhg61sckzfeSbl/man-doed-skoets-av-polis-efter-biljakt", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:08:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/polisinsats", "/manniskorov", "/brott-och-straff", "/nynashamn", "/brott"]}, {"id": 127, "title": "Letter to the editor. Strengthen beach protection to curb our selfishness", "summary": "LETTER TO THE EDITOR. We must take human nature into account when we legislate, talk about tourism and think about sustainability. Keep the beach protection, strengthen it and make sure it is complied with, writes Pär Bokelund on Gotland.", "title_original": "Insändare. Förstärk strandskyddet för att tygla vår egoism", "summary_original": "INSÄNDARE. Vi måste ta den mänskliga naturen med i beräkningen när vi lagstiftar, pratar turism och funderar på hållbarhet. Behåll strandskyddet, förstärk det och se till att det efterlevs, skriver Pär Bokelund på Gotland.", "link": "https://www.dn.se/insandare/forstark-strandskyddet-for-att-tygla-var-egoism/", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "That is why young men seek church", "summary": "Young men also come to church to find healthy manhood, write Alf B Svensson and Emanuel Havskog.", "title_original": "Därför söker sig unga män till kyrkan", "summary_original": "Unga män kommer också till kyrkan för att hitta sund manlighet, skriver Alf B Svensson och Emanuel Havskog.", "link": "https://www.dagen.se/debatt/daerfoer-soeker-sig-unga-maen-till-kyrkan/10367957", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Why are politicians allowed to lie when detergent sellers are not allowed?", "summary": "If lies and deliberate distortions become an accepted part of the political game, the very foundation of democracy begins to erode, writes Kari Parman.", "title_original": "Varför får politiker ljuga när tvättmedelssäljare inte får?", "summary_original": "Om lögner och medvetna förvanskningar blir en accepterad del av det politiska spelet börjar själva grunden för demokratin att erodera, skriver Kari Parman.", "link": "https://www.dagen.se/debatt/varfoer-far-politiker-ljuga-naer-tvaettmedelssaeljare-inte-far/10369512", "date_display": "2026-06-03", "date_iso": "2026-06-03T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "The Equmenia Church's church conference asks
