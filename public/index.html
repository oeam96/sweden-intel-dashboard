ompensation claims are at stake. A wavy line on a map - and a new, unknown, photo are evidence that she believes strengthens her case. - For someone who has never even received a speeding ticket, it is an absurd situation. But I won't give up, she says.", "title_original": "Hon misstänks för skredet som svepte bort motorvägen: ”Kommer inte ge upp”", "summary_original": "STENUNGSUND. Åsa Norberg hotas av åtal för jordskredet som svepte bort E6-motorvägen. Enorma skadeståndskrav ligger i potten. Ett vågigt streck på en karta – och ett nytt, okänt, foto är bevis som hon anser stärker hennes sak. – För en som aldrig ens fått en fortkörningsbot är det en absurd situation. Men jag kommer inte ge upp, säger hon.", "link": "https://www.dn.se/sverige/hon-misstanks-for-skredet-som-svepte-bort-motorvagen-kommer-inte-ge-upp/", "date_display": "2026-05-13", "date_iso": "2026-05-13T04:00:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "The forbidden words in the election campaign - do campaigns matter?", "summary": "Election songs, promises and messages - with a few months left until September, most parties have launched their election campaigns. The Tidö parties are facing a big challenge - while S seems to be hoping for \"mother\".", "title_original": "De förbjudna orden i valrörelsen – spelar kampanjer någon roll?", "summary_original": "Vallåtar, löften och budskap – med några månader kvar till september har de flesta partier lanserat sina valkampanjer. Tidöpartierna står inför en stor utmaning - medan S verkar hoppas på \"mamma\".", "link": "https://www.dn.se/podd/alskade-politik/de-forbjudna-orden-i-valrorelsen-spelar-kampanjer-nagon-roll/", "date_display": "2026-05-13", "date_iso": "2026-05-13T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Young people can actually think too", "summary": "Major media choose to talk to young people as if they were stupid. But there are better ways to gain their trust.", "title_original": "Unga kan faktiskt också tänka", "summary_original": "Stora medier väljer att tala med unga som om de vore korkade. Men det finns bättre sätt att vinna deras förtroende.", "link": "https://www.svd.se/a/3pqozP/dn-och-svt-tramsar-bort-politiken", "date_display": "2026-05-13", "date_iso": "2026-05-13T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 110, "title": "Does botox belong at Dramaten?", "summary": "Recently, Dramaten launched a new service that will make it easy to identify harmful substances in cosmetics. But is theater make-up the biggest threat to the actor's body?", "title_original": "Hör botox hemma på Dramaten?", "summary_original": "I dagarna lanserade Dramaten en ny tjänst som ska göra det enkelt att identifiera skadliga ämnen i kosmetika. Men är just teatersminket det största hotet mot skådespelar­kroppen?", "link": "https://www.svd.se/a/K86axE/dramatens-tjanst-kosmetikakollen-har-en-blind-flack", "date_display": "2026-05-13", "date_iso": "2026-05-13T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 111, "title": "Expert on the summit: Then China would abandon Iran", "summary": "When the world's two most powerful leaders meet, one side is noticeably weakened. It could open the way for American concessions with far-reaching consequences. - China's dream scenario is to persuade the US to give up Taiwan, says China expert Björn Jerdén ahead of the upcoming meeting between the presidents of the US and China.", "title_original": "Expert om toppmötet: Då skulle Kina överge Iran", "summary_original": "När världens två mäktigaste ledare möts är den ena parten märkbart försvagad. Det kan öppna för amerikanska eftergifter med långtgående konsekvenser. – Kinas drömscenario är att övertala USA att ge upp Taiwan, säger Kinakännaren Björn Jerdén inför det stundande mötet mellan USA:s och Kinas presidenter.", "link": "https://www.svd.se/a/V6Qp54/expert-om-toppmotet-da-skulle-kina-overge-iran", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:45:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 112, "title": "Girl in pink sweatpants buys - the police pounce", "summary": "The teenage girls passed out after drinking toxic alcohol. The tracks led the police to Stockholm's so-called vodka trucks, Snapchat accounts and a phone number saved as \"Liquor\". Now prosecutors want four people deported from the country.", "title_original": "Tjej i rosa mjukisbyxor köper – polisen slår till", "summary_original": "Tonårsflickorna blev medvetslösa efter att ha druckit giftig alkohol. Spåren ledde polisen till Stockholms så kallade vodkabilar, Snapchat-konton och ett telefonnummer sparat som ”Sprit”. Nu vill åklagare att fyra personer utvisas från landet.", "link": "https://www.svd.se/a/16v6ve/vodkabilen-gar-rakt-i-fallan-spar-leder-till-snapchat-konton-och-en-avgorande-pusselbit", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:35:44+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 113, "title": "Anna Hedenmo: When the woman attacked my grandson, something snapped", "summary": "When the woman attacks my grandson because she is tired of \"foreigners\", it is the first time I see racism directed directly at my family. And then something happens in me. THE COLUMN. Anna Hedenmo is a journalist and new independent columnist on DN's editorial page.", "title_original": "Anna Hedenmo: När kvinnan gav sig på mitt barnbarn var det något som brast", "summary_original": "När kvinnan ger sig på mitt barnbarn för att hon är trött på ”utlänningar” är det första gången jag ser rasismen riktas direkt mot min familj. Och då händer något i mig. KOLUMNEN. Anna Hedenmo är journalist och ny fristående kolumnist på DN:s ledarsida.", "link": "https://www.dn.se/ledare/anna-hedenmo-nar-kvinnan-gav-sig-pa-mitt-barnbarn-var-det-nagot-som-brast/", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:33:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "\"Asking for swish after a dinner at home rude\"", "summary": "Stina Vickhoff is not afraid to say what she thinks.  Now she wants to inspire common sense and etiquette in today's world. And she likes to do it with her elbows on the table.", "title_original": "”Be om swish efter en hemmamiddag ohyfsat”", "summary_original": "Stina Vickhoff räds inte att säga vad hon tycker.  Nu vill hon inspirera till vett och etikett i samtiden. Och hon gör det gärna med armbågarna placerade på bordet.", "link": "https://www.svd.se/a/3p17Be/be-om-swish-efter-en-hemmamiddag-ohyfsat", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:21:33+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 115, "title": "Letter to the editor. Introducing a daily fact-checking program in SVT", "summary": "LETTER TO THE EDITOR. AI means that we can no longer trust that photos, films and audio recordings reflect reality. When false information is conveyed, it is important that corrections and corrections are made available to viewers on a daily basis in public service, writes Per Håkan Mattsson.", "title_original": "Insändare. Inför ett dagligt faktagranskande program i SVT", "summary_original": "INSÄNDARE. AI gör att vi inte längre kan lita på att foton, filmer och ljudupptagningar återspeglar verkligheten. När falsk information förmedlas är det viktigt att korrigeringar och tillrättalägganden dagligen kommer tittarna till del i public service, skriver Per Håkan Mattsson.", "link": "https://www.dn.se/insandare/infor-ett-dagligt-faktagranskande-program-i-svt/", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "The moment I take to deadly weapons, the devil has won", "summary": "I base my pacifism on the Bible's story of creation, where God creates man in his own image, writes Stefan Risenfors in a reply.", "title_original": "Ögonblicket jag tar till dödande vapen har djävulen segrat", "summary_original": "Min pacifism grundar jag i Bibelns skapelseberättelse där Gud skapar människan till sin avbild, skriver Stefan Risenfors i en replik.", "link": "https://www.dagen.se/debatt/oegonblicket-jag-tar-till-doedande-vapen-har-djaevulen-segrat/10336104", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Many laid off when Liljeholmen folk high school moves: \"A sadness\"", "summary": "School council chairman Maja, 24: \"There is a heavy atmosphere at the school right now\"", "title_original": "Många uppsagda när Liljeholmens folkhögskola flyttar:  ”En sorg”", "summary_original": "Skolrådsordförande Maja, 24: ”Det är en tung stämning just nu på skolan”", "link": "https://www.dagen.se/nyheter/manga-uppsagda-naer-liljeholmens-folkhoegskola-flyttar-en-sorg/10322567", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "\"We should worry even more about the influence of social media than we do\"", "summary": "Frida Söderlund, the journalist behind the documentary \"Smalast vinner\", about the obsession with beauty among children and young people", "title_original": "”Vi borde oroa oss ännu mer för sociala mediers påverkan än vi gör”", "summary_original": "Frida Söderlund, journalisten bakom dokumentären ”Smalast vinner”, om skönhetshetsen bland barn och unga", "link": "https://www.dagen.se/livsstil/vi-borde-oroa-oss-aennu-mer-foer-sociala-mediers-paverkan-aen-vi-goer/10341893", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Frida Söderlund: It took 35 minutes before the feed was full of fillers and plastic surgery", "summary": "Listen to the Dagens færler podcast about beauty ideals, physicality and social media.", "title_original": "Frida Söderlund: Det tog 35 minuter innan flödet var fullt av fillers och plastikoperationer", "summary_original": "Lyssna på podden Dagens föräldrar om skönhetsideal, kroppshets och sociala medier.", "link": "https://www.dagen.se/podd/frida-soederlund-det-tog-35-minuter-innan-floedet-var-fullt-av-fillers-och-plastikoperationer/10341799", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Foot shackles on children seeking protection - the government's choice of path raises questions", "summary": "Esther Flores Sedman: Find solutions that protect children's safety and dignity", "title_original": "Fotboja på barn som söker skydd – regeringens vägval väcker frågor", "summary_original": "Esther Flores Sedman: Hitta lösningar som värnar barns trygghet och värdighet", "link": "https://www.dagen.se/ledare/fotboja-pa-barn-som-soeker-skydd-regeringens-vaegval-vaecker-fragor/10341591", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Here is Ebba Busch's new tattoo – a biblical word from the Gospel of Mark", "summary": "The Jesus quote sits on the KD leader's right wrist as an important reminder", "title_original": "Här är Ebba Buschs nya tatuering – ett bibelord från Markusevangeliet", "summary_original": "Jesuscitatet sitter på KD-ledarens högra handled som en viktig påminnelse", "link": "https://www.dagen.se/nyheter/haer-aer-ebba-buschs-nya-tatuering-ett-bibelord-fran-markusevangeliet/10342396", "date_display": "2026-05-13", "date_iso": "2026-05-13T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "China: Mediation must be stepped up", "summary": "Chinese Foreign Minister Wang Yi calls on Pakistan to \"intensify\" its mediation efforts between Iran and the United States.", "title_original": "Kina: Medlingen måste intensifieras", "summary_original": "Kinas utrikesminister Wang Yi uppmanar Pakistan att ”intensifiera” sina medlingsinsatser mellan Iran och USA.", "link": "https://www.svd.se/a/ln4bV7/kina-medlingen-maste-intensifieras", "date_display": "2026-05-13", "date_iso": "2026-05-13T01:11:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 123, "title": "Australia to participate in Hormuz operation", "summary": "Australia will be one of the countries joining an effort designed to secure trade lanes through the Strait of Hormuz.", "title_original": "Australien ska delta i Hormuz-insats", "summary_original": "Australien blir ett av de länder som ansluter sig till en insats tänkt att säkra farlederna för handel genom Hormuzsundet.", "link": "https://www.svd.se/a/pBdbLR/australien-deltar-i-hormuz-insats", "date_display": "2026-05-12", "date_iso": "2026-05-12T23:51:34+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 124, "title": "\"The estranged son doesn't talk to us - my fault\"", "summary": "The son does not want contact since she gave him advice. \"Cursing myself - what should I do?\" asks sad mother. It doesn't have to be wrong to take help from a sibling, replies SvD's psychologist.", "title_original": "”Utflugne sonen pratar inte med oss – mitt fel”", "summary_original": "Sonen vill inte ha kontakt sedan hon gav honom ett råd. ”Förbannar mig själv – vad ska jag göra?” undrar ledsen mamma. Behöver inte vara fel att ta hjälp av ett syskon, svarar SvD:s psykolog.", "link": "https://www.svd.se/a/OkymQE/utflugne-sonen-pratar-inte-med-oss-ar-mitt-fel", "date_display": "2026-05-12", "date_iso": "2026-05-12T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Idagsidan"]}, {"id": 125, "title": "\"Can I arrange so that only my daughter inherits?\"", "summary": "What should I do so that only the daughter and not the grandchildren will inherit me, the questioner wonders. SvD's family lawyer gives answers.", "title_original": "”Kan jag ordna så att bara min dotter ärver?”", "summary_original": "Hur ska jag göra för att endast dottern och inte barnbarnen ska ärva mig, undrar frågeställaren. SvD:s familjeadvokat ger svar.", "link": "https://www.svd.se/a/Ok68GO/advokaten-da-bor-du-skriva-ett-testamente", "date_display": "2026-05-12", "date_iso": "2026-05-12T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 126, "title": "Letter to the editor. Noted by DN's readers on May 12", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Tuesday, May 12.", "title_original": "Insändare. Noterat av DN:s läsare den 12 maj", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll tisdagen den 12 maj.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-12-maj-2/", "date_display": "2026-05-12", "date_iso": "2026-05-12T22:10:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Hanna Fahl: Silly and genuinely fascinating – as usual", "summary": "It was a Eurovision, despite a year of chaos and dropouts - and Sweden's Felicia made it to the final in a starting field full of pre-favourites, writes DN's Hanna Fahl.", "title_original": "Hanna Fahl: Dumt och genuint fascinerande – som vanligt", "summary_original": "Det blev ett Eurovision, trots ett år av kaos och avhopp – och Sveriges Felicia tog sig till final i ett startfält fullt av förhandsfavoriter, skriver DN:s Hanna Fahl.", "link": "https://www.dn.se/kultur/hanna-fahl-dumt-och-genuint-fascinerande-som-vanligt/", "date_display": "2026-05-12", "date_iso": "2026-05-12T21:32:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Felicia through to the Eurovision final: \"So relieved and happy\"", "summary": "VIENNA. The first semi-final in the Wiener Stadthalle came with few surprises. Sweden's Felicia went on to the final in the Eurovision song contest, together with, among others, favorite tipped Finland and disputed Israel. - Now that my glasses broke, I actually think I have a chance to win, she tells DN after the broadcast.", "title_original": "Felicia vidare till final i Eurovision: ”Så lättad och glad”", "summary_original": "WIEN. Första semifinalen i Wiener Stadthalle kom med få överraskningar. Svenska Felicia gick vidare till final i Eurovision song contest, tillsammans med bland andra favorittippade Finland och omtvistade Israel. – Nu efter att mina glasögon gick sönder tror jag faktiskt att jag har chans att vinna, säger hon till DN efter sändningen.", "link": "https://www.dn.se/kultur/felicia-vidare-till-final-i-eurovision-sa-lattad-och-glad/", "date_display": "2026-05-12", "date_iso": "2026-05-12T21:14:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "\"Trump strives for good goals\"", "summary": "Russian vassal state – or a democratic future? Belarus' strongest opposition leader Svetlana Tichanovskaya tells in an SvD interview what she thinks about Trump's influence in Belarus - and what Europe should do. She also highlights Sweden.", "title_original": "”Trump strävar efter goda mål”", "summary_original": "Rysk lydstat – eller en demokratisk framtid? Belarus tyngsta oppositionsledare Svetlana Tichanovskaja berättar i en SvD-intervju vad hon tycker om Trumps påverkan i Belarus – och vad Europa borde göra. Hon lyfter även fram Sverige.", "link": "https://www.svd.se/a/zOMxV9/trump-stravar-efter-goda-mal", "date_display": "2026-05-12", "date_iso": "2026-05-12T20:02:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 130, "title": "Further - despite broken glasses: \"Very determined to win now\"", "summary": "The Swede took the stage as the evening's second contribution - a starting number that was named in advance as the \"death slot\". But despite the ominous starting number, Felicia and her song \"My system\" were met with cheers inside the arena. And there was never any reason to worry. Sweden again qualified for the final and has now not missed the final since 2010 when Anna Bergendahl failed to advance. \"It felt absolutely incredible, I'm so happy. The adrenaline on stage! I'm really excited to win now,\" announced Felicia from the green room after the number. - The whole arena is vibrating, agreed SVT's commentator Edward af Sillén. Felicia: \"Ugh, stomach ache\" When Felicia arrives at TV4's interview mic after the semi-finals, she almost still has a hard time understanding that the final place is clear. - I knew it! But I didn't know that. But I convinced myself I was safe, but I wasn't. But it was so nice, says Felicia. And the wait, it was hard. - Ugh, stomach ache. Say \"Sverige\", say \"Sweden\", she says about the thoughts and feelings in the seconds before the final announcement. The glasses broke: \"The circle is closed\" Her performance was not completely flawless either. A bit into the number when she was going to change her masking, from mouthguard to glasses, the latter broke. \"I turned around and took my first step so hard that the glitter on the glasses came off, hahaha. My first thought was, why can't I see my right eye,\" she writes to TV4 Nyheterna from the green room after the performance. Afterwards, she elaborates: - The glasses broke, but I didn't realize that. I thought I had been hit by a laser beam in the eye. But it was the joys. As I continued to sway in the dance, I noticed that I was seeing - and not seeing. Then I realized that the glasses were broken again. As they were at Mello. The circle is closed.  But the glasses failure was thus nothing that mattered to the final result. A radiantly happy Felicia, wrapped in a Swedish flag, could be seen in the green room", "title_original": "Vidare – trots glasögonhaveri: ”Jättetaggad på att vinna nu”", "summary_original": "Svenskan intog scenen som kvällens andra bidrag – ett startnummer som på förhand benämnts som ”döds-sloten”. Men trots det illavarslande startnumret möttes Felicia och hennes låt ”My system” av jubel inne i arenan. Och det fanns aldrig någon anledning att vara orolig. Sverige kvalificerade sig återigen för final och har nu inte missat finalen sedan 2010 då Anna Bergendahl inte lyckades ta sig vidare. ”Det kändes helt otroligt, jag är så glad. Adrenalinet på scenen! Jag är jättetaggad på att vinna nu”, meddelade Felicia från green room efter numret. – Hela arenan vibrerar, stämde SVT:s kommentator Edward af Sillén in. Felicia: ”Usch, ont i magen” När Felicia efter semifinalen kommer fram till TV4:s intervjumick har hon nästan fortfarande svårt att förstå att finalplatsen är klar. – Jag visste det! Men jag visste det inte. Men jag övertygade mig själv att jag var säker, men det var jag inte. Men det var så skönt, säger Felicia. Och väntan, den var jobbig. – Usch, ont i magen. Säg ”Sverige”, säg ”Sweden”, säger hon om tankarna och känslorna sekunderna innan finalbeskedet. Glasögonen gick sönder: ”Cirkeln är sluten” Hennes framträdandet var heller inte helt felfritt. En bit in i numret när hon skulle byta sin maskering, från munskydd till glasögon, gick de sistnämnda sönder. ”Jag vände mig om och tog mitt första steg så hårt att glittret på glasögonen lossnade, hahaha. Min första tanke var, varför ser jag inte på mitt högra öga”, skriver hon till TV4 Nyheterna från green room efter framträdandet. Efteråt utvecklar hon: – Glasögonen gick sönder, men det fattade inte jag. Jag trodde jag hade blivit träffad av en laserstråle i ögat. Men det var glajorna. När jag fortsatte att guppa i dansen så märkte jag att jag såg – och inte såg. Då fattade jag att glasögonen var trasiga igen. Som de var på Mello. Cirkeln är sluten.  Men glasögonhaveriet var alltså ingenting som spelade roll för slutresultatet. En strålande glad Felicia, omsvept i en svensk flagga, kunde ses i green room när Sverige blev klart för final som fjärde bidrag i ordningen. – Åh vad härligt! Bra jobbat Felicia, bra jobbat hela svenska teamet. Sverige är i final igen, jublade Edward af Sillén från kommentatorshytten när finalplatsen var klar. Israel stördes av slagord Inför semifinalen var Sverige tredjehandsfavoriter att ta sig vidare – efter Finland, med bland andra finlandssvenska violinisten Linda Lampenius, och Grekland. Båda länderna lyckades också knipa en finalplats. Diskussionen på förhand handlade dock till stor del om ett annat land – Israel och landets vara eller icke vara i tävlingen. Flera länder har på grund av Israels deltagande valt att bojkotta årets upplaga, däribland stornationen Spanien, Irland, Nederländerna, Slovenien och Island. Under inledningen av Israels nummer ”Michelle”, framfört av sångaren Noam Bettan, hördes slagorden ”Stop, stop the genocide” svagt inne i lokalen. Enligt TV4 Nyheternas reporter på plats verkade också Noam Bettan komma av sig en millisekund alldeles i slutet av bidraget. Det är dock oklart om det hade något att göra med publikens rop. Trots störningsmomentet kunde Israel kvalificera sig för lördagens final. Den andra semifinalen avgörs på torsdag. I den tävlar bland annat Norge, Danmark och Ukraina.", "link": "https://www.tv4.se/artikel/aWaTbPNJuTV0XXrGZAPQP/felicia-moettes-av-jubel-trots-glasoegonhaveri", "date_display": "2026-05-12", "date_iso": "2026-05-12T19:49:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/noje", "/musik", "/eurovision-2026", "/eurovision-song-contest", "/osterrike"]}, {"id": 131, "title": "Re-debated judgment in Italy - children can have three legal parents", "summary": "An Italian court decision has for the first time given a child three legally recognized parents – two fathers and one mother. It is the first case in Italy. - It is about three people who all want to be the parents of this child, says a lawyer in the case.", "title_original": "Omdebatterad dom i Italien – barn får ha tre juridiska föräldrar", "summary_original": "Ett italienskt domstolsbeslut har för första gången gett ett barn tre juridiskt erkända föräldrar – två pappor och en mamma. Det är det första fallet i Italien. – Det handlar om tre personer som alla vill vara föräldrar till det här barnet, säger en advokat i fallet.", "link": "https://www.dn.se/varlden/omdebatterad-dom-i-italien-barn-far-ha-tre-juridiska-foraldrar/", "date_display": "2026-05-12", "date_iso": "2026-05-12T19:43:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Felicia's glasses broke: \"Can't see\"", "summary": "Felicia performed \"My system\" in the Eurovision song contest semi-final. Then her glasses broke.", "title_original": "Felicias glasögon gick sönder: ”Ser inte”", "summary_original": "Felicia framförde ”My system” i Eurovision song contest-semifinalen. Då gick hennes glasögon sönder.", "link": "https://www.dn.se/kultur/felicia-framforde-my-system-felfritt-2/", "date_display": "2026-05-12", "date_iso": "2026-05-12T19:36:32+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "This is how Ukraine has gone from \"beggars\" - to experts", "summary": "At a position a few miles from the front line in southern Ukraine, we meet the soldiers who have become symbols of the new type of warfare. Here, Ukrainian special forces work to detect and knock out Russian attack drones before they reach their targets. - This is exactly the kind of technology that warfare needs right now. And as the systems develop, they will only get better and better, says the Ukrainian drone pilot \"Tom\". Only code names To protect their identity, the soldiers use only code names. Russia is constantly trying to trace people who work with advanced Ukrainian weapons systems. The drone that Tom shows off is called the F-7. It is developed to seek out and destroy incoming Russian attack drones by direct hit. On impact, the craft explodes and knocks the target into the air. The system costs only a fraction of the price of traditional anti-aircraft robots – but can still defend Ukrainian cities and civilians against nighttime Russian attacks. - I am honored and happy about our successes. It's all about our experience from the battlefield. We already know how the systems work and what is required to make the attacks more effective, says the 38-year-old pilot Tom. Using 30,000 drones a week At the same time, the scale is enormous. Ukraine is estimated to consume around 30,000 drones a week, although the numbers are uncertain. The extreme intensity of combat has also created something else: a unique skill set among Ukrainian drone pilots. A few kilometers away, inside an underground bunker, commanders \"Archie\" and \"Valdemar\" lead the operations. In front of large radar screens, they track incoming Russian targets in real time and direct the Ukrainian drones to their targets. - Yes, drones are developing very quickly. Now we have systems with automatic target tracking and automatic locking. Ukraine is developing this technology faster and better than our opponent, says Archie behind his mask. Gulf countries stand in line What is happening in Ukraine is increasingly described as the warfare of the future. Drones do not dominate counties", "title_original": "Så har Ukraina gått från ”tiggare” – till experter", "summary_original": "På en position några mil från frontlinjen i södra Ukraina möter vi soldaterna som blivit symboler för den nya typen av krigföring. Här arbetar ukrainska specialförband med att upptäcka och slå ut ryska attackdrönare innan de når sina mål. – Det här är exakt den typ av teknologi som krigföring behöver just nu. Och i takt med att systemen utvecklas kommer de bara bli bättre och bättre, säger den ukrainske drönarpiloten ”Tom”. Endast kodnamn För att skydda sin identitet använder soldaterna endast kodnamn. Ryssland försöker ständigt kartlägga personer som arbetar med avancerade ukrainska vapensystem. Drönaren som Tom visar upp kallas F-7. Den är utvecklad för att söka upp och förstöra inkommande ryska attackdrönare genom direktträff. Vid nedslag exploderar farkosten och slår ut målet i luften. Systemet kostar bara en bråkdel av priset för traditionella luftvärnsrobotar – men kan ändå försvara ukrainska städer och civila mot nattliga ryska attacker. – Jag är hedrad och glad över våra framgångar. Allt handlar om vår erfarenhet från slagfältet. Vi vet redan hur systemen fungerar och vad som krävs för att göra attackerna mer effektiva, säger den 38-årige piloten Tom. Använder 30 000 drönare i veckan Samtidigt är omfattningen enorm. Ukraina uppskattas förbruka omkring 30 000 drönare i veckan, även om siffrorna är osäkra. Den extrema stridsintensiteten har också skapat något annat: ett unikt kunnande bland ukrainska drönarpiloter. Några kilometer bort, inne i en bunker under marken, leder befälen ”Archie” och ”Valdemar” operationerna. Framför stora radarskärmar följer de inkommande ryska mål i realtid och dirigerar de ukrainska drönarna mot sina mål. – Ja, drönarna utvecklas väldigt snabbt. Nu har vi system med automatisk målföljning och automatisk låsning. Ukraina utvecklar den här tekniken snabbare och bättre än vår motståndare, säger Archie bakom sin mask. Gulfländer står i kö Det som sker i Ukraina beskrivs allt oftare som framtidens krigföring. Drönare dominerar inte längre bara spaning och precisionsattacker – de har blivit själva ryggraden i både försvar och offensiv. Länder i Gulfregionen står nu i kö för att samarbeta med Ukraina kring drönarsystem. Även Europa vill ta del av den ukrainska erfarenheten. Ett tiotal europeiska länder har redan inlett eller planerar gemensam produktion av drönare tillsammans med ukrainska företag och försvarsaktörer. Generellt växer också stoltheten inom den ukrainska försvarsmakten. Efter år av att ha betraktats som beroende av omvärldens hjälp ses Ukraina nu som en eftertraktad expert på modern krigföring. – Självklart behöver vi fler vapen. Nyare och mer avancerade system. För att bli starkare och mer motståndskraftiga, säger Tom. Men trots framgångarna är budskapet från soldaterna tydligt: Ukraina klarar sig fortfarande inte utan fortsatt stöd från väst. Drönarna har förändrat kriget Bakom Ukrainas förändrade position ligger framför allt landets snabba utveckling inom drönarteknologi. Under de senaste månaderna har regeringen i Kiev trappat upp sina långdistansattacker mot mål långt inne i Ryssland. Ukrainska drönare har slagit mot oljeanläggningar, hamnar, vapendepåer och andra militära mål. Flera ryska exportterminaler för olja har skadats svårt och delar av den sjöburna oljeexporten uppges ha stoppats upp. Även längs frontlinjen märks förändringen. Oberoende bedömare, däribland amerikanska Institute for the Study of War (ISW), rapporterar att de ryska framryckningarna i flera områden har avstannat. Drönarna har i praktiken tagit över stora delar av stridshandlingarna. Gått från ”tiggare” till expert Under de senaste åren har Ukraina genomfört en massiv satsning på egen drönarproduktion. I hundratals fabriker runt om i landet utvecklas och tillverkas nya modeller i snabb takt. Prototyper förändras och förbättras kontinuerligt utifrån erfarenheterna från fronten. Fyra år av brutalt ryskt anfallskrig har tvingat Ukraina att tänka nytt – och att bli världsledande på att försvara sig mot just ryska attacker. På bara ett halvår har Ukraina gått från att beskrivas som en hjälpsökande ”tiggare” till att bli en efterfrågad expert på hur framtidens krig ska utkämpas.", "link": "https://www.tv4.se/artikel/5sjgQ9id4EJi0WZASGGU8g/sa-har-ukraina-gatt-fran-tiggare-till-experter", "date_display": "2026-05-12", "date_iso": "2026-05-12T19:32:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ukraina"]}, {"id": 134, "title": "Hammarby won the derby after a questionable penalty", "summary": "Hammarby is the new league leader in the women's league. Elin Sørum was behind the victory in the Stockholm derby against Djurgården.", "title_original": "Hammarby vann derbyt efter tveksam straff", "summary_original": "Hammarby är ny serieledare i damallsvenskan. Elin Sørum låg bakom segern i Stockholmsderbyt mot Djurgården.", "link": "https://www.dn.se/sport/hammarby-vann-derbyt-efter-tveksam-straff/", "date_display": "2026-05-12", "date_iso": "2026-05-12T19:00:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Experts: Russian peace overtures a way to mislead", "summary": "The war in Ukraine is coming to an end, Moscow claims without presenting a solution to the conflict. There are no signs that the Kremlin is prepared to agree to anything that does not involve Kiev's capitulation, according to experts DN spoke to. - It is a way of misleading on the part of Russia, says Jakob Hedenskog, Eastern Europe expert.", "title_original": "Experter: Ryska fredsutspel ett sätt att vilseleda", "summary_original": "Kriget i Ukraina närmar sig ett slut, hävdar Moskva utan att presentera en lösning på konflikten. Det finns inga tecken på att Kreml är beredda att gå med på något som inte innebär Kievs kapitulation, enligt experter DN talat med. – Det är ett sätt att vilseleda från Rysslands sida, säger Jakob Hedenskog, Östeuropaexpert.", "link": "https://www.dn.se/varlden/experter-ryska-fredsutspel-ett-satt-att-vilseleda/", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:51:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Wounded Russian soldiers are forced back to the front", "summary": "Badly wounded soldiers are sent back to the front to fill the gaps in the Russian ranks. For the Wall Street Journal, a soldier captured by Ukraine testifies that he was forced to fight despite losing an arm.", "title_original": "Skadade ryska soldater tvingas tillbaka till fronten", "summary_original": "Svårt skadade soldater skickas tillbaka till fronten för att fylla luckorna i de ryska leden. För Wall Street Journal vittnar en soldat som fångats av Ukraina att han tvingats strida trots att han förlorat en arm.", "link": "https://www.dn.se/varlden/skadade-ryska-soldater-tvingas-tillbaka-till-fronten/", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:44:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "This is how you holiday cheaply - despite the Swedish krona falling apart", "summary": "After performing strongly last year, the krona has this year turned into one of the world's most traded and worst performing currencies. In recent months, the euro and the pound have risen by just over three percent compared to the krona. The dollar has risen by 4 percent, and the Norwegian krone has risen by as much as 8 percent. Look at the big mac index But travel expert Lottie Knutson doesn't think that anyone planning to travel this summer should be too worried. - There are so many factors that come into play, says Knutson in Efter fem. - Those rates are the banks' trading rates. We ordinary mortal travelers have to make do with the rate we are allowed to pay via credit card or bureau de change. That course has less swings, but a slightly worse course. If you look from a longer perspective, the krona is not doing so badly anyway, she believes. - If you look three years ahead, the krona has nevertheless strengthened. Have confidence, instead look at the big mac index or the holiday price index, says Knutson. Where you should travel The holiday price index compares prices at, for example, hotels, restaurants and bars. If you as a traveler want to get away cheaply, you should not look at the big European cities, says Knutson. - You must definitely scout east. Turkey is doing very well compared to the krona, they have also devalued the Turkish lira. Egypt is very well located. The Czech Republic, Bulgaria and Latvia are also very well located for us. \"Look north!\" Another option is to go on a \"sleepover\". Then the tip is to book quickly - and to avoid Skåne and the rest of southern Sweden, says Lottie Knutson. - Look north! There are fantastic holiday destinations in northern Sweden too.", "title_original": "Så semestrar du billigt – trots att svenska kronan går kasst", "summary_original": "Efter att ha gått starkt förra året har kronan i år vänt till att vara en av världens mest handlade valutor som gått sämst. De senaste månaderna har euron och pundet stigit drygt tre procent i jämförelse med kronan. Dollarn har stigit med 4 procent, och den norska kronan har stigit med hela 8 procent. Titta på big mac-index Men reseexperten Lottie Knutson tycker inte att den som planerar att resa i sommar bör vara allt för orolig. – Det är så många faktorer som spelar in, säger Knutson i Efter fem. – De kurserna är bankernas handelskurser. Vi vanliga dödliga resenärer får nöja oss med den kurs vi får betala via kreditkort eller växelkontor. Den kursen har mindre svängningar, men lite sämre kurs. Ser man ur ett längre perspektiv går kronan inte så dåligt ändå, menar hon. – Tittar man på tre års sikt bakåt har ändå kronan stärkts. Ha förtröstan, titta istället på big mac-index eller semesterprisindex, säger Knutson. Dit ska du resa Semesterprisindex jämför priser på exempelvis hotell, restauranger och barer. Om man som resenär vill komma billigt undan ska man inte titta på de stora europeiska städerna, säger Knutson. – Man ska absolut spana österut. Turkiet ligger superbra jämfört med kronan, de har dessutom devalverat turkiska liran. Egypten ligger jättebra till. Tjeckien, Bulgarien och Lettland ligger väldigt bra för oss också. ”Kika norrut!” Ett annat alternativ är att åka på ”svemester”. Då är tipset att vara snabb med att boka – och att undvika Skåne och resten av södra Sverige, säger Lottie Knutson. – Kika norrut! Det finns fantastiska semesterresmål i norra Sverige också.", "link": "https://www.tv4.se/artikel/2W6QcWGfPkD7gOrI7Dixle/sa-semestrar-du-billigt-trots-att-svenska-kronan-gar-kasst", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:43:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Resor", "/resor", "/resa", "/ekonomi"]}, {"id": 138, "title": "Olof is being chased by Italian fines - but has never been to the country", "summary": "The story began two years ago, when a debt collection claim appeared in the mailbox. Expressen was the first to report on this. The fine was for speeding in Italy - and the registration number strangely matched Med Olof's car. The only problem was that the car didn't. A red Suzuki was seen on the speed camera image. Franzén's own car is a gray Ford - which had also been parked and stood in his barn. With that evidence, he was able to dismiss the claim. - We sorted it out with the police and said that this is the wrong type of car. Then we thought we would never see this again, says Olof Franzén. New letters pour in But now the problems have returned. During the autumn and winter, new demand letters were sent, this time from Pisa in Italy via the German debt collection company Debtist. The sum amounts to roughly 340 euros, corresponding to almost 4,000 kroner. At first Olof thought it was a hoax. But then more and more reminders came pouring in. - It's ridiculous. There is something very crooked in that authority down in Pisa, says Olof Franzén. - I have not been to Italy, nor the car, and I do not intend to pay anything. \"Doesn't intend to pay\" He has chosen not to pay and is now waiting to receive the basic documents for the requirements to find out what evidence is behind them. At the same time, the case raises more questions than answers. - One wonders if there is some corrupt police sitting down there and having extra income in this way, that you send fines to people, says Olof Franzén and continues: - Or that someone drives around with a fake license plate. The police down there in Pisa should cover their ears and think, what is this strange?", "title_original": "Olof jagas av italienska böter – men har aldrig varit i landet", "summary_original": "Historien började för två år sedan, när ett inkassokrav dök upp i brevlådan. Detta var Expressen först att rapportera om. Böterna gällde en fortkörning i Italien – och registreringsnumret stämde konstigt nog Med Olofs bil. Problemet var bara att bilen inte gjorde det. På fartkamerabilden syntes en röd Suzuki. Franzéns egen bil är en grå Ford – som dessutom varit avställd och stått i hans ladugård. Med den bevisningen kunde han avfärda kravet. – Vi redde ut det med polisen och sa att det här är ju helt fel bilsort. Sedan tänkte vi att detta ser vi aldrig mer, säger Olof Franzén. Nya brev ramlar in Men nu har problemen återvänt. Under hösten och vintern har nya kravbrev skickats, denna gång från Pisa i Italien via det tyska inkassobolaget Debtist. Summan uppgår till drygt 340 euro, motsvarande närmare 4 000 kronor. Först tänkte Olof att det var en bluff. Men sedan ramlade det in fler och fler påminnelser. – Det är ju löjligt. Det är någonting som är väldigt snett i den myndigheten där nere i Pisa, säger Olof Franzén. – Jag har inte varit i Italien, inte bilen heller, och jag tänker inte betala någonting. ”Tänker inte betala” Han har valt att inte betala och väntar nu på att få ut grundunderlaget till kraven för att ta reda på vilka bevis som ligger bakom. Samtidigt väcker ärendet fler frågor än svar. – Man undrar ju om det är någon korrupt polis  som sitter där nere och har extrainkomster på det här viset, att man skickar böter till folk, säger Olof Franzén och fortsätter: – Eller att någon åker omkring med falskskylt. Polisen där nere i Pisa borde dra öronen åt sig och fundera, vad är det här för konstigt?", "link": "https://www.tv4.se/artikel/6MLW5kA8K2v0C2R1LSxBw4/olof-jagas-av-italienska-boeter-men-har-aldrig-varit-i-landet", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:32:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Böter", "/boter", "/italien", "/fortkorning", "/trafikbrott", "/bedragerier", "/inrikes"]}, {"id": 139, "title": "Sources: US wants to open three new bases in Greenland - negotiating with Denmark", "summary": "The US wants to open three new military bases in southern Greenland and is now negotiating with Denmark. The background is President Trump's goal of increased American presence on the island. - If the US wants it, they can do it, says US expert Dag Blanck.", "title_original": "Källor: USA vill öppna tre nya baser på Grönland – förhandlar med Danmark", "summary_original": "USA vill öppna tre nya militärbaser på södra Grönland och förhandlar nu med Danmark. Bakgrunden är president Trumps mål om ökad amerikansk närvaro på ön. – Om USA vill det, kan de göra det, säger USA-experten Dag Blanck.", "link": "https://www.dn.se/varlden/kallor-usa-vill-oppna-tre-nya-baser-pa-gronland-forhandlar-med-danmark/", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:28:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "\"Tough men\" - the riding course that challenges fathers", "summary": "The background to the initiative is that many men often stay in the stables as parents of riding children, but rarely sit in the saddle themselves. The riding club wanted to give the men a chance to try the challenges of riding themselves. - Sometimes a comment can come out where it is said: \"How difficult will it be?\". That's why we came up with this name, says Jimmy Duangpradap about \"Tough men\". Individually adapted teaching The course is designed to suit all levels, from beginners to those who have some previous riding experience. Already on the third occasion, the participants get to try jumping with the horses, but always at a level that feels safe for both rider and animal. - It's not like we let them loose on a track and everyone jumps one meter hurdles. There are fairly low obstacles and those who have not ridden much have leaders. It is always the well-being of the horses in the first place, says Jimmy Duangpradap. Several participants have proven to have natural talent, says the riding instructor. - Many times it is the case that men are basically quite strong. Muscle-wise, they have a little easier time doing certain things like easy riding or coordination things, says Jimmy Duangpradap. Great interest in the course The interest in \"Tough Men\" has been great ever since it started in 2019. Even though it is the first time the course has been noticed in the media, the reserve lists have been long. - Already the first time there were over a hundred on the reserve list, says Duangpradap. He also says that many men gain a new respect for the challenges of riding, and the classic comment \"how hard is it supposed to be?\" get a whole new perspective. - Humility has come in, says Duangpradap.", "title_original": "”Tuffa män” – ridkursen som utmanar pappor", "summary_original": "Bakgrunden till initiativet är att många män ofta vistas i stallet som föräldrar till ridande barn, men sällan själva sätter sig i sadeln. Ridklubben ville ge männen en chans att själva testa på ridningens utmaningar. – Ibland kan det ju komma ut en kommentar där det sägs: ”Hur svårt ska det vara?”. Därför kom vi på det här namnet, säger Jimmy Duangpradap om ”Tuffa män”. Individanpassad undervisning Kursen är utformad för att passa alla nivåer, från nybörjare till dem som har viss ridvana sedan tidigare. Redan vid tredje tillfället får deltagarna prova att hoppa med hästarna, men alltid på en nivå som känns trygg för både ryttare och djur. – Det är inte så att vi släpper lös dem på en bana och alla hoppar enmetershinder. Det är ganska låga hinder och de som inte har ridit så mycket har ledare. Det är alltid hästarnas välmående i första hand, säger Jimmy Duangpradap. Flera deltagare har visat sig ha naturlig talang menar ridläraren. – Många gånger är det så att män är ganska starka i grunden. Muskelmässigt har de lite lättare att utföra vissa grejer som att rida lätt eller koordinationsgrejer, säger Jimmy Duangpradap. Stort intresse för kursen Intresset för ”Tuffa män” har varit stort ända sedan starten 2019. Trots att det är första gången kursen uppmärksammas i media har reservlistorna varit långa. – Redan första gången var det över hundra stycken som var på reservlistan, säger Duangpradap. Han berättar även att många män får en ny respekt för ridningens utmaningar, och den klassiska kommentaren ”hur svårt ska det vara?” får ett helt nytt perspektiv. – Ödmjukhet har infunnit sig, säger Duangpradap.", "link": "https://www.tv4.se/artikel/7KcszQ0kzABWCNfApcaWHM/tuffa-maen-ridkursen-som-utmanar-pappor", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:26:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/ridskola", "/hast", "/foraldrar", "/foraldraskap"]}, {"id": 141, "title": "Lisa Magnusson: There is nothing more difficult than being sexy", "summary": "No woman wants her abdomen to resemble \"a big, good ice cream\". Or?", "title_original": "Lisa Magnusson: Det finns inget svårare än att vara sexig", "summary_original": "Ingen kvinna vill få sitt underliv liknat vid ”en stor god glass”. Eller?", "link": "https://www.dn.se/ledare/lisa-magnusson-det-finns-inget-svarare-an-att-vara-sexig/", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:08:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "MS sufferer Tomas, 43, found the right way - in cannabis: \"Increased the quality of life\"", "summary": "The prescription of Sativex, a cannabis-based mouth spray, has increased sharply in Sweden, especially in the last three years. Last year, 2,119 people received the drug on prescription, according to Fass and the Swedish Medicines Agency. 43-year-old Thomas Taserud from Askim in Gothenburg was diagnosed with multiple sclerosis, MS, six years ago. He says that he has tried several medicines, including those classified as narcotics, but had severe side effects. According to him, it was only with medical cannabis that nerve pain, muscle cramps and balance problems eased. License required for plant parts In Sweden, there are two approved cannabis-based medicines: Sativex and Epidyolex. No medicines with whole plant parts from cannabis are approved, but they can be prescribed via license prescription where treating doctors apply for permission from the Swedish Medicines Agency. Last year, 133 people applied for license prescription and 81 were granted. The increase difficult to explain A possible explanation for the rise could be an increased public interest in cannabis, according to Emmanuel Bäckryd, assistant professor of pain medicine and senior physician at Linköping University. At the same time, he points out that a review by the international pain organization IASP does not support broad prescription for long-term pain. - It has been seen and heard in the media, but it is difficult to see any pain medicine explanation that justifies the increase, says Emmanuel Bäckryd. - Many who advocate medical cannabis have commercial interests and pick the icing on the cake when it comes to studies. There is no evidence that cannabis-based medicines would be a large part of the solution to the problem of long-term pain, says Emmanuel Bäckryd. \"Warns of addiction - laughable\" Thomas Taserud says that he has previously been warned of addiction, but that he sees it as a strange objection compared to other preparations he has taken. - Many doctors have warned me about becoming addicted, but it's laughable considering the strong, addictive narcotic drugs I've taken in the past, b", "title_original": "MS-sjuke Tomas, 43, hittade rätt – i cannabis: ”Höjt livskvaliteten”", "summary_original": "Förskrivningen av Sativex, ett cannabisbaserat munhålespray, har ökat kraftigt i Sverige, framför allt de tre senaste åren. Förra året fick 2 119 personer läkemedlet på recept, enligt Fass och Läkemedelsverket. 43-årige Thomas Taserud från Askim i Göteborg fick diagnosen multipel skleros, MS, för sex år sedan. Han berättar att han prövat flera läkemedel, även narkotikaklassade, men fått svåra biverkningar. Enligt honom var det först med medicinsk cannabis som nervsmärtor, muskelkramper och balansproblem lättade. Licens krävs för växtdelar I Sverige finns två godkända cannabisbaserade läkemedel: Sativex och Epidyolex. Inga läkemedel med hela växtdelar från cannabis är godkända, men de kan skrivas ut via licensförskrivning där behandlande läkare söker tillstånd hos Läkemedelsverket. Förra året ansökte 133 personer om licensförskrivning och 81 beviljades. Ökningen svår att förklara En möjlig förklaring till uppgången kan vara ett ökat allmänt intresse för cannabis, enligt Emmanuel Bäckryd, biträdande professor i smärtmedicin och överläkare vid Linköpings universitet. Han hänvisar samtidigt till att en genomgång från den internationella smärtorganisationen IASP inte ger stöd för bred förskrivning mot långvarig smärta. – Det har synts och hörts i media, men det är svårt att se någon smärtmedicinsk förklaring som motiverar ökningen, säger Emmanuel Bäckryd. – Många som förespråkar medicinsk cannabis har kommersiella intressen och plockar russinen ur kakan när det gäller studier. Att cannabisbaserade läkemedel skulle vara en stor del av lösningen på problemet långvarig smärta finns inget som stödjer det, säger Emmanuel Bäckryd. ”Varnar för beroende – skrattretande” Thomas Taserud säger att han tidigare varnats för beroende, men att han ser det som en märklig invändning jämfört med andra preparat han tagit. – Många läkare har varnat mig för att bli beroende, men det är skrattretande med tanke på de starka, beroendeframkallande narkotikaklassade preparat jag tagit tidigare, bland annat Pregabalin. Det här har höjt min livskvalitet, säger Thomas Taserud.", "link": "https://www.tv4.se/artikel/7xe0ZOBH92ibZ41gPsZbev/ms-sjuke-tomas-43-hittade-raett-i-cannabis-hoejt-livskvaliteten", "date_display": "2026-05-12", "date_iso": "2026-05-12T18:08:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/halsa", "/cannabis", "/lakemedel", "/vard", "/medicin"]}, {"id": 143, "title": "Only then can an announcement come - after Trump's fateful visit to China", "summary": "", "title_original": "Först då kan ett besked komma – efter Trumps ödesbesök i Kina", "summary_original": "", "link": "https://www.tv4.se/artikel/1DT5Mw9RVHomJjChhx7hRr/foerst-da-kan-ett-besked-komma-efter-trumps-oedesbesoek-i-kina", "date_display": "2026-05-12", "date_iso": "2026-05-12T17:08:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 144, "title": "The mother's despair - refuses to accept the verdict: \"Heartache\"", "summary": "The son was shot dead in a barbershop • The councilman: \"It is not possible to show intent\"", "title_original": "Mammans förtvivlan – vägrar att acceptera domen: ”Ont i hjärtat”", "summary_original": "Sonen sköts ihjäl på frisersalong • Rådmannen: ”Går inte att visa uppsåt”", "link": "https://www.tv4.se/artikel/2Zj8BDyh5iJuKDlU8wer6T/mammans-foertvivlan-vaegrar-att-acceptera-domen-ont-i-hjaertat", "date_display": "2026-05-12", "date_iso": "2026-05-12T16:12:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 145, "title": "Anger on live TV: \"I'm on fire\"", "summary": "Graham Potter named his World Cup squad on Tuesday. Roony Bardghji, Hugo Larsson and Williot Swedberg did not get a place in it. TV4's expert John Guidetti boils when he gives his view on the line-up selected by the national team captain. \"Coward\" - I think this is a cowardly draft. You remove players with character, you are afraid that there will be a bad atmosphere. Your job as national team captain is to solve so that you have the best players? asks Guidetti in the Ball Club. - Check quality and performance. Where is Bardghji? Where is Swedberg? Where is Larsson? I don't understand it, I can't understand it. Dissatisfaction with the Barcelona star being poked He is particularly hung up on the fact that Bardghji was left out. - It is not possible to bring a player who plays in the 2. Bundesliga (Alexander Bernhardsson) and not bring someone who just won La Liga with Barcelona. It doesn't add up. Same with Swedberg. 9+7 in La Liga, scored against Real Madrid and been fantastic. Guidetti continues: - I cannot understand it. Is it that Graham Potter... he had a lot of big stars there and had a hard time managing it. Does he want to remove the big players? I don't know. I'm a little on fire.", "title_original": "Ilskan i live-tv: ”Jag brinner”", "summary_original": "Graham Potter tog ut sin VM-trupp under tisdagen. I den fick Roony Bardghji, Hugo Larsson och Williot Swedberg inte plats. TV4:s expert John Guidetti kokar när han ger sin syn på uppställningen förbundskaptenen valt ut. ”Feg” – Jag tycker att det här är en feg trupputtagning. Du tar bort spelare med karaktär, du är rädd att det ska bli dålig stämning. Ditt jobb som förbundskapten är väl att lösa så att du har med de bästa spelarna? frågar sig Guidetti i Bollklubben. – Kolla på kvalitet och prestation. Var är Bardghji? Var är Swedberg? Var är Larsson? Jag förstår det inte, jag kan inte förstå det. Missnöjet mot att Barcelonastjärnan petas Han hänger särskilt upp sig på att Bardghji lämnades utanför. – Det går inte att ta med en spelare som spelar i 2. Bundesliga (Alexander Bernhardsson) och inte ha med någon som precis vunnit La Liga med Barcelona. Det går inte ihop. Samma med Swedberg. 9+7 i La Liga, gjort mål mot Real Madrid och varit fantastiskt. Guidetti fortsätter: – Jag kan inte förstå det. Är det att Graham Potter... han hade många stora stjärnor där och hade svårt att hantera det. Vill han ta bort de stora spelarna? Jag vet inte. Jag brinner lite.", "link": "https://www.tv4.se/artikel/38EAfTjJzspRQDWPv5zFGM/ilskan-i-live-tv-jag-brinner", "date_display": "2026-05-12", "date_iso": "2026-05-12T15:12:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Fotboll", "/fotboll", "/fotbolls-vm-2026", "/graham-potter", "/svenska-landslaget"]}, {"id": 146, "title": "Another Swede isolated - due to virus alert from WHO", "summary": "The person who is now isolated must have sat near an infected individual on a flight from Johannesburg in South Africa, FHM tells the newspaper. - We have forwarded the information to the infection control unit in the person's home region, which, in consultation with this person, has now taken adequate measures, says Erik Sturegård, acting state epidemiologist at the Public Health Agency, to DN.  However, the risk of the person being infected by the virus is considered small. FHM must have been alerted to the person by WHO. - We have received information about a person from Sweden who may have been exposed to infection. On occasions like this, the infection control authorities in the countries concerned sound the alarm and via the WHO we received this information about this person. The alarm goes off if the person had close contact or sat plus/minus two rows from the infected person, says Erik Sturegård to the newspaper. One is kept in isolation from before It is already known that a Swedish man was on the virus ship Hondius and that he traveled home to Sweden. He too is kept in isolation. Magnus Gisslén is a former state epidemiologist at FHM. Nowadays, he is back in his new role as professor of infectious diseases at Sahlgrenska Academy. He believes that the authority has so far acted according to protocol. - We have a person who has been exposed to infection in Sweden and then it is the regional infection control, the regional infection control that handles it operationally. And it is of course the case that you have to isolate people who may have been exposed to infection, and from what I understand that is also done, he says. Hostage: Not current with general testing The Hantavirus is not a new virus. However, Gisslén states that there is still much to learn from the new virus outbreak.  - It was a person who had no symptoms from the US, but who may be positive in a test. And it is clear that we do not have full knowledge of what this disease looks like anyway. So from a purely scientific perspective, for us to learn more, it can", "title_original": "Ytterligare en svensk isolerad – på grund av viruslarm från WHO", "summary_original": "Den person som nu isolerats ska ha suttit i närheten av en smittad individ på en flygresa från Johannesburg i Sydafrika, uppger FHM för tidningen. – Vi har vidarebefordrat informationen till smittskyddsenheten i personens hemregion som, i samråd med den här personen, nu vidtagit adekvata åtgärder, säger Erik Sturegård, tillförordnad statsepidemiolog på Folkhälsomyndigheten, till DN.  Risken för att personen är smittad av viruset bedöms däremot som liten. FHM ska ha uppmärksammats på personen av WHO. – Vi har fått information om en person hemmahörande i Sverige som kan ha utsatts för smitta. Vid sådana här tillfällen slår smittskyddsmyndigheterna i berörda länder larm och via WHO fick vi den här informationen om den här personen. Larmet går om personen haft nära kontakt eller suttit plus/minus två rader från den smittade, säger Erik Sturegård till tidningen. En hålls isolerad sedan tidigare Det är sedan tidigare känt att en svensk man befann sig på virusfartyget Hondius och att han rest hem till Sverige. Även han hålls isolerad. Magnus Gisslén är tidigare statsepidemiolog vid FHM. Numera är han tillbaka i sin nygamla roll som professor i infektionssjukdomar vid Sahlgrenska akademin. Han menar att myndigheten hittills agerat enligt protokoll. – Vi har en person som har varit utsatt för smitta i Sverige och då är det ju de regionala smittskydden, det regionala smittskyddet som hanterar det operativt. Och det är naturligtvis så att man ska isolera personer som kan ha varit utsatta för smitta och det vad jag förstår görs också, säger han. Gisslén: Inte aktuellt med allmän testning Hantaviruset är inget nytt virus. Däremot uppger Gisslén att det fortsatt finns mycket att lära av det nya virusutbrottet.  – Det var ju en person som inte hade symtom från USA, men som eventuellt är positiv i ett prov. Och det är klart att vi har inte full kunskap när det gäller hur den här sjukdomen ändå ser ut. Så ur ett rent vetenskapligt perspektiv, för att vi ska lära oss mer, så kan det vara värdefullt att man strukturerat gör så att man testar personer som man vet har utsatts för smitta men som kanske inte har blivit sjuka ännu, säger han och tillägger: – Men någon stor allmän testning det är absolut inte aktuellt. ”Har inte potentialen att ge en pandemi” En ny pandemi, likt covid, är enligt Gisslén inget man behöver gå runt och oroa sig för. – Det här är ett virus som inte sprids på samma sätt med luften, utan det är mycket svårare att sprida det. Det krävs närmre kontakt för att det ska spridas mellan människor, förklarar han. Virusets inkubationstid är också något längre. – Det kan vara en nackdel på vissa sätt men också en fördel på andra sätt – att man då kan spåra personer som har blivit utsatta för smitta och isolera dem innan de blir sjuka. – Sannolikt har inte det här viruset potentialen att kunna ge en pandemi, säger Magnus Gisslén. ”Mycket allvarligare än covid” Han pekar på två orsaker till att uppmärksamheten runt viruset trots det blivit så stor. Dels handlar dte om att många har pandemin och dess konsekvenser i färskt minne. – Men sen också, det här är ju ett virus och en sjukdom som är väldigt allvarlig. Mycket, mycket allvarligare än covid för den som får det, säger Gisslén och utvecklar: – För de som får svåra symtom och får svåra problem med lungorna är ju dödligheten upp till 30-40 procent. Och det är klart, det är ju enormt högt. Så det är en sjukdom som man måste ta på allvar och det gör också att man kan bli orolig. När TV4 Nyheterna intervjuade Gisslén var det ännu inte känt att ytterligare en person isolerats.", "link": "https://www.tv4.se/artikel/5pha4FOraX7BSXjDoclYnD/ytterligare-en-svensk-isolerad-pa-grund-av-hantavirus", "date_display": "2026-05-12", "date_iso": "2026-05-12T13:52:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/hantaviruset", "/sydafrika", "/folkhalsomyndigheten"]}, {"id": 147, "title": "He doesn't care who he kills", "summary": "", "title_original": "Han bryr sig inte vem han mördar", "summary_original": "", "link": "https://www.tv4.se/artikel/2sybbqKBjwVThMCiegPk9p/han-bryr-sig-inte-vem-han-moerdar", "date_display": "2026-05-12", "date_iso": "2026-05-12T13:34:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 148, "title": "Make a comeback in the TV4 program", "summary": "TV profile Tina Nordström is now returning to Hela kendis-Sverige bakar - something she says she hadn't expected. Two years ago, the food profiler decided to quit the TV show that she had been with and led for seven years.  - These are long intensive days with a high pace. But both the job itself and the team behind it are great fun to work with. I probably hadn't understood how much I really missed the tent until now, says Tina Nordström. \n\nThe long days in the bakery are described as a once-in-a-lifetime experience, with fast pace, many different smells and where everything is mixed with laughter and tears.  - There are so many emotions in a sugar cookie, she says. \n\nShe describes how the participants are often thrown into situations where they have to perform under pressure, sometimes without previous experience in baking.\n\n- I love the technical rear moments. When they stand there like birdhouses. I throw them a task and push them forward a little, she says.  Celebrities a \"self-playing piano\" In the program, the celebrities compete in pairs and face both creative and technically demanding challenges. Everything from fluffy cakes and crisp cakes to other baked goods is on offer - and everything is done under tight time pressure. The difference between working with celebrity participants and other participants is clear, according to her. With celebrities, it is similar to a \"self-playing piano\" where they work in teams and the production does not have to control as much. \n\nWith other participants, the involvement in the baking can be greater, while the celebrities can surprise.\n\n- The ones you think are complete shits at baking can suddenly excel. Lessons learned from the program At the same time, she says that she herself, as a chef, didn't bake very much from the beginning – but that changed over time.\n\n- All of a sudden I baked cinnamon buns, sourdough bread and tarte tatin, she says.  Several well-known profiles participate in this year's season, including athletes and TV personalities who are faced with completely new challenges in the kitchen. Among other things, the national team captain dives in football", "title_original": "Gör comeback i TV4-programmet", "summary_original": "Tv-profilen Tina Nordström återvänder nu till Hela kändis-Sverige bakar – något hon säger att hon inte hade räknat med. För två år sedan bestämde sig matprofilen att hoppa av tv-programmet som hon då varit med och lett i sju år.  – Det är långa intensiva dagar med högt tempo. Men både själva jobbet och teamet bakom är fantastiskt kul att jobba med. Jag hade nog inte förstått hur mycket jag verkligen saknat tältet förrän nu, säger Tina Nordström. \n\nDet långa dagarna i bageriet beskrivs som en upplevelse man bara får en gång i livet, med högt tempo, många olika dofter och där allt blandas med skratt och tårar.  – Det finns så mycket känslor i en sockerkaka, säger hon. \n\nHon beskriver hur deltagarna ofta kastas in i situationer där de måste prestera under press, ibland utan tidigare erfarenhet av bakning.\n\n– Jag älskar de tekniska bakmomenten. När de står där som fågelholkar. Jag slänger en uppgift åt dem och puttar dem lite framåt, säger hon.  Kändisar ett ”självspelande piano” I programmet tävlar kändisarna i par och ställs inför både kreativa och tekniskt krävande utmanar. Det bjuds på allt från fluffiga tårtor och spröda kakor till andra bakverk – och allt sker under hård tidspress. Skillnaden mellan att jobba med kändisdeltagare och andra deltagare är tydlig, enligt henne. Med kändisar liknar det ett ”självspelande piano” där de arbetar i lag och produktionen inte behöver styra lika mycket. \n\nMed andra deltagare kan engagemanget i bakningen vara större, samtidigt som kändisarna kan överraska.\n\n– Dem du tror skiter fullständigt i bakningen kan helt plötsligt briljera. Lärdom av programmet Samtidigt säger hon att hon själv, som kock, inte bakade särskilt mycket från början – men att det förändrades med tiden.\n\n– Helt plötsligt bakade jag kanelbullar, surdegsbrödet och tarte tatin, säger hon.  I årets säsong deltar flera välkända profiler, bland annat idrottare och tv-personligheter som ställs inför helt nya utmaningar i köket. Bland annat dyker förbundskapten i fotboll Janne Andersson och tv-profilen Agneta Sjödin, curlingsyskonen Isabella Wranå och Rasmus Wranå och komikerna Kirsty Armstrong och Branne Pavlovic upp i programmet. \n\nHon säger att sportmänniskor ofta brukar briljera i programmet.\n\n– De är alltid klara i tid och är väldigt bra på att räkna baklänges. Men deras bakverk är inte alltid godast, säger hon. \n\nBakverken bedöms av juryn Camilla Hamid och Bedros Kabranian. Den nya säsongen har premiär i höst.", "link": "https://www.tv4.se/artikel/1jHquEOrjJqwrrtHeZWow6/profilen-tillbaka-i-tv4-programmet", "date_display": "2026-05-12", "date_iso": "2026-05-12T13:00:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/mat", "/personer/tina-nordstrom", "/hela-kandis-sverige-bakar", "/bakning"]}, {"id": 149, "title": "Sentenced for the triple murder in Uppsala", "summary": "Fredric Gülich Brendling gets a life sentence • Two are sentenced for aiding and abetting", "title_original": "Döms för trippelmordet i Uppsala", "summary_original": "Fredric Gülich Brendling får livstids fängelse • Två döms för medhjälp", "link": "https://www.tv4.se/artikel/6w0tRVNmIR7255YpOC5NeW/fredric-guelich-brendling-doems-foer-trippelmordet-i-uppsala", "date_display": "2026-05-12", "date_iso": "2026-05-12T12:01:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 150, "title": "Confirms: Arrested in Tunisia", "summary": "The police after the arrest of the gang leader \"Moewgli\"", "title_original": "Bekräftar: Gripen i Tunisien", "summary_original": "Polisen efter gripandet av gängtoppen ”Moewgli”", "link": "https://www.tv4.se/artikel/uNcIR4YscLlY0oeohJ4WD/polisen-bekraeftar-gaengtopp-inom-foxtrot-gripen-i-tunisien", "date_display": "2026-05-12", "date_iso": "2026-05-12T11:14:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 151, "title": "Putin's new nightmare: Trillions of rubles in deficit - in four months", "summary": "According to the Russian newspaper Kommersant, the budget deficit has already reached 5.9 trillion rubles, despite the Ministry of Finance planning for a deficit of 3.8 trillion rubles for the whole year. This means that the budget has already been exceeded by around 50 percent.  Russia's GDP shrank by 0.5 percent in the first quarter of the year, according to Russia's central bank. High interest rates have hit the country's economy hard after several years of record high interest rates to combat inflation. At the same time, government spending continues to increase. During January until April, expenses rose by over 15 percent compared to the same period last year. Since May 2022, the state no longer reports details of large parts of the budget expenditures, but much points to the fact that the money continues to go to the Russian war fund. Oil gives the Kremlin breathing room Developments in the Middle East also give the Kremlin an important breathing room. The war over Iran has driven up the prices of oil, gas and fertilizers, boosting Russia's export earnings. The US has also temporarily eased certain sanctions against trade in Russian oil, which could mean billions of dollars into the Russian treasury. Starting on Tuesday, Russia is gathering representatives from several Muslim countries in Kazan for the international economic forum \"Russia – the Islamic world\". There, Vladimir Putin hopes to strengthen the country's economic and political ties outside the Western world. - Putin wants to create relations with countries in the Middle East, Africa and Central Asia, both economically and politically. It's about investments, trade and which countries are on Russia's side internationally, says Torbjörn Becker, head of the Eastern European Institute at the School of Economics. The shadow fleet keeps the price up Becker believes that the oil price can be decisive for the Russian economy. - If the price of oil remains above 100 dollars a barrel for a longer period of time, it is a huge source of income for Russia. When the US eased its sanctions, Putin could basically get paid twice as much for oil overnight", "title_original": "Putins nya mardröm: Biljoner rubel i underskott – på fyra månader", "summary_original": "Enligt den ryska tidningen Kommersant har budgetunderskottet redan nått 5,9 biljoner rubel, trots att finansdepartementet planerat för ett underskott på 3,8 biljoner rubel för hela året. Det innebär att budgeten redan överskridits med omkring 50 procent.  Rysslands BNP krympte med 0,5 procent under årets första kvartal, enligt Rysslands centralbank. Höga räntor har slagit hårt ekonomin i landet efter flera år av rekordhöga räntor för att få bukt med inflationen. Samtidigt fortsätter statens utgifter att öka. Under januari fram till april steg utgifterna med över 15 procent jämfört med samma period i fjol. Sedan maj 2022 redovisar staten inte längre detaljer om stora delar av budgetutgifterna, men mycket pekar mot att pengarna fortsatt går till den ryska krigskassan. Oljan ger Kreml andrum Utvecklingen i Mellanöstern ger samtidigt Kreml ett viktigt andrum. Kriget kring Iran har drivit upp priserna på olja, gas och gödningsmedel, vilket stärker Rysslands exportintäkter. USA har dessutom tillfälligt lättat vissa sanktioner mot handel med rysk olja, något som kan innebära miljardbelopp in i den ryska statskassan. Med start under tisdagen samlar Ryssland representanter från flera muslimska länder i Kazan till det internationella ekonomiska forumet ”Ryssland–den islamiska världen”. Där hoppas Vladimir Putin stärka landets ekonomiska och politiska band utanför västvärlden. – Putin vill skapa relationer med länder i Mellanöstern, Afrika och Centralasien, både ekonomiskt och politiskt. Det handlar om investeringar, handel och om vilka länder som står på Rysslands sida internationellt, säger Torbjörn Becker, chef för Östeuropeiska institutet på Handelshögskolan. Skuggflottan håller uppe priset Becker bedömer att oljepriset kan bli avgörande för den ryska ekonomin. – Om oljepriset ligger kvar över 100 dollar fatet under en längre tid är det en enorm intäktskälla för Ryssland. När USA lättade sina sanktioner kunde Putin i princip över en natt få dubbelt så mycket betalt för oljan jämfört med tidigare. Där spelar även den ryska så kallade skuggflottan en viktig roll, enligt Becker. – Skuggflottan är otroligt viktig. Utan den skulle Ryssland fortfarande kunna sälja olja, men till betydligt lägre priser. Skillnaden kan handla om att få 45–50 dollar per fat eller omkring 100 dollar per fat. – Men sanktionerna spelar fortfarande stor roll. Det handlar om att fortsätta hålla trycket uppe mot Ryssland, säger Torbjörn Becker.", "link": "https://www.tv4.se/artikel/3Mv4wjU4Cz6HzmYi4nsveS/putins-nya-mardroem-biljoner-rubel-i-underskott-pa-fyra-manader", "date_display": "2026-05-12", "date_iso": "2026-05-12T10:15:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ryssland", "/sanktioner-mot-ryssland", "/skuggflottan", "/oljepriser", "/ukrainakonflikten"]}, {"id": 152, "title": "Ulf Kristersson to receive Prime Minister of India in Gothenburg", "summary": "On 17 May, Prime Minister Ulf Kristersson will receive Prime Minister of India Narendra Modi in Gothenburg. During the visit, the leaders will hold bilateral meetings and participate in discussions with European business leaders on innovation and trade. Mr Kristersson and Mr Modi will also hold joint press statements, together with President of the European Commission Ursula von der Leyen. HRH The Crown Princess will also participate in the programme.", "title_original": "Ulf Kristersson to receive Prime Minister of India in Gothenburg", "summary_original": "On 17 May, Prime Minister Ulf Kristersson will receive Prime Minister of India Narendra Modi in Gothenburg. During the visit, the leaders will hold bilateral meetings and participate in discussions with European business leaders on innovation and trade. Mr Kristersson and Mr Modi will also hold joint press statements, together with President of the European Commission Ursula von der Leyen. HRH The Crown Princess will also participate in the programme.", "link": "https://www.government.se/press-releases/2026/05/ulf-kristersson-to-receive-prime-minister-of-india-in-gothenburg/", "date_display": "2026-05-12", "date_iso": "2026-05-12T10:15:01+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "Webcast", "EU", "International", "Prime Minister's Office", "Financial markets", "Trade and investment promotion", "Higher education, research and space.", "Foreign and security policy", "Innovation", "Maria Malmer Stenergard", "Ulf Kristersson"]}, {"id": 153, "title": "Quick-roasted salmon with stewed primroses", "summary": "Today's dinner tip offers quick-roasted salmon with stewed vegetables such as beetroot, cauliflower and carrot. A wonderfully good dish where the lightly salted salmon meets creamy stewed vegetables with dill, lemon and horseradish. See Stefan Ekengren's recipe", "title_original": "Snabbrimmad lax med stuvade primörer", "summary_original": "Dagens middagstips bjuder på snabbrimmad lax med stuvade primörer som gulbeta, blomkål och morot. En underbart god rätt där den lätt saltade laxen möter krämigt stuvade grönsaker med dill, citron och pepparrot. Se Stefan Ekengrens recept", "link": "https://www.tv4.se/artikel/5tW3ZIryZn6kOJncsegFxE/snabbrimmad-lax-med-stuvade-primoerer", "date_display": "2026-05-12", "date_iso": "2026-05-12T09:13:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/stefan-ekengren"]}, {"id": 154, "title": "Lennart Lundberg: \"Scrutiny of power in the church has been my focus\"", "summary": "Journalist Lennart Lundberg thinks that newspapers such as Dagen and Kyrkan tiddin have become increasingly important as other media have lost coverage of religion", "title_original": "Lennart Lundberg: ”Granskning av makten i kyrkan har varit mitt fokus”", "summary_original": "Journalisten Lennart Lundberg tycker att tidningar som Dagen och Kyrkans tidning har blivit allt viktigare då övriga medier tappat bevakning av religion", "link": "https://www.dagen.se/familj/lennart-lundberg-granskning-av-makten-i-kyrkan-har-varit-mitt-fokus/10331158", "date_display": "2026-05-12", "date_iso": "2026-05-12T03:00:00+00:00", "source": "Dagen", "
