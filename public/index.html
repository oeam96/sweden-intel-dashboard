Kopsch also criticizes the political rhetoric around the migration issue. He believes that the term \"strict migration policy\" has been misinterpreted. – P", "title_original": "Timbrotoppens kritik: ”Ryckt undan mattan för människor”", "summary_original": "Kopsch menar att den svenska migrationspolitiken har gått från öppenhet och välkomnande till stängda dörrar och att konsekvenserna blivit både inhumana och samhällsekonomiskt skadliga. Han lyfter särskilt utvisningar av arbetskraftsinvandrare och deras barn. – Vi har haft olika typer av lagstiftning som har gjort det möjligt att komma hit. Dels en väldigt fri arbetskraftsinvandring som kom 2008. Vid sidan av det, spårbytet, att den som söker asyl i Sverige men får ett nej, har möjlighet att byta till arbetstillstånd. De här människorna har fått ett löfte och politikerna har varit tydliga med att vi vill att människor ska komma hit och jobba i svenska företag. Sedan har man slopat den lagstiftningen utan övergångsregler som gör det möjligt för dem att stanna kvar.\n\nKopsch har dels rest runt i landet och träffat människor som ska utvisas, dels har han också gjort videor på sociala medier om personer i samma situation. Så föddes själva boken där dessa fall uppmärksammas. ”Klart att folk blir förbannade” I boken föreslår Kopsch en så kallad etableringsamnesti, där spårbytarna ska kunna få permanent uppehållstillstånd. Han menar att det aldrig var meningen att denna grupp skulle drabbas av de nya reglerna. \n\n– Det här är människor som vi vill ha kvar i Sverige. Självklart ska vi inte utvisa dem. Det är jättedåligt för svensk ekonomi och vi kommer inte klara vården om vi utvisar dem, säger Kopsch. \n\nHan säger att han förstår upprördheten hos människor då tonårsutvisningar sker. – Politiker säger: Vi ska utvisa mördare och våldtäktsmän, så läser man i tidningen att här har vi en våldtäktsman som vi inte ska utvisa. Samma dag läser man: Här har vi en 18-årig tjej med bra gymnasiebetyg och en svensk pojkvän, henne ska vi utvisa. Det är klart att folk blir förbannade när man läser sådana saker. ”Aldrig varit lätt att rösta” Kopsch riktar även kritik mot den politiska retoriken kring migrationsfrågan. Han menar att begreppet ”stram migrationspolitik” har tolkats felaktigt. – Politiker har aldrig pratat om att de som har lärt sig svenska, skaffat jobb och försörjt sig själva ska utvisas. Det är inte vad folk förstår med begreppet stram migrationspolitik, säger Kopsch. \n\nKopsch betonar att han håller samma linje som Timbro när det gäller arbetskraftsinvandring och att han har stöd inom organisationen. Han beskriver sig själv som liberal i klassisk bemärkelse, men tycker att det blivit svårare att hitta ett politiskt hem i dagens landskap. \n\n– Det har aldrig varit lätt för mig att rösta. Om Liberalerna skulle skärpa till sig skulle jag kunna tänka mig att rösta på dem, annars kanske Centerpartiet men det där varierar från val till val, säger han. Flyktingfrågan mindre het – fokus på arbetskraft Patrik Öhberg är statsvetare vid SOM-institutet och får frågan hur viktig migrationspolitiken blir för väljarna inför höstens val. Öhberg menar att flyktingfrågan i stort sett är avgjord politiskt. \n\n– Flyktingfrågan var viktig för tio år sedan och den har sjunkit. Alla partier har gått mer åt ett mer restriktivt håll. Nu börjar vi mer och mer prata integration så jag tror inte att just flyktingfrågan kommer att vara särskilt stor, säger han.  Han tror att arbetskraftsinvandring kan bli en fråga i kommande val, men att det troligen handlar om mindre justeringar snarare än en större omläggning.", "link": "https://www.tv4.se/artikel/185zzOcMNYkc7mPIpQoxyf/timbrotoppens-harda-kritik-mot-regeringens-migrationspolitik", "date_display": "2026-02-27", "date_iso": "2026-02-27T06:51:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/timbro", "/svensk-politik", "/migrationspolitik"]}, {"id": 165, "title": "Warns of new pandemic: \"Can't even handle a normal summer\"", "summary": "At the end of 2019, most people heard about covid-19 for the first time. Within months it was seen everywhere. In the grocery store, on public transport, at work. And not least in hospitals worldwide.  \n\n- It was a dizzying time. Equipment that was out of date, that was found in some spare warehouse. There were many colleagues from all professional categories who only worked for a few weeks in intensive care. And immediately it was full of patients who were so unbelievably sick, says Ingrid Stubelius, chief intensive care physician at Sahlgrenska University Hospital. Poor preparedness Six years later, Ingrid Stubelius meets TV4 in ICU at Mölndal hospital to talk about her memories of the pandemic. The situation is very different today than it was then. The staff do not have mouth guards and visors on them.  The department is no longer filled to maximum capacity. The patients are no longer young, otherwise healthy people who need ventilators. A calm prevails. The pandemic is over.\n\nBut according to the Medical Association, it is only a matter of time before the next crisis comes and then they do not believe that our preparedness is sufficient.\n\n- Are we well prepared? We are not, I would say. Today, care cannot cope with an ordinary crisis, cannot even cope with an ordinary summer, perhaps cannot even cope with everyday life every time. We need to be honest and say that healthcare is underfunded and we do a lot of things that maybe we shouldn't have to do. And we need to focus more on the core business, says Hanna Kataoka, second vice-chairman, Swedish Medical Association. Care needs to practice Care and care are, together with the education sector, the industries where the largest proportion feel that they often or always have too high a workload.\n\n- Healthcare personnel need to practice preparedness. As it stands today, much is about solving emergency situations. There is no room for training on preparedness, says Hanna Kataoka. \n\nIngrid Stubelius hopes that preparedness is better than it was before covid-19.\n\n- There are so many points where preparedness broke down during the pandemic. Then hop", "title_original": "Varnar inför ny pandemi: ”Klarar inte ens en vanlig sommar”", "summary_original": "I slutet av 2019 fick de flesta höra covid-19 för första gången. Inom några månader sågs det överallt. I mataffären, i kollektivtrafiken, på jobbet. Och inte minst på sjukhus världen över.  \n\n– Det var en omtumlande tid. Utrustning som var utdaterad, som man hittat i något reservlager. Det var många kollegor från alla yrkeskategorier som bara arbetat några veckor inom intensivvården. Och med en gång blev det fullt med patienter som var så otroligt sjuka, säger Ingrid Stubelius, överläkare intensivvård Sahlgrenska universitetssjukhuset. Dålig beredskap Sex år senare träffar Ingrid Stubelius TV4 på IVA på Mölndals sjukhus för att berätta om sina minnen av pandemin. Läget är idag väldigt annorlunda än det var då. Personalen har inte munskydd och visir på sig.  Avdelningen är inte längre fylld till maxkapacitet. Patienterna är inte längre unga, i övrigt friska människor som behöver respirator. Ett lugn råder. Pandemin är över.\n\nMen enligt Läkarförbundet är det bara en tidsfråga innan nästa kris kommer och då tror de inte att vår beredskap är tillräcklig.\n\n– Är vi väl förberedda? Det är vi inte, skulle jag säga. Idag klarar vården inte en vanlig kris, klarar inte ens en vanlig sommar, klarar kanske inte ens vardagen alla gånger. Vi behöver vara ärliga och säga att sjukvården är underfinansierad och vi gör en hel del saker som vi kanske inte skulle behöva göra. Och vi behöver fokusera mer på kärnverksamheten, säger Hanna Kataoka, andre vice ordförande, Sveriges Läkarförbund. Vården behöver öva Vård och omsorg är tillsammans med utbildningssektorn, de branscher där störst andel känner att de ofta eller alltid har för hög arbetsbelastning.\n\n– Sjukvårdspersonal behöver öva beredskap. Som det ser ut idag handlar mycket om att lösa akuta situationer. Det finns inget utrymme för att träna på beredskap, säger Hanna Kataoka. \n\nIngrid Stubelius hoppas att beredskapen är bättre än vad den var inför covid-19.\n\n– Det finns så många punkter där beredskapen brast under pandemin. Då hoppas man att de lärdomar som vi drog av det finns kvar i organisationen och att man inte upprepar de misstagen.", "link": "https://www.tv4.se/artikel/5RuO1wmsVxbuDQnfG64ior/varnar-infoer-ny-pandemi-klarar-inte-ens-en-vanlig-sommar", "date_display": "2026-02-27", "date_iso": "2026-02-27T05:35:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/inrikes", "/varden", "/pandemi", "/sjukdomar"]}, {"id": 166, "title": "Far too many times I have been forced to intercede unsolicited", "summary": "Frida Park: Don't let caring intercession become spiritual abuse", "title_original": "Alldeles för många gånger har jag påtvingats oönskad förbön", "summary_original": "Frida Park: Låt inte omtänksam förbön bli ett andligt övergrepp", "link": "https://www.dagen.se/ledare/alldeles-foer-manga-ganger-har-jag-patvingats-ooenskad-foerboen/10219291", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 167, "title": "They learn self-defense against unwanted intercession", "summary": "Blind and visually impaired people in Christian environments are exposed to unwanted intercession and healing attempts • Now a \"self-defense course\" is organized in Norway - the issue is also current in Sweden", "title_original": "De lär sig självförsvar mot oönskad förbön", "summary_original": "Blinda och synskadade i kristna miljöer utsätts för oönskad förbön och helande­försök • Nu anordnas ”självförsvarskurs” i Norge – frågan aktuell även i Sverige", "link": "https://www.dagen.se/dokument/de-laer-sig-sjaelvfoersvar-mot-ooenskad-foerboen/10128723", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 168, "title": "The calling is not legitimized by the intensity of the inner experience", "summary": "Even a person with strong longing must be given time to be tested. And where? In the parish where the person has lived and worked for many years, writes Stefan Larsson in a reply.", "title_original": "Kallelsen legitimeras inte av intensiteten i den inre upplevelsen", "summary_original": "Även en person med stark längtan måste få tid att prövas. Och var? I den församling där personen sedan många år har levt och verkat, skriver Stefan Larsson i en replik.", "link": "https://www.dagen.se/debatt/kallelsen-legitimeras-inte-av-intensiteten-i-den-inre-upplevelsen/10217658", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 169, "title": "Learn from Idol and TV4: Broaden the range of music and song in the church", "summary": "The hymn has its place, but cannot be our only musical language if we want to reach the Swedish people, writes Jard Samuelson.", "title_original": "Lär av Idol och TV4: Bredda musik- och sångutbudet i kyrkan", "summary_original": "Lovsången har sin plats, men kan inte vara vårt enda musikaliska språk om vi vill nå det svenska folket, skriver Jard Samuelson.", "link": "https://www.dagen.se/debatt/laer-av-idol-och-tv4-bredda-musik-och-sangutbudet-i-kyrkan/10180839", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 170, "title": "Notification of Pingst directors delay - want to present the whole team at the same time", "summary": "The nomination committee's and Pentecostal board's proposals are pushed forward somewhat.", "title_original": "Besked om Pingst-föreståndare dröjer – vill presentera hela teamet samtidigt", "summary_original": "Valberedningens och Pingststyrelsens förslag skjuts framåt något.", "link": "https://www.dagen.se/nyheter/besked-om-pingst-foerestandare-droejer-vill-presentera-hela-teamet-samtidigt/10222617", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 171, "title": "She can become our friend in pain", "summary": "Malina Abrahamsson advises on the best books she has read lately", "title_original": "Hon kan bli vår vän i smärtan", "summary_original": "Malina Abrahamsson tipsar om de bästa böckerna hon läst på sistone", "link": "https://www.dagen.se/kultur/hon-kan-bli-var-vaen-i-smaertan/10218095", "date_display": "2026-02-27", "date_iso": "2026-02-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 172, "title": "Taking customers to court - could play with empty accounts", "summary": "It was on the morning of May 13 last year that something went wrong on ATG Casino's website when a security lock was triggered. Suddenly, games could be played without money in the account and customers with zero kroner in the balance could withdraw winnings via Swish.  Word of the bug quickly spread on social media and players rushed to the platform. Now ATG collects money from players in district courts and via the Kronofogden, after the so-called \"bug day\".  - We had a technical problem which meant that customers could withdraw money they were not entitled to. Quite quickly we fixed it, shut down the error, and then we ended up in the situation we are in now, says Jan Sonnevi.  In the last month alone, the company has won or settled over 20 civil cases linked to the incident. - They got several chances to pay. We sent reminders, but in the end we had to send them on to the Norwegian Kronofogdemyndigheten, says Jan Sonnevi, casino manager at ATG.  In total, ATG has upwards of 300 claim cases in court from last year and this year, although it is not confirmed that all of them concern the bug.  Turnover increased fivefold On May 16, ATG sent refunds to players who received winnings paid out without coverage. According to reports that TV4 has seen, the turnover on that day was fivefold compared to a normal day. The same judgments also show that the number of new players was 24 times higher. - They know what they are doing, it is money they are not entitled to, but they try to take it anyway, says Julia Axelsson, contract law lawyer.  Hope for a solution There are still a large number of claims that have not yet gone to court. Exactly when the process is over is difficult to say. - We of course hope that it will be resolved as soon as possible. We have no intention or desire to pursue a process against our customers, we want to move on, so I hope it ends as soon as possible, says Jan Sonnevi.", "title_original": "Tar kunder till rätten – kunde spela med tomma konton", "summary_original": "Det var på morgonen den 13 maj i fjol som något gick fel på ATG Casinos hemsida när en säkerhetsspärr slogs ut. Plötsligt kunde spel genomföras utan pengar på kontot och kunder med noll kronor i saldo tog ut vinster via Swish.  Ryktet om felet spreds snabbt på sociala medier och spelare rusade till plattformen. Nu driver ATG in pengar från spelare i tingsrätter och via Kronofogden, efter den så kallade ”buggdagen”.  – Vi hade ett tekniskt problem som gjorde att kunder kunde få ut pengar de inte hade rätt till. Ganska snabbt åtgärdade vi det, stängde ned felet, och sedan hamnade vi i den situationen som vi är i nu, säger Jan Sonnevi.  Bara den senaste månaden har bolaget vunnit eller förlikat över 20 civilmål kopplade till händelsen. – De fick flera chanser att betala. Vi skickade påminnelser men till slut fick vi skicka dem vidare till Kronofogdemyndigheten, säger Jan Sonnevi, casinochef på ATG.  Totalt har ATG uppemot 300 fordringsärenden i domstol från i fjol och i år, även om det inte är bekräftat att alla berör buggen.  Femdubblades omsättningen Den 16 maj skickade ATG återkrav till spelare som fått vinster utbetalda utan täckning. Enligt domar som TV4 tagit del av femdubblades omsättningen den dagen jämfört med en vanlig dag. Samma domar visar också att antalet nya spelare var 24 gånger högre. – De vet vad de håller på med, det är pengar de inte har rätt till men de försöker ta dem ändå, säger Julia Axelsson, avtalsrättsjurist.  Hoppas på lösning Det är fortfarande ett stort antal fordringsärenden som ännu inte gått upp i domstol. Exakt när processen är över är svårt att säga. – Vi hoppas såklart att det löser sig så fort som möjligt. Vi har ingen avsikt eller vilja att driva process mot våra kunder, vi vill komma vidare så jag hoppas att det tar slut så fort som möjligt, säger Jan Sonnevi.", "link": "https://www.tv4.se/artikel/5Y0jijSBWAbHUceTuimxH/har-tagit-maengder-av-kunder-till-raetten-efter-buggdagen", "date_display": "2026-02-26", "date_iso": "2026-02-26T21:43:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/inrikes", "/atg", "/spel"]}, {"id": 173, "title": "The sisters were deported to Iran alone – the family is allowed to stay", "summary": "Among the last to be forced away - before the stop: \"We have lost our life\"", "title_original": "Systrarna utvisades ensamma till Iran – familjen får stanna", "summary_original": "Bland de sista att tvingas iväg – innan stoppet: ”Vi har förlorat vårt liv”", "link": "https://www.tv4.se/artikel/6vDx0Ch0w8uxOs2HZ0KbCF/systrarna-utvisades-ensamma-till-iran-familjen-far-stanna", "date_display": "2026-02-26", "date_iso": "2026-02-26T21:40:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 174, "title": "Swedes were recruited into the Nazi killer cult", "summary": "A man in his 20s was arrested on Friday on suspicion of participation in a terrorist organization and damage connected to Sweden's security.  Now the newspaper Expo can reveal that the man was the driving force in building up a Swedish branch of the online violent group Maniac Murder Cult (MKU), and recruited members.  The man was arrested and detained on Wednesday. He had then been active in the environments since at least November 6 last year, according to the prosecutor. He has previously been suspected of damage connected to Sweden's security.  Recruitment via social media According to Expo's review, the 20-year-old allegedly ran a TikTok account with the aim of recruiting for a Swedish MKU cell. \n\nThe account is said to have commented on posts from Nordic Resistance Movement activists to profile MKU as action-oriented, writes Expo. Interested parties must then have been forwarded to encrypted chats in Signal and to groups on Telegram.  Expo states that the newspaper had access to parts of the cell's encrypted chats, where a Swedish administrator account is said to have spread violent propaganda, Nazism and terror manuals. In November 2025, the administrator wrote: \"Some of you in this chat owe us blood. You know who you are and I'm waiting,\" according to Expo. The cell states that it is located in five Swedish municipalities. Is singled out as the leader Michail Chkhikvishvili has been singled out as MKU's leader, writes Expo. On New Year's Eve 2023, he planned a mass murder of Jewish children in New York by having a member dress up as Santa and hand out poisoned candy. The plan was stopped by the FBI. He was arrested in 2024 and extradited to the United States in 2025, where he faces up to 40 years in prison. \"The outstanding investigative work in this case saved countless lives and underscores the crucial behind-the-scenes activity of our federal law enforcement agents,\" Attorney General Pamela Bondi said at the time of the arrest. MKU was founded around 2018 in Ukraine by Yegor Krasnov, according to Expo. The head of the preliminary investigation, chamber prosecutor Lars Hedvall, ha", "title_original": "Man rekryterade svenskar till nazistisk mördarkult", "summary_original": "En man i 20-årsåldern häktades under fredagen misstänkt för deltagande i terroristorganisation och skadegörelse kopplat till Sveriges säkerhet.  Nu kan tidningen Expo avslöja att mannen varit drivande i att bygga upp en svensk gren av den nätbaserade våldsgruppen Maniac Murder Cult (MKU), och rekryterat medlemmar.  Mannen greps och anhölls i onsdags. Han hade då varit aktiv i miljöerna sedan åtminstone den 6 november i fjol, enligt åklagaren. Han är sedan tidigare misstänkt för skadegörelse kopplat till Sveriges säkerhet.  Rekrytering via sociala medier Enligt Expos granskning ska 20-åringen ha drivit ett TikTok-konto i syfte att rekrytera till en svensk MKU-cell. \n\nKontot ska ha kommenterat inlägg från Nordiska motståndsrörelsens aktivister för att profilera MKU som handlingsinriktad, skriver Expo. Intresserade ska därefter ha slussats vidare till krypterade chattar i Signal och till grupper på Telegram.  Expo uppger att tidningen haft insyn i delar av cellens krypterade chattar, där ett svenskt administratörskonto ska ha spridit våldspropaganda, nazism och terrormanualer. I november 2025 skrev administratören: \"Några av er i den här chatten är skyldiga oss blod. Ni vet vilka ni är och jag väntar\", enligt Expo. Cellen uppger att den finns i fem svenska kommuner. Pekas ut som ledaren Michail Chkhikvishvili har pekats ut som MKU:s ledare, skriver Expo. På nyårsafton 2023 planerade han ett massmord på judiska barn i New York genom att få en medlem att klä ut sig till tomte och dela ut godis med gift. Planen stoppades av FBI. Han greps 2024 och utlämnades till USA 2025, där han riskerar upp till 40 års fängelse. ”Det enastående utredningsarbetet i det här fallet räddade otaliga liv och understryker den avgörande aktiviteten bakom kulisserna hos våra federala brottsbekämpande agenter”, sade justitieminister Pamela Bondi då i samband med gripandet. MKU grundades omkring 2018 i Ukraina av Jegor Krasnov, enligt Expo. Förundersökningsledaren, kammaråklagare Lars Hedvall, har inte velat kommentera ärendet närmare.", "link": "https://www.tv4.se/artikel/31KXWZgOWjzRNDZN0RC280/man-rekryterade-svenskar-till-internationell-moerdarkult", "date_display": "2026-02-26", "date_iso": "2026-02-26T18:16:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/inrikes", "/nazister", "/nazism", "/brott", "/sapo", "/hogerextremism"]}, {"id": 175, "title": "The Swedish Migration Agency fights back: It's about a smaller amount", "summary": "The director general responds to criticism after high-profile expulsions", "title_original": "Migrationsverket slår tillbaka: Handlar om en mindre mängd", "summary_original": "Generaldirektören bemöter kritiken efter uppmärksammade utvisningar", "link": "https://www.tv4.se/artikel/4UhrtDKm8PCa5UQwPxpOs0/migrationsverket-slar-tillbaka-handlar-om-en-mindre-maengd", "date_display": "2026-02-26", "date_iso": "2026-02-26T15:50:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna"]}, {"id": 176, "title": "Despite tributes – the Riksdag said no to increased support for the church's cultural heritage", "summary": "Rhetoric is cheap, which was noticed when the question of increased financial support for the church's cultural heritage came up in the Riksdag - all concrete proposals were voted down", "title_original": "Trots hyllningar – riksdagen sa nej till ökat stöd till det kyrkliga kulturarvet", "summary_original": "Retorik är billigt, vilket märktes när frågan om ökat ekonomiskt stöd till stenergard-to-present-2026-statement-of-foreign-policy/", "date_display": "2026-02-17", "date_iso": "2026-02-17T05:00:22+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "12 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
