ingar samtidigt som statsskulden växer och inflationen stiger. Före- och efterbilder på den ikoniska byggnaden får nu kritiker att gå i taket.", "link": "https://www.dn.se/varlden/karl-dalen-bilden-har-blivit-en-symbol-for-trumps-usa/", "date_display": "2026-05-30", "date_iso": "2026-05-30T19:20:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "After penalties: PSG takes home the Champions League", "summary": "The acknowledgment led to tears and roars in the stands. Paris SG's Champions League final penalty win against Arsenal? Euphoria everywhere.", "title_original": "Efter straffar: PSG tar hem Champions League", "summary_original": "Kvitteringen ledde till tårar och vrål på läktaren. Paris SG:s straffseger i Champions League-finalen mot Arsenal? Eufori överallt.", "link": "https://www.svd.se/a/Wv7A02/drama-i-budapest-psg-forsvarade-cl-titeln", "date_display": "2026-05-30", "date_iso": "2026-05-30T19:16:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 124, "title": "PSG defended the Champions League title", "summary": "The acknowledgment led to tears and roars in the stands. Paris SG's Champions League final penalty win against Arsenal? Euphoria everywhere.", "title_original": "PSG försvarade Champions League-titeln", "summary_original": "Kvitteringen ledde till tårar och vrål på läktaren. Paris SG:s straffseger i Champions League-finalen mot Arsenal? Eufori överallt.", "link": "https://www.dn.se/sport/psg-forsvarade-champions-league-titeln/", "date_display": "2026-05-30", "date_iso": "2026-05-30T19:15:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "PSG vinner Champions League", "summary": "", "title_original": "PSG vinner Champions League", "summary_original": "", "link": "https://www.svd.se/a/ArEMPM/psg-vinner-champions-league", "date_display": "2026-05-30", "date_iso": "2026-05-30T19:07:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 126, "title": "Now - despite everything - lovely summer is approaching", "summary": "The hymn \"Den blomstertid nu kommer\" appears as a quiet hymn to the richness of nature. But behind its bright surface hides the experience of a time when stunting and hunger were constant companions.", "title_original": "Nu nalkas – trots allt – ljuvlig sommar", "summary_original": "Psalmen ”Den blomstertid nu kommer” framstår som en stillsam lovsång till naturens rikedom. Men bakom dess ljusa yta döljer sig erfarenheten av en tid då missväxt och hunger var ständiga följeslagare.", "link": "https://www.svd.se/a/2pP8Ra/nu-nalkas-trots-allt-ljuvlig-sommar", "date_display": "2026-05-30", "date_iso": "2026-05-30T18:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 127, "title": "M wants to simplify conversion of tenancies", "summary": "The moderates want more people to be able to own their own apartment. During Järva week, the proposal called \"right to buy\" is presented.", "title_original": "M vill förenkla ombildning av hyresrätter", "summary_original": "Moderaterna vill att fler ska kunna äga sin lägenhet. Under Järvaveckan presenteras förslaget som kallas ”rätt att köpa”.", "link": "https://www.sydsvenskan.se/sverige/m-vill-forenkla-ombildning-av-hyresratter/", "date_display": "2026-05-30", "date_iso": "2026-05-30T18:29:39+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Customs: Dog smuggling to Sweden has basically stopped", "summary": "During the corona pandemic, the demand for puppies skyrocketed, which led to a sharp increase in dog smuggling to Sweden. The climax was reached in 2022, when the Customs Service stopped a record number of smuggled dogs.  Now the trend has turned. According to the Swedish Customs Service, organized dog smuggling has decreased sharply and is now basically gone. Stefan Granath, deputy head of department at the Swedish Customs Service, welcomes the announcement.  - Our officials are used to seeing very strange and troublesome things, but most say that this with puppies is the worst thing you can experience, he says.  The problems that remain In 2020, 280 dogs were stopped by customs. The following year, the figure had risen to 523, and in 2022 the record level was reached with 552 smuggled dogs. Stefan Granath remembers certain cases that made an especially strong impression.  - They brought in ten to 15 dogs at a time and just put them in the back seat of a car, under the driver's seat or in suitcases. Very macabre way where they didn't care in the slightest about the animal, but it was only about money, he says.  - It was not fun to have to euthanize 15 little puppies that had obviously been hurt, together with district veterinarians.  Last year, the figure was back at 280 – and now the large-scale trade is said to have ceased. Stefan Granath, on the other hand, believes that many people still make mistakes when they import dogs to Sweden.  More dogs are born in Sweden At the same time, a new survey from the Swedish Kennel Club shows that 91 percent of all dogs in Sweden are born here. In the corresponding survey from 2024, the figure was 87 percent. According to the Swedish Kennel Club, there are several explanations for this. - In part, demand has decreased after the pandemic - that is a big reason. But I also think that the fact that we started talking about the illegality of this handling and that it was raised more has had an impact, says press officer Janina Pfalzer. - Then there will also be legislation. Some have probably picked up on the fact that soon it may be the case that the vet can report me if I h", "title_original": "Tullen: Hundsmugglingen till Sverige har i princip upphört", "summary_original": "Under coronapandemin sköt efterfrågan på hundvalpar i höjden, vilket ledde till en kraftig ökning av hundsmugglingen till Sverige. Kulmen nåddes 2022, då Tullverket stoppade rekordmånga smuggelhundar.  Nu har utvecklingen vänt. Enligt Tullverket har den organiserade hundsmugglingen minskat kraftigt och är i dag i princip borta. Stefan Granath, biträdande avdelningschef på Tullverket, välkomnar beskedet.  – Våra tjänstemän är vana att se mycket konstiga och jobbiga saker, men de flesta säger att det här med hundvalpar är det värsta man får uppleva, säger han.  Problemen som finns kvar  År 2020 stoppades 280 hundar av tullen. Året därpå hade siffran stigit till 523, och 2022 nåddes rekordnivån med 552 smuggelhundar. Stefan Granath minns vissa fall som gjorde extra starkt intryck.  – Man tog in tio till 15 hundar åt gången och bara stoppade in dem i baksätet på en bil, under förarsätet eller i resväskor. Väldigt makabra sätt där man inte brydde sig det minsta om djuret, utan det var bara pengar det handlade om, säger han.  – Det var inte roligt att tillsammans med distriktsveterinärer behöva avliva 15 små små hundvalpar som uppenbarligen hade farit illa.  Förra året var siffran tillbaka på 280 – och nu uppges den storskaliga handeln ha upphört. Stefan Granath menar däremot att många fortfarande gör fel när de importerar hundar till Sverige.  Fler hundar föds i Sverige  Samtidigt visar en ny undersökning från Svenska Kennelklubben att 91 procent av alla hundar i Sverige är födda här. I motsvarande undersökning från 2024 var siffran 87 procent. Enligt Svenska Kennelklubben finns flera förklaringar till detta. – Dels har efterfrågan gått ner efter pandemin – det är en stor anledning. Men jag tror också att det faktum att vi började prata om det olagliga i den här hanteringen och att det lyftes mer har påverkat, säger pressansvarig Janina Pfalzer. – Sen kommer ju också lagstiftning. Några har nog snappat upp att snart kan det vara så att veterinären kan anmäla mig om jag har köpt min hund utomlands. Faror med smuggelhundar Antalet avlivade smuggelhundar har också minskat kraftigt. Förra året avlivades tre hundar som stoppades av Tullverket. Under både 2020 och 2021 var motsvarande siffra 86. Veterinären Marie Jury varnar samtidigt för farorna med smuggelhundar. – Dels far valparna illa på vägen hit. Sen kan de bära på sjukdomar som inte finns i Sverige och som kan ha dödlig utgång. Det är inte alls bra, varken för djuren eller för oss människor, säger hon.", "link": "https://www.tv4.se/artikel/qCUKSWxu6P0MVwdZLTi70/tullen-hundsmugglingen-till-sverige-har-i-princip-upphoert", "date_display": "2026-05-30", "date_iso": "2026-05-30T17:59:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/tullen", "/djur", "/brott", "/tullverket"]}, {"id": 129, "title": "Breast cancer patients can avoid chemotherapy", "summary": "Millions of women with breast cancer could avoid chemotherapy thanks to a ground-breaking test. This is according to results from a study that could provide changed guidelines for cancer care in the world, say experts.", "title_original": "Bröstcancerpatienter kan slippa cellgifter", "summary_original": "Miljontals kvinnor med bröstcancer skulle kunna slippa cellgiftsbehandling tack vare ett banbrytande test. Detta enligt resultat från en studie som kan ge förändrade riktlinjer för cancervård i världen, säger experter.", "link": "https://www.svd.se/a/d4L8eX/brostcancerpatienter-kan-slippa-cellgifter-ett-test-avgor", "date_display": "2026-05-30", "date_iso": "2026-05-30T17:54:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 130, "title": "The food Swedes want to serve - after death", "summary": "Have you ever thought about what you want to serve after your funeral? When Swedes are asked the question, tradition wins - but everyday favorites are also mentioned. \"You really have to dare to think personally,\" says undertaker Conny Sohlberg.", "title_original": "Maten svenskar vill servera – efter döden", "summary_original": "Har du någon gång funderat över vad du vill servera efter din begravning? När svenskar får frågan segrar traditionen – men även vardagsfavoriter nämns. ”Man ska verkligen våga tänka personligt”, säger begravningsentreprenören Conny Sohlberg.", "link": "https://www.svd.se/a/BxG8p9/smorgastarta-den-ododliga-favoriten-pa-minnestunden", "date_display": "2026-05-30", "date_iso": "2026-05-30T17:54:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 131, "title": "The million-dollar building in Varnhem is now inaugurated: \"Historically unique\"", "summary": "Recreated an organ from the 17th century • A local build • The tone is described as \"velvet\"", "title_original": "Nu invigs miljonbygget i Varnhem: ”Historiskt unikt”", "summary_original": "Återskapat en orgel från 1600-talet • Ett lokalt bygge • Tonen beskrivs som ”sammet”", "link": "https://www.dagen.se/nyheter/nu-invigs-miljonbygget-i-varnhem-historiskt-unikt/10371332", "date_display": "2026-05-30", "date_iso": "2026-05-30T14:01:14+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Stuck in the subway chaos for over three hours - evacuated in the tunnels", "summary": "There are major disruptions in subway traffic in Stockholm with major delays and several canceled departures. Above all, the metro's red line is affected. The stop due to a carriage fault affects Stadion, Karlaplan and Östermalmstorg in the direction of Fruängen and Norsborg. Passengers aboard the broken train were stuck for over three hours in the subway. - People are in good spirits, even though it's insanely hot. People sit on the floor, they wave caps, signs and whatever is nearby to receive the heat, a passenger told TV4 Nyheterna from the train. \"Poor oxygen\" There was initially no forecast for when the error could be rectified. However, the passengers were informed that the subway would be evacuated. - There is most concern for the elderly and smaller children because oxygen is starting to get poor. You haven't equipped yourself with water and food to sit here for 1.5 hours. Would have liked more information, says another passenger, Martina Ulenius.  The train chaos takes place at the same time as the Stockholm Marathon, with almost 25,000 entries, is taking place in central parts of the city. In the afternoon, AIK played against Sirius at Strawberry arena, which is expected to further increase the pressure on public transport. Evacuated after over three hours At 4pm the train could finally be evacuated, by which time the passengers on board had been stuck for over three hours. The police were also on site with a patrol to assist SL in the evacuation, which apparently went smoothly. - It has gone well. Actually, the way we want it to happen at an event like this, printed, safe and calm. Then it is clear that people were tired, thirsty and hot, but the picture we have is that the vast majority have been in good spirits, says Aleksander Krajisnik, at SL's press call. In pictures from the scene, travelers, including children, can be seen walking along the subway tracks, then arriving at the station at Östermalmstorg where they were received by security guards. Forecast still unclear SL is now ready to transport the wagon away. - From what I understand, we are prepared", "title_original": "Fast i tunnelbanekaoset i över tre timmar – evakueras i tunnlarna", "summary_original": "Det är stora störningar i tunnelbanetrafiken i Stockholm med stora förseningar och flera inställda avgångar. Framför allt påverkas tunnelbanans röda linje. Stoppen som beror på ett vagnfel berör Stadion, Karlaplan och Östermalmstorg i riktning mot Fruängen och Norsborg. Passagerare ombord det trasiga tåget satt fast i över tre timmar i tunnelbanan. – Folk är vid gott mod trots att det är sjukt varmt. Folk sitter på golvet, det viftas med kepsar, skyltar och vad som finns i närheten för att motta värmen, meddelade en passagerare TV4 Nyheterna från tåget. ”Dåligt med syre” Det fanns initialt ingen prognos för när felet kunde vara avhjälpt. Passagerarna nåddes dock av beskedet att tunnelbanan skulle evakueras. – Det är mest oro för äldre och mindre barn för det börjar bli dåligt med syre. Man har inte rustat med vatten och mat för att sitta här i 1,5 timme. Hade velat ha mer information, säger en annan passagerare, Martina Ulenius.  Tågkaoset sker samtidigt som Stockholm Marathon, med nästan 25 000 anmälda, pågår i centrala delar av staden. På eftermiddagen spelade AIK mot Sirius på Strawberry arena, vilket väntas öka trycket på kollektivtrafiken ytterligare. Evakuerades efter över tre timmar Vid 16-tiden kunde tåget till slut evakueras, då hade resenärerna ombord suttit fast i över tre timmar. Även polisen fanns på plats med en patrull för att bistå SL i evakueringen, som ska ha gått lugnt till. – Det har gått bra. Egentligen så som vi önskar att det ska gå till vid en sådan här händelse, tryckt, säkert och lugnt. Sen är det klart att människor varit trötta, törstiga och varma men den bilden vi har är att de allra flesta har varit vid gott mod, säger Aleksander Krajisnik, på SL:s pressjour. På bilder från platsen kan resenärer, däribland barn, ses gå längs med tunnelbanespåren, för att sedan komma fram till stationen vid Östermalmstorg där de togs emot av väktare. Fortsatt oklar prognos SL står nu redo att transportera bort vagnen. – Vad jag förstår så står vi beredda att bogsera bort den felande vagnen till närmaste depå för att där påbörja en besiktning och felsökning för att försöka reda ut vad det är som felar, säger Aleksander Krajisnik. Det är oklart hur många som omfattats av felet och suttit fast ombord. Vid 17.30-tiden var trafiken igång igen. Fortsatta förseningar och inställda avgångar är dock att vänta, meddelar SL på sin hemsida.", "link": "https://www.tv4.se/artikel/2o9vmFjAUIGaJhTQkCM7Xk/tunnelbanekaos-i-stockholm", "date_display": "2026-05-30", "date_iso": "2026-05-30T12:22:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/tunnelbana", "/stockholm", "/kollektivtrafik"]}, {"id": 133, "title": "He wins the Stockholm Marathon - in his debut: \"Very happy\"", "summary": "Compatriot Luke Kiprop came second, just over a minute behind Kiptoo in 2.11.53. Third was Gezu Anbese Desu, Ethiopia, with a time of 2.13.31. For a long time it looked like Kiptoo would beat the course record for the Stockholm Marathon, but the last bit was too tough and the Kenyan missed the record by 36 seconds. - I am very happy. I will come back next year, says Kiptoo. The course record is held by Nigussie Sahlesilassie, Ethiopia, who in 2019 ran 2.10.10. Double Kenya SM gold on the men's side was won by Ebba Tulu Chala, Hässelby SK, with a time of 2.17.26. It is the 29-year-old's sixth SM gold in the marathon, the last was in 2024. He was seventh overall. On the women's side, there were five runners who stayed in the lead for a long time. In the final stage, however, Rebeca Chesir, Kenya, was able to pull away and won the women's class in a time of 2.30.58, even though she almost ran wrong just a couple of minutes from Stockholm's stadium. - The race was tough, I didn't think I would win. The audience cheered very well, there were many out there, says Chesir. Wikström SM gold Second was Sintayehu Lewetegn, Ethiopia, in 2.31.06, and compatriot Hiwot Mehari was third when she ran 15 seconds slower. Carolina Wikström took the women's SM gold in 2.34.06 and was eighth overall. The 32-year-old, who had a baby last year and ran her first marathon in two years, takes today's victory to her sixth SM gold in the marathon. - I liked the course, I am happy and satisfied, says Wikström.", "title_original": "Han vinner Stockholm Marathon – i debuten: ”Väldigt glad”", "summary_original": "Tvåa blev landsmannen Luke Kiprop, dryga minuten bakom Kiptoo på 2.11.53. Trea blev Gezu Anbese Desu, Etiopien, med tiden 2.13.31. Det såg länge ut som att Kiptoo skulle slå banrekordet för Stockholm Marathon, men den sista biten blev för tuff och kenyanen missade rekordet med 36 sekunder. – Jag är väldigt glad. Jag kommer komma tillbaka nästa år, säger Kiptoo. Banrekordet innehas av Nigussie Sahlesilassie, Etiopien, som 2019 sprang på 2.10.10. Dubbelt Kenya SM-guldet på herrsidan vann Ebba Tulu Chala, Hässelby SK, med tiden 2.17.26. Det är 29-åringens sjätte SM-guld i maraton, senast var 2024. Han blev sjua totalt. På damsidan var de länge fem löpare som höll ihop i täten. På sluttampen kunde Rebeca Chesir, Kenya, dock dra ifrån och vann damklassen på tiden 2.30.58, trots att hon nästan sprang fel bara ett par minuter från Stockholms stadion. – Loppet var tufft, jag trodde inte att jag skulle vinna. Publiken hejade på väldigt bra, det var många där ute, säger Chesir. Wikström SM-guld Tvåa blev Sintayehu Lewetegn, Etiopien, på 2.31.06, och landsmaninnan Hiwot Mehari blev trea när hon sprang 15 sekunder långsammare. Carolina Wikström tog damernas SM-guld på 2.34.06 och blev åtta totalt. 32-åringen, som fick barn förra året och sprang sitt första maraton på två år, tar i och med dagens seger sitt sjätte SM-guld i maraton. – Jag gillade banan, jag är glad och nöjd, säger Wikström.", "link": "https://www.tv4.se/artikel/tt-260530-maranresultat1-c6cf25d0/vinner-maraton-i-debuten-valdigt-glad", "date_display": "2026-05-30", "date_iso": "2026-05-30T12:12:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/kenya", "/friidrott", "/etiopien", "/stockholm-marathon"]}, {"id": 134, "title": "Convicts with foot shackles must live in hotels - politicians in protest", "summary": "The country's prisons and detention centers are heavily overburdened, and the Correctional Service now needs to expand operations properly. Therefore, controlled accommodation will soon be established - a new form of accommodation for convicts with foot shackles, who do not have the opportunity to serve their sentence at home.  The hotel Part-Time Home in Täby north of Stockholm is planned to be the first accommodation of this kind. One of the reasons is the good communication opportunities in the area, reports Tidningen Mitt i. - Those who are placed in controlled housing must have some form of employment, primarily a job, internship or studies that they have arranged themselves. Alternatively, the Correctional Service can arrange employment, says Emma Ekstrand, director of the department for operational content, in a press release.  Opposition from politicians At the same time, the plans are met with opposition from local politicians - as the hotel is close to a school, preschool and sports facilities.  All group leaders in the Täbyalliansen have therefore signed a letter demanding that the Correctional Service choose another location for the operation.  - This type of accommodation should not be placed in direct connection with the everyday life of small children, says Erik Andersson (M), the chairman of the municipal board, to the newspaper Mitt i. \"All convicts become someone's neighbor - sooner or later\" However, the Correctional Service believes that their activities usually do not disturb the surroundings. The authority also emphasizes that the clients undergo risk and suitability assessments, and that those who misbehave may instead serve their sentence in prison.  - For the Correctional Service, it will be very important that the controlled accommodation works well and that those who live there do not disturb their surroundings, says Emma Ekstrand.  She also highlights that the form of accommodation can facilitate reintegration into society. - It is important to remember that in principle all convicts sooner or later must be reintegrated and become someone's neighbor. Carrying out sentences in controlled housing has been made possible by a new law that comes into force on Monday.", "title_original": "Dömda med fotboja ska bo på hotell – politiker i protest", "summary_original": "Landets fängelser och häkten är hårt belastade och Kriminalvården behöver nu bygga ut verksamheten ordentligt. Därför etableras snart kontrollerade boenden – en ny boendeform för dömda med fotboja, som saknar möjlighet att avtjäna straffet hemma.  Hotellet Part-Time Home i Täby norr om Stockholm planeras bli det första boendet av detta slag. En av anledningarna är de goda kommunikationsmöjligheterna i området, rapporterar Tidningen Mitt i. – De som är placerade på ett kontrollerat boende ska ha någon form av sysselsättning, i första hand ett arbete, praktik eller studier som de själva ordnat. I andra hand kan Kriminalvården ordna en sysselsättning, säger Emma Ekstrand, direktör för avdelningen för verksamhetsinnehåll, i ett pressmeddelande.  Motstånd från politiker Planerna möts samtidigt av motstånd från lokala politiker – då hotellet ligger i närheten av skola, förskola och idrottsanläggningar.  Samtliga gruppledare i Täbyalliansen har därför skrivit under ett brev där de kräver att Kriminalvården väljer en annan plats för verksamheten.  – Den här typen av boende bör inte placeras i direkt anslutning till små barns vardag, säger Erik Andersson (M), kommunstyrelsens ordförande, till Tidningen Mitt i. ”Alla dömda blir någons granne – förr eller senare” Kriminalvården menar däremot att deras verksamheter oftast inte stör omgivningen. Myndigheten framhåller också att klienterna genomgår risk- och lämplighetsbedömningar, och att den som missköter sig i stället får avtjäna sitt straff i fängelse.  – För Kriminalvården kommer det att vara mycket viktigt att det kontrollerade boendet fungerar väl och att de som bor där inte stör sin omgivning, säger Emma Ekstrand.  Hon lyfter också att boendeformen kan underlätta återintegreringen i samhället. – Det är viktigt att komma ihåg att i princip alla dömda förr eller senare ska återintegreras och bli någons granne. Att verkställa straff i kontrollerat boende har möjliggjorts genom en ny lag som träder i kraft på måndag.", "link": "https://www.tv4.se/artikel/3mpfOsEiGoA2WtAT5SA37E/doemda-med-fotboja-ska-bo-pa-hotell-moets-av-kritik", "date_display": "2026-05-30", "date_iso": "2026-05-30T11:30:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/stockholm", "/kriminalvarden", "/regeringen"]}, {"id": 135, "title": "This is how you travel with a dog - you should think about that before your holiday", "summary": "There are some new rules to comply with if your dog is going on a trip - including new dog passports. You should read up on what is required well in advance of the trip on the Swedish Agricultural Agency's website, says veterinarian Marie Jury. - Among other things, you must be able to prove that you are permanently resident in Sweden. You can do that with identity cards and a few other things, and then they must be microchipped with an approved chip, she says. If you are going out in Europe, you also need a rabies vaccination. - It must be completed at least 21 days before you can travel. Or you decide that it is best for the dog to be at home, and then planning for a dog sitter or dog kennel is also required. Get the dog used to traveling by car It is also a good idea to gradually get your puppy or dog used to traveling by car. - You can start by getting them used to the cage itself. It is good to have a safe, approved and crash-tested cage with a harness that can be attached to the seat belt, says Marie Jury. Puppies in particular also have an easier time getting sick.  - Short trips are absolutely preferable. It is also good not to feed them right before you leave. It can increase the risk that they actually feel ill. Rest the dog often There are minimum requirements on Jordbruket's website for how often you should take breaks if you take your dog on a car journey. - I think the requirement is that they must rest at least every six hours. But puppies need a break much more often. It is also important to remember not to leave the dog in the car. - Unfortunately, this can have a fatal outcome, says Marie Jury. You can break the window of the car. It is also not enough to open the sunroof or the window a little. - It's almost like opening the door to the oven. You are still in the oven. If you see a dog in a car, you can break the window - but you must be prepared to be held accountable for it. - My advice is to call the police and get their help so that they can guide you through the various steps to what to do if you suspect that a dog is ill in a hot car. The cabin or the hold of the flight?", "title_original": "Så reser du med hund – det ska du tänka på inför semestern", "summary_original": "Det finns en del nya regler att förhålla sig till om din hund ska med på resa – bland annat nya hundpass. Man bör läsa på vad som krävs i god tid innan resan på Jordbruksverkets hemsida, tycker veterinär Marie Jury. – Man ska bland annat kunna bevisa att man är stadigvarande bosatt i Sverige. Det kan man göra med personbevis och lite andra saker, och så ska de vara chipmärkta med ett godkänt chip, säger hon. Om man ska ut i Europa behövs också en rabiesvaccinering. – Den ska vara gjord minst 21 dagar innan man kan resa iväg. Eller så beslutar man att det är bäst för hunden att vara hemma, och då krävs också planering för en hundvakt eller hundkennel. Vänj hunden vid bilresande Det är också en god idé att succesivt vänja sin valp eller hund vid bilresande. – Man kan börja med att vänja dem vid själva buren. Det är bra att ha en säker, godkänd och krocktestad bur med sele som man kan fästa i bilbältet, säger Marie Jury. Just valpar har också lättare att bli illamående.  – Korta turer är ju absolut att föredra. Det är också bra att inte ge dem mat precis innan man ska fara iväg. Det kan öka risken att de faktiskt mår illa. Rasta hunden ofta Det finns minimikrav på Jordbrukets hemsida på hur ofta man bör ta pauser om man tar med hunden på en bilresa. – Jag tror kravet är att de ska rastas minst var sjätte timme. Men valpar behöver få en paus mycket oftare. Viktigt att komma ihåg är också att inte lämna hunden i bilen. – Det här kan ju tyvärr ha dödlig utgång, säger Marie Jury. Man får krossa fönstret på bilen Det räcker heller inte att öppna takluckan eller fönstret lite. – Det är ungefär som att öppna luckan till ugnen. Man är fortfarande kvar i ugnen. Ser man en hund i en bil får man krossa fönstret – men man ska vara beredd på att kunna stå till svars för det. – Mitt råd är att ringa polisen och ta hjälp av dem så att de kan guida en igenom de olika stegen till vad man ska göra om man misstänker att en hund far illa i en varm bil. Kabinen eller lastrummet på flyget? Ska man i stället ta med sig hunden på flyg ska du få ta med den in i kabinen om hunden plus buren tillsammans väger max åtta kilo, men man kan alltid ringa flygbolaget för att höra vad de har för regler.  Om det är en större hund krävs det speciella transportburar i lastrummet. – Det är såklart jättesvårt att vänja dem vid den situationen men man kan åtminstone vänja dem vid buren, säger Marie Jury. Marie Jury rekommenderar att alltid ha en första hjälpen-väska med sig, för att exempelvis kunna lägga tassbandage, om en olycka skulle inträffa under resan. – Det är också bra att ta med det vanliga hundfodret, alla papper på hunden och att se till att du vet vilka kliniker som finns tillgängliga på resvägen, säger hon.", "link": "https://www.tv4.se/artikel/6F1Eg18YnWt7VaIFtRtQXa/att-resa-med-hund-detta-ska-du-taenka-pa", "date_display": "2026-05-30", "date_iso": "2026-05-30T11:11:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Husdjur", "/husdjur", "/nyhetsmorgon", "/hund", "/veterinar", "/resa"]}, {"id": 136, "title": "Bartender Josephine drank at work - ended up in hospital", "summary": "Josephine Sondlo started working in the restaurant world at an early age and started as a dish picker. - I started working in a pub because I needed a job. I had no desire or dream to become a bartender or work in a restaurant, but rather the opposite, she says. She made good money but it was hard work. At the same time, she saw how the bartenders earned better and had more fun. Then began the journey towards working his way up to mixing drinks. That's also where alcohol came into the picture. - There is a culture in my industry where it is very normalized to drink alcohol. Maybe not always necessarily at work, but it happens. During an eight-hour shift, you could ingest perhaps 15 units of various kinds, says Josephine Sondlo. \"Drank a whole bottle of wine just to get to sleep\" At first she thought it was cool, but soon it turned into an addiction. - To fall asleep at night, I could down a whole bottle of wine just to get to sleep, she says. But there came a turning point. Josephine Sondlo woke up in a hospital corridor on a cold hospital bed. People close to her had ensured that she was hospitalized against her will. - Everything was disgusting. Every now and then I felt: No, it's not possible. It's not cute anymore. I'm almost 40. I'm going to die, she says. Has been sober for over a year Today she has been sober for 554 days and runs her own bar. - I will always work in this industry, because it is fantastic. But two things can be true at the same time. There is a lot of darkness in it. You can also drink alcohol-free.", "title_original": "Bartendern Josephine drack på jobbet – hamnade på sjukhus", "summary_original": "Josephine Sondlo började tidigt jobba inom krogvärlden och började som diskplockare. – Jag började jobba på krog för att jag behövde ett jobb. Jag hade ingen önskan eller dröm om att bli bartender eller jobba på restaurang utan snarare tvärtom, berättar hon. Hon tjänade bra pengar men det var ett slitigt jobb. Samtidigt såg hon hur bartendrarna tjänade bättre och hade roligare. Då började resan mot att jobba sig upp till att få blanda drinkar. Där kom också alkoholen in i bilden. – Det finns en kultur inom min bransch där det är väldigt normaliserat att dricka alkohol. Kanske inte alltid nödvändigtvis på jobbet, men det sker. Under ett åttatimmarspass kunde man få i sig kanske 15 enheter av olika slag, säger Josephine Sondlo. ”Drack en hel flaska vin bara för att få sova” Från början tyckte hon att det var häftigt, men snart gick det över till ett missbruk. – För att somna på kvällarna kunde jag damma i mig en hel flaska vin bara för att få sova, säger hon. Men det kom en vändpunkt. Josephine Sondlo vaknade upp i en sjukhuskorridor på en kall sjukhussäng. Personer i hennes närhet hade sett till att hon blev inlagd mot sin vilja. – Allt var vidrigt. Där och då kände jag: Nej, det går inte. Det är inte gulligt längre. Jag är snart 40. Jag kommer att dö, säger hon. Har varit nykter i över ett år I dag har hon varit nykter i 554 dagar och driver en egen bar. – Jag kommer alltid att jobba i den här branschen, för den är fantastisk. Men två saker kan vara sanna på samma gång. Det finns mycket mörker i den. Man kan ju också dricka alkoholfritt.", "link": "https://www.tv4.se/artikel/4XMRCuW7acvOgKzid8nWEv/bartendern-josephine-vaknade-upp-pa-sjukhus-bestaemde-sig-foer-att-sluta-dricka", "date_display": "2026-05-30", "date_iso": "2026-05-30T10:37:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/alkohol", "/nyheter-och-samhalle", "/sjukhuset"]}, {"id": 137, "title": "The record price for the giant T-rex: SEK 250 million", "summary": "Have you dreamed of owning a real Tyrannosaurus Rex? The dream can come true, provided you have between SEK 180 and 270 million, probably more. In mid-July, the T-rex \"Gus\" will go up for auction at the British auction house Sotheby's. \"Professionally prepared and anatomically correct, the skeleton is mounted in a predatory pose on a custom-made steel fixture. The specimen was prepared with great care to the highest standards, highlighting the fossil's natural beauty and preserving important contextual information,\" the ad, which was posted this week, said. Gus is almost 12 meters long, 4 meters high and is made up of 183 individual bones. The specimen is also one of the largest Tyrannosaurus Rex found and one of the most complete, according to the auction house. \"Based on the size and degree of bone development, it can be determined that the skeleton belonged to a very large, strong and full-grown individual.\" Found on Gary \"Gus\" Licking's ranch The dinosaur was found on a ranch in South Dakota owned by Gary \"Gus\" Licking, hence the name. The T-rex lived during the Cretaceous period, i.e. around 67 million years ago, and has several injuries from its life. Among other things, signs of bite marks in the skull, which either come from battle or scavengers after death, but also broken and healed ribs. \"The specimen took three years to unearth and the team sometimes worked for weeks on end without finding anything. The site was complex and preserved many fossils,\" writes Thomas Heitkamp, ​​who found the fossil, in a press release. A couple of years ago, a Stegosaurus was sold at the auction house for a staggering amount - over SEK 400 million. Before the sale, Sotheby's had set a starting price of around SEK 50 million. The buyer was Ken Griffin, who is the founder of the hedge fund company Citadel. A minor purchase for him, given that he is worth half a trillion kroner, according to Forbes. His Stegosaurus is currently on loan to a natural history museum in Manhattan, New York. Previous environment", "title_original": "Rekordpriset för jättelika T-rexen: 250 miljoner kronor", "summary_original": "Har du drömt om att äga en äkta Tyrannosaurus Rex? Drömmen kan bli sann, förutsatt att du sitter på mellan 180 och 270 miljoner kronor, sannolikt mer. I mitten av juli kliver nämligen T-rexen \"Gus\" ut på auktion hos det brittiska auktionshuset Sotheby's. \"Professionellt förberedd och anatomiskt korrekt är skelettet monterat i en rovdjurspose på en specialtillverkad stålarmatur. Exemplaret förbereddes med stor omsorg enligt de högsta standarderna, vilket framhäver fossilets naturliga skönhet och bevarar viktig kontextuell information\", står det i annonsen, som lades ut i veckan. Gus är nästan 12 meter lång, 4 meter hög och består av 183 individuella ben. Exemplaret är också ett av de största Tyrannosaurus Rex som hittats och ett av de mest kompletta, enligt auktionshuset. \"Utifrån storleken och graden av benutveckling kan man fastställa att skelettet tillhörde en mycket stor, kraftig och fullvuxen individ.\" Hittades på Gary \"Gus\" Lickings ranch Dinosaurien hittades på en ranch i South Dakota som ägdes av Gary \"Gus\" Licking, därav namnet. T-rexen levde under kritaperioden, alltså för omkring 67 miljoner år sedan, och har flera skador från sitt liv. Bland annat tecken på bitmärken i skallen, som antingen kommer från strid eller asätare efter döden, men även brutna och läkta revben. \"Exemplaret tog tre år att gräva fram och teamet arbetade ibland veckor i sträck utan att hitta någonting. Platsen var komplex och bevarade många fossiler\", skriver Thomas Heitkamp, som hittade fossilet, i ett pressmeddelande. För ett par år sedan såldes en Stegosaurus på auktionshuset för ett hissnande belopp – över 400 miljoner kronor. Inför försäljningen hade Sotheby's satt ett utgångspris på omkring 50 miljoner kronor. Köparen var Ken Griffin, som är grundare av hedgefondbolaget Citadel. Ett mindre inköp för honom, med tanke på att han är god för en halv biljon kronor, enligt Forbes. Hans Stegosaurus lånas just nu ut till ett naturhistoriskt museum på Manhattan i New York. Tidigare miljonbelopp för en dinosaurie 2020 köpte Abu Dhabis regering en T-rex för nästan 300 miljoner kronor och den allra första försäljningen av en dinosaurie var 1997, då Walt Disney och McDonald's köpte \"Sue\" för 80 miljoner kronor, skriver Financial Times. Utgångspriset för \"Gus\" är satt till mellan 180 och 270 miljoner kronor, vilket är det högsta hittills för en dinosaurie. Men utifrån tidigare försäljningar kommer priset sannolikt bli betydligt högre än så. Den 14 juli får vi veta.", "link": "https://www.tv4.se/artikel/681JZB7IEMBwoVFDiyaRXE/rekordpriset-foer-jaettelika-t-rexen-250-miljoner-kronor", "date_display": "2026-05-30", "date_iso": "2026-05-30T09:20:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/dinosaurier", "/pengar"]}, {"id": 138, "title": "Therefore, the gap between the blocks increases: \"A game changer is needed\"", "summary": "With just over three months left until the election, the gap between the Tidö parties and the opposition is widening. In TV4's latest Novus survey, the opposition led by seven percent, but in new measurements by Ekot and Aftonbladet, the distance has increased to ten percent. This is despite the fact that the government has presented several reliefs for voters' wallets in recent times.  Oisín Cantwell, domestic political commentator at Aftonbladet, describes the development as \"mysterious\". - If things have gone reasonably well for a government, it also begins to recover in time for the election. This recovery should have started by now. But it is not, despite the formal bombshell of various wallet promises. It's whale pork from start to finish, he says.  \"Voters are not easily fooled - the trick doesn't work\" Earlier this week, Ulf Kristersson presented a package which means that the cost of monthly passes in public transport will be halved. The investment is the latest in a series of measures aimed at strengthening household finances.  But the positive reactions have not yet made an impression in the opinion polls. According to Oisín Cantwell, the explanation may be increasingly pessimistic households.  - One thing that election researchers have previously noted is that this type of trickery, appealing to people's wallets, does not usually work very well. What usually matters is whether the voters have confidence in the development of society and the development of the economy.  He believes that the timing of the investment is hardly a coincidence. - They are aware that this is a temporary reduction and that the monthly card will become more expensive again, sooner or later. So, voters are not fooled. Kristersson's biggest challenge The past four years have been marked by several international crises – including the war in Ukraine, the conflict in the Middle East and tariff threats from the USA. According to Oisín Cantwell, it has affected the term in two ways: - First, that it is problematic for the government that the households' optimism does not return. Partly, there is a lot of focus on ext", "title_original": "Därför ökar glappet mellan blocken: ”Behövs en game changer”", "summary_original": "Med drygt tre månader kvar till valet ökar glappet mellan Tidöpartierna och oppositionen. I TV4:s senaste Novusundersökning ledde oppositionen med sju procent, men i nya mätningar av Ekot och Aftonbladet har avståndet ökat till tio procent. Det sker trots att regeringen presenterat flera lättnader för väljarnas plånböcker under den senaste tiden.  Oisín Cantwell, inrikespolitisk kommentator på Aftonbladet, beskriver utvecklingen som ”gåtfull”. – Om det gått någorlunda bra för en regering börjar den också återhämta sig lagom till valet. Den här återhämtningen borde vara inledd vid det här laget. Men det är den inte, trots den formliga bombmattan av olika plånbokslöften. Det är ju valfläsk från början till slut, säger han.  ”Väljarna är inte lättlurade - fjäsket funkar inte” Tidigare i veckan presenterade Ulf Kristersson ett paket som innebär att kostnaden för månadskort i kollektivtrafiken halveras. Satsningen är den senaste i en rad åtgärder som syftar till att stärka hushållens ekonomi.  Men de positiva reaktionerna har ännu inte gjort avtryck i opinionsmätningarna. Enligt Oisín Cantwell kan förklaringen vara allt mer pessimistiska hushåll.  – En sak som valforskare tidigare konstaterat är att den här typen av fjäsk, att vädja till människors plånböcker, inte brukar fungera särskilt bra. Det som brukar ha betydelse är om väljarna känner tillit till samhällsutvecklingen och utvecklingen av ekonomi.  Han menar att tidpunkten för satsningen knappast är en slump. – De är medvetna om att det här är en temporär sänkning och att månadskortet kommer bli dyrare igen, förr eller senare. Så, väljarna är inte lättlurade. Kristerssons största utmaning De senaste fyra åren har präglats av flera internationella kriser – bland annat kriget i Ukraina, konflikten i Mellanöstern och tullhot från USA. Enligt Oisín Cantwell har det påverkat mandatperioden på två sätt: – Dels att det är problematiskt för regeringen att hushållens optimism inte återvänder. Dels är det mycket fokus på utrikespolitik, och utrikespolitik vinner man inga val på, så då får ju regeringen svårare att få ut budskap om vad de gör inrikespolitiskt. Vad är Kristerssons största utmaning inför valet? – Att få opinionen att vända. Förr eller senare kommer någonting att ske, Tidöpartierna kommer att hämta in. Kommer de hämta in tillräckligt mycket? Det återstår att se, säger Oisín Cantwell. Han ser i dagsläget få tecken på att regeringen kommer att lyckas minska avståndet tillräckligt mycket.  – Jag tror inte att de kan påverka så himla mycket längre. Jag tror att det krävs någon form av game changer – alltså något väldigt stort som ändrar spelplanen och som förskjuter hela valrörelsen.", "link": "https://www.tv4.se/artikel/7oaOdWjvxtN1goJq7I0WwU/daerfoer-oekar-glappet-mellan-blocken-behoevs-en-game-changer", "date_display": "2026-05-30", "date_iso": "2026-05-30T09:02:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/politik", "/svensk-politik", "/tidopartier"]}, {"id": 139, "title": "Johanna was fined after ticket confusion - wins against the bus company: \"Unbelievable\"", "summary": "When Johanna Uddén was going to take the bus in Uppsala, the app for buying tickets stopped working. She took a screenshot of the error message and approached the driver, something UNT was the first to share.  - I showed that the app did not work. A girl behind me had exactly the same problem, she says. The driver then waved past her and the other girl and let them board the bus. After a while, ticket inspectors stepped up and even though Johanna had an explanation for why she didn't have a ticket, she was fined SEK 1,500. - They were very unpleasant. They said it is the responsibility of the traveler to have a valid ticket. I felt very badly treated and was full of adrenaline when I got off the bus. The professor emailed after submitter Johanna Uddén first appealed to UL without success. The company referred to the Public Transport Act, which states that it is the responsibility of the traveler to have a valid ticket. A month later, she wrote an angry entry in Upsala Nya Tidning, UNT. Shortly afterwards, Torgny Håstad, former professor of civil law at Uppsala University and former justice of the Supreme Court, emailed. - He thought I had been treated unfairly and wanted to help me, says Johanna Uddén. The matter was first reported to the General Complaints Board, ARN, but after about a year the board followed UL's line. Then Torgny and Johanna chose to go ahead and sue UL in the Uppsala District Court. - When I got help from Torgny, I felt: now we're driving. Prior to the process, Torgny Håstad enlisted the help of his former colleague Ingemar Persson, also former Justice of the Supreme Court and honorary doctorate at Uppsala University. - The district court called me afterwards and asked: \"These agents - are they really the ones you want?\". They almost didn't believe it was true that I demanded SEK 1,500 and had such legal giants as representatives, says Johanna Uddén. Argued that the driver is not allowed to enter into a contract The lawsuit application was submitted in November 2025 and the negotiations were held in April this year.", "title_original": "Johanna fick böter efter biljettstrul – vinner mot bussbolaget: ”Otroligt”", "summary_original": "När Johanna Uddén skulle ta bussen i Uppsala slutade appen för biljettköp att fungera. Hon tog en skärmdump på felmeddelandet och gick fram till chauffören, något som UNT var först med berätta.  – Jag visade att appen inte fungerade. En tjej bakom mig hade exakt samma problem, berättar hon. Chauffören vinkade då förbi henne och den andra tjejen och lät dem kliva ombord på bussen. Efter en stund steg biljettkontrollanter på och trots att Johanna hade en förklaring till varför hon inte hade en biljett fick hon en bot på 1 500 kronor. – De var väldigt otrevliga. De sa att det är resenärens ansvar att ha en giltig biljett. Jag kände mig väldigt illa behandlad och var helt adrenalinstinn när jag gick av bussen. Professorn mejlade efter insändare Johanna Uddén överklagade först till UL utan framgång. Bolaget hänvisade till kollektivtrafiklagen, där det står att det är resenärens ansvar att ha giltig biljett. En månad senare skrev hon en arg insändare i Upsala Nya Tidning, UNT. Kort därefter mejlade Torgny Håstad, tidigare professor i civilrätt vid Uppsala universitet och tidigare justitieråd i Högsta domstolen. – Han tyckte att jag hade blivit orättvist behandlad och ville hjälpa mig, säger Johanna Uddén. Ärendet anmäldes först till Allmänna reklamationsnämnden, ARN, men efter omkring ett år gick nämnden på UL:s linje. Då valde Torgny och Johanna att gå vidare och stämma UL i Uppsala tingsrätt. – När jag fick hjälp av Torgny kände jag: nu kör vi. Inför processen tog Torgny Håstad hjälp av sin tidigare kollega Ingemar Persson, även han tidigare justitieråd i Högsta domstolen och hedersdoktor vid Uppsala universitet. – Tingsrätten ringde upp mig efteråt och frågade: ”De här ombuden – är det verkligen de du vill ha?”. De trodde nästan inte att det var sant att jag krävde 1 500 kronor och hade sådana juridiska giganter som ombud, säger Johanna Uddén. Hävdade att chauffören inte får ingå avtal Stämningsansökan lämnades in i november 2025 och förhandlingarna hölls i april i år. Den centrala frågan var om UL blev bundet av ett avtal om gratis resa när chauffören vinkade in henne. UL hävdade att chauffören inte har rätt att ingå avtal med resenärer. – Alla vi som åker buss ser chauffören som en representant för företaget. Men UL menar att chauffören bara kör bussen. Det argumentet tycker inte jag håller eftersom chauffören även säljer biljetter, säger Johanna Uddén. Två veckor efter förhandlingen kom domen. Tingsrätten valde att gå på Johannas sida och nu ska UL, utöver boten, även ersätta Johannas rättegångskostnader på 1 100 kronor. Bolaget har valt att inte överklaga och domen har därmed vunnit laga kraft. – Det känns fantastiskt. Mina ombud hade rätt argument och lyckades verkligen visa varför det här blev fel, säger Johanna Uddén.", "link": "https://www.tv4.se/artikel/39tPQPQgu6Wjnx3qU1lggJ/johanna-fick-boeter-efter-biljettstrul-vinner-mot-bolaget-otroligt", "date_display": "2026-05-30", "date_iso": "2026-05-30T07:37:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/uppsala", "/uppsala-tingsratt", "/kollektivtrafik"]}, {"id": 140, "title": "Germany's defense budget rises at record speed - \"enormous sums\"", "summary": "The small town of Unterlüß, a few miles north of Hanover, doesn't have much to brag about. A school, a sausage stand and a few grocery stores. But on the outskirts of the city lies a huge factory that plays a major role in Germany's rearmament – ​​the defense group Rheinmetall's weapons factory. \n\nSeveral anti-aircraft systems are set up outside the factory. A sign informs that military drones may circulate in the area. And when TV4's emissaries approach the factory, security personnel immediately come forward and ask to see an ID or passport. Taking pictures is of course out of the question. New European robot In the near future, a new project will begin in the factory. Together with the Dutch company Destinus, they will build medium-range robots that are supposed to replace the American Tomahawk robots that Donald Trump no longer wants to station in Europe. \n\nThe new European robots will be the first of their kind and will be able to respond to the Russian medium-range robots stationed in the Kaliningrad enclave.\n\n- You must be able to attack and destroy a target very precisely at a distance of over 1,000 kilometers... especially command centers, maintenance depots and so on, says defense expert Thomas Wiegold. Despite history – support for rearmament Germany's defense spending currently stands at 2.39 percent of the country's gross domestic product (GDP), according to the Atlantic Council think tank. In Sweden the figure is 2.5 percent and in neighboring Poland 4.3 percent.\n\nBut the German defense budget is increasing rapidly – ​​by around 33 percent this year compared to Sweden's increase of 18 percent. According to the plan, Germany will spend 3.5 percent of GDP on defense by 2029, a full decade before that goal is scheduled to be introduced by all NATO countries. At about that time, Germany will have a defense budget as large as France and Great Britain combined.\n\nIn the past, the Germans have been skeptical of increased defense spending, but after Donald Trump once again took over as president of the United States, it has", "title_original": "Tysklands försvarsbudget stiger i rekordfart – ”enorma summor”", "summary_original": "Den lilla staden Unterlüß, några mil norr om Hannover, har inte mycket att skryta med. En skola, en korvkiosk och några mataffärer. Men i utkanten av staden ligger en enorm fabrik som spelar en stor roll i Tysklands upprustning – försvarskoncernen Rheinmetalls vapenfabrik. \n\nUtanför fabriken står flera luftvärnssystem uppställda. En skylt informerar om att militära drönare kan cirkulera i området. Och när TV4:s utsända närmar sig fabriken kommer det direkt fram säkerhetspersonal som ber att få se ID eller pass. Att ta bilder är givetvis uteslutet. Ny europeisk robot Inom en snar framtid kommer man att påbörja ett nytt projekt i fabriken. Tillsammans med det nederländska företaget Destinus ska man bygga medeldistansrobotar som är tänkta att ersätta de amerikanska Tomahawk-robotar som Donald Trump inte längre vill stationera i Europa. \n\nDe nya europeiska robotarna kommer att vara de första i sitt slag och ska kunna svara mot de ryska medeldistansrobotar som är stationerade i enklaven Kaliningrad.\n\n– Man ska kunna angripa och förstöra ett mål mycket precist på över 1 000 kilometers avstånd… i synnerhet ledningscentraler, underhållsdepåer och så vidare, säger försvarsexperten Thomas Wiegold. Trots historien – ett stöd för upprustning Tysklands försvarsutgifter ligger just nu på 2,39 procent av landets bruttonationalprodukt (BNP), enligt tankesmedjan Atlantic Council. I Sverige ligger siffran på 2,5 procent och i grannlandet Polen på 4,3 procent.\n\nMen den tyska försvarsbudgeten ökar snabbt – med runt 33 procent i år jämfört med Sveriges ökning på 18 procent. Enligt planen ska Tyskland lägga 3,5 procent av BNP på försvaret år 2029, ett helt decennium innan det målet planeras att införas av alla Nato-länder. Vid ungefär den tidpunkten kommer Tyskland att ha en lika stor försvarsbudget som Frankrike och Storbritannien tillsammans.\n\nTidigare har tyskarna varit skeptiska till ökade försvarsutgifter, men efter att Donald Trump återigen tog över som president i USA har det förändrats. Runt 70 procent av tyskarna stöttar nu de ökade försvarsutgifterna.\nÄven i Unterlüß.\n\n– Vi måste kunna försvara oss, säger Unterlüßbon Marianne von der Kammer till TV4:s utsända.\n\nEike Formella, som också bor i Unterlüß, var tidigare engagerad i freds- och avrustningsrörelsen. Men även han har ändrat sig.\n\n– Klart att jag hellre skulle se att pengarna går till skolor. Men vi måste just nu visa att vi är försvarsdugliga, säger han.", "link": "https://www.tv4.se/artikel/4A45RUtgp4FikFySHrGnk5/tyskland-rekordrustar-foersvaret-dubbelt-sa-snabbt-som-sverige", "date_display": "2026-05-30", "date_iso": "2026-05-30T06:44:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/tyskland", "/europas-forsvar", "/eu"]}, {"id": 141, "title": "Caramel dream in a glass", "summary": "Today's weekend tip offers an easy-to-fix and delicious dessert with crumbly dreams, smooth dulce de leche, whipped cream and crispy daim in a glass topped with fresh strawberries and lemon balm. If you use ready-made dreams, the dessert goes straight ahead.  See Camilla Hamid's recipe", "title_original": "Koladröm i glas", "summary_original": "Dagens helgtips bjuder på en lättfixad och ljuvligt god dessert med smuliga drömmar, len dulce de leche, vispad grädde och krispig daim i glas toppad med färska jordgubbar och citronmeliss. Använder du färdiga drömmar går desserten i raktfart.  Se Camilla Hamids recept", "link": "https://www.tv4.se/artikel/6bkbfRBwo561mU4UNbSE3G/koladroem-i-glas", "date_display": "2026-05-30", "date_iso": "2026-05-30T05:24:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/koket", "/kokets-helgtips", "/camilla-hamid"]}, {"id": 142, "title": "Hegseth: Ready to attack Iran if no deal is reached", "summary": "\"Trump will only agree to a deal that is good for the United States\"", "title_original": "Hegseth: Redo att attackera Iran om inget avtal nås", "summary_original": "”Trump kommer bara att gå med på ett avtal som är bra för USA”", "link": "https://www.tv4.se/artikel/1gnTbHY8GdIBaJGVfdbwNv/hegseth-redo-att-attackera-iran-om-inget-avtal-nas", "date_display": "2026-05-30", "date_iso": "2026-05-30T05:08:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 143, "title": "War, crisis and Ebola - the children are affected the worst", "summary": "An Italian surgeon who has been in contact with Ebola-infected people in Ituri in northeastern Congo-Kinshasa is in quarantine in Rome, Italy's health ministry announced this week. Among other things, the surgeon is said to have performed an emergency operation on a child who had been injured by an exploding grenade. The conflict-torn area is also believed to be the epicenter of the new outbreak of Ebola – and during the operation it emerged that the blast-injured child was likely infected as well. Several of the confirmed Ebola deaths so far have been children. They are the most vulnerable and almost every second resident of the shaky region is under the age of 15. \"Could have held on\" Ebola is spreading much faster this time, emphasizes the Congolese doctor Babou Rukengeza, who leads Save the Children's efforts in the country. He has worked on several previous outbreaks, but believes that Congo-Kinshasa was forgotten and was less equipped. Before the big cuts in aid, care here was strong enough to contain the outbreak within one or two health care districts. Now there are alarms about cases of infection in 14 districts, he tells TT on the phone. The outbreak is clearly exacerbated by the humanitarian situation. The long-running conflict in the country has escalated with regular fighting between splinter parties, slowing aid efforts. Up to a million people are in densely populated camps in Ituri province alone. There is widespread hunger and a lack of water. People have been urged to wash their hands with sand. That is our great fear: that we will fall into one of the camps. Then we have a big problem, says Rukengeza. Crisis upon crisis upon crisis The infection is feared to have spread for a long time in secret, in areas where there is great mistrust and the disease is often dismissed as malaria or fiction. Out of more than 250 suspected Ebola deaths, a small number have so far been confirmed. As for the children, we do everything we can to ensure that they are in a protected environment, says Babou Rukengeza. A lot of work is directed at schools, where children first get shelter", "title_original": "Krig, kris och ebola – barnen drabbas värst", "summary_original": "En italiensk kirurg som har varit i kontakt med ebolasmittade människor i Ituri i nordöstra Kongo-Kinshasa sitter i karantän i Rom, meddelade Italiens hälsodepartement i veckan. Kirurgen uppges bland annat ha gjort en akut operation på ett barn som hade skadats av en exploderande granat. Det konflikthärjade området är också förmodat epicentrum för det nya utbrottet av ebola – och under operationen framgick det att det sprängskadade barnet sannolikt också var smittat. Flera av de hittills bekräftade eboladödsfallen har varit barn. De är de mest sårbara och nästan varannan invånare i den skakiga regionen är yngre än 15 år. ”Hade kunnat hålla” Ebolan sprids mycket snabbare den här gången, understryker den kongolesiske läkaren Babou Rukengeza, som leder Rädda Barnens insatser i landet. Han har arbetat vid flera tidigare utbrott, men bedömer att Kongo-Kinshasa blev bortglömt och stod sämre rustat. Före de stora nedskärningarna i bistånd var vården här stark nog för att kunna hålla utbrottet inom ett eller två sjukvårdsdistrikt. Nu larmas det om smittofall i 14 distrikt, säger han till TT på telefon. Utbrottet förvärras tydligt av det humanitära läget. Den långvariga konflikten i landet har trappats upp med regelbundna strider mellan splittrade parter, vilket sinkar hjälpinsatser. Upp emot en miljon människor befinner sig i tätbefolkade läger bara i Ituri-provinsen. Där råder utbredd hunger och brist på vatten. Människor har manats att tvätta händerna med sand. Det är vår stora rädsla: att vi ska få ett fall inne i ett av lägren. Då har vi ett stort problem, säger Rukengeza. Kris på kris på kris Smittan befaras ha spridits en längre tid i det dolda, i trakter där det råder stor misstro och sjukdomen ofta avfärdas som malaria eller påhitt. Av fler än 250 misstänkta eboladödsfall har hittills en mindre del bekräftats. När det gäller barnen gör vi allt vi kan för att de ska vara i en skyddad miljö, säger Babou Rukengeza. Mycket arbete riktas mot skolor, där barn först får lära sig vikten av att tvätta händer och undvika beröring. På samma gång försöker vi få dem att inte känna någon oro, att förstå att vi är där för att skydda dem. Liksom vid tidigare ebolautbrott befaras många barn bli föräldralösa. Och det är inte bara det här väldigt stora ebolautbrottet. Samtidigt pågår utbrott av kolera och mässling. Det här är inte en särskilt bra plats att vara på just nu, säger Rukengeza.", "link": "https://www.tv4.se/artikel/tt-260530-kongokinebolabarn1-b5e7c30f/krig-kris-och-ebola-barnen-drabbas-varst", "date_display": "2026-05-30", "date_iso": "2026-05-30T04:57:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/italien", "/folkhalsomyndigheten", "/kongo-kinshasa", "/ebola"]}, {"id": 144, "title": "Illegal trade in pharmaceuticals is growing – and changing", "summary": "The illegal trade in pharmaceuticals is growing in Sweden, and the methods are changing. Today, it is not just about smuggling finished tablets. Instead, active substances, i.e. the actual active substances in medicines, are ordered from abroad and used to manufacture them illegally in Sweden. - Have you ever ordered from Amazon? It's really the same thing, says Martin Burman, investigator at the Medical Products Agency, about how substances are bought in from abroad. Ordered via open platforms According to the Medical Products Agency, trade takes place via large B2B platforms in China and India, among others. To avoid detection, passwords and loopholes are used. Substances can, for example, be hidden by re-spelling in advertisements. After initial contact, the dialogue moves on to encrypted channels such as WhatsApp, where payment can be made in cryptocurrencies such as bitcoin. The goods are then smuggled into Europe. - It is a legal platform on the surface, but it is used by criminal actors, says Burman. Moved production here At the same time, authorities are seeing a shift in how crimes are committed. In the past, it was mainly about finished medicines being smuggled into Sweden. Now instead, the manufacturing takes place in the country and in the rest of the EU, above all when it comes to slimming preparations. - There are many places where we also see illegal manufacturing taking place within Sweden and throughout the EU, says Burman. Police cases and judgments linked to pharmaceutical crimes have increased, and the authority sees a clear rise in both reports and seizures. Can be life-threatening The illegally manufactured medicines can pose great risks. At least 45 deaths in Sweden during 2024 and 2025 are linked to falsified medicines, something that the Pharmaceutical World has previously reported on. Manufacturing takes place without control and often without sterile environments, which is particularly problematic when it comes to injectable drugs. - You simply inject pollutants into the body. It can cause serious allergic reactions, says Burman. - It can get really bad if it spreads", "title_original": "Illegal handel med läkemedel växer – och byter skepnad", "summary_original": "Den illegala handeln med läkemedel växer i Sverige, och metoderna förändras. I dag handlar det inte bara om smuggel av färdiga tabletter. I stället beställs aktiva ämnen, alltså själva verksamma substanserna i läkemedel, från utlandet och används för att tillverka dem illegalt i Sverige. – Har du beställt på Amazon någon gång? Det är ju egentligen samma sak, säger Martin Burman, utredare på Läkemedelsverket, om hur substanser köps in från utlandet. Beställs via öppna plattformar Enligt Läkemedelsverket sker handeln via stora B2B‑plattformar i bland annat Kina och Indien. För att undvika upptäckt används kodord och kryphål. Substanser kan exempelvis döljas genom att stavas om i annonser. Efter första kontakt flyttas dialogen vidare till krypterade kanaler som WhatsApp, där betalning kan ske i kryptovalutor som bitcoin. Därefter smugglas varorna in i Europa. – Det är en laglig plattform på ytan, men den används av kriminella aktörer, säger Burman. Flyttat produktionen hit Samtidigt ser myndigheter ett skifte i hur brotten begås. Tidigare handlade det främst om att färdiga läkemedel smugglades in i Sverige. Nu sker i stället tillverkningen i landet och i övriga EU, framför allt när det gäller bantningspreparat. – Det är väl mycket där vi också ser att det sker en olaglig tillverkning inom Sverige och inom hela EU, säger Burman. Polisärenden och domar kopplade till läkemedelsbrott har ökat, och myndigheten ser en  tydlig uppgång i både anmälningar och beslag. Kan vara livsfarligt De olagligt tillverkade läkemedlen kan innebära stora risker. Minst 45 dödsfall i Sverige under 2024 och 2025 kopplas till förfalskade läkemedel, något som Läkemedelsvärlden tidigare har rapporterat om. Tillverkningen sker utan kontroll och ofta utan sterila miljöer, vilket är särskilt problematiskt när det handlar om injektionsläkemedel. – Man injicerar föroreningar i kroppen helt enkelt. Det kan ge allvarliga allergiska reaktioner, säger Burman. – Det kan bli riktigt illa om det sprider sig i hela kroppen, fortsätter han. Växande marknad Enligt Läkemedelsverket drivs utvecklingen av den höga efterfrågan, inte minst på viktminskningsläkemedel. Och myndigheten ser inga tecken på att problemet minskar. – Det är ju inte en marknad som krymper om man säger så, säger Burman.", "link": "https://www.tv4.se/artikel/23mWnoV0REMfB4zCjxEaln/illegal-handel-med-laekemedel-vaexer-och-byter-skepnad", "date_display": "2026-05-30", "date_iso": "2026-05-30T04:27:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/lakemedel", "/lakemedelsverket", "/medicin", "/ozempic", "/handel", "/e-handel"]}, {"id": 145, "title": "Liselotte J Andersson:\nTime for everyday life in the church year", "summary": "But there is hardly any lack of mystery, notes Liselotte J Andersson", "title_original": "Liselotte J Andersson:\nDags för vardag i kyrkoåret", "summary_original": "Men det saknas knappast mystik, konstaterar Liselotte J Andersson", "link": "https://www.dagen.se/livsstil/liselotte-j-andersson-dags-foer-vardag-i-kyrkoaret/10365671", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "Many who leave the Free Church go quietly", "summary": "I sometimes wonder if you are just as good at seeing people who don't crash, protest or lose faith - but who just slowly slip out of the community, writes Stefan Kinert.", "title_original": "Många som lämnar frikyrkan går tyst", "summary_original": "Jag undrar ibland om man är lika bra på att se människor som inte kraschar, protesterar eller tappar tron – utan som bara långsamt glider ur gemenskapen, skriver Stefan Kinert.", "link": "https://www.dagen.se/debatt/manga-som-laemnar-frikyrkan-gar-tyst/10357251", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 147, "title": "The graduating class of 1976 met again – 50 years after the ordination as pastor", "summary": "Have had many reunions over the years - \"It's probably a bit unique\"", "title_original": "Avgångsklass 1976 träffades igen – 50 år efter ordinationen till pastor", "summary_original": "Har haft många återträffar genom åren – ”Det är nog lite unikt”", "link": "https://www.dagen.se/familj/avgangsklass-1976-traeffades-igen-50-ar-efter-ordinationen-till-pastor/10368694", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 148, "title": "The minister is happy to regulate AI - \"with the Pope's blessing\"", "summary": "Minister of Civil Affairs Erik Slottner (KD) shares the Pope's concern about what AI can do in terms of surveillance and new weapons - \"I don't have a stop button\"", "title_original": "Ministern reglerar gärna AI – ”med påvens välsignelse”", "summary_original": "Civilminister Erik Slottner (KD) delar påvens oro för vad AI kan göra när det gäller övervakning och nya vapen – ”jag har ingen stoppknapp”", "link": "https://www.dagen.se/nyheter/ministern-reglerar-gaerna-ai-med-pavens-vaelsignelse/10364477", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "\"When I lost my son, I felt a need for the church\"", "summary": "Actress Sofia Rönnegård about faith, grief and self-doubt", "title_original": "”När jag förlorade min son kände jag ett behov av kyrkan”", "summary_original": "Skådespelerskan Sofia Rönnegård om tron, sorgen och självtvivlet", "link": "https://www.dagen.se/kultur/naer-jag-foerlorade-min-son-kaende-jag-ett-behov-av-kyrkan/10330811", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Pentecost FFS: From self-examination to building the future", "summary": "Esther Flores Sedman: The Pentecostal movement must regain community involvement", "title_original": "Pingst FFS: Från självrannsakan till framtidsbygge", "summary_original": "Esther Flores Sedman: Pingströrelsen måste återta samhällsengagemanget", "link": "https://www.dagen.se/ledare/pingst-ffs-fran-sjaelvrannsakan-till-framtidsbygge/10341585", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "First physical Bible printed with the new translation", "summary": "Submitted to the Swedish Bible Society: \"Magical feeling.\"", "title_original": "Första fysiska Bibeln tryckt med nya översättningen", "summary_original": "Överlämnades till Svenska bibelsällskapet: ”Magisk känsla.”", "link": "https://www.dagen.se/nyheter/foersta-fysiska-bibeln-tryckt-med-nya-oeversaettningen/10370603", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "USA: Productive talks between Israel and Lebanon", "summary": "Eleven dead in Israeli attacks", "title_original": "USA: Produktiva samtal mellan Israel och Libanon", "summary_original": "Elva döda i israeliska attacker", "link": "https://www.tv4.se/artikel/tt-260530-molibanon1-38ed745a/usa-produktiva-samtal-mellan-israel-och-libanon", "date_display": "2026-05-29", "date_iso": "2026-05-29T22:15:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Irankriget", "/irankriget"]}, {"id": 153, "title": "Divided feelings in Mexico ahead of the World Cup: \"It's the USA's championship\"", "summary": "Say the World Cup in Mexico in 1970 and the heart rate of most football nostalgics rises. It was the first World Cup tournament in color television, for the first time a sticker album was issued and fans collected pictures of Brazilian heroes such as Pelé, Jairzinho and Tostão. Many still call it the most beautiful championship ever. Say the World Cup in Mexico in 1986 and the same nostalgics tend to fly off on a spiritual journey among the clouds. It was Maradona, the hand of God, the goal of the century, the memory of the Falklands War. The setting was incredible, and so was the memory of it. \"Will feel distant\" We cannot have those expectations for the World Cup in Mexico 2026, says football journalist Enrique Garcia. He is preparing to cover his ninth WC, when TV4 Nyheterna meets him in Monterrey. - Football was different then: the players more human, no valuable investment objects with human traits like now, he says. - In addition, this World Cup is absolutely huge, extremely spread out with more countries than ever before. This means that it will probably feel distant to many.  But there is another aspect that makes Enrique Garcia believe there is a risk of disappointment in Mexico. The feeling that it's not real this time. - Let's not imagine anything. This is America's World Cup, he says. - On the one hand, almost all matches are played in the USA, on the other hand, 70 percent of Mexicans will not be able to afford to go to the matches because of the ticket prices. The fees set by FIFA in US dollars have spilled over into Mexico and Canada, making the tournament unaffordable for most. Not a World Cup for everyone He is supported by Jaime Aguilar Vázquez who lives in Guadalajara, where four World Cup matches will be played.  - It is not a World Cup for us ordinary Mexicans. With the prevailing ticket prices, we do not have access to the arena, he says. Jaime Aguilar Vázquez is involved in the search for missing young people in the state of Jálisco, as TV4 Nyheterna reported earlier. He thinks that the tax money that goes to Mexico's 13 WC-", "title_original": "Splittrade känslor i Mexiko inför VM: ”Det är USA:s mästerskap”", "summary_original": "Säg VM i Mexiko 1970 och pulsen stiger hos de flesta fotbollsnostalgiker. Det var den första VM-turneringen i färg-tv, för första gången gavs ett album med klistermärken ut och fansen samlade på bilder av brasilianska hjältar som Pelé, Jairzinho och Tostão. Många kallar det än i dag det vackraste mästerskapet någonsin. Säg VM i Mexiko 1986 och samma nostalgiker tenderar att flyga iväg på en spirituell resa bland molnen. Det var Maradona, Guds hand, seklets mål, minnet av Falklandskriget. Inramningen var oerhörd, således också minnet av det. ”Kommer att kännas avlägset” De förväntningarna kan vi inte ha på VM i Mexiko 2026, säger fotbollsjournalisten Enrique Garcia. Han förbereder sig för att bevaka sitt nionde VM, när TV4 Nyheterna träffar honom i Monterrey. – Fotbollen var annorlunda då: spelarna mer mänskliga, inga värdefulla investeringsobjekt med mänskliga drag som nu, säger han. – Dessutom är det här VM:et helt enormt, extremt utspritt med fler länder än någonsin förut. Det gör att det förmodligen kommer att kännas avlägset för många.  Men det finns ytterligare en aspekt som gör att Enrique Garcia tror att det finns risk för besvikelse i Mexiko. Känslan av att det inte är på riktigt den här gången. – Låt oss inte inbilla oss något. Det här är USA:s VM, säger han. – Dels spelas nästan alla matcher i USA, dels kommer 70 procent av mexikanerna inte ha råd att gå på matcherna på grund av biljettpriserna. De avgifter som FIFA har satt i dollar i USA har spillt över på Mexiko och Kanada och gör turneringen otillgänglig för de flesta. Inte ett VM för alla Han får medhåll av Jaime Aguilar Vázquez som bor i Guadalajara, där fyra VM-matcher kommer att spelas.  – Det är inte ett VM för oss vanliga mexikaner. Med de biljettpriserna som råder har vi inte tillträde till arenan, säger han. Jaime Aguilar Vázquez är engagerad i sökandet av försvunna ungdomar i delstaten Jálisco, som TV4 Nyheterna rapporterat tidigare om. Han tycker att skattepengarna som går till Mexikos 13 VM-matcher hade kunnat gå till annat – argumentet att inkomster från ökad turism kan vara värt det, ger han inte mycket för. – De försöker sälja in idén att vi här i Mexiko ska arrangera VM, vilket inte är sant. Vi har bara några få matcher som den stora vänliga Donald Trump har lämnat kvar till oss, säger han. Men Enrique Garcia, sportjournalisten – Mexikos svar på Lasse Granqvist, tror ändå att det kommer att bli fest. Kärleken till fotbollen är långt större söder om Rio Grande.  – Biljettpriserna håller de flesta borta från arenorna. Men Monterrey, Guadalajara och Mexiko City kommer likväl att pulsera runt matcherna, säger han. ”Här är dörrarna öppna” På ett av Monterreys berg, i det som på byråkratspråk skulle kallas ett socialt utsatt område, står Alfonso Alonso och är hoppfull. Med sina sjuttioplus minns han både VM 1970 och 1986. Han tror att 2026 kan bli ännu bättre. – Det kommer bli ett VM ihågkommet för att det spelades i hela Amerika, säger han.  – USA är Amerika men Mexiko är också Amerika. Alla vet att USA alltid vill ha allt för sig själv. Men det här är Världsmästerskapen, de är till för hela världen. Och det är hit till Mexiko flest människor kommer att komma. Vi har inga visumbegränsningar som i USA. Här är dörrarna öppna för alla.", "link": "https://www.tv4.se/artikel/3mvwQtEKyqOEfUtZss4JaN/splittrade-kaenslor-i-mexiko-infoer-vm-det-aer-usa-s-maesterskap", "date_display": "2026-05-29", "date_iso": "2026-05-29T20:03:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/fotboll", "/fotbolls-vm-2026", "/fotbollslandslaget", "/mexiko", "/usa", "/kanada", "/kanada-och-usa"]}, {"id": 154, "title": "Whistleblowers warn of serious shortcomings at the authority", "summary": "There is harsh criticism of the Equality Authority's director general Lise Tamm in a review from the journal Ottar. Among other things, several employees at the authority in Gothenburg testify about detailed management, a culture of silence and that she ignores the facts.  - She is obsessed with the idea that the agency is full of activists, and has a list of people she does not want to work here. She uses new employees as informants, and calls them in to report on colleagues, says one employee to Ottar.  In mid-February, a whistle-blower case, which TV4 Nyheterna learned about, was sent to the government office. In the letter, several parts of the criticism are lined up. To begin with, it is about Lise Tamm's relationship with a researcher at the authority. The whistleblower believes that the person was elected to the authority's research council instead of other more established researchers. \"In the light of their personal relationship, this should be tried from an equal perspective, in accordance with the administrative law's requirements for objectivity and impartiality.\" Very low trust In employee surveys, a very low level of trust in the general manager also emerges, according to the whistleblower. The work environment is described as very stressful and some employees suffer from mental illness, which makes them consider quitting. Something that GP also reported on last autumn.  \"There is a tangible risk of extensive staff turnover and increased sick leave.\" One of the purposes of recruiting the new general manager at the end of 2024 was that the previous work environment problems would be improved. But the whistleblower describes how Lise Tamm manages employees in detail, reprimands them and does not treat everyone equally.  An article from Göteborgs-Posten is also highlighted. There, the communications department is criticized by Lise Tamm for \"obviously not succeeding\" in implementi
