riginal": "Natoledare trotsar Trump – trots uppmaning att ”hålla sig borta”", "summary_original": "Planerar insats i Hormuzsundet", "link": "https://www.tv4.se/artikel/P4M3wfL3FGtwwzQLEG3t6/trump-sa-hall-er-borta-nu-trotsar-europeiska-ledarna-presidenten", "date_display": "2026-04-18", "date_iso": "2026-04-18T19:47:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 105, "title": "Luxury tents and comfortable beds have become standard in Mount Everest base camp", "summary": "KATHMANDU. Influencers and other amateurs should be stopped from climbing Mount Everest. Mountaineers must have scaled a peak of 7,000 meters in Nepal, according to a proposed law. Only then do they get permission to attempt the world's highest mountain.", "title_original": "Lyxtält och bekväma sängar har blivit standard i Mount Everests basläger", "summary_original": "KATMANDU. Influerare och andra amatörer ska stoppas från att bestiga Mount Everest. Bergsbestigare måste ha klarat av en topp på 7 000 meter i Nepal, enligt ett lagförslag. Först därefter får de tillstånd att försöka sig på världens högsta berg.", "link": "https://www.dn.se/varlden/lyxtalt-och-bekvama-sangar-har-blivit-standard-i-mount-everests-baslager/", "date_display": "2026-04-18", "date_iso": "2026-04-18T19:37:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "Completion in Hungary: More mandates for Magyar", "summary": "Now the last postal and foreign votes have been counted in Hungary. With the final election result, Péter Magyar wins three more seats.", "title_original": "Färdigräknat i Ungern: Fler mandat till Magyar", "summary_original": "Nu har de sista post- och utlandsrösterna räknats i Ungern. Med det slutliga valresultatet vinner Péter Magyar ytterligare tre mandat.", "link": "https://www.sydsvenskan.se/varlden/fardigraknat-i-ungern-fler-mandat-till-magyar/", "date_display": "2026-04-18", "date_iso": "2026-04-18T19:03:38+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "Two bitten by dog ​​in apartment - one to hospital", "summary": "", "title_original": "Två bitna av hund i lägenhet – en till sjukhus", "summary_original": "", "link": "https://www.svd.se/a/ExlPX3/tva-bitna-av-hund-i-lagenhet-en-till-sjukhus", "date_display": "2026-04-18", "date_iso": "2026-04-18T19:01:28+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 108, "title": "Lead heavy three-pointer for BoIS: \"I understand that it has been frustrated\"", "summary": "The star poked and a frustration that has grown among the supporters - after Adam Egnell's penalty, a possible early BoIS crisis is put on hold. - I love how we are ready to die for each other, says Andreas Murbeck.", "title_original": "Blytung trepoängare för BoIS: ”Jag förstår att det har varit frustrerat”", "summary_original": "Stjärnan petad och en frustration som har växt hos supportrarna – efter Adam Egnells straffmål sätts en eventuell tidig BoIS-kris på paus. – Jag älskar hur vi är redo att dö för varandra, säger Andreas Murbeck.", "link": "https://www.hd.se/sport/blytung-seger-for-bois-jag-forstar-att-det-har-varit-frustrerat/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:48:20+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Anders freezes his brain - to be awakened in the future", "summary": "When futurist Anders Sandberg dies, he allows himself to be frozen in liquid nitrogen, hoping to be revived in a few decades. - It's better than being dead for sure, he says.", "title_original": "Anders fryser ner sin hjärna – för att väckas i framtiden", "summary_original": "När framtidsforskaren Anders Sandberg dör låter han frysa ner sig i flytande kväve, i hopp om att kunna återupplivas om några decennier. – Det är bättre än att med säkerhet vara död, säger han.", "link": "https://www.dn.se/varlden/anders-fryser-ner-sin-hjarna-for-att-vackas-i-framtiden/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:26:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Boy went to concert with friends - blown to death the next day", "summary": "On a rainy summer evening, a 15-year-old boy accidentally blows himself to death when he is about to carry out a bombing for 5,000 kroner. What led up to the grotesque tragedy? According to the investigation, the boy was encouraged to carry out the explosion by a close friend. In questioning, the friend, who is now charged with grossly causing the death of another, says that he cried when he found out that his friend had an accident.", "title_original": "Pojke gick på konsert med vännerna – sprängdes till döds dagen efter", "summary_original": "En regnig sommarkväll råkar en 15-årig pojke spränga sig själv till döds när han ska utföra ett bombdåd för 5 000 kronor. Vad ledde fram till den groteska tragedin? Enligt utredningen uppmuntrades pojken att genomföra sprängningen av en nära vän. I förhör säger kompisen som nu är åtalad för grovt vållande till annans död att han grät när han fick reda på att hans vän förolyckats.", "link": "https://www.dn.se/sverige/pojke-gick-pa-konsert-med-vannerna-sprangdes-till-dods-dagen-efter/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:23:19+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Woman arrested after throwing coffee at her partner", "summary": "A couple in their 60s got into an argument with each other on Saturday afternoon.  - No children were witnesses to the incident, says Patric Fors, police spokesperson.", "title_original": "Kvinna gripen efter att ha kastat kaffe på sin partner", "summary_original": "Ett par i 60-årsåldern hamnade i bråk med varandra under lördagseftermiddagen.  – Inga barn var vittnen till händelsen, säger Patric Fors, polisens presstalesperson.", "link": "https://www.sydsvenskan.se/kvinna-gripen-efter-att-ha-kastat-kaffe-pa-sin-partner/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:15:43+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Victory for Fortuna after walk over", "summary": "", "title_original": "Seger till Fortuna efter walk over", "summary_original": "", "link": "https://www.hd.se/sport/hemmaplan/seger-for-fortuna-i-motet-med-allerum/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:12:43+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Monica Jusu Bah: \"I am absolutely not the one filming\"", "summary": "She is not a player who films. That's what a dejected Monica Jusu Bah says after the World Cup qualifying victory against Serbia. Yet she was warned about just that. And got a pain in the groin. - I absolutely think we should have received a penalty, says the 22-year-old.", "title_original": "Monica Jusu Bah: ”Jag är absolut inte den som filmar”", "summary_original": "Hon är inte en spelare som filmar. Det säger en uppgiven Monica Jusu Bah efter VM-kvalsegern mot Serbien. Ändå varnades hon för just det. Och fick ont i ljumsken. – Jag tycker absolut att vi borde ha fått straff, säger 22-åringen.", "link": "https://www.dn.se/sport/monica-jusu-bah-jag-ar-absolut-inte-den-som-filmar/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:00:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "DN Debate. \"Menopause takes a toll on life - so women can get help faster\"", "summary": "DN DEBATE. Every woman has or will go through the menopause, with hot flashes, depression and a reduced sex life. But instead of quick help, many are left in the waiting room of the care queues, completely unnecessarily. Give midwives the right to prescribe treatment for menopausal symptoms. For the sake of healthcare - but also for women, write 22 midwives and specialist doctors.", "title_original": "DN Debatt. ”Klimakteriet sliter på livet – så kan kvinnor få snabbare hjälp”", "summary_original": "DN DEBATT. Varje kvinna har eller ska genomgå klimakteriet, med vallningar, nedstämdhet och försämrat sexliv. Men i stället för snabb hjälp lämnas många i vårdköernas vänterum, helt i onödan. Ge barnmorskor rätt att förskriva behandling vid klimakteriebesvär. För sjukvårdens skull – men också kvinnornas, skriver 22 barnmorskor och specialistläkare.", "link": "https://www.dn.se/debatt/klimakteriet-sliter-pa-livet-sa-kan-kvinnor-fa-snabbare-hjalp/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Hövding's comeback: This is how the new owner wants to win the cyclists back", "summary": "With modern technology in Hövding, the Austrian owner hopes to regain trust in the European market. The new inflatable head protection for cyclists has been developed together with a Lunda company. At the same time, a detail that flirted with Hövding's origin disappears.\n- For that I apologize to everyone in Malmö! says Alexander Haag, CEO of Isi Wearables.", "title_original": "Hövdings comeback: Så vill nya ägaren vinna tillbaka cyklisterna", "summary_original": "Med modern teknik i Hövding hoppas den österrikiska ägaren återvinna förtroendet på Europamarknaden. Det nya uppblåsbara huvudskyddet för cyklister har utvecklats tillsammans med ett Lundabolag. Samtidigt försvinner en detalj som flörtat med Hövdings ursprung.\n– För det ber jag om ursäkt till alla i Malmö! säger Alexander Haag, vd för Isi Wearables.", "link": "https://www.hd.se/naringsliv/hovdings-comeback-sa-vill-nya-agaren-vinna-tillbaka-cyklisterna-A4fnC/", "date_display": "2026-04-18", "date_iso": "2026-04-18T18:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Here are Ozempic's unexpected side effects – surprised the researchers", "summary": "A large study spanning a decade shows that so-called GLP-1 drugs, such as the weight-loss drugs Ozempic and Wegovy, can also reduce the risk of mental illness.  Researchers from the University of Eastern Finland, Karolinska Institutet and Griffith University in Australia have used Swedish registers and followed nearly 100,000 people between 2009–2022. \"We investigated the risk of worsening of mental health problems in people who had already been diagnosed with depression, anxiety, or both and who had been prescribed antidiabetic drugs, including GLP-1 receptor agonists,\" write the researchers of the study published in The Lancet Psychiatry. The researchers saw that the more than 20,000 people who used GLP-1 drugs had fewer hospital visits and less sick leave linked to psychological problems. The risk of abuse was also reduced. Above all, it was GLP1 drugs with the substance semaglutide, which can have a positive effect on mental well-being.  During the periods when the study participants used semaglutide, the risk of depression was reduced by 44 percent compared to periods without GLP-1 treatment.  Semaglutide was also linked to reduced risk of substance abuse problems and suicide. - A previous study that examined Swedish registers shows that the use of GLP-1 drugs was associated with a reduced risk of alcohol abuse. Alcohol-related problems often have a negative impact on mood and anxiety, so we expected the effect to be positive in these areas as well, says Mark Taylor, one of the researchers behind the study in a press release. Surprised the researchers Because the study is based on registers, the researchers have not been able to determine exactly how the drugs affect people's well-being, but the clear connection between the medicine and people's well-being surprised the researchers.  - It is possible that, in addition to factors such as reduced alcohol consumption, improved body image in connection with weight loss or better blood sugar control in diabetes, there may also be direct neurobi", "title_original": "Här är Ozempics oväntade bieffekter – överraskade forskarna", "summary_original": "En stor studie som sträcker sig över ett decennium visar att så kallade GLP-1-läkemedel, som viktminskningsmedicinerna Ozempic och Wegovy, också kan minska risken för psykisk sjukdom.  Forskare från Östra Finlands universitet, Karolinska Institutet och Griffith University i Australien har använt svenska register och följt nära 100 000 personer mellan 2009–2022. ”Vi undersökte risken för att psykiska besvär skulle förvärras hos personer som redan hade diagnostiserats med depression, ångest eller båda och som hade ordinerats läkemedel mot diabetes, däribland GLP-1-receptoragonister”, skriver forskarna till studien som publicerats i The Lancet Psychiatry. Forskarna såg att de över 20 000 personer som använt GLP-1-läkemedel hade färre sjukhusbesök och mindre sjukfrånvaro kopplat till psykiska besvär. Även risken för missbruk minskade Framför allt var det GLP1-läkemedel med substansen semaglutid som kan ha positiv inverkan på det psykiska måendet.  Under de perioder då studiens deltagare använde semaglutid var minskade risken för depression med 44 procent jämfört med perioder utan GLP-1-behandling.  Semaglutid kopplades också till minskad risk för missbruksproblem och självmord. – En tidigare studie som undersökt svenska register visar att användning av GLP-1-läkemedel var förknippat med en minskad risk för alkoholmissbruk. Alkoholrelaterade problem har ofta en negativ påverkan på humör och ångest, så vi förväntade oss att effekten skulle vara positiv även inom dessa områden, säger Mark Taylor, en av forskarna bakom studien i ett pressmeddelande. Överraskade forskarna Eftersom studien baseras på register har forskarna inte kunnat fastställa exakt hur läkemedlen påverkar människors mående, men det tydliga sambandet mellan medicinen och människors mående förvånade forskarna.  – Det är möjligt att det, utöver faktorer som minskad alkoholkonsumtion, förbättrad kroppsbild i samband med viktminskning eller bättre blodsockerkontroll vid diabetes, även kan finnas direkta neurobiologiska mekanismer inblandade, till exempel förändringar i hjärnans belöningssystem, säger Markku Lähteenvuo från Östra Finlands universitet i pressmeddelandet.", "link": "https://www.tv4.se/artikel/43yoMefSSyTQ4iry5T5XDK/haer-aer-ozempics-ovaentade-bieffekter", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:58:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/halsa", "/vetenskap", "/studie", "/ozempic", "/glp-1", "/diabetes", "/viktnedgang", "/medicin"]}, {"id": 117, "title": "US plans to board Iran-linked ships", "summary": "The United States plans to board and seize Iranian ships around the world, the Wall Street Journal reports, citing sources. Iran responds with new threats of attacks on ships passing through the Strait of Hormuz.", "title_original": "USA planerar att borda Irankopplade fartyg", "summary_original": "USA planerar att borda och beslagta iranska fartyg runt hela världen, rapporterar Wall Street Journal med hänvisning till källor. Iran svarar med nya hot om attacker mot fartyg som passerar Hormuzsundet.", "link": "https://www.dn.se/varlden/usa-planerar-att-borda-irankopplade-fartyg/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:57:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "This is how Sweden goes to the World Cup: \"Wants to crush Denmark\"", "summary": "Sweden has everything in its own hands before the WC qualifiers. You intend to take that chance. - I want nothing more than to crush Denmark, says Chelsea star Johanna Rytting Kaneryd.", "title_original": "Så går Sverige till VM: ”Vill krossa Danmark”", "summary_original": "Sverige har allt i egna händer inför VM-kvalavslutningen. Den chansen tänker man ta. – Jag vill inget annat än att krossa Danmark, säger Chelseastjärnan Johanna Rytting Kaneryd.", "link": "https://www.hd.se/sport/sa-gar-sverige-till-vm-vill-krossa-danmark/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:55:42+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "This is how Sweden goes to the World Cup: \"Wants to crush Denmark\"", "summary": "Sweden has everything in its own hands before the WC qualifiers. You intend to take that chance. - I want nothing more than to crush Denmark, says Chelsea star Johanna Rytting Kaneryd.", "title_original": "Så går Sverige till VM: ”Vill krossa Danmark”", "summary_original": "Sverige har allt i egna händer inför VM-kvalavslutningen. Den chansen tänker man ta. – Jag vill inget annat än att krossa Danmark, säger Chelseastjärnan Johanna Rytting Kaneryd.", "link": "https://www.sydsvenskan.se/sport/sa-gar-sverige-till-vm-vill-krossa-danmark/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:55:42+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Reacting to the US decision: \"Bad for Europe - and for Ukraine\"", "summary": "A week ago, US Treasury Secretary Scott Bessent said the temporary relief on Russian oil would not be extended. Despite that, the Trump administration took the decision on Friday to extend the sanctions relief. Reuters reports.  - Ukraine was not happy last time. This is also a bit surprising, says military expert Joakim Paasikivi. From a Russian perspective, this will mean a much-needed addition to the Russian coffers. - It will be a capital injection to Russia, but at the same time oil prices have fallen with the latest announcement, so it is not the same high price as just now, which is of course good for Europe and Ukraine, he says. Russia's oil and gas revenues rose sharply in March, reaching the highest level in two years, according to new compilations from the Center for Research on Energy and Clean Air. During the month, revenues rose by over 50 percent compared to February, which further strengthens the Russian war chest. \"Bad for Europe\" Joakim Paasikivi explains that the Russian income must be weighed against what Ukraine calls \"physical sanctions\", which concern the attacks that the Ukrainians make with robots and drones against Russian oil production. - It is not the case that the Russians can export everything they want completely unhindered, he says. Despite this, he sees the US decision as a heavy blow to the West. - This is bad for Europe, it is bad for Ukraine. It is an emergency measure, let's hope, that comes from the fact that the Americans have not corrected the situation they created in the Gulf, says Paasikivi. Angry Americans Criticism of the decision also comes from the United States. Leading Democratic senators, including Chuck Schumer and Elizabeth Warren, are sharply criticizing the Trump administration for extending sanctions relief that allows the sale of Russian oil. In a joint statement, the senators describe the decision as a complete reversal and believe that the measure benefits Russia while exposing Ukraine", "title_original": "Reagerar på USA:s beslut: ”Dåligt för Europa – och för Ukraina”", "summary_original": "För en vecka sedan sa USA:s finansminister Scott Bessent att de tillfälliga lättnaderna gentemot rysk olja inte skulle förlängas. Trots det tog Trump-administrationen under fredagen beslutet att förlänga sanktionslättnaden. Det rapporterar Reuters.  – Ukraina var inte förtjust förra gången. Det här är ju lite överraskande också, säger militärexperten Joakim Paasikivi. Utifrån ett ryskt perspektiv kommer detta innebära ett välbehövligt tillskott till den ryska kassan. – Det blir en kapitalinjektion till Ryssland men samtidigt har oljepriserna sjunkit med det senaste beskedet, så det är inte samma höga pris som alldeles nyss vilket naturligtvis är bra för Europa och Ukraina, säger han. Rysslands olje‑ och gasintäkter ökade kraftigt i mars och nådde den högsta nivån på två år, enligt nya sammanställningar från forskningscentret Centre for Research on Energy and Clean Air. Under månaden steg intäkterna med över 50 procent jämfört med februari, vilket ytterligare stärker den ryska krigskassan. ”Dåligt för Europa” Joakim Paasikivi förklarar att de ryska inkomsterna måste vägas mot det som Ukraina kallar för ”fysiska sanktioner”, som rör sig om de attacker som ukrainarna gör med robotar och drönare mot rysk oljeproduktion. – Det är inte så att ryssarna helt obehindrat kan exportera allt vad de vill, säger han. Trots detta ser han USA:s beslut som ett hårt slag mot Väst. – Det här är dåligt för Europa, det är dåligt för Ukraina. Det är en nödåtgärd, får vi hoppas, som kommer av att amerikanerna inte har rett ut situationen som de ställde till med i Gulfen, säger Paasikivi. Arga amerikaner Kritiken mot beslutet kommer även från USA. Ledande demokratiska senatorer, däribland Chuck Schumer och Elizabeth Warren, riktar skarp kritik mot Trumpadministrationen för att ha förlängt sanktionslättnader som möjliggör försäljning av rysk olja. I ett gemensamt uttalande beskriver senatorerna beslutet som en helomvändning och menar att åtgärden gynnar Ryssland samtidigt som Ukraina utsätts för intensifierade attacker. De varnar för att lättnaderna riskerar att förlänga kriget. ”President Trump måste sluta låta Putin lura honom och införa ytterligare sanktioner mot Putin, som uppenbarligen inte känner tillräckligt tryck från denna president. Om president Trump inte ändrar kurs kommer kriget i Ukraina att fortsätta och fler oskyldiga människor kommer att dö”, skriver de i ett gemensamt uttalande. ”En injektion i statsapparaten” Joakim Paasikivi förstår kritiken, som även pekar ut USA:s vicepresident J.D. Vance. – Som utomstående betraktare så är det uppenbart att man från amerikansk sida inte tar hänsyn till Ukraina. Det är särskilt tydligt när J.D Vance på Turning Point-galan säger att han är stolt över att ha avslutat stödet till Ukraina, säger han. Hur påverkar detta Rysslands förmåga att fortsätta kriget i Ukraina? – Det blir en injektion i statsapparaten som är ganska illa däran om man följer det som skrivs. För att Ryssland ska kunna återhämta sig skulle det krävas ett fullständigt stopp för sanktioner mot olje- och gasexport under hela året, samtidigt som oljepriset också skulle behöva ligga högre än det har gjort, säger Paasikivi.", "link": "https://www.tv4.se/artikel/6TY3S6MkA3DGMcWAvR3lAe/reagerar-pa-usa-s-beslut-daligt-foer-europa-och-foer-ukraina", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:51:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/ukraina", "/putin", "/vladimir-putin", "/ryssland", "/sanktioner-mot-ryssland", "/oljeproduktion", "/oljepriser"]}, {"id": 121, "title": "BoIS took the first win of the season - punished Ljungskile", "summary": "After starting the Superettan with two losses, BoIS took home the first win of the season at home against Ljungskile. Man of the match: Adam Egnell on a penalty in the 86th minute", "title_original": "BoIS tog säsongens första seger – straffade Ljungskile", "summary_original": "Efter att ha inlett Superettan med två förluster tog BoIS hem säsongens första seger hemma mot Ljungskile. Matchhjälte: Adam Egnell på straff i den 86:e minuten", "link": "https://www.hd.se/sport/bois-tog-sasongens-forsta-seger-straffade-ljungskile/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:46:13+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "H&M is turning things around - but is it enough to regain the fashion throne?", "summary": "After years of headwinds, falling stock prices and tough measures, H&M wants to make a grand comeback with a new flagship store in Stockholm. But are the investments enough to regain the throne on the fashion scene?", "title_original": "H&M skruvar om – men räcker det för att återta modetronen?", "summary_original": "Efter år av motvind, fallande börskurs och tuffa åtgärder vill H&M göra en storslagen återkomst med en ny flaggskeppsbutik i Stockholm. Men räcker satsningarna för att återta tronen på modescenen?", "link": "https://www.dn.se/ekonomi/h-m-skruvar-om-men-racker-det-for-att-aterta-modetronen/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:39:19+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Hostage drama in Kyiv – several dead and injured", "summary": "A man opened fire at a grocery store in Kyiv on Saturday afternoon. Six people have died and nine are receiving hospital treatment for their injuries. Ukrainian police have shot dead the suspected perpetrator after a hostage situation inside the store. According to prosecutor Ruslan Kravchenko, the suspect has been identified as a Moscow-born 58-year-old man.", "title_original": "Gisslandrama i Kiev – flera döda och skadade", "summary_original": "En man öppnade på lördagseftermiddagen eld vid en mataffär i Kiev. Sex personer har dött och nio får sjukhusvård för sina skador. Ukrainsk polis har skjutit ihjäl den misstänkte gärningsmannen efter en gisslansituation inne i affären. Enligt åklagare Ruslan Kravchenko har den misstänkte identifierats som en Moskvafödd 58-årig man.", "link": "https://www.dn.se/varlden/gisslandrama-i-kiev-flera-doda-och-skadade/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:20:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The Pope: Uninterested in debating with Trump", "summary": "Pope Leo XIV says he regrets that his remarks were interpreted as a response to criticism from Donald Trump.", "title_original": "Påven: Ointresserad av att debattera med Trump", "summary_original": "Påve Leo XIV säger att han beklagar att hans uttalanden tolkats som ett svar på kritik från Donald Trump.", "link": "https://www.dagen.se/nyheter/paven-ointresserad-av-att-debattera-med-trump/10305001", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:14:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "\"Magda\" during emotional eulogy: \"This is just the beginning\"", "summary": "Together, they have played 454 international football matches. On Saturday, Magdalena Eriksson, Linda Sembrant, Jonna Andersson and Hanna Glas were sent off to tears and cheers at the national arena in Solna. - This has been a journey together with the fans, said an emotional \"Magda\".", "title_original": "”Magda” under känslosam avtackning: ”Det här är bara början”", "summary_original": "Tillsammans har de spelat 454 fotbollslandskamper. På lördagen tackades Magdalena Eriksson, Linda Sembrant, Jonna Andersson och Hanna Glas av till tårar och jubel på nationalarenan i Solna. – Det här har varit en resa tillsammans med fansen, sade en känslosam ”Magda”.", "link": "https://www.dn.se/sport/magda-under-kanslosam-avtackning-det-har-ar-bara-borjan/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:07:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Now the cottages are being demolished - to make way for a new district", "summary": "The demolition of the terminated tenants' cottages is in full swing.  At the same time, the City of Landskrona is redrawing the plans for the residential area that will replace the allotments. - We have analyzed and ventilated, and then landed on a significantly lower proposal, says Johan Nilsson, head of urban planning.", "title_original": "Nu rivs stugorna – för att ge plats åt ny stadsdel", "summary_original": "Rivningen av de uppsagda arrendatorernas stugor är i full gång.  Samtidigt håller Landskrona stad på att rita om planerna för det bostadsområde som ska ersätta kolonilotterna. – Vi har analyserat och ventilerat, och då landat i ett betydligt lägre förslag, säger Johan Nilsson, stadsbyggnadschef.", "link": "https://www.hd.se/landskrona/nu-rivs-stugorna-for-att-ge-plats-at-ny-stadsdel/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "That's why the low-key singer from Lund is making his cinema debut in a new acclaimed film", "summary": "Now you can both see and hear the singer-songwriter I'm Kingfisher in the new Swedish film \"Biodlaren\". Thomas Jonsson from Lund makes his film debut and releases a new album.", "title_original": "Därför gör lågmälde sångaren från Lund biodebut i ny hyllad film", "summary_original": "Nu kan man både se och höra singer-songwritern I’m Kingfisher i den nya svenska filmen ”Biodlaren”. Thomas Jonsson från Lund gör filmdebut och släpper nytt album.", "link": "https://www.sydsvenskan.se/dygnet-runt/darfor-gor-lagmalde-sangaren-fran-lund-biodebut-i-ny-hyllad-film/", "date_display": "2026-04-18", "date_iso": "2026-04-18T17:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Loss for Eta in the historic debut", "summary": "Marie-Louise Eta has written history.  But the head coaching debut with Union Berlin ended with a 1–2 loss against Wolfsburg in the Bundesliga.", "title_original": "Förlust för Eta i den historiska debuten", "summary_original": "Marie-Louise Eta har skrivit historia.  Men huvudtränardebuten med Union Berlin slutade med en 1–2-förlust mot Wolfsburg i Bundesliga.", "link": "https://www.sydsvenskan.se/sport/forlust-for-eta-i-den-historiska-debuten/", "date_display": "2026-04-18", "date_iso": "2026-04-18T16:59:35+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Eskilsminne lost the victory in the final minutes", "summary": "Eskilsminne's coach Roar Hansen.", "title_original": "Eskilsminne tappade segern i slutminuterna", "summary_original": "Eskilsminnes tränare Roar Hansen.", "link": "https://www.hd.se/sport/eskilsminne-tappade-segern-i-slutminuterna-YrXGY/", "date_display": "2026-04-18", "date_iso": "2026-04-18T16:49:26+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "After the crisis: The ambulance service must be saved - by the neighbours", "summary": "The lack of ambulance personnel in Stockholm led to a minor crisis in the summer of 2025. Employees complained of an extreme load and several ambulances stood still for a period. - On several occasions, we have had between five and ten ambulances standing still for a day in Region Stockholm. It doesn't just lead to longer waiting times - in the worst case, it can mean that an ambulance doesn't make it in time, said Johan Nestin, ambulance nurse and elected official in the Vårdförbundet in Solna, to TV4 Nyheterna. For one day, only one ambulance was on duty in the Stockholm City catchment area, which includes Norrmalm, Vasastan, Östermalm, Kungsholmen and nearby areas. Normally, at least three ambulances - and preferably more - should be on duty at all hours of the day, according to the ambulance nurse and safety representative Emil Skoglund. The rescue: Finnish nurses Now the Stockholm Region is planning for the coming summer, and to cover up the ambulance operations, new staff must be recruited - from Finland. \"A special investment is aimed at recruiting nurses from Finland,\" the region writes in a press release. The region further writes that staffing should be increased by employees being able to voluntarily postpone vacation days for extra compensation. \"The starting point for the planning is to ensure that those who work have a good working environment and can take care of the patients' needs, while at the same time colleagues get holidays\".", "title_original": "Efter krisen: Ambulanssjukvården ska räddas – av grannarna", "summary_original": "Bristen på ambulanspersonal i Stockholm ledde till en smärre kris sommaren 2025. Anställda vittande om en extrem belastning och flera ambulanser stod stilla under en period. – Vid flera tillfällen har vi haft mellan fem och tio ambulanser som står stilla under ett dygn i Region Stockholm. Det leder inte bara till längre väntetider – det kan i värsta fall innebära att en ambulans inte hinner fram i tid, sa Johan Nestin, ambulanssjuksköterska och förtroendevald i Vårdförbundet i Solna, till TV4 Nyheterna. Under en dag var bara en ambulans i tjänst i upptagningsområdet Stockholm City, som omfattar Norrmalm, Vasastan, Östermalm, Kungsholmen och närliggande områden. Normalt ska minst tre ambulanser – och helst fler – vara i tjänst under dygnets alla timmar, enligt ambulanssjuksköterskan och skyddsombudet Emil Skoglund. Räddningen: Finska sjuksköterskor Nu planerar Region Stockholm för den kommande sommaren, och för att täcka upp inom ambulansverksamheten ska man rekrytera ny personal – från Finland. ”En särskild satsning riktas mot att rekrytera sjuksköterskor från Finland”, skriver regionen på ett pressmeddelande. Regionen skriver vidare att bemanningen ska ökas genom att medarbetare frivilligt ska kunna förskjuta semesterdagar mot extra ersättning. ”Utgångspunkten för planeringen är att säkerställa att de som arbetar har en god arbetsmiljö och kan ta hand om patienternas behov, samtidigt som kollegor får semester”.", "link": "https://www.tv4.se/artikel/7zhTAaIIoJkajcvaxMEBoe/efter-krisen-ambulanssjukvarden-ska-raeddas-av-finland", "date_display": "2026-04-18", "date_iso": "2026-04-18T16:08:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ambulans", "/natodebatten/finland", "/stockholm", "/sjukvard", "/region-stockholm"]}, {"id": 131, "title": "He is Bob Hund's seventh member", "summary": "Old Helsingin resident Martin Kann has been described as \"Bob Hund's seventh member\". Now he brings his own show to The Tivoli. It reveals, among other things, how the pipe-smoking dog came to be.", "title_original": "Han är Bob Hunds sjunde medlem", "summary_original": "Den gamle helsingborgaren Martin Kann har beskrivits som ”Bob Hunds sjunde medlem”. Nu kommer han med sin egen föreställning till The Tivoli. Där avslöjas bland annat hur den piprökande hunden blev till.", "link": "https://www.hd.se/helsingborg/han-ar-bob-hunds-sjunde-medlem/", "date_display": "2026-04-18", "date_iso": "2026-04-18T16:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Takida singer releases solo album: \"It's expensive to have this diagnosis\"", "summary": "After nearly 30 years as frontman in successful rock bands, Robert Pettersson is now releasing albums under his own name. DN has spoken to the singer about the creation of music, his struggle against the peaks and valleys of bipolarity and about why the old training room in Ånge is filled with fishing equipment.", "title_original": "Takidasångaren släpper soloplatta: ”Det är kostsamt att ha den här diagnosen”", "summary_original": "Efter närmare 30 år som frontman i framgångsrika rockband släpper Robert Pettersson nu album under eget namn. DN har pratat med sångaren om musikskapandet, hans kamp mot bipolaritetens toppar och dalar och om varför den gamla replokalen i Ånge fyllts av fiskeutrustning.", "link": "https://www.dn.se/kultur/takidasangaren-slapper-soloplatta-det-ar-kostsamt-att-ha-den-har-diagnosen/", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:58:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Six dead in hostage drama in Kiev - suspected terror", "summary": "Six people have been killed and several injured in the Ukrainian capital, Kyiv. The designated shooter held several people hostage in a grocery store before he was shot dead by police. The man has now been identified as a 58-year-old man born in Moscow and the incident is being investigated as an act of terrorism.", "title_original": "Sex döda i gisslandrama i Kiev – misstänkt terror", "summary_original": "Sex personer har dödats och flera skadats i Ukrainas huvudstad Kiev. Den utpekade skytten höll flera personer gisslan i en matbutik innan han sköts ihjäl av polis. Mannen har nu identifierats som en 58-årig Moskvafödd man och händelsen utreds som ett terrordåd.", "link": "https://www.svd.se/a/wr3B3P/gisslandrama-i-ukrainas-huvudstad-kiev", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:57:41+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 134, "title": "Norwegian man charged with murder after suspected euthanasia in Sweden", "summary": "The euthanasia activist Steinar Wangen has been charged with the murder of a woman in Trollhättan in 2024. Wangen has previously called himself a \"serial killer\".", "title_original": "Norsk man åtalas för mord efter misstänkt dödshjälp i Sverige", "summary_original": "Dödshjälpsaktivisten Steinar Wangen har åtalats för mord på en kvinna i Trollhättan 2024. Wangen har tidigare kallat sig för en ”seriemördare”.", "link": "https://www.dn.se/varlden/norsk-man-atalas-for-mord-efter-misstankt-dodshjalp-i-sverige/", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:57:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Swedish victory against Serbia in the World Cup qualifier - in the end: \"Relief\"", "summary": "It looked like the Swedish goal-scoring was going haywire. But in the end it was 1–0 in the WC qualifier at home against Serbia. Thus, the dream of a direct place at the football festival in 2027 lives on. - A relief, says goal scorer Stina Blackstenius.", "title_original": "Svensk seger mot Serbien i VM-kvalet – till slut: ”Lättnad”", "summary_original": "Det såg ut att gå troll i det svenska målskyttet. Men till slut blev det 1–0 i VM-kvalet hemma mot Serbien. Därmed lever drömmen om en direktplats till fotbollsfesten 2027. – En lättnad, säger målskytten Stina Blackstenius.", "link": "https://www.dn.se/sport/svensk-seger-mot-serbien-i-vm-kvalet-till-slut/", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:52:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "See the \"extremely unusual\" bird - several hundred miles from home", "summary": "It is usually the cherry blossoms that attract the most visitors to Kungsträdgården in Stockholm in the spring. But right now, it's something completely different that has people gathering in the park. Bird enthusiasts from all over the country have made their way to central Stockholm to catch a glimpse of the ring-billed gull – a very unusual guest in Sweden who has been seen in Kungsträdgården for the second year in a row. - It is very unusual and there have not been many finds before, says bird watcher Mårten Wikström. The seagull stayed in the area for much of last summer and reappeared about a week ago. According to experts, it is likely the same individual is back. Similar to a seagull - but with clear characteristics At first glance, the ring-billed seagull can be easily confused with an ordinary, less conspicuous, seagull. But if you look closer, there are clear differences. - It has a light iris, while the seagull has a dark iris. And it has a very clear black ring around its beak, says Mårten Wikström. The ring-billed gull does not really belong in Sweden. The species breeds in the northern United States and Canada and winters further south. The fact that it appeared in the middle of Stockholm is believed to be because it flew the wrong way. - Either it got its compass wrong, many young birds can get that. It could also be that it ended up in a storm that drove it very wrong, says Yvonne Blombäck, chairman of Stockholm's ornithological association.", "title_original": "Se den ”jätteovanliga” fågeln – flera hundra mil hemifrån", "summary_original": "Det brukar vara körsbärsblomningen som lockar flest besökare till Kungsträdgården i Stockholm på våren. Men just nu är det något helt annat som fått människor att samla sig i parken. Fågelentusiaster från hela landet har nämligen tagit sig till centrala Stockholm för att få en skymt av den ringnäbbade måsen – en mycket ovanlig gäst i Sverige som för andra året i rad har synts till i Kungsträdgården. – Den är jätteovanlig och det har inte varit många fynd innan, säger fågelskådaren Mårten Wikström. Måsen höll till i området stora delar av förra sommaren och dök upp igen för ungefär en vecka sedan. Enligt experter är det sannolikt samma individ som är tillbaka. Lik fiskmås – men med tydliga kännetecken Vid första anblicken kan den ringnäbbade måsen vara lätt att förväxla med en vanlig, mindre uppseendeväckande, fiskmås. Men tittar man närmare finns tydliga skillnader. – Den har en ljus iris, medan fiskmåsen har en mörk iris. Och så har den en väldigt tydlig svart ring runt näbben, säger Mårten Wikström. Den ringnäbbade måsen hör egentligen inte hemma i Sverige. Arten häckar i norra USA och Kanada och övervintrar längre söderut. Att den dykt upp mitt i Stockholm tros bero på att den flugit fel. – Antingen har den fått fel på sin kompass, det kan många ungfåglar få. Det kan också vara så att den hamnat i ett oväder som drivit den väldigt fel, säger Yvonne Blombäck, ordförande i Stockholms ornitologiska förening.", "link": "https://www.tv4.se/artikel/3jNY3HeR9WvQov13XBZQn5/se-den-jaetteovanliga-fageln-flera-hundra-mil-hemifran", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:48:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/kungstradgarden", "/stockholm", "/trad", "/fagel", "/djur"]}, {"id": 137, "title": "Can you pass the vocabulary part of the college exam?", "summary": "During Saturday, thousands of Swedes completed the university entrance examination. Here you get the opportunity to test whether you can pass the word part of the test.", "title_original": "Klarar du orddelen på högskoleprovet?", "summary_original": "Under lördagen har tusentals svenskar genomfört högskoleprovet. Här får du möjlighet att testa om du klarar orddelen av provet.", "link": "https://www.svd.se/a/K8rgO4/hogskoleprovet-2026-klarar-du-alla-ord-i-orddelen", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:13:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 138, "title": "Gunman opened fire in Kyiv - and took hostages in a supermarket", "summary": "Another 15 people are said to have been injured in the shooting drama, Kyiv mayor Vitaly Klytchko says on Telegram. According to the medical service, a child is among the injured. \"Ukraine's Interior Minister Igor Klymenko has just announced that the attacker in Kiev who opened fire on civilians has been eliminated. All circumstances are being investigated. Currently, five people have been confirmed dead. My condolences to the families and relatives,\" Zelenskyy wrote in a post on X after the killing. Another person later died in hospital, bringing the death toll to six. Furthermore, Zelenskyi stated that he expects a quick investigation of the incident and that several police institutions are cooperating in the investigation work. Took hostage in supermarket The incident occurred in a residential area in the southern parts of the city late on Saturday afternoon local time when the shooter opened fire in an open street. Pictures from the UNIAN news agency that AFP refers to are said to show a gunman shooting another person at close range next to an apartment building. The images have not yet been able to be verified by AFP. The man then entered and barricaded himself in a supermarket. At the same time, special forces from the police were sent to the scene. - A special operation to arrest the man who opened fire and who is currently inside a supermarket is underway. According to preliminary reports, gunfire can also be heard inside the supermarket, Kyiv Mayor Vitaly Klytchko said in connection with the operation, according to AFP. 58-year-old Moscow-born man Shortly after 5 p.m. Swedish time, the perpetrator had been killed after a roughly 40-minute long hostage drama. - We tried to persuade him. When we realized there was probably an injured person in there, we offered to bring tourniquets with us to stop the bleeding... But he didn't respond, Klymenko told reporters at the scene. - That is why the order was given to eliminate him, he added. One of the people taken hostage was killed by the man, while four could be rescued. According to prosecutors, the perpetrator has been identified as a Moscow man", "title_original": "Vapenman öppnade eld i Kiev – och tog gisslan i stormarknad", "summary_original": "Ytterligare 15 personer ska ha skadats i skottdramat, uppger Kievs borgmästare Vitalij Klytjko på Telegram. Enligt sjukvården finns ett barn bland de skadade. ”Ukrainas inrikesminister Igor Klymenko har just meddelat att angriparen i Kiev som öppnade eld mot civila har eliminerats. Alla omständigheter utreds. För närvarande har fem personer bekräftats döda. Mina kondoleanser till familjerna och anhöriga”, skrev Zelenskyj i ett inlägg på X efter dådet. Ytterligare en person dog senare på sjukhus, varpå dödstalet skrevs upp till sex. Vidare uppgav Zelenskyj att han väntar sig en snabb utredning av händelsen och att flera polisinstitutioner samarbetar i utredningsarbetet. Tog gisslan i stormarknad Händelsen inträffade i ett bostadsområde i stadens södra delar sent på lördagseftermiddagen lokal tid då skytten öppnade eld på öppen gata. Bilder från nyhetsbyrån UNIAN som AFP hänvisar till uppges visa hur en beväpnad man skjuter en annan person på nära håll intill en lägenhetsbyggnad. Bilderna har ännu inte kunnat verifieras av AFP. Mannen tog sig därefter in i och barrikaderade sig i en stormarknad. Samtidigt skickades specialstyrkor från polisen till platsen. – En specialinsats för att gripa mannen som öppnade eld och som för närvarande befinner sig inne i en stormarknad pågår. Enligt preliminära rapporter hörs även skottlossning inne i stormarknaden, uppgav Kievs borgmästare Vitalij  Klytjko i samband med insatsen enligt AFP. 58-årig Moskvafödd man Strax efter klockan 17 svensk tid hade gärningsmannen dödats efter ett cirka 40 minuter långt gisslandrama. – Vi försökte övertala honom. När vi insåg att det troligen fanns en skadad person där inne erbjöd vi oss att ta med oss tourniqueter för att stoppa blödningen... Men han svarade inte, sade Klymenko till reportrar på platsen. – Därför gavs ordern att eliminera honom, tillade han. En av de personer som tagits gisslan dödades av mannen medan fyra kunde räddas. Gärningsmannen har enligt åklagare identifierats som en Moskvafödd 58-årig man. Han ska ha använt ett automatvapen under dådet.  Ukrainas säkerhetstjänst utreder skjutningen som ett terrordåd, rapporterar nyhetsbyrån Reuters.", "link": "https://www.tv4.se/artikel/6Z1vLG5AQpXAWpb4m1lmXE/vapenman-oeppnade-eld-i-kiev-flera-doeda", "date_display": "2026-04-18", "date_iso": "2026-04-18T15:05:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukraina", "/kiev", "/skottlossning"]}, {"id": 139, "title": "Employed in the Church of Sweden and elected to the Left Party's party board", "summary": "Nina Berggård (V) to Dagen: \"I'm that believing Tornedale who is a leftist.\"", "title_original": "Anställd i Svenska kyrkan och invald i Vänsterpartiets partistyrelse", "summary_original": "Nina Berggård (V) till Dagen: ”Jag är den där troende tornedalingen som är vänsterpartist.”", "link": "https://www.dagen.se/nyheter/anstaelld-i-svenska-kyrkan-och-invald-i-vaensterpartiets-partistyrelse/10304829", "date_display": "2026-04-18", "date_iso": "2026-04-18T14:45:40+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Iran's threat: Attacks any ship that approaches", "summary": "Iran said on Saturday that the strait has been closed again, in response to the continued US blockade of Iranian ports. At the same time, the Revolutionary Guard threatens to attack all ships approaching the strait.", "title_original": "Irans hot: Anfaller alla fartyg som närmar sig", "summary_original": "Iran sade på lördagen att sundet återigen har stängts, som svar på USA:s fortsatta blockad av iranska hamnar. Samtidigt hotar revolutionsgardet med att attackera alla fartyg som närmar sig sundet.", "link": "https://www.svd.se/a/vrlJLl/kanonbatar-oppnade-eld-hormuzsundet-stangt-igen-i-protest-mot-usa-s-blockad", "date_display": "2026-04-18", "date_iso": "2026-04-18T14:21:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 141, "title": "Three possible scenarios as the ceasefire nears its end", "summary": "The expert: Trump's ignorance makes it difficult for the US to withdraw", "title_original": "Tre möjliga scenarier när vapenvilan närmar sig sitt slut", "summary_original": "Experten: Trumps okunnighet gör det svårt för USA att dra sig ur", "link": "https://www.tv4.se/artikel/QuDM7zH3jzj3mdUO5VjYJ/tre-moejliga-scenarier-naer-vapenvilan-naermar-sig-sitt-slut", "date_display": "2026-04-18", "date_iso": "2026-04-18T13:36:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 142, "title": "Lemon and poppy seed cookies", "summary": "Today's weekend tip offers cookies with a clear lemon flavor, sweetness from white chocolate and a light crunch from poppy seeds. Think lemon cake with poppy seeds, but in cookie form.  See Camilla Hamid's recipe", "title_original": "Citron- och vallmocookies", "summary_original": "Dagens helgtips bjuder på cookies med tydlig citronsmak, sötma från vit choklad och ett lätt crunch från vallmofrön. Tänk citronkladdkaka med vallmo, fast i cookie-form.  Se Camilla Hamids recept", "link": "https://www.tv4.se/artikel/IqKO9CRQQRCDwuWm1ZGu5/citron-och-vallmocookies", "date_display": "2026-04-18", "date_iso": "2026-04-18T13:30:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kökets helgtips", "/kokets-helgtips", "/camilla-hamid", "/koket", "/mat"]}, {"id": 143, "title": "The British worry about the beer - that's how the situation looks in Sweden", "summary": "Rising energy prices as a result of the war in the Middle East is putting pressure on the supply of carbon dioxide in the UK, reports Politico. The gas is central to beer production - something that prompted Trade Minister Peter Kyle to go out and reassure the public on Thursday. - People can continue to enjoy their beer, their meat and their salads, he said according to Politico. The concern gained momentum after information that British authorities, according to The Times, have drawn up contingency plans for a possible lack of carbon dioxide if the conflict between the US and Iran were to continue to affect shipping through the Strait of Hormuz. Leaked plans behind the concerns It's about a leaked government document that warns that a long-term disruption could have consequences for the food and beverage industry. Carbon dioxide is used, among other things, to package meat and dairy products and when slaughtering animals.  At the same time, Politico states that a trade agreement between the United Kingdom and the United States from last year, which was negotiated under the leadership of Donald Trump, contributed to weakening the British production of carbon dioxide. To reduce the risk of shortages, the British government has recently stepped in with a support package to restart production at a plant in the north of England. At the same time, the pub and brewery industry downplays the concerns. The British industry organization British Beer and Pub Association states that it currently sees no acute risk of a beer shortage, but follows developments in close dialogue with the government. \"We are not aware of any urgent problems\", they write in an email to TV4 Nyheterna. The situation in Sweden In Sweden, the situation is assessed as stable. According to Sveriges Bryggerier, there is currently no corresponding concern here. Swedish breweries are largely self-sufficient in carbon dioxide through recycling from their own fermentation process. The carbon dioxide needed in addition to that comes mainly from Nordic producers. \"On the other hand, of course, Swedish breweries and the beverage market are dependent on a stable supply in the market\", skri", "title_original": "Britterna oroar sig för ölen – så ser läget ut i Sverige", "summary_original": "Stigande energipriser till följd av kriget i Mellanöstern sätter press på tillgången på koldioxid i Storbritannien, rapporterar Politico. Gasen är central för ölproduktion – något som fick handelsminister Peter Kyle att gå ut och lugna allmänheten under torsdagen. – Folk kan fortsätta njuta av sin öl, sitt kött och sina sallader, sa han enligt Politico. Oron tog fart efter uppgifter om att brittiska myndigheter, enligt The Times, tagit fram beredskapsplaner för en möjlig brist på koldioxid om konflikten mellan USA och Iran fortsatt skulle komma att påverka sjöfarten genom Hormuzsundet. Läckta planer bakom oron Det handlar om ett läckt regeringsdokument som varnar för att en långvarig störning kan få konsekvenser för livsmedels- och dryckesindustrin. Koldioxid används bland annat för att förpacka kött och mejeriprodukter och vid slakt av djur.  Samtidigt konstaterar Politico att ett handelsavtal mellan Storbritannien och USA från förra året, som förhandlades fram under Donald Trumps ledning, bidragit till att försvaga den brittiska produktionen av koldioxid. För att minska risken för brist har den brittiska regeringen nyligen gått in med ett stödpaket för att återstarta produktionen vid en anläggning i norra England. Samtidigt tonar pub- och bryggeribranschen ned oron. Den brittiska branschorganisation British Beer and Pub Association uppger att man i nuläget inte ser någon akut risk för ölbrist, men följer utvecklingen i nära dialog med regeringen. ”Vi känner inte till några akuta problem”, skriver de i ett mejl till TV4 Nyheterna. Läget i Sverige I Sverige bedöms situationen som stabil. Enligt Sveriges Bryggerier finns det i dagsläget ingen motsvarande oro här. Svenska bryggerier är till stor del självförsörjande på koldioxid genom återvinning från den egna jäsningsprocessen. Den koldioxid som behövs utöver det kommer främst från nordiska producenter. ”Däremot är naturligtvis svenska bryggerier och dryckesmarknaden beroende av en stabil tillgång på marknaden”, skriver Katja Werner, policy- och kommunikationsansvarig på Sveriges Bryggerier, i ett mejl. Samtidigt understryker Sveriges Bryggerier att koldioxid är avgörande för stora delar av dryckesproduktionen. ”Om tillgång på kolsyra skulle försämras så påverkar det möjligheten att tillverka och tappa drycker, primärt kolsyrat vatten, läsk och cider men även öl i ett längre perspektiv. Det påverkar också möjligheten att tappa upp öl från fatölsanläggningar eftersom de i många fall drivs med kolsyra”, skriver hon.", "link": "https://www.tv4.se/artikel/6Id712kJ8q78rW0OinGeK4/britterna-oroar-sig-foer-oelen-sa-ser-laeget-ut-i-sverige", "date_display": "2026-04-18", "date_iso": "2026-04-18T13:09:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/alkohol", "/dryck", "/mat-och-dryck", "/storbritannien"]}, {"id": 144, "title": "Increased risk of El Niño - rumors of \"super variant\"", "summary": "Early forecasts from the US ocean and weather agency NOAA indicate that the El Niño phenomenon may be on its way. After suspicions about how strong it can become, the American media have flagged a \"Super-El Niño\" or \"Godzilla-El Niño\". - Some forecasts indicate that it may be stronger this year, while others show the opposite. Right now it is too early to say, says Erik Kjellström, professor of climatology. El Niño occurs when the waters of the Pacific Ocean warm, causing some neighboring areas to experience drought and wildfires, while other parts experience increased rainfall, flooding and a higher risk of hurricanes. - It often leads to extensive fires in Australia and floods along the Peruvian and Chilean coasts, says TV4 Nyheternas meteorologist Madeleine Westin. 62 percent probability The last major round of El Niño was in 2024 and since then it has been colder, which is called La Niña. According to NOAA, there is a 62 percent chance that El Niño will occur this summer and a one-third chance that it will be strong between October and December. The weather phenomenon usually occurs at an interval of two and seven years. The most likely consequence for Sweden is that certain food items become more expensive - and that the price of coffee skyrockets.  - The drought affects agriculture, harvest and can therefore have an impact on food prices. Where a lot of coffee is grown, it is usually dry, and there can be problems, says Erik Kjellström. - In the affected areas, many people have to relocate temporarily during these periods. The number of climate refugees may then increase as people are forced from their homes and houses. Colder waters in the Atlantic At the same time that El Niño hits parts of the world hard, there are others who benefit. Hurricane season usually becomes milder the stronger El Niño is. - A strong El Niño reduces the likelihood of an active hurricane season because the water gets colder in the eastern parts of the Atlantic where hurricanes are born, says Madeleine Westin. You won't know more until the summer", "title_original": "Ökad risk för El Niño – ryktas om ”supervariant”", "summary_original": "Tidiga prognoser från den amerikanska havs- och vädermyndigheten NOAA tyder på att fenomenet El Niño kan vara på väg. Efter misstankar om hur stark den kan bli har amerikanska medier flaggat för en ”Super-El Niño” eller ”Godzilla-El Niño”. – Vissa prognoser pekar på att den kan bli kraftigare i år, medan andra visar motsatsen. Just nu är det för tidigt att säga, menar Erik Kjellström, professor i klimatologi. El Niño inträffar när vattnet i Stilla havet värms upp, vilket leder till att vissa angränsande områden drabbas av torka och skogsbränder, medan andra delar får ökad nederbörd, översvämningar och högre risk för orkaner. – Det leder ofta till omfattande bränder i Australien och översvämningar längs den peruanska och chilenska kusten, säger TV4 Nyheternas meteorolog Madeleine Westin. 62 procents sannolikhet Den senaste stora omgången av El Niño var 2024 och sedan dess har det varit kallare, vilket kallas La Niña. Enligt NOAA är det 62 procents sannolikhet att El Niño inträffar i sommar och en tredjedels sannolikhet att den blir stark mellan oktober och december. Väderfenomenet inträffar vanligtvis med ett intervall om två och sju år. Den mest sannolika konsekvensen för Sverige är att vissa matvaror blir dyrare – och att kaffepriset skenar.  – Torkan påverkar jordbruk, skörd och kan därför ha en inverkan på livsmedelspriserna. Där man odlar mycket kaffe brukar det vara torrt, och där kan det bli problem, säger Erik Kjellström. – I de områden som drabbas måste många flytta på sig tillfälligt under dessa perioder. Antalet klimatflyktingar kan öka då eftersom folk tvingas från sina hem och hus. Kallare vatten i Atlanten Samtidigt som El Niño slår hårt mot delar av världen finns det andra som gynnas. Orkansäsongen blir vanligtvis mildare ju starkare El Niño är. – En stark El Niño minskar sannolikheten för en aktiv orkansäsong eftersom att vattnet blir kallare i de östra delarna av Atlanten där orkanerna föds, säger Madeleine Westin. Först till sommaren vet man mer om hur stark El Niño kan komma att bli. Enligt Erik Kjellström gör klimatförändringarna att El Niño framöver får en större påverkan och allvarligare följder. – I ett allt varmare klimat så blir kontrasterna större. Nederbörden kommer öka och konsekvenserna kommer generellt bli större, säger han.", "link": "https://www.tv4.se/artikel/9PioopozfMRtvf1oM3lda/oekad-risk-foer-el-nino-ryktas-om-supervariant", "date_display": "2026-04-18", "date_iso": "2026-04-18T11:31:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Klimat", "/klimat", "/vadret", "/klimatforandringar", "/stilla-havet"]}, {"id": 145, "title": "Expressen warns of an overly political church - losing the trump card", "summary": "The Church of Sweden risks being perceived as any referral body, warns editorial writer - perhaps God is rather on Gunnar Strömmer's side.", "title_original": "Expressen varnar för en alltför politisk kyrka – tappar trumfkortet", "summary_original": "Svenska kyrkan riskerar att uppfattas som vilken remissinstans som helst, varnar ledarskribent – kanske står Gud snarare på Gunnar Strömmers sida.", "link": "https://www.dagen.se/nyheter/expressen-varnar-foer-en-alltfoer-politisk-kyrka-tappar-trumfkortet/10304537", "date_display": "2026-04-18", "date_iso": "2026-04-18T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 146, "title": "Childbirth still low in Sweden - so the trend can be reversed", "summary": "Last week SCB's forecast on Sweden's future population came out, which shows that the country is at risk of population decline within ten years. In 2025, 97,500 children were born and that was the lowest number since 2002. Anna Björklund is a writer and podcaster. She is involved in the government's investigation into childbirth, has children of her own and has written books on the subject.  - Even now, each generation in Sweden is shrinking by 30 percent compared to the previous one. Childbirth has not been this low since measurement began, which probably indicates that it has never been this low in human history.\n\nShe states that it looks the same in all geographical locations and in all income classes in Sweden, but that it also looks the same worldwide.  Several factors influence According to Björklund, childbearing has traditionally been affected by the economy, housing construction, diseases and social crises. But she believes that these factors do not matter to the same extent and that there has been a change in the last decade. - It is cultural. Economics still affects, but what pushes down childbearing so enormously on this scale and throughout the world, it's something new, she says. \"Physically passive\" Björklund states that there are several reasons why childbearing has fallen.  - What we have done in the last 15 years is to eliminate a lot of problems in people's lives. People have learned to control their everyday lives very much. They can be quite physically passive and very much into the internet. A child is a very big crime against that life. You suddenly have to be super present in the room and you can't control your life at all. Patrik Öhberg, docent in political science at the SOM institute in Gothenburg, has researched the reasons behind this development. - We asked 14–15 attitude questions about why you don't want to have children. At the top was that you wanted to focus on other things, but also that you cannot find the right partner and that it is difficult to find a partner with whom you want to have children.\n\nHe believes that cultural and subjective f", "title_original": "Barnafödandet fortsatt lågt i Sverige – så kan trenden vändas", "summary_original": "I förra veckan kom SCB:s prognos om Sveriges framtida befolkning, som visar att landet riskerar befolkningsminskning inom tio år. 2025 föddes 97 500 barn och det var det lägsta antalet sedan 2002. Anna Björklund är författare och poddare. Hon är delaktig i regeringens utredning om barnafödandet, har egna barn och skrivit böcker i ämnet.  – Redan nu krymper varje generation i Sverige med 30 procent mot den förra. Barnafödandet har inte varit så lågt sedan man började mäta vilket nog tyder på att det aldrig varit så lågt någonsin i mänsklighetens historia.\n\nHon konstaterar att det ser likadant ut på alla geografiska platser och i alla inkomstklasser i Sverige men att det också ser likadant ut världen över.  Flera faktorer påverkar Enligt Björklund har barnafödandet traditionellt påverkats av ekonomi, bostadsbyggande, sjukdomar och samhällskriser. Men hon menar att dessa faktorer inte spelar roll i samma utsträckning och att det skett en förändring senaste decenniet. – Det är kulturellt. Ekonomi påverkar fortfarande men det som trycker ner barnafödandet så enormt i den här skalan och i hela världen, det är någonting nytt, säger hon. ”Fysiskt passiva” Björklund konstaterar att det finns flera anledningar till att barnafödandet sjunkit.  – Det vi gjort de senaste 15 åren är att eliminera massa problem i människors liv. Människor har lärt sig kontrollerar sin vardag väldigt mycket. De kan vara ganska fysiskt passiva och väldigt uppe i internet. Ett barn är ett väldigt stort brott mot det livet. Man måste plötsligt vara supernärvarande i rummet och man kan inte alls kontrollera sitt liv. Patrik Öhberg, docent i statsvetenskap vid SOM-institutet i Göteborg har forskat om orsakerna bakom den här utvecklingen. – Vi ställde 14–15 attitydfrågor kring varför man inte vill skaffa barn. I topp var att man ville fokusera på annat men också att man inte hittar rätt partner och att det är svårt att hitta en partner man vill skaffa barn med.\n\nHan menar att kulturella och subjektiva förklaringar ökat och blivit allt viktigare.   – Men jag vill säga några saker som är positiva. Människor vill skaffa barn och att barn kan vara berikande för sitt liv håller även de utan barn med om. Man tycker också att staten borde agera för att göra någonting så det finns potential. Skillnader mellan män och kvinnor Enligt Öhberg vill kvinnor i större utsträckning än män skaffa barn, oavsett politisk hemvist. Mäns inställning påverkas däremot mer av ideologi, där män på vänstersidan är mindre intresserade av att bilda familj än män till höger.  – Problemet med det är att män och kvinnor har gått åt olika håll. Den stora andelen kvinnor finns på vänstersidan och männen på högersidan, men de möts inte, så det finns ett manligt underskott på vänstersidan. Det är en matchningsproblematik, säger han. Så kan trenden vändas Varken höjt barnbidrag eller ekonomiska incitament tros ha någon större effekt på barnafödandet. Istället lyfter både Björklund och Öhberg vikten av mänskliga möten och framtidstro.  – Exakt vad framtidstro är vet ingen. Men det verkar som att människor som är mycket på internet inte tror så mycket på sig själva, inte på andra människor och inte på relationer. De har inte känslan av att allt ska bli bra. Den känslan och det självförtroendet verkar behövas för beslutet att skaffa barn, säger Björklund.  Men hon menar att situationen kan förändras genom att lyfta problemet genom samtal. – Det kan vara så att det löser sig organiskt inom kulturen på något sätt, säger Anna Björklund.", "link": "https://www.tv4.se/artikel/1DuoJ2KXtT5w6oifuFSlBN/experterna-daerfoer-foeds-faerre-barn-i-sverige", "date_display": "2026-04-18", "date_iso": "2026-04-18T09:02:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/barnafodandet", "/fertilitet", "/scb"]}, {"id": 147, "title": "800,000 tons of carbon dioxide are captured and buried under the seabed", "summary": "The technology is called bio-CCS and means that the carbon dioxide from the combustion of biofuels in the Värtaverket is captured - something that in practice produces negative emissions. And on the night of Saturday, a crucial pipe was put in place – from the facility down to the port.\n\n- Here we are building a new quay where boats will add and load carbon dioxide before it is transported on to Norway, says Tobias Pelicano, deputy director for bio-CCS at Stockholm Exergi. Several million tons from different countries are to be buried. The plan is for everything to be ready in 2028. At that time, approximately 800,000 tons of carbon dioxide per year will be shipped away from the Värtaverket. But Stockholm is not first.\n\nAlready today, around 400,000 tonnes of carbon dioxide is transported per year from a cement factory in Brevik in Norway. And several other European facilities are on their way into the system – including in the Netherlands and Denmark.\n\nIn total, up to three million tons of carbon dioxide per year can be collected and sent to a transshipment terminal outside Bergen before the end of the decade. 100 kilometers out – and 2,600 meters down From the terminal, the carbon dioxide is pumped further into pipes on the seabed. 100 kilometers out into the North Sea, it is pushed down 2,600 meters below the seabed. There it is stored in a water-filled sandstone formation.\n\n- The carbon dioxide is dissolved in the water and stored in a geological formation permanently, says Fridtjof Wisur, who is the commercial director of Northern Lights. \"We are absolutely sure\" He is convinced that the carbon dioxide will not leak out.\n\n- Yes, we are absolutely sure. We monitor both the plant and the storage continuously to ensure that the carbon dioxide stays where it should, says Fridtjof Wisur. Stockholm Exergi believes that the biggest part of the solution to the climate problem involves changing how we drive, what we consume and how we live in general, but that carbon dioxide storage is a piece of the puzzle that is also needed. \n\n- This facility creates the conditions to reach the last bit - but fundamentally we also have to change our behaviour, says Tobias Pelicano.", "title_original": "800 000 ton koldioxid fångas in och begravs under havsbottnen", "summary_original": "Tekniken kallas bio-CCS och innebär att koldioxiden från förbränningen av biobränslen i Värtaverket fångas in – något som i praktiken ger negativa utsläpp. Och natten till lördag lades alltså ett avgörande rör på plats – från anläggningen ner till hamnen.\n\n– Här bygger vi en ny kaj där båtar ska lägga till och lasta koldioxid innan den transporteras vidare till Norge, berättar Tobias Pelicano, biträdande direktör för bio-CCS vid Stockholm Exergi. Flera miljoner ton från olika länder ska begravas Planen är att allt ska stå klart 2028. Då ska cirka 800 000 ton koldioxid per år skeppas iväg från Värtaverket. Men Stockholm är inte först.\n\nRedan i dag transporteras omkring 400 000 ton koldioxid per år från en cementfabrik i Brevik i Norge. Och flera andra europeiska anläggningar är på väg in i systemet – bland annat i Nederländerna och Danmark.\n\nTotalt kan upp till tre miljoner ton koldioxid per år samlas in och skickas till en omlastningsterminal utanför Bergen innan decenniet är slut. 100 kilometer ut – och 2 600 meter ner Från terminalen pumpas koldioxiden vidare i rör på havsbottnen. 100 kilometer ut i Nordsjön trycks den ner 2 600 meter under havsbotten. Där lagras den i en vattenfylld sandstensformation.\n\n– Koldioxiden löses i vattnet och lagras i en geologisk formation permanent, säger Fridtjof Wisur, som är kommersiell direktör för Northern Lights. \"Vi är helt säkra\" Han är övertygad om att koldioxiden inte kommer att läcka ut.\n\n– Ja, vi är helt säkra. Vi övervakar både anläggningen och lagringen kontinuerligt för att säkerställa att koldioxiden stannar där den ska, säger Fridtjof Wisur. Stockholm Exergi menar att den största delen av lösningen av klimatproblemet handlar om att förändra hur vi kör bil, vad vi konsumerar och hur vi lever i stort, men att koldioxidlagringen är en pusselbit som också behövs. \n\n– Den här anläggningen skapar förutsättningar för att nå den sista biten – men i grunden måste vi också ändra våra beteenden, säger Tobias Pelicano.", "link": "https://www.tv4.se/artikel/2cO2eTTZCBL2S60Y2mKu89/800-000-ton-koldioxid-fangas-in-och-begravs-under-havsbottnen", "date_display": "2026-04-18", "date_iso": "2026-04-18T08:58:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/koldioxid", "/miljo", "/nordsjon", "/stockholm"]}, {"id": 148, "title": "The defense of the man accused of prostitution: \"She wanted to be like Julia Roberts\"", "summary": "A man in his 60s in Kramfors is suspected of having sold his wife to over 120 men. The man is also suspected of having led her into a drug addiction. In several text messages, the man commands the woman who she should meet, how she should behave and how much alcohol and drugs she should take. The woman says she had to numb herself to cope with the sex trade. \"Drink grog properly too, you should be drunk and fired up,\" he writes in one of the text messages to the woman. Another text from the man reads: \"I book clients. I set the strategy for each client. You shut up and fuck!\" The man: \"Wanted to be like Julia Roberts\" But the man believes that the sex trade took place on the woman's initiative. - One evening I say that \"I have to ask you something straight out. What you have been talking about when we have sex or after, or really any time. Do you have a secret fetish? Do you want to sell sex? Do you want to be an escort?\" \"Yes, she says,\" says the man in questioning according to the preliminary investigation protocol. According to the man, the woman was \"obsessed with the idea and a fantasy of being like Julia Roberts in Pretty Woman\" and claims that it is the woman who wanted him to film the meetings with men that she said she met at the pub. The woman is also said to have created profiles on sex sites herself, says the accused man. \"She said she was going to leave me\" When the man suffers from cancer and impotence, the woman must have presented him with an ultimatum, he describes in questioning. - I also then ask her \"if I can't have sex with you.\" \"Well, I'll either leave you or I'll have to have others,\" he says she replied. He says in questioning that he \"feels mentally bad going around and being impotent and having a wife who gets wilder and wilder. I'm co-dependent.\" According to the man's lawyer Martina Michaelsdotter Olsson, there has been neither threat nor control, she tells Ekot. The woman states that the man kept in contact with the sex buyers, which he denies. In a text message to the woman in October 2022, he writes that he posted her \"on one", "title_original": "Koppleriåtalade mannens försvar: ”Hon ville vara som Julia Roberts”", "summary_original": "En man i 60-årsåldern i Kramfors misstänks ha sålt sin fru till över 120 män. Mannen misstänks också ha lett henne in i ett drogberoende. I flera sms befaller mannen kvinnan vilka hon ska träffa, hur hon ska bete sig och hur mycket alkohol och droger hon ska ta. Kvinnan säger att hon behövt bedöva sig för att klara av sexhandeln. ”Drick grogg också ordentligt, du ska vara berusad och påtänd,” skriver han i ett av sms:en till kvinnan. Ett annat sms från mannen lyder: ”JAG bokar kunder. JAG lägger strategin för varje kund. Du håller käften och knullar!” Mannen: ”Ville vara som Julia Roberts” Men mannen menar att sexhandeln skett på kvinnans initiativ. – En kväll säger jag att ”jag måste fråga dig en sak rakt ut. Det du har pratat om när vi har sex eller efter, eller egentligen lite när som helst. Har du någon hemlig fetisch? Vill du sälja sex? Vill du vara eskort?” ”Ja, säger hon”, säger mannen i förhör enligt förundersökningsprotokollet. Enligt mannen var kvinnan ”besatt av tanken och en fantasi av att vara som Julia Roberts i Pretty Woman” och hävdar att det är kvinnan som ville att han skulle filma mötena med män som hon enligt honom träffade på krogen. Kvinnan ska också själv ha skapat profiler på sexsajter, säger den åtalade mannen. ”Hon sa att hon skulle lämna mig” När mannen drabbas av cancer och impotens ska kvinnan ha ställt honom inför ett ultimatum, beskriver han i förhör. – Jag frågar henne också då ”om jag inte kan ha sex med dig.” \"Ja, antingen kommer jag lämna dig eller så måste jag ha med andra”, uppger han att hon svarat. Han säger i förhör att han ”mår psykiskt skitdåligt i att gå runt och vara impotent och ha en fru som blir vildare och vildare. Jag är medberoende.” Enligt mannens advokat Martina Michaelsdotter Olsson har det inte förekommit varken hot eller kontroll, säger hon till Ekot. Kvinnan uppger att mannen hållit i kontakterna med sexköparna, vilket han förnekar. I ett sms till kvinnan i oktober 2022 skriver han att han lagt ut henne ”på en sida till, internationell eskortsida”. – Jag har varit behjälplig att lägga in i hennes och min gemensamma kalender men jag har aldrig någonsin tagit emot en krona. Jag har gjort klart för henne från början jag vill inte ha med de här pengarna att göra. Jag vill inte bli anklagad för koppleri vilket jag är nu, säger mannen i förhör. Bevisningen: Mängder av sms I bevisningsmaterialet finns telefoner, datorer, chatthistorik och ett stort antal filmer som visar den målsägande kvinnan i olika sexuella situationer. De flesta av filmerna är inspelade med uppsatta övervakningskameror. I ett exempel växlar kamerorna för att följa kvinnan under och efter ett möte med en misstänkt sexköpare.\n\nI maj 2022 berättar mannen i flera sms om sina fantasier om att kvinnan ska träffa andra män och sälja sex. Kvinnan blir ledsen, varpå mannen säger att hon skuldbelägger honom. ”Jag förstår inte din fascination över att vilja se mig med någon annan”, skriver kvinnan.  Men mannens försvar ger en annan bild. – Det här är målsägandens frivilliga verksamhet, helt enkelt, som han har blivit involverad i till viss del, säger mannens advokat  Martina Michaelsdotter Olsson till Ekot. Mannen nekar till alla brottsanklagelser utom ett ringa dopingbrott.", "link": "https://www.tv4.se/artikel/2RcSJCbmIlKPvgNwzyl3B3/koppleriatalade-mannens-foersvar-hon-ville-vara-som-julia-roberts", "date_display": "2026-04-18", "date_iso": "2026-04-18T08:41:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/kramfors", "/atal", "/misstankt-brott", "/koppleri", "/valdtakt", "/sexkop", "/sexhandel"]}, {"id": 149, "title": "The tears after Lilla Nymo's passing: \"Was the love of my life\"", "summary": "It was in 2015 that dog trainer Fredrik Steen got his Lilla Nymo home. For the past eleven years, she has been a beloved part of Nyh
