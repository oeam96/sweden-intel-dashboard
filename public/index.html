e situation could be resolved without anyone getting hurt.", "title_original": "Peter hittade huggorm i kundvagn: ”Agerade på instinkt”", "summary_original": "När Peter Lönn från Stockholm besökte Dollarstore i Arboga fick han en oväntad syn: en huggorm i en kundvagn.\nBåde kunder och personal blev osäkra på hur situationen skulle hanteras, men Peter tvekade inte.  – Jag agerade på instinkt. Det var fullt med barn i butiken och jag hade mina egna med mig, säger han. Rullade ut vagnen Ormen låg still i kundvagnen, men risken att den skulle ta sig ut i butiken fick Peter att agera. – Jag tog tag i vagnen och drog ut den därifrån. Den kunde ju inte vara kvar inne, säger han. Han rullade ut kundvagnen till parkeringen, bort från kunderna. Personal höll uppsikt Väl utanför samlades flera ur personalen kring vagnen och höll ormen under uppsikt i omkring 10–15 minuter. Planen var att tillkalla hjälp för att ta hand om den. Men innan någon hann komma dit hade situationen löst sig. – Enligt personalen ringlade den iväg av sig själv till slut. Det blev ett bra slut för alla, säger Peter. Oklart hur den hamnade där Hur huggormen tog sig in i kundvagnen är fortfarande oklart. – Vagnarna står ju ofta utomhus nära gräs. Det kan ha varit en varm dag och den kröp upp och lade sig där, säger han. Tack vare det snabba ingripandet kunde situationen lösas utan att någon kom till skada.", "link": "https://www.tv4.se/artikel/3yeFVRUA87f1YzBCy5NnNO/peter-hittade-huggorm-i-kundvagn-agerade-pa-instinkt", "date_display": "2026-05-04", "date_iso": "2026-05-04T17:22:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/orm", "/huggorm"]}, {"id": 148, "title": "What does Trump's offer really mean?", "summary": "", "title_original": "Vad innebär Trumps erbjudande egentligen?", "summary_original": "", "link": "https://www.tv4.se/artikel/3B4n2wG9n53V3JCBc0VivY/vad-innebaer-trumps-erbjudande-egentligen", "date_display": "2026-05-04", "date_iso": "2026-05-04T16:06:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 149, "title": "At least two dead - car drove into crowd on shopping street", "summary": "A car has driven at high speed through the crowd in the middle of the Grimmaische Straße shopping street in central Leipzig during the afternoon. The city's mayor Burkhard Jung confirms at a press conference that at least two people are dead and around 25 injured. Eyewitnesses told Focus that several bodies were seen being covered with pieces of cloth.  More than ten ambulances were called to the scene and a crisis management group is taking care of victims.  Driver known to police The driver of the car has been arrested. He is a 33-year-old German citizen and is already known to the police. Several media reports that the man must have shown signs of mental illness. - An act like this leaves us speechless - and it makes us determined. We will do everything in our power to clarify what has happened, says Saxony's Prime Minister Michael Kretschmer at a press conference. Whether it was all an accident or whether it was a deliberate act is still unclear.", "title_original": "Minst två döda – bil körde in i folkmassa på shoppinggata", "summary_original": "En bil har i hög hastighet kört genom folkmassan mitt på shoppinggatan Grimmaische Straße i centrala Leipzig under eftermiddagen. Stadens borgmästare Burkhard Jung bekräftar på en pressträff att minst två personer är döda och omkring 25 skadade. Ögonvittnen uppger för Focus man sett flera kroppar täckas över med tygstycken.  Fler än tio ambulanser larmades till platsen och en krishanteringsgrupp tar hand om drabbade.  Föraren känd av polisen Föraren av bilen har gripits. Han är en 33 år gammal tysk medborgare och är känd av polisen sedan tidigare. Flera medier rapporterar om att mannen ska ha uppvisat tecken på psykisk ohälsa. – En sådan här handling gör oss mållösa – och det gör oss beslutsamma. Vi kommer att göra allt i vår makt för att klargöra vad som har hänt, säger Sachsens ministerpresident Michael Kretschmer på ett pressträff. Om det hela var en olycka eller om det var en avsiktlig handling är ännu oklart.", "link": "https://www.tv4.se/artikel/3RrhAvCTWL02w0txggDDFK/bil-har-koert-in-i-folkmassa-i-tyskland", "date_display": "2026-05-04", "date_iso": "2026-05-04T15:35:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/brott-och-straff", "/leipzig", "/tyskland"]}, {"id": 150, "title": "Boys are detained for the Walborg murder", "summary": "Two teenage boys have now been arrested on suspicion of murdering a man in his 20s in Norrköping on the eve of Walpurgis Fair. The boys, who are 15 and 16 years old, are also suspected of a murder in Oslo. - He admits involvement in the shooting, on the other hand, he denies responsibility for crime citing that he acted under duress, under threat of violence from other people, says the 15-year-old boy's lawyer Johan Ritzer. Suspected of murder in Oslo The two boys are also suspected of a murder in Økern on the outskirts of Oslo last weekend. There, too, a man in his 20s was killed, who, according to Norwegian police, had connections to gang crime. The shooting took place while children were playing soccer nearby. The Norwegian police suspect that it is a contract killing that must have been ordered via encrypted apps. Johan Ritzer currently does not want to comment on whether there is any cooperation with prosecutors in Norway. - Unfortunately, I cannot go into that part at all now.  \"It's tough\" What will you do next?  - Next, it will be for me to have close contact with my client and support him in this. This is a very young person. It's the closest thing. Then there will probably be further questioning during the journey, he says. Johan Ritzer says that it was expected that the 15-year-old would be detained. - I must say that it was. Based on the suspicion and the seriousness of it all. I had told him that too. How is he? - Under the circumstances, he's fine, but it's tough. Especially for someone so young.", "title_original": "Pojkar häktas för valborgsmordet", "summary_original": "Två tonårspojkar har nu häktats misstänkta för mordet på en man i 20‑årsåldern i Norrköping under valborgsmässoafton. Pojkarna, som är 15 och 16 år gamla, misstänks även för ett mord i Oslo. – Han medger inblandning i skjutningen, däremot bestrider han ansvar för brott med hänvisning till att han agerat under tvång, under hot om våld från andra personer, säger den 15-årige pojkens advokat Johan Ritzer. Misstänks för mord i Oslo De två pojkarna misstänks även för ett mord i Økern i utkanten av Oslo förra helgen. Även där dödades en man i 20‑årsåldern, som enligt norsk polis hade kopplingar till gängkriminalitet. Skjutningen ägde rum samtidigt som barn spelade fotboll i närheten. Den norska polisen misstänker att det rör sig om ett beställningsmord som ska ha beställts via krypterade appar. Johan Ritzer vill i nuläget inte kommentera om det finns något samarbete med åklagare i Norge. – Jag kan tyvärr inte gå in på den biten alls nu.  ”Det är tufft” Vad kommer ni att göra härnäst?  – Härnäst blir det för min del att ha nära kontakt med min klient och stötta honom i det här. Det är en väldigt ung person som det rör sig om. Det är det närmaste. Sen blir det väl ytterligare förhör under resans gång, säger han. Johan Ritzer säger att det var väntat att 15‑åringen skulle häktas. – Det får jag säga att det var. Utifrån misstanken och allvaret i det hela. Det hade jag berättat för honom också. Hur mår han? – Under omständigheterna mår han okej, men det är tufft. Särskilt för en som är så pass ung.", "link": "https://www.tv4.se/artikel/6TPd1RTZWOnoTi6NeviOpM/pojke-haektas-foer-valborgsmordet", "date_display": "2026-05-04", "date_iso": "2026-05-04T13:34:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/mord", "/norrkoping", "/skjutning"]}, {"id": 151, "title": "How training made Niklas sick: \"The problem is gigantic\"", "summary": "For Niklas Olsson in Örnsköldsvik, it started when he stopped playing football and ice hockey and would take care of his training in his spare time.\n\nAccustomed to hard driving, he quickly got results in the gym and praise from those around him. He looked healthy and fit, but his body was slowly breaking down and exercise became a compulsion – as did healthy food.\n\nWhen his body couldn't take it anymore, he sought medical attention and was advised about a treatment specifically for orthorexia. No diagnosis in Sweden Orthorexia is not a medical diagnosis in Sweden, which means that the sufferer must pay for their own treatment.\n\n- It is a big and growing problem. When we started many years ago, there were 3-4 people per month who contacted us about these problems. Now there are 3-4 callers per day, says Yvonne Lin, Master of Medicine and CBT therapist.\n\nToday's search for the perfect body often takes place in the public eye. Exercise influencers attract tens of thousands of followers and the boundaries of both exercise and healthy food are being pushed.\n\n- In the beginning, there were many fitness people who sought care. Now there are also elite athletes and regular exercisers. Everyone wants to get stronger and starts banning food for themselves, says Yvonne Lin.\n\n- Step by step you remove sugar, white flour, cakes, desserts, red meat and at the same time continue to train hard. It affects the body's major physiological systems, she adds. On the road to recovery Niklas Olsson is a bit on the road to recovery. He has turned off his social media, which played a large role in his illness.\n\n- Following my flow, which only consisted of training and bodies, triggers the part of me that is not healthy yet, he says.\n\n- It is clearly about fixation on appearance. And then I'm still 44 years old. I think a lot about young people who live their whole lives digitally and cannot defend themselves at all. The problem is gigantic. I'm not healthy yet, but heading in the right direction.", "title_original": "Så gjorde träningen Niklas sjuk: ”Problemet är gigantiskt”", "summary_original": "För Niklas Olsson i Örnsköldsvik började det när han slutade spela fotboll och ishockey och själv skulle ta hand om sin träning på fritiden.\n\nVan vid hårdkörning fick han snabbt resultat på gymmet och beröm av omgivningen. Han såg frisk och vältränad ut, men kroppen bröts sakta ner och träningen blev till ett tvång – liksom nyttig mat.\n\nNär kroppen inte orkade mer sökte han läkarvård och fick tips om en behandling mot just ortorexi. Ingen diagnos i Sverige Ortorexi är ingen medicinsk diagnos i Sverige, vilket innebär att den drabbade måste betala sin behandling själv.\n\n– Det är ett stort och växande problem. När vi började för många år sen var det 3-4 personer per månad som hörde av sig om de här problemen. Nu är det 3-4 per dag som ringer, säger Yvonne Lin, medicine magister och KBT-terapeut.\n\nDagens jakt på den perfekta kroppen pågår ofta i offentligheten. Träningsinfluencers lockar tiotusentals följare och gränserna för både träning och nyttig mat förflyttas.\n\n– I början var det många fitnessmänniskor som sökte vård. Nu är det också elitidrottare och vanliga motionärer. Alla vill bli starkare och börjar förbjuda livsmedel för sig själva, säger Yvonne Lin.\n\n– Steg för steg plockar man bort socker, vitt mjöl, kakor, efterrätter, rött kött och fortsätter samtidigt att träna stenhårt. Det påverkar kroppens stora fysiologiska system, tillägger hon. På väg mot tillfrisknande Niklas Olsson är en bit på väg mot tillfrisknande. Han har stängt av sina sociala medier, som spelade en stor roll i insjuknandet.\n\n– Att följa mitt flöde som bara bestod av träning och kroppar triggar den del av mig som inte är frisk ännu, säger han.\n\n– Det handlar helt klart om utseendefixering. Och då är jag ändå 44 år. Jag tänker mycket på ungdomar som lever hela sina liv digitalt och inte kan värja sig alls. Problemet är gigantiskt. Jag är inte frisk ännu, men på väg åt rätt håll.", "link": "https://www.tv4.se/artikel/5sfAejZ81GjjkhGD37y4it/ortorexi-traeningen-och-maten-som-blir-ett-tvang", "date_display": "2026-05-04", "date_iso": "2026-05-04T13:12:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/traning", "/ortorexi"]}, {"id": 152, "title": "In memory of Tony Larsson, Nyköping", "summary": "Siwert Gårdestig has written this memorial", "title_original": "Till minne av Tony Larsson, Nyköping", "summary_original": "Siwert Gårdestig har skrivit detta minnesord", "link": "https://www.dagen.se/familj/till-minne-av-tony-larsson-nykoeping/10266961", "date_display": "2026-05-04", "date_iso": "2026-05-04T11:36:26+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 153, "title": "Vilden Nyberg refutes the accusations of MP bribery", "summary": "Åkesson: They are trying to buy the savages • Lind: Trams", "title_original": "Vilden Nyberg tillbakavisar anklagelserna om MP-muta", "summary_original": "Åkesson: De försöker köpa vildarna • Lind: Trams", "link": "https://www.tv4.se/artikel/5ys0pjjd5Wmf4Ydv2FApY0/katja-nyberg-tillbakavisar-akessons-anklagelser-om-mp-muta", "date_display": "2026-05-04", "date_iso": "2026-05-04T11:01:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 154, "title": "The threat to the EU may become a reality this week: \"Using the customs weapon again\"", "summary": "Trump has recently repeated the threat in several contexts. According to Fredrik Bergman Evans, it is about a trade agreement that was concluded last summer, after Trump regained power and in the White House declared a trade war against basically the entire world. - He called it Liberation Day and it would mean that punitive duties would be imposed on basically all imports to the USA, says Fredrik Bergman Evans. \"Affects the European export industry\" Trump has referred to the fact that Americans buy more European goods, including cars, than Europeans buy from the United States. He believes that the US lowered its tariffs from the threat of 25 to 15 percent last fall, and that the EU has not fulfilled its promises. At the same time, his previous tariff plans suffered a setback in the US Supreme Court, which ruled that it is up to Congress to decide on trade tariffs. Now he uses other laws instead. - Now he is targeting a law that he has previously used against Europe, among other things, to make decisions about tariffs. He can probably do this. He has said that the tariffs will take effect this week, and then it will be 25 percent on European cars and trucks. Then it is 10 percentage points higher than what would apply according to the agreement. It is clear that it affects the European export industry, says Fredrik Bergman Evans.  EU: No breach of agreement According to Fredrik Bergman Evans, the EU believes that it has not breached the agreement and that the difference is rather about how quickly decisions can be made, because the US can act faster than the EU.  - They refer to the fact that Trump can snap his fingers and make various decisions about tariffs, and it will take effect immediately. But the EU is a large machine where many different parts of the democratic institutions must be heard.  Bergman Evans believes that the Trumps see an opportunity to position themselves against Europe. - It is difficult to see that it is some kind of formal breach of agreement on the part of the EU, but there is more of an opportunity for Trump to use the tariff weapon again.  Can be connected to choice o", "title_original": "Hotet mot EU kan bli verklighet i veckan: ”Använder tullvapnet igen”", "summary_original": "Trump har den senaste tiden upprepat hotet i flera sammanhang. Enligt Fredrik Bergman Evans handlar det om ett handelsavtal som slöts förra sommaren, efter att Trump återtagit makten och i Vita huset utlyst ett handelskrig mot i princip hela världen. – Han kallade det för Liberation Day och det skulle innebära att man skulle lägga strafftullar på i princip alla importer till USA, säger Fredrik Bergman Evans. ”Påverkar den europeiska exportindustrin” Trump har hänvisat till att amerikaner köper mer europeiska varor, bland annat bilar, än vad européer köper av USA. Han menar att USA sänkt sina tullar från hotet om 25 till 15 procent förra hösten, och att EU inte infriat sina löften. Samtidigt fick hans tidigare tullplaner ett bakslag i USA:s högsta domstol, där det slogs fast att det är kongressen som ska fatta beslut om handelstullar. Nu använder han i stället andra lagar. – Nu riktar han in sig på en lag som han tidigare har använt mot Europa bland annat för att fatta beslut om tullar. Han kan nog göra detta. Han har sagt att tullarna ska träda i kraft den här veckan, och då är det 25 procent på europeiska bilar och lastbilar. Då är det 10 procentenheter högre än vad som skulle gälla enligt avtalet. Det är klart att det påverkar den europeiska exportindustrin, säger Fredrik Bergman Evans.  EU: Inget avtalsbrott Enligt Fredrik Bergman Evans menar EU att man inte brutit mot avtalet och att skillnaden snarare handlar om hur snabbt beslut kan fattas, eftersom USA kan agera snabbare än EU.  – Man hänvisar till att Trump kan knäppa med fingrarna och fatta olika beslut om tullar, och den börjar gälla omedelbart. Men EU är ett stort maskineri där det är många olika delar av de demokratiska institutionerna som måste höras.  Bergman Evans menar att Trumps ser ett tillfälle att positionera sig mot Europa. – Det är svårt att se att det är något slags formellt avtalsbrott från EU:s sida, utan där är mer ett tillfälle för Trump att använda tullvapnet igen.  Kan kopplas till val och bilindustri Fredrik Bergman Evans säger att tidpunkten för hotet kan hänga ihop med både mellanårsvalet och läget i kriget i Iran.  – Trump är frustrerad över bristande stöd i kriget mot Iran och han måste positionera sig inför mellanårsvalet där den amerikanska bilindustrin är väldigt viktig. Amerikanerna gillar ju europeiska bilar medan européerna inte är särskilt intresserade av amerikanska bilar. Han betonar också att tullarna blivit ett centralt verktyg i Trumps politik och förhandlingar med andra länder. – Det här med bilar har varit återkommande för Trump. Han gillar inte EU. Han har sagt under lång tid att EU skapades bara för att jävlas med USA. Det är ju så, om man ska vara helt ärlig, att EU har haft höga tullar på amerikanska bilar, medan USA haft låga tullar på europeiska bilar. Så det kan man i någon mån tycka är orättvist, och det är någonting som Trump har kapitaliserat på. Trump vill också flytta produktion till USA, för att skapa arbetstillfällen, menar Bergman Evans. Som samtidigt varnar han för konsekvenserna av Trumps strategi.  – För att om det är någonting som är väldigt dåligt för handel och ekonomi, så är det den här osäkerheten.", "link": "https://www.tv4.se/artikel/4JphC3rKblodsqb16pwJeE/trumps-hot-mot-eu-kan-bli-verklighet-i-veckan-anvaender-tullvapnet-igen", "date_display": "2026-05-04", "date_iso": "2026-05-04T09:29:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/utrikes", "/ekonomi", "/tullar", "/donald-trump", "/tullkriget"]}, {"id": 155, "title": "To attack Åkesson: \"Stop with false accusations\"", "summary": "In arguments about wilds and offsets", "title_original": "Till attack mot Åkesson: ”Sluta med falska anklagelser”", "summary_original": "I bråk om vildar och kvittningar", "link": "https://www.tv4.se/artikel/tt-260503-partiledardebatt1 a Malmer Stenergard attends NB8 meeting in Estonia", "summary": "Minister for Foreign Affairs Maria Malmer Stenergard is attending a meeting of Nordic-Baltic foreign ministers (NB8) in Kuressaare, Estonia, on 29–30 April. The agenda includes support to Ukraine, constraining Russia’s aggression in the region, boosting European security, current NATO issues and developments in the Middle East.", "title_original": "Focus on Ukraine, NATO and Middle East as Maria Malmer Stenergard attends NB8 meeting in Estonia", "summary_original": "Minister for Foreign Affairs Maria Malmer Stenergard is attending a meeting of Nordic-Baltic foreign ministers (NB8) in Kuressaare, Estonia, on 29–30 April. The agenda includes support to Ukraine, constraining Russia’s aggression in the region, boosting European security, current NATO issues and developments in the Middle East.", "link": "https://www.government.se/press-releases/2026/04/focus-on-ukraine-nato-and-middle-east-as-maria-malmer-stenergard-attends-nb8-meeting-in-estonia/", "date_display": "2026-04-29", "date_iso": "2026-04-29T09:19:53+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "6 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Nordic affairs", "Maria Malmer Stenergard", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 182, "title": "Sweden announces more than SEK 2.7 billion in humanitarian assistance to the world’s most vulnerable", "summary": "The world’s humanitarian needs are immense. There are a record number of conflicts, with more than 300 million people in need of urgent humanitarian assistance. And there is a risk of needs further increasing this year. For this reason, Sweden is announcing more than SEK 2.7 billion in humanitarian assistance to the world’s most vulnerable for 2026.", "title_original": "Sweden announces more than SEK 2.7 billion in humanitarian a   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
