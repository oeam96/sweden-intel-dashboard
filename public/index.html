play": "2026-04-02", "date_iso": "2026-04-02T19:45:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Film", "Kultur"]}, {"id": 124, "title": "The farmer raises the alarm after the war: \"A perfect storm\"", "summary": "The Iran war is now in its fifth week and there is little evidence that the conflict is nearing an end. Shipping from the Strait of Hormuz remains very limited, if not stagnant, and on Thursday night the futures price for a barrel of North Sea oil was $108, according to Trading Economics.  An increase of over 50 percent compared to before the outbreak of war. Something that hit hard against the farmer Carl-Fredrik Svederberg in Lidköping, who uses around 24 cubic meters of diesel a year. - For my part, it means an extra SEK 150,000.  Not only the price worries He describes a \"perfect storm\" for plant growers. Due to good harvests in the world in recent years, the price of grain has fallen. Then came the war in the Middle East and the price of diesel and fertilizer hit the roof. - All of a sudden we have a cost development at my company that exceeds just over a million. But it's not just the price that worries. - The big thing that we are discussing in agriculture right now is: Will we even get diesel and fertilizer? He mentions that the EU raised the issue of fuel rationing. The National Federation of Farmers also expresses alarmism about the situation. - The costs in agriculture have increased by a couple of billions in the last two months, writes Palle Borgström, LRF's confederation chairman in a press release. Expert: The world has never seen anything like it Samuel Ciszuk, energy analyst at ELS Analysis, says in Efter Fem that the world has never had similar problems before. Today, the world has lost about twice as much oil in volume compared to the great oil crisis of 1973, he says. - Nobody benefits from such a big interruption. In the short term, oil producers may profit and get paid well, but this will lead to the disappearance of markets and the exclusion of consumers. At the lowest level, this means that we will have to pay more for food, according to Samuel Ciszuk. But it is not in all parts of the world that you will be able to afford to pay. - It is a famine disaster that will probably increase in parts", "title_original": "Lantbrukaren larmar efter kriget: ”En perfekt storm”", "summary_original": "Irankriget är nu inne på vecka fem och lite talar för att konflikten närmar sig ett slut. Transporterna från Hormuz-sundet är fortsatt mycket begränsade, om inte stillastående och på torsdagskvällen var terminpriset för ett fat Nordsjöolja 108 dollar, enligt Trading Economics.  En höjning på över 50 procent jämfört med innan krigsutbrottet. Något som slagit hårt mot lantbrukaren Carl-Fredrik Svederberg i Lidköping, som använder omkring 24 kubik diesel om året. – För min del innebär det 150 000 kronor extra.  Inte bara priset oroar Han beskriver en ”perfekt storm” för växtodlare. På grund av goda skördar i världen de senaste åren har spannmålspriset sjunkit. Sedan kom kriget i Mellanöstern och priset på diesel och konstgödsel slog i taket. – Helt plötsligt har vi en kostnadsutveckling på mitt företag som överstiger drygt en miljon. Men det är inte bara priset som oroar. – Den stora grejen som vi diskuterar inom lantbruket just nu är: Kommer vi ens få diesel och konstgödsel? Han nämner att EU lyft frågan om ransonering av drivmedel. Även Lantbrukarnas Riksförbund uttrycker sig alarmistiskt kring situationen. – Kostnaderna i lantbruket har ökat med ett par miljarder de senaste två månaderna, skriver Palle Borgström, LRFs förbundsordförande i ett pressmeddelande. Expert: Världen har aldrig varit med om något liknande Samuel Ciszuk, energianalytiker på ELS Analysis, säger i Efter Fem att världen aldrig har haft liknande problem tidigare. I dag har världen tappat omkring dubbelt så mycket i olja i volym jämfört med den stora oljekrisen 1973, säger han. – Ingen tjänar på ett sånt här stort avbrott. På kort sikt kanske oljeproducenter tjänar och får bra betalt, men det här kommer att leda till att marknader försvinner och konsumenter slås ut. I lägsta ledet innebär det att vi kommer behöva betala mer för maten, enligt Samuel Ciszuk. Men det är inte i alla delar av världen som man kommer ha råd att betala. – Det är en svältkatastrof som förmodligen kommer att öka i delar av världen.", "link": "https://www.tv4.se/artikel/7yMJMGAr1L3LVwssRRbqLQ/lantbrukaren-larmar-efter-kriget-en-perfekt-storm", "date_display": "2026-04-02", "date_iso": "2026-04-02T19:43:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/bonder", "/irankriget"]}, {"id": 125, "title": "Antique Gold Helmet Found - 'Best News'", "summary": "Last year, a 2,500-year-old gold helmet was stolen from a museum in the Netherlands. Now it has been found.  - It is fantastic. It's the best news we could get, says art investigator Arthur Brand.", "title_original": "Antik guldhjälm återfunnen – ”bästa nyheterna”", "summary_original": "I fjol stals en 2 500 år gammal guldhjälm från ett museum i Nederländerna. Nu har den hittats.  – Det är fantastiskt. Det är den bästa nyheten vi kunde få, säger konstutredaren Arthur Brand.", "link": "https://www.sydsvenskan.se/varlden/antik-guldhjalm-aterfunnen-basta-nyheterna/", "date_display": "2026-04-02", "date_iso": "2026-04-02T19:31:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Karl Dalén: Bondi was as loyal as a dog - yet she was fired", "summary": "WASHINGTON. Donald Trump has fired one of his most loyal employees. The problems surrounding the Epstein investigation and the inability to prosecute more of Trump's enemies contributed to the firing of Attorney General Pam Bondi. Enter Todd Blanche, who recently bragged about how many Trump critics have ended up at the Department of Justice.", "title_original": "Karl Dalén: Bondi var lojal som en hund – ändå fick hon sparken", "summary_original": "WASHINGTON. Donald Trump har avskedat en av sina mest trogna medarbetare. Problemen runt Epsteinutredningen och oförmågan att fälla fler av Trumps fiender bidrog till att justitieminister Pam Bondi fick sparken. In kommer Todd Blanche, som nyligen skröt om hur många Trumpkritiker som fått sluta på justitiedepartement.", "link": "https://www.dn.se/varlden/karl-dalen-bondi-var-lojal-som-en-hund-anda-fick-hon-sparken/", "date_display": "2026-04-02", "date_iso": "2026-04-02T19:10:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The Venture Capitalist: Shut down the top executives – now", "summary": "The Tax Agency allows two top managers suspected of crimes to remain in office. Now the criticism is growing, at the same time that venture capitalist Ola Nordquist is commenting for the first time on the poking of general manager Katrin Westling Palm.", "title_original": "Riskkapitalisten: stäng av toppcheferna – nu", "summary_original": "Skatteverket låter två brottsmisstänkta toppchefer sitta kvar. Nu växer kritiken, samtidigt som riskkapitalisten Ola Nordquist för första gången kommenterar petningen av generaldirektör Katrin Westling Palm.", "link": "https://www.svd.se/a/V663WJ/skatteverket-brottsmisstankta-toppchefer-sitter-kvar", "date_display": "2026-04-02", "date_iso": "2026-04-02T19:00:31+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 128, "title": "Letter to the editor. Noted by DN's readers on April 2", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Maundy Thursday, April 2.", "title_original": "Insändare. Noterat av DN:s läsare den 2 april", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll på skärtorsdagen den 2 april.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-2-april-3/", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:58:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Oil manager: Swedes to Spain will be a problem", "summary": "Choked oil flows and pressured world economy. Donald Trump's next move in the Iran crisis will have consequences far beyond the Middle East. Here are three scenarios of what could happen now.", "title_original": "Oljechef: Svenskar till Spanien blir problem", "summary_original": "Strypta oljeflöden och pressad världsekonomi. Donald Trumps nästa drag i Irankrisen får följder långt utanför Mellanöstern. Här är tre scenarier för vad som kan hända nu.", "link": "https://www.svd.se/a/Bxx19E/irankrisen-kan-bli-ransonering-spaniensemester-blir-problem", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:58:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 130, "title": "The powerhouse retains its glittering core", "summary": "The fuss has been peeled off and the lyrics have matured, but the band still makes dreamy post-punk with strong melodies, writes DN's Matilda Källén about Makthaverskan's new album.", "title_original": "Makthaverskan har kvar sin glittrande kärna", "summary_original": "Stöket har skalats av och texterna har mognat, men bandet gör fortfarande drömsk postpunk med starka melodier, skriver DN:s Matilda Källén om Makthaverskans nya album.", "link": "https://www.dn.se/kultur/makthaverskan-har-kvar-sin-glittrande-karna/", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:56:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Expert: Three factors speak against a Russian spring offensive", "summary": "Several components are missing for a Russian spring offensive, says military expert Johan Huovinen. However, another, perhaps even greater threat looms over Ukraine. - By midsummer there is a risk that Ukraine will go bankrupt, he says.", "title_original": "Expert: Tre faktorer talar mot en rysk våroffensiv", "summary_original": "Flera komponenter saknas för en rysk våroffensiv, menar militärexperten Johan Huovinen. Däremot hägrar ett annat, kanske ännu större hot, mot Ukraina. – Till midsommar finns det risk att Ukraina går bankrutt, säger han.", "link": "https://www.dn.se/varlden/expert-tre-faktorer-talar-mot-en-rysk-varoffensiv/", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:53:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "400-year-old Swedish ship became a guitar for Keith Richards", "summary": "The guitar, which contains wood from the regal ship Riksäppelt, has now been played live with The Rolling Stones, in front of thousands of fans worldwide.  The conversation that changed everything It all started with some hand-built guitars in a music store in Stockholm. Suddenly the call came. - \"You need to sit down... I'm going to tell you something.\" One of the world's most iconic rock guitarists had opened his eyes to Jim's guitars.\nKeith Richards' guitar technician Pierre de Buport had stepped into the shop and bought a guitar on the spot.\nSoon after, the next question came: Can you build another one? Wood from a Swedish wreck One of the guitars that has now reached the world stage carries a unique history.\nIt is built of wood from the royal ship Riksäppelt, launched in 1662 and sunk off Dalarö in 1676.\nJim Herlin found the wood via a homestead in Söderköping. - We moved the holiday package and pushed beams into the car, he says. The 400-year-old wood now lives on in both the fingerboard and neck in the middle of rock history. From silence to stage Once the guitar was sent on its way, there was silence. No answer. Then – suddenly – it appeared. In the hands of Keith Richards.\n\nOn stage. In front of an audience. - It was like a gift from above, says Jim Herlin. 400-year-old wood that still rocks Today, Jim Herlin continues to build guitars in his workshop in Saltsjöbaden. But the material makes demands. - The body had to be impregnated with superglue to hold it together. It's the mask, he says. The result is an instrument with a history spanning four centuries – from the bottom of the sea to the world's biggest stages.", "title_original": "400-årigt svenskt skepp blev gitarr åt Keith Richards", "summary_original": "Gitarren, som innehåller trä från regalskeppet Riksäpplet, har nu spelats live med The Rolling Stones, inför tusentals fans världen över.  Samtalet som förändrade allt Allt började med några handbyggda gitarrer i en musikaffär i Stockholm. Plötsligt kom samtalet. – ”Du behöver sätta dig ner… jag ska berätta en sak.” En av världens mest ikoniska rockgitarrister hade fått upp ögonen för Jims gitarrer.\nKeith Richards gitarrtekniker Pierre de Buport hade klivit in i butiken och köpt en gitarr på plats.\nKort därefter kom nästa fråga: Kan du bygga en till? Trä från ett svenskt vrak  En av gitarrerna som nu nått världsscenen bär på en unik historia.\nDen är byggd av trä från regalskeppet Riksäpplet, sjösatt 1662 och sänkt utanför Dalarö 1676.\nVirket hittade Jim Herlin via en hembygdsgård i Söderköping. – Vi flyttade på semesterpackningen och tryckte in bjälkar i bilen, berättar han. Det 400 år gamla träet lever nu vidare i både greppbräda och hals mitt i rockhistorien. Från tystnad till scen När gitarren väl skickats i väg blev det tyst. Inget svar. Sedan – plötsligt – dök den upp. I händerna på Keith Richards.\n\nPå scen. Inför publik. – Det var som en skänk från ovan, säger Jim Herlin. 400 år gammalt trä som fortfarande rockar I dag fortsätter Jim Herlin att bygga gitarrer i sin verkstad i Saltsjöbaden. Men materialet ställer krav. – Kroppen fick impregneras med superlim för att hålla ihop. Den är ju maskäten, säger han. Resultatet är ett instrument med en historia som sträcker sig över fyra århundraden – från havets botten till världens största scener.", "link": "https://www.tv4.se/artikel/pimivXBr2F0HLLP0LmML6/400-arigt-svenskt-skepp-blev-gitarr-at-keith-richards", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:48:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/noje", "/musik", "/rolling-stones", "/gitarrbygge", "/skeppsvrak", "/historia", "/keith-richards"]}, {"id": 133, "title": "US expert: Another bar for Trump's female associates", "summary": "Donald Trump has fired Attorney General Pam Bondi. Her handling of the Epstein issue is a big reason, according to US expert Jan Hallenberg. - Trump has considered her a burden for a long time.", "title_original": "USA-expert: En annan ribba för Trumps kvinnliga medarbetare", "summary_original": "Donald Trump har sparkat justitieminister Pam Bondi. Hennes hantering av Epsteinfrågan är en stor orsak, enligt USA-experten Jan Hallenberg. – Trump har betraktat henne som en belastning ett längre tag.", "link": "https://www.dn.se/varlden/usa-expert-en-annan-ribba-for-trumps-kvinnliga-medarbetare/", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:45:53+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Want to make Sweden more like Denmark: \"Simple question of freedom\"", "summary": "The moderates want to remove the requirement that alcohol must be served within a clearly defined area. The party believes that freer rules can make Swedish cities more attractive, strengthen the restaurant industry and create more jobs. \n\nFor the proposal to become a reality, the Moderates need to get the other Tidö parties on board. The hope is that Sweden can then become more like, for example, Denmark, France or Germany - with freer serving in the urban environment. \n\n- The government has made a number of changes there. The farm sale, the dance permit removed and the food requirement abolished in the summer, says Benjamin Dousa (M) to TV4 Nyheterna. \n\nChristofer Fjellner (M), opposition city councilor in Stockholm, emphasizes that the capital should be a model municipality and that it is about reducing bureaucratic obstacles. \n\n- Basically, it's a simple matter of freedom. There is no reasonable reason why on that side of the glass I can drink a beer, but on this side of the glass I can't buy and drink a beer, says Christofer Fjellner (M) to TV4 Nyheterna.  The temperance movement warns The proposal faces criticism from the temperance movement, which warns of the consequences and believes that clear regulation is needed so that alcohol serving can take place in a controlled manner. At Movendi, which was previously called IOGT-NTO, one sees several problems with an easing of the law. \n\n - We know that alcohol is one of the biggest causes of violence and insecurity in our urban environment. Here we know that it is crucial to have very good legislation to protect, make sure that the serving of alcohol can take place under control, says Emil Juslin, political director at Movendi, to TV4 Nyheterna. \n\nJuslin highlights that even those who do not drink alcohol are affected by its harmful effects. He says that 27 percent of all accidents are alcohol-related today and that he sees risks with M's proposal. \n\n- Is that really where we want to invest our societal resources?, says Emil Juslin. \n\nBenjamin Dousa (M) believes that a freer alcohol policy can contribute to a more orderly cow", "title_original": "Vill göra Sverige mer likt Danmark: ”Enkel frihetsfråga”", "summary_original": "Moderaterna vill ta bort kravet på att alkoholservering måste ske inom en tydligt avgränsad yta. Partiet menar att friare regler kan göra svenska städer mer attraktiva, stärka restaurangnäringen och skapa fler jobb. \n\nFör att förslaget ska bli verklighet behöver Moderaterna få med sig de andra Tidöpartierna. Förhoppningen är att Sverige då kan bli mer som till exempel Danmark, Frankrike eller Tyskland – med friare servering i stadsmiljön. \n\n– Där har ju regeringen gjort en rad förändringar. Gårdsförsäljningen, tagit bort danstillståndet och matkravet avskaffas till sommaren, säger Benjamin Dousa (M) till TV4 Nyheterna. \n\nChristofer Fjellner (M), oppositionsborgarråd i Stockholm, lyfter att huvudstaden bör vara en föregångskommun och att det handlar om att minska byråkratiska hinder. \n\n– I grund och botten är det ju en enkel frihetsfråga. Det finns inget rimligt skäl till varför jag på den sidan glaset får dricka en öl, men på den här sidan glaset inte får köpa och dricka en öl, säger Christofer Fjellner (M) till TV4 Nyheterna.  Nykterhetsrörelsen varnar  Förslaget möter kritik från nykterhetsrörelsen, som varnar för konsekvenserna och menar att en tydlig reglering behövs för att alkoholservering ska kunna ske kontrollerat. På Movendi, som tidigare hette IOGT-NTO, ser man flera problem med en lättnad av lagen. \n\n – Vi vet ju att alkohol är en av de största orsakerna till våld och otrygghet i vår stadsmiljö. Här vet vi att det är avgörande att ha en väldigt bra lagstiftning för att skydda, se till att alkoholserveringen kan ske kontrollerat, säger Emil Juslin, politisk chef på Movendi, till TV4 Nyheterna. \n\nJuslin lyfter att även de som inte dricker alkohol påverkas av dess skadeverkningar. Han säger att 27 procent av alla olycksfall är alkoholrelaterade idag och att han ser risker med M:s förslag. \n\n– Är det verkligen där vi vill lägga oss våra samhälleliga resurser?, säger Emil Juslin. \n\nBenjamin Dousa (M) menar att friare alkoholpolitik kan bidra till mer ordnad konsumtion och understryker att svenskarnas alkoholkonsumtion minskar. \n\n– Det är mycket bättre att man konsumerar alkohol under ordnade former till exempel i anslutning till en restaurang än att man gömmer sig någonstans skogen. Så det här är ett bra sätt som både skapar jobb och lite mer frihet, säger Benjamin Dousa (M).", "link": "https://www.tv4.se/artikel/7pDjNUdPRl38Q4oBkth5dA/vill-goera-mer-sverige-mer-likt-danmark-enkel-frihetsfraga", "date_display": "2026-04-02", "date_iso": "2026-04-02T18:13:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/politik", "/valet-2022/moderaterna", "/alkohol", "/iogt-nto"]}, {"id": 135, "title": "Put the wrong thing in his mouth - teammate yelled: \"Stupid donkey\"", "summary": "After four days with the taste of coconut in his mouth in \"Robinson\", Aydin Haressi began to have a \"slight psychosis\" and put various things in his mouth. Finally he found a flower that tasted like banana - but the plant was super poisonous. When he ate it, he broke a clear rule and was therefore forced to leave the show. - I was a stupid donkey who felt: What is the worst that can happen? But who will see you eat a flower if no one cuts you off? But apparently someone snitched on me, he says in the program. She told Teammate Iki Gonzalez Magnusson says that she had talked to Aydin Haressi on several occasions and urged him not to eat things they didn't get. According to her, they had to constantly monitor that he did not swim too far, take things from the other team or injure himself with the machete. - I have worked as a personal assistant and it was a bit like that feeling, she tells TV4 Nyheterna. She does not regret going to the production. - What was the alternative? That I would tell his kids that no, we didn't tell when Aydin ate an obviously poisonous plant and got really sick and that's why your dad didn't come home. That would have been really cool. \"Idiot\" After Aydin Haressi was forced to leave the island, several teammates go hard on him and call him, among other things, \"idiot\". They believe that he won the \"SM in fucking idiocy\" and that they should get the \"Nobel Prize in patience\" for putting up with him for so long. - I laughed a little to myself considering that my girl has put up with me for 21 years. And if there's anyone who should have a Nobel Prize, it's her, he says to TV4 Nyheterna. Aydin Haressi, who got a lot of TV time, believes that one of the reasons they chose to gossip about the production was rooted in jealousy. That that would be the motive and that the group was nasty to Aydin Haressi is something Iki Gonzalez Magnusson denies. - It's so very sad, because my inbox is full of hate because I'm a bully. It just feels so fucking boring, she says.", "title_original": "Stoppade fel grej i munnen – lagkamrat tjallade: ”Dum åsna”", "summary_original": "Efter fyra dagar med kokossmak i munnen i ”Robinson” började Aydin Haressi få ”smått psykos” och stoppade olika saker i munnen. Till slut hittade han en blomma som smakade banan – men växten var supergiftig. När han åt den bröt han mot en tydlig regel och tvingades därför lämna programmet. – Jag var en dum åsna som kände: Vad är det värsta som kan hända? Men vem ska se dig äta en blomma om ingen snitchar dig? Men tydligen var det nån som snitchade mig, säger han i programmet. Hon tjallade Lagkamraten Iki Gonzalez Magnusson säger att hon vid flera tillfällen hade pratat med Aydin Haressi och uppmanat honom att inte äta sådant de inte fick. Enligt henne fick de ständigt hålla koll på att han inte simmade för långt, tog saker från det andra laget eller skadade sig med macheten. – Jag har jobbat som personlig assistent och det var lite den känslan, säger hon till TV4 Nyheterna. Hon ångrar inte att hon gick till produktionen. – Vad var alternativet? Att jag skulle berätta för hans barn att nej, vi sa inte till när Aydin åt en uppenbart giftig växt och blev jättesjuk och därför kom inte din pappa hem. Det hade ju varit jätteknäppt. ”Idiot” Efter att Aydin Haressi tvingats lämna ön går flera lagkamrater hårt åt honom och kallar honom bland annat ”idiot”. De menar att han vunnit ”SM i jävla idioti” och att de borde få ”Nobelpriset i tålamod” som stått ut med honom så länge. – Jag skrattade lite för mig själv med tanke på att min tjej har stått ut med mig i 21 år. Och är det någon som borde ha Nobelpris så är det ju hon, säger han till TV4 Nyheterna. Aydin Haressi, som fick mycket tv-tid, tror att en av anledningarna till att de valde att skvallra till produktionen bottnade i avundsjuka. Att det skulle vara motivet och att gruppen var taskiga mot Aydin Haressi är något Iki Gonzalez Magnusson förnekar. – Det är så himla tråkigt, för min inbox är full med hat för att jag är en mobbare. Det känns bara så jävla tråkigt, säger hon.", "link": "https://www.tv4.se/artikel/1oV9Yx3BHmKLG8Mgrdi6Hg/stoppade-fel-grej-i-munnen-lagkamrat-tjallade-dum-asna", "date_display": "2026-04-02", "date_iso": "2026-04-02T17:40:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 136, "title": "Öfvergård responds after the famous advertisement: \"It felt absolutely right\"", "summary": "Anders Öfvergård - known to many as the \"Angry Carpenter\" - is a familiar face to the Swedish people.  But a couple of years ago a scandal broke. It turned out that he stole a sirloin steak and an entrecote worth SEK 400 from a self-scan at Ica Maxi in Värmdö. He was convicted of petty theft and had to pay a fine of SEK 40,000. He himself believed that it happened by mistake, but the court ruled that he stole the goods intentionally.  April fools joke? That's why many raised their eyebrows when he appeared in a Lidl campaign on April Fool's Day - where he advertised meat. In the post, he holds up meat from Lidl but with the text \"Swedish meat worth every penny\". Comedian Anis don Demina writes \"stroke of genius.\" At first there was speculation that it was all a joke. \"Oh haha ​​best April Fool's joke so far today,\" writes one person in the comments. Confirmed on social media But in a sketch on Anders Öfvergård's own profile, the advertisement is confirmed. \"I don't agree to anything. But this felt right.\" The whole sketch is based on Anders Öfvergård standing in the self-scan and having to pay for meat, but he doesn't want to make a mistake and asks for help.  - Something seems to have gone wrong here, he says. The comments on the post are mostly positive. Tobbe the magician writes \"😂😂😂 Love you!!!\" and Bettina Buchanan \"Hahaha OOOOOOOOOOO!!!!\". Now he will do meat advertising for Lidl. - We were looking for someone with an interest in good meat. The fact that Anders also knows exactly what is worth every penny made the choice easy. We are happy that he now chooses to pass the checkout with our meat, we see that as the ultimate quality certificate, says Matthias Glöckler, head of media and digital marketing at Lidl, to Expressen.", "title_original": "Öfvergård svarar efter omtalade reklamen: ”Det kändes helt rätt”", "summary_original": "Anders Öfvergård – bland många känd som ”Arga snickaren” – är ett bekant ansikte för svenska folket.  Men för ett par år sedan briserade en skandal. Det visade sig att han stulit en ryggbiff och en entrecote värd 400 kronor från en självscanning på Ica Maxi på Värmdö. Han dömdes för ringa stöld och fick betala 40 000 kronor i böter. Han menade själv att det skedde av misstag men rätten dömde att han uppsåtligen stulit varorna.  Första aprilskämt? Därför höjde många på ögonbrynen när han dök upp i en Lidl-kampanj på första april – där han gjorde reklam för kött. I inlägget håller han upp kött från Lidl men texten ”svenskt kött värt varje krona”. Komikern Anis don Demina skriver ”genidrag.”. Till en början fanns spekulation om att det hela var ett skämt. ”Åh haha bästa aprilskämtet hittills idag”, skriver en person i kommentarerna. Bekräftas på sociala medier Men i en sketch på Anders Öfvergårds egen profil bekräftas reklamen. ”Jag tackar inte ja till vad som helst. Men det här kändes rätt.” Hela sketchen bygger på att Anders Öfvergård står i självscanningen och ska betala för kött, men han vill inte göra fel och ber om hjälp.  – Det verkar ha blivit nått fel här, säger han Kommentarerna på inlägget är mestadels positiva. Tobbe trollkarl skriver ”😂😂😂 Älskar dig!!!” och Bettina Buchanan ”Hahaha OOOOTROLIGT!!!!”. Nu ska han alltså göra köttreklam för Lidl. – Vi letade efter någon med ett intresse för bra kött. Att Anders dessutom har stenkoll på vad som är värt varje krona gjorde valet enkelt. Vi är glada att han numera väljer att passera kassan med vårt kött, det ser vi som det ultimata kvalitetscertifikatet, säger Matthias Glöckler, chef för media och digital marknadsföring på Lidl, till Expressen.", "link": "https://www.tv4.se/artikel/1HlCsSlKJh6JN1JlgUS4hU/oefvergard-svarar-efter-omtalade-reklamen-det-kaendes-helt-raett", "date_display": "2026-04-02", "date_iso": "2026-04-02T17:09:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/lidl", "/kott", "/noje"]}, {"id": 137, "title": "\"Tough conversation\" with Trump - then the minister was fired", "summary": "According to CNN's sources, Trump is said to have been annoyed with Attorney General Pam Bondi's handling of the Epstein files and because she did not investigate or prosecute enough of his political opponents.  On Thursday, reports came from several American media, citing information, that Trump had chosen to fire Bondi. The White House initially denied the reports, but a short time later Trump came out and told that Bondi is quitting.  \"Pam did a tremendous job overseeing extensive law enforcement across our country,\" Trump wrote. \"A great American patriot\" On the night of Thursday, Swedish time, Trump gave a speech in which he updated on the situation in Iran. Shortly before the speech, Trump reportedly had a meeting with Bondi, where she was informed that she would not remain in her post for much longer.  The meeting between Bondi and Trump is said to have been \"tough\" and the president is said to have discussed the decision with several of his closest associates in recent days. Trump writes that Bondi will now work in the private sector instead and thanks her for the work she has done as minister.  \"Pam Bondi is a great American patriot and a loyal friend who has faithfully served as my Attorney General for the past year,\" Trump wrote. Details: Zeldin Takes Over Deputy Attorney General Todd Blanche will temporarily take over Bondi's role. According to Fox News, the White House is now considering appointing Lee Zeldin as the new attorney general. Today, he is head of the US Environmental Protection Agency EPA.  Zeldin is said to have met with Trump on Tuesday to discuss other issues, but then the ministerial post is also said to have been discussed.  The announcement comes just weeks after Trump fired Homeland Security Secretary Kristi Noem. She was instead given a role as special envoy for \"The Shield of the Americas\", which Trump describes as a \"new security initiative in the Western Hemisphere\".", "title_original": "”Tuffa samtalet” med Trump – sedan sparkades ministern", "summary_original": "Enligt källor till CNN ska Trump ha varit irriterad på hur justitieminister Pam Bondi hanterat Epstein-filerna och för att hon inte utrett eller åtalat tillräckligt många av hans politiska motståndare.  På torsdagen kom rapporter från flera amerikanska medier, med hänvisning till uppgifter, om att Trump valt att sparka Bondi. Vita huset förnekade först uppgifterna, men en kort stund senare gick Trump ut och berättade att Bondi slutar.  ”Pam gjorde ett enormt arbete med att övervaka en omfattande brottsbekämpning i hela vårt land”, skriver Trump. ”En stor amerikansk patriot” Natten mot torsdag, svensk tid, höll Trump ett tal där han uppdaterade om läget i Iran. Strax innan talet ska Trump enligt uppgifter, haft ett möte med Bondi, där hon meddelades att hon inte skulle vara kvar på sin post länge till.  Mötet mellan Bondi och Trump ska ha varit ”tufft“ och presidenten uppges ha diskuterat beslutet med flera av sina närmaste de senaste dagarna. Trump skriver att Bondi nu kommer att arbeta i den privata sektorn istället och tackar henne för arbetet hon utfört som minister.  ”Pam Bondi är en stor amerikansk patriot och en lojal vän, som troget har tjänstgjort som min justitieminister under det senaste året”, skriver Trump. Uppgifter: Zeldin tar över Den biträdande justitieministern Todd Blanche kommer tillfälligt att ta över Bondis roll. Enligt uppgifter till Fox News överväger Vita huset nu att utse Lee Zeldin till ny justitieminister. I dag är han chef över USA:s miljöskyddsmyndighet EPA.  Zeldin ska ha träffat Trump under tisdagen för att diskutera andra frågor, men då ska även ministerposten ha diskuterats.  Beskedet kommer bara några veckor efter att Trump sparkade inrikessäkerhetsminister Kristi Noem. Hon fick i stället en roll som särskilt sändebud för ”The Shield of the Americas” som Trump beskriver som ett ”nytt säkerhetsinitiativ på västra halvklotet”.", "link": "https://www.tv4.se/artikel/3OWATSY3PM2juKK3y972W1/uppgifter-trump-sparkar-bondi", "date_display": "2026-04-02", "date_iso": "2026-04-02T17:09:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/donald-trump", "/usa"]}, {"id": 138, "title": "Republicans and Democrats join forces - after Trump's statement", "summary": "Joint comment after the NATO performance", "title_original": "Republikaner och demokrater går samman – efter Trumps uttalande", "summary_original": "Gemensam kommentar efter Nato-utspelet", "link": "https://www.tv4.se/artikel/4p3AUCXBPHTvAaTUKvqeoH/republikaner-och-demokrater-gar-samman-efter-trumps-uttalande", "date_display": "2026-04-02", "date_iso": "2026-04-02T16:32:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 139, "title": "Right-wing profiler Aron Flam is prosecuted - after a big fight: \"Really ashamed\"", "summary": "In July this year, Marie Åkesdotter, elected for the Green Party in Tyresö, and right-wing profiler Aron Flam, on X, argued about the war in Gaza. Aron Flam is a screenwriter and comedian, but is now above all known as a debater and opinion leader on the right wing. He has over 80,000 followers on X and runs the community podcast \"Deconstructive criticism\". Now he is being charged with unlawful threats, alternatively molestation. During the argument, he called Åkesdotter a \"Nazi\", \"Hamas groupie\", \"Jew hater\" and \"Nazi cunt\". He also urged Åkesdotter to kill herself. \"Are you stupid or not? PS! Now I have your home address,\" he wrote later, which according to the prosecutor's side constitutes the threat itself. Åkesdotter: Very unpleasant Aron Flam \"crossed all boundaries\", says Marie Åkesdotter to TV4 Nyheterna. She says that the debater tried to turn her criticism into anti-Semitism, but that during the exchange of words she kept pointing out that it was Israel's far-right government that she was criticizing. - I felt that he tried to scare me into silence. He ended up threatening me. Then I felt that this is not okay - we cannot have such a social climate. The local politician wasn't particularly worried about him personally doing anything to her, but possibly his tail. - He has a big platform, with a lot of fans. It's a high pitch now, she says. - It has also affected my family, who are worried and sad, of course.  After the incident, Marie Åkesdotter has publicly removed her contact details. Flam: Ashamed of how I spoke Aron Flam does not believe that he has threatened her.  - She doesn't seem to have perceived it as a threat. She has slept on the matter and then decided to report it. In questioning, Marie Åkesdotter says that she slept on the matter and then chose to report it because \"it was over the line\". - It was a clear attempt to scare me into silence, she says in questioning. Aron Flam says that Marie Åkesdotter called him a genocide, genocide apologist and child killer, which he considers to be a type of", "title_original": "Högerprofilen Aron Flam åtalas – efter storbråk: ”Skäms verkligen”", "summary_original": "I juli i år bråkade Marie Åkesdotter, folkvald för Miljöpartiet i Tyresö, och högerprofilen Aron Flam, på X, om kriget i Gaza. Aron Flam är manusförfattare och komiker, men är numera framför allt känd som debattör och opinionsbildare på högerkanten. Han har över 80 000 följare på X och driver samhällspodden ”Dekonstruktiv kritik”. Nu åtalas han för olaga hot, alternativt ofredande. Under grälet kallade han bland annat Åkesdotter för ”nazist”, ”Hamasgroupie”, ”judehatare” och ”nazistfitta”. Han uppmanade även Åkesdotter att ta livet av sig. ”Är du dum eller? PS! Nu har jag din hemadress”, skrev han senare, vilket enligt åklagarsidan utgör själva hotet. Åkesdotter: Väldigt obehagligt Aron Flam ”gick över alla gränser”, säger Marie Åkesdotter till TV4 Nyheterna. Hon säger att debattören försökte få hennes kritik till antisemitism, men att hon under ordväxlingen hela tiden poängterade att det var Israels högerextrema regering som hon kritiserade. – Jag upplevde att han försökte skrämma mig till tystnad. Det slutade med att han hotade mig. Då kände jag att det här inte är okej – vi kan inte ha ett sådant samhällsklimat. Lokalpolitikern var inte speciellt orolig för att han personligen skulle göra något mot henne, men möjligen hans svans. – Han har en stor plattform, med väldigt många fans. Det är ett högt tonläge nu, säger hon. – Det har påverkat min familj också som blir oroliga och ledsna, såklart.  Efter händelsen har Marie Åkesdotter tagit bort sina kontaktuppgifter offentligt. Flam: Skäms för hur jag uttalade mig Aron Flam anser inte att han har hotat henne.  – Hon verkar inte ha uppfattat det som ett hot. Hon har sovit på saken och sedan valt att anmäla. I förhör säger Marie Åkesdotter att hon sov på saken och sedan valde att anmäla eftersom ”det var över gränsen”. – Det var ett klart försök att skrämma mig till tystnad, säger hon i förhör. Aron Flam säger att Marie Åkesdotter kallat honom folkmördare, folkmordsapologet och barnamördare, vilket han anser är en typ av hot.  – Jag anser att hon lett en digital mobb mot mig och trakasserat mig. I förhör säger han att han tappade humöret och uttrycker ånger för det han skrev. – Under något av våra utbyten så kom hon verkligen in under skinnet på mig och jag skäms verkligen för hur jag uttalade mig. Så fort jag hade insett att det här är ju inte en konstruktiv dialog, och har inte varit det under någon av tillfällena vi har kommunicerat, så blockade jag henne.", "link": "https://www.tv4.se/artikel/51b2mOCteFMuL3UA7zzAxe/hoegerprofilen-aron-flam-atalas-efter-storbrak-skaems-verkligen", "date_display": "2026-04-02", "date_iso": "2026-04-02T14:45:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/olaga-hot", "/sociala-medier", "/brott-och-straff"]}, {"id": 140, "title": "The new trend: Powerpoint dating", "summary": "Powerpoint dating works so that friends of the person who wants to meet love take over the presentation, and deliver a number of statements and pictures of their single friend in front of the audience. Angela Ahola, PhD in psychology and dating expert, is very positive about the new method. \n\n- This new phenomenon is so much fun, and it's actually a modern version of an old strategy with matchmaking via friends, she says.  Three reasons for success Powerpoint dating has become a trend in both the USA, Great Britain and Australia, and Angela Ahola believes that there are three reasons why it can be a success in Sweden as well.  - We combine three very smart and good things. We thirst for the physical meeting, so we get it. Then we also get a social context for the person. As the finishing touch, we get a person who vouches for this person. If someone recommends a book or series, we're more likely to watch it, this third-party verification is powerful. \"Seems great fun\" Does this mean the apps are about to disappear?  - You have seen a decrease in app use, but I think they will remain. Rather, this is a reaction to how the apps make us feel. It's fun, we get to laugh, we get pitched. I think it looks like great fun, says Angela Ahola.", "title_original": "Nya trenden: Powerpoint-dejting", "summary_original": "Powerpoint-dejtingen går till så att vänner till den som vill möta kärleken tar över presentationen, och levererar ett antal påståenden och bilder på sin singelvän inför publiken. Angela Ahola, doktor i psykologi och dejtingexpert, är mycket positiv till den nya metoden. \n\n– Det är så himla roligt det här nya fenomenet, och det är egentligen en modern version av en gammal strategi med matchmaking via vänner, säger hon.  Tre skäl till succé Powerpoint-dejtingen har blivit en trend i både USA, Storbritannien och Australien, och Angela Ahola menar att det finns tre skäl till varför den kan bli en succé även i Sverige.  – Vi kombinerar tre himla smarta och bra grejer. Vi törstar efter det fysiska mötet, så dels får vi in det. Sen får vi även in en social kontext för personen. Som pricken över i får vi en person som går i god för den här människan. Om någon rekommenderar en bok eller serie kommer vi mer sannolikt att titta på den, den här tredjeparts verifieringen är kraftfull. ”Verkar jättekul” Betyder det här att apparna är på väg att försvinna?  – Man har sett ett minskat app-användande men jag tror att de kommer att finnas kvar. Snarare är det här en reaktion på hur apparna får oss att känna oss. Det är kul, vi får skratta, vi blir pitchade. Det verkar jättekul tycker jag, säger Angela Ahola.", "link": "https://www.tv4.se/artikel/6dXEqmP3kTnG6yeSaOrTqx/nya-singeltrenden-powerpoint-dejting", "date_display": "2026-04-02", "date_iso": "2026-04-02T14:31:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/relationer", "/trender"]}, {"id": 141, "title": "Gyökeres trademark protects its target gesture - can give millions", "summary": "Viktor Gyökeres has become known for his target gesture, where he puts his hands in front of his face like a mask. Now he has trademarked the gesture with the European Patent Office, as sports journalist Fabrizio Romano was the first to report.  The application was sent in at the beginning of 2025 and was approved in September, as can be seen from documents seen by TV4. Haaland missed Gyökeres follows an international trend where athletes are increasingly seeking trademark protection for their names and gestures. Soccer star Erling Haaland, for example, secured rights in the US to his goal gesture where he sits in the lotus position. However, Haaland missed out in his home country of Norway, where another person bribed the trademark already in the fall of 2022. Other soccer stars who trademarked their goal gestures are Kylian Mbappé and Cole Palmer. Ronaldo's fortune How much trademark protection is worth depends entirely on the extent to which it is used. But the move gives Gyökeres a possible source of income that is potentially worth hundreds of millions of kroner, if the target gesture is used in, for example, a fashion or advertising context.  The business magazine Forbes, for example, values ​​Cristian Ronaldo's fortune at 280 million dollars, and a large part of that value comes from sponsorship deals and the CR7 brand.", "title_original": "Gyökeres varumärkesskyddar sin målgest – kan ge miljoner", "summary_original": "Viktor Gyökeres har blivit känd för sin målgest, där han sätter händerna framför ansiktet som en mask. Nu har han varumärkesskyddat gesten hos den Europeiska patentmyndigheten, vilket sportjournalisten Fabrizio Romano var först med att rapportera.  Ansökan skickades in i början på 2025 och blev godkänd i september, vilket framgår av handlingar som TV4 tagit del av. Haaland missade Gyökeres följer en internationell trend där idrottare allt mer söker varumärkesskydd för sina namn och gester. Fotbollsstjärnan Erling Haaland säkrade exempelvis rättigheter i USA till sin målgest där han sitter i lotusställning. Däremot missade Haaland i sitt hemland Norge, där en annan person mutade in varumärket redan hösten 2022. Andra fotbollsstjärnor som varumärkesskyddat sina målgester är Kylian Mbappé och Cole Palmer. Ronaldos förmögenhet Hur mycket varumärkesskyddet är värt beror helt på i vilken omfattning det används. Men draget ger Gyökeres en möjlig intäktskälla som potentiellt är värd hundratals miljoner kronor, om målgesten används i exempelvis mode- eller reklamsammanhang.  Affärstidningen Forbes värderar exempelvis Cristian Ronaldos förmögenhet till 280 miljoner dollar, och en stor del av det värdet kommer från sponsoravtal och varumärket CR7.", "link": "https://www.tv4.se/artikel/1KjMgJ6jBJZO0vj8Um27xJ/gyoekeres-varumaerkesskyddar-sin-malgest", "date_display": "2026-04-02", "date_iso": "2026-04-02T12:17:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotboll", "/svensk-fotboll", "/svensk-ekonomi"]}, {"id": 142, "title": "The blackmailers' New Year's greeting: \"WRONG FAMILY! Cheers\"", "summary": "On December 15 last year, a two-week nightmare began for a family in Halmstad. The mother in the family started receiving text messages from unknown people who said that her sons had a drug debt of 130,000 kroner. But they had not borrowed any money. Throwing stones at the house \"Your sons owe drug money, they have to pay it back, it's urgent\", \"we won't let this go so easily as you know\", \"my money, they're going to get your fucking dirt\", she had to read. The family also had photographs of their villa sent to them, and on December 19, two guys appeared at the house and threw stones. They could be arrested by the police, who set up cameras at the house. Murder contract on the sons Around the same time, an assignment was posted on the platform Signal, about \"cutting 2 Swedish brothers in Halmstad who need to learn their homework\". Weapons and accommodation would be settled by the client. The family found out about this and then had to live under police protection and were forced to cancel the entire Christmas. The twist: \"Sick, isn't it?\" But around New Year there was a different tone in the messages. Then an SMS came in which the extortionists wrote that they had received money from those who had the real debt. \"SLOWLY but SURELY after a while into the discussion with XX's brother I understood that you are the WRONG FAMILY! Sick right?\", wrote the sender. \"Merry Christmas and Happy New Year Greetings from the mountains\". Five sentenced Now five people are sentenced for involvement in the tangle. Two men in their 20s are convicted of attempted extortion and aiding and abetting attempted extortion. One of them is previously convicted of attempted murder. Two minors are sentenced to youth care for the same crime. A man in his 40s gets five months in prison for aiding and abetting attempted extortion, and aggravated illegal driving. The convicts must also pay SEK 18,000 each in damages to the five family members who were affected. It is still unknown who gave the perpetrators the assignment.", "title_original": "Utpressarnas nyårshälsning: ”FEL FAMILJ! Skål”", "summary_original": "Den 15 december förra året började en två veckor lång mardröm för en familj i Halmstad. Mamman i familjen började få sms från okända människor som sade att hennes söner hade en knarkskuld på 130 000 kronor. Men de hade inte lånat några pengar. Kastade sten mot huset ”Dina söner e skyldiga knarkpengar de måste betala tillbaka det e akut”, ”vi kommer inte släppa detta så enkelt så ni vet”, ”mina pengar, dom ska fram era fucking smuts”, fick hon läsa. Familjen fick även fotografier på sin villa skickade till sig, och den 19 december dök två killar upp vid huset och kastade sten. De kunde gripas av polis, som satt upp kameror vid huset. Mordkontrakt på sönerna Ungefär samtidigt lades ett uppdrag ut på plattformen Signal, om att ”klippa 2 svenska bröder i Halmstad som behöver lära sig läxor”. Vapen och boende skulle uppdragsgivaren lösa. Familjen fick nys om detta och var då tvungna att leva under polisskydd och tvingades ställa in hela julen. Vändningen: ”Sjukt eller hur ?\" Men runt nyår blev det en annan ton i meddelandena. Då kom ett sms där utpressarna skrev att de fått in pengar från de som hade den riktiga skulden. ”SAKTA men SÄKERT efter en stund in i diskussionen med XX bror så förstod jag att ni är FEL FAMILJ! Sjukt eller hur ?”, skrev avsändaren. ”Skål Godjul och Gottnytt år Hälsingar från fjällen”. Fem döms Nu döms fem personer för inblandning i härvan. Två män i 20-årsåldern döms för försök till utpressning och medhjälp till försök till utpressning. En av dem är tidigare dömd för mordförsök. Två minderåriga döms till ungdomsvård för samma brott. En man i 40-årsåldern får fem månaders fängelse för medhjälp till försök till utpressning, och grov olovlig körning. De dömda ska även betala 18 000 kronor vardera i skadestånd till de fem familjemedlemmar som drabbats. Det är fortfarande okänt vem som gav gärningsmännen uppdraget.", "link": "https://www.tv4.se/artikel/1WFkKPaRmNWhkmXrzjKhNS/utpressarnas-nyarshaelsning-fel-familj-skal", "date_display": "2026-04-02", "date_iso": "2026-04-02T12:06:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/utpressning", "/polisen"]}, {"id": 143, "title": "So many young people worry about their personal finances", "summary": "A new survey from LO paints a dark picture of young people's faith in the future. According to the survey, every third young person worries about their personal finances, and the worry is greatest among women. This is an increase of four percent compared to the previous year. The record high unemployment rate among young people is said to be a contributing cause of the increased anxiety. - It is a very dark situation for young people on the labor market, and our survey confirms what we warned about. A youth generation that feels abandoned and lacks hope for the future, says Elsa Alm, youth secretary at LO. The concern about not getting a job has increased from 43 to 57 percent – ​​a clear increase from last year, according to LO. An important election issue Even among those who have a job, there is increased concern, according to LO. 23 percent of those who work are afraid of losing their jobs, especially those with temporary or part-time employment. Unemployment has also climbed the list of issues young people think are important in the election, the survey shows. Only healthcare is rated as more important, which is also a clear increase from last year's survey. The survey was conducted by Novus and had 2,178 respondents. The groups' results are weighted based on Statistics Sweden's data on gender and age.", "title_original": "Så många unga oroar sig över sin privatekonomi", "summary_original": "En ny undersökning från LO målar upp en mörk bild av ungas framtidstro. Enligt undersökningen oroar sig var tredje ung för sin privatekonomi, och oron är störst bland kvinnor. Det är en ökning med fyra procent jämfört med året innan. Den rekordhöga arbetslösheten bland unga uppges vara en bidragande orsak till den ökade oron. – Det är ett mycket mörkt läge för unga på arbetsmarknaden, och vår undersökning bekräftar det vi varnat för. En ungdomsgeneration som känner sig övergivna och saknar hopp om framtiden, säger Elsa Alm, ungsekreterare på LO. Oron att inte få ett jobb har ökat från 43 till 57 procent – en tydligt ökning från förra året, enligt LO. En viktig valfråga Även bland dem som har ett jobb finns en ökad oro, enligt LO. 23 procent av dem som arbetar är rädda för att bli av med jobbet, särskilt de som har visstids- eller deltidsanställning. Arbetslösheten har också klättrat på listan över frågor unga tycker är viktiga i valet, visar undersökningen. Endast sjukvården bedöms som viktigare, vilket också är en tydlig ökning från förra årets undersökning. Undersökningen gjordes av Novus och hade 2 178 svarande. Gruppernas resultat är viktade utifrån SCBs uppgifter på kön och ålder.", "link": "https://www.tv4.se/artikel/eR1To4c1eaEiDQxcu5NSa/sa-manga-unga-oroar-sig-oever-sin-privatekonomi", "date_display": "2026-04-02", "date_iso": "2026-04-02T10:35:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/landsorganisationen-i-sverige-lo", "/arbetsmarknaden", "/halsa", "/ekonomi"]}, {"id": 144, "title": "Love is blind-Ellen about the storm of hate - \"A social problem\"", "summary": "Today, the last episode - the reunion - of this year's season of \"Love Is Blind Sweden\" was released. In the reality series, singles date behind closed doors in capsules and get engaged before they've even seen each other.  One of the season's most talked about participants is Ellen O'Reilly. She accepted a proposal from Fabian Patterson without seeing him, but when they first met she chose to break off the engagement immediately. In Nyhetsmorgan, she explains that she panicked. - You can see that in my body language. It's a charged situation for both of them. \"It doesn't feel good\" When Ellen O'Reilly gets to meet Fabian Patterson for the first time, she describes that reality catches up with her. - Somewhere the gut feeling kicks in, at the absolute worst time. It doesn't feel good. And there you have a choice to either go ahead with the experiment, accept the ring and later find an excuse that looks better on TV - or to be honest and say how you feel. For me it was the latter, she says in Nyhetsmorgon. The pressure and expectations were too great, she believes. - You have time to think a thousand thoughts. But one thought that was very clear was: If this is love, then it costs far too much for me. There will be such enormous pressure. Receives a lot of hate Her actions in the television program have provoked strong reactions and Ellen O'Reilly has received many critical comments. - I don't think you can ever prepare for it. Of course, I've had great reactions as well, but the reactions have been strong. And mainly from women. What do they say? - It is, after all, the classic online hate, which is a major social problem today. It is worrying. She says that she apologized to Fabian Patterson and that they straightened everything out after the cameras went off.", "title_original": "Love is blind-Ellen om hatstormen – ”Ett samhällsproblem”", "summary_original": "I dag släpptes det sista avsnittet – återträffen – av årets säsong av ”Love Is Blind Sverige”. I realityserien dejtar singlar bakom stängda dörrar i kapslar och förlovar sig innan de ens sett varandra.  En av säsongens mest omtalade deltagare är Ellen O’Reilly. Hon sa ja till ett frieri från Fabian Patterson utan att ha sett honom, men när de möttes första gången valde hon att bryta förlovningen direkt. I Nyhetsmorgon förklarar hon att hon fick panik. – Det ser man på mitt kroppsspråk. Det är en laddad situation för båda två. ”Det känns inte bra” När Ellen O’Reilly får träffa Fabian Patterson för första gången beskriver hon att verkligheten kommer i kapp henne. – Där någonstans kickar magkänslan in, i absolut sämsta tillfället. Det känns inte bra. Och där har man ett val att antingen gå vidare i experimentet, ta emot ringen och senare hitta en ursäkt som ser bättre ut på tv – eller att vara ärlig och säga hur det känns. För mig blev det sistnämnda, säger hon i Nyhetsmorgon. Pressen och förväntningarna blev för stora, menar hon. – Man hinner tänka tusen tankar. Men en tanke som var väldigt tydlig var: Om det här är kärlek, då kostar det alldeles för mycket för mig. Det blir en sådan enorm press. Får ta emot mycket hat Hennes agerande i tv-programmet har väckt starka reaktioner och Ellen O’Reilly har fått ta emot många kritiska kommentarer. – Jag tror aldrig att man kan förbereda sig på det. Självklart har jag fått jättefina reaktioner också, men reaktionerna har varit starka. Och främst från kvinnor. Vad säger de? – Det är ju det klassiska näthatet, vilket är ett stort samhällsproblem i dag. Det är bekymmersamt. Hon berättar att hon bett om ursäkt till Fabian Patterson och att de rett ut allt efter att kamerorna slocknat.", "link": "https://www.tv4.se/artikel/5P7AyeO5Z3RXTHwetCBkiX/love-is-blind-ellen-om-hatstormen-ett-samhaellsproblem", "date_display": "2026-04-02", "date_iso": "2026-04-02T10:34:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/tv", "/love-is-blind-sverige", "/tv-program", "/tv-serier", "/netflix"]}, {"id": 145, "title": "Messy Easter weather – snow, rain, icy conditions and sun", "summary": "Easter weather looks set to be unsettled with rain, snow and the risk of muddy roads. Those traveling from the Mälardal region and southern Sweden, to cross the Dalälven and get up to the mountains may have to expect to pass through snow or icy conditions.  - It looks like there will be very large local variations, with a few surprises regarding the road conditions, says TV4's meteorologist Ulrika Elvgren.  It will be cold nights in the whole of Norrland, but on the night of Easter Eve there may be snow in southern Sweden as well. Near the coast in the south, the risk of slipping is considered to be less.  Sun in its places Despite the unsettled weather, the sun can peek out in its places. - If you have rain in the morning, there will be some sun in the afternoon and vice versa.  On Good Friday, it seems to be sunniest in Norrland, while the west coast may have a sunny but windy Easter Eve. Even in southern Götaland and along the Västerbotten and Norrbotten coasts, the sun can peek out during Saturday.  - On Easter day, it is once again the Norrland coast and perhaps even the Lapland mountains that will get some sun, says Ulrika Elvgren. Drive carefully Easter is a big traffic weekend and Ulrika Elvgren advises against driving with summer tires if you are traveling north and inland.  - Now the sun is doing its job, but it can still be quite slippery at the beginning of April.  She also advises travelers to follow the forecast extra carefully.  - You might also be able to avoid driving when it's worst. Now there will be a narrower and narrower window during the day as it is extra slippery, says Ulrika Elvgren.", "title_original": "Stökiga påskvädret – snö, regn, ishalka och sol", "summary_original": "Påskvädret ser ut att bli ostadigt med regn, snö och risk för moddiga vägbanor. Den som reser från Mälardalsregionen och södra Sverige, för att passera Dalälven och ta sig upp till fjällen kan behöva räkna med att passera snö eller ishalka.  – Det ser ut att bli väldigt stora lokala variationer, med lite överraskningar kring väglaget, säger TV4:s meteorolog Ulrika Elvgren.  Det blir kalla nätter i hela Norrland, men natten till påskafton kan det bli snö även i södra Sverige. Nära kusten i söder bedöms risken för halka vara mindre.  Sol på sina håll Trots det ostadiga vädret kan solen titta fram på sina håll. – Har du regn på morgonen så kommer det kunna bli lite sol på eftermiddagen och vice versa.  På långfredagen verkar det bli soligast i Norrland, medan västkusten kan få en solig men blåsig påskafton. Även i södra Götaland och längs med Västerbottens- och Norrbottenskusten kan solen titta fram under lördagen.  – På påskdagen är det återigen Norrlandskusten och kanske till och med Lapplandsfjällen som får lite sol, säger Ulrika Elvgren. Kör försiktigt Påsken är en stor trafikhelg och Ulrika Elvgren avråder från att köra med sommardäck om man ska resa norrut och inåt i landet.  – Nu gör ändå solen sitt, men det kan fortfarande vara rejält halt i början av april.  Hon råder också resenärer att följa prognosen extra noggrant.  – Man kanske också kan undvika att köra när det är som halast. Nu blir det ett smalare och smalare fönster under dygnet då det är extra halt, säger Ulrika Elvgren.", "link": "https://www.tv4.se/artikel/6lBE1QMcldLIgqylMsoxHm/stoekiga-paskvaedret-snoe-regn-ishalka-och-sol", "date_display": "2026-04-02", "date_iso": "2026-04-02T09:49:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/vadret", "/paskvadret", "/trafiken"]}, {"id": 146, "title": "Vinegar-cooked salmon with dill mayonnaise", "summary": "Today's dinner tip offers cooked salmon where vinegar provides a healthy and balanced acid instead of traditional vinegar. The juicy salmon is accompanied by creamy dill mayonnaise and crispy gherkins. Serve with boiled potatoes for a complete meal. See Stefan Ekengren's recipe", "title_original": "Vinägerinkokt lax med dillmajonnäs", "summary_original": "Dagens middagstips bjuder på inkokt lax där vinäger ger en frisk och balanserad syra istället för traditionell ättika. Den saftiga laxen får sällskap av krämig dillmajonnäs och krispig pressgurka. Servera gärna med kokt potatis för en komplett måltid. Se Stefan Ekengrens recept", "link": "https://www.tv4.se/artikel/4arkkRn4IRegjoLWZzzsqg/vinaegerinkokt-lax-med-dillmajonnaes", "date_display": "2026-04-02", "date_iso": "2026-04-02T08:44:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/stefan-ekengren", "/koket", "/kokets-middag"]}, {"id": 147, "title": "Karl has received 16 threatening calls: \"They can kill your wife and your child\"", "summary": "Karl Mattias Bergsten, formerly known as Mehdi Houshmand Rahimi, has long supported Crown Prince Reza Pahlavi as the new leader of Iran if the regime falls. He has participated in several demonstrations and says himself that he had close contact with the crown prize. \n\nHe is not above threats from regime supporters, but in recent weeks the attacks have increased.\n\n- They say: We are calling from the Revolutionary Guard of the Islamic Republic, if you continue, we have your parents. We arrest them and they will pay for what you do.\n\nThey target his relatives in Iran but also his wife and children in Sweden. During the interview, someone calls and tells him to shut up. He says they even threatened to hire a shooter in Sweden to kill him. - You can only pay 1,000-2,000 to a young person and they can murder your wife, they can murder your child. Threats from several quarters TV4 Nyheterna has spoken to several Iranians in exile who testify to threats from the regime, but also from other quarters. - Previously, I was worried about the Islamic regime that threatens our security. Today, there are two fronts that we are worried about. Extreme royalists, who come with threats and harassment, in addition to the Iranian regime, says Mehrdad Darvishpour, associate professor of social work at Mälardalen University.  He does not support US and Israeli attacks on Iran and says he has received threats from extreme royalists. But it is difficult to know whether they are really royalists or actually come from the Islamic regime, he believes.  He belonged to the radical left in Iran and was involved in the revolution against the shah in 1979. He was imprisoned by the Revolutionary Guard, escaped and ended up in Sweden. Here he has demonstrated and received threats from the regime for a long time. He does not believe that the intervention of the United States and Israel makes the situation better. - War and Iranian oppression create nothing but suffering and a dark future for Iran. The intervention creates an opportunity Karl Mattias Bergsten, who is active in the Sweden Democrats, says that of course he is in", "title_original": "Karl har fått 16 hotsamtal: ”De kan mörda din fru och ditt barn”", "summary_original": "Karl Mattias Bergsten, som tidigare hette Mehdi Houshmand Rahimi, har länge stöttat kronprinsen Reza Pahlavi som ny ledare i Iran om regimen faller. Han har deltagit i flera demonstrationer och säger själv att han haft nära kontakt med kronprisen. \n\nHan är inte ovan vid hot från regimanhängare men de senaste veckorna har attackerna ökat.\n\n– De säger: Vi ringer från revolutionsgardet av Islamiska republiken, om du fortsätter så har vi dina föräldrar. Vi arresterar dem och de kommer att betala för vad du gör.\n\nDe riktar in sig mot hans anhöriga i Iran men även hans fru och barn i Sverige. Under intervjun ringer någon och ber honom hålla käften. Han säger att de till och med hotat med att anlita en skytt i Sverige för att mörda honom. – Man kan bara betala 1 000–2 000 till en ung människa och de kan mörda din fru, de kan mörda ditt barn. Hot från flera håll  TV4 Nyheterna har pratat med flera exiliranier som vittnar om hot från regimen, men även från andra håll. – Tidigare var jag orolig för den islamiska regimen som hotar vår säkerhet. Idag är det två fronter som vi är oroliga för. Extremrojalister, som kommer med hot och trakasserier, utöver den iranska regimen, säger Mehrdad Darvishpour, docent i socialt arbete vid Mälardalens universitet.  Han stöttar inte USA och Israels attacker mot Iran och säger att han fått hot från extremrojalister. Men det är svårt att veta om de verkligen är rojalister eller egentligen kommer från den islamiska regimen, menar han.  Han tillhörde den radikala vänstern i Iran och var med i revolutionen mot shahen 1979. Han sattes i fängelse av revolutionsgardet, flydde och hamnade till slut i Sverige. Här har han demonstrerat och fått hot från regimen länge. Han tror inte att USA:s och Israels intervention gör situationen bättre. – Krig och det iranska förtrycket skapar ingenting annat än lidelse och en mörk framtid för Iran. Interventionen skapar en möjlighet Karl Mattias Bergsten, som är aktiv i Sverigedemokraterna, säger att han såklart inte stöttar krig i Iran, men att USA och Israel skapar en möjlighet för folket i Iran.  Han tror också att hot från rojalister egentligen är förklädda regimanhängare.  – Demokrati betyder att vi rojalister samarbetar med de som är icke-rojalister. Polisen skriver till TV4 Nyheterna att hot mot amerikanska, judiska och israeliska intressen har ökat. De bedriver ett antal skyddsärenden i nära samverkan med Säkerhetspolisen. De uppmanar också utsatta att höra av sig. Liknande svar kommer från Säkerhetspolisen. ”Att hotet inte riktas mot Sverige som land utan mot symboliska platser. Att vi också ser ett hot mot tongivande iranska oppositionella, som den iranska regimen uppfattar som ett hot.”", "link": "https://www.tv4.se/artikel/3141A1GZAfpVv8Yxy6McMB/hoten-mot-exiliranier-oekar-fatt-16-samtal-fran-iran", "date_display": "2026-04-02", "date_iso": "2026-04-02T08:24:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/iran", "/hot", "/irankriget"]}, {"id": 148, "title": "Postcovid still affects thousands of Swedes", "summary": "Six years after the outbreak of the pandemic, thousands of Swedes are still struggling with post-covid - and the Karolinska Institute's researchers state that effective treatments are still lacking. \n The post Postcovid still affects thousands of Swedes appeared first on ABC Nyheter.", "title_original": "Postcovid drabbar fortfarande tusentals svenskar", "summary_original": "Sex år efter pandemins utbrott kämpar tusentals svenskar fortfarande med postcovid – och Karolinska Institutets forskare konstaterar att effektiva behandlingar ännu saknas. \n The post  Postcovid drabbar fortfarande tusentals svenskar  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/postcovid-drabbar-fortfarande-tusentals-svenskar/", "date_display": "2026-04-02", "date_iso": "2026-04-02T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Hälsa", "covid-19", "hjärndimma", "Karolinska Institutet", "long covid", "postcovid", "POTS", "vård"]}, {"id": 149, "title": "Teacher shot dead in Södertälje: \"Focus on taking care of students\"", "summary": "The alarm came in at 7:30 a.m. from a residential area in the central parts of the city. - He has been taken to hospital with very serious injuries, said Per Fahlström, press spokesperson at the Stockholm police region, shortly after the shooting. The shot has been identified by the police and it is an adult man, they confirm for TV4 Nyheterna. At lunchtime, the police announced that he is dead.  Worked as a teacher According to information to TV4 Nyheterna, the murder victim worked as a teacher in Salem municipality. \"The Municipality of Salem can confirm that an employee in our business has died after a shooting in Södertälje. It is a very serious incident and our thoughts go out to the employee's relatives,\" it writes on its website. The municipality has activated crisis support after the murder. \"Our full focus is to take care of our students and employees in a situation that causes concern. We have strengthened support in our operations and are close to create security for those who need it.\" Bullet hole in car window Several people are said to have been nearby and the police are questioning witnesses to form a picture of what has happened. The shot man was found outside. - He was found in or next to a car, says Per Fahlström. Photos from the crime scene show bullet holes in the car window near the driver's seat. A police helicopter is circling the area and police forensics officers in white are collecting evidence. A primary school nearby has been housed. \"Not safe in his own area\" The area is described as calm and residents that TV4 Nyheterna spoke to are shocked.  Many of them were on their way to school and work when two explosions echoed between the residential buildings. - You don't really feel safe in your own area anymore. It creates anxiety and worry, especially since I have younger siblings, says Natali Kolosova. Alice Valiente also lives in the area. She says that she will look around a little more in the future. - It never ends, what to do. Others may be affected. This is terrible, that it is so close, she says.", "title_original": "Lärare ihjälskjuten i Södertälje:  ”Fokus att ta hand om elever”", "summary_original": "Larmet kom in vid 07.30-tiden från ett bostadsområde i de centrala delarna av staden. – Han har förts till sjukhus med mycket allvarliga skador, sa Per Fahlström, presstalesperson vid polisregion Stockholm, kort efter skottlossningen. Den skjutne är identifierad av polisen och det rör sig om en vuxen man, bekräftar de för TV4 Nyheterna. Vid lunchtid gick polisen ut med att han är död.  Arbetade som lärare Enligt uppgifter till TV4 Nyheterna arbetade mordoffret som lärare i Salems kommun. ”Salems kommun kan bekräfta att en medarbetare i vår verksamhet har avlidit efter en skjutning i Södertälje. Det är en mycket allvarlig händelse och våra tankar går till medarbetarens anhöriga”, skriver man på sin hemsida. Kommunen har aktiverat krisstöd efter mordet. ”Vårt fulla fokus är att ta hand om våra elever och medarbetare i en situation som väcker oro. Vi har förstärkt stödet i våra verksamheter och finns nära för att skapa trygghet för de som behöver det.” Skotthål i bilruta Flera personer ska ha befunnit sig i närheten och polisen förhör vittnen för att skapa sig en bild av vad som har hänt. Den skjutne mannen hittades utomhus. – Han anträffades i eller i anslutning till en bil, säger Per Fahlström. Bilder från brottsplatsen visar skotthål i bilrutan vid förarplatsen. En polishelikopter cirkulerar över området och polisens vitklädda kriminaltekniker samlar bevis. En grundskola i närheten har inrymts. ”Inte trygg i sitt eget område” Området beskrivs som lugnt och boende som TV4 Nyheterna pratat med är chockade.  Många av dem var på väg till skola och jobb när två smällar ekade mellan bostadshusen. – Man känner sig inte riktigt trygg i sitt eget område längre. Det skapar ångest och oro, speciellt eftersom jag har yngre syskon, säger Natali Kolosova. Alice Valiente bor också i området. Hon berättar att hon kommer att titta sig lite extra omkring framöver. – Det tar ju aldrig slut, vad ska man göra. Andra kan bli drabbade. Det är hemskt det här, att det är så nära, säger hon.", "link": "https://www.tv4.se/artikel/6zejSeW5pd8dFauoEW8a0S/man-skjuten-i-soedertaelje", "date_display": "2026-04-02", "date_iso": "2026-04-02T06:05:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/skjutningar-i-sverige", "/brott"]}, {"id": 150, "title": "Postcovid increases the risk of heart disease - new study", "summary": "It is researchers at the Karolinska Institute who have investigated how remaining health problems after a covid infection are connected with subsequent diseases in the cardiovascular system. The study included 9,000 individuals diagnosed with post-covid in Region Stockholm. Two-thirds of them were women. These were compared with Sweden's other adult population under the age of 65. Heart rhythm disorders and coronary artery disease were found to be more common in both women and men with post-covid. During the four-year follow-up, 18.2 percent of the women and 20.6 percent of the men with post-covid suffered some form of cardiovascular event. Among the group without, the corresponding figure was 8.4 percent and 11.1 percent, respectively. In women, an increased risk of heart failure and peripheral vascular disease was also seen. \"Big number of darkness\". The differences remained even after the researchers adjusted for age, socioeconomics and other risk factors. Even those who have never sought care for their problems can be at risk.  People who had a tough time for several months after their first covid infection may also be affected by these results. Those who did not get well quickly after their covid but had increased fatigue and so for months after the covid-19 infection. We know that there is a large number of dark people, says Axel Carlsson. He urges everyone who has suffered from post-covid to try to compensate with their lifestyle. If you have had such a problem, it is important that you keep track of your values. Blood pressure, blood fats, the known cardiovascular risk factors and the lifestyle habits you can influence, such as eating fruit and vegetables, exercising and not smoking. Chronic inflammation Exactly what the connection is due to is not clear. But what one suspects is that it is a chronic inflammation that lasts for a long time in these people, and then it can affect both blood vessels and the heart negatively. It can increase the risk of forming small blood clots in the vessels and affect the blood vessels and the heart, says Axel Carlsson. One consolation in this context is that the researchers found no clear connection between", "title_original": "Postcovid ökar risk för hjärtsjukdomar – ny studie", "summary_original": "Det är forskare vid Karolinska institutet som har undersökt hur kvarvarande hälsoproblem efter en covidinfektion hänger ihop med följdsjukdomar i hjärtkärlsystemet. I studien ingick 9 000 individer som fått diagnosen postcovid i Region Stockholm. Två tredjedelar av dem var kvinnor. Dessa jämfördes med Sveriges övriga vuxna befolkning under 65 år. Hjärtrytmrubbningar och kranskärlssjukdom visade sig vara vanligare hos både kvinnor och män med postcovid. Under uppföljningen på fyra år drabbades 18,2 procent av kvinnorna och 20,6 procent av männen med postcovid av någon form av hjärtkärlhändelse. Bland gruppen utan var motsvarande siffra 8,4 procent respektive 11,1 procent. Hos kvinnor sågs även en ökad risk för hjärtsvikt och perifer kärlsjukdom ”Stort mörkertal” Skillnaderna fanns kvar även efter det att forskarna justerat för ålder, socioekonomi och andra riskfaktorer. Även de som aldrig sökt vård för sina besvär kan vara i riskzonen.  Personer som hade det tufft i flera månader efter sin första covid-infektion kan också beröras av de här resultaten. De som inte blev friska snabbt efter sin covid utan hade en ökad trötthet och så i månader efter covid-19-infektionen. Vi vet att det finns ett stort mörkertal, säger Axel Carlsson. Han uppmanar alla som lidit av postcovid att försöka kompensera med sin livsstil. Har man haft en sån problematik så är det ju viktigt att man håller koll på sina värden. Blodtryck, blodfetter, de kända hjärtkärlriskfaktorerna och de levnadsvanor man kan påverka, som att äta frukt och grönt, att motionera och inte röka. Kronisk inflammation Exakt vad sambandet beror på är inte klarlagt. Men det man misstänker är ju att det är en kronisk inflammation som är långvarig hos de här personerna, och då kan det påverka både blodkärl och hjärtat negativt. Det kan öka risken för att bilda små blodproppar i kärlen och påverka blodkärlen och hjärtat, säger Axel Carlsson. En tröst i sammanhanget är att forskarna inte hittade något tydligt samband mellan postcovid och stroke. Det är ju glädjande, för det är ju en väldigt handikappande diagnos och det var vi oroliga för att vi skulle hitta, säger Carlsson.", "link": "https://www.tv4.se/artikel/tt-260402-postcovid1-f0ea3953/studie-postcovid-okar-risk-for-hjartsjukdomar", "date_display": "2026-04-02", "date_iso": "2026-04-02T06:02:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Stockholm", "/stockholm", "/sverige", "/inrikes"]}, {"id": 151, "title": "The expert's tip: How to nail the summer job", "summary": "There are 50,000 available summer jobs to apply for on the Employment Agency's job platform Platsbanken. That's about the same number as last year - so increasing unemployment in society in general is not noticeable in the summer jobs anyway. - Not with regard to the demand for labor in the summer, as businesses that need to solve their summer staffing and seasonal jobs exist to the same extent now as before, says Alexandra Sjöberg, job seeker expert at the Employment Service. Search in other places It is not too late if you start now, she believes, but also says that it is time to speed up if you want to secure a summer job. Most summer jobs are in healthcare, but also in industry, sales, hotels and restaurants. It is about services such as cleaners, serving staff, assistant nurses and care assistants. In order to maximize her chances of getting a summer job, Alexandra Sjöberg believes that it is important to think broadly – ​​both in terms of profession and geography. - Be a little open. Sometimes we lock ourselves up and become our own worst enemy because we have preconceived notions. The summer jobs in particular are so delicious that they appear in places where you might not otherwise have thought of working, such as out in the archipelago or on Gotland. Follow up on your application Dare to make contact is also important. - Yes, but go into a store and search. Then you reach the so-called hidden jobs if you yourself are proactive in your job search. But also when you have an application out, you can actually call and follow up on your CV and application. Then you become more than this document you have submitted. Alexandra Sjöberg believes that you should adapt your application to the job you are applying for and highlight experiences that suit that particular job. But if it's your first job, maybe you don't have much experience?
