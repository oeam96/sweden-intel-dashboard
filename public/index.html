towards the Baltic Sea is now followed by Swedish warplanes. \"The navy and the air force are tasked with constantly following what movements are in the vicinity of the Baltic Sea,\" says defense expert Hans Liwång.", "title_original": "Stridsflyg följer rysk ubåt i Kattegatt", "summary_original": "Under fredagen upptäcktes en rysk ubåt i Kattegatt. Dess väg mot Östersjön följs nu av svenskt stridsflyg. ”Marinen och flyget har i uppgift att hela tiden följa vilka rörelser som finns i närheten av Östersjön”, säger försvarsexperten Hans Liwång.", "link": "https://www.svd.se/a/M7AAzo/rysk-ubat-i-kattegatt-foljdes-av-svenskt-stridsflyg", "date_display": "2026-04-10", "date_iso": "2026-04-10T20:22:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 115, "title": "The hat-trick hero: \"The hockey gods wanted me to get the last goal\"", "summary": "First hat-trick ever - and that in the second semi-final against Växjö. Albin Sundsvik has never been in better shape. - Yes, it is quite good right now. You have to say that anyway, he says.", "title_original": "Hattrickhjälten: ”Hockeygudarna ville att jag skulle få sista målet”", "summary_original": "Första hattricket någonsin – och det i den andra semifinalen mot Växjö. Albin Sundsvik har aldrig varit i bättre form. – Ja, den är ganska bra just nu. Det får man väl säga ändå, säger han.", "link": "https://www.hd.se/sport/hattrickhjalten-hockeygudarna-ville-att-jag-skulle-fa-sista-malet/", "date_display": "2026-04-10", "date_iso": "2026-04-10T20:16:32+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Harris' message raises hope among Democrats: \"Maybe, maybe\"", "summary": "The former vice president of the United States, Kamala Harris, gives her clearest announcement yet that she may run for president in 2028. Politico reports. - Listen, maybe, maybe. I'm thinking about it, Harris said when interviewed by civil rights activist Al Sharpton during a conference on Friday. The statement was met with loud applause from the audience. \"Knows what the job entails\" Kamala Harris was the Democrats' presidential candidate in the 2024 election, after then-President Joe Biden dropped out of the election campaign during the summer. Harris lost the election to Donald Trump, but received close to half of the vote nationally. Now many interpret it as her opening up to a new attempt.  - I know what the job entails and what it requires, she said. When she finished speaking, the audience repeatedly shouted: \"Stand up again!\". Before she left the stage, she gave a final message to her supporters: - I will keep you updated. Harris was the sixth potential presidential candidate to attend the conference. Earlier in the week, Pennsylvania Governor Josh Shapiro and Illinois Governor JB Pritzker, among others, had participated, but Harris received by far the strongest reception, according to Politico. Attack on Trump During the conversation, according to Politico, she attacked President Donald Trump, among other things on issues of foreign policy, Iran and voting rights. At the same time, she acknowledged that Democrats were losing support among some groups in the 2024 election, particularly among black and Hispanic men. According to Politico, people close to her say she has not yet decided whether to run, but is now making several appearances to keep the door open. Harris stated that she is planning trips to South Carolina, North Carolina and Georgia, among others.", "title_original": "Harris besked väcker hopp hos Demokraterna: ”Kanske, kanske”", "summary_original": "USA:s tidigare vicepresident Kamala Harris ger sitt tydligaste besked hittills om att hon kan ställa upp i presidentvalet 2028. Det rapporterar Politico. – Lyssna, kanske, kanske. Jag funderar på det, sa Harris när hon intervjuades av medborgarrättsaktivisten Al Sharpton under en konferens på fredagen. Uttalandet möttes av högljudda applåder från publiken. ”Vet vad jobbet innebär” Kamala Harris var Demokraternas presidentkandidat i valet 2024, efter att dåvarande president Joe Biden hoppade av valrörelsen under sommaren. Harris förlorade valet mot Donald Trump, men fick nära hälften av rösterna nationellt. Nu tolkar många det som att hon öppnar upp för ett nytt försök.  – Jag vet vad jobbet innebär och vad det kräver, sa hon. När hon avslutade samtalet ropade publiken upprepade gånger: ”Ställ upp igen!”. Innan hon gick av scenen gav hon ett sista besked till sina supportrar: – Jag kommer att hålla er uppdaterade. Harris var den sjätte tänkbara presidentkandidaten som deltog i konferensen. Tidigare under veckan hade bland andra Pennsylvanias guvernör Josh Shapiro och Illinois guvernör JB Pritzker medverkat, men Harris fick det klart starkaste mottagandet, enligt Politico. Attack mot Trump Under samtalet gick hon, enligt Politico, till attack mot president Donald Trump, bland annat i frågor om utrikespolitik, Iran och rösträtt. Samtidigt erkände hon att Demokraterna tappade stöd bland vissa grupper i valet 2024, särskilt bland svarta och latinamerikanska män. Enligt Politico säger personer i hennes närhet att hon ännu inte har bestämt sig för om hon ska ställa upp, men att hon nu gör flera framträdanden för att hålla dörren öppen. Harris uppgav att hon planerar resor till bland annat South Carolina, North Carolina och Georgia.", "link": "https://www.tv4.se/artikel/jTUB0KFnQdq62EGVXEQvW/harris-besked-vaecker-hopp-hos-demokraterna-lyssna-kanske-kanske", "date_display": "2026-04-10", "date_iso": "2026-04-10T20:12:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/politik", "/kamala-harris", "/usa", "/usavalet", "/demokraterna"]}, {"id": 117, "title": "Vance to Pakistan to save Iranian peace", "summary": "US Vice President JD Vance is holding peace talks between the US and Iran in Islamabad - but the ceasefire deal is showing signs of cracking. Meanwhile, Israel's war in Lebanon makes Iran reluctant to open the Strait of Hormuz.", "title_original": "Vance till Pakistan för att rädda iransk fred", "summary_original": "USA:s vicepresident JD Vance håller i fredsförhandlingar mellan USA och Iran i Islamabad – men uppgörelsen om eldupphör visar tecken på att krackelera. Samtidigt gör Israels krig i Libanon Iran ovilligt att öppna Hormuzsundet.", "link": "https://www.svd.se/a/zOllpO/vance-till-pakistan-for-att-radda-iransk-fred", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:59:05+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 118, "title": "Pedophile scandal brought Peter Magyar to power", "summary": "A broken marriage and a pedophile scandal became Peter Magyar's path to power. Now he is Viktor Orbán's main opponent in the election - where he won trust by criticizing the government from within.", "title_original": "Pedofilskandal tog Peter Magyar till makten", "summary_original": "Ett raserat äktenskap och en pedofilskandal blev Peter Magyars väg till makten. Nu är han Viktor Orbáns huvudmotståndare i valet – där han vunnit förtroende genom att kritisera regeringen inifrån.", "link": "https://www.svd.se/a/43OOGe/magyars-vag-till-makten-huvudmotstandare-till-orban-i-ungerska-valet", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:57:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 119, "title": "The electric cars' new software is tested in the cold of Arjeplog", "summary": "The biting cold in Arjeplog is suitable for testing a new generation of software for electric cars. For Volkswagen, the winter tests are a step towards cars controlled entirely by central computers.", "title_original": "Elbilarnas nya mjukvara testas i Arjeplogs kyla", "summary_original": "Den bitande kylan i Arjeplog passar för att testa en ny generation mjukvara för elbilar. För Volkswagen är vintertesterna ett steg mot bilar som styrs helt av centrala datorer.", "link": "https://www.svd.se/a/7ppAVo/volkswagen-testar-mjukvara-och-centrala-datorer-i-sverige", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:57:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 120, "title": "Russian submarine in the Kattegat", "summary": "", "title_original": "Rysk ubåt i Kattegatt", "summary_original": "", "link": "https://www.svd.se/a/0pBBm6/rysk-ubat-i-kattegatt", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:39:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 121, "title": "The mummy is forced to leave: \"You were amazing\"", "summary": "After Mumien's second appearance in \"Masked Singer Sweden\", the mask received the least number of votes and was forced to leave the competition. Sweden's uncrowned Eurodance king Martin \"E-type\" Erikson hid himself wrapped in fabric. It's the first time Pernilla Wahlgren has guessed correctly since 2004, jokes host David Hellenius. - I'm so happy, I'm so happy. But I'm sorry you went out, because I loved you. You were fantastic, she tells E‑type. The connection to the prime minister In a feature in the first program, Martin Melin and Dennis Rodman appeared – a nod to the other two Martin and Dennis that E‑type has collaborated with, Max Martin and Denniz Pop. It was that connection that made Pernilla Wahlgren land right in her guess. Colleague Behrouz Badreh stood in his place and weighed between Håkan Juholt and Anders Tegnell. Carina Berg was into Mikael Tornving, but - like Behrouz Badreh and Pernilla Wahlgren - made a U-turn and returned to her guess from the first program: Ahmed Berhan. Edvin Törnblom had previously guessed at Jan Emanuel and Björn Gustafsson, but finally locked on the presenter Anders S. Nilsson, because he is the right height and several clues had connections to \"Parliament\". But it was not the comedy program that was intended. - When my dear wife Melinda and I got married, we had the great honor of having a priest named Birgitta, and she is married to the Prime Minister Ulf Kristersson, says E-type about the clues that alluded to politics. \"My career is already over\" The first time Martin Erikson was asked about jumping into the Mummy, he joked and replied that \"my career is already over\". The reason he chose to participate in the program is that it is the family's absolute favorite program. - My three youngest children, it is very much for their sake that I am doing this. They love it more than ever and sit in preschool and draw everyone. It will be exciting to see if they like the mummy, he says in one segment. That the E-Type became a mummy is about his great interests", "title_original": "Mumien tvingas lämna: ”Du var fantastisk”", "summary_original": "Efter Mumiens andra framträdande i ”Masked Singer Sverige” fick masken minst antal röster och tvingades lämna tävlingen. Inlindad i tyg dolde sig Sveriges okrönte eurodancekung Martin ”E-type” Erikson. Det är första gången Pernilla Wahlgren gissar rätt sedan 2004, skämtar programledaren David Hellenius. – Jag är så glad, jag är så glad. Men jag är ledsen att du åkte ut, för jag älskade dig. Du var fantastisk, säger hon till E‑type. Kopplingen till statsministern I ett inslag i det första programmet syntes Martin Melin och Dennis Rodman – en blinkning till de två andra Martin och Dennis som E‑type har samarbetat med, Max Martin och Denniz Pop. Det var den kopplingen som fick Pernilla Wahlgren att landa rätt i sin gissning. Kollegan Behrouz Badreh stod i stället och vägde mellan Håkan Juholt och Anders Tegnell. Carina Berg var inne på Mikael Tornving, men gjorde – liksom Behrouz Badreh och Pernilla Wahlgren – en omvändning och återgick till sin gissning från första programmet: Ahmed Berhan. Edvin Törnblom hade tidigare gissat på Jan Emanuel och Björn Gustafsson, men låste till slut på programledaren Anders S. Nilsson, eftersom han har rätt längd och flera ledtrådar hade kopplingar till ”Parlamentet”. Men det var inte humorprogrammet som avsågs. – När jag och min kära fru Melinda gifte oss hade vi den stora äran att ha en präst som heter Birgitta, och hon är gift med statsministern Ulf Kristersson, säger E-type om ledtrådarna som anspelade på politik. ”Min karriär är redan över” Första gången Martin Erikson fick frågan om att hoppa i Mumien skämtade han och svarade att ”min karriär är redan över”. Anledningen till att han valde att medverka i programmet är att det är familjens absoluta favoritprogram. – Mina tre yngsta barn, det är mycket för deras skull jag gör det här. De älskar det mer än någonsin och sitter på förskolan och ritar av alla. Det ska bli spännande att se om de gillar mumien, säger han i ett inslag. Att E-Type blev en mumie handlar om hans stora intresse för historia. Flera blinkningar gjordes också till bilmodellen Jaguar E‑Type, genom ledtrådar som ”under min outfit döljer sig ett djuriskt kraftpaket”, ”mig kan ni inte köra med” och ”den blockerade lyxbilen”. Alla ledtrådarna finns att läsa här och förklaringarna till flera av dem finns att se i programmet på TV4 Play.", "link": "https://www.tv4.se/artikel/6My9uJ6rK7WLa3Ad9eCEaY/mumien-tvingas-laemna-du-var-fantastisk", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:30:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/musik", "/masked-singer-sverige", "/tv4", "/tv4-play"]}, {"id": 122, "title": "New parties are invited after Løkke's ultimatum", "summary": "The liberal center party Venstre has been invited to government negotiations in Denmark on Monday.", "title_original": "Nya partier bjuds in efter Løkkes ultimatum", "summary_original": "Det liberala mittenpartiet Venstre har bjudits in till regeringsförhandlingar i Danmark på måndag.", "link": "https://www.sydsvenskan.se/danmark/nya-partier-bjuds-in-efter-lokkes-ultimatum/", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Åberg took off after the crash - but many strokes behind", "summary": "Ludvig Åberg had a good day at work. He needs two even better this weekend for the US Masters to be really fun. - Hopefully we can put some pressure on, he says after 70 strokes in the second round.", "title_original": "Åberg lyfte efter raset – men många slag efter", "summary_original": "Ludvig Åberg hade en bra dag på jobbet. Han behöver två ännu bättre i helgen för att US Masters ska bli riktigt roligt. – Förhoppningsvis kan vi sätta lite press, säger han efter 70 slag på andra rundan.", "link": "https://www.dn.se/sport/aberg-lyfte-efter-raset-men-manga-slag-efter/", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:26:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Sundsvik's hat trick in Rögle's kross", "summary": "Albin Sundsvik scored a hat trick when Rögle crushed Växjö 6–0 in the second SC semi-final. After two straight victories away from home, the Skåne team has a dream position to reach the final series in the SM play-offs.", "title_original": "Hattrick av Sundsvik i Rögles kross", "summary_original": "Albin Sundsvik gjorde hattrick när Rögle krossade Växjö med 6–0 i den andra SM-semifinalen. Efter två raka segrar på bortaplan har Skånelaget ett drömläge att ta sig till finalserien i SM-slutspelet.", "link": "https://www.dn.se/sport/hattrick-av-sundsvik-i-rogles-kross/", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:20:03+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Trump and Putin losers if Orbán loses: \"Was a setback\"", "summary": "The expert: \"He is the engine\"", "title_original": "Trump och Putin förlorare om Orbán förlorar: ”Vore ett bakslag”", "summary_original": "Experten: ”Han är motorn”", "link": "https://www.tv4.se/artikel/4mrRCEHN6spHRfjQiCfkri/trump-och-putin-foerlorare-om-orban-foerlorar-vore-ett-bakslag", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:16:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 126, "title": "New drawings released - this is what Trump's triumphal arch might look like", "summary": "The Trump administration has released new blueprints for the 76-meter-tall Arc de Triomphe in Washington DC that the president wants to build.", "title_original": "Nya ritningar släppta – så kan Trumps triumfbåge se ut", "summary_original": "Trumpadministrationen har släppt nya ritningar på den 76 meter höga triumfbågen i Washington DC som presidenten vill bygga.", "link": "https://www.dn.se/varlden/nya-ritningar-slappta-sa-kan-trumps-triumfbage-se-ut/", "date_display": "2026-04-10", "date_iso": "2026-04-10T19:12:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "They kill and eat crops - now Thailand gives elephants birth control", "summary": "FUNNEL. They destroy farmland and attack people. Elephants in south-east Thailand are causing such problems that they are now to be given birth control – despite the Asian elephant being endangered. Last year, the animals killed over 30 people. - I'm scared, says fruit grower Pitsinee Patisang.", "title_original": "De dödar och äter grödor – nu ger Thailand elefanter preventivmedel", "summary_original": "TRAT. De förstör odlingsmark och attackerar människor. Elefanter i sydöstra Thailand orsakar sådana problem att de nu ska få preventivmedel – trots att den asiatiska elefanten är utrotningshotad. Förra året dödade djuren över 30 människor. – Jag är rädd, säger fruktodlaren Pitsinee Patisang.", "link": "https://www.dn.se/varlden/de-dodar-och-ater-grodor-nu-ger-thailand-elefanter-preventivmedel/", "date_display": "2026-04-10", "date_iso": "2026-04-10T18:38:28+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "What is Descartes doing in Adolf Fredrik's church?", "summary": "In the middle of Stockholm stands one of Sergel's most original – and overlooked – works: the monument to René Descartes' empty grave. Carl-Johan Malmberg untangles its peculiar art history, revolving around Queen Kristina, remains on display and the victory of reason over darkness.", "title_original": "Vad gör Descartes i Adolf Fredriks kyrka?", "summary_original": "Mitt i Stockholm står ett av Sergels mest originella – och förbisedda – verk: monumentet över René Descartes tomma grav. Carl-Johan Malmberg reder ut dess egenartade konsthistoria, kretsande kring drottning Kristina, kvarlevor på vift och förnuftets seger över mörkret.", "link": "https://www.svd.se/a/2ppLWr/sergels-forbisedda-monument-over-rene-descartes", "date_display": "2026-04-10", "date_iso": "2026-04-10T18:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 129, "title": "Russian military crisis - service of planes collapses", "summary": "Russia's military is having increasing problems with the maintenance of transport planes from the Ukrainian manufacturer Antonov, leaked documents show. Around half of the military's Antonov planes are reported to be in urgent need of repair.", "title_original": "Ryska militärkrisen – service av plan kollapsar", "summary_original": "Rysslands militär har allt större problem med underhållet av transportplan från den ukrainska tillverkaren Antonov, visar läckta dokument. Runt hälften av militärens Antonovplan rapporteras vara i akut behov av reparation.", "link": "https://www.svd.se/a/7p7719/rysslands-antonovplan-i-akut-behov-av-service", "date_display": "2026-04-10", "date_iso": "2026-04-10T18:07:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 130, "title": "The hookup victim was forced to pay taxes on the income: \"No exceptions\"", "summary": "Today began the extensive pimping scandal in Kramfors, where a man is suspected of having sold his wife to 120 men. He must have done this for three years, both through physical meetings and via the internet. The man is charged with aggravated pimping, eight rapes, four attempted rapes, assault and illegal threats against his wife. P4 Västernorrland reported yesterday that the woman has had to pay a tax debt of SEK 42,000 for sexual services that she believes she was forced into. TV4 Nyheterna has taken note of the tax decision. There it appears that the Swedish Tax Agency has received information about income from a foreign platform company for live streaming. The woman tells the Tax Agency that she herself has not been allowed to share the money, that she has been exposed and that she has reported the incident to the police. The Swedish Tax Agency: We do not make the laws This, however, has not been taken into account by the Swedish Tax Agency, because the authority believes that the money has been paid to her account. They are also not considered income from business activities, but instead from hobby activities. - I understand that it seems unreasonable, but this is how the legislation looks for this type of income, says Helena Jangel Stridh, business developer at the Tax Agency. It also does not matter if the man is convicted. - No, there is a difference between criminal classification and taxation. There are two different things in this case. However, she welcomes a review of the legislation. - We of course feel strong sympathy for these people. They are in a very vulnerable situation. We understand that, but we cannot make our own laws at the Tax Agency, but we must follow those decided by the Riksdag. The government says no But there are no such initiatives with the government. Finance Minister Elisabeth Svantesson (M) refers to an answer to a question from Helena Vilhelmsson (C) from last year. \"The government has carefully analyzed the pros and cons of introducing special rules to exempt income from prostitution from tax. Several actors, including", "title_original": "Kopplerioffret tvingades skatta på inkomsterna: ”Inga undantag”", "summary_original": "Idag inleddes den omfattande kopplerihärvan i Kramfors, där en man misstänks ha sålt sin fru till 120 män. Han ska ha gjort detta under tre års tid, både genom fysiska möten och via internet. Mannen står åtalad för grovt koppleri, åtta våldtäkter, fyra våldtäktsförsök, misshandel och olaga hot mot sin fru. P4 Västernorrland rapporterade igår att kvinnan har behövt betala en skatteskuld på 42 000 kronor för sexuella tjänster som hon menar att hon tvingats till. TV4 Nyheterna har tagit del av skattebeslutet. Där framgår att Skatteverket har fått uppgifter om inkomster från ett utländskt plattformsföretag för livestreaming. Kvinnan uppger till Skatteverket att hon själv inte har fått ta del av pengarna, att hon har blivit utsatt och att hon har polisanmält händelsen. Skatteverket: Vi stiftar inte lagarna Detta har dock Skatteverket inte tagit hänsyn till, eftersom myndigheten menar att pengarna har betalats ut till hennes konto. De anses inte heller vara inkomst från näringsverksamhet, utan i stället från hobbyverksamhet. – Jag förstår att det verkar orimligt, men det är så här lagstiftningen ser ut för den här typen av inkomster, säger Helena Jangel Stridh, verksamhetsutvecklare på Skatteverket. Det spelar heller ingen roll om mannen döms. – Nej, det är skillnad på brottsrubriceringen och beskattningen. Det är två skilda saker i det här fallet. Hon välkomnar dock en översyn av lagstiftningen. – Vi känner givetvis stark sympati med de här personerna. De befinner sig i en mycket utsatt situation. Det har vi förståelse för, men vi kan inte stifta egna lagar på Skatteverket, utan vi måste följa dem som beslutas av riksdagen. Regeringen säger nej Men det finns inga sådana initiativ hos regeringen. Finansminister Elisabeth Svantesson (M) hänvisar till ett svar på en fråga från Helena Vilhelmsson (C) från förra året. ”Regeringen har noga analyserat för- och nackdelar med att införa särskilda regler för att skattebefria inkomster från prostitution. Flera aktörer, bland annat Sveriges kvinnoorganisationer, Polismyndigheten, Skatteverket och Ekobrottsmyndigheten, har vid rundabordssamtal lyft fram att det finns en risk att skattebefrielse kan öka utnyttjandet av personer som befinner sig i prostitution.” ”Bland annat kan kriminella påstå att oredovisade inkomster kommer från försäljning av sexuella handlingar. Det är regeringens bedömning att en skattebefrielse riskerar att stjälpa snarare än att hjälpa dem som befinner sig i prostitution.” Kritiken: Bakvänt Helena Vilhelmsson, jämställdhetspolitisk och skattepolitisk talesperson för Centerpartiet, reagerar kraftfullt på regeringens ståndpunkt i frågan. – Det är så bakvänt, och jag förstår inte hur regeringen kan hålla fast vid att det här är rimligt. Hon menar att fallet i Kramfors är ett typexempel på något de har varnat för länge. – Det här gör det oändligt mycket svårare för de utsatta brottsoffren att medverka till att sätta fast de riktiga förövarna, det vill säga hallicken. Hon tycker att det är häpnadsväckande att regeringen inte ens kan tillsätta en utredning. – Det är oerhört frustrerande att ett stelbent system inte ens kan vara flexibelt när man har ett så uppenbart brottsoffer som i det här fallet i Västernorrland.", "link": "https://www.tv4.se/artikel/1aas7gjleGWR5PMETVCfuw/kopplerioffret-tvingades-skatta-pa-inkomsterna-inga-undantag", "date_display": "2026-04-10", "date_iso": "2026-04-10T18:03:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/kramfors", "/koppleri"]}, {"id": 131, "title": "DN Debate. \"The government's letter shows the betrayal of electricity customers\"", "summary": "DN DEBATE. The government claims to defend Swedish electricity prices - but has in fact stopped EU proposals that could have protected us from new price shocks. Result: continued high electricity bills and excess profits for the power companies. It is a betrayal of households and businesses, writes the Left Party's party leader Nooshi Dadgostar and economic policy spokesperson Ida Gabrielsson.", "title_original": "DN Debatt. ”Regeringens brev visar sveket mot elkunderna”", "summary_original": "DN DEBATT. Regeringen påstår sig försvara svenska elpriser – men har i själva verket stoppat EU-förslag som hade kunna skydda oss från nya prischocker. Resultat: fortsatt höga elräkningar och övervinster för kraftbolagen. Det är ett svek mot hushåll och företag, skriver Vänsterpartiets partiledare Nooshi Dadgostar och ekonomisk-politisk talesperson Ida Gabrielsson.", "link": "https://www.dn.se/debatt/regeringens-brev-visar-sveket-mot-elkunderna/", "date_display": "2026-04-10", "date_iso": "2026-04-10T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Melania Trump's actions trigger new rumors: \"Does no one favor\"", "summary": "In a possible attempt to bury the Epstein mess, Melania Trump may have done the opposite. US connoisseur Dag Blanck finds it difficult to see how the first lady's sudden outburst will help the Trump couple. - Nothing about Epstein benefits anyone, he says.", "title_original": "Melania Trumps utspel triggar nya rykten: ”Gynnar ingen”", "summary_original": "I ett möjligt försök att begrava Epsteinhärvan kan Melania Trump ha gjort det motsatta. USA-kännaren Dag Blanck har svårt att se hur presidentfruns plötsliga utspel ska hjälpa paret Trump. – Ingenting som handlar om Epstein gynnar någon, säger han.", "link": "https://www.dn.se/varlden/melania-trumps-utspel-triggar-nya-rykten-gynnar-ingen/", "date_display": "2026-04-10", "date_iso": "2026-04-10T17:48:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "The teenager qualified for the EC: \"It was absolutely magical\"", "summary": "It was a Friday that swimming talent Ludvig Bartolek from Helsingborg will remember. The 18-year-old's fast swimming took him all the way to Paris. Here is a report from the second day of competition:", "title_original": "Tonåringen EM-kvalade: ”Det var helt magiskt”", "summary_original": "Det blev en fredag som simtalangen Ludvig Bartolek från Helsingborg kommer att minnas. 18-åringens snabba simning tog honom hela vägen till Paris. Här är en rapport från den andra tävlingsdagen:", "link": "https://www.dn.se/sport/tonaringen-em-kvalade-det-var-helt-magiskt/", "date_display": "2026-04-10", "date_iso": "2026-04-10T17:36:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Praised for the comeback: \"She is \"Super-Sarah\"", "summary": "Many outside the swimming world are surprised by Sarah Sjöström's early competitive comeback after pregnancy. Some who are not are her national team mates. - Nothing that Sarah does surprises me. She is, after all, \"Super-Sarah\", says distance swimmer Victor Johansson and smiles.", "title_original": "Hyllas inför comebacken: ”Hon är ”Super-Sarah”", "summary_original": "Många utanför simvärlden är förvånade över Sarah Sjöströms tidiga tävlingscomeback efter graviditeten. Några som inte är det är hennes landslagskompisar. – Inget som Sarah gör förvånar mig. Hon är ju ”Super-Sarah”, säger distanssimmaren Victor Johansson och ler.", "link": "https://www.dn.se/sport/hyllas-infor-comebacken-hon-ar-super-sarah/", "date_display": "2026-04-10", "date_iso": "2026-04-10T17:27:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Following the billionaire's demands – large parts of the board leave", "summary": "Financier Christer Gardell announced last fall that he was prepared to sponsor Swedish tennis with SEK 100 million, with a counter demand: that the entire board of the Swedish Tennis Association resign.\n\nIt stirred feelings in Sports Sweden, but now Gardell seems to get what he wants. Today, TV4-Sport can reveal that six out of seven members of the Swedish Tennis Association's board will leave their posts in connection with the annual meeting at the end of the month.\n\nHas Gardell succeeded now?\n\n- It depends on how you look at it. I have been on the board for seven years, six years as chairman, it is an appropriate time to change, but it is clear that this has had an impact, says outgoing chairman Åsa Hedin and continues:\n\n- They would have liked a different type of transition to the next chairman than this one.\n\nDisappointment within the board: \"Unnecessary and boring\"\n\nThere is disappointment within the board\n\n- I think they are disappointed in the way this has been handled. It is so unnecessary and boring, it not only takes energy from the board but also from the management, says Hedin.", "title_original": "Efter miljardärens krav – stora delar av styrelsen lämnar", "summary_original": "Finansmannen Christer Gardell meddelade i höstas att han var beredd att sponsra svensk tennis med 100 miljoner kronor, med ett motkrav: att hela Svenska Tennisförbundets styrelse avgår.\n\nDet rörde upp känslor i Idrottssverige, men nu verkar Gardell få som han vill. Idag kan TV4-Sporten avslöja att sex av sju ledamöter i svenska tennisförbundets styrelse kommer lämna sina poster i samband med årsmötet i slutet av månaden.\n\nHar Gardell lyckats nu?\n\n– Det beror på hur man ser det. Jag har suttit sju år i styrelsen, sex år som ordförande, det är en lämplig tid att byta, men det är klart att detta har påverkat, säger avgående ordförande Åsa Hedin och fortsätter:\n\n– Man hade velat ha en annan typ av övergång till nästa ordförande än den här.\n\nBesvikelse inom styrelsen: ”Onödigt och tråkigt ”\n\nInom styrelsen finns en besvikelse\n\n– Jag tror de är besvikna på sättet som detta har hanterats. Det är så onödigt och tråkigt, det tar inte bara energi från styrelsen utan även från ledningen, säger Hedin.", "link": "https://www.tv4.se/artikel/4IyBUyHebSoM4QuUrxknEE/efter-miljardaerens-krav-stora-delar-av-styrelsen-laemnar", "date_display": "2026-04-10", "date_iso": "2026-04-10T17:14:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Tennis", "/tennis", "/christer-gardell"]}, {"id": 136, "title": "The expert: The ceasefire does not lead to peace: \"There are concerns\"", "summary": "During the weekend, a temporary ceasefire between Russia and Ukraine is expected to come into force. According to Moscow, the ceasefire will apply from 16:00 on Saturday, Russian time, and through Sunday. According to military expert Joakim Paasikivi, it is far from certain that it will last. - There have been cease-fires in the past, and they have been kept varyingly well, often not very well. There are hopes that it will last, but there are also some concerns, he says. He emphasizes that a cease-fire could have implications for the civilian population, but warns against interpreting it as a sign of an imminent peace agreement. - It is of course positive if there can be a ceasefire so that the Ukrainian citizens get a little respite. But I doubt that this would be an indication that there are any serious peace plans, he says. Great risk at the front According to Paasikivi, the greatest risk of the ceasefire being broken is along the front line, where the battles are fought at close range. - There you are so close to each other that you shoot at each other, or kill each other with drones. If one or the other side tries to use the truce to advance its positions, it is basically always broken, he says. He emphasizes that this requires both parties to refrain from exploiting the ceasefire militarily – something that has historically been difficult. - Here, Russia has been nothing short of clean-headed, one can safely say, says Paasikivi.  If the truce is broken, a familiar information war awaits, according to Paasikivi. - Then the parties will blame each other, and Russia will present it with proper force that Ukraine cannot be trusted and that they are terrorists, he says. Reports of peace are met with skepticism At the same time, Ukraine's chief negotiator Kyrylo Budanov has spoken of progress in the talks with Russia and that peace may be close between the countries - something that caused stock exchanges and oil prices to react positively. - They all realize that the war must end. That's why", "title_original": "Experten: Vapenvilan leder inte till fred: ”Finns farhågor”", "summary_original": "Under helgen väntas en tillfällig vapenvila mellan Ryssland och Ukraina träda i kraft. Vapenvilan ska enligt Moskva gälla från klockan 16.00 på lördagen, rysk tid, och söndagen ut. Enligt militärexperten Joakim Paasikivi är det långt ifrån säkert att den kommer att hålla. – Det har ju varit vapenvilor tidigare, och de har hållits olika bra, ofta inte särskilt bra. Det finns förhoppningar om att det håller, men det finns också vissa farhågor, säger han. Han betonar att en vapenvila kan få betydelse för civilbefolkningen, men varnar för att tolka den som ett tecken på ett förestående fredsavtal. – Det är naturligtvis positivt om det kan bli en vapenvila så att de ukrainska medborgarna får ett litet andrum. Men att det här skulle vara en indikation på att det finns några seriösa fredsplaner är jag tveksam till, säger han. Stor risk vid fronten Den största risken för att vapenvilan bryts finns enligt Paasikivi längs frontlinjen, där striderna förs på nära håll. – Där är man så nära varandra att man skjuter på varandra, eller dödar varandra med drönare. Om den ena eller andra sidan försöker utnyttja vapenvilan till att flytta fram sina positioner så bryts den i princip alltid, säger han. Han understryker att detta kräver att båda parter avstår från att utnyttja eldupphöret militärt – något som historiskt varit svårt. – Här har Ryssland inte varit något under av renhårighet, kan man lugnt konstatera, säger Paasikivi.  Om vapenvilan bryts väntar, enligt Paasikivi, ett välbekant informationskrig. – Då kommer parterna att skylla på varandra, och Ryssland kommer att presentera det med ordentlig kraft som att det inte går att lita på Ukraina och att de är terrorister, säger han. Uppgifter om fred möts med skepsis Samtidigt har Ukrainas chefsförhandlare Kyrylo Budanov talat om framsteg i samtalen med Ryssland och att fred kan vara nära mellan länderna – något som fått börser och oljepriser att reagera i positiv bemärkelse. – De inser alla att kriget måste ta slut. Det är därför de förhandlar. Jag tror inte att det kommer att dröja länge, säger Budanov i en intervju med Bloomberg. Men enligt Paasikivi går det inte att dra några långtgående slutsatser så länge inget konkret presenteras. – Det pågår samtal på olika nivåer, det har båda sidor bekräftat. Men att ett fredsavtal plötsligt skulle materialiseras utan att man sett en tydlig process är svårt att tro på, säger han. ”Enorma risker” Ukrainas hållning i de mest avgörande frågorna ligger fast, särskilt när det gäller territorium. Ryssland gör anspråk på områden som man ännu inte fullt ut kontrollerar. – Ukrainas hållning är tydlig: det är omöjligt att ge upp de områden som Ryssland gör anspråk på. Att släppa dem skulle innebära enorma risker, eftersom viktiga försvarslinjer går där, säger Paasikivi. Ett eventuellt avtal skulle därför snarare handla om att frysa kriget än att avsluta det. – Ett sånt avtal skulle sannolikt inte innebära att konfrontationslinjen flyttas särskilt mycket, säger han.", "link": "https://www.tv4.se/artikel/1nyZMdH6qNQdu479LvBXat/experten-vapenvilan-leder-inte-till-fred-inga-serioesa-planer", "date_display": "2026-04-10", "date_iso": "2026-04-10T16:31:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukraina", "/ukrainakonflikten", "/ryssland", "/putin", "/vladimir-putin", "/politiker"]}, {"id": 137, "title": "Bag in T-rex leather sells for millions - developed from fossils", "summary": "The world's first product in so-called T‑rex leather is here. The exclusive handbag has been designed by the Berlin-based techwear brand Enfin Levé. The material has been developed by researchers who used the protein collagen from T‑rex fossils and recreated it with the help of AI and genetic engineering. The handbag is only available in one copy and was unveiled at the beginning of April in Amsterdam, next to a large T‑rex statue at the Art Zoo Museum. - Almost like a sci-fi movie. It gets a bit bizarre somehow, says fashion expert Emilia de Poret to TV4 Nyheterna. \"Half a million euros\" The handbag, which Bas Korsten, creative director at VML - the agency also involved in the project - tells NL Times will sell for \"at least as much as ten Birkin bags\", is not something that Emilia de Poret had thrown over her shoulder. - I understand that this attracts attention because it is so odd and stands out. But it is more about a technical experiment than about craftsmanship, style and design. It's something else – more of a focused concept, she says. - I would not have paid half a million euros for a T-rex bag. Hard to see traditional leather disappearing Today, there is a large investment in lab-grown leather materials as an alternative to traditional leather. So far, the focus has mainly been on plant-based substitutes, such as mushroom and grape leather. Emilia de Poret has personally experienced a bag in pineapple leather. - It was really a wow feeling to see that it is possible. It's really interesting and I've seen a lot of it which looks really good too. But she finds it difficult to see that the luxury garments of the future would be manufactured entirely without animals. However, she believes that lab-grown leather will continue to develop and get better. - I find it hard to see traditional leather disappearing, especially when it is produced in a responsible way. But there will definitely be more options, says Emilia de Poret.", "title_original": "Väska i T-rexläder säljs för miljoner – utvecklad av fossiler", "summary_original": "Världens första produkt i så kallat T‑rexläder är här. Den exklusiva handväskan har designats av det Berlinbaserade techwear‑märket Enfin Levé. Materialet har utvecklats av forskare som använt proteinet kollagen från T‑rex‑fossiler och återskapat det med hjälp av AI och genteknik. Handväskan finns endast i ett exemplar och avtäcktes i början av april i Amsterdam, intill en stor T‑rexstaty på Art Zoo Museum. – Nästan som en sci-fi-film. Det blir lite bisarrt på något sätt, säger modeexperten Emilia de Poret till TV4 Nyheterna. ”En halv miljon euro” Handväskan, som Bas Korsten, kreativ chef på VML – byrån som också är involverad i projektet – säger till NL Times kommer att säljas för ”minst lika mycket som tio Birkin-väskor”, är inget som Emilia de Poret hade slängt över axeln. – Jag fattar att det här väcker uppmärksamhet eftersom det är så udda och sticker ut. Men det handlar mer om ett tekniskt experiment än om hantverk, stil och design. Det är något annat – mer ett spejsat koncept, säger hon. – Jag hade inte betalat en halv miljon euro för en T-rexväska. Svårt att se att traditionellt läder försvinner I dag satsas det stort på labbodlade lädermaterial som alternativ till traditionellt läder. Hittills har fokus främst legat på växtbaserade substitut, som svamp‑ och vindruvsläder. Emilia de Poret har själv känt på en väska i ananasläder. – Det var verkligen en wow-känsla att se att det är möjligt. Det är verkligen intressant och jag har sett en hel del av det som också ser väldigt bra ut. Men att framtidens lyxplagg helt skulle tillverkas utan djur har hon svårt att se. Däremot tror hon att labbodlat läder kommer att fortsätta utvecklas och bli bättre. – Jag har svårt att se att traditionellt läder försvinner, särskilt när det produceras på ett ansvarsfullt sätt. Men alternativen kommer definitivt att bli fler, säger Emilia de Poret.", "link": "https://www.tv4.se/artikel/3siBg39c5BeDDoLWeKNcTe/nu-aer-den-haer-vaerldens-foersta-handvaeska-i-t-rexlaeder", "date_display": "2026-04-10", "date_iso": "2026-04-10T16:11:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/mode", "/djur", "/design"]}, {"id": 138, "title": "Thomas Stenström performs Sweden's official WC song", "summary": "The Swedish men's national team secured the World Cup place after a dramatic victory against Poland last week - and now Stenström is expected to provide the musical setting. According to information given to TV4 Nyheterna, the artist Thomas Stenström performs Sweden's official World Cup song.  Stenström made a big splash in the early 2010s and is today one of Sweden's biggest pop artists. He grew up in Uddevalla and is known for songs such as \"Slå mig hart i sägen\" and \"Do you see the moon where you are tonight?\". Won several Grammys Stenström has won several Grammys, most recently in 2024 when he was named Artist of the Year, and in 2021 participated in TV4's program \"So much better\".  GES's \"When we dig gold in the USA\", Tomas Ledin's \"Vi är på gång\" and Markoolio's \"In med bollen\" are examples of WC songs that previously topped the charts. Many hoped that \"When we dig gold in the USA\" would be given new life as this year's World Cup song, but it doesn't seem to be the case. The World Cup begins on June 11 and Sweden plays its first match on June 15 against Tunisia.  TV4 Nyheterna has searched for Thomas Stenström.", "title_original": "Thomas Stenström gör Sveriges officiella VM-låt", "summary_original": "Det svenska herrlandslaget säkrade VM‑platsen efter en dramatisk seger mot Polen förra veckan – och nu väntas Stenström stå för den musikaliska inramningen. Artisten Thomas Stenström gör nämligen, enligt uppgifter till TV4 Nyheterna, Sveriges officiella VM-låt.  Stenström slog igenom brett i början av 2010‑talet och är i dag en av Sveriges största popartister. Han är uppvuxen i Uddevalla och är känd för låtar som ”Slå mig hårt i ansiktet” och ”Ser du månen där du är ikväll?”. Vunnit flera grammisar Stenström har vunnit flera Grammisar, senast 2024 då han utsågs till Årets artist, och medverkade 2021 i TV4:s program ”Så mycket bättre”.  GES ”När vi gräver guld i USA”, Tomas Ledins ”Vi är på gång” och Markoolios ”In med bollen” är exempel på VM-låtar som tidigare toppat listorna. Många hoppades att ”När vi gräver guld i USA” skulle få nytt liv som årets VM‑låt, men så ser det alltså inte ut att bli. VM inleds 11 juni och Sverige spelar sin första match 15 juni mot Tunisien.  TV4 Nyheterna har sökt Thomas Stenström.", "link": "https://www.tv4.se/artikel/7CjLUpehl905YdVK8OVwZz/uppgifter-han-goer-sveriges-vm-lat", "date_display": "2026-04-10", "date_iso": "2026-04-10T15:22:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026", "/personer/thomas-stenstrom", "/inrikes"]}, {"id": 139, "title": "Double standards in the music industry - my heart turns black", "summary": "The Wireless festival is now canceled after basically all sponsors pulled out, and where the nail in the coffin was when Kanye 'Ye' West was denied entry to the UK. After making anti-Semitic and racist statements for almost a decade, he has still remained relevant and the music industry has not turned his back on him.  Last weekend he sold out two concert nights in Los Angeles and, according to Bloomberg, he should have earned 30 million dollars. Artists such as Lauryn Hill, Travis Scott and CeeLo Green visited him on stage. In January, the Wall Street Journal published a full-page ad with an apology from West, and from that he still manages to be forgiven time and time again.  It is different for women. Just a few weeks apart, two of the world's biggest female artists, Chappell Roan and Zara Larsson, received massive criticism for nonsense. The joke that her bodyguard (who turned out not to even be her bodyguard!) would have brought a fan to tears, sparking a storm of hate on social media and Rio de Janeiro's mayor banning her from performing in the city in the future.  Zara Larsson lost million dollar deal Zara Larsson's joke about abortion resulted in her losing a three million dollar brand deal and in an interview with The Guardian, Larsson commented on the attack on Chappell Roan as misogyny, and I'm inclined to agree.  HOW can the tone in the comments section be so terribly mean to Roan & Larsson while Kanye's fans constantly stand up for his behavior and accuse him of being bipolar (despite the fact that he himself claims that the diagnosis is now autism..). The man named a song Heil Hitler as recently as last year - come on. My heart turns black when I think of all the female artists who have been cancelled, ostracized and mocked over the years. Sinéad O'Connor who dared to take a stand against the Catholic Church and tore up a picture of the Pope on the entertainment program Saturday Night Live in 1992. Moral panic broke out in 2004 The moral panic that followed Janet Jackson's", "title_original": "Dubbelmoral i musikbranschen – mitt hjärta blir svart", "summary_original": "Festivalen Wireless är nu avblåst efter att i princip alla sponsorer dragit sig ur, och där spiken i kistan blev när Kanye ‘Ye’ West nekades inträde till Storbritannien. Efter att i nästan ett decennium ha kommit med antisemitiska och rasistiska uttalanden så har han ändå hållit sig aktuell och musikbranschen har inte vänt honom ryggen.  Förra helgen sålde han ut två konsertkvällar i Los Angeles och enligt Bloomberg ska han ha tjänat 30 miljoner dollar. Artister som Lauryn Hill, Travis Scott och CeeLo Green gästade honom på scen. I januari publicerade Wall Street Journal en helsida i form av en annons med en ursäkt från West och därav lyckas han ändå bli förlåten gång på gång.  Annat är det för kvinnor. Med bara några veckors mellanrum fick två av världens största kvinnliga artister, Chappell Roan och Zara Larsson, massiv kritik för struntsaker. Roan för att hennes vakt (som visade sig inte ens vara hennes vakt!) skulle ha fått ett fan att gråta vilket utlöste en hatstorm på sociala medier och Rio de Janeiros borgmästare förbjöd henne att uppträda i staden i framtiden.  Zara Larsson förlorade miljonavtal Zara Larssons skämt om abort resulterade i att hon förlorade ett varumärkesavtal för tre miljoner dollar och i en intervju med The Guardian kommenterade Larsson påhoppen på Chappell Roan som kvinnohat, och jag är benägen att hålla med.  HUR kan tonen i kommentarsfält vara så fruktansvärt elaka mot Roan & Larsson medan Kanyes fans ständigt står upp för hans beteende och skyller på att han är bipolär (trots att han själv hävdar att diagnosen numera är autism..). Mannen döpte en låt till Heil Hitler så sent som förra året – kom igen. Mitt hjärta blir svart när jag tänker på alla kvinnliga artister som genom åren blivit cancelled, utfrysta och hånade. Sinéad O'Connor som vågade ta ställning mot den katolska kyrkan och rev sönder en bild av påven i underhållningsprogrammet Saturday Night Live 1992.  Moralpanik bröt ut 2004 Moralpaniken som blev efter Janet Jacksons blottade bröst i Super Bowl 2004. Den amerikanska countrygruppen Dixie Chicks (numera The Chicks) som 2003 kritiserade George W Bush för Irakkriget vilket senare inspirerade till låten Not Ready to Make Nice. Och Britney Spears som blivit förlöjligad sedan paraplyincidenten 2007 och sattes efter det under ett förmyndarskap. Och ja – det är svårt att hålla två tankar i huvudet samtidigt, för vem är jag att sitta på höga moraliska hästar när Kanye West var en av de artister jag lyssnade mest på 2024 enligt Spotify Wrapped.  Men så länge jag är medveten om kvinnohatet och hyckleriet så tänker jag fortsätta prata om det.", "link": "https://www.tv4.se/artikel/2xKJn1X7d5zWHAZ3jHyMD4/dubbelmoral-i-musikbranschen-mitt-hjaerta-blir-svart", "date_display": "2026-04-10", "date_iso": "2026-04-10T13:50:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/kanye-west", "/personer/zara-larsson"]}, {"id": 140, "title": "The unexpected Hormuz effect favors the shipping company: \"Makes more money\"", "summary": "\"Favourable bottleneck\" • Then the oil shortage hits the world economy", "title_original": "Oväntade Hormuz-effekten gynnar rederiet: ”Tjänar mer pengar”", "summary_original": "”Gynnsam flaskhals” • Då slår oljebristen mot världsekonomin", "link": "https://www.tv4.se/artikel/1jmBmqMjQZKP8esWuEwZb4/ovaentade-hormuz-effekten-gynnar-rederiet-tjaenar-mer-pengar", "date_display": "2026-04-10", "date_iso": "2026-04-10T13:20:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 141, "title": "The suspected Brattås murderer is in custody - 21 years after the double murder", "summary": "The 45-year-old man who is suspected of the double murder in Brattås in 2005 is now in custody on probable cause for the two murders.  Restrictions are also imposed on the man, as it is considered that there is a risk of him deviating. The double murder that became a cold case - for over 20 years 21 years ago Gerd Wiklund and Tor Öberg were found dead on a farm in Brattås outside Härnösand.  The married couple were murdered with an ax and DNA from the suspected killer could be secured at the crime scene, but no suspect was identified.  The case has been cold - until last Wednesday when the 45-year-old was arrested after his DNA was matched to the crime scene through a genealogy database.  - It was a bomb, quite simply, says Jan-Ola Nordin, former intelligence leader. - We had almost given up, there was discussion about ending the searches in the gene database. The level of suspicion has increased from the lower level to probable cause. This makes Jan-Ola Nordin believe that there is more evidence than just the DNA match. - I think you have more tracks, he says. - For example, technicians did a fingerprint examination on site in the home, but it did not match the national register at the time. But he does not want to withdraw the profit in advance. - It is a bit on the way, but there is a long way to go before a conviction. The suspected murderer appeared on the link in a t-shirt During the detention hearing in Härnösand, the suspected perpetrator appeared on the link.  He was wearing a t-shirt and looked cool.", "title_original": "Misstänkte Brattåsmördaren häktas – 21 år efter dubbelmordet", "summary_original": "Den 45-åriga man som misstänks för dubbelmordet i Brattås 2005 häktas nu på sannolika skäl för de två morden.  Mannen åläggs också restriktioner, då man anser det finnas en risk för att han avviker. Dubbelmordet som blev kallt fall – i över 20 år För 21 år sedan hittades Gerd Wiklund och Tor Öberg dödade på en gård i Brattås utanför Härnösand.  Särboparet mördades med en yxa och dna från den misstänkta mördaren kunde säkras på brottsplatsen, men ingen misstänkt identifierades.  Fallet har varit kallt – fram till i onsdags när 45-åringen greps efter att hans dna matchats till brottsplatsen genom en släktforskningsdatabas.  – Det var en bomb, helt enkelt, säger Jan-Ola Nordin, tidigare spaningsledare. – Vi hade nästan gett upp, det var diskussion om att sluta med sökningarna i gendatabasen. Misstankegraden har ökat från den lägre graden till sannolika skäl. Det gör att Jan-Ola Nordin tror att det finns mer bevisning än bara dna-träffen. – Jag tror att man har fler spår, säger han. – Tekniker gjorde till exempel fingeravtrycksundersökning på plats i bostaden, men det matchade inte med det nationella registret då. Men han vill inte ta ut vinsten i förskott. – Det är en bit på väg, men det är en lång bit kvar till fällande dom. Misstänkte mördaren medverkade på länk i t-shirt Under häktningsförhandlingen i Härnösand medverkade den misstänkte gärningsmannen på länk.  Han var i iklädd t-shirt och såg moloken ut.", "link": "https://www.tv4.se/artikel/3jCkhcy8a9xZCrCYac1K3X/misstaenkte-brattasmoerdaren-haektas", "date_display": "2026-04-10", "date_iso": "2026-04-10T11:38:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/dubbelmordet-i-brattas", "/slaktforskning", "/dna"]}, {"id": 142, "title": "The criticism from the Cancer Foundation - thousands could be saved", "summary": "Today, Sweden has better opportunities than ever to improve survival in cancer. Even so, thousands of lives are at risk of being lost – as it can take over a decade for new treatments and diagnostic methods to reach patients. Now comes criticism in a new report by the Cancer Foundation. - We are facing a decisive shift in cancer care. Research is making great progress, but the healthcare system is not keeping up. This means that patients do not get access to new treatments and diagnostics in time, says general secretary Ulrika Årehed Kågström. Survival has increased sharply Today, roughly seven out of ten people who receive a cancer diagnosis survive, and survival has more than doubled since the 1950s.  The Cancer Foundation has set a goal that 80 percent will survive until the year 2030. If that is reached, it would mean around 6,300 more lives saved - compared to if the mortality rate remains at today's level. But according to the report, it is not primarily about developing new treatments. The decisive factor is instead how quickly research progress reaches healthcare. Today, it can take between ten and 15 years from a medical breakthrough to a treatment being widely used. In the meantime, patients risk missing out on care that could have improved their prognosis, according to the Cancer Foundation. - This is not a research problem, but a system problem, says Ulrika Årehed Kågström. Many people want to participate in studies - but are not asked. Another thing the report points to are shortcomings when it comes to clinical studies. A survey shows that there is great interest and that patients with disseminated cancer would like to participate in one, but that they have never been asked. As many as eight out of ten state this. For some patients, a study may be the only possibility for a new treatment. - That so many never even get the question shows that we need to take action, says Ulrika Årehed Kågström. Despite the fact that Sweden has good conditions as the research is world-class, development is being slowed down, according to the report. This is due to scarcity", "title_original": "Kritiken från Cancerfonden – tusentals skulle kunna räddas", "summary_original": "Sverige har i dag bättre möjligheter än någonsin att förbättra överlevnaden i cancer. Trots det riskerar tusentals liv att gå förlorade – eftersom det kan ta över ett decennium innan nya behandlingar och diagnosmetoder når patienterna. Nu kommer kritik i en ny rapport av Cancerfonden. – Vi står inför ett avgörande skifte i cancervården. Forskningen gör stora framsteg, men hälso- och sjukvårdssystemet hänger inte med. Det gör att patienter inte får tillgång till nya behandlingar och diagnostik i tid, säger generalsekreterare Ulrika Årehed Kågström. Överlevnaden har ökat kraftigt I dag överlever drygt sju av tio personer som får en cancerdiagnos och överlevnaden har mer än fördubblats sedan 1950-talet.  Cancerfonden har satt upp ett mål om att 80 procent ska överleva till år 2030. Om det nås skulle det innebära omkring 6 300 fler räddade liv – jämfört med om dödligheten ligger kvar på dagens nivå. Men enligt rapporten handlar det inte främst om att ta fram nya behandlingar. Den avgörande faktorn är i stället hur snabbt forskningsframsteg når sjukvården. I dag kan det ta mellan tio och 15 år från ett medicinskt genombrott till att en behandling används brett. Under tiden riskerar patienter att gå miste om vård som hade kunnat förbättra deras prognos, enligt Cancerfonden. – Det här är inte ett forskningsproblem, utan ett systemproblem, säger Ulrika Årehed Kågström. Många vill delta i studier – men får inte frågan  En till sak rapporten pekar på är brister när det kommer till kliniska studier. En enkät visar att intresset är stort och att patienter med spridd cancer gärna vill delta i en sådan men att de aldrig fått frågan. Hela åtta av tio uppger detta. För vissa patienter kan en studie vara den enda möjligheten till en ny behandling. – Att så många aldrig ens får frågan visar att vi behöver ta krafttag, säger Ulrika Årehed Kågström. Trots att Sverige har goda förutsättningar då forskningen är i världsklass så bromsas utvecklingen, enligt rapporten. Detta beror på brister i regelverk, organisation och datadelning.", "link": "https://www.tv4.se/artikel/b7nT8qLZ2OXNa9MGNdh9F/kritiken-fran-cancerfonden-tusentals-skulle-kunna-raeddas", "date_display": "2026-04-10", "date_iso": "2026-04-10T11:16:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/cancerfonden", "/cancer", "/cancervard", "/cancerforskning"]}, {"id": 143, "title": "That's how expensive it is to wash and shower where you live", "summary": "It is possible to save many kroner by using your electricity at the right times of the day. The price differences are also large in different parts of the country. - Above all in southern Sweden, says meteorologist Peter Kondrup. The electricity price changes all the time and the hourly price differs considerably during the day. In general, you can see clear peaks in the morning and in the evening, while the price during the day is significantly lower. - What happens in the morning? Everyone gets up and cooks in the morning. Late Friday evening snuggles, many stoves and ovens and other things that need to be started. So there are two peaks during the day, says Peter Kondrup. Twice as expensive in the south Peter Kondrup has produced exact examples of what it actually cost if you showered, washed or charged the car at ten o'clock this morning. - Here we should also say that the prices are calculated on the spot price including VAT. A ten-minute shower, assuming you get rid of 160 liters of water and 6 kilowatt hours, cost SEK 2.41 in the north and SEK 4.84 in the south.  Big difference in price for charging the electric car When it comes to charging the electric car, calculated at 50 kilowatt hours, there is a very big difference in the country. - SEK 20 in the north and SEK 40 in the south. It's about double there as well. But when it comes to charging the car, the cost becomes so much more. A wash in the laundry room on a standard program at 40 degrees that consumes 1.2 kilowatt hours cost SEK 0.48 in the north and SEK 0.97 in the south. - There won't be a lot of money, but the difference between north and south is clear above all, says Peter Kondrup. Average prices for the whole day are 0.22 in the north and 0.96 in the south. That's why it's different In the south nuclear power is mainly used, while in the north mostly wind power and hydropower are used. Just today at a quarter to nine in the morning, the power distribution was 41 percent hydropower, 31 percent wind power, 21 percent nuclear power and 7 percent unspecified.  - Hydropower is normally close to half, so it is somewhat less today and nuclear power is also a little less, he says", "title_original": "Så dyrt är det att tvätta och duscha där du bor", "summary_original": "Det går att spara många kronor genom att använda din el vid rätt tidpunkter på dagen. Prisskillnaderna är också stora i olika delar av landet. – Framför allt i södra Sverige, säger meteorolog Peter Kondrup. Elpriset ändras hela tiden och timpriset skiljer sig åt rejält under dagen. Generellt kan man se tydliga toppar på morgonen och på kvällen, medan priset under dagen är betydligt lägre. – Vad händer på morgonen? Alla stiger upp och lagar mat på morgonen. Sen fredagsmys på kvällen, många spisar och ugnar och annat som ska igång. Så det är två toppar under dagen, säger Peter Kondrup. Dubbelt så dyrt i söder Peter Kondrup har tagit fram exakta exempel för vad det faktiskt kostade om du duschade, tvättade eller laddade bilen klockan tio i förmiddags. – Här ska vi också säga att priserna är räknade på spotpriset inklusive moms. En dusch på tio minuter, räknat att du gör av med 160 liter vatten och 6 kilowattimmar, kostade 2,41 kronor i norr och 4,84 kronor i söder.  Stor skillnad i pris för att ladda elbilen När det kommer till att ladda elbilen, räknat på 50 kilowattimmar, är det väldigt stor skillnad i landet. – 20 kronor i norr och 40 i söder. Det är ungefär det dubbla även där. Men när det handlar om att ladda bilen, så blir kostnaden så mycket mer. En tvätt i tvättstugan på ett standardprogram på 40 grader som drar 1,2 kilowattimmar kostade 0,48 kronor i norr och 0,97 kronor i söder. – Det blir inga stora pengar, men tydligt är skillnaden mellan norr och söder framför allt, säger Peter Kondrup. Snittpriserna för hela dagen ligger på 0,22 i norr och 0,96 i söder. Därför skiljer det sig åt I söder används främst kärnkraft, medan det i norr används mest vindkraft och vattenkraft. Just i dag vid kvart i nio på morgonen var kraftfördelningen 41 procent vattenkraft, 31 procent vindkraft, 21 procent kärnkraft och 7 procent ospecificerat.  – Vattenkraften brukar ju normalt sett ligga på närmare hälften så det är något mindre idag och även kärnkraften är lite mindre, säger Peter Kondrup. Dessutom påverkar både högtrycket öster om oss och nere över kontinenten. – Det gör också att solkraften från kontinenten kan importeras till Sverige så att man får lite lägre priser i södra Sverige där vi importerar från Tyskland, till exempel.", "link": "https://www.tv4.se/artikel/5MUcYnNwW5uZ5heOi0JIXf/sa-dyrt-aer-det-att-tvaetta-och-duscha-daer-du-bor", "date_display": "2026-04-10", "date_iso": "2026-04-10T10:19:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/nyhetsmorgon", "/elpriskollen", "/ekonomi/elpriset"]}, {"id": 144, "title": "More and more people are calling for Trump's resignation - but that's why it's unlikely", "summary": "The expert: The four points that decide", "title_original": "Allt fler kräver Trumps avgång – men därför är det osannolikt", "summary_original": "Experten: Fyra punkterna som avgör", "link": "https://www.tv4.se/artikel/4D7GvhBwIwmo9FksC73MLC/allt-fler-ropar-efter-trumps-avgang-men-daerfoer-aer-det-osannolikt", "date_display": "2026-04-10", "date_iso": "2026-04-10T08:42:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 145, "title": "Wanted Swede arrested in Thailand", "summary": "The man, who is suspected of serious weapons crime in Sweden, has been wanted by Interpol. The 27-year-old man has connections to a criminal network in Stockholm where he was a leading figure.  The indictment is from 2021 and concerns the same case as the high-profile murder on Årstabron in 2020. A man was tricked out on Årstabron in Stockholm and shot in the head. Three people were sentenced to long prison terms.  The case has been postponed because the man did not make himself available, according to prosecutor Lisa dos Santos. Violation of visa The arrest is said to have taken place in an apartment in Kathu after authorities discovered that the man was staying illegally in Thailand, reports Phuket News. It was during Thursday that the Swede was arrested as part of an effort against foreign citizens who are suspected of crimes, who fled their home countries or used Thailand as a base for their crime, writes the online newspaper Thaiger. The man had stayed longer in the country than allowed and will be put on trial for it before being deported to Sweden for further legal action, according to Phuket News. TV4 News is looking for the man's lawyer.", "title_original": "Efterlyst svensk gripen i Thailand", "summary_original": "Mannen, som är misstänkt för grovt vapenbrott i Sverige har varit efterlyst av Interpol. Den 27-årige mannen har kopplingar till ett kriminellt nätverk i Stockholm där han varit en ledargestalt.  Åtalet är från 2021 och rör samma ärende som det uppmärksammade mordet på Årstabron 2020. En man lurades ut på Årstabron i Stockholm och sköts i huvudet. Tre personer dömdes till långa fängelsestraff.  Målet har skjutits upp eftersom mannen inte gjort sig anträffningsbar, enligt åklagare Lisa dos Santos. Överträdde visa Gripandet ska ha skett i en lägenhet i Kathu efter att myndigheter upptäckt att mannen vistats olagligt i Thailand, rapporterar Phuket News. Det var under torsdagen som svensken greps som en del av en insats mot utländska medborgare som är misstänkta för brott, som flytt från sina hemländer eller använt Thailand som bas för sin brottslighet, skriver nättidningen Thaiger. Mannen hade stannat längre i landet än visat tillät och kommer ställas inför rätta för det innan han deporteras till Sverige för vidare rättsliga åtgärder, enligt Phuket News. TV4 Nyheterna söker mannens advokat.", "link": "https://www.tv4.se/artikel/4aqvDp8ssQmU02Z4mpp4kd/efterlyst-svensk-gripen-i-thailand", "date_display": "2026-04-10", "date_iso": "2026-04-10T07:21:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/brott-och-straff", "/interpol", "/thailand", "/inrikes"]}, {"id": 146, "title": "\"Forever chemicals\" in drinking water are linked to asthma in children", "summary": "We have previously seen that PFAS can affect our immune system. Since the immune system plays a role in the development of asthma, we wanted to investigate how PFAS affects the risk of asthma, says Annelise Blomberg, researcher in occupational and environmental medicine at Lund University. 27 percent of the children of mothers who during pregnancy were exposed to very high exposure to PFAS via the drinking water developed asthma. Among the children of low-exposed mothers, the percentage was 16 percent. We cannot say for sure that PFAS causes asthma, we can only say that we see a connection, says Annelise Blomberg. Can pass the placenta That the drinking water in Kallinge in Ronneby municipality had high levels of PFAS was discovered in 2013. The contamination came from fire foam that was used in fire drills at regiment F 17. Because PFAS can pass the placenta, the fetus is also exposed if the mother drinks PFAS-containing water. But exact explanations for how the long-lived PFAS chemicals affect the body are lacking. The effects of PFAS on our body are quite complicated. We know that it can affect a lot in the body, for example cholesterol level, immune system and birth weight. But it is difficult to say what it is that leads to all these effects, says Annelise Blomberg. Great interest The study covers more than 11,000 children who were born in Blekinge 2006-2013. The researchers have started from the mothers' residential addresses five years before giving birth. The women who lived in Kallinge all five years before giving birth are counted in the study as exposed to very high PFAS exposure. The children of these women have then been compared with other children in Blekinge. Annelise Blomberg believes that there may be great interest in the result. It is of course important for those who have been exposed in Ronneby, but also for others who have been exposed, not only in Sweden but around the world. The study is published in the scientific journal Plos Medicine.", "title_original": "”Evighetskemikalier” i dricksvatten kopplas till astma hos barn", "summary_original": "Vi har tidigare sett att PFAS kan påverka vårt immunsystem. Eftersom immunsystemet spelar roll i utvecklingen av astma ville vi undersöka hur PFAS påverkar risken för astma, säger Annelise Blomberg, forskare i arbets- och miljömedicin vid Lunds universitet. 27 procent av barnen till mammor som under graviditeten utsatts för mycket hög exponering av PFAS via dricksvattnet utvecklade astma. Bland barnen till lågexponerade mammor var andelen 16 procent. Vi kan inte säkert slå fast att PFAS orsakar astma, vi kan bara säga att vi ser ett samband, säger Annelise Blomberg. Kan passera moderkakan Att dricksvattnet i Kallinge i Ronneby kommun hade höga halter av PFAS upptäcktes 2013. Föroreningen kom från brandskum som använts i brandövningar på regementet F 17. Eftersom PFAS kan passera moderkakan utsätts även fostret, om mamman dricker PFAS-haltigt vatten. Men exakta förklaringar till hur de långlivade PFAS-kemikalierna påverkar kroppen saknas. Effekterna av PFAS på vår kropp är ganska komplicerade. Vi vet att det kan påverka mycket i kroppen, till exempel kolesterolnivå, immunsystem och födelsevikt. Men det är svårt att säga vad det är som leder till alla dessa effekter, säger Annelise Blomberg. Stort intresse Studien omfattar mer 11 000 barn som föddes i Blekinge 2006–2013. Forskarna har utgått från mammornas bostadsadresser fem år före förlossning. De kvinnor som bodde i Kallinge samtliga fem år före förlossning räknas i studien som utsatta för mycket hög PFAS-exponering. Barnen till dessa kvinnor har sedan jämförts med andra barn i Blekinge. Annelise Blomberg tror att det kan finnas ett stort intresse för resultatet. Det är förstås viktigt för dem som har blivit exponerade i Ronneby, men också för andra som har blivit exponerade, inte bara i Sverige utan runtom i världen. Studien publiceras i den vetenskapliga tidskriften Plos Medicine.", "link": "https://www.tv4.se/artikel/tt-260410-pfasstudie1-d49dbb56/pfas-i-dricksvatten-kopplas-till-astma-hos-barn", "date_display": "2026-04-10", "date_iso": "2026-04-10T04:28:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/pfas", "/astma"]}, {"id": 147, "title": "The defense - after harsh criticism: We listen to the experts", "summary": "One of the major political projects of the Tidö Agreement is to push back crime in Sweden.\n\nThe government and the Sweden Democrats have carried out a series of legislative changes during the term of office which should lead to that.\n\nBut some proposals have met with strong criticism from experts, referral bodies and also from the Legislative Council. Among other things, the proposal for prison for 13-year-olds and the many penalty increases that were recently announced.\n\nDespite that, the government has implemented the changes.\n\nJustice Minister Gunnar Strömmer claims that the government actually listens to the experts. At least in some parts. Strömmer: The politicians decide Have you stopped listening to the experts?\n\n- Really not. On the contrary.\n\nBasically, according to the Minister of Justice, it is about the fact that it is not the experts, for example in the Legislative Council, who decide. Politicians do that.\n\n- What is a fair punishment is difficult to research. We believe that it is reasonable that the citizens' elected representatives in the Riksdag must weigh in on that issue, and therefore we are proceeding with reforms that we think have good reasons for them, says the prime minister.\n\nYou implement the will of the people, you mean?\n\n- Yes, we do so to the extent that this is a change in policy, a tightening of the punishment that has been discussed for a long time in politics, some would say several decades, which has also received broad support in general elections among citizens. The Law Council: A \"hasty act\" Regarding the penal reform, which will increase the punishment for about fifty crimes, the Law Council believes that it is a \"hasty act\" that is of \"lack of quality\". The content is, according to the authority, that the changes to the law should not be implemented.\n\nGunnar Strömmer believes that it is a political issue that the Legislative Council has decided on - namely whether the penalty should be increased or not.\n\n- I am not of the opinion that you should prevent the Legislative Council from submitting opinions, but depending on the nature of the opinions, you can say that politics has more or less room to take them into account or make its own considerations.", "title_original": "Försvaret – efter benhårda kritiken: Vi lyssnar på experterna", "summary_original": "Ett av Tidöavtalets stora politiska projekt är att trycka tillbaka brottsligheten i Sverige.\n\nRegeringen och Sverigedemokraterna har utfört en rad lagändringar under mandatperioden som ska leda till det.\n\nMen en del förslag har mött på kraftig kritik från experter, remissinstanser och även från Lagrådet. Bland annat förslaget om fängelse för 13-åringar och de många straffhöjningar som nyligen aviserades.\n\nTrots det har regeringen genomfört förändringarna.\n\nJustitieminister Gunnar Strömmer hävdar att regeringen faktiskt lyssnar på experterna. I varje fall i vissa delar. Strömmer: Politikerna bestämmer Har ni slutat att lyssna på experterna?\n\n– Verkligen inte. Tvärt om.\n\nI grunden, menar justitieministern, handlar det om att det inte är experterna, exempelvis i Lagrådet, som bestämmer. Det gör politikerna.\n\n– Vad som är ett rättvist straff är svårt att forska sig fram till. Vi menar att det är rimligt att medborgarnas valda representanter i riksdagen måste väga av den frågan och därför går vi vidare med reformer som vi tycker har goda skäl för sig, säger statsrådet.\n\nNi genomför folkviljan, menar du?\n\n– Ja, det gör vi i så mått att det här är en förändring av politiken, en skärpning av straffen som diskuterats under lång tid i politiken, en del skulle säga flera decennier, som också har fått ett brett stöd i allmänna val hos medborgarna. Lagrådet: Ett ”hastverk” Vad gäller straffreformen som ska höja straffen för ett femtiotal brott menar lagrådet att det är ett ”hastverk” som håller ”bristande kvalitet”. Kontentan är, enligt myndigheten, att lagförändringarna inte borde genomföras.\n\nGunnar Strömmer menar att det är en politisk fråga som lagrådet tagit ställning till – nämligen om straffen ska höjas eller inte.\n\n– Jag är inte av uppfattningen att man ska förhindra lagrådet från att lämna synpunkter, men beroende på synpunkternas karaktär så kan man säga att politiken har ett mer eller mindre stort utrymme att beakta dem eller göra egna avvägningar.", "link": "https://www.tv4.se/artikel/46YyoRuLS5fNDb7C7t6o59/stroemmers-foersvar-efter-kritiken-vi-lyssnar-pa-experterna", "date_display": "2026-04-10", "date_iso": "2026-04-10T04:04:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/politik", "/valet-2026", "/gunnar-strommer", "/valet-2022/moderaterna", "/regeringen"]}, {"id": 148, "title": "Sirak Meresie received help after the traffic accident: \"Sweden fixed me\"", "summary": "Jesus meeting and healthcare support in crisis after amputated left leg.", "title_original": "Sirak Meresie fick hjälp e   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
