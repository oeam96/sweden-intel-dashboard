": "Kärlekspar sköt ihjäl gängmedlem", "summary": "En gängmedlem i 18-årsåldern sköts till döds i Fornhöjden i Södertälje en fredagskväll i oktober förra året. Han och två andra måltavlor befann sig i en bil när gärningsmannen klev ut ur en annan bil och öppnade eld.  Ytterligare två personer befann sig i bilen, varav en man i 20-årsåldern skadades allvarligt i skjutningen och fördes med ambulans till sjukhus. Den tredje klarade sig oskadd. Gärningspersonerna flydde i en blå Audi men kunde gripas efter polisjakt. Nu döms skytten Joel Engback, 30, och Isabell Eriksson, 34, som körde bilen, till livstids fängelse för mord och mordförsök vid Södertälje tingsrätt.  ”Bonnie och Clyde”   Enligt utredningen hade paret en kärleksrelation, och kallade sig för ”Bonnie och Clyde”.  ”Nu ångrar jag mig angående jobbet. Vi behöver vara två. En som kör. Det är 300k. Bara pang, pang. Drive-by”, skriver småbarnsmamman till Joel. Polisen beskriver den dödsskjutne mannen som en central aktör i narkotikahandeln i Södertälje och Fornhöjden. Enligt utredningen var mordet ett led i organiserad brottslighet och hade föregåtts av särskild planering. ”Mordet har närmast haft karaktären av ren avrättning”, skriver tingsrätten. Efter dådet ska paret ha planerat att lämna landet.  Kvinnans tvååriga barn väntade enligt utredningen hemma medan mamman utförde morduppdraget. Mordet kopplas till Peykar Paret misstänks ha tagit på sig morduppdraget i en krypterad chatt. Enligt chattkonversationerna hade de utlovats 300 000 kronor. Den internationellt efterlyste Dante Peykar, 41, misstänks ha beställt mordet under Signal-aliaset ”Tartarus”. ”Ja, kommer lösa ett enkelt japp jobb. Minst 200k o uppåt”, skriver ”Tartarus” i en chatt. Enligt åklagaren ska Joel Engback ha fått 12 500 amerikanska dollar – omkring 120 000 kronor – i brottsvinst. Dante Peykar är häktad i sin utevaro och misstänks befinna sig utomlands. Han är också misstänkt för att ha beställt mordförsöket på Irankännaren Arvin Khoshnood.", " en Arvin Khoshnood.", "link": "https://www.tv4.se/artikel/5am5IZUiBoIRCgUBIhxBRd/kaerlekspar-skoet-ihjael-gaengmedlem-doems-till-faengelse", "date_display": "2026-10-30", "date_iso": "2026-10-30T10:03:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["/", "/inrikes", "/brott-och-straff", "/sodertalje", "/mord", "/gangkriminella"]}, {"id": 159, "title": "Unga bryter trend under halloween: ”Revolt mot de duktiga”", "summary": "Nästan varannan 15–17-åring planerar att dricka alkohol under halloweenhelgen, enligt en ny undersökning från IQ. Högtiden har blivit ett allt viktigare festtillfälle för unga och konkurrerar med mer traditionella högtider. – Halloween är en ny högtid. Vi tror att det beror lite grann på att den inte är formad ännu, så unga kan ta den till sig själva, säger Fredrik Lundgren.  Möjligt trendbrott bland unga  Sedan början av 2000-talet har alkoholkonsumtionen bland ungdomar minskat drastiskt. Även användningen av andra droger ligger på historiskt låga nivåer, enligt Fredrik Lundgren. Men nu ser IQ tidiga signaler om att utvecklingen kan vara på väg att vända. – Det vi ser i tidiga mätningar är att det kanske ökar bland gymnasieungdomar, både antalet som dricker och hur mycket man dricker. En möjlig förklaring kan vara att unga börjar göra uppror mot den generation som valt bort alkoholen. – Det kan vara en möjlig förklaring, att det är en revolt mot de duktiga. ”Det blir inget drickande för mig” Fotbollsspelaren Chelseo Mota, 19, tillhör dem som väljer bort alkoholen under Halloweenhelgen. För honom går idrotten först. – Jag försöker undvika att dricka, men jag är inte nykterist. Leia Norman, 22, planerar däremot en Halloweenfest där det kommer att finnas alkohol. Samtidigt tycker hon att alla ska kunna välja själva. Men att tacka nej är inte alltid enkelt. – Om jag inte dricker nu kanske jag är tråkig eller konstig, säger hon om tankarna som kan uppstå. Fler accepterar att avstå Trot   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
