elia Swärd: ”Kärleken är stabil men pengarna går åt snabbt”", "summary_original": "Vid vägs ände i Värmland har makarna Elsa och Cornelia Swärd slagit sig ned för att leva nära naturen, odla, jaga och skriva böcker. DN har rest till Ekshärad för att träffa den färska deckarduon bakom årets sommarföljetong ”Blodröta” – och deras grannar.", "link": "https://www.dn.se/kultur/elsa-och-cornelia-sward-karleken-ar-stabil-men-pengarna-gar-at-snabbt/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:00:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Blood Rot, Part 1 of 57", "summary": "2034-03-08 at 06:53 SOS operator: Hello? Are you left? Caller: … Yes. (weak) SOS operator: It looks like you're on…", "title_original": "Blodröta, del 1 av 57", "summary_original": "2034-03-08 kl 06:53 SOS-operatör: Hallå? Är du kvar? Uppringare: … Ja. (svagt) SOS-operatör: Det ser ut som att du befinner dig på…", "link": "https://www.dn.se/kultur/blodrota-del-1-av-57/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "DN Debate. \"SD can decide the election - but not in the way you think\"", "summary": "DN DEBATE. Even though the government has done what is required to win re-election, the opposition is losing ground in the polls. The normalization of SD may be going on in Rosenbad, but not among marginal voters. This is shown by a new survey. There are many indications that this autumn's big question will not be who you vote for, but who you vote against, write two representatives of the opinion firm Indikator.", "title_original": "DN Debatt. ”SD kan avgöra valet – men inte på sättet ni tror”", "summary_original": "DN DEBATT. Trots att regeringen har gjort det som krävs för att vinna omval drar oppositionen ifrån i mätningarna. Normaliseringen av SD pågår kanske i Rosenbad, men inte bland marginalväljarna. Det visar en ny undersökning. Mycket tyder på att höstens stora fråga inte blir vilka du röstar för, utan vem du röstar emot, skriver två företrädare för opinionsföretaget Indikator.", "link": "https://www.dn.se/debatt/sd-kan-avgora-valet-men-inte-pa-sattet-ni-tror/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Teased in the premiere - now Brobbey gave Sweden a nightmare start", "summary": "Teased in the premiere. Now Brian Brobbey has netted for the Netherlands twice again and given Sweden a nightmare start in the World Cup match in Houston. After just five minutes, Sweden found itself at a disadvantage. Which then became 0–2.", "title_original": "Petad i premiären – nu gav Brobbey Sverige en mardrömsstart", "summary_original": "Petad i premiären. Nu har Brian Brobbey nätat för Nederländerna två gånger om och gett Sverige en mardrömsstart i VM-matchen i Houston. Redan efter fem minuter hamnade Sverige i underläge. Som sedan blev till 0–2.", "link": "https://www.dn.se/sport/petad-i-premiaren-nu-gav-brobbey-sverige-en-mardromsstart/", "date_display": "2026-06-20", "date_iso": "2026-06-20T17:55:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Ten years after Brexit: Majority of Britons want to return to the EU", "summary": "When in 1984 the author George Orwell was once going to describe poor England, he took as his starting point the hardships of the miners in the north-west. The 1937 'Way to Wigan Pier' became a classic and ironically also created a tourist attraction when, 50 years later, clever entrepreneurs turned the slum area on the canal between Leeds and Liverpool into an entertainment district. Equally deadly ironic is the situation today, when vagrants and drug addicts have taken over where pubs and nightclubs have closed down. The British economy is not doing well. And the residents that TT talks to on the streets of Wigan know what to blame. Everything has gone downhill since we left the EU, sighs Amy. We shot ourselves in the foot, notes Jeremy. \"Huge problems\" Exact numbers are not easy to calculate, but various surveys point to, for example, a reduced GDP of 6-8 percent, a 4 percent drop in productivity and a 15 percent drop in trade. Trade Minister Chris Bryant from Social Democratic Labor longs to return. I hope that in my lifetime we will be welcomed back to the heart of Europe as members of the EU. Brexit has created enormous problems for Britain's economy, he told the AFP news agency during a visit to the European Parliament in May. But just coming back is not easy. Not even Bryant's own government dares to openly advocate a \"brejoin\" - a re-entry. Fresh start with the EU Speaking positively about the EU is still sensitive, after years of British criticism of Brussels. The Labor government has nevertheless initiated what is called a \"fresh start\" in relations with the EU, with negotiations on everything from food regulations and emissions trading to AI development and university exchanges. However, it is far from friction-free. A planned summit between Prime Minister Keir Starmer and EU chiefs Ursula von der Leyen and António Costa has been steadily pushed back over the spring and was pegged as late as this week to July 22. The delay is not least due to the uncertainty right now surrounding the hard pre", "title_original": "Tio år efter brexit: Majoritet av britterna vill återgå till EU", "summary_original": "När 1984-författaren George Orwell en gång i tiden skulle beskriva fattig-England tog han avstamp i gruvarbetarnas umbäranden i nordväst. “Vägen till Wigan Pier” från 1937 blev en klassiker och skapade ironiskt nog också en turistattraktion när smarta entreprenörer 50 år senare förvandlade fattigområdet vid kanalen mellan Leeds och Liverpool till ett nöjesdistrikt. Lika dräpande ironiskt är läget i dag, när uteliggare och narkomaner har tagit över där pubar och nattklubbar har lagt ner. Den brittiska ekonomin mår inte bra. Och de invånare som TT pratar med på gatan i Wigan vet vad de ska skylla på. Allt har gått spikrakt nedåt sedan vi lämnade EU, suckar Amy. Vi sköt oss själva i foten, konstaterar Jeremy. ”Enorma problem” Exakta siffror är inte lätta att räkna ut, men olika undersökningar pekar exempelvis på en minskad bnp på 6-8 procent, 4 procents nedgång i produktiviteten och 15 procent minus för handeln. Handelsminister Chris Bryant från socialdemokratiska Labour längtar tillbaka. Jag hoppas att vi i under min livstid kommer att välkomnas tillbaka till hjärtat av Europa som medlemmar av EU. Brexit har skapat enorma problem för Storbritanniens ekonomi, sade han till nyhetsbyrån AFP vid ett besök i EU-parlamentet i maj. Men att bara komma tillbaka är inte enkelt. Inte ens Bryants egen regering vågar öppet förorda ett “brejoin” – ett återinträde. Nystart med EU Att tala positivt om EU är fortfarande känsligt, efter åratal av brittisk kritik mot Bryssel. Labourregeringen har ändå dragit i gång vad man kallar för en ”nystart” i relationerna till EU, med förhandlingar om allt från livsmedelsregler och utsläppshandel till AI-utveckling och universitetsutbyten. Det går dock långt ifrån friktionsfritt. Ett planerat toppmöte mellan premiärminister Keir Starmer och EU-topparna Ursula von der Leyen och António Costa har stadigt skjutits upp under våren och spikades så sent som i veckan till den 22 juli. Förseningen beror inte minst på osäkerheten just nu kring den hårt pressade Starmer och hans position och framtid. Men också på oenighet om hur många europeiska studenter som kan accepteras i Storbritannien och vice versa. Medvind för Farage Mätningar under våren visar att runt 60 procent av de tillfrågade i Storbritannien i dag skulle rösta för att stanna i EU. Samtidigt är det ändå ärkebrexitören Nigel Farage och hans Reformparti som har mest medvind i opinionen för tillfället. Invandringsfrågan är fortsatt lika het som för tio år sedan. Då pekade Farage och andra ut EU som ansvarigt för alla problem som hade med migranter, flyktingar och gästarbetare att göra. Att Storbritannien sedan dess lämnat unionen hindrar inte politiker och debattörer från att fortsatt skylla problemen på inflöde från EU-länder över Engelska kanalen eller landgränsen till Irland. Bara de senaste veckorna har uppmärksammade våldsbrott från förövare med utländskt ursprung i Southampton och Belfast lett till omfattande kravaller. Spricker landet? EU-frågan lär fortsättningsvis ha politisk sprängkraft i Storbritannien i många år – med potential att skaka hela statsbildningen. Landsdelarna Skottland, Wales och Nordirland leds just nu alla tre av partier som vill bryta sig loss från London och ta sig tillbaka till EU. Så som valsystemet ser ut, där det räcker med att vara störst i varje valkrets, snarare än att ha någon total majoritet, kan samtidigt England vara på väg åt andra hållet och driva fram en än mer nationalistisk anti-EU-regering under Farage efter nästa val, senast 2029. Skottland trycker redan på för att få folkomrösta om självständighet ännu en gång. Vi måste ena oss i Skottland för att garantera att vårt parlament är Farage-skyddat fullt ut. Det innebär att före 2029 kunna besluta om vår konstitutionella framtid, utan att Farage kan blockera oss, sade regionale regeringschefen John Swinney i ett framträdande efter lokalvalen i början av maj. ”Generande” I Wigan röstade mer än 60 procent för att lämna EU i folkomröstningen 2016. Här suckas nu tungt över isolering och sämre möjligheter att resa och arbeta i andra länder. Och vårt rykte i andra länder har försämrats. Nu klumpas vi ihop med amerikanerna, säger Amy, som ändå hoppas på en omsvängning och ett återinträde till EU i sinom tid. Ethan och Jeremy, på väg hem från den lokala högskolan, är inte lika hoppfulla. Troligen inte. Jag tror att det skulle vara för generande att göra en u-sväng, säger Ethan.", "link": "https://www.tv4.se/artikel/3FIoixNh6gz4U6iPouXVBD/tio-ar-efter-brexit-majoritet-av-britterna-vill-aterga-till-eu", "date_display": "2026-06-20", "date_iso": "2026-06-20T17:34:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/brexit", "/storbritannien", "/eu"]}, {"id": 138, "title": "Iran closes Strait of Hormuz - responds to \"breach of promise\"", "summary": "Threats of further measures • The demand on the United States", "title_original": "Iran stänger Hormuzsundet – svarar på ”löftesbrott”", "summary_original": "Hotar om ytterligare åtgärder • Kravet på USA", "link": "https://www.tv4.se/artikel/QJCvJogIoTG6d3MbFJId4/iran-staenger-hormuzsundet-svarar-pa-loeftesbrott", "date_display": "2026-06-20", "date_iso": "2026-06-20T16:05:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 139, "title": "After the set-off row - does Sweden need to become more like Finland?", "summary": "Who knows if it depends on the sisu. But in the Finnish Parliament, it is standard for members of the Riksdag to be present at all votes.\n\n- I once made it so that I had to put a sick child to bed in the back seat of the car, drive three hours to Helsinki, vote and go back home, says Sandra Bergqvist, Member of Parliament for the Swedish People's Party (SFP).\n\n- I turned 50 and was in Spain. But I had to go home just to press the button twice, and then go back to Spain, says the Social Democratic member Kim Berg (SDP). \"In Finland, it feels almost sacred\" Here, too, illnesses, personal reasons and other practical things can get in the way. However, the governing parties in particular are keeping a close watch before votes to ensure that their majority will hold.\n\n- If you are away for a while, you get direct feedback from citizens, that where have you been? Citizens here in Finland follow very carefully whether you are there or not, says Kim Berg (SDP).\n\n- In Finland, the right of members of the Riksdag to be in the plenary session, vote and speak is almost sacred, says Sandra Bergqvist (SFP). The professor: The receipt system has served Sweden well At the University of Helsinki, political science professor Åsa von Schoultz states that Finnish governments are traditionally built with wider majorities than Swedish ones, where the margin is often just a single member. For example, after the last election, the Tidö parties collected 176 seats against the opposition parties' 173.\n\n- I think that the offset system has served Sweden well. It has been possible to have very vulnerable governments in the sense that they are not strong and have no extra buffer. If it won't work in the future, you may have to rethink how you form a government, and what kind of support you need, says Åsa von Schoultz.\n\nFinland also has a clear right-wing government this term, which collects 108 seats against the opposition's 92. Historically, however, the search for strong majorities has created a st", "title_original": "Efter kvittningsbråket – behöver Sverige bli mer som Finland?", "summary_original": "Vem vet om det beror på sisun. Men i Finlands riksdagshus är det standard för riksdagsledamöterna att vara på plats vid alla voteringar.\n\n– Jag har en gång gjort så att jag fått bädda ner ett sjukt barn i baksätet av bilen, köra tre timmar till Helsingfors, rösta och åka tillbaka hem, säger Sandra Bergqvist, riksdagsledamot för Svenska folkpartiet (SFP).\n\n– Jag fyllde 50 år och var i Spanien. Men jag var tvungen att åka hem bara för att trycka två gånger på knappen, och sedan åka tillbaka till Spanien, säger den socialdemokratiska ledamoten Kim Berg (SDP). ”I Finland känns det nästan heligt” Även här kan sjukdomar, personliga skäl och annat praktiskt komma emellan. Särskilt regeringspartierna håller dock noggrann koll inför omröstningar för att se till att deras majoritet ska hålla.\n\n– Om man är borta någon gång får man direkt feedback från medborgare, att var har du varit? Medborgare här i Finland följer väldigt noggrant om du är på plats eller inte, säger Kim Berg (SDP).\n\n– I Finland känns det nästan heligt med riksdagsledamöternas rättighet att få vara i plenum, få rösta och uttala sig, säger Sandra Bergqvist (SFP). Professorn: Kvittningssystemet har tjänat Sverige väl På Helsingfors universitet konstaterar statsvetarprofessorn Åsa von Schoultz att finländska regeringar traditionellt byggs med bredare majoriteter än svenska, där marginalen ofta bara är någon enstaka ledamot. Exempelvis samlade Tidöpartierna efter senaste valet 176 mandat mot oppositionspartiernas 173.\n\n– Jag tänker att kvittningssystemet har tjänat Sverige väl. Man har kunnat ha väldigt sårbara regeringar i den bemärkelsen att de inte är starka och har någon extra buffert. Om det inte kommer att fungera framöver måste man kanske tänka om i hur man bildar regering, och vilken typ av stöd man behöver, säger Åsa von Schoultz.\n\nÄven Finland har den här mandatperioden en tydlig högerregering, som samlar 108 mandat mot oppositionens 92. Historiskt har dock sökandet efter starka majoriteter skapat en starkare konsensuskultur.\n\n– Den finländska politiska kulturen är annorlunda. Det finns en långvarig tradition av att bygga breda regeringskoalitioner och där det inte finns någon tydlig blockgräns i politiken. Det finns inte heller lika många låsningar kring vilken typ av regering man kan bilda, utan det är ett väldigt öppet spelfält, säger Åsa von Schoultz. Socialdemokraten vill inte ta ställning I riksdagshuset leder detta fram till en fråga som socialdemokraten Kim Berg får besvara.\n\nTror du att den nuvarande situationen kan vara bra för Sverige i längden?\n\n– Ja. Kanske. Jag vet inte… Jag vet inte.\n\nDu vill inte ta ställning?\n\n– Ja, jag vill inte ta ställning, måste jag säga. Jag är också nordiska rådets vice president detta år. Jag vill inte säga vad riksdagsledamöter i Sverige borde göra, skrattar Kim Berg (SDP).", "link": "https://www.tv4.se/artikel/5s5PeCS08lOPCHOAimg9ls/efter-kvittningsbraket-behoever-sverige-bli-mer-som-finland", "date_display": "2026-06-20", "date_iso": "2026-06-20T15:34:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Svensk politik", "/politik", "/valet-2026", "/svensk-politik", "/riksdagen", "/kvittning", "/natodebatten/finland", "/kvittningsbraket"]}, {"id": 140, "title": "Guardian tattooed 12-year-old - charged with assault", "summary": "A 12-year-old girl in central Sweden was tattooed by her bonus dad at the beginning of the year on the family sofa in the living room. The bonus father must then have tattooed a smiley face together with a letter on the ankle, with the mother's consent. \n\n\"Yes, but do a small one on her then\", the mother is said to have said according to interrogation. The mother and bonus father are now charged with assault after the tattoo, which allegedly caused redness and pain, according to the indictment. At the same time, the crime was allegedly witnessed by the girl's nine-year-old sister. In doing so, the couple is also charged with child welfare crimes, which News Agency Siren was the first to report on. Began as \"a challenge\" The girl states in questioning that it started as a \"challenge\" on social media. She wrote to her mother and asked how many \"likes\" she would get if she got a tattoo - to which the mother replied 10,000. She then allegedly passed the challenge and thus got the tattoo as a reward. The girl also states that she recorded the mobile screen while writing to her mother on Messenger. It was that video clip that she then posted on social media and got 20,000 likes for it. According to the indictment, the tattoo must have been a so-called \"mother and daughter tattoo\" as the mother also had a similar tattoo. Witnessed by the little sister The girl, who is said to be afraid of needles, tells in the interrogation that she did not dare to get tattooed when she heard how the tattoo machine, which the family had at home, sounded and understood that it contained needles. The bonus father must then have first made a dash so that she could feel how it felt. The girl must then have thought it didn't hurt, and then he must have continued. The couple admits to the tattoo but denies wrongdoing. The mother says that the daughter did the tattoo herself without her knowledge, and the bonus father states that he thought \"it was okay\" to tattoo the girl with the mother's permission.  There is no law that prohibits minors from getting tattoos. However, a professional ethical rule within Sweden's Registered Tattoo Artists (SRT) applies regarding the 18-year-old age limit for tattooing", "title_original": "Vårdnadshavare tatuerade 12-åring – åtalas för misshandel", "summary_original": "En 12-årig flicka i Mellansverige tatuerades av sin bonuspappa i början av året i familjens soffa i vardagsrummet. Bonuspappan ska då ha tatuerat in en smiley tillsammans med en bokstav vid ankeln, med mammans medgivande. \n\n”Ja men gör en liten på henne då”, ska mamman ha sagt enligt förhör. Mamman och bonuspappan åtalas nu för misshandel efter tatueringen som ska ha orsakat rodnad och smärta, enligt åtalet. Brottet ska samtidigt ha bevittnats av flickans nioåriga syster. Därmed åtalas paret även för barnfridsbrott, vilket Nyhetsbyrån Siren var först med att rapportera om. Började som ”en challenge” Flickan uppger i förhör att det började som en ”challenge” på sociala medier. Hon skrev till sin mamma och frågade hur många ”likes” hon skulle få om hon gjorde en tatuering –  varpå mamman svarade 10 000.  Hon ska sedan ha klarat av utmaningen och därmed fått göra tatueringen som en belöning. Flickan uppger också att hon spelade in mobilskärmen samtidigt som hon skrev till sin mamma på Messenger. Det var det videoklippet som hon sedan la ut i sociala medier och fick 20 000 likes för. Enligt åtalet ska tatueringen ha varit en så kallad ”mor och dotter-tatuering” då även mamman gjorde en likadan tatuering. Bevittnades av lillasystern Flickan, som ska vara rädd för nålar, berättar i förhör att hon först inte vågade låta sig tatueras när hon hörde hur tatueringsmaskinen, som familjen hade hemma, lät och förstod att den innehöll nålar. Bonuspappan ska då först ha gjort ett streck så att hon fick känna hur det kändes. Flickan ska då ha tyckt att det inte gjorde ont, och då ska han ha fortsatt. Paret medger tatueringen men nekar till brott. Mamman berättar att dotter gjort tatueringen själv utan hennes kännedom, och bonuspappan uppger att han trodde ”det var okej” att tatuera flickan med mammans tillåtelse.  Det finns ingen lag som förbjuder minderåriga att tatuera sig. Däremot gäller en yrkesetisk regel inom Sveriges Registrerade Tatuerare (SRT) om 18-årsgräns i tatueringsbranschen.", "link": "https://www.tv4.se/artikel/4vXflmfSO0FBwp8tsl4cY8/vardnadshavare-tatuerade-12-aring-atalas-foer-misshandel", "date_display": "2026-06-20", "date_iso": "2026-06-20T13:57:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/tatueringar", "/misshandel", "/brott"]}, {"id": 141, "title": "Seminar at Torp - how different can you think in a congregation?", "summary": "EFK pastor Elin Hemström: \"We will never reach complete harmony and unity\".", "title_original": "Seminarium på Torp – hur olika får man tänka i en församling?", "summary_original": "EFK-pastorn Elin Hemström: ”Vi kommer aldrig till fullständig harmoni och enighet”.", "link": "https://www.dagen.se/nyheter/seminarium-pa-torp-hur-olika-far-man-taenka-i-en-foersamling/10403178", "date_display": "2026-06-20", "date_iso": "2026-06-20T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "The Netherlands are preparing with prayer for the match against Sweden", "summary": "\"Pastor\" Cody Gapko: The prayer group is getting bigger and bigger.", "title_original": "Nederländerna förbereder sig med bön inför matchen mot Sverige", "summary_original": "”Pastor” Cody Gapko: Bönegruppen blir större och större.", "link": "https://www.dagen.se/nyheter/nederlaenderna-foerbereder-sig-med-boen-infoer-matchen-mot-sverige/10405112", "date_display": "2026-06-20", "date_iso": "2026-06-20T09:52:50+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 143, "title": "More and more people are looking for conversational help from Nyhemsvekkan's pastoral care workers", "summary": "Relationship problems, mental illness and internet porn recurring topics.", "title_original": "Allt fler söker samtalshjälp hos Nyhemsveckans själavårdare", "summary_original": "Relationsproblematik, psykisk ohälsa och nätporr återkommande ämnen.", "link": "https://www.dagen.se/nyheter/allt-fler-soeker-samtalshjaelp-hos-nyhemsveckans-sjaelavardare/10405079", "date_display": "2026-06-20", "date_iso": "2026-06-20T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "How sleep is affected by the holiday: \"The first night effect\"", "summary": "During the summer, many people sleep away, in hotels or with friends. Christian Benedict explains that it is not uncommon for sleep to be worse the first night in a new place. The brain is extra vigilant in an unfamiliar environment, which can disturb sleep. - Above all, the first night is a big challenge because your brain senses that it is not the environment we usually sleep in. So you have this first night effect, says Christian Benedict. Routines and security important To sleep better away, Benedict advises bringing something from home, such as a pillow, so that the brain feels a little more at home. He also emphasizes the importance of sticking to your regular sleep routines, even on vacation. - A routine, for example, is an important aspect to promote the conditions for a good night's sleep, says Benedict. Alcohol a sleep culprit He also explains how alcohol has a negative impact on our sleep quality, although it can help some people fall asleep faster. - The problem is that you have an increased tendency to snore or have pauses in breathing, which is very problematic for the quality of sleep, says Benedict. Audio books help many to relax. Something that can, however, help sleep are audio books. Research has found that it is common to fall asleep to the same audiobook over and over again to create security and distraction from everyday stress. He says that the choice of book is individual but that many prefer stories they have listened to when they were younger. - They say: It helps me a lot to fall asleep and relax, says Benedict. Sleep apps can create stress At the same time, today there are both sleep apps and watches that measure sleep. But Benedict believes that there are both positive and negative sides to these tools. For example, getting an update on one's sleep every morning can induce what he calls sleep stress. - Sleep should not be a matter of performance. It is not good when you feel that you are becoming far too focused on this, says Benedict. At the same time, he tells us that technology", "title_original": "Så påverkas sömnen av semestern: ”Första natten-effekten”", "summary_original": "Under sommaren är det många som sover borta, på hotell eller hos vänner. Christian Benedict förklarar att det inte är ovanligt att sömnen blir sämre första natten på ny plats. Hjärnan är extra vaksam i en okänd miljö, vilket kan störa sömnen. – Framför allt den första natten är en stor utmaning eftersom din hjärna känner av att det inte är den miljö vi brukar sova i. Så man har den här första natten-effekten, säger Christian Benedict. Rutiner och trygghet viktiga För att sova bättre borta tipsar Benedict om att ta med något hemifrån, till exempel en kudde, så att hjärnan känner sig lite mer hemma. Han betonar också vikten av att hålla fast vid sina vanliga sovrutiner, även på semestern. – En rutin, till exempel, är en viktig aspekt för att främja förutsättningarna att ha en god nattsömn, säger Benedict. Alkohol en sömnbov Han förklarar även hur alkohol har en negativ påverkan på vår sömnkvalitet, även om det kan hjälpa vissa att somna snabbare. – Problematiken är att du har en ökad benägenhet att snarka eller ha andningsuppehåll, som är väldigt problematiskt för sömnens kvalitet, menar Benedict. Ljudböcker hjälper många att slappna av Något som däremot kan hjälpa sömnen är ljudböcker. I forskning har man hittat att det är vanligt att somna till samma ljudbok om och om igen för att skapa trygghet och distraktion från vardagsstress. Han berättar att valet av bok är individuellt men att många föredrar berättelser de har lyssnat på när de var yngre. – De säger: Det hjälper mig mycket att somna och varva ner, menar Benedict. Sömnappar kan skapa stress Samtidigt finns det i dag både sömnappar och klockor som mäter sömnen. Men Benedict menar att det finns både positiva och negativa sidor med dessa verktyg. Att exempelvis få en uppdatering om ens sömn varje morgon kan framkalla vad han kallar för sömnstress. – Sömn ska inte vara en prestationsgrej. Det är inte bra när man upplever att man blir alldeles för fokuserad på detta, säger Benedict. Samtidigt berättar han att tekniken i vissa fall kan hjälpa till att upptäcka problem som annars hade gått obemärkt förbi. – Det finns många som har problem med andningen under sömnen. Då kan man använda sömnspårning för att få ett hum om det är det man behöver utreda, säger Benedict.", "link": "https://www.tv4.se/artikel/2BjtGbT9B1uU1oBXl2f4WY/sa-paverkas-din-soemn-av-semestervanor", "date_display": "2026-06-20", "date_iso": "2026-06-20T09:03:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/semester", "/somn", "/resa", "/forskning"]}, {"id": 145, "title": "He is in the middle of Lebanon: \"People are desperate\"", "summary": "New truce broken • Criticism of the US envoy", "title_original": "Han befinner sig mitt i Libanon: ”Folk är förtvivlade”", "summary_original": "Nya vapenvilan bruten • Kritik mot USA:s sändebud", "link": "https://www.tv4.se/artikel/50J8AnWKQ6xQw2pbi6omUx/han-befinner-sig-mitt-i-libanon-folk-aer-foertvivlade", "date_display": "2026-06-20", "date_iso": "2026-06-20T08:26:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 146, "title": "Damage to Brazil: \"Disturbing images\"", "summary": "The key player threw in the towel", "title_original": "Skadesmäll för Brasilien: ”Oroväckande bilder”", "summary_original": "Nyckelspelaren kastade in handduken", "link": "https://www.tv4.se/artikel/23dbZKNOQY16pA4gwQbz2M/skadesmaell-foer-brasilien-orovaeckande-bilder", "date_display": "2026-06-20", "date_iso": "2026-06-20T06:33:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 147, "title": "Choux au craquelin with strawberries and vanilla cream", "summary": "The kitchen's weekend tip offers an airy and light petit choux with a crispy craquelin topping that provides a wonderful chewing resistance and creates a perfect contrast to the creamy filling. A summery dessert with a French feel and irresistible taste. For Roy Fare's recipe", "title_original": "Choux au craquelin med jordgubbar och vaniljgrädde", "summary_original": "Kökets helgtips bjuder på en luftig och lätt petit choux med en krispig craquelin-topping som ger ett härligt tuggmotstånd och skapar en perfekt kontrast till den krämiga fyllningen. En somrig dessert med fransk känsla och oemotståndlig smak. Till Roy Fares recept", "link": "https://www.tv4.se/artikel/5Mg5FJJfMh1MEWTEWir0Xh/choux-au-craquelin-med-jordgubbar-och-vaniljgraedde", "date_display": "2026-06-20", "date_iso": "2026-06-20T06:18:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/kokets-helgtips", "/koket", "/roy-fares"]}, {"id": 148, "title": "Messy midsummer night: \"A lot of drunkenness and abuse\"", "summary": "The police were alerted at 11.55pm to Brännö outside Gothenburg after a man in his 30s was cut in the throat with a glass bottle - We are going to the scene, the man who is injured has wet a bit and is being taken to hospital by ambulance boat and later a normal ambulance, says Adam Isaksson Samara. Several people witnessed the incident - Witness interviews and information gathering lead to us being able to locate and secure a suspected perpetrator during the night, it is a man in his 20s who is arrested. The injured man is being treated in hospital and was interviewed by the police during the night. Drunkenness and assault The police describe Midsummer night as messy. - There has been a lot of drunkenness, disorder and abuse, says Adam Isaksson Samara. In Västra Götaland, the police have received more than 30 alarms about assault and over 50 alarms linked to drunkenness. - There has been more drunkenness, disorder and fights in town than a normal evening, says Adam Isaksson Samara.  Families with children locked themselves up Elsewhere in the country, the police's work was also characterized by drunkenness and violent crime. In Östhammar, families with children had to lock themselves in their cottages after a drunken and aggressive man ran amok and misbehaved on an island in the coastal belt. According to the police, the man has threatened and chased people around and hit at least one person. The man, who is aged 35, had to spend the night at the police station and is now suspected of assault. In Varberg, two men were taken to hospital after a fight in a restaurant. The younger of the men is said to have been hit in the head with some form of affection.  Roof party derailed in Stockholm In Stockholm County, the police handled 858 cases during Midsummer Night. One of the alarms concerned a rooftop party at Gärdet where most of the participants were under 18. The party derailed when young people started throwing eggs and beer cans into the street.   In Skåne, the police were called to Falsterbo, among other places, where four people were beaten in connection with a midsummer celebration. A man in his 20s is suspected of all the cases and about", "title_original": "Stökig midsommarnatt: ”En väldig massa fylla och misshandel”", "summary_original": "Polisen larmades vid 23.55 till Brännö utanför Göteborg efter att en man i 30-årsåldern blivit skuren i halsen med en glasflaska  – Vi beger oss till platsen, mannen som är skadad har blött en del och förs till sjukhus med ambulansbåt och senare vanlig ambulans, säger Adam Isaksson Samara. En flertal personer blev vittnen till händelsen – Vittnesförhör och informationsinhäntning ledder till att vi kan lokalisera och säkra en misstänkt gärningsperson under natten, det är en man i 20-årsåldern som grips. Den skadade mannen vårdas på sjukhus och har under natten kunnat höras av polisen. Fylleri och misshandel Polisen beskriver midsommarnatten som stökig. – Det har varit en väldig massa fylla, stök och misshandel, säger Adam Isaksson Samara. I Västra Götaland har polisen tagit emot drygt 30 larm om misshandel och över 50 larm kopplade till fylleri. – Det har varit mer fylla, stök och slagsmål på stan än en vanlig kväll, säger Adam Isaksson Samara.  Barnfamiljer låste in sig Även på andra håll i landet präglades polisens arbete av fylleri och våldsbrott. I Östhammar fick barnfamiljer låsa in sig i sina stugor efter att en berusad och aggressiv man härjat runt och betett sig illa på en ö i kustbandet. Mannen ska enligt polisen ha hotat och jagat runt människor samt slagit minst en person. Mannen som är i 35-årsåldern, fick tillbringa natten på polisstationen och misstänks nu för misshandel. I Varberg fördes två män till sjukhus efter ett slagsmål på en restaurang. Den yngre av männen ska ha blivit slagen i huvudet med någon form av tillhygge.  Takfest spårade ur i Stockholm I Stockholms län hanterade polisen 858 ärenden under midsommarnatten. Ett av larmen gällde en takfest på Gärdet där de flesta deltagarna var under 18 år. Festen spårade ur när ungdomar började kasta ägg och ölburkar mot gatan.   I Skåne larmades polisen bland annat till Falsterbo, där fyra personer misshandlats i samband med ett midsommarfirande. En man i 20-årsåldern misstänks för samtliga fall och omhändertogs på grund av berusning. Sent under kvällen larmades polisen även till en bostad i Kalmar där en man uppträdde utåtagerande. Enligt polisen ska mannen ha slagit sönder föremål i lägenheten och misshandlat tre personer, bland annat genom att ta strypgrepp.", "link": "https://www.tv4.se/artikel/57nXsd9el3Vzn1Sji5DPng/stoekig-midsommarnatt-massa-fylla-och-misshandel", "date_display": "2026-06-20", "date_iso": "2026-06-20T05:54:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Midsommar", "/midsommar", "/inrikes"]}, {"id": 149, "title": "Turkey eliminated from the World Cup - fell despite historic expulsion", "summary": "Shock exodus: \"We are ashamed\"", "title_original": "Turkiet utslaget ur VM – föll trots historisk utvisning", "summary_original": "Chockuttåg: ”Vi skäms”", "link": "https://www.tv4.se/artikel/2PWkNKP9Gq24eOkT2z2JDx/turkiet-utslaget-ur-vm-foell-trots-historisk-utvisning", "date_display": "2026-06-20", "date_iso": "2026-06-20T05:47:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 150, "title": "New research: \"Cold spot\" may indicate weaker Gulf Stream", "summary": "As the whole Earth warms, there is an exception. Just south of Iceland and Greenland, a small part of the Atlantic Ocean is an area that is getting colder and colder. It is called the cold blob. The Swedish ocean climate scientist Léon Chafik has worked with the spot for a long time. - When the whole world warms up over a long period of time, there is a hole, the cold spot, he explains. The new study: Happening deep down Before some people thought that the cold spot was only on the surface of the water, but a new German study suggests that the cooling also takes place deep down in the water. It could indicate that the gulf stream system, the system of underwater currents that make the winters in Scandinavia milder than in Canada or Alaska, among others, is weakening. The scientific community expects the system to become weaker until the year 2100. This is because there is more fresh water at higher latitudes, which in turn is due to more precipitation and melting ice. The increased amount of fresh water affects the \"pump\" in the Gulf Stream system, which works because salt water sinks faster than fresh water. - Several studies have read the cold spot in that way and shown that the system may have weakened by approximately 15 percent since the middle of the 20th century, says Léon Chafik. However, one should be careful in drawing any conclusions about the cold spot, he believes. - It is debated. The same cold spot can be created in more than one way. If you have a room that gets cold, it could be because the pipes are broken, but also because someone has opened a window. The expert: It won't be like \"Day after tomorrow\" But while it is unclear whether the cold spot is mostly controlled by ocean currents, there is still reason to worry that the gulf stream system is weakening. If the Gulf Stream system were to collapse completely, many envision a scenario like in the doomsday movie \"Day after tomorrow\", where an ice age occurs in the northern hemisphere. But the cooling will not be that fast or extreme, says Chafik. - In addition, we have global warming", "title_original": "Ny forskning: ”Kalla fläcken” kan tyda på svagare Golfström", "summary_original": "När hela jorden blir varmare finns det ett undantag. Precis söder om Island och Grönland, en liten del av Atlanten finns ett område som blir kallare och kallare. Det kallas kalla fläcken, eller ”the cold blob”. Den svenske havsklimatforskaren Léon Chafik har jobbat med fläcken länge. – När hela världen värms upp över lång tid så finns det ett hål, den kalla fläcken, förklarar han. Nya studien: Sker djupt nere Innan har vissa trott att den kalla fläcken bara är på vattenytan, men en ny tysk studie tyder på att avkylningen sker även djupt ner i vattnet. Det skulle kunna tyda på att golfströmssystemet, det system av undervattensströmmar som gör vintrarna i bland annat Skandinavien mildare än i Kanada eller Alaska, försvagas. Forskarvärlden förväntar sig att systemet kommer att bli svagare fram till år 2100. Det beror på att det blir mer sötvatten på högre breddgrader, vilket i sin tur beror på mer nederbörd och smältande isar. Den ökade mängden sötvatten påverkar ”pumpen” i golfströmssystemet, som fungerar på grund av att saltvatten sjunker snabbare än sötvatten. – Flera studier har läst av kalla fläcken på det sättet och visat att systemet kan ha försvagats med ungefär 15 procent sedan mitten på 1900-talet, säger Léon Chafik. Man ska dock vara försiktig med att dra några slutsatser om kalla fläcken, menar han. – Det är omdiskuterat. Samma kalla fläck kan skapas på mer än ett sätt. Om du har ett rum som blir kallt, så kan det bero på att rören är trasiga, men också på att någon har öppnat ett fönster. Experten: Blir inte som ”Day after tomorrow” Men samtidigt som det är oklart om den kalla fläcken mest styrs av havsströmmar så finns det fortfarande fog för oro om att golfströmssystemet försvagas. Om golfströmssystemet skulle kollapsa helt ser många framför sig ett scenario som i undergångsfilmen ”Day after tomorrow”, där en istid uppstår på norra halvklotet. Men så snabb eller extrem kommer inte avkylningen att bli, säger Chafik. – Dessutom har vi en global uppvärmning, så det kan bli en dragkamp mellan den och avkylningen. I framtiden är det inte säkert vilken av dem som vinner, det kan göra att vi kanske inte ens märker avkylningen i Skandinavien.", "link": "https://www.tv4.se/artikel/6kKS5yhc7nSAoiD66H7agV/ny-forskning-kalla-flaecken-kan-tyda-pa-svagare-golfstroem", "date_display": "2026-06-20", "date_iso": "2026-06-20T05:03:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Golfströmmen", "/golfstrommen", "/klimat", "/klimatkrisen", "/vadret"]}, {"id": 151, "title": "Fortune teller in Report - frivolous by SVT", "summary": "Firstly, I wonder if this is news? writes Annica Swanson.", "title_original": "Spågumma i Rapport – oseriöst av SVT", "summary_original": "För det första undrar jag om det här är nyheter? skriver Annica Swanson.", "link": "https://www.dagen.se/debatt/spagumma-i-rapport-oserioest-av-svt/10399280", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Dan Svanell confirmed himself as a 68-year-old: \"I felt more whole as a Christian afterwards\"", "summary": "Now turning 70 - and grateful to be healthy after an autumn of health problems", "title_original": "Dan Svanell konfirmerade sig som 68-åring: ”Jag kände mig mer hel som kristen efteråt”", "summary_original": "Fyller nu 70 år – och är tacksam för att vara frisk efter en höst av hälsoproblem", "link": "https://www.dagen.se/familj/dan-svanell-konfirmerade-sig-som-68-aring-jag-kaende-mig-mer-hel-som-kristen-efterat/10397900", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "My husband has become radicalized in his views - what should I do?", "summary": "\"When he makes his posts, it often spills over to me,\" writes the wife in a letter to Christina Halldorf.", "title_original": "Min man har radikaliserats i sina åsikter – vad ska jag göra?", "summary_original": "”När han gör sina inlägg spiller det ofta över på mig”, skriver hustrun i ett brev till Christina Halldorf.", "link": "https://www.dagen.se/relationer/min-man-har-radikaliserats-i-sina-asikter-vad-ska-jag-goera/10393167", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "New series of frauds in the name of the Church of Sweden", "summary": "Rolf, 85, was greeted by a fake \"flower delivery\" • The priest: \"This has a really sour taste\"", "title_original": "Ny bedrägerihärva i Svenska kyrkans namn", "summary_original": "Rolf, 85, fick påhälsning av falskt ”blomsterbud” • Prästen: ”Riktigt sur smak på det här”", "link": "https://www.dagen.se/nyheter/ny-bedraegerihaerva-i-svenska-kyrkans-namn/10397361", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "Julia Forsberg:\nJohannes chose a life of exclusion because the call was so strong", "summary": "Even we can doubt whether we really have the strength, but God gives us the strength we need.", "title_original": "Julia Forsberg:\nJohannes valde ett liv i utanförskap för att kallelsen var så stark", "summary_original": "Även vi kan tvivla på om vi verkligen orkar, men Gud ger oss den kraft vi behöver.", "link": "https://www.dagen.se/livsstil/julia-forsberg-johannes-valde-ett-liv-i-utanfoerskap-foer-att-kallelsen-var-sa-stark/10398916", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Transcending ethnic boundaries became the key to mission in Japan", "summary": "Brazilian missionaries in Japan share their experiences at Torp", "title_original": "Att överskrida etniska gränser blev nyckeln till mission i Japan", "summary_original": "Brasilianska missionärer i Japan delar sina erfarenheter på Torp", "link": "https://www.dagen.se/nyheter/att-oeverskrida-etniska-graenser-blev-nyckeln-till-mission-i-japan/10400974", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "This is what confronts a Catholic on New Home Week", "summary": "Erik Helmerson: My second impression – God's presence.", "title_original": "Detta är vad som möter en katolik på Nyhemsveckan", "summary_original": "Erik Helmerson: Mitt andra intryck – Gudsnärvaron.", "link": "https://www.dagen.se/ledare/detta-aer-vad-som-moeter-en-katolik-pa-nyhemsveckan/10402410", "date_display": "2026-06-20", "date_iso": "2026-06-20T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Denmark sends 400 \"ghost soldiers\" to Ukraine", "summary": "With camouflaged uniforms, Ukrainian soldiers can stay hidden in the terrain. But modern weapons with thermal sights can detect heat sources and sort out the soldiers from their surroundings - rendering the camouflage clothing useless and putting the soldiers in mortal danger. Now a Danish company may have found a solution to the problem, writes Danish TV 2. Scandic Defense manufactures something they call \"ghost soldiers\", with built-in heat, which will make Russia waste its firepower - on dummies. The artificial soldiers consist of padding and heating panels, and form the silhouette of a soldier wearing a protective vest. The heating panels maintain a temperature of 37 degrees and look exactly like a real person in thermal sights. Unexpected brains behind But the dolls serve a greater purpose than just making the Russians waste ammunition and drones. The idea is that they will act as diversionary maneuvers while the Ukrainian soldiers get to safety. In this way, they can conceivably save lives. - They can help to mislead the enemy into thinking that there is a major offensive going on somewhere, where they can then mobilize their forces elsewhere, says Martin Thisted Larsen, partner in Scandic Defence, to TV 2. The idea for the \"ghost soldiers\" came from an unexpected place, he says. - We got a call from an electrician from Jutland who said he had a really good idea about how to fool drones, says Martin Thisted Larsen. The electrician sent over a cardboard figure to demonstrate the concept and a prototype was produced. Before long, the company entered into an agreement with the Ukrainian intelligence service, which could test the dolls on the battlefield.  Expected to be bombed to pieces within days The results of the test gave more flavor. Now the first 400 \"ghost soldiers\" are on their way to the front line, but more will be required. Life expectancy is short. - They expect that everyone will be bombed by drones within two to three days, says Martin Thisted Larsen. Ukraine has therefore ordered tens of thousands of dummies, at a cost of 1,000 Danish kroner", "title_original": "Danmark skickar 400 ”spöksoldater” till Ukraina", "summary_original": "Med kamouflerade uniformer kan ukrainska soldater hålla sig gömda i terrängen. Men moderna vapen med termiska sikten kan upptäcka värmekällor och sortera ut soldaterna från omgivningen – något som gör de kamouflerade kläderna värdelösa och sätter soldaterna i livsfara. Nu kan ett danskt företag ha hittat en lösning på problemet, skriver danska TV 2. Scandic Defense tillverkar något de benämner som ”spöksoldater”, med inbyggd värme, som ska få Ryssland att slösa sin eldkraft – på dockor. De konstgjorda soldaterna består av vaddering och värmepaneler, och bildar silhuetten av en soldat med skyddsväst. Värmepanelerna håller en temperatur på 37 grader och ser i termiska sikten precis ut som en riktig människa. Oväntade hjärnan bakom Men dockorna fyller ett större syfte än att bara få ryssarna att slösa ammunition och drönare. Tanken är att de ska fungera som avledningsmanöver medan de ukrainska soldaterna sätter sig i säkerhet. På så sätt kan de tänkas rädda liv. – De kan bidra till att vilseleda fienden att tro att det pågår en stor offensiv någonstans, där man sedan kan mobilisera sina styrkor någon annanstans, säger Martin Thisted Larsen, partner i Scandic Defence, till TV 2. Idén till ”spöksoldaterna” kom från ett oväntat håll berättar han. – Vi blev uppringda av en elektriker från Jylland som sa att han hade en riktigt bra idé om hur man lurar drönare, säger Martin Thisted Larsen. Elektrikern skickade över en pappfigur för att demonstrera konceptet varpå en prototyp togs fram. Inom kort ingick företaget ett avtal med den ukrainska underrättelsetjänsten som kunde testa dockorna på slagfältet.  Väntas bombas i bitar inom dagar Resultatet i testet gav mersmak. Nu är de första 400 ”spöksoldaterna” på väg till frontlinjen, men fler kommer att krävas. Livslängden är nämligen kort. – De förväntar sig att alla kommer att bombas av drönare inom två till tre dagar, säger Martin Thisted Larsen. Ukraina har därför beställt tiotusentals attrapper, till en kostnad av 1 000 danska kronor styck. ”Spöksoldaterna” tillverkas på en hemlig plats. Men nu har Ukrainas underrättelsetjänst bett företaget att göra så mycket väsen de kan om dockorna, för att så tvivel hos fienden och göra dem passiva. Det är inte första gången illusioner används för att lura fienden i krig. Redan i andra världskriget konstruerades konstgjorda stridsvagnar som, på samma sätt som idag, var avsedda att få fienden att skjuta förgäves eller placera ut sina styrkor felaktigt, skriver TV 2.", "link": "https://www.tv4.se/artikel/4i0Mb1aWurEw2O2svrgGzW/danmark-skickar-400-spoeksoldater-till-ukraina", "date_display": "2026-06-19", "date_iso": "2026-06-19T20:43:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/danmark", "/ukrainakonflikten", "/ryssland", "/militar"]}, {"id": 159, "title": "Train accident in Great Britain - driver killed", "summary": "A total of 89 people have been injured, according to the rescue service. Eleven of them are said to be very seriously injured, 22 seriously injured and 56 with minor injuries. All the seriously injured have been taken to hospital. One person has died in the accident, according to the British Transport Police. The RMT union states that the deceased is one of the train's drivers. The accident occurred at 17.15 local time. An extensive rescue operation was launched with over 20 ambulances, special units and six ambulance helicopters, according to Sky News. \"Like a bomb explosion\" According to a person on board the train, the crash should not have been preceded by any advance warning, braking or warning signal.  - The front carriage collided with the front of another and when I got up I saw all the chairs everywhere and it felt like I had been part of a bomb explosion, the passenger told the BBC.  Another passenger says passengers were thrown from their seats.  - There was a lot of blood. Many had facial injuries, says the person.  Details of technical fault According to Sky News, the front train, from Nottingham to London, has been stopped after problems with the automatic warning system. The system is there to warn drivers about stop or red signals. While the driver was trying to deal with the fault, a train from Corby behind ran into the stationary train. - The images we see are simply shocking. That the train has driven in with such force that it has derailed is really worrying, says British travel expert Simon Calder to Sky News. \"Deeply worrying\" British Prime Minister Keir Starmer describes the accident as \"deeply worrying\". \"First and foremost, my thoughts go out to the family of the person who has unfortunately died, and to those who have been seriously injured,\" he writes on X. At the same time, he thanks the emergency services for the quick response.", "title_original": "Tågolycka i Storbritannien – lokförare omkom", "summary_original": "Totalt 89 personer har skadats, enligt räddningstjänsten. Elva av dem uppges vara mycket allvarligt skadade, 22 allvarligt skadade och 56 har lindrigare skador. Samtliga svårt skadade har förts till sjukhus. En person har dött i olyckan, enligt den brittiska transportpolisen. Fackförbundet RMT uppger att den omkomne är en av tågens förare. Olyckan inträffade klockan 17.15 lokal tid. En omfattande räddningsinsats sattes in med över 20 ambulanser, specialenheter och sex ambulanshelikoptrar, enligt Sky News. ”Som en bombexplosion” Enligt en person ombord på tåget ska kraschen inte ha föregåtts av någon förvarning, inbromsning eller varningssignal.  – Den främre vagnen kolliderade med framdelen av en annan och när jag reste mig upp såg jag alla stolar överallt och det kändes som om jag hade varit med om en bombexplosion, säger passageraren till BBC.  En annan passagerare berättar att resenärer flög av sina säten.  – Det var mycket blod. Många hade skador i ansiktet, säger personen.  Uppgifter om tekniskt fel Enligt Sky News ska det främre tåget, från Nottingham till London, ha blivit stående efter problem med det automatiska varningssystemet. Systemet är till för att varna förare om stopp- eller röd signal. Medan lokföraren försökte hantera felet körde ett bakomvarande tåg från Corby in i det stillastående tåget. – Bilderna vi ser är helt enkelt chockerande. Att tåget har kört in med sådan kraft att det har spårat ur är verkligen oroande, säger den brittiska reseexperten Simon Calder till Sky News. ”Djupt oroende” Storbritanniens premiärminister Keir Starmer beskriver olyckan som ”djupt oroande”. ”Först och främst går mina tankar till familjen till den person som tyvärr har omkommit, och till dem som har skadats allvarligt”, skriver han på X. Han tackar samtidigt räddningstjänsten för den snabba insatsen.", "link": "https://www.tv4.se/artikel/T7a3v4pqtEo5KMy8t2nKA/tagkrasch-i-storbritannien-rapporter-om-allvarliga-skador", "date_display": "2026-06-19", "date_iso": "2026-06-19T18:40:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/olycka", "/tagolycka", "/storbritannien"]}, {"id": 160, "title": "Politicians urged England to keep winning - to avoid violence", "summary": "An MP for right-wing populist Reform UK is under fire after linking England's World Cup success to the prevalence of domestic violence. Sarah Pochin, MP for Runcorn and Helsby, said in a video on social media that England's victory in the first World Cup match was important in reducing the risk of violence. - England won yesterday, and thank God for that. Because when England lose their matches, domestic violence soars. So guys – keep winning,” Pochin said in the clip. The statement quickly provoked strong reactions from organizations that work to support abused women and children. \"Irresponsible\" Farah Nazeer, director of the organization Women's Aid, says that the statement risks shifting responsibility from the perpetrator. - Football does not cause violence in intimate relationships. It is a choice made by the perpetrator, time and time again, regardless of whether a team wins or loses a match, Nazeer said in a statement according to the Independent.  According to Nazeer, research shows that reports of violence can increase during major championships, but that this happens both during wins and losses. - It is irresponsible to claim that a team's success is the reason for whether a man commits domestic violence or not, she says. Responding to criticism When Pochin was later interviewed by ITV News, she dismissed the criticism and said her words had been misinterpreted. - I place no responsibility on the English national team. That is taking it way too far, she says. She says her intention was to urge those around her to pay extra attention. \"The bottom line is that if they lose, friends and family members have to keep an eye on the women they know are experiencing domestic violence,\" says Pochin.", "title_original": "Politiker uppmanade England att fortsätta vinna – för att undvika våld", "summary_original": "En parlamentsledamot för högerpopulistiska Reform UK får skarp kritik efter att ha kopplat Englands framgångar i fotbolls‑VM till förekomsten av våld i hemmet. Sarah Pochin, parlamentsledamot för Runcorn and Helsby, sa i ett videoklipp på sociala medier att Englands seger i den första VM‑matchen var viktig för att minska risken för våld. – England vann i går, och tack och lov för det. För när England förlorar sina matcher skjuter våld i hemmet i höjden. Så killar – fortsätt vinna, sa Pochin i klippet. Uttalandet väckte snabbt starka reaktioner från organisationer som arbetar med att stötta våldsutsatta kvinnor och barn. ”Oansvarigt” Farah Nazeer, chef för organisationen Women’s Aid, säger att uttalandet riskerar att flytta ansvaret från förövaren. – Fotboll orsakar inte våld i nära relationer. Det är ett val som görs av förövaren, gång på gång, oavsett om ett lag vinner eller förlorar en match, säger Nazeer i ett uttalande enligt Independent.  Enligt Nazeer visar forskning att anmälningar om våld kan öka under stora mästerskap, men att det sker både vid vinster och förluster. – Det är oansvarigt att påstå att ett lags framgång är orsaken till huruvida en man begår våld i hemmet eller inte, säger hon. Svarar på kritiken  När Pochin senare intervjuades av ITV News avvisade hon kritiken och menade att hennes ord misstolkats. – Jag lägger inget ansvar på det engelska landslaget. Det är att dra det alldeles för långt, säger hon. Hon säger att hennes avsikt var att uppmana omgivningen att vara extra uppmärksam. – Poängen är att om de förlorar, måste vänner och familjemedlemmar hålla ett öga på de kvinnor som de vet utsätts för våld i hemmet, säger Pochin.", "link": "https://www.tv4.se/artikel/1O8M1xV3xEjDczgfJm9lGE/fortsaett-vinna-politiker-kritiseras-foer-uttalande-om-vald-mot-kvinnor", "date_display": "2026-06-19", "date_iso": "2026-06-19T17:46:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/england", "/sportjournalistik", "/mansvaldmotkvinnor", "/storbritannien"]}, {"id": 161, "title": "Ismaël Koné's first words after the nasty broken leg", "summary": "Sending greetings from the hospital", "title_original": "Ismaël Konés första ord efter otäcka benbrottet", "summary_original": "Skickar hälsning från sjukhuset", "link": "https://www.tv4.se/artikel/5vOt6XriZEKCQezAh5PNL2/ismael-kone-foersta-ord-efter-otaecka-benbrottet", "date_display": "2026-06-19", "date_iso": "2026-06-19T16:48:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 162, "title": "The sun shone over midsummer at Torp", "summary": "Gabriella Enblom celebrates her 28th midsummer at EFK's midsummer conference: 'The children used to say that it won't be summer if we're not at Torp.'", "title_original": "Solen sken över midsommar på Torp", "summary_original": "Gabriella Enblom gör sin 28:e midsommar på EFK:s midsommarkonferens: 'Barnen brukade säga att det blir ingen sommar om vi inte är på Torp.'", "link": "https://www.dagen.se/nyheter/solen-sken-oever-midsommar-pa-torp/10404917", "date_display": "2026-06-19", "date_iso": "2026-06-19T16:00:11+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Fire in apartment building: \"Will last all evening\"", "summary": "The alarm about the fire came at 2:20 p.m. SOS alarm then stated that black smoke was billowing from the house and that several ambulances and units from the rescue service were called to the scene. The fire is said to have started on a balcony and then spread to the roof, in a building consisting of two linked houses. - There are still a lot of resources on site. Pressurized smoke from the entire eaves, flames have gone through the roof, the emergency services are trying to check the joists. If possible, they will let the attic and the roof burn off, said Sören Gustavsson, team leader at SOS alarm. - There is a risk of spreading downwards. They need a crane truck or something like that to push the roof. It's quite a big event, he added. A suspect for gross public negligence The police have interviewed people at the scene who saw the fire, to find out where it started and the circumstances surrounding it. - We have started a preliminary investigation into gross public negligence. And that means that we don't have any signs at the moment that indicate that this would be planned. But that someone may have been careless with something that has caused this fire. It was not the person's intention, but something was still handled in a bad way, says police spokesperson Daniel Wikdahl. The fire is said to have started on a balcony. Have you been in contact with the owner of the balcony? - There is a balcony where there was an early fire. We are in contact with that person, yes, says Daniel Wikdahl. Initially, there were no suspects. But at 19.46 in the evening, the police state that a person has been served with suspicion of crime. The police cannot go into how the fire may have started with reference to preliminary investigation secrecy.  The people who are registered in the house will not be able to return to their apartments before a technical examination can be carried out. \"No one has been home\" About ten ambulances were called to the scene. However, no one should have been in need of medical care and at 4:50 p.m. seven had", "title_original": "Brand i flerfamiljshus: ”Kommer pågå hela kvällen”", "summary_original": "Larmet om branden kom vid 14.20-tiden. SOS alarm uppgav då att det vällde ut svart rök från huset och att flera ambulanser och enheter från räddningstjänsten larmats till platsen. Branden ska ha börjat på en balkong och sedan spridit sig upp i taket, i en byggnad bestående av två sammanlänkade huskroppar. – Det är fortsatt väldigt mycket resurser på plats. Tryckrök från hela takfoten, lågor har gått igenom taket, räddningstjänsten försöker kontrollera bjälklag. Om möjligt kommer man att låta vinden och taket brinna av, sade Sören Gustavsson, teamledare på SOS alarm. – Det är risk för spridning neråt. De behöver någon kranbil eller dylikt för att driva i taket. Det är en rätt stor händelse, tillade han. En misstänkt för grov allmänfarlig vårdslöshet Polisen har hört personer på platsen som sett branden, för att reda ut var någonstans den började och omständigheterna kring den. – Vi har inlett en förundersökning om grov allmänfarlig vårdslöshet. Och det betyder ju att vi inte har några tecken i nuläget som tyder på att det här skulle vara anlagt. Men att någon då kan ha handskats vårdslöst med någonting som har orsakat den här branden. Det har inte varit personens avsikt, men man har ändå hanterat någonting på ett dåligt sätt, säger polisens presstalesperson Daniel Wikdahl. Branden ska ha börjat på en balkong. Har ni varit i kontakt med innehavaren av balkongen? – Det förekommer en balkong där det brann tidigt. Den personen är vi i kontakt med, ja, säger Daniel Wikdahl. Initialt fanns ingen misstänkt. Men vid 19.46 på kvällen uppger polisen att en person delgivits misstanke om brott. Polisen kan inte gå in på hur branden kan ha startat med hänvisning till förundersökningssekretess.  De personer som är skrivna i huset kommer inte att kunna återvända till sina lägenheter innan en teknisk undersökning kunnat genomföras. ”Har inte varit någon hemma” Ett tiotal ambulanser larmades till platsen. Ingen person ska dock ha varit i behov av sjukvård och vid 16.50-tiden hade sjukvårdsinsatsen avslutats. – Vi har inte haft något skadeutfall, vilket är fantastiskt utifrån hur branden ser ut. Det har inte varit någon hemma helt enkelt. Vi är väldigt glada för det, säger Johan Wallin sjukvårdsledare i region Stockholm. Räddningstjänsten har också sökt igenom huset utan att några personer anträffats. Totalt ska 40 personer vara skrivna i huskropparna som brunnit. Katt fick syrgas En katt fick däremot hjälp av sjukvården. – Det kom en boende med en katt här ifrån i närheten till oss så vi hjälpte den. Den fick lite syrgas av mina kollegor. Nu är den avtransporterad till djursjukhus, säger Johan Wallin. Prognosen för själva släckningsarbetet är oklar. – Det har de ingen i nuläget. Initialt, eller vid kvart över tre, så var det minst tre timmar. Men jag misstänker att det här kommer att pågå hela kvällen nästan, sade Sören Gustavsson, teamledare på SOS alarm tidigare på fredagen. Ingen av de intilliggande byggnaderna har behövt evakueras. Branden ska dock ha orsakat omfattande skador på de aktuella husen, men exakt hur många lägenheter som påverkats är ännu inte känt.", "link": "https://www.tv4.se/artikel/2EvFrg1kJELjkSSYB4YfKL/fullt-utvecklad-brand-i-flerfamiljshus-i-maersta", "date_display": "2026-06-19", "date_iso": "2026-06-19T13:49:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brand", "/marsta", "/raddningstjansten", "/raddningsinsats", "/ambulans"]}, {"id": 164, "title": "After the victory: \"A bitter power struggle may begin shortly\"", "summary": "Labor politician Andy Burnham has won the by-election in Makerfield in north-west England and thus takes a seat in the British Parliament. The result means that Burnham now has the opportunity to challenge his party mate and Prime Minister Keir Starmer for the leadership of Labour. - Everyone knows that politics does not work. Everyone feels that the country is not where it should be. Tonight can, just can, be a turning point, says Andy Burnham after the victory. 'Big opportunity' Burnham is popular within Labor and is often singled out as the most likely successor to Keir Starmer as party leader. - I think Andy Burnham would like to be the one to replace him (Keir Starmer). I don't know if everyone likes him. I think there is a big opportunity, he says. To be able to run for the position of party leader, a seat in parliament is required. It got Burnham through the night's election results, which were described as a landslide victory. Now the way is thus open for him to be able to challenge Keir Starmer, who for a long time has been under pressure and had low opinion figures. - He has a very strong starting position right now. First he needed to win this seat in Parliament, the voters of Makerfield have now ensured that he has. Moreover, with a large majority, says TV4's foreign reporter Tomas Kvarnkullen.  Will take the fight In order to be able to challenge for the party leader's post, support from the party's members in parliament is also required, something that, according to Kvarnkullen, suggests that Burnham already has. What happens now? - There is a lot of evidence that Keir Starmer will be offered an opportunity to step aside, possibly that this type of conversation will begin already now during the weekend, he says. At the same time, the country's incumbent Prime Minister Keir Starmer has made it clear that he does not intend to step aside voluntarily. - Then most things point to the fact that this could end in a bitter power struggle that could begin shortly, says Kvarnkullen.", "title_original": "Efter segern: ”En bitter maktstrid kan inledas inom kort”", "summary_original": "Labourpolitikern Andy Burnham har vunnit fyllnadsvalet i Makerfield i nordvästra England och tar därmed plats i det brittiska parlamentet. Resultatet innebär att Burnham nu får möjlighet att utmana sin partikamrat och premiärminister Keir Starmer om ledarskapet i Labour. – Alla vet att politiken inte fungerar. Alla känner att landet inte är där det borde vara. I kväll kan, bara kan, bli en vändpunkt, säger Andy Burnham efter segern. ”Stor möjlighet” Burnham är populär inom Labour och pekas ofta ut som den mest sannolika efterträdaren till Keir Starmer som partiledare. – Jag tror att Andy Burnham skulle vilja bli den som ersätter honom (Keir Starmer). Om han faller alla i smaken vet jag inte. Jag tror att det finns en stor möjlighet, säger han. För att kunna kandidera till partiledarposten krävs en plats i parlamentet. Den fick Burnham genom nattens valresultat, som beskrivs som en övertygande seger. Nu är vägen därmed öppen för att han ska kunna utmana Keir Starmer, som under en längre tid varit pressad och haft låga opinionssiffror. – Han har ett väldigt starkt utgångsläge just nu. Först behövde han vinna den här platsen i parlamentet, det har väljarna i Makerfield nu sett till att han har gjort. Dessutom med en stor majoritet, säger TV4:s utrikesreporter Tomas Kvarnkullen.  Kommer ta fajten För att kunna utmana om partiledarposten krävs också stöd från partiets ledamöter i parlamentet, något som det enligt Kvarnkullen tyder på att Burnham redan har. Vad händer nu? – Mycket talar för att Keir Starmer kommer att erbjudas en möjlighet att kliva åt sidan, möjligen att den typen av samtal kommer att inledas redan nu under helgen, säger han. Landets sittande premiärminister Keir Starmer har samtidigt gjort klart att han inte tänker kliva åt sidan frivilligt. – Då pekar det mesta på att det här kan sluta med en bitter maktstrid som kan komma att inledas inom kort, säger Kvarnkullen.", "link": "https://www.tv4.se/artikel/40dJw2sTRK1WyRAOudUpVb/efter-segern-en-bitter-maktstrid-kan-inledas-inom-kort", "date_display": "2026-06-19", "date_iso": "2026-06-19T10:26:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/utrikes", "/storbritannien", "/keir-starmer", "/politiker", "/brittisk-politik"]}, {"id": 165, "title": "Here are the best and worst vanilla ice creams: \"55 percent air\"", "summary": "The test is based on a blind test with students and staff at the Restaurant and Hotel College in Grythyttan, Örebro University, where taste, texture and appearance were assessed. In addition to the taste panel, Testfakta has reviewed the ingredient lists and, among other things, looked at the amount of air in the ice cream, the presence of additives and which source is used for the vanilla flavor. - We have assessed consistency, color and taste. That together, the sensory, is 75 percent of our grades. 25 percent is whether it is real vanilla or aromas and how many additives there are, says Klaus Hahn. Losers in the test Lidl/Gelatelli Vanilla (4.8) and GB Glace Big pack Ice cream with vanilla (4.0) ended up at the bottom. - There are additives here and no real vanilla raw material. They are industrially built. They are cheap, but the other part is how much air there is in the ice cream, says Klaus Hahn. According to Klaus Hahn, the differences are not only in taste, but also in how much air is whipped in. In the test, the air content varied from 12 percent in Häagen-Dazs to just over 55 percent in GB Glace Big pack. Even Gelatelli Vanilla contained almost 55 percent air. - Air must be present for the consistency, but it is between 12 percent and 55 percent. So if you buy a Big Pack, you buy more air than ice cream, says Klaus Hahn. Best ice cream Test winners were Järna ice cream Vanilj and Alvesta Ice cream Old fashioned vanilla, both with a rating of 7.7. Sia Gräddglass vanilla was third with 7.1. - Jarna ice cream wins above all because it is free from aromas, free from additives, has real vanilla ingredients and a very high taste rating, says Klaus Hahn. \"Vanilla\" is not always vanilla Test facts also point out that vanilla flavor can come from different sources - and that some products may therefore not be called vanilla ice cream. According to Testfakta, products with a clear vanilla source, such as vanilla bean, vanilla powder or vanilla extract, and shorter ingredient lists were rewarded. - Ice cream with vanilla flavor means it does not have vanilla. If you want to take something with you, be more careful when you he", "title_original": "Här är bästa och sämsta vaniljglassen: ”55 procent luft”", "summary_original": "Testet bygger på ett blindtest med elever och personal vid Restaurang- och hotellhögskolan i Grythyttan, Örebro universitet, där smak, konsistens och utseende bedömdes. Utöver smakpanelen har Testfakta granskat ingredienslistorna och bland annat tittat på mängden luft i glassen, förekomst av tillsatser och vilken källa som används för vaniljsmaken. – Vi har bedömt konsistens, färg och smak. Det tillsammans, det sensoriska, är 75 procent av våra betyg. 25 procent är om det är äkta vanilj eller aromer och hur många tillsatser det finns, säger Klaus Hahn. Förlorare i testet Längst ned hamnade Lidl/Gelatelli Vanilj (4,8) och GB Glace Big pack Glass med vanilj (4,0). – Här finns tillsatser och ingen äkta vaniljråvara. De är industriellt uppbyggda. De är billiga, men den andra delen är hur mycket luft det finns i glassen, säger Klaus Hahn. Enligt Klaus Hahn finns skillnaderna inte bara i smak, utan också i hur mycket luft som vispats in. I testet varierade luftandelen från 12 procent i Häagen-Dazs till drygt 55 procent i GB Glace Big pack. Även Gelatelli Vanilj innehöll nästan 55 procent luft. – Luft måste finnas för konsistensen, men det är mellan 12 procent och 55 procent. Så om du köper en Big Pack så köper du mer luft än glass, säger Klaus Hahn. Bästa glassen Testvinnare blev Järna glass Vanilj och Alvesta Glass Gammeldags vanilj, båda med betyget 7,7. Sia Gräddglass vanilj blev trea med 7,1. – Järna glass vinner framför allt för att den är fri från aromer, fri från tillsatser, har äkta vaniljråvara och ett väldigt högt smakbetyg, säger Klaus Hahn. ”Vanilj” är inte alltid vanilj Testfakta pekar också på att vaniljsmak kan komma från olika källor – och att vissa produkter därför inte får kallas vaniljglass. Enligt Testfakta premierades produkter med tydlig vaniljkälla, som vaniljstång, vaniljpulver eller vaniljextrakt, samt kortare ingredienslistor. – Glass med vaniljsmak betyder att den inte har vanilj. Om man vill ta med sig någonting så var mer uppmärksam när ni handlar. Titta på innehållsförteckningarna, säger Klaus Hahn.", "link": "https://www.tv4.se/artikel/1MQgHGSlDsq9HyV42GtRYm/baesta-och-saemsta-vaniljglassen-55-procent-luft", "date_display": "2026-06-19", "date_iso": "2026-06-19T10:23:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/testfakta", "/glass"]}, {"id": 166, "title": "Netanyahu will be allowed to change his election message - the US's Iran deal is seen as a betrayal", "summary": "Today's Israel correspondent Arne Lapidus: To his horror, Trump may have reached a worse agreement with Iran than the one reached by Obama.", "title_original": "Netanyahu lär få ändra valbudskap – USA:s Iranavtal ses som ett svek", "summary_original": "Dagens Israelkorrespondent Arne Lapidus: Trump kan till sin fasa ha nått en sämre överenskommelse med Iran än den som Obama nådde.", "link": "https://www.dagen.se/nyheter/netanyahu-laer-fa-aendra-valbudskap-usas-iranavtal-ses-som-ett-svek/10403814", "date_display": "2026-06-19", "date_iso": "2026-06-19T09:00:15+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 167, "title": "The summer dangers for the dog to watch out for: \"Can be life-threatening\"", "summary": "When more people take their dogs out into the woods and fields around midsummer, the risk of them encountering animals and environments that may require quick help also increases. Veterinarian Marie Jury goes through what dog owners should pay extra attention to. Especially in midsummer when there are extra dangers around the dog.  - Many people don't clean up after the barbecue, things like barbecue skewers and corn on the cob. The inside of the corn on the cob is something that is not digested, but gets stuck in the stomach and intestines. It can be an expensive emergency operation if you are unlucky.  Keep an eye out for snakes One of the risks in nature is vipers. Vipers are found out in the forest and on the ground, especially on hot days. Bites can make the dog sick and the advice is to seek a veterinarian immediately. Do not try to treat the bite yourself. - It can be life-threatening for dogs, and especially for smaller dogs. It obviously depends on the amount of poison. They must be kept quiet. A small dog can be carried with advantage, says Marie Jury. It can be good to know which vets are open, especially on a day like Midsummer Eve. Sometimes there are so-called dry bites, but you should not assume that it is one.  - Most often it is the face or nose that you get bitten by, by a viper. It usually swells up quite quickly. At the animal hospital, they provide supportive treatment in the form of drips and pain relief. It may also involve giving a snake antiserum to try to stabilize the situation.  It can be life-threatening, warns Marie Jury. - The most dangerous is if you are bitten in the paw, in the leg, because then the muscles help to spread the poison. That is why you want to try to keep them quiet. But it is dangerous wherever it has gone, so you should see the vet.  Keep an eye on bites Wasps often do not cause serious reactions, but if the animal becomes generally affected or swells, a veterinarian should be contacted. Ticks are found both in the north and south, also taiga ticks in Norrland, which can carry TBE. Tick ​​bites can irritate the skin. Knots can also become a problem, especially in northern Sweden. H", "title_original": "Sommarfarorna för hunden att se upp för: ”Kan bli livshotande”", "summary_original": "När fler tar med hunden ut i skog och mark kring midsommar ökar också risken att den stöter på djur och miljöer som kan kräva snabb hjälp. Veterinären Marie Jury går igenom vad hundägare bör vara extra uppmärksamma på. Särskilt på midsommar då det är extra mycket faror runt hunden.  – Många städar inte upp efter grillfesten, saker som grillspett och majskolvar. Insidan på majskolven är nånting som inte smälts ner, utan fastnar i mage och tarm. Det kan handla om en dyr akutoperation om man har otur.  Håll koll efter ormar En av riskerna i naturen är huggorm. Huggormar finns ute i skog och mark, särskilt varma dagar. Bett kan göra hunden sjuk och rådet är att söka veterinär direkt. Försök inte behandla bettet själv. –Det kan bli livshotande för hund, och speciellt för mindre hundar. Det beror så klart på mängden gift. Man ska hålla dem i stillhet. En liten hund kan man med fördel bära, säger Marie Jury. Det kan vara bra att känna till vilka veterinärer som har öppet, särskilt en dag som midsommarafton. Ibland förekommer så kallade torrbett, men man ska inte utgå från att det är ett sådant.  – Oftast är det ansikte eller nos som man blir biten av, av en huggorm. Det brukar svullna upp ganska snabbt. På djursjukhuset ger man understödjande behandling i form av dropp och smärtlindring. Det kan också handla om att man får ge ett ormantiserum för att försöka stabilisera situationen.  Det kan bli livshotande, varnar Marie Jury. – Farligast är om du blir biten i tassen, i benet för då hjälper muskulaturen till att sprida giftet. Det är därför man vill försöka hålla dem i stillhet. Men det är farligt vart det än har tagit, så man ska söka sig till veterinären.  Håll koll på bett Getingar ger
