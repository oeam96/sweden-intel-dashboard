d fungerat. Kvinnan åtalades för ringa misshandel och ofredande mot totalt tio barn. I dag föll domen. Göteborgs tingsrätt menar att det är bevisat att läraren tejpat elevernas munnar, men att det inte orsakat någon smärta eller kränkt deras frid på ett kännbart sätt.  ”Åklagaren har inte heller lyckats visa att läraren har haft uppsåt till gärningarna”, skriver domstolen. Kvinnan friades därför från åtalet. Rätten var dock oenig. Domaren och en nämndeman ville döma läraren för sju fall av ofredande och menade att hennes agerade varit hänsynslöst.", "link": "https://www.tv4.se/artikel/6RhNoPvh3ckOVg4BuW6e4p/laerare-tejpade-foer-elevers-munnar-frias", "date_display": "2026-04-14", "date_iso": "2026-04-14T09:01:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/goteborg", "/brott", "/skola", "/utbildning"]}, {"id": 156, "title": "Here are the educations with the worst chance for a job", "summary": "One in three educations at colleges and universities leads to fierce competition for jobs. According to Saco's chairman Sofia Rydgren Stale, it can be more difficult to establish yourself on the labor market for those who choose education in, for example, architecture (construction and interior design), social science, communication and professions in the museum and cultural environment area. - These are broad educations and it can take longer before you establish yourself on the labor market, she tells TV4 Nyheterna. \"Perhaps need to move\" The last day to register for colleges and universities this fall is Wednesday, April 15. If you are looking for an education where competition for jobs is high, there is advice that can increase your opportunities. Among other things, it can be important to arrange an internship during the study period or work in the summer to strengthen the chances of a job after graduation, according to Sofia Rydgren Stale. - Prepare for the fact that you may need to move if you choose an educational field where the competition for jobs is higher, she says. According to Saco's chairman, education should be chosen with both heart and mind. Heart in the form of choosing a profession or an education you are interested in and have an aptitude for. - You have to work your entire professional life, so it's important that it's something you enjoy - then it's easier to be good at your job. - But it is also important to choose with your brain: to make an informed choice where you have looked up how the labor market will look in the future and whether it will be easy or difficult to get a job. Higher education always a good investment Despite high competition within certain professional groups, the vast majority of educations at colleges and universities lead to jobs. According to Sofia Rydgren Stale, a higher education is always a good investment, because graduates have the highest establishment in the labor market. - If we look at it as a whole, between 80, 85 and 90 percent of the graduates are in work and established in the labor market one year after graduation. - Even in areas where there is higher competition", "title_original": "Här är utbildningarna med sämst chans till jobb", "summary_original": "En av tre utbildningar vid högskolor och universitet leder till hård konkurrens om jobben. Enligt Sacos ordförande Sofia Rydgren Stale kan det vara svårare att etablera sig på arbetsmarknaden för den som väljer utbildningar inom exempelvis arkitektur (bygg och inredning), samhällsvetenskap, kommunikation samt yrken inom musei- och kulturmiljöområdet. – Det är breda utbildningar och det kan ta längre tid innan man etablerar sig på arbetsmarknaden, säger hon till TV4 Nyheterna. ”Kanske behöver flytta” Sista anmälningsdag till högskola och universitet i höst är onsdagen den 15 april. Om du söker en utbildning där konkurrensen om jobben är hög finns det råd som kan öka dina möjligheter. Bland annat kan det vara viktigt att ordna praktik under studietiden eller sommarjobba för att stärka chanserna till jobb efter examen, enligt Sofia Rydgren Stale. – Förberedda sig på att man kanske behöver flytta om det är så att man väljer en utbildningsinriktning där konkurrensen om jobben är högre, säger hon. Enligt Sacos ordförande ska man välja utbildning med både hjärta och hjärna. Hjärta i form av att välja ett yrke eller en utbildning man är intresserad av och har fallenhet för. – Man ska jobba ett helt yrkesliv, så det är viktigt att det är något man tycker om – då är det lättare att bli bra på sitt jobb. – Men det är också viktigt att välja med hjärna: att göra ett informerat val där man har kollat upp hur arbetsmarknaden ser ut framöver och om det kommer att vara lätt eller svårt att få jobb. Högre utbildning alltid en bra investering Trots hög konkurrens inom vissa yrkesgrupper leder de allra flesta utbildningar på högskola och universitet till jobb. Enligt Sofia Rydgren Stale är en högre utbildning alltid en bra investering, eftersom akademiker har den högsta etableringen på arbetsmarknaden. – Ser vi på det hela taget så är mellan 80, 85 och 90 procent av akademikerna i arbete och etablerade på arbetsmarknaden ett år efter examen. – Även inom områden där det är högre konkurrens om jobbet så kommer de allra flesta ut i arbete.", "link": "https://www.tv4.se/artikel/2LwTE9QwLDkc3ql0LfrjBu/haer-aer-utbildningarna-med-saemst-chans-till-jobb", "date_display": "2026-04-14", "date_iso": "2026-04-14T07:43:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/ekonomi", "/utbildning", "/universitet"]}, {"id": 157, "title": "Trump's defense after sawing the image of Jesus: \"Me as a doctor\"", "summary": "Christian activists furious • The president: \"I make people feel better\"", "title_original": "Trumps försvar efter sågade Jesusbilden: ”Jag som läkare”", "summary_original": "Kristna aktivister rasande • Presidenten: ”Jag får folk att må bättre\"", "link": "https://www.tv4.se/artikel/6BknsI60C2MxuXVuWSWAsT/trumps-foersvar-efter-sagade-jesusbilden-jag-som-laekare", "date_display": "2026-04-14", "date_iso": "2026-04-14T05:00:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 158, "title": "Here are the Swedes' favorite words: \"Many who are fond of it\"", "summary": "The word lagom wins by a good margin in both polls and is thus undoubtedly the Swedes' favorite word. - When you have been allowed to submit nominations and vote, you have also had the opportunity to write a justification. Then there are many people who take up the fact that you perceive just enough as something incredibly Swedish. It's some kind of balance between extremes, says Anders Svensson. The vote was conducted on Språktidningen's website between October 14 and December 31, 2025. The candidates were selected after a process in which over 8,000 readers and followers nominated their favorite words.  In addition, Novus has carried out a survey on behalf of Språktidningen between 8 and 13 January 2026. The survey is based on 1,014 interviews in a randomly recruited web panel and is representative of the Swedish people in the age group 18 to 84 years. Described as \"perfect Swedish word\" as early as 1678 The lists differ somewhat but at the same time have many similarities. The word appropriate won both votes and the words fika and allemansrät ended up in the top three. - What everyone in the top three has in common, as you can see when different people justify how they vote or think, is that they perceive it as incredibly Swedish, but in different ways.  It is also seen as a bit difficult to translate or that it may not really exist in the same way in all other cultures, says Anders Svensson. Anders Svensson tells us that in one of the very first language care manuals written in 1678 by Samuel Columbus, apt is portrayed as a kind of perfect Swedish word. - Then it is precisely this that you are your own helper, but not a thief. You are reasonably funny, but not a fool. So already there, I think that somewhere we have been brought up to believe that we are adequate for centuries and that is perhaps what leaves its mark in this survey, he says. The question is interpreted in different ways. Other words that appear on the top list are forgetful, morning blush and daydream. - Many also highlight words that evoke strong emotional associations that may have e.g", "title_original": "Här är svenskarnas favoritord: ”Många som är förtjusta i det”", "summary_original": "Ordet lagom segrar med god marginal i båda omröstningarna och är därmed utan tvekan svenskarnas favoritord. – När man har fått lämna in nomineringar och rösta, har man också haft möjlighet att skriva en motivering. Då är det många som tar upp att man uppfattar lagom som något otroligt svenskt. Det är någon slags balans mellan ytterligheter, säger Anders Svensson. Omröstningen genomfördes på Språktidningens webbplats mellan 14 oktober och 31 december 2025. Kandidaterna togs fram efter en process där över 8 000 läsare och följare nominerade sina favoritord.  Dessutom har Novus utfört en undersökning på uppdrag av Språktidningen mellan 8 och 13 januari 2026. Undersökningen är baserad på 1 014 intervjuer i en slumpmässigt rekryterad webbpanel och är representativ för svenska folket i åldersgruppen 18 till 84 år. Beskrevs som ”perfekt svenskt ord” redan 1678 Listorna skiljer sig åt en del men har samtidigt många likheter. Ordet lagom gick vinnande ur båda omröstningarna och orden fika och allemansrätt hamnade på topp tre. – Det som alla i topp tre har gemensamt, som man ser när olika personer motiverar hur de röstar eller tycker, är att man uppfattar det som otroligt svenskt, men på olika sätt.  Man ser det också som lite svåröversatt eller att det kanske inte riktigt finns på samma sätt i alla andra kulturer, säger Anders Svensson. Anders Svensson berättar att i en av de allra första språkvårdshandledningarna som skrevs 1678 av Samuel Columbus utmålas lagom som ett slags perfekt svenskt ord. – Då är det just det här att man är sin egen hjälpare, men inte en stjälpare. Man är lagom rolig, men inte en narr. Så redan där tror jag att vi någonstans har fostrats in i att vi  är lagom i århundraden och det är kanske det som sätter sina spår i den här undersökningen, säger han. Frågan tolkas på olika sätt Andra ord som förekommer på topplistan är förgätmigej, morgonrodnad och dagsmeja. – Många lyfter också fram ord som väcker starka känslomässiga associationer som kanske har med natur att göra. Då märker man ju också att folk tolkar frågan om vilka ord som är bäst på lite olika sätt, säger Anders Svensson.", "link": "https://www.tv4.se/artikel/51djqgQSCaL1z8GMrTjR8K/svenskarnas-favoritord-korat", "date_display": "2026-04-14", "date_iso": "2026-04-14T04:31:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Svenska", "/svenska", "/sprak", "/nyhetsmorgon"]}, {"id": 159, "title": "Christian organizations keep an eye on the white snuff", "summary": "Sweet flavors and happy colors • Blå Bandet: \"Young people are introduced to something that is believed to be harmless and harmless.\"", "title_original": "Kristna organisationer håller ett öga på det vita snuset", "summary_original": "Söta smaker och glada färger • Blå Bandet: ”Unga inleds i någonting som man tror är harmlöst och ofarlig.”", "link": "https://www.dagen.se/nyheter/kristna-organisationer-haller-ett-oega-pa-det-vita-snuset/10286434", "date_display": "2026-04-14", "date_iso": "2026-04-14T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Reading \"The Master of Venice\" is like being thrown back to a summer day in your teens", "summary": "Edel Irén Lappin has rea   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
