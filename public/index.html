ktnatverk/", "date_display": "2026-03-28", "date_iso": "2026-03-28T19:17:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Among the strangest things in our cultural canon", "summary": "After a few pages, the neat scientist's travel notes turn into a violent inner story of sin, revelation and grace. Swedenborg's \"Dream Book\" is a captivating testimony of a spiritual conversion and is at the same time high-class literature, rich in humor, imagination and poetic depth.", "title_original": "Bland det märkligaste i vår kulturkanon", "summary_original": "Efter några sidor förvandlas den redige vetenskapsmannens reseanteckningar till en våldsam inre berättelse om synd, uppenbarelse och nåd. Swedenborgs ”Drömbok” utgör ett fängslande vittnesmål om en andlig omvändelse och är samtidigt högklassig litteratur, rik på humor, fantasi och poetiskt djup.", "link": "https://www.svd.se/a/xrmL3Q/bland-det-markligaste-i-var-kulturkanon", "date_display": "2026-03-28", "date_iso": "2026-03-28T19:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 110, "title": "Stock market rally in Oslo while neighboring countries tremble", "summary": "There is a stock market rally in Oslo at the same time as the stock markets in Stockholm and Copenhagen are trembling. Oslo is up 17 percent since the beginning of the year, and analysts believe the rate party will continue - at least in the short term.", "title_original": "Börsrally i Oslo medan grannländerna darrar", "summary_original": "Det är börsrally i Oslo samtidigt som aktiemarknaderna i Stockholm och Köpenhamn darrar. Oslo är upp 17 procent sedan årets början och analytiker tror kursfesten håller i sig – i alla fall i det korta perspektivet.", "link": "https://www.svd.se/a/wrr4gn/borsrally-pa-osloborsen-efter-kriget-i-mellanostern-stockholm-och-kopenhamn-darrar", "date_display": "2026-03-28", "date_iso": "2026-03-28T19:05:11+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 111, "title": "DN Debate. \"Soft washcloths are the least you can ask for at BB\"", "summary": "DN DEBATE. The crisis in maternity care is a result of political decisions. But when Malmö's BB staff were brave enough to show us the consequences, they were met with scorn from ruling M politicians. Sweden's babies deserve so much better. Nursing mothers too. Let us give it to you, writes Social Democrats party leader Magdalena Andersson.", "title_original": "DN Debatt. ”Mjuka tvättlappar är det minsta man kan begära på BB”", "summary_original": "DN DEBATT. Krisen i förlossningsvården är ett resultat av politiskt fattade beslut. Men när Malmös BB-personal var modig nog att visa oss konsekvenserna möttes de av hån från styrande M-politiker. Sveriges bebisar förtjänar så mycket bättre. Födande mammor också. Låt oss ge er det, skriver Socialdemokraternas partiledare Magdalena Andersson.", "link": "https://www.dn.se/debatt/mjuka-tvattlappar-ar-det-minsta-man-kan-begara-pa-bb/", "date_display": "2026-03-28", "date_iso": "2026-03-28T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Experts: The Houthis a new obstacle for the United States", "summary": "That the Iran-backed Huthi movement interferes in the war risks having both political and economic effects, states Peter Haldén at the Norwegian Defense Academy. - It reinforces the picture of a situation that is slipping out of the US's hands, he says.", "title_original": "Experter: Huthierna ett nytt hinder för USA", "summary_original": "Att den Iranstödda Huthirörelsen blandar sig i kriget riskerar att få både politiska och ekonomiska effekter, konstaterar Peter Haldén vid Försvarshögskolan. – Det förstärker bilden av en situation som håller på att glida USA ur händerna, säger han.", "link": "https://www.svd.se/a/9ppXL9/experter-huthierna-ett-nytt-hinder-for-usa", "date_display": "2026-03-28", "date_iso": "2026-03-28T18:43:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 113, "title": "Young people are recruited into Russia's hybrid war - 20 are charged", "summary": "Russian influence operations in Europe have taken new forms after the mass expulsions of diplomats. In Moldova, 20 people stand accused of recruiting young people into the Kremlin's network - part of the hybrid war with the West.", "title_original": "Unga rekryteras till Rysslands hybridkrig – 20 åtalas", "summary_original": "Ryska påverkansoperationer i Europa har tagit nya former efter massutvisningarna av diplomater. I Moldavien står 20 personer åtalade för att ha rekryterat unga till Kremls nätverk – en del av hybridkriget med väst.", "link": "https://www.dn.se/varlden/unga-rekryteras-till-rysslands-hybridkrig-20-atalas/", "date_display": "2026-03-28", "date_iso": "2026-03-28T18:32:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Leader: Today, few talk about \"belligerence\" and \"Russian terror\"", "summary": "Säpo's report is important reading in order not to lose focus: The biggest threat to Sweden is spelled Russia.", "title_original": "Ledare: I dag talar få om ”krigshets” och ”rysskräck”", "summary_original": "Säpos rapport är viktig läsning för att inte tappa fokus: Det största hotet mot Sverige stavas Ryssland.", "link": "https://www.dn.se/ledare/i-dag-talar-fa-om-krigshets-och-rysskrack/", "date_display": "2026-03-28", "date_iso": "2026-03-28T18:31:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Cold facts win the Golden Spade for the Lundin review", "summary": "Cold facts is awarded the Guldspaden 2025 in the Etermedia national documentary category for the review \"Lundinfallet - Tysta alla wittnen\". The prize was awarded during the Föreningen Grävande Journalists' gala on Saturday evening. The award-winning team consists of TV4's Anna Roxvall, Lovisa Thuresson, Gerda Nilsson Tysklind and Carolina Jemsby, together with editor Jonas Alsgren and responsible publisher Fredrick Malmberg. Extensive witness influence revealed The review revealed how people hired in connection with Lundinbolaget's operations in Sudan and South Sudan exposed witnesses to threats, violence and pressure. Almost 400 cases of suspected influence attempts were documented – everything from assaults and attempted murders to gang rapes and suspected murders. In interviews, several alleged perpetrators admitted that the aim was to silence witnesses and take them to Khartoum, where they risked being killed. A leak from within the company also connected the designated perpetrators directly to the Lundin management. The review had a great impact. After the publication, the prosecutor's office reopened the closed preliminary investigation into the abuse in the court case, gave the police new resources and appointed a third prosecutor.  Heavy field of nominees Among the other nominees was Bo-Göran Bodin's well-known documentary \"Document from the inside: Hate\". The documentary became the most notified program ever, with over 2,200 notifications to the Review Board.  Kalla fakta's \"Lundinfallet - Silence all the witnesses\" was published on March 20, 2025 in Kalla fakta on TV4 and TV4 Play.", "title_original": "Kalla fakta vinner Guldspaden för Lundin-granskningen", "summary_original": "Kalla fakta tilldelas Guldspaden 2025 i kategorin Etermedia riks dokumentär för granskningen ”Lundinfallet – Tysta alla vittnen”. Priset delades ut under Föreningen Grävande Journalisters gala på lördagskvällen. Det prisade teamet består av TV4:s Anna Roxvall, Lovisa Thuresson, Gerda Nilsson Tysklind och Carolina Jemsby, tillsammans med redaktören Jonas Alsgren och ansvarige utgivaren Fredrick Malmberg. Avslöjade omfattande vittnespåverkan Granskningen avslöjade hur personer anlitade i samband med Lundinbolagets verksamhet i Sudan och Sydsudan utsatte vittnen för hot, våld och påtryckningar. Nästan 400 fall av misstänkta påverkningsförsök dokumenterades – allt från misshandel och mordförsök till gruppvåldtäkter och misstänkta mord. I intervjuer medgav flera utpekade förövare att syftet var att tysta vittnen och föra dem till Khartoum, där de riskerade att dödas. En läcka inifrån bolaget kopplade dessutom de utpekade förövarna direkt till Lundinledningen. Granskningen fick stort genomslag. Efter publiceringen återupptog åklagarmyndigheten den nedlagda förundersökningen om övergrepp i rättssak, gav polisen nya resurser och tillsatte en tredje åklagare.  Tungt nominerat fält Bland de andra nominerade fanns även Bo-Göran Bodins omtalade dokumentär ”Dokument inifrån: Hatet”. Dokumentären blev det mest anmälda programmet någonsin med över 2200 anmälningar till Granskningsnämnden.  Kalla faktas ”Lundinfallet – Tysta alla vittnen” publicerades den 20 mars 2025 i Kalla fakta på TV4 och TV4 Play.", "link": "https://www.tv4.se/artikel/2CYQ7zQ9A2GayEVbE0sozi/kalla-fakta-vinner-guldspaden-foer-lundin-granskningen", "date_display": "2026-03-28", "date_iso": "2026-03-28T18:26:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/lundin-oil", "/kalla-fakta-lundinfallet", "/guldspaden"]}, {"id": 116, "title": "Nathan Shachar: The displacement of Palestinians is condemned by both the US and Israel's military leadership", "summary": "JERUSALEM. Three years ago, Israel introduced a new model for the occupation of the West Bank, when powers were transferred from the military to extremist politicians. The many attacks on Palestinians since then have shocked many, but have not cost the government very much, neither in terms of foreign nor domestic politics.", "title_original": "Nathan Shachar: Fördrivningen av palestinier fördöms av både USA och Israels militärledning", "summary_original": "JERUSALEM. Israel införde för tre år sedan ny modell för ockupationen av Västbanken, när befogenheter flyttades från militären till extremistpolitiker. De många överfallen på palestinier sedan dess har chockat många, men inte kostat regeringen särskilt mycket, varken utrikes- eller inrikespolitiskt.", "link": "https://www.dn.se/varlden/nathan-shachar-fordrivningen-av-palestinier-fordoms-av-bade-usa-och-israels-militarledning/", "date_display": "2026-03-28", "date_iso": "2026-03-28T17:56:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "\"Zombie fungus\" found in Sweden - radio control spiders", "summary": "It takes over the brains of spiders and is believed to radio control them until they die. A mold-like membrane is left on the corpse - which is used to infect new victims. This is how the \"zombie fungus\" works - which has now also been found in Sweden.", "title_original": "”Zombiesvamp” hittad i Sverige – radiostyr spindlar", "summary_original": "Den tar över spindlars hjärnor och tros radiostyra dem tills de dör. På liket lämnas en mögelliknande hinna – vilken används för att infektera nya offer. Så funkar ”zombiesvampen” – som nu även hittats i Sverige.", "link": "https://www.dn.se/sverige/zombiesvamp-hittad-i-sverige-radiostyr-spindlar/", "date_display": "2026-03-28", "date_iso": "2026-03-28T17:32:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Then the Easter favorites can become an infection trap: \"Saturday sweets for bacteria\"", "summary": "Easter tables will soon be set all over the country - but several of the dishes that often end up on the buffet can be downright dangerous if handled incorrectly. That's what food hygiene professor Marie-Louise Danielsson-Tham says, who points out shrimp, stir-fries and eggs as some of the biggest risks when Easter stress hits. Many people choose to buy shrimp with shells and save the shells to cook stock. But the shells must be refrigerated in the same way as the prawns, emphasizes Danielsson‑Tham – something she believes many people neglect. - Many people think that \"this should still be boiled, it's harmless\". But staphylococci from the hands may have had time to form a poison before boiling the peels, she says. Vomiting and diarrhea It is about enterotoxin, a heat-stable poison produced by certain staphylococci. - The nasty thing about this poison is that it can withstand boiling for several hours, she says. The consequences can be dramatic. - After one to five hours, the guests start vomiting uncontrollably. About half get diarrhea and some get really bad, says Danielsson-Tham. - First you think you are going to die. Then you want to die. And then you are suddenly healthy again. Another classic on the Easter table is egg halves with prawns and mayonnaise. They are also sensitive to handle. - Boiled egg yolks are one of the most popular of various bacteria. I usually say it's Saturday candy for bacteria, she says. Hand hygiene is essential here, as is cold storage.  - What you have on your hands when you cut the eggs ends up on the yolks, she says. Warns of eggshell trend One trend she has reacted to is recipes where you fill empty eggshells with batter. - You have to clean the eggshell very carefully, but it is difficult to clean an eggshell thoroughly enough. It's disgusting, says Danielsson-Tham. She recommends putting the mess in egg cups instead. Easter's many cold dishes often involve moments with fingers in the food. - Everything that is finely distributed mixed with whipped cream, mayonnaise and sour cream has a poor shelf life, she says. And the tasting in the kitchen is a classic", "title_original": "Då kan påskfavoriterna bli en smittfälla: ”Lördagsgodis för bakterier”", "summary_original": "Snart dukas påskborden fram runt om i landet – men flera av rätterna som ofta hamnar på buffén kan bli direkt farliga om de hanteras fel. Det säger livsmedelshygienprofessorn Marie‑Louise Danielsson‑Tham, som pekar ut räkor, röror och ägg som några av de största riskerna när påskstressen slår till. Många väljer att köpa räkor med skal och spara skalen för att koka fond. Men skalen måste kylförvaras på samma sätt som räkorna, betonar Danielsson‑Tham – något hon menar att många slarvar med. – Många tänker att ”det här ska ändå kokas, det är ofarligt”. Men stafylokocker från händerna kan ha hunnit bilda ett gift innan man kokar skalen, säger hon. Kräkkalas och diarré Det handlar om enterotoxin, ett värmestabilt gift som bildas av vissa stafylokocker. – Det otäcka med det här giftet är att det tål att koka flera timmar, säger hon. Konsekvenserna kan bli dramatiska. – Efter en till fem timmar börjar gästerna kräkas hejdlöst. Ungefär hälften får diarré och några blir jättedåliga, säger Danielsson-Tham. – Först tror man att man ska dö. Sen vill man dö. Och sen är man plötsligt frisk igen. En annan klassiker på påskbordet är ägghalvor med räkor och majonnäs. Även de är känsliga att hantera. – Kokta äggulor är ett av det mest omtyckta som finns av olika bakterier. Jag brukar säga att det är lördagsgodis för bakterier, säger hon. Här är handhygienen A och O, liksom kylförvaring.  – Det man har på händerna när man skär upp äggen hamnar på äggulorna, säger hon. Varnar för trend med äggskal En trend hon reagerat på är recept där man fyller tomma äggskal med röror. – Man ska göra rent äggskalen väldigt noga, men det är svårt att göra rent ett äggskal tillräckligt noga. Det är jätteäckligt, säger Danielsson-Tham. Hon rekommenderar istället att lägga röran i äggkoppar. Påskens många kallrätter innebär ofta moment med fingrar i maten. – Allt som är fint fördelat blandat med vispad grädde, majonnäs och gräddfil har sämre hållbarhet, säger hon. Och provsmakningen i köket är en klassisk fälla. – Tar man samma sked igen är det som att ha spottat i röran, säger Marie-Louise Danielsson-Tham. Maten står framme för länge I påskstressen blir många rätter stående ute i rumstemperatur längre än man tror. – Det man har stoppat i under hanteringen finns kvar och det förökar sig. Ut och in och ut och in – det gör att det blir en förökning, säger hon. Många tar med sig mat till släkt och vänner eller handlar i gårdsbutiker längs vägen. Där finns ytterligare risker, enligt Danielsson-Tham. – En del är nog mer kreativa än de har kunskap, säger hon om hemmagjorda produkter som opasteuriserade ostar, säger hon. Bilfärden kan också ställa till det. – Har man inte med sig en kylväska och maten ligger några timmar i bilvärmen kan den bli både dålig och farlig, säger hon.", "link": "https://www.tv4.se/artikel/2MeQq3JB2DXtzUyPTGUQYf/da-kan-svenskarnas-paskfavoriter-bli-en-smittfaella-loerdagsgodis-foer", "date_display": "2026-03-28", "date_iso": "2026-03-28T17:30:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/livsmedel", "/livsmedelsproduktion", "/matlagning", "/pask", "/paskmat"]}, {"id": 119, "title": "Brynäs decided in the draw - Färjestad continues to win", "summary": "Brynäs took a vital 3–2 victory at home against Växjö in the SC playoff quarter-final series. Veteran Jakob Silfverberg became the match hero with his 3–2 goal in sudden death. At the same time, Färjestad continues to win.", "title_original": "Brynäs avgjorde i sudden – Färjestad fortsätter vinna", "summary_original": "Brynäs tog en livsviktig 3–2-seger hemma mot Växjö i SM-slutspelets kvartsfinalserie. Veteranen Jakob Silfverberg blev matchhjälte med sitt 3–2-mål i sudden death. Samtidigt fortsätter Färjestad att vinna.", "link": "https://www.dn.se/sport/brynas-avgjorde-i-sudden-farjestad-fortsatter-vinna/", "date_display": "2026-03-28", "date_iso": "2026-03-28T17:10:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Färjestad continues to win – one leg in the semi-finals", "summary": "Färjestad has Rögle in proper dock.  After a 2-0 win, the Karlstad team now leads 3-0 in matches in the SM play-offs and is close to advancing to the semi-finals.", "title_original": "Färjestad fortsätter vinna – ena benet i semifinal", "summary_original": "Färjestad har Rögle i ordentlig brygga.  Efter seger med 2–0 leder nu Karlstadlaget med 3–0 i matcher i SM-slutspelet och är nära avancemang till semifinal.", "link": "https://www.sydsvenskan.se/sport/farjestad-fortsatter-vinna-ena-benet-i-semifinal/", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:54:07+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "The Criminologist: Girls go under the radar", "summary": "Girls go under society's radar as possible perpetrators. Criminologist Camila Salazar Atías thinks so. - They are treated and seen as a consumable, she says.", "title_original": "Kriminologen: Tjejer går under radarn", "summary_original": "Flickor går under samhällets radar som möjliga gärningspersoner. Det menar kriminologen Camila Salazar Atías. – De behandlas och ses som en förbrukningsvara, säger hon.", "link": "https://www.svd.se/a/gkkRrq/kriminologen-tjejer-gar-under-radarn", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:52:44+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 122, "title": "That's how Poland became an economic success story", "summary": "From post-communist wreck in the late 1980s to an economic tiger. Poland has made an incomparable journey in a short time. - We are ahead of the USA in so many areas, says engineer Joanna Kowalska.", "title_original": "Så blev Polen en ekonomisk framgångssaga", "summary_original": "Från postkommunistiskt vrak i slutet av 1980-talet till en ekonomisk tiger. Polen har gjort en makalös resa på kort tid. – Vi ligger före USA på så många områden, säger ingenjören Joanna Kowalska.", "link": "https://www.svd.se/a/m00ev4/sa-blev-polen-en-ekonomisk-framgangssaga", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:31:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 123, "title": "The king is back on the throne after the fiasco in the Olympics", "summary": "The king of figure skating is back. After the failure in the Olympics, USA's Ilia Malinin took revenge at the World Championships in Prague when he won his third straight gold on Saturday. - It was challenging and tough, but I received fantastic support from the audience, said Malinin in the victory interview.", "title_original": "Kungen är tillbaka på tronen efter fiaskot i OS", "summary_original": "Kungen av konståkning är tillbaka. Efter misslyckandet i OS tog USA:s Ilia Malinin revansch i VM i Prag när han på lördagen tog sitt tredje raka guld. – Det var utmanande och tufft, men jag fick fantastiskt stöd av publiken, sa Malinin i segerintervjun.", "link": "https://www.dn.se/sport/kungen-ar-tillbaka-pa-tronen-efter-fiaskot-i-os/", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:06:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The conversion can be removed - in \"two-three\" years", "summary": "A few years ago, it looked as if we would not have to reset the clock. But the issue of canceled summer and winter time got stuck in the EU machinery. Now the EU Parliament's chief negotiator gives a forecast for when it might actually happen.", "title_original": "Omställningen kan tas bort – om ”två-tre” år", "summary_original": "För några år sedan såg det ut som om vi skulle slippa ställa om klockan. Men frågan om slopad sommar- och vintertid fastnade i EU-maskineriet. Nu ger EU-parlamentets chefsförhandlare en prognos för när det faktiskt kan ske.", "link": "https://www.svd.se/a/wrrVmn/tidsomstallningen-kan-slopas-om-tva-ar", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:01:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 125, "title": "The viral phenomenon: Packages that have been lost in the mail are sold here", "summary": "Wasted money or an adrenaline-filled hunt for the big bargain? Buying lost packages with unknown contents has become a viral hit on social media, but the company behind the concept has faced strong criticism. - You go from a bad business model to an even worse one, says Martina Elfgren from Svensk Handel.", "title_original": "Virala fenomenet: Här säljs paket som kommit bort i posten", "summary_original": "Bortslösade pengar eller en adrenalinfylld jakt på det stora fyndet? Att köpa borttappade paket med okänt innehåll har blivit en viral succé på sociala medier, men företaget bakom konceptet har mött stark kritik. – Man går från en dålig affärsmodell till en ännu sämre, säger Martina Elfgren från Svensk Handel.", "link": "https://www.dn.se/ekonomi/virala-fenomenet-har-saljs-paket-som-kommit-bort-i-posten/", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:00:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Longing for Sweden - stuck in the Kabul of the war", "summary": "Ten years ago he lived in Sweden. Now Basir Sharifi wakes up in Kabul to the roar of Pakistani attack planes. The brass of the prayer troopers is drowned in muffled detonations – the war has returned to Afghanistan.", "title_original": "Längtar till Sverige – fast i krigets Kabul", "summary_original": "För tio år sedan bodde han i Sverige. Nu vaknar Basir Sharifi i Kabul av dånet från pakistanska attackplan. Böneutroparnas mässande drunknar i dova detonationer – kriget har återvänt till Afghanistan.", "link": "https://www.svd.se/a/JOO724/basir-sharifi-bodde-i-dalarna-nu-mitt-i-kriget-i-kabul-inte-latt-att-ta-mig-tillbaka", "date_display": "2026-03-28", "date_iso": "2026-03-28T16:00:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 127, "title": "V-anger after the SD top's criticism of LGBT meetings at open preschools", "summary": "SD leader Mattias Karlsson wants to stop open preschool LGBT meetings, which he calls discriminatory. The City of Stockholm's pre-school councilor Alexandra Mattsson (V) calls the outcome \"unworldly\". - We do not intend to let SD decide which parents will be allowed to meet, she says.", "title_original": "V-ilska efter SD-toppens kritik mot hbtq-träffar på öppna förskolan", "summary_original": "SD-toppen Mattias Karlsson vill stoppa öppna förskolans hbtq-träffar, som han kallar för diskriminerande. Stockholms stads förskoleborgarråd Alexandra Mattsson (V) kallar utspelet för ”världsfrånvänt”. – Vi tänker inte låta SD bestämma vilka föräldrar som ska få träffas, säger hon.", "link": "https://www.dn.se/sverige/v-ilska-efter-sd-toppens-kritik-mot-hbtq-traffar-pa-oppna-forskolan/", "date_display": "2026-03-28", "date_iso": "2026-03-28T15:51:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Pistachio and raspberry cheesecake", "summary": "Today's weekend tip offers a cake that is as beautiful as it is tasty, where pistachio cream meets sour raspberries in a fresh and elegant cheesecake that you bake completely without an oven. Perfect to make in advance and impressive to serve at a party or coffee break.  See Roy Fare's recipe", "title_original": "Pistage- och halloncheesecake", "summary_original": "Dagens helgtips bjuder på en lika vacker som god tårta där pistagekräm möter syrliga hallon i en frisk och elegant cheesecake som du bakar helt utan ugn. Perfekt att göra i förväg och imponerande att servera till fest eller fika.  Se Roy Fares recept", "link": "https://www.tv4.se/artikel/3JooICM2YRo8B7yjWEZDD2/pistage-och-halloncheesecake", "date_display": "2026-03-28", "date_iso": "2026-03-28T15:29:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/roy-fares", "/koket", "/kokets-helgtips"]}, {"id": 129, "title": "The mother ends up in the group therapy from hell", "summary": "In a series of novels, Helena von Zweigbergk explores the times she herself lived in. In \"1999\" it is about adult children who break with their parents. Kerstin Särneö is touched by people's shortcomings, but wishes the author did not paint with such broad brushstrokes.", "title_original": "Mamman hamnar i gruppterapin från helvetet", "summary_original": "I en serie romaner utforskar Helena von Zweigbergk tiderna hon själv levt i. I ”1999” handlar det om vuxna barn som bryter med sina föräldrar. Kerstin Särneö blir berörd av människornas tillkortakommanden, men önskar att författaren inte målade med så breda penseldrag.", "link": "https://www.dn.se/kultur/mamman-hamnar-i-gruppterapin-fran-helvetet/", "date_display": "2026-03-28", "date_iso": "2026-03-28T15:22:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "The sleep scientist: True or false about daylight saving time", "summary": "Do we in Sweden and the Nordic countries benefit more from the time change? Well, the big win for us is that we get more light in the evening. But in the summer it doesn't matter so much, because then it's so bright anyway.  Are more people dying in connection with the time change? No. There is an old classic Swedish study that showed that heart attacks went up by a few percent on the Monday and the Tuesday after. But now there was a big study that showed that it wasn't true. There are studies that showed slightly more accidents in traffic these days, but overall the risks are small. Is the switch to summer time more harmful than to winter time? Yes, you can say that, as you get reduced sleep. There is no risk in sleeping in for an hour more. For the vast majority it is a non-issue. Most people do this adjustment every weekend when they sleep longer and need to get up a little earlier on Monday. Just this weekend it will be a little extra difficult.  Can you catch up on the difference in sleep? Yes. Not everyone, but almost everyone falls asleep quickly. Our sleep is so dynamic and biologically strong that most people catch up on it in one night. Those who have a late rhythm will have a little more trouble adapting to society than they already have.   Is everyone equally affected by the time change? No, it's a huge difference. If you are outdoors a lot, you immediately change your mind, there are excellent studies that show that everyone who camps becomes morning people. Those who are out little, have longer rhythms and who tend to be evening people will have a little more trouble.", "title_original": "Sömnforskaren: Sant eller falskt om sommartid", "summary_original": "Har vi uppe i Sverige och Norden mer nytta av tidsomställningen? Nja, den stora vinsten för oss är att vi får mer ljus på kvällen. Men på sommaren spelar det inte så stor roll, för då är det är så ljust i alla fall.  Dör fler människor i samband med tidsomställningen? Nej. Det finns en gammal klassisk svensk studie som visade att hjärtinfarkterna gick upp med några procent måndagen och tisdagen efteråt. Men nu kom det en stor studie som visade att det inte var sant. Det finns studier som visade på lite fler olyckor i trafiken de här dagarna, men överlag är riskerna små. Är omställningen till sommartid skadligare än till vintertid? Ja, det kan man ju säga, då man får minskad sömn. Att sova ut en timme mer finns det inga risker med. För de allra flesta är det en ickegrej. De flesta gör den här omställningen varje helg när man sover längre och behöver gå upp lite tidigare på måndagen. Just den här helgen blir det lite extra jobbigt.  Kan man sova ikapp skillnaden? Ja. Inte alla, men nästan alla sover ikapp det snabbt. Vår sömn är så dynamisk och biologiskt stark att de flesta sover ikapp det på en natt. De som har en rytm som ligger sent kommer ha ytterligare lite större problem att anpassa sig till samhället än vad de redan har.   Drabbas alla lika av tidomställningen? Nej, det är en jättestor skillnad. Om man är utomhus mycket ställer man om direkt, det finns jättefina studier som visar att alla som campar blir morgonmänniskor. De som är ute lite, har längre rytmer och som tenderar att bli kvällsmänniskor kommer få lite mer problem.", "link": "https://www.tv4.se/artikel/tt-260328-sommartid1-ee6a5e2d/somnforskaren-sant-eller-falskt-om-sommartid", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:38:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige", "/sverige", "/stockholms-universitet", "/inrikes"]}, {"id": 131, "title": "Here, the bishops of the Church of Sweden pray for vulnerable Christians in the Middle East", "summary": "\"We are worried about the future of the churches in the region, that one day there will be no living stones left,\" say the church's bishops.", "title_original": "Här ber Svenska kyrkans biskopar för utsatta kristna i Mellanöstern", "summary_original": "”Vi oroas över kyrkornas framtid i regionen, att det en dag inte ska finnas några levande stenar kvar”, formulerar sig kyrkans biskopar.", "link": "https://www.dagen.se/nyheter/haer-ber-svenska-kyrkans-biskopar-foer-utsatta-kristna-i-mellanoestern/10275807", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:37:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Many arrows point upwards for the Church of Sweden - despite the reduction", "summary": "Increased commitment, more confirmands and more worship visits for the shrinking church.", "title_original": "Många pilar pekar uppåt för Svenska kyrkan – trots minskning", "summary_original": "Ökat engagemang, fler konfirmander och fler gudstjänstbesök för den krympande kyrkan.", "link": "https://www.dagen.se/nyheter/manga-pilar-pekar-uppat-foer-svenska-kyrkan-trots-minskning/10275113", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:36:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Golden gods, technocrats and silver fish - here are the best children's and youth books right now", "summary": "DN's children's and youth book critic chooses his five favorites from the current publication.", "title_original": "Guldgudar, teknokrater och silverfiskar – här är de bästa barn- och ungdomsböckerna just nu", "summary_original": "DN:s barn- och ungdomsbokskritiker väljer sina fem favoriter ur den aktuella utgivningen.", "link": "https://www.dn.se/kultur/guldgudar-teknokrater-och-silverfiskar-har-ar-de-basta-barn-och-ungdomsbockerna-just-nu/", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:29:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "A bit cautious when day girl meets night girl in a dystopian future", "summary": "Isa Schöier's dystopian debut book \"Nattfolket\" is based on the play of the same name. Steven Ekholm thinks it's pretty obvious.", "title_original": "Lite väl försiktigt när dagflicka möter nattflicka i en dystopisk framtid", "summary_original": "Isa Schöiers dystopiska debutbok ”Nattfolket” är baserad på pjäsen med samma namn. Det märks lite väl tydligt, tycker Steven Ekholm.", "link": "https://www.dn.se/kultur/lite-val-forsiktigt-nar-dagflicka-moter-nattflicka-i-en-dystopisk-framtid/", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:29:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Spicy about when the capybaras sought shelter in the chicken coop", "summary": "The hens' even warmth is disturbed the day a group of capybaras boots into their enclosure. Alexandra Sundqvist reads a mysterious picture book about a viral animal.", "title_original": "Spjuveraktigt om när kapybarorna sökte skydd i hönsgården", "summary_original": "Hönsens jämna lunk störs den dag då ett gäng kapybaror stövlar in i deras inhägnad. Alexandra Sundqvist läser en underfundig bilderbok om ett viralt djur.", "link": "https://www.dn.se/kultur/spjuveraktigt-om-nar-kapybarorna-sokte-skydd-i-honsgarden/", "date_display": "2026-03-28", "date_iso": "2026-03-28T14:29:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "\"Every day I feel good is a gift\"", "summary": "On a cycling holiday six years ago, Mona Rahm suffered an unexpected haemorrhage. At a doctor's visit shortly afterwards, it turned out that she was seriously ill with incurable cancer. - The doctor took this very seriously. She was probably closer to my age, a little younger, and I think she took it very hard to leave the news that I was 54 and going to die. She held my hand and stroked my arm. She had tears in her eyes. I felt so sad for her, because it wasn't her fault, says Mona Rahm. The doctors suspected ovarian cancer, but during the procedure they discovered that it was instead a form of intestinal cancer originating in the appendix. The cancer had already spread and was so extensive that it could not be completely removed. Despite this, Mona has no fear of death and sees death as a bit of a consolation. - I see on the news that there is environmental destruction, climate threats, gang crime and war. Then I can feel a little: Yes, but I will soon get rid of it, she says. \"I'm not dead now, I'm alive\" Mona says that she is very straightforward. - I tell people that I am terminally ill and will die. I think it's liberating because many people find it difficult to talk about death, she says. - I like to talk about death, and I like to do it with people. I think I also still keep a positive mind because I'm not dead now, I'm alive, and I'm very happy about that. But what feels most difficult is that she is forced to leave her three daughters. - In the beginning, we talked a lot about it and were very sad. Now so much time has passed, so it has become like a new everyday life. I think that then, when I get sick and face death, it will hit them again. But then it's still the second round. May be nearing the end Mona has been on chemotherapy since the announcement and x-rays have each time shown that the cancerous tumor has shrunk - but not the last time. - So it may happen that it is nearing the end. But I've thought about it so many times and been so worried about it that now I think: I'm not going to o", "title_original": "”Varje dag jag mår bra är en gåva”", "summary_original": "På en cykelsemester för sex år sedan fick Mona Rahm en oväntad blödning. På ett läkarbesök kort därefter visade det sig att hon var svårt sjuk i obotlig cancer. – Läkaren tog det här väldigt hårt. Hon var väl närmare min ålder, lite yngre, och jag tror att hon tog det väldigt hårt att lämna beskedet att jag var 54 och skulle dö. Hon höll min hand och strök mig på armen. Hon hade tårar i ögonen. Jag blev så ledsen för hennes skull, för det var ju inte hennes fel, berättar Mona Rahm. Läkarna misstänkte äggstockscancer men under ingreppet upptäckte de att det i stället var en form av tarmcancer med ursprung i blindtarmen. Cancern hade redan spritt sig vidare och var så pass omfattande att den inte kunde avlägsnas helt. Trots detta har Mona ingen dödsångest och ser döden lite som en tröst. – Jag ser på nyheterna att det är miljöförstöring, klimathot gängkriminalitet och krig. Då kan jag känna lite: Ja, men jag kommer snart att slippa det, säger hon. ”Jag är inte död nu, jag lever” Mona berättar att hon är väldigt rak på sak. – Jag säger till folk att jag är obotligt sjuk och kommer att dö. Jag tror att det är befriande för många har svårt att prata om döden, säger hon. – Jag tycker om att prata om döden, och jag gör gärna det med folk. Jag tänker att jag också ändå behåller ett positivt sinne för jag är inte död nu, jag lever, och jag är väldigt glad för det. Men det som känns jobbigast är att hon tvingas lämna sina tre döttrar. – I början pratade vi väldigt mycket om det och var väldigt ledsna. Nu har det gått så lång tid, så det har blivit som en ny vardag. Jag tror att sen, när jag blir dålig och ligger inför döden, då drabbar det dem igen. Men då är det ändå andra omgången. Kan närma sig slutet Mona har gått på cellgifter sedan beskedet och röntgen har varje gång visat att cancertumören krympt – men inte den senaste gången. – Så det kan hända att det närmar sig slutet. Men jag har tänkt det så många gånger och varit så orolig för det så nu tänker jag: Jag ska inte oroa mig i onödan eller ta ut nåt i förskott. Man får leva i stunden. Varje dag jag mår bra är en gåva, tänker jag. Hon beskriver att ett liv utan sorg är som en målning utan skuggor. – När du har mörka delar i livet blir de ljusa delarna så mycket ljusare. Bara en dag när jag vaknar och mår bra är en fantastisk dag. Innan tog jag det för givet.", "link": "https://www.tv4.se/artikel/5RwWwuQGMCvp9H4eaD2lux/varje-dag-jag-mar-bra-aer-en-gava-taenker-jag", "date_display": "2026-03-28", "date_iso": "2026-03-28T12:48:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/cancer", "/cancervard", "/sjukdomar"]}, {"id": 137, "title": "The dog Kaiser home again - disappeared after an evening walk", "summary": "The dog Kaiser, 6, is back home after a 24-hour drama in Huddinge. During Friday evening, a woman is said to have yanked the leash out of the hands of the house's 70-year-old father-in-law and walked off with the dog. The incident occurred at 7.30pm when the father-in-law was sitting on a bench during the evening walk. - My father-in-law is out with Kaiser several times a day. This was a completely normal walk, says Anders Gustafsson, master. Pulled the leash and yelled A woman came up and greeted the dog before going into a nearby restaurant. When she returned, the situation turned violent. - She grabbed the leash and yanked it out of his hands and started screaming, says Anders. A witness describes the woman as aggressive and loud. Afterwards, she is said to have walked in the direction of the commuter train station. The father-in-law, who has no cell phone and only speaks Spanish, went home — a walk of about 20 minutes — to alert the family. \"Part of the family\" The family filed a police report immediately. A second report was filed later, after a man came forward and demanded money in exchange for information about the dog's location. - He sent his Swish number and claimed he knew where Kaiser was. We also reported him, says Anders. Kaiser has been in the family for six years. - He is part of the family, like our second child. He means an incredible amount to us, says Susana Salazar, math. \"Excited and happy\" On Saturday evening came the news the family had been waiting for - Kaiser had been found. According to Anders, the dog was handed in to the police. \"It's great that he came home unharmed. It's a relief and I'm excited and happy,\" he writes in a text message, adding: \"All of Sweden was looking for Kaiser.\"", "title_original": "Hunden Kaiser hemma igen – försvann efter kvällspromenad", "summary_original": "Hunden Kaiser, 6, är hemma igen efter ett dygns dramatik i Huddinge. Under fredagskvällen ska en kvinna ha ryckt kopplet ur händerna på hussens 70‑åriga svärfar och gått i väg med hunden. Händelsen inträffade vid 19.30‑tiden när svärfadern satt på en bänk under kvällspromenaden. – Min svärfar är ute med Kaiser flera gånger om dagen. Det här var en helt vanlig promenad, säger Anders Gustafsson, husse. Ryckte kopplet och skrek  En kvinna kom fram och hälsade på hunden innan hon gick in på en restaurang i närheten. När hon kom tillbaka blev situationen hätsk. – Hon tog tag i kopplet och ryckte det ur hans händer och började skrika, säger Anders. Ett vittne beskriver kvinnan som aggressiv och högljudd. Hon ska efteråt ha gått i riktning mot pendeltågsstationen. Svärfadern, som saknar mobiltelefon och bara talar spanska, gick hem – en promenad på cirka 20 minuter – för att larma familjen. ”En del av familjen” Familjen gjorde en polisanmälan direkt. En andra anmälan lämnades in senare, efter att en man hört av sig och begärt pengar i utbyte mot uppgifter om hundens plats. – Han skickade sitt Swishnummer och påstod att han visste var Kaiser var. Vi anmälde honom också, säger Anders. Kaiser har funnits i familjen i sex år. – Han är en del av familjen, som vårt andra barn. Han betyder otroligt mycket för oss, säger Susana Salazar, matte. ”Upprymd och glad” På lördagskvällen kom beskedet familjen väntat på – Kaiser hade hittats. Enligt Anders lämnades hunden in till polisen. ”Skönt att han kom hem oskadd. Det är en lättnad och jag är upprymd och glad”, skriver han i ett sms och tillägger: ”Hela Sverige letade efter Kaiser”.", "link": "https://www.tv4.se/artikel/6WtlEn7kigkMciW7cTRnxY/kaiser-6-sparloest-foersvunnen-vill-bara-ha-min-hund-tillbaka", "date_display": "2026-03-28", "date_iso": "2026-03-28T11:33:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/hundar", "/hund", "/djur"]}, {"id": 138, "title": "Football club must pay millions in fines after fan's Jesus icon", "summary": "Outraged feelings after Serbia's top team Red Star were fined.", "title_original": "Fotbollsklubb måste betala miljonböter efter fansens Jesus-ikon", "summary_original": "Upprörda känslor efter att Serbiens storlag Röda stjärnan bötfälls.", "link": "https://www.dagen.se/nyheter/fotbollsklubb-maste-betala-miljonboeter-efter-fansens-jesus-ikon/10275707", "date_display": "2026-03-28", "date_iso": "2026-03-28T10:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "We Christians must know better than to participate in online lynch mobs", "summary": "Erik Helmerson: When the storms of hate build up, the church is needed the most.", "title_original": "Vi kristna måste veta bättre än att delta i nätets lynchmobbar", "summary_original": "Erik Helmerson: När hatstormarna byggs upp behövs kyrkan som mest.", "link": "https://www.dagen.se/ledare/vi-kristna-maste-veta-baettre-aen-att-delta-i-naetets-lynchmobbar/10271021", "date_display": "2026-03-28", "date_iso": "2026-03-28T10:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Prime Minister receives European Parliament President Roberta Metsola", "summary": "Prime Minister Ulf Kristersson received President of the European Parliament Roberta Metsola on Friday, 27 March. Together, the leaders visited Stockholm’s stock exchange, Nasdaq Stockholm, and discussed ways to strengthen the EU’s capital markets and competitiveness.", "title_original": "Prime Minister receives European Parliament President Roberta Metsola", "summary_original": "Prime Minister Ulf Kristersson received President of the European Parliament Roberta Metsola on Friday, 27 March. Together, the leaders visited Stockholm’s stock exchange, Nasdaq Stockholm, and discussed ways to strengthen the EU’s capital markets and competitiveness.", "link": "https://www.government.se/articles/2026/03/prime-minister-receives-european-parliament-president-roberta-metsola/", "date_display": "2026-03-28", "date_iso": "2026-03-28T09:05:35+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "today", "tags": ["EU", "Prime Minister's Office", "Economic policy", "Financial markets", "Article", "Ulf Kristersson", "Government’s priorities"]}, {"id": 141, "title": "Then six-year-olds must be marked: \"There is a need\"", "summary": "Five shootings in five days have taken a total of four young people's lives in the past week. But the police do not want to call the acts of violence a wave.  - As Swedish police, we have influenced the violence and the actors behind the violence, but it will be these level differences. It's not a wave and nothing that we don't expect, says Stefan Kiernan, head of police operation Augere with the goal of reducing the number of children and young people who are recruited into violent crimes. - We are proactive, but we will not be able to stop every shooting. Young shooters are increasing In recent years, the perpetrators of violent incidents in criminal environments have increased, according to police statistics. The number of 13-14-year-olds suspected of violent incidents in criminal environments has tripled since 2023. Just in the last week, a 15-year-old girl has been detained on suspicion of two shootings, one in Malmö and one in Vårby gård in Stockholm.  - You can't say that new recruitment is increasing, but recruitment to this type of violence is increasing, says Stefan Kiernan. The police work to stop the recruitment of children and young people into violent crimes. Among other things, the secrecy between various actors such as the police, social services and schools has been loosened in order to be able to cooperate more closely and provide support earlier. - If information comes in that a young person deviates from an HVB home or from a home, and we judge that they are a potential perpetrator, then we can bring that information to the whole of Sweden very, very quickly, he says. Stockholm points six-year-olds Now Stockholm's social services will also be the first in the country to point six-year-olds in order to reduce the risk of crime as early as possible. - There is a gap, there is a need there, where the social services do not really come in today with the kind of extensive efforts that would be needed, says Stefan Kiernan. The dot marking of six-year-olds will begin on April 1 and will last until the spring of 2029. The risks of dot markings There are studies that show that this type of dot marking is good, but they have b", "title_original": "Då ska sexåringar punktmarkeras: ”Det finns ett behov”", "summary_original": "Fem skjutningar på fem dygn har tagit totalt fyra ungas liv den senaste veckan. Men polisen vill inte kalla våldsdåden för en våg.  – Vi har som svensk polis påverkat våldet och aktörerna bakom våldet men det kommer vara de här nivåskillnaderna. Det är ingen våg och inget som vi inte förväntar oss, säger Stefan Kiernan, chef för polisoperation Augere med målet att minska antalet barn och unga som rekryteras till våldsbrott. – Vi är proaktiva, men vi kommer inte kunna stoppa varenda skjutning. Unga skyttar ökar De senaste åren har utförarna av våldshändelser i kriminella miljöer ökat, enligt polisens statistik. Antalet 13–14-åringar misstänkta för våldshändelser i kriminella miljöer har tredubblats sedan 2023. Bara den senaste veckan har bland annat en flicka i 15-årsåldern häktats misstänkt för två skjutningar, en i Malmö och en i Vårby gård i Stockholm.  – Man kan inte säga att nyrekryteringen ökar, men rekryteringen till den här typen av våld ökar, säger Stefan Kiernan. Polisen jobbar för att stoppa rekryteringen av barn och unga till våldsbrott. Bland annat har sekretessen mellan olika aktörer som polis, socialtjänst och skola luckrats upp för att kunna samverka tajtare och ge stöd tidigare. – Kommer det in information om att en ungdom avviker från ett HVB-hem  eller från ett hem, och vi bedömer att den är en potentiell utförare då kan vi föra den informationen i hela Sverige väldigt, väldigt fort, säger han. Stockholm punktmarkerar sexåringar Nu blir även Stockholms stads socialtjänst först i landet med att punktmarkera sexåringar för att minska risken för kriminalitet så tidigt som möjligt. – Det finns ett glapp, det finns ett behov där, där inte socialtjänsten riktigt kommer in i dag med den typen av omfattande insatser som skulle behövas, säger Stefan Kiernan. Punktmarkeringen av sexåringar påbörjas 1 april och ska pågå fram till våren 2029. Riskerna med punktmarkeringar Det finns studier som visar på att den här typen av punktmarkeringar är bra, men de har bara testats från 12-åringar och uppåt. Jörgen Larsson är utvecklingsledare på Fou Nordväst, en avdelning inom socialtjänsten  som hjälper kommunerna i nordvästra Stockholm i de brottsförebyggande frågorna, och säger att man bör vara försiktig när man nu går ner i åldrarna. – Det finns alltid en risk när du är inne och stökar i ett barns uppväxt, i ett barns liv, utifrån formandet av identitet.  Han betonar dock på att socialtjänsten i Stockholm är bra på vad de gör, men att man behöver tänka på hur insatsen paketeras nationellt. – Tonläget i samhällsdebatten kan skapa en känsla av utpekande och särbehandling hos dem som får riktat tryck mot sig. Man gör skillnad på folk och folk. Det kan skada tilliten till samhället, som redan är svag i våra  utanförskapsområden, säger Jörgen Larsson.", "link": "https://www.tv4.se/artikel/5eBce1gE2GePPk5JxpbZrZ/stockholms-stad-ska-punktmarkera-sexaringar", "date_display": "2026-03-28", "date_iso": "2026-03-28T08:59:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/valdsbrott", "/gangvaldet", "/gangkriminalitet", "/polisen"]}, {"id": 142, "title": "The star economist: Tax the super rich - save democracy", "summary": "The National Economist Gabriel Zucman, 39 years old, is current in Sweden with the book \"Billionaire's tax - so it can be introduced\". His proposal has already resonated in several countries that have tried or are planning a similar tax. Zucman is in his service room in Paris; the look is intense, he wears a white shirt and sits in front of a whiteboard filled with formulas and symbols. The reasoning relates to increased government revenue if those with a fortune of over 100 million euros - the equivalent of around 1.1 billion kroner - are taxed at two percent. But for Zucman, the question of the world's super rich – he uses English super rich in the interview – is also a question of the development of democracy. The billions means that you can influence politicians and influence the media. We see that in the US. It would be a mistake to think that it doesn't happen in Sweden, he says, and believes that the danger is great that the foundations of democracy can thus be eroded. Strong increase Then he takes the economic distribution in Sweden as an example. 0.001 percent of the population are the richest in Sweden today, they own the equivalent of 30 percent of GDP. This means that they could buy 30 percent of the goods and services produced in Sweden annually. This is a sharp increase in concentrated wealth in Sweden in just a quarter of a century. At the same time, the super-rich are adept at structuring their wealth – with the result that they pay clearly less in taxes as a percentage compared to middle- and high-income earners, according to Zucman. But even if you are a billionaire, you have still taken part in the social services in your own country. Welcome billionaires Zucman's critics have ranged from skeptical to outraged. In France, he was accused of left-wing activism when his proposal was taken up – and stopped – in the French National Assembly last fall.  Two representatives of the Stockholm Chamber of Commerce wrote in a debate post in DI in March that they \"welcome Danish billionaires to Sweden\" if the country faces a \"wealth tax\", which the Danish Social Democrats want. Zucman gets annoyed", "title_original": "Stjärnekonomen: Beskatta superrika – rädda demokratin", "summary_original": "Nationalekonomen Gabriel Zucman, 39 år, är Sverigeaktuell med boken ”Miljardärsskatt – så kan den införas”. Hans förslag har redan gett återklang i flera länder som försökt eller planerar en liknande skatt. Zucman är i sitt tjänsterum i Paris; blicken är intensiv, han bär en vit tröja och sitter framför en whiteboard fylld med formler och symboler. Resonemanget rör ökade statsintäkter om de med en förmögenhet på över 100 miljoner euro – motsvarande omkring 1,1 miljard kronor – beskattas med två procent. Men för Zucman är frågan om världens superrika – han använder engelska superrich i intervjun – också en fråga om demokratins utveckling. Miljarderna innebär att man kan påverka politiker och influera medier. Det ser vi i USA. Det vore ett misstag att tro att det inte händer i Sverige, säger han och menar att faran är stor att demokratins fundament därmed kan urholkas. Kraftig ökning Sedan tar han den ekonomiska fördelningen i Sverige som exempel. 0,001 procent av befolkningen är de rikaste i Sverige i dag, de äger motsvarande 30 procent av BNP. Det innebär att de skulle kunna köpa 30 procent av de varor och tjänster som produceras i Sverige årligen. Det är en kraftig ökning av koncentrerad rikedom i Sverige på bara ett kvarts sekel. Samtidigt är de superrika skickliga på att strukturera sin rikedom – med resultat att de betalar procentuellt klart mindre i skatt jämfört med medel- och höginkomsttagare, enligt Zucman. Men även om man är miljardär så har man fortfarande tagit del av samhällstjänsterna i det egna landet. Välkomnar miljardärer Zucmans kritiker har varit allt från skeptiska till förbannade. I Frankrike anklagades han för vänsteraktivism när hans förslag togs upp – och stoppades – i den franska nationalförsamlingen i höstas.  Två representanter för Stockholms Handelskammare skrev i ett debattinlägg i DI i mars att de ”välkomnar danska miljardärer till Sverige” om landet inför en \"förmögenhetsskatt”, vilket danska Socialdemokraterna vill. Zucman blir irriterad när miljardärer hotar med att fly hemlandet. De hotar alltid med det om nya skatter riktas mot dem. Men vi måste investera mer i sjukvård, högre utbildning, forskning och infrastruktur. Vi lyckas inte med det om inte superrika är med och betalar: det är helt enkelt nödvändigt.", "link": "https://www.tv4.se/artikel/tt-260328-miljardarsskatt1-370d207e/stjarnekonom-beskatta-superrika-radda-demokratin", "date_display": "2026-03-28", "date_iso": "2026-03-28T08:12:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["USA", "/usa", "/storbritannien", "/sverige", "/paris", "/frankrike", "/kalifornien", "/ekonomi"]}, {"id": 143, "title": "\"Takes the whip - may be forced to move back in with mum and dad\"", "summary": "For people with sickness or activity allowance, the housing allowance is often crucial for the rent to be paid. But processing times have increased sharply in recent years. Since 2022, the waiting time has almost doubled, according to statistics from Försäkringskassan. Krister Ekberg, who lives with his girlfriend in Stockholm, is one of those who depend on the support.  - It takes a toll on the psyche if you don't get through. It may happen that you are forced to move back in with mum and dad, he says.  \"Can't take that long\" Today, it takes an average of around 83 days, i.e. almost three months, to get a decision on granted support. For Krister Ekberg, the housing supplement is what makes the economy work. - If we hadn't had the housing allowance, there wouldn't have been any money left to eat food and stuff like that and live, he says. Interest organizations are now sharply criticizing the long waiting times. Anders Lago, chairman of the Riksförbundet FUB, believes that the situation affects an already economically vulnerable group. - These are people who are incredibly vulnerable, poor, and you need this money. It can't take this long. It shouldn't do that, he says. FK: The economic situation affects According to Försäkringskassan, the increased processing times are due, among other things, to the economic situation.  - It has also led to us receiving many more applications for housing allowance, says Terese Östlin, national insurance coordinator at Försäkringskassan. The authority has also had limited opportunities to hire new people.\n\n- At the same time, during this time we have had limited opportunities to recruit new employees as a result of our financial conditions.", "title_original": "”Tar på pysket – kan tvingas flytta hem till mamma och pappa igen”", "summary_original": "För personer med sjuk- eller aktivitetsersättning är bostadstillägget ofta avgörande för att hyran ska kunna betalas. Men handläggningstiderna har ökat kraftigt de senaste åren. Sedan 2022 har väntetiden nästan fördubblats, enligt statistik från Försäkringskassan. Krister Ekberg, som bor tillsammans med sin flickvän i Stockholm, är en av dem som är beroende av stödet.  – Det tar ju på psyket om man inte får igenom. Det kan ju hända att man tvingas att flytta hem till mamma och pappa igen, säger han.  ”Kan inte ta så lång tid” I dag tar det i genomsnitt omkring 83 dagar, alltså närmare tre månader, att få ett beslut om beviljat stöd. För Krister Ekberg är bostadstillägget det som gör att ekonomin går ihop. – Hade vi inte haft bostadstillägget så hade det ju inte funnits några pengar kvar till att äta mat och sånt och leva, säger han. Från intresseorganisationer riktas nu skarp kritik mot de långa väntetiderna. Anders Lago, ordförande för Riksförbundet FUB, menar att situationen drabbar en redan ekonomiskt utsatt grupp. – Det här är ju människor som är otroligt utsatta, fattiga, och man är i behov av de här pengarna. Det kan inte ta så här lång tid. Det ska inte göra det, säger han. FK: Ekonomiska läget påverkar Enligt Försäkringskassan beror de ökade handläggningstiderna bland annat på det ekonomiska läget.  – Det har också lett till att vi har fått in väldigt många fler ansökningar om bostadstillägg, säger Terese Östlin, nationell försäkringssamordnare på Försäkringskassan. Myndigheten har också haft begränsade möjligheter att nyanställa.\n\n– Samtidigt har vi under den här tiden haft begränsade möjligheter att rekrytera nya medarbetare till följd av våra ekonomiska förutsättningar.", "link": "https://www.tv4.se/artikel/2BIiHDcnWF8JnYlEV2D2tH/tar-pa-pysket-kan-tvingas-flytta-hem-till-mamma-och-pappa-igen", "date_display": "2026-03-28", "date_iso": "2026-03-28T07:11:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/forsakringskassan", "/svensk-ekonomi", "/ekonomi"]}, {"id": 144, "title": "View of marriage and dreams of triple baptism in EFK hearing", "summary": "The members' questions when the trio of leaders were grilled before EKF's leadership election.", "title_original": "Äktenskapssyn och drömmar om tredubblade dop i EFK-utfrågning", "summary_original": "Medlemmarnas frågor när ledartrio grillades inför EKF:s ledarval.", "link": "https://www.dagen.se/nyheter/aektenskapssyn-och-droemmar-om-tredubblade-dop-i-efk-utfragning/10275397", "date_display": "2026-03-28", "date_iso": "2026-03-28T06:07:03+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 145, "title": "No wonder Klarna gets away with it", "summary": "Given the lack of interest in confrontational situations on the part of the police, it is no wonder that Klarna's CEO sits as calm as a file bowl during an interview
