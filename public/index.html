ntry. Without them there would be fewer hands for our sick and old.", "title_original": "Ledare: Har Sverige verkligen råd med Tidögängets utvisningspolitik?", "summary_original": "Många anställda i sjukvården och på äldreboenden är födda i ett annat land. Utan dem skulle det finnas färre händer för våra sjuka och gamla.", "link": "https://www.dn.se/ledare/har-sverige-verkligen-rad-med-tidogangets-utvisningspolitik/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:32:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "AI tools undress children - more and more worried: \"Sexually abusive\"", "summary": "More and more children are expressing concern about so-called nudify apps – AI tools that can manipulate images of clothed children into nude images. As the technology spreads, so does the risk of threats, blackmail and sexual abuse, according to the children's rights organization Ecpat. - Turning a picture of a clothed child into a nude picture, that in itself is sexually offensive, says Anna Karin Hildingson Boqvist, secretary general at Ecpat. Great resistance The organization sees how nude images created with the help of AI are used to threaten and pressure children and young people. - Many children and young people are exposed to further abuse through the spread of the images. People contact them, you can be threatened, pressured to send more pictures, she says. According to Ecpat, there are so far relatively few children in Sweden who themselves state that they have been exposed. At the same time, awareness of nudify apps is high – and the resistance among children is clear. - The risk is that more and more children are exposed, that nude images are created and spread on children and young people, says Anna Karin Hildingson Boqvist. \"A ban is needed\" She is now calling for political measures. - Legislation is needed. There needs to be a ban on this type of app and other types of technical tools that sexually abuse children and young people, says Anna Karin Hildingson Boqvist. According to Ecpat, the threat posed by nudify apps affects how children move and express themselves digitally. - Since a clothed image is a risk, the children limit their opportunities to participate in the democratic conversation. The children express that they are tired of this, of being exploited in their own channels.", "title_original": "AI-verktygen klär av barn – allt fler oroliga: ”Sexuellt kränkande”", "summary_original": "Allt fler barn uttrycker oro över så kallade nudify‑appar – AI‑verktyg som kan manipulera bilder på påklädda barn till nakenbilder. I takt med att tekniken sprids ökar också risken för hot, utpressning och sexuella kränkningar, enligt barnrättsorganisationen Ecpat. – Att göra en bild på ett påklätt barn till en nakenbild, det i sig är sexuellt kränkande, säger Anna Karin Hildingson Boqvist, generalsekreterare på Ecpat. Stort motstånd  Organisationen ser hur nakenbilder som skapats med hjälp av AI används för att hota och pressa barn och unga. – Många barn och unga blir utsatta för ytterligare övergrepp genom att bilderna sprids. Människor kontaktar dem, man kan bli hotad, pressad på att skicka fler bilder, säger hon. Enligt Ecpat är det än så länge relativt få barn i Sverige som själva uppger att de har utsatts. Samtidigt är kännedomen om nudify‑appar hög – och motståndet bland barn tydligt. – Risken är att fler och fler barn utsätts, att nakenbilder skapas och sprids på barn och unga, säger Anna Karin Hildingson Boqvist. ”Det behövs förbud” Hon efterlyser nu politiska åtgärder. – Det behövs lagstiftning. Det behövs förbud mot den här typen av appar och andra typer av tekniska verktyg som kränker barn och unga sexuellt, säger Anna Karin Hildingson Boqvist. Enligt Ecpat påverkar hotet från nudify‑appar hur barn rör sig och uttrycker sig digitalt. – Eftersom en påklädd bild är en risk, så begränsar barnen sina möjligheter att delta i det demokratiska samtalet. Barnen uttrycker att de är less på det här, att utnyttjas i sina egna kanaler.", "link": "https://www.tv4.se/artikel/swPNuX9JdbYWKs6MtuzPr/kraever-foerbud-mot-nudify-appar-kraenker-barn-och-unga-sexuellt", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:30:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/barn", "/sexuellt-ofredande", "/sociala-medier"]}, {"id": 97, "title": "Listen: Low-price chain reopens in Landskrona", "summary": "", "title_original": "Lyssna: Lågpriskedja öppnar på nytt i Landskrona", "summary_original": "", "link": "https://www.hd.se/skane/lyssna-flera-restauranger-i-helsingborg-fick-rutorna-sonderslagna/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:29:56+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "Success for MP: \"Maybe because we didn't see each other that much\"", "summary": "HJO/STOCKHOLM. The Green Party ends up in the shadows when C and V fight over ministerial positions. But out of the limelight, they have slowly rebuilt the party and re-emerged in over 20 municipalities. - To be honest, it's probably thanks to the fact that we haven't been seen that much, says Hanna Lindqvist, spokeswoman for Grön ungdom.", "title_original": "Framgång för MP: ”Kanske för att vi inte synts så mycket”", "summary_original": "HJO/STOCKHOLM. Miljöpartiet hamnar i skuggan när C och V strider om ministerposter. Men utanför rampljuset har de sakta byggt upp partiet igen och återuppstått i över 20 kommuner. – Helt ärligt är det kanske tack vare att vi inte har synts så mycket, säger Hanna Lindqvist, språkrör för Grön ungdom.", "link": "https://www.dn.se/sverige/framgang-for-mp-kanske-for-att-vi-inte-synts-sa-mycket/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:27:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 99, "title": "AI tools undress children: 'Rapidly increasing'", "summary": "Apps that can turn ordinary photos into nudes are a growing problem, according to Ecpat. More and more children are getting in touch about fake pictures that are being spread. - The effect is basically the same: you feel shame, you feel attacked and you worry about the future, says investigator Jonas Karlsson.", "title_original": "AI-verktyg klär av barn: ”Ökar snabbt”", "summary_original": "Appar som kan förvandla vanliga bilder till nakenbilder är ett växande problem, enligt Ecpat. Allt fler barn hör av sig om fejkade bilder som sprids. – Effekten är i princip densamma: man känner skam, man känner sig angripen och man oroar sig för framtiden, säger utredaren Jonas Karlsson.", "link": "https://www.sydsvenskan.se/sverige/ai-verktyg-klar-av-barn-okar-snabbt/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:23:57+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 100, "title": "\"The store has generous opening hours every day and doesn't even close during a flight alert.\"", "summary": "A memorial site in the capital of Ukraine, Kyiv.", "title_original": "”Butiken har generösa öppettider alla dagar och stänger inte ens under flyglarm.”", "summary_original": "En minnesplats i Ukrainas huvudstad Kiev.", "link": "https://www.sydsvenskan.se/opinion/butiken-har-generosa-oppettider-alla-dagar-och-stanger-inte-ens-under-flyglarm/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:16:27+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "105 square meter house in Mörarp sold", "summary": "", "title_original": "105 kvadratmeter stort hus i Mörarp sålt", "summary_original": "", "link": "https://www.hd.se/helsingborg/105-kvadratmeter-stort-hus-i-morarp-salt/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:16:21+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "116 square meter older villa in Helsingborg sold", "summary": "", "title_original": "116 kvadratmeter stor äldre villa i Helsingborg såld", "summary_original": "", "link": "https://www.hd.se/helsingborg/116-kvadratmeter-stor-aldre-villa-i-helsingborg-sald/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:16:16+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.hd.se/helsingborg/nya-agare-till-villa-EOdGB/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:16:07+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "38-year-old new owner of villa", "summary": "", "title_original": "38-åring ny ägare till villa", "summary_original": "", "link": "https://www.hd.se/helsingborg/38-aring-ny-agare-till-villa/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:16:01+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "56-year-old new owner of villa", "summary": "", "title_original": "56-åring ny ägare till villa", "summary_original": "", "link": "https://www.hd.se/helsingborg/56-aring-ny-agare-till-villa/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:15:48+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "New owners of older houses", "summary": "", "title_original": "Nya ägare till äldre hus", "summary_original": "", "link": "https://www.hd.se/helsingborg/nya-agare-till-aldre-hus/", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:15:42+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "The milk fight in the USA: Like \"licking a cow's bottom\"", "summary": "Influencers praise it and Health Secretary Robert F. Kennedy has been drinking shots in the White House. A movement advocating unpasteurized milk is growing in the United States - at the same time as public health experts warn of great risks with such consumption.", "title_original": "Mjölkkampen i USA: Som att ”slicka en kos underrede”", "summary_original": "Influerare prisar den och hälsominister Robert F Kennedy har druckit shots i Vita huset. En rörelse som förespråkar opastöriserad mjölk växer i USA – samtidigt som folkhälsoexperter varnar för stora risker med sådan konsumtion.", "link": "https://www.svd.se/a/M75K1o/mjolkkampen-i-usa-som-att-slicka-en-kos-underrede", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:10:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 108, "title": "The scooter lover Anton died in the elevator collapse - now the trial begins", "summary": "Anton Runsvik was 26 years old and came from Matfors outside Sundsvall. In his spare time, he played floorball and loved to drive a scooter in the mountains. Bashir was 25 years old, a welder, newly married and had come to Sweden from Afghanistan to build a future. They were two of the five men who died when a construction elevator collapsed at a construction project in Sundbyberg in December 2023. Now, almost two and a half years later, the trial begins about the fatal accident that shook the construction industry. - We have waited so long to get a proper ending. That the last part is finally done. It is important for us here, it is important for his family in Afghanistan, says Elisabet Rundqvist, who was like an extra mother to Bashir after he came to Sweden in 2015. The accident occurred when five men were in an elevator car used on the construction site. When the elevator passed floor six, the structure gave way. In its investigation, the Norwegian Accident Commission has concluded that four screw connections, which would hold the mast sections together, were missing. When the elevator car passed that point, the mast split - and the car fell freely from a height of about 20 meters. The accident commission points to carelessness during assembly and to serious deficiencies in the controls. Prosecution: gross negligence A CEO and two fitters from the elevator company are now charged with work environment violations by causing the death of another and gross negligence. The charge also includes causing danger to another, as two other people were in the immediate vicinity of the lift and were close to stepping in when it fell. The two will testify in court and tell about how they saw their colleagues fall to the ground. The prosecutor is demanding a prison sentence for the defendants as well as a corporate fine of seven million kroner. All deny wrongdoing. \"Some form of justice\" For the survivors and relatives, the trial is not only about the issue of guilt, but about ensuring that something like this will never happen again.  - We want some form of justice for Bashir and for everyone who died at the same time, we want this one", "title_original": "Skoterälskaren Anton dog i hissraset – nu inleds rättegången", "summary_original": "Anton Runsvik var 26 år gammal och kom från Matfors utanför Sundsvall. På sin fritid spelade han innebandy och älskade att köra skoter i fjällen. Bashir var 25 år, svetsare, nygift och hade kommit till Sverige från Afghanistan för att bygga en framtid. De var två av de fem män som omkom när en bygghiss störtade vid ett byggprojekt i Sundbyberg i december 2023. Nu, nästan två och ett halvt år senare, inleds rättegången om den dödsolycka som skakade byggbranschen. – Vi har väntat så länge på att få ett ordentligt avslut. Att den sista delen äntligen blir gjord. Det är viktigt för oss här, det är viktigt för hans familj i Afghanistan, säger Elisabet Rundqvist, som var som en extramamma åt Bashir efter att han kom till Sverige 2015. Olyckan inträffade när fem män befann sig i en hisskorg som användes på bygget. När hissen passerade våning sex gav konstruktionen vika. Statens haverikommission har i sin utredning slagit fast att fyra skruvförband, som skulle hålla ihop mastsektionerna, saknades. När hisskorgen passerade den punkten delade sig masten – och korgen föll fritt från cirka 20 meters höjd. Haverikommissionen pekar på slarv vid monteringen och på allvarliga brister i kontrollerna. Åtal: grov oaktsamhet En vd och två montörer från hissföretaget står nu åtalade för arbetsmiljöbrott genom vållande till annans död och grov oaktsamhet. Åtalet omfattar även framkallande av fara för annan, eftersom två andra personer befann sig i omedelbar närhet av hissen och var nära att kliva in när den föll. De två ska vittna i rätten och berätta om hur de såg sina arbetskamrater störta mot marken. Åklagaren yrkar på fängelsestraff för de åtalade samt en företagsbot på sju miljoner kronor. Samtliga förnekar brott. ”Någon form av rättvisa” För de efterlevande och närstående handlar rättegången inte bara om skuldfrågan, utan om att något liknande aldrig ska få hända igen.  – Vi vill ju ha någon form av rättvisa för Bashir och för alla som avled vid samma tidpunkt, vi vill att den här typen av olycka inte ska upprepas igen, att hela kontrollsystemet med egenkontrollerna, att man ser över det systemet, säger Elisabet Rundqvist. Rättegången i Attunda tingsrätt väntas pågå till 26 maj.  TV4 Nyheterna har fått anhörigas godkännande att publicera namn och bild. Förtydligande: I ett tidigare klipp visades ett företagsnamn i grafiken. Det företaget har ingenting med åtalet att göra.", "link": "https://www.tv4.se/artikel/1PyKr49KywFNjilItFI13Z/skoteraelskaren-anton-dog-i-hissraset-nu-inleds-raettegangen", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:05:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/hiss", "/hissraset-i-sundbyberg"]}, {"id": 109, "title": "AI tools undress children: 'Rapidly increasing'", "summary": "Apps that can turn ordinary photos into nudes are a growing problem, according to Ecpat. More and more children are getting in touch about fake pictures that are being spread. - The effect is basically the same: you feel shame, you feel attacked and you worry about the future, says investigator Jonas Karlsson.", "title_original": "AI-verktyg klär av barn: ”Ökar snabbt”", "summary_original": "Appar som kan förvandla vanliga bilder till nakenbilder är ett växande problem, enligt Ecpat. Allt fler barn hör av sig om fejkade bilder som sprids. – Effekten är i princip densamma: man känner skam, man känner sig angripen och man oroar sig för framtiden, säger utredaren Jonas Karlsson.", "link": "https://www.svd.se/a/bOkAne/ai-verktyg-klar-av-barn-okar-snabbt", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:00:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 110, "title": "\"We lose when we lose focus\"", "summary": "The Baltic countries were right, says British journalist Edward Lucas. He warns that the West is losing the war against Russia because of ignorance.", "title_original": "”Vi förlorar när vi tappar uppmärksamheten”", "summary_original": "De baltiska länderna hade rätt, säger den brittiske journalisten Edward Lucas. Han varnar för att väst förlorar kriget mot Ryssland på grund av aningslöshet.", "link": "https://www.svd.se/a/43E4Jo/edward-lucas-varnar-vast-for-aningsloshet-infor-ryssland", "date_display": "2026-05-05", "date_iso": "2026-05-05T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 111, "title": "Hugo and Otto are identical twins - first discovered with dna", "summary": "A dna test showed that Hugo and Otto are identical identical twins – not fraternal twins as stated by the care. - Tens of thousands of twins may have received an incorrect image at birth and for many it is upsetting to receive new information, says Patrik Magnusson, director of the Swedish Twin Registry.", "title_original": "Hugo och Otto är identiska tvillingar – upptäcktes först med dna", "summary_original": "Ett dna-test visade att Hugo och Otto är identiska enäggstvillingar – inte tvåäggstvillingar som vården uppgett. – Tiotusentals tvillingar kan ha fått en felaktig bild vid födseln och för många är det omvälvande att få ett nytt besked, säger Patrik Magnusson, chef för Svenska tvillingregistret.", "link": "https://www.dn.se/insidan/hugo-och-otto-ar-identiska-tvillingar-upptacktes-forst-med-dna/", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:44:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "144 square meter house in Malmö sold for SEK 5,300,000", "summary": "", "title_original": "144 kvadratmeter stort hus i Malmö sålt för 5 300 000 kronor", "summary_original": "", "link": "https://www.sydsvenskan.se/144-kvadratmeter-stort-hus-i-malmo-salt-for-5-300-000-kronor/", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:36:12+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Fear of relapse - then life took a new turn", "summary": "Jonna and Maya are healthy from breast cancer. But amidst the relief comes the fear of relapse that many people live with for years. \"It ticks like an engine inside me all the time,\" says Jonna.", "title_original": "Återfallsskräck – sedan tog livet en ny vändning", "summary_original": "Jonna och Maya är friska från bröst­cancer. Men mitt i lättnaden kommer också återfallsskräcken som många lever med i åratal. ”Den tickar som en motor i mig hela tiden”, säger Jonna.", "link": "https://www.svd.se/a/43OPP6/livet-efter-cancern-radsla-for-aterfall-och-mer-frihet", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:33:27+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Idagsidan"]}, {"id": 114, "title": "Top managers in Kinnevik have received half a billion", "summary": "Kinnevik's CEO and management team have paid out almost half a billion kroner since 2020. For the shareholders, the development has been the opposite: the price has plummeted over 80 percent. Now Cristina Stenbeck wants to change the compensation program.", "title_original": "Toppchefer i Kinnevik har fått en halv miljard", "summary_original": "Kinneviks vd och ledningsgrupp har kvitterat ut nästan en halv miljard kronor sedan 2020. För aktieägarna har utvecklingen varit den motsatta: kursen har rasat över 80 procent. Nu vill Cristina Stenbeck göra om ersättningsprogrammet.", "link": "https://www.svd.se/a/Rj1r95/kinneviks-vd-och-ledning-har-tjanat-478-miljoner", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:24:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 115, "title": "So the shoe helped him overcome \"impossible\" dream limits", "summary": "Kenyan Sabastian Sawe became the first in the world to run a marathon under two hours. The question, however, is who deserves the most credit and praise for the feat that was long claimed to be impossible. The runner or the shoemaker?", "title_original": "Så hjälpte skon honom att klara ”omöjlig” drömgräns", "summary_original": "Kenyanen Sabastian Sawe blev först i världen att springa ett maratonlopp under två timmar. Frågan är dock vem som förtjänar mest ära och beröm för bedriften som länge påstods vara omöjlig. Löparen eller skotillverkaren?", "link": "https://www.dn.se/sport/sa-hjalpte-skon-honom-att-klara-omojlig-dromgrans/", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:22:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Gunman shot near White House", "summary": "", "title_original": "Beväpnad man skjuten nära Vita huset", "summary_original": "", "link": "https://www.svd.se/a/Wvmr4K/bevapnad-man-skjuten-nara-vita-huset", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:12:28+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 117, "title": "Letter to the editor. Politicians should trust their experts", "summary": "LETTER TO THE EDITOR. The politicians' goal of 170 wolves does not go together with the Riksdag's decision about a healthy Swedish wolf tribe. The interesting thing about this is not the wolf issue in itself, but that it is such a clear example of many politicians' denial of knowledge and contempt for science, writes Etienne Edberg.", "title_original": "Insändare. Politiker bör lita på sina experter", "summary_original": "INSÄNDARE. Politikernas mål på 170 vargar går inte ihop med riksdagens beslut om en frisk svensk vargstam. Det intressanta med detta är inte vargfrågan i sig, utan att det är ett så tydligt exempel på många politikers kunskapsförnekelse och vetenskapsförakt, skriver Etienne Edberg.", "link": "https://www.dn.se/insandare/politiker-bor-lita-pa-sina-experter/", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "The doctor Sofia Höglund has had her quarrels with God throughout her life", "summary": "She relaxes with forest walks in the countryside", "title_original": "Läkaren Sofia Höglund har haft sina duster med Gud genom livet", "summary_original": "Hon kopplar av med skogspromenader ute på landet", "link": "https://www.dagen.se/familj/laekaren-sofia-hoeglund-har-haft-sina-duster-med-gud-genom-livet/10305967", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "In memory of Emil Antonson", "summary": "Martin Rejler has written this memorial about him", "title_original": "Till minne av Emil Antonson", "summary_original": "Martin Rejler har skrivit detta minnesord om honom", "link": "https://www.dagen.se/familj/till-minne-av-emil-antonson/10317716", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Better to joke about your own shortcomings than your wife's", "summary": "Evelina Lundkvist has read \"Keep love alive\" by Alf B Svensson", "title_original": "Bättre skämta om egna tillkortakommanden än sin frus", "summary_original": "Evelina Lundkvist har läst ”Håll kärleken levande” av Alf B Svensson", "link": "https://www.dagen.se/kultur/baettre-skaemta-om-egna-tillkortakommanden-aen-sin-frus/10322081", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "He is denied a change of religion on his ID card after becoming a Christian", "summary": "Egyptian Said Abdelrazek is now described as a prisoner of conscience, following reports of torture in prison because of his conversion", "title_original": "Han nekas byta religion på sitt ID-kort efter att ha blivit kristen", "summary_original": "Egyptiske Said Abdelrazek beskrivs nu som samvetsfånge, efter uppgifter om att han torteras i fängelset på grund av sin konversion", "link": "https://www.dagen.se/nyheter/han-nekas-byta-religion-pa-sitt-id-kort-efter-att-ha-blivit-kristen/10322573", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "The Pentecostal leader after reduced state funding: Sad that the politicians did not take it into account", "summary": "Pelle Hörnmark is critical of the new rules for organizational contributions from MUCF.", "title_original": "Pingstledaren efter minskat statsbidrag: Sorgligt att politikerna inte tagit hänsyn", "summary_original": "Pelle Hörnmark är kritisk till de nya reglerna för organisationsbidrag från MUCF.", "link": "https://www.dagen.se/nyheter/pingstledaren-efter-minskat-statsbidrag-sorgligt-att-politikerna-inte-tagit-haensyn/10328245", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "The Hönökonferensen donates a tent worth a quarter of a million to the Torpkonferensen", "summary": "Christer Aadland, Torpsa coordinator: I thought \"huh, is it for real?\"", "title_original": "Hönökonferensen skänker tält värt en kvarts miljon till Torpkonferensen", "summary_original": "Christer Aadland, Torpsamordnare: Jag tänkte ”va, är det på riktigt?”", "link": "https://www.dagen.se/nyheter/hoenoekonferensen-skaenker-taelt-vaert-en-kvarts-miljon-till-torpkonferensen/10328482", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "The irony is that the Church of Sweden says no in the name of \"inclusion\".", "summary": "When the possibility of refusing service is introduced, the line between will and coercion becomes increasingly unclear, writes Gabriel Külen.", "title_original": "Ironin är att Svenska kyrkan säger nej i ”inkluderingens” namn", "summary_original": "När möjligheten att neka tjänst införs blir gränsen mellan vilja och tvång alltmer oklar, skriver Gabriel Külen.", "link": "https://www.dagen.se/debatt/ironin-aer-att-svenska-kyrkan-saeger-nej-i-inkluderingens-namn/10319576", "date_display": "2026-05-05", "date_iso": "2026-05-05T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Glittering at the Met Gala – Duplantis in place", "summary": "Madonna had a ship on her head, Heidi Klum was a marble statue and Bad Bunny came to the biggest fashion party of the year, the Met Gala, as an aged version of herself. Several Swedes also took their place on the classic staircase in New York, including Armand Duplantis and Bill Skarsgård.", "title_original": "Glittrigt på Met-galan – Duplantis på plats", "summary_original": "Madonna hade ett skepp på huvudet, Heidi Klum var en marmorstaty och Bad Bunny kom till årets största modefest Met-galan som en åldrad version av sig själv. Även flera svenskar tog plats på den klassiska trappan i New York, däribland Armand Duplantis och Bill Skarsgård.", "link": "https://www.svd.se/a/8pP2gd/glittrigt-pa-met-galan-duplantis-pa-plats", "date_display": "2026-05-05", "date_iso": "2026-05-05T01:52:24+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 126, "title": "Countries call for de-escalation in the Middle East", "summary": "After the last day's tense situation in the Middle East, including Iranian attacks on the United Arab Emirates, several countries are calling for a de-escalation.", "title_original": "Länder manar till nedtrappning i Mellanöstern", "summary_original": "Efter det senaste dygnets spända läge i Mellanöstern, med bland annat iranska attacker mot Förenade arabemiraten, manar flera länder till nedtrappning.", "link": "https://www.svd.se/a/d4J3KB/lander-manar-till-nedtrappning", "date_display": "2026-05-05", "date_iso": "2026-05-05T00:42:25+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 127, "title": "Several dead in explosion in coal mine in Colombia", "summary": "Nine people have died in an explosion in a coal mine in central Colombia on Monday, local time, the government said.", "title_original": "Flera döda i explosion i kolgruva i Colombia", "summary_original": "Nio personer har omkommit i en explosion i en kolgruva i centrala Colombia under måndagen, lokal tid, uppger regeringen.", "link": "https://www.svd.se/a/d4J3WO/explosion-i-gruva-flera-fast", "date_display": "2026-05-04", "date_iso": "2026-05-04T23:45:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 128, "title": "Three assassination attempts on Trump - how did this happen?", "summary": "On April 25, it happens again. For the third time, someone is trying to assassinate US President Donald Trump. In this case, the shooter is a 31-year-old teacher from California. He belongs to a category of politically motivated perpetrators who are described as disturbingly normal. Something seems to have happened to the conversational climate in the US where more people seem motivated to take up arms, and political violence has reached levels not seen since the 60s and 70s. How did this happen? Program manager: Maria Hansson Botin. With: Björn af Kleen, US correspondent at DN.", "title_original": "Tre mordförsök på Trump – hur blev det så här?", "summary_original": "Den 25 april händer det igen. För tredje gången försöker någon mörda USA:s president Donald Trump. I det här fallet är skytten en 31-årig lärare från Kalifornien. Han hör till en kategori politiskt motiverade gärningsmän som beskrivs som oroande normala. Någonting verkar ha hänt med samtalsklimatet i USA där fler tycks motiverade att ta till vapen, och det politiska våldet har nått nivåer som inte setts sedan 60- och 70-talet. Hur blev det så här? Programledare: Maria Hansson Botin. Med: Björn af Kleen, USA-korrespondent på DN.", "link": "https://www.dn.se/podd/spotlight/tre-mordforsok-pa-trump-hur-blev-det-sa-har/", "date_display": "2026-05-04", "date_iso": "2026-05-04T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Gunman shot near White House", "summary": "An armed man was discovered and shot down by the Secret Service just over a kilometer from the White House in Washington on Monday evening, Swedish time. A child was injured in the shooting. Shortly before, Vice President JD Vance had passed by the site in a motorcade.", "title_original": "Beväpnad man skjuten nära Vita huset", "summary_original": "En beväpnad man upptäcktes och sköts ned av Secret Service drygt en kilometer från Vita huset i Washington under måndagskvällen, svensk tid. I skottlossningen skadades ett barn. Strax innan hade vice president JD Vance passerat förbi platsen med en konvoj.", "link": "https://www.dn.se/varlden/bevapnad-man-skjuten-nara-vita-huset/", "date_display": "2026-05-04", "date_iso": "2026-05-04T22:55:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Gunman shot at White House", "summary": "An armed man has been shot by the Secret Service near the White House in the US capital, Washington DC. A child passing by was also injured in the shooting.", "title_original": "Beväpnad man sköts vid Vita huset", "summary_original": "En beväpnad man har skjutits av Secret Service i närheten av Vita huset i USA:s huvudstad Washington DC. Även ett förbipasserande barn skadades i skjutningen.", "link": "https://www.svd.se/a/16v2Jq/bevapnad-man-skjuten-nara-vita-huset", "date_display": "2026-05-04", "date_iso": "2026-05-04T22:48:39+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 131, "title": "Do you understand the most popular Finnish Swedish words?", "summary": "\"Rådda\" and \"nakupelle\" are among the most popular Finnish Swedish words, according to Hufvudstadsbladet, which asked readers about their favorite words. Do you understand these eight favorites from Finland?", "title_original": "Förstår du de populäraste finlandssvenska orden?", "summary_original": "”Rådda” och ”nakupelle” är bland de populäraste finlandssvenska orden, enligt  Hufvudstadsbladet  som frågat läsarna om deras favoritord. Förstår du de här åtta favoriterna från Finland?", "link": "https://www.svd.se/a/43EpBg/ordtest-forstar-du-de-atta-finlandssvenska-favoriterna", "date_display": "2026-05-04", "date_iso": "2026-05-04T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 132, "title": "Sources: Iran still a year away from nuclear weapons", "summary": "Iran's opportunities to develop nuclear weapons are as great as before the start of the war against the United States. The country is still just over a year away from a ready nuclear weapon, according to anonymous intelligence sources to the Reuters news agency.", "title_original": "Källor: Iran fortfarande ett år från kärnvapen", "summary_original": "Irans möjligheter att utveckla kärnvapen är lika stora som innan starten av kriget mot USA. Landet är fortfarande drygt ett år från ett färdigt kärnvapen, enligt anonyma underrättelsekällor till nyhetsbyrån Reuters.", "link": "https://www.dn.se/varlden/kallor-iran-fortfarande-ett-ar-fran-karnvapen/", "date_display": "2026-05-04", "date_iso": "2026-05-04T21:35:25+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "The expert points out two scenarios - after the new attacks", "summary": "Several new incidents in the Hormuz area • \"Would require enormous resources\"", "title_original": "Experten pekar ut två scenarion – efter nya attackerna", "summary_original": "Flera nya incidenter i Hormuzområdet • ”Skulle kräva enorma resurser”", "link": "https://www.tv4.se/artikel/5fw95cxY5GyidmeuEjHSrk/experten-pekar-ut-tva-scenarion-efter-nya-attackerna", "date_display": "2026-05-04", "date_iso": "2026-05-04T20:49:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 134, "title": "An unusually large number of young people needed care at Valborg: \"It was chaos\"", "summary": "The Walpurgis celebrations became rowdy in several parts of the country. In Stockholm, thousands of young people gathered in Rålambshovsparken, and in healthcare there is evidence of unusually high pressure with many young people needing emergency help after alcohol and drug addiction. - It was chaos. There were more patients than usual on the eve of Valborg Fair and the night of May 1, says Kerstin Adestedt, unit manager at Maria Ungdom's emergency and round-the-clock care. According to her, the number of people registered increased sharply during the night. - You can almost say that we doubled the number of patients from approximately 30-35 to 51 patients, she says. Up to 20,000 young people in the park The Valborg celebration in Rålambshovsparken was characterized by drunkenness, rockets and firecrackers. The police estimate that between 15,000 and 20,000 young people were in the park during the evening and night. - We have not seen this large gathering of young people in one and the same place, where we had young people from the entire Stockholm region who gathered in Rålambshovsparken, says Ola Åkesson, municipal police in Kungsholmen. Similar situations were also reported from other parts of the country. In Scania, care was forced to bring in extra staff to deal with the influx of young people who had been drinking or taking drugs. - The number who came in because they had poisoned themselves was more than triple. There were around 20 of them, says Katinka Holgersson, head of unit at the children's intensive care unit at Skåne University Hospital in Malmö. The sharp call The warm weather and the easy access to alcohol, including via social media, are highlighted as contributing factors to the rowdy celebration in Stockholm. Ahead of the upcoming Walpurgis celebrations, the police are now issuing a clear call to parents. - I think that as a parent of a teenager, you really have to think about: Should you allow your young people to celebrate Walborg at this type of event or party context? If you allow it - then of course we want even more adults out there, says Ola Åkesson, municipal police in Kungsholmen.", "title_original": "Ovanligt många unga behövde vård på valborg: ”Det var ett kaos”", "summary_original": "Valborgsfirandet blev stökigt på flera håll i landet. I Stockholm samlades tusentals ungdomar i Rålambshovsparken, och inom vården vittnar man om ett ovanligt högt tryck med många unga som behövde akut hjälp efter alkohol- och drogpåverkan. – Det var ett kaos. Det var fler patienter än vanligt på Valborgsmässoafton och natten till den 1 maj, säger Kerstin Adestedt, enhetschef på Maria Ungdoms akut- och heldygnsvård. Enligt henne ökade antalet inskrivna kraftigt under natten. – Man kan nästan säga att vi dubblade patientantalet från ungefär 30-35 till 51 patienter, säger hon. Upp till 20 000 ungdomar i parken Valborgsfirandet i Rålambshovsparken präglades av fylla, raketer och smällare. Polisen uppskattar att mellan 15 000 och 20 000 ungdomar befann sig i parken under kvällen och natten. – Vi har inte sett den här stora samlingen av ungdomar på en och samma plats, där vi hade ungdomar från hela region Stockholm som samlades i Rålambshovsparken, säger Ola Åkesson, kommunpolis på Kungsholmen. Liknande situationer rapporterades även från andra delar av landet. I Skåne tvingades vården ta in extrapersonal för att hantera inflödet av unga som druckit eller tagit droger. – Antalet som kom in för att de hade förgiftat sig var mer än det tredubbla. Det rörde sig om runt 20 stycken, säger Katinka Holgersson, enhetschef på barnakuten vid Skånes universitetssjukhus i Malmö. Skarpa uppmaningen  Det varma vädret och den enkla tillgången till alkohol, bland annat via sociala medier, lyfts fram som bidragande orsaker till det stökiga firandet i Stockholm. Inför kommande valborgsfiranden går polisen nu ut med en tydlig uppmaning till föräldrar. – Jag tror att man som tonårsförälder verkligen får fundera på: Ska man tillåta sina ungdomar att fira valborg vid den här typen av tillställningar eller festsammanhang? Om man tillåter det – då vill vi ju självklart ha ännu fler vuxna där ute, säger Ola Åkesson, kommunpolis på Kungsholmen.", "link": "https://www.tv4.se/artikel/1yAKzWhacCpPCKNZmCvseR/ovanligt-manga-unga-behoevde-vard-pa-valborg-det-var-ett-kaos", "date_display": "2026-05-04", "date_iso": "2026-05-04T20:32:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/valborg", "/polisen"]}, {"id": 135, "title": "Julia Franzén says yes to \"the big, good ice cream\": \"Fun\"", "summary": "In SVT's \"Married at First Sight\", four couples get married without having seen their future wives or husbands beforehand. One of the couples who have been matched together during this year's season is Amanda and Sébastian.\n\nIn tonight's episode, Amanda says that her new husband sometimes jokes that he wants to eat her \"big, good ice cream\". However, Sébastian's rewriting of oral sex is not something she appreciates, and she is glad that he says to stop.\n\n- I didn't want to make a joke of it, but felt that I really wanted to show: \"Thank you, it's something I want you to stop doing,\" says Amanda in the program. \"Riligt\" \"Updajt\" is the after-snack program where various media profiles are invited to discuss the latest in \"Married at First Sight\". The first topic that is brought up is the ice cream rewriting and the TV profile Julia Franzén is asked what she would have done if her fiance Bingo Rimér said he wanted to eat her \"big ice cream\". - I just thought it was funny, she says. - I think you should say everything you think. You have to test joke sometimes and see if it's fun and you have to be able to do that with your partner. The \"Update\" panel also includes this year's GVFÖ participant Henrik. He believes that it can be something you say when you've been together for a while, but that the rewriting might not be something you necessarily start on. - Am I the only one who gets a little sissy vibes? You know, books like that... \"Your breasts are like raspberries.\" Must be allowed to joke Julia Franzén thinks it's perfectly okay to think that the joke crosses the line, but that maybe you're not quite right for each other as a couple. - Not being allowed to joke, that's a big part of who you are. It feels like he is being limited in his personality, she says.", "title_original": "Julia Franzén säger ja till ”den stora, goda glassen”: ”Roligt”", "summary_original": "I SVT:s ”Gift vid första ögonkastet” gifter sig fyra par utan att i förväg ha sett sina blivande fruar eller makar. Ett av paren som matchats ihop under årets säsong är Amanda och Sébastian.\n\nI kvällens avsnitt berättar Amanda att hennes nya man ibland skämtar om att han vill äta hennes ”stora, goda glass”. Sébastians omskrivning av oralsex är dock inget hon uppskattar och hon är glad över att han säger att han ska sluta.\n\n– Jag ville inte skämta bort det, utan kände att jag verkligen ville visa: ”Tack, det är något jag vill att du slutar göra”, säger Amanda i programmet. ”Roligt” ”Updejt” är eftersnacksprogrammet där olika medieprofiler bjuds in för att diskutera det senaste i ”Gift vid första ögonkastet”. Det första ämnet som tas upp är glass-omskrivningen och tv-profilen Julia Franzén får frågan vad hon hade gjort om hennes fästman Bingo Rimér sagt att han ville äta hennes ”stora glass”. – Jag hade bara tyckt att det var roligt, säger hon. – Jag tycker att man ska säga allt man tänker. Man måste testskämta ibland och se om det är kul och det måste man kunna göra med sin partner. I ”Updejt”-panelen finns också årets GVFÖ-deltagare Henrik. Han menar att det kan vara något man säger när man har varit tillsammans ett tag, men att omskrivningen kanske inte är något man nödvändigtvis går i gång på. – Är det bara jag som får lite tantsnusk-vibbar? Ni vet, såna böcker... ”Dina bröst är som hallon.” Måste få skämta Julia Franzén tycker att det är helt okej att tycka att skämtet går över gränsen, men att man kanske då inte är helt rätt för varandra som par. – Att inte få skämta, det är ju en stor del av den man är. Det känns som att han blir begränsad i sin personlighet, säger hon.", "link": "https://www.tv4.se/artikel/FF09DjW5r0irYUZwPIe8K/julia-franzen-saeger-ja-till-den-stora-goda-glassen-roligt", "date_display": "2026-05-04", "date_iso": "2026-05-04T20:15:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/gift-vid-forsta-ogonkastet", "/svt", "/relationer", "/karlek"]}, {"id": 136, "title": "There is a battle going on about the writing of history", "summary": "", "title_original": "Det pågår en strid om historieskrivningen", "summary_original": "", "link": "https://www.tv4.se/artikel/259lHQq9VKde3hdgRhhQ0R/det-pagar-en-strid-om-historieskrivningen", "date_display": "2026-05-04", "date_iso": "2026-05-04T20:13:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes"]}, {"id": 137, "title": "Russian soldiers walked into the hackers' satellite trap - exposing thousands of positions", "summary": "Russian soldiers were tricked by Ukrainian hackers when they tried to bypass the blockade of the Starlink satellite network, The Times reports. In the search for internet connection, they walked into a darknet trap. Suddenly, Ukraine could track thousands of Russian positions to strike with drones.", "title_original": "Ryska soldater gick i hackarnas satellitfälla – avslöjade tusentals positioner", "summary_original": "Ryska soldater lurades av ukrainska hackare när de försökte kringgå blockaden av satellitnätverket Starlink, rapporterar The Times. I jakten på internetuppkoppling gick de i en darknet-fälla. Plötsligt kunde Ukraina spåra tusentals ryska positioner för att slå till med drönare.", "link": "https://www.dn.se/varlden/ryska-soldater-gick-i-hackarnas-satellitfalla-avslojade-tusentals-positioner/", "date_display": "2026-05-04", "date_iso": "2026-05-04T20:10:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Met the child in court – eleven years after the mother's murder", "summary": "The trial began on Monday in Attunda district court. The accused 51-year-old man was seemingly unmoved but took notes intensively at times when prosecutor Vida Paridad presented the so-called circumstantial evidence against him. Next to him was the same lawyer who represented him already eleven years ago when he was arrested immediately after the murder, but after just over a year the charges against him were dismissed. On the other side of the courtroom sat the couple's one common child, now grown, who eleven years ago was taken into the care of social authorities after the mother was murdered and the father arrested. Was newly in love with a new man The murder occurred on Friday, January 23, 2015. The victim, a 38-year-old woman who wanted to divorce the 51-year-old, had then gone to the man's home in Sigtuna to talk about the separation. Something which, according to the prosecutor, was also part of the motive for the murder. - At the end of September 2014 (the woman) wanted to break off the relationship and sometime in October she moved out of their house. She had started a new relationship with a new man. They were newly in love, says Vida Paridad during the statement. - (The 51-year-old) took the separation hard and even harder when he learned that (the woman) had a new husband. After the visit to the man's home, the mother of two disappeared. Worried friends went to the 51-year-old's home the next morning and asked where the woman was. - When they asked, (the 51-year-old) broke down. He raved about suicide and \"I know where she is\", says Vida Paridad further during the presentation of the case. The friends later found the woman's car unlocked at Sigtunafjärden and called 112. On a pier was the hood of her jacket, which according to forensics had been pulled or torn off with force, and there was a hole in the ice. The 38-year-old woman was dead in the ice wake. - (The woman) did not have an accident, did not take her own life, but was murdered by (the husband), says Vida Paridad. The strange behavior the week before The prosecutor also went through a large amount of text messages between the couple and people close to them, which should show that the 51-year-old could not accept the divorce", "title_original": "Mötte barnet i rätten – elva år efter mordet på mamman", "summary_original": "Rättegången inleddes på måndagen i Attunda tingsrätt. Den åtalade 51-årige mannen var till synes oberörd men antecknade stundtals intensivt när åklagare Vida Paridad presenterade den så kallade indiciebevisningen mot honom. Bredvid honom fanns samma advokat som företrädde honom redan för elva år sedan när han direkt efter mordet greps men efter drygt ett år fick misstankarna mot sig avskrivna. På andra sidan rättssalen satt parets ena gemensamma barn som nu blivit vuxet, och som för elva år sedan blev omhändertagen av sociala myndigheter efter att mamman mördats och pappan gripits. Var nykär med ny man Mordet inträffade fredagen den 23 januari 2015. Offret, en 38-årig kvinna som ville skilja sig från 51-åringen, hade då åkt hem till mannen i Sigtuna för att prata om separationen. Något som enligt åklagaren också var en del av motivet till mordet. – I slutet av september 2014 ville (kvinnan) bryta relationen och någon gång i oktober flyttade hon från deras hus. Hon hade inlett en ny relation med en ny man. De var nykära, säger Vida Paridad under sakframställan. – (51-åringen) tog separationen hårt och ännu hårdare när han fick veta att (kvinnan) hade en ny man. Efter besöket i mannens bostad försvann tvåbarnsmamman. Oroliga vänner tog sig morgonen därpå hem till 51-åringen och frågade var kvinnan var. – När de frågade bröt (51-åringen) ihop. Han yrade om självmord och ”jag vet var hon är”, säger Vida Paridad vidare under sakframställan. Vännerna hittade senare kvinnans bil olåst vid Sigtunafjärden och larmade 112. På en brygga låg hennes jackas huva, som enligt kriminaltekniker hade ryckts eller slitits av med kraft, och i isen fanns ett hål. I isvaken låg den 38-åriga kvinnan död. – (Kvinnan) har inte råkat ut för en olycka, inte tagit sitt liv, utan blivit mördad av (maken), säger Vida Paridad. Kusliga agerandet veckan innan Åklagaren gick även igenom en större mängd sms mellan paret och personer i deras närhet som ska visa att 51-åringen inte kunnat acceptera skilsmässan. Dessutom ska en annan del av motivet vara ekonomiskt, enligt åklagaren. – (51-åringen) har också ekonomiska bekymmer, säger Vida Paridad och förklarar att mannen gick till banken för att ta över bostadslånet men fick avslag. Han fick senare ut två miljoner kronor från hustruns livförsäkring. Den 15 januari ska 51-åringen, enligt uppgifter i utredningen, ha velat prata med kvinnan på samma brygga – och då ljugit till henne att han fått en obotlig cancerdiagnos och skulle dö. I samband med det upptäckte kvinnan en isvak vid platsen, enligt samma uppgifter. – Drygt en vecka innan brottet (den 23 januari) ska (kvinnan) ha berättat att, trots att det blåste och stormade, (51-åringen) ville få ut henne till bryggan. (Kvinnan) tyckte det var en dålig idé, hon hade ändå följt med ut till den här bryggan. Isvaken hade skrämt henne och hon tänkte att nu skulle något hända, säger Vida Paridad. – Det visade sig att (51-åringen) aldrig haft cancer. Att (kvinnan) var mycket omskakad av uppgifter om cancer är väldigt tydligt. Hon hade ändå för avsikt att lämna (mannen). Den 23 januari följde hon återigen med ut på bryggan, enligt åklagaren. Den gången blev hon dränkt. Den åtalade mannen har, precis som under 2015, bestämt nekat till anklagelserna.", "link": "https://www.tv4.se/artikel/4StAEtxfrwU0YBuLPep8uB/moette-barnet-i-raetten-elva-ar-efter-mordet-pa-mamman", "date_display": "2026-05-04", "date_iso": "2026-05-04T19:23:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/sigtuna", "/mord"]}, {"id": 139, "title": "Djurgården's kross - supporter protest against IFK", "summary": "Djurgården crushed the crisis team IFK Göteborg in the Allsvenskan and won 6–0. The Gothenburg supporters chose to turn their backs on the pitch at the end of the match. - You feel that you are not making the club brand worthy, says Gothenburg's Tobias Heintz to TV4.", "title_original": "Djurgårdens kross – supporterprotest mot IFK", "summary_original": "Djurgården krossade krislaget IFK Göteborg i allsvenskan och vann med 6–0. Göteborgssupportrarna valde att vända ryggen mot planen i slutet av matchen. – Man känner att man inte gör klubbmärket värdigt, säger Göteborgs Tobias Heintz till TV4.", "link": "https://www.dn.se/sport/djurgardens-kross-supporterprotest-mot-ifk/", "date_display": "2026-05-04", "date_iso": "2026-05-04T19:10:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Djurgården's crush - then the supporters protested against IFK", "summary": "While Djurgården's players and supporters celebrated the 6-0 victory - which broke a three-match winless streak - with wide smiles, it was the opposite at IFK Gothenburg. Not a single victory for last year's Allsvenskan series four and completely played out in 3 arenas against Djurgården. At the end of the match, IFK Gothenburg's visiting heel chose to demonstratively turn his back on the pitch. That's the hardest part, we have such good supporters, they travel all the way here and sing for 90 minutes, it's a big disappointment that we can't give anything back, says Heintz. Already after just over half an hour, Djurgården had won the match. The home team then led 3–0 and Djurgården's supporters mocked their opponents with the chant \"Blue and white are leaving\". Refused interview Djurgården took hold of the match from the first minute and were superior against a faded Gothenburg. Jeppe Okkels scored 1–0 with the left after a neat breakthrough in his first start of the season. The Dane was also behind the 2–0 goal that Patric Åslund scored after Gothenburg goalkeeper Elis Bishesari directed the cross from Okkels right in front of Åslund's feet. Three minutes later, in the 34th minute, Kristian Lien headed in 3–0. We are unintensive, passive and cowardly with the ball. If you want to watch football, it's better to do it from the stands than from the pitch, says IFK Gothenburg's coach Stefan Billborn to TV4 about the first half. After the match, a pressured and criticized Billborn did not want to appear for any interview with TV4.  After a slightly better start to the second half, everything came crashing down when Patric Åslund scored his second goal of the evening to make it 4-0 in the 62nd minute. \"Completely different energy\" Joel Asoro then replaced Åslund - and scored two goals in his substitution. We dominated from the first minute to the 90th. We come in with a completely different energy, we have had a hard time in the last third, shoot the goals will come, says Asoro. Djurgården's build-up ahead of the hot derby against AIK on Sunday could not have been better. There is nothing better than winning, says Asoro. Halmstad has not won in Allsvenska either", "title_original": "Djurgårdens kross – då protesterade supportrarna mot IFK", "summary_original": "Medan Djurgårdens spelare och supportrar firade 6–0-segern – som bröt en tre matcher lång svit utan seger – med breda leenden var det tvärtom hos IFK Göteborg. Inte en enda seger för fjolårets allsvenska seriefyra och helt utspelade på 3 arena mot Djurgården. I slutet av matchen valde IFK Göteborgs tillresta klack att demonstrativt vända ryggen mot planen. Det är det mest jobbiga, vi har så bra supportrar, de reser hela vägen hit och sjunger i 90 minuter, det är en stor besvikelse att vi inte kan ge något tillbaka, säger Heintz. Redan efter dryga halvtimmen hade Djurgården vunnit matchen. Då ledde hemmalaget med 3–0 och Djurgårdens supportrar hånade sina motståndare med ramsan ”Blåvitt åker ur”. Vägrade intervju Djurgården tog tag i matchen från första minuten och var överlägset mot ett blekt Göteborg. Jeppe Okkels sköt 1–0 med vänstern efter ett snyggt genombrott i sin första start för säsongen. Dansken låg också bakom 2–0-målet som Patric Åslund gjorde sedan Göteborgs målvakt Elis Bishesari styrt inlägget från Okkels rakt framför fötterna på Åslund. Tre minuter senare, i 34:e minuten, nickade Kristian Lien in 3–0. Vi är ointensiva, passiva och fega med bollen. Ska man titta på fotboll är det bättre att göra det från läktaren än från planen, säger IFK Göteborgs tränare Stefan Billborn till TV4 om första halvlek. Efter matchen ville inte en pressad och kritiserad Billborn ställa upp på någon intervju med TV4.  Efter en något bättre start på andra halvlek rasade allt samman när Patric Åslund gjorde sitt andra mål för kvällen fram till 4–0 i 62:a minuten. ”Helt annan energi” Joel Asoro ersatte sedan Åslund – och gjorde två mål i sitt inhopp. Vi dominerade från första minut till 90:e. Vi kommer in med helt annan energi, vi har haft svårt i sista tredjedelen, sköt att målen kommer, säger Asoro. Djurgårdens uppladdning inför heta derbyt mot AIK på söndag kunde inte ha varit bättre. Det finns inget bättre än vinst, säger Asoro. Halmstad har inte heller vunnit i allsvenskan denna säsong. Tabelljumbon föll med 1–3 hemma mot Brommapojkarna och står kvar på två poäng.", "link": "https://www.tv4.se/artikel/tt-260504-allsvdjurgarden1-444d5baf/djurgardens-kross-supporterprotest-mot-ifk", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:56:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/goteborg", "/sverige", "/halmstad", "/halland", "/ifk-goteborg", "/tv4", "/fotboll"]}, {"id": 141, "title": "Johanna Frändén: A Swede in the Champions League final is a huge thing", "summary": "On Tuesday evening, Viktor Gyökeres can become only the sixth Swede to reach the final in the Champions League. Not bad for a striker who has been mostly reviled since arriving in England last summer.", "title_original": "Johanna Frändén: En svensk i Champions League-final är en jättegrej", "summary_original": "Under tisdagskvällen kan Viktor Gyökeres bli blott sjätte svensk att ta sig till final i Champions League. Inte illa för en anfallare som mest blivit utskälld sedan han kom till England förra sommaren.", "link": "https://www.dn.se/sport/johanna-franden-en-svensk-i-champions-league-final-ar-en-jattegrej/", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:55:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "American general: Trump has painted himself into a corner", "summary": "General Ben Hodges, former European commander, says the Trump administration has painted itself into a corner with the Iran war.", "title_original": "Amerikansk general: Trump har målat in sig i ett hörn", "summary_original": "Generalen Ben Hodges, tidigare Europakommendör, säger att Trumpadministrationen har målat in sig i ett hörn med Irankriget.", "link": "https://www.dn.se/varlden/amerikansk-ex-general-trump-har-malat-in-sig-i-ett-horn/", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:53:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Gathering in the church - to watch the World Cup: \"Expecting a great dawn\"", "summary": "When Sweden's men's national team steps into the World Cup, a match awaits in the middle of the night. In Halland, Harplinge church chooses to face it in its own way by opening the gates and showing the match in the church room, something that Hallandsposten was the first to report on. - To the highest degree, there will be football in Harplinge church. We count on the rush of joy so there is no need for further intoxication, says vicar Peder Jarnvall. The initiative is about both football and community. According to Jarnvall, the response from the local community has been clear. - Overall, people are very positive about it, he says. Wants to lower the threshold to the church By inviting people to watch the World Cup together, the congregation also hopes that more people will dare to take the step into the church. - I think that for many it is about the feeling of daring to find your way into the room. It is often said that the way into the church can have a high threshold for many.  The premiere match against Tunisia is played early in the morning, but the vicar still expects a good atmosphere. - We expect a peak dawn, says Jarnvall. However, watching national team football in Harplinge church means different seating conditions than in a pub or on the TV sofa. - You could say it will be a little harder. There will also be wooden hours in the 19th-century benches, so it is recommended to bring your own pillow. \"We will work forward\" However, there will be no special prayers for a Swedish victory. - As in all great struggles, it is not so much the heavenly help that we must count on, but we must work forward. Listen to what Graham Potter talks about, the importance of having fun - then you also work best, he says. For Peder Jarnvall, the initiative contains a bigger message than the actual result on the field. - The setting, community in the church room, it also sets a signal for what is needed to keep people together as well. We can cross borders, we are not so different and we share the same joy.", "title_original": "Samlas i kyrkan – för att se VM: ”Räknar med en toppengryning”", "summary_original": "När Sveriges herrlandslag kliver in i fotbolls‑VM väntar match mitt i natten. I Halland väljer Harplinge kyrka att möta det på sitt eget sätt genom att slå upp portarna och visa matchen i kyrkorummet, något som Hallandsposten var först med att rapportera om. – I allra högsta grad blir det fotboll i Harplinge kyrka. Vi räknar med glädjeruset så det behövs ingen ytterligare berusning, säger kyrkoherde Peder Jarnvall. Initiativet handlar både om fotboll och gemenskap. Enligt Jarnvall har responsen från lokalsamhället varit tydlig. – Överlag är människor väldigt positiva till det, säger han. Vill sänka tröskeln till kyrkan Genom att bjuda in till gemensamt VM‑tittande hoppas församlingen också att fler ska våga ta steget in i kyrkan. –Jag tror att det för många handlar om känslan av att våga hitta in i rummet. Det talar man ofta om, att vägen in i kyrkan kan ha en hög tröskel för många.  Premiärmatchen mot Tunisien spelas tidigt på morgonen, men kyrkoherden räknar ändå med god stämning. – Vi räknar med en toppengryning, säger Jarnvall. Att se landslagsfotboll i Harplinge kyrka innebär dock andra sittvillkor än på pub eller i tv‑soffan. – Det blir lite hårdare kan man väl säga. Det blir trätimmar också i 1800-talsbänkarna, så en egen kudde är rekommenderat att ta med sig. ”Vi ska jobba framåt” Några särskilda böner om svensk seger blir det dock inte. – Som i alla stora kamper så är det inte så mycket den himmelska hjälpen vi ska räkna med, utan vi ska jobba framåt. Lyssna in vad Graham Potter pratar om, vikten av att ha roligt – då jobbar man också bäst, säger han. För Peder Jarnvall rymmer initiativet ett större budskap än själva resultatet på planen. – Inramningen, gemenskap i kyrkrummet, det sätter också en signal för det som behövs för att hålla samman människor också. Vi kan ta oss över gränserna, vi är inte så himla olika och vi delar samma glädje.", "link": "https://www.tv4.se/artikel/64js2tpvIIAeE2rGvTxHQF/samlas-i-kyrkan-foer-att-se-vm-raeknar-med-en-toppengryning", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:35:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/kyrkan", "/svenska-kyrkan", "/fotbolls-vm-2026"]}, {"id": 144, "title": "More people want to see risky play at school: \"It has to go wrong sometimes\"", "summary": "A new survey from Novus shows that 75 percent are positive about so-called risky play, such as climbing high or moving fast. Only a small percentage are negative. At the same time, nearly half of the respondents want to see more martial arts in school. That is, games where children can wrestle, chase each other and use body contact. \"An arena for social training\" Pilo Stylin, sports consultant at the Swedish Budo and Martial Arts Federation, believes that the interest is not surprising. - This is perhaps the best arena for training social skills, he says. He describes fighting play as a combination of fighting, body contact and interaction. - These are games where you hunt, catch and putt quite lively and intense games. According to him, research shows that play fighting does not lead to more violence, quite the opposite. Through physical play, children learn to read body language, interpret emotions and interact with others. Concerns about injuries and exclusion At the same time, there are critics who warn of the risks. They believe that more physical play can lead to injuries, conflicts and that some children end up outside. But Pilo Stylin emphasizes that risks are a natural part of children's development. - It must be allowed to go wrong sometimes, so that the children learn to manage their own and other people's emotions, he says. He also highlights the importance of differentiating between play fighting and so-called prank fights, which are more often connected to power plays and bullying. - Fundamental to all play is that it is based on free will and reciprocity. Want to create safe structure The project \"Fighting in school\" has been developed to show how organized fighting can work in a school environment, with clear rules and adult presence. The goal is to create a safe environment where children have the opportunity to challenge themselves - both physically and socially.", "title_original": "Fler vill se riskfylld lek i skolan:  ”Det måste få gå fel ibland”", "summary_original": "En ny undersökning från Novus visar att 75 procent är positiva till så kallad riskfylld lek, som att klättra högt eller röra sig snabbt. Bara en liten andel är negativa. Samtidigt vill nära hälften av de tillfrågade se mer kamplek i skolan. Det vill säga lekar där barn får brottas, jaga varandra och använda kroppskontakt. ”En arena för social träning” Pilo Stylin, idrottskonsulent vid Svenska budo- och kampsportsförbundet, menar att intresset inte är förvånande. – Det här är kanske den bästa arenan för att träna sociala förmågor, säger han. Han beskriver kamplek som en kombination av kamp, kroppskontakt och samspel. – Det är lekar där man jagar, fångar och puttas ganska livliga och intensiva lekar. Enligt honom visar forskning att kamplek inte leder till mer våld, snarare tvärtom. Genom fysisk lek lär sig barn att läsa av kroppsspråk, tolka känslor och samspela med andra. Oro för skador och utanförskap Samtidigt finns det kritiker som varnar för riskerna. De menar att mer fysisk lek kan leda till skador, konflikter och att vissa barn hamnar utanför. Men Pilo Stylin betonar att risker är en naturlig del av barns utveckling. – Det måste få gå fel ibland, så att barnen lär sig hantera sina egna och andras känslor, säger han. Han lyfter också vikten av att skilja på kamplek och så kallat skojbråk, som oftare kopplas till maktlekar och mobbning. – Grundläggande för all lek är att den bygger på fri vilja och ömsesidighet. Vill skapa trygg struktur Projektet ”Kamplek i skolan” har tagits fram för att visa hur organiserad kamplek kan fungera i skolmiljö, med tydliga regler och vuxennärvaro. Målet är att skapa en trygg miljö där barn får möjlighet att utmana sig själva – både fysiskt och socialt.", "link": "https://www.tv4.se/artikel/17QQnufuYwUzQiJk7oPUpV/fler-vill-se-riskfylld-lek-i-skolan-kamplek-vaecker-debatt", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:05:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/ungdomar", "/barn", "/idrott", "/skola", "/kampsport"]}, {"id": 145, "title": "Learning platform hacked - millions of personal data reportedly leaked", "summary": "The Canvas learning platform used by several Swedish universities has been hacked. Personal data for 275 million users is said to have been leaked. \n\n\"We are working to create a picture of the extent of the leak and are actively working to minimize it,\" writes the company Instructure in a press release. The leak was discovered on Friday and is now said to be under control. \n\nAccording to the company, the hackers have, among other things, come across names and email addresses. \"So far we cannot see that any passwords, social security numbers or financial information have been leaked\". \"Afraid that all information may be cleared\" According to Tony Ottosson Gadd, IT manager at the University of Gothenburg, the security problems should be fixed - but at the moment it is not possible to confirm the extent of the incident or whether the hacker group's information is correct.\nThe University of Gothenburg plans to report the incident to the Swedish Data Protection Agency (IMY) and will also inform any victims. - It is clear that victims must be informed quickly, but right now we do not know what information may have actually been leaked. We fear that all information may be cleared, but we cannot assess the whole yet, says Tony Ottosson Gadd.\n\nThe platform is used by over 30 Swedish universities and colleges. Although the platform should not contain sensitive personal data, names and e-mail addresses in themselves may pose risks. - Such information can be used in other ways, for example resold or used for other attacks, says Tony Ottosson Gadd. Canvas also has functions where students can communicate with each other. As previously mentioned, the system is not built to handle sensitive information - but at the same time, it cannot be guaranteed that such information does not appear in the chats. Young western hacker group ShinyHunters, which took responsibility for the leak, writes that they have come across 3.65 terabytes of data containing information on 275 million students from 9,000 educational institutions.  - They are behind many other attacks. It's a mare", "title_original": "Lärplattformen hackad – miljoner personuppgifter uppges ha läckt", "summary_original": "Lärplattformen Canvas som används av flera svenska universitet har hackats. Personuppgifter för 275 miljoner användare uppges ha läckt. \n\n”Vi arbetar för att skapa oss en bild av omfattningen av läckan och jobbar aktivt för att minimera den”, skriver företaget Instructure i ett pressmeddelande. Läckan upptäcktes i fredags och uppges nu vara under kontroll. \n\nEnligt företaget har hackarna bland annat kommit över namn och mejladresser. ”Så här långt kan vi inte se att några lösenord, personnummer eller finansiell information har läckt”. ”Befarar att all information kan vara röjd” Enligt Tony Ottosson Gadd, IT-chef vid Göteborgs universitet, ska säkerhetsproblemen vara åtgärdade – men i nuläget går det inte att bekräfta omfattningen av incidenten eller om hackergruppens uppgifter stämmer.\nGöteborgs universitet planerar att anmäla händelsen till Integritetsskyddsmyndigheten (IMY) och kommer även att informera eventuellt drabbade. – Det är tydligt att drabbade ska informeras skyndsamt, men just nu vet vi inte vilken information som faktiskt kan ha läckt. Vi befarar att all information kan vara röjd, men vi kan inte bedöma helheten ännu, säger Tony Ottosson Gadd.\n\nPlattformen används av över 30 svenska universitet och högskolor. Även om plattformen inte ska innehålla känsliga personuppgifter kan namn och e-postadresser i sig innebära risker. – Sådan information kan användas på andra sätt, till exempel säljas vidare eller användas för andra attacker, säger Tony Ottosson Gadd. På Canvas finns även funktioner där studenter kan kommunicera med varandra. Systemet är, som tidigare nämnt, inte byggt för att hantera känslig information – men samtidigt går det inte att garantera att sådan information inte förekommer i chattarna. Ung västerländsk hackergrupp Hackergruppen ShinyHunters, som tagit på sig läckan, skriver att de har kommit över 3.65 terabyte av data med information om 275 miljoner studenter från 9 000 läroinstitut.  – De ligger bakom många andra angrepp. Det är ett stort kollektiv, säger Marcus Murray, cybersäkerhetsexpert. Han beskriver gruppen som sammansatt av många personer från västvärlden, och att den till stor del består av unga – något som är relativt ovanligt i den här typen av sammanhang. – De jobbar främst med informationsstölder. De stjäl data och pressar sedan organisationer på pengar för att inte publicera materialet, säger han.", "link": "https://www.tv4.se/artikel/V7MDWOci4JOTQ6jp2Gg18/laerplattformen-hackad-miljoner-personuppgifter-uppges-ha-laeckt", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:03:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/brott-och-straff", "/larare", "/losenordslackan", "/skola", "/hackerattack", "/hackare"]}, {"id": 146, "title": "Wild joy after bloody revenge: \"Dizzy in the head\"", "summary": "Ahead of Monday's merger competition, Lasse Lundholm is clear that he needs immunity in order to remain in the program. He comes from a tough period in Team Nord, where he has not always gotten along with his teammates.\n\n- I have been very depressed at times and positive at times, he says in the program.\n\nFor TV4 Nyheterna, he tells that he felt: \"Now, damn it, I'm going to show you where the cabinet should be.\"\n\n- I'm going to throw myself up the nets and up these balance lines, even though I've replaced both my hips, he says. \"Smack, just saying\" And that's exactly how it happened. Lasse Lundholm was last through the obstacle course, but best at getting the fire going. He beat his opponents by a good margin and was rewarded with a super immunity.\n\n- You know, I just: \"Holy shit, then\", he says in the program.\n\nBut as he rolled down the net, he hit his head straight into a bamboo log.\n\n- I measure that log correctly with my head. Smack, just says it. I see stars in my head and feel that I just have to bite the bullet, he says. About the hate on social media Lasse Lundholm says that the production asked if they would cancel the competition and if he needed to be patched.\n\n- No, hell no, I say. Just drive, like.\n\nHe thinks he may have had a concussion, but that it wasn't something he thought about at the time.\n\n- I was very dizzy. In retrospect, the victory means a lot to Lasse Lundholm, who has had to face a backlash on social media when he was seen on television that he was not prepared for. - Sometimes you feel hung up on by all sorts of people who say: \"Ah, this buffalo Lasse\", \"this old man Lasse\" - and that I should go out. It's hello and whoa, and you get called an idiot and all that, he says. - You get a little sad. I have to say that it bothers me a bit. I eat myself, unfortunately.", "title_original": "Vild glädje efter blodig revansch: ”Jättesnurrig i huvudet”", "summary_original": "Inför måndagens sammanslagningstävling är Lasse Lundholm tydlig med att han behöver en immunitet för att kunna stanna kvar i programmet. Han kommer från en tuff period i lag Nord, där han inte alltid har kommit överens med sina lagkamrater.\n\n– Jag har varit väldigt deppig ibland och positiv ibland, säger han i programmet.\n\nFör TV4 Nyheterna berättar han att han kände: ”Nu jävlar ska jag visa var skåpet ska stå.”\n\n– Jag ska fan kasta mig uppför näten och upp för de här balansgångarna, fast att jag har bytt båda mina höfter, säger han. ”Smack, säger det bara” Och precis så blev det. Lasse Lundholm var sist genom hinderbanan, men bäst på att få i gång elden. Han slog sina motståndare med god marginal och belönades med en superimmunitet.\n\n– Du vet, jag bara: ”Holy shit, alltså”, säger han i programmet.\n\nMen när han rullade nedför nätet slog han huvudet rakt in i en bambustock.\n\n– Jag måttar ju den stocken rätt med huvudet. Smack, säger det bara. Jag ser stjärnor i huvudet och känner att det bara är att bita ihop, säger han. Om hatet på sociala medier Lasse Lundholm berättar att produktionen frågade om de skulle avbryta tävlingen och om han behövde plåstras om.\n\n– Nej, nej för fan, säger jag. Bara kör, liksom.\n\nHan tror att han kan ha fått en hjärnskakning, men att det inte var något han tänkte på där och då.\n\n– Jag var jättesnurrig i huvudet. Så här i efterhand betyder segern väldigt mycket för Lasse Lundholm som har fått möta ett gensvar på sociala medier när han synts i tv som han inte var beredd på. – Ibland känner man sig uthängd av alla möjliga som säger: ”Ah, den här buffeln Lasse”, ”den här gubben Lasse” – och att jag ska åka ut. Det är hej och hå, och man blir kallad idiot och allt sådant, säger han. – Man blir lite ledsen. Jag måste säga att jag blir lite störd av det. Jag tar åt mig, tyvärr.", "link": "https://www.tv4.se/artikel/2Dw271poYiWyqVyWenrN6D/vild-glaedje-efter-blodig-revansch-jaettesnurrig-i-huvudet", "date_display": "2026-05-04", "date_iso": "2026-05-04T18:00:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 147, "title": "Peter found viper in shopping cart: \"Acted on instinct\"", "summary": "When Peter Lönn from Stockholm visited the Dollarstore in Arboga, he had an unexpected sight: a viper in a shopping cart.\nBoth customers and staff became unsure of how to handle the situation, but Peter did not hesitate.  - I acted on instinct. The store was full of children and I had my own with me, he says. Rolled out the cart The snake lay still in the shopping cart, but the risk of it getting out into the store made Peter act. - I grabbed the cart and pulled it out of there. It couldn't stay inside, he says. He wheeled the cart out to the parking lot, away from the customers. Staff kept watch Once outside, several of the staff gathered around the cart and kept the snake under watch for around 10–15 minutes. The plan was to call in help to take care of it. But before anyone could get there, the situation had resolved itself. - According to the staff, it eventually went away by itself. It was a good ending for everyone, says Peter. Unclear how it got there How the viper got into the shopping cart is still unclear. - The carts are often outside near the grass. It may have been a hot day and it crawled up and laid there, he says. Thanks to the quick intervention, th
