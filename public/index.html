ord for the hard-to-understand oddball has made a truly strange journey.", "title_original": "Den svenska kufen har en udda historia", "summary_original": "Vardagsordet för den svårförstådde särlingen har gjort en i sanning märklig resa.", "link": "https://www.svd.se/a/k08lE9/den-svenska-kufen-har-en-udda-historia", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 81, "title": "We need more than surveillance cameras to feel safe", "summary": "The moderates must offer more than surveillance, says the columnist.", "title_original": "Vi behöver mer än övervakningskameror för att känna oss trygga", "summary_original": "Moderaterna måste erbjuda mer än övervakning, menar insändarskribenten.", "link": "https://www.sydsvenskan.se/malmo/vi-behover-mer-an-overvakningskameror-for-att-kanna-oss-trygga/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "New support for aviation - part of crisis package", "summary": "The government is now directing support to aviation, which is being pressured by high fuel prices.  \"It really is a crisis,\" says Elisabeth Svantesson.", "title_original": "Nytt stöd till flyget – del av krispaket", "summary_original": "Regeringen riktar nu ett stöd till flyget som pressas av höga bränslepriser.  ”Det är verkligen en kris”, säger Elisabeth Svantesson.", "link": "https://www.svd.se/a/y58v8r/regeringen-riktar-stodpaket-till-flygbranschen-pressas-av-branslepris", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:16:41+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 83, "title": "\"Flying police cars\" patrol NATO meeting", "summary": "Security is high when NATO's foreign ministers gather in Helsingborg. Patrols from several districts have been called in - and \"flying police cars\" monitor the city.", "title_original": "”Flygande polisbilar” patrullerar Natomöte", "summary_original": "Säkerheten är hög när Natos utrikesministrar samlas i Helsingborg. Patruller från flera distrikt har kallats in – och ”flygande polisbilar” övervakar staden.", "link": "https://www.svd.se/a/Wv7ln2/natomotet-flygande-polisbilar-patrullerar-i-helsingborg", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:11:04+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 84, "title": "It is time to put work and faith in the future first in Landskrona", "summary": "", "title_original": "Det är dags att sätta arbete och framtidstro först i Landskrona", "summary_original": "", "link": "https://www.hd.se/min-mening/det-ar-dags-att-satta-arbete-och-framtidstro-forst-i-landskrona/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:10:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "Mikael Damberg warns: Changes will be required", "summary": "The state must increase its tax revenues in the coming years to cope with all the commitments that lie ahead. The Social Democrats' finance minister candidate Mikael Damberg warns that changes will be required. - We don't have money for everything, he says.", "title_original": "Mikael Damberg varnar: Det kommer att krävas förändringar", "summary_original": "Staten måste öka sina skatteintäkter de kommande åren för att klara av alla åtaganden som väntar. Socialdemokraternas finansministerkandidat Mikael Damberg varnar för att det kommer att krävas förändringar. – Vi har inte pengar till allting, säger han.", "link": "https://www.dn.se/sverige/mikael-damberg-varnar-det-kommer-att-kravas-forandringar/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:08:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "\"Not NATO on top of everything\" - are you aware of the alliance in the culture?", "summary": "U-boats, Klas Östergren, buskis and Slovenian industrial rock. What do you know about NATO in culture?", "title_original": "”Inte Nato ovanpå allt” – har du koll på alliansen i kulturen?", "summary_original": "U-båtsjakter, Klas Östergren, buskis och slovensk industrirock. Vad kan du om Nato i kulturen?", "link": "https://www.hd.se/kultur/inte-nato-ovanpa-allt-har-du-koll-pa-alliansen-i-kulturen/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:05:08+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 87, "title": "The Netflix boss: \"'Je m'appelle Agneta' definitely has cultural canon qualities\"", "summary": "Jenny Stjernströmer Björk is Netflix's Nordic content manager. Despite the threat from social media, she believes in a future for longer storytelling. However, she does not give much for the proposed tax for streaming services. - We see a risk that the tax ultimately leads to increased costs for consumers, she tells DN.", "title_original": "Netflixchefen: ”’Je m'appelle Agneta’ har absolut kulturkanonkvaliteter”", "summary_original": "Jenny Stjernströmer Björk är Netflix nordiska innehållschef. Trots hotet från sociala medier tror hon på en framtid för det längre berättandet. Den föreslagna skatten för strömningstjänster ger hon dock inte mycket för. – Vi ser en risk att skatten i slutändan leder till ökade kostnader för konsumenter, säger hon till DN.", "link": "https://www.dn.se/kultur/netflixchefen-je-m-appelle-agneta-har-absolut-kulturkanonkvaliteter/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:04:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 88, "title": "Instead of CCS – think differently and reduce combustion", "summary": "", "title_original": "Istället för CCS – tänk nytt och minska förbränningen", "summary_original": "", "link": "https://www.hd.se/min-mening/istallet-for-ccs-tank-nytt-och-minska-forbranningen/", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:02:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 89, "title": "Huge increase in gonorrhea and syphilis – Sweden deviates", "summary": "Gonorrhea and syphilis have reached new high levels in Europe, new statistics from the European Infection Control Agency ECDC show. Congenital syphilis has nearly doubled in one year. But Sweden is going against the trend.", "title_original": "Jätteökning av gonorré och syfilis – Sverige avviker", "summary_original": "Gonorré och syfilis har nått nya höga nivåer i Europa, visar ny statistik från Europeiska smittskyddsmyndigheten ECDC. Medfödd syfilis har nära på fördubblats på ett år. Men Sverige går emot trenden.", "link": "https://www.svd.se/a/3p5j5v/jatteokning-av-gonorre-och-syfilis-sverige-avviker", "date_display": "2026-05-21", "date_iso": "2026-05-21T07:00:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 90, "title": "The TV manager on the \"GVFÖ\" scandal: \"Deeply regrets\"", "summary": "The testimonies of women who claim that they were raped by their husbands in \"Married at First Sight\" are now being commented on for the first time by the responsible television director.", "title_original": "Tv-chefen om ”GVFÖ”-skandalen: ”Beklagar djupt”", "summary_original": "Vittnesmålen från kvinnor som hävdar att de våldtagits av sina makar i ”Gift vid första ögonkastet” kommenteras nu för första gången av ansvariga tv-chefen.", "link": "https://www.sydsvenskan.se/noje/tv-chefen-om-gvfo-skandalen-beklagar-djupt/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:50:22+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 91, "title": "Half a billion in support for domestic aviation", "summary": "", "title_original": "Halv miljard i stöd till inrikesflyget", "summary_original": "", "link": "https://www.svd.se/a/zO4LAK/halv-miljard-i-stod-till-inrikesflyget", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:33:29+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 92, "title": "\"Fire in the skull\" of Netanyahu - after the conversation with Trump", "summary": "US President Donald Trump and Israeli Prime Minister Benjamin Netanyahu discussed a new peace proposal in a long and \"tense\" telephone conversation on Tuesday. The proposal was drawn up by Qatar and Pakistan with the support of several regional mediators and will try to \"bridge gaps\" between the US and Iran. According to three sources with access to information, Netanyahu must have been anything but happy after the conversation, Axios reports. A source told the newspaper that Netanyahu's \"head was on fire\" after the conversation. \"Bibi always worried\" Netanyahu is said to be very skeptical of the negotiations and wants to resume the war to further degrade Iran's military capabilities and weaken the regime by destroying its critical infrastructure. According to two sources, Netanyahu must have been very worried in the earlier stages of the negotiations.  - Bibi is always worried, says the source to the newspaper.  The prime minister reportedly wants to go to Washington in the coming weeks for a crisis meeting with Trump.  Want to start negotiations Behind the scenes, the mediators are working on a declaration of intent that both the US and Iran would sign to formally end the war and begin 30 days of negotiations on, among other things, Iran's nuclear program and the opening of the Strait of Hormuz, an American source told Axios. According to two Arab officials and an Israeli source, Qatar recently presented a new draft to the United States and Iran. An Arab official said a Qatari delegation visited Tehran earlier this week. At the same time, there are reports that Trump is considering a massive attack on Iran if no agreement is reached. \n\nAccording to Iran's Ministry of Foreign Affairs, Tehran demands that the United States cease what it calls \"hijacking of Iranian ships\" and release frozen funds in order for the talks to succeed.", "title_original": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summary_original": "USA:s president Donald Trump och Israels premiärminister Benjamin Netanyahu diskuterade på tisdagen ett nytt fredsförslag i ett långt och ”spänt” telefonsamtal. Förslaget är framtaget av Qatar och Pakistan med stöd av flera regionala medlare och ska försöka ”överbrygga klyftor” mellan USA och Iran. Enligt tre källor med insyn ska Netanyahu ha varit allt annat än glad efter samtalet, uppger Axios. En källa uppger för tidningen att det ”brann i skallen” på Netanyahu efter samtalet. ”Bibi alltid orolig” Netanyahu ska vara mycket skeptisk till förhandlingarna och vill återuppta kriget för att ytterligare försämra Irans militära kapacitet och försvaga regimen genom att förstöra dess kritiska infrastruktur. Enligt två källor ska Netanyahu har varit mycket orolig i tidigare skeden av förhandlingarna.  – Bibi är alltid orolig, säger källan till tidningen.  Premiärministern uppges vilja åka till Washington under de kommande veckorna för ett krismöte med Trump.  Vill inleda förhandlingar Bakom kulisserna arbetar medlarna med en avsiktsförklaring som både USA och Iran skulle underteckna för att formellt avsluta kriget och inleda 30 dagars förhandlingar om bland annat Irans kärnprogram och öppnandet av Hormuzsundet, uppger en amerikansk källa för Axios. Enligt två arabiska tjänstemän och en israelisk källa har Qatar nyligen lagt fram ett nytt utkast till USA och Iran. En arabisk tjänsteman uppger att en qatarisk delegation besökte Teheran i början av veckan. Samtidigt finns uppgifter om att Trump överväger ett massivt angrepp på Iran om ingen överenskommelse uppnås. \n\nEnligt Irans utrikesdepartement kräver Teheran att USA upphör med vad man kallar ”kapningar av iranska fartyg” och frigör frysta medel för att samtalen ska lyckas.", "link": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:30:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/usa", "/irankriget", "/israel", "/benjamin-netanyahu", "/donald-trump"]}, {"id": 93, "title": "Fredrik Sahlin: Football fever in Cannes ahead of this summer's WC", "summary": "CANNES. A new documentary draws a portrait of Eric Cantona. Fredrik Sahlin has met the peculiar football genius in Cannes and seen the optimal football documentary \"The match\", which revolves around the mythical match between Argentina and England in the 1986 football World Cup.", "title_original": "Fredrik Sahlin: Fotbollsfeber i Cannes inför sommarens VM", "summary_original": "CANNES. En ny dokumentär tecknar ett porträtt av Eric Cantona. Fredrik Sahlin har träffat det säregna bollsnillet i Cannes och sett den optimala fotbollsdokumentären ”The match” som kretsar kring den mytomspunna matchen mellan Argentina och England i fotbolls-VM 1986.", "link": "https://www.dn.se/kultur/fredrik-sahlin-fotbollsfeber-i-cannes-infor-sommarens-vm/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:27:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Helmerson: Here is Sweden's ugliest dialect (and it's not Stockholm)", "summary": "\"Kiss on the mouth,\" said the municipal employee in Hässleholm to me. Had she gone mad?", "title_original": "Helmerson: Här är Sveriges fulaste dialekt (och det är inte stockholmska)", "summary_original": "”Puss på munnen”, sa den kommunanställda i Hässleholm till mig. Hade hon blivit skvatt galen?", "link": "https://www.dn.se/kultur/helmerson-har-ar-sveriges-fulaste-dialekt-och-det-ar-inte-stockholmska/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:20:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Support package of half a billion for aviation", "summary": "The blockade of the Strait of Hormuz, through which much of the world's oil usually passes, has resulted in higher prices for jet fuel and major consequences for the aviation industry. Thousands of departures have been canceled and the airlines have worked with various types of adjustments. - The longer it goes on, the greater the consequences will be because it is more or less at a standstill in the Strait of Hormuz, says Finance Minister Elisabeth Svantesson (M) at a press conference. Support in three parts To meet the problem in aviation, the Tidöpartierna today presents a support package of SEK 520 million in measures in an extra amendment budget. The package is divided into three parts: the domestic flight, the fee system and regional medical transport.  - It is a very serious energy crisis, but the availability of aviation fuel is good in the short term. But we are not sitting around twiddling our thumbs, what we are announcing today is a strong package to be prepared, says Infrastructure and Housing Minister Andreas Carlson (KD). The plan is for part of the package to secure the availability of domestic flights throughout the country, at a cost of SEK 100 million. Traffic on existing lines must be able to be procured, but the measure may require approval from the European Commission.  - The price of aviation fuel has increased sharply, many airlines, especially in the Swedish domestic market, are already in a very difficult situation and are under financial pressure, says Andreas Carlson. The state must reduce the cost by SEK 46 The state is also proposed to step in and cover certain costs for the airlines, such as security checks and baggage, which is estimated to reduce the cost per passenger by SEK 46 per ticket and cost SEK 400 million. The measure would apply in the second half of 2026. - This is one of the fastest ways to reduce the costs of air travel in the short term, says Andreas Carlson. It is also proposed that the regions receive SEK 20 million in support to secure medical transport and ambulance flights.  - It is about transporting sick or injured patients", "title_original": "Stödpaket på halv miljard till flyget", "summary_original": "Blockeringen av Hormuzsundet, där en stor del av världens olja vanligtvis passerar, har resulterat i högre priser för flygbränsle och stora konsekvenser för flygbranschen. Tusentals avgångar har ställts in och flygbolagen har arbetat med olika typer av justeringar. – Ju längre det pågår, desto större konsekvenser får det eftersom det står mer eller mindre still i Hormuzsundet, säger finansminister Elisabeth Svantesson (M) på en pressträff. Ett stöd i tre delar För att möta problematiken i luftfarten presenterar Tidöpartierna i dag ett stödpaket på 520 miljoner kronor i åtgärder i en extra ändringsbudget. Paketet är uppdelat i tre delar: inrikesflyget, avgiftssystemet och regionala sjuktransporter.  – Det är en mycket allvarlig energikris men tillgången till flygbränsle är god på kort sikt. Men vi sitter inte och rullar tummarna utan det vi ger besked om i dag är ett kraftigt paket för att ha beredskap, säger infrastruktur- och bostadsminister Andreas Carlson (KD). Planen är att en del av paketet ska säkra tillgängligheten för inrikesflyget i hela landet, till en kostnad av 100 miljoner kronor. Trafik på befintliga linjer ska kunna upphandlas, men åtgärden kräver eventuellt ett godkännande från EU-kommissionen.  – Priset på flygbränsle har ökat kraftigt, många flygföretag, särskilt på den svenska inrikesmarknaden har redan ett mycket besvärligt läge och är ekonomiskt pressade, säger Andreas Carlson. Staten ska sänka kostnaden med 46 kronor Staten föreslås även gå in och täcka vissa kostnader för flygbolagen, som säkerhetskontroller och bagage, vilket beräknas sänka kostnaden per passagerare med 46 kronor per biljett och kosta 400 miljoner kronor. Åtgärden skulle gälla under andra halvåret av 2026. – Det här är ett av de snabbaste sätten att på kort sikt dämpa kostnaderna för flygresor, säger Andreas Carlson. Regionerna föreslås även få 20 miljoner kronor i stöd för att trygga sjuktransporter och ambulansflyg.  – Det handlar om transporter av sjuka eller skadade patienter. Det kan också handla om viktiga transporter för organtransplantation, säger Andreas Carlson.", "link": "https://www.tv4.se/artikel/27rUzvPBVJ30FBplaiqoOG/regeringen-presenterar-stoedpaket-till-flyget", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:15:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/regeringen", "/valet-2022/moderaterna", "/valet-2022/kristdemokraterna", "/valet-2022/liberalerna", "/valet-2022/sverigedemokraterna", "/flygresor", "/flygplan"]}, {"id": 96, "title": "Record low water levels - now the pressure on households to save is increasing", "summary": "The water crisis in northwestern Scania is worsening. Despite repeated warnings, households continue to use too much water. Now Sydvatten is putting pressure on residents to reduce their consumption - otherwise restrictions may be introduced.", "title_original": "Rekordlåga vattennivåer – nu ökar pressen på hushållen att spara", "summary_original": "Vattenkrisen i nordvästra Skåne förvärras. Trots upprepade varningar fortsätter hushållen att använda för mycket vatten. Nu sätter Sydvatten press på invånarna att minska sin förbrukning – annars kan restriktioner införas.", "link": "https://www.hd.se/helsingborg/rekordlaga-vattennivaer-nu-okar-pressen-pa-hushallen-att-spara/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:11:20+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "The government is proposing a support package of SEK 500 million for aviation, which is under heavy pressure from high fuel prices. - This will mean that ticket prices are reduced, says infrastructure minister Andreas Carlson (KD).", "title_original": "Halv miljard i flygstöd – ska dämpa biljettpris", "summary_original": "Regeringen föreslår ett stödpaket på 500 miljoner kronor till flyget, som pressas hårt av höga bränslepriser. – Detta kommer att innebära att biljettpriserna dämpas, säger infrastrukturminister Andreas Carlson (KD).", "link": "https://www.svd.se/a/JOl1xR/halv-miljard-i-stod-till-inrikesflyget", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:05:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 98, "title": "The sea's preschool is being demolished - replaced by barracks", "summary": "While waiting for a new preschool to be built where Jonstorp has its recycling station, it will be a temporary solution. Havet's preschool is being demolished and in August the Jonstorps children will have to go to preschool in barracks.", "title_original": "Havets förskola rivs – ersätts av baracker", "summary_original": "I väntan på att en ny förskola ska byggas där Jonstorp har sin återvinningsstation, blir det en tillfällig lösning. Havets förskola rivs och i augusti får Jonstorpsbarnen gå i förskola i baracker.", "link": "https://www.hd.se/hoganas/havets-forskola-rivs-ersatts-av-baracker/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 99, "title": "The cat that was lost and found in space - here is this year's carnival book", "summary": "Nobody knows where he went. Not even himself. In the middle of the carnival frenzy in Lund, a cat disappears. The children Bodil and Rune go out and search. It seems simple until the chase takes them all the way into space. What happens next? Children and parents at the City Library found that out when this year's Carnival Book was presented on Tuesday.", "title_original": "Katten som försvann och hittades i rymden – här är årets karnevalsbok", "summary_original": "Ingen vet vart han tog vägen. Inte ens han själv. Mitt i karnevalsvimlet i Lund försvinner en katt. Barnen Bodil och Rune ger sig ut och letar. Det verkar enkelt tills jakten tar dem hela vägen ut i rymden. Vad som händer sen? Det fick barn och föräldrar på Stadsbibliotek reda på när årets Karnevalsbok presenterades i tisdags.", "link": "https://www.sydsvenskan.se/lund/katten-som-forsvann-och-hittades-i-rymden-har-ar-arets-karnevalsbok/", "date_display": "2026-05-21", "date_iso": "2026-05-21T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 100, "title": "Whales on a record trip - swam halfway around the world", "summary": "Two humpback whales have proven that the huge mammal can get from one side of the world to the other - if it takes a little time.", "title_original": "Valar på rekordtur – simmade runt halva jorden", "summary_original": "Två knölvalar har bevisat att det enorma däggdjuret kan ta sig från en sida av jorden till den andra – om det får ta lite tid.", "link": "https://www.hd.se/varlden/valar-pa-rekordtur-simmade-runt-halva-jorden/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:59:58+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "The FI manager on mortgages: Avoid surprises", "summary": "Highly leveraged Swedish households are once again facing the risk of an interest rate shock, just a few years after the 2022–2024 inflation and interest rate shock. - It is a troubled time. It's a troubled world around. It is wise to avoid surprises, says Johan Almenberg, head of the Financial Supervisory Authority (FI) to TT.", "title_original": "FI-chefen om bolånen: Ta höjd för överraskningar", "summary_original": "Högt belånade svenska hushåll står återigen inför risken för en räntesmäll, bara några år efter inflations- och räntechocken 2022–2024. – Det är en orolig tid. Det är en orolig omvärld. Det är klokt att ta höjd för överraskningar, säger Johan Almenberg, chef för Finansinspektionen (FI) till TT.", "link": "https://www.hd.se/ekonomi/fi-chefen-om-bolanen-ta-hojd-for-overraskningar/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:58:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "The FI manager on mortgages: Avoid surprises", "summary": "Highly leveraged Swedish households are once again facing the risk of an interest rate shock, just a few years after the 2022–2024 inflation and interest rate shock. - It is a troubled time. It's a troubled world around. It is wise to avoid surprises, says Johan Almenberg, head of the Financial Supervisory Authority (FI) to TT.", "title_original": "FI-chefen om bolånen: Ta höjd för överraskningar", "summary_original": "Högt belånade svenska hushåll står återigen inför risken för en räntesmäll, bara några år efter inflations- och räntechocken 2022–2024. – Det är en orolig tid. Det är en orolig omvärld. Det är klokt att ta höjd för överraskningar, säger Johan Almenberg, chef för Finansinspektionen (FI) till TT.", "link": "https://www.svd.se/a/RjmxRd/fi-chefen-om-bolanen-ta-hojd-for-overraskningar", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:58:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 103, "title": "Want more crime prevention - instead of stricter punishments", "summary": "The consequences of serious crime are felt daily in the work of the authority. The police union has now carried out a Novus survey where the members had to answer what advice they want to give politicians.\nWhere the direction is clear. Among those questioned, it is around half, 47 percent, who request investments in crime prevention work. The corresponding figure for those who want to see stricter punishments and tougher laws is 17 percent.\n\n- There is a constant influx of new young people who see crime as a career. It needs to be closed in order for us to have a safer society, says Katharina von Sydow, who at the same time emphasizes that the Police Agency has received several other long-awaited tools.  Requires a long-term approach During the last term of office, the government has proposed several changes in criminal policy. Among other things, proposals have been put forward for lowering the age of criminal liability, abolishing the penalty discount and proposing that gang criminals should be able to receive double punishment.\n\nAt the same time, many of the police officers who answered the survey highlight the need for preventive measures.\n\n\"Research indicates that crime prevention/relationship-building work is a key to turning the tide,\" writes one of the police officers in the survey.  On the same track The President of the Police Association, Katharina von Sydow, is on the same track.\n\n- Now it's about looking long-term, over the entire surface, and creating a criminal policy and social policy that are linked together over several mandate periods in order to deal with the social problems that exist, she says and points out, among other things, that cooperation between different authorities can be improved.", "title_original": "Vill ha mer brottsförebyggande – istället för strängare straff", "summary_original": "Konsekvenserna av den grova brottsligheten märks dagligen i myndighetens arbete. Polisförbundet har nu genomfört en Novus-undersökning där medlemmarna fått svara på vilka råd de vill ge politikerna.\nDär riktningen är tydlig. Bland de tillfrågade är det omkring hälften, 47 procent, som efterfrågar satsningar på brottsförebyggande arbete. Motsvarande siffra för dem som vill se strängare straff och hårdare lagar är 17 procent.\n\n– Det är ett konstant inflöde av nya unga människor som ser kriminalitet som en karriär. Det behöver täppas till för att vi ska få ett tryggare samhälle, säger Katharina von Sydow, som samtidigt betonar att Polismyndigheten har fått flera andra efterlängtade verktyg.  Kräver långsiktig linje  Under den senaste mandatperioden har regeringen föreslagit flera förändringar inom kriminalpolitiken. Man har bland annat lagt fram förslag om sänkt straffbarhetsålder, slopad straffrabatt och föreslagit att gängkriminella ska kunna få dubbla straff.\n\nSamtidigt lyfter många av poliserna som svarat på undersökningen behovet av förebyggande åtgärder.\n\n\"Forskning tyder på att brottsförebyggande/relationsskapande arbete är en nyckel till att vända utvecklingen\", skriver en av poliserna i enkäten.  Inne på samma spår  Polisförbundets ordförande Katharina von Sydow är inne på samma spår.\n\n– Nu handlar det om att se långsiktigt, över hela ytan, och skapa en kriminalpolitik och socialpolitik som hänger ihop över flera mandatperioder för att komma till rätta med de samhällsproblem som finns, säger hon och pekar bland annat på att samarbetet mellan olika myndigheter kan förbättras.", "link": "https://www.tv4.se/artikel/6leT3FvG3wO5prW1dOQqui/vill-ha-brottsfoerebyggande-atgaerder-istaellet-foer-straengare-straff", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:50:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/polisen", "/brottsforebyggande-radet"]}, {"id": 104, "title": "The expert on the Ebola outbreak: We are not in control", "summary": "Both the death toll and the number of infected are rising after the Ebola outbreak in Congo-Kinshasa and Uganda. The infection now risks spreading to neighboring countries. - You have to be very quick and act now. We know what is required, and it is quite simple interventions that are needed, says Johan von Schreeb, professor of global disaster medicine.", "title_original": "Experten om ebolautbrottet: Vi har inte kontroll", "summary_original": "Både dödstal och antal smittade stiger efter ebolautbrottet i Kongo-Kinshasa och Uganda. Smittan riskerar nu att sprida sig till grannländerna. – Man måste vara väldigt snabb och agera nu. Vi vet vad som krävs, och det är ganska enkla insatser som behövs, säger Johan von Schreeb, professor i global katastrofmedicin.", "link": "https://www.hd.se/varlden/experten-om-ebolautbrottet-vi-har-inte-kontroll/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:46:56+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "Over 600 infected: \"You have to be very quick and act\"", "summary": "Over 130 deaths have so far been reported and over 600 people are suspected of being infected. There are currently no approved vaccines or treatments against the Ebola variant that caused the outbreak. We have fallen behind, this has probably been going on for quite some time, but it has not been known that it is Ebola because it is a rarer form. It has since spread to a very large geographical area, says Johan von Schreeb, professor at Karolinska Institutet. No risk in Sweden It is only a matter of time before cases will appear in South Sudan, Tanzania and Rwanda, believes Johan von Schreeb. However, he sees no risk of spread in Europe, apart from occasional import cases. I consider it completely out of the question that there would be any spread of this in a functioning health system like in Sweden. The disease does not spread that way. Here we will isolate people, he says. Here, those affected would receive intensive care and large resources would be deployed to prevent the spread. von Schreeb believes that it would take 60-70 people working full-time to care for one patient, if all the different staff categories are included. For those who fall ill in Congo-Kinshasa, the situation is completely different. There is a lack of resources for the seriously ill, there is no intensive care. Therefore, there is a very high mortality rate, says von Schreeb. Conflict and poverty The situation is made more difficult by the fact that the infection is spreading in a conflict area with extreme poverty, where there is great mistrust towards authorities and between different parties. This makes it difficult to reach the population with information, which is one of the key factors in slowing the spread. Another major problem is lack of resources. The healthcare staff lacks equipment and it is also not certain that they will receive a salary. The fact that the WHO has declared a state of emergency opens the door for countries and organizations to start sending medical supplies, protective equipment, money and personnel, among other things, Doctors Without Borders has decided to step up emergency efforts. You have to slow this down. Now", "title_original": "Över 600 smittade: ”Man måste vara väldigt snabb och agera”", "summary_original": "Över 130 dödsfall har hittills rapporterats och över 600 personer misstänks vara smittade. Just nu finns inga godkända vaccin eller behandlingar mot den ebolavariant som orsakat utbrottet. Vi har hamnat på efterkälken, sannolikt har det här pågått ganska lång tid men man har inte fått napp på att det rör sig om ebola på grund av att det är en ovanligare form. Sedan har det spritt sig till ett väldigt stort geografiskt område, säger Johan von Schreeb, professor på Karolinska institutet. Ingen risk i Sverige Det är bara en tidsfråga innan fall kommer att dyka upp i Sydsudan, Tanzania och Rwanda, tror Johan von Schreeb. Däremot ser han ingen risk för spridning i Europa, förutom enstaka importfall. Jag håller det för helt uteslutet att det skulle bli någon spridning av det här i ett fungerande hälsosystem som i Sverige. Sjukdomen sprids inte på det sättet. Här kommer vi att isolera folk, säger han. Här skulle den som drabbas få intensivvård och stora resurser sättas in för att hindra spridning. von Schreeb tror att det skulle behövas 60–70 personer som jobbar heltid för att vårda en patient, om alla olika personalkategorier räknas in. För de som blir sjuka i Kongo-Kinshasa är läget ett helt annat. Det saknas resurser för svårt sjuka, det finns ingen intensivvård. Därför är det väldigt hög dödlighet, säger von Schreeb. Konflikt och fattigdom Situationen försvåras av att smittan sprids i ett konfliktområde med extrem fattigdom, där misstron är stor mot myndigheter och mellan olika parter. Det gör det svårt att nå ut till befolkningen med information, som är en av nyckelfaktorerna för att bromsa spridningen. Ett annat stort problem är brist på resurser. Sjukvårdspersonalen saknar utrustning och det är heller inte säkert att de får lön. Att WHO utlöst nödläge öppnar för att länder och organisationer börjar skicka sjukvårdsmaterial, skyddsutrustning, pengar och personal, bland annat har Läkare utan gränser beslutat att trappa upp akutinsatserna. Man måste bromsa det här. Nu har vi inte kontroll, vi vet alldeles för lite. Vi måste få mer labbutrustning, vi måste snabbare förstå för att kunna begränsa utbrottet, få upp isoleringsenheter, få fram material till sjukvårdspersonalen och förhoppningsvis få fram ett vaccin snabbt som åtminstone kan skydda personalen, säger von Schreeb.", "link": "https://www.tv4.se/artikel/tt-260521-kongokinebolaexpert1-f4eca222/experten-om-ebolautbrottet-vi-har-inte-kontroll", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:46:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Uganda", "/uganda", "/utrikes", "/sverige", "/folkhalsomyndigheten", "/kongo-kinshasa", "/sydsudan", "/ebola"]}, {"id": 106, "title": "The expert on the Ebola outbreak: We are not in control", "summary": "Both the death toll and the number of infected are rising after the Ebola outbreak in Congo-Kinshasa and Uganda. The infection now risks spreading to neighboring countries. - You have to be very quick and act now. We know what is required, and it is quite simple interventions that are needed, says Johan von Schreeb, professor of global disaster medicine.", "title_original": "Experten om ebolautbrottet: Vi har inte kontroll", "summary_original": "Både dödstal och antal smittade stiger efter ebolautbrottet i Kongo-Kinshasa och Uganda. Smittan riskerar nu att sprida sig till grannländerna. – Man måste vara väldigt snabb och agera nu. Vi vet vad som krävs, och det är ganska enkla insatser som behövs, säger Johan von Schreeb, professor i global katastrofmedicin.", "link": "https://www.svd.se/a/5pLVVK/experten-om-ebolautbrottet-vi-har-inte-kontroll", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:46:35+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 107, "title": "E-commerce is growing – 9 million more packages", "summary": "During the first quarter of the year, over 9 million more packages were sent compared to last year. This is shown by new statistics from Transportföretagen Paketindex.", "title_original": "E-handeln växer – 9 miljoner fler paket", "summary_original": "Under årets första kvartal skickades över 9 miljoner fler paket jämfört med i fjol. Det visar ny statistik från Transportföretagen Paketindex.", "link": "https://www.hd.se/ekonomi/e-handeln-vaxer-9-miljoner-fler-paket/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:44:53+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "Musk's secret: Total control", "summary": "Good morning! Space X reveals most things before the stock market listing, Nvidia targets new markets after record quarters, and bonuses rain over Samsung.", "title_original": "Musks hemlighet: Total kontroll", "summary_original": "God morgon! Space X avslöjar det mesta inför börsnoteringen, Nvidia siktar på nya marknader efter rekordkvartal, och bonusregn över Samsung.", "link": "https://www.svd.se/a/7pqnr9/space-x-borsnotering-musk-har-kontroll-och-far-mars-bonus", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:40:31+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 109, "title": "Markus Heilig: No, the integration problems are neither exaggerated nor about to disappear", "summary": "Sweden stands out in how quickly we received a large number of asylum seekers. It leads to wear and tear in the system and a negative attitude towards immigrants - which are problems we need to recognize and deal with, writes Markus Heilig in the debate on integration.", "title_original": "Markus Heilig: Nej, integrationsproblemen är varken överdrivna eller på väg att försvinna", "summary_original": "Sverige sticker ut i hur snabbt vi tagit emot ett stort antal asylsökande. Det leder till slitningar i systemet och en negativ inställning till invandrare – vilket är problem vi behöver erkänna och hantera, skriver Markus Heilig i debatten om integration.", "link": "https://www.dn.se/kultur/markus-heilig-nej-integrationsproblemen-ar-varken-overdrivna-eller-pa-vag-att-forsvinna/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:28:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Bengt Westerberg: I ​​saw the integration problems already in 1994", "summary": "The People's Party raised the problems with integration already before the 1994 election. So stop throwing baseless accusations. I see the difficulties but still believe that immigrants are needed here, writes Bengt Westerberg", "title_original": "Bengt Westerberg: Jag såg integrationsproblemen redan 1994", "summary_original": "Folkpartiet tog upp problemen med integration redan inför valet 1994. Så sluta kasta grundlösa beskyllningar. Jag ser svårigheterna men anser fortfarande att invandrarna behövs här, skriver Bengt Westerberg", "link": "https://www.dn.se/kultur/bengt-westerberg-jag-sag-integrationsproblemen-redan-1994-sa-sluta-kasta-grundlosa-beskyllningar/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:26:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Rubio nobs dinner with the king", "summary": "", "title_original": "Rubio nobbar middag med kungen", "summary_original": "", "link": "https://www.svd.se/a/j0L9VL/rubio-nobbar-middag-med-kungen-kommer-pa-fredag", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:24:57+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 112, "title": "The wife's warning in the forest - how the F1 star became an environmental hero", "summary": "He was seen as aggressive on the court and arrogant off. But then a camera caught Sebastian Vettel picking up rubbish in the main grandstand after the British GP - and the image of the four-time Formula 1 world champion changed. - People don't get the whole picture and don't see everything in a person, says the 38-year-old to DN.", "title_original": "Fruns varning i skogen – så blev F1-stjärnan en miljöhjälte", "summary_original": "Han sågs som aggressiv på banan och arrogant utanför. Men så fångade en kamera hur Sebastian Vettel plockade skräp på huvudläktaren efter Storbritanniens GP – och bilden av den fyrfaldige formel 1-världsmästaren förändrades. – Folk får inte hela bilden och ser inte allt hos en människa, säger 38-åringen till DN.", "link": "https://www.dn.se/sport/fruns-varning-i-skogen-sa-blev-f1-stjarnan-en-miljohjalte/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:04:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Here are the cheapest and most expensive holiday homes", "summary": "Now is the high season for buying holiday homes. Prices have so far been stable but are expected to increase. The new mortgage rules may also affect the buyers' options, according to Handelsbanken's property report.", "title_original": "Här finns billigaste och dyraste fritidshusen", "summary_original": "Nu är det högsäsong för att köpa fritidshus. Priserna har hittills stått stilla men förväntas öka. De nya bolånereglerna kan också påverka köparnas möjligheter, enligt Handelsbankens fastighetsrapport.", "link": "https://www.dn.se/ekonomi/har-finns-billigaste-och-dyraste-fritidshusen-2/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:01:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Large scholarship for \"super illustrator\"", "summary": "\"Ida Björs is a super illustrator\", so begins the justification for choosing this year's Löken scholarship holder when it is awarded for the second time. The scholarship sum of SEK 300,000 makes it one of the largest in the country.", "title_original": "Stort stipendium till ”superillustratör”", "summary_original": "”Ida Björs är en superillustratör”, så börjar motiveringen till valet av årets Löken-stipendiat när det delas ut för andra gången. Stipendiesumman på 300 000 kronor gör det till ett av landets största.", "link": "https://www.dn.se/kultur/stort-stipendium-till-superillustrator/", "date_display": "2026-05-21", "date_iso": "2026-05-21T05:00:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "The IT bastards are reported for scam ads", "summary": "Are the IT guys doing enough to protect users from scam ads? No, according to Sweden's Consumers, who are now reporting, among other things, Google to the EU Commission.", "title_original": "It-bjässarna anmäls för bluffannonser", "summary_original": "Gör it-bjässarna tillräckligt för att skydda användarna mot bluffannonser? Nej, anser Sveriges Konsumenter, som nu anmäler bland annat Google till EU-kommissionen.", "link": "https://www.dn.se/ekonomi/it-bjassarna-anmals-for-bluffannonser/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:47:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "X receives a million fine in Australia", "summary": "Elon Musk's X is forced to pay the equivalent of almost SEK 5 million in fines for not having followed Australia's legislation against the exploitation of children on the internet.", "title_original": "X får miljonböter i Australien", "summary_original": "Elon Musks X tvingas betala motsvarande knappt 5 miljoner kronor i böter för att inte ha följt Australiens lagstiftning mot exploatering av barn på internet.", "link": "https://www.hd.se/ekonomi/x-far-miljonboter-i-australien/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:47:23+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "WHO: Ebola vaccine could take months to develop", "summary": "It may take up to nine months before a vaccine is in place against the variant of Ebola that is now spreading rapidly in Congo-Kinshasa, according to the World Health Organization (WHO), according to the BBC.", "title_original": "WHO: Kan ta månader att utveckla ebolavaccin", "summary_original": "Det kan ta upp till nio månader innan ett vaccin är på plats mot den variant av ebola som i snabb takt nu sprids i Kongo-Kinshasa, uppger Världshälsoorganisationen (WHO) enligt BBC.", "link": "https://www.hd.se/varlden/who-kan-ta-manader-att-utveckla-ebolavaccin/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:44:06+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Listen: Danish clothing store is allowed to leave Kullagatan", "summary": "", "title_original": "Lyssna: Dansk klädbutik får lämna Kullagatan", "summary_original": "", "link": "https://www.hd.se/skane/lyssna-flera-restauranger-i-helsingborg-fick-rutorna-sonderslagna/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:34:57+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Care would become more equal - now the sickest get less", "summary": "The regional management in Stockholm has promised to make care more equal. But after a procurement of adult psychiatry, the sickest have had their resources halved. - Animals are treated better, says patient Anton, 52, from Rinkeby.", "title_original": "Vården skulle bli mer jämlik – nu får de sjukaste mindre", "summary_original": "Regionledningen i Stockholm har lovat göra vården mer jämlik. Men efter en upphandling av vuxenpsykiatrin har de sjukaste fått halverade resurser. – Djur blir bättre behandlade, säger patienten Anton, 52, från Rinkeby.", "link": "https://www.dn.se/sverige/varden-skulle-bli-mer-jamlik-nu-far-de-sjukaste-mindre/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:26:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "The lung disease was killing Susanne: \"Couldn't breathe\"", "summary": "Susanne Lind started smoking when she was 14 years old. She says that many people around her smoked. - Mother smoked, father smoked, grandmother smoked. All friends. And I succumbed to the pressure, says Susanne Lind. In her 50s, she developed a troublesome, persistent cough that turned out to be the lung disease COPD. - I became thin, I became wrinkled, I couldn't breathe. It was anxiety. I just screamed sometimes. And when I screamed and had anxiety then the oxygen also went down. Then it got even worse, says Susanne Lind. Regional differences Between 500,000 and 700,000 people live with coal in Sweden. Smoking is a cause. According to the Heart-Lung Foundation's compilation, an average of 2,700 people die each year from the disease. But mortality rates vary between regions. Per 100,000 inhabitants in 2024, the least number of people died in Västerbotten, while twice as many died in Kronoberg. The second largest number died in Susanne County, Gävleborg. - I think that is deplorable, care should be the same for everyone both at health centers and within the regions, says Susanne. - No one should sit and decide nonsense! According to Health Care Minister Elisabet Lann (KD), there are good guidelines in this area. - If the regions live up to them, it facilitates early diagnostics and then you can follow the patient all the way and make sure that he receives the best possible care. That it then differs, that it is a matter of luck and coincidence, of living in the right region, that is incredibly serious, says Elisabet Lann. \"My hope was lost\" Susanne Lind had to wait a few years to receive treatment for her COPD, and when she found it increasingly difficult to breathe, in October 2023, she felt that she would not live much longer. - My hope was lost. The white archive was written. I had written letters to mum and dad and thanked them for a nice childhood. I had told everyone that I loved them. I wouldn't live, she says. But then the phone call came - she was going to have a lung transplant. - It was absolutely wonderful to receive the news, says Susanne. Now she hopes that more people will donate organs etc", "title_original": "Lungsjukdomen höll på att döda Susanne: ”Kunde inte andas”", "summary_original": "Susanne Lind började röka när hon var 14 år. Hon berättar att många i hennes närhet rökte. – Mamma rökte, pappa rökte, mormor rökte. Alla kompisar. Och jag föll ju för trycket, säger Susanne Lind. I 50-årsåldern fick hon en besvärlig, ihållande hosta som visade sig vara lungsjukdomen KOL. – Smal blev jag, rynkig blev jag, inte kunde jag andas. Det var ångest. Jag bara skrek ibland. Och när jag skrek och fick ångest då gick ju också syresättningen ner. Då blev det ännu värre, säger Susanne Lind. Regionala skillnader Mellan 500 000 och 700 000 personer lever med kol i Sverige. Rökning är en orsak. Enligt Hjärt-Lungfondens sammanställning dör i snitt 2 700 personer varje år av sjukdomen. Men dödligheten varierar mellan regionerna. Per 100 000 invånare 2024 dog minst antal personer i Västerbotten, medan dubbelt så många dog i Kronoberg. Näst flest dog i Susannes län, Gävleborg. – Det tycker jag är bedrövligt, vården ska vara lika för alla både på hälsocentraler och inom regionerna, säger Susanne. – Det ska inte sitta några och bestämma tokigheter! Enligt sjukvårdsminister Elisabet Lann (KD) finns det bra riktlinjer på området. – Lever regionerna upp till dem underlättar det för tidig diagnostik och sedan kan man följa patienten hela vägen och se till att den får bästa möjliga vård. Att det då skiljer sig åt, att det handlar om tur och träff, om att bo i rätt region, det är otroligt allvarligt, säger Elisabet Lann. ”Mitt hopp var ute” Susanne Lind fick vänta några år på att få behandling för sin KOL, och när hon fick allt svårare att andas, i oktober 2023, kände hon att hon inte skulle leva länge till. – Mitt hopp var ute. Vita arkivet var skrivet. Jag hade skrivit brev till mamma och pappa och tackat för en fin barndom. Jag hade talat om för alla att jag älskade dem. Jag skulle ju inte leva, berättar hon. Men så kom telefonsamtalet- hon skulle få göra en lungtransplantation. – Det var helt underbart att få beskedet, säger Susanne. Nu hoppas hon att fler donerar organ och att inga unga börjar röka. Hon menar att det behövs skrämselpropaganda. Hennes önskan för egen del efter operationen var att orka dansa med sin man till Sven-Ingvars igen. \nOch de gjorde de, hemma i köket.", "link": "https://www.tv4.se/artikel/5MNhk1uOoOTU6cshtRZGoG/lungsjukdomen-hoell-pa-att-doeda-susanne-kunde-inte-andas", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:25:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/halsa", "/hjart-lungfonden", "/lungsjukdomen-kol"]}, {"id": 121, "title": "Oscar Jonsson: Can the frigates that Sweden has bought really handle a modern war?", "summary": "Doing business with Europe's foremost military power has clear strategic value. But will the French frigates that Sweden is going to buy really cope with a modern war? It is not as obvious. THE COLUMN. Oscar Jonsson is a doctor in Russian warfare and a freelance columnist on Dagens Nyheter's editorial page.", "title_original": "Oscar Jonsson: Klarar fregatterna som Sverige har köpt verkligen ett modernt krig?", "summary_original": "Att göra affärer med Europas främsta militärmakt har ett tydligt strategiskt värde. Men kommer de franska fregatterna som Sverige ska köpa verkligen att klara ett modernt krig? Det är inte lika självklart. KOLUMNEN. Oscar Jonsson är doktor i rysk krigföring och fristående kolumnist på Dagens Nyheters ledarsida.", "link": "https://www.dn.se/ledare/oscar-jonsson-klarar-fregatterna-som-sverige-har-kopt-verkligen-ett-modernt-krig/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:25:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Was promised a psychologist job: \"Then something happened\"", "summary": "Region Stockholm is cutting back on psychodynamic treatments in psychiatry. For students, it is already noticeable now, when receptions refuse their application for a PTP place. \"I get the feeling that I'm sorted out quite quickly,\" says Camilla Dahlstedt.", "title_original": "Lovades psykologjobb: ”Sedan hände något”", "summary_original": "Region Stockholm skär ned på psykodynamiska behandlingar inom psykiatrin. För studenter märks det redan nu, när mottagningar tackar nej till deras ansökan om PTP-plats. ”Jag får känslan att jag sorteras ut ganska snabbt”, säger Camilla Dahlstedt.", "link": "https://www.svd.se/a/0p99J0/lovades-psykologjobb-sedan-hande-nagot", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:02:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 123, "title": "Drove by car - counted as 6,000 steps", "summary": "SvD's tests of pedometers and smartwatches show enormous differences. The Apple Watch has zero track of standing time, the Garmin watch misses everyday exercise and the Oura ring interprets a car journey as 6,000 steps.", "title_original": "Åkte bil – räknades som 6 000 steg", "summary_original": "SvD:s test av stegräknare och smart­klockor visar på enorma skillnader. Apple Watch har noll koll på ståtiden, Garminklockan missar vardags­motionen och Oura-ringen tolkar en bilresa som 6 000 steg.", "link": "https://www.svd.se/a/Exl69a/bilturen-gav-mig-6000-bonussteg", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:01:19+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 124, "title": "So robots and AI can be used to make better wines", "summary": "The wine industry is steeped in tradition, but new techniques are now being developed to facilitate work in the vineyards.", "title_original": "Så kan robotar och AI användas för att göra bättre viner", "summary_original": "Vinbranschen är traditionstyngd men nu utvecklas nya tekniker som ska underlätta arbetet i vinodlingarna.", "link": "https://www.dn.se/mat-dryck/sa-kan-robotar-och-ai-anvandas-for-att-gora-battre-viner/", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "They defend a sick system", "summary": "Gross exaggerations and pure untruths - true to their habit, the Tenants' Association sabotages all attempts at factual debate about the sick rental market.", "title_original": "De försvarar ett sjukt system", "summary_original": "Grova överdrifter och rena osanningar – sin vana trogen saboterar Hyresgästföreningen alla försök till saklig debatt om den sjuka hyresmarknaden.", "link": "https://www.svd.se/a/zOMWbw/hyresgastforeningen-forsvarar-ett-sjukt-system", "date_display": "2026-05-21", "date_iso": "2026-05-21T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 126, "title": "\"Battery-Jesus\" is pitted against honed digger", "summary": "Former CEO Peter Carlsson and dig reporter Gunnar Lindstedt each give their own view of Northvolt's rise and fall. SvD's Fredrik Sjöberg reads both books and is surprised by which of them is the most interesting.", "title_original": "”Batteri-Jesus” ställs mot slipad grävare", "summary_original": "Tidigare vd:n Peter Carlsson och grävreportern Gunnar Lindstedt ger var sin bild av Northvolts uppgång och fall. SvD:s Fredrik Sjöberg läser de båda böckerna och överraskas av vilken av dem som är intressantast.", "link": "https://www.svd.se/a/m05XG1/recension-northvoltfallet-av-gunnar-lindstedt-och-northvolt-min-berattelse-av-peter-carlsson", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:59:28+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Litteratur", "Kultur"]}, {"id": 127, "title": "Weekend wine tasting: Volcanic wines from Etna", "summary": "Look, spin, smell, taste! By tasting wine, you train your senses, get better at finding wines you like, and also have fun along the way. This week, Alf Tumble talks about wines from Sicily and chooses four bottles that are suitable to try together.", "title_original": "Helgens vinprovning: Vulkaniska viner från Etna", "summary_original": "Titta, snurra, dofta, smaka! Genom att prova vin tränar du upp dina sinnen, blir bättre på att hitta viner du tycker om och har dessutom kul på vägen. Denna vecka berättar Alf Tumble om viner från Sicilien och väljer fyra flaskor som passar att prova ihop.", "link": "https://www.dn.se/mat-dryck/helgens-vinprovning-vulkaniska-viner-fran-etna/", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:58:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Five tips for those who have siblings with special needs", "summary": "Johanna Segerström grew up in the shadow of a brother with special needs. Now she is a trained psychologist and has written a book to help others. - I wished I had a diagnosis so that I was also someone, she says.", "title_original": "Fem tips till den som har syskon med särskilda behov", "summary_original": "Johanna Segerström växte upp i skuggan av en bror med särskilda behov. Nu är hon utbildad psykolog och har skrivit en bok för att hjälpa andra. – Jag önskade att jag hade en diagnos så att jag också var någon, säger hon.", "link": "https://www.dn.se/insidan/fem-tips-till-den-som-har-syskon-med-sarskilda-behov/", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:51:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Emma Bouvin: I have had my hard work sanctioned by the authorities", "summary": "There are those who avoid getting involved and then there are others who throw themselves into every potential conflict. DN's Emma Bouvin belongs to the last category and has had several fruitless arguments with little guys lately. Then she discovered the magic words.", "title_original": "Emma Bouvin: Jag har fått min jobbighet sanktionerad av myndigheterna", "summary_original": "Det finns de som låter bli att lägga sig i och så finns det andra som kastar sig in i varenda potentiell konflikt. DN:s Emma Bouvin tillhör den sista kategorin och har haft flera fruktlösa gräl med småkillar på sistone. Sedan upptäckte hon de magiska orden.", "link": "https://www.dn.se/sverige/emma-bouvin-jag-har-fatt-min-jobbighet-sanktionerad-av-myndigheterna/", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:25:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Letter to the editor. We must help the young to save our planet", "summary": "LETTER TO THE EDITOR. It is not that \"the crisis is coming\" for the climate and the environment, but it is already here to a great extent. We as adults can influence by voting in the parliamentary election, contact our politicians and try to get climate and environmental issues high or at the top of the agenda in the election campaign, writes pensioner AnnSofie Forsberg.", "title_original": "Insändare. Vi måste hjälpa de unga att rädda vår planet", "summary_original": "INSÄNDARE. Det är inte så att ”krisen kommer” för klimatet och miljön, utan den är i högsta grad redan här. Vi som är vuxna kan påverka genom röstning i riksdagsvalet, kontakta våra politiker och försöka få klimat- och miljöfrågor att hamna högt eller högst på agendan i valrörelsen, skriver pensionären AnnSofie Forsberg.", "link": "https://www.dn.se/insandare/vi-maste-hjalpa-de-unga-att-radda-var-planet/", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Don't reduce people's life situations to simple answers", "summary": "A relevant church sees that the mission is greater than winning a single debate issue, writes Magnus Lagergren in a reply.", "title_original": "Reducera inte människors livs­situationer till enkla svar", "summary_original": "En relevant kyrka ser att uppdraget är större än att vinna en enskild debattfråga, skriver Magnus Lagergren i en replik.", "link": "https://www.dagen.se/debatt/reducera-inte-maenniskors-livssituationer-till-enkla-svar/10351967", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "When something that at first appears to be a failure becomes a success", "summary": "Elin Elg's crispy edge rolls came about by accident", "title_original": "När något som först ser ut att vara ett misslyckande blir en succé", "summary_original": "Elin Elgs krossikantfrallor kom till av misstag", "link": "https://www.dagen.se/mat/naer-nagot-som-foerst-ser-ut-att-vara-ett-misslyckande-blir-en-succe/10350093", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Amanda Lind (MP): I don't see this as being saved from the climate", "summary": "The Green Party's mouthpiece first appeared in Dagen's interview series with party leaders", "title_original": "Amanda Lind (MP): Jag ser inte det här som att man är klimatfrälst", "summary_original": "Miljöpartiets språkrör först ut i Dagens intervjuserie med partiledare", "link": "https://www.dagen.se/nyheter/amanda-lind-mp-jag-ser-inte-det-haer-som-att-man-aer-klimatfraelst/10297773", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "The Green Party's Amanda Lind should talk more about her faith in God", "summary": "Erik Helmerson: The Greens have one political strength and two weaknesses", "title_original": "Miljöpartiets Amanda Lind borde tala mer om sin gudstro", "summary_original": "Erik Helmerson: De gröna har en politisk styrka och två svagheter", "link": "https://www.dagen.se/ledare/miljoepartiets-amanda-lind-borde-tala-mer-om-sin-gudstro/10352708", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Christian pacifism does not measure up in the face of institutionalized evil", "summary": "If all deadly violence means that \"the devil has won\", then how are we to understand the liberation of Europe from Nazism and the opening of the concentration camps? writes Per Landgren in a closing remark.", "title_original": "Kristen pacifism håller inte måttet i mötet med institutionaliserad ondska", "summary_original": "Om allt dödande våld innebär att ”djävulen segrat”, hur ska vi då förstå befrielsen av Europa från nazismen och öppnandet av koncentrationslägren? skriver Per Landgren i en slutreplik.", "link": "https://www.dagen.se/debatt/kristen-pacifism-haller-inte-mattet-i-moetet-med-institutionaliserad-ondska/10350562", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "The white smoke lingers regarding requirements for marriage views in EFK", "summary": "Thomas Österberg: Different interpretations and many twists and turns regarding decisions on a loaded issue at the EFK congress", "title_original": "Vita röken dröjer angående krav på äktenskapssyn i EFK", "summary_original": "Thomas Österberg: Olika tolkningar och många turer kring beslut i laddad fråga vid EFK-kongress", "link": "https://www.dagen.se/nyheter/vita-roeken-droejer-angaende-krav-pa-aektenskapssyn-i-efk/10353340", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Episode 234: Toussaint 'Tusse' Chiza", "summary": "The artist Toussaint Chiza is a guest of the Man of the Day.", "title_original": "Avsnitt 234:  Toussaint 'Tusse' Chiza", "summary_original": "Artisten Toussaint Chiza gästar Dagens människa.", "link": "https://www.dagen.se/podd/avsnitt-234-toussaint-tusse-chiza/10355511", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Amanda Lind about faith, pride and sticking like a badger", "summary": "Dagen asks the big questions to the Green Party's Amanda Lind", "title_original": "Amanda Lind om tro, högmod och att bita sig fast som en grävling", "summary_original": "Dagen ställer de stora frågorna till Miljöpartiets Amanda Lind", "link": "https://www.dagen.se/nyheter/amanda-lind-om-tro-hoegmod-och-att-bita-sig-fast-som-en-graevling/10322471", "date_display": "2026-05-21", "date_iso": "2026-05-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "X receives a million fine in Australia", "summary": "Elon Musk's X is forced to pay the equivalent of almost SEK 5 million in fines for not having followed Australia's legislation against the exploitation of children on the internet.", "title_original": "X får miljonböter i Australien", "summary_original": "Elon Musks X tvingas betala motsvarande knappt 5 miljoner kronor i böter för att inte ha följt Australiens lagstiftning mot exploatering av barn på internet.", "link": "https://www.svd.se/a/lnvgjL/x-far-miljonboter-i-australien", "date_display": "2026-05-21", "date_iso": "2026-05-21T02:39:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 140, "title": "Finland could become a target for Russian false-flag drones", "summary": "Finland has recently been hit by repeated incidents of drones entering the country, the latest on Friday. The background to the recurring drone alarms is Ukraine's increasingly intense attacks against Russia. As the Russians defend themselves, drones stray into Finnish airspace.\n\nNow drone expert James Acuna warns that the drones may in fact be Russian.  In an interview with Finnish Yle, he believes that Russia can send drones into Finnish territory under a false flag, so that they will appear to come from Ukraine. Easy to make fake copies James Acuna believes that it is relatively easy to carry out forgeries. Ukrainian drones are built from commercial components that can be purchased online, and Russia is also said to have captured many Ukrainian drones during the war.\n\n- They can absolutely make a copy, says Acuna.\n\nHe believes that the purpose of such operations can be several, but points out in particular that Russia wants to map out how Finland's drone defense works.\n\n- If I wanted to find out how the defense in your territory works, I would let drones enter \"accidentally\", then I observe how you react, he says to Yle. Can create uncertainty Another purpose, according to Acuna, is to create uncertainty in Finland and undermine the credibility of the Finnish authorities.\n\n- If the authorities say that a drone was in the airspace for three minutes, but the civilian population heard the sound of drones for 45 minutes, then suddenly you have a credibility problem, says Acuna.\n\nJames Acuna has many years of experience with drone issues from the American intelligence service CIA and is now a drone consultant. From his base in Estonia, he follows developments in the Baltics and Finland. James Acuna is now calling on Finnish authorities to educate the population more and develop technical tools to simplify reporting on drones.\n\n- The best sensor is the person. If people learn to recognize the sound of a drone, and can report sightings via an app, then the authorities suddenly have thousands of ex", "title_original": "Finland kan bli måltavla för ryska falskflaggade drönare", "summary_original": "Finland har på senare tid drabbats av upprepade incidenter med drönare som kommit i landet, den senaste i fredags. Bakgrunden till de återkommande drönarlarmen är Ukrainas alltmer intensiva attacker mot Ryssland. När ryssarna försvarar sig förirrar sig drönare in i finskt luftrum.\n\nNu varnar drönarexperten James Acuna för att drönarna i själva verket kan vara ryska.  I en intervju med finska Yle menar han att Ryssland kan skicka in drönare på finskt territorium under falsk flagg, så att de ska se ut att komma från Ukraina. Enkelt att göra falska kopior James Acuna bedömer att det är relativt enkelt att genomföra förfalskningar. Ukrainska drönare byggs av kommersiella komponenter som går att köpa på nätet, och Ryssland uppges också ha fångat in många ukrainska drönare under kriget.\n\n– De kan absolut tillverka en kopia, säger Acuna.\n\nHan menar att syftet med sådana operationer kan vara flera, men pekar särskilt på att Ryssland vill kartlägga hur Finlands drönarförsvar fungerar.\n\n– Om jag ville ta reda på hur försvaret i ert territorium fungerar skulle jag låta drönare komma in ”av misstag”, sedan observerar jag hur ni reagerar, säger han till Yle. Kan skapa osäkerhet Ett annat syfte, enligt Acuna, är att skapa osäkerhet i Finland och undergräva finska myndigheters trovärdighet.\n\n– Om myndigheterna säger att en drönare var i luftrummet i tre minuter, men civilbefolkningen hörde ljudet av drönare i 45 minuter, då har du plötsligt ett trovärdighetsproblem, säger Acuna.\n\nJames Acuna har mångårig erfarenhet av drönarfrågor från amerikanska underrättelsetjänsten CIA och är numera drönarkonsult. Från sin bas i Estland följer han utvecklingen i Baltikum och Finland. James Acuna uppmanar nu finska myndigheter att utbilda befolkningen mer och ta fram tekniska verktyg för att förenkla rapportering om drönare.\n\n– Den bästa sensorn är människan. Om folk lär sig känna igen ljudet av en drönare, och kan rapportera observationer via en app, då får myndigheterna plötsligt tusentals extra ögon och öron, säger han.", "link": "https://www.tv4.se/artikel/47CF1OiSSIdPjMzAmR7Qb4/finland-kan-bli-maltavla-foer-ryska-falskflaggade-droenare", "date_display": "2026-05-20", "date_iso": "2026-05-20T20:05:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/natodebatten/finland", "/ryssland", "/dronare", "/dronarattack", "/ukraina", "/ukrainakonflikten"]}, {"id": 141, "title": "Here, the Russian pilot flies six meters from British reconnaissance aircraft", "summary": "Two Russian fighter jets have carried out a dangerously close interception of an unarmed reconnaissance aircraft belonging to the British Air Force RAF, according to the British Ministry of Defense according to the BBC. The incident occurred in April over the Black Sea when the British plane reportedly carried out a routine flight to secure NATO's eastern flank. One of the Russian planes, a Su-35, came so close that the British aircraft's emergency system was activated and the autopilot was knocked out. The other plane, a Su-27, passed the reconnaissance plane six times and at one point was only six meters from its nose.  Now the British Ministry of Defense has released images from the incident. Most dangerous incident since 2022 UK Defense Secretary John Healey praises the \"outstanding professionalism\" of RAF crews amid what he calls \"unacceptable\" Russian action. According to the Defense Department, this is the most dangerous incident since 2022, when a Russian pilot fired a missile at a reconnaissance aircraft over the same area.  Healey condemns the airborne intercepts and calls on the Russian embassy to do the same. \"This incident is yet another example of dangerous and unacceptable behavior by Russian pilots against an unarmed aircraft in international airspace,\" Healey said. - It creates a serious risk of accidents and potential escalation.  Recent interceptions indicate increased Russian aggression in the region, John Healey believes.", "title_original": "Här flyger ryska piloten sex meter från brittiskt spaningsflyg", "summary_original": "Två ryska stridsflygplan har genomfört en farligt närgången avlyssning av ett obeväpnat spaningsflygplan tillhörande Storbritanniens flygvapen RAF, uppger det brittiska försvarsministeriet enligt BBC. Händelsen inträffade i april över Svarta havet då det brittiska planet uppges ha genomfört en rutinmässig flygning för att säkra Natos östra flank. Ett av de ryska planen, ett Su-35, kom så nära att det brittiska flygplanets nödsystem aktiverades och autopiloten slogs ut. Det andra planet, ett Su-27, passerade spaningsplanet sex gånger och var vid ett tillfälle endast sex meter från dess nos.  Nu har det brittiska försvarsministeriet släppt bilder från incidenten. Farligaste incidenten sedan 2022 Storbritanniens försvarsminister John Healey berömmer RAF-besättningens ”enastående professionalism” under det han kallar ett ”oacceptabelt” ryskt agerande. Enligt försvarsdepartementet är detta den farligaste incidenten sedan 2022, då en rysk pilot avfyrade en missil mot ett spaningsflygplan över samma område.  Healey fördömer de luftburna avlyssningarna och uppmanar den ryska ambassaden att göra detsamma. – Den här incidenten är ytterligare ett exempel på farligt och oacceptabelt beteende från ryska piloter mot ett obeväpnat flygplan i internationellt luftrum, säger Healey. – Det skapar en allvarlig risk för olyckor och potentiell eskalering.  Den senaste tidens avlyssningar tyder på en ökad rysk aggression i regionen, menar John Healey.", "link": "https://www.tv4.se/artikel/2gJHxka5wtsL7EW6BZPpTS/haer-flyger-ryska-piloten-sex-meter-fran-brittiskt-spaningsflyg", "date_display": "2026-05-20", "date_iso": "2026-05-20T18:21:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/svarta-havet", "/ryssland", "/storbritannien"]}, {"id": 142, "title": "That's why many are forced to wear bandages - Sonja about the pain: \"Unbelievable\"", "summary": "Several participants in both \"Robinson\" and \"Gränslandet\" wear bandages in different places on their bodies. This after they suffered burns and major scrapes in the Robinson competition in episode 34.\n\n\"It was more or less everyone,\" writes Sonja Rudqvist in a text message to TV4 Nyheterna. \"Me, Carro, Marie, Lasse and Aza. Then me and Halil got blisters under our feet because we stood barefoot and threw the sandbags for a long time. The sand was boiling hot!\". \"We have to evaluate\" According to Sonja Rudqvist, many rolls of tape and bandages were used and the wounds took a long time to heal in the humid climate. TV4 writes in an e-mail that the competition moment – ​​to bear oneself in the sand – is always very hard. \"But that was a bit too tough this time. We don't want the participants to be so hard-hit. We have to evaluate to see what we can adjust going forward so we don't end up there again if \"Sand crawler\" returns,\" writes Gustav Carlsson, executive producer on the channel. About tough participation Sonja Rudqvist says that \"Robinson\" is tough, both mentally and physically, and that it takes \"a damn bone\" to be involved. To this day, she still has scars from the wounds. \"I was in incredible pain, I could barely lift my left arm properly,\" she writes. After receiving the wounds, she stopped dipping her arms in the water unnecessarily. \"If they weren't a water race, of course, then they were just to bite the bullet and patch it up again afterwards\".", "title_original": "Därför tvingas flera bära bandage – Sonja om smärtan: ”Otroligt”", "summary_original": "Flera deltagare i både ”Robinson” och ”Gränslandet” bär bandage på olika ställen på kroppen. Det efter att de fått brännskador och stora skrapsår i Robinsontävlingen i avsnitt 34.\n\n”Det var väl mer eller mindre alla”, skriver Sonja Rudqvist i ett sms till TV4 Nyheterna. ”Jag, Carro, Marie, Lasse och Aza. Sedan fick jag och Halil brännblåsor under fötterna eftersom vi stod barfota och kastade sandpåsarna länge. Sanden var kokhet!”. ”Vi får utvärdera” Enligt Sonja Rudqvist gick det åt många rullar tejp och bandage och såren tog lång tid att läka i det fuktiga klimatet. TV4 skriver i ett mejl att tävlingsmomentet – att åla sig i sanden – alltid är mycket hårt. ”Men det där blev lite för tufft denna gång. Vi vill inte att deltagarna ska bli så där hårt åtgångna. Vi får utvärdera för att se vad vi kan justera framåt så vi inte hamnar där igen om ”Sand crawler” återkommer”, skriver Gustav Carlsson, exekutiv producent på kanalen. Om tuffa medverkan Sonja Rudqvist säger att ”Robinson” är tufft, både psykiskt och fysiskt, och att det krävs ”ett jävla pannben” för att vara med. Än i dag har hon fortfarande ärr kvar efter såren. ”Jag hade otroligt ont, jag kunde knappt lyfta min vänster arm ordentligt”, skriver hon. Efter att ha fått såren slutade hon att doppa armarna i vattnet i onödan. ”Om de inte var vattentävling såklart, då var de bara att bita ihop och plåstra om igen e
