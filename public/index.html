randra”.\n\n– En del av mig tycker det. Men samtidigt, den mer rationella delen av mig tycker att de behövs nog ändå, säger han och fortsätter: – Dels behöver vi deras röster och dels tycker jag att vi har haft ett förbaskat konstruktivt samarbete nu i tre år som har gått mycket bättre än vad jag vågade hoppas. Jag tycker allt bättre om det partiet faktiskt. Spelar upp ljud från porrsajt I avsnittet spelar Emil Persson också upp introljudet som spelas upp innan klippen på en känd porrsajt utan att tala om var ljudet kommer ifrån, och frågar partiledaren om det låter bekant. Åkesson går rakt i fällan. – Det lät bekant, helt klart, svarar han.\n\nÄr det en sajt du frekventerar? – Nej, det kan jag inte påstå att det är. Absolut inte. Journalisten och programledaren Emil Persson har under flera år drivit Fördomspodden. I programmet utsätter han riksdagens partiledare för sina egna fördomar om dem.  Magdalena Andersson (S), Ebba Busch (KD) och Simona Mohamsson (L) har gästat programmet i tidigare avsnitt.", "link": "https://www.tv4.se/artikel/6ANXUJIGgLqaPelXGETUGg/akessons-smocka-mot-l-det-hade-varit-skoent-att-slippa-dem", "date_display": "2026-05-08", "date_iso": "2026-05-08T05:31:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/politik", "/inrikes", "/personer/jimmie-akesson-sd", "/valet-2022/sverigedemokraterna", "/svensk-politik"]}, {"id": 148, "title": "Here are Sweden's worst and best municipalities - for children", "summary": "Among other things, Unicef ​​has looked at how large the children's groups are in preschool, how many qualified teachers there are in primary school and how much money is spent on leisure activities.  - A good municipality has a very good grasp of its children and young people. They have more dialogue with their children and young people and have an administration that takes joint responsibility, says Pernilla Baralt, Secretary General at Unicef ​​Sweden. The differences are large between the municipalities. The highest ranked Dorotea gets an index value of 96.08 and the worst municipality Haninge gets 26.59. Smaller rural municipalities are better at investing in children compared to big cities and commuting municipalities, even though larger municipalities often have more money.  - We get a big inequality among children in Sweden, some children get their rights met and others don't. Socio-economically, it has enormous consequences if we have children whose living conditions mean that they do not get a good enough primary school, they have no leisure activities or that social services do not take care of the children who need to be placed.  Haninge disagrees Unicef ​​will now take a closer look at exactly why smaller municipalities perform better, but they think it may have to do with the size of the municipalities. Communication becomes easier and the walls between the administrations fewer. - In a worse municipality, we can see that the differences between children and young people are greater. You invest, you do incredibly good things, but you don't reach all the children.  The chairman of the municipal board in Haninge, Sven Gustafsson (M), thinks that quality is very difficult to measure in terms of money. - In rankings like this, which measure how much deposited money you have, the taxpayers' money, then prosperous municipalities with low taxes always end up far down. I have good company with Österåker, Täby and Staffanstorp. He believes that Haninge municipality invested a lot in children, including preventive efforts in the excluded areas of Brandbergen and Jordbro. - We are working hard to ensure that they are no longer classified as vulnerable areas. The criticism: \"Second comm", "title_original": "Här är Sveriges sämsta och bästa kommuner – för barn", "summary_original": "Unicef har bland annat tittat på hur stora barngrupperna är i förskolan, hur många behöriga lärare som finns i grundskolan och hur mycket pengar som läggs på fritidsverksamhet.  – En bra kommun har väldigt bra koll på sina barn och unga. De har mer dialog med sina barn och unga och har en förvaltning som tar ett gemensamt ansvar, säger Pernilla Baralt, generalsekreterare på Unicef Sverige. Skillnaderna är stora mellan kommunerna. Högst rankade Dorotea får ett indexvärde på 96,08 och sämsta kommunen Haninge får 26,59. Mindre glesbygdskommuner är bättre på att investera i barn jämfört med storstäder och pendlingskommuner, trots att större kommuner ofta har mer pengar.  – Vi får en stor ojämlikhet bland barn i Sverige, vissa barn får sina rättigheter tillgodosedda och andra inte. Samhällsekonomiskt får det enorma konsekvenser om vi har barn som har livsvillkor som gör att de inte får en tillräckligt bra grundskola, de har inga fritidsaktiviteter eller att socialtjänsten inte tar hand om de barnen som behöver placeras.  Haninge håller inte med Exakt varför mindre kommuner presterar bättre kommer Unicef nu titta närmre på, men de tror att det kan ha att göra med storleken på kommunerna. Kommunikationen blir lättare och murarna mellan förvaltningarna färre. – I en sämre kommun kan vi se att skillnaderna mellan barn och unga är större. Man satsar, man gör otroligt mycket bra saker, men man når inte alla barn.  Kommunstyrelsens ordförande i Haninge, Sven Gustafsson (M), tycker att kvalitet är väldigt svårt att mäta i pengar. – I sådana här rankingar, som mäter hur mycket insatta pengar man har, skattebetalarnas pengar, då hamnar alltid välmående kommuner med låg skatt långt ner. Jag har gott sällskap med Österåker, Täby och Staffanstorp. Han menar att Haninge kommun satsat mycket på barn, bland annat förebyggande insatser inom utanförskapsområdena Brandbergen och Jordbro. – Vi jobbar stenhårt på att de inte ska vara klassade som utsatta områden längre. Kritiken: ”Andra kommuner satsar mer” Men Haningeborna Mimmi Rickard och sonen Louie är inte förvånade över att kommunen hamnar längst ner på listan. – Man märker att andra kommuner satsar mer. Det finns inte så mycket att göra här och det som finns är långt bort, säger Mimmi Rickard. Hon tycker att politikerna hade kunnat göra mer. – Det känns som att man hade kunnat lägga mer tid och resurser på barnen.", "link": "https://www.tv4.se/artikel/wKtXL225PF8lqFbJQcbcV/haer-aer-sverige-saemsta-och-baesta-kommuner-foer-barn", "date_display": "2026-05-08", "date_iso": "2026-05-08T04:08:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/kommuner", "/haninge", "/unicef"]}, {"id": 149, "title": "I cannot vote for a party that wants to include the right to abortion in the constitution", "summary": "Does KD seriously want Sweden to be a country that, in its constitution, the foundation of Sweden's democracy and the one our country builds its future on, wants to promote death before life? writes Paul Juhlin.", "title_original": "Jag kan inte rösta på ett parti som vill få in rätten till abort i grundlagen", "summary_original": "Vill KD på fullaste allvar att Sverige ska vara ett land som i sin grundlag, fundamentet för Sveriges demokrati och det vårt land bygger sin framtid på, vill främja död före liv? skriver Paul Juhlin.", "link": "https://www.dagen.se/debatt/jag-kan-inte-roesta-pa-ett-parti-som-vill-fa-in-raetten-till-abort-i-grundlagen/10330701", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "\"Bosse\", 85, lost two million kroner to fraudsters", "summary": "\"They felt like friends who would help me with investments\" - at the last conversation the tone changed completely", "title_original": "”Bosse”, 85, förlorade två miljoner kronor till bedragare", "summary_original": "”De kändes som kompisar som skulle hjälpa mig med investeringar” – vid sista samtalet ändrades tonen helt", "link": "https://www.dagen.se/dokument/bosse-85-foerlorade-tva-miljoner-kronor-till-bedragare/10306024", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "Elderly scams gobble up millions - 'stop being polite'", "summary": "Fraud against the elderly is a major societal problem that devours millions each year • Through text messages, calls and home visits, the victim is manipulated into giving up information and valuables • The shame surrounding this is great", "title_original": "Bedrägerier mot äldre slukar miljoner – ”sluta vara artig”", "summary_original": "Bedrägerier mot äldre är ett stort samhällsproblem som varje år slukar miljoner • Genom sms, samtal och hembesök manipuleras offret att lämna ifrån sig uppgifter och värdesaker • Skammen kring detta är stor", "link": "https://www.dagen.se/dokument/bedraegerier-mot-aeldre-slukar-miljoner-sluta-vara-artig/10312368", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Gislaved's pastorate cancels collaboration with Barnens Oas – LGBTQ view the reason", "summary": "Have previously arranged camps together for socially vulnerable families in the local area.", "title_original": "Gislaveds pastorat avbryter samarbete med Barnens Oas – hbtq-syn orsaken", "summary_original": "Har tidigare arrangerat läger tillsammans för socialt utsatta familjer i närområdet.", "link": "https://www.dagen.se/nyheter/gislaveds-pastorat-avbryter-samarbete-med-barnens-oas-hbtq-syn-orsaken/10335348", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "A year with a Pope who speaks with a light voice on heavy issues.", "summary": "Erik Helmerson: The words about LGBTQ and Trump show – Leo XIV is a man of his time.", "title_original": "Ett år med en påve som talar med lätt röst om tunga frågor.", "summary_original": "Erik Helmerson: Orden om hbtq och Trump visar – Leo XIV är en man av sin tid.", "link": "https://www.dagen.se/ledare/ett-ar-med-en-pave-som-talar-med-laett-roest-om-tunga-fragor/10332764", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "The minister after the free churches' loss of millions: There is \"potential for improvement\"", "summary": "Social Affairs Minister Jakob Forssmed (KD): \"I don't think the authority can say that everything is fixed and finished.\"", "title_original": "Ministern efter frikyrkornas miljontapp: Det finns ”förbättringspotential”", "summary_original": "Socialministern Jakob Forssmed (KD): ”Tror inte att myndigheten kan säga att allt är fixt och färdigt.”", "link": "https://www.dagen.se/nyheter/ministern-efter-frikyrkornas-miljontapp-det-finns-foerbaettringspotential/10335507", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "The Migration Court must start following the law", "summary": "In some cases, the Swedish Migration Agency has not used the correct information when the decision was made. Shouldn't that count as new circumstances with the court? writes Nuri Kino.", "title_original": "Migrationsdomstolen måste börja följa lagen", "summary_original": "I vissa fall har Migrationsverket inte använt sig av rätt information när beslutet fattades. Ska då inte det räknas som nya omständigheter hos domstolen? skriver Nuri Kino.", "link": "https://www.dagen.se/debatt/migrationsdomstolen-maste-boerja-foelja-lagen/10331390", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "We thought our lives would be ruined if we kept a child", "summary": "Arguments against abortion did not bite me. It was Jesus' love and grace that transformed me, writes Linda Bergling in a reply.", "title_original": "Vi tyckte att våra liv skulle bli förstörda om vi behöll ett barn", "summary_original": "Argument mot abort bet inte på mig. Det var Jesu kärlek och nåd som förvandlade mig, skriver Linda Bergling i en replik.", "link": "https://www.dagen.se/debatt/vi-tyckte-att-vara-liv-skulle-bli-foerstoerda-om-vi-behoell-ett-barn/10330222", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "\"I hate feeling like a victim - No one should feel sorry for me\"", "summary": "Priest Lacra von Schedvin has written a book about living with chronic pain", "title_original": "”Jag hatar att känna mig som ett offer – Ingen ska få tycka synd om mig”", "summary_original": "Prästen Lacra von Schedvin har skrivit en bok om att leva med kronisk smärta", "link": "https://www.dagen.se/kultur/jag-hatar-att-kaenna-mig-som-ett-offer-ingen-ska-fa-tycka-synd-om-mig/10325364", "date_display": "2026-05-08", "date_iso": "2026-05-08T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The US has attacked Iran: \"A push of love\"", "summary": "Threatens more powerful attacks – again • “Every robot shot down”", "title_original": "USA har attackerat Iran: ”En kärleksknuff”", "summary_original": "Hotar med kraftfullare attacker – igen • ”Varenda robot sköts ned”", "link": "https://www.tv4.se/artikel/6aQynYCOuVm3X1zWJl1rwH/usa-bombar-iranska-mal", "date_display": "2026-05-07", "date_iso": "2026-05-07T20:58:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes"]}, {"id": 159, "title": "Norwegian giant note - when American soldier fell asleep in the shower", "summary": "It was at the beginning of August last year that a soldier from the US Navy checked into a hotel in Bergen, Norway. According to documents obtained by the newspaper Forsvarets forum, the soldier then allegedly sat down in the hotel bar and drank until closing time. Later that night, hotel staff noticed water dripping in the lobby and were soon able to trace the leak to the soldier's room. Water was pouring out into the corridor and when the staff finally managed to wake up the soldier by knocking on the door, they discovered leftover food in the shower drain.  Blame the bar The soldier is believed to have spat in – and fallen asleep over – the shower drain, causing a shutdown that had far-reaching consequences. Eight hotel rooms, four corridors, a restaurant and a staff room suffered water damage.  In addition to the repair costs, the hotel also suffered a large loss of income as they were forced to close the affected parts during the renovation. The final bill was NOK 654,292.  It is paid for by the Norwegian Armed Forces, which is now considering claiming the money from the United States. - It is still being processed in the defense staff, which will hand the matter over to the Ministry of Defense shortly, says Caroline Lysne, press spokesperson at the Norwegian Armed Forces, to the Defense Forum.  At the same time, the defense forces believe that the responsibility for the incident may lie partly with the hotel. The soldier should be blamed for drinking too much, writes chief legal officer Marianne Bisset Sperre in an email to the newspaper, but one should also ask \"to what extent the hotel bar may have contributed to it\". Not on leave The Forsvarets forum newspaper has asked the US Navy what the soldier was doing in Norway and what department he belongs to, questions the Navy refuses to answer citing \"operational security\".  However, it is clear that he was not on leave at the time, which is why the compensation has so far been handled by the US's NATO ally Norway. However, it appears that the soldier may have been reprimanded.  \"The am", "title_original": "Norska jättenotan – när amerikansk soldat somnade i duschen", "summary_original": "Det var i början av augusti förra året som en soldat från den amerikanska flottan checkade in på ett hotell i norska Bergen. Enligt dokument som tidningen Forsvarets forum tagit del av ska soldaten sedan ha satt sig i hotellbaren och druckit till stängning. Senare under natten märkte hotellpersonal att det droppade vatten i lobbyn och kunde snart spåra läckan till soldatens rum. Det rann vatten ut i korridoren och när personalen till slut lyckades väcka soldaten genom att banka på dörren upptäckte de matrester i duschavloppet.  Skyller på baren Soldaten tros ha spytt i – och somnat över – duschavloppet, vilket orsakade ett totalstopp som fick omfattande konsekvenser. Åtta hotellrum, fyra korridorer, en restaurang och ett personalrum fick vattenskador.  Utöver reparationskostnaderna drabbades hotellet dessutom av stora inkomstbortfall då de tvingades hålla stängt i de berörda delarna under renoveringen. Slutnotan blev 654 292 norska kronor.  Den är betald av den norska försvarsmakten som nu överväger att kräva in pengarna från USA. – Det behandlas fortfarande i försvarsstaben som ska lämna över frågan till Försvarsdepartementet inom kort, säger Caroline Lysne, presstalesperson på norska försvarsmakten, till Forsvarets forum.  Samtidigt menar försvarsmakten att ansvaret för händelsen delvis kan ligga på hotellet. Soldaten bör klandras för att ha druckit för mycket, skriver chefsjurist Marianne Bisset Sperre i ett mejl till tidningen, men man bör också fråga sig ”i vilken utsträckning hotellbaren kan ha bidragit till det”. Inte på permission Tidningen Forsvarets forum har frågat den amerikanska flottan vad soldaten gjorde i Norge och vilken avdelning han tillhör, frågor som flottan vägrar att svara på med hänvisning till ”operativ säkerhet”.  Det står dock klart att han inte var på permission vid det aktuella tillfället, och det är därför skadeståndet hittills har hanterats av USA:s Nato-allierade Norge. Det verkar dock som att soldaten kan ha tillrättavisats.  ”Den amerikanska flottan förväntar sig att alla våra soldater efterlever vårda värderingar (ära, mod och engagemang). När de inte gör det så hålls de ansvariga”, skriver flottans presskontakt Madisyn Hansen i ett mejl till den norska tidningen.", "link": "https://www.tv4.se/artikel/3SIq3lbMWjh2eWd7NxrK9f/norska-jaettenotan-naer-amerikansk-soldat-somnade-i-duschen", "date_display": "2026-05-07", "date_iso": "2026-05-07T20:42:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/norge", "/skadestand"]}, {"id": 160, "title": "Sick leave Debbie looked after children - owed a quarter of a million", "summary": "Debbie Landberg is a single mother in Avesta, and full-time sick leave for the muscle disease fibromyalgia and burnout. When there was no preschool place, Debbie decided to take care of her child at home. She asked Försäkringskassan if it went well even though she had sickness benefit, and was helped to fill in her application. - I am concerned that it would be right, and was completely open about my situation. The answer then was that of course it worked well to combine childcare and sick leave, says Debbie Landberg. Must pay back SEK 237,834 But after just over a year, new information came from Försäkringskassan, which Avesta Tidning was the first to tell about. As Debbie had been at home taking care of a child, her ability to work was not judged to be impaired. Therefore, Försäkringskassan decided that she must repay SEK 237,834. - I was both shocked and surprised. In the decision, Försäkringskassan admitted that they had made a mistake. But it's still me who has to pay. It feels completely absurd, says Debbie Landberg. In Försäkringskassan's decision, which TV4 Nyheterna has seen, the authority admits that they \"have caused the incorrect payments by breaching their duty to investigate\". But because the authority believes that Debbie Landberg should have realized that she received too much money, she will still be liable for repayment.  F-skassan: Regrettable if you received incorrect information The Social Insurance Agency does not want to be interviewed, but press secretary Gustav Berg writes to TV4 Nyheterna: \"We cannot comment on the individual case. If you received incorrect information from the Social Insurance Agency, it is of course very regrettable. Otherwise, we decline to comment on this further and await the review in the administrative court.\" Debbie Landberg says that she herself never reflected on the payments. - It was about the same sums as it usually was before I took parental leave. I never saw it as an excessive amount. \"I'll never be able to pay it back\" Debbie Landber", "title_original": "Sjukskrivna Debbie vårdade barn – blev skyldig kvarts miljon", "summary_original": "Debbie Landberg är ensamstående mamma i Avesta, och heltidssjukskriven för muskelsjukdomen fibromyalgi och utbrändhet. När det saknades förskoleplats beslöt Debbie att ta hand om sitt barn hemma. Hon frågade Försäkringskassan om det gick bra trots att hon hade sjukpenning, och fick hjälp att fylla i sin ansökan. – Jag är mån om att det skulle bli rätt, och var helt öppen med min situation. Svaret då var att det självklart gick bra att kombinera vård av barn och sjukskrivning, berättar Debbie Landberg. Ska betala tillbaka 237 834 kronor Men efter drygt ett år kom nya besked från Försäkringskassan, vilket Avesta Tidning var först att berätta om. Eftersom Debbie hade varit hemma och tagit hand om ett barn bedömdes hennes arbetsförmåga inte vara nedsatt. Därför beslutade Försäkringskassan att hon ska betala tillbaka 237 834 kronor. – Jag blev både ställd och förvånad. I beslutet erkände Försäkringskassan att de gjort fel. Men det är ändå jag som ska betala. Det känns helt absurt, säger Debbie Landberg. I Försäkringskassans beslut, som TV4 Nyheterna tagit del av, erkänner myndigheten att de \"har orsakat de felaktiga utbetalningarna genom att brista i sin utredningsskyldighet\". Men eftersom myndigheten anser att Debbie Landberg borde ha insett att hon fick för mycket pengar, blir hon ändå återbetalningsskyldig.  F-kassan: Beklagligt om man fått fel information Försäkringskassan vill inte ställa upp på en intervju men pressekreterare Gustav Berg skriver så här till TV4 Nyheterna: ”Vi kan inte kommentera det enskilda fallet. Om man fått fel information från Försäkringskassan är det givetvis väldigt beklagligt. I övrigt avböjer vi att kommentera detta ytterligare och inväntar prövningen i förvaltningsrätten.” Debbie Landberg säger att hon själv aldrig reflekterade över utbetalningarna. – Det var ungefär samma summor som det brukar vara innan jag blev föräldraledig. Jag såg det aldrig som något överdrivet belopp. ”Jag kommer aldrig klara av att betala tillbaka” Debbie Landberg har nu överklagat till Förvaltningsrätten. Men vardagen har blivit mycket annorlunda efter Försäkringskassans beslut. Återbetalningskravet har gått till Kronofogden och med ränta växt till 242 000 kronor. Debbie går nu på försörjningsstöd. Och oron för hur vardagen ska gå ihop med pengar till mat, bensin och sonen finns alltid där. Tårarna rinner ned för Debbies kinder när hon berättar: – Jag kommer aldrig klara av att betala tillbaka det här. Det är många kvällar jag sitter och gråter för att det tär så mycket. Jag tycker det är jobbigt att prata om. Man känner sig ganska ensam i en sådan här situation.", "link": "https://www.tv4.se/artikel/3YMtYdPTUewgcmB5puQT6b/sjukskrivna-debbie-vardade-barn-blev-skyldig-kvarts-miljon", "date_display": "2026-05-07", "date_iso": "2026-05-07T19:15:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/forsakringskassan", "/barnomsorg"]}, {"id": 161, "title": "Piensoho aims for unexpectedly quick return after hip surgery", "summary": "\"Now it's rehab after a new hip replacement that applies,\" says Equmenia Church's deputy church leader.", "title_original": "Piensoho siktar på oväntat snabb återkomst efter höftoperation", "summary_original": "”Nu är det rehab efter en ny höftprotes som gäller”, säger Equmeniakyrkans biträdande kyrkoledare.", "link": "https://www.dagen.se/nyheter/piensoho-siktar-pa-ovaentat-snabb-aterkomst-efter-hoeftoperation/10334038", "date_display": "2026-05-07", "date_iso": "2026-05-07T13:40:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "In memory of Alice Ljungberg", "summary": "Martin Ström, international mission leader at the Swedish Alliance Mission, has written this eulogy about her", "title_original": "Till minne av Alice Ljungberg", "summary_original": "Martin Ström, internationell missionsledare på Svenska alliansmissionen, har skrivit detta minnesord om henne", "link": "https://www.dagen.se/familj/till-minne-av-alice-ljungberg/10328702", "date_display": "2026-05-07", "date_iso": "2026-05-07T11:55:22+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 163, "title": "Prime Minister receives President of Germany Frank-Walter Steinmeier", "summary": "Germany is Sweden’s most important trading partner, and the world’s fourth-largest economy. On Wednesday 6 May, Prime Minister Ulf Kristersson received Germany’s Federal President Frank-Walter Steinmeier in Stockholm for a meeting on regional security policy, total defence and cooperation between Sweden and Germany.", "title_original": "Prime Minister receives President of Germany Frank-Walter Steinmeier", "summary_original": "Germany is Sweden’s most important trading partner, and the world’s fourth-largest economy. On Wednesday 6 May, Prime Minister Ulf Kristersson received Germany’s Federal President Frank-Walter Steinmeier in Stockholm for a meeting on regional security policy, total defence and cooperation between Sweden and Germany.", "link": "https://www.government.se/articles/2026/05/prime-minister-receives-president-of-germany-frank-walter-steinmeier/", "date_display": "2026-05-07", "date_iso": "2026-05-07T11:29:26+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "1 day old", "tags": ["EU", "Prime Minister's Office", "Economic policy", "Foreign and security policy", "Article", "Innovation", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Total defence", "Jessica Rosencrantz"]}, {"id": 164, "title": "Trump can fall - on his own: \"Shouldn't say anything\"", "summary": "Diplomats warn • \"Doesn't seem to understand\"", "title_original": "Trump kan falla – på eget grepp: ”Borde inte säga någonting”", "summary_original": "Diplomater varnar • ”Verkar inte förstå”", "link": "https://www.tv4.se/artikel/327H8wzJclryQhxb7cMMvk/trump-kan-falla-pa-eget-grepp-han-borde-inte-saega-nagonting", "date_display": "2026-05-07", "date_iso": "2026-05-07T07:45:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 165, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "The risk that the war in the Middle East will lead to higher inflation has increased somewhat. At the same time, inflation is currently below the target and the latest outcomes have been clearly lower than in the Riksbank's forecast in March. In addition, the economy is weak. This means that there is room to wait for a clearer picture of the war's effects and the supply disruptions it entails. The executive board has decided to leave the key interest rate unchanged at 1.75 percent. The current level of the key interest rate gives the Riksbank a good starting point to adjust monetary policy if necessary to protect the inflation target.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Risken för att kriget i Mellanöstern leder till högre inflation har ökat något. Samtidigt är inflationen i nuläget under målet och de senaste utfallen har varit tydligt lägre än i Riksbankens prognos i mars. Därtill är  konjunkturen svag. Det gör att det finns utrymme att invänta en tydligare bild av krigets effekter och de utbudsstörningar det medför. Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent. Den nuvarande nivån på styrräntan ger Riksbanken ett bra utgångsläge att anpassa penningpolitiken om det behövs för att värna inflationsmålet.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent3/", "date_display": "2026-05-07", "date_iso": "2026-05-07T07:30:29+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "2 days old", "tags": []}, {"id": 166, "title": "The risen Christ confirms something other than Hick's pluralism", "summary": "Where pluralism prevails, the mission is easily reduced to aid, dialogue and presence. But the Spirit that works on the mission fields does not seem to call people to a general religious depth dimension, writes Lars Gunther in a reply.", "title_original": "Den uppståndne Kristus bekräftar något annat än Hicks pluralism", "summary_original": "Där pluralism slår igenom reduceras missionen lätt till bistånd, dialog och närvaro. Men den Ande som verkar på missionsfälten tycks inte kalla människor till en allmän religiös djupdimension, skriver Lars Gunther i en replik.", "link": "https://www.dagen.se/debatt/den-uppstandne-kristus-bekraeftar-nagot-annat-aen-hicks-pluralism/10324039", "date_display": "2026-05-07", "date_iso": "2026-05-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 167, "title": "Who has the right to the rural churches – the parishioners or the organization?", "summary": "Let's start using our rural churches again. Let lay people take their place in the pulpit on a larger scale, writes Eva-Lotta Kalman.", "title_original": "Vem har rätt till landsbygdskyrkorna – församlingsmedlemmarna eller organisationen?", "summary_original": "Låt oss börja använda våra landsbygdskyrkor igen. Låt lekmän i större skala ta plats i predikstolen, skriver Eva-Lotta Kalman.", "link": "https://www.dagen.se/debatt/vem-har-raett-till-landsbygdskyrkorna-foersamlingsmedlemmarna-eller-organisationen/10314334", "date_display": "2026-05-07", "date_iso": "2026-05-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 168, "title": "Arvsfonden abolishes the requirement for \"democratic construction\" for religious communities", "summary": "The changed rules may lead to more applications from religious communities.", "title_original": "Arvsfonden slopar kravet på ”demokratisk uppbyggnad” för trossamfunden", "summary_original": "De ändrade reglerna kan komma leda till fler ansökningar från trossamfund.", "link": "https://www.dagen.se/nyheter/arvsfonden-slopar-kravet-pa-demokratisk-uppbyggnad-foer-trossamfunden/10332567", "date_display": "2026-05-07", "date_iso": "2026-05-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 169, "title": "The MUCF director after the loss of millions for the free churches: \"It raises questions\"", "summary": "The authority is now preparing \"a situational picture\" to be presented to the government • \"We are not the ones who have decided on the regulations,   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
