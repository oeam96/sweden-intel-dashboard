essen på Trump att svara militärt har ökat. – Kriget har blivit ett ihållande mörkt moln som försurar den nationella stämningen, vilket vanligtvis sänker basen för det parti som har makten och motiverar oppositionens anhängare, säger republikanen Carlos Curbelo.", "link": "https://www.tv4.se/artikel/5uPWFWZgTd5PtQrSHgUMY4/oron-foer-trump-vaexer-inom-partiet-ihallande-moerkt-moln", "date_display": "2026-07-21", "date_iso": "2026-07-21T20:05:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/donald-trump", "/usa", "/usavalet", "/politiker", "/republikanerna", "/mellanarsvalet-usa", "/iran", "/irankriget"]}, {"id": 156, "title": "Fled in panic from the balcony - after bloody ax attack in home", "summary": "A man received an ax blow to the head and injuries to his arm and leg after a violent fight in his home on Vindö in Värmdö on April 5. To get away, he is said to have jumped from a balcony and then made his way to a fire station to get help. Now two men, 27 and 42 years old, are charged with serious assault. Both deny wrongdoing. According to the indictment, the men allegedly chopped the plaintiff in the head with an ax and cut him in the arm and leg with a knife or other sharp object. The prosecutor believes that they showed \"special recklessness\" by attacking the man in his own home. Completely different versions The plaintiff has told that two men came to the address twice on the same day. On the second visit, according to him, they must have entered the house and attacked him with an ax and knife. At Karolinska University Hospital, injuries were found in the left temple, left arm and left thigh. The injuries were stitched and the man remained for observation overnight. According to the coroner, the injuries were not life-threatening. There is no clear motive in the investigation. However, the plaintiff states that he believes the attack may be connected to an ongoing land dispute. The accused men give a completely different picture of the incident. The 27-year-old man, who uses the alias \"Per Morberg 2.0\" on the Signal platform, describes the conflict as insignificant. - There must have been some small quarrel or quarrel. I actually don't remember exactly what it was about, he says in police interrogation. \"We drive man against man\" The 42-year-old man says that he and the younger man had already been at the property the night before to look for the plaintiff. - We were there the night before and knocked. Lighted up a bit like that and no one opened at all and we went home, he says. According to the man, they returned the next day and entered through a door that was ajar. He claims he heard the younger man shout and then saw the plaintiff standing with an axe. - I take two steps forward and stab him in the arm. For him to drop the ax, which he doesn't.  He claims", "title_original": "Flydde i panik från balkongen – efter blodig yxattack i hemmet", "summary_original": "En man fick ett yxhugg mot huvudet och skador på arm och ben efter ett våldsamt bråk i sitt hem på Vindö i Värmdö den 5 april. För att komma undan ska han ha hoppat från en balkong och därefter tagit sig till en brandstation för att få hjälp. Nu åtalas två män, 27 och 42 år gamla, för grov misshandel. Båda nekar till brott. Enligt åtalet ska männen tillsammans ha huggit målsäganden med en yxa i huvudet och skurit honom i armen och benet med kniv eller annat eggvasst föremål. Åklagaren menar att de visat ”särskild hänsynslöshet” genom att angripa mannen i hans eget hem. Helt olika versioner Målsäganden har berättat att två män kom till adressen två gånger samma dag. Vid det andra besöket ska de enligt honom ha tagit sig in i huset och attackerat honom med yxa och kniv. På Karolinska universitetssjukhuset konstaterades skador i vänster tinning, vänster arm och vänster lår. Skadorna syddes och mannen blev kvar för observation över natten. Enligt rättsläkaren var skadorna inte livshotande. Något klarlagt motiv finns inte i utredningen. Målsäganden uppger dock att han tror att attacken kan ha koppling till en pågående marktvist. De åtalade männen ger en helt annan bild av händelsen. Den 27-årige mannen, som på plattformen Signal använder aliaset ”Per Morberg 2.0”,  beskriver konflikten som obetydlig. – Det var väl något litet gräl eller gnabb. Jag kommer faktiskt inte ihåg exakt vad det handlade om, säger han i polisförhör. ”Vi kör man mot man” Den 42-årige mannen berättar att han och den yngre mannen hade varit vid fastigheten redan kvällen före för att söka upp målsäganden. – Vi var där kvällen innan och knackade på. Lyste lite sådär och ingen som öppnade alls och vi åkte hem, säger han. Enligt mannen återvände de dagen därpå och gick in genom en dörr som stod på glänt. Han hävdar att han hörde den yngre mannen ropa till och sedan såg målsäganden stå med en yxa. – Jag tar två steg fram och hugger han i armen. För att han ska släppa yxan vilket han inte gör.  Han hävdar att han därefter såg ytterligare två yxor på golvet. – Så jag okej, vi kör man mot man med yxor. Så jag börjar med att ta yxan, säger 42-åringen. Enligt honom hoppade målsäganden därefter från balkongen. Samtidigt konstaterar rättsläkaren att både målsägandens och den misstänktes version i teorin kan förklara de dokumenterade skadorna. Yxa hittades vid marina Under utredningen hittade polisen en yxa vid Kanholmsfjärdens marina. På yxan fanns blod och dna som enligt Nationellt forensiskt centrum med mycket stark sannolikhet kommer från målsäganden. ”Yxan låg synligt i gräset under parkeringsplatsens träräcke. Yxan hade ett träskaft som var ca 57 cm långt och ett yxhuvud i metall som var ca 16 cm långt”, skriver polisen. Polisen har även granskat mobiltelefoner, chattar och mastuppkopplingar. Enligt utredningen befann sig båda de åtalade männens telefoner i området vid tiden för händelsen. Utredarna hittade dessutom en handskriven lapp med målsägandens adress. En handstilsanalys talar enligt åklagaren starkt för att den skrivits av den yngre av de åtalade männen. Händelsen utreddes inledningsvis som försök till mord. När åtal väcktes valde åklagaren i stället rubriceringen grov misshandel.", "link": "https://www.tv4.se/artikel/VbMnhEtMv7F3g9WS3miz2/flydde-i-panik-fran-balkongen-efter-blodig-yxattack-i-hemmet", "date_display": "2026-07-21", "date_iso": "2026-07-21T18:30:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/misshandel", "/stockholm", "/nacka", "/varmdo", "/brott", "/brottsoffer", "/brott-och-straff"]}, {"id": 157, "title": "Threatening words through the wall - before the beating at the institution", "summary": "In 2022, 41-year-old Taher Amini was sentenced to life imprisonment and deportation for aggravated rape and attempted murder after pushing a woman down 24 meters in a mine hole in Norberg. Now he is in a new legal process – this time as the plaintiff, reports Sala Allehanda. Several punches and kicks According to the newspaper, he was said to have been beaten in May 2023. Now the prosecutor has filed charges against a fellow inmate who is suspected of serious assault. The defendant denies any crime, but the investigation includes, among other things, surveillance footage from the incident. According to Sala Allehanda, Taher Amini is seen standing in the prison's kitchen doing dishes when another inmate comes forward and hits him so that he falls to the floor. After that, he is said to have been subjected to several blows and kicks to the body. The assault must have caused serious injuries. Why it took so long for the prosecution to be brought is not clear. \"We will have a talk tomorrow\" Taher Amini and the fellow inmate are said to have lived in the same corridor at the institution at the time of the incident. According to Amini, he heard the suspect banging loudly on the wall. When he asked his roommate what the commotion was about, the suspect allegedly said through the wall: \"We'll have a talk tomorrow.\" In questioning with the police, Amini states that he thought the fellow inmate wanted to talk to him. \"Not that I would be treated that way,\" he says, according to the newspaper. When the accused was allowed to see the surveillance video during questioning, he did not want to comment on the content.", "title_original": "Hotfulla orden genom väggen – innan misshandeln på anstalten", "summary_original": "2022 dömdes 41-årige Taher Amini till livstids fängelse och utvisning för grov våldtäkt och mordförsök efter att ha knuffat ner en kvinna 24 meter i ett gruvhål i Norberg. Nu är han i en ny rättsprocess – den här gången som målsägande, rapporterar Sala Allehanda. Flera slag och sparkar Enligt tidningen ska han ha blivit misshandlad i maj 2023. Nu har åklagaren väckt åtal mot en medintagen som misstänks för grov misshandel. Den åtalade nekar till brott, men i utredningen finns bland annat övervakningsfilm från händelsen. Enligt Sala Allehanda syns Taher Amini stå och diska i anstaltens kök när en annan intagen kommer fram och slår honom så att han faller till golvet. Därefter ska han ha utsatts för flera slag och sparkar mot kroppen. Misshandeln ska ha orsakat allvarliga skador. Varför det dröjt så långt tid till att åtalet väckts framgår inte. ”Vi ska ha ett snack i morgon” Taher Amini och den medintagne ska vid tiden för händelsen ha bott i samma korridor på anstalten. Enligt Amini hörde han hur den misstänkte bankade högljutt i väggen. När han frågade sin rumskamrat vad oväsendet handlade om ska den misstänkte ha sagt genom väggen: ”Vi ska ha ett snack imorgon”. I förhör med polisen uppger Amini att han trodde att den medintagne ville prata med honom. ”Inte att jag skulle bli bemött på det sättet”, säger han enligt tidningen. När den åtalade fick ta del av övervakningsfilmen under förhör ville han inte kommentera innehållet.", "link": "https://www.tv4.se/artikel/3YF4rO60XC5SJSGg05fUhm/hotfulla-orden-genom-vaeggen-innan-misshandeln-pa-anstalten", "date_display": "2026-07-21", "date_iso": "2026-07-21T16:03:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/gruvdramat-i-norberg"]}, {"id": 158, "title": "1,000 people searched for Hillevi, 3 – who was sleeping", "summary": "Anna Hieta and Robin Samuelsson had invited friends over for dinner last Saturday. They were just about to start eating when they noticed that daughter Hillevi, who had been playing with the other children all day, was gone. Something P4 Norrbotten has also reported on.  - We searched in houses, in storage rooms, caravans, garages, on and under the balcony and at the neighbour's house. Yes, everywhere, says Anna Hieta to TV4 Nyheterna. \"She was completely invisible\" In the end they called the police and since Hillevi hadn't been drinking for a long time and her shoes were also missing, an extensive search was launched. - Two picket trucks and an ambulance. Rescue service by boat. And I'm glad I never saw the divers on this boat. But of course extremely grateful that they were prepared, she says. Anna also posted in a local Facebook group - not knowing how many people would show up. - In the end, our entire street was full. I have been told how incredibly many people were here in the village. There were people everywhere – every single farm, the whole forest and the surrounding meadows. They walked along all the paths, dragging their feet through the grass and looking all the way to the river. - There were probably a thousand people. After two hours of searching, she was found in what was actually the sunniest place of all - in the family's caravan, where they had previously lived for two weeks.\n\n- There are probably ten to 20 adults who have been in there. It was the second place the police searched. But we had rolled up a bed mattress, it was the roommate who found her, but she had basically rolled herself into it a bit. It looked completely flat, like a small ball - she was completely invisible inside. It was only when he pulled it and just: \"But is this true?\". Freshly awake – and angry at dad for waking Anna Hieta had time to think of the worst – both that someone could have taken Hillevi and that she could have ended up in water. When she got the news that her daughter had been found, she ran out into the yard. - Then she was completely awake. She was really just mad at dad, because she absolutely wanted to sleep. And then cow", "title_original": "1 000 personer letade efter Hillevi, 3 – som låg och sov", "summary_original": "Anna Hieta och Robin Samuelsson hade bjudit hem vänner på middag i lördags. De skulle precis börja äta när de märkte att dottern Hillevi, som lekt med de andra barnen hela dagen, var borta. Något även P4 Norrbotten har rapporterat om.  – Vi letade i hus, i förråd, husvagn, garage, på och under altanen och hos grannen. Ja, överallt, säger Anna Hieta till TV4 Nyheterna. ”Hon var helt osynlig” Till slut ringde de polisen och eftersom Hillevi inte hade druckit på länge och dessutom saknade skor drog en omfattande sökinsats i gång. – Två piketbilar och ambulans. Räddningstjänst med båt. Och jag är glad att jag aldrig såg dykarna på den här båten. Men oerhört tacksam givetvis för att de var beredda, säger hon. Anna la också ut ett inlägg i en lokal Facebookgrupp – utan att kunna ana hur många som skulle dyka upp. – Till slut var hela vår gata full. Jag har fått det återberättat hur otroligt många människor som var här i byn. Det var människor överallt – varenda gård, hela skogen och ängarna runtomkring. De gick längs alla stigar, drog fötterna genom gräset och letade ända bort mot älven. – Det var säkert tusen personer. Efter två timmars sökande hittades hon på en plats som egentligen var den mest solklara av alla – i familjens husvagn, där de tidigare hade bott i två veckor.\n\n– Det är säkert tio till 20 vuxna som har varit där inne. Det var den andra platsen som polisen letade i. Men vi hade rullat upp en bäddmadrass, det var ju sambon som hittade henne, men hon hade ju i princip rullat in sig i den lite grann. Det såg helt platt ut, som en liten boll – hon var helt osynlig längst inne. Det var först när han drog i den och bara: ”Men är det här sant?”. Nyvaken – och arg på pappa som väckte Anna Hieta hann tänka på det värsta – både att någon kunde ha tagit Hillevi och att hon kunde ha hamnat i vatten. När hon fick beskedet att dottern var hittad sprang hon ut på gården. – Då var hon helt nyvaken. Hon var egentligen bara arg på pappa, för hon ville absolut sova. Och så kom jublande applåder från människorna på gatan. – Att få hitta ett barn och känna att hon är helt oskadd… Det fanns ingenting annat runt oss då. I dag är Anna Hieta fortfarande tagen av händelsen, men kanske framför allt av hur många som slöt upp för att hjälpa till att leta. – Känna att det är så många som letar, hon kan liksom inte försvinna då. Det lugnade mig väldigt, väldigt mycket. De stod och grät här på gatan för att alla kände så mycket med oss. – Det rullade in människor med rullstol och permobil. Hur mycket barn som helst cyklade runt. Det blev så tydligt att även om inte vi känner varandra så har vi ändå koll på varandra här i byn. Det var fantastiskt.", "link": "https://www.tv4.se/artikel/5MermxQNPqQRWvUNVmtug/flera-byar-letade-i-timmar-efter-hillevi-3-som-sov-i-husvagnen", "date_display": "2026-07-21", "date_iso": "2026-07-21T16:01:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/barn", "/forsvinnande", "/pitea"]}, {"id": 159, "title": "Johanna's legs began to swell - it took years before she was diagnosed", "summary": "Johanna Jingnert was in puberty when her legs began to swell and become sensitive to pressure. - I felt that the body lived its own life and I became increasingly disproportionate, she tells Nyhetsmorgon.  After visiting several different health centers in 2017, she was diagnosed with lipedema, a disease that almost exclusively affects women. Lipedema usually begins with increased fat tissue on the lower body and \"hormonal storms\". - For example, during the first period, when you have given birth or when you lose your period, says Sue Mellgrim, nurse and medical lymphatic therapist.  The disease can also be associated with physical or psychological trauma.  Disproportionality A common symptom of lipedema is a disproportionality between the lower and upper body. The lower body becomes larger in relation to the upper body.  - At first, the women think they have gained weight. They may start dieting and eating disorders are common, but you can't diet away lipoedema, says Sue Mellgrim.  There is also pain in the affected areas, either constantly or only when pressure is applied, and you often bruise easily.  Johanna Jingnert recognizes the symptoms well, but it took several years before she suspected that she was suffering from an illness, and when she did seek care, it was not easy to get a diagnosis.  - I had to apply to several health centers and ended up enrolling in Gothenburg, where my parents live. So it was only in 2017 that I received a diagnosis and understood what it was, she says.  - It explained all the symptoms I didn't understand and which I thought were my fault. That I ate wrong and that I didn't exercise enough.  Easy to walk When she received the diagnosis, Johanna Jingnert looked up information and quickly realized that many people seem to have been helped by surgery.  - So, with the help of my parents, I booked three operations. It is very expensive and you have to pay for it yourself, she says.  The operations helped and she notices a big difference. In the beginning, it felt especially easy when she was out", "title_original": "Johannas ben började svullna – tog år innan hon fick diagnosen", "summary_original": "Johanna Jingnert var i puberteten när benen började svullna och bli tryckkänsliga. – Jag kände att kroppen levde sitt eget liv och jag blev allt mer oproportionerlig, berättar hon i Nyhetsmorgon.  Efter besök på flera olika vårdcentraler fick hon 2017 diagnosen lipödem, en sjukdom som nästan uteslutande drabbar kvinnor. Lipödem börjar oftast med ökad fettvävnad på underkroppen och \"hormonstormar\". – Exempelvis vid första menstruationen, när man fött barn eller när man förlorar sin menstruation, säger Sue Mellgrim, sjuksköterska och medicinsk lymfterapeut.  Sjukdomen kan också komma i samband med fysiskt eller psykiskt trauma.  Oproportionalitet Ett vanligt symtom på lipödem är en oproportionalitet mellan under- och överkropp. Underkroppen blir större i förhållande till överkroppen.  – Till en början tror kvinnorna att de gått upp i vikt. De kanske börjar tokbanta och ätstörningar är vanliga, men man kan inte banta bort lipödem, säger Sue Mellgrim.  Det uppkommer också smärta i de drabbade områdena, antingen konstant eller bara vid tryck, och man har ofta lätt att få blåmärken.  Johanna Jingnert känner igen symtomen väl, men det dröjde flera år innan hon misstänkte att hon led av en sjukdom och när hon väl sökte vård var det inte helt enkelt att få en diagnos.  – Jag fick söka mig till flera vårdcentraler och det slutade med att jag fick skriva mig i Göteborg där mina föräldrar bor. Så det var först 2017 som jag fick en diagnos och förstod vad det var, säger hon.  – Det förklarade alla de symtom jag inte förstått och som jag trodde var mitt fel. Att jag åt fel och att jag inte tränade tillräckligt.  Lätt att gå När hon fått diagnosen sökte Johanna Jingnert upp information och insåg snabbt att många verkar ha blivit hjälpta av operation.  – Så med hjälp av mina föräldrar bokade jag in tre operationer. Det är väldigt dyrt och man får stå för det själv, säger hon.  Operationerna hjälpte och hon märker stor skillnad. I början kändes det framför allt lätt när hon var ute och gick. Sue Mellgrim förklarar att man främst behandlar lipödem med kompression. Då trycks den inflammerade vätskan mellan cellerna tillbaka och smärtan minskar.  Utöver det och fettsugningsoperationer kan bland annat fysisk aktivitet och goda kostvanor hjälpa.", "link": "https://www.tv4.se/artikel/6XuwJHJwLh2XdTqv2VMj7M/johannas-ben-boerjade-svullna-tog-ar-innan-hon-fick-diagnosen", "date_display": "2026-07-21", "date_iso": "2026-07-21T14:03:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Hälsa", "/halsa", "/mode", "/lipodem", "/sjukdomar", "/vard", "/nyhetsmorgon"]}, {"id": 160, "title": "Brawl after the final: \"It's illegal\"", "summary": "Noted sales may be halted • “Bad deal for New Jersey”", "title_original": "Gräsbråk efter finalen: ”Det är olagligt”", "summary_original": "Uppmärksammade försäljningen kan stoppas • ”Dålig affär för New Jersey”", "link": "https://www.tv4.se/artikel/32VjgFzcRjswUdedB1Ay10/graesbrak-efter-finalen-det-aer-olagligt", "date_display": "2026-07-21", "date_iso": "2026-07-21T11:21:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 161, "title": "Jacob Zetterman: Now it's free dinner", "summary": "It was different in the past when three expectant children waited for their pancakes", "title_original": "Jacob Zetterman: Nu är det fri middag som gäller", "summary_original": "Annat var det förr då tre förväntansfulla barn väntade på sina pannkakor", "link": "https://www.dagen.se/familj/jacob-zetterman-nu-aer-det-fri-middag-som-gaeller/10384860", "date_display": "2026-07-21", "date_iso": "2026-07-21T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 162, "title": "The Church speaks of leaders – the Bible speaks of servants", "summary": "The word \"servant\" is mentioned over 800 times in the Bible.   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
