ng the changes she made.  \"Against this background, it is requested that the Government Office immediately initiate an independent review of the Director General's actions, including", "title_original": "Visselblåsare varnar om allvarliga brister hos myndigheten", "summary_original": "Det kommer hård kritik mot Jämställdhetsmyndighetens generaldirektör Lise Tamm i en granskning från tidskriften Ottar. Bland annat vittnar flera anställda på myndigheten i Göteborg om detaljstyrning, tystnadskultur och att hon bortser från fakta.  – Hon är besatt av tanken att det är fullt med aktivister på myndigheten, och har en lista med personer hon inte vill ska jobba här. Hon använder nyanställda som informanter, och kallar in dem för att de ska rapportera om kollegor, säger en anställd till Ottar.  I mitten av februari skickades ett visselblåsarärende, som TV4 Nyheterna tagit del av, till regeringskansliet. I brevet radas flera delar av kritiken upp. Till att börja med handlar det om Lise Tamms relation till en forskare på myndigheten. Visselblåsaren menar att personen valdes in myndighetens forskarråd istället för andra mer etablerade forskare. ”Mot bakgrund av deras personliga relation bör detta prövas ur ett jävsperspektiv, i enlighet med förvaltningslagens krav på saklighet och opartiskhet.” Mycket lågt förtroende I medarbetarenkäter träder även ett mycket lågt förtroende för generaldirektören fram, enligt visselblåsaren. Arbetsmiljön beskrivs som mycket belastande och vissa medarbetare lider av psykisk ohälsa, vilket gör att de överväger att sluta. Något som även GP rapporterade om i höstas.  ”Det finns en påtaglig risk för omfattande personalomsättning och ökade sjukskrivningar.” Ett av syftena med att rekrytera den nya generaldirektören i slutet av 2024 var att de tidigare arbetsmiljöproblemen skulle förbättras. Men visselblåsaren beskriver hur Lise Tamm detaljstyr medarbetare, tillrättavisar dem och inte bemöter alla likvärdigt.  En artikel från Göteborgs-Posten lyfts också fram. Där kritiseras kommunikationsavdelningen av Lise Tamm för att de ”uppenbarligen inte lyckats” med att föra ut de förändringar som hon gjort.  ”Mot denna bakgrund begärs att Regeringskansliet skyndsamt initierar en oberoende granskning av generaldirektörens agerande, inklusive frågor om jäv, arbetsmiljöansvar och ledarskap.” Svaret: ”Jag håller inte med om allt” Generaldirektör Lise Tamm har inte haft tid med intervju och bemöter kritiken i ett mejl till TV4 Nyheterna. ”Min tolkning är att personen som skrivit detta ger uttryck för en frustration och jag tror det är viktigt att lyssna och ta till sig av de synpunkter som medarbetare för fram. Jag håller inte med om allt men jag är mån om att alla medarbetare ska trivas och ha en bra arbetsmiljö.” På frågan om att initiera en utredning kring kritiken skriver hon: ”Jag noterar att jag har ett tydligt stöd i min roll från regeringen för det förändringsarbete vi genomför.” När det gäller medarbetarundersökningar tar hon resultaten på ”stort allvar”. Ledningsgruppen arbetar nu med att identifiera vad problemen handlar om och ta fram en handlingsplan, skriver hon. Att hon detaljstyr medarbetare är ”svårt att kommentera” eftersom hon inte vet vilka situationer som syftas på.  I en intervju med Ottar menar Lise Tamm att anklagelserna om jäv saknar grund. De finns få forskare inom rätt fält och han valdes eftersom han suttit i flera utredningar. – Vi har inte jobbat ihop tidigare. Han har suttit som expert i en av mina utredningar, men jag känner honom inte.  När det gäller att offentligt kritisera delar av myndigheten skriver hon att det ”absolut inte varit menat som en kritik mot mina medarbetare”. Det finns, enligt henne, olika uppfattningar kring frågan om hedersrelaterat våld och förtryck, där det uppstått ”diskussioner”.", "link": "https://www.tv4.se/artikel/4wSXPF9rkPgQDUGafewpRH/visselblasare-varnar-om-allvarliga-brister-pa-myndigheten", "date_display": "2026-05-29", "date_iso": "2026-05-29T18:56:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/jamstalldhetsmyndigheten", "/myndigheter"]}, {"id": 155, "title": "Record seizures of the deadly drug - have killed hundreds in Europe", "summary": "The finding was made in connection with an extensive investigation into serious extortion of over SEK 25 million, serious money laundering crimes, fraud and eco-crimes.  During a crackdown on one of the suspects, a 45-year-old man who had previously served time for murder after executing his ex-girlfriend with a gunshot to the head, the police made an unexpected discovery - without realizing it at first. Tablets and powder were found in, among other things, the ceiling of the man's office in the Stockholm area. The police initially suspected that it was only about doping preparations. But when the analysis answers from the forensics came, it turned out to be about the unusual and life-threatening drug Nitazen, which the Customs Service has seized a few times since 2019 - when the substance began to spread. The seizure consisted of 184 grams of powder with a purity of 80 percent and 24,682 tablets. The suspicion: Would resell the death drug Nitazen is a collective name and belongs to the group of synthetic new opioids. The substance is extremely potent and has similar effects to morphine, heroin and fentanyl – but much worse. The risk of overdose is very high and the horror drug has killed hundreds of people in Europe. - Think of a regular headache tablet but that it contains metonitazen instead. Break it into a thousand pieces. The small grain you get can be enough to kill, said Robert Kronstrand, the Chief Toxicologist of the Swedish Medicines Agency, in a warning in the fall of 2024. Several Swedish authorities have worked hard to prevent the spread of nitazene in Sweden. Targeted campaigns have been carried out after fearing a similar wave of deaths as fentanyl caused in Sweden between 2015 and 2018. Two years ago, Robert Kronstrand stated that the police's efforts \"strangled the supply\" of nitazene. Erik Lindeman is a senior physician at the Poison Information Center and will testify in the trial against the 45-year-old. - We have been spared in Sweden from both fentanyls and nitazenes for most of modern times. In periods there have been parties, just like in that", "title_original": "Rekordbeslag av livsfarliga drogen – har dödat hundratals i Europa", "summary_original": "Fyndet gjordes i samband med en omfattande utredning om grov utpressning på över 25 miljoner kronor, grova penningtvättsbrott, bedrägerier och ekobrott.  Vid ett tillslag mot en av de misstänkta, en man i 45-årsåldern som tidigare avtjänat ett straff för ett mord efter att ha avrättat sin exflickvän med skott i huvudet, gjorde polisen ett oväntat fynd – utan att först förstå det. I bland annat innertaket på mannens kontor i Stockholmsområdet hittades tabletter och pulver. Polisen misstänkte till en början att det enbart handlade om dopingpreparat. Men när analyssvaren från forensikerna kom visade det sig handla om den ovanliga och livsfarliga drogen Nitazen, som Tullverket tagit i beslag ett fåtal gånger sedan 2019 – då substansen började spridas. Beslaget bestod av 184 gram pulver med en renhetsgrad om 80 procent och 24 682 tabletter. Misstanken: Skulle sälja vidare dödsdrogen Nitazen är ett samlingsnamn och tillhör gruppen syntetiska nya opioider. Substansen är extremt potent och har liknande effekter som morfin, heroin och fentanyl – men mycket värre. Risken för överdos är väldigt stor och skräckdrogen har dödat hundratals personer i Europa. – Tänk en vanlig huvudvärkstablett men att den i stället innehåller metonitazen. Dela den i tusen bitar. Det lilla korn ni får kan vara tillräckligt för att döda, sa Robert Kronstrand, Rättsmedicinalverkets chefstoxikolog, i en varning hösten 2024. Flera svenska myndigheter och arbetat hårt för att förhindra en spridning av nitazener i Sverige. Man har genomfört riktade kampanjer efter att ha fruktat en liknande dödsvåg som fentanyl orsakade i Sverige mellan 2015 och 2018. För två år sedan uppgav Robert Kronstrand att polisens insatser ”strypt tillgången” på nitazener. Erik Lindeman är överläkare på Giftinformationscentralen och ska vittna i rättegången mot 45-årsåldern. –  Vi har varit förskonade i Sverige från både fentanyler och nitazener under större delen av modern tid. I perioder har det kommit partier, precis som i det här fallet, som har sålts. Då har man sett att dödstalen har gått upp. Mardrömsscenariot Enligt åklagaren misstänks mannen i 45-årsåldern ha haft nitazener i syfte att sälja vidare den livsfarliga drogen. Han står nu åtalad för synnerligen grovt narkotikabrott och dopingbrott. USA har under de senaste åren haft stora problem med olika typer av fentanyler, vilket lett till skyhöga dödstal. Med bra laboratorium och gott om råvaror är nitazener billiga att tillverka, vilket gör de attraktiva för drogförsäljarna, säger Erik Lindeman.  – Mardrömsscenariot är egentligen att vi ska få det som i USA. Där är nästan alla droger, även lugnande tabletter och centralstimulerande amfetaminliknande droger utblandade med fentanyl.  Han vill verkligen betona hur farliga substanserna är. – Vi blir ofta uppringda när folk överdoserat olika substanser och behöver sjukhusvård. Men just nitazener och fentanyler blir vi sällan tillfrågade om. Människorna som tar de här tabletterna hittas döda, och hinner inte ringa Giftinformationscentralen.", "link": "https://www.tv4.se/artikel/6MtvCCKbzgrTbEspGJBFY7/rekordbeslag-av-livsfarliga-drogen-har-doedat-hundratals-i-europa", "date_display": "2026-05-29", "date_iso": "2026-05-29T18:43:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/narkotikabrott", "/brott", "/stockholm"]}, {"id": 156, "title": "Took almost 100 hours of tax paid language lessons - in English", "summary": "When ministers are appointed, they are offered language support to improve their English in particular before international meetings and contexts. TV4 News has gone through the invoices for the ministers' language studies and one minister stands out: Minister of Civil Affairs Erik Slottner. Since March 2023, the Prime Minister has continuously taken private lessons in English. In total, it is about 78 hours of lessons. - It can sound like a lot over a roughly three-year period. If you boil this down to what it is about per week, it is about three quarters of a week's teaching. Then it is less and then I think it is reasonable, says Erik Slottner and adds that he acted in accordance with the regulations. A total of 93 hours of language teaching The minister has also chosen to take 15 hours of private lessons in Spanish - a total of 93 hours of language teaching. Other ministers have also taken language lessons via the government office, including Migration Minister Johan Forssell (M), Social Security Minister Anna Tenje (M) and Rural Affairs Minister Peter Kullgren (KD), but then it has been about significantly fewer hours - around 5 to 15 in number. - I thought that my English needed to improve in order to adopt these international contexts and not least in the area of ​​digitization, issues related to public procurement and administrative policy. It's not really the English I've used before. It has increased my security when I have been out representing Sweden, says Erik Slottner. Cost the taxpayers roughly SEK 84,000 In total, the government office has been billed SEK 105,000 for Erik Slottner's language lessons. Due to special rules for the state regarding VAT, the cost to the taxpayers amounts to just over SEK 84,000. - We have different skills, different abilities and talents. Unfortunately, English has not been my strongest talent, says Erik Slottner. After TV4 Nyheterna asked questions about the private lessons, the minister's press staff announces that no further language lessons are planned.", "title_original": "Tog nästan 100 timmars skattebetalda språklektioner – i engelska", "summary_original": "När statsråd tillsätts erbjuds de språkstöd för att putsa till framför allt engelskan inför internationella möten och sammanhang. TV4 Nyheterna har gått igenom fakturorna för ministrarnas språkstudier och en minister sticker ut: civilminister Erik Slottner. Sedan mars 2023 har statsrådet löpande tagit privatlektioner i engelska. Sammanlagt handlar det om 78 timmars lektioner. – Det kan låta mycket under en dryg treårsperiod. Trattar man ner det här till vad det handlar om per vecka så handlar det om trekvarts undervisning i veckan. Då är det mindre och då tycker jag att det är rimligt, säger Erik Slottner och fyller i att han agerat enligt regelverket. Totalt 93 timmars språkundervisning Ministern har dessutom valt att ta 15 timmars privatlektioner i spanska – totalt alltså 93 timmars språkundervisning. Även andra ministrar har tagit språklektioner via regeringskansliet, bland andra migrationsminister Johan Forssell (M), socialförsäkringsminister Anna Tenje (M) och landsbygdsminister Peter Kullgren (KD), men då har det handlat om betydligt färre timmar – omkring 5 till 15 till antalet. – Jag tyckte att min engelska behövde bli bättre för att anta de här internationella sammanhangen och inte minst inom digitaliseringsområdet, frågor som rör offentlig upphandling och förvaltningspolitik. Det är inte den engelska riktigt jag har använt innan. Det har ökat min trygghet när jag har varit ute och representerat Sverige, säger Erik Slottner. Kostat skattebetalarna drygt 84 000 kronor Totalt har regeringskansliet fakturerats 105 000 kronor för Erik Slottners språkundervisning. På grund av särskilda regler för staten gällande moms landar kostnaden för skattebetalarna på drygt 84 000 kronor. – Vi har olika kompetenser, olika förmågor och talanger. Tyvärr har engelska inte varit min starkaste talang, säger Erik Slottner. Efter att TV4 Nyheterna ställt frågor om privatlektionerna, meddelar ministerns presstab att någon ytterligare språkundervisning inte är planerade.", "link": "https://www.tv4.se/artikel/tWVntjaPJ3VkuhTFavZEH/tog-naestan-100-timmars-skattebetalda-spraklektioner-i-engelska", "date_display": "2026-05-29", "date_iso": "2026-05-29T17:12:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/politik", "/erik-slottner", "/regeringskansliet"]}, {"id": 157, "title": "Done: New management team for Pentecost FFS chosen", "summary": "Great joy and prayers when the Pentecostal movement chose a leader at the council meeting in Uppsala.", "title_original": "Klart: Nytt föreståndarteam för Pingst FFS valt", "summary_original": "Stor glädje och förböner när pingströrelsen valde ledare vid rådslaget i Uppsala.", "link": "https://www.dagen.se/nyheter/klart-nytt-foerestandarteam-foer-pingst-ffs-valt/10370927", "date_display": "2026-05-29", "date_iso": "2026-05-29T16:19:07+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Here, Bezos's billion-dollar rocket explodes - a threat to the US's lunar plans", "summary": "The extent of the financial damage after the explosion is still unclear. According to several media, both the rocket and parts of the launch facility may have been damaged in the accident. The engine test was carried out ahead of a planned satellite launch next week. Rival Musk New Glenn has been in development for almost a decade and is one of Jeff Bezos' biggest investments in the space industry. The rocket is expected to play a central role in Blue Origin's future lunar ventures and the competition with Elon Musk's Space X. Both Bezos and Musk are competing for billion-dollar contracts from Nasa and the US military. But both projects have been marred by explosions, delays and technical problems. Bezos emphasizes that no one was injured in the explosion and promises that the work will continue. - It is too early to say what the root cause is, but we are already working to find out, writes Bezos. Even Elon Musk commented on the explosion. - I am saddened to see this. Hope you recover quickly, he writes on X. Could affect the US lunar program Nasa chief Jared Isaacman describes the space industry as \"unforgiving\" and says it is still too early to know how hard the Artemis program is affected. - Developing launch capacity for heavy cargo is extraordinarily difficult, he writes. Nasa will now together with Blue Origin and the American aviation authority FAA investigate the explosion.", "title_original": "Här exploderar Bezos miljardraket – hot mot USA:s månplaner", "summary_original": "Hur stora de ekonomiska skadorna är efter explosionen är fortfarande oklart. Enligt flera medier kan både raketen och delar av uppskjutningsanläggningen ha skadats i haveriet. Motortestet genomfördes inför en planerad satellituppskjutning nästa vecka. Konkurrent till Musk New Glenn har utvecklats under nästan ett decennium och är en av Jeff Bezos största satsningar inom rymdindustrin. Raketen väntas spela en central roll i Blue Origins framtida månsatsningar och konkurrensen med Elon Musks Space X. Både Bezos och Musk tävlar om miljardkontrakt från Nasa och den amerikanska militären. Men båda projekten har kantats av explosioner, förseningar och tekniska problem. Bezos betonar att ingen människa skadades i explosionen och lovar att arbetet ska fortsätta. – Det är för tidigt att säga vad grundorsaken är, men vi arbetar redan för att ta reda på det, skriver Bezos. Även Elon Musk kommenterade explosionen. – Jag blir ledsen av att se detta. Hoppas ni återhämtar er snabbt, skriver han på X. Kan påverka USA:s månprogram Nasachefen Jared Isaacman beskriver rymdindustrin som ”oförlåtande” och säger att det ännu är för tidigt att veta hur hårt Artemis-programmet påverkas. – Att utveckla uppskjutningskapacitet för tung last är extraordinärt svårt, skriver han. Nasa ska nu tillsammans med Blue Origin och den amerikanska luftfartsmyndigheten FAA utreda explosionen.", "link": "https://www.tv4.se/artikel/5qyYp2ZpD44yV6Y2ZkkxX3/haer-exploderar-bezos-miljardraket-hot-mot-usa-s-manplaner", "date_display": "2026-05-29", "date_iso": "2026-05-29T16:09:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/jeff-bezos", "/nasa", "/usa"]}, {"id": 159, "title": "Former SVT top saw the documentary: \"A complete breakdown\"", "summary": "SVT's documentary series \"Documents from within: The heirs\" has aroused strong reactions since its premiere on May 13. The series depicts events at the Lundsberg boarding school, where four students were convicted in December 2025 of several cases of assault against younger students.  - The victims' perspective is completely missing. If SVT wants to make a documentary, why do they contact the perpetrators? They turn the perpetrators into victims. Everything is based on Gunilla von Platen's perspective and they try to create an image that everyone is a victim, said a parent of one of the boys who had been abused.  \"Slept through the whole process\" Now the former SVT CEO Eva Hamilton is also criticizing her old employer. - This time I think Document from the inside is a complete disaster. The responsible publisher appears to have slept through the entire process, she says.  Eva Hamilton believes that the publication is lacking on several points. Among other things, she questions that SVT has chosen to make three episodes about a case that is still being processed legally. - Then it goes against the most basic journalistic principle. The parents of the perpetrators, of those who have committed the assault, are allowed to give their full version, while the version of those who are victims of crime is not heard at all, she says. Calling the handling a mystery She also criticizes the way the violence is described in the series. - Calling the beating the \"January incident\" throughout the series I also think is very strange, says Hamilton.  According to her, it is about a fundamental lack of publishing in the series. - The way to handle this entire release is a mystery to me. I don't understand how it happened.", "title_original": "Tidigare SVT-topp sågar dokumentären: ”Ett fullständigt haveri”", "summary_original": "SVT:s dokumentärserie ”Dokument inifrån: Arvtagarna” har väckt starka reaktioner sedan premiären den 13 maj. Serien skildrar händelser på internatskolan Lundsberg, där fyra elever i december 2025 dömdes för flera fall av misshandel mot yngre elever.  – Offrens perspektiv saknas helt och hållet. Om SVT vill göra en dokumentär, varför kontaktar man då förövarna? De förvandlar förövarna till offer. Allt bygger på Gunilla von Platens perspektiv och man försöker skapa en bild av att alla är offer, sa en förälder till en av de pojkar som blivit misshandlade.  ”Sovit genom hela processen” Nu riktar även den tidigare SVT-vd:n Eva Hamilton kritik mot sin gamla arbetsgivare. – Den här gången tycker jag att Dokument inifrån är ett fullständigt haveri. Ansvarig utgivare ser ut att ha sovit genom hela processen, säger hon.  Eva Hamilton menar att publiceringen brister på flera punkter. Bland annat ifrågasätter hon att SVT valt att göra tre avsnitt om ett fall som fortfarande behandlas rättsligt. – Sen strider det mot den mest basala journalistiska principen. Man låter föräldrarna till förövarna, till de som har begått misshandeln, ge hela sin version, medan versionen av de som är brottsoffer hör man ingenting av, säger hon. Kallar hanteringen en gåta Hon kritiserar också hur våldet beskrivs i serien. – Att kalla misshandeln för “januari-incidenten” under hela serien tycker jag också är väldigt märkligt, säger Hamilton.  Det handlar, enligt henne, om ett grundläggande bristande utgivarskap i serien. – Sättet att hantera hela den här utgivningen är för mig en gåta. Jag förstår inte hur det har gått till.", "link": "https://www.tv4.se/artikel/2i1qsmzL18XswVRu9NZ4j3/tidigare-svt-toppen-sagar-dokumentaeren-ett-fullstaendigt-haveri", "date_display": "2026-05-29", "date_iso": "2026-05-29T14:49:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/svt", "/journalistik", "/lundsbergs-skola"]}, {"id": 160, "title": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "title_original": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary_original": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "link": "https://www.government.se/press-releases/2026/05/minister-for-rural-affairs-to-host-ministerial-conference-on-future-of-forests/", "date_display": "2026-05-29", "date_iso": "2026-05-29T14:01:19+00:00", "source": "Government.se", "ministry": "Ministry of Rural Affairs and Infrastructure", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "EU", "International", "Rural affairs, agriculture and food production", "Ministry of Rural Affairs and Infrastructure", "Peter Kullgren"]}, {"id": 161, "title": "Putin may be deceived by his own military: \"He still lives in the illusion\"", "summary": "Vladimir Putin may have received an incorrect and embellished picture of how things are going for Russia in Ukraine. This is stated by the think tank Institute for the Study of War (ISW). The background is a leaked map from the Russian Ministry of Defense showing major Russian gains in the Zaporizhzhya region in April. But according to ISW, the picture does not match. There is no evidence that Russian forces have taken several of the areas identified as conquered. In several cases, it is about single intrusions and not about control. \"System failure\" ISW points to a pattern where successes are exaggerated upwards in the system. – System error. System error is the word, says Russia expert Malcolm Dixelius. - The Russian army is deeply corrupt and no one in the leadership wants to be the bearer of bad news, he continues.  According to him, it can cause Putin to get an increasingly distorted picture of the situation, which in turn can influence decisions in the Kremlin. - The risk is one hundred percent. It is clear that he makes wrong decisions, says Dixelius. According to him, it is primarily a matter of Putin running the risk of drawing the wrong conclusion about the war as a whole. - The first incorrect conclusion is that the war can be won and therefore he prolongs it, says Dixelius. It may also mean that he refrains from entering into negotiations, despite the fact that developments on the battlefield speak against a military victory. Living in an illusion At the same time, several analyzes show that the Russian advance has slowed down. Despite that, Putin can, according to Dixelius, cling to an incorrect image. - He starts the war in an illusion and he lives on in that illusion, he says. According to him, that image is reinforced by the exaggerated reports from the military. - There may be a grain of truth, but they exaggerate the importance of it to mark their place, their strength in the system, says Dixelius.", "title_original": "Putin kan bli lurad av sin egen militär: ”Han lever kvar i illusionen”", "summary_original": "Vladimir Putin kan ha fått en felaktig och förskönad bild av hur det går för Ryssland i Ukraina. Det uppger tankesmedjan Institute for the Study of War (ISW). Bakgrunden är en läckt karta från det ryska försvarsdepartementet som visar stora ryska framgångar i Zaporizjzja-regionen i april. Men enligt ISW stämmer bilden dåligt. Det saknas bevis för att ryska styrkor tagit flera av de områden som pekas ut som erövrade. I flera fall handlar det om enstaka inträngningar och inte om kontroll. ”Systemfel” ISW pekar på ett mönster där framgångar överdrivs uppåt i systemet. – Systemfel. Systemfel är ordet, säger Rysslandskännaren Malcolm Dixelius. – Den ryska armén är djupt korrupt och ingen i ledningen vill vara bäraren av dåliga nyheter, fortsätter han.  Enligt honom kan det göra att Putin får en allt mer skev bild av läget, vilket i sin tur kan påverka besluten i Kreml. – Risken är ju hundra procent. Det är klart att han fattar felaktiga beslut, säger Dixelius. Enligt honom handlar det i första hand om att Putin riskerar att dra fel slutsats om kriget som helhet. – Den första felaktiga slutsatsen är att kriget går att vinna och därför förlänger han det, säger Dixelius. Det kan också innebära att han avstår från att gå till förhandlingar, trots att utvecklingen på slagfältet talar emot en militär seger. Lever kvar i en illusion Samtidigt visar flera analyser att den ryska framryckningen bromsat in. Trots det kan Putin, enligt Dixelius, hålla fast vid en felaktig bild. – Han startar kriget i en illusion och han lever kvar i den illusionen, säger han. Enligt honom förstärks den bilden av de överdrivna rapporterna från militären. – Det kanske finns ett korn av sanning, men de överdriver betydelsen av det för att markera sin plats, sin styrka i systemet, säger Dixelius.", "link": "https://www.tv4.se/artikel/1Bhvb62uCSSTJRHO2ypcEQ/putin-kan-bli-lurad-av-sin-egen-militaer-han-lever-kvar-i-illusionen", "date_display": "2026-05-29", "date_iso": "2026-05-29T12:43:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ryssland", "/sanktioner-mot-ryssland", "/ukraina", "/kriget-i-ukraina", "/ukrainakonflikten", "/putin", "/vladimir-putin", "/zelenskyj"]}, {"id": 162, "title": "JD Vance: US and Iran 'very close' to a deal", "summary": "Then the Strait of Hormuz can be opened • Up to Trump to sign", "title_original": "JD Vance: USA och Iran ”väldigt nära” ett avtal", "summary_original": "Då kan Hormuzsundet öppnas • Upp till Trump att skriva under", "link": "https://www.tv4.se/artikel/3d17I9YWaE3db1VQbBefs/jd-vance-usa-och-iran-vaeldigt-naera-ett-avtal", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:59:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 163, "title": "The war in the Middle East entails risks for financial stability", "summary": "The war in the Middle East has created turbulence in the financial markets, but the global financial system has functioned well. However, the uncertainty is great. The longer the war continues, the greater the risk that inflation and interest rates will increase at the same time as the economy deteriorates, which could negatively affect several financial markets and actors. There are also several global vulnerabilities that could reinforce each other and exacerbate such a negative development. Sweden has a good starting position, but there are structural risks in the banking system, for example linked to the banks' international dependencies and significant exposures to the commercial real estate sector.", "title_original": "Kriget i Mellanöstern medför risker för den finansiella stabiliteten", "summary_original": "Kriget i Mellanöstern har skapat turbulens på de finansiella marknaderna, men det globala finansiella systemet har fungerat väl. Osäkerheten är dock stor. Ju längre kriget fortgår desto större är risken att inflationen och räntorna ökar samtidigt som konjunkturen försämras, vilket kan påverka flera finansiella marknader och aktörer negativt. Det finns dessutom flera globala sårbarheter som skulle kunna förstärka varandra och förvärra en sådan negativ utveckling. Sverige har ett bra utgångsläge, men det finns strukturella risker i banksystemet exempelvis kopplade till bankernas internationella beroenden och betydande exponeringar mot den kommersiella fastighetssektorn.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/kriget-i-mellanostern-medfor-risker-for-den-finansiella-stabiliteten/", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:30:22+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "2 days old", "tags": []}, {"id": 164, "title": "Ministerial visit to Ukraine focused on health care and situation for women", "summary": "On 11–13 May, Minister for Health Care Elisabet Lann and Minister for Gender Equality Nina Larsson visited Kyiv and Lviv. The aim of their visit was to gain insight into Ukraine’s health and medical care and the situation for women during Russia’s full-scale invasion.", "title_original": "Ministerial visit to Ukraine focused on health care and situation for women", "summary_original": "On 11–13 May, Minister for Health Care Elisabet Lann and Minister for Gender Equality Nina Larsson visited Kyiv and Lviv. The aim of their visit was to gain insight into Ukraine’s health and medical care and the situation for women during Russia’s full-scale invasion.", "link": "https://www.government.se/articles/2026/05/ministerial-visit-to-ukraine-focused-on-health-care-and-situation-for-women/", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:00:55+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "2 days old", "tags": ["International", "Ministry of Emplo rolin about the 1994 WC?", "summary": "Sweden hopes to repeat the bronze success from the World Cup in the USA in 1994. But how much do you know about the World Cup feat 32 years ago? We had World Championship hero Tomas Brolin and the secretary of the performance committee Anders Lindblad test the quiz - try here if you crack them!", "title_original": "Quiz: Kan du mer än Brolin om VM 1994?", "summary_original": "Sverige hoppas kunna upprepa bronssuccén från fotbolls-VM i USA 1994. Men hur mycket kan du om VM-bragden för 32 år sedan? Vi lät VM-hjälten Tomas Brolin och bragdnämndens sekreterare Anders Lindblad testa quizet – prova här om du bräcker dem!", "link": "https://www.svd.se/a/vrkpp5/quiz-vad-kan-du-om-vm-94", "date_display": "2026-05-28", "date_iso": "2026-05-28T05:54:45+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": ["Sport"]}, {"id": 177, "title": "\"I'm not too fond of hotel breakfast, I've been eating that for 40 years\"", "summary": "Margareta \"Maggan\" Brandt turns 80.", "title_original": "”Jag är inte så förtjust i hotellfrukost, det har jag ätit i 40 år”", "summary_original": "Margareta ”Maggan” Brandt fyller 80 år.", "link": "https://www.dagen.se/familj/jag-aer-inte-sa-foertjust-i-hotellfrukost-det-har-jag-aetit-i-40-ar/10344449", "date_display": "2026-05-28", "date_iso": "2026-05-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 178, "title": "Jimmie Åkesson (SD): Why don't the churches see the enormous problems?", "summary": "The SD leader on the view of civil society and the churches' view of migration.", "title_original": "Jimmie Åkesson (SD): Varför ser inte kyrkorna de enorma problemen?", "summary_original": "SD-ledaren om synen på civilsamhället och kyrkornas syn på migration.", "link": "https://www.dagen.se/nyheter/jimmie-akesson-sd-varfoer-ser-inte-kyrkorna-de-enorma-problemen/10297744", :22+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "13 days old", "tags": ["International", "Prime Minister's Office", "Ministry for Foreign Affairs", "International development cooperation", "Article", "Maria Malmer Stenergard", "Ulf Kristersson"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
