et och kärnkraften. – I teorin kan biståndet skäras ner till noll. Jag vill se en framtid där vi lägger ner Sida, säger Oscar Sjöstedt (SD).", "link": "https://www.dn.se/sverige/sd-vill-krympa-bistandet-lagg-ner-sida/", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:30:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 93, "title": "The charming Crimean \"Swindlers\" are more cozy than raffles", "summary": "British \"Swindlers\" revolve around a set of disgraced and money-hungry characters with a classic casino at the center. An entertaining and likeable series with a light dose of social criticism, writes Fredrik Sahlin.", "title_original": "Krimcharmiga ”Svindlarna” är mer mys än raffel", "summary_original": "Brittiska ”Svindlarna” rör sig kring en uppsättning skamfilade och pengahungriga rollfigurer med ett klassiskt kasino i centrum. En underhållande och sympatisk serie med en lättare dos samhällskritik, skriver Fredrik Sahlin.", "link": "https://www.dn.se/kultur/krimcharmiga-svindlarna-ar-mer-mys-an-raffel/", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:17:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Asian Caesar Salad", "summary": "Today's dinner tip offers a moderate version of the classic caesar salad with juicy fried chicken, a wonderfully tasty and creamy sesame dressing, crispy romaine lettuce and crispy sourdough croutons. See Jennie Walldén's recipe", "title_original": "Asiatisk caesarsallad", "summary_original": "Dagens middagstips bjuder en matig variant av klassikern caesarsallad med saftigt stekt kyckling, en underbart god och krämig sesamdressing, krispig romansallad och frasiga surdegskrutonger. Se Jennie Walldéns recept", "link": "https://www.tv4.se/artikel/39umxerGtYoSQCNxw6aA6z/asiatisk-caesarsallad", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:16:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/personer/jennie-wallden", "/koket", "/kokets-middag"]}, {"id": 95, "title": "149 square meter house in Bunkeflostrand sold for SEK 7,775,000", "summary": "", "title_original": "149 kvadratmeter stort hus i Bunkeflostrand sålt för 7 775 000 kronor", "summary_original": "", "link": "https://www.sydsvenskan.se/149-kvadratmeter-stort-hus-i-bunkeflostrand-salt-for-7-775-000-kronor/", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:13:46+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Intense relationships or alcohol become a way out of the pain", "summary": "Edel Irén Lappin has read \"Mothers and men\" by Wera von Essen", "title_original": "Intensiva relationer eller alkohol blir en utväg ur smärtan", "summary_original": "Edel Irén Lappin har läst ”Mödrar och män” av Wera von Essen", "link": "https://www.dagen.se/kultur/intensiva-relationer-eller-alkohol-blir-en-utvaeg-ur-smaertan/10365037", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:08:28+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Stockholmers live the longest – for the first time", "summary": "", "title_original": "Stockholmare lever längst – för första gången", "summary_original": "", "link": "https://www.svd.se/a/GxB534/stockholmare-lever-langst-for-forsta-gangen", "date_display": "2026-05-27", "date_iso": "2026-05-27T07:00:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 98, "title": "Stockholmers live the longest – Danderyd tops", "summary": "Residents of Stockholm County have the longest average life expectancy in Sweden, according to new statistics from Statistics Sweden.", "title_original": "Stockholmare lever längst – Danderyd i topp", "summary_original": "Invånare i Stockholms län har den längsta medellivslängden i Sverige, enligt ny statistik från SCB.", "link": "https://www.svd.se/a/0pLg46/stockholmare-lever-langst-for-forsta-gangen", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:53:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 99, "title": "Here the tradwife myth is punctured", "summary": "", "title_original": "Här punkteras tradwife-myten", "summary_original": "", "link": "https://www.svd.se/a/d4vg4q/har-punkteras-tradwife-myten", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:29:52+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 100, "title": "The sawing of Johan Forssell: Too cowardly", "summary": "M is too cowardly in migration policy, believes SD politician Denice Westerberg. At the same time, she brings up an unexpected solution to teenage deportations: \"You can grant clemency to a well-integrated non-criminal person.\"", "title_original": "Sågningen av Johan Forssell: För feg", "summary_original": "M är för fega i migrationspolitiken, anser SD-politikern Denice Westerberg. Samtidigt lyfter hon en oväntad lösning på tonårsutvisningarna: ”Man kan ge nåd till en välintegrerad icke-kriminell människa.”", "link": "https://www.svd.se/a/8p95yd/sverigedemokraternas-denice-westerberg-kritiserar-johan-forssell-om-tonarsutvisningarna", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:29:33+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 101, "title": "Thousands are forced to pay to CSN", "summary": "Almost 14,000 people have to pay back study funds to CSN because they have had too much income during their studies.", "title_original": "Tusentals tvingas betala till CSN", "summary_original": "Nästan 14 000 personer ska betala tillbaka studiemedel till CSN eftersom de har haft för stora inkomster under studietiden.", "link": "https://www.svd.se/a/JOlLWR/tusentals-tvingas-betala-tillbaka-till-csn", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:21:59+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 102, "title": "25-year-old Gabriel hits himself in the face with a hammer - to look better", "summary": "During high school, Gabriel felt unattractive and began searching online for information on how to improve his appearance. He came into contact with looksmaxxingforum, where he uploaded pictures of himself for other guys to rate how he looked. Hitting himself with a hammer Gabriel \"bonesmashes\", which involves hitting himself with a hammer, with light pressure, in order to get sharper cheekbones and jawbones. - I don't recommend others to do it, but it works for me. Doctors and researchers agree that the method does not work and that it is not possible to change one's jaw in that way. Upper orthodontist and bite physiology specialist Lars Fredriksson says that the method has no effect. - It doesn't work at all. It takes a lot of continuous power to make it work. For example, moving a tooth a few millimeters with braces can take several years, says Lars Fredriksson. \"A new study should be done\" But Gabriel is adamant that the method works. - It works for me. I think they should do a new study in that case. He claims that his jawbones look the way they do because he hit himself with a hammer for a long time. When asked if it is due to a possible weight loss, the answer is no. - No, I have the same body fat as I had before I started bonesmashing. Subsisting on \"looksmaxxing\", Gabriel has a large following on social media. On Tiktok, he has managed to reach millions of users with his videos. His account is one of the biggest in its category and the comments section is filled with guys asking him for advice on what to do to look like him. Although \"looksmaxxing\" has recently become big on social media, with international profiles such as Clavicular, Gabriel was a forerunner in many ways. - I was bigger than Clavicular until about a year ago, but now he has overtaken me, says Gabriel. In live videos on Gabriel's platforms, his followers donate large amounts. Today, Gabriel can make a living from \"looksmaxxing\". He admits that his content", "title_original": "25-årige Gabriel slår sig i ansiktet med hammare – för att bli snyggare", "summary_original": "Under gymnasiet kände Gabriel sig oattraktiv och började söka information på nätet om hur man förbättrar sitt utseende. Han kom i kontakt med looksmaxxingforum, där han laddade upp bilder på sig själv för att andra killar skulle betygsätta hur han såg ut. Slår sig med hammare Gabriel ”bonesmashar”, vilket går ut på att slå sig själv med en hammare, med lätt tryck, i syfte att få mer skarpa kind- och käkben. – Jag rekommenderar inte andra att göra det, men det funkar för mig. Läkare och forskare är överens om att metoden inte funkar och att det inte går att förändra sin käke på det sättet. Övertandläkare och bettfysiologspecialisten Lars Fredriksson säger att metoden inte har någon effekt. – Det funkar inte alls. Det krävs mycket och kontinuerlig kraft för att det ska funka. För att exempelvis flytta en tand några milimeter med tandställning, kan ju ta flera år, säger Lars Fredriksson. ”Borde göras en ny studie” Men Gabriel står fast vid att metoden funkar. – Det funkar för mig. Jag tycker de borde göra en ny studie i så fall. Han hävdar att hans käkben ser ut som de gör för att han under lång tid slagit sig själv med en hammare. På frågan om det beror på en eventuell viktnedgång är svaret nej. – Nej, jag har samma kroppsfett som jag hade innan jag började bonesmasha. Livnär sig på ”looksmaxxing” Gabriel har en stor följarskara på sociala medier. På Tiktok har han lyckats nå miljontals användare med sina videor. Hans konto är ett av de största i sin kategori och kommentarsfälten är fyllda av killar som ber honom om råd kring vad de ska göra för att se ut som honom. Även om ”looksmaxxing” nyligen blivit stort på sociala medier, med internationella profiler som Clavicular, var Gabriel en föregångare på många sätt. – Jag var större än Clavicular fram till ungefär ett år sen, men nu har han gått om mig, säger Gabriel. I livesända videor på Gabriels plattformar donerar hans följare stora belopp. I dag kan Gabriel livnära sig på ”looksmaxxing”. Han medger att hans innehåll handlar om utseendeförbättring men tycker inte att det bidrar till orimliga skönhetsideal. – Det tycker jag inte. Det är upp till var och en att tolka hur man vill.", "link": "https://www.tv4.se/artikel/MVG6zSX25M12Ja0cGIxBJ/25-arige-gabriel-slar-sig-i-ansiktet-med-hammare-foer-att-bli-snyggare", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:21:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Hälsa", "/halsa", "/sociala-medier", "/ideal"]}, {"id": 103, "title": "China's AI experts are banned from traveling freely", "summary": "Good morning! Travel restrictions are imposed on AI workers in China, US authorities target “anti-tech extremists” and ABB contributes to the data center of the future.", "title_original": "Kinas AI-experter förbjuds resa fritt", "summary_original": "God morgon! Utreserestriktioner införs för AI-arbetare i Kina, amerikanska myndigheter riktar in sig på ”anti-teknik-extremister” och ABB bidrar till framtidens datacenter.", "link": "https://www.svd.se/a/JOl7jR/kina-kraver-att-ai-experter-ansoker-om-tillstand-for-utlandsresor", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:17:29+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 104, "title": "He is the listeners' summer host", "summary": "Emergency calls as a firefighter, volunteer assignments in Ukraine and everyday life as a father of three. That's what listeners' summer host Robin Larméru's summer talk will be about. Every year since 2007, the listeners' summer host is chosen by the audience, and this year it was Robin Larmérus, 39 years old, from Kalmar who most people were curious about - something that Sveriges Radio P1 told on Wednesday morning.  Being elected feels honourable. - It is a great honor. Just to be able to come and have your own summer talk. It's huge, he says. \"An ordinary one too\" It was his wife who suggested that he should give a summer talk. But Robin Larmérus thought that only celebrities got to talk about summer. - She said: \"It's a regular one too\" and now I'm sitting here, he says in Nyhetsmorgon. He has been down in Ukraine several times during the course of the war. He is part of a foundation that drives down equipment for the Ukrainian emergency services, such as ambulances, fire engines and other things. What kind of feelings do you have when you cross the border into Ukraine? - It is special. You have learned a little along the way, but every journey is unique. You know it will take time, you know it will probably go wrong. That's a lot of paper. Especially when you have many vehicles with you. It can take between five and 20 hours to cross. \"Has saved lives\" For Robin Larmérus, it has been obvious to stand up - despite the danger. - It starts with getting to know colleagues in Ukraine and then colleagues become friends. When you have friends, it doesn't matter, because friends you stand up for. It will be very easy to get involved in the cause of Ukraine. The hardest part is saying goodbye to the family when he leaves. - It is difficult. In the end, you just have to hug, say goodbye and then close the door. Somewhere in the back of your mind is the feeling that you should do something dangerous. But it's still worth it, he says. - Yes. Last year, a colleague and I delivered Ifaks, Individual First Aid kits, to the firefighters in Kiev. It was worth half a m", "title_original": "Han är lyssnarnas sommarvärd", "summary_original": "Larmutryckningar som brandman, volontärsuppdrag i Ukraina och vardagen som trebarnspappa. Det är vad lyssnarnas sommarvärd Robin Larmérus sommarprat ska handla om. Varje år sedan 2007 utses lyssnarnas sommarvärd av publiken och i år var det alltså Robin Larmérus, 39 år, från Kalmar som flest blev nyfikna på – något som Sveriges Radio P1 berättade på onsdagsmorgonen.  Att bli vald tycker han känns hedrande. – Det är en stor ära. Att bara få komma och få prata in ett eget sommarprat. Det är jättestort, säger han. ”En vanlig också” Det var hans fru som föreslog att han skulle sommarprata. Men Robin Larmérus trodde att det bara var kändisar som fick sommarprata. – Hon sa: ”Det är en vanlig också” och nu sitter jag här, säger han i Nyhetsmorgon. Han har varit nere i Ukraina flera gånger under krigets gång. Han är med i en stiftelse som kör ner utrustning till ukrainska räddningstjänsten, som ambulanser, brandbilar och annat. Vad har du för känslor när ni åker över gränsen till Ukraina? – Det är ju speciellt. Man har ju lärt sig lite längs vägen, men varje resa är unik. Man vet att det kommer ta tid, man vet att det förmodligen kommer strula. Det är mycket papper. Framför allt när man har många fordon med sig. Det kan ta mellan fem och 20 timmar att ta sig över. ”Har räddat liv” För Robin Larmérus har det varit självklart att ställa upp – trots faran. – Det börjar med att man lär känna kollegor i Ukraina och sen blir kollegor till vänner. När du har vänner spelar det ingen roll, för vänner ställer man upp för. Det blir väldigt lätt att engagera sig för Ukrainas sak. Det svåraste är att ta avsked från familjen när han åker i väg. – Det är svårt. Där får man till slut bara kramas, säga hej då och sen stänga dörren. Någonstans i bakhuvudet finns känslan av att man ska göra någonting farligt. Men det är ändå värt det, säger han. – Ja. Förra året var jag och en kollega och levererade Ifaks, Individual First Aid kits, till brandmännen i Kiev. Det var till ett värde av en halv miljon. Och jag är helt övertygad om att de kiten har räddat ett par liv – så det gör det värt det. Robin Larmérus sommarprat kommer sändas i Sveriges Radio P1 den 22 juli.", "link": "https://www.tv4.se/artikel/5926hGRFTsHvV9DEO15ylc/ukraina-volontaer-lyssnarnas-sommarvaerd-vaenner-staeller-man-upp-foer", "date_display": "2026-05-27", "date_iso": "2026-05-27T06:06:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/sommarpratare", "/sveriges-radio", "/ukrainakonflikten", "/ukraina", "/kriget-i-ukraina"]}, {"id": 105, "title": "Hamas military chief reportedly killed by Israel", "summary": "", "title_original": "Hamas militärchef uppges dödad av Israel", "summary_original": "", "link": "https://www.svd.se/a/PdPO17/hamas-militarchef-uppges-dodad-av-israel", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:57:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 106, "title": "Flanner: Rumors of newcomers spread quickly in the townhouse area", "summary": "The flâneur has moved to townhouses. Getting to know the neighbors. But the cat Majken has his own strategy.", "title_original": "Flanören: Rykten om nykomlingar sprids snabbt i radhusområdet", "summary_original": "Flanören har flyttat till radhus. Håller på att lära känna grannarna. Men katten Majken har en egen strategi.", "link": "https://www.dn.se/kultur/flanoren-rykten-om-nykomlingar-sprids-snabbt-i-radhusomradet/", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "Wold's trans statement is criticized: \"Shamed to death\"", "summary": "Repeated attempts to ban a person's sexual orientation, so-called conversion, are banned in Sweden on July 1. Agnes Wold, professor of clinical bacteriology and profile in Swedish Radio, says she is prepared to break the law. - I would take four years in prison, yes, she says to Dagens ETC.", "title_original": "Wolds transuttalande kritiseras: ”Skäms ihjäl”", "summary_original": "Upprepade försök att förbjuda en persons sexuella läggning, så kallad omvändelse, förbjuds i Sverige 1 juli. Agnes Wold, professor i klinisk bakteriologi och profil i Sveriges Radio, säger sig vara beredd att bryta mot lagen. – Jag skulle ta fyra års fängelse, ja, säger hon till Dagens ETC.", "link": "https://www.svd.se/a/vr39RX/rasar-mot-wold-for-uttalande-om-transomvandelse", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:27:53+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 108, "title": "The state mortgage bank lowers interest rates", "summary": "Statens bolånebank, SBAB, lowers the interest rates on variable mortgages - with a three-month fixed period - by 0.05 percentage points.", "title_original": "Statliga bolånebanken sänker räntor", "summary_original": "Statens bolånebank, SBAB, sänker räntorna på rörliga bolån – med tre månaders bindningstid – med 0,05 procentenheter.", "link": "https://www.svd.se/a/lnvQok/statliga-bolanebanken-sanker-rantor", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:18:59+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 109, "title": "Hundreds of thousands do not receive care in the hidden public disease", "summary": "Over 1.3 million Swedes live with obesity, the medical term for unhealthy excess weight.  The National Board of Health and Welfare's first national evaluation of obesity care shows that the condition is both underdiagnosed and undertreated. The evaluation states that primary care in particular needs to be improved. - Many patients seek care for a long time without the disease being noticed or treated. This means that people risk getting sicker completely unnecessarily, says Maria State, head of unit at the National Board of Health and Welfare in a press release. Proposes two changes Chronic obesity leads to increased risk of other diseases such as type 2 diabetes, cardiovascular diseases and several different forms of cancer. According to the National Board of Health and Welfare's evaluation, today few patients receive help through medication, surgery or lifestyle support.  The National Board of Health and Welfare's report proposes two changes in Swedish obesity care: that the regions offer treatments earlier to more people, and that primary care and specialist care become better at working together. - Many patients are met by stigma, ignorance and care that is not adapted to long-term treatment. Almost every fifth person in Sweden lives with obesity, but far from everyone receives the care they need, says Björn Eriksson, Director General of the National Board of Health and Welfare in the press release.", "title_original": "Hundratusentals får inte vård i dolda folksjukdomen", "summary_original": "Över 1,3 miljoner svenskar lever med obesitas, den medicinska termen för ohälsosam övervikt.  Socialstyrelsens första nationella utvärdering av obesitas-vården framgår att tillståndet både underdiagnostiseras och underbehandlas. Utvärderingen menar att primärvården i synnerhet behöver bli bättre. – Många patienter söker vård under lång tid utan att sjukdomen uppmärksammas eller behandlas. Det innebär att människor riskerar att bli sjukare helt i onödan, säger Maria State, enhetschef på Socialstyrelsen i ett pressmeddelande. Föreslår två förändringar Kronisk övervikt leder till ökad risk för andra sjukdomar som typ 2-diabetes, hjärt-och kärl-sjukdomar och flera olika cancerformer. Enligt Socialstyrelsens utvärdering är det idag få patienter som får hjälp genom läkemedel, kirurgi eller levnadsvanestöd.  Socialstyrelsens rapport föreslår två förändringar i svensk obesitasvård: att regionerna erbjuder behandlingar tidigare till fler, och att primärvård och specialistvård blir bättre på att samarbeta. – Många patienter möts av stigma, okunskap och en vård som inte är anpassad för långsiktig behandling. Nästan var femte person i Sverige lever med obesitas, men långt ifrån alla får den vård de behöver, säger Björn Eriksson, generaldirektör på Socialstyrelsen i pressmeddelandet.", "link": "https://www.tv4.se/artikel/6ao16Ydn5pRQR8xDyg5fzE/hundratusentals-far-inte-vard-i-dolda-folksjukdomen-tas-inte-pa-allvar", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:08:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/socialstyrelsen", "/obesitas", "/sjukvarden", "/halsa"]}, {"id": 110, "title": "L: Everyone with a no-contact order must be handcuffed", "summary": "The Liberals want everyone who gets a contact ban to also get handcuffs.", "title_original": "L: Alla med kontaktförbud ska få fotboja", "summary_original": "Liberalerna vill att alla som får kontaktförbud även ska få fotboja.", "link": "https://www.svd.se/a/5pLr71/l-alla-med-kontaktforbud-ska-fa-fotboja", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:07:25+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 111, "title": "Suspected Ebola case in India - woman is isolated", "summary": "", "title_original": "Misstänkt ebolafall i Indien – kvinna isoleras", "summary_original": "", "link": "https://www.svd.se/a/vr39Bl/misstankt-ebolafall-i-indien-kvinna-isoleras", "date_display": "2026-05-27", "date_iso": "2026-05-27T05:02:34+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 112, "title": "With such good prose, Horace Engdahl is happy to contradict himself", "summary": "He returns to his free short prose and focuses on the classical composers. Few authors are as fun to read as a Horace Engdahl in a good mood, writes Samuel Levander.", "title_original": "Med så god prosa får Horace Engdahl gärna motsäga sig själv", "summary_original": "Han återvänder till sin fria kortprosa och fokuserar på de klassiska tonsättarna. Få författare är lika roliga att läsa som en Horace Engdahl på gott humör, skriver Samuel Levander.", "link": "https://www.dn.se/kultur/med-sa-god-prosa-far-horace-engdahl-garna-motsaga-sig-sjalv/", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:36:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Kristofer Ahlström: This is why women hate men who love AI", "summary": "Wives are made grass widows in their relationships with men on the AI ​​spectrum, who believe technology delivers on the promise of a life without doubt, compromise or hassle. But it is an illusion that we can avoid being dependent on other people, writes Kristofer Ahlström.", "title_original": "Kristofer Ahlström: Därför hatar kvinnor män som älskar AI", "summary_original": "Fruar görs till gräsänkor i sina relationer med män på AI-spektrumet, som tror att tekniken infriar löftet om ett liv utan tvivel, kompromisser eller krångel. Men det är en illusion att vi kan slippa vara beroende av andra människor, skriver Kristofer Ahlström.", "link": "https://www.dn.se/kultur/kristofer-ahlstrom-darfor-hatar-kvinnor-man-som-alskar-ai/", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:14:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Demands action against fake honey in stores: \"Very serious\"", "summary": "Tests with several different certified methods have shown that many honey products fully or partially contain foreign sugars that are not honey. In Testfakta's recent honey test, for example, only five out of twelve products got the green light. The city of Malmö last week banned the sale of two different brands after three different test methods showed that they did not contain only honey. According to the city of Malmö, out of 17 products tested, 11 did not comply with the EU's honey directive or the Swedish Food Agency's regulations. - The grocery store must now take its responsibility and ensure that there is not a single jar of fake honey left in the grocery stores, says Beatrice Ramnerö, who chairs the LRF's industry council for local food and drink. Trade awaits guidelines Swedish grocery trade does not want to respond to LRF's criticism in an interview. In an email to TV4 Nyheterna, they write that there are still question marks about how the new analysis methods should be assessed and that they are awaiting clearer guidelines from the Swedish Food Agency. TV4 Nyheterna has also asked Ica Sweden, which gives largely the same answer. Axfood, which owns Eldorado, writes that it removed the specific batch of Eldorado's honey that did not pass Malmö city tests. Traders act on their own At the same time, there are individual traders who do not wait, but have already acted on their own. At Ica Maxi in Falköping, there is only one kind of honey on the shelves, produced by bees from the Västgötaslätten.\n\n- There was doubt about a year ago about the honey and we felt that we have a local producer who is able to supply us with the total volume that we needed. Therefore, we could make the choice to remove all other varieties, says store manager Jonas Rydin. LRF, and also the beekeepers' trade association Beedlingsföretagarna, want to see more initiatives from the trade: - Now we have the tools to be able to see what is real honey and what is not real honey. Every single day that these tools are not used is an active choice from grocery shopping", "title_original": "Kräver krafttag mot fuskhonung i butiker: ”Jätteallvarligt”", "summary_original": "Tester med flera olika certifierade metoder har visat att många honungsfabrikat helt eller delvis innehåller främmande sockerarter som inte är honung. I Testfaktas honungstest nyligen fick till exempel bara fem av tolv produkter grönt ljus. Malmö stad förbjöd förra veckan försäljning av två olika fabrikat efter att tre olika testmetoder visat att de inte enbart innehöll honung. Av 17 testade produkter var det enligt Malmö stad 11 som inte levde upp till EU:s honungsdirektiv eller Livsmedelsverkets föreskrifter. – Dagligvaruhandeln måste nu ta sitt ansvar och se till att det inte ska finnas en enda burk fuskhonung kvar i livsmedelsbutikerna, säger Beatrice Ramnerö, som är ordförande i LRF:s branschråd för lokal mat och dryck. Handeln inväntar riktlinjer Svensk dagligvaruhandel vill inte bemöta LRF:s kritik i en intervju. I ett mejl till TV4 Nyheterna skriver man att det fortfarande finns frågetecken kring hur de nya analysmetoderna ska bedömas och att man avvaktar tydligare riktlinjer från Livsmedelsverket. TV4 Nyheterna har även sökt Ica Sverige, som ger i stort sett samma svar. Axfood, som äger Eldorado, skriver att man plockat bort den specifika batch av Eldorados honung som inte klarat Malmö stads tester. Handlare agerar på egen hand Samtidigt finns det enskilda handlare som inte väntar, utan redan har agerat på egen hand. På Ica Maxi i Falköping finns det bara en sorts honung på hyllorna, producerad av bin från Västgötaslätten.\n\n– Det kom ju ett tvivel för ungefär ett år sedan på honungen och vi kände att vi har en lokal producent som klarar att förse oss med den totala volymen som vi behövde ha. Därför kunde vi göra valet att ta bort alla andra sorter, säger butikschef Jonas Rydin. LRF, och även biodlarnas branschorganisation Biodlingsföretagarna, vill se fler initiativ från handeln: – Nu har vi verktygen att kunna se vad som är äkta honung och vad som inte är äkta honung. Varenda dag som de här verktygen inte används är det ett aktivt val från dagligvaruhandeln att tillåta att det här fusket fortsätter, säger Beatrice Ramnerö.", "link": "https://www.tv4.se/artikel/5f6LRImh14KDbaQHU33SMU/kraever-krafttag-mot-fuskhonung-i-butiker-jaetteallvarligt", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:09:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/honung", "/konsument", "/konsumentinformation", "/axfood", "/ica", "/lrf"]}, {"id": 115, "title": "The minister's private message after the aid was stopped: \"Thought you would be happy\"", "summary": "Two of Sida's top managers warned that the government's new precautionary principle could hit people in need. Nevertheless, the agency's board pushed through a stricter interpretation – and Islamic Relief was stopped. \"Thought you would be happy about the news itself,\" wrote Minister for Development Assistance Benjamin Dousa (M) after the decision to board member Magnus Ranstorp.", "title_original": "Ministerns privata meddelande efter stoppade biståndet: ”Tänkte att du skulle glädjas”", "summary_original": "Två av Sidas högsta chefer varnade för att regeringens nya försiktighetsprincip kunde slå mot människor i nöd. Ändå drev myndighetens styrelse igenom en striktare tolkning – och Islamic Relief stoppades. ”Tänkte att du skulle glädjas åt själva nyheten”, skrev biståndsminister Benjamin Dousa (M) efter beslutet till styrelseledamoten Magnus Ranstorp.", "link": "https://www.dn.se/sverige/ministerns-privata-meddelande-efter-stoppade-bistandet-tankte-att-du-skulle-gladjas/", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:03:32+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "The National Board of Health and Welfare gives a lower rating to obesity care - because few get help", "summary": "The National Board of Health and Welfare sees major shortcomings in the care of patients with obesity (obesity). Far too few receive treatment, and the new drugs lead to inequality. - I give the care for adults a rating of 4 out of 10, says director general Björn Eriksson.", "title_original": "Socialstyrelsen ger underbetyg åt fetmavården – för få får hjälp", "summary_original": "Socialstyrelsen ser stora brister i vården av patienter med obesitas (fetma). Alldeles för få får behandling, och de nya läkemedlen leder till ojämlikhet. – Jag ger vården för vuxna betyget 4 av 10, säger generaldirektören Björn Eriksson.", "link": "https://www.dn.se/sverige/socialstyrelsen-ger-underbetyg-at-fetmavarden-for-fa-far-hjalp/", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:00:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "High tone in Lundinmålet - compared to Quick", "summary": "The tone is high when the negotiations in the record-breaking Lundin case are to be concluded. A research group following the trial states that after almost three years, the parties continue to have completely different descriptions of reality. - This is not a goal where the parties later meet in the cafe and have a little chat, says researcher Isabel Schoultz.", "title_original": "Högt tonläge i Lundinmålet – jämförs med Quick", "summary_original": "Tonläget är högt när förhandlingen i det rekordstora Lundin-målet ska avslutas. En forskargrupp som följer rättegången konstaterar att parterna efter snart tre år fortsatt har helt olika verklighetsbeskrivningar. – Det här är inte ett mål där parterna senare möts i kaféet och småsnackar lite, säger forskaren Isabel Schoultz.", "link": "https://www.svd.se/a/k0pKzv/hogt-tonlage-i-lundinmalet-jamfors-med-quick", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:00:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 118, "title": "The union is fighting for the untruth", "summary": "The trade union ST has taken up the fight for the so-called rebel mother. But the freedom of speech ST is fighting for seems to be the right to mislead both employers and the public.", "title_original": "Facket tar strid för osanningen", "summary_original": "Fackförbundet ST har tagit strid för den så kallade rebellmamman. Men den yttrandefrihet ST slåss för tycks vara rätten att vilseleda både arbetsgivare och allmänhet.", "link": "https://www.svd.se/a/M7PdR5/facket-st-tar-strid-for-rebellmammans-osanningar", "date_display": "2026-05-27", "date_iso": "2026-05-27T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 119, "title": "Anna Hedenmo: Fillers and botox on young people? The self-loathing has to stop", "summary": "I stand in front of the mirror in the bathroom. Doesn't the mouth look a little sour? Hasn't the worry wrinkle in your forehead deepened lately? Not to mention the superficial blood vessels… THE COLUMN. Anna Hedenmo is a journalist and new independent columnist on DN's editorial page.", "title_original": "Anna Hedenmo: Fillers och botox på ungdomar? Självföraktet måste få ett stopp", "summary_original": "Jag står framför spegeln i badrummet. Ser inte munnen lite väl sur ut? Har inte bekymmersrynkan i pannan blivit djupare på sistone? För att inte tala om de ytliga blodkärlen… KOLUMNEN. Anna Hedenmo är journalist och ny fristående kolumnist på DN:s ledarsida.", "link": "https://www.dn.se/ledare/anna-hedenmo-fillers-och-botox-pa-ungdomar-sjalvforaktet-maste-fa-ett-stopp/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:53:56+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "Trump's (and the Democrats') favorite won in Texas", "summary": "WASHINGTON. Republican Ken Paxton will face Democrat James Talarico for a seat in the Texas state senate in the fall midterm elections. President Donald Trump has thus got his way in several primaries during the spring. But the result in Texas could also benefit the Democrats.", "title_original": "Trumps (och Demokraternas) favorit vann i Texas", "summary_original": "WASHINGTON. Det blir republikanen Ken Paxton som får möta demokraten James Talarico om en plats i senaten för delstaten Texas i höstens mellanårsval. President Donald Trump har därmed fått sin vilja igenom i flera primärval under våren. Men resultatet i Texas kan även gynna Demokraterna.", "link": "https://www.dn.se/varlden/trumps-och-demokraternas-favorit-vann-i-texas/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:16:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Leader: It is actually completely \"natural\" that SD dominates in the next government", "summary": "Ulf Kristersson (M) was not satisfied with cooperating with SD, he built a team. And got a new natural law in the bargain.", "title_original": "Ledare: Det är faktiskt helt ”naturligt” att SD dominerar i nästa regering", "summary_original": "Ulf Kristersson (M) nöjde sig inte med att samarbeta med SD, han byggde ett lag. Och fick en ny naturlag på köpet.", "link": "https://www.dn.se/ledare/det-ar-faktiskt-helt-naturligt-att-sd-dominerar-i-nasta-regering/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:11:35+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "The fruits and vegetables that are sprayed the most", "summary": "The Swedish Food Agency assesses that today's food is safe, and that the most important thing is that we eat a lot of fruit and vegetables. But for those who want to avoid pesticides, the authorities' tests also show which raw materials are sprayed the most. A solution may then be to choose ecological alternatives from these.", "title_original": "Frukterna och grönsakerna som besprutas mest", "summary_original": "Livsmedelsverket bedömer att dagens mat är säker, och att det viktigaste är att vi äter mycket frukt och grönt. Men för den som vill undvika bekämpningsmedel visar myndigheternas tester också vilka råvaror som besprutas mest. En lösning kan då vara att välja ekologiska alternativ av dessa.", "link": "https://www.dn.se/sverige/frukterna-och-gronsakerna-som-besprutas-mest/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:05:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "How should you think about sprayed fruits and vegetables?", "summary": "Ten years ago, an advertising campaign about chemicals in our food was stopped by a Swedish court. Recent research suggests that the campaign may have been right on one key point. But just how dangerous is the cocktail of pesticides from the fruit and vegetable counter?", "title_original": "Hur ska man tänka kring besprutade frukter och grönsaker?", "summary_original": "För tio år sedan stoppades en reklamkampanj om kemikalier i vår mat av svensk domstol. Nyare forskning pekar på att kampanjen på en central punkt kan ha haft rätt. Men hur farlig är egentligen cocktailen av bekämpningsmedel från frukt- och grönsaksdisken?", "link": "https://www.dn.se/sverige/hur-ska-man-tanka-kring-besprutade-frukter-och-gronsaker/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:05:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Letter to the editor. Our gifted student did everything right - but one day he went missing", "summary": "LETTER TO THE EDITOR. Despite everyone having done everything right, our student is expelled - at our school he has been a brilliant youth leader. How should we relate to the signals it sends to other young people? write eleven musicians and teachers in an open letter to Culture Minister Parisa Liljestrand.", "title_original": "Insändare. Vår begåvade elev gjorde allt rätt – men en dag var han försvunnen", "summary_original": "INSÄNDARE. Trots att alla har gjort allt rätt utvisas vår elev – på vår skola har han varit en lysande ungdomsledare. Hur ska vi förhålla oss till de signaler det sänder till andra ungdomar? skriver elva musiker och lärare i ett öppet brev till kulturminister Parisa Liljestrand.", "link": "https://www.dn.se/insandare/var-begavade-elev-gjorde-allt-ratt-men-en-dag-var-han-forsvunnen/", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Today's parents: Homesickness, community and camp life", "summary": "Listen to the Dagens parents podcast. Nervous about summer camp? Simon Axlycke shares tips for parents - and explains why camp can mean so much.", "title_original": "Dagens föräldrar: Hemlängtan, gemenskap och lägerliv", "summary_original": "Lyssna på podden Dagens föräldrar. Nervöst inför sommarlägret? Simon Axlycke delar tips till föräldrar – och berättar varför läger kan betyda så mycket.", "link": "https://www.dagen.se/podd/dagens-foeraeldrar-hemlaengtan-gemenskap-och-laegerliv/10363985", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "The Swedish Bible Society under financial pressure - forced to lay off staff", "summary": "Should not affect the autumn launch of NT 2026 according to the general secretary.", "title_original": "Svenska bibelsällskapet ekonomiskt pressat – tvingas säga upp personal", "summary_original": "Ska inte påverka höstens lansering av NT 2026 enligt generalsekreteraren.", "link": "https://www.dagen.se/nyheter/svenska-bibelsaellskapet-ekonomiskt-pressat-tvingas-saega-upp-personal/10362808", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Power is not satisfied with obedience, it demands reverence", "summary": "The step from rational thinking to religious submission is dangerously short.", "title_original": "Makt nöjer sig inte med lydnad, den kräver vördnad", "summary_original": "Steget från rationellt tänkande till religiös underkastelse är farligt kort.", "link": "https://www.dagen.se/ledare/makt-noejer-sig-inte-med-lydnad-den-kraever-voerdnad/10362727", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "What gave me joy and gratitude arouses fear in others", "summary": "Don't be ironic about the expressions of piety you have difficulty with, writes Björne Erixon.", "title_original": "Det som skänkt mig glädje och tacksamhet väcker rädsla hos andra", "summary_original": "Ironisera inte över de fromhetsuttryck du har svårt med, skriver Björne Erixon.", "link": "https://www.dagen.se/debatt/det-som-skaenkt-mig-glaedje-och-tacksamhet-vaecker-raedsla-hos-andra/10352902", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Right to believe: Victory to be able to talk to such high-ranking social democrats", "summary": "Migration policy spokesperson (S) on asylum-seeking converts: There must be a higher level of competence at the Migration Agency.", "title_original": "Rätt till tro: Seger att få prata med så högt uppsatta socialdemokrater", "summary_original": "Migrationspolitisk talesperson (S) om asylsökande konvertiter: Det måste finnas en högre kompetens på Migrationsverket.", "link": "https://www.dagen.se/nyheter/raett-till-tro-seger-att-fa-prata-med-sa-hoegt-uppsatta-socialdemokrater/10358619", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "The Church of the Cross in Gävle turns 120 years old - overflowing with children", "summary": "\"It was both a look back and a look forward.\"", "title_original": "Korskyrkan i Gävle fyller 120 år – svämmar över av barn", "summary_original": "”Det blev både en tillbakablick och en blick framåt.”", "link": "https://www.dagen.se/familj/korskyrkan-i-gaevle-fyller-120-ar-svaemmar-oever-av-barn/10344187", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "That's why you should go to a Christian children's camp - as a child and as an adult", "summary": "Father of three Simon Axlycke, 46, loves being a leader at camp and sending his children off.", "title_original": "Därför ska man åka på kristet barnläger – som barn och vuxen", "summary_original": "Trebarnspappan Simon Axlycke, 46, älskar att vara ledare på läger, och att skicka iväg sina barn.", "link": "https://www.dagen.se/livsstil/daerfoer-ska-man-aka-pa-kristet-barnlaeger-som-barn-och-vuxen/10356885", "date_display": "2026-05-27", "date_iso": "2026-05-27T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Undefeated Switzerland awaits Sweden in the quarters: \"Doesn't matter\"", "summary": "A few hours after Sweden secured the quarter-final place in the Hockey World Cup, it became clear who their opponents will be. When Switzerland won Tuesday night's group final against Finland 4-2, it meant that Sweden will face the gold-chasing home team in Thursday's late quarter-final in Zurich.", "title_original": "Obesegrade Schweiz väntar för Sverige i kvarten: ”Spelar ingen roll”", "summary_original": "Några timmar efter att Sverige säkrat kvartsfinalplatsen i hockey-VM blev det klart vilka deras motståndare blir. När Schweiz vann tisdagskvällens gruppfinal mot Finland med 4–2, innebar det att Sverige får möta den guldjagande hemmanationen i torsdagens sena kvartsfinal i Zürich.", "link": "https://www.dn.se/sport/obesegrade-schweiz-vantar-for-sverige-i-kvarten-spelar-ingen-roll/", "date_display": "2026-05-26", "date_iso": "2026-05-26T21:02:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "The climate minister is making proposals for lower emissions", "summary": "An investigation that will be presented to the government on Wednesday proposes a higher tax on fuel and a higher reduction obligation, according to information to DN. This is so that Sweden can meet the climate goals. Wrong way to go, believes climate minister Johan Britz (L).", "title_original": "Klimatministern sågar förslag för lägre utsläpp", "summary_original": "En utredning som presenteras för regeringen på onsdagen föreslår höjd skatt på drivmedel och höjd reduktionsplikt, enligt uppgifter till DN. Detta för att Sverige ska klara klimatmålen. Fel väg att gå, anser klimatminister Johan Britz (L).", "link": "https://www.dn.se/sverige/uppgifter-utredning-foreslar-hojd-drivmedelsskatt/", "date_display": "2026-05-26", "date_iso": "2026-05-26T20:43:07+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "The professor's adamant criticism of the F-fund: \"Terrible refunds\"", "summary": "Debbie Landberg and Mattias Westergren, who were both on sick leave for burnout, have received reimbursement claims when they took care of their children. In both cases, Försäkringskassan has considered that caring for children shows ability to work and demanded that the sickness benefit be paid back for more than a year back in time. Ruth Mannelqvist is professor of jurisprudence at Umeå University and believes that Försäkringskassan has become tougher. - In an assessment, caring for children can absolutely be a sign of work ability. But what is new is that Försäkringskassan seems to have a much stricter interpretation of the regulations. And above all, they demand money back for much longer periods. It scares me a little, says Ruth Mannelqvist. \"Legally uncertain and arbitrary\" Debbie Landgren, for example, was charged SEK 237,000 when she could not find a suitable daycare place. She asked Försäkringskassan if it was okay to combine sickness benefit with her taking care of her child at home, and got an okay. But a year later, the Social Insurance Agency made a new assessment and said that she had shown her ability to work by taking care of her child and then demanded the sick pay back. - This kind of retroactive requirement risks becoming legally insecure and arbitrary. And when it comes to such long periods, it can add up to sums that put people in a terrible poverty trap, says Ruth Mannelqvist. More refunds But Försäkringskassan disagrees and says that they are indeed pushing more money into refunds, but that it is done with care. - There is definitely an increased focus on refunds, but I don't see it having unwanted effects in that way. Increased focus is also about the fact that we have received increased resources for repayment and control activities. Which means that we find more impulses to be investigated and decided upon, says Emma Grahn, head of the unit for Recoveries at Försäkringskassan. \"Responsive to the politicians\" Ruth Mannelqvist does not think it is a coincidence that Försäkringskassan has become tougher with refunds. Soon", "title_original": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summary_original": "Debbie Landberg och Mattias Westergren som båda varit sjukskrivna för utbrändhet har fått återbetalningskrav när de tagit hand om sina barn. I båda fallen har Försäkringskassan ansett att vård av barn visar på arbetsförmåga och krävt att sjukpenningen ska betalas tillbaka för mer än ett år tillbaka i tiden. Ruth Mannelqvist är professor i rättsvetenskap vid Umeå universitet och menar att Försäkringskassan blivit hårdare. – Vid en bedömning kan vård av barn absolut vara ett tecken på arbetsförmåga. Men det som är nytt är att Försäkringskassan tycks ha en mycket striktare tolkning av regelverket. Och framför allt kräver de tillbaka pengar för mycket längre perioder. Det gör mig lite förskräckt, säger Ruth Mannelqvist. \"Rättsosäkra och godtyckliga\" Debbie Landgren krävdes exempelvis på 237 000 kronor när hon inte hittade lämplig dagisplats. Hon frågade Försäkringskassan om det gick bra att kombinera sjukpenning med att hon tog hand om sitt barn hemma, och fick ett okej. Men ett år senare gjorde Försäkringskassan en ny bedömning och menade då på att hon visat arbetsförmåga genom att ta hand om sitt barn och krävde då tillbaka sjukpenningen. – Den här sortens retroaktiva krav riskerar att bli rättsosäkra och godtyckliga. Och när det rör sig om så långa perioder så kan det bli summor som sätter människor i en fruktansvärd fattigdomsfälla, säger Ruth Mannelqvist. Fler återkrav Men Försäkringskassan slår ifrån sig och menar att de visserligen driver in mer pengar i återkrav, men att det görs med omsorg. – Det är absolut ett ökat fokus på återkrav, men jag ser inte att det får oönskade effekter på det sättet. Ökat fokus handlar också om att vi fått utökade resurser på återbetalning och på kontrollverksamheten. Vilket gör att vi hittar fler impulser som ska utredas och beslutas, säger Emma Grahn, chef på enheten för Återkrav på Försäkringskassan. \"Lyhörda för politikerna\" Ruth Mannelqvist tror inte att det är någon slump att Försäkringskassan blivit hårdare med återkrav. Snarare ser hon att myndigheten lyssnar på Tidöpartiernas önskemål. – Försäkringskassan driver ingen egen politisk linje. Däremot är de lyhörda för politikernas ambitioner, som just nu baseras på en föreställning om att det finns personer som får ersättningar de inte har rätt till. Men då riskerar också oskyldiga människor att komma i kläm, säger Ruth Mannelqvist. Emma Grahn på Försäkringskassan håller inte helt med professorn. – Ytterst är det lagstiftningen som styr och inte regleringsbrev. Men återkrav är absolut ett prioriterat område och vi arbetar utifrån den riktning vi får från vår uppdragsgivare, säger Emma Grahn, chef på enheten för Återkrav på Försäkringskassan. Ruth Mannelqvist intervjuades även i 22-nyheterrna i TV4 – se klippet ovan.", "link": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "date_display": "2026-05-26", "date_iso": "2026-05-26T19:58:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/forsakringskassan", "/socialpolitik"]}, {"id": 135, "title": "Lisa Magnusson: In the midst of the world's senseless evil, a child was saved", "summary": "Surely there are those who manage to find something to complain about even in the sunshine story about the found 2-year-old. But for most of us, it's just genuinely nice.", "title_original": "Lisa Magnusson: Mitt i världens meningslösa ondska blev ett barn räddat", "summary_original": "Säkert finns det de som lyckas hitta något att klaga på även i solskenshistorien om den återfunna 2-åringen. Men för de flesta av oss är den bara genuint fin.", "link": "https://www.dn.se/ledare/lisa-magnusson-mitt-i-varldens-meningslosa-ondska-blev-ett-barn-raddat/", "date_display": "2026-05-26", "date_iso": "2026-05-26T19:18:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "The soldier testifies: A dead Russian gives 12 points at the front", "summary": "A shift has taken place at the front in Ukraine, says Marco, who controls drones at the front, to DN. The commanders want the Ukrainians to knock out Russian soldiers instead of equipment. It currently gives more points in the controversial video game-like system used by the Ukrainian army.", "title_original": "Soldaten vittnar: En död ryss ger 12 poäng vid fronten", "summary_original": "Ett skifte har skett på fronten i Ukraina, säger Marco, som styr drönare vid fronten, till DN. Befälhavarna vill att ukrainarna ska slå ut ryska soldater i stället för utrustning. Det ger just nu fler poäng i det omtvistade tv-spelsliknande systemet som den ukrainska armén använder sig av.", "link": "https://www.dn.se/varlden/soldaten-vittnar-en-dod-ryss-ger-12-poang-vid-fronten/", "date_display": "2026-05-26", "date_iso": "2026-05-26T19:17:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "The e-sports profile is forced to withdraw from the competition - weighed too much", "summary": "In the TV4 program \"The Box\", challenges await that the participants do not know in advance what they are getting into. The first challenge in Tuesday's episode involved jumping out of a plane from 1,000 meters high - something that made several contestants nervous. Entrepreneur Omar Ramadan chose to refrain and instead took the risk of leaving the program. E-sports profiler Yacine Laghmari, on the other hand, was heavily charged. After six episodes, he had called for more extreme challenges. - I was pissed off. I remember when we used to do these drills, when we would jump in the water and build boats and stuff. Then I was a piece of shit. I was like, “What kind of show is this?” And then they said: \"There will be crazy stuff,\" he tells TV4 Nyheterna. \"If you're not sure brother\" But when the time came for the moment he had been looking forward to, he was forced to stay on the ground. The reason was that he and the instructor together exceeded the weight limit for the jump. - It's like you can't weigh more than him, or something. So he must be able to control your weight, says Yacine Laghmari. - He hesitated himself. Then I was like this: \"Then we're going to screw this up, old man. If you're not sure bro, then we're probably not going to try.\" That there could be a problem did not come as a total surprise to Laghmari. He has long wanted to jump with a parachute and had understood in advance that the weight could put an end to it. - So I knew that I, when I stood there. I probably won't be able to jump because I didn't think they could have solved it in another way and that was the case too. Got the wrong information Martin Nygren, executive producer for the program, writes in an email to TV4 Nyheterna that they always make sure that all participants have the right conditions to carry out a competition. In Laghmari's case, however, the production is said to have received the wrong information which did not work with the jumper he was assigned.\n\n\"And since safety is a priority, unfortunately Yacine couldn't participate in the challenge. Couldn't solve anything", "title_original": "E-sportprofilen tvingas avstå tävlingen – vägde för mycket", "summary_original": "I TV4-programmet ”Boxen” väntar utmaningar som deltagarna på förhand inte vet vad de går ut på. Den första utmaningen i tisdagens avsnitt innebar att hoppa ur ett flygplan från 1 000 meters höjd – något som gjorde flera deltagare nervösa. Entreprenören Omar Ramadan valde att avstå och tog i stället risken att åka ur programmet. E-sportprofilen Yacine Laghmari var däremot rejält laddad. Efter sex avsnitt hade han efterlyst mer extrema utmaningar. – Jag var ju skittaggad. Jag kommer ihåg när vi körde de här övningarna innan, när vi hoppade i vattnet och skulle bygga båtar och grejer. Då var jag ju skitlack. Jag var så här: ”Vad är det här för program?” Och då sa de: ”Det kommer komma galna grejer”, säger han till TV4 Nyheterna. ”Om du inte är säker bror” Men när det väl blev dags för momentet han sett fram emot tvingades han stanna på marken. Anledningen var att han och instruktören tillsammans överskred viktgränsen för hoppet. – Det är typ att man inte får väga mer än honom, eller något. Alltså han måste kunna kontrollera din vikt, säger Yacine Laghmari. – Han tvekade ju själv. Då var jag så här: ”Då skiter vi nog i det här, gubben. Om du inte är säker bror, då kommer vi nog inte att prova.” Att det kunde bli ett problem var inget som kom som en total överraskning för Laghmari. Han har länge velat hoppa fallskärm och hade på förhand förstått att vikten kunde sätta stopp. – Så jag visste ju att jag, när jag stod där. Jag kommer nog inte kunna hoppa för jag hade inte tänkt att de hade kunnat lösa det på ett annat sätt och så var ju fallet också. Fick in fel uppgifter Martin Nygren, exekutiv producent för programmet, skriver i ett mejl till TV4 Nyheterna att man alltid ser till att samtliga deltagare har rätt förutsättningar för att genomföra en tävling. I Laghmaris fall ska produktionen dock ha fått fel uppgifter som inte fungerade med den hoppare han tilldelats.\n\n”Och då säkerheten prioriteras kunde tyvärr inte Yacine medverka i utmaningen. Gick inte att lösa på något annat sätt. Och reglerna säger att man måste ta sig an utmaningen för att inte hamna i det vi kallar riskzonen”, skriver Martin Nygren. Angående att Laghmari efterlyst mer extrema utmaningar svarar han att varje utmaning nog upplevs mycket ur ett subjektivt perspektiv. ”Det råder nog olika uppfattningar om vad som känns mest extremt men visst det här var kanske en av de mer spektakulära”, skriver Martin Nygren.", "link": "https://www.tv4.se/artikel/2EiP2URycUm7gtPEOOrQw1/e-sportprofilen-tvingas-avsta-taevlingen-vaegde-foer-mycket", "date_display": "2026-05-26", "date_iso": "2026-05-26T18:44:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/boxen", "/tv4", "/tv4-play"]}, {"id": 138, "title": "Therefore retiree Göran SD abandons - Åkesson's answer: \"Buy it\"", "summary": "Jimmie Åkesson has been the party leader of the Sweden Democrats since 2005 and is now entering his sixth election campaign. According to the latest opinion figures, SD retains its place as Sweden's second largest party. Choose the Liberals instead But not everyone is completely satisfied. Pensioner Göran Fredrikson voted for SD in the last election, mainly because of the party's clear focus on the migration issue. But before the autumn elections, he will vote for the Liberals. It is above all the Sweden Democrats' line regarding deportations that made Fredrikson change his mind. \n\n- The Liberals address this issue of personal responsibility in a stronger way and are more flexible and pragmatic when it comes to deporting people. Not everyone should be deported for reaching a certain age. It is how one behaves that is important, he says.  He emphasizes that he does not see himself as being let down by the Sweden Democrats, but rather that he himself is letting down the party through his decision.  - I have appreciated SD's politics for many years, but what makes me uncertain and why I will vote for another party this year is because it has become messy with all the savages. I also think this policy of deporting people who have a good character doesn't feel right, says Fredrikson in a greeting to Åkesson. \"I think he is balanced\" Sweden Democrats' Jimmie Åkesson responded to the arguments in the Efter fem studio.  - Strategically, I don't know if I want him back because L needs a lot of votes to pass the four percent barrier. I think he is balanced and I don't see him as a traitor, but he argues well for the election, says Åkesson.  But the SD leader thinks it is unfair that the party has to bear the blame for the so-called teenage expulsions as the legislation is old and not created by SD. But he understands Fredrikson's criticism.  - I buy it. My point of departure is that if you come to Sweden, live here, take care of yourself and do everything right, you educate yourself, get a job and your own livelihood, then it is not the ones we should develop", "title_original": "Därför överger pensionären Göran SD – Åkessons svar: ”Köper det”", "summary_original": "Jimmie Åkesson har varit Sverigedemokraternas partiledare sedan 2005 och går nu in i sin sjätte valrörelse. Enligt senaste opinionssiffrorna behåller SD sin plats som Sveriges näst största parti. Väljer Liberalerna istället  Men alla är inte helt nöjda. Pensionären Göran Fredrikson röstade på SD i det senaste valet, främst på grund av partiets tydliga fokus på migrationsfrågan. Men inför höstens val kommer han rösta på Liberalerna. Det är framför allt Sverigedemokraternas linje kring utvisningar som fått Fredrikson att ändra sig. \n\n– Liberalerna tar upp det här med personligt ansvar på ett starkare sätt och är mer flexibla och pragmatiska vad gäller utvisning av folk. Alla ska inte utvisas för att man uppnått en viss ålder. Det är hur man uppträder som är viktigt, säger han.  Han betonar att han inte ser sig som sviken av Sverigedemokraterna, utan snarare att han själv sviker partiet genom sitt beslut.  – Jag har uppskattat SD:s politik i många år men det som gör mig osäker och varför jag kommer rösta på ett annat parti i år är för att det blivit stökigt med alla vildar. Jag tycker också det här med politiken att man ska utvisa folk som har en god vandel, inte känns rätt, säger Fredrikson i en hälsning till Åkesson. ”Tycker han är balanserad” Sverigedemokraternas Jimmie Åkesson svarade på argumenten i Efter fem-studion.  – Rent strategiskt vet jag inte om jag vill ha tillbaka honom eftersom L behöver massa röster för att klara fyraprocentsspärren. Jag tycker att han är balanserad och jag upplever inte honom som en svikare utan han argumenterar väl för valet, säger Åkesson.  Men SD-ledaren tycker det är orättvist att partiet fått bära skulden för de så kallade tonårsutvisningarna då lagstiftningen är gammal och inte skapad av SD. Men han förstår Fredriksons kritik.  – Jag köper det. Min utgångspunkt är att om du kommit till Sverige, bor här, sköter dig och gjort allting rätt, du utbildar dig, skaffar dig ett jobb och en egen försörjning, då är det inte de vi ska utvisa. Men när man stiftar lagar och bygger system blir det inte alltid hundra procent träffsäkert och det försöker vi göra något åt, säger Åkesson.", "link": "https://www.tv4.se/artikel/PzuZ5hztRvjuaa4EG4xhh/pensionaeren-goeran-oeverger-sd-akessons-svar-ingen-svikare", "date_display": "2026-05-26", "date_iso": "2026-05-26T17:35:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/valet-2022/sverigedemokraterna", "/valet-2026", "/personer/jimmie-akesson-sd"]}, {"id": 139, "title": "Weather chaos over Stockholm and Uppsala - watch the video", "summary": "On Resarö south of Åkersberga, several children disappeared from a sailing camp when the storm moved in. The maritime and air rescue center was alerted and the children could be secured a moment later.  - Up at Resarö, the children are secured but the boats are still out on the water, says Lars Antonsson, air rescue leader at sea and air rescue. Several sailors affected by the storm Another sailing school in Nacka was affected by the storm.  - There have been sailing schools with optimist dinghies that have been surprised by the stormy weather, we are assisting, they have difficulty getting in, says Lars Antonsson. The police announced shortly after 19.30 that all the children in Nacka were secured. - Then we have a sailboat with blown sails up at Vaxholm, says Lars Antonsson and adds: - It's a bit confused, so we try to put as many units as we can on it and work together with the Maritime Rescue Society, the Maritime Police and the Coast Guard, says Lars Antonsson. SAS plane could not land at Arlanda Air traffic was also affected. An SAS plane flying from Copenhagen to Arlanda was unable to land due to weather conditions.  \"The safety of our passengers and colleagues is always our highest priority. The flight therefore landed in Skavsta in accordance with current safety procedures,\" writes SAS's press service to TV4 Nyheterna. The plane has now refueled at Skavsta and will try to land at Arlanda again \"weather permitting\". Several trees fell: \"Total chaos\" In Uppsala several trees fell in the strong wind. Several bursts of thunder have been heard and showers of hail have passed during the evening. - I have never experienced anything like this, one second it was calm, the next total chaos, says a person who was in the area.  Parts of roofs have also fallen down and roads have been closed due to fallen trees. A car in southern Uppsala was hit by a tree.  - It came to a halt after a tree fell down, but no one was injured, says Pelle Vamstad, press spokesperson at the police. Films from Uppsala show how a tree nearby", "title_original": "Väderkaos över Stockholm och Uppsala – se tittarfilmen", "summary_original": "På Resarö söder om Åkersberga försvann flera barn från ett seglarläger när ovädret drog in. Sjö- och flygräddningscentralen larmades och barnen kunde säkras en stund senare.  – Uppe vid Resarö är barnen säkrade men båtarna är kvar ute på vattnet, säger Lars Antonsson, flygräddningsledare på sjö- och flygräddningen. Flera seglare drabbade av ovädret Ytterligare en seglarskola i Nacka drabbades av ovädret.  – Det har varit seglarskola med optimistjollar som blivit överraskade av överfallsvädret, vi håller på att assistera, de har svårt att ta sig in, säger Lars Antonsson. Polisen meddelade strax efter klockan 19.30 att alla barnen i Nacka var säkrade. – Sen så har vi en segelbåt med sönderblåsta segel uppe vid Vaxholm, säger Lars Antonsson och tillägger: – Det är lite förvirrat så vi försöker sätta så många enheter vi kan på det och jobbar tillsammans med Sjöräddningssällskapet, Sjöpolisen och Kustbevakningen, säger Lars Antonsson. SAS-plan kunde inte landa på Arlanda Även flygtrafiken påverkades. Ett SAS-plan som flög från Köpenhamn till Arlanda kunde inte landa på grund av väderförhållandena.  ”Våra passagerares och kollegors säkerhet är alltid vår högsta prioritet. Flygningen landade därför i Skavsta i enlighet med gällande säkerhetsrutiner”, skriver SAS presstjänst till TV4 Nyheterna. Planet har nu tankat på Skavsta och kommer att försöka landa på Arlanda igen ”om vädret tillåter”. Flera träd välte: ”Totalt kaos” I Uppsala välte flera träd i den hårda vinden. Flera åskknallar har hörts och hagelskurar har passerat under kvällen. – Jag har aldrig varit med om något liknande, ena sekunden var det lugnt, nästa totalt kaos, säger en person som befann sig i området.  Delar från tak har även fallit ner och vägar har stängts av till följd av nedfallna träd. En bil i södra Uppsala träffades av ett träd.  – Det blev stopp efter att ett träd ramlat ner, men ingen har skadats, säger Pelle Vamstad, presstalesperson på polisen. Filmer från Uppsala visar hur ett träd i närheten av resecentrum plötsligt klyvs i mitten i närheten av en buss. – Oh shit, skriker en person som blir vittne till händelsen.  – Vi har varit inne vid resecentrum också och plockat lite grenar och så. Vi har varit behjälpliga men det har inte varit något polisiärt, säger Pelle Vamstad. I Huddinge välte ett träd över en flicka, både räddningstjänst och polis larmades till platsen. – Hon skadades lindrigt, säger Susanna Rinaldo, presstalesperson på polisen. Fanns med i prognosen Fenomenet har orsakats av ett väder med kraftiga skurar som vandrat neråt sydost över Mellansverige och som under kvällen nått fram till östra Svealand med tyngdpunkt i Roslagen och in över centrala Stockholm och vidare västerut i Mälardalen.  TV4:s meteorolog Ulrika Elvgren förklarar:  – Under det här är det väldigt kraftiga vindstötar, det är stormbyar och den här kraftiga vinden bildas av att vi dels har väldigt labil luft med stor vertikal rörelse. Det är stor åskrisk i området också, säger hon och tillägger:  – Men framförallt att den omgivande luften är torr. Och det bidrar till att en del av nederbörden avdunstar och då avkyls den omgivande luften runt molnet. Så då skapas väldigt kraftiga fallvindar. Luften verkligen rasar ner till marken och då får vi den här byiga vinden, en downburst, eller kraftiga fallvindar.  ”Många blev nog tagna på sängen” Vindhastigheterna har uppmätts till 24 meter per sekund vid Uppsala flygplats.  – Förmodligen har vi nått ännu högre vindhastigheter med tanke på konsekvenserna. Men det har varit ytterst lokalt.  Även om många chockades av det plötsliga väderomslaget så var det inte helt oväntat.  – Det är många nedfallna träd. Även lösa föremål som ligger liksom utblåsta på vägarna så jag tror att det är många som har blivit tagna på sängen. Men det är hatten av för den på SMHI som faktiskt fångade upp det här igår och flaggade för det, säger Ulrika Elvgren.", "link": "https://www.tv4.se/artikel/2TZrKM9c2EPC0P5u4BSv9z/ploetsligt-ovaeder-i-uppsala-flera-traed-har-vaelt", "date_display": "2026-05-26", "date_iso": "2026-05-26T16:57:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vadret", "/uppsala", "/uppland", "/stockholm"]}, {"id": 140, "title": "The district court's decision is unique in the Swedish context", "summary": "The Södertörn district court's decision is unique in a Swedish context because the prosecutor for the first time tried the question of whether two people can be held responsible for the death of the perpetrator himself. The now 23-year-old instigator and a boy of the same age were charged on suspicion of causing the perpetrator's death. The prosecutor's reasoning was that a 15-year-old cannot be expected to have a full overview of the risks and that the older ones should have understood that handing over such a powerful explosive charge was associated with danger to life. At the same time, the boy is described as someone who has not been involved in criminal networks. Unclear when children \"know their own best\" The district court's conclusion was instead that the boy himself bears the responsibility: that, in the eyes of the court, he should have understood that he could die. It is a demarcation that can have significance for how the justice system reasons about children who carry out assignments for criminal networks. The question of when a child is considered to be able to \"know his own best interests\" has no fixed age limit and is tested on a case-by-case basis. Therefore, the follow-up question is also raised how similar events should be assessed, such as in the case where a boy in Malmö accidentally set himself on fire and suffered burns when he was going to set fire to a property, on behalf of a criminal network. Will be appealed. For the family, the news is particularly painful. The boy was blown into several pieces and remains were found 50–60 meters from the scene. Even the law is said to have taken offense, but emotions must not affect the law. The family's legal counsel say they would like to see a trial all the way to the Supreme Court, as guidance is needed on how courts should judge when children are injured or die after adult gang criminals make them commit acts.", "title_original": "Tingsrättens besked är unikt i svensk kontext", "summary_original": "Södertörns tingsrätts besked är unikt i en svensk kontext eftersom åklagaren för första gången prövade frågan om två personer kan hållas ansvariga för att utföraren själv dör. Den numera 23-årige anstiftaren och en jämnårig pojke åtalades misstänkta för vållande till utförarens död. Åklagarens resonemang var att en 15-åring inte kan förväntas överblicka riskerna fullt ut och att de äldre borde ha förstått att det var förenat med livsfara att lämna över en så kraftig sprängladdning. Pojken beskrivs samtidigt som någon som inte rört sig i kriminella nätverk. Oklart när barn ”vet sitt eget bästa” Tingsrättens slutsats blev i stället att pojken själv bär ansvaret: att han, i rättens ögon, borde ha förstått att han kunde dö. Det är en gränsdragning som kan få betydelse för hur rättsväsendet resonerar kring barn som utför uppdrag åt kriminella nätverk. Frågan om när ett barn anses kunna ”veta sitt eget bästa” saknar en fast åldersgräns och prövas från fall till fall. Därför väcks också följdfrågan hur liknande händelser ska bedömas, som i fallet där en pojke i Malmö av misstag satte eld på sig själv och fick brännskador när han skulle sätta fyr på en fastighet, på uppdrag av ett kriminellt nätverk. Kommer överklagas För familjen är beskedet särskilt smärtsamt. Pojken sprängdes i flera bitar och kvarlevor hittades 50–60 meter från platsen. Även rätten uppges ha tagit illa vid sig, men känslor får inte påverka juridiken. Familjens målsägandebiträde uppger att de gärna ser en prövning ända upp till Högsta domstolen, eftersom det behövs vägledning om hur domstolar ska döma när barn skadas eller dör efter att vuxna gängkriminella fått dem att utföra dåd.", "link": "https://www.tv4.se/artikel/3sNrMPnEuTm76k33RofDH3/tingeraettens-besked-aer-unikt-i-svensk-kontext", "date_display": "2026-05-26", "date_iso": "2026-05-26T16:54:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/ostberga", "/sprangningar"]}, {"id": 141, "title": "The bus industry is critical: Cheaper tickets are not enough", "summary": "After the government's actions • \"This investment needs to live on after the election\"", "title_original": "Bussbranschen kritisk: Billigare biljetter räcker inte", "summary_original": "Efter regeringens utspel • ”Den här satsningen behöver leva vidare efter valet”", "link": "https://www.tv4.se/artikel/4jM9xIQnO3sUzUhhYCc4TR/bussbranschen-kritisk-billigare-biljetter-raecker-inte", "date_display": "2026-05-26", "date_iso": "2026-05-26T16:34:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes"]}, {"id": 142, "title": "Stenström ratas – TV4 chooses another WC song", "summary": "This summer, the soccer World Cup will take place in the USA and many Swedes are expected to follow the championship at home. TV4 owns a large part of the broadcasting rights and will, among other things, show both the opening match and the final.\n\nIn the trailer for the channel's soccer venture, which starts on June 11, images from Sweden's bronze medal in the soccer World Cup in the USA in 1994 are interspersed with the reactions after the national team qualified for this year's edition. According to TV4's sports director Johan Cederqvist, they wanted to create a \"summery folk festival\" feeling, with the right tempo and football references. \"Fitted best\" The music for the trailer was not the official WC song \"Live forever\" by Thomas Stenström, but instead the Falun band Bolaget's upcoming contribution. In an email reply to TV4 Nyheterna, Johan Cederqvist writes that their song was a better fit. \"We have simply chosen the song that we think was best suited for the purpose in this particular trailer,\" he writes. The company's WC song is called \"There's something in the air\" and will be released on June 3. In a post on Instagram, the band writes that the song is for the people, the players and the nation, and the music video features one of the heroes behind the bronze from 1994 – Tomas Brolin. \"Now the championship can begin,\" concludes the post. The official World Cup song is met with criticism TV4 Nyheterna has previously reported that Sweden's official World Cup song \"Live forever\" has been met with criticism - both from Swedish football supporters and music critics. Among other things, Olof Lundh believes that someone with greater football involvement should have been allowed to do it and calls Thomas Stenström's song a real \"post shot\". At the same time, he points out that it is common for championship songs to miss the mark and that the time pressure in this case has likely affected the quality. On the culture pages, the song has been described, among other things, as \"lax and cynical\" and that \"the ecstasy is missing\". SVT Kulturnyheterna has also noticed that the song's chorus is reused from a TV series.", "title_original": "Stenström ratas – TV4 väljer annan VM-låt", "summary_original": "I sommar går fotbolls-VM av stapeln i USA och många svenskar väntas följa mästerskapet på hemmaplan. TV4 äger en större del av sändningsrättigheterna och kommer bland annat att visa både öppningsmatchen och finalen.\n\nI trailern till kanalens fotbollssatsning, som drar i gång den 11 juni, varvas bland annat bilder från Sveriges brons i fotbolls-VM i USA 1994 med reaktionerna efter att landslaget kvalificerat sig till årets upplaga. Enligt TV4:s sportdirektör Johan Cederqvist har man velat få fram en ”somrig folkfest”-känsla, med rätt tempo och fotbollsreferenser. ”Passade bäst” Musiken till trailern blev inte den officiella VM-låten ”Leva för alltid” av Thomas Stenström utan i stället Falun-bandet Bolagets kommande bidrag. I ett mejlsvar till TV4 Nyheterna skriver Johan Cederqvist att deras låt passade bättre. ”Vi har helt enkelt valt den låt som vi tycker passade bäst för ändamålet i just den här trailern”, skriver han. Bolagets VM-låt heter ”Det ligger något i luften” och släpps den 3 juni. I ett inlägg på Instagram skriver bandet att låten är för folket, spelarna och nationen och i musikvideon medverkar en av hjältarna bakom bronset från 1994 – Tomas Brolin. ”Nu kan mästerskapet börja
