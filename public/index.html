he organization's focus has turned from the Pope's Rome to Trump's Washington. Then came an unexpected call.", "title_original": "Blottade hemliga ”Opus Dei” – då ringde påven", "summary_original": "När journalisten Gareth Gore granskade den mytomspunna katolska rörelsen Opus Dei blev han ofrivilligt en del av maktkampen i Vatikanen –·och insåg att organisationens fokus vänts från påvens Rom till Trumps Washington. Då kom ett oväntat samtal.", "link": "https://www.svd.se/a/Rj6WLA/granskade-opus-dei-gareth-gore-uppringd-av-paven-och-del-av-inre-maktkamp", "date_display": "2026-07-19", "date_iso": "2026-07-19T08:05:29+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 21, "title": "Dragged the son in the ear - charged with assault", "summary": "In the summer of 2024, a 30-year-old man is accused of pulling his son's ear so hard that he was forced to stand on his toes.", "title_original": "Drog sonen i örat – åtalas för misshandel", "summary_original": "Sommaren 2024 anklagas en 30-årig man för att ha dragit sin son så hårt i örat att han tvingades upp på tå.", "link": "https://www.hd.se/bastad/drog-sonen-i-orat-atalas-for-misshandel/", "date_display": "2026-07-19", "date_iso": "2026-07-19T08:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 22, "title": "\"I'm glad I didn't give birth in Lund\"", "summary": "", "title_original": "”Jag är glad att jag inte födde barn i Lund”", "summary_original": "", "link": "https://www.sydsvenskan.se/lund/jag-ar-glad-att-jag-inte-fodde-barn-i-lund/", "date_display": "2026-07-19", "date_iso": "2026-07-19T08:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 23, "title": "Low TBE coverage among exposed outdoor workers", "summary": "Outdoor workers are at risk of being exposed to ticks and contracting TBE. But farmers and forest workers often lack protection against the disease, which can have serious consequences. - When people have not experienced the disease themselves, they think the risk is low, says researcher Junwen Guo.", "title_original": "Låg TBE-täckning bland utsatta utomhusarbetare", "summary_original": "Utomhusarbetare löper risk för att utsättas för fästingar och smittas av TBE. Men lantbrukare och skogsarbetare saknar många gånger skydd mot sjukdomen, som kan få allvarliga konsekvenser. – När människor inte upplevt sjukdomen själva tror de att risken är låg, säger forskaren Junwen Guo.", "link": "https://www.svd.se/a/6qWbwO/lag-tbe-tackning-bland-utsatta-utomhusarbetare", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:53:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 24, "title": "Johanna Frändén: The WC final is already a classic in advance", "summary": "Spain has the system, the security – and a savings capital in Lamine Yamal. Argentina have Leo Messi and his otherworldly ability to drum things up when they are down for the count. The World Cup final is a meeting between two continents, one language and a bathing suit that defies all probability calculations.", "title_original": "Johanna Frändén: VM-finalen är redan på förhand en klassiker", "summary_original": "Spanien har systemet, säkerheten – och ett sparkapital i Lamine Yamal. Argentina har Leo Messi och sin överjordiska förmåga att trumma i gång när de är nere för räkning. VM-finalen är ett möte mellan två kontinenter, ett språk och en badbild som slår alla sannolikhetskalkyler.", "link": "https://www.dn.se/sport/johanna-franden-vm-finalen-ar-redan-pa-forhand-en-klassiker/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:49:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 25, "title": "Suspected rape at Värnhemstorget", "summary": "The police investigated a suspected sexual crime on Värnhemstorget on Sunday morning. The site was cordoned off and technicians have been working in the area.", "title_original": "Misstänkt våldtäkt vid Värnhemstorget", "summary_original": "Polisen utredde under söndagsmorgonen ett misstänkt sexualbrott på Värnhemstorget. Platsen spärrades av och tekniker har arbetat i området.", "link": "https://www.sydsvenskan.se/malmo/varnhemstorget-avsparrat-pagaende-insats/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:49:06+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 26, "title": "Spy scandal, MFF coach and new father: \"There has been a lot of guilt\"", "summary": "Few football coaches have had as intense a year as Anes Mravac. In just twelve months, the 37-year-old managed to train in Division 1, the Allsvenskan and the Europa League - and qualify for the Premier League after a spy scandal. In addition, he became a father for the first time.", "title_original": "Spionskandal, MFF-tränare och nybliven pappa: ”Har varit mycket skuldkänslor”", "summary_original": "Få fotbollstränare har haft ett lika intensivt år som Anes Mravac. På bara tolv månader hann 37-åringen träna i division 1, allsvenskan och Europa League – och kvala till Premier League efter en spionskandal. Dessutom blev han pappa för första gången.", "link": "https://www.sydsvenskan.se/sport/spionskandal-faderskap-och-tranare-i-mff-har-varit-mycket-skuldkanslor/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:39:10+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 27, "title": "Massive Russian attack on Kyiv during the night", "summary": "At least one person has died and eight have been injured in Russian attacks on the Ukrainian capital Kiev during the night of Sunday. According to Ukrainian Foreign Minister Andriy Sybiha, more than 40 ballistic missiles were fired at the city.", "title_original": "Massiv rysk attack mot Kiev under natten", "summary_original": "Minst en person har dött och åtta har skadats i ryska attacker mot Ukrainas huvudstad Kiev under natten mot söndagen. Enligt Ukrainas utrikesminister Andrij Sybiha avfyrades över 40 ballistiska robotar mot staden.", "link": "https://www.dn.se/varlden/massiv-rysk-attack-mot-kiev-under-natten/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:37:26+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 28, "title": "The church can afford the gospel choirs", "summary": "St. John's parish closes down two gospel choirs, but does it really benefit the church, asks church politician Leif Aruhn-Solén (C) .", "title_original": "Kyrkan har råd med gospelskörerna", "summary_original": "S:t Johannes församling lägger ner två gospelskörer, men gynnar det verkligen kyrkan frågar sig kyrkopolitiker Leif Aruhn-Solén (C) .", "link": "https://www.sydsvenskan.se/malmo/kyrkan-har-rad-med-gospelskorerna/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 29, "title": "Volunteers are wanted for the new Ebola vaccine", "summary": "Oxford University in England has now begun recruiting volunteers to test a new vaccine against the bundibugyo variant of Ebola, which is driving the current outbreak in Congo-Kinshasa. The vaccine is based on the same platform as the Oxford/Astra Zeneca covid-19 vaccine, which according to the university saved at least six million lives.", "title_original": "Frivilliga sökes för nya ebolavaccinet", "summary_original": "Oxford University i England har nu börjat rekrytera frivilliga för att testa ett nytt vaccin mot bundibugyo-varianten av ebola, som driver det aktuella utbrottet i Kongo-Kinshasa. Vaccinet bygger på samma plattform som Oxford/Astra Zenecas covid-19-vaccin, som enligt universitetet räddade minst sex miljoner liv.", "link": "https://www.dn.se/varlden/frivilliga-sokes-for-nya-ebolavaccinet/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:27:04+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 30, "title": "Woman cannot stop driving in Kullabygden", "summary": "For the third time this year, a woman in her 70s is sentenced for serious illegal driving. The fact that her car was previously impounded does not help.", "title_original": "Kvinna kan inte sluta köra bil i Kullabygden", "summary_original": "För tredje gången i år döms en kvinna i 70-årsåldern för grov olovlig körning. Att hennes bil tidigare tagits i beslag hjälper inte.", "link": "https://www.hd.se/hoganas/kvinna-kan-inte-sluta-kora-bil-i-kullabygden/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:27:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 31, "title": "Do not turn off the water for car washing in Helsingborgshem's garage", "summary": "", "title_original": "Stäng inte av vattnet för biltvätt i Helsingborgshems garage", "summary_original": "", "link": "https://www.hd.se/min-mening/stang-inte-av-vattnet-for-biltvatt-i-helsingborgshems-garage/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:20:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 32, "title": "L7 bassist Jennifer Finch dead", "summary": "Bassist Jennifer Finch from the band L7 has died, just days after it became known that she suffered from brain cancer, writes Stereogum. She was 59 years old.", "title_original": "L7-basisten Jennifer Finch död", "summary_original": "Basisten Jennifer Finch från bandet L7 har avlidit, bara dagar efter att det blev känt att hon drabbats av hjärncancer, skriver Stereogum. Hon blev 59 år.", "link": "https://www.hd.se/noje/l7-basisten-jennifer-finch-dod/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:19:41+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 33, "title": "L7 bassist Jennifer Finch dead", "summary": "Bassist Jennifer Finch from the band L7 has died, just days after it became known that she suffered from brain cancer, writes Stereogum. She was 59 years old.", "title_original": "L7-basisten Jennifer Finch död", "summary_original": "Basisten Jennifer Finch från bandet L7 har avlidit, bara dagar efter att det blev känt att hon drabbats av hjärncancer, skriver Stereogum. Hon blev 59 år.", "link": "https://www.sydsvenskan.se/noje/l7-basisten-jennifer-finch-dod/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:19:41+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 34, "title": "Journalist Karin Thunberg dead", "summary": "Karin Thunberg, longtime journalist at Svenska Dagbladet, has died.", "title_original": "Journalisten Karin Thunberg död", "summary_original": "Karin Thunberg, mångårig journalist på Svenska Dagbladet, har avlidit.", "link": "https://www.hd.se/familj/journalisten-karin-thunberg-dod/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:19:25+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 35, "title": "Journalist Karin Thunberg dead", "summary": "Karin Thunberg, longtime journalist at Svenska Dagbladet, has died.", "title_original": "Journalisten Karin Thunberg död", "summary_original": "Karin Thunberg, mångårig journalist på Svenska Dagbladet, har avlidit.", "link": "https://www.sydsvenskan.se/familj/journalisten-karin-thunberg-dod/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:19:25+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 36, "title": "Journalist Karin Thunberg dead", "summary": "Karin Thunberg worked for 30 years as a permanent employee at Svenska Dagbladet's editorial office. From 2012 until her death, she freelanced for the magazine. She died on Friday evening after a short illness, the newspaper writes. The job was an immense joy and importance for her, at the same time she was extremely present and caring towards her family and friends, says son Karl Thunberg to SvD. Among other things, Thunberg was awarded the Publicistklubben's gold pen, was named Stylist of the Year and received Lukas Bonnier's major journalism award. She has written several books, including \"One day I'll tell you about mom\" (Brombergs, 2008) and \"Between the kitchen window and eternity\" (Brombergs, 2006). Karin Thunberg also wrote several plays: \"Felicia disappeared\", \"Mothers\" and \"Lyckans kor\", which have been staged at Stockholm City Theater and Uppsala City Theatre. The latest play, the monologue \"Queen of Gossip\", premiered at Soppteatern at Stockholm City Theater last year. Karin Thunberg was 76 years old.", "title_original": "Journalisten Karin Thunberg död", "summary_original": "Karin Thunberg arbetade i 30 år som fast anställd på Svenska Dagbladets redaktion. Från 2012 fram till sin död frilansade hon för tidningen. Hon avled under fredagskvällen efter en kort tids sjukdom, skriver tidningen. Jobbet var en oerhörd glädje och betydelse för henne, samtidigt som hon varit oerhört närvarande och omtänksam mot sin familj och sina vänner, säger sonen Karl Thunberg till SvD. Thunberg tilldelades bland annat Publicistklubbens guldpenna, utsågs till Årets stilist och fick Lukas Bonniers stora journalistpris. Hon har skrivit flera böcker, bland annat ”En dag ska jag berätta om mamma” (Brombergs, 2008) och ”Mellan köksfönstret och evigheten” (Brombergs, 2006). Karin Thunberg skrev även flera pjäser: ”Felicia försvann”, ”Mammor” och ”Lyckans kor”, som har satts upp på Stockholms stadsteater och Uppsala stadsteater. Den senaste pjäsen, monologen ”Skvallerdrottningen”, hade urpremiär på Soppteatern på Stockholms stadsteater förra året. Karin Thunberg blev 76 år.", "link": "https://www.tv4.se/artikel/tt-260719-thunberg1-0c3a6171/journalisten-karin-thunberg-dod", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:11:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/konst", "/kultur"]}, {"id": 37, "title": "\"The coward in Moscow\" - Ukraine's anger after the night's attacks on Kyiv", "summary": "Several explosions were heard in Kiev during the night to Sunday after new Russian robot attacks against the Ukrainian capital. At least two people have been injured, according to the Kyiv Independent. Fires are said to have broken out in both residential buildings and a supermarket, says Kyiv's mayor Vitaly Klytchko. Ukraine's air force issued repeated warnings overnight about incoming ballistic missiles aimed at the capital. \"Brutal terrorist attack\" In a post on X, Ukrainian Foreign Minister Andriy Sybiha claims that Russia fired about four dozen ballistic missiles at Kiev. \"Russia launched the largest number of ballistic missiles since the beginning of the war - about four dozen - in a brutal terrorist attack on the Ukrainian capital, resulting in deaths and injuries,\" he writes. At the same time, the minister directs sharp criticism at Russian President Vladimir Putin. \"The cowards in Moscow, who do not dare to meet with President Zelensky to end the war, continue to wage war against civilians,\" writes Sybiha. Demands tougher pressure on Moscow Andrij Sybiha is now calling on the outside world to increase pressure on Russia through new sanctions and more military support. \"We call for appropriate and forceful countermeasures. We need to apply devastating pressure on Moscow to end this terror,\" he writes. According to the foreign minister, the EU's 21st sanctions package against Russia must be implemented without delay and additional air defenses must be delivered to protect Ukrainian cities against continued robot attacks. \"Anyone who obstructs the delivery of these vital protective tools should be aware that the cost of delays is measured in human lives,\" he writes.  \"Putin will not be stopped by appeasement. He will go even further if he is not stopped forcefully now. Provide Ukraine with all necessary means to stop Russia and end the war.\"", "title_original": "”Fegisen i Moskva” – Ukrainas ilska efter nattens attacker mot Kiev", "summary_original": "Flera explosioner hördes i Kiev under natten mot söndagen efter nya ryska robotangrepp mot den ukrainska huvudstaden. Minst två personer har skadats, enligt Kyiv Independent. Bränder ska ha brutit ut i både bostadshus och en stormarknad, uppger Kievs borgmästare Vitalij Klytjko. Ukrainas flygvapen utfärdade under natten upprepade varningar om inkommande ballistiska robotar riktade mot huvudstaden. ”Brutal terroristattack” I ett inlägg på X hävdar Ukrainas utrikesminister Andrij Sybiha att Ryssland avfyrade omkring fyra dussin ballistiska robotar mot Kiev. ”Ryssland avfyrade det största antalet ballistiska robotar sedan krigets början – omkring fyra dussin – i en brutal terroristattack mot den ukrainska huvudstaden, vilket ledde till dödsfall och skadade människor”, skriver han. Ministern riktar samtidigt skarp kritik mot Rysslands president Vladimir Putin. ”Fegisen i Moskva, som inte vågar träffa president Zelenskyj för att få slut på kriget, fortsätter att föra krig mot civila”, skriver Sybiha. Kräver hårdare press mot Moskva  Andrij Sybiha uppmanar nu omvärlden att öka pressen mot Ryssland genom nya sanktioner och mer militärt stöd. ”Vi uppmanar till lämpliga och kraftfulla motåtgärder. Vi behöver utöva förödande påtryckningar på Moskva för att få ett slut på denna terror”, skriver han. Enligt utrikesministern måste EU:s 21:a sanktionspaket mot Ryssland genomföras utan dröjsmål och ytterligare luftförsvar levereras för att skydda ukrainska städer mot fortsatta robotattacker. ”Alla som hindrar leveransen av dessa livsviktiga skyddsverktyg bör vara medvetna om att kostnaden för förseningar mäts i människoliv”, skriver han.  ”Putin kommer inte att stoppas genom eftergiftspolitik. Han kommer att gå ännu längre om han inte stoppas med kraft nu. Förse Ukraina med alla nödvändiga medel för att stoppa Ryssland och få slut på kriget”.", "link": "https://www.tv4.se/artikel/5OfXM6JBOxeB9jCAYYhH7R/ukrainas-ilska-efter-nattens-attacker-mot-kiev-fegisen-i-moskva", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:01:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/krig", "/ukrainakonflikten", "/ukraina", "/putin", "/vladimir-putin", "/zelenskyj"]}, {"id": 38, "title": "Take part in Thunberg's most read articles", "summary": "During her years as a journalist at SvD, Karin Thunberg wrote a series of articles that made an impression on readers. Here we have collected a selection of her texts.", "title_original": "Ta del av Thunbergs mest lästa artiklar", "summary_original": "Under sina år som journalist på SvD skrev Karin Thunberg en rad artiklar som gjorde avtryck hos läsarna. Här har vi samlat ett urval av hennes texter.", "link": "https://www.svd.se/a/gk48Jk/karin-thunbergs-mest-lasta-artiklar", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:00:21+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 39, "title": "Journalistic work beyond the ordinary", "summary": "It's incomprehensible - she said so herself. Karin Thunberg was grateful for the life she was given. I am deeply grateful for everything she managed to give: her texts, her curiosity, her warmth and her understanding of people.", "title_original": "Journalistiskt värv utöver det vanliga", "summary_original": "Det är obegripligt – det sa hon själv. Karin Thunberg var tacksam för livet hon fick. Jag är djupt tacksam för allt hon hann ge: sina texter, sin nyfikenhet, sin värme och sin förståelse för människor.", "link": "https://www.svd.se/a/0pW230/karin-thunberg-var-tacksam-for-livet-hon-fick-jag-ar-tacksam-for-allt-hon-hann-ge", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:00:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 40, "title": "I think of you and smile, Karin", "summary": "Karin Thunberg knew the art of touching her readers. Erica Treijs remembers the friend and colleague who lived big and intensely - and who loved to write in the last.", "title_original": "Jag tänker på dig och ler, Karin", "summary_original": "Karin Thunberg kunde konsten att beröra sina läsare. Erica Treijs minns vännen och kollegan som levde stort och intensivt – och som älskade att skriva in i det sista.", "link": "https://www.svd.se/a/lnJqqL/karin-thunberg-var-ordens-basta-van", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:00:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 41, "title": "SvD journalist Karin Thunberg has passed away", "summary": "She was one of Sweden's most high-profile journalists, and was awarded several times for her storytelling. Karin Thunberg, who worked for 30 years at Svenska Dagbladet, died on Friday evening.", "title_original": "SvD-journalisten Karin Thunberg har gått bort", "summary_original": "Hon var en av Sveriges mest profilerade journalister, och prisades ett flertal gånger för sin berättarkonst. Karin Thunberg, som arbetade i 30 år på Svenska Dagbladet, avled under fredagskvällen.", "link": "https://www.svd.se/a/43W2je/journalisten-karin-thunberg-har-gatt-bort", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:00:07+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 42, "title": "A ship with a double life – changing names every six months", "summary": "M/S Deutschland is called in the advertisement \"A Grand hotel at sea\". The interior is stylistically inspired by the rich 20s and 30s. But the ship's future is uncertain and there are no trips booked for next summer.", "title_original": "Ett fartyg med dubbelliv – byter namn varje halvår", "summary_original": "M/S Deutschland kallas i reklamen ”Ett Grand hotel till sjöss”. Interiören är stilmässigt inspirerad av det rika 20- och 30-talet. Men fartygets framtid är oviss och det finns inga resor bokade inför nästa sommar.", "link": "https://www.hd.se/helsingborg/ett-fartyg-med-dubbelliv-byter-namn-varje-halvar/", "date_display": "2026-07-19", "date_iso": "2026-07-19T07:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 43, "title": "Child driving at 100 - refused to stop", "summary": "", "title_original": "Barn körde i 100 – vägrade stanna", "summary_original": "", "link": "https://www.svd.se/a/Wv8r9g/barn-korde-i-100-vagrade-stanna", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:56:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 44, "title": "Ukraine: The biggest robot attack of the war against Kyiv", "summary": "Russia carried out a huge robot attack on Kiev on Sunday night - the largest so far during the war, according to Foreign Minister Andriy Sybiha.", "title_original": "Ukraina: Krigets största robotattack mot Kiev", "summary_original": "Ryssland utförde en jättelik robotattack mot Kiev natten till söndagen – den största hittills under kriget, enligt utrikesminister Andrij Sybiha.", "link": "https://www.hd.se/varlden/ukraina-krigets-storsta-robotattack-mot-kiev/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:47:15+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 45, "title": "Ukraine: The biggest robot attack of the war against Kyiv", "summary": "Russia carried out a huge robot attack on Kiev on Sunday night - the largest so far during the war, according to Foreign Minister Andriy Sybiha.", "title_original": "Ukraina: Krigets största robotattack mot Kiev", "summary_original": "Ryssland utförde en jättelik robotattack mot Kiev natten till söndagen – den största hittills under kriget, enligt utrikesminister Andrij Sybiha.", "link": "https://www.sydsvenskan.se/varlden/ukraina-krigets-storsta-robotattack-mot-kiev/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:47:14+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 46, "title": "Child driving at 100 - refused to stop", "summary": "", "title_original": "Barn körde i 100 – vägrade stanna", "summary_original": "", "link": "https://www.svd.se/a/wrxW7o/barn-korde-i-100-vagrade-stanna", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:42:13+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 47, "title": "Josefin Olevik: I lost my child in Europe's airports", "summary": "Cancelled, diverted plans and a 13-year-old facing the horrors and allures of the world. Should an expectant mother hang 12 innocent maids or bite the bullet and wait stoically? Josefin Olevik tests both ways.", "title_original": "Josefin Olevik: Jag tappade bort mitt barn på Europas flygplatser", "summary_original": "Inställda, omdirigerade plan och en 13-åring som ställs inför världens fasor och lockelser. Ska en väntande mamma hänga 12 oskyldiga tjänarinnor eller bita ihop och vänta stoiskt? Josefin Olevik testar båda vägarna.", "link": "https://www.dn.se/kultur/josefin-olevik-jag-tappade-bort-mitt-barn-pa-europas-flygplatser/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:38:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 48, "title": "A four-metre-wide poo tunnel is to be built directly under their villa - 36,000 was offered", "summary": "Hundreds of homeowners and landowners are being offered lump sums when VA South wants to drill huge sewer tunnels under their homes.  The agreement is valid forever, confidentiality is required, new construction can be stopped - and the premium will expire if you hesitate. - It is written forever - is 36,000 reasonable for that restriction? asks Åkarp resident Josephine Leander.", "title_original": "Fyra meter bred bajstunnel ska dras rakt under deras villa – erbjöds 36 000", "summary_original": "Hundratals hus- och markägare erbjuds engångsbelopp när VA Syd vill borra enorma avloppstunnlar under deras hem.  Avtalet gäller för evigt, tystnadsplikt krävs, nybyggen kan stoppas – och premien ryker om du tvekar. – Det är skrivet för all framtid – är 36 000 rimligt för den inskränkningen? undrar Åkarpsbon Josephine Leander.", "link": "https://www.sydsvenskan.se/burlov/fyra-meter-bred-bajstunnel-ska-dras-rakt-under-deras-villa-erbjods-36-000/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:37:45+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 49, "title": "Mortgages are declining – this is the banks' new profit engine", "summary": "The big banks are currently earning less from customers' mortgages. They take that back on the savings. - Savings seem to be a profit engine for the banks at the moment, says Maria Landeborn, stock market strategist at Danske Bank.", "title_original": "Bolånen viker – här är bankernas nya vinstmotor", "summary_original": "Storbankerna tjänar just nu mindre på kundernas bolån. Det tar de igen på sparandet. – Sparandet verkar vara en vinstmotor för bankerna för tillfället, säger Maria Landeborn, börsstrateg på Danske Bank.", "link": "https://www.sydsvenskan.se/ekonomi/bolanen-viker-har-ar-bankernas-nya-vinstmotor/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:19:05+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 50, "title": "Mortgages are declining – this is the banks' new profit engine", "summary": "The big banks are currently earning less from customers' mortgages. They take that back on the savings. - Savings seem to be a profit engine for the banks at the moment, says Maria Landeborn, stock market strategist at Danske Bank.", "title_original": "Bolånen viker – här är bankernas nya vinstmotor", "summary_original": "Storbankerna tjänar just nu mindre på kundernas bolån. Det tar de igen på sparandet. – Sparandet verkar vara en vinstmotor för bankerna för tillfället, säger Maria Landeborn, börsstrateg på Danske Bank.", "link": "https://www.hd.se/ekonomi/bolanen-viker-har-ar-bankernas-nya-vinstmotor/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:18:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 51, "title": "Mortgages are declining – this is the banks' new profit engine", "summary": "The big banks are currently earning less from customers' mortgages. They take that back on the savings. - Savings seem to be a profit engine for the banks at the moment, says Maria Landeborn, stock market strategist at Danske Bank.", "title_original": "Bolånen viker – här är bankernas nya vinstmotor", "summary_original": "Storbankerna tjänar just nu mindre på kundernas bolån. Det tar de igen på sparandet. – Sparandet verkar vara en vinstmotor för bankerna för tillfället, säger Maria Landeborn, börsstrateg på Danske Bank.", "link": "https://www.svd.se/a/43W2yg/bolanen-viker-har-ar-bankernas-nya-vinstmotor", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:16:08+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 52, "title": "A final death knell for the Tidö government?", "summary": "When the government now tightens migration policy further, it continues on a political course that has taken Sweden away from the ideals that shaped the country. At the same time, public opinion points to dissatisfaction with the project.", "title_original": "Ett sista dödsryck för Tidöregeringen?", "summary_original": "När regeringen nu stramar åt migrationspolitiken ytterligare fortsätter den på en politisk kurs som fört Sverige bort från de ideal som format landet. Samtidigt pekar opinionen på missnöje med projektet.", "link": "https://www.hd.se/opinion/ledare/ett-sista-dodsryck-for-tidoregeringen/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 53, "title": "Now the security guards in Lund wear body cameras", "summary": "A press of a button and a display showing that recording is in progress lights up - now the security guards in Lund city wear body cameras. The tool creates security in threatening situations according to guard Stefan Andreasson. - People who get drunk know that it doesn't turn out so well to threaten and harass us, he says.", "title_original": "Nu bär ordningsvakterna i Lund kroppskameror", "summary_original": "Ett tryck på en knapp och en display som visar att inspelning pågår tänds – nu bär ordningsvakterna i Lund city kroppskameror. Verktyget skapar trygghet i hotfulla situationer enligt vakten Stefan Andreasson. – Folk som berusat sig vet att det inte blir så bra att hota och trakassera oss, säger han.", "link": "https://www.sydsvenskan.se/lund/nu-bar-ordningsvakterna-i-lund-kroppskameror/", "date_display": "2026-07-19", "date_iso": "2026-07-19T06:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 54, "title": "The Tate brothers arrested in the US - requested to be extradited", "summary": "Controversial influencer Andrew Tate and his brother Tristan Tate have been arrested by federal authorities in Miami, USA, on Saturday. British authorities have requested the brothers be extradited for, among other things, suspected human trafficking.", "title_original": "Tatebröderna gripna i USA – begärs utlämnade", "summary_original": "Den kontroversielle influeraren Andrew Tate och hans bror Tristan Tate har gripits av federala myndigheter i Miami, USA, på lördagen. Brittiska myndigheter har begärt bröderna utlämnade för bland annat misstänkt människohandel.", "link": "https://www.hd.se/varlden/tatebroderna-gripna-i-usa-begars-utlamnade/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:58:11+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 55, "title": "The Tate brothers arrested in the US - requested to be extradited", "summary": "Controversial influencer Andrew Tate and his brother Tristan Tate have been arrested by federal authorities in Miami, USA, on Saturday. British authorities have requested the brothers be extradited for, among other things, suspected human trafficking.", "title_original": "Tatebröderna gripna i USA – begärs utlämnade", "summary_original": "Den kontroversielle influeraren Andrew Tate och hans bror Tristan Tate har gripits av federala myndigheter i Miami, USA, på lördagen. Brittiska myndigheter har begärt bröderna utlämnade för bland annat misstänkt människohandel.", "link": "https://www.sydsvenskan.se/varlden/tatebroderna-gripna-i-usa-begars-utlamnade/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:58:11+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 56, "title": "The Tate brothers arrested in the US - can be extradited", "summary": "Controversial influencer brothers Andrew and Tristan Tate were arrested in Miami on Saturday on new criminal charges. Now they are requested to be extradited to Great Britain, where they have previously been charged with a series of serious crimes.", "title_original": "Bröderna Tate gripna i USA – kan utlämnas", "summary_original": "De kontroversiella influencerbröderna Andrew och Tristan Tate har gripits i Miami på lördagen efter nya brottsmisstankar. Nu begärs de utlämnade till Storbritannien, där de sedan tidigare åtalats för en rad grova brott.", "link": "https://www.svd.se/a/zOxmab/andrew-tate-och-tristan-tate-gripna-i-usa-kan-utlamnas", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:53:11+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 57, "title": "Break for the firefighters in Drammen: \"Favorable weather\"", "summary": "The firefighters in Norwegian Drammen did not have to go out during the night to Sunday. Only surveillance work has been going on – the cool, damp weather has been helpful.", "title_original": "Paus för brandmännen i Drammen: ”Gynnsamt väder”", "summary_original": "Brandmännen i norska Drammen har inte behövt rycka ut under natten till söndagen. Endast bevakningsarbete har pågått – det svala, fuktiga vädret har varit till hjälp.", "link": "https://www.hd.se/varlden/paus-for-brandmannen-i-drammen-gynnsamt-vader/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:50:28+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 58, "title": "Break for the firefighters in Drammen: \"Favorable weather\"", "summary": "The firefighters in Norwegian Drammen did not have to go out during the night to Sunday. Only surveillance work has been going on – the cool, damp weather has been helpful.", "title_original": "Paus för brandmännen i Drammen: ”Gynnsamt väder”", "summary_original": "Brandmännen i norska Drammen har inte behövt rycka ut under natten till söndagen. Endast bevakningsarbete har pågått – det svala, fuktiga vädret har varit till hjälp.", "link": "https://www.sydsvenskan.se/varlden/paus-for-brandmannen-i-drammen-gynnsamt-vader/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:50:28+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 59, "title": "Break for the firefighters in Drammen: \"Favorable weather\"", "summary": "The firefighters in Norwegian Drammen did not have to go out during the night to Sunday. Only surveillance work has been going on – the cool, damp weather has been helpful.", "title_original": "Paus för brandmännen i Drammen: ”Gynnsamt väder”", "summary_original": "Brandmännen i norska Drammen har inte behövt rycka ut under natten till söndagen. Endast bevakningsarbete har pågått – det svala, fuktiga vädret har varit till hjälp.", "link": "https://www.svd.se/a/k0dklj/paus-for-brandmannen-i-drammen-gynnsamt-vader", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:41:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 60, "title": "Mbappé historic - best of all time", "summary": "Despite losing to England in the bronze medal match in the World Cup, France's fixed star Kylian Mbappé was able to score two goals and write himself into the history books. - I would have preferred not to be the main scorer and instead play tomorrow's match, says Mbappé according to AFP.", "title_original": "Mbappé historisk – bäst genom tiderna", "summary_original": "Trots förlust mot England i bronsmatchen i fotbolls-VM kunde Frankrikes fixstjärna Kylian Mbappé göra två mål och skriva in sig i historieböckerna. – Jag hade föredragit att inte vara den främste målskytten och i stället spela morgondagens match, säger Mbappé enligt AFP.", "link": "https://www.hd.se/sport/mbappe-historisk-bast-genom-tiderna/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:38:10+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 61, "title": "Jessica: What's worse – being fat or old?", "summary": "How do you deal with people who mistake excess weight for a baby on the way? Anything but heartburn. Who doesn't want to look fertile at age 55?", "title_original": "Jessica: Vad är värst – vara tjock eller gammal?", "summary_original": "Hur bemöter man människor som misstar övervikt för bebis på väg? Allt annat än magsurt. Vem vill inte verka fertil i 55-årsåldern?", "link": "https://www.dn.se/kultur/jessica-vad-ar-varst-vara-tjock-eller-gammal/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 62, "title": "Suspected attempted murder in Hässelby", "summary": "", "title_original": "Misstänkt mordförsök i Hässelby", "summary_original": "", "link": "https://www.svd.se/a/gk48o5/misstankt-mordforsok-i-hasselby", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:25:24+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 63, "title": "Man abused at campsite", "summary": "A man in his twenties was beaten during the night of Sunday at a campsite in Båstad.", "title_original": "Man misshandlad på campingplats", "summary_original": "En man i tjugoårsåldern blev under natten till söndagen misshandlad på en campingplats i Båstad.", "link": "https://www.hd.se/bastad/man-misshandlad-pa-campingplats/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:22:59+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "England take WC bronze after crazy match", "summary": "England takes bronze in the soccer World Cup after 6–4 against France in a goal-rich and dramatic bronze match, to say the least. It is the country's second WC medal ever. - It was a crazy match, says England's hat-trick scorer Bukayo Saka.", "title_original": "England tar VM-brons efter galen match", "summary_original": "England tar brons i fotbolls-VM efter 6–4 mot Frankrike i en minst sagt målrik och dramatisk bronsmatch. Det är landets andra VM-medalj någonsin. – Det var en galen match, säger Englands hattrickskytt Bukayo Saka.", "link": "https://www.sydsvenskan.se/sport/chocken-kane-och-bellingham-bankas-i-bronsmatchen/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:20:15+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 65, "title": "Mina Asp Romefors: Ruth Kvarnström-Jones holds a love letter to Stockholm that lacks saltiness", "summary": "All roads have always led to Sweden for the writer Ruth Kvarnström-Jones, who spends her Summer in P1 explaining her love for Stockholm. DN's Mina Asp Romefors has listened.", "title_original": "Mina Asp Romefors: Ruth Kvarnström-Jones håller ett kärleksbrev till Stockholm som saknar sälta", "summary_original": "Alla vägar har alltid lett till Sverige för författaren Ruth Kvarnström-Jones som ägnar sitt Sommar i P1 åt att förklara sin kärlek till Stockholm. DN:s Mina Asp Romefors har lyssnat.", "link": "https://www.dn.se/kultur/mina-asp-romefors-ruth-kvarnstrom-jones-haller-ett-karleksbrev-till-stockholm-som-saknar-salta/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:14:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 66, "title": "Mbappé historic - best of all time", "summary": "Despite losing to England in the bronze medal match in the World Cup, France's fixed star Kylian Mbappé was able to score two goals and write himself into the history books. - I would have preferred not to be the main scorer and instead play tomorrow's match, says Mbappé according to AFP.", "title_original": "Mbappé historisk – bäst genom tiderna", "summary_original": "Trots förlust mot England i bronsmatchen i fotbolls-VM kunde Frankrikes fixstjärna Kylian Mbappé göra två mål och skriva in sig i historieböckerna. – Jag hade föredragit att inte vara den främste målskytten och i stället spela morgondagens match, säger Mbappé enligt AFP.", "link": "https://www.sydsvenskan.se/sport/mbappe-historisk-bast-genom-tiderna/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:09:12+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 67, "title": "Storm protection is strengthened – AI and the dreaded insect in focus", "summary": "Close to 11 million cubic meters of forest were consumed when storm Johannes and snowstorm Anna swept across northern and central Sweden at the end of last year. Many storm-felled trees still remain in the forest. The Norwegian Forestry Agency is now investing in several measures to improve work ahead of future storms.", "title_original": "Stormskyddet stärks – AI och fruktad insekt i fokus", "summary_original": "Närmare 11 miljoner kubikmeter skog gick åt när stormen Johannes och snöovädret Anna drog fram över norra och mellersta Sverige i slutet av förra året. Många stormfällda träd ligger fortfarande kvar i skogen. Nu satsar Skogsstyrelsen på flera åtgärder för att förbättra arbetet inför kommande stormar.", "link": "https://www.sydsvenskan.se/sverige/stormskyddet-starks-ai-och-fruktad-insekt-i-fokus/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:08:48+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 68, "title": "Storm protection is strengthened – AI and the dreaded insect in focus", "summary": "Close to 11 million cubic meters of forest were consumed when storm Johannes and snowstorm Anna swept across northern and central Sweden at the end of last year. Many storm-felled trees still remain in the forest. The Norwegian Forestry Agency is now investing in several measures to improve work ahead of future storms.", "title_original": "Stormskyddet stärks – AI och fruktad insekt i fokus", "summary_original": "Närmare 11 miljoner kubikmeter skog gick åt när stormen Johannes och snöovädret Anna drog fram över norra och mellersta Sverige i slutet av förra året. Många stormfällda träd ligger fortfarande kvar i skogen. Nu satsar Skogsstyrelsen på flera åtgärder för att förbättra arbetet inför kommande stormar.", "link": "https://www.hd.se/sverige/stormskyddet-starks-ai-och-fruktad-insekt-i-fokus/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:08:30+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "Mr and Mrs Kullgren fight over the meat - to storm against \"forced vegetarian lunches\"", "summary": "They are called \"meat extremists\". Minister of Rural Affairs Peter Kullgren (KD) and his wife Sarah Kullgren, chairman of KD Kvinnor, have taken up the fight against all-vegetarian days in the country's school cafeterias. - If you want to eat only vegetables, do so. But don't force me and my children, says Peter Kullgren.", "title_original": "Herr och fru Kullgren strider om köttet – till storms mot ”tvångsvegetariska luncher”", "summary_original": "De kallas ”köttextremister”. Landsbygdsminister Peter Kullgren (KD) och hans fru Sarah Kullgren, ordförande för KD Kvinnor, har tagit strid mot helvegetariska dagar i landets skolmatsalar. – Vill du äta bara grönsaker, gör det. Men tvinga inte mig och mina barn, säger Peter Kullgren.", "link": "https://www.dn.se/sverige/herr-och-fru-kullgren-strider-om-kottet-till-storms-mot-tvangsvegetariska-luncher/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:01:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "Two top chefs, one peninsula: \"Great spirit of innovation here\"", "summary": "The Bjäre Peninsula – the new food destination. At the helm are two of Sweden's most celebrated Michelin chefs – Titti Qvarnström and Magnus Nilsson. With their newly started restaurants, Allium and Furuhem, they put Bjäre on the gastronomic map. HD brought the chefs together for a live interview in Båstad.", "title_original": "Två toppkockar, en halvö: ”Stor innovationsanda här”", "summary_original": "Bjärehalvön – den nya matdestinationen. I spetsen står två av Sveriges mest hyllade Michelinkockar – Titti Qvarnström och Magnus Nilsson. Med sina nystartade restauranger, Allium och Furuhem, sätter de Bjäre på den gastronomiska kartan. HD sammanförde kockarna för en live-intervju i Båstad.", "link": "https://www.hd.se/bastad/tva-toppkockar-en-halvo-stor-innovationsanda-har/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "Therefore, I let astrology decide my home purchase", "summary": "Almost every second Swedish young woman believes in astrology. Social media and AI have turned a millennial doctrine into a growing billion-dollar industry.\nWhy are so many attracted to looking for answers in the stars? Elinor Strand embarks on a journey that has unforeseen consequences.", "title_original": "Därför lät jag astrologin bestämma över mitt bostadsköp", "summary_original": "Nästan varannan svensk ung kvinna tror på astrologi. Sociala medier och AI har förvandlat en tusenårig lära till en växande miljardindustri.\nVarför lockas så många att söka svar i stjärnorna? Elinor Strand ger sig ut på en resa som får oanade konsekvenser.", "link": "https://www.sydsvenskan.se/kultur/darfor-lat-jag-astrologin-bestamma-over-mitt-bostadskop/", "date_display": "2026-07-19", "date_iso": "2026-07-19T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 72, "title": "Samuel Levander: The World Cup has been a sad spectacle and a hell of a party", "summary": "Tonight, the biggest soccer World Cup of all time comes to an end, with the final in New Jersey. DN's Samuel Levander writes about the championship and the party that traveled the world. And in the middle of the carnival, a jester could be crowned king.", "title_original": "Samuel Levander: Fotbolls-VM har varit ett sorgligt spektakel och en sjuhelvetes fest", "summary_original": "Ikväll går tidernas största fotbolls-VM i mål, med final i New Jersey. DN:s Samuel Levander skriver om mästerskapet och festen som färdades världen över. Och mitt i karnevalen kunde en narr krönas till kung.", "link": "https://www.dn.se/kultur/samuel-levander-fotbolls-vm-har-varit-ett-sorgligt-spektakel-och-en-sjuhelvetes-fest/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:40:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "After Kristersson, M must get out of the Sweden Democratic quagmire", "summary": "Christian Sonesson (M), chairman of the municipal board in Staffanstorp.", "title_original": "Efter Kristersson måste M ta sig ur den sverigedemokratiska sumpmarken", "summary_original": "Christian Sonesson (M), kommunstyrelsens ordförande i Staffanstorp.", "link": "https://www.sydsvenskan.se/opinion/ledare/efter-kristersson-maste-m-ta-sig-ur-den-sverigedemokratiska-sumpmarken/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:35:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "The best Stockholm tips 19 July: Football, Fogelström and free fall", "summary": "Here you will find today's highlights from DN's calendar, selected by Vera von Otter. And here is the full calendar.", "title_original": "De bästa Stockholmstipsen 19 juli: Fotboll, Fogelström och fritt fall", "summary_original": "Här hittar du dagens höjdpunkter ur DN:s kalendarium, valda av Vera von Otter. Och här är hela kalendariet.", "link": "https://www.dn.se/kultur/de-basta-stockholmstipsen-19-juli-fotboll-fogelstrom-och-fritt-fall/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Poet Dania, 16: \"I didn't know I was a blatte until someone said it\"", "summary": "She was discovered reading poetry from the heart. Dania Aziz, 16, turned messy schooling into good grades - through a special tool. Now the hope will spread further in the school yard.", "title_original": "Poeten Dania, 16: ”Jag visste inte att jag var en blatte förrän någon sa det”", "summary_original": "Hon upptäcktes när hon läste poesi från hjärtat. Dania Aziz, 16, vände stökig skolgång till goda betyg – genom ett särskilt redskap. Nu ska hoppet spridas vidare på skolgården.", "link": "https://www.hd.se/sport/poeten-dania-16-jag-visste-inte-att-jag-var-en-blatte-forran-nagon-sa-det/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Mbappé: \"Shocked, understand that some say it was a joke\"", "summary": "France went out against Spain in the semi-finals and faced England on Saturday night in the bronze medal match in the World Cup. Then \"Les Bleus\" stood for a disastrous first half and were 0-4 behind after 45 minutes of play. In the second half, France was close to a sensational recovery, but fell by tennis numbers, 4-6, in Miami. The French media go hard on the French national team's first half. \"A terrible first half for Les Bleus, outclassed by England. Deschamps' (Didier, national team captain) revamped defense leaked goals, while the attack was equally uninspired. A sad end for Didier Deschamps,\" wrote RMC at half-time. French newspaper L'Equipe also expresses criticism. \"A humiliation,\" wrote the paper after 45 minutes of play and continued: \"France's collapse was complete in the first half.\" L'Equipe further believes that it was a \"tactical disaster\" in the first act. French star Kylian Mbappé, who scored two goals in the second half of the bronze medal match, understands the criticism. \"Unfortunately, we were totally shocked\" - There were two different halves. From the first half, I can understand that some say it was a joke and that we didn't respect the shirt. I would rather say we were human. Unfortunately, we were totally shocked and it was a wake-up call, says Mbappé according to RMC Sport and continues: - In the second half, we played at the top level again. We were mental machines that put all emotions aside. We won the second half, but in the end we didn't win (the game). It's sad for the coach (Didier Deschamps). Mbappé suffers with Deschamps claiming that there was a heavy loss in the World Cup final. - We wanted to do something for him, but unfortunately the first half gave the impression that we let him down. It wasn't how we wanted it, but that's football. We want to thank the coach for everything he has done and this match does not tarnish the legend of Didier Deschamps. Didier Deschamps is now stepping down from his post after the championship. Deschamps' greatest moment as national team captain is the World Cup gold", "title_original": "Mbappé: \"Chockade, förstår att vissa säger att det var ett skämt\"", "summary_original": "Frankrike åkte ut mot Spanien i semifinal och ställdes under lördagskvällen mot England i bronsmatchen i VM. Då stod ”Les Bleus” för en katastrofal första halvlek och var i underläge med 0-4 efter 45 minuters spel. I andra halvlek var Frankrike nära en sanslös upphämtning, men föll med tennissiffror, 4-6, i Miami. Franska medier går hårt åt det franska landslagets första halvlek. ”En fruktansvärd första halvlek för Les Bleus, utklassat av England. Deschamps (Didier, förbundskapten) ombyggda försvar läckte in mål, medan anfallet var lika oinspirerat. Ett sorgligt slut för Didier Deschamps”, skrev RMC i halvtid. Franska tidningen L'Equipe uttrycker också kritik. ”En förödmjukelse”, skrev tidningen efter 45 minuters spel och fortsatte: ”Frankrikes kollaps var fullständig i den första halvleken”. L'Equipe menar vidare att det var en ”taktisk katastrof” i första akten. Franske stjärnan Kylian Mbappé, som gjorde två mål i andra halvan av bronsmatchen, har förståelse för kritiken. ”Tyvärr var vi totalt chockade” – Det var två olika halvlekar. Utifrån första halvlek kan jag förstå att vissa säger att det var ett skämt och att vi inte respekterade tröjan. Jag skulle snarare säga att vi var mänskliga. Tyvärr var vi totalt chockade och det var en väckarklocka, säger Mbappé enligt RMC Sport och fortsätter: – I andra halvlek spelade vi på toppnivå igen. Vi var mentala maskiner som satte alla känslor åt sidan. Vi vann andra halvlek, men i slutändan vann vi inte (matchen). Det är tråkigt för tränaren (Didier Deschamps). Mbappé lider med Deschamps gällande att det blev en tung förlust i VM-avslutningen. – Vi ville göra något för honom, men tyvärr gav första halvlek ett intryck av att vi svek honom. Det var inte så vi ville ha det, men sådan är fotbollen. Vi vill tacka tränaren för allt han har gjort och den här matchen fläckar inte ner legenden om Didier Deschamps. Didier Deschamps kliver nu av sitt uppdrag efter mästerskapet. Deschamps största stund som förbundskapten är VM-guldet i Ryssland under sommaren 2018. Han tog över landslaget redan under 2012 och ledde även \"Les Bleus\" till VM-final under 2022, då det blev förlust mot Argentina efter ett straffdrama. Utifrån samstämmiga uppgifter väntas legendaren Zinedine Zidane ta över som ny förbundskapten för det franska landslaget.", "link": "https://www.tv4.se/artikel/5sERFA0kOb59S554tYng77/chockade-foerstar-att-vissa-saeger-att-det-var-ett-skaemt", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:27:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotbolls-vm-2026", "/fotboll"]}, {"id": 77, "title": "Leader: Why care about Alaskan pollock when Russia executes prisoners of war?", "summary": "Ukrainians are bombed and prisoners of war are executed - but the EU countries are unable to agree on a boycott of Russian Alaskan pollock. They must prioritize the fight against the Kremlin over getting caught up in their own vested interests.", "title_original": "Ledare: Varför bry sig om alaska pollock när Ryssland avrättar krigsfångar?", "summary_original": "Ukrainare bombas och krigsfångar avrättas – men EU-länderna klarar inte att enas om bojkott av rysk alaska pollock. De måste prioritera kampen mot Kreml framför att fastna i sina egna särintressen.", "link": "https://www.dn.se/ledare/varfor-bry-sig-om-alaska-pollock-nar-ryssland-avrattar-krigsfangar/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:26:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Tate Brothers Arrested - Can Be Extradited", "summary": "", "title_original": "Bröderna Tate gripna – kan utlämnas", "summary_original": "", "link": "https://www.svd.se/a/e7OjV4/broderna-tate-gripna-kan-utlamnas", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:23:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tag "2026-07-19", "date_iso": "2026-07-19T04:15:18+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 82, "title": "Storm protection is strengthened – AI and the dreaded insect in focus", "summary": "Close to 11 million cubic meters of forest were consumed when storm Johannes and snowstorm Anna swept across northern and central Sweden at the end of last year. Many storm-felled trees still remain in the forest. The Norwegian Forestry Agency is now investing in several measures to improve work ahead of future storms.", "title_original": "Stormskyddet stärks – AI och fruktad insekt i fokus", "summary_original": "Närmare 11 miljoner kubikmeter skog gick åt när stormen Johannes och snöovädret Anna drog fram över norra och mellersta Sverige i slutet av förra året. Många stormfällda träd ligger fortfarande kvar i skogen. Nu satsar Skogsstyrelsen på flera åtgärder för att förbättra arbetet inför kommande stormar.", "link": "https://www.svd.se/a/ExvGV5/stormskyddet-starks-ai-och-fruktad-insekt-i-fokus", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:15:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 83, "title": "Voice fishing among buggers, raggers and caravans", "summary": "When music, caravans and raggar trucks take over Malung, politicians scramble to reach the hot target group – the dance band voters. The election strategy: to show its popular side.", "title_original": "Röstfiske bland buggare, raggare och husvagnar", "summary_original": "När musik, husvagnar och raggarbilar tar över Malung trängs politiker för att nå den heta målgruppen – dansbandsväljarna. Valstrategin: att visa sin folkliga sida.", "link": "https://www.svd.se/a/zOx3Vb/rostfiske-bland-buggare-raggare-och-husvagnar", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:14:50+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 84, "title": "England take WC bronze after crazy match", "summary": "England takes bronze in the soccer World Cup after 6–4 against France in a goal-rich and dramatic bronze match, to say the least. It is the country's second WC medal ever. - It was a crazy match, says England's hat-trick scorer Bukayo Saka.", "title_original": "England tar VM-brons efter galen match", "summary_original": "England tar brons i fotbolls-VM efter 6–4 mot Frankrike i en minst sagt målrik och dramatisk bronsmatch. Det är landets andra VM-medalj någonsin. – Det var en galen match, säger Englands hattrickskytt Bukayo Saka.", "link": "https://www.svd.se/a/zOxmqO/england-tar-vm-brons-efter-galen-match", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:06:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 85, "title": "Houses in Svalöv went for 2.8 million", "summary": "", "title_original": "Hus i Svalöv gick för 2,8 miljoner", "summary_original": "", "link": "https://www.hd.se/svalov/hus-i-svalov-gick-for-28-miljoner/", "date_display": "2026-07-19", "date_iso": "2026-07-19T04:05:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "\"The debate is about more than the wolf.\"", "summary": "The question is how Sweden creates long-term conditions for there to be grazing animals throughout the country, write representatives of farmers and landowners.", "title_original": "”Debatten handlar om mer än vargen.”", "summary_original": "Frågan är hur Sverige skapar långsiktiga förutsättningar för att det ska finnas betesdjur i hela landet, skriver företrädare för lantbrukare och markägare.", "link": "https://www.sydsvenskan.se/opinion/debatten-handlar-om-mer-an-vargen/", "date_display": "2026-07-19", "date_iso": "2026-07-1  guerrilla Farc, formerly closely associated with the production, that is behind it, but armed groups with other motives. - Now we are dealing with groups that are primarily driven by financial interests, says Nora Taquanas, leader of a community of indigenous Colombians.", "title_original": "Trots avtal – Colombias knark har trefaldigats", "summary_original": "Colombias kokainproduktion har på tio år trefaldigats. Men det är inte längre vänstergerillan Farc, tidigare nära förknippad med produktionen, som ligger bakom, utan väpnade grupper med andra motiv. – Nu har vi att göra med grupper som främst drivs av ekonomiska intressen, säger Nora Taquanas, ledare för ett samhälle med ursprungscolombianer.", "link": "https://www.svd.se/a/n10zEB/trots-avtal-colombias-knark-har-trefaldigats", "date_display": "2026-07-19", "date_iso": "2026-07-19T03:50:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 90, "title": "Marcus Berggren: In Trelleborg, no one notices that I forgot my swimming trunks", "summary": "For the second summer in a row, comedian and writer Marcus Berggren heads to places where no one he knows has spent their hard-earned vacation. When he visits Trelleborg, he understands why.", "title_original": "Marcus Berggren: I Trelleborg märker ingen att jag glömt badbyxorna", "summary_original": "För andra sommaren i rad beger sig komikern och författaren Marcus Berggren till platser där ingen han känner har lagt sin surt förvärvade semester. När han besöker Trelleborg förstår han varför.", "link": "https://www.dn.se/kultur/marcus-berggren-i-trelleborg-marker-ingen-att-jag-glomt-badbyxorna/", "date_display": "2026-07-19", "date_iso": "2026-07-19T03:46:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 91, "title": "100 square meter house in Ekeby sold", "summary": "", "title_original": "100 kvadratmeter o": "2026-07-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "He wants the Church of Sweden to be able to act against questionable business", "summary": "The sale of John's church warning example in motion to the church meeting.", "title_original": "Han vill att Svenska kyrkan ska kunna agera mot tveksamma affärer", "summary_original": "Försäljningen av Johannes kyrka varnande exempel i motion till kyrkomötet.", "link": "https://www.dagen.se/nyheter/han-vill-att-svenska-kyrkan-ska-kunna-agera-mot-tveksamma-affaerer/10442582", "date_display": "2026-07-19", "date_iso": "2026-07-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "The churches in Drammen stand up for those affected after the fire", "summary": "The churches in Drammen work side by side with other aid organizations.", "title_original": "Kyrkorna i Drammen ställer upp för de drabbade efter branden", "summary_original": "Kyrkorna i Drammen arbetar sida vid sida med övriga hjälporganisationer.", "link": "https://www.dagen.se/nyheter/kyrkorna-i-drammen-staeller-upp-foer-de-drabbade-efter-branden/10446679", "date_display": "2026-07-19", "date_iso": "2026-07-19T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "The Tate brothers arrested in the United States", "summary": "In May last year, Andrew and Tristan Tate, who are both British and American citizens, were charged in the UK with 21 charges, including rape, human trafficking and assault. According to the prosecutors, the suspected crimes must have taken place between July 2010 and August 2017. The brothers have also been investigated for crimes in Romania, where they previously resided. In 2022, those suspected of rape, trafficking in minors, money laundering and human trafficking were arrested in the country and put under house arrest. They denied the charges and the charges were later dropped due to legal and procedural irregularities, according to the AP.", "title_original": "Tatebröderna gripna i USA", "summary_original": "I maj förra året åtalades Andrew och Tristan Tate, som är både brittiska och amerikanska medborgare, i Storbritannien misstänkta på 21 punkter, däribland våldtäkt, människohandel och misshandel. De misstänkta brotten ska ha skett mellan juli 2010 och augusti 2017 enligt åklagarna. Bröderna har även utretts för brott i Rumänien, där de tidigare var bosatta. 2022 greps de i landet misstänkta för våldtäkt, handel med minderåriga, penningtvätt och människohandel och sattes i husarrest. De nekade till anklagelserna och åtalet lades senare ned på grund av rättsliga och processuella oegentligheter, enligt AP.", "link": "https://www.tv4.se/artikel/tt-260719-andrewtate1-0ccee166/tatebroderna-gripna-i-usa-begars-utlamnade", "date_display": "2026-07-18", "date_iso": "2026-07-18T23:51:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/sport", "/usa", "/brott", "/storbritannien", "/konst", "/kultur", "/rumanien", "/andrew-tate"]}, {"id": 98, "title": "England take WC bronze after crazy match", "summary": "England takes bronze in the soccer World Cup after 6–4 against France in a goal-rich and dramatic bronze match, to say the least. It is the country's second WC medal ever.", "title_original": "England tar VM-brons efter galen match", "summary_original": "England tar brons i fotbolls-VM efter 6–4 mot Frankrike i en minst sagt målrik och dramatisk bronsmatch. Det är landets andra VM-medalj någonsin.", "link": "https://www.dn.se/sport/england-tar-vm-brons-efter-galen-match/", "date_display": "2026-07-18", "date_iso": "2026-07-18T23:30:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 99, "title": "Volunteers are wanted for the new Ebola vaccine", "summary": "Oxford University in England has now begun recruiting volunteers to test a new vaccine against the bundibugyo variant of Ebola, which is driving the current outbreak in Congo-Kinshasa. The vaccine is based on the same platform as the Oxford/Astra Zeneca covid-19 vaccine, which according to the university saved at least six million lives.", "title_original": "Frivilliga sökes för nya ebolavaccinet", "summary_original": "Oxford University i England har nu börjat rekrytera frivilliga för att testa ett nytt vaccin mot bundibugyo-varianten av ebola, som driver det aktuella utbrottet i Kongo-Kinshasa. Vaccinet bygger på samma plattform som Oxford/Astra Zenecas covid-19-vaccin, som enligt universitetet räddade minst sex miljoner liv.", "link": "https://www.svd.se/a/wrxWj4/ebolavaccin-ska-testas-pa-manniskor", "date_display": "2026-07-18", "date_iso": "2026-07-18T23:04:50+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 100, "title": "Ukraine: The biggest robot attack of the war against Kyiv", "summary": "Russia carried out a huge robot attack on Kiev on Sunday night - the largest so far during the war, according to Foreign Minister Andriy Sybiha.", "title_original": "Ukraina: Krigets största robotattack mot Kiev", "summary_original": "Ryssland utförde en jättelik robotattack mot Kiev natten till söndagen – den största hittills under kriget, enligt utrikesminister Andrij Sybiha.", "link": "https://www.svd.se/a/7pB2AV/nattliga-explosioner-i-kiev", "date_display": "2026-07-18", "date_iso": "2026-07-18T22:58:35+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 101, "title": "US and Iran in new attacks: \"Swift punishment\"", "summary": "The US has carried out a new wave of airstrikes against Iran - which in turn claims to have responded with \"kamikaze drones\". The countries have now directed attacks against each other for eight nights in a row.", "title_original": "USA och Iran i nya anfall: ”Snabbt straff”", "summary_original": "USA har genomfört en ny våg av luftattacker mot Iran – som i sin tur säger sig ha svarat med ”kamikazedrönare”. Länderna har nu riktat anfall mot varandra under åtta nätter i rad.", "link": "https://www.svd.se/a/Wv8rA2/nya-amerikanska-attacker-mot-iran", "date_display": "2026-07-18", "date_iso": "2026-07-18T22:39:37+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 102, "title": "US and Iran in new attacks: \"Swift punishment\"", "summary": "\"The attacks are aimed at further weakening Iran's ability to threaten commercial shipping in the Strait of Hormuz and to quickly punish the Revolutionary Guard forces that last night carried out attacks against American soldiers in Jordan,\" the US military command Centcom wrote on X shortly after midnight. Earlier this weekend, the US said two US soldiers had been killed - the first since fighting resumed on July 7 - and that a third American was missing following \"Iranian robotic and drone attacks\" on Jordan. Explosions in several places The Iranian regime-linked news agencies Fars and Tasnim report during the night to Sunday about American attacks on the city of Sirik, located on the Strait of Hormuz in southern Iran. Explosions have also been heard in, among other places, Bandar Abbas, a city that has been repeatedly attacked in the past week. Shortly before 06:00, Swedish time, the US military announced that the night's wave of attacks was over - and that it attacked forces belonging to the Revolutionary Guard \"who carried out attacks against American soldiers in Jordan\". Iran claims – for its part – to have targeted two American bases in Kuwait during the night. In a statement on state television, the military said it carried out \"large-scale attacks with kamikaze drones against the US military's ammunition depot at Camp Udairi, as well as against the Patriot radar system and air surveillance radar at the Ali Al Salem air base in Kuwait.\" Iran: Trump's signature worthless Iran's supreme leader Mojtaba Khamenei threatened on Saturday with \"unforgettable attacks\" if the US does not stop its repeated attacks. He also called - via proxy - US President Donald Trump's signature \"worthless\". A few hours before Khamenei's statement, the country's Deputy Foreign Minister Kazem Gharibabadi announced that Iran is no longer applying the memorandum of understanding reached between the US and Iran a month ago. According to AP, a total of 16 American soldiers have lost their lives since the war started in February.", "title_original": "USA och Iran i nya anfall: ”Snabbt straff”", "summary_original": "”Angreppen syftar till att ytterligare försvaga Irans förmåga att hota den kommersiella sjöfarten i Hormuzsundet och att snabbt straffa de styrkor inom Revolutionsgardet som i går kväll genomförde attacker mot amerikanska soldater i Jordanien”, skrev det amerikanska militärkommandot Centcom på X strax efter midnatt. Tidigare i helgen gick USA ut med att två amerikanska soldater hade dödats – de första sedan stridigheterna återupptogs den 7 juli – och att en tredje amerikan saknades efter ”iranska robot- och drönarattacker” mot Jordanien. Smällar på flera platser De iranska regimkopplade nyhetsbyråerna Fars och Tasnim rapporterar under natten mot söndagen om amerikanska attacker mot staden Sirik, belägen vid Hormuzsundet i södra Iran. Smällar har även hörts i bland annat Bandar Abbas, en stad som återkommande attackerats den gångna veckan. Strax före klockan 06, svensk tid, meddelade USA:s militär att nattens anfallsvåg var över – och att den anfallit styrkor tillhörande Revolutionsgardet ”som genomförde attacker mot amerikanska soldater i Jordanien”. Iran säger sig – å sin sida – ha riktat attacker mot två amerikanska baser i Kuwait under natten. I ett uttalande i statlig tv uppger militären att den genomfört ”storskaliga attacker med kamikazedrönare mot den amerikanska militärens ammunitionsdepå vid Camp Udairi samt mot Patriot-radarsystemet och luftövervakningsradarn på Ali Al Salem-flygbasen i Kuwait”. Iran: Trumps signatur värdelös Irans högste ledare Mojtaba Khamenei hotade under lördagen med ”oförglömliga attacker” om USA inte upphör med sina återkommande anfall. Han kallade också – via ombud – USA:s president Donald Trumps signatur för ”värdelös\". Några timmar före Khameneis uttalande tillkännagav landets vice utrikesminister Kazem Gharibabadi att Iran inte längre tillämpar det samförståndsavtal som slöts mellan USA och Iran för en månad sedan. Totalt 16 amerikanska soldater har enligt AP mist livet sedan kriget startade i februari.", "link": "https://www.tv4.se/artikel/tt-260719-iranoro1-0dda6166/amerikanska-attacker-mot-iran-snabbt-straff", "date_display": "2026-07-18", "date_iso": "2026-07-18T22:39:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Irankriget", "/irankriget", "/utrikes", "/usa", "/krig", "/donald-trump", "/iran", "/jordanien"]}, {"id": 103, "title": "Warning for heavy rain in northern Skåne during Sunday", "summary": "SMHI has issued a yellow warning for torrential rain and thunder.", "title_original": "Varning för kraftigt regn i norra Skåne under söndagen", "summary_original": "SMHI har gått ut med gul varning om skyfallsliknande regn och åska.", "link": "https://www.hd.se/skane/varning-for-kraftigt-regn-i-norra-skane-under-sondagen/", "date_display": "2026-07-18", "date_iso": "2026-07-18T21:23:20+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "The storm is moving south - several new yellow warnings", "summary": "The yellow warning for torrential rain on Sunday affects an area from Halmstad in the west, across Småland and up to Kalmar and Öland. The warning applies from 1pm on the mainland and 3pm on Öland. Even before Monday, there is a yellow warning for rain in south-eastern Götaland and on Öland. The rain is expected to move in on Sunday afternoon and then last through the evening and night and into the morning or early morning on Monday. SMHI warns that roads and viaducts as well as basements and stormwater systems may be flooded. Before Saturday, SMHI had issued an orange warning for inner and eastern Östergötland. Large amounts of rain and thunder were expected - and the forecast turned out to be correct.  - There have been very interesting things meteorologically. Several tornadoes, large hail and a lot of thunder, says TV4's meteorologist Johan Wiksten. The cities that were worst affected were among others Norrköping, Valdemarsvik, Kisa and Nyköping. Fires after lightning strikes - There are several barns in the country that have been destroyed by fire due to the thunder. There have also been floods in several cities, although not catastrophic ones, he says. Even further west, the weather had a big impact. Saturday's finals in the Gothia cup had to be paused for half an hour due to the thunderstorm.  For the rescue service in Östergötland, it has been eventful, and when the worst is now over, you can breathe a sigh of relief.  - It has been relatively mild, but a few hectic hours in Norrköping and Valdemarsvik, I must say, says Lennart Ågren, officer on duty at the rescue service.  Welcome rain in the south During the afternoon, the emergency services have moved out to flooded roads and basements, but the number of alarms has been fewer than feared.  - We were actually prepared for more people to be affected. Fortunately, we didn't have to deal with any fires caused by lightning, he says. Meteorologist Johan Wiksten explains that the worst of the storm is now over in the area, and during tomorrow it will move south.  Several warnings during the Saturday afternoon", "title_original": "Ovädret rör sig söderut – flera nya gula varningar", "summary_original": "Den gula varningen för skyfallsliknande regn på söndagen berör ett område från Halmstad i väster, över Småland och fram till Kalmar och Öland. Varningen gäller från klockan 13 på fastlandet och klockan 15 på Öland. Även inför måndagen råder gul varning för regn i sydöstra Götaland och på Öland. Regnet väntas dra in på söndagseftermiddagen och sedan pågå under kvällen och natten och fram till morgonen eller förmiddagen på måndag. SMHI varnar för att vägar och viadukter samt källare och dagvattensystem kan översvämmas. Inför lördagen hade SMHI utfärdat en orange varning för inre och östra Östergötland. Stora regnmängder och åska förväntades – och prognosen visade sig stämma.  – Det har varit mycket intressanta grejer meteorologiskt. Flera tromber, stora hagel och mycket åska, säger TV4:s meteorolog Johan Wiksten. De städer som drabbats värst var bland annat Norrköping, Valdemarsvik, Kisa och Nyköping. Bränder efter blixtnedslag – Det är flera ladugårdar i landet som har eldhärjats på grund av åskan. Det har även varit översvämningar i flera städer, om än inte några katastrofala sådana, säger han. Även längre västerut hade vädret stor påverkan. Lördagens finaler i Gothia cup fick pausas i en halvtimme på grund av åskovädret.  För räddningstjänsten i Östergötland har det varit händelserikt, och när det värsta nu är över kan man pusta ut.  – Det har varit förhållandevis lindrigt, men några hektiska timmar i Norrköping och Valdemarsvik måste jag säga, säger Lennart Ågren, vakthavande befäl vid räddningstjänsten.  Välkommet regn i söder Under eftermiddagen har räddningstjänsten ryckt ut till översvämmade vägar och källare, men antalet larm har varit färre än befarat.  – Vi var faktiskt beredda på att fler skulle drabbas. Lyckligtvis behövde vi inte hantera några bränder till följd av blixtar, säger han. Meteorolog Johan Wiksten förklarar att det värsta ovädret nu
