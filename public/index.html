agerande och hur deras underrättelse- och säkerhetstjänst agerar. Irankännaren hoppas att händelsen leder till att Sverige sätter press på regimen. – Det viktiga nu är att regeringen och politiker agerar och protesterar i mer än bara ord. Det krävs riktiga handlingar. Det är väldigt många iranier som har utsatts för hot i Sverige men också andra ställen. Det är väldigt viktigt att kostnaden för regimens terroranvändning höjs så kraftigt att regimen aldrig vågar göra något liknande igen. För så länge regimen sitter vid makten kommer jag och många iranier som mig aldrig kunna känna oss trygga.", "link": "https://www.tv4.se/artikel/2IHkDVMr4kiaaAZTXht56H/orden-fran-hemlig-ort-efter-atalet-jag-aer-vaeldigt-raedd", "date_display": "2026-03-24", "date_iso": "2026-03-24T12:18:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/brott", "/iran", "/arvin-khoshnood"]}, {"id": 148, "title": "Teenager dead after shooting", "summary": "The murder occurred near a soccer field on Monday afternoon. Then the police said that the victim was 17-18 years old. Several young people must have been on the soccer field when the shooting took place, a person in the area told TV4 Nyheterna on Monday. - No one has been detained in the case, the investigative work continues and we have a safety-creating effort in the area on lats, says Camilla Hjort, press spokesperson at the police. There was a lot of traffic and large roadblocks after the murder. The police told TV4 Nyheterna yesterday that they had a good picture of the incident and good witness information. Expressen has published information that a woman is suspected of the murder, but the police have not confirmed this.", "title_original": "Tonåring död efter skjutning", "summary_original": "Mordet inträffade i närheten av en fotbollsplan under måndagseftermiddagen. Då sade polisen att offret var i 17-18-årsåldern. Flera ungdomar ska ha varit på fotbollsplanen när skjutningen ägde rum, sade en person i området till TV4 Nyheterna på måndagen. – Det är ingen som är frihetsberövad i ärendet, utredningsarbetet fortgår och vi har en trygghetsskapande insats i området på på lats, säger Camilla Hjort, presstalesperson på polisen. Det var stort pådrag och stora avspärrningar efter mordet. Polisen sade under gårdagen till TV4 Nyheterna att de fått en god bild av händelsen och bra vittnesuppgifter. Expressen har publicerat uppgifter om att en kvinna är misstänkt för mordet, men det är inget polisen har bekräftat.", "link": "https://www.tv4.se/artikel/7CYnwOFpc8vLP1VUvNmosU/tonaring-doed-efter-skottlossning-soeder-om-stockholm", "date_display": "2026-03-24", "date_iso": "2026-03-24T11:59:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff"]}, {"id": 149, "title": "Details: Convicted businessman shot in Solna", "summary": "An adult man has been shot near a square in Frösunda in Solna. His injury status is unclear. According to information to TV4 Nyheterna, the shot is a businessman in his 50s who has previously been convicted of financial crime. An intensive police operation took place in the area before a person could be arrested. - We have a big effort to be able to secure an investigation and look for the perpetrator, said Helena Boström Thomas at the police. Information: Preschool student who shot According to information to Aftonbladet, a boy under 15 has been arrested on suspicion of the shooting. The boy shot the man during a break at his playground, according to the newspaper's information. However, the information is not something that the police can confirm. However, they write on their website that a person has been \"deprived of liberty within the framework of the investigation\". - It is a person who is deprived of his liberty, but I cannot go into why. People can be detained for various reasons, says Daniel Wikdahl at the police. The incident is being investigated as attempted murder.", "title_original": "Uppgifter: Dömd affärsman skjuten i Solna", "summary_original": "En vuxen man har skjutits i närheten av ett torg i Frösunda i Solna. Skadeläget för honom är oklart. Enligt uppgifter till TV4 Nyheterna är den skjutne en affärsman i 50-årsåldern som tidigare är dömd för ekonomisk brottslighet. En intensiv polisinsats pågick i området innan en person kunde gripas. – Vi har en stor insats för att kunna säkra utredning och leta efter gärningspersonen, sade Helena Boström Thomas vid polisen. Uppgifter: Praoelev som sköt Enligt uppgifter till Aftonbladet har en pojke under 15 gripits misstänkt för skjutningen. Pojken sköt mannen under en rast på sin praoplats, enligt tidningens uppgifter. De uppgifterna är dock inget som polisen kan bekräfta. De skriver däremot på sin sajt att en person ”frihetsberövats inom ramen för utredningen”. – Det är en person som är frihetsberövad, men varför kan inte jag gå in på. Man kan frihetsberöva personer av olika anledningar, säger Daniel Wikdahl vid polisen. Händelsen utreds som försök till mord.", "link": "https://www.tv4.se/artikel/27UTBu4CA5P9kyJfB2LTTc/en-person-skjuten-stor-insats", "date_display": "2026-03-24", "date_iso": "2026-03-24T10:20:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/solna", "/skjutning", "/skjutningar-i-stockholm"]}, {"id": 150, "title": "The technical master on the Liberals' meeting failure: \"A shock\"", "summary": "The Liberals' national meeting became a challenge for both participants and organizers when the technology broke down. Jesper Bernström, who holds the world record in video installation, believes that the problems could have been avoided. - We have been involved for so many years now since the pandemic and were able to update our meeting systems and that it works so poorly and that they did not choose to end the meeting, it is surprising to me, says Jesper Bernström. Participants in the meeting asked that the meeting be postponed precisely because of the technical breakdown, something that was voted down.  Common errors in video meetings Conducting video meetings between two people requires relatively simple technology, but as soon as several parties are involved, better equipment is needed. According to Jesper Bernström, it is also often haste and lack of preparation that lead to technical confusion. - I would say that the most common error is probably that people are in a bit of a hurry when connecting to different systems. Be sure to start the system properly and test before simply walking into a meeting. Then everything will be much better. He believes that most problems are not about the technology itself. - In many errors it is usually handling, I would like to say. But then technical problems definitely happen. It's technology, it breaks. Technology is made to be used and if it stands still for too long, then it can start to malfunction. World record in video installation Jesper Bernström has the world record in video installation where you have to install a video conference system and make a call to the competition management in the shortest time. Something they completed in 11 minutes and 37 seconds. But in the WC this year they only finished second.  - It was a technical glitch, unfortunately.", "title_original": "Teknikmästaren om Liberalernas möteshaveri: ”En chock”", "summary_original": "Liberalernas landsmöte blev en utmaning för både deltagare och arrangörer när tekniken havererade. Jesper Bernström, som har världsrekord i videoinstallation, menar att problemen kunde ha undvikits. – Vi har varit med i så många år nu sedan pandemin och kunnat uppdatera våra mötessystem och att det funkar så dåligt och att man inte valde att avsluta mötet, det är förvånande för mig, säger Jesper Bernström. Deltagare i mötet bad om att mötet skulle skjutas upp just på grund av teknikhaveriet, något som röstades ned.  Vanliga fel vid videomöten Att genomföra videomöten mellan två personer kräver relativt enkel teknik, men så fort det är flera parter inblandade behöver man bättre utrustning. Enligt Jesper Bernström är det även ofta brådska och brist på förberedelser som leder till teknikstrul. – Jag skulle säga att det vanligaste felet är nog att folk har lite för bråttom när man kopplar upp sig i olika system. Var noga med att starta igång systemet ordentligt och testa av innan du går in i ett möte helt enkelt. Då blir allting mycket bättre. Han menar att de flesta problem inte handlar om tekniken i sig. – I många fel är det oftast handhavande, skulle jag vilja säga. Men sen händer det ju teknikproblem absolut. Det är ju teknik, den går ju sönder. Teknik är gjord för att användas och står den still för länge så då kan det ju börja strula. Världsrekord i videoinstallation Jesper Bernström har världsrekord i videoinstallation där man ska installera ett videokonferenssystem och ringa upp ett samtal till tävlingsledningen på kortast tid. Något de slutförde på 11 minuter och 37 sekunder. Men i VM i år slutade de bara tvåa.  – Det var teknikstrul, tyvärr.", "link": "https://www.tv4.se/artikel/28fzUXz2Lk9uHHznSR6UeF/teknikmaestaren-om-liberalernas-moeteshaveri-en-chock", "date_display": "2026-03-24", "date_iso": "2026-03-24T10:19:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/valet-2022/liberalerna", "/teknik", "/tekniska-problem"]}, {"id": 151, "title": "Continued with banned test - several months after disclosure", "summary": "Cold facts revealed in the program Barnmakarna how one of the country's largest private IVF clinics, Eliva Clinic, makes money by selling tests and treatment methods that are claimed to be \"revolutionary\" but in fact\nlacks scientific support. Their use of the PGT-A test, which examines the number of chromosomes in the embryo in a lab, was severely criticized. The test was already banned in Sweden in 2006. After the disclosure, the supervisory authority Ivo demanded that Eliva discontinue PGT-A. Eliva replied that they respected the authority's decision. From August 1, 2025, the test would no longer be performed, ordered, offered or marketed within the clinic's operations. \"All employees are obliged to know and follow the applicable legislation,\" the clinic wrote to IVO. But Cold facts can now show that the clinic continued with the test despite that. Two months later, in October 2025, Sara was a patient at Eliva and then PGT-A was performed on her embryo. - They said that the test was legal, that it was completely legal in Sweden, Sara tells Kalla fakta. The invoice shows that the test continued to be sold. Cold facts have seen the invoice where Eliva requests SEK 6,000 in payment from Sara for having performed the test. PGT-A is permitted in some countries and is requested by IVF patients in Sweden as well. Eliva sold a non-invasive version of the test which they claimed was permitted, but which was also unauthorized. - I chose Eliva precisely for the opportunity to do PGT-A. All other clinics said no when I asked. It felt safe when my doctor at Eliva said it was legal, says Sara. - I have spent a total of SEK 60,000 on Eliva. I would never have done that if I had known about this. I really feel cheated. Expert criticism One of the country's most experienced medical lawyers, Ulf H Fröberg, reacts strongly to Kalla fakta's new information. - I think it is stupid, unwise and dangerous. They are jeopardizing patient safety and they are jeopardizing their own safety. - There is a risk that the supervisory authority Ivo", "title_original": "Fortsatte med förbjudna testet – flera månader efter avslöjandet", "summary_original": "Kalla fakta avslöjade i programmet Barnmakarna hur en av landets största privata IVF-kliniker, Eliva Clinic, tjänar pengar på att sälja tester och behandlingsmetoder som påstås vara ”revolutionerande” men i själva verket\nsaknar vetenskapligt stöd. Deras användning av testet PGT-A, där man i labb undersöker antalet kromosomer i embryot, fick hård kritik. Testet förbjöds nämligen redan 2006 i Sverige. Efter avslöjandet krävde tillsynsmyndigheten Ivo att Eliva skulle upphöra med PGT-A. Eliva svarade att de respekterade myndighetens beslut. Från den 1 augusti 2025 skulle testet inte längre få utföras, beställas, erbjudas eller marknadsföras inom klinikens verksamhet. ”Samtliga medarbetare är skyldiga att känna till och följa gällande lagstiftning”, skrev kliniken till IVO. Men Kalla fakta kan nu visa att kliniken trots det fortsatte med testet. Två månader senare, i oktober 2025, var Sara patient hos Eliva och då utfördes PGT-A på hennes embryo. – De sa att testet var lagligt, att det var helt lagligt i Sverige, berättar Sara för Kalla fakta. Faktura visar att testet fortsatte säljas Kalla fakta har tagit del av fakturan där Eliva begär 6000 kronor i betalning från Sara för att ha utfört testet. PGT-A är tillåtet i vissa länder och efterfrågas av IVF-patienter även i Sverige. Eliva sålde en icke invasiv variant av testet som de påstod var tillåten, men som även den var otillåten. – Jag valde Eliva just för möjligheten att göra PGT-A. Alla andra kliniker sa nej när jag frågade. Det kändes tryggt när min läkare på Eliva sa att det var lagligt, berättar Sara. – Totalt har jag lagt ut 60 000 kronor på Eliva. Det hade jag aldrig gjort om jag vetat om det här. Jag känner mig verkligen lurad. Expert kritisk En av landets mest erfarna medicinska jurister, Ulf H Fröberg, reagerar starkt på Kalla faktas nya uppgifter. – Jag tycker att det är dumt, oklokt och farligt. De äventyrar patientsäkerheten och de äventyrar sin egen säkerhet. – Det finns ju risk att tillsynsmyndigheten Ivo agerar mot vårdgivaren. Den yttersta konsekvensen skulle ju vara att man kräver att verksamheten ska upphöra, säger han. Kalla fakta har varit i kontakt med Eliva Clinics vd Kenneth Sørensen som inte vill kommentera fallet.  Ivo vill inte uttala sig om de nya uppgifterna med hänvisning till att de har en pågående tillsyn av hela Eliva Clinics verksamhet. Den beräknas vara klar inom ett par veckor. Sara känner sig lurad av kliniken. – De får inte ljuga för patienterna. Vem ska man då lita på? Om läkare ljuger så har man inte tillit till vården. Det måste få konsekvenser tycker jag, säger Sara. Fotnot: Sara heter egentligen något annat.", "link": "https://www.tv4.se/artikel/2dXrH93BAPqSLjBZoblJ8p/fortsatte-med-foerbjudna-testet-flera-manader-efter-avsloejandet", "date_display": "2026-03-24", "date_iso": "2026-03-24T10:01:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/kalla-fakta-barnmakarna", "/ivf"]}, {"id": 152, "title": "In memory of Agnes Karlsson", "summary": "", "title_original": "Till minne av Agnes Karlsson", "summary_original": "", "link": "https://www.dagen.se/familj/till-minne-av-agnes-karlsson/10250207", "date_display": "2026-03-24", "date_iso": "2026-03-24T09:58:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 153, "title": "They play the king and queen in Swedish \"The crown\"", "summary": "Edvin Endre and Alicia von Rittberg play the main roles in the series, which has the working title \"Queen Silvia\". Edvin Endre is an actor and the son of Lena Endre. He has previously, among other things, played the lead role as Spotify's founder Daniel Ek in \"The Playlist\" and the character Philip in Henrik Schyffert's \"Zebrarummet\". “Getting this job was a dream come true and I know both me and Alicia are working really hard to do these characters justice and show you a great love story, because that's what this is at the end of the day. A love story, says Edvin Endre in a press release from Prime video. Alicia von Rittberg is a German actor who previously appeared in a royal drama series - \"Becoming Elizabeth\", which is about Elizabeth I's path to becoming Queen of England. \"Queen Silvia\" is about The series begins at the Munich Olympics in 1972, where the love story also began in real life between the German woman and the Swedish crown prince. In the press release, Prime video writes that the plot is as follows: \"At the Olympic Games in Munich, two people from completely different worlds meet: Silvia Sommerlath, the ambitious, multilingual daughter of a German-Brazilian family, and Sweden's Crown Prince Carl Gustaf. She works as a hostess for the organizing committee, while he, weighed down by the expectations of him as heir to the throne, attends the games as part of the Swedish delegation.\" \"A chance meeting soon becomes a secret love story between Olympic glamor and nightclubs.\" Then \"Queen Silvia\" premieres The series is directed by Miguel Alexandre, and is expected to premiere in June 2026 in connection with the golden wedding of King Carl Gustaf and Queen Silvia.", "title_original": "De spelar kungen och drottningen i svensk ”The crown”", "summary_original": "Edvin Endre och Alicia von Rittberg spelar huvudrollerna i serien, som har arbetstiteln ”Queen Silvia”. Edvin Endre är skådespelare och son till Lena Endre. Han har tidigare bland annat spelat huvudrollen som Spotifys grundare Daniel Ek i ”The Playlist” och karaktären Philip i Henrik Schyfferts ”Zebrarummet”. – Att få det här jobbet var en dröm som gick i uppfyllelse och jag vet att både jag och Alicia verkligen arbetar hårt för att göra dessa karaktärer rättvisa och visa er en fantastisk kärlekshistoria, för det är vad detta i slutändan är. En kärlekshistoria, säger Edvin Endre i ett pressmeddelande från Prime video. Alicia von Rittberg är en tysk skådespelare som tidigare medverkat i en kunglig dramaserie – ”Becoming Elizabeth” som handlar om Elizabeth I:s väg mot att bli Englands drottning. Det handlar ”Queen Silvia” om Serien tar sin början vid OS i München 1972, där kärlekssagan även i verkligheten tog sin början mellan den tyska kvinnan och den svenska kronprinsen. I pressmeddelandet skriver Prime video att handlingen är följande: ”Vid de olympiska spelen i München möts två personer från helt olika världar: Silvia Sommerlath, den ambitiösa, flerspråkiga dottern till en tysk-brasiliansk familj, och Sveriges kronprins Carl Gustaf. Hon arbetar som värdinna för organisationskommittén, medan han, tyngd av förväntningarna på honom som tronarvinge, deltar i spelen som en del av den svenska delegationen.” ”Ett slumpmässigt möte blir snart en hemlig kärlekshistoria mellan olympisk glamour och nattklubbar.” Då har ”Queen Silvia” premiär Serien regisseras av Miguel Alexandre, och väntas få premiär i juni 2026 i samband med kung Carl Gustafs och drottning Silvias guldbröllop.", "link": "https://www.tv4.se/artikel/tt-260324-queensilvia1-9e70fe2d/edvin-endre-i-svensk-the-crown", "date_display": "2026-03-24", "date_iso": "2026-03-24T08:53:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Konst", "/konst", "/kultur", "/noje", "/tv", "/film", "/kungahuset", "/tv-serier"]}, {"id": 154, "title": "Steak minute with Café de Paris butter", "summary": "Today's dinner tip offers a quick-fried steak minute topped with aromatic Café de Paris butter that melts over the freshly roasted meat. Served with a fresh tomato salad and crispy fries, it becomes a simple but luxurious dinner. A real classic that never goes out of time. See Stefan Ekengren's recipe", "title_original": "Steak minute med Café de Paris-smör", "summary_original": "Dagens middagstips bjuder på en snabbstekt steak minute toppad med aromatiskt Café de Paris-smör som smälter över det nystekta köttet. Serverad med en frisk tomatsallad och krispiga pommes blir det en enkel men lyxig middag. En riktig klassiker som aldrig går ur tiden. Se Stefan Ekengrens recept", "link": "https://www.tv4.se/artikel/zlmbWNvOcYQSrEmWlnHpJ/steak-minute-med-cafe-de-paris-smoer", "date_display": "2026-03-24", "date_iso": "2026-03-24T08:42:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/stefan-ekengren"]}, {"id": 155, "title": "Air traffic control's panic when the plane crashes: \"Stop, stop, stop!\"", "summary": "In the audio recordings of air traffic control communications, the air traffic controller says shortly after the crash that he was focused on another event and lost his way: I was trying to reach them ... and we dealt with an emergency before, and I messed up. Former accident investigator Jeff Guzzetti tells The Washington Post that air traffic control was clearly a problem. The aircraft was heading straight for them, but the vehicle began to cross the runway anyway. There are still many unanswered questions there. According to the AP news agency, Transport Minister Sean Duffy states that LaGuardia has a shortage of air traffic controllers.", "title_original": "Flygledningens panik när planet kraschar: ”Stopp, stopp, stopp!”", "summary_original": "I ljudupptagningarna från flygledningens kommunikation säger flygledaren kort efter kraschen att han var fokuserad på en annan händelse och att han gjort bort sig: Jag försökte nå dem ... och vi hanterade en nödsituation tidigare, och jag tabbade mig. Den tidigare olycksutredaren Jeff Guzzetti säger till The Washington Post att flygledningen uppenbarligen var ett problem. Flygplanet var på väg rakt mot dem, men fordonet började ändå att korsa banan. Det finns fortfarande många obesvarade frågor där. Transportminister Sean Duffy uppger enligt nyhetsbyrån AP att LaGuardia har brist på flygledare.", "link": "https://www.tv4.se/artikel/tt-260324-usaplanolycka1-1d8e6841/flygledare-efter-kraschen-tabbade-mig", "date_display": "2026-03-24", "date_iso": "2026-03-24T08:16:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/usa", "/flygkrasch", "/flygsakerhet", "/new-york"]}, {"id": 156, "title": "Zara Larsson: I lost SEK 30 million - on abortion jokes", "summary": "Swedish pop star Zara Larsson has come under fire for a comment about abortion on Tiktok. When one of her fans wrote on the platform that she was pregnant during a concert with the star but later had an abortion, Larsson replied: \"I killed the performance, and you killed it after the performance.\" It has caused many to rage, and in a video now taken down on Tiktok, the star says that it cost her a lucrative paid collaboration of three million dollars. \"I just: 'okay, what the hell'. If you don't agree with me that women should be able to have an abortion or that we can't joke about it, then we're not meant to be partners,\" she says in the video, according to the Daily Mail.", "title_original": "Zara Larsson: Jag förlorade 30 miljoner kronor – på abortskämt", "summary_original": "Den svenska popstjärnan Zara Larsson har hamnat i hetluften på grund av en kommentar om abort på Tiktok. När ett av hennes fans skrev på plattformen att hon var gravid under en konsert med stjärnan men senare gjort en abort, svarade Larsson: ”Jag dödade uppträdandet, och du dödade det efter uppträdandet”. Det har fått många att rasa, och i en nu nedplockad video på Tiktok berättar stjärnan att det kostat henne ett lukrativt betalt samarbete på tre miljoner dollar. ”Jag bara: ”okej, vad fan”. Om du inte håller med mig om att kvinnor ska kunna göra abort eller att vi inte kan skämta om det så är vi inte menade att vara partners”, säger hon i videon enligt Daily Mail.", "link": "https://www.tv4.se/artikel/tt-260324-zaralarsson1-7c0a5e90/larsson-skamtade-om-abort-forlorade-miljoner", "date_display": "2026-03-24", "date_iso": "2026-03-24T07:25:33+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": f Korea, New Zealand, Denmark, Latvia, Slovenia, Estonia, Norway, Sweden, Finland, Czechia, Romania, Bahrain and Lithuania on the Strait of Hormuz.", "link": "https://www.government.se/statements/2026/03/joint-statement-from-the-leaders-of-the-united-kingdom-france-germany-italy-the-netherlands-japan-canada-and-others-on-the-strait-of-hormuz-19-march-2026/", "date_display": "2026-03-20", "date_iso": "2026-03-20T20:17:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "4 days old", "tags": ["International", "Prime Minister's Office", "Energy", "Foreign and security policy", "Statement", "Ulf Kristersson"]}, {"id": 185, "title": "Sweden is launching a new electric car premium - here's how to apply", "summary": "A new government electric car premium opens for applications and can give households in rural areas up to SEK 46,800 - financed to 75 percent by the EU's social climate fund. \n The post Sweden launches new electric car premium – how to apply appeared first on ABC News.", "title_original": "Sverige lanserar ny elbilspremie – så här ansöker du", "summary_original": "En ny statlig elbilspremie öppnar för ansökningar och kan ge hushåll på landsbygden upp till 46 800 kronor – finansierad till 75 procent av EU:s sociala klimatfond. \n The post  Sverige lanserar ny elbilspremie – så här ansöker du  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/sverige-lanserar-ny-elbilspremie-sa-har-ansoker-du/", "date_display": "2026-03-20", "date_iso": "2026-03-20T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "5 days old", "tags": ["Ekonomi", "elbil", "elfordon", "EU", "klimat", "landsbygd", "Naturvårdsverket", "premie"]}, {"id": 186, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "The executive board has decided to leave the key interest rate unchanged at 1.75 percent and the interest rate is expected to remain at this level for some time to come. But the war in the Middle East makes the forecast very uncertain.  The Riksbank is following developments closely and will adapt monetary policy if the inflation and business cycle prospects require it.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent och räntan väntas ligga kvar på denna nivå under en tid framöver. Men kriget i Mellanöstern gör prognosen mycket osäker.  Riksbanken följer utvecklingen noga och kommer att anpassa penningpolitiken om inflations- och konjunkturutsikterna kräver det.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent2/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:42:40+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "5 days old", "tags": []}, {"id": 187, "title": "The Riksbank lowers the interest rate on the supplementary liquidity facility", "summary": "In the Riksbank's monetary policy control system, the interest rate that shall apply to the banks' overnight deposits and lending in the Riksbank is specified. In the Riksbank's supplementary liquidity facility, banks can take loans against collateral such as covered bonds. The interest surcharge on the supplementary liquidity facility is now reduced from 0.75 percentage points to 0.30 percentage points above the policy rate. In addition, the Riksbank removes the restriction on the percentage of covered bonds that the banks may use as collateral for loans from the Riksbank. The changes come into effect on 8 April 2026, and are part of the Riksbank's long-term work to facilitate banks' adaptation to an environment with less excess liquidity.", "title_original": "Riksbanken sänker räntan på den kompletterande likviditetsfaciliteten", "summary_original": "I Riksbankens penningpolitiska styrsystem anges vilken ränta som ska gälla för bankernas in- och utlåning över natten i Riksbanken. I Riksbankens kompletterande likviditetsfacilitet kan bankerna ta lån mot säkerheter som exempelvis säkerställda obligationer. Räntepåslaget på den kompletterande likviditetsfaciliteten sänks nu från 0,75 procentenheter till 0,30 procentenheter över styrräntan. Dessutom tar Riksbanken bort begränsningen för hur stor andel säkerställda obligationer bankerna får använda som säkerhet vid lån från Riksbanken. Förändringarna träder i kraft den 8 april 2026, och är en del av Riksbankens långsiktiga arbete med att underlätta bankernas anpassning till en miljö med mindre överskottslikviditet.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbanken-sanker-rantan-pa-den-kompletterande-likviditetsfaciliteten/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:29:00+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "5 days old", "tags": []}, {"id": 188, "title": "Sweden joins Pax Silica initiative", "summary": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "title_original": "Sweden joins Pax Silica initiative", "summary_original": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "link": "https://www.government.se/press-releases/2026/03/sweden-joins-pax-silica-initiative/", "date_display": "2026-03-17", "date_iso": "2026-03-17T17:05:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "7 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Innovation", "Maria Malmer Stenergard"]}, {"id": 189, "title": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "title_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "link": "https://www.government.se/speeches/2026/03/statement-by-minister-for-energy-business-and-industry-and-deputy-prime-minister-ebba-busch-at-the-energy-council-meeting-in-brussels/", "date_display": "2026-03-17", "date_iso": "2026-03-17T08:33:02+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "7 days old", "tags": ["Speech", "EU", "Ministry of Climate and Enterprise", "Energy", "Ebba Busch"]}, {"id": 190, "title": "Sweden provides humanitarian support to Lebanon", "summary": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "title_original": "Sweden provides humanitarian support to Lebanon", "summary_original": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "link": "https://www.government.se/press-releases/2026/03/sweden-provides-humanitarian-support-to-lebanon/", "date_display": "2026-03-16", "date_iso": "2026-03-16T16:26:07+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "8 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Benjamin Dousa"]}, {"id": 191, "title": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "title_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "link": "https://www.government.se/statements/2026/03/joint-statement-by-the-prime-ministers-of-the-nordic-countries-and-canada/", "date_display": "2026-03-15", "date_iso": "2026-03-15T10:33:42+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "9 days old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Civil defence", "Military defence"]}, {"id": 192, "title": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "title_original": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary_original": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/speech-by-the-minister-for-foreign-affairs-at-the-baltic-sea-security-talks-in-gdansk-on-12-march/", "date_display": "2026-03-13", "date_iso": "2026-03-13T13:51:21+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "11 days old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 193, "title": "The Payments Report 2026: Measures required to reduce vulnerability and increase inclusion in the payments market", "summary": "In order to reduce dependence on the outside world, the banks need to develop new payment services based on national and European systems. Primarily, banks must offer more services for instant payments, otherwise legislation should be introduced. To increase inclusion in the payment market, more payment methods are needed for those who do not have a payment account or experience digital exclusion. Access to cash services also needs to be improved, the Riksbank writes in the Payment Report published today.", "title_original": "Betalningsrapporten 2026: Åtgärder krävs för minskad sårbarhet och ökad inkludering på betalningsmarknaden", "summary_original": "För att minska omvärldsberoendet behöver bankerna utveckla nya betaltjänster som bygger på nationella och europeiska system. Primärt måste bankerna erbjuda fler tjänster för omedelbara betalningar, annars bör lagstiftning införas. För att öka inkluderingen på betalningsmarknaden behövs det fler betalsätt för de som saknar betalkonto eller upplever digitalt utanförskap. Tillgången till kontanttjänster behöver också förbättras, det skriver Riksbanken i Betalningsrapporten som publiceras idag.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/betalningsrapporten-2026-atgarder-kravs-for-minskad-sarbarhet-och-okad-inkludering-pa-betalningsmarknaden/", "date_display": "2026-03-12", "date_iso": "2026-03-12T08:00:30+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "13 days old", "tags": []}, {"id": 194, "title": "The Riksbank's business survey: \"It is not an obvious recovery, but we see that it is still happening\"", "summary": "The large Swedish companies are experiencing a certain improvement in the economy, but the recovery is both slow and hesitant. The troubled global situation has noticeably affected household consumption and companies' willingness to invest, and makes companies cautious when looking ahead. This is shown by the Riksbank's company survey in February.", "title_original": "Riksbankens företagsundersökning: ”Det är ingen självklar återhämtning men vi ser att det ändå händer”", "summary_original": "De svenska storföretagen upplever en viss förbättring av konjunkturen, men återhämtningen är både långsam och tvekande. Det oroliga omvärldsläget har påverkat hushållens konsumtion och företagens investeringsvilja märkbart och gör företagen försiktiga när de blickar framåt. Det visar Riksbankens företagsundersökning i februari.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbankens-foretagsundersokning-det-ar-ingen-sjalvklar-aterhamtning-men-vi-ser-att-det-anda-hander/", "date_display": "2026-03-11", "date_iso": "2026-03-11T08:30:29+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "13 days old", "tags": []}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
