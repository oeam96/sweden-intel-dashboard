body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }

button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;

    transition: transform 0.2s;

.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }

/* META */

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {

    display: flex; justify-content: space-between; align-items: center;

.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }

age_tag": "today", "tags": []}, {"id": 5, "title": "This is how IFK Malmö solves the chairman crisis: \"Been on the tape\"", "summary": "IFK Malmö Football has found its chairman. Youth manager Jim Nilsson Povoa takes on the role, elected at an extra meeting on Boxing Day. - I want to see a long-term plan for the association, where we will invest in and of course structure a good youth side, says the new chairman.", "title_original": "Så löser IFK Malmö ordförandekrisen: ”Varit på tapeten”", "summary_original": "IFK Malmö Fotboll har hittat sin ordförande. Ungdomsansvarige Jim Nilsson Povoa tar på sig rollen, vald på ett extra möte på annandagen. – Jag vill se en långsiktig plan för föreningen, där vi ska satsa på och givetvis strukturera upp en bra ungdomssida, säger den nye ordföranden.", "link": "https://www.sydsvenskan.se/sport/sa-loser-ifk-malmo-ordforandekrisen-varit-pa-tapeten/", "date_display": "2026-04-07", "date_iso": "2026-04-07T08:20:46+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 6, "title": "Swedish jubilation when Los Angeles won on penalties", "summary": "Anton Forsberg nailed it again and Adrian Kempe scored the decisive penalty goal for Los Angeles against Nashville in the NHL. Then the actor Will Ferrell - wearing a Tre Kronor shirt - cheered in the stands.", "title_original": "Svenskjubel när Los Angeles straffvann", "summary_original": "Anton Forsberg spikade igen och Adrian Kempe satte det avgörande straffmålet för Los Angeles mot Nashville i NHL. Då jublade skådespelaren Will Ferrell – iförd Tre Kronor-tröja – på läktarplats.", "link": "https://www.dn.se/sport/svenskjubel-nar-los-angeles-straffvann/", "date_display": "2026-04-07", "date_iso": "2026-04-07T08:14:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 7, "title": "Sydsvenskan's opinion poll: The party best suited to govern Malmö", "summary": "Now begins the hunt for the Social Democrats in Malmö. And on the undecided voters. In a unique survey, Sydsvenskan has asked Malmö residents who they want to govern the city, and how they should vote. Two parties are clearly backing down.", "title_original": "Sydsvenskans opinionsmätning: Partiet som ligger bäst till att få styra Malmö", "summary_original": "Nu börjar jakten på Socialdemokraterna i Malmö. Och på de osäkra väljarna. I en unik undersökning har Sydsvenskan frågat Malmöbor om vilka de vill ska styra staden, och hur de ska rösta. Två partier backar tydligt.", "link": "https://www.sydsvenskan.se/malmo/sydsvenskans-opinionsmatning-partiet-som-ligger-bast-till-fa-att-styra-malmo/", "date_display": "2026-04-07", "date_iso": "2026-04-07T08:14:11+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 8, "title": "Competition: Win tickets to MFF–Sirius!", "summary": "Craving football? On April 23, Malmö FF will host Sirius at the Stadium. Join us and compete for two tickets to the match!", "title_original": "Tävling: Vinn biljetter till MFF–Sirius!", "summary_original": "Sugen på fotboll? Den 23 april tar Malmö FF emot Sirius på Stadion. Var med och tävla om två biljetter till matchen!", "link": "https://www.sydsvenskan.se/sport/tavling-vinn-biljetter-till-mff-sirius/", "date_display": "2026-04-07", "date_iso": "2026-04-07T08:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 9, "title": "One hundred children dead in measles outbreak", "summary": "More than a hundred children have died in a rampant measles outbreak in Bangladesh. The country's authorities have launched a sharp vaccination effort.", "title_original": "Hundra barn döda i utbrott av mässlingen", "summary_original": "Fler än hundra barn har avlidit i ett skenande mässlingsutbrott i Bangladesh. Landets myndigheter har inlett en skarp vaccinationsinsats.", "link": "https://www.hd.se/varlden/hundra-barn-doda-i-utbrott-av-masslingen/", "date_display": "2026-04-07", "date_iso": "2026-04-07T07:59:19+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 10, "title": "Janne Andersson reveals his disappointment: \"It's incomprehensible\"", "summary": "Sweden's former national team captain Janne Andersson is current with a new book, \"Då var då\", which he has written together with Henrik Johnsson. In it, he tells, in diary form, about his time as responsible for Blågult. Regarding his departure from the Swedish Football Association, Andersson describes that he fought not to become bitter, but he is critical of the new management that came in towards the end of his time as association captain. Something that bothers him is the experience that the chairman Fredrik Reinfeldt (who has now left), the general secretary Andrea Möllerberg (who has been fired) and the football manager Kim Källström (who is now the national team manager) were not interested in any handover. In addition, Andersson describes that Reinfeldt and Möllerberg stood for a different leadership than the representatives Karl-Erik Nilsson and Håkan Sjöstrand, whom he appreciated. \"It worries me\" In \"Då var då\" For example, Andersson writes that Nilsson used to hug him every time they saw each other and that he always went down to the dressing room to hug the coach in connection with losses. Sjöstrand stood for similar support, says Andersson. \"With the new management, one who doesn't even go into the dressing room and one who doesn't have a whiff of national team football, it will be different when we go out and compete in the big world of football. That worries me,\" he writes in the book. Janne Andersson explains that he did not hear a word from Reinfeldt in connection with the resignation in December 2023. The union captain wanted to help the union avoid the mistakes he made along the way. \"But no one has asked. Kim Källström became the new national team manager, nor did he want to talk about football or business with me,\" Andersson writes in \"Då var då\". Took a mandatory meeting In October of that year, Andrea Möllerberg had reached out to set up a meeting, Andersson says in the book. But then there was silence - until Fotbollskanalen's Olof Lundh, at the national team captain's last press conference, on November 22, asked about", "title_original": "Janne Andersson avslöjar sin besvikelse: ”Det är obegripligt”", "summary_original": "Sveriges tidigare förbundskapten Janne Andersson är aktuell med en ny bok, \"Då var då\", som han har skrivit ihop med Henrik Johnsson. I den berättar han, i dagboksform, om sin tid som ansvarig för Blågult. Rörande sitt avsked från Svenska Fotbollförbundet beskriver Andersson att han kämpat för att inte bli bitter, men han är kritisk mot den nya ledningen som kom in mot slutet av hans tid som förbundskapten. Något som stör honom är upplevelsen att ordföranden Fredrik Reinfeldt (som nu lämnat), generalsekreteraren Andrea Möllerberg (som fått sparken) och fotbollschefen Kim Källström (som nu är landslagschef) inte var intresserade av någon överlämning. Dessutom beskriver Andersson att Reinfeldt och Möllerberg stod för ett annat ledarskap än företrädarna Karl-Erik Nilsson och Håkan Sjöstrand, vilka han uppskattade. ”Det bekymrar mig” I \"Då var då\" skriver exempelvis Andersson att Nilsson brukade krama om honom varje gång de sågs och att han alltid tog sig ner till omklädningsrummet för att klappa om tränaren i samband med förluster. Ett liknande stöd stod Sjöstrand för, menar Andersson. \"Med den nya ledningen, en som inte ens går ner i omklädningsrummet och en som inte har en susning om landslagsfotboll, så kommer det att bli annorlunda när vi ska ut och konkurrera i den stora fotbollsvärlden. Det bekymrar mig\", skriver han i boken. Janne Andersson förklarar att han inte hörde ett ord från Reinfeldt i samband med avskedet i december 2023. Förbundskaptenen ville hjälpa förbundet att undvika de misstag som han gjort längs med vägen. \"Men ingen har frågat. Kim Källström blev ny landslagschef, inte heller han ville prata fotboll eller verksamhet med mig\", skriver Andersson i \"Då var då\". Tog ett pliktskyldigt möte I oktober det året hade Andrea Möllerberg hört av sig för att styra upp ett möte, berättar Andersson i boken. Men därefter blev det tyst - fram till dess att Fotbollskanalens Olof Lundh på förbundskaptenens sista presskonferens, den 22 november, frågade om förbundet hade tankat av Andersson. \"Jag sa som det var. 'Nej, de har inte pratat med mig om någonting'. En timme senare skickade Möllerberg ett sms och sa att vi måste träffas och prata, ”nu när jag låtit dig vara ifred”. Vi tog ett pliktskyldigt möte i december, som kändes rätt meningslöst\", skriver Andersson. \"De var inte intresserade. Konstigt. Jag har ju inte gjort mig obekväm. Försökt vara schysst mot människor på förbundet\". Fruns uppmaning Andersson förklarar att han har förståelse för att SvFF var en organisation i förändring och att \"en annan tid\" väntade efter honom. Att många nya personer hade kommit in med nya idéer. \"Men nästan ingen har jobbat med landslag förut. Den första jag hade pratat med om jag var ny i huset hade varit mig själv. Att inte ens undra vad jag tror blir viktigt, inte ens att ställa frågan bara av nyfikenhet och sen, om man vill, strunta i vad jag sagt, är obegripligt\". Han är besviken över behandlingen. \"Jag kastas mellan olika känslor - fina minnen och frustration. Min fru Ulrika säger att jag inte får bli bitter. Jag ska inte bli bitter. Men jag tycker att det är lite taskigt, jag förtjänar inte det här, att de inte ens pratar med mig\". Dissades av Reinfeldt I boken konstaterar Andersson att hans officiella avtackning i samband med sista landskampen blev fin, och att förbundet ansträngde sig kring den. Dessutom genomfördes en avtackning på SvFF:s kansli med personalen där, vilken han uppskattade. Men samtidigt avslöjar han att nämnde Fredrik Reinfeldt dissade den helt. \"När vi satt kvar och fikade fick jag höra av en kollega att Reinfeldt var på förbundet. Kollegan hade sett honom i receptionen där man påtalat att det pågick avtackning med korv och bröd, men då hade han avfärdat inbjudan med 'Sånt där håller vi inte på med'\", skriver Andersson. Janne Andersson var förbundskapten för Sveriges herrlandslag i sju år från 2016 och framåt. Han ledde Blågult i 94 landskamper och tog exempelvis laget till en VM-kvartsfinal 2018.", "link": "https://www.tv4.se/artikel/1mqj5gDOYETg7vQC3g3ASb/janne-andersson-avsloejar-sin-besvikelse-det-aer-obegripligt", "date_display": "2026-04-07", "date_iso": "2026-04-07T07:58:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/sport", "/fotboll", "/svenska-landslaget", "/janne-andersson"]}, {"id": 11, "title": "List: Here are the most expensive villas in Helsingborg in March", "summary": "Bengt Langhs Gata 11, Erik Dahlbergs Gata 80, Konsulns Väg 23, Bygatan 23, Sandvägen 17 and Randersgatan 37A. Montage, Google Streetview", "title_original": "Lista: Här är de dyraste villorna i Helsingborg i mars", "summary_original": "Bengt Langhs Gata 11, Erik Dahlbergs Gata 80, Konsulns Väg 23, Bygatan 23, Sandvägen 17 och Randersgatan 37A. Montage, Google Streetview", "link": "https://www.hd.se/helsingborg/lista-har-ar-de-dyraste-villorna-i-helsingborg-i-mars/", "date_display": "2026-04-07", "date_iso": "2026-04-07T07:57:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 12, "title": "The Shah's son visits Sweden", "summary": "The son of Iran's last Shah, Reza Pahlavi, will visit Sweden and give a speech in the Riksdag. Pahlavi has been invited by the Christian Democrats and the Sweden Democrats' parliamentary groups. The visit will take place on April 13. - It is a way to support all democratic forces that work for a free, democratic and peaceful Iran, says KD's foreign policy spokesperson Magnus Berntsson. The contact between the Swedish parties and Pahlavi and the planning of the visit began in connection with the large demonstration against the Iranian regime in Munich earlier this year. - The Crown Prince was of course the keynote speaker, but I also spoke and afterwards Nima Gholam Ali Pour from SD and myself and an Austrian parliamentarian had the opportunity to speak with Pahlavi, where we began to discuss the possibility of coming to Sweden, says Berntsson. Reza Pahlavi has lived in exile since the Iranian revolution in 1979. During the major protests in Iran and abroad, parts of the opposition have highlighted him as a possible future leader of the country.", "title_original": "Shahens son besöker Sverige", "summary_original": "Sonen till Irans sista shah, Reza Pahlavi, kommer att besöka Sverige och hålla ett tal i riksdagen. Pahlavi har bjudits in av Kristdemokraterna och Sverigedemokraternas riksdagsgrupper. Besöket kommer att äga rum den 13 april. – Det är ett sätt att stödja alla demokratiska krafter som jobbar för ett fritt, demokratiskt och fredligt Iran, säger KD:s utrikespolitiska talesperson Magnus Berntsson. Kontakten mellan de svenska partierna och Pahlavi samt planeringen av besöket inleddes i samband med den stora demonstrationen mot den iranska regimen i München tidigare i år. – Kronprinsen var givetvis huvudtalare, men jag talade också och efteråt fick jag och Nima Gholam Ali Pour från SD och en österrikisk parlamentariker möjligheten att tala med Pahlavi, där började vi diskutera möjligheten att komma till Sverige, säger Berntsson. Reza Pahlavi har levt i exil sedan den iranska revolutionen 1979. Under de stora protesterna i Iran och utomlands har delar av oppositionen lyft fram honom som en eventuell framtida ledare för landet.", "link": "https://www.tv4.se/artikel/1Edvdr1RbObbPwa9BpMng9/shahens-son-besoeker-sverige", "date_display": "2026-04-07", "date_iso": "2026-04-07T07:51:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/reza-pahlavi", "/iran", "/irankriget"]}, {"id": 13, "title": "Carl Johan von Seth: The war has not awakened the inflation monster - yet", "summary": "If the war in the Middle East continues, the world economy is in dire straits. But despite rampant fuel prices, the inflation monster is still slumbering in its dark cave, new figures from Statistics Norway show. DN's Carl Johan von Seth answers three questions about inflation statistics.", "title_original": "Carl Johan von Seth: Kriget har inte väckt inflationsmonstret – ännu", "summary_original": "Om kriget i Mellanöstern fortsätter ligger världsekonomin rysligt illa till. Men trots skenande bränslepriser slumrar inflationsmonstret fortfarande i sin mörka grotta, visar nya siffror från SCB. DN:s Carl Johan von Seth svarar på tre frågor om inflationsstatistiken.", "link": "https://www.dn.se/ekonomi/carl-johan-von-seth-kriget-har-inte-vackt-inflationsmonstret-annu/", "date_display": "2026-04-07", "date_iso": "2026-04-07T07:49:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 14, "title": "Inflation drops unexpectedly – ​​no war effects", "summary": "It is difficult to find war effects on Swedish prices in March. Inflation, according to the CPIF measure, unexpectedly fell to 1.6 percent, according to Statistics Sweden. - The Riksbank has plenty of room to wait, says Torbjörn Isaksson, chief analyst at Nordea, about the likelihood of interest rate increases due to inflation this year.", "title_original": "Inflationen sjunker oväntat – inga krigseffekter", "summary_original": "Det är svårt att hitta krigseffekter på svenska priser i mars. Inflati ted counterclaims.", "title_original": "Förslag får nobben inför Trumps tidsfrist", "summary_original": "Mindre än ett dygn kvarstår för den tidsfrist som Trump säger sig ge Iran. Om inte hotar nya attacker som ska ”skicka landet tillbaka till stenåldern”.  Men hittills har medlarnas förslag om vapenvila fått nobben och Iran har lagt fram motkrav.", "link": "https://www.hd.se/varlden/forslag-far-nobben-infor-trumps-tidsfrist/", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:37:46+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 40, "title": "Follow developments in Iran and the Middle East", "summary": "", "title_original": "Följ utvecklingen i Iran och Mellanöstern", "summary_original": "", "link": "https://www.sydsvenskan.se/varlden/folj-utvecklingen-i-iran-har/", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:34:03+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 41, "title": "Alert: Civilians are being hit harder and harder in Iran", "summary": "Civilians in Iran are increasingly falling victim to the war, warns the UN's humanitarian coordination agency Ocha.", "title_original": "Larm: Civila drabbas allt hårdare i Iran", "summary_original": "Civila i Iran faller offer för kriget i allt större utsträckning, larmar FN:s humanitära samordningsorgan Ocha.", "link": "https://www.svd.se/a/ExxOkA/larm-civila-drabbas-allt-hardare-i-iran", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:34:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 42, "title": "Students in for-profit independent schools earn less as adults", "summary": "It is worse for students who have attended for-profit high schools. They earn an average of SEK 200,000 less later in life than students who attended municipal upper secondary schools.", "title_original": "Elever i vinstdrivande friskolor tjänar sämre som vuxna", "summary_original": "Det går sämre för elever som har gått i vinstdrivande gymnasieskolor. De tjänar i genomsnitt 200 000 kronor mindre senare i livet än elever som gått i kommunala gymnasieskolor.", "link": "https://www.dn.se/sverige/elever-i-vinstdrivande-friskolor-tjanar-samre-som-vuxna/", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:27:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 43, "title": "Johanna Frändén: Sweden has one of the WC's hottest attacks", "summary": "The playoff miracle is history. And here, of course, there will be a patchwork that is called good enough, but someone has to say it: Sweden is going to North America this summer with one of the championship's most feared attacks*. *On paper.", "title_original": "Johanna Frändén: Sverige har ett av VM:s hetaste anfall", "summary_original": "Playoff-miraklet är historia. Och här kommer förstås ett lappkast som heter duga, men någon måste säga det: Sverige åker till Nordamerika i sommar med ett av mästerskapets mest fruktade anfall*. *På pappret.", "link": "https://www.dn.se/sport/johanna-franden-sverige-har-ett-av-vms-hetaste-anfall/", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:07:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 44, "title": "\"Almost a bit shocking\"", "summary": "The statistics agency Statistics Sweden's preliminary figures for March show that inflation is falling, according to the CPIF measure, in March. CPIF is the measure that the Riksbank uses for its inflation target of 2 percent. At the same time, the rate of inflation according to the CPI measure rose from 0.5 percent in February to 0.6 percent.  - Preliminary figures show that the rate of inflation according to the CPI rose slightly in March, where transport costs increased and housing costs fell, says Caroline Neander, price statistician at Statistics Sweden.  \"Almost a bit of a shock\" Before the preliminary announcement, several observers believed that inflation would rise.  - This was really an unexpected case. I and many people with me thought we would see rising inflation compared to last month, it's almost a bit of a shock, says economics journalist Frida Bratt. She describes how there was great uncertainty before the announcement, as it was not known how big an effect the war in Iran would have on inflation.  - It might come a little later, that's what I think, that there is a little delay in that effect, says Frida Bratt.  Unclear what lies behind The figures from Statistics Sweden are only preliminary and on April 14 the definitive announcement about inflation in March will come.  - We don't really know what's behind it, we won't know until a week from now. It is impossible to say what caused this, says Frida Bratt.  At the same time, she emphasizes that you cannot blow your breath yet. The impact of the Iran war on fuel prices may drive inflation. - It is not just a rising petrol price as a result of rising oil prices, it can creep in and have effects on other parts, such as rising food prices and shipping prices, says Frida Bratt and adds. If the war continues, she believes that the major effects will come later.", "title_original": "”Nästan lite chockartat”", "summary_original": "Statistikmyndigheten SCB:s preliminära siffror för mars visar att inflationen sjunker, enligt måttet KPIF, i mars. KPIF är det mått som Riksbanken använder för sitt inflationsmål på 2 procent. Samtidigt steg inflationstakten enligt måttet KPI från 0,5 procent i februari till 0,6 procent.  – Preliminära siffror visar att inflationstakten enligt KPI steg något i mars, där transportkostnaderna ökade och kostnaderna för boende sjönk, säger Caroline Neander, prisstatistiker på SCB.  ”Nästan lite chockartat” Inför det preliminära beskedet trodde flera bedömare att inflationen skulle stiga.  – Det här var verkligen ett oväntat fall. Jag och många med mig trodde att vi skulle få se en stigande inflation jämfört med förra månaden, det är nästan lite chockartat, ekonomijournalisten säger Frida Bratt. Hon beskriver hur det fanns en stor osäkerhet inför beskedet, då man inte visste hur stor effekt kriget i Iran skulle ha på inflationen.  – Den kanske kommer lite senare, det är vad jag tror, att det är lite fördröjning på den effekten, säger Frida Bratt.  Oklart vad som ligger bakom  Siffrorna från SCB är bara preliminära och den 14 april kommer det definitiva beskedet om inflationen i mars.  – Vi vet inte vad som ligger bakom riktigt, det vet vi först om en vecka. Det går inte säga vad som orsakat det här, säger Frida Bratt.  Samtidigt framhåller hon att man inte kan pusta ut än. Irankrigets påverkan på drivmedelspriserna kan driva på inflationen. – Det är inte bara ett stigande bensinpris som en följd av stigande oljepriser, det kan leta sig in och få effekter på andra delar, som stigande matpriser och fraktpriser, säger Frida Bratt och tillägger. Om kriget fortsätter tror hon att de stora effekterna kommer att komma längre fram.", "link": "https://www.tv4.se/artikel/5FfKxo6AaTX3SeTDLoWJaY/inflationen-sjunker-i-mars", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:05:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/ekonomi", "/scb"]}, {"id": 45, "title": "Sweden's best window cleaner: Common mistakes - best tips", "summary": "The career as a window cleaner began as a summer job in his early teens. Now Mattias Nielsen has had the profession full-time for 14 years and he also competes at the highest level. In November 2025, he won the SM in window cleaning, a competition that is decided on both time and precision, where every missed spot adds to the final result.\n\nIn November he will defend the title, but already in May he will go to Oslo to compete in the Nordic championships. He is also one of four people selected for the national team in window cleaning. How to avoid common mistakes The spring sun is long-awaited, but it also means that dirt on the windows can be seen extra clearly. Mattias Nielsen has tips and advice for those who want to get their windows sparkling clean. A common mistake among private individuals is not replacing the rubber in the scraper. - The scraper is the most important part and above all the rubber you put in the scraper. As professional window cleaners, we have to change the rubber once or twice a day at worst. On older windows, the paint may be cracked or the putty may be broken at the edges. It can damage the rubber and then there will be streaks.  Another common mistake is trying to wipe away streaks with a cotton towel, which often leaves the window flaming. Instead, he recommends wetting the pane again and using the scraper again. How to get the windows really clean To get a good result, all you need is water and a little washing-up liquid, which according to Nielsen is the best cleaning agent. He recommends using one deciliter of detergent for 15 liters of water.  - Wet the entire window and be careful so you get the edges properly. Try to rub a little extra on the edge so that you get all the water with you. Machines for cleaning windows work well for private use, but for those who want a truly professional result, classic tools apply.  - For those of us who clean 50-100 windows a day, we need to use stuff like this. There are many different variants of these as well, says Mattias Nielsen.  You can believe that Sweden's best", "title_original": "Sveriges bäste fönsterputsare: Vanliga missarna – bästa tipsen", "summary_original": "Karriären som fönsterputsare började som sommarjobbare i tidiga tonåren. Nu har Mattias Nielsen haft yrket på heltid i 14 år och han tävlar dessutom på högsta nivå. I november 2025 vann han SM i fönsterputs, en tävling som avgörs på både tid och precision, där varje missad fläck ger tillägg i slutresultatet.\n\nI november ska han försvara titeln men redan i maj åker han till Oslo för att tävla i nordiska mästerskapen. Han är också en av fyra personer som är uttagen till landslaget i fönsterputs. Så undviker du vanliga misstag  Vårsolen är efterlängtad men det gör också att smuts på fönstren syns extra tydligt. Mattias Nielsen har tips och råd till de som vill få fönstren skinande rena. Ett vanligt misstag bland privatpersoner är att inte byta ut gummit i skrapan. – Skrapan är det viktigaste momentet och framför allt gummit man sätter i skrapan. Som professionell fönsterputsare måste vi byta gummit en till två gånger om dagen i värsta fall. På äldre fönster kan färgen vara krackelerad eller kitten kan vara trasig i kanterna. Det kan skada gummit och då blir det streck.  Ett annat vanligt misstag är att försöka torka bort streck med en bomullshandduk, vilket ofta gör fönstret flammigt. Han rekommenderar i stället att blöta ner rutan igen och använda skrapan på nytt. Så får du fönstren riktigt rena  För att få ett bra resultat behövs bara vatten och lite diskmedel, som enligt Nielsen är det bästa rengöringsmedlet. Han rekommenderar att använda en deciliter diskmedel till 15 liter vatten.  – Blöt ner hela fönstret och var noggrann så man får med sig kanterna ordentligt. Försök gnugga lite extra på kanten så att man får med sig allt vatten. Maskiner för fönsterputs fungerar bra för privat bruk, men för den som vill ha ett riktigt proffsigt resultat är det klassiska verktyg som gäller.  – För oss som rengör 50-100-tals fönster om dagen behöver vi använda sådana här grejer. Det finns många olika varianter på dessa också, säger Mattias Nielsen.  Man kan tro att Sveriges bästa fönsterputsare putsar sina egna fönster för jämnan men så är inte fallet.  – Tre gånger om året gör jag det, men det kan behövas oftare.", "link": "https://www.tv4.se/artikel/1LVa2OlI3VX2qqrWdAGM40/sveriges-baesta-foensterputsare-avsloejar-sina-knep", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:02:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/fonsterputs", "/rengoringsmedel"]}, {"id": 46, "title": "Inflation drops unexpectedly – ​​no war effects", "summary": "It is difficult to find war effects on Swedish prices in March. Inflation, according to the CPIF measure, unexpectedly fell to 1.6 percent, according to Statistics Sweden. - The Riksbank has plenty of room to wait, says Torbjörn Isaksson, chief analyst at Nordea, about the likelihood of interest rate increases due to inflation this year.", "title_original": "Inflationen sjunker oväntat – inga krigseffekter", "summary_original": "Det är svårt att hitta krigseffekter på svenska priser i mars. Inflationen, enligt måttet KPIF, sjönk oväntat till 1,6 procent, enligt SCB. – Riksbanken har gott om utrymme att avvakta, säger Torbjörn Isaksson, chefsanalytiker på Nordea, om sannolikheten för räntehöjningar på grund av inflation i år.", "link": "https://www.svd.se/a/XMMPeE/inflationen-sjonk-ovantat-i-mars", "date_display": "2026-04-07", "date_iso": "2026-04-07T06:01:09+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 47, "title": "Pretty/Stella v2", "summary": "", "title_original": "Bonita/Stella v2", "summary_original": "", "link": "https://www.hd.se/bonitastella-v2/", "date_display": "2026-04-07", "date_iso": "2026-04-07T05:57:41+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 48, "title": "Santa: Things I have a hard time understanding", "summary": "After some unusually confused thinking, Santa has collected a long list of things that are not exactly as he thinks they should be.", "title_original": "Nisse: Saker jag har svårt att förstå", "sum , "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "Swedes do \"The Little Prince\" ballet in Paris: \"It's about the loss of childhood\"", "summary": "Antoine de Saint-Exupéry's \"The Little Prince\" is one of the most cherished treasures of French literature. When the children's book classic now becomes a ballet at the National Opera in Paris, the music is composed by a Swede: the young composer Simon Bång.", "title_original": "Svensk gör ”Lille prinsen”-balett i Paris: ”Handlar om förlusten av barndom”", "summary_original": "Antoine de Saint-Exupérys ”Lille prinsen” är en av den franska litteraturens mest omhuldade skatter. När barnboksklassikern nu blir balett på Nationaloperan i Paris komponeras musiken av en svensk: den unge kompositören Simon Bång.", "link": "https://www.dn.se/kultur/svensk-gor-lille-prinsen-balett-i-paris-handlar-om-forlusten-av-barndom/", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:53:05+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "Johan Croneman: How is it actually with the left turn on SVT?", "summary": "The accusations about SVT's left-wing bias have been constant since the 60s. But a survey from the Katalys think tank shows a completely different picture, writes Johan Croneman.", "title_original": "Johan Croneman: Hur är det egentligen med vänstervridningen på SVT?", "summary_original": "Anklagelserna om SVT:s vänstervridning har varit konstanta sedan 60-talet. Men en undersökning från idéinstitutet Katalys visar en helt annan bild, skriver Johan Croneman.", "link": "https://www.dn.se/kultur/johan-croneman-hur-ar-det-egentligen-med-vanstervridningen-pa-svt/", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:46:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Stop in train traffic between Malmö and Gothenburg", "summary": "", "title_original": "Stopp i tågtrafiken mellan Malmö och Göteborg", "summary_original": "", "link": "https://www.svd.se/a/vrr0kL/stopp-i-tagtrafiken-mellan-malmo-och-goteborg", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:46:38+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 76, "title": "Big price difference for summer tires - therefore it can differ several thousand", "summary": "At a tire workshop in Spånga, the tire change times are clearly visible. But the tire purchase itself often takes place at another dealer, where the price may be completely different. A review from Prisjakt of 47 popular summer tires shows that exactly the same tires are, on average, 39 percent more expensive at the most expensive retailer.  In some cases, the difference can be several thousand kroner. Big differences between retailers Several customers state that they recognize that it can be expensive not to compare prices. At the same time, there are several reasons why prices differ between different retailers, according to the industry. - Mainly it has to do with the quality. We both have a property that costs. We have staff on site, provide a comprehensive solution to customers, says Benjamin Brånth, site manager at Vianor in Spånga. - There are large warehouses, then you need less staff and that also makes the tires cheaper. The industry: Make informed choices The tire industry writes in an email to TV4 Nyheterna that there can be many different reasons why the prices differ. Such as purchasing costs, inventory and service level. Their recommendation to consumers is to make informed choices. - When I buy tires next time, I will definitely make sure that I get the best possible price, says Jonathan Sträng.", "title_original": "Stor prisskillnad på sommardäck – därför kan det skilja flera tusen", "summary_original": "På en däckverkstad i Spånga syns däckbytestiderna tydligt. Men själva däckköpet sker ofta hos en annan återförsäljare, där priset kan vara ett helt annat. En genomgång från Prisjakt av 47 populära sommardäck visar att exakt likadana däck i snitt är 39 procent dyrare hos den dyraste återförsäljaren.  I vissa fall kan skillnaden vara flera tusen kronor. Stora skillnader mellan återförsäljare Flera kunder uppger att de känner igen sig i att det kan bli dyrt att inte jämföra priser. Samtidigt finns det flera orsaker till att priserna skiljer sig åt mellan olika återförsäljare, enligt branschen. – Främst så har det ju med kvaliteten att göra. Vi har både en fastighet som kostar. Vi har personal på plats, ger en helhetslösning till kunderna, säger Benjamin Brånth, platschef på Vianor i Spånga. – Det är stora lagerlokaler, då behöver man mindre personal och det gör också att däcken blir billigare. Branschen: Gör välgrundade val Däckbranschen skriver i ett mejl till TV4 Nyheterna att det kan finnas många olika anledningar till att priserna skiljer sig åt. Som inköpskostnader, lagerhållning och servicenivå. Deras rekommendation till konsumenter är att göra välgrundade val. – När jag köper däck nästa gång så kommer jag definitivt se till att jag får så bra pris som möjligt, säger Jonathan Sträng.", "link": "https://www.tv4.se/artikel/40J9cQE86VmYLChk6Z3oAq/stor-prisskillnad-pa-sommardaeck-daerfoer-kan-det-skilja-flera-tusen", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:33:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/bilar", "/dackbyte"]}, {"id": 77, "title": "Lisa Magnusson: Deep down, the complaining neighbors don't even want it to be quiet", "summary": "It's all about a misunderstanding.", "title_original": "Lisa Magnusson: Innerst inne vill de klagande grannarna inte ens ha det tyst", "summary_original": "Allt handlar om ett missförstånd.", "link": "https://www.dn.se/ledare/lisa-magnusson-innerst-inne-vill-de-klagande-grannarna-inte-ens-ha-det-tyst/", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:23:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "\"There are many preconceived notions\"", "summary": "The concert hall in Stockholm turns 100 years old. On Tuesday, April 7, the celebration begins with four jam-packed days of music, lectures and dancing. SvD called CEO Susanne Rydén to take the time ahead of the anniversary.", "title_original": "”Finns många förutfattade meningar”", "summary_original": "Konserthuset i Stockholm fyller 100 år. Tisdagen den 7 april inleds firandet med fyra fullspäckade dagar av musik, föreläsningar och dans. SvD ringde upp vd:n Susanne Rydén för att ta tempen inför jubileet.", "link": "https://www.svd.se/a/433AJV/konserthuset-fyller-100-ar-vd-n-om-programmets-hojdpunkter", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 79, "title": "Creamy vegetable soup with soda bread", "summary": "The kitchen's dinner offers a warming and creamy vegetable soup with root vegetables and green peas. Serve with freshly baked Irish soda bread, which is at its best straight from the oven. Keep in mind that the bread quickly becomes drier as it cools, so enjoy it freshly baked with butter for the best flavor and texture. For Siri Barje's recipe", "title_original": "Krämig grönsakssoppa med sodabread", "summary_original": "Kökets middag bjuder på en värmande och krämig grönsakssoppa på rotfrukter och gröna ärtor. Servera med nybakat irländskt sodabröd som är som allra godast direkt från ugnen. Tänk på att brödet snabbt blir torrare när det svalnar, så njut av det nygräddat med smör för bästa smak och konsistens. Till Siri Barjes recept", "link": "https://www.tv4.se/artikel/2CWQokI8Eph0sXTd4jL6cs/kraemig-groensakssoppa-med-sodabread", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:13:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/kokets-middag", "/koket", "/siri-barje"]}, {"id": 80, "title": "Poorer outdoor life despite millions of investments", "summary": "Closed playgrounds, cesspits that have stopped emptying and bridges that are rotting away. Millions of investments in outdoor activities are eaten up by rising costs before they reach the forest, according to figures from the Swedish Tourist Association and Friluftsfrämjandet.", "title_original": "Fattigare friluftsliv trots miljonsatsningar", "summary_original": "Avstängda lekplatser, dass som slutat tömmas och broar som ruttnar sönder. Miljonsatsningar på friluftsliv äts upp av stigande kostnader innan de når skogen, enligt siffror från Svenska Turistföreningen och Friluftsfrämjandet.", "link": "https://www.svd.se/a/gkk5w5/fattigare-friluftsliv-trots-miljonsatsningar", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:10:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 81, "title": "Snuff ban worries – big interests at stake", "summary": "Taking a white pill in Paris can result in a large fine. There it is described as a decisive blow against the powerful tobacco industry - but in Sweden it is received as an attack on the Swedish self-image. In the background, a larger battle is taking place with billions of dollars at stake.", "title_original": "Snusförbud oroar – stora intressen på spel", "summary_original": "Att ta en vit prilla i Paris kan ge stora böter. Där beskrivs det som ett avgörande slag mot den mäktiga tobaksindustrin – men i Sverige tas det emot som ett angrepp mot den svenska självbilden. I bakgrunden pågår en större strid med miljardsummor på spel.", "link": "https://www.sydsvenskan.se/varlden/snusforbud-oroar-stora-intressen-pa-spel/", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:05:21+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "Snuff ban worries – big interests at stake", "summary": "Taking a white pill in Paris can result in a large fine. There it is described as a decisive blow against the powerful tobacco industry - but in Sweden it is received as an attack on the Swedish self-image. In the background, a larger battle is taking place with billions of dollars at stake.", "title_original": "Snusförbud oroar – stora intressen på spel", "summary_original": "Att ta en vit prilla i Paris kan ge stora böter. Där beskrivs det som ett avgörande slag mot den mäktiga tobaksindustrin – men i Sverige tas det emot som ett angrepp mot den svenska självbilden. I bakgrunden pågår en större strid med miljardsummor på spel.", "link": "https://www.svd.se/a/m00OQp/snusforbud-oroar-stora-intressen-pa-spel", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:00:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 83, "title": "Hungary under Orbán is a fiasco", "summary": "Viktor Orbán has wanted to make Hungary a democracy without liberalism. But by shrinking freedom, he has not made the economy, society or people grow.", "title_original": "Ungern under Orbán är ett fiasko", "summary_original": "Viktor Orbán har velat göra Ungern till en demokrati utan liberalism. Men genom att krympa friheten har han varken fått ekonomi, samhälle eller människor att växa.", "link": "https://www.svd.se/a/lnnRQo/ungern-under-viktor-orban-ar-ett-fiasko", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 84, "title": "\"But the financial market dares to oppose an autocratic president.\"", "summary": "USA:s president Donald Trump.", "title_original": "”Men finansmarknaden vågar sätta sig emot en självsvåldig president.”", "summary_original": "USA:s president Donald Trump.", "link": "https://www.sydsvenskan.se/opinion/idag-kan-vi-sanda-finansmarknaden-en-tacksamhetens-tanke/", "date_display": "2026-04-07", "date_iso": "2026-04-07T04:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "Warns of the risk of rabies when buying a dog - puppies are brought into the country with false certificates", "summary": "Every year, customs discovers hundreds of dogs with incorrect vaccination certificates. Now the Swedish Agency for Agriculture is warning against buying dogs from countries where the rabies situation is not under control. - We have no idea how many people get past the border controls, says Simon Löfgren, head of unit at the authority.", "title_original": "Varnar för rabiesrisk vid hundköp – valpar förs in i landet med falska intyg", "summary_original": "Varje år upptäcker tullen hundratals hundar med felaktiga vaccinationsintyg. Nu varnar Jordbruksverket för hundköp från länder där rabiessituationen inte är under kontroll. – Vi har ingen aning om hur många som kommer förbi gränskontrollerna, säger Simon Löfgren, enhetschef vid myndigheten.", "link": "https://www.dn.se/sverige/varnar-for-rabiesrisk-vid-hundkop-valpar-fors-in-i-landet-med-falska-intyg/", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:55:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "The clock is ticking – for Trump and Iran", "summary": "Donald Trump needs to quickly end the Iran war with something that looks like a victory, in order not to lose power this fall. Now he is investing his capital of violence to get Iran to cave in before the deadline expires tonight.", "title_original": "Klockan tickar – för Trump och Iran", "summary_original": "Donald Trump behöver snabbt avsluta Irankriget med något som ser ut som en seger, för att inte förlora makten i höst. Nu satsar han sitt våldskapital på att få Iran att vika ner sig innan tidsfristen går ut i natt.", "link": "https://www.svd.se/a/8ppnWd/donald-trump-behover-snabbt-avsluta-irankriget", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:52:24+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 87, "title": "That's why fives don't look for nines - that's how appearance governs our partner choices", "summary": "How can she who is so beautiful be with – him? You need not be ashamed of such a superficial reflection. It sounds narrow and judgmental, but there are apologetic psychological explanations.", "title_original": "Därför söker sig inte femmor till nior – så styr utseende våra partnerval", "summary_original": "Hur kan hon som är så snygg vara tillsammans med – honom? Du behöver inte skämmas för en sådan ytlig reflektion. Den låter inskränkt och dömande, men det finns ursäktande psykologiska förklaringar.", "link": "https://www.dn.se/insidan/darfor-soker-sig-inte-femmor-till-nior-sa-styr-utseende-vara-partnerval/", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:41:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 88, "title": "Dadgostar: Billionaires have bought Svantesson", "summary": "Nooshi Dadgostar claims that Sweden's billionaires have bought Swedish politicians, including Finance Minister Elisabeth Svantesson (M). \"They eat into our democracy,\" says the V leader in the SvD Utfrågningen.", "title_original": "Dadgostar: Miljardärer har köpt Svantesson", "summary_original": "Nooshi Dadgostar hävdar att Sveriges miljardärer har köpt svenska politiker, bland andra finansminister Elisabeth Svantesson (M). ”De äter sig in i vår demokrati”, säger V-ledaren i SvD Utfrågningen.", "link": "https://www.svd.se/a/oEEGa7/nooshi-dadgostar-v-elisabeth-svantesson-ar-kopt-av-miljardarerna", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:36:54+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 89, "title": "Now comes the tax money - that's how it does the most good", "summary": "Now the tax refund starts trickling into the account of those who were quick to declare. The savings economists give tips on how to use the supplement in the best way.", "title_original": "Nu kommer skattepengarna – så gör de mest nytta", "summary_original": "Nu börjar skatteåterbäringen trilla in på kontot för dem som var snabba med att deklarera. Sparekonomerna ger tips på hur du använder tillskottet på bästa sätt.", "link": "https://www.svd.se/a/XMMP8n/nu-kommer-skattepengarna-sa-gor-de-mest-nytta", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:31:12+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 90, "title": "\"What is the problem that the Tidö parties' migration policy is supposed to solve?\"", "summary": "The government's policies make it more difficult for people to become part of society and to integrate, write Christina Merker–Siesjö, founder of and senior advisor to Yalla trappan, a women's cooperative in Rosengård, Malmö, and Ylva Stubbergaard, former university lecturer in political science at Lund University.", "title_original": "”Vilket är problemet som Tidöpartiernas migrationspolitik ska lösa?”", "summary_original": "Regeringens politik gör det svårare för människor att bli en del av samhället och att integreras, skriver Christina Merker–Siesjö, grundare av och senior rådgivare åt Yalla trappan, ett kvinnokooperativ i Rosengård, Malmö, och Ylva Stubbergaard, tidigare universitetslektor i statsvetenskap vid Lunds universitet.", "link": "https://www.sydsvenskan.se/opinion/vilket-ar-problemet-som-tidopartiernas-migrationspolitik-ska-losa/", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 91, "title": "Leader: The most vulnerable foot the bill for Trump's war", "summary": "Two possible effects of the war in Iran: life-threatening water shortages in the Middle East and famine in southern Africa.", "title_original": "Ledare: De mest utsatta tar notan för Trumps krig", "summary_original": "Två möjliga effekter av kriget i Iran: livsfarlig vattenbrist i Mellanöstern och svält i södra Afrika.", "link": "https://www.dn.se/ledare/de-mest-utsatta-tar-notan-for-trumps-krig/", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:20:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 92, "title": "Lovisa, 45: Could safely hand me over to five men", "summary": "A fantasy about group sex took her to a hotel room with five men. \"Empathetic gangbang\" is described as a feminist sex practice where it is the woman's boundaries and desire that govern.", "title_original": "Lovisa, 45: Kunde tryggt ge mig hän åt fem män", "summary_original": "En fantasi om gruppsex tog henne till ett hotellrum med fem män. ”Empatiskt gangbang” beskrivs som en feministisk sexpraktik där det är kvinnans gränser och lust som styr.", "link": "https://www.svd.se/a/Gx358V/kvinnor-koar-for-empatiskt-gangbang", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:18:07+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Idagsidan"]}, {"id": 93, "title": "Rapper Offset shot - two arrested", "summary": "Rapper Offset has been shot in the city of Hollywood, Florida on Monday evening, according to a spokesperson for the artist.", "title_original": "Rapparen Offset skjuten – två gripna", "summary_original": "Rapparen Offset har skjutits i staden Hollywood i Florida under måndagskvällen, uppger en talesperson för artisten.", "link": "https://www.svd.se/a/XMMPgo/rapparen-offset-skjuten", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:13:01+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 94, "title": "Letter to the editor. Make life easier for us good men", "summary": "LETTER TO THE EDITOR. Our modern society shuts out a whole lot of citizens because they don't see practical solutions but only create obstacles. An impersonal card should be introduced for good men who are not tied to any bank, writes Mari Källman.", "title_original": "Insändare. Gör livet lättare för oss gode män", "summary_original": "INSÄNDARE. Vårt moderna samhälle stänger ute en hel mängd medborgare för att man inte ser praktiska lösningar utan enbart skapar hinder. Ett opersonligt kort bör införas för gode män som inte är knutet till någon bank, skriver Mari Källman.", "link": "https://www.dn.se/insandare/gor-livet-lattare-for-oss-gode-man/", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "Churchgoers kidnapped on Easter Eve - freed by army", "summary": "Seven people were killed in attacks on two churches in central Nigeria", "title_original": "Gudstjänstbesökare kidnappades på påskafton – befriades av armén", "summary_original": "Sju personer dödades vid attacker mot två kyrkor i centrala Nigeria", "link": "https://www.dagen.se/nyheter/gudstjaenstbesoekare-kidnappades-pa-paskafton-befriades-av-armen/10283136", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Chronic migraine sufferer: \"My youth leader said Jesus was always happy\"", "summary": "For Emanuel Almroth, teaching in the Word of Life clashed with reality", "title_original": "Lider av kronisk migrän: ”Min ungdomsledare sa att Jesus alltid var glad”", "summary_original": "För Emanuel Almroth krockade undervisningen i Livets ord med verkligheten", "link": "https://www.dagen.se/livsstil/lider-av-kronisk-migraen-min-ungdomsledare-sa-att-jesus-alltid-var-glad/10245074", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Järva is Sweden's largest unused worldwide mission field", "summary": "If Swedish Christianity wants to contribute to a transformed Sweden, we need to start seeing and strengthening the Christians who are already in our midst, write Patricia Ask, Lars-Gunnar S. Eclundh and Stefan Swärd.", "title_original": "Järva är Sveriges största outnyttjade världsvida missionsfält", "summary_original": "Om svensk kristenhet vill bidra till ett förvandlat Sverige behöver vi börja se och stärka de kristna som redan finns mitt ibland oss, skriver Patricia Ask, Lars-Gunnar S. Eclundh och Stefan Swärd.", "link": "https://www.dagen.se/debatt/jaerva-aer-sveriges-stoersta-outnyttjade-vaerldsvida-missionsfaelt/10134697", "date_display": "2026-04-07", "date_iso": "2026-04-07T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "The pursuit of church unity must not be confused with the pursuit of purity", "summary": "Tobias Hadin has read For a living parish life", "title_original": "Strävan efter kyrkans enhet inte får förväxlas med strävan efter renhet", "summary_original": "Tobias Hadin har läst För ett levande församlingsliv", "link": "https://www.dagen.se/kultur/straevan-efter-kyrkans-enhet-inte-far-foerva lostrand sold for SEK 1,700,000", "summary": "", "title_original": "Fastigheten på Brännmanetsgatan 33 i Bunkeflostrand såld för 1 700 000 kronor", "summary_original": "", "link": "https://www.sydsvenskan.se/fastigheten-pa-brannmanetsgatan-33-i-bunkeflostrand-sald-for-1-700-000-kronor/", "date_display": "2026-04-07", "date_iso": "2026-04-07T01:00:55+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 102, "title": "The suspicions: teenagers would murder the Iran critic for 300,000", "summary": "In September 2025, the front door of the terraced house where the Iranian regime critic Arvin Khoshnood lives in Malmö rings. It's a 16-year-old with a knife and a mission. Arvin Khoshnood is going to die. For years, Khoshnood warned that Iran was using criminal gangs to assassinate and threaten exiled opposition figures. Now charges have been brought against five teenagers suspected of involvement in the attempted murder of him. Here, the Iran critic, who has since been living in a secret location, tells about what happened. Program manager: Maria Hansson Botin.", "title_original": "Misstankarna: tonåringar skulle mörda Irankritikern för 300 000", "summary_original": "I september 2025 ringer det på ytterdörren till radhuset där den iranska regimkritikern Arvin Khoshnood bor i Malmö. Det är en 16-åring med en kniv och ett uppdrag. Arvin Khoshnood ska dö. I åratal varnade Khoshnood för att Iran använder gängkriminella för att mörda och hota oppositionella i exil. Nu har åtal väckts mot fem tonåringar misstänkta för inblandning i mordförsöket på honom. Här berättar Irankritikern, som sedan dess lever på hemlig ort, om vad som hände. Programledare: Maria Hansson Botin.", "link": "https://www.dn.se/podd/spotlight/misstankarna-tonaringar-skulle-morda-irankritikern-for-300-000/", "date_display": "2026-04-06", "date_iso": "2026-04-06T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Artemis has circled the moon - hailed by Trump", "summary": "During the night of Tuesday, the astronauts on the Nasa expedition Artemis II circled the moon - and also experienced a total solar eclipse. US President Donald Trump has also called to congratulate them.", "title_original": "Artemis har rundat månen – hyllas av Trump", "summary_original": "Astronauterna på Nasaexpeditionen Artemis II har under natten till tisdagen rundat månen – och även upplevt en total solförmörkelse. USA:s president Donald Trump har också ringt för att gratulera dem.", "link": "https://www.svd.se/a/L442rR/artemis-ii-rundar-manen", "date_display": "2026-04-06", "date_iso": "2026-04-06T22:56:47+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 104, "title": "WHO halts evacuations from Gaza", "summary": "", "title_original": "WHO stoppar evakueringar från Gaza", "summary_original": "", "link": "https://www.svd.se/a/JOOjm6/who-stoppar-evakueringar-fran-gaza", "date_display": "2026-04-06", "date_iso": "2026-04-06T22:44:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 105, "title": "Comprehension test: Can you master four-letter words?", "summary": "These ten words have only four letters, but can still cause headaches. Are you choosing the correct meaning? The correct explanations come from the dictionaries of the Swedish Academy.", "title_original": "Bildningstest: Klarar du orden på fyra bokstäver?", "summary_original": "De här tio orden har bara fyra bokstäver, men kan ändå orsaka huvudbry. Väljer du den rätta betydelsen? De korrekta förklaringarna kommer från Svenska Akademiens ordböcker.", "link": "https://www.svd.se/a/bOOaxA/bildningstest-klarar-du-orden-pa-fyra-bokstaver", "date_display": "2026-04-06", "date_iso": "2026-04-06T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 106, "title": "That is why we constantly talk about hate and threats", "summary": "The Swede seems to have a great love for word pairs - also if the word pairs in question happen to be about the opposite of such feelings.", "title_original": "Därför talar vi jämt och ständigt om hat och hot", "summary_original": "Svenskan tycks hysa stor kärlek till ordpar – också om ordparen i fråga råkar handla om motsatsen till sådana känslor.", "link": "https://www.svd.se/a/3ppy2L/svenskan-kryllar-av-ordpar-av-samma-ordklass-och-med-en-konjunktion-emellan", "date_display": "2026-04-06", "date_iso": "2026-04-06T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 107, "title": "Was going to look for Easter eggs - three were killed by overturned tree", "summary": "About 50 people took part in an Easter event on Easter Sunday for new mothers, pregnant women and children in a forest near the village of Satrupholm in Mittelangeln municipality in northern Germany. But what was supposed to be a pleasant hunt for Easter eggs among the trees ended in tragedy. The German weather service had warned of strong winds in the area and suddenly a 30 meter high tree fell in the forest. Four people were pinned under the tree. A 21-year-old woman and a 16-year-old girl died at the scene, while the woman's 10-month-old daughter was taken to hospital, where she later died of her injuries. Another 18-year-old girl was seriously injured and was taken to hospital by helicopter. Pictures from the scene after the accident show how Easter eggs and sweets are scattered on the ground next to the overturned tree. - To see such young people lose their lives on a stormy Easter Sunday - no one wants to see that. Easter should be a time of joy and hope. And I think that at present, here in the community, it has become a time of sadness, says Britta Lang, mayor of Mittelangeln.", "title_original": "Skulle leta påskägg – tre dödades av omkullvält träd", "summary_original": "Ett 50-tal personer deltog i ett påskevenemang under påskdagen för nyblivna mödrar, gravida kvinnor och barn i en skog nära byn Satrupholm i Mittelangeln kommun i norra Tyskland. Men det som skulle bli en trevligt jakt på påskägg bland träden slutade i en tragedi. Den tyska vädertjänsten hade varnat för kraftiga vindar i området och plötsligt välte ett 30 meter högt träd i skogen. Fyra personer klämdes fast under trädet. En 21-årig kvinna och en 16-årig flicka dog på platsen, medan kvinnans 10 månader gamla dotter fördes till sjukhus, där hon senare avled av sina skador. Ytterligare en 18-årig flicka skadades allvarligt och fördes till sjukhus med helikopter. På bilder från platsen efter olyckan syns hur påskägg och godis ligger utspridda på marken intill det omkullvälta trädet. –  Att se så unga människor förlora sina liv på en stormig påsksöndag – ingen vill se det. Påsken ska vara en tid av glädje och hopp. Och jag tror att det för närvarande, här i samhället, har blivit en tid av sorg, säger Britta Lang, borgmästare i Mittelangeln.", "link": "https://www.tv4.se/artikel/5fqWEc0ujtozhoRRDb2oVf/skulle-leta-paskaegg-tre-doedades-av-omkullvaelt-traed", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:30:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/tyskland", "/pask"]}, {"id": 108, "title": "New German law: Must seek permission to leave", "summary": "The law change passed many people by. Men between the ages of 17 and 45 must now apply for a permit to leave Germany for longer periods. The change is part of the country's new defense policy, The Guardian reports.", "title_original": "Ny tysk lag: Måste söka tillstånd för att lämna", "summary_original": "Lagändringen gick många förbi. Män mellan 17 och 45 år måste nu ansöka om tillstånd för att få lämna Tyskland under längre perioder. Förändringen är en del av landets nya försvarspolitik, rapporterar  The Guardian .", "link": "https://www.svd.se/a/lnnG63/tyskland-man-maste-ansoka-om-tillstand-for-att-lamna-landet", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:18:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 109, "title": "Netflix price increases illegal according to court", "summary": "Netflix may be forced to pay back money to millions of customers. This after an Italian court ruled on Good Friday that four price increases were illegal.", "title_original": "Netflix prishöjningar olagliga enligt domstol", "summary_original": "Netflix kan tvingas betala tillbaka pengar till miljontals kunder. Detta efter att en italiensk domstol på långfredagen slog fast att fyra prishöjningar var olagliga.", "link": "https://www.svd.se/a/K880Ve/netflix-prishojningar-olagliga-kan-tvingas-betala-tillbaka", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:17:43+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 110, "title": "The names are pointed out before the election - Trump Jr is ratas", "summary": "An astronaut against a vaccine skeptic – or two previously familiar faces. Already now it is possible to see who can be pitted against each other in the US presidential election in 2028. And there is a common problem for both sides, believes a political scientist.", "title_original": "Namnen pekas ut inför valet – Trump Jr ratas", "summary_original": "En astronaut mot en vaccinskeptiker – eller två sedan tidigare bekanta ansikten. Redan nu går det att skönja vilka som kan ställas mot varandra i det amerikanska presidentvalet 2028. Och det finns ett gemensamt problem för båda sidorna, tror en statsvetare.", "link": "https://www.svd.se/a/k007xj/presidentvalet-i-usa-2028-de-pekas-ut-som-kandidater", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:17:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 111, "title": "Pride colors are being removed from streets in the United States", "summary": "DALLAS. Recently, the four crosswalks in Oak Lawn were colorful. Now they're black and white, with some paint left over that the road workers couldn't remove. In several states, pride-patterned crosswalks are now being removed by order of the Trump administration.", "title_original": "Pridefärger tas bort på gator i USA", "summary_original": "DALLAS. Nyss var de fyra övergångsställena i Oak Lawn färgglada. Nu är de svarta och vita, med lite färgrester kvar som vägarbetarna inte fick bort. I flera delstater tas nu pridemönstrade övergångsställen bort på order av Trumpadministrationen.", "link": "https://www.dn.se/varlden/pridefarger-tas-bort-pa-gator-i-usa/", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:01:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Several to hospital after mass crash in fog", "summary": "Five people were taken to hospital after a multi-car accident on the E22 in Blekinge, where road users reported suddenly having limited visibility as strong winds blew around sand.", "title_original": "Flera till sjukhus efter masskrock i dis", "summary_original": "Fem personer fördes till sjukhus efter en olycka med många bilar på E22 i Blekinge, där trafikanter vittnade om plötsligt begränsad sikt när kraftiga vindar blåste runt sand.", "link": "https://www.sydsvenskan.se/sverige/atta-till-sjukhus-efter-masskrock-i-dis/", "date_display": "2026-04-06", "date_iso": "2026-04-06T20:00:01+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Several dead in attack on Gaza", "summary": "At least ten people have died after an Israeli attack on a camp in Gaza, fighting on the ground ahead of the attack.", "title_original": "Flera döda i attack mot Gaza", "summary_original": "Åtminstone tio personer har dött efter ett israeliskt anfall mot ett läger i Gaza, och strider på marken inför anfallet.", "link": "https://www.sydsvenskan.se/varlden/flera-doda-i-attack-mot-gaza/", "date_display": "2026-04-06", "date_iso": "2026-04-06T19:50:55+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "British seals have developed a taste for dolphin", "summary": "Gray seal attacks on dolphins in British waters could become more common. Scientists believe that the seals began to like the taste of dolphin after they ate seal pups. - We will see more and more of it, says one of the researchers to The Telegraph.", "title_original": "Brittiska sälar har fått smak för delfin", "summary_original": "Gråsälsattacker mot delfiner i brittiska vatten kan bli allt vanligare. Forskare menar att sälarna börjat tycka om smaken av delfin efter att de ätit sälungar. – Vi kommer att se mer och mer av det, säger en av forskarna till The Telegraph.", "link": "https://www.dn.se/varlden/brittiska-salar-har-fatt-smak-for-delfin/", "date_display": "2026-04-06", "date_iso": "2026-04-06T19:44:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Artemis sets a new record on the way around the moon", "summary": "The astronauts of the Artemis II expedition have now been further from Earth than any human before.", "title_original": "Artemis sätter nytt rekord på vägen runt månen", "summary_original": "Astronauterna i expedition Artemis II har nu befunnit sig längre bort från jorden än någon människa tidigare.", "link": "https://www.sydsvenskan.se/varlden/artemis-har-rundat-manen-satter-nytt-rekord/", "date_display": "2026-04-06", "date_iso": "2026-04-06T19:28:21+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Trump's new Iran threat: We'll see what happens", "summary": "Donald Trump repeats his threats to knock out \"the whole of Iran\", and says it could happen as early as Wednesday night.  - They have until tomorrow. We will see what happens, says the President of the United States.", "title_original": "Trumps nya Iran-hot: Vi får se vad som händer", "summary_original": "Donald Trump upprepar sina hot om att slå ut ”hela Iran”, och säger att det kan ske redan under natten till onsdagen.  – De har till i morgon på sig. Vi får se vad som händer, säger USA:s president.", "link": "https://www.sydsvenskan.se/varlden/trumps-nya-iran-hot-vi-far-se-vad-som-hander/", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:53:04+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Netanyahu appeals to Trump to continue the war", "summary": "JERUSALEM. In a phone call on Sunday evening, Benjamin Netanyahu is said to have pleaded with Donald Trump not to accept Iran's terms for a ceasefire. Above all, the Prime Minister asked his partner not to end the war until Iran hands over its enriched uranium.", "title_original": "Netanyahu vädjar till Trump att fortsätta kriget", "summary_original": "JERUSALEM. I ett telefonsamtal på söndagskvällen ska Benjamin Netanyahu ha vädjat till Donald Trump att inte godta Irans villkor för ett eld-upphör. Framför allt bad premiärministern sin partner att inte avsluta kriget förrän Iran lämnat ifrån sig sitt anrikade uran.", "link": "https://www.dn.se/varlden/netanyahu-vadjar-till-trump-att-fortsatta-kriget/", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:43:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Hungarian security expert: This is how Russia is trying to secure Orbán's election victory", "summary": "BUDAPEST. Viktor Orbán's Hungarian government is a strategic asset for Moscow within the EU and NATO by blocking sanctions and military aid to Ukraine. - Therefore, Russia is trying to secure Orbán's continued hold on power with various influence operations, says security policy expert András Rácz.", "title_original": "Ungersk säkerhetsexpert: Så försöker Ryssland säkra Orbáns valseger", "summary_original": "BUDAPEST. Viktor Orbáns ungerska regering är en strategisk tillgång för Moskva inom EU och Nato genom att blockera sanktioner och militärt stöd till Ukraina. – Därför försöker Ryssland med olika påverkansoperationer säkra Orbáns fortsatta maktinnehav, säger den säkerhetspolitiska experten András Rácz.", "link": "https://www.dn.se/varlden/ungersk-sakerhetsexpert-sa-forsoker-ryssland-sakra-orbans-valseger/", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:32:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Orion breaks space record", "summary": "Now the astronauts aboard the Orion capsule have set a new record - and are further away from Earth than any human has ever been before.", "title_original": "Orion slår rymdrekord", "summary_original": "Nu har astronauterna ombord på Orionkapseln satt nytt rekord – och är längre bort från jorden än vad någon människa någonsin har varit tidigare.", "link": "https://www.dn.se/varlden/orion-slar-rymdrekord/", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:28:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "The astronauts circle the moon - set space records", "summary": "It is historic on many levels, not least because it is the first time in over 50 years that humans have been as close to the moon as the four astronauts aboard Artemis 2 are right now. This week Reid Wiseman, Victor Glover, Christina Koch and Jeremy Hansen took off from Earth and now during Monday evening the expedition is expected to circle the moon.  Not only will they break records and become the people who have gone the farthest from Earth of all people, but they will also take photographs and do studies and they will experience a solar eclipse because the moon ends up between them and the sun, says space writer Miranda Jäderling.  Before the critical moment: \"Houston has prepared\" For 40 minutes the capsule will have no contact with the Earth and will be in radio shadow and at the same time the astronauts will be the people who have gone the farthest from home of all people who have ever lived. They have already beaten Apollo 13's previous record from 1970. But at the same time, we are well prepared for it. Ground control in Houston has prepared for this gap, says Miranda Jäderling.  The space race is back Like the Apollo missions of the 60s, the United States is now set on putting man on the moon again. Artemis 2 is estimated to come as close as about 650 miles from the moon's surface, but no closer than that. Future Artemis voyages must take on that challenge. However, they are not alone in that idea, because China also has ambitious plans to walk on the moon. So much of the experiments and checks now are preparatory. Spacesuits are tested and geology is studied before the next expedition. And ultimately the goal is to establish a space base on the moon.  The space base is the latter, but next after Artemis 2, the idea is for the first woman to walk on the moon as early as 2028. China is aiming for sometime before 2030. Who will be first remains to be seen.", "title_original": "Astronauterna rundar månen – sätter rymdrekord", "summary_original": "Det är historiskt på många plan, inte minst eftersom det är första gången på över 50 år som människor är så nära månen som de fyra astronauterna ombord Artemis 2 är just nu. I veckan lyfte Reid Wiseman, Victor Glover, Christina Koch och Jeremy Hansen från jorden och nu under måndagskvällen väntas expeditionen runda månen.  Inte nog med att de slår rekord och blir de människor som tagit sig längst bort från jorden av alla människor, men de ska också ta fotografier och göra studier och de kommer uppleva en solförmörkelse eftersom månen hamnar mellan dem och solen, säger rymdskribenten Miranda Jäderling.  Inför kritiska momentet: ”Houston har förberett sig” I 40 minuter kommer kapseln inte ha någon kontakt med jorden och befinna sig i radioskugga och samtidigt kommer astronauterna vara de människor som tagit sig allra längst hemifrån av alla människor som någonsin levt. De har redan slagit Apollo 13s tidigare rekord från 1970. Men samtidigt är vi väl förberedda på det. Markkontrollen i Houston har förberett sig på den här luckan, säger Miranda Jäderling.  Rymdkapplöpningen är tillbaka Likt 60-talets Apollo-uppdrag är nu USA åter inställda på att sätta människan på månen igen. Artemis 2 beräknas komma så nära som cirka 650 mil från månens yta, men inte närmre än så. Den utmaningen får kommande Artemis-resor anta. Dock är de inte ensamma om den idén, för även Kina har ambitiösa planer om att gå på månen. Så mycket av experimenten och kontrollerna nu är i förberedande syfte. Man testar rymddräkter och studerar geologin inför nästa expedition. Och i slutändan är målet att etablera en rymdbas på månen.  Rymdbasen hör till det senare, men härnäst efter Artemis 2 är tanken att den första kvinnan ska gå på månen redan 2028. Kina siktar på någon gång före 2030. Vem som blir först återstår att se.", "link": "https://www.tv4.se/artikel/4PsJIGOwrddXtZT3dX6VNB/artemis-2-slar-rekord-astronauter-rundar-manen-i-natt", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:23:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/manen", "/rymden"]}, {"id": 121, "title": "The concert hall would unite society beyond class", "summary": "Symphonic music was for a long time a matter exclusively for the bourgeoisie. But with thoughts about getting workers to listen to \"valuable music\", the need for a concert hall in Stockholm emerged.", "title_original": "Konserthuset skulle ena samhället bortom klass", "summary_original": "Symfonisk musik var länge en angelägen­het enbart för borgerlig­heten. Men med tankar om att få arbetare att lyssna på ”värdefull musik” växte behovet av ett konserthus i Stock­holm fram.", "link": "https://www.svd.se/a/Pddm7p/sa-kom-100-aringen-stockholms-konserthus-till", "date_display": "2026-04-06", "date_iso": "2026-04-06T18:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 122, "title": "DN Debate. \"Why don't electricity customers get their money back?\"", "summary": "DN DEBATE. Today, those who already pay the most for their electricity are forced to contribute more to common investments for which everyone should pay the same amount. But it doesn't have to look like this, in other countries the same surplus is returned back into the customers' pockets. Right now there is a chance to change the system - the government must take it, writes Mats Nilsson, docent in environmental economics.", "title_original": "DN Debatt. ”Varför får inte elkunderna tillbaka sina pengar?”", "summary_original": "DN DEBATT. I dag tvingas de som redan betalar mest för sin el att bidra mer till gemensamma investeringar som alla borde betala lika mycket för. Men det måste inte se ut så här, i andra länder återförs samma överskott tillbaka ner i kundernas fickor. Just nu finns en chans att förändra systemet – regeringen måste ta den, skriver Mats Nilsson, docent i miljöekonomi.", "link": "https://www.dn.se/debatt/varfor-far-inte-elkunderna-tillbaka-sin
