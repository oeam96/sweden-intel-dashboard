 sig på backspeglar tidigare. – Generellt är det väl så att det finns en efterfrågan. De är ju dyra, de här glasen. Söker vittnesmål Polisen uppmanar allmänheten att höra av sig med information om misstänkta gärningsmän.  De är särskilt intresserade av iakttagelser från Stocksund natten mellan den 11 och 12 mars samt i Ella park i Täby  natten mellan 15 och 16 mars.  Om man har en BMW bör man vara försiktig med var man parkerar, enligt Mats Eriksson. – Försök att parkera bilen på ett omsorgsfullt sätt. Har du ett garage kan du parkera i garaget. Jag förstår att alla inte har ett garage men man kan i alla fall försöka försvåra för tjuvarna. Fyra gripna Under tisdagskvällen meddelade polisen att fyra personer gripits för backspegelstölder. ”Bland annat med hjälp av de bilder som inkommit från övervakningskameror har fyra misstänkta gärningsmän kunnat identifieras och efter en spaningsinsats kunde alla fyra gripas under kvällen på en plats i Sigtuna kommun. Vid gripandet har även visst stöldgods kunnat säkras”, skriver polisen på sin hemsida. Samtliga är omkring 30 år och de misstänks nu för grov stöld.\n\n”Trots gripandet kvarstår polisens önskemål om att personer i berörda områden går igenom sina övervakningskameror eftersom det är av vikt för den fortsatta utredningen”, skriver polisen.", "link": "https://www.tv4.se/artikel/5CTaBfjYnenNuSc0lVQMT5/fyra-gripna-efter-omfattande-stoelder-av-backspeglar", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:34:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/bmw", "/brott-och-straff", "/stold", "/brott"]}, {"id": 105, "title": "Depressed mood at the vigil: \"Didn't think it would be so bad\"", "summary": "Inside the Social Democratic Party's election vigil, the mood was depressed after the first polling station polls, which pointed to the party heading for a historically bad election - the lowest since 1901. - I don't think it's fair, says Jytte Andersen (S).", "title_original": "Tryckt stämning på valvakan: ”Trodde inte det skulle bli så illa”", "summary_original": "Inne på Socialdemokratiets valvaka var stämningen tryckt efter de första vallokalsundersökningarna, som pekade mot att partiet skulle gå mot ett historiskt dåligt val – det lägsta sedan 1901. – Jag tycker inte att det är rättvist, säger Jytte Andersen (S).", "link": "https://www.dn.se/varlden/tryckt-stamning-pa-valvakan-trodde-inte-det-skulle-bli-sa-illa/", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:22:14+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "Leksand leaves the SHL - after extension drama", "summary": "The audience did not dare to come. The lifelines ran out. Leksand lost the fourth game in the anxiety qualifier against HV71, after extra time, and leaves the SHL after seven years.", "title_original": "Leksand åker ur SHL – efter förlängningsdrama", "summary_original": "Publiken vågade inte komma. Livlinorna tog slut. Leksand förlorade den fjärde matchen i ångestkvalet mot HV71, efter förlängning, och åker ur SHL efter sju år.", "link": "https://www.dn.se/sport/leksand-aker-ur-shl-efter-forlangningsdrama/", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:10:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "Sources: Sent peace plan to Iran", "summary": "15 points • Trump: Has received a \"very large gift\"", "title_original": "Källor: Skickat fredsplan till Iran", "summary_original": "15 punkter • Trump: Har fått en ”väldigt stor present”", "link": "https://www.tv4.se/artikel/7bOxXZlfLszc2cJUJecwsl/kaellor-usa-har-skickat-en-fredsplan-pa-15-punkter-till-iran", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:08:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 108, "title": "Leksand leaves the SHL after extension", "summary": "", "title_original": "Leksand åker ur SHL efter förlängning", "summary_original": "", "link": "https://www.svd.se/a/oEEWrB/leksand-aker-ur-shl-efter-forlangning", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:03:55+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 109, "title": "Trumps ”Mission accomplished”?", "summary": "How will Donald Trump end the war in Iran?  Here's a domestic political lesson from one of the US wars against Iraq: An American president can win the war, but still lose the election.", "title_original": "Trumps ”Mission accomplished”?", "summary_original": "Hur ska Donald Trump avsluta kriget i Iran?  Här en inrikespolitisk läxa från ett av USA:s krig mot Irak: En amerikansk president kan vinna kriget, men ändå förlora valet.", "link": "https://www.svd.se/a/2p5Qw4/sa-kan-trump-avsluta-kriget-laxan-fran-familjen-bushs-krig-i-irak", "date_display": "2026-03-24", "date_iso": "2026-03-24T21:03:31+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 110, "title": "The expert's verdict: \"A historic disaster for social democracy\"", "summary": "Doesn't hold again - after the fiasco election in Denmark", "title_original": "Expertens dom: ”En historisk katastrof för socialdemokratin”", "summary_original": "Håller inte igen – efter fiaskovalet i Danmark", "link": "https://www.tv4.se/artikel/64mRU8zbkgDYwhdftl9FSP/expertens-dom-en-historisk-katastrof-foer-socialdemokratin", "date_display": "2026-03-24", "date_iso": "2026-03-24T20:53:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 111, "title": "Iran ready to open to \"non-hostile\" ships", "summary": "", "title_original": "Iran redo öppna för ”icke-fientliga” fartyg", "summary_original": "", "link": "https://www.svd.se/a/7ppdz4/iran-redo-oppna-for-begransad-trafik-genom-hormuz", "date_display": "2026-03-24", "date_iso": "2026-03-24T20:36:30+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 112, "title": "Leksand leaves the SHL after a chaotic match - HV71 remains", "summary": "No team in Swedish ice hockey has managed to turn a 0–3 deficit into a 4–3 victory in matches in either the SC playoffs or the SHL's qualifying games. Nor did Leksand succeed in the relegation qualifier against HV71. The Dala team lost the fourth straight game with 1–2 after extra time. The away team's Lukáš Rousek sent Leksand down in the Hockey Allsvenskan next season. There are probably few who know how it feels to be involved in this situation. An incredibly tough moment, says Johan Hedberg to TV4. \"Tough to go here\" Before the fateful match, Leksand has had problems filling the home base. Many people have a heart for Leksand and find it difficult to go here. That is probably what makes us want to fill the arena as much as possible, said acting club director Peter Wiklund to Falu-Kuriren before the match. The 6,668 spectators who made it there got to see a position war in the first period. With 15 seconds left in the middle period, Leksand took the lead through Michael Lindqvist. And that seemed to be enough for Leksand. But with 10 seconds left in regular time, HV's Hugo Pettersson scored the 1-1 goal. And the rest is history. A proper fight Leksand did not leave the SHL without a proper fight. In the middle of the third period, HV71's William Ignberg Nilsson ended up in Leksand's box. Several Leksands players then jumped on Ignberg Nilsson, while the away players threw themselves in to protect their teammate. It ended with eight expulsion minutes for HV71 and four for Leksand. The exodus means a massive financial loss for Leksand. In the SHL, the teams receive around SEK 50 million per season from television and advertising rights. The corresponding amount in the hockey Allsvenskan is around five million kroner. For HV71, it is the third season in a row that the team manages to stay in the SHL through victory in the relegation qualifier. An incredible effort by everyone around the club. It's so damn nice, says HV71's goalkeeper Felix Sandström to TV4.", "title_original": "Leksand åker ur SHL efter kaosmatch – HV71 hänger kvar", "summary_original": "Inget lag i svensk ishockey har lyckats vända 0–3-underläge till seger 4–3 i matcher i varken SM-slutspel eller i SHL:s kvalspel. Inte heller Leksand lyckades i nedflyttningskvalet mot HV71. Dalalaget förlorade den fjärde raka matchen med 1–2 efter förlängningen. Bortalagets Lukáš Rousek skickade ner Leksand i hockeyallsvenskan nästa säsong. Det är nog få som vet hur det känns att vara med i den här situationen. Ett oerhört tufft ögonblick, säger Johan Hedberg till TV4. ”Jobbigt att gå hit” Inför ödesmatchen har Leksand haft problem att fylla hemmaborgen. Många har ju liksom hjärtat för Leksand och tycker att det är jobbigt att gå hit. Det är väl det som gör att vi vill fylla arenan så mycket som möjligt, sade tillförordnade klubbdirektör Peter Wiklund till Falu-Kuriren inför matchen. De 6 668 åskådare som tog sig dit fick se ett ställningskrig i den första perioden. Med 15 sekunder kvar av mittenperioden tog Leksand ledningen genom Michael Lindqvist. Och det såg länge ut att räcka för Leksand. Men med 10 sekunder kvar av ordinarie tid satte HV:s Hugo Pettersson in 1–1-målet. Och resten är historia. Ordentligt slagsmål Leksand åkte inte ur SHL utan ett ordentligt slagsmål. I mitten av den tredje perioden hamnade HV71:s William Ignberg Nilsson i Leksands bås. Flera Leksandsspelare hoppade sedan på Ignberg Nilsson, samtidigt som bortaspelarna kastade sig in för att skydda sin lagkamrat. Det slutade med åtta utvisningsminuter för HV71 och fyra för Leksand. Uttåget innebär en massiv ekonomisk förlust för Leksand. I SHL får lagen runt 50 miljoner kronor per säsong från tv- och reklamrättigheter. Motsvarande summa i hockeyallsvenskan är omkring fem miljoner kronor. För HV71 är det tredje säsongen i följd som laget klarar sig kvar i SHL genom seger i nedflyttningskvalet. Ett oerhört slit av allihopa runt i klubben. Det är så jäkla skönt, säger HV71:s målvakt Felix Sandström till TV4.", "link": "https://www.tv4.se/artikel/tt-260324-shl1-a09d9a41/leksand-aker-ur-shl-forlorade-efter-forlangning", "date_display": "2026-03-24", "date_iso": "2026-03-24T20:07:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/sverige", "/dalarna", "/leksand", "/ishockey", "/shl-kval", "/shl"]}, {"id": 113, "title": "\"I think my children's immune system can handle measles\"", "summary": "SPARTANBURG. Measles was recently eradicated in the United States. Now over a thousand people have been infected and the outbreak is the worst in decades. Ground zero is Spartanburg county in South Carolina. - I have not vaccinated any of my children, says mother of three Katlyn.", "title_original": "”Tror mina barns immunförsvar klarar mässling”", "summary_original": "SPARTANBURG. Nyligen var mässling utrotad i USA. Nu har över tusen personer smittats och utbrottet är det värsta på decennier. Ground zero är Spartanburg county i South Carolina. – Jag har inte vaccinerat något av mina barn, säger trebarnsmamman Katlyn.", "link": "https://www.dn.se/varlden/tror-mina-barns-immunforsvar-klarar-masslingen/", "date_display": "2026-03-24", "date_iso": "2026-03-24T20:03:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Drama in the North Atlantic – Russian tankers towards Cuba", "summary": "The 250 meter long and 46 meter wide Russian-flagged crude oil tanker Anatoly Kolodkin is on its way across the North Atlantic to the Caribbean - where the US maintains an oil embargo against Cuba.", "title_original": "Drama på Nordatlanten – rysk tanker mot Kuba", "summary_original": "250 meter långa och 46 meter breda ryskflaggade råoljetankern Anatoly Kolodkin är på väg över Nordatlanten mot Karibien – där USA upprätthåller ett oljeembargo mot Kuba.", "link": "https://www.svd.se/a/aJJ7K7/drama-pa-nordatlanten-rysk-tanker-mot-kuba", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:59:22+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 115, "title": "Trump: Received \"very large gift\" from Iran", "summary": "President Donald Trump states that the US is in negotiations with Iran \"at this point\". He also cryptically says that the US received a \"gift\" from Iran.", "title_original": "Trump: Fått ”väldigt stor present” av Iran", "summary_original": "President Donald Trump uppger att USA ligger i förhandlingar med Iran ”i detta nu”. Han säger också kryptiskt att USA fått en ”present” av Iran.", "link": "https://www.svd.se/a/7ppdwW/trump-fatt-valdigt-stor-present-av-iran", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:44:53+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 116, "title": "Trump to Iran: Disarm and avoid all sanctions", "summary": "JERUSALEM. Israeli media on Tuesday night quoted sources close to the White House revealing the most important parts of the 15-point program that the United States shared with Iran. Donald Trump sees the points as \"basis for talks\".", "title_original": "Trump till Iran: Nedrusta och slipp alla sanktioner", "summary_original": "JERUSALEM. Israeliska medier citerade på tisdagskvällen källor nära Vita huset som avslöjar de viktigaste delarna i det 15-punktsprogram som USA delgivit Iran. Donald Trump ser punkterna som ”underlag för samtal”.", "link": "https://www.dn.se/varlden/trump-till-iran-nedrusta-och-slipp-alla-sanktioner/", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:31:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Expert: Iran's new leader waits out the storm", "summary": "Although no one has seen or heard from Iran's leader Mojtaba Khamenei since the first attack on February 28 when his father was killed, statements from him keep coming. That he stays away is both a way to avoid being killed himself, but can also be part of a tactic in asymmetric warfare, says Iran expert Mohammad Fazlhashemi. Khamenei may emerge from the shadows the day Iran gets through the war.", "title_original": "Expert: Irans nye ledare väntar ut stormen", "summary_original": "Trots att ingen sett eller hört Irans ledare Mojtaba Khamenei efter det första anfallet den 28 februari då hans far dödades, kommer det hela tiden uttalanden från honom. Att han håller sig undan är både ett sätt att undvika att själv bli dödad, men kan också vara en del av en taktik i en asymmetrisk krigföring, menar Iranexperten Mohammad Fazlhashemi. Khamenei kan träda fram ur skuggorna den dag Iran tagit sig igenom kriget.", "link": "https://www.dn.se/varlden/expert-irans-nye-ledare-vantar-ut-stormen/", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:29:19+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "West Swedish woman deceived by \"Brian May\" - herself convicted of money laundering", "summary": "A female ex-politician in Western Sweden in her 70s is sentenced in the district court for money laundering. This after handling several thousand kroner that turned out to be from fraud. The money was deposited into her account and then transferred. It started with a contact on the internet. A person pretending to be rock star Brian May from the band Queen contacted the woman. Soon she was involved in what she thought was a charity fundraiser for Gaza. Via Skype, emails and chats, she received instructions about receiving money - and passing it on. But the money did not come from generous donors. Then the woman realized that she had been taken advantage of. Instead, it was about people who had been tricked into transferring their savings. In total, it is about SEK 67,000 that passed through the woman's account. According to the verdict, the woman says that she \"assumed that there were people who donated money\" and that she did not understand that she had been exploited until January 2025. She also states that she herself contributed money to the project. Her bank contacted her in November 2024 and closed her account, and the woman sent a final payment to a person who would be Brian May's secretary. The bank also allegedly urged her to report the incident to the police, but she still believed she was talking to the Queen member and that the bank isn't always right. Only a few months later did she realize that she had been deceived. The district court: Doesn't buy it But the district court doesn't fully buy the explanation. The court ruled that the story of a world artist raising money via cryptocurrency is \"so unlikely that most people would have realized\" that something was amiss. At the same time, it is not possible to prove that the woman had criminal intent. Instead, she is convicted of money laundering offenses - because she is considered to have had \"reasonable reason\" to suspect that the money came from crime. The punishment for the woman will be a suspended sentence and a fine. She must also pay back money to those affected", "title_original": "Västsvensk kvinna lurad av ”Brian May” – döms själv för penningtvätt", "summary_original": "En kvinnlig ex-politiker i Västsverige i 70-årsåldern döms i tingsrätten för penningtvättsförseelse. Detta efter att ha hanterat flera tusen kronor som visat sig komma från bedrägerier. Pengarna sattes in på hennes konto och fördes därefter vidare. Det började med en kontakt på internet. En person som utgav sig för att vara rockstjärnan Brian May från bandet Queen tog kontakt med kvinnan. Snart var hon indragen i vad hon själv trodde var en välgörenhetsinsamling för Gaza. Via Skype, mejl och chattar fick hon instruktioner om att ta emot pengar – och föra dem vidare. Men pengarna kom inte från givmilda donatorer. Då förstod kvinnan att hon blivit utnyttjad I stället handlade det om personer som lurats att föra över sina besparingar. Totalt rör det sig om drygt 67 000 kronor som passerade kvinnans konto. Enligt domen säger kvinnan att hon ”utgick från att det var personer som skänkte pengar” och att hon inte förstod att hon blivit utnyttjad förrän i januari 2025. Hon uppger också att hon själv bidrog med pengar till projektet. Hennes bank kontaktade henne i november 2024 och stängde ner hennes konto, och kvinnan skickade en sista betalning till en person som skulle vara Brian Mays sekreterare. Banken ska också ha uppmanat henne att polisanmäla händelsen, men hon trodde fortfarande att hon pratade med Queen-medlemmen och att banken inte alltid har rätt. Först några månader senare insåg hon att hon blivit lurad. Tingsrätten: Köper det inte Men tingsrätten köper inte förklaringen fullt ut. Domstolen slår fast att historien om en världsartist som samlar in pengar via kryptovaluta är ”så osannolik att de flesta skulle ha insett” att något inte stod rätt till. Samtidigt går det inte att bevisa att kvinnan haft ett brottsligt uppsåt. I stället döms hon för penningtvättsförseelser – eftersom hon anses ha haft ”skälig anledning” att misstänka att pengarna kom från brott. Straffet för kvinnan blir villkorlig dom och böter. Hon måste också betala tillbaka pengar till de drabbade. TV4 Nyheterna söker kvinnan.", "link": "https://www.tv4.se/artikel/2DCl98TWQPWtWAe2a9PuBf/ex-politiker-lurad-av-falska-queen-stjaernan-nu-doems-hon-sjaelv", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:17:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/bedragerier", "/gaza"]}, {"id": 119, "title": "Becoming wave master: \"Perfect position\"", "summary": "All the votes in the Danish election have been counted - now a complicated government formation begins. Lars Løkke Rasmussen gets a coveted role as wave master.  \"No one will be able to form a government without him,\" says a political scientist.", "title_original": "Blir vågmästare: ”Perfekt position”", "summary_original": "Alla röster i det danska valet är räknade – nu börjar en komplicerad regeringsbildning. Lars Løkke Rasmussen får en eftertraktad roll som vågmästare.  ”Ingen kommer kunna bilda regering utan honom”, säger en statsvetare.", "link": "https://www.svd.se/a/PddyQ7/mette-frederiksen-gar-mot-historiskt-tapp", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:15:29+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 120, "title": "The king of the forest in the firing line", "summary": "Once almost extinct, then more numerous than ever – and now threatened again: today the Swedish moose was redlisted by the Artdatabanken. At the intersection of myth, hunting and forestry, the next chapter of our more than 8,000-year coexistence is decided.", "title_original": "Skogens konung i skottlinjen", "summary_original": "En gång nästan utrotad, sedan mångtaligare än någonsin – och nu hotad igen: i dag rödlistades den svenska älgen av Artdatabanken. I skärningspunkten mellan myt, jakt och skogsbruk bestäms nästa kapitel för vår mer än 8 000-åriga samexistens.", "link": "https://www.svd.se/a/wrrEgL/skogens-konung-i-skottlinjen", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Under strecket", "Kultur"]}, {"id": 121, "title": "What does this walk they talk about mean?", "summary": "Representatives of the Tidö collaboration presented at a press conference a legal council referral on vandalism as a requirement for a residence permit. The vandels issue has been one of the issues that the government pursues that has been discussed the most. But what does the word vandel mean?", "title_original": "Vad betyder denna vandel de pratar om?", "summary_original": "Företrädare för Tidösamarbetet presenterade på en presskonferens en lagrådsremiss om vandel som krav på uppehållstillstånd. Vandelsfrågan har varit en av de frågor som regeringen driver som har diskuterats mest. Men vad betyder ordet vandel?", "link": "https://www.svd.se/a/y5543x/vad-betyder-denna-vandel-de-pratar-om", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:05:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Politik"]}, {"id": 122, "title": "Løkke wave master after the Danish election", "summary": "The governing parties are backing down in the Danish election, and Lars Løkke Rasmussen's party the Moderates once again looks to be the wave master.", "title_original": "Løkke vågmästare efter danska valet", "summary_original": "Regeringspartierna backar i danskt val, och Lars Løkke Rasmussens parti Moderaterne ser återigen ut att bli vågmästare.", "link": "https://www.svd.se/a/2pp8wB/historiskt-daligt-val-for-s", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:03:58+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 123, "title": "Ukraine: 6,000 Russians dead in 'meat grinder attacks'", "summary": "Over 6,000 Russian soldiers have been killed or injured in just a few days in Russian \"meat grinder attacks\" in eastern Ukraine, Ukraine's Defense Minister Oleksandr Syrskyi claims. But according to military expert Jörgen Elfving, Russia has not launched a spring offensive. - It's the usual Russian nudge, he says.", "title_original": "Ukraina: 6 000 döda ryssar i ”köttkvarnsattacker”", "summary_original": "Över 6 000 ryska soldater har dött eller skadats på bara några dagar i ryska ”köttkvarnsattacker” i östra Ukraina, hävdar Ukrainas ÖB Oleksandr Syrskyj. Men enligt militärexpert Jörgen Elfving har inte Ryssland inlett någon våroffensiv. – Det är det vanliga ryska duttandet, säger han.", "link": "https://www.dn.se/varlden/ukraina-6-000-doda-ryssar-i-kottkvarnsattacker/", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:02:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "DN Debate. \"Answering like a parrot is not 'taking responsibility'\"", "summary": "DN DEBATE. How many times can you really \"take responsibility\"? The Liberals' Simona Mohamsson did it 21 times in 16 minutes. Contrary to what people think, good media training is about giving real answers - not serving platitudes and clichés. Politicians must be able to show their constituents the basic respect, writes communications advisor Anna Helsén.", "title_original": "DN Debatt. ”Att svara som en papegoja är inte att ’ta ansvar’”", "summary_original": "DN DEBATT. Hur många gånger kan man ”ta ansvar” egentligen? Liberalernas Simona Mohamsson gjorde det 21 gånger på 16 minuter. Tvärtemot vad folk tror handlar bra medieträning om att ge riktiga svar – inte att servera floskler och inkörda fraser. Den grundläggande respekten måste politiker kunna visa sina väljare, skriver kommunikationsrådgivaren Anna Helsén.", "link": "https://www.dn.se/debatt/att-svara-som-en-papegoja-ar-inte-att-ta-ansvar/", "date_display": "2026-03-24", "date_iso": "2026-03-24T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "The US is in talks about more military bases in Greenland", "summary": "Last week, US General Gregory Guillot stated that the US, Denmark and Greenland are discussing the possibility of new US bases on the island. Denmark must also be positive about the idea, reports Berlingske.", "title_original": "USA för samtal om fler militärbaser på Grönland", "summary_original": "Förra veckan uppgav den amerikanska generalen Gregory Guillot att USA, Danmark och Grönland samtalar om möjligheten för nya amerikanska baser på ön. Danmark ska även vara positiv till idén, rapporterar Berlingske.", "link": "https://www.dn.se/varlden/usa-for-samtal-om-fler-militarbaser-pa-gronland/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:46:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "Here the participants are reunited: \"I love meeting Erik again\"", "summary": "Amanda Kniberg has not been able to work since she left \"The Farm\". - I was almost admitted to the nursing home. I felt like crap, she says. When the participants get to invite a close relative to the finals week that they haven't seen for a long time, luckily it turns out that Erik Berg Sijmons has written her up - while the other participants chose people from home. - I miss Amanda so much. It's crazy how you can miss Amanda more than those who are at home, he says. - I'm damn glad you put me as a close relative, she says. First kiss in front of the cameras In the episode, they are seen holding hands, standing close to each other - and for the first time sharing a kiss in front of the cameras. However, the love has not gone unnoticed, either among the participants or the viewers during the season. - I love meeting Erik again. When I left, that's what I was most sad about. Not being able to talk to him when I got home. To be without him, says Amanda Kniberg. Vanessa Salloumova, who is also visited by her boyfriend, states that Erik Berg Sijmons is in love and says that she has seen the participants several times lying in bed cuddling and kissing. Erik Berg Sijmons and Amanda Kniberg are then asked by the production if there is a romance going on. - Maybe, he says. Farmen-Erik and Amanda are a couple today Today we know that the answer to that question was actually yes. Amanda Kniberg has previously told TV4 Nyheterna that she and Erik Berg Sijmons, after the program's recordings, realized that they could not be without each other. The couple live in different parts of the country – she in Riddarhyttan and he in Malmö – and try to meet as often as possible despite the distance. - We match and complement each other very well. And the way he takes care of me and respects me... no, he is very nice to me, she has previously told TV4 Nyheterna.", "title_original": "Här återförenas deltagarna: ”Jag älskar att träffa Erik igen”", "summary_original": "Amanda Kniberg har inte kunnat arbeta sedan hon åkte ur ”Farmen”. – Jag blev nästan inlagd på knäpphemmet. Jag mådde skit, säger hon. När deltagarna får bjuda in en nära anhörig till finalveckan som de inte har sett på länge visar det sig som tur är att Erik Berg Sijmons har skrivit upp henne – medan de andra deltagarna valt personer hemifrån. – Jag saknar Amanda jävligt mycket. Det är sjukt hur man kan sakna Amanda mer än dem som är hemma, säger han. – Jag är jävligt glad att du satte mig som nära anhörig, säger hon. Första kyssen framför kamerorna I avsnittet syns de hålla hand, stå nära varandra – och för första gången dela en kyss framför kamerorna. Kärleken har dock inte passerat någon obemärkt förbi, vare sig bland deltagarna eller tittarna under säsongen. – Jag älskar att träffa Erik igen. När jag åkte ut var det det som jag var mest ledsen över. Att inte kunna prata med honom när jag kom hem. Att vara utan honom, säger Amanda Kniberg. Vanessa Salloumova, som även hon får besök av sin käresta, konstaterar att Erik Berg Sijmons är förälskad och berättar att hon flera gånger har sett deltagarna ligga i sängen och mysa och pussas. Erik Berg Sijmons och Amanda Kniberg får sedan frågan från produktionen om det är en romans på gång. – Kanske, säger han. Farmen-Erik och Amanda är ett par i dag I dag vet vi att svaret på den frågan egentligen var ja. Amanda Kniberg har tidigare berättat för TV4 Nyheterna att hon och Erik Berg Sijmons, efter programmets inspelningar, insåg att de inte kunde vara utan varandra. Paret bor på olika håll i landet – hon i Riddarhyttan och han i Malmö – och försöker träffas så ofta som möjligt trots avståndet. – Vi matchar och kompletterar varandra väldigt bra. Och sättet han tar hand om mig och respekterar mig på… nej, han är väldigt fin mot mig, har hon tidigare sagt till TV4 Nyheterna.", "link": "https://www.tv4.se/artikel/5o8NI9ukUozPcG7g4nijT9/haer-aterfoerenas-deltagarna-jag-aelskar-att-traeffa-erik-igen", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:45:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/tv4-play", "/tv4", "/farmen"]}, {"id": 127, "title": "Sources: US sends 3,000 airborne troops", "summary": "After confusing news about negotiations, Iran now says it has received deal points from the US via mediators. At the same time, the United States plans to send an airborne force of around 3,000 troops to the Middle East, the Wall Street Journal reports, citing sources.", "title_original": "Källor: USA skickar 3 000 luftburna soldater", "summary_original": "Efter förvirrande besked om förhandlingar säger sig Iran nu ha mottagit avtalspunkter från USA via medlare. Samtidigt planerar USA att skicka en luftburen styrka på runt 3 000 soldater till Mellanöstern, rapporterar Wall Street Journal med hänvisning till källor.", "link": "https://www.dn.se/varlden/kallor-usa-skickar-3-000-luftburna-soldater/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:33:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Visitation zone at Östermalm: \"Can search bags\"", "summary": "The diplomatic city in central Stockholm is from now on a security zone for two weeks. This means that the police can stop and body search people without criminal suspicion. The purpose is to strengthen the protection of the embassies of Israel and the United States.", "title_original": "Visitationszon på Östermalm: ”Kan söka igenom väskor”", "summary_original": "Diplomatstaden i centrala Stockholm är från och med nu en säkerhetszon i två veckors tid. Det innebär att polisen kan stoppa och kroppsvisitera personer utan brottsmisstanke. Syftet är att stärka skyddet av Israels och USA:s ambassader.", "link": "https://www.dn.se/sverige/visitationszon-pa-ostermalm-kan-soka-igenom-vaskor/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:27:37+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "The psychologist: That's why many people with autism love to watch anime", "summary": "“Attack on Titan”, “One Piece” and “Jujutsu Kaisen” are popular Japanese cartoons that are watched by people of all ages all over the world. What they and all anime have in common is that they are based on strong and clear stories - something that often suits people with autism well, according to Charlotte Bergström, licensed psychologist and specialist in clinical child and adolescent psychology. A perfect combo She believes that the characters in anime almost act as archetypes for different characteristics, with very clear and sometimes exaggerated facial expressions. - It is grateful for people who in everyday life struggle with reading and understanding subtle signals, she says. In addition to the fact that social interaction can sometimes be challenging for people with autism, they also easily get stuck in various special interests. This means that anime, which is both easy to get absorbed in and often easier to understand than reality, becomes a \"perfect combo\" to take part in, according to Charlotte Bergström. \"Often a bit clever\" Another reason why many with autism are drawn to anime is that it is cartoonish and a bit subtle. - It is often a bit clever and very coded talk. It is quite often about special and different worlds. And you can understand that these people feel quite at home in it - because they feel different, says Charlotte Bergström. She also describes how a strong culture has developed around the series where people with autism find community by sending internal abbreviations, images and messages to each other. - If you think it is difficult to understand and process social impressions in everyday life, with friends or the like, here you can feel that you actually understand and are involved and engaged in the social world, she says. The disadvantages of watching too much According to Charlotte Bergström, however, there is a risk that you only want to be in the fictional world and find it even more difficult to be with real people if you watch too much anime. - In the real world, it can be more", "title_original": "Psykologen: Därför älskar många med autism att titta på anime", "summary_original": "”Attack on Titan”, ”One Piece” och ”Jujutsu Kaisen” är populära japanska tecknade serier som ses av människor i alla åldrar över hela världen. Gemensamt för dem och all anime är att de bygger på starka och tydliga berättelser – något som ofta passar personer med autism bra, enligt Charlotte Bergström, legitimerad psykolog och specialist inom klinisk barn- och ungdomspsykologi. En perfekt kombo Hon menar att karaktärerna i anime nästan fungerar som arketyper för olika egenskaper, med mycket tydliga och ibland överdrivna ansiktsuttryck. – Det är tacksamt för personer som i vardagen kämpar med att avläsa och förstå subtila signaler, säger hon. Förutom att det sociala samspelet ibland kan vara utmanande för personer med autism, fastnar de också lätt i olika specialintressen. Det gör att anime, som både är lätt att bli uppslukad av och ofta enklare att förstå än verkligheten, blir en ”perfekt kombo” att ta del av, enligt Charlotte Bergström. ”Ofta lite klurigt” Ett annat skäl till att många med autism dras till anime är att det just är tecknat och lite underfundigt. – Det är ofta lite klurigt och mycket kodat snack. Det handlar ju ganska ofta om speciella och annorlunda världar. Och det kan man ju förstå att de här personerna känner sig ganska hemma i – för de känner ju sig annorlunda, säger Charlotte Bergström. Hon beskriver också hur det har vuxit fram en stark kultur kring serierna där personer med autism finner gemenskap genom att skicka interna förkortningar, bilder och meddelanden till varandra. – Om du tycker att det är svårt att förstå och bearbeta sociala intryck i vardagen, med kompisar eller så, kan du här få känna att du faktiskt fattar och är delaktig och engagerad i det sociala, säger hon. Nackdelarna med att se för mycket Enligt Charlotte Bergström finns det dock en risk att man bara vill vara i den fiktiva världen och tycka att det blir ännu svårare att vara med verkliga människor om man tittar på för mycket anime. – I den verkliga världen kan det bli ännu jobbigare att behöva vara med folk som beter sig på konstiga sätt, säger hon.", "link": "https://www.tv4.se/artikel/Z2YSK3myb4OdPvNfaEV8S/psykologen-daerfoer-gillar-autister-att-titta-pa-anime", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:16:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/anime", "/psykologi", "/autism"]}, {"id": 130, "title": "Max Hjelm: In this matter, Sweden must listen to Great Britain", "summary": "A report states major security policy risks – we must draw the right conclusions.", "title_original": "Max Hjelm: I den här frågan måste Sverige lyssna på Storbritannien", "summary_original": "En rapport konstaterar stora säkerhetspolitiska risker – vi måste dra rätt slutsatser.", "link": "https://www.dn.se/ledare/max-hjelm-i-den-har-fragan-maste-sverige-lyssna-pa-storbritannien/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:10:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "The football profiles about the fatal shooting in Örebro: \"A great guy\"", "summary": "The sadness is great in Örebro after a 20-year-old man was shot dead this weekend. The victim was a soccer player in a large association and the incident affects many in the sport. - It is tragic. My thoughts go out to his family. It's like a knife into the heart, says former star Jiloan Hamad, who himself played in the same club.", "title_original": "Fotbollsprofilerna om dödsskjutningen i Örebro: ”En jättefin kille”", "summary_original": "Sorgen är stor i Örebro efter att en 20-årig man skjutits ihjäl i helgen. Dödsoffret var fotbollsspelare i en stor förening och händelsen påverkar många inom sporten. – Det är tragiskt. Mina tankar går till hans familj. Det är som en kniv in i hjärtat, säger tidigare stjärnan Jiloan Hamad som själv spelat i samma klubb.", "link": "https://www.dn.se/sport/fotbollsprofilerna-om-dodsskjutningen-i-orebro-en-jattefin-kille/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:06:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "MP politician wanted to help rock star - convicted of money laundering", "summary": "A former MP politician from West Sweden is sentenced against his denial for having laundered money. The woman thought she was helping Queen guitarist Sir Brian May raise money for those in need in Gaza. But the money came from scams and she bought cryptocurrency for it. She also kept a few thousand Swedish kroner herself.", "title_original": "MP-politiker ville hjälpa rockstjärna – döms för att tvätta pengar", "summary_original": "En tidigare MP-politiker från Västsverige döms mot sitt nekande för att ha tvättat pengar. Kvinnan trodde att hon hjälpte Queen-gitarristen sir Brian May att samla in pengar till nödställda i Gaza. Men pengarna kom från bedrägerier och hon köpte kryptovaluta för dem. Några tusenlappar behöll hon också själv.", "link": "https://www.dn.se/sverige/mp-politiker-ville-hjalpa-rockstjarna-doms-for-att-tvatta-pengar/", "date_display": "2026-03-24", "date_iso": "2026-03-24T18:02:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "\"I didn't even have time to pack our passports - we just took the kids and ran\"", "summary": "BEIRUT. The national arena has become a refugee camp. The grand promenade next to the Mediterranean Sea is lined with makeshift tents and lack of sleep. Over a million Lebanese have been forced to flee in three weeks. - I didn't even have time to pack our passports, we just took the children and ran, says 37-year-old Sahar.", "title_original": "”Jag hann inte ens packa våra pass – vi bara tog barnen och sprang”", "summary_original": "BEIRUT. Nationalarenan har blivit ett flyktingläger. Den pampiga strandpromenaden intill Medelhavet kantas av provisoriska tält och sömnbrist. Över en miljon libaneser har tvingats på flykt på tre veckor. – Jag hann inte ens packa våra pass, vi bara tog barnen och sprang, säger 37-åriga Sahar.", "link": "https://www.dn.se/varlden/jag-hann-inte-ens-packa-vara-pass-vi-bara-tog-barnen-och-sprang/", "date_display": "2026-03-24", "date_iso": "2026-03-24T17:46:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Unexpected tip: This is how food stays in the freezer - for many years", "summary": "Have you found old berries or pieces of meat deep in the freezer and wondered if they are still edible? According to Marie-Louise Danielsson-Tham, professor of food hygiene, there is rarely any danger - even if the currants have been there since 2011. - Unless it is dangerous when you put it in the freezer, it will not be dangerous when you pick it up either. Nothing happens in the freezer.  Bad taste Something that can happen is that the food starts to taste bad. Marie-Louise Danielsson-Tham explains this by saying that enzymes in the food continue to work even in the freezer. Eventually, the food will break down and start to go rancid.  If you are unsure how long the food has been in the freezer and if the taste is intact, you can cut off a small piece and cook in the microwave.  - If it tastes rancid, as this salmon will after a couple of years, then it is not good. Then it will be the hot compost that will be happy. If it tastes okay, then you take and thaw the rest in the fridge and cook it. It is completely harmless to eat, says Danielsson-Tham.  The expert's tip There are things you can think about so that the food lasts and tastes as good as possible.  To avoid freezing and drying out, it is important to pack the food tightly. - I am very fond of aluminum foil, because it closes tightly around food. To prevent it from breaking, take a plastic bag on the outside. Then you have the perfect storage, says Danielsson-Tham.  Boxes also work, but then they need to be completely filled.  Warns of misconception Many people wonder if it is safe to freeze food that has already been thawed and heated, for example a stew or meat sauce. Marie-Louise Danielsson-Tham explains that it goes well, as long as the food has been handled correctly.  - If you have been careful, you can freeze it again. By careful I mean you cool it down quickly, keep it cold and then freeze it.  She also warns against the misconception that chicken becomes safe from campylobacter in the freezer. - You can freeze a few to death, but there is always mass", "title_original": "Oväntade tipset: Så håller maten i frysen – i många år", "summary_original": "Har du hittat gamla bär eller köttbitar längst in i frysen och undrat om de fortfarande går att äta? Enligt Marie-Louise Danielsson-Tham, professor i livsmedelshygien, är det sällan någon fara – även om vinbären legat där sedan 2011.  – Såvida det inte är farligt när du lägger ner det i frysboxen så blir det inte farligt när du plockar upp det heller. Det händer inget i frysen.  Dålig smak Något som kan hända är att maten börjar smaka dåligt. Det förklarar Marie-Louise Danielsson-Tham med att enzymer som finns i livsmedlet fortsätter jobba även i frysen. Så småningom kommer livsmedlet att brytas ner och börja härskna.  Är man osäker på hur länge maten har legat i frysen och om smaken är intakt kan man skära av en liten bit och tillaga i mikrovågsugnen.  – Smakar det härsket, som den här laxen kommer att göra efter ett par år, då är det inte gott. Då blir det varmkomposten som blir glad. Smakar det okej, då tar du och tinar resten i kylen och tillagar det. Det är helt ofarligt att äta, säger Danielsson-Tham.  Expertens tips Det finns saker man kan tänka på för att maten ska hålla och smaka så bra som möjligt.  För att undvika isbildning och uttorkning är det viktigt att förpacka maten tätt. – Jag är väldigt förtjust i aluminiumfolie, för det sluter tätt runt livsmedel. För att det inte ska gå sönder tar du en plastpåse utanpå. Då har du den perfekta förvaringen, säger Danielsson-Tham.  Lådor fungerar också, men då behöver de fyllas helt.  Varnar för missuppfattning Många undrar om det är säkert att frysa in mat som redan tinats och värmts, till exempel en gryta eller köttfärssås. Marie-Louise Danielsson-Tham förklarar att det går bra, så länge maten har hanterats på rätt sätt.  – Om du har varit skötsam kan du frysa den igen. Med skötsam menar jag att du kyler ner den snabbt, förvarar den kallt och sedan fryser in.  Hon varnar också för missuppfattningen att kyckling blir säker från campylobacter i frysen. – Du kan frysa ihjäl några stycken, men det finns alltid massor kvar som gör att du kan bli sjuk. Den måste värmebehandlas, precis som all annan färsk kyckling.", "link": "https://www.tv4.se/artikel/32HVW05ZOUcK080SdN69iS/ovaentade-tipset-sa-haller-maten-i-frysen-i-manga-ar", "date_display": "2026-03-24", "date_iso": "2026-03-24T17:28:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/nyhetsmorgon", "/hem-och-hushall", "/livsmedel", "/matlagning"]}, {"id": 135, "title": "Reader competition: Who will score the first goal in the women's league in 2026?", "summary": "On March 28, the women's soccer league starts. Who do you think scores the fastest goal in the opening round? Join the competition. This is how it happens and this is how it has looked historically.", "title_original": "Läsartävling: Vem gör första målet i damallsvenskan 2026?", "summary_original": "Den 28 mars startar damallsvenskan i fotboll. Vem tror du gör det snabbaste målet i premiäromgången? Var med och tävla. Så här går det till och så har det sett ut historiskt.", "link": "https://www.dn.se/sport/lasartavling-vem-gor-forsta-malet-i-damallsvenskan-2026/", "date_display": "2026-03-24", "date_iso": "2026-03-24T17:10:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Man shot in Solna – a prisoner", "summary": "During Tuesday morning, a man was shot in Solna. The police are investigating the incident as attempted murder and have detained a person connected to the investigation. - We do not go into age, gender, or the grounds for the deprivation of liberty, says Daniel Wikdahl, press spokesperson at the police.", "title_original": "Man skjuten i Solna – en frihetsberövad", "summary_original": "Under tisdagsförmiddagen blev en man skjuten i Solna. Polisen utreder händelsen som försök till mord och har frihetsberövat en person kopplad till utredningen. – Vi går inte in på ålder, kön, eller grunderna för frihetsberövandet, säger Daniel Wikdahl, presstalesperson vid polisen.", "link": "https://www.dn.se/sverige/man-skjuten-i-solna-en-frihetsberovad/", "date_display": "2026-03-24", "date_iso": "2026-03-24T17:09:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "The battery company went bankrupt - the C leader receives criticism", "summary": "The company Nortical's business idea was to analyze batteries and try to extend their lifetime.  Investors included the Swedish Tax Agency, Almi Invest and the county board of Västra Götaland. The Center Party's party leader Elisabeth Thand Ringqvist was also an early investor via the companies Marsnen AB and E14 Invest. She was also chairman of the board when Nortical went bankrupt in 2023 with millions of debts. Violation of the Companies Act The center leader is now accused of not having fulfilled his obligations as chairman of the board, because a so-called control balance sheet is missing from the bankruptcy documents. This is reported by Swedish Radio. Control balance sheet must be prepared when half of the share capital can be suspected of being used up, and is created to protect creditors and investors.  \"Yes, it's a violation of the Limited Liability Companies Act. So I mean, it's serious. As chairman of the board, you have the ultimate responsibility,\" says Håkan Dahlgren, crime prevention specialist at the Ecocrimes Authority to Sveriges Radio. Consultation with lawyers In an email to SR, Elisabeth Thand Ringqvist writes that the handling of Nortical took place in consultation with lawyers and accountants. The aim was to return as much money as possible to the investors. TV4 Nyheterna has applied for Elisabeth Thand Ringqvist.", "title_original": "Batteribolaget gick i konkurs – C-ledaren får kritik", "summary_original": "Bolaget Nortical hade som affärsidé att analysera batterier och försöka förlänga deras livstid.  Investerare var bland annat Skatteverket, Almi Invest och länsstyrelsen i Västra Götaland. Även Centerpartiets partiledare Elisabeth Thand Ringqvist var en tidig investerare via bolagen Marsnen AB och E14 Invest. Hon var även styrelseordförande när Nortical gick i konkurs 2023 med miljonskulder. Brott mot aktiebolagslagen Centerledaren anklagas nu för att inte ha skött sina åtaganden som styrelseordförande, eftersom en så kallad kontrollbalansräkning saknas bland konkurshandlingarna. Det rapporterar Sveriges Radio. Kontrollbalansräkning ska upprättas när halva aktiekapitalet kan misstänkas vara förbrukat, och skapas för att skydda fordringsägare och investerare.  ”Ja, det är ju ett brott mot aktiebolagslagen. Så jag menar, det är ju allvarligt. Som styrelseordförande så har man det yttersta ansvaret”, säger Håkan Dahlgren, brottsförebyggande specialist på Ekobrottsmyndigheten till Sveriges Radio. Samråd med jurister I ett mail till SR skriver Elisabeth Thand Ringqvist att hanteringen av Nortical skedde i samråd med jurister och revisor. Syftet var att få tillbaka så mycket pengar som möjligt till investerarna. TV4 Nyheterna har sökt Elisabeth Thand Ringqvist.", "link": "https://www.tv4.se/artikel/4Emo2OLlaVRTw7fqct842B/batteribolaget-gick-i-konkurs-c-ledaren-far-kritik", "date_display": "2026-03-24", "date_iso": "2026-03-24T16:27:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Svensk politik", "/politik", "/inrikes", "/ekonomi", "/svensk-politik", "/valet-2022/centerpartiet", "/elisabeth-thand-ringqvist"]}, {"id": 138, "title": "Torsten the Rooster's crazy journey - from the garbage room to a new home", "summary": "It was on March 15 that the discovery was made in a garbage room in Biskopsgården. When a man named Alessio went to throw away the garbage, he was met not only by smells but also by something else. - Then I hear a rooster crow and I think: \"this is crazy.\" People have patios where cats and dogs run here but I've never seen chickens and roosters. I thought what the hell is this?, he told Göteborgs-Posten then. Alessio quickly understood that someone had left the rooster there and acted immediately as he thought it deserved a better fate. Alessio first called the animal ambulance, which could not collect the rooster. Instead, the police took him to an animal hospital where he was found to be healthy. It was also the police who named the rooster Torsten.\n\nBut the future has still been uncertain because no owner has come forward. No one has been able to figure out where Torsten came from either. \"The chickens run with him\" But now he has a new home in Eskilsby Gård in Landvetter. Olivia Helltén, who runs the farm together with her family, saw Torsten on social media and contacted the police. She has explanations for why he was abandoned. \n\n- Unfortunately, roosters are not very easy animals to deal with, but many do not want them. Probably someone wanted a hen and got a rooster or someone stole him or similar. Torsten now has a safe existence on the farm, where he gets to spend time with like-minded people. Olivia tells us that he is enjoying his new surroundings. - Torsten is fine. He is not at all forward like my previous roosters were. The hens run a bit with him so he is a bit more in the background, she says.  \"Hope he gets a long life\" After a tough start in the garbage room, a quieter life in the countryside now awaits Torsten. If no previous owner gets in touch, he can stay on the farm.\n\n- He will be allowed to live here with this flock of hens he got, so I hope he will have a good and long life here with us, says Olivia. \n\nAlessio, who found Torsten, has also expressed that he would like to h", "title_original": "Tuppen Torstens gal-na resa – från soprummet till nytt hem", "summary_original": "Det var den 15:e mars som upptäckten gjordes i ett soprum i Biskopsgården. När en man som heter Alessio skulle  slänga soporna möttes han inte bara av lukter utan även av något annat. – Då hör jag en tupp gala och jag tänker: ”det här är galet.” Folk har uteplatser som katter och hundar springer på här men jag har aldrig sett höns och tuppar. Jag tänkte vad fasen är det här?, sa han till Göteborgs-Posten då. Alessio förstod snabbt att någon lämnat tuppen där och agerade direkt då han tyckte att den förtjänade ett bättre öde. Alessio ringde först djurambulansen som inte kunde hämta tuppen. Istället tog polisen honom till ett djursjukhus där man konstaterade att han var frisk. Det var också polisen som döpte tuppen till Torsten.\n\nMen framtiden har ändå varit osäker eftersom ingen ägare har hört av sig. Ingen har heller kunnat lista ut var Torsten kom ifrån. ”Hönorna kör med honom” Men nu har han fått ett nytt hem i Eskilsby Gård i Landvetter. Olivia Helltén, som driver gården tillsammans med familjen, såg Torsten på sociala medier och hörde av sig till polisen. Hon har förklaringar till varför han övergavs. \n\n– Tuppar är tyvärr inte jättelätta djur att ha att göra med utan många vill inte ha dem. Antagligen är det någon som har velat ha en höna och fått en tupp eller så är det någon som har stulit honom eller liknande. Torsten har nu fått en trygg tillvaro på gården, där han får umgås med likasinnade. Olivia berättar att han trivs i sin nya omgivning. - Torsten mår bra. Han är inte alls framåt som mina tidigare tuppar varit. Hönorna kör lite med honom så han är lite mer i bakgrunden, säger hon.  ”Hoppas han får ett långt liv” Efter en tuff start i soprummet väntar nu ett lugnare liv på landet för Torsten. Om ingen tidigare ägare hör av sig får han stanna kvar på gården.\n\n– Han ska få bo här med den här flocken höns han fått så jag hoppas att han får ett bra och långt liv här hos oss, säger Olivia. \n\nAlessio, som hittade Torsten, har också uttryckt att han gärna vill hälsa på sin gamla bekantskap – något Olivia välkomnar.", "link": "https://www.tv4.se/artikel/1VNMoVSHDXTlftl09h9WO4/tuppens-gaaalna-resa-fran-soprummet-till-ett-hem", "date_display": "2026-03-24", "date_iso": "2026-03-24T16:25:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/djur", "/soprum"]}, {"id": 139, "title": "Son convicted of sex crime was hanged: \"It affects the whole family\"", "summary": "In a time where Dumpen and Pedohunting Sweden fish out suspected pedophiles, a new actor has appeared. Instead of luring using fake aliases, they use public documents and target already convicted men to build a large sex offender registry. - It is a neat way to be prosecuted and also convicted of defamation. Even if it were true, says criminology professor Leif GW Persson. - It shows how controversial these crimes are. We don't have this problem when it comes to other crime which can be quite serious. Equivalents are missing, he continues. It's not just about hangouts. Before its launch, the new site has already had time to be reported more than 20 times for extortion, when it \"offered\" men to avoid being hanged in return for donating bitcoins to the value of SEK 10,000. Several different posting sites TV4 Nyheterna's review shows that this is a widespread phenomenon. Other actors also use both social media, Flashback and several of their own websites to hang out - and in some cases threaten - convicted criminals. Some domain names live for shorter periods of time and are quickly replaced by new ones, which often seem to be run by the same people. An example is a hanging page that existed a couple of years ago but was shut down and instead linked to a new domain, which is currently being rebuilt. The website's goal is clear, they want to go from various crime classifications to becoming more specific: \"We will change the page to a news page about pedophiles/rapists\". Another example is a site that existed until just a short while ago, which not only dealt with hangings but whose manager is also suspected of having demanded money from the relatives of convicts. The mothers' horror Last year, two women noticed that their sons - who are convicted of, among other things, aggravated rape and child pornography offenses - were hanged. One mother then contacted the person in charge of the site, who replied that she could be offered some kind of \"deal\" for the information to be taken down. M", "title_original": "Sexbrottsdömde sonen hängdes ut: ”Det påverkar hela familjen”", "summary_original": "I en tid där Dumpen och Pedohunting Sweden fiskar fram misstänkta pedofiler har en ny aktör dykt upp. I stället för att locka med hjälp av falska alias utgår de från offentliga handlingar och riktar in sig på redan dömda män, för att bygga ett storts sexbrottsregister. – Det är ett klockrent sätt att bli åtalad och även dömd för förtal. Även om det skulle vara sant, säger kriminologiprofessor Leif GW Persson. – Det visar hur kontroversiella de här brotten är. Det här problemet har vi inte när det kommer till annan brottslighet som kan vara ganska grov. Motsvarigheter saknas, fortsätter han. Det handlar inte bara om uthängningar. Inför sin lansering har den nya sajten redan hunnit anmälas drygt 20 gånger för utpressning, då man ”erbjudit” män att slippa hängas ut mot att de donerar bitcoins till ett värde av 10 000 kronor. Flera olika uthängningssajter TV4 Nyheternas granskning visar att detta är ett utbrett fenomen. Även andra aktörer använder sig både av sociala medier, Flashback och flera egna hemsidor för att hänga ut – och i vissa fall hota – dömda gärningsmän. Vissa domännamn lever kortare tider och ersätts snabbt därefter av nya, som ofta verkar drivas av samma personer. Ett exempel är en uthängningssida som fanns för ett par år sedan men som lades ner och istället länkade vidare till en ny domän, som för tillfället byggs om. Hemsidans mål är tydligt, man vill gå från diverse brottsrubriceringar till att bli mer specifik:  “Vi ska ändra sidan till en nyheterssida om pedofiler/våldtäktsmän”. Ett annat exempel är en sajt som fanns tills för bara ett kort tag sedan, som inte bara sysslade med uthängningar men vars ansvarige också är misstänkt för att ha krävt pengar av dömdas anhöriga. Mammornas skräck Förra året märkte två kvinnor att deras söner – som är dömda för bland annat grov våldtäkt och barnpornografibrott – var uthängda. Ena mamman kontaktade då sajtens ansvarige som svarade att hon kunde erbjudas någon sorts ”deal” för att uppgifterna skulle tas ner. Mamman svarade inte och fortsatte anmäla, både till polisen och Integritetsmyndigheten. En kort tid senare kom ett nytt mail med ett nytt hot. – Då skrev han att de kommer fortsätta trakassera oss för att få oss att göra en deal med dem, att vi ska betala för att de ska sluta. De märker väl att vi är två sårbara mammor som vill göra allt för våra barn, säger kvinnan i förhör med polisen. Hon berättar vidare att hon ”mår skit” och har svårt att sova. Den andra mamman beskriver liknande känslor. Förutom hennes sons personnummer och namn, skrev sajten också ut adressen till hennes syster, där sonen tidigare varit skriven. I den aktuella bostaden bor en ung flicka. – Detta påverkar hela familjen. Det är inte meningen att man ska vara rädd att åka hem från jobbet och vara rädd att någon möter en vid dörren. Det är inte normalt, säger mamman i förhör. Träffade medgrundaren på gymmet Den ansvarige mannen står nu åtalad för försök till utpressning. I förhör erkänner han att han för 1,5 år sedan skapade hemsidan tillsammans med en bekant han träffat på gymmet. I övrigt förnekar han brott då han menar att ”dealen” som kommer på tal syftar till att han velat ha en ursäkt för otrevliga mail som en av mammorna har skrivit till honom. Efter anmälningarna till IMY försvann till slut artikeln om sönerna och strax därefter hela sajten. Istället länkas man nu vidare till en ny domän med liknande namn. Denna är dock tillfälligt låst med lösenord ”efter upprepade attacker”. Samtidigt är den nyaste aktören, som bland annat skickat hotfulla brev till ”Karl”, snart online. ”Vi har några arbetsgivare och grannar kvar att kontakta innan vi kan publicera dem”, hotar man i ett inlägg.", "link": "https://www.tv4.se/artikel/2TKzxBp6wkWeV8g7yUh8k8/sexbrottsdoemde-sonen-haengdes-ut-det-paverkar-hela-familjen", "date_display": "2026-03-24", "date_iso": "2026-03-24T16:25:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/pedofil", "/pedofili", "/pedohunting-sweden", "/dumpen"]}, {"id": 140, "title": "Criticizes the walking requirement: \"There is a great lack of clarity\"", "summary": "On Tuesday morning, Migration Minister Johan Forssell presented a new vandalism requirement that the government and SD now propose, which TV4 Nyheterna reported on. The proposal means that residence permits should be able to be denied or withdrawn - and that too retroactively. Now the proposal is receiving criticism from Civil Rights Defenders. John Stauffer, general counsel for the organization, says they are concerned. - It is a proposal that has received a great deal of criticism from many different reference bodies and from our side already when the investigation was presented. Stauffer points out that it is already possible to revoke a residence permit if you have provided incorrect information, or if you have committed a crime. - What is being done today is to create a very broad possibility to revoke residence permits for things that are not in themselves illegal. But it is very unclear what these things are, he says and continues: - There is a great deal of ambiguity, which leads to a great deal of legal uncertainty with application problems in practice. At the same time, Forssell said this morning that the proposal is to clarify the rules, and that only a small group of people will be affected. - We do not make the same interpretation at all when we read this proposal. There is a broad possibility of application, he says. - For example, the clear legal definition of what vandalism is, which was included in the investigator's proposal, has been removed. It must be clear what you are allowed to do and what you are not allowed to do. This proposal lacks that clarity. For the individual, it becomes very difficult to know. What statements can be made without risk of consequences?", "title_original": "Kritiserar vandelskravet: ”Det finns en stor otydlighet”", "summary_original": "På tisdagsförmiddagen presenterade migrationsminister Johan Forssell ett nytt vandelkrav som regeringen och SD nu föreslår, vilket TV4 Nyheterna rapporterat om. Förslaget innebär att uppehållstillstånd ska kunna nekas eller dras tillbaka – och det även retroaktivt. Nu får förslaget kritik från Civil Rights Defenders. John Stauffer, chefsjurist på organisationen, säger att de är oroliga. – Det är ett förslag som har fått väldigt mycket kritik från många olika remissinstanser och från vårt håll redan när utredningen presenterades. Stauffer påpekar att det redan finns möjlighet att återkalla uppehållstillstånd om man lämnat oriktiga uppgifter, eller om man begår brott. – Det man gör idag är att skapa en väldigt bred möjlighet att återkalla uppehållstillstånd för saker som inte i sig är olagliga. Men det är väldigt oklart vad det är för saker, säger han och fortsätter: – Det finns en stor otydlighet, vilket leder till en stor rättsosäkerhet med tillämpningsproblem i praktiken. Samtidigt sade Forssell på förmiddagen att förslaget är till för att förtydliga reglerna, och att det bara är en liten grupp människor som kommer att påverkas. – Vi gör inte alls samma tolkning när vi läser det här förslaget. Det är en bred möjlighet till tillämpning, säger han. – Man har till exempel tagit bort den tydliga juridiska definitionen av vad vandel är för något, som fanns med i utredarens förslag. Det måste vara tydligt vad det är man får göra och vad man inte får göra. Det här förslaget brister i den tydligheten. För individen blir det väldigt svårt att veta. Vilka uttalanden kan man göra utan risk för konsekvenser?", "link": "https://www.tv4.se/artikel/4Ww0AYaM80k8WbRCr5Qo9l/kritiserar-vandelskravet-det-finns-en-stor-otydlighet", "date_display": "2026-03-24", "date_iso": "2026-03-24T15:24:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/svensk-politik", "/juridik"]}, {"id": 141, "title": "17 deacons: Children should not be in prison. Point.", "summary": "The government must get its act together and listen to the referral bodies and take other measures to protect children from ending up in serious crime, write 17 deacons.", "title_original": "17 diakoner: Barn ska inte sitta i fängelse. Punkt.", "summary_original": "Regeringen måste ta sig samman och lyssna på remissinstanserna och vidta andra åtgärder för att skydda barn från att hamna i tung kriminalitet, skriver 17 diakoner.", "link": "https://www.dagen.se/debatt/17-diakoner-barn-ska-inte-sitta-i-faengelse-punkt/10266579", "date_display": "2026-03-24", "date_iso": "2026-03-24T14:10:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "The strange billion roll on the stock market - before Trump's actions", "summary": "Speculation about insider information • \"Frighteningly close to open corruption\"", "title_original": "Märkliga miljardrullningen på börsen – innan Trumps utspel", "summary_original": "Spekulationer kring insiderinformation • \"Skrämmande nära öppen korruption\"", "link": "https://www.tv4.se/artikel/1G5nik4decxjWBzv5zwmgH/miljardhandel-pa-boersen-innan-trumps-utspel-naera-oeppen-korruption", "date_display": "2026-03-24", "date_iso": "2026-03-24T14:00:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi"]}, {"id": 143, "title": "Dangerous if healthcare starts following Smer's new advice", "summary": "Frida Park: Is a life with complications not worth living?", "title_original": "Farligt om vården börjar följa Smers nya råd", "summary_original": "Frida Park: Är ett liv med komplikationer inte värt att leva?", "link": "https://www.dagen.se/ledare/farligt-om-varden-boerjar-foelja-smers-nya-rad/10265741", "date_display": "2026-03-24", "date_iso": "2026-03-24T13:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 144, "title": "Malmö pastorate's apartment project unexpectedly requires new millions", "summary": "Now the rebuilding of the parish hall needs twelve million in unconditional shareholder contributions • The church politicians were taken to bed when they realized that the project required archaeological excavations.", "title_original": "Malmö pastorats lägenhets­projekt kräver oväntat nya miljoner", "summary_original": "Nu behöver ombyggnationen av församlingshuset få tolv miljoner i ovillkorat aktieägartillskott • Kyrkopolitikerna togs på sängen när de insåg att projektet krävde arkeologiska utgrävningar.", "link": "https://www.dagen.se/nyheter/malmoe-pastorats-laegenhetsprojekt-kraever-ovaentat-nya-miljoner-kommer-inte-fa-tillbaka-pengarna/10253977", "date_display": "2026-03-24", "date_iso": "2026-03-24T12:33:54+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 145, "title": "Here's the worst hand cream - popular brand worst", "summary": "The test has examined both hydration and protection against dehydration. All creams have been tested by 20 people in a laboratory and evaluated by a larger panel. The result shows that it does not have to be expensive to get an effective hand cream - but that there are important differences in content. Three creams receive bottom marks At the bottom of the list are Cien (Lidl), Weleda and Rituals. What these have in common is that they are worse at retaining moisture in the skin, which increases the risk of dehydration. All are also perfumed and contain listed allergenic substances in different levels. - Rituals contains as many as ten allergenic perfume substances and is the only cream in the test that has a suspected hormone-disrupting substance, says Anna Edberg. The suspected substance, benzyl salicylate, is permitted according to EU rules but not approved in Nordic Ecolabelled products. Anna Edberg points out that it is the total exposure from many products that can pose a risk, even if the content in a single cream is low. - It is an approved substance, but it is completely unnecessary to have it in the cream. It has no effect, she says. Allergens and environmental aspects Weleda, which is often marketed as natural, contains eight allergenic perfume substances and also has an extra package, which gives minus points from an environmental point of view. Cien, Lidl's own brand, is the cheapest in the test but also receives deductions for allergens and poorer hydration. - There are many natural substances that are strong allergens, and it is difficult for consumers to decipher the list of ingredients, says Anna Edberg. For those who want to avoid allergens, she recommends perfume-free products and to look out for environmental labels such as the Nordic Swan or Asthma and Allergy Nordic. See who was the best in the test in the clip below or on Råd & rön's website.", "title_original": "Här är den sämsta handkrämen – populära märket värst", "summary_original": "Testet har undersökt både återfuktning och skydd mot uttorkning. Samtliga krämer har testats av 20 personer i laboratorium och utvärderats av en större panel. Resultatet visar att det inte behöver vara dyrt för att få en effektiv handkräm – men att det finns viktiga skillnader i innehåll. Tre krämer får bottenbetyg I botten av listan hamnar Cien (Lidl), Weleda och Rituals. Gemensamt för dessa är att de är sämre på att behålla fukten i huden, vilket ökar risken för uttorkning. Samtliga är dessutom parfymerade och innehåller listade allergena ämnen i olika nivåer. – Rituals innehåller hela tio allergena parfymämnen och är den enda krämen i testet som har ett misstänkt hormonstörande ämne, säger Anna Edberg. Det misstänkta ämnet, bensylsalicylat, är tillåtet enligt EU:s regler men inte godkänt i Svanenmärkta produkter. Anna Edberg påpekar att det är den totala exponeringen från många produkter som kan innebära en risk, även om halten i en enskild kräm är låg. – Det är ett godkänt ämne, men det är helt onödigt att ha det i krämen. Det ger ingen effekt, säger hon. Allergener och miljöaspekter Weleda, som ofta marknadsförs som naturlig, innehåller åtta allergena parfymämnen och har dessutom en extra förpackning, vilket ger minuspoäng ur miljösynpunkt. Cien, Lidls eget märke, är billigast i testet men får också avdrag för allergener och sämre återfuktning. – Det är många naturliga ämnen som är starka allergener, och det är svårt för konsumenter att tyda innehållsförteckningen, säger Anna Edberg. För den som vill undvika allergener rekommenderar hon parfymfria produkter och att hålla utkik efter miljömärkningar som Svanen eller Astma och Allergi Nordic. Se vilka som blev bäst i test i klippet nedan eller på Råd & röns hemsida.", "link": "https://www.tv4.se/artikel/5rC6l58qFIaf21sKkExHwE/haer-aer-den-saemsta-handkraemen-populaera-maerket-vaerst", "date_display": "2026-03-24", "date_iso": "2026-03-24T12:31:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/rad-ron", "/hudvard"]}, {"id": 146, "title": "71-year-old priest in Norrbotten is charged with serious child pornography offences", "summary": "The police found thousands of child pornography images and videos, several of which are considered \"particularly reckless\".", "title_original": "71-årig präst i Norrbotten åtalas för grovt barnpornografibrott", "summary_original": "Polisen hittade tusentals barnpornografiska bilder och filmer, varav flera anses ”särskilt hänsynslösa”.", "link": "https://www.dagen.se/nyheter/71-arig-praest-i-norrbotten-atalas-foer-grovt-barnpornografibrott/10261850", "date_display": "2026-03-24", "date_iso": "2026-03-24T12:23:03+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 147, "title": "The words from a secret location after the indictment: \"I'm very scared\"", "summary": "Three 17-year-olds are charged with attempted murder. Two other teenage boys are suspected of aiding and abetting. According to the prosecutor, they must have taken on the commissioned job of murdering Iran expert Arvin Khoshnood, who has spoken out in the media for a long time. The boys are suspected of having tried to carry out the crime on the evening of September 2. According to the indictment, the one 17-year-old then \"searched for Arvin Khoshnood\" and \"illegally entered the garden\" by climbing over the fence. Armed with a knife, he then knocked on the Iran connoisseur's home and asked for him. Since Arvin Khoshnood had previously been urged by the Security Police to be extra vigilant after a threatening photo of him, he sensed inadequacy and instead called 112. The police's investigation showed that the boys in encrypted chats were planning to murder him and that the evening in question would carry it out. According to the prosecutor, the crime was a commissioned job by someone who is still trying to be identified. The boys were to be paid for the knife attack. The suspect's mobile phone contained information that he took on the assignment to pay off a debt. \"I would be stabbed\" Arvin Khoshnood has singled out the Iranian regime as being behind the act. The prosecutor states that the investigation to identify the client is still ongoing.  - I am happy that charges have been brought, it is something I have been waiting for for a very long time. Partly so that I myself will get details about the attempted murder against me, but also so that the public can learn about this case. For my case is a very clear example of how the regime in Iran acts and orders terrorist acts against opposition parties in Sweden, among other things by using criminal children and networks, says Arvin Khoshnood. In connection with the prosecution, the Iran expert found out how the accused boys tried to murder him. - One detail I did not know and which I read in a press release from the prosecutor is that I would be stabbed that evening. The only thing I knew before was that it was a serious crime against me, but I didn't feel", "title_original": "Orden från hemlig ort efter åtalet: ”Jag är väldigt rädd”", "summary_original": "Tre 17-åringar står åtalade för mordförsök. Två andra tonårspojkar misstänks för medhjälp. De ska enligt åklagaren ha tagit på sig beställningsjobbet att mörda Irankännaren Arvin Khoshnood, som länge uttalat sig i media. Pojkarna misstänks ha försökt genomföra dådet kvällen den 2 september. Den ena 17-åringen ska då enligt åtalet ha ”sökt efter Arvin Khoshnood” och ”olovligen trängt in i trädgården” genom att klättra över staketet. Beväpnad med en kniv knackade han sedan på hemma hos Irankännaren och frågade efter honom. Eftersom Arvin Khoshnood sedan tidigare blivit uppmanad av Säkerhetspolisen att vara extra vaksam efter en hotbild mot honom anade han oråd och ringde i stället 112. Polisens utredning visade att pojkarna i krypterade chattar planerade att mörda honom och den aktuella kvällen skulle genomföra det. Dådet var enligt åklagaren ett beställningsjobb av någon som man fortfarande försöker identifiera. Pojkarna skulle få betalt för knivattacken. I den misstänkte utförarens mobil fanns uppgifter om att han tog på sig uppdraget för att betala av en skuld. ”Jag skulle bli knivhuggen” Arvin Khoshnood har pekat ut den iranska regimen för att ligga bakom dådet. Åklagaren uppger att utredningen för att identifiera beställaren fortfarande pågår.  – Jag är glad att åtal har väckts, det är något jag väntat på väldigt länge. Dels för att jag själv ska få detaljer kring mordförsöket mot mig, men även att allmänheten ska få kunskap om det här fallet. För mitt fall är ett väldigt tydligt exempel på hur regimen i Iran agerar och beställer terrordåd mot oppositionella i Sverige, bland annat genom att använda kriminella barn och nätverk, säger Arvin Khoshnood. I samband med åtalet fick Irankännaren reda på hur de åtalade pojkarna försökte mörda honom. – En detalj jag inte kände till och som jag läste i ett pressmeddelande från åklagaren är att jag skulle bli knivhuggen den kvällen. Det enda jag tidigare visste var att det var ett allvarligt brott mot mig, men jag kände inte till den här detaljen, säger Arvin Khoshnood.  Hur har händelsen påverkat dig och din familj? – På ett väldigt svårt sätt. Jag är givetvis glad att jag har överlevt och att jag hade tur att min familj inte skadades. Men vi har fått lämna vårt hem. Den trygga plats som alla människor har är ju deras hem och den har vi förlorat. Sedan den kvällen vi lämnade vårt hem har vi aldrig kunnat återvända. Vi har också blivit tvungna att lämna våra vänner, familj och helt enkelt våra liv, tyvärr. ”Mår väldigt dåligt” Arvin Khoshnood och hans familj lever fortfarande på hemlig ort och får skydd av Säpo. Han säger dock att han kommer fortsätta sitt arbete, trots att han menar att Iran försöker tysta honom. – Jag skulle ljuga om jag sa att jag mår bra. Jag mår hemskt. Jag mår väldigt dåligt över det som har hänt. Jag är väldigt rädd. Det enda jag tänker på är säkerheten för mig och min familj. Samtidigt kan jag säga att jag kommer inte ge upp kampen för ett fritt Iran. Jag kommer stå vid mitt folk och jag kommer bidra med det lilla jag kan. Nämligen att ge kritiska analyser om regimens
