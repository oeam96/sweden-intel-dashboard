3, "title": "”Jag skulle aldrig önska någon att vara med om det vi varit med om”", "summary": "SVT:s vd Anne Lagercrantz om tro, tv, och brottningen med dotterns ätstörningar", "title_original": "”Jag skulle aldrig önska någon att vara med om det vi varit med om”", "summary_original": "SVT:s vd Anne Lagercrantz om tro, tv, och brottningen med dotterns ätstörningar", "link": "https://www.dagen.se/livsstil/jag-skulle-aldrig-oenska-nagon-att-vara-med-om-det-vi-varit-med-om/10646870", "date_display": "2026-11-26", "date_iso": "2026-11-26T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 164, "title": "Skolelever stoppades från att besöka julmusikal i Frihamnskyrkan", "summary": "Föräldrar upprörda över att rektor nekar elever ledigt för medverkan i kyrkans barnmusikal.", "title_original": "Skolelever stoppades från att besöka julmusikal i Frihamnskyrkan", "summary_original": "Föräldrar upprörda över att rektor nekar elever ledigt för medverkan i kyrkans barnmusikal.", "link": "https://www.dagen.se/nyheter/skolelever-stoppades-fran-att-besoeka-julmusikal-i-frihamnskyrkan/10651695", "date_display": "2026-11-26", "date_iso": "2026-11-26T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 165, "title": "Upprop till Sveriges nästa regering: Tilliten mellan staten och olika grupper i samhället måste stärkas", "summary": "När muslimska organisationer misstänkliggörs och arbetet för människor på flykt försvåras, försvagas också demokratin, skriver svenska medlemmar i A World of Neighbours.", "title_original": "Upprop till Sveriges nästa regering: Tilliten mellan staten och olika grupper i samhället måste stärkas", "summary_original": "När muslimska organisationer misstänkliggörs och arbetet för människor på flykt försvåras, försvagas också demokratin, skriver svenska medlemmar i A World of Neighbours.", "link": "https://www.dagen.se/debatt/upprop-till-sveriges-naesta-regering-tilliten-mellan-staten-och-olika-grupper-i-samhaellet-maste-staerkas/10649609", "date_display": "2026-11-26", "date_iso": "2026-11-26T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "Finansman misstänks ha drogat kvinnor – greps på paradisö", "summary": "På onsdagen åtalades en man i 60-årsåldern vid Uddevalla tingsrätt för grov våldtäkt, grov misshandel, övergrepp i rättssak och grovt vapenbrott. De misstänkta brotten begicks under sommaren och hösten 2024 i Tjörns kommun, där mannen har ett sommarhus. Mannen, som är svensk medborgare, har under flera år bott och arbetat utomlands. I februari i år häktades han i sin utevaro och i mars greps han och utlämnades från den afrikanska önationen São Tomé och Príncipe. Ringde mamma – blev medvetslös I juli 2024 fick mannen kontakt med en av kvinnorna via en dejtingapp och bjöd ut henne till sitt sommarhus. Där ska han enligt åtalet ha fått henne att dricka en dryck som innehöll narkotika, utan hennes vetskap. Kvinnan kontaktade sin mamma och berättade att hon blivit drogad. Hon ringde också 112 och såväl sjöräddning som polis och ambulanspersonal larmades till ön. Av stämningsansökan, som TV4 Nyheterna tagit del av, framgår att kvinnan fick kramper, periodvis förlorade medvetandet och hade problem med att hålla luftvägarna fria. Hennes tillstånd försämrades så kraftigt att hon behövde transporteras med ambulanshelikopter. Prover på sjukhuset gav bland annat utslag för ecstasy och amfetamin. Enligt åklagaren hade kvinnans liv kunnat vara i fara om hon inte kommit under vård. Ny kvinna dyker upp på ön Knappt tre månader efter den första händelsen besökte ytterligare en kvinna mannen på ön. Enligt åtalet hade de kommit överens om att mannen skulle köra tillbaka henne till fastlandet samma kväll. I stället misstänks han ha drogat henne och utsatt henne för en grov våldtäkt. Kvinnan ska till följd av drogerna ha förlorat kontrollen över sin kropp och saknat möjlighet att ta sig från ön. Morgonen därpå skrev hon till en vän att hon blivit drogad och utsatt för ett sexuellt övergrepp.  Vid provtagning påträffades ecstasy, ketamin och THC i kvinnans kropp. Vid en läkarundersökning dokumenterades också blåmärken på hennes armar och ben. – För båda kvinnorna är det första gången de träffar honom som han utsätter dem för brott. De har ingen koppling till varandra, säger kammaråklagare Josefin Pernmyr i ett pressmeddelande. Meddelandena: ”Fantastisk isbrytare på första dejten” I mannens beslagtagna mobiltelefoner har utredarna hittat en omfattande mängd meddelanden, bilder och internetsökningar som åklagaren nu åberopar som bevisning. Enligt åklagaren visar materialet att mannen under flera år köpt och brukat narkotika i stor omfattning och haft ett stort intresse av att kombinera droger med umgänge med kvinnor. ”Fantastisk kväll!!! MDMA är en sådan fantastisk isbrytare på första dejten!”, skriver mannen i ett av meddelandena, översatt från engelska. Av stämningsansökan framgår också att andra personer än de två kvinnorna ska ha konfronterat mannen med att han spetsat deras drinkar med narkotika. Planerade att fly med båt I samband med att mannen häktades i sin utevaro ska han ha gjort flera internetsökningar om Interpol och utlämning av misstänkta brottslingar. Åklagaren har också tagit del av konversationer som enligt åtalet visar hur mannen planerat att fly från São Tomé och Príncipe. Han ska ha varit beredd att ge sig ut på en riskfylld resa med båt för att undvika att ställas inför rätta i Sverige. Mannen åtalas även för grovt vapenbrott sedan polisen vid en husrannsakan hittat ett halvautomatiskt gevär med tillhörande ammunition. På fastigheten hittades också flera olika sorters narkotika. Mannen förnekar brott. Han har bland annat gjort gällande att den första kvinnans dåliga mående berodde på alkohol och att den andra kvinnan själv försett sig med droger. TV4 Nyheterna har utan framgång sökt både den tilltalade mannens försvarsadvokat och kammaråklagren.", "title_original": "Finansman misstänks ha drogat kvinnor – greps på paradisö", "summary_original": "På onsdagen åtalades en man i 60-årsåldern vid Uddevalla tingsrätt för grov våldtäkt, grov misshandel, övergrepp i rättssak och grovt vapenbrott. De misstänkta brotten begicks under sommaren och hösten 2024 i Tjörns kommun, där mannen har ett sommarhus. Mannen, som är svensk medborgare, har under flera år bott och arbetat utomlands. I februari i år häktades han i sin utevaro och i mars greps han och utlämnades från den afrikanska önationen São Tomé och Príncipe. Ringde mamma – blev medvetslös I juli 2024 fick mannen kontakt med en av kvinnorna via en dejtingapp och bjöd ut henne till sitt sommarhus. Där ska han enligt åtalet ha fått henne att dricka en dryck som innehöll narkotika, utan hennes vetskap. Kvinnan kontaktade sin mamma och berättade att hon blivit drogad. Hon ringde också 112 och såväl sjöräddning som polis och ambulanspersonal larmades till ön. Av stämningsansökan, som TV4 Nyheterna tagit del av, framgår att kvinnan fick kramper, periodvis förlorade medvetandet och hade problem med att hålla luftvägarna fria. Hennes tillstånd försämrades så kraftigt att hon behövde transporteras med ambulanshelikopter. Prover på sjukhuset gav bland annat utslag för ecstasy och amfetamin. Enligt åklagaren hade kvinnans liv kunnat vara i fara om hon inte kommit under vård. Ny kvinna dyker upp på ön Knappt tre månader efter den första händelsen besökte ytterligare en kvinna mannen på ön. Enligt åtalet hade de kommit överens om att mannen skulle köra tillbaka henne till fastlandet samma kväll. I stället misstänks han ha drogat henne och utsatt henne för en grov våldtäkt. Kvinnan ska till följd av drogerna ha förlorat kontrollen över sin kropp och saknat möjlighet att ta sig från ön. Morgonen därpå skrev hon till en vän att hon blivit drogad och utsatt för ett sexuellt övergrepp.  Vid provtagning påträffades ecstasy, ketamin och THC i kvinnans kropp. Vid en läkarundersökning dokumenterades också blåmärken på hennes armar och ben. – För båda kvinnorna är det första gången de träffar honom som han utsätter dem för brott. De har ingen koppling till varandra, säger kammaråklagare Josefin Pernmyr i ett pressmeddelande. Meddelandena: ”Fantastisk isbrytare på första dejten” I mannens beslagtagna mobiltelefoner har utredarna hittat en omfattande mängd meddelanden, bilder och internetsökningar som åklagaren nu åberopar som bevisning. Enligt åklagaren visar materialet att mannen under flera år köpt och brukat narkotika i stor omfattning och haft ett stort intresse av att kombinera droger med umgänge med kvinnor. ”Fantastisk kväll!!! MDMA är en sådan fantastisk isbrytare på första dejten!”, skriver mannen i ett av meddelandena, översatt från engelska. Av stämningsansökan framgår också att andra personer än de två kvinnorna ska ha konfronterat mannen med att han spetsat deras drinkar med narkotika. Planerade att fly med båt I samband med att mannen häktades i sin utevaro ska han ha gjort flera internetsökningar om Interpol och utlämning av misstänkta brottslingar. Åklagaren har också tagit del av konversationer som enligt åtalet visar hur mannen planerat att fly från São Tomé och Príncipe. Han ska ha varit beredd att ge sig ut på en riskfylld resa med båt för att undvika att ställas inför rätta i Sverige. Mannen åtalas även för grovt vapenbrott sedan polisen vid en husrannsakan hittat ett halvautomatiskt gevär med tillhörande ammunition. På fastigheten hittades också flera olika sorters narkotika. Mannen förnekar brott. Han har bland annat gjort gällande att den första kvinnans dåliga mående berodde på alkohol och att den andra kvinnan själv försett sig med droger. TV4 Nyheterna har utan framgång sökt både den tilltalade mannens försvarsadvokat och kammaråklagren.", "link": "https://www.tv4.se/artikel/79Tqn15EpqvrXEoYbgtBZu/finansman-misstaenks-ha-drogat-kvinnor-greps-pa-paradisoe", "date_display": "2026-11-25", "date_iso": "2026-11-25T21:27:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/grov-valdtakt", "/misshandel", "/polisen", "/aklagarmyndigheten"]}, {"id": 167, "title": "Satellitstörningar över Arlanda ökade under helgen: ”Allvarligt”", "summary": "Mellan den 21 och 23 november registrerades en kraftig ökning av GNSS-störningar över Stockholmsområdet, rapporterar Dagens Nyheter. Störningarna kan påverka flygtrafikens navigationssystem och enligt Transportstyrelsen är omfattningen av störningarna något utöver det vanliga. – Så här mycket under en sådan relativt lång period som flera dagar – det är nog första gången som vi har identifierat det på det här sättet, säger Andreas Holmgren, enhetschef för infrastrukturenheten på sjö- och luftfartsavdelningen på Transportstyrelsen.  Ingen utpekad avsändare Tidigare har störningar registrerats över framför allt sydöstra Sverige, men nu är det första gången interferens uppstår så långt norrut och över Stockholmsområdet. Transportstyrelsen menar att det inte rör sig om naturliga orsaker som rymdaktivitet, men vill samtidigt inte peka ut främmande makt som en potentiell avsändare.  – Vi har inte någon konkreta evidens för det, utan då blir det spekulativt, säger Andreas Holmgren.  Holmgren medger att tidigare störningar har kunnat kopplas till andra sidan Östersjön, och påverkan från Ryssland har tidigare bekräftats och fördömts av FN. Från Transportstyrelsen ser man en risk med en ökad koncentration av störningar i framtiden.  – Det är allvarligt, absolut, och en störning som får en påverkan på luftfarten men även sjöfarten, säger han.  Följer utvecklingen GNSS är ett av flera system som används inom flygtrafiken och den gångna helgen ska inga störningar ha påverkat verksamheten över Arlanda. ”Störningen skedde runt Åland. Området trafikeras bl.a. av flygplan som flyger till och från Finland”, skriver Daniel Ackermann, pressansvarig på Luftfartsverket till TV4 Nyheterna.  – Sverige kan räkna med fler hybridattacker och sabotage-aktioner från rysk sida i och med att vi är en av Ukrainas viktigaste allierade just nu. Senast igår varnade ju brittiska MI5 för att företag i Storbritannien riskerar att bli måltavlor för ryska angrepp. Den verkligheten har vi – eller kommer vi snart få se också i Sverige, säger TV4 Nyheternas utrikesreporter Johan Fredriksson.   Andreas Holmgren menar att det pågår en samverkan mellan flera myndigheter i frågan och att det arbetet även kommer att fortsätta framöver.  – Vi kommer fortsätta att göra det framåt också, och behöva följa utvecklingen inom det här området.", "title_original": "Satellitstörningar över Arlanda ökade under helgen: ”Allvarligt”", "summary_original": "Mellan den 21 och 23 november registrerades en kraftig ökning av GNSS-störningar över Stockholmsområdet, rapporterar Dagens Nyheter. Störningarna kan påverka flygtrafikens navigationssystem och enligt Transportstyrelsen är omfattningen av störningarna något utöver det vanliga. – Så här mycket under en sådan relativt lång period som flera dagar – det är nog första gången som vi har identifierat det på det här sättet, säger Andreas Holmgren, enhetschef för infrastrukturenheten på sjö- och luftfartsavdelningen på Transportstyrelsen.  Ingen utpekad avsändare Tidigare har störningar registrerats över framför allt sydöstra Sverige, men nu är det första gången interferens uppstår så långt norrut och över Stockholmsområdet. Transportstyrelsen menar att det inte rör sig om naturliga orsaker som rymdaktivitet, men vill samtidigt inte peka ut främmande makt som en potentiell avsändare.  – Vi har inte någon konkreta evidens för det, utan då blir det spekulativt, säger Andreas Holmgren.  Holmgren medger att tidigare störningar har kunnat kopplas till andra sidan Östersjön, och påverkan från Ryssland har tidigare bekräftats och fördö onen Senare i synk tvingas Patrik förklara upplägget för produktionen som inte kände till att brevskrivarna turades om att sova med honom. Enligt Patrik är det den tuffaste frågan han hittills har fått i programmet. – Nej, men... Det har väl blivit nån... Den här konstellationen, nu när vi är tre kvar, har varit ganska svår att hantera. Tjejerna gjorde väl en tyst överenskommelse: ”Om du sover med Sandra första natten, då får du faktiskt sova med mig natten efter”, sa Carro. Jag vet inte... Det har väl blivit nån konstig modell, säger han.\n\nSandra berättar dock att det inte har blivit något mer mellan dem än att sova i samma säng. – Det är väl kanske lite speciellt. Första natten ville han sova i sin säng igen för han klagade på att Winstons (hans sons) säng inte var lika skön. Så då kröp han ner bredvid mig. Men det blev inga smaskigheter, säger hon. Pratar inte känslor med varandra Att dejta samma kille har Sandra och Caroline skämtat om men de har aldrig berättat för varandra om sina känslor för bonden. – Jag känner att vi har superkul tillsammans. Vi klickade direkt och har så himla kul tillsammans. Och det är väldigt ovanligt för mig att jag känner den där connectionen, säger Sandra om Patrik. Samtidigt vågar hon inte riktigt få de där starka känslorna. – Om han då säger i slutet: ”Nej, men jag har fallit för henne”, då blir det tufft, så klart.", "title_original": "Bonden sover varannan natt med tjejerna: ”Tyst överenskommelse”", "summary_original": "När Patrik Bergquist har bjudit in vänner och familj till fest på gården i ”Bonde söker fru” avslöjar brevskrivaren Sandra Svensson för en av hans kompisar att hon och Caroline von Horn sover varannan natt i samma säng som bonden. – Ska man säga det? Vi turas om honom, säger hon och skrattar. Tvingas förklara för produktionen Senare i synk tvingas Patrik förklara upplägget för produktionen som inte kände till att brevskrivarna turades om att sova med honom. Enligt Patrik är det den tuffaste frågan han hittills h är, men jag skrämdes upp så enormt av det hela, säger hon. Bedragarna använde hennes uppgifter för att göra köp via Klarna. När Camilla slog larm och bad Klarna stoppa betalningarna fick hon ingen hjälp. – Jag fick beskedet att jag hade använt och signerat med mitt bank-id. Så då får jag ingen mer hjälp, för att jag har varit oaktsam och använt mitt bank-id och signerat med det, säger hon. Olika regler beroende på hur bedrägeriet går till Det finns en viktig skillnad i regelverket. Om en bedragare själv tar sig in på ett konto och gör köp utan kundens godkännande gäller reglerna för obehöriga transaktioner. Om kunden i stället luras att själv godkänna betalningen med bank-id är den juridiska situationen en annan och kallas behörig, och då finns inte samma rätt till automatisk ersättning. Rich Bromley, bedrägerichef på Klarna, bekräftar skillnaden. – Tyvärr finns inte samma regler för ersättning för dem som utsätts för vad vi kallar bedrägerier med godkända betalningar, säger han. Klarna: ”Vi fick det inte riktigt rätt” TV4 Nyheterna har tidigare berättat om Ingrid, som trodde att hon skulle få hjälp att stoppa ett bedrägeri efter ett köp på ett Klarnakort. I stället blev hon lurad på totalt omkring 90 000 kronor. När hon kontaktade Klarna uteblev hjälpen. Efter rapporteringen har en rad personer kontaktat redaktionen med liknande berättelser som Ingrid och Camillas.  I två av fallen medger Klarna nu att de gjort fel, och kunderna slipper betala. På frågan om kunder ska behöva vända sig till media för att få hjälp svarar Rich Bromley: – Absolut inte. I två av fallen fick vi det inte riktigt rätt. För Camilla, som lurades att själv signera köpen, är beskedet däremot fortfarande ett annat. – Av Klarna har jag inte fått någon hjälp alls. Nej, ingen alls, säger hon.", "title_original": "Camilla lurades att godkänna Klarna-köp – får ingen hjälp", "summary_original": "Camilla Andersson trodde att hon pratade med Swedbanks säkerhetsavdelning. Hon fick veta att bedragare tag   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
