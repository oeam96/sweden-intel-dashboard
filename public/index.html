 är över i området, och under morgondagen rör det sig söderut.  Flera varningar  Under lördagseftermiddagen utfärdade SMHI flera gula varningar för skyfallsliknande regn under söndagen. Varningarna gäller bland annat delar av sydöstra Götaland, sydligaste och mellersta Öland samt delar av Skåne, Halland, Kronobergs och Blekinge län. Enligt SMHI kan kraftiga skurar lokalt ge mellan 30 och 40 millimeter regn på kort tid. Även åska kan förekomma. – Det lär bli mycket regn, men inte på den nivån så att det ska ställa till med några bekymmer, säger han.  SMHI varnar samtidigt för att lokala översvämningar kan uppstå i exempelvis källare, dagvattensystem, vägar och viadukter. De uppmanar trafikanter att vara uppmärksamma på risken för vattenplaning och försämrad sikt.", "link": "https://www.tv4.se/artikel/4opErHYkIsBo4cutngjC8J/ovaedret-roer-sig-soederut-laer-bli-mycket-regn", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:54:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Vädret", "/vadret", "/vader", "/smhi", "/skyfall"]}, {"id": 105, "title": "Rape and murder of eleven-year-old arouses anger in India", "summary": "The Indian state of West Bengal has been rocked by protests after the murder of an eleven-year-old. The girl was raped before being left to die in a polluted pond. - If the police had acted faster, she could have been saved, says a relative to the BBC.", "title_original": "Våldtäkt och mord på elvaåring väcker vrede i Indien", "summary_original": "Indiska delstaten Västbengalen har skakats av protester efter mordet på en elvaåring. Flickan våldtogs innan hon lämnades att dö i en förorenad damm. – Hade polisen agerat snabbare hade hon kunnat räddas, säger en anhörig till BBC.", "link": "https://www.dn.se/varlden/valdtakt-och-mord-pa-elvaaring-vacker-vrede-i-indien/", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:48:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "The tennis gala at Norrviken's gardens", "summary": "The annual tennis gala with 318 invited guests was held at Norrviken's gardens on Saturday evening. HD mingled around at the tennis party.", "title_original": "Tennisgalan på Norrvikens trädgårdar", "summary_original": "Den årliga tennisgalan med 318 inbjudna gäster hölls på Norrvikens trädgårdar under lördagskvällen. HD minglade runt på tennisfesten.", "link": "https://www.hd.se/bastad/tennisgalan-pa-norrvikens-tradgardar/", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:43:19+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "The Ark at Sofiero – a real glitter party", "summary": "The Ark returns with a big tour in the summer of 2026 - and tonight the band plays at Sofiero in Helsingborg. Join the frenzy!", "title_original": "The Ark på Sofiero – en riktig glitterfest", "summary_original": "The Ark återvänder med en stor turné sommaren 2026 – och i kväll spelar bandet på Sofiero i Helsingborg. Häng med i vimlet!", "link": "https://www.sydsvenskan.se/dygnet-runt/the-ark-pa-sofiero-publiken-strommar-till/", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:23:32+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "\"True euphoria\" when Bjärredtjejer won the Gothia Cup", "summary": "The winners of the Gothia Cup in the category girls born in 2010 come from Skåne. Bjärreds FF won the final for girls 16 years against the Icelandic team Stjarnan after a penalty shootout at Gamla Ullevi.  - First of all, very cool. You feel proud in some way, says the match's player Signe Ingemarsson.", "title_original": "”Sann eufori” när Bjärredtjejer vann Gothia Cup", "summary_original": "Vinnarna av Gothia Cup i klassen tjejer födda 2010 kommer från Skåne. Bjärreds FF vann finalen för flickor 16 år mot det Isländska laget Stjarnan efter en straffrysare på Gamla Ullevi.  – Först och främst väldigt coolt. Man känner sig stolt på något vis, säger matchens lirare Signe Ingemarsson.", "link": "https://www.sydsvenskan.se/sport/sann-eufori-nar-bjarredtjejer-vann-gothia-cup/", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:19:13+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "Russian women called up for military training by 'mistake'", "summary": "Although Russian women are not expected to undergo military training, several testified that they received summonses to appear at army offices. A \"mistake\" that could be a way to attract more people to join voluntarily.", "title_original": "Ryska kvinnor kallas till militärutbildning av ”misstag”", "summary_original": "Trots att ryska kvinnor inte förväntas genomgå militärutbildning vittnar flera om att de fått kallelser för att infinna sig på arméns kontor. Ett ”misstag” som kan vara ett sätt att locka fler till att ansluta sig frivilligt.", "link": "https://www.dn.se/varlden/ryska-kvinnor-kallas-till-militarutbildning-av-misstag/", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:04:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Rage against summer-closed pharmacies: \"The countryside must stand back\"", "summary": "This summer, 435 of the country's approximately 1,400 pharmacies have been temporarily forced to close or reduce their opening hours due to a lack of pharmacists, reports the newspaper Svensk Farmaci. Shortage of staff According to the law, pharmacies may only be open if a pharmacist is on site throughout the opening hours. During the summer, when many employees take vacation, staffing becomes strained - and the consequence is that several pharmacies are forced to close completely or shorten their opening hours. - I will be sad. Very sad. This affects many elderly people, says Åsa Lindestam, chairman PRO. - There are many important medicines that you have to have at certain times and so on. So you go there and think: I'll pick it up now because tomorrow it's over. And then you go to the pharmacy and are greeted by a sign on the door, it's terrible. \"For a very long time\" One of the affected pharmacies is Apotek Hjärtat in Grängesberg. The local pharmacy is closed throughout June, July and August. Among PRO's members in Grängesberg, it is above all the length of the closure that is criticized. - It's a very long time, three months, says Ulla-Britt Mikaelsson, chairman of local PRO in Grängesberg, and continues: - We think it's bad. You need things from the pharmacy at this age. Quite a lot of medicine is needed. Long distance to the next pharmacy The change mainly affects those who live in rural areas, where the distance to the nearest pharmacy can already be long. For Grängesberg residents, the nearest pharmacy is now in Ludvika, 20 kilometers away. Although it is possible to order medicines on the internet, Åsa Lindestam believes that it is far from all elderly people who want or are able to do so. - Where I live now, in the sparsely populated countryside, there aren't that many pharmacies. And if something were to close, it would be very far for many elderly people. Maybe you don't go by car either, but sit in a hot bus, because that's the only way to get anywhere, says Åsa Lindestam. In addition to the pharmacy in Grängesberg, a further 16 Apotek Hjärtat pharmacies have closed to some extent under", "title_original": "Rasar mot sommarstängda apotek: ”Landsbygden får stå tillbaka”", "summary_original": "I sommar har 435 av landets cirka 1 400 apotek tillfälligt tvingats stänga eller dra ned på sina öppettider på grund av brist på farmaceuter, rapporterar tidningen Svensk Farmaci. Personalbrist Enligt lagen får apotek bara hålla öppet om en farmaceut finns på plats under hela öppethållningstiden. Under sommaren, när många anställda tar semester, blir bemanningen ansträngd – och följden blir att flera apotek tvingas stänga helt eller korta öppettiderna. – Jag blir ju ledsen. Jätteledsen. Det här drabbar många äldre, säger Åsa Lindestam, ordförande PRO. – Det finns ju många viktiga mediciner som man måste ha på bestämda tider och så. Så åker man dit och tänker: Jag hämtar nu för imorgon är det slut. Och så går man till apoteket och möts av en skylt på dörren, det är ju fruktansvärt. ”Väldigt länge” Ett av de drabbade apoteken är Apotek Hjärtat i Grängesberg. Det lokala apoteket håller stängt under hela juni, juli och augusti. Bland PRO:s medlemmar i Grängesberg är det framför allt längden på stängningen som kritiseras. – Det är väldigt länge, tre månader, säger Ulla-Britt Mikaelsson, ordförande för lokala PRO i Grängesberg, och fortsätter: – Vi tycker det är dåligt. Apoteket behöver man ju ha grejer ifrån i den här åldern. Det behövs ganska mycket medicin. Långt till nästa apotek Förändringen drabbar framför allt dem som bor på landsbygden, där avståndet till närmaste apotek redan kan vara långt. För Grängesbergsborna är närmaste apotek nu i Ludvika, 20 kilometer därifrån. Även om man kan beställa mediciner på internet menar Åsa Lindestam att det är långt ifrån alla äldre som vill eller kan göra det. – Där jag bor nu, på glesbygden, är det ju inte så många apotek. Och om något skulle stänga blir det väldigt långt för många äldre. Man kanske inte heller åker bil, utan man sitter i en varm buss, för att det är det enda sättet att ta sig någon vart, säger Åsa Lindestam. Förutom apoteket i Grängesberg har ytterligare 16 Apotek Hjärtat-apotek stängt i någon omfattning under sommaren. Gabriella Ohlzon, pressansvarig på Apotek Hjärtat menar att det beror på den stora bristen på farmaceuter.  – Vi har ett politiskt förslag där man ska möjliggöra att ha en farmaceut på distans istället, det skulle innebära att man får hämta ut sina läkemedel, men då har ett videomöte med en farmaceut som man kan få rådgivning av, säger Gabriella Ohlzon, pressansvarig på Apotek Hjärtat.", "link": "https://www.tv4.se/artikel/1PU3j8xDUDyMwMQsjQq4PB/rasar-mot-sommarstaengda-apotek-landsbygden-far-sta-tillbaka", "date_display": "2026-07-18", "date_iso": "2026-07-18T20:02:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/apotek", "/pro", "/lakemedel"]}, {"id": 111, "title": "Tribute bands attracted thousands", "summary": "Many were attracted to the Rock the Night tribute festival, which reached Malmö and Mölleplatsen on Saturday evening. Hits from AC/DC, Queen and Iron Maiden among others were promised and delivered. Sydsvenskan's photographer Patrick Persson was there. The festival continues to Gävle.", "title_original": "Tributeband lockade tusentals", "summary_original": "Många lockades till tributefestivalen Rock the Night som nådde Malmö och Mölleplatsen under lördagskvällen. Hits från bland annat AC/DC, Queen och Iron Maiden utlovades och levererades. Sydsvenskans fotograf Patrick Persson var på plats. Festivalen fortsätter till Gävle.", "link": "https://www.sydsvenskan.se/malmo/tributeband-lockade-tusentals/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:42:42+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "More young people want to go bird watching: \"It's super cool\"", "summary": "Interest in bird watching among young people is growing. The number of young members in Birdlife Sweden has increased annually since 2020. - It's great fun to see. You can see it in our camps, which get full immediately, says Maya Eriksson in Birdlife Sweden's youth committee.", "title_original": "Fler unga vill fågelskåda: ”Det är supercoolt”", "summary_original": "Intresset för fågelskådning bland ungdomar växer. Antalet unga medlemmar i Birdlife Sverige har ökat årligen sedan 2020. – Det är jättekul att se. Det märks på våra läger som blir fulla direkt, säger Maya Eriksson i Birdlife Sveriges ungdomskommitté.", "link": "https://www.hd.se/sverige/fler-unga-vill-fagelskada-det-ar-supercoolt/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:31:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "More young people want to go bird watching: \"It's super cool\"", "summary": "Interest in bird watching among young people is growing. The number of young members in Birdlife Sweden has increased annually since 2020. - It's great fun to see. You can see it in our camps, which get full immediately, says Maya Eriksson in Birdlife Sweden's youth committee.", "title_original": "Fler unga vill fågelskåda: ”Det är supercoolt”", "summary_original": "Intresset för fågelskådning bland ungdomar växer. Antalet unga medlemmar i Birdlife Sverige har ökat årligen sedan 2020. – Det är jättekul att se. Det märks på våra läger som blir fulla direkt, säger Maya Eriksson i Birdlife Sveriges ungdomskommitté.", "link": "https://www.sydsvenskan.se/sverige/fler-unga-vill-fagelskada-det-ar-supercoolt/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:31:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "Åberg still at the top – Svensson is racing", "summary": "Ludvig Åberg continues to go strong in the British Open at Royal Birkdale in northwest England. The Swede went three under par for the day and shadows the top before the final round of the golf major. - I could have possibly put someone else in, but overall I'm super happy with how I handled the day, says Åberg to Viaplay.", "title_original": "Åberg fortsatt i toppen – Svensson rasar", "summary_original": "Ludvig Åberg fortsätter gå starkt i British Open på Royal Birkdale i nordvästra England. Svensken gick tre under par för dagen och skuggar toppen inför sista rundan i golfmajorn. – Hade möjligtvis kunnat pilla in någon till, men överlag är jag supernöjd med hur jag tog mig an dagen, säger Åberg till Viaplay.", "link": "https://www.hd.se/sport/aberg-fortsatt-i-toppen-svensson-rasar/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:27:05+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Åberg still at the top – Svensson is racing", "summary": "Ludvig Åberg continues to go strong in the British Open at Royal Birkdale in northwest England. The Swede went three under par for the day and shadows the top before the final round of the golf major. - I could have possibly put someone else in, but overall I'm super happy with how I handled the day, says Åberg to Viaplay.", "title_original": "Åberg fortsatt i toppen – Svensson rasar", "summary_original": "Ludvig Åberg fortsätter gå starkt i British Open på Royal Birkdale i nordvästra England. Svensken gick tre under par för dagen och skuggar toppen inför sista rundan i golfmajorn. – Hade möjligtvis kunnat pilla in någon till, men överlag är jag supernöjd med hur jag tog mig an dagen, säger Åberg till Viaplay.", "link": "https://www.sydsvenskan.se/sport/aberg-fortsatt-i-toppen-svensson-rasar/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:27:05+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Kjell lost everything - except his life: \"I am completely moved by all the help\"", "summary": "THE DRAMA. The most vulnerable of the catastrophic fire are met with a form of national teddy bear hug. Now little Bridget Sofia has got a pair of tights. In Kjell's plastic bag is a shirt he picked up with him. Ronny has changed the swimming trunks he escaped in for a pair of underpants and shorts. - Forgive the tears, but I am completely moved by all the help we received, says Kjell Låstad.", "title_original": "Kjell förlorade allt – utom livet: ”Blir helt rörd av all hjälp”", "summary_original": "DRAMMEN. Katastrofbrandens mest utsatta möts av en form av nationell bamsekram. Nu har lilla Bridget Sofia fått ett par tajts. I Kjells plastkasse ligger en tröja han plockat med sig. Ronny har bytt badbyxorna han flydde i mot ett par kalsonger och shorts. – Förlåt tårarna, men jag blir helt rörd av all hjälp vi mötts av, säger Kjell Låstad.", "link": "https://www.dn.se/varlden/kjell-forlorade-allt-utom-livet-blir-helt-rord-av-all-hjalp/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:19:14+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Live report on the war in Ukraine and the security situation in Europe", "summary": "Follow our live reporting on the war in Ukraine and the security situation in Europe.", "title_original": "Direktrapport om kriget i Ukraina och säkerhetsläget i Europa", "summary_original": "Följ vår direktrapportering om kriget i Ukraina och säkerhetsläget i Europa.", "link": "https://www.hd.se/varlden/direktrapport-om-kriget-i-ukraina-och-sakerhetslaget-i-europa/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:17:25+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Live report on the war in Ukraine and the security situation in Europe", "summary": "Follow our live reporting on the war in Ukraine and the security situation in Europe.", "title_original": "Direktrapport om kriget i Ukraina och säkerhetsläget i Europa", "summary_original": "Följ vår direktrapportering om kriget i Ukraina och säkerhetsläget i Europa.", "link": "https://www.sydsvenskan.se/varlden/direktrapport-om-kriget-i-ukraina-och-sakerhetslaget-i-europa/", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:17:25+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "This is where the fire starts in Drammen - see the first minutes", "summary": "The fire in Drammen has destroyed over 100 homes and caused extensive damage in the area. At the same time, it is unclear to the public what was the cause of the flames.  - No one expected something so big. When we heard the alarm and saw the fire truck, we thought it would be extinguished immediately, says Ercan Ertas. Saw when the first fire engine arrived TV4 Nyheterna can now show images of when the fire started. Ercan Ertas lives in Drammen with his family and saw the first flames from a distance. Then he started filming with the mobile phone. - After a short while, the flames started to get so big that they spread to four townhouses at the same time, he says. At a press conference on Saturday, Norwegian police announced that they are receiving tips from the public, while claiming that there is a clear picture of the sequence of events. Ercan Ertas says that five to six fire engines arrived in a short time, but that it took a while before they could start the extinguishing work. As he watched the flames spread, he never thought the damage would be so devastating. \"The heart bleeds\" The Norwegian crisis management authority DSB has determined that the fire is the largest in modern Norwegian history. Fire chief Calle Varfjell said at Saturday's press conference that the city's narrow streets and green areas, combined with the weather, allowed the fire to spread quickly. When Ercan Ertas looks out over the houses that have been destroyed, he thinks of those who were hit the hardest. - The heart is bleeding, many have lost their houses. It is a very big disaster. Ercan's family's home was hit by the cloud of smoke and suffered a 20-hour power outage. His thoughts go out to all those who need help the most. - We are hurting inside. We hope it works out.", "title_original": "Här startar branden i Drammen – se första minuterna", "summary_original": "Branden i Drammen har ödelagt över 100 bostäder och orsakat stora skador i området. Samtidigt är det oklart för allmänheten vad som låg till grund för lågorna.  – Ingen förväntade sig något så stort. När vi hörde larmet och såg brandbilen så trodde vi att den skulle släckas direkt, säger Ercan Ertas. Såg när första brandbilen kom TV4 Nyheterna kan nu visa bilder på när branden startade. Ercan Ertas bor i Drammen med sin familj och såg de första lågorna på avstånd. Då började han filma med mobiltelefonen. – Efter en kort stund började lågorna bli så stora att de spred sig till fyra radhus samtidigt, säger han. Vid en presskonferens under lördagen meddelade norsk polis att man tar emot tips från allmänheten, samtidigt som de påstår att det finns en tydlig bild av händelseförloppet. Ercan Ertas berättar att fem till sex brandbilar kom på kort tid, men att det tog ett tag innan de kunde påbörja släckningsarbetet. När han såg lågorna sprida sig trodde han aldrig att skadorna skulle bli så förödande. ”Hjärtat blöder” Den norska krishanteringsmyndigheten DSB har slagit fast att branden är den största i modern norsk historia. Brandbefälet Calle Varfjell sade vid lördagens presskonferens att stadens smala gator och grönområden, i kombination med vädret, gjorde att branden kunde sprida sig snabbt. När Ercan Ertas ser ut över de hus som ödelagts tänker han på de som drabbats värst. – Hjärtat blöder, många har förlorat sina hus. Det är en väldigt stor katastrof. Ercans familjs bostad nåddes av rökmolnet och drabbades av strömavbrott i 20 timmar. Hans tankar går till alla de som behöver hjälp mest. – Vi har ont inombords. Vi hoppas att det ordnar sig.", "link": "https://www.tv4.se/artikel/45Yd9nYVzjcCc5FToRiHDp/haer-startar-branden-i-drammen", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:13:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/norge", "/brand"]}, {"id": 120, "title": "July 18: Don't miss today's news", "summary": "Everyone survived the fire in Drammen but 400 people lost their homes, young parents plan in detail exactly when to give birth and the summer pedestrian streets divide Stockholmers into two camps – here are the news you cannot miss from the day.", "title_original": "18 juli: Missa inte dagens nyheter", "summary_original": "Alla överlevde efter branden i Drammen men 400 personer förlorade sina hem, unga föräldrar planerar i detalj exakt när de ska föda barn och sommarens gågator delar stockholmarna i två läger– här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/18-juli-missa-inte-dagens-nyheter/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:59:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "5,000 red headbands, world artists and total euphoria - that was Smörtaxen's giant party", "summary": "The butter tax shifted up to a new level when thousands of partygoers filled the Citadel area in Landskrona.  Sydsvenskan was there in the crowd and captured the day. Did you get caught in the picture? See below!", "title_original": "5 000 röda pannband, världsartister och total eufori – så var Smörtaxens jättefest", "summary_original": "Smörtaxen växlade upp till en ny nivå när tusentals festdeltagare fyllde Citadellområdet i Landskrona.  Sydsvenskan var på plats i vimlet och fångade dagen. Fastnade du på bild? Se nedan!", "link": "https://www.sydsvenskan.se/skane/5-000-roda-pannband-varldsartister-och-total-eufori-sa-var-smortaxens-jattefest/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:57:31+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Crocodiles may guard Israeli prisons", "summary": "A new law in Israel no longer classifies crocodiles as wild animals but as \"farmed\" wild animals and may thus be used in prison facilities.", "title_original": "Krokodiler kan komma att vakta israeliska fängelser", "summary_original": "En ny lag i Israel klassificerar inte längre krokodiler som vilda djur utan som ”uppfödda” vilda djur och kan därmed komma att användas vid fängelseanläggningar.", "link": "https://www.hd.se/varlden/krokodiler-kan-komma-att-vakta-israeliska-fangelser/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:56:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "Crocodiles may guard Israeli prisons", "summary": "A new law in Israel no longer classifies crocodiles as wild animals but as \"farmed\" wild animals and may thus be used in prison facilities.", "title_original": "Krokodiler kan komma att vakta israeliska fängelser", "summary_original": "En ny lag i Israel klassificerar inte längre krokodiler som vilda djur utan som ”uppfödda” vilda djur och kan därmed komma att användas vid fängelseanläggningar.", "link": "https://www.sydsvenskan.se/varlden/krokodiler-kan-komma-att-vakta-israeliska-fangelser/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:56:55+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Two US soldiers killed in Iranian attack", "summary": "Two US soldiers have been killed in an Iranian attack on a military base in Jordan, the US military says. Another soldier is missing.", "title_original": "Två amerikanska soldater dödade i iransk attack", "summary_original": "Två amerikanska soldater har dödats i en iransk attack mot en militärbas i Jordanien, uppger USA:s militär. Ytterligare en soldat saknas.", "link": "https://www.sydsvenskan.se/varlden/tva-amerikanska-soldater-dodade-i-iransk-attack/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:27:15+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Blood Rot, part 29 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 29 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-29-av-57/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "DN Debate. \"Municipalities cannot bear the risk themselves - the state must step in\"", "summary": "DN DEBATE. Municipalities are expected to say yes to giant establishments - but are forced to bear the risks before the benefits accrue to them and the rest of the country. Why should they take a chance when the state could so easily give them better conditions? Enough now, writes the Acceleration Office together with 34 representatives from the country's municipalities and trade associations.", "title_original": "DN Debatt. ”Kommunerna kan inte bära risken själva – staten måste in”", "summary_original": "DN DEBATT. Kommuner förväntas säga ja till jätteetableringar – men tvingas stå för riskerna innan fördelarna kommer dem och resten av landet till gagn. Varför ska de chansa när staten så lätt skulle kunna ge dem bättre förutsättningar? Nog nu, skriver Accelerationskontoret tillsammans med 34 representanter från landets kommuner och branschorganisationer.", "link": "https://www.dn.se/debatt/kommunerna-kan-inte-bara-risken-sjalva-staten-maste-in/", "date_display": "2026-07-18", "date_iso": "2026-07-18T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Paper-and-pencil comeback as AI opposition grows in US", "summary": "ROARING SPRINGS, PENNSYLVANIA. A sleepy small town of just over two thousand inhabitants in the interior of Pennsylvania is an epicenter of the growing American opposition to AI. A ruled notebook of an ancient cut is making a comeback as more and more American universities return to paper and pencil.", "title_original": "Comeback för papper och penna när AI-motståndet växer i USA", "summary_original": "ROARING SPRING, PENNSYLVANIA. En sömnig småstad med drygt två tusen invånare i Pennsylvanias inland är ett epicentrum för det växande amerikanska motståndet mot AI. Ett linjerat skrivhäfte av uråldrigt snitt gör comeback när allt fler amerikanska universitet återvänder till papper och penna.", "link": "https://www.dn.se/kultur/comeback-for-papper-och-penna-nar-ai-motstandet-vaxer-i-usa/", "date_display": "2026-07-18", "date_iso": "2026-07-18T17:50:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Police chief: \"We understand where the fire started\"", "summary": "The fire in Drammen is described as the worst in modern times in Norway. On Saturday, police chief Geir Oustorp announces that so far nothing suspicious has been discovered. - We have an idea of ​​where it started.", "title_original": "Polischef: ”Vi förstår var branden startade”", "summary_original": "Branden i Drammen beskrivs som den värsta i modern tid i Norge. På lördagen meddelar polischefen Geir Oustorp att man hittills inte upptäckt något misstänkt. – Vi har en uppfattning om var det startade.", "link": "https://www.dn.se/varlden/polischef-vi-forstar-var-branden-startade/", "date_display": "2026-07-18", "date_iso": "2026-07-18T17:22:23+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "The arena construction has shaken the Finnish government", "summary": "Finland's Riksdag interrupts the summer vacation for a vote of confidence. It is the support for the construction of an arena in Helsinki that created a crisis for Prime Minister Petteri Orpo and the Coalition Party.", "title_original": "Arenabygget har satt Finlands regering i gungning", "summary_original": "Finlands riksdag avbryter sommarledigheten för en förtroendeomröstning. Det är stödet till ett arenabygge i Helsingfors som skapat en kris för statsminister Petteri Orpo och Samlingspartiet.", "link": "https://www.dn.se/varlden/arenabygget-har-satt-finlands-regering-i-gungning/", "date_display": "2026-07-18", "date_iso": "2026-07-18T17:03:52+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Viktor Karlsson: SD wants to pay people 350,000 to stop being Swedes", "summary": "The Sweden Democrats want to give re-migration grants to Swedes born abroad who renounce their citizenship. That says a lot about the party's motives.", "title_original": "Viktor Karlsson: SD vill betala människor 350 000 för att sluta vara svenskar", "summary_original": "Sverigedemokraterna vill ge återvandringsbidrag till utlandsfödda svenskar som säger upp sitt medborgarskap. Det säger mycket om partiets motiv.", "link": "https://www.dn.se/ledare/viktor-karlsson-sd-vill-betala-manniskor-350-000-for-att-sluta-vara-svenskar/", "date_display": "2026-07-18", "date_iso": "2026-07-18T16:35:41+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Senator rushes on list of future presidential candidates", "summary": "NEW YORK. Everyone is suddenly talking about Senator Jon Ossoff, 39, of Georgia. In a short time, the Democrat has sailed up to second place on the gambling company Polymarket's list of potential presidential candidates. Many believe that he can unite the Democrats in their opposition to Trump.", "title_original": "Senator rusar på lista över framtida presidentkandidater", "summary_original": "NEW YORK. Alla pratar plötsligt om senatorn Jon Ossoff, 39, från Georgia. På kort tid har demokraten seglat upp på andraplats på spelbolaget Polymarkets lista över potentiella presidentkandidater. Många tror att han kan ena Demokraterna i motståndet mot Trump.", "link": "https://www.dn.se/varlden/senator-rusar-pa-lista-over-framtida-presidentkandidater/", "date_display": "2026-07-18", "date_iso": "2026-07-18T16:30:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "New find in the mine hole in Norberg - two cars have been lifted up", "summary": "The mine hole in Norberg became known to the public four years ago, when a woman was pushed down 24 meters but survived. 41-year-old Taher Amini was later sentenced to life imprisonment and deportation for aggravated rape and attempted murder. His ex-wife was also reported missing in 2019. According to the woman who was pushed down, Amini must have said before the crime that he had killed his ex-wife. In June this year, the mine hole was blocked off again as part of a preliminary investigation into murder. The case is handled by the police's Cold Case Group in Region Mitt. The restrictions were lifted at the beginning of July. If the operation led to any findings, the police did not want to comment. Finds have been made Now Mikael Eriksson, group leader of the Kalla fall group, tells TV4 Nyheterna that the police have found things at the mine hole. - We have recovered two cars from the mine hole. But they are dealt with and we have removed them from the murder investigation, he says. The police will now try to find out how and why the cars ended up in the hole. According to Eriksson, they must have ended up there on different occasions. - We are in the process of analyzing everything we have done at this location. It can both include and exclude more things, but we want to try to keep it within the scope of the preliminary investigation, he says. When asked if the other findings can be connected to the murder investigation, Eriksson replies that this is exactly what they are currently working on. - It remains to be seen whether what we have found - can it be connected to the murder? That is the challenge. \"Grateful to throw things down here\" According to Eriksson, the hole is so deep that it disappears in the dark. - This place, it's incredible, what shall we call it, grateful to throw stuff down here, because no one will find it. You can't look down into this hole from above, he says. Now \"classic murder work\" is underway, where both the findings and other things in the area are investigated further, with more interrogations and continued information gathering. - We don't really have a reasonable suspect in this situation. We have this in the first stages of a reconnaissance murder, he says. Taher Amini is thus not s", "title_original": "Nya fyndet i gruvhålet i Norberg – två bilar har hissats upp", "summary_original": "Gruvhålet i Norberg blev känt för allmänheten för fyra år sedan, när en kvinna knuffades ner 24 meter men överlevde. 41-årige Taher Amini dömdes senare till livstids fängelse och utvisning för grov våldtäkt och mordförsök. Även hans exfru anmäldes försvunnen år 2019. Enligt kvinnan som knuffades ner ska Amini före dådet ha sagt att han hade dödat sin exfru. I juni i år spärrades gruvhålet av igen inom ramen för en förundersökning om mord. Ärendet hanteras av polisens Kalla fall-grupp i region Mitt. Avspärrningarna hävdes i början av juli. Om insatsen lett till några fynd ville polisen då inte kommentera. Fynd har gjorts Nu säger Mikael Eriksson, gruppchef för Kalla fall-gruppen, till TV4 Nyheterna att polisen har hittat saker vid gruvhålet. – Två bilar har vi fått upp ur gruvhålet. Men de är hanterade och vi har avfört dem från mordutredningen, säger han. Hur och varför bilarna hamnat i hålet ska polisen nu försöka ta reda på. Enligt Eriksson ska de ha hamnat där vid olika tillfällen. – Vi håller på att analysera allting vi har gjort på den här platsen. Det kan både inkludera och exkludera fler saker, men vi vill försöka hålla det inom ramen för förundersökningen, säger han. På frågan om de andra fynden kan kopplas till mordutredningen svarar Eriksson att det är just det man nu arbetar med. – Det är att se om det vi har hittat – kan det kopplas till mordet? Det är det som är utmaningen. ”Tacksamt att slänga ner grejer här” Enligt Eriksson är hålet så djupt att det försvinner i mörkret. – Den här platsen, det är otroligt, vad ska vi kalla det för, tacksamt att slänga ner grejer här, för det är ingen som kommer att hitta det. Du kan ju inte se ner i det här hålet uppifrån, säger han. Nu pågår ”klassiskt mordarbete”, där både fynden och annat i området utreds vidare, med fler förhör och fortsatt informationsinhämtning. – Vi har egentligen ingen skäligen misstänkt i det här läget. Vi har det här i förstadiet till ett spaningsmord, säger han. Taher Amini är därmed inte skäligen misstänkt i ärendet. Polisen vill inte kommentera vem man söker eller om utredningen har koppling till försvinnandet av Aminis exfru.", "link": "https://www.tv4.se/artikel/4CLv6eqFNYjXMbifcxMO04/nya-fyndet-i-gruvhalet-i-norberg-tva-bilar-har-hissats-upp", "date_display": "2026-07-18", "date_iso": "2026-07-18T16:26:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/polisen", "/kriminalitet", "/gruvdramat-i-norberg"]}, {"id": 133, "title": "Expert: This is how the US is trying to break Iran", "summary": "The US has intensified its attacks on Iran and since the outbreak of the conflict both tactics and weapons have changed. - They have ensured that it has become a war on the television screen, says Albin Aronsson at the Total Defense Research Institute.", "title_original": "Expert: Så försöker USA bryta ned Iran", "summary_original": "USA har intensifierat attackerna mot Iran och sedan konfliktens utbrott har såväl taktiken som vapnen förändrats. – De har sett till att det blivit ett krig på tv-skärm, säger Albin Aronsson på Totalförsvarets forskningsinstitut.", "link": "https://www.dn.se/varlden/expert-sa-forsoker-usa-bryta-ned-iran/", "date_display": "2026-07-18", "date_iso": "2026-07-18T16:21:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "New US attacks intended to \"punish\" Iran", "summary": "The US has launched new attacks against Iran. The attack is a response to Iran's previous attack on Jordan, in which two American servicemen were killed.", "title_original": "Nya USA-attacker avsedda att ”bestraffa” Iran", "summary_original": "USA har inlett nya attacker mot Iran. Angreppet är ett svar på Irans tidigare anfall mot Jordanien, där två amerikanska militärer dödades.", "link": "https://www.dn.se/varlden/iran-attackerade-usa-allierade-i-gulfregionen/", "date_display": "2026-07-18", "date_iso": "2026-07-18T15:46:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Christians on France's yes to euthanasia: \"An ethical breakdown\"", "summary": "Requires freedom of conscience so that healthcare professionals do not have to go against their convictions.", "title_original": "Kristna om Frankrikes ja till dödshjälp: ”Ett etiskt sammanbrott”", "summary_original": "Kräver samvetsfrihet så att vårdpersonal ska slippa gå emot sin övertygelse.", "link": "https://www.dagen.se/nyheter/kristna-om-frankrikes-ja-till-doedshjaelp-ett-etiskt-sammanbrott/10446581", "date_display": "2026-07-18", "date_iso": "2026-07-18T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Missed the TV4 participation - own words after the emergency attack", "summary": "The return regarding her participation came on Friday evening. But both colleagues and friends say that it is rare that Pernilla ever cancels a performance. The director Staffan Götestam, also known as Jonatan Lejonhjärta in Bröderna Lejonhjärta, says that he received a text message from Pernilla Wahlgren when she realized that she would not be able to make the television appearance. - Pernilla never freaks out, that is, never. She is so reliable and the world's professional, he says. According to Götestam, it was a case of severe pain and a situation that could not be postponed. - She had a terrible toothache. She has an inflammation in her teeth and had an emergency dentist appointment today, so she had to take it. Unsuccessful root canal behind the refusal The background to the problems must be a previous root canal that went wrong. Pernilla Wahlgren's press officer Magnus Stråberg explains that the procedure needed to be done immediately. - It must be done now if she is to be alert on television on Tuesday, says Stråberg, referring to Pernilla's recurring gig at Allsång at Skansen. Gig after the operation After the operation, Pernilla Wahlgren tells TV4 Nyheterna that the visit to the dentist resulted in a temporary solution. \"They only made a temporary repair now because there was too little time,\" she writes. Wahlgren explains that it needed to go quickly because she has a gig already tonight and therefore has to travel to Örebro. At the same time, she assures that the pain is under control at the moment. \"I won't have to be in any more pain until Wednesday anyway...!\", writes Pernilla Wahlgren. Would pay tribute to Astrid Lindgren's world Wahlgren was booked in connection with Junibacken in Stockholm celebrating 30 years. The plan was that she would guest on Nyhetsmorgon and share memories connected to Astrid Lindgren's world. But the emergency dental surgery led to a late cancellation.", "title_original": "Missade TV4-medverkan – egna orden efter akutingreppet", "summary_original": "Återbudet kring hennes medverkan kom på fredagskvällen. Men både kollegor och vänner menar att det är sällsynt att Pernilla någonsin ställer in ett framträdande. Regissören Staffan Götestam, även känd som Jonatan Lejonhjärta i Bröderna Lejonhjärta, berättar att han fick ett sms från Pernilla Wahlgren när hon insåg att hon inte skulle kunna genomföra tv-framträdandet. – Pernilla bangar aldrig ur, alltså aldrig. Hon är så pålitlig och världens proffs, säger han. Enligt Götestam rörde det sig om kraftig värk och en situation som inte gick att skjuta upp. – Hon hade fruktansvärd tandvärk. Hon har en inflammation i tänderna och fick en akuttid hos tandläkaren i dag, så hon var tvungen att ta den. Misslyckad rotfyllning bakom återbudet Bakgrunden till besvären ska vara en tidigare rotfyllning som gått fel. Pernilla Wahlgrens pressansvarige Magnus Stråberg förklarar att ingreppet behövde göras omgående. – Det måste göras nu om hon ska vara pigg i tv på tisdag, säger Stråberg och syftar på Pernillas återkommande gig  på Allsång på Skansen. Gig efter operationen Efter ingreppet berättar Pernilla Wahlgren för TV4 Nyheterna att tandläkarbesöket resulterade i en tillfällig lösning. ”De gjorde bara en provisorisk lagning nu eftersom det blev för kort om tid”, skriver hon. Wahlgren förklarar att det behövde gå snabbt eftersom hon har ett gig redan i kväll och därför måste resa till Örebro. Samtidigt försäkrar hon att smärtan är under kontroll för tillfället. ”Jag ska inte behöva ha mer ont fram till onsdag i alla fall...!”, skriver Pernilla Wahlgren. Skulle hylla Astrid Lindgrens värld Wahlgren var inbokad i samband med att Junibacken i Stockholm firar 30 år. Planen var att hon skulle gästa Nyhetsmorgon och dela minnen kopplade till Astrid Lindgrens värld. Men den akuta tandoperationen ledde till en sen avbokning.", "link": "https://www.tv4.se/artikel/4vX6pS4c9gDEW5IW3YHZoL/pernillas-foersta-ord-efter-operationen-staellde-in-nyhetsmorgon", "date_display": "2026-07-18", "date_iso": "2026-07-18T12:12:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/personer/pernilla-wahlgren", "/tandvard", "/kandisar", "/allsang-pa-skansen"]}, {"id": 137, "title": "Sugar found in gas clouds - in space", "summary": "It is researchers in Spain who have discovered sugar molecules through spectroscopy, which measures different wavelengths of light. The sugar they discovered is called erytrulose and is found in, among other things, raspberries and, somewhat unexpectedly, in tan-without-sunscreen. It is not the first time that scientists have discovered sugar molecules in space, but when it is in the gas clouds near the center of the Milky Way, where stars and planets can form, it becomes interesting, according to the scientists. This indicates that the sugar occurs spontaneously in the gas cloud. According to the researchers, erythrulose is one of the largest sugar molecules discovered so far. In addition to providing energy for various forms of life, sugar is an important component of life's building blocks, RNA and DNA. It may have come to Earth through a meteorite or comet that hit the Earth and be a clue to where the building blocks of life come from, Rebecca Allen of Swinburne University of Technology in Australia, who was not involved in the study, told NBC. The study has been published in the journal Nature Astronomy, and the researchers write that even if the newly discovered form of sugar is not essential for life, it may have played a role in starting life on Earth.", "title_original": "Socker hittat i gasmoln – i rymden", "summary_original": "Det är forskare i Spanien som har upptäckt sockermolekyler genom spektroskopi, som mäter olika våglängder av ljus. Sockret de spanat in heter erytrulos och finns i bland annat hallon och lite oväntat i brun-utan-solkräm. Det är inte första gången som forskare upptäcker sockermolekyler i rymden men när det finns i gasmolnen nära Vintergatans mitt, där stjärnor och planeter kan bildas, blir det enligt forskarna intressant. Det pekar på att sockret uppstår spontant i gasmolnet. Erytrulos är enligt forskarna en av de största sockermolekyler som upptäckts hittills. Förutom att ge energi till olika livsformer så är socker en viktig beståndsdel i livets byggstenar rna och dna. Det kan ha kommit till jorden genom en meteorit eller komet som träffade jorden och vara en ledtråd till var livets grundstenar kommer ifrån, säger Rebecca Allen vid Swinburne University of Technology i Australien, som inte varit delaktig i studien, till NBC. Studien har publicerats i tidskriften Nature Astronomy och forskarna skriver att även om just den nyupptäckta sockerformen inte är avgörande för liv så kan den ha spelat en roll i att starta i gång livet på jorden.", "link": "https://www.tv4.se/artikel/tt-260718-rymdsocker1-9b6914c7/socker-hittat-i-gasmoln-i-rymden", "date_display": "2026-07-18", "date_iso": "2026-07-18T09:12:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Spanien", "/spanien", "/australien", "/kanada", "/inrikes", "/rymden"]}, {"id": 138, "title": "The doctor's concern about the testosterone hype among Swedish men: \"Big risks\"", "summary": "Interest in testosterone has exploded, not least among men who want to look fit without changing their lifestyle or training. Mikael Lehtihet believes that social media and celebrities who openly talk about their experiences contribute to the trend. - It's a quick fix. You get a better, well-trimmed, fresh-looking body. And that's what we men want to be, says Lehtihet, docent in hormonal disorders. But according to Mikael Lehtihet, the real need for testosterone supplementation is unusual among healthy men. Less than half a percent of men between the ages of 40 and 50 have a disease that requires treatment. For women, it is even rarer and should only be given by specialist doctors. \"You never know what you're getting\" The black market involves great risks. The preparations may be manufactured under unsafe conditions and contain dangerous substances. - It can be done in a garage in a cement mixer where you mix oil and substances. It can be anything from bacteria, viruses, dust particles in. Not the substance that you state it is, or significantly more, or mixed with other substances as well. It's a huge risk, I see it as, says Mikael Lehtihet. Myths about testosterone Several myths about testosterone persist, including that levels drop sharply with age or that it would make the user aggressive. - Most studies show that it does not actually decrease with age, if weight is taken into account, says Lehtihet. He explains that the average BMI value in Swedish men has increased from around 24 to 27 in recent decades, which affects testosterone levels more than age. He also dispels the myth that testosterone use would contribute to increased aggression. - There are no studies that show that testosterone makes you aggressive. It is rather the other way around, explains Lehtihet. However, overuse can lead to the body's own testosterone production being shut down. This leads to the risk of impotence, depression and reduced fertility. - You spoil yourself a bit there,", "title_original": "Läkarens oro för testosteronhypen bland svenska män: ”Stora risker”", "summary_original": "Intresset för testosteron har exploderat, inte minst bland män som vill se vältränade ut utan att lägga om livsstil eller träning. Mikael Lehtihet menar att sociala medier och kändisar som öppet berättar om sina erfarenheter bidrar till trenden. – Det är en quick fix. Man får en bättre, vältrimmad, ser fräsch ut i kroppen. Och det vill vi också män vara, säger Lehtihet, docent i hormonsjukdomar. Men enligt Mikael Lehtihet är verkligt behov av testosterontillskott ovanligt bland friska män. Mindre än en halv procent av män mellan 40 och 50 år har en sjukdom som kräver behandling. För kvinnor är det ännu mer sällsynt och ska endast ges av specialiserade läkare. ”Du vet aldrig vad du får” Den svarta marknaden innebär stora risker. Preparaten kan vara tillverkade under osäkra förhållanden och innehålla farliga ämnen. – Det kan vara gjort i ett garage i en cementblandare där man blandar olja och substanser. Det kan vara allt ifrån bakterier, virus, dammpartiklar i. Inte den substansen som du uppger att det är, eller betydligt mer, eller blandat med andra substanser också. Det är en enorm risk, ser jag det som, säger Mikael Lehtihet. Myter om testosteron Flera myter om testosteron lever kvar, bland annat att nivåerna sjunker kraftigt med åldern eller att det skulle göra användaren aggressiv. – De flesta studier visar att det egentligen inte sjunker med åldern, om man tar hänsyn till vikten, säger Lehtihet. Han förklarar att det genomsnittliga BMI-värdet hos svenska män har ökat från cirka 24 till 27 de senaste decennierna, vilket påverkar testosteronnivåerna mer än åldern. Han slår även hål på myten att testosteronanvändning skulle bidra till ökad aggression. – Det finns inga studier som visar att man blir aggressiv av testosteron. Det är snarast tvärsemot, förklarar Lehtihet. Överanvändning kan däremot leda till att kroppens egen testosteronproduktion stängs av. Detta leder till risk för impotens, nedstämdhet och nedsatt fertilitet. – Man förstör lite för sig själv där, säger Mikael Lehtihet.", "link": "https://www.tv4.se/artikel/6EdDqm0SpjTsEqSR9hkauB/svenskar-jagar-ideal-riskerar-haelsan-med-testosteron", "date_display": "2026-07-18", "date_iso": "2026-07-18T08:05:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/testosteron", "/hormoner", "/tullverket", "/lakare", "/halsa"]}, {"id": 139, "title": "Breadsticks with garlic butter", "summary": "Soft and airy breadsticks brushed with a garlic butter are easy to bake and are suitable for everything from snacks, soup and grilled to the buffet. Feel free to serve them freshly baked when they are still warm - then they are at their best. To Fredrik Nylén's recipe", "title_original": "Breadsticks med vitlökssmör", "summary_original": "Mjuka och luftiga breadsticks penslade med ett vitlökssmör är enkla att baka och passar till allt från snacks, soppa och grillat till buffén. Servera dem gärna nygräddade när de fortfarande är ljumma – då är de som allra godast. Till Fredrik Nyléns recept", "link": "https://www.tv4.se/artikel/4Zo03RTfgNrtiQmVnThYa7/breadsticks-med-vitloekssmoer", "date_display": "2026-07-18", "date_iso": "2026-07-18T05:47:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Mat", "/mat", "/kokets-helgtips", "/koket", "/fredrik-nylen"]}, {"id": 140, "title": "Teenage boys forced peers to eat dog poo in the school yard", "summary": "At the end of March this year, a boy was subjected to serious violence on a schoolyard in central Sweden. According to the indictment, three boys of the same age allegedly kicked and hit him, strangled him and forced him to perform deeply degrading actions - including eating dog poo while filming, reports the news agency Siren. Forced to drink various things Gefle Dagblad also writes that the boy is said to have been beaten with a stick and, through violence and threats, forced to put various objects in his mouth, drink various things and bark like a dog. For this, the boys are now being sentenced for gross assault and gross illegal coercion, writes Siren. The court assesses that all three participated in the acts, stood in solidarity with each other and encouraged each other. Therefore, they are judged as accomplices. All of them admit responsibility for assault of the ordinary degree, and one of them also admits unlawful coercion of the ordinary degree. SEK 100,000 in damages Two of the boys are sentenced to youth care. The third receives a more severe sentence: youth service for 85 hours because he is also convicted, despite his denial, for an earlier assault on a girl of the same age that allegedly took place at school during school hours the same month. He must pay SEK 8,000 in damages to the girl. The three must also pay SEK 101,652 in damages to the abused boy. Part of the amount must be paid by the guardian.", "title_original": "Tonårspojkar tvingade jämnårig att äta hundbajs på skolgården", "summary_original": "I slutet av mars i år utsattes en pojke för grovt våld på en skolgård i Mellansverige. Tre jämnåriga pojkar ska enligt åtalet ha sparkat och slagit honom, strypt honom och tvingat honom till djupt förnedrande handlingar – bland annat att äta hundbajs medan de filmade, rapporterar nyhetsbyrån Siren. Tvingades dricka olika saker Gefle Dagblad skriver även att pojken ska ha slagits med en pinne och, genom våld och hot, tvingats stoppa olika föremål i munnen, dricka olika saker och skälla som en hund. För detta döms nu pojkarna för grov misshandel och grovt olaga tvång, skriver Siren. Rrätten bedömer att alla tre deltog i gärningarna, solidariserade sig med varandra och eggade på varandra. Därför döms de som medgärningsmän. Samtliga medger ansvar för misshandel av normalgraden, och en av dem medger även olaga tvång av normalgraden. 100 000 kronor i skadestånd Två av pojkarna döms till ungdomsvård. Den tredje får ett strängare straff: ungdomstjänst i 85 timmar eftersom att han även döms, mot sitt nekande, för en tidigare misshandel av en jämnårig flicka som ska ha skett i skolan under skoltid samma månad. Han ska betala 8 000 kronor i skadestånd till flickan. De tre ska dessutom betala 101 652 kronor i skadestånd till den misshandlade pojken. En del av beloppet ska betalas av vårdnadshavare.", "link": "https://www.tv4.se/artikel/7mq8R62rZswYpKSoGHU8I3/tonarspojkar-doems-tvingade-jaemnarig-att-aeta-hundbajs", "date_display": "2026-07-18", "date_iso": "2026-07-18T05:46:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/dom", "/brott"]}, {"id": 141, "title": "Mat's little brother took his own life with the hunting weapon: \"Why didn't I ask more\"", "summary": "Mats Nilsson's little brother lived for the forest and hunting was one of his greatest interests. But beneath the surface there was darkness, and he took his own life with his hunting weapon.\n\n- In retrospect - lately you noticed that he withdrew more and more. Stopped answering the phone. You didn't think about it then. Why didn't I ask more? Maybe he would have remained, says Mats Nilsson. Mental illness and gun anxiety Seven out of ten people who take their own lives in Sweden are men, and that it happens with hunting weapons is a common method, especially in Norrland.  In collaboration with the local regions, the Hunters' Association in the four northernmost counties wants to break a stigma and get more people to dare to talk about feelings.\n\n- Maybe there is that stigma, that I can talk about how big moose I shot and how many, but not about how I feel. Because then I can seem weak. They want to make it more normal to dare to speak - because then you can get help, says André Westin, vice chairman of the Hunters' Association Norrbotten. One reason why hunters may hesitate to seek help is a fear of having their weapons confiscated, according to the Hunters' Association. The association therefore wants to change the conversation climate around the campfire and encourage people to talk about how they feel before the mental illness goes too far. But also that the hunters should help those who need professional help to seek help. \n\n- We're not supposed to be psychologists, but we're supposed to be good comrades, says André Westin.  \"Dare to ask\" To reach out, the Hunters' Association works with information materials, lectures and to encourage more hunters to be role models and tell how they feel.\n\n- Dare to open up to it, before it has gone too far. It is a strength to dare to talk about how you feel. You are not the best just because you shot the most moose. You have to dare to talk about how you feel, too. It is important. Because it can be a first step to feeling better and not ending up in the deep gutter, where it is harder to get back, says André Westin.\n\n- Dare to ask if you see someone who is unwell. It is", "title_original": "Mats lillebror tog sitt liv med jaktvapnet: ”Varför frågade jag inte mer”", "summary_original": "Mats Nilssons lillebror levde för skogen och jakten var ett av hans största intressen. Men under ytan fanns ett mörker, och han tog sitt liv med sitt jaktvapen.\n\n– Så här i efterhand – sista tiden märkte man att han drog sig tillbaka mer och mer. Slutade svara i telefon. Man tänkte ju inte på det då. Varför frågade jag inte mer. Kanske hade han funnits kvar, säger Mats Nilsson. Psykisk ohälsa och vapenoro Sju av tio som tar sitt liv i Sverige är män, och att det sker med jaktvapen är en vanlig metod framför allt i Norrland.  I samarbete med de lokala regionerna vill Jägareförbundet i de fyra nordligaste länen bryta ett stigma och få fler att våga prata om känslor.\n\n– Det finns ju kanske det där stigma, om att jag kan prata om hur stora älgar jag skjutit och hur många, men inte om hur jag mår. För då kan jag verka svag. Man vill få det mer normaliserat att våga prata – för då kan du få hjälp, säger André Westin, vice ordförande Jägareförbundet Norrbotten. En orsak till att jägare kan dra sig för att söka hjälp är en rädsla för att få sina vapen beslagtagna, enligt Jägareförbundet. Förbundet vill därför förändra samtalsklimatet runt lägerelden och uppmuntra till att prata om måendet innan den psykiska ohälsan gått för långt. Men även att jägarna ska hjälpa den som behöver professionell hjälp att söka hjälp. \n\n– Vi ska inte vara några psykologer, men vi ska vara goda kamrater, säger André Westin.  ”Våga fråga” För att nå ut jobbar Jägareförbundet med informationsmaterial, föreläsningar och att uppmuntra fler jägare att vara förebilder och berätta hur de mår.\n\n– Våga öppna upp för det, innan det har gått för långt. Det är en styrka att våga prata om sitt mående. Man är inte bäst bara för att man skjutit flest älgar. Man måste våga prata om sitt mående också. Det är viktigt. För det kan vara ett första steg till att må bättre och inte hamna i den djupa rännan, där det är svårare att komma tillbaka, säger André Westin.\n\n– Våga fråga om man ser någon som mår dålig. Det är många som kan vara lite rädda för att fråga för man vet inte vad man får för svar. Men oavsett stå bara kvar, visa att du finns. Det tror jag är oerhört viktigt, säger Mats Nilsson.", "link": "https://www.tv4.se/artikel/4IZr5MBSjI38CQgkt5TfzT/mats-lillebror-tog-sitt-liv-med-sitt-jaktvapen-varfoer-fragade-jag-inte-mer", "date_display": "2026-07-18", "date_iso": "2026-07-18T04:30:17+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/jagarna", "/norrbotten", "/region-norrbotten", "/sjalvmord"]}, {"id": 142, "title": "KD politicians become the new base for Human Bridge", "summary": "Takes over from Lars Råsberg who passed away after a period of illness.", "title_original": "KD-politiker blir ny bas för Human Bridge", "summary_original": "Tar över efter Lars Råsberg som avlidit efter en tids sjukdom.", "link": "https://www.dagen.se/nyheter/kd-politiker-blir-ny-bas-foer-human-bridge/10436891", "date_display": "2026-07-18", "date_iso": "2026-07-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 143, "title": "\"I myself had never prayed or seen anyone else pray\"", "summary": "When farmer Mattias Sedvall's son fell ill, he said his first prayer - and got an answer • Today, large parts of the family are Christians.", "title_original": "”Jag hade själv aldrig bett eller sett någon annan be”", "summary_original": "När bonden Mattias Sedvalls son blev sjuk bad han sin första bön – och fick svar • I dag är stora delar av släkten kristen.", "link": "https://www.dagen.se/livsstil/jag-hade-sjaelv-aldrig-bett-eller-sett-nagon-annan-be/10439178", "date_display": "2026-07-18", "date_iso": "2026-07-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "The Pentecostal church in Jönköping serves food to needy families during the summer holidays", "summary": "Volunteer Karin Zethson: It can be sensitive to admit the need for help and community.", "title_original": "Pingstkyrkan i Jönköping serverar mat till behövande familjer under sommarlovet", "summary_original": "Volontären Karin Zethson: Det kan vara känsligt att erkänna behov av hjälp och gemenskap.", "link": "https://www.dagen.se/nyheter/pingstkyrkan-i-joenkoeping-serverar-mat-till-behoevande-familjer-under-sommarlovet/10443772", "date_display": "2026-07-18", "date_iso": "2026-07-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 145, "title": "Peter Sandwall reveals the gospel's unknown roots in new book", "summary": "In his new book, the music professor reveals that the threads of music also extend via Africa back to the time of the early church.", "title_original": "Peter Sandwall avslöjar gospelns okända rötter i ny bok", "summary_original": "I sin nya bok avslöjar musikprofessorn att musikens trådar även sträcker sig via Afrika tillbaka ända till fornkyrkans tid.", "link": "https://www.dagen.se/kultur/peter-sandwall-avsloejar-gospelns-okaenda-roetter-i-ny-bok/10421867", "date_display": "2026-07-18", "date_iso": "2026-07-18T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 146, "title": "New attacks between the US and Iran - the seventh night in a row", "summary": "The US launched a new wave of attacks against Iran on Friday evening. Explosions have - like earlier this week - been heard, among other things, in the cities of Bandar Abbas and Ahvaz and on the island of Qeshm. Iranian state media reports that at least three people were killed and eight injured as a result of the attacks. Different offers about explosions The Revolutionary Guard in Iran also states that two tankers collided with mines in the Strait of Hormuz late on Friday. Details of the alleged incident are still scarce - and it is unclear what, if any, damage the ships sustained - but Iran claims explosions and fires. The US military command Centcom, for its part, calls Iran's claims about the ships and the explosions \"false\". \"To protect their assets and, above all, their lives, crews should not allow themselves to be misled and enter the minefield,\" the Revolutionary Guards said in a statement, also claiming that four ships were stopped from passing through the strait. Iranian counterattacks The American attacks were completed just before 4 o'clock, Swedish time. By then, Iranian surveillance facilities, logistics infrastructure and weapons depots had been hit, according to Centcom. As on previous nights, Iran has retaliated against US bases across the Middle East, and both Kuwait and Jordan said they activated their air defense systems overnight. According to the Jordanian military, ten Iranian robots have been shot down in the country's territory, without any damage to people or buildings. According to Iran, targets in Bahrain were also attacked during the night.", "title_original": "Nya attacker mellan USA och Iran – sjunde natten i rad", "summary_original": "USA inledde under fredagskvällen en ny våg av attacker mot Iran. Explosioner har – likt tidigare i veckan – bland annat hörts i städerna Bandar Abbas och Ahvaz samt på ön Qeshm. Iranska statliga medier rapporterar att minst tre personer dödats och att åtta skadats till följd av attackerna. Olika bud om explosioner Revolutionsgardet i Iran uppger även att två tankfartyg stött ihop med minor i Hormuzsundet sent på fredagen. Uppgifter om den påstådda händelsen är fortfarande få – och det är oklart vilka eventuella skador fartygen fått – men Iran påstår att explosioner inträffat och att det uppstått bränder. USA:s militärkommando Centcom kallar å sin sida Irans påståenden om fartygen och explosionerna för \"falska\". ”För att skydda sina tillgångar och, framför allt, sina liv, bör besättningar inte låta sig vilseledas och ta sig in i minfältet”, uppger Revolutionsgardet i ett uttalande och påstår även att fyra fartyg stoppats från att passera sundet. Iranska motattacker De amerikanska attackerna slutfördes strax före klockan 4, svensk tid. Då hade iranska övervakningsanläggningar, logistikinfrastruktur och vapenlager träffats, enligt Centcom. Likt tidigare nätter har Iran riktat svarsattacker mot amerikanska baser runt om i Mellanöstern, och både Kuwait och Jordanien uppger att de aktiverat sina luftförsvarssystem under natten. Enligt den jordanska militären har tio iranska robotar skjutits ned i landets territorium, utan att varken människor eller byggnader skadats. Enligt Iran har även mål i Bahrain attackerats under natten.", "link": "https://www.tv4.se/artikel/tt-260718-iranoro1-06e294aa/iran-tankfartyg-brinner-i-hormuzsundet", "date_display": "2026-07-17", "date_iso": "2026-07-17T22:35:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Kuwait", "/kuwait", "/irankriget", "/utrikes", "/usa", "/krig", "/iran", "/jordanien"]}, {"id": 147, "title": "The dermatologist: That's how big the difference is between SPF 30 and 50", "summary": "Dermatologist Petra Verga Kan explains that the difference between SPF 30 and 50 is smaller than many people think - SPF 50 blocks about 98 percent of the sun's rays, while SPF 30 stops about 95 percent - You would think that there was a much bigger difference between 30 and 50, but it is not. Having high sun protection is the most important thing, says Petra Verga Kan, dermatologist. At the same time, she warns against the misconception that SPF 50 means that you can stay 50 times longer in the sun.  - It's something that you use a little in a lab environment when evaluating sun protection, but I don't think it's useful in practice because it can result in miscalculations, 50 times what and so on. So that you may then expose yourself to more sun than you think. If you burn, aloe vera can provide a cooling and soothing effect, but does not affect the healing of the skin in depth.  - It does not heal the skin of what we mean, for example, sun damage, DNA damage or things like that. They cannot be removed with aloe vera, says Petra Verga Kan.\n\nTrue or false – Sunscreen has dangerous substances in it.\n- False. There are certain substances that are looked at a little extra if they could be endocrine disruptors. I don't think they will come to the conclusion that normal use is associated with anything dangerous. But if you are worried, I think you can avoid those subjects. - There is also nothing to indicate that there are cancer-causing substances in sunscreen, says Petra Verga Kan. True or false - You can't get a tan with sunscreen.\n- False. Sunscreen lets some UV radiation through, partly because it does, it is not possible to cover 100% of the skin, and partly because we usually don't use as much as we think. So we get tan even if we use sunscreen and often it is a little slower and a little more healthy True or false - It is good to sunbathe.\n- In between, no, but we need UV light to feel good and we need to be in heat and we need to see the sun and we need to get vitamin D. But we need very little sun for", "title_original": "Hudläkaren: Så stor är skillnaden mellan SPF 30 och 50", "summary_original": "Hudläkaren Petra Verga Kan förklarar att skillnaden mellan SPF 30 och 50 är mindre än många tror – SPF 50 blockerar cirka 98 procent av solstrålarna, medan SPF 30 stoppar ungefär 95 procent  – Man skulle ju tro att det var mycket större skillnad mellan 30 och 50, men det är inte det. Att ha ett högt solskydd är det viktigaste, säger Petra Verga Kan, hudläkare. Samtidigt varnar hon för missuppfattningen att SPF 50 innebär att man kan vara 50 gånger längre i solen.  – Det är någonting som man använder lite i labbmiljö  när man utvärderar solskydd, men jag tycker inte att det är användbart i praktiken för att det kan bli att man räknar fel, 50 gånger vad och så vidare. Så att man kanske då utsätter sig för mer sol än vad man tror. Om man bränner sig kan aloe vera ge en kylande och lindrande effekt, men påverkar inte hudens läkning på djupet.  – Det läker inte huden på det som vi menar till exempel solskador, DNA-skador eller sånt där. De kan man inte få bort med aloe vera, säger Petra Verga Kan.\n\nSant eller falskt – Solkräm har farliga ämnen i sig.\n– Falskt. Det finns vissa ämnen som man tittar lite extra på om de skulle kunna vara hormonstörande. Jag tror inte att de kommer komma fram till att normal användning är förenat med något farligt. Men om man är orolig så tycker jag att man kan undvika de ämnena. – Det finns inget heller som tyder på att det finns cancerframkallande ämnen i solkräm,  säger Petra Verga Kan. Sant eller falskt – Man kan inte bli brun med solkräm.\n– Falskt. Solkräm släpper igenom en del UV-strålning, dels för att den gör det, det går inte att täcka 100% av huden, och dels för att vi oftast inte använder så mycket som vi tror. Så  vi blir bruna även om vi använder solkräm och ofta blir det då lite långsammare och lite mera hälsosamt Sant eller falskt – Det är bra att sola.\n– Mittemellan, nej, men vi behöver ju UV-ljus för att må bra och vi behöver vara i värme och vi behöver se solen och vi behöver få D-vitamin. Men vi behöver väldigt lite sol för att få de här goda effekterna och allt därutöver kan vara skadligt. Så att vi behöver sol, ja, men vi ska absolut inte översola, säger Petra Verga Kan.", "link": "https://www.tv4.se/artikel/5Sv6KUHFsjWeEn9Ty1v2vO/hudlaekaren-skillnaden-mellan-spf-30-och-50-mindre-aen-du-tror", "date_display": "2026-07-17", "date_iso": "2026-07-17T19:19:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/halsa", "/solskydd", "/solskador"]}, {"id": 148, "title": "The expert on the move against China: \"Dishonest but smart\"", "summary": "Conspiracy theories about election fraud have become a central part of Trump's political strategy, according to US expert Andreas Utterström. He notes that Trump repeatedly brings up allegations of electoral fraud from the 2020 election, despite the fact that several courts have ruled that there is no basis. Now, in an address to the nation, Trump is accusing China of influencing the election. - That there should have been election fraud in 2020 is something that he doesn't seem to want to let go, even though there is no evidence whatsoever for it, says Utterström. Utterström believes that the accusations strengthen Trump's image that the establishment opposes him and at the same time lay the groundwork for being able to question the election results if he loses the fall midterm elections. At the same time, he points to the irony that Trump is now making accusations against China, when he previously denied Russian election influence in 2016, despite the fact that American intelligence services presented convincing evidence. That's why Trump is attacking China According to Utterström, Trump's actions are also a way to shift the focus from his own problems, such as the Epstein affair, the war in Iran and rising gasoline prices. - When he is pressed, he always wants a plot twist, that is classic Trump, says Utterström. He explains that the complexity of the US electoral system, with its lack of central electoral authority and varying rules between states, contributes to confusion and makes it easier for conspiracy theories to take hold. - Trump is adept at exploiting these ambiguities to strengthen his narrative that an elite rules in secret. \"Dishonest but smart strategy\" Trump's actions have provoked strong reactions. Among other things, the Democrats' Gavin Newsom wrote on X: \"Last night America saw a mad king ramble\", and believes that this is a plan on Trump's part to rig the election and make the people not believe in the results. - The problem for Newsom and others is that you always end up on the defensive against Trump. In American politics it is usually said that \"when you're explaining, you're losing\". It is this tactic, where Trump constantly came", "title_original": "Experten om utspelet mot Kina: ”Oärligt men smart”", "summary_original": "Konspirationsteorier om valfusk har blivit en central del i Trumps politiska strategi, enligt USA-experten Andreas Utterström. Han konstaterar att Trump återkommande tar upp påståenden om valfusk från valet 2020, trots att flera domstolar slagit fast att det saknas grund. Nu, i ett tal till nationen, anklagar Trump Kina för att ha påverkat valet. – Att det ska ha varit valfusk 2020 är nånting som han inte verkar vilja släppa trots att det inte finns några som helst bevis för det, säger Utterström. Utterström menar att anklagelserna stärker Trumps bild av att etablissemanget motarbetar honom och samtidigt lägger grunden för att kunna ifrågasätta valresultatet om han förlorar höstens mellanårsval. Samtidigt pekar han på ironin i att Trump nu riktar anklagelser mot Kina, när han tidigare förnekat rysk valpåverkan 2016, trots att amerikanska underrättelsetjänster lagt fram övertygande bevis. Därför attackerar Trump Kina Enligt Utterström är Trumps agerande också ett sätt att flytta fokus från egna problem, som Epstein-affären, kriget i Iran och stigande bensinpriser. – När han blir pressad vill han alltid ha en plot twist,  det är klassiskt Trump, säger Utterström. Han förklarar att det amerikanska valsystemets komplexitet, med avsaknad av en central valmyndighet och varierande regler mellan delstater, bidrar till förvirring och gör det lättare för konspirationsteorier att få fäste. – Trump är skicklig på att utnyttja dessa oklarheter för att stärka sin berättelse om att en elit styr i hemlighet. ”Oärlig men smart strategi” Trumps utspel har väckt starka reaktioner. Bland annat demokraternas Gavin Newsom skrev på X: ”I natt såg Amerika en galen kung svamla”, och menar att detta är en plan från Trumps håll att rigga valet och få folket att inte tro på resultaten. – Problemet för Newsom och andra är ju att man hamnar alltid på defensiven mot Trump. I amerikansk politik brukar det heta att ”when you're explaining, you're losing”. Det är denna taktik, där Trump ständigt kommer med nya anklagelser och tvingar motståndarna att försvara sig istället för att själv lägga fram bevis, som enligt Utterström bidragit till hans framgångar. – Det är en oärlig men smart strategi, för den är en av de stora anledningarna till att Trump mot alla odds har blivit vald till president två gånger, säger Andreas Utterström.", "link": "https://www.tv4.se/artikel/5zjldTlqwwCriM9z9XsgEs/experten-om-utspelet-mot-kina-oaerligt-men-smart", "date_display": "2026-07-17", "date_iso": "2026-07-17T18:23:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/usa", "/donald-trump", "/kina"]}, {"id": 149, "title": "Statement by Romina Pourmokthari", "summary": "Statement by Romina Pourmokthari, Minister for Climate and the Environment.", "title_original": "Statement by Romina Pourmokthari", "summary_original": "Statement by Romina Pourmokthari, Minister for Climate and the Environment.", "link": "https://www.government.se/statements/2026/07/statement-by-romina-pourmokthari/", "date_display": "2026-07-17", "date_iso": "2026-07-17T17:46:17+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "1 day old", "tags": ["EU", "Ministry of Climate and Enterprise", "Environment and climate", "Statement", "Romina Pourmokhtari"]}, {"id": 150, "title": "The far right rages against Nolan's cast in \"The Odyssey\"", "summary": "There is usually a big stir when Christopher Nolan releases a new film, and \"The Odyssey\", based on Homer's epic, is no exception. The roles include Matt Damon and Anne Hathaway. But the choice of Lupita Nyong'o as Helen of Troy has caused the most discussion, especially within the extreme right in the United States. Among other things, Matt Walsh, an American conservative commentator, says: \"It is historically completely unreasonable to give the role to an African, then you might as well make Helen of Troy Chinese. He does this because he knows he would be called a racist if he chose a white woman.\" Divided opinions about ancient Greece At the same time, researchers believe that ancient Greece was not as \"white\" as people seem to think. - It was not, and we have known that for several hundred years, that sculptures and temples were painted. But it clashes with the idea that exists from the Renaissance onwards, says Ida Östenberg, professor of ancient culture at the University of Gothenburg.\n\nEven Elon Musk has criticized the film and accuses Nolan of having \"desecrated Homer\" and believes that the choice of actors is about diversity requirements in the pursuit of an Oscar. Living classic Both Christopher Nolan and Lupita Nyong'o have dismissed the criticism, stressing that the film is an artistic interpretation of a myth.  - The point of these works, like Homer, is that they have always been reinterpreted. Ever since ancient times, says Ida Östenberg. - All times make their versions and that is important because it means that this work is not just a dead work but a living canon.", "title_original": "Ytterhögern rasar mot Nolans rollbesättning i ”The Odyssey”", "summary_original": "Det brukar vara stor uppståndelse när Chris
