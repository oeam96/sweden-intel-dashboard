body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }
button:hover, select:hover { background: #f8f9fa; border-color: #bbb; }

button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;
    height: auto;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }

h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {

.btn-link:hover { color: #212529; }
</style>

ETTER/VALLDA. Socialdemokraterna går till val på att minska vildsvinsstammen radikalt. I Landvetter slår man två flugor i en smäll, när djuren som orsakar stor skadegörelse hamnar på tallriken på kommunens serviceboenden.", "link": "https://www.dn.se/sverige/lokala-vildsvin-blir-biff-pa-de-gamlas-lunchtallrik/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:38:21+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 19, "title": "The golf club is under pressure when the nature reserve loses species", "summary": "80 species have disappeared from Kungsmarken. Now the requirements for Lund's academic golf club, which is located in the middle of the nature reserve, are being tightened. But the issue is not simple – the golf course is singled out as both the culprit and the savior in nature conservation. At the same time, the municipality wants to attract even more people to the threatened nature area.", "title_original": "Golfklubben pressas när naturreservatet förlorar arter", "summary_original": "80 arter har försvunnit från Kungsmarken. Nu skärps kraven på Lunds akademiska golfklubb som ligger mitt i naturreservatet. Men frågan är inte enkel – golfbanan pekas ut som både boven och räddaren i naturvården. Samtidigt vill kommunen locka ännu fler människor till det hotade naturområdet.", "link": "https://www.sydsvenskan.se/lund/golfklubben-pressas-nar-naturreservatet-forlorar-arter/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:35:53+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 20, "title": "HIF Direkt: HIF meets the old Sundsvall", "summary": "Victory against bottom team Värnamo last time. Now another crisis team awaits. Sundsvall is last in the super league and thus it is another good scoring chance for HIF. Follow our live coverage and comment on the match here.", "title_original": "HIF Direkt: HIF möter jumbon Sundsvall", "summary_original": "Seger mot bottenlaget Värnamo senast. Nu väntar ytterligare ett krislag. Sundsvall ligger sist i superettan och därmed är det en ny bra poängchans för HIF. Följ vår liverapportering och kommentera matchen här.", "link": "https://www.hd.se/sport/hif-direkt-vad-tror-du-om-nye-managern/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:35:06+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 21, "title": "The bishop works himself out in the supervision of Birgitta Ed", "summary": "The judicial chapter in Strängnäs diocese has received around 3,000 notifications after Aftonbladet's reporting.", "title_original": "Biskopen jävar ut sig i tillsynen av Birgitta Ed", "summary_original": "Domkapitlet i Strängnäs stift har fått runt 3 000 anmälningar efter Aftonbladets rapportering.", "link": "https://www.dagen.se/nyheter/biskopen-jaevar-ut-sig-i-tillsynen-av-birgitta-ed/10404357", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 22, "title": "Ellen took over the pub as a 25-year-old: \"What the hell is this place?\"", "summary": "At first she was skeptical. “What the hell is this place?” was the first thing Ellen Lundberg, 30, thought when she arrived at Lundåkrahamnen in Landskrona.  Today, several years later, she runs the celebrated harbor tavern here together with her partner. But the road has been paved with 14-hour shifts, a strong will and a passion for food that never fades.", "title_original": "Ellen tog över krogen som 25-åring: ”Vad fasiken är det här för ställe?”", "summary_original": "Först var hon skeptisk. ”Vad fasiken är det här för ställe?” var det första Ellen Lundberg, 30, tänkte när hon kom till Lundåkrahamnen i Landskrona.  I dag, flera år senare, driver hon den hyllade hamnkrogen här tillsammans med sin sambo. Men vägen har kantats av 14-timmarspass, en stark vilja och en passion för mat som aldrig sinar.", "link": "https://www.hd.se/landskrona/ellen-tog-over-krogen-som-25-aring-man-far-ett-helt-annat-driv/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:24:39+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 23, "title": "One dead and two young people taken to hospital after house fire", "summary": "One person has died after a house fire in Svenljunga, the police say. The person has not yet been positively identified, but the police write that they have \"clear indications\" of who it is and that they have notified relatives. \"Extremely unclear why it burned\" It was shortly before one in the morning on Sunday that the police and the fire brigade were called to the house, which was completely engulfed in flames when they arrived. The police describe the fire as \"violent\". - So far, it is extremely unclear why it has burned. The technical investigation has not yet been able to begin, says Adam Isaksson Samara at the police. - I don't know if this is a house that is used all year round or if it is some kind of summer cottage or what it is. I don't dare to say anything one way or the other. Two injured young people In addition to the dead person, two people aged 18 have been taken by ambulance to hospital with unclear injuries. They are being cared for and have not been heard from yet. The extinguishing work is still ongoing on Sunday morning. The incident is being investigated as arson.", "title_original": "En död och två ungdomar till sjukhus efter villabrand", "summary_original": "En person har dött efter en villabrand i Svenljunga, uppger polisen. Personen är inte säkerställt identifierad än, men polisen skriver att de har ”tydliga indikationer” på vem det är och att de underrättat anhöriga. ”Ytterst oklart varför det brunnit” Det var strax innan ett på natten till söndag som polisen och brandkåren larmades till huset, som var helt övertänt när de kom fram. Polisen beskriver branden som ”våldsam”. – Än så länge är det ytterst oklart varför det har brunnit. Den tekniska undersökningen har inte kunnat påbörjas än, säger Adam Isaksson Samara vid polisen. – Jag vet inte om det här är ett hus som används året om eller om det är någon form av sommarstuga eller vad det är. Jag vågar inte slå fast något åt varken det ena eller andra hållet. Två skadade ungdomar Utöver den döda personen har två personer i 18-årsåldern förts med ambulans till sjukhus med oklart skadeläge. De vårdas och har inte kunnat höras än. Släckningsarbetet pågår fortfarande på söndagsförmiddagen. Händelsen utreds som mordbrand.", "link": "https://www.tv4.se/artikel/5g60qtdRQ7mOOoI7yKX1Vu/en-doed-och-tva-ungdomar-till-sjukhus-efter-villabrand", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:14:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brand", "/svenljunga"]}, {"id": 24, "title": "Åkesson: Here are SD's new red lines", "summary": "Jimmie Åkesson has several new red lines if the Tidöparties win the election: No deterioration in social security and health insurance. And an extended dental care reform. - Now that we have such low immigration, we have the opportunity to start healing the country again.", "title_original": "Åkesson: Här går SD:s nya röda linjer", "summary_original": "Jimmie Åkesson har flera nya röda linjer om Tidöpartierna vinner valet: Inga försämringar i a-kassan och sjukförsäkringen. Och en utökad tandvårdsreform. – Nu när vi har en så låg invandring får vi möjlighet att börja läka ihop landet igen.", "link": "https://www.hd.se/sverige/akesson-har-gar-sds-nya-roda-linjer/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:03:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 25, "title": "Åkesson: Here are SD's new red lines", "summary": "Jimmie Åkesson has several new red lines if the Tidöparties win the election: No deterioration in social security and health insurance. And an extended dental care reform. - Now that we have such low immigration, we have the opportunity to start healing the country again.", "title_original": "Åkesson: Här går SD:s nya röda linjer", "summary_original": "Jimmie Åkesson har flera nya röda linjer om Tidöpartierna vinner valet: Inga försämringar i a-kassan och sjukförsäkringen. Och en utökad tandvårdsreform. – Nu när vi har en så låg invandring får vi möjlighet att börja läka ihop landet igen.", "link": "https://www.sydsvenskan.se/sverige/akesson-har-gar-sds-nya-roda-linjer/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:03:54+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 26, "title": "Åkesson: Here are SD's new red lines", "summary": "Jimmie Åkesson has several new red lines if the Tidöparties win the election: No deterioration in social security and health insurance. And an extended dental care reform. - Now that we have such low immigration, we have the opportunity to start healing the country again.", "title_original": "Åkesson: Här går SD:s nya röda linjer", "summary_original": "Jimmie Åkesson har flera nya röda linjer om Tidöpartierna vinner valet: Inga försämringar i a-kassan och sjukförsäkringen. Och en utökad tandvårdsreform. – Nu när vi har en så låg invandring får vi möjlighet att börja läka ihop landet igen.", "link": "https://www.svd.se/a/43Rz0G/akesson-har-gar-sd-s-nya-roda-linjer", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:03:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 27, "title": "Jan had a cardiac arrest on the golf course: \"I was incredibly lucky\"", "summary": "Just as the last golf round of the year was about to begin, Jan Öhlund suffered a cardiac arrest.  The incident was a wake-up call for Rya Golf Club - which now wants to train all its members in CPR.", "title_original": "Jan fick hjärtstopp på golfbanan: ”Hade otrolig tur”", "summary_original": "Precis när sista golfrundan för året skulle börja fick Jan Öhlund hjärtstopp.  Händelsen blev en väckarklocka för Rya golfklubb – som nu vill utbilda alla sina medlemmar i HLR.", "link": "https://www.hd.se/helsingborg/jan-fick-hjartstopp-pa-golfbanan-hade-otrolig-tur/", "date_display": "2026-06-21", "date_iso": "2026-06-21T09:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 28, "title": "Three boys dead after swimming accident at Spanish beach", "summary": "Three boys have died after getting into trouble while swimming at a beach near Tarragona in northeastern Spain.", "title_original": "Tre pojkar döda efter badolycka vid spansk strand", "summary_original": "Tre pojkar har dött efter att ha fått problem när de badade vid en strand nära Tarragona i nordöstra Spanien.", "link": "https://www.hd.se/varlden/tre-pojkar-doda-efter-badolycka-vid-spansk-strand/", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:53:49+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 29, "title": "Three boys dead after swimming accident at Spanish beach", "summary": "Three boys have died after getting into trouble while swimming at a beach near Tarragona in northeastern Spain.", "title_original": "Tre pojkar döda efter badolycka vid spansk strand", "summary_original": "Tre pojkar har dött efter att ha fått problem när de badade vid en strand nära Tarragona i nordöstra Spanien.", "link": "https://www.sydsvenskan.se/varlden/tre-pojkar-doda-efter-badolycka-vid-spansk-strand/", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:53:49+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 30, "title": "After the loss: Norway can wait in the playoffs", "summary": "France, Brazil, or ... Norway? After Sweden's big loss against the Netherlands, the playoff possibilities look tough. Who can it be in the semi-finals?", "title_original": "Efter förlusten: Norge kan vänta i slutspel", "summary_original": "Frankrike, Brasilien, eller ... Norge? Efter den svenska storförlusten mot Nederländerna ser slutspelsmöjligheterna tuffa ut. Vilka kan det bli i sexstondelsfinal egentligen?", "link": "https://www.svd.se/a/vrnOzB/fotbolls-vm-2026-sverige-mot-norge-i-sextondelsfinal", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:49:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 31, "title": "He knows the Swede better than Kristersson", "summary": "\"City of my dreams\" never made it into Sweden's cultural canon. Is it even too radical?", "title_original": "Han kan svensken bättre än Kristersson", "summary_original": "”Mina drömmars stad” kom aldrig med i Sveriges kulturkanon. Är den rentav för radikal?", "link": "https://www.svd.se/a/7pmeo3/pa-fogelstrom-visste-att-svensken-ar-humanist", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:49:08+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 32, "title": "Börje Ekholm: \"We have too little immigration\"", "summary": "He is one of Wallenberg's star directors. Now Börje Ekholm talks about politics. Ericsson's outgoing CEO praises Sweden, although Europe is a \"shitty neighborhood\". He wants more immigration, loosened labor laws and property tax.", "title_original": "Börje Ekholm: ”Vi har för lite invandring”", "summary_original": "Han är en av Wallenbergs stjärndirektörer. Nu pratar Börje Ekholm ut om politik. Ericssons avg , "summary": "Plumes of smoke rose Sunday morning from a Russian oil terminal on the Kerch Strait and port facilities on the other side. Several Ukrainian attacks indicate an escalation of the systematic attacks against the Russian supply lines around Crimea. The occupying power has been forced to introduce refueling bans and stops in ferry traffic.", "title_original": "Ukraina trappar upp mot Krim – Ryssland inför tankningsförbud", "summary_original": "Rökpelare steg på söndagsmorgonen från en rysk oljeterminal vid Kertjsundet och hamnanläggningar på andra sidan. Flera ukrainska attacker tyder på en upptrappning av de systematiska angreppen mot de ryska försörjningslinjerna kring Krim. Ockupationsmakten har tvingats införa tankningsförbud och stopp i färjetrafiken.", "link": "https://www.dn.se/varlden/ukraina-trappar-upp-mot-krim-ryssland-infor-tankningsforbud/", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:37:25+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 36, "title": "Elanga hopes for a starting place against Japan after the successful entry", "summary": "HOUSTON. One of the few joys against the Netherlands was Anthony Elanga's substitution. The 24-year-old scored after just four minutes on the pitch. Now he hopes to be rewarded with a starting place against Japan. - It was a dream come true, he says of his first WC goal.", "title_original": "Elanga hoppas på startplats mot Japan efter lyckade inhoppet", "summary_original": "HOUSTON. Ett av få glädjeämnen mot Nederländerna var Anthony Elangas inhopp. 24-åringen gjorde mål efter bara fyra minuter på planen. Nu hoppas han bli belönad med en startplats mot Japan. – Det var en dröm som gick i uppfyllelse, säger han om sitt första VM-mål.", "link": "https://www.dn.se/sport/elanga-hoppas-pa-startplats-mot-japan-efter-lyckade-inhoppet/", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:20:30+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 37, "title": "Lifestyle safari attracts immigrants to Jämtland", "summary": "To avoid taking employees away from each other, a group from Östersund created a job and lifestyle safari. For a few days, participants get to try out life as fellow foreigners. - It was not a good situation to cannibalize each other, says Johan Ranbrandt, founder of Gomorron Östersund and Jämtland Calling.", "title_original": "Livsstilssafari lockar inflyttare till Jämtland", "summary_original": "För att undvika att ta anställda av varandra, skapade ett gäng från Östersund en jobb- och livsstilssafari. Under några dagar får deltagare prova på livet som jämtlänningar. – Det var ingen bra situation att kannibalisera på varandra, säger Johan Ranbrandt grundare av Gomorron Östersund och Jämtland Calling.", "link": "https://www.dn.se/sverige/livsstilssafari-lockar-inflyttare-till-jamtland/", "date_display": "2026-06-21", "date_iso": "2026-06-21T08:03:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 38, "title": "\"I saw Stockholm as the center of the world - ashamed today\"", "summary": "Lack of nature in cities leads to increased risk of mental illness, research shows. After exhaustion, Anna Walter, 36 years old, left the stress of Stockholm and found recovery in Jämtland's nature. - I saw Stockholm as the center of Sweden, which I am ashamed of today, she says.", "title_original": "”Jag såg Stockholm som världens mittpunkt – skäms i dag”", "summary_original": "Brist på natur i städer leder till ökad risk för psykisk ohälsa, visar forskning. Efter en utmattning lämnade Anna Walter, 36 år, stressen i Stockholm och fann återhämtning i Jämtlands natur. – Jag såg Stockholm som Sveriges mittpunkt, vilket jag skäms över i dag, säger hon.", "link": "https://www.dn.se/sverige/jag-sag-stockholm-som-varldens-mittpunkt-skams-i-dag/" ombia, suspected of extensive drug smuggling, is described as a high priority target for Swedish police. Among other things, he is said to have coordinated cocaine deliveries to Europe and Dubai.", "title_original": "Svensk gripen i Colombia – ska begäras utlämnad", "summary_original": "En svensk man som gripits i Colombia, misstänkt för omfattande narkotikasmuggling, beskrivs som ett högt prioriterat mål för svensk polis. Han ska bland annat ha samordnat kokainleveranser till Europa och Dubai.", "link": "https://www.dn.se/sverige/el-sueco-pekas-ut-som-nyckelperson-i-kokainnatverk/", "date_display": "2026-06-21", "date_iso": "2026-06-21T07:38:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 42, "title": "\"El Sueco\" arrested in Colombia - to be extradited", "summary": "A Swedish man, who was arrested in Colombia, suspected of extensive drug smuggling, is described as a high priority target for Swedish police. Among other things, he is said to have coordinated cocaine deliveries to Europe and Dubai.", "title_original": "”El Sueco” gripen i Colombia – ska begäras utlämnad", "summary_original": "En svensk man, som gripits i Colombia, misstänkt för omfattande narkotikasmuggling, beskrivs som ett högt prioriterat mål för svensk polis. Han ska bland annat ha samordnat kokainleveranser till Europa och Dubai.", "link": "https://www.hd.se/varlden/el-sueco-pekas-ut-som-nyckelperson-i-kokainnatverk/", "date_display": "2026-06-21", "date_iso": "2026-06-21T07:35:02+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 43, "title": "\"El Sueco\" arrested in Colombia - to be extradited", "summary": "A Swedish man, who was arrested in Colombia, suspected of extensive drug smuggling, is described as a high priority target for Swedish police. Among other things, he is said to have coordinated cocaine deliveries to Europe and Duba t Western Europe. In Spain, Switzerland and France, among others, temperatures can reach over 40 degrees in places. The latter has now issued a red warning in over a third of the country for Sunday. The heat wave has forced schools to remain closed and several trains have been cancelled, according to France24. \"Very high temperatures are establishing themselves across the country for an extended period,\" reports the state meteorological agency Météo-France. The party threatened At the same time, the annual celebration of Fête de la Musique, also known as \"International Music Day\", begins, where musicians and festival-goers take over streets and squares across the country. But the heat means that the authorities are now taking special measures. The government has decided to ban alcohol consumption during the street festivals in the areas covered by the highest warning level. - The combination of alcohol, heat and proximity to water - these are three risk factors that do not go together well, says Paris Mayor Emmanuel Grégoire. Health Minister Stéphanie Rist explains the government's decision: - When you drink alcohol, you get a reaction that causes the alcohol to block the hormone that allows you to take in water. Therefore, you become dehydrated 3-4 times faster, without even realizing it, she says according to Le Monde. May continue to rise The decision is part of a wider effort to reduce the pressure on healthcare and emergency services under the extreme conditions. At the same time, the authorities urge the public to be careful, drink plenty of water and avoid staying in the sun during the hottest hours of the day. In total, around 53 million people are affected by the red alert, according to Le Monde. At the same time, tourists are in the country, which was previously named the country with the most visitors. - It's too hot. I want to swim as soon as I see water, says tourist Daniel to Le Parisien. In Paris, parks and green areas are kept open during the night to give residents the opportunity to sv", "title_original": "Värmeböljan slår till – Frankrike inför förbud mitt i folkfest", "summary_original": "En värmebölja har slagit mot Västeuropa. I bland annat Spanien, Schweiz och Frankrike kan temperaturerna nå över 40 grader på sina håll. Den sistnämnda har nu utfärdat en röd varning i över en tredjedel av landet inför söndagen. Värmeböljan har tvingat skolor att hålla stängt och flera tåg har ställts in, enligt France24. ”Mycket höga temperaturer håller på att etablera sig över hela landet under en längre period”, meddelar den statliga meteorologiska myndigheten Météo-France. Festen hotad Samtidigt inleds det årliga firandet av Fête de la Musique, även känt som ”International Music Day”, där musiker och festivalbesökare tar över gator och torg över hela landet. Men värmen gör att myndigheterna nu vidtar särskilda åtgärder. Regeringen har beslutat att förbjuda alkoholkonsumtion under gatufestivalerna i de områden som omfattas av den högsta varningsnivån. – Kombinationen av alkohol, värme och närhet till vatten – det är tre riskfaktorer som inte går ihop bra, säger Paris borgmästare Emmanuel Grégoire. Hälsoministern Stéphanie Rist förklarar regeringens beslut: – När man dricker alkohol får man en reaktion som gör att alkoholen blockerar hormonet som gör att man kan få i sig vatten. Därför blir man uttorkad 3–4 gånger snabbare, utan att man ens inser det, säger hon enligt Le Monde. Kan fortsätta stiga Beslutet är en del av ett bredare arbete för att minska trycket på sjukvården och räddningstjänsten under de extrema förhållandena. Myndigheterna uppmanar samtidigt allmänheten att vara försiktig, dricka mycket vatten och undvika att vistas i solen under de varmaste timmarna på dagen. Totalt rör det sig om omkring 53 miljoner människor som påverkas av den röda varningen, enligt Le Monde. Samtidigt befinner sig turister i landet, som tidigare utnämnts som det land med flest besökare. – Det är för varmt. Jag vill bada så fort muggling, is described as a high priority target for Swedish police. Among other things, he is said to have coordinated cocaine deliveries to Europe and Dubai.", "title_original": "”El Sueco” gripen i Colombia – ska begäras utlämnad", "summary_original": "En svensk man, som gripits i Colombia, misstänkt för omfattande narkotikasmuggling, beskrivs som ett högt prioriterat mål för svensk polis. Han ska bland annat ha samordnat kokainleveranser till Europa och Dubai.", "link": "https://www.svd.se/a/k0m389/el-sueco-pekas-ut-som-nyckelperson-i-kokainnatverk", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:49:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 63, "title": "Starmer is expected to announce his resignation on Monday", "summary": "Prime Minister Keir Starmer's resignation is imminent, sources told Britain's The Telegraph. At the same time, support is growing for his opponent Andy Burnham - who is singled out as a likely successor.", "title_original": "Starmer väntas meddela sin avgång på måndag", "summary_original": "Premiärminister Keir Starmers avgång är nära, uppger källor till brittiska The Telegraph. Samtidigt växer stödet för hans motståndare Andy Burnham – som pekas ut som en trolig efterträdare.", "link": "https://www.dn.se/varlden/starmer-vantas-meddela-sin-avgang-pa-mandag/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:40:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "The changes Sweden must make after the overrun", "summary": "1–5. Completely overrun. Now Sweden has to make changes in order to score points against Japan, writes Fredrik Lindstrand.", "title_original": "Förändringarna Sverige måste göra efter överkörningen", "summary_original": "1–5. Helt överkörda. Nu måste Sverige göra förändringar för att orka ta poäng mot Japan, skriver Fredrik Lindstrand.", "link": "https://www.sydsvenskan.se/sport/forandringarna-sverige-maste-gora-efter-fornedringen/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:37:24+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 65, "title": "Jessica: How about 28 minutes at the hairdresser for 2000 bucks?", "summary": "In the end, Jessica got a midsummer haircut. The hairdresser did the best cut anyway. He seems cut and dry - for everything possible.", "title_original": "Jessica: Vad sägs om 28 minuter hos frisören för 2 000 spänn?", "summary_original": "Till slut blev Jessica midsommarklippt. Det bästa klippet gjorde ändå frisören. Han verkar som klippt och skuren – för allt möjligt.", "link": "https://www.dn.se/kultur/jessica-vad-sags-om-28-minuter-hos-frisoren-for-2-000-spann/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 66, "title": "The changes Sweden must make after the overrun", "summary": "1–5. Completely overrun. Now Sweden has to make changes in order to score points against Japan, writes Fredrik Lindstrand.", "title_original": "Förändringarna Sverige måste göra efter överkörningen", "summary_original": "1–5. Helt överkörda. Nu måste Sverige göra förändringar för att orka ta poäng mot Japan, skriver Fredrik Lindstrand.", "link": "https://www.hd.se/sport/forandringarna-sverige-maste-gora-efter-fornedringen/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:27:23+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 67, "title": "Kajsa Haidl: Sebastian Ingrosso's disclosure is shocking - but far from unique", "summary": "In Sebastian Ingrosso's program, the listener gets an insight into who he is behind the tough facade. It is effectively told and often quite heartbreaking. DN's Kajsa Haidl has listened.", "title_original": "Kajsa Haidl: Sebastian Ingrossos avslöjande är drabbande – men långt ifrån unikt", "summary_original": "I Sebastian Ingrossos program får lyssnaren en inblick i vem han är bakom den tuffa fasaden. Det är effektivt berättat och ofta rätt hjärtskärande. DN:s Kajsa Haidl har lyssnat.", "link": "https://www.dn.se/kultur/kajsa-haidl-sebastian-ingrossos-avslojande-ar-drabbande-men-langt-ifran-unikt/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:18:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 68, "title": "One dead and two hospitalized after house fire", "summary": "", "title_original": "En död och två till sjukhus efter villabrand", "summary_original": "", "link": "https://www.svd.se/a/3pR6BM/en-dod-och-tva-till-sjukhus-efter-villabrand", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:14:36+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 69, "title": "Almost no shelters left in the whole of Germany", "summary": "Now the German government wants to clean up and build new shelters. A huge challenge in a country with over 80 million inhabitants. At the Gesundbrunnen train station in northern Berlin there is a small white house. If you unlock the door and go in, there is a staircase there. If you follow it, you will come to the German capital's only shelter. And it's not impressive.  Around 900 people can fit. In the largest room there are some wooden benches. In another room there is a stack of folding chairs and cans for water.  The funding was withdrawn. The shelter was built in the 1920s and was used extensively during the Second World War. After the war, it and other similar shelters were maintained in West Berlin. The threat from East Germany and the Soviet Union was palpable for decades. However, with the fall of the Berlin Wall, political interest in the shelters disappeared, and in the mid-2000s, funding was completely withdrawn for all shelters throughout the country.  This very thing was preserved as a museum object, and the organization Berlins Underjord makes small guided walks through the facility. And should there be a crisis or a war, the organization will open the shelter to the public.  But for a city of 3.8 million people, Berlin's only preserved shelter is of course a drop in the ocean.  The government wants to invest All around Germany it looks the same. A few shelters have been preserved for nostalgic reasons and some private individuals have built their own bunkers. But in the event of a war or a crisis, there is only room for less than one percent of the population.  The German government has now put forward a proposal to clean up shelters and build new ones and will soon release an app that shows the nearest place where people can seek shelter in a crisis. The concern that Kay Heyne has is that too many resources are being put into the app and not enough into the shelters.  - Right now the app would only show that there are no shelters at all, he says and laughs.", "title_original": "Nästan inga skyddsrum kvar i hela Tyskland", "summary_original": "Nu vill den tyska regeringen sanera och bygga nya skyddsrum. En enorm utmaning i ett land med över 80 miljoner invånare. Vid tågstationen Gesundbrunnen i norra Berlin finns det ett litet vitt hus. Om man låser upp dörren och går in, finns det en trappa där. Följer man den, kommer man till den tyska huvudstadens enda skyddsrum. Och det är inte imponerande.  Runt 900 människor kan få plats. I det största rummet står det några träbänkar. I ett annat rum står det en stapel med klappstolar och dunkar för vatten.  Finansieringen drogs in Skyddsrummet byggdes på 1920-talet och användes flitigt under andra världskriget. Efter kriget behölls det och andra liknande skyddsrum i Västberlin. Hotet från Östtyskland och Sovjetunionen var påtagligt under decennier. Men med Berlinmurens fall försvann det politiska intresset för skyddsrummen och i mitten av 2000-talet drogs finansieringen helt in för alla skyddsrum i hela landet.  Just det här bevarades som ett museumsobjekt, och organisationen Berlins Underjord gör små guidade vandringar genom anläggningen. Och om det skulle bli en kris eller ett krig så kommer organisationen att öppna skyddsrummet för allmänheten.  Men för en stad med 3,8 miljoner människor är Berlins enda bevarade skyddsrum förstås en droppe i havet.  Regeringen vill satsa Runt om i Tyskland ser det likadant ut. Ett fåtal skyddsrum har bevarats av nostalgiska skäl och vissa privatpersoner har byggt egna bunkrar. Men vid ett krig eller en kris finns det bara utrymme för under en procent av befolkningen.  Den tyska regeringen har nu lagt fram ett förslag om att sanera skyddsrum och bygga nya och snart ska man släppa en app som visar det närmaste stället där folk kan söka skydd vid en kris. Oron som Kay Heyne har är att man lägger för mycket resurser på appen och inte tillräckligt på skyddsrummen.  – Just nu skulle appen bara visa att det inte finns några skyddsrum alls, säger han och skrattar.", "link": "https://www.tv4.se/artikel/2WR7MCJMyBkhUDhjlTTatn/naestan-inga-skyddsrum-kvar-i-hela-tyskland", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:14:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/tyskland", "/skyddsrum"]}, {"id": 70, "title": "Hien about the collapse: \"Chances you don't want to give away\"", "summary": "HOUSTON. Sweden's defense was a question mark before the World Cup. It didn't get any less after the big loss against the Netherlands. - Of course you are not satisfied as a defender after conceding five goals, says centre-back Isak Hien.", "title_original": "Hien om kollapsen: ”Chanser man inte vill ge bort”", "summary_original": "HOUSTON. Sveriges försvarsspel var ett frågetecken inför VM. Det blev inte mindre efter storförlusten mot Nederländerna. – Självklart är man inte nöjd som försvarare efter fem insläppta mål, säger mittbacken Isak Hien.", "link": "https://www.dn.se/sport/hien-om-kollapsen-chanser-man-inte-vill-ge-bort/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:01:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "Give us the same opportunities to travel sustainably", "summary": "Arilds resident Vera Wadströmer is asking for safer cycle paths and better bus connections between Höganäs and the villages in the area.", "title_original": "Ge oss samma möjligheter att resa hållbart", "summary_original": "Arildsbon Vera Wadströmer efterfrågar säkrare cykelvägar och bättre bussförbindelser mellan Höganäs och byarna i området.", "link": "https://www.hd.se/min-mening/ge-oss-samma-mojligheter-att-resa-hallbart/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 72, "title": "New Ekebofest! New VAT rate! Now the battle is on for the classic dance band", "summary": "On July 1, reduced VAT will be introduced on dance performances. An obvious relief for dance band Sweden. But does the industry really need to be \"rescued\"? Ahead of this year's Ekebo Festival, Daniel Josefson writes about practitioners and enthusiasts in northwestern Scania.", "title_original": "Ny Ekebofest! Ny momssats! Nu står striden om det klassiska dansbandet", "summary_original": "Den 1 juli införs sänkt moms på danstillställningar. En självklar lättnad för dansbands-Sverige. Men behöver branschen verkligen ”räddas”? Inför årets Ekebofestivalen skriver Daniel Josefson om utövare och eldsjälar i nordvästra Skåne.", "link": "https://www.hd.se/kultur/ny-ekebofest-ny-momssats-nu-star-striden-om-det-klassiska-dansbandet/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "\"If I work one day less, I can't support my family\"", "summary": "The war between Afghanistan's Taliban and Pakistan's army along the border between the two countries casts a shadow over the lives of Afghans living in Malmö. They have to work non-stop to cover the family's expenses in Pakistan and Afghanistan, especially in conflict areas. - This is not a normal life, says 26-year-old Yazdan Ali Yari.", "title_original": "”Om jag arbetar en dag mindre kan jag inte försörja min familj”", "summary_original": "Kriget mellan Afghanistans talibaner och Pakistans armé längs gränsen mellan de två länderna kastar en skugga över livet för afghaner som bor i Malmö. De måste arbeta oavbrutet för att täcka familjens kostnader i Pakistan och Afghanistan, särskilt i konfliktområden. – Det här är inget normalt liv, säger 26-årige Yazdan Ali Yari.", "link": "https://www.sydsvenskan.se/malmo/malmoborna-som-lever-i-skuggan-av-ett-krig/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "I love the 79-year-old chain-smoking carpet weaver who has become an unlikely star", "summary": "Dona Sebastiana is a woman who has seen everything and come out on the other side - with empathy and a throat flare. Everyone with luck has had someone like her in their lives.", "title_original": "Jag älskar den 79-åriga, kedjerökande mattvävaren som har blivit en osannolik stjärna", "summary_original": "Dona Sebastiana är en kvinna som sett allt och kommit ut på andra sidan – med empati och ett halsbloss. Alla med tur har haft en som hon i sina liv.", "link": "https://www.sydsvenskan.se/kultur/jag-alskar-dig-dona-sebastiana/", "date_display": "2026-06-21", "date_iso": "2026-06-21T05:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Björn Wiman: We woke up in a midsummer nightmare - which only got worse", "summary": "On Midsummer's Eve ten years ago, we woke up to the nightmare of the British referendum on Brexit. At Dramaten, the play that shows what happened next is now being played, writes Björn Wiman.", "title_original": "Björn Wiman: Vi vaknade i en midsommarmardröm – som bara blev värre", "summary_original": "På midsommarafton för tio år sedan vaknade vi till mardrömmen med den brittiska folkomröstningen om Brexit. På Dramaten spelas nu pjäsen som visar vad som hände sedan, skriver Björn Wiman.", "link": "https://www.dn.se/kultur/bjorn-wiman-vi-vaknade-i-en-midsommarmardrom-som-bara-blev-varre/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:54:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Bris: Children more vulnerable during the summer holidays", "summary": "Most children and young people currently have a long summer vacation. Lovely for many, but also a time when calls to Bris increase. During the summer, adults are asked to pay extra attention to children in their surroundings. - The most important thing is to be present in children's lives and above all to dare to ask, says Jennifer Pettersson, counselor at Bris.", "title_original": "Bris: Barn mer utsatta under sommarlovet", "summary_original": "De flesta barn och unga har just nu ett långt sommarlov. Härligt för många, men också en tid när samtalen till Bris ökar. Under sommaren uppmanas vuxna att vara extra uppmärksamma på barn i sin omgivning. – Det allra viktigaste är att vara närvarande i barns liv och framför allt att våga fråga, säger Jennifer Pettersson, kurator på Bris.", "link": "https://www.dn.se/sverige/bris-barn-mer-utsatta-under-sommarlovet/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:52:12+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "Suspected drunk driver stopped", "summary": "A vehicle driver is suspected of driving drunk on Per Hans väg in Trelleborg during the night to Sunday.", "title_original": "Misstänkt rattfyllerist stoppad", "summary_original": "En fordonsförare misstänks ha kört rattfull på Per Hans väg i Trelleborg under natten mot söndag.", "link": "https://www.sydsvenskan.se/trelleborg/misstankt-rattfyllerist-stoppad/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:51:28+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "A liberal anchor remains even when it storms", "summary": "", "title_original": "Ett liberalt ankare ligger kvar även när det stormar", "summary_original": "", "link": "https://www.sydsvenskan.se/opinion/moa-berglof/ett-liberalt-ankare-ligger-kvar-aven-nar-det-stormar/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:34:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 79, "title": "Bo Wendt's place of residence again on the news: \"Lives mostly in Båstad\"", "summary": "Does opposition leader Bo Wendt live in Båstad? Yes, he claims himself, but in a report to the Tax Agency it is claimed that he has been an Ángelholm resident since the spring of 2023. The case was closed without being investigated.", "title_original": "Bo Wendts bostadsort åter på tapeten: ”Bor mest i Båstad”", "summary_original": "Bor oppositionsledaren Bo Wendt i Båstad? Ja, hävdar han själv, men i en anmälan till Skatteverket påstås att han är ängelholmare sedan våren 2023. Ärendet avslutades utan att utredas.", "link": "https://www.hd.se/bastad/bo-wendts-bostadsort-ater-pa-tapeten-bor-mest-i-bastad/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "Explosion in Växjö", "summary": "", "title_original": "Explosion i Växjö", "summary_original": "", "link": "https://www.svd.se/a/q6mR6L/explosion-i-vaxjo", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:28:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 81, "title": "Can a medieval document worth millions put an end to Donald Trump?", "summary": "LONDON-CAMBRIDGE, MASSACHUSETTS. Is Donald Trump - just in time for the country's 250th birthday - trying to turn himself into the king of the United States? At Harvard University there is a document from the Middle Ages that sheds light on the president's ruling techniques. DN's Sandra Stiskalo and Björn af Kleen report on a transatlantic discovery that angered the Trump movement ahead of July 4.", "title_original": "Kan ett medeltida dokument värt miljoner sätta stopp för Donald Trump?", "summary_original": "LONDON-CAMBRIDGE, MASSACHUSETTS. Försöker Donald Trump – lagom till landets 250-årsdag – förvandla sig till USA:s kung? På Harvarduniversitetet finns ett dokument från medeltiden som sätter ljus på presidentens härskartekniker. DN:s Sandra Stiskalo och Björn af Kleen rapporterar om en transatlantisk upptäckt som förargat Trumprörelsen inför den 4 juli.", "link": "https://www.dn.se/varlden/kan-ett-medeltida-dokument-vart-miljoner-satta-stopp-for-donald-trump/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:22:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "The clock hasn't struck twelve yet", "summary": "Sweden is the Cinderella of the WC tournament - and Graham Potter the good fairy. But if you want to go to the ball and win a prince, you should preferably know the moves in the second dance as well.", "title_original": "Än har klockan inte slagit tolv", "summary_original": "Sverige är VM-turneringens Askungen – och Graham Potter den goda fen. Men ska man gå på bal och vinna en prins bör man helst kunna turerna även i den andra dansen.", "link": "https://www.svd.se/a/k0mRnQ/sverige-ar-vm-s-askungen", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:21:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 83, "title": "Östermalms apartment weighted for the \"king's priest\"", "summary": "It has stormed around the \"king priest\" Hans Rhodin and Oscar's congregation over the years. A lot has been about the church's exclusive apartments in Östermalm. Now old conflicts have flared up again. What is really going on? SvD goes down to the French Riviera to meet the swindled priest.", "title_original": "Östermalmslägenhet vikt för ”kungaprästen”", "summary_original": "Det har stormat runt ”kungaprästen” Hans Rhodin och Oscars församling genom åren. Mycket har handlat om kyrkans exklusiva lägenheter på Östermalm. Nu har gamla konflikter blossat upp på nytt. Vad är det som pågår egentligen? SvD åker ner till franska rivieran för att träffa den omsusade prästen.", "link": "https://www.svd.se/a/3pmJy0/oscarskyrkan-reserverade-lagenhet-at-kungaprasten-hans-rhodin-kritiseras-av-biskopen", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:18:54+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 84, "title": "Micro training effective even for the fit", "summary": "How little can you train and still have an effect? \"Less than what people think,\" says Daniel Berglind, Associate Professor of Public Health Sciences, referring to a new study on \"exercise snacks\".", "title_original": "Mikroträning effektivt även för de vältränade", "summary_original": "Hur lite kan man träna och ändå få effekt? ”Mindre än vad folk tror”, säger Daniel Berglind, docent i folk­hälso­vetenskap, apropå en ny studie om ”exercise-snacks”.", "link": "https://www.svd.se/a/43jgWg/mikrotraning-effektivt-aven-for-de-valtranade", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:15:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Livet"]}, {"id": 85, "title": "Lebanon: Seven dead in attacks", "summary": "", "title_original": "Libanon: Sju döda i attacker", "summary_original": "", "link": "https://www.svd.se/a/K8WpMy/libanon-sju-doda-i-attacker", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:06:19+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 86, "title": "Gina Gustavsson: Pope Leo is praised for warning against AI - but he is not the savior everyone dreams of", "summary": "The Vatican is not trying to stop the development of artificial intelligence, but to bend it to its own interests. And they have teamed up with the tech company Anthropics, which also has its own higher purpose. THE COLUMN. Gina Gustavsson is associate professor of political science and independent columnist on Dagens Nyheter's editorial page.", "title_original": "Gina Gustavsson: Påve Leo hyllas för att han varnar för AI – men han är inte den frälsare alla drömmer om", "summary_original": "Vatikanen försöker inte stoppa utvecklingen av artificiell intelligens, utan böja den efter egna intressen. Och man har slagit sig i slang med techbolaget Anthropics, som också har sitt eget högre syfte. KOLUMNEN. Gina Gustavsson är docent i statskunskap och fristående kolumnist på Dagens Nyheters ledarsida.", "link": "https://www.dn.se/ledare/gina-gustavsson-pave-leo-hyllas-for-att-han-varnar-for-ai-men-han-ar-inte-den-fralsare-alla-drommer/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:02:05+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 87, "title": "Bris: Children more vulnerable during the summer holidays", "summary": "Most children and young people currently have a long summer vacation. Lovely for many, but also a time when calls to Bris increase. During the summer, adults are asked to pay extra attention to children in their surroundings. - The most important thing is to be present in children's lives and above all to dare to ask, says Jennifer Pettersson, counselor at Bris.", "title_original": "Bris: Barn mer utsatta under sommarlovet", "summary_original": "De flesta barn och unga har just nu ett långt sommarlov. Härligt för många, men också en tid när samtalen till Bris ökar. Under sommaren uppmanas vuxna att vara extra uppmärksamma på barn i sin omgivning. – Det allra viktigaste är att vara närvarande i barns liv och framför allt att våga fråga, säger Jennifer Pettersson, kurator på Bris.", "link": "https://www.svd.se/a/aJ3WbM/bris-barn-mer-utsatta-under-sommarlovet", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:13+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 88, "title": "So the brew breakfast becomes the highlight of the day", "summary": "Let breakfast become the most important goal of the summer. DN's Jens Linder advises how to enjoy yourself best - regardless of whether you are sitting on a jetty or at the kitchen table.", "title_original": "Så blir bryggfrukosten dagens höjdpunkt", "summary_original": "Låt frukosten bli sommarens viktigaste mål. DN:s Jens Linder tipsar om hur du njuter bäst – oavsett om du sitter på en brygga eller vid köksbordet.", "link": "https://www.dn.se/mat-dryck/sa-blir-bryggfrukosten-dagens-hojdpunkt/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 89, "title": "Jens Linder: So breakfast can be the rescue when the rain pours down", "summary": "Chronicle. In the absence of sun, Jens Linder turned his gaze towards the kitchen. It was the rescue that rainy summer in Härnösand.", "title_original": "Jens Linder: Så kan frukost bli räddningen när regnet öser ner", "summary_original": "Krönika. I brist på sol vände Jens Linder blicken mot köket. Det blev räddningen den där regniga sommaren i Härnösand.", "link": "https://www.dn.se/mat-dryck/jens-linder-sa-kan-frukost-bli-raddningen-nar-regnet-oser-ner/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 90, "title": "Sweden's Radio gives a misleading picture", "summary": "When Ekot reports on Försäkringskassan's new penalty fee, the picture becomes both distorted and insufficient.", "title_original": "Sveriges Radio ger missvisande bild", "summary_original": "När Ekot rapporterar om Försäkringskassans nya sanktionsavgift, blir bilden både skev och otillräcklig.", "link": "https://www.svd.se/a/gkzgnJ/sveriges-radio-ger-missvisande-bild", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ledare"]}, {"id": 91, "title": "Breweries: Wrong to let us pick up the bill", "summary": "High taxes, new requirements and outdated regulations are putting pressure on the entire brewing industry. We hope that the talks that will soon be held in Almedalen lead to actual change, write seven competitors among Swedish breweries.", "title_original": "Bryggerier: Fel att låta oss ta notan", "summary_original": "Höga skatter, nya krav och föråldrade regler pressar hela bryggerinäringen. Vi hoppas att de samtal som snart ska föras i Almedalen leder till faktisk förändring, skriver sju konkurrenter bland svenska bryggerier.", "link": "https://www.svd.se/a/16V14W/bryggerier-fel-att-lata-oss-ta-kostnaderna-for-skatter-krav-och-foraldrade-regler", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Debatt"]}, {"id": 92, "title": "Grand plans for Malmömässan - hotels and offices are being built on the heights", "summary": "The Malmö fair in Hyllie is facing a big change. New floors are now being planned on top of the existing restaurants and conference rooms - which will make room for hotels and offices.   - It's a giant building, but it still feels a bit like a backside, says Stefana Hoti (MP), chairman of the city planning board.", "title_original": "Storslagna planer för Malmömässan – hotell och kontor byggs på höjden", "summary_original": "Malmömässan i Hyllie står inför en stor förändring. Nu planeras nya våningar ovanpå de befintliga restaurangerna och konferenslokalerna – som ska göra plats för hotell och kontor.   – Det är ju en jättebyggnad men det känns lite som en baksida fortfarande, säger Stefana Hoti (MP), stadsbyggnadnämndens ordförande.", "link": "https://www.sydsvenskan.se/malmo/storslagna-planer-for-malmomassan-hotell-och-kontor-byggs-pa-hojden/", "date_display": "2026-06-21", "date_iso": "2026-06-21T04:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 93, "title": "Historic first WC point for Curaçao", "summary": "Germany will win Group E at the FIFA World Cup after Curaçao secured the country's first ever point in a World Cup.", "title_original": "Historisk första VM-poäng för Curaçao", "summary_original": "Tyskland kommer att vinna grupp E i fotbolls-VM efter att Curaçao säkrat landets första poäng någonsin i ett VM.", "link": "https://www.sydsvenskan.se/sport/tyskland-gruppsegrare-nar-curacao-tog-poang/", "date_display": "2026-06-21", "date_iso": "2026-06-21T03:57:53+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "\"He was unfaithful - how do we get close again?\"", "summary": "After her husband's infidelity, it has fallen to her to repair the relationship. They have found their way back to each other sexually, but he remains emotionally distant. Can she shake up the marriage again - or is it time to leave? Psychotherapist Daniel Rosenlind gives advice.", "title_original": "”Han var otrogen – hur kommer vi nära varandra igen?”", "summary_original": "Efter makens otrohet har det fallit på henne att reparera relationen. De har hittat tillbaka till varandra sexuellt, men han är fortfarande känslomässigt distanserad. Kan hon skaka liv i äktenskapet igen – eller är det dags att lämna? Psykoterapeuten Daniel Rosenlind ger råd.", "link": "https://www.dn.se/insidan/han-var-otrogen-hur-kommer-vi-nara-varandra-igen/", "date_display": "2026-06-21", "date_iso": "2026-06-21T03:46:47+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 95, "title": "\"Environmental work has become part of the security perspective in Ukraine.\"", "summary": "Swedish aid enables civil society in Ukraine to protect the environment and increase the country's energy security. That support must continue, writes the Nature Conservation Society together with the Ukrainian environmental organization Ecoaction.", "title_original": "”Miljöarbetet har blivit en del av säkerhetsperspektivet i Ukraina.”", "summary_original": "Svenskt bistånd gör att civilsamhället i Ukraina kan skydda miljön och öka landets energisäkerhet. Det stödet måste fortsätta, skriver Naturskyddsföreningen tillsammans med den ukrainska miljöorganisationen Ecoaction.", "link": "https://www.sydsvenskan.se/opinion/aktuella-fragor/miljoarbetet-har-blivit-en-del-av-sakerhetsperspektivet-i-ukraina/", "date_display": "2026-06-21", "date_iso": "2026-06-21T03:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Leader: There is no reason to see the glass as half full", "summary": "Emissions last year were higher than when the government took office, new statistics show. That should give the Liberals a scare. But instead there is cheering at the ministry.", "title_original": "Ledare: Det finns ingen anledning att se glaset som halvfullt", "summary_original": "Utsläppen i fjol var högre än när regeringen tillträdde, visar ny statistik. Det borde ge Liberalerna skrämselhicka. Men i stället jublas det på departementet.", "link": "https://www.dn.se/ledare/det-finns-ingen-anledning-att-se-glaset-som-halvfullt/", "date_display": "2026-06-21", "date_iso": "2026-06-21T03:20:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "He is not allowed to remain as a field chaplain because of his views on marriage", "summary": "Karl-Henrik Wallerstein does not want to marry same-sex couples - is considering reporting after the suspension from the Armed Forces.", "title_original": "Han får inte vara kvar som fältpräst på grund av sin äktenskapssyn", "summary_original": "Karl-Henrik Wallerstein vill inte viga samkönade par – överväger anmälan efter stoppet från Försvarsmakten.", "link": "https://www.dagen.se/nyheter/han-far-inte-vara-kvar-som-faeltpraest-pa-grund-av-sin-aektenskapssyn/10402277", "date_display": "2026-06-21", "date_iso": "2026-06-21T03:18:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "40s house in Östra Ljungby, Klippan sold", "summary": "", "title_original": "40-talshus i Östra Ljungby, Klippan såld", "summary_original": "", "link": "https://www.hd.se/klippan/40-talshus-i-ostra-ljungby-klippan-sald/", e back's effort is called \"shocking\" - but Hien is supported by his teammates. - If you concede five goals, you are never satisfied as a defender, says Hien.", "title_original": "Hien sågas: ”Chockerande – hade skällt ut honom”", "summary_original": "Isak Hien, 27, sågas rejält efter missarna mot Nederländerna. I Norge kallas backens insats för ”chockerande” – men Hien får stöd av lagkamraterna. – Släpper man in fem mål så är man aldrig nöjd som försvarare, säger Hien.", "link": "https://www.hd.se/sport/hien-sagas-chockerande-hade-skallt-ut-honom/", "date_display": "2026-06-20", "date_iso": "2026-06-20T21:50:10+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Swede arrested in Colombia - wanted by Interpol", "summary": "A Swedish citizen suspected of extensive drug smuggling has been arrested in Colombia.", "title_original": "Svensk gripen i Colombia – efterlyst av Interpol", "summary_original": "En svensk medborgare misstänkt för omfattande narkotikasmuggling har gripits i Colombia.", "link": "https://www.sydsvenskan.se/sverige/svensk-gripen-i-colombia-efterlyst-av-interpol/", "date_display": "2026-06-20", "date_iso": "2026-06-20T21:31:34+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Swede arrested in Colombia - wanted by Interpol", "summary": "A Swedish citizen suspected of extensive drug smuggling has been arrested in Colombia.", "title_original": "Svensk gripen i Colombia – efterlyst av Interpol", "summary_original": "En svensk medborgare misstänkt för omfattande narkotikasmuggling har gripits i Colombia.", "link": "https://www.svd.se/a/oE9A4m/svensk-gripen-i-colombia-efterlyst-av-interpol", "date_display": "2026-06-20", "date_iso": "2026-06-20T21:29:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 117, "title": "Threatened woman - man arrested in Landskrona", "summary": "The police were called to Landskrona on Saturday evening where a woman had been threatened by a man she previously had a relationship with.", "title_original": "Hotade kvinna – man gripen i Landskrona", "summary_original": "Polisen larmades till Landskrona på lördagskvällen där en kvinna hotats av en man hon tidigare haft en relation med.", "link": "https://www.hd.se/landskrona/hotade-kvinna-man-gripen-i-landskrona/", "date_display": "2026-06-20", "date_iso": "2026-06-20T21:17:58+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "Potter: \"Didn't really have faith in what we wanted to do\"", "summary": "HOUSTON. Sweden went on a real blow against the Netherlands. After five goals conceded, the focus is once again on the defensive game. - I think we became a bit passive, says Graham Potter.", "title_original": "Potter: ”Hade inte riktigt tron på det vi ville göra”", "summary_original": "HOUSTON. Sverige åkte på en rejäl smäll mot Nederländerna. Efter fem insläppta mål riktas blickarna återigen mot försvarsspelet. – Jag tycker vi blev lite passiva, säger Graham Potter.", "link": "https://www.dn.se/sport/potter-hade-inte-riktigt-tron-pa-det-vi-ville-gora/", "date_display": "2026-06-20", "date_iso": "2026-06-20T21:02:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "A keel haul Sweden offered", "summary": "", "title_original": "En kölhalning Sverige bjöd på", "summary_original": "", "link": "https://www.tv4.se/artikel/2OQuNuum22ofZ96oFaIzG8/lundh-en-koelhalning-sverige-bjoed-pa", "date_display": "2026-06-20", "date_iso": "2026-06-20T20:27:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 120, "title": "Nilsson Lindelöf: \"Still have everything in my own hands\"", "summary": "HOUSTON. \"We want to put on a show and play well,\" said Sweden's national team captain Graham Potter at the press conference the day before the World Cup match against the Netherlands. But it was the opponents who put on the show and won 5–1. - 5-1 is not a result you want, but we also do good things, says team captain Victor Nilsson Lindelöf.", "title_original": "Nilsson Lindelöf: ”Har fortfarande allt i egna händer”", "summary_original": "HOUSTON. ”Vi vill bjuda på en show och spela bra”, sa Sveriges förbundskapten Graham Potter på presskonferensen dagen före VM-matchen mot Nederländerna. Men det blev motståndarna som bjöd på showen och vann med 5–1. – 5–1 är inget resultat som man man vill ha, men vi gör också bra saker, säger lagkaptenen Victor Nilsson Lindelöf.", "link": "https://www.dn.se/sport/nilsson-lindelof-har-fortfarande-allt-i-egna-hander/", "date_display": "2026-06-20", "date_iso": "2026-06-20T20:23:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "The words after the World Cup crash: \"Simple goals\"", "summary": "Two conceded already after 20 minutes - and then a big loss in the WC. The Swedish defense collapsed against the Netherlands (1–5). - We concede two easy goals, says team captain Victor Nilsson Lindelöf to TV4.", "title_original": "Orden efter VM-haveriet: ”Enkla mål”", "summary_original": "Två insläppta redan efter 20 minuter – och därefter storförlust i VM. Det svenska försvaret havererade mot Nederländerna (1–5). – Vi släpper in två enkla mål, säger lagkapten Victor Nilsson Lindelöf till TV4.", "link": "https://www.hd.se/sport/orden-efter-forsvarshaveriet-enkla-mal/", "date_display": "2026-06-20", "date_iso": "2026-06-20T20:08:44+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Zelensky warns: Russia is preparing a large-scale attack", "summary": "Six people have been killed and several injured in Russian attacks on Zaporizhzhya and Kharkiv in Ukraine on Saturday, the Kyiv Independent writes. Now Ukrainian President Volodymyr Zelenskyy is warning that Russia is preparing a large-scale attack. - Tonight and in the coming hours, we must pay particular attention to air raid alarms. The Russians have prepared for another massive attack. Please take care of yourselves, says Zelensky in a video speech. Could be a response to the attacks in Moscow The warning from the Ukrainian president a couple of days after the country carried out a large number of drone attacks against Moscow. Both an oil refinery and residential buildings were hit in the attacks.  \"This is a completely justified response to the Russian attacks on our cities and communities,\" wrote Volodymyr Zelenskyy at the time on X. Also warns Belarus In connection with Zelenskyy's warning on Saturday evening, at the same time as air raid sirens sounded in Kiev. In his speech to the population, he also warned Belarus, formerly Belarus. - Ukraine has repeatedly signaled that Russia's involvement of Belarus in this war could lead to extremely dangerous consequences, the president said, according to the Kyiv Independent.  - Belarus has time to dismantle its equipment. We are also aware of every factory in Belarus that works for Russia and supports its war, Zelenskyy said.", "title_original": "Zelenskyj varnar: Ryssland förbereder storskalig attack", "summary_original": "Sex människor har dödats och flera skadats i ryska attacker mot Zaporizjzja och Charkiv i Ukraina på lördagen, skriver Kyiv Independent. Nu varnar Ukrainas president Volodymyr Zelenskyj för att Ryssland förbereder en storskalig attack. – I natt och under de kommande timmarna måste vi vara särskilt uppmärksamma på larm om flyganfall. Ryssarna har förberett sig för ett nytt massivt anfall. Snälla, var rädda om er, säger Zelenskyj i ett videotal. Kan vara ett svar på attackerna i Moskva Varningen från den ukrainske presidenten ett par dagar efter att landet genomförde ett stort antal drönaranfall mot Moskva. Både ett oljeraffinaderi och bostadshus träffades i attackerna.  ”Det här är ett fullständigt berättigat svar på de ryska attackerna mot våra städer och samhällen”, skrev Volodymyr Zelenskyj då på X.  Varnar även Belarus I samband med Zelenskyjs varning under lördagskvällen samtidigt som flyglarm ljöd i Kiev. I sitt tal till befolkningen varnade han även Belarus, fd Vitryssland. – Ukraina har upprepade gånger signalerat att Rysslands inblandning av Belarus i detta krig kan leda till extremt farliga konsekvenser, sa presidenten enligt Kyiv Independent.  – Belarus har tid att nedmontera sin utrustning. Vi är också medvetna om varje fabrik i Belarus som arbetar för Ryssland och stöder dess krig, sa Zelenskyj.", "link": "https://www.tv4.se/artikel/YE2pMC6aZN0hKuPZRjTQZ/zelenskyj-varnar-ryssland-foerbereder-storskalig-attack", "date_display": "2026-06-20", "date_iso": "2026-06-20T20:02:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/zelenskyj", "/ryssland", "/ukrainakonflikten", "/ukraina"]}, {"id": 123, "title": "The words after the defense breakdown: \"Simple goals\"", "summary": "Two conceded already after 20 minutes - and then a big loss. The Swedish defense broke down against the Netherlands. - We concede two easy goals, says team captain Victor Nilsson Lindelöf.", "title_original": "Orden efter försvarshaveriet: ”Enkla mål”", "summary_original": "Två insläppta redan efter 20 minuter – och därefter storförlust. Det svenska försvaret havererade mot Nederländerna. – Vi släpper in två enkla mål, säger lagkapten Victor Nilsson Lindelöf.", "link": "https://www.sydsvenskan.se/sport/orden-efter-forsvarshaveriet-enkla-mal/", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:55:40+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "Ratings: The Swedish players are being slaughtered", "summary": "Failed! Here are the ratings of the Swedish players after 1-5 against the Netherlands.", "title_original": "Betygen: Svenska spelarna slaktas", "summary_original": "Underkänt! Här är betygen på de svenska spelarna efter 1–5 mot Nederländerna.", "link": "https://www.svd.se/a/L4WnrQ/betygen-svenska-spelarna-slaktas", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:52:35+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 125, "title": "The thunderstorm has moved north - yellow warning continues", "summary": "It has thundered and thundered in many places in Sweden during Midsummer's Day. Already early on Saturday morning, strong thunder moved in over Western Sweden. In just a few hours, it flashed 10,000 times.  - The thunder has been a real wake-up call today. Many people have had their houses shaken, says TV4's meteorologist Ulrika Elvgren.\n\nThe storm then gradually moved up over Sweden. The emergency services in Östergötland were called in the afternoon, when the alarms went off, according to Corren. In Linköping, basements flooded in several properties when a large amount of rain fell in a short time. During the day, traffic has been affected by the storm, with trees falling over roads and also several canceled trains. Among other things, there were major delays in train traffic between Kalmar and Gothenburg, due to a signal error caused by the thunderstorm. Finer again on Sunday On Sunday, however, no weather warnings have been issued. The last showers leave northern Sweden in the morning and are followed by fairly sunny weather in most parts of the country. However, the weather will be cooler in some places, while other places will have a rather warm day. - There is still summer heat of between 20-25 degrees in southern Sweden, says Ulrika Elvgren in her weather forecast. However, it will be a little cooler in Norrland's interior, where there will also be an area of ​​rain from the west and some fresh winds. The Norrland coast, on the other hand, can get higher temperatures of upwards of 20 degrees.", "title_original": "Åskovädret har dragit norrut – fortsatt gul varning", "summary_original": "Det har åskat och dundrat på många platser i Sverige under midsommardagen. Redan tidigt på lördagsmorgonen drog kraftig åska in över Västsverige. På bara några timmar blixtrade det 10 000-tals gånger.  – Åskan har varit en riktig väckarklocka i dag. Det är många som fått sina hus omskakade, säger TV4:s meteorolog Ulrika Elvgren.\n\nOvädret drog sig sedan successivt upp över Sverige. Räddningstjänsten i Östergötland blev nedringda på eftermiddagen, när larmen gick i ett, enligt Corren. I Linköping svämmade källare över i flera fastigheter när en stor mängd regn föll på kort tid. Under dagen har trafiken varit påverkad av ovädret, med fallande träd över vägar och även flera inställda tåg. Bland annat var det stora förseningar i tågtrafiken mellan Kalmar och Göteborg, på grund av ett signalfel orsakat av åskovädret. Finare igen under söndagen Under söndagen har däremot inga vädervarningar utfärdats. De sista skurarna lämnar norra Sverige på morgonen och följs av ganska soligt väder på de flesta håll i landet. Däremot blir det svalare väder på en del håll, medan andra platser får en ganska varm dag. – Det är kvar sommarvärme på mellan 20-25 grader i södra Sverige, säger Ulrika Elvgren i sin väderpognos. Lite svalare blir det dock i Norrlands inland där det också kommer in ett regnområde västerifrån och en del friska vindar. Norrlandskusten kan däremot få högre temperaturer på uppåt 20 grader.", "link": "https://www.tv4.se/artikel/7ElHSPvor1IJVyd81Qap5k/askovaedret-har-dragit-norrut-fortsatt-gul-varning", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:40:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vadret", "/ovader", "/aska", "/vadervarningar", "/vader"]}, {"id": 126, "title": "The World Cup nightmare: Sweden outclassed by the Netherlands", "summary": "From 5–1 against Tunisia in Monterrey to 1–5 in Houston. The Netherlands brutally exposed the shortcomings of the Swedish defence. But there is hope despite the run-over. Sweden still has the chance to advance to the Round of 16 in the World Cup.", "title_original": "VM-mardrömmen: Sverige utklassat av Nederländerna", "summary_original": "Från 5–1 mot Tunisien i Monterrey till 1–5 i Houston. Nederländerna avslöjade brutalt bristerna i den svenska defensiven. Men hopp finns trots överkörningen. Sverige har fortfarande chansen att gå vidare till 16-delsfinal i VM.", "link": "https://www.hd.se/sport/svensk-mardromsstart-underlage-direkt/", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:25:46+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Johan Esk: This was a crash landing that even Nasa could not have saved", "summary": "HOUSTON. Sweden's WC team has been out on a joy ride for a few days. Then came the crash landing. The Netherlands won 5–1 and even Nasa could not have saved Sweden, even if Graham Potter called: \"Houston, we have a problem\".", "title_original": "Johan Esk: Det här var en kraschlandning inte ens Nasa kunde ha räddat", "summary_original": "HOUSTON. Sveriges VM-lag har varit ute på en glädjefärd i några dagar. Sedan kom kraschlandningen. Nederländerna vann med 5–1 och inte ens Nasa kunde ha räddat Sverige även om Graham Potter anropat: ”Houston, vi har ett problem”.", "link": "https://www.dn.se/sport/johan-esk-det-har-var-en-kraschlandning-inte-ens-nasa-kunde-ha-raddat/", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:16:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Despite the overrun - Sweden goes on in the WC", "summary": "Cross against Japan guarantees play-offs", "title_original": "Trots överkörningen – så går Sverige vidare i VM", "summary_original": "Kryss mot Japan garanterar slutspel", "link": "https://www.tv4.se/artikel/tt-260620-fotvmlottning1-f43a6b25/trots-overkorningen-sa-gar-sverige-vidare-i-vm", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:15:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Marocko", "/marocko"]}, {"id": 129, "title": "Failed centre-backs - but one player shone despite the big loss", "summary": "Sweden lost to the Netherlands 5–1. Here are the ratings of the Swedish players.", "title_original": "Underkända mittbackar – men en spelare glänste trots storförlusten", "summary_original": "Sverige förlorade mot Nederländerna med 5–1. Här är betygen på de svenska spelarna.", "link": "https://www.sydsvenskan.se/sport/underkanda-mittbackar-men-en-spelare-glanste-trots-storforlusten/", "date_display": "2026-06-20", "date_iso": "2026-06-20T19:08:44+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Starburst in Houston – Sweden's biggest World Cup loss in 76 years", "summary": "HOUSTON. A historic victory against Tunisia. An equally heavy loss against the Netherlands. Sweden is down to earth again after going on a real starburst in Houston. The loss numbers 1–5 were the biggest in a WC for Sweden since 1950.", "title_original": "Stjärnsmäll i Houston – största svenska VM-förlusten på 76 år", "summary_original": "HOUSTON. En historisk seger mot Tunisien. En lika tung förlust mot Nederländerna. Sverige är nere på jorden igen efter att ha åkt på en riktig stjärnsmäll i Houston. Förlustsiffrorna 1–5 var de största i ett VM för svensk del sedan 1950.", "link": "https://www.dn.se/sport/stjarnsmall-i-houston-storsta-svenska-vm-forlusten-pa-76-ar/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:59:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Several dead in Russian attacks on Ukraine", "summary": "Six people have been killed and several injured in Russian attacks on Zaporizhzhya and Kharkiv in Ukraine on Saturday, writes The Kyiv Independent.", "title_original": "Flera döda i ryska attacker mot Ukraina", "summary_original": "Sex människor har dödats och flera skadats i ryska attacker mot Zaporizjzja och Charkiv i Ukraina på lördagen, skriver The Kyiv Independent.", "link": "https://www.sydsvenskan.se/varlden/flera-doda-i-ryska-attacker-mot-ukraina/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:33:27+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Man and woman argued in Höganäs", "summary": "Police were called to central Höganäs after two people started arguing. Both are suspected of crimes.", "title_original": "Man och kvinna bråkade i Höganäs", "summary_original": "Polis larmades till centrala Höganäs efter att två personer börjat bråka. Båda misstänks för brott.", "link": "https://www.hd.se/hoganas/man-och-kvinna-brakade-i-hoganas/", "date_display": "2026-06-20", "date_iso": "2026-06-20T18:31:36+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Elsa and Cornelia Swärd: \"Love is stable, but money runs out quickly\"", "summary": "At the end of the road in Värmland, the couple Elsa and Cornelia Swärd have settled down to live close to nature, farm, hunt and write books. DN has traveled to Ekshärad to meet the fresh detective duo behind this year's summer series \"Blodröta\" - and their neighbors.", "title_original": "Elsa och Corn
