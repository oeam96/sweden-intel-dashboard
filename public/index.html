f Trump's most important election promises. He promised not to start new wars and to keep the US out of costly military adventures. The more Americans are killed, the harder it will be to defend that image, he says. Despite growing criticism, he does not believe Trump's core voters are about to abandon the president. - That question has been asked time and time again for ten years, throughout Trump's political career. But there seems to be no limit. He has created something beyond politics, a movement that has become an identity marker and you don't abandon it in the first instance, says Utterström. Worse starting position in the mid-term elections He believes that there is one thing that can really hurt Trump.  - I think the Epstein affair is Trump's only kryptonite. At the same time, Utterström assesses that dead American soldiers are the type of development that the White House would prefer to avoid. - This will make it more difficult for the Republicans to retain power in Congress after the midterm elections. In any case, if the Democrats take the collar and boo", "title_original": "Experten: Varje dödad soldat gör det svårare för Trump", "summary_original": "Två amerikanska soldater har dödats och en tredje saknas efter en iransk attack mot en amerikansk bas i Jordanien på fredagen.  Därmed har totalt 16 amerikanska militärer dödats sedan USA och Israel inledde sina attacker mot Iran den 28 februari, enligt New York Times. Över 400 amerikanska soldater har dessutom skadats under konflikten. Trots dödsfallen försvarar Donald Trump USA:s militära insats. – De gjorde det eftersom de inte vill se Iran ha kärnvapen, sa Trump till New York Post efter attacken. Händelsen riskerar att bli politiskt besvärlig för den amerikanska presidenten, som sedan tidigare lovat att hålla USA borta från nya krig. I våras varnade USA-kännaren Andreas Utterström för att amerikanska dödsoffer kan bli det som definierar Trumps insats i Mellanöstern.  – Om amerikanska soldater fortsätter att dö är det det som kommer fastna, sa han då. ”Ett svek” Nu menar Utterström att de nya dödsfallen slår direkt mot ett av Trumps viktigaste kampanjlöften. – Det är ett svek mot ett av Trumps viktigaste vallöften. Han lovade att inte starta nya krig och hålla USA borta från kostsamma militära äventyr. Ju fler amerikaner som dödas, desto svårare blir det att försvara den bilden, säger han. Trots växande kritik tror han inte att Trumps kärnväljare är på väg att överge presidenten. – Den frågan har ställts gång på gång i tio år, under hela Trumps politiska karriär. Men det verkar inte finnas någon gräns. Han har skapat något bortom politik, en rörelse som blivit en identitetsmarkör och den överger man inte i första taget, säger Utterström. Sämre utgångsläge i mellanårsvalet Han menar att det finns en sak som på riktigt kan skada Trump.  – Jag tror att Epsteinaffären är Trumps enda kryptonit. Utterström bedömer samtidigt att döda amerikanska soldater är den typ av utveckling som Vita huset helst velat undvika. – Det här kommer göra det svårare för republikanerna att behålla makten i kongressen efter mellanårsvalet. I alla fall om demokraterna tar sig i kragen och börjar visa känslor i stället för sitta fast i lågaffektivt bemötande.", "link": "https://www.tv4.se/artikel/5IKZLruR0dE3WaneNaqMlX/experten-varje-doedad-soldat-goer-det-svarare-foer-trump", "date_display": "2026-07-19", "date_iso": "2026-07-19T12:30:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/donald-trump", "/politiker", "/amerikansk-politik", "/usa", "/irankriget", "/iran"]}, {"id": 148, "title": "The camping boom continues – bookings beat the record year", "summary": "The boom is noticeable not least in Lycksele, where it is packed at Ansia camping.\n\nPlaces fill up quickly here, and many of the guests come from far away. A large number are Norwegians and Finns, but other European visitors also find their way north in search of nature, peace and a holiday feeling.\n\n- People like to camp and the development after the pandemic meant that it was new people who discovered the camping world, says Anders Långström, destination manager at Ansia camping in Lycksele. \"Sun-safe\" and familiar holiday favorite For some, Lycksele has been a given summer choice for a long time. Kent Björkmo from Korgen in Norway is one of them.\n\n- We have been here for eight days now and will stay for a while longer. I have gone here every holiday for the last 40 years, he says.\n\nHe is supported by Kine Bjørkesli, also from Korgen, who believes that the weather plays a big role.\n\n- We have a really good time here. We've only had two days of sun at home in Norway, so we're going to Lycksele where it's sunny, she says. Nature - and the outside world - influences holiday choices At the campsite, Jens Johansson from Boden is setting up his tent with his two boys. He believes that several factors are behind the pressure.\n\n- We have very nice nature here and that attracts people to come out. Then it's worried out in the world and that means that people might stay at home and go on holiday instead, he says.\n\nBacked by high demand and a continued strong interest in camping life, the summer looks set to be another record chapter for Sweden's campsites - from coast to mountains, and with Lycksele as a clear example of the boom.", "title_original": "Campingboomen fortsätter – bokningarna slår rekordåret", "summary_original": "Boomen märks inte minst i Lycksele, där det är fullproppat på Ansia camping.\n\nHär fylls platserna snabbt, och många av gästerna kommer långväga ifrån. En stor del är norrmän och finländare, men även andra europeiska besökare hittar norrut i jakt på natur, lugn och semesterkänsla.\n\n– Folk gillar att campa och utvecklingen efter pandemin gjorde att det var nya människor som upptäckte campingvärlden, säger Anders Långström, destinationsansvarig vid Ansia camping i Lycksele. \"Solsäkert\" och välbekant semesterfavorit För vissa är Lycksele ett givet sommarval sedan länge. Kent Björkmo från Korgen i Norge är en av dem.\n\n– Vi har varit här i åtta dagar nu och stannar ett tag till. Jag har åkt hit varje semester under de senaste 40 åren, säger han.\n\nHan får medhåll av Kine Bjørkesli, också hon från Korgen, som menar att vädret spelar stor roll.\n\n– Vi har det riktigt bra här. Vi har bara haft två dagar sol hemma i Norge, så vi åker till Lycksele där det är solsäkert, säger hon. Naturen – och omvärlden – påverkar semesterval På campingen håller Jens Johansson från Boden på att slå upp sitt tält med sina två pojkar. Han tror att flera faktorer ligger bakom trycket.\n\n– Vi har ju väldigt fin natur här och det lockar folk att komma ut. Sen är det oroligt ute i världen och det gör att folk kanske stannar hemma och semestrar istället, säger han.\n\nMed hög efterfrågan i ryggen och ett fortsatt starkt intresse för campinglivet ser sommaren ut att bli ännu ett rekordkapitel för Sveriges campingar – från kust till fjäll, och med Lycksele som ett tydligt exempel på boomen.", "link": "https://www.tv4.se/artikel/6EWlnYUotQqMWSJf7sWANv/campingboomen-fortsaetter-bokningarna-slar-rekordaret-fullproppat", "date_display": "2026-07-19", "date_iso": "2026-07-19T10:39:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/semester", "/camping", "/lycksele"]}, {"id": 149, "title": "This is where the fire starts in Drammen - see the first minutes", "summary": "Watch the film • The police's theory: This is how the fire started", "title_original": "Här startar branden i Drammen – se första minuterna", "summary_original": "Se filmen • Polisens teori: Så startade branden", "link": "https://www.tv4.se/artikel/45Yd9nYVzjcCc5FToRiHDp/haer-startar-branden-i-drammen", "date_display": "2026-07-18", "date_iso": "2026-07-18T19:13:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna"]}, {"id": 150, "title": "Statement by Romina Pourmokthari", "summary": "Statement by Romina Pourmokthari, Minister for Climate and the Environment.", "title_original": "Statement by Romina Pourmokthari", "summary_original": "Statement by Romina Pourmokthari, Minister for Climate and the Environment.", "link": "https://www.government.se/statements/2026/07/statement-by-romina-pourmokthari/", "date_display": "2026-07-17", "date_iso": "2026-07-17T17:46:17+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "3 days old", "tags": ["EU", "Ministry of Climate and Enterprise", "Environment and climate", "Statement", "Romina Pourmokhtari"]}, {"id": 151, "title": "Sweden to contribute additional SEK 1.4 billion to World Bank operations in Ukraine", "summary": "The Government has today decided to provide SEK 1.4 billion in support to a new World Bank crisis facility that benefits Ukraine. This support enables new loans totalling approximately SEK 4.2 billion for the country’s reconstruction and recovery. The World Bank is a key actor for Ukraine’s reform efforts and economic resilience during Russia’s ongoing aggression. Sweden’s actions have been vital for the establishment of the new crisis facility.", "title_original": "Sweden to contribute additional SEK 1.4 billion to World Bank operations in Ukraine", "summary_original": "The Government has today decided to provide SEK 1.4 billion in support to a new World Bank crisis facility that benefits Ukraine. This support enables new loans totalling approximately SEK 4.2 billion for the country’s reconstruction and recovery. The World Bank is a key actor for Ukraine’s reform efforts and economic resilience during Russia’s ongoing aggression. Sweden’s actions have been vital for the establishment of the new crisis facility.", "link": "https://www.government.se/press-releases/2026/07/sweden-to-contribute-additional-sek-1.4-billion-to-world-bank-operations-in-ukraine", "date_display": "2026-07-16", "date_iso": "2026-07-16T08:30:09+00:00", "source": "Government.se", "ministry": "Ministry of Education and Research", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "International", "Ministry of Education and Research", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Lotta Edholm", "Benjamin Dousa"]}, {"id": 152, "title": "Government puts pressure on EU ahead of Commission’s review of EU Emissions Trading System", "summary": "Next week, the European Commission will present its review of the European Union Emissions Trading System (EU ETS). Sweden’s Minister for EU Affairs Jessica Rosencrantz has sent a letter to the Irish Presidency of the Council of the European Union, with Sweden’s priorities and standpoints ahead of the upcoming negotiations.", "title_original": "Government puts pressure on EU ahead of Commission’s review of EU Emissions Trading System", "summary_original": "Next week, the European Commission will present its review of the European Union Emissions Trading System (EU ETS). Sweden’s Minister for EU Affairs Jessica Rosencrantz has sent a letter to the Irish Presidency of the Council of the European Union, with Sweden’s priorities and standpoints ahead of the upcoming negotiations.", "link": "https://www.government.se/press-releases/2026/07/press-release-government-puts-pressure-on-eu-ahead-of-commissions-review-of-eu-emissions-trading-system/", "date_display": "2026-07-10", "date_iso": "2026-07-10T08:14:23+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "EU", "Prime Minister's Office", "Environment and climate", "Jessica Rosencrantz", "Sweden's climate aid"]}, {"id": 153, "title": "Letter to the President of the Council on regarding the ETS", "summary": "A statement from Minister for EU Affairs Jessica Rosencrantz, on 9 July 2026.", "title_original": "Letter to the President of the Council on regarding the ETS", "summary_original": "A statement from Minister for EU Affairs Jessica Rosencrantz, on 9 July 2026.", "link": "https://www.government.se/statements/2026/07/letter-to-the-president-of-the-council-on-regarding-the-ets/", "date_display": "2026-07-10", "date_iso": "2026-07-10T08:03:49+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "11 days old", "tags": ["EU", "Prime Minister's Office", "Environment and climate", "Statement", "Jessica Rosencrantz", "Sweden's climate aid"]}, {"id": 154, "title": "EU adopts sanctions over poisoning of Russian opposition politician Alexei Navalny", "summary": "In light of the poisoning of Alexei Navalny, the EU has adopted sanctions against six Russian individuals under the chemical weapons sanctions regime. In June, listings of seven individuals and one entity were also adopted under the EU Global Human Rights Sanctions Regime, which was established because of the internal oppression in Russia.", "title_original": "EU adopts sanctions over poisoning of Russian opposition politician Alexei Navalny", "summary_original": "In light of the poisoning of Alexei Navalny, the EU has adopted sanctions against six Russian individuals under the chemical weapons sanctions regime. In June, listings of seven individuals and one entity were also adopted under the EU Global Human Rights Sanctions Regime, which was established because of the internal oppression in Russia.", "link": "https://www.government.se/press-releases/2026/07/eu-adopts-sanctions-over-poisoning-of-russian-opposition-politician-alexei-navalny/", "date_display": "2026-07-07", "date_iso": "2026-07-07T14:57:25+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "EU", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 155, "title": "Government invests SEK 250 million in global health", "summary": "The Government has adopted a new support package for global health, including sexual and reproductive health and rights (SRHR), totalling SEK 250 million for 2026. The health package consolidates Sweden’s commitment to improving the health of the most vulnerable through vaccines in low- and middle-income countries and increased access to maternal and newborn care where the needs are greatest.", "title_original": "Government invests SEK 250 million in global health", "summary_original": "The Government has adopted a new support package for global health, including sexual and reproductive health and rights (SRHR), totalling SEK 250 million for 2026. The health package consolidates Sweden’s commitment to improving the health of the most vulnerable through vaccines in low- and middle-income countries and increased access to maternal and newborn care where the needs are greatest.", "link": "https://www.government.se/press-releases/2026/07/government-invests-sek-250-million-in-global-health/", "date_display": "2026-07-07", "date_iso": "2026-07-07T12:17:56+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Foreign and security policy", "Jakob Forssmed", "Public health", "Benjamin Dousa"]}, {"id": 156, "title": "Charlotte Kugelberg appointed new Head of the Permanent Mission of Sweden to the United Nations", "summary": "On 2 July, the Government appointed Charlotte Kugelberg as Head of the Permanent Mission of Sweden to the United Nations.", "title_original": "Charlotte Kugelberg appointed new Head of the Permanent Mission of Sweden to the United Nations", "summary_original": "On 2 July, the Government appointed Charlotte Kugelberg as Head of the Permanent Mission of Sweden to the United Nations.", "link": "https://www.government.se/press-releases/2026/07/charlotte-kugelberg-appointed-new-head-of-the-permanent-mission-of-sweden-to-the-united-nations/", "date_display": "2026-07-07", "date_iso": "2026-07-07T11:52:04+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "13 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Sweden in the UN"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
