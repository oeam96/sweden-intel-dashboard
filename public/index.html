å, säger Fredrik Olsson, rektor på Grimstaskolan. ”En chock” Tre personer, varav två är under 18 år, är anhållna sedan i lördags, och motivet är ännu oklart. Fredrik Olsson har inte arbetat särskilt länge med den anställde, och menar att beskedet kom helt oväntat. – Man blir ju förvånad, det är en chock att det händer en anställd. Jag har inte personligen en relation till honom, men det är ju en person som jag har haft kontakt med, säger han. Åklagaren måste fatta beslut senast klockan 12 på tisdagen om att begära de anhållna häktade eller släppa dem på fri fot. På måndagen hade alla förhörts med försvarare, efter att vittnen hörts och polisen gjort beslag.  – Nu arbetar vi brett i förundersökningen med bland annat tekniska undersökningar. Polisen är intresserad av att få kontakt med fler personer som kan ha bevittnat händelsen, säger kammaråklagare Sarah Mattsson som leder förundersökningen. Skolan stärker stödet Fredrik Olsson säger att fokus nu ligger på att möta behoven på skolan och ge stöttning. Grimstaskolan har stärkt upp med fler ledare för att kunna hantera situationen. – Det handlar om att finnas där som ett stöd för människor. Att vid minnesstunder kunna fånga upp oroliga medborgare och kontakta närmsta kollegor. Ja, fånga upp oro och sorg, säger han.", "link": "https://www.tv4.se/artikel/48482M3G4w4UWxVVDin0C2/den-moerdade-var-skolanstaelld-en-chock", "date_display": "2026-07-27", "date_iso": "2026-07-27T17:57:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/hasselby", "/mord"]}, {"id": 165, "title": "Swedish Muslims are also responsible for ending LGBTQ hatred", "summary": "Erik Helmerson: More people must declare that violence is not their Islam.", "title_original": "Svenska muslimer har också ansvar för att hbtq-hatet får ett slut", "summary_original": "Erik Helmerson: Fler måste deklarera att våldet inte är deras islam.", "link": "https:   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
