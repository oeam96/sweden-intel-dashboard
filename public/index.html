demokrati och inte låta oss manipuleras av företaget Palantir, skriver Iwan Langermo.", "link": "https://www.dn.se/insandare/lat-inte-amerikanska-palantir-nastla-sig-in-i-vart-samhalle/", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 126, "title": "We must invest where our efforts make the biggest difference", "summary": "Some engagements today live more on tradition and relational loyalty than on mission-strategic relevance, writes Andreas Svedman.", "title_original": "Vi måste satsa där våra insatser gör störst skillnad", "summary_original": "Vissa engagemang lever i dag vidare mer av tradition och relationell lojalitet än av missionsstrategisk relevans, skriver Andreas Svedman.", "link": "https://www.dagen.se/debatt/vi-maste-satsa-daer-vara-insatser-goer-stoerst-skillnad/10341356", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "This is what happened to the Bibles in the hotel rooms - \"a huge difference\"", "summary": "Helena Reuterdahl grateful for the find in the desk drawer.", "title_original": "Så har det gått för biblarna på hotell­rummen – ”en jättestor skillnad”", "summary_original": "Helena Reuterdahl tacksam över fyndet i skrivbordslådan.", "link": "https://www.dagen.se/nyheter/sa-har-det-gatt-foer-biblarna-pa-hotellrummen-en-jaettestor-skillnad/10363740", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "The desire to be accepted can cause the congregation to lose focus on the mission", "summary": "Birger Thureson has read \"Confident leadership\" by Åsa Kristensson", "title_original": "Viljan att bli accepterad kan göra att församlingen tappar fokus på uppdraget", "summary_original": "Birger Thureson har läst ”Förtroendefullt ledarskap” av Åsa Kristensson", "link": "https://www.dagen.se/kultur/viljan-att-bli-accepterad-kan-goera-att-foersamlingen-tappar-fokus-pa-uppdraget/10363519", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Church of Sweden buys church from Equmenia church: \"Becoming more visible\"", "summary": "Opened in 1980 with joint activities between the Church of Sweden and the Mission Church", "title_original": "Svenska kyrkan köper kyrka av Equmeniakyrkan: ”Blir mer synliga”", "summary_original": "Öppnade 1980 med gemensam verksamhet mellan Svenska kyrkan och Missionskyrkan", "link": "https://www.dagen.se/nyheter/svenska-kyrkan-koeper-kyrka-av-equmeniakyrkan-blir-mer-synliga/10371432", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Mass defection shakes Älvdalen's parish", "summary": "Priests and top local politicians drop out - soon the congregation will be without a priest.", "title_original": "Massavhopp skakar Älvdalens församling", "summary_original": "Präster och lokala toppolitiker hoppar av – snart står församlingen utan någon präst.", "link": "https://www.dagen.se/nyheter/massavhopp-skakar-aelvdalens-foersamling/10369895", "date_display": "2026-06-01", "date_iso": "2026-06-01T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Have people had enough of Hemnet's prices?", "summary": "A little over a decade ago it was free. Now it can cost over SEK 30,000 to post a housing ad on Hemnet. The site is one of the country's most visited and has become synonymous with Swedish housing dreams. But now Hemnet has started to lose market share to competitors - and in the last year the company has lost over 75 percent of its value on the stock exchange. How will it go for Hemnet? Program manager: Elinor Ahlborn. With Fredrik Thambert, economics reporter at DN. Producer: Måns Mosesson.", "title_original": "Har folk fått nog av Hemnets priser?", "summary_original": "För ett drygt decennium sedan var det gratis. Nu kan det kosta över 30 000 kronor att lägga upp en bostadsannons på Hemnet. Sajten är en av landets mest välbesökta och har gjort sig synonym med svenska bostadsdrömmar. Men nu har Hemnet börjat förlora marknadsandelar till konkurrenter – och det senaste året har bolaget tappat över 75 procent av sitt värde på börsen. Hur ska det gå för Hemnet? Programledare: Elinor Ahlborn. Med Fredrik Thambert, ekonomireporter på DN. Producent: Måns Mosesson.", "link": "https://www.dn.se/podd/spotlight/har-folk-fatt-nog-av-hemnets-priser/", "date_display": "2026-05-31", "date_iso": "2026-05-31T23:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Man and woman to hospital after attempted murder in Kungälv", "summary": "A man and a woman have been taken to hospital after a serious violent crime in Ytterby in Kungälv municipality. A man has been arrested on suspicion of two counts of attempted murder and child custody offences.", "title_original": "Man och kvinna till sjukhus efter mordförsök i Kungälv", "summary_original": "En man och en kvinna har förts till sjukhus efter ett grovt våldsbrott i Ytterby i Kungälvs kommun. En man har gripits misstänkt för två fall av mordförsök och för barnfridsbrott.", "link": "https://www.dn.se/sverige/allvarligt-valdsbrott-i-kungalv-minst-tva-till-sjukhus/", "date_display": "2026-05-31", "date_iso": "2026-05-31T21:40:49+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Finland ruined Switzerland's gold party - decided in extra time", "summary": "Sunday night's World Cup final between host nation Switzerland and Finland was a tight story. After three periods played, the score was 0–0. An extension was required to determine which of the teams would receive the gold. There, Finland's 20-year-old forward Konsta Helenius stepped forward as the great hero and secured the Finnish WC gold. Switzerland still has to wait for its first.", "title_original": "Finland förstörde Schweiz guldfest – avgjorde i förlängningen", "summary_original": "Söndagskvällens VM-final mellan värdnationen Schweiz och Finland blev en tajt historia. Efter tre spelade perioder var ställningen 0–0. Det krävdes förlängning för att utse vilket av lagen som skulle få ta emot guldet. Där klev Finlands 20-årige forward Konsta Helenius fram som den store hjälten och säkrade det finländska VM-guldet. Schweiz får fortsatt vänta på sitt första.", "link": "https://www.dn.se/sport/finland-forstorde-schweiz-guldfest-avgjorde-i-forlangningen/", "date_display": "2026-05-31", "date_iso": "2026-05-31T21:15:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Ukraine urges the US to increase missile production - warns of a major Russian attack", "summary": "US production of anti-ballistic missiles is not enough, warns Ukrainian President Volodymyr Zelenskyy. At the same time, Ukraine states that Russia is \"within days\" planning new attacks with its most feared robots.", "title_original": "Ukraina manar USA att öka missilproduktion – varnar för rysk storattack", "summary_original": "USA:s produktion av antiballistiska missiler räcker inte till, varnar Ukrainas president Volodymyr Zelenskyj. Samtidigt uppger Ukraina att Ryssland ”inom dagar” planerar nya attacker med sina mest fruktade robotar.", "link": "https://www.dn.se/varlden/ukraina-manar-usa-att-oka-missilproduktion-varnar-for-rysk-storattack/", "date_display": "2026-05-31", "date_iso": "2026-05-31T20:49:19+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Letter to the editor. Erik Slottner shows that he is unsuitable as a minister", "summary": "LETTER TO THE EDITOR. All politicians, just like us \"ordinary citizens\", must of course speak the truth. If Civil Minister Erik Slottner had completed his studies in political science, he would hopefully have been able to distinguish between his private interests and his public mission as a politician, writes Eva Ekberg Jäder.", "title_original": "Insändare. Erik Slottner visar att han är olämplig som statsråd", "summary_original": "INSÄNDARE. Alla politiker, precis som vi ”vanliga medborgare”, ska naturligtvis tala sanning. Om civilminister Erik Slottner hade avslutat sina studier i statsvetenskap hade han förhoppningsvis klarat av att skilja mellan sina privata intressen och sitt publika uppdrag som politiker, skriver Eva Ekberg Jäder.", "link": "https://www.dn.se/insandare/erik-slottner-visar-att-han-ar-olamplig-som-statsrad/", "date_display": "2026-05-31", "date_iso": "2026-05-31T20:45:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Iran has restored underground robot bases - after US attacks", "summary": "Iran's network of underground bases began to be built over 20 years ago. The facilities are located deep underground, in some cases hundreds of meters down, and provide a robust shield that limits Israel's and the United States' ability to attack the robots and launch pads. During the opening weeks of the conflict, the countries therefore instead bombed the tunnel mouths and surrounding roads. The attacks restricted Iran's access to the underground bases for weeks. But now, with the help of dump trucks and bulldozers, the country has been able to quickly clear away the racial masses and dig up its arsenals - something that shows the limitations of the US's expensive bomb strategy, experts told CNN. Expected to be able to resume attacks Iran and the United States are currently in intensive negotiations to produce a peace agreement. The US wants, among other things, to get Iran to agree to abandon its nuclear weapons program, and to bring about an immediate opening of the Strait of Hormuz. However, the parties still seem to be far apart when it comes to the main goals of the agreement.  Should fighting resume, Iran once again has the capacity to \"continue firing missiles as long as they have launch pads and men, even if production has ceased.\" Research assistant Sam Lair, who analyzed Iran's long-range weapons capabilities, told CNN. \"There is nothing to prevent the ramps from being armed with the large stockpile of missiles that the Iranians still have,\" he continues. Five out of seven tunnel mouths have been restored During the war, Iran worked continuously to dig up the destroyed tunnel mouths to access its stockpiles of long-range robots. A dangerous job but something that allowed the country to continue its attacks despite the American bombings, albeit at a greatly reduced rate. Since the ceasefire came into force about seven weeks ago, Iran has been able to speed up the work even further. According to CNN's analysis, the country has now been able to clear 50 of 69 destroyed tunnel mouths, at 18 underground", "title_original": "Iran har återställt underjordiska robotbaser – efter USA:s attacker", "summary_original": "Irans nätverk av underjordiska baser började byggas för över 20 år sen. Anläggningarna är belägna djupt under marken, i vissa fall hundratals meter ner, och utgör ett robust skydd som begränsar Israel och USA:s möjligheter att attackera robotarna och avfyrningsramperna. Under konfliktens inledande veckor bombade länderna därför istället tunnelmynningarna och omkringliggande vägar. Attackerna begränsade Irans tillgång till de underjordiska baserna i veckor. Men nu har landet, med hjälp av dumprar och bulldozrar, snabbt kunnat rensa undan rasmassorna och gräva fram sina arsenaler – något som visar på begräsningarna i USA:s dyra bombstrategi, uppger experter för CNN. Väntas kunna återuppta attackerna Iran och USA befinner sig för tillfället i intensiva förhandlingar om att ta fram ett fredsavtal. USA vill bland annat få Iran att gå med på att överge sitt kärnvapenprogram, och få till en omedelbar öppning av Hormuzsundet. Parterna verkar dock fortsatt stå långt ifrån varandra när det gäller de huvudsakliga målen i överenskommelsen.  Skulle striderna återupptas har Iran på nytt kapacitet att ”fortsätta avfyra missiler så länge de har avfyrningsramper och mannar, även om produktionen har upphört”. Det säger forskningsassistenten Sam Lair, som analyserat Irans förmågor vad gäller långdistansvapen, till CNN. ”Det finns inget som hindrar ramperna från att beväpnas med det stora lager av missiler som iranierna fortfarande har”, fortsätter han. Fem av sju tunnelmynningar har återställts Under kriget jobbade Iran kontinuerligt med att gräva fram de raserade tunnelmynningarna för att komma åt sina lager av långdistansrobotar. Ett farligt arbete men något som gjorde att landet kunde fortsätta sina attacker trots de amerikanska bombningarna, om än i kraftigt reducerad takt. Sedan vapenvilan trädde i kraft för omkring sju veckor sedan har Iran kunnat påskynda arbetet ytterligare. Enligt CNN:s analys har landet nu kunnat rensa 50 av 69 förstörda tunnelmynningar, vid 18 underjordiska anläggningar, från rasmassor. Även vägar omkring anläggningarna som förstörts i bombningarna har reparerats. Nästan samtliga kratrar har fyllts igen, och på två platser har Iran dessutom asfalterat på nytt. Lair menar att USA brister i uppföljningen av de ursprungliga attackerna. ”Den amerikanska militären är bra på att leverera taktiska framgångar (...) Men om det inte åtföljs av en uppsättning rimliga strategiska krigsmål och en uppnåelig segerplan, kan det sluta i ett strategiskt misslyckande”, säger han. ”De är mycket väl förberedda” Iran beräknas fortsatt ha omkring 1 000 robotar på lager i sina underjordiska anläggningar. Lagren har sannolikt inte lidit några större skador av attackerna, enligt experter. ”De har förberett sig för den här typen av krig i 20 år”, säger Timur Kadyshev, forskare vid Institutet för fredsforskning och säkerhetspolitik vid Hamburgs universitet. ”De är mycket väl förberedda”, fortsätter han. USA och Israel har i attackerna också riktat sig mot produktionskedjan. Men bombningarna av fabrikerna tycks inte drabba produktionstakten i den utsträckning länderna väntat sig. Även under tolvadagarskrig i juni förra året attackerades robotfabrikerna. Satellitbilder som CNN tagit del av visar att anläggningarna som så förstördes redan kunnat byggas upp. En tjänsteman inom den amerikanska underrättelsetjänsten uppger också att Iran tycks ha överträffat den beräknade tidsramen för återuppbyggnad. Timur Kadyshev menar att USA:s attacker blottlägger svårigheten i att attackera Iran. ”Man måste använda väldigt sofistikerade, väldigt dyra vapen för att göra den här typen av skada, och sedan är återuppbyggnaden väldigt lågteknologisk – det räcker med bulldozrar”, säger han.", "link": "https://www.tv4.se/artikel/5JM3KH5pLDUXnYPJVlwvCI/iran-har-aterstaellt-underjordiska-robotbaser-efter-usa-s-attacker", "date_display": "2026-05-31", "date_iso": "2026-05-31T20:40:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/usa", "/irankriget", "/iran"]}, {"id": 137, "title": "Suspected Ebola cases in Brazil", "summary": "It is partly about a 37-year-old man who recently arrived from Congo-Kinshasa. The country is the epicenter of the latest Ebola outbreak, with 246 confirmed deaths, according to the African Union's Africa CDC. The man reportedly showed symptoms such as a fever, which is enough to classify it as a suspicious case, according to local authorities in Sao Paulo. He has been isolated at an institute for infectious diseases and has been confirmed to have meningitis but will also be tested for Ebola, writes AFP. The second case concerns a man who arrived in Rio de Janeiro from Uganda. He is said to have exhibited \"viral symptoms such as cough, chills and diarrhoea\", according to local officials. Rio's city office told AFP on Sunday that the man tested positive for malaria but that \"the case is still under investigation\". On Saturday, it was reported that at least 1,077 cases of Ebola have been confirmed in Congo-Kinshasa since the outbreak was confirmed in mid-May.", "title_original": "Misstänkta ebolafall i Brasilien", "summary_original": "Det handlar dels om en 37-årig man som nyligen ankommit från Kongo-Kinshasa. Landet är epicentrum för det senaste ebolautbrottet med 246 bekräftade dödsfall, enligt Afrikanska unionens smittskyddsorgan, Africa CDC. Mannen ska ha uppvisat symtom som feber, vilket är tillräckligt för att klassa det som ett misstänkt fall, enligt lokala myndigheter i Sao Paulo. Han har isolerats på ett institut för infektionssjukdomar och har bekräftats ha hjärnhinneinflammation men ska även testas för ebola, skriver AFP. Det andra fallet rör en man som anlänt till Rio de Janeiro från Uganda. Han ska ha uppvisat ”virussymtom som hosta, frossa och diarré”, enligt lokala tjänstemän. Rios stadskontor uppger för AFP på söndagen att mannen testat positivt för malaria men att ”fallet fortsatt är under utredning”. Under lördagen rapporterades att minst 1 077 fall av ebola konstaterats i Kongo-Kinshasa sedan utbrottet bekräftades i mitten av maj.", "link": "https://www.tv4.se/artikel/1Bkpu1lyH5rNN66KdWiOIx/tva-misstaenkta-ebolafall-i-brasilien", "date_display": "2026-05-31", "date_iso": "2026-05-31T19:39:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ebola", "/brasilien", "/kongo-kinshasa", "/uganda", "/sjukdomar", "/sjukdomsfall"]}, {"id": 138, "title": "Two had to leave - they are ready for finals week", "summary": "After a tough competition and a raucous ear council, it was clear that Amadeus Harrysson, Iki Gonzalez Magnusson, Ola Birgersson, Jonas Källqvist, Sonja Rudqvist, Marie Werkestam and Caroline Järgren are ready for the final week - a real milestone in the program. - Wow. Shit. Damn it. God, I'm completely... I'm going to die, says Caroline Järgren in the program. Halil had to leave Before the island council, Halil Bas was more nervous than nervous. During the voting, however, it was he who received the most votes. He doesn't know why he got the most votes. - It's a game. I don't really know what happened there really. It is what it is, he says. Luckily for the one voted out, there was a wheel of fate he could spin, where he could either end up in a duel where the winner gets to stay in Robinson - or on a skull and sent home to Sweden. The odds were not on Halil Bas's side and the arrow stopped on a skull. - What damn odds, he says. - I would have liked to take the whole shit home, but unfortunately it didn't happen that way. \"I'm sad and I'm happy\" After an unusually hard fight before the island council between Ola, Amadeus, Halil and Lasse, it was finally the latter who was defeated and forced to leave. Lasse Lundholm has divided both the TV viewers and the participants, and Amadeus Harrysson was really disappointed when he didn't get to take Lasse back to the beach. - He is a real spreader of joy, says Amadeus. When Lasse Lundholm gets to say a few last words to the group, he notes that you don't always treat everyone equally. - But you have to try. It turns out that everyone has a good heart after all. - I'm sad and I'm happy. I will get to come home and see my wife and my children and my grandchildren. And then of course I'm sorry that I went out Robinson. I would have liked to be on the podium at least.", "title_original": "Två fick lämna – de är klara för finalveckan", "summary_original": "Efter en tuff tävling och ett rafflande öråd stod det klart att Amadeus Harrysson, Iki Gonzalez Magnusson, Ola Birgersson, Jonas Källqvist, Sonja Rudqvist, Marie Werkestam och Caroline Järgren är klara för finalveckan – en riktig milstolpe i programmet. – Wow. Shit. Fyfan. Gud, jag är helt... jag kommer att tuppa av, säger Caroline Järgren i programmet. Halil fick lämna Inför örådet var Halil Bas mer taggad än nervös. Under omröstningen var det dock han som fick flest röster. Varför just han fick flest röster på sig vet han inte. – Det är ett spel. Jag vet inte riktigt vad som hände där egentligen. Det är väl vad det är, säger han. Som tur för den utröstade fanns ett ödeshjul han kunde snurra på, där han antingen kunde hamna i en duell där vinnaren får stanna kvar i Robinson – eller på en dödskalle och skickas hem till Sverige. Oddsen var inte på Halil Bas sida och pilen stannade på en dödskalle. – Vilka jävla odds, säger han. – Jag hade velat ta hem hela skiten, men så blev det tyvärr inte. ”Jag är ledsen och jag är glad” Efter en ovanligt hård kamp innan örådet mellan Ola, Amadeus, Halil och Lasse var det till slut den sistnämnda som fick se sig besegrad och tvingades lämna. Lasse Lundholm har delat både tv-tittarna och de medverkande, och Amadeus Harrysson var riktigt besviken när han inte fick ta med sig Lasse tillbaka till stranden. – Han är en riktig glädjespridare, säger Amadeus. När Lasse Lundholm får säga ett par sista ord till gruppen konstaterar han att man inte alltid drar jämnt med alla människor. – Men man får försöka. Det har visat sig att alla har ett gott hjärta ändå. – Jag är ledsen och jag är glad. Jag ska få komma hem och träffa min fru och mina barn och mina barnbarn. Och sen är jag ju så klart ledsen att jag åkte ut Robinson. Jag hade ju velat vara med på pallen åtminstone.", "link": "https://www.tv4.se/artikel/1r9epONI5A56ZnOfkvPK9I/tva-fick-laemna-de-aer-klara-foer-finalveckan", "date_display": "2026-05-31", "date_iso": "2026-05-31T19:00:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 139, "title": "Fraudsters left users alone - for 209 hours: \"Reckless\"", "summary": "The married couple in their 40s are charged with gross assistance fraud, gross fraud and gross assault of a man with a disability in Uppsala, for whom they worked as personal assistants.  The crimes must have been committed between 2020 and 2025. According to the prosecutor, the man and woman defrauded the Swedish Social Insurance Agency of roughly four million kroner. They also allegedly stole money from the disabled man. - I mean that they have cheated themselves of assistance compensation from the Social Insurance Agency and also seized the man's income, says senior prosecutor Victoria Engelkes, in a press release. Among the evidence are receipts for goods, some of them exclusive, that the duo is suspected of having bought with the user's account card, as well as surveillance footage and private photos from their phones. Among other things, the married couple bought the goods for a New Year's dinner with the user's money, according to the investigation. Among other things, sparklers, original roast, Skagen mash, beef fillet, béarnaise, lemon, prawns, raspberries, cucumber, salad, red onion and dill.   As proof that the man was not at the dinner, there are pictures from the New Year's celebration. Systematic crimes The prosecutor believes that the crimes should be assessed as serious when \"they were carried out systematically, on a larger scale and intended for an overall significant amount\". The couple is also charged with aggravated assault, as due to their employment as personal assistants they had a so-called guarantor position, with the obligation to care for and take care of the user. - Since they seriously broke down in this regard and thereby caused the man injury, I mean that they made themselves guilty of assault, says Victoria Engelkes. Alone for 209 hours The duo is suspected of having exposed the user to psychological harm, as well as putting him in a state of powerlessness by leaving him without care and supervision during scheduled duty hours. According to the indictment, the man was left alone for a total of 209 hours and 43 minutes, when the man or woman had paid to be by his side. On several occasions they will", "title_original": "Bedragare lämnade brukare ensam – i 209 timmar: ”Hänsynslöst”", "summary_original": "Det gifta paret i 40-årsåldern åtalas för grova assistansbedrägerier, grovt bedrägeri och grov misshandel av en man med funktionsnedsättning i Uppsala, som de arbetade som personliga assistenter till.  Brotten ska ha begåtts mellan 2020 och 2025. Enligt åklagaren har mannen och kvinnan lurat Försäkringskassan på drygt fyra miljoner kronor. De ska därtill också ha stulit pengar från den funktionsnedsatte mannen. – Jag menar att de har fuskat till sig assistansersättning från Försäkringskassan och dessutom lagt beslag på mannens inkomster, säger senior åklagare Victoria Engelkes, i ett pressmeddelande. Bland bevisningen finns kvitton på varor, en del av dem exklusiva, som duon misstänks ha köpt med brukarens kontokort, samt övervakningsfilmer och privata bilder från deras telefoner. Det gifta paret har bland annat köpt varorna till en nyårsmiddag med brukarens pengar, enligt utredningen. Bland annat tomtebloss, originalrost, skagenröra, oxfilé, bearnaise, citron, räkor, hallon, gurka, sallad, rödlök och dill.   Som bevisning att mannen inte var med på middagen finns bilder från nyårsfirandet. Systematiska brott Åklagaren anser att brotten bör bedömas som grova då ”de utförts systematiskt, i större omfattning samt avsett ett sammantaget betydande belopp”. Paret åtalas även för grov misshandel, då de på grund av sina anställningar som personliga assistenter haft en så kallad garantställning, med skyldighet att vårda och ha omsorg om brukaren. – Då de gravt brustit i detta avseende och därigenom orsakat mannen skada så menar jag att de gjort sig skyliga till misshandel, säger Victoria Engelkes. Ensam i 209 timmar Duon misstänks för att ha utsatt brukaren för psykisk skada, samt försatt honom i ett tillstånd av vanmakt genom att under schemalagd tjänstetid lämna honom utan vård och tillsyn. Mannen har enligt åtalet lämnats ensam under en sammanlagd tid av 209 timmar och 43 minuter, då mannen eller kvinnan hade betalt för att vara vid hans sida. Vid flera tillfällen ska det handla om totalt 15 timmar per dygn. ”De ska vid nämnda tillfällen underlåtit att tillgodose mannens behov av bland annat lägesförändringar, sondmatning, medicinering och avlägsnande av slem ur luftvägarna. Brottet är grovt då underlåtenheten har varit livsfarlig samt då de har visat särskild hänsynslöshet och/eller råhet”, lyder åtalet. Paret greps i juni 2025 och satt häktade i tre månader innan de försattes på fri fot. De båda förnekar brott.", "link": "https://www.tv4.se/artikel/16uiSyeMXqTHfLTgfCwAGC/bedragare-laemnade-brukare-ensam-i-209-timmar-haensynsloest", "date_display": "2026-05-31", "date_iso": "2026-05-31T18:37:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/uppsala", "/bedragerier", "/forsakringskassan", "/personlig-assistans"]}, {"id": 140, "title": "S wants to greatly reduce the wild boar population - hunters critical", "summary": "The Social Democrats want to see a sharp reduction in Sweden's wild boar population. The party believes that today's estimated 300,000 wild boars should be reduced to just a few thousand.  According to the party's rural policy spokesperson Anna-Caren Sätherberg, the aim is to reduce the problems that wild boars cause around the country, including damage to agriculture, traffic accidents and destroyed gardens and cemeteries. - It's about us wanting to see increased food production in this country. We also have a zero vision for traffic accidents. Both of these don't rhyme with a very high wild boar tribe, she says.  Want to imitate our neighboring countries The Social Democrats believe that the Riksdag should now set a target for how many wild boars will be allowed in Sweden.  The party points to neighboring countries as examples. According to Anna-Caren Sätherberg, Finland has around 2,500 to 3,000 wild boars, Norway around 1,400 and Denmark basically no wild boars at all. - We simply have to increase the hunting of wild boar. It is not a quick fix if you want to reduce the number from the number we have now to a much lower one.  Criticism of the proposal The government also wants to reduce the wild boar population, but Rural Affairs Minister Peter Kullgren believes that the Social Democrats' proposal is the wrong way to go.  Instead, he calls for concrete measures to deal with the problems. - Now the Social Democrats are moving forward with a rather extreme goal, and that will have consequences for property rights above all. The game is up to the landowners to manage as they wish.  The Swedish Hunters' Association: \"We are surprised\" The Swedish Hunters' Association also reacts to the outcome. The association's general secretary Carl-Johan Djurstedt Holm believes that the proposal challenges the Swedish model for game management.  - We have a very long tradition of managing game locally. So as close to the hunter as possible or where the game is. That is where you have the best overview of how large a population you have, what damage you have and what you need to do, he says and continues: - That then national", "title_original": "S vill minska vildsvinsstammen kraftigt – jägare kritiska", "summary_original": "Socialdemokraterna vill se en kraftig minskning av Sveriges vildsvinsstam. Partiet anser att dagens uppskattningsvis 300 000 vildsvin bör minska till bara några tusen.  Enligt partiets landsbygdspolitiska talesperson Anna-Caren Sätherberg är syftet att minska problemen som vildsvinen orsakar runt om i landet, bland annat skador på jordbruket, trafikolyckor och förstörda trädgårdar och kyrkogårdar. – Det handlar ju om att vi vill se en ökad livsmedelsproduktion i det här landet. Vi har också en nollvision för trafikolyckor. Båda de här rimmar inte med en väldigt hög vildsvinstamm, säger hon.  Vill efterlikna våra grannländer Socialdemokraterna anser att riksdagen nu bör sätta ett mål för hur många vildsvin som ska få finnas i Sverige.  Partiet pekar på grannländerna som exempel. Enligt Anna-Caren Sätherberg har Finland omkring 2 500 till 3 000 vildsvin, Norge cirka 1 400 och Danmark i princip inga vildsvin alls. – Vi måste helt enkelt öka jakten på vildsvin. Det är ju inte en quick fix om man ska få ner stammen från antalet vi har nu till ett väldigt mycket lägre.  Kritik mot förslaget Även regeringen vill minska vildsvinsstammen, men landsbygdsminister Peter Kullgren anser att Socialdemokraternas förslag är fel väg att gå.  Han efterlyser i stället konkreta åtgärder för att hantera problemen. – Nu går ju Socialdemokraterna fram med en ganska extrem målsättning och då får ju det konsekvenser för äganderätten framför allt. Viltet är ju upp till markägarna att förvalta som man vill.  Jägareförbundet: ”Vi är överraskade” Även Svenska Jägareförbundet reagerar på utspelet. Förbundets generalsekreterare Carl-Johan Djurstedt Holm menar att förslaget utmanar den svenska modellen för viltförvaltning.  – Vi har en väldigt lång tradition av att förvalta viltet lokalt. Alltså så nära jägaren som möjligt eller där viltet finns. Det är där man har bäst koll på hur stor population man har, vilka skador man har och vad man behöver göra, säger han och fortsätter:  – Att då förstatliga den processen och sätta ett statligt mål och sedan driva det, det är någonting nytt som vi inte har sett tidigare. Så jag kan säga att vi är överraskade.", "link": "https://www.tv4.se/artikel/ONMO303MduHkbjlMuvZhd/s-vill-minska-vildsvinsstammen-kraftigt-jaegare-kritiska", "date_display": "2026-05-31", "date_iso": "2026-05-31T17:28:41+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/valet-2022/socialdemokraterna", "/vildsvin", "/jakt", "/svensk-politik"]}, {"id": 141, "title": "Therefore, the summer plague may be dead", "summary": "The last summer plague was Sabrina Carpenter's megahit \"Espresso\", which in 2024 was played everywhere, but it is a weak candidate if you look at the real classics: \"Despacito\" and \"I thought there were angels\" from 2017, \"Hej hej Monika\" from 2004 or \"Mambo no. 5\" from 1999.\n\nOne explanation for the fact that the summer plagues are conspicuous by their absence could be that instead hits are created in clusters. Is that surprising? No. Access to music has changed since Spotify's entry 20 years ago - and even more so compared to the days when Absolute Music records were hot. Since the algorithms started to control our flows on social media, we have ended up in popular cultural silos. The fact that I'm drowning in videos of Harry Styles in short shorts and carpets being deep-cleaned is probably something that many others miss completely.  The requirement: Perfect mix of ingredients In order for a summer plague to take hold, it requires a perfect mix of ingredients that should be able to transcend genres. It needs to have a relatively high tempo, convey a holiday feeling, be easy to recognize and repeat, and get a lot of exposure. Some contenders could be Middle winner Felicia's \"My System\", \"Dracula\" with Tame Impala & Jennie, Olivia Rodrigo's \"Drop Dead\" or possibly \"Janice STFU\" which is Drake's recently released sample of Lykke Li's \"I Follow Rivers\". But I have a hard time seeing any of them getting through the din of soccer brawls that will dominate the summer.\n\nAt the same time, we see how the amount of AI-generated music finds its way into our feeds. An example is the soca-inspired Tiktok song \"Melissa I'm drunk and outside'\", which was perfect for the European heat wave. Or the ear mask “First time in San Juan, mi hijo”.\n\nIn addition, the word \"torment\" is an outdated concept in the context and in English it does not even exist, but there it is called \"song of the summer\". Because in all honesty, it's been a long time since a summer hit could also be classified as a plague, such as \"Crazy Frog\" in 2005. I miss the time around the 00s when \"millennial optimism\"", "title_original": "Därför kan sommarplågan vara död", "summary_original": "Den senaste sommarplågan var Sabrina Carpenters megahit ”Espresso” som 2024 spelades överallt, men det är en svag kandidat om man ser till de riktiga klassikerna: ”Despacito” och “Jag trodde änglarna fanns” från 2017, ”Hej hej Monika” från 2004 eller ”Mambo no. 5” från 1999.\n\nEn förklaring till att sommarplågorna lyser med sin frånvaro skulle kunna vara att det i stället skapas hits i kluster. Är det förvånande? Nej. Tillgången på musik har förändrats sedan Spotifys intåg för 20 år sedan – och ännu mer jämfört med tiden när Absolute Music-skivorna gick varma. Sedan algoritmerna börjat styra våra flöden på sociala medier har vi hamnat i populärkulturella silos. Att jag drunknar i videos på Harry Styles i korta shorts och mattor som djuprengörs går nog många andra helt förbi.  Kravet: Perfekt blandning av ingredienser För att en sommarplåga ska få fäste kräver det en perfekt blanding av ingredienser som ska kunna överskrida genrer. Den behöver ha ett relativt högt tempo, förmedla en semesterkänsla, vara lätt att känna igen och upprepa, samt få stor exponering. Några utmanare skulle kunna vara Mellovinnaren Felicias ”My System”, ”Dracula” med Tame Impala & Jennie, Olivia Rodrigos ”Drop Dead” eller möjligtvis ”Janice STFU” som är Drakes nyss släppta sampling av Lykke Lis ”I Follow Rivers”. Men jag har svårt att se att någon av dem kommer att ta sig igenom bruset av fotbollsdängor som kommer dominera sommaren.\n\nSamtidigt ser vi hur mängden AI-genererad musik tar sig in i våra flöden. Ett exempel är den socainspirerade Tiktok-låten ”Melissa I’m drunk and outside’” som kom perfekt till den europeiska värmeböljan. Eller öronmasken “First time in San Juan, mi hijo”.\n\nDessutom är ordet “plåga” ett föråldrat begrepp i sammanhanget och på engelskan finns det inte ens, utan där heter det “song of the summer”. För i ärlighetens namn var det länge sedan en sommarhit också kunde klassas som en plåga, såsom “Crazy Frog” 2005. Jag saknar tiden runt 00-talet när “millennial optimism” genomsyrade populärkultur och mode och det gjordes oängslig musik som fick leva ett sommarliv. Den tiden är sedan länge förbi liksom mustaschmuggar, Urban Outfitters och Mange Schmidt.\n\nDen som lever får se – i värsta fall dimper århundradets låt ner imorgon och i stället blir det den här krönikan som får gå i graven.", "link": "https://www.tv4.se/artikel/39KsKgKlZEmYrazh8sf2qU/daerfoer-aer-sommarplagan-doed", "date_display": "2026-05-31", "date_iso": "2026-05-31T15:43:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/musik", "/popularkultur", "/sommar"]}, {"id": 142, "title": "Ebola outbreak spreads at record speed: \"Very serious\"", "summary": "The Ebola outbreak in Congo-Kinshasa continues to grow at a rapid pace. Over a thousand suspected cases have been reported and at least 246 people have died. At the same time, the dark figure is reported to be large. Now the aid organization Doctors Without Borders is warning that the infection is spreading at record speed. \"Never before have so many cases been reported so soon after an Ebola outbreak was confirmed,\" said Deputy Director Alan Gonzalez in a statement. \"It doesn't usually go this fast\" Anneli Eriksson, who has worked several times in Ebola-affected areas for Doctors Without Borders, describes the situation as worrying.  - Everything indicates that the situation is very serious. If the suspected cases are confirmed as Ebola, it is a huge outbreak. Development doesn't usually go this fast, she says.  The outbreak can be compared to two previous outbreaks of the Bundibugyo variant of the Ebola virus. In 2007, a total of 131 cases were reported and in 2012, 38 people were infected.  - Now we are talking about over 200 deaths this early. It is a very high level, and there could certainly be more infected.  According to Anneli Eriksson, extensive resources are required to gain control over the spread of infection. At the same time, closed borders and airports can lead to delays in, among other things, medical equipment and humanitarian aid.  In addition, test results on suspected sick people are delayed, which can further worsen the situation.  Distrust of authorities One of the biggest challenges right now is the widespread distrust of authorities and healthcare personnel in the affected areas.  According to Anneli Eriksson, the public's trust is decisive for whether the spread of infection can be slowed down or escalated. - No measures will work if people do not feel confident in the work being done. The key now is to work together. The problem became clear a few weeks ago when two Ebola treatment centers were set on fire. The background was that relatives were not allowed to handle their deceased family members, because even dead bodies can be a lot", "title_original": "Ebolautbrottet sprider sig rekordsnabbt: ”Väldigt allvarligt”", "summary_original": "Ebolautbrottet i Kongo-Kinshasa fortsätter att växa i snabb takt. Över tusen misstänkta fall har rapporterats och minst 246 personer har dött. Samtidigt uppges mörkertalet vara stort. Nu varnar hjälporganisationen Läkare utan gränser för att smittan sprider sig rekordsnabbt. – Aldrig förr har så många fall rapporterats så kort efter att ett ebolautbrott konstaterats, säger biträdande direktören Alan Gonzalez i ett uttalande. ”Så här snabbt brukar det inte gå”  Anneli Eriksson, som flera gånger arbetat i eboladrabbade områden för Läkare utan gränser, beskriver situationen som oroande.  – Allt tyder på att läget är väldigt allvarligt. Om de misstänkta fallen bekräftas som ebola handlar det om ett enormt utbrott. Så här snabbt brukar utvecklingen inte gå, säger hon.  Utbrottet kan jämföras med två tidigare utbrott av Bundibugyo-varianten av ebolaviruset. År 2007 rapporterades totalt 131 fall och 2012 smittades 38 personer.  – Nu pratar vi om över 200 dödsfall så här tidigt. Det är en mycket hög nivå, och det kan absolut finnas fler smittade.  Enligt Anneli Eriksson krävs det omfattande resurser för att få kontroll över smittspridningen. Samtidigt kan stängda gränser och flygplatser leda till förseningar av bland annat medicinsk utrustning och humanitärt bistånd.  Dessutom dröjer testresultaten på misstänkt sjuka personer, vilket kan förvärra situationen ytterligare.  Misstro mot myndigheter En av de största utmaningarna just nu är den utbredda misstron mot myndigheter och sjukvårdspersonal i de drabbade områdena.  Enligt Anneli Eriksson är befolkningens förtroende avgörande för om smittspridningen ska kunna bromsas eller eskalera. – Inga åtgärder kommer att fungera om människor inte känner förtroende för det arbete som görs. Nyckeln nu är att arbeta tillsammans. Problemet blev tydligt för några veckor sedan när två ebolabehandlingscenter sattes i brand. Bakgrunden var att anhöriga inte fick hantera sina avlidna familjemedlemmar, eftersom även döda kroppar kan vara mycket smittsamma.  Flera länder varnas Smittan har även spridit sig till grannlandet Uganda. Under helgen varnades ytterligare tio länder som löper risk att drabbas.  – Det finns goda chanser att begränsa fallen i Uganda. I och med att varningen gick ut så måste de övervaka och stärka gränskontrollerna för att hitta smittade. Men det finns många andra länder runt omkring som är instabila och där det kan finnas luckor i övervakningen, säger Anneli Eriksson. Trots den snabba utvecklingen bedömer hon risken för ett större globalt utbrott som minimal.  – Det viktigaste nu är att få stopp på utbrottet där det pågår som mest, men också att stötta länder runtomkring för att snabbt kunna identifiera fall.", "link": "https://www.tv4.se/artikel/6rw2QrcTlWYpt967BON34j/ebolautbrottet-sprider-sig-rekordsnabbt-vaeldigt-allvarligt", "date_display": "2026-05-31", "date_iso": "2026-05-31T14:04:29+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ebola", "/kongo-kinshasa", "/lakare-utan-granser", "/uganda"]}, {"id": 143, "title": "GW about Nyberg being fired: \"Want to mark distance\"", "summary": "Last week it was announced that member of parliament Katja Nyberg would be fired from her post at the Police Authority following a decision by the personnel responsibility board. At the same time, she is charged with drunk driving, drug offenses and illegal driving. Nyberg has criticized the decision to fire her before the legal process is completed. That criticism is supported by the criminologist Leif GW Persson. - She has had objections to it and thinks it is strange, to say the least. I share her opinion on that point, he says.  \"Condemned in advance\" The trial against Nyberg is expected to begin at the end of September, shortly after the election. According to Leif GW Persson, it is unusual for an authority to make such a decision before a possible verdict.  - It is a departure from the routines, he says.  - Normally, you wait for the outcome of the trial, but here they have apparently been in a great hurry. He also points out that Nyberg has already been stripped of his duties in several transparency councils and therefore poses no security risk. - In some way, you very much want to clearly mark a sudden distance from her. Prejudice, you could say, says Leif GW Persson.  GW: Denial doesn't help Katja Nyberg denies all charges except the illegal driving. But according to Leif GW Persson, precisely that part of the indictment is of minor importance.  - It is uninteresting in the context, she would never have been fired if it was only about it. But it is the other thing that is sensitive, the thing that she denies.  According to the indictment, Nyberg is suspected of having used drugs on eight occasions. A bag of cocaine was also found in her purse. - She denies but it won't help her much because there is overwhelming evidence against her that claims the opposite, says Leif GW Persson.", "title_original": "GW om att Nyberg avskedas: ”Vill markera avstånd”", "summary_original": "Förra veckan kom beskedet att riksdagsledamoten Katja Nyberg sparkas från sin tjänst inom Polismyndigheten efter ett beslut av personalansvarsnämnden. Samtidigt står hon åtalad för rattfylleri, narkotikabrott och olovlig körning. Nyberg har kritiserat beslutet att avskeda henne innan rättsprocessen är avslutad. Den kritiken får stöd av kriminologen Leif GW Persson. – Hon har haft invändningar mot det och tycker att det minst sagt är konstigt. Jag delar hennes uppfattning på den punkten, säger han.  ”Dömd på förhand” Rättegången mot Nyberg väntas inledas i slutet av september, strax efter valet. Enligt Leif GW Persson är det ovanligt att en myndighet fattar ett sådant beslut innan en eventuell dom.  – Det är ett avsteg från rutinerna, säger han.  – Normalt brukar man invänta utfallet av rättegången, men här har man tydligen fått väldigt bråttom. Han poängterar också att Nyberg redan har fråntagits sina uppdrag i flera insynsråd och därför inte utgör någon säkerhetsrisk. – På något sätt vill man väldigt gärna tydligt markera ett plötsligt avstånd till henne. Dömd på förhand skulle man kunna säga, säger Leif GW Persson.  GW: Nekandet hjälper inte Katja Nyberg nekar till samtliga åtalspunkter förutom den olovliga körningen. Men enligt Leif GW Persson är just den delen av åtalet av mindre betydelse.  – Den är ointressant i sammanhanget, hon skulle aldrig fått sparken om det enbart handlade om den. Utan det är det andra som är känsligt, det som hon nekar till.  Enligt åtalet misstänks Nyberg ha använt narkotika vid åtta tillfällen. En påse med kokain har dessutom påträffats i hennes handväska. – Hon nekar men det kommer inte hjälpa henne i stort för det finns en överväldigande bevisning mot henne som hävdar motsatsen, säger Leif GW Persson.", "link": "https://www.tv4.se/artikel/1VkCNrTwh9omnhaSy8Efqu/gw-om-att-nyberg-avskedas-vill-markera-avstand", "date_display": "2026-05-31", "date_iso": "2026-05-31T12:05:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/politik", "/personer/leif-gw-persson", "/katja-nyberg", "/polismyndigheten"]}, {"id": 144, "title": "IAEA: Occupied nuclear power plant hit by drones", "summary": "According to the facility's Russian management, the drone in the attack in Zaporizhzhya must have hit a turbine building and reportedly caused a hole in a wall. Key nuclear equipment was not damaged, according to the data. The information is confirmed by the IAEA, which observes the situation at the nuclear power plant. \"The IAEA's team at (the nuclear power plant) ZNPP has observed damage to the exterior of a turbine building that was allegedly hit by a drone attack yesterday,\" the IAEA said in a statement, adding that it did not measure elevated radioactivity. Ukraine dismisses the accusations as a Russian \"propaganda campaign\". \"Along the relevant part of the front line, there was no active fighting at the time of the incident, and no weapons were used,\" the military writes in a statement. Ukrainian drones are said to have also hit an oil depot in southern Russia, far from the front line in the Russian war of invasion. A pumping facility at an oil pipeline was also attacked in a separate drone attack, according to the information from Kiev. Russian officials confirm the attacks. The pumping plant and pipeline that were attacked run from Siberia to western Russia and Belarus. The attack took place in the Kirov region. The attacked oil depot is located in the Rostov region.", "title_original": "IAEA: Ockuperat kärnkraftverk träffat av drönare", "summary_original": "Drönaren i angreppet i Zaporizjzja ska enligt anläggningens ryska ledning ha träffat en turbinbyggnad och uppges ha orsakat ett hål i en vägg. Viktig kärnteknisk utrustning skadades inte, enligt uppgifterna. Uppgiften bekräftas av IAEA som observerar läget vid kärnenergianläggningen. \"IAEA:s grupp vid (kärnenergianläggningen) ZNPP har observerat skador på utsidan av en turbinbyggnad som ska ha utsatts för en drönarattack i går\", skriver IAEA i ett uttalande, och lägger till att man inte uppmätt förhöjd radioaktivitet, Det ryska statliga kärnenergiföretaget Rosatom hävdar att det handlar om en medveten och riktad attack från Ukraina. Ukraina avfärdar anklagelserna som en rysk ”propagandakampanj”. ”Längs den relevanta delen av frontlinjen förekom inga aktiva strider vid tidpunkten för händelsen, och inga vapen användes”, skriver militären i ett uttalande. Ukrainska drönare ska även ha träffat en oljedepå i södra Ryssland, långt från frontlinjen i det ryska invasionskriget. Även en pumpanläggning vid en oljeledning angreps i en separat drönarattack, enligt uppgifterna från Kiev. Ryska tjänstemän bekräftar attackerna. Pumpanläggningen och pipelinen som attackerades går från Sibirien till västra Ryssland och Belarus. Attacken skedde i Kirovregionen. Den angripna oljedepån ligger i Rostovregionen.", "link": "https://www.tv4.se/artikel/3pNlTArb0iWIbTubXFP8Pd/uppgifter-kaernkraftverk-traeffat-av-droenare", "date_display": "2026-05-31", "date_iso": "2026-05-31T11:52:55+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ryssland", "/karnkraftverk", "/ukraina", "/ukrainakonflikten"]}, {"id": 145, "title": "Here are the most common causes of dizziness: \"Like Gröna Lund on crack\"", "summary": "The balance system is complex and is found in several parts of the body. This includes vision, muscles and joints, pressure receptors in the feet and the balance organ.  - There are many ways that our balance system can go wrong, says Marcus Olausson, doctor and specialist in general medicine. \"It's terrible\" The absolute most common cause of dizziness is age. When we get older, we often see a little worse, we get less muscle mass and the nerves in the feet can function. All of these components are included in our balance system. Another very common cause is crystal disease. It affects about half a percent per year. - Especially with the crystal disease you get quite bad. You usually wake up out of bed and then you turn over and then you get a very strong dizziness that lasts 50 to 30 seconds. You stay in bed because it feels like you're going to fall out, and in some cases you can even vomit because of this dizziness, says Marcus Olausson. Drops in blood pressure and stress are also common causes. \nMuch rarer are Ménière's disease and vestibular neuritis. There, the dizziness can last for several hours to days.  - You feel so bad. You may have difficulty getting up, you lie down and vomit. Everything just spins. It's like being at Gröna Lund on crack. It's terrible. What can you do yourself? If you generally feel a sense of unsteadiness and a feeling of dizziness where you can't find a reason, you can train the parts of the balance system. It can be about getting glasses if your vision is bad or building more muscle mass to strengthen around joints. - You can also train balance, and the VHO, for example, recommends that for older individuals, where you can do a lot, says Marcus Olausson. Even if the dizziness in those cases is often not dangerous, it can still mean a lot of discomfort. - It affects life quite a lot. Those individuals have an impact on the quality of life, definitely, says Marcus Olausson. If you experience dizziness associated with difficulty speaking, numbness and weakness in an arm, double vision or cramping", "title_original": "Här är vanligaste orsakerna till yrsel: ”Som Gröna Lund på crack”", "summary_original": "Balanssystemet är komplext och finns i flera delar av kroppen. Det handlar bland annat om synen, muskler och leder, tryckreceptorer i fötterna och balansorganet.  – Det finns många sätt det kan gå fel i vårt balanssystem, säger Marcus Olausson, läkare och specialist allmänmedicin. ”Det är hemskt” Den absolut vanligaste orsaken till yrsel är åldern. När vi blir äldre så ser vi ofta lite sämre, vi får mindre muskelmassa och nerverna i fötterna kan fungera. Alla de här komponenterna är med i vårt balanssystem. En annan väldigt vanlig orsak är kristallsjukan. Den drabbar ungefär en halv procent per år. – Just vid kristallsjukan blir man ganska dålig. Man brukar vakna upp ur sängen och så vänder man på sig och så får man en jättekraftig yrsel som varar 50 till 30 sekunder. Man håller sig i sängen för det känns som att man ska ramla ur och man kan i vissa fall även kräkas på grund av den här yrseln, säger Marcus Olausson. Blodtrycksfall och stress är också vanliga orsaker. \nMycket ovanligare är méniers sjukdom och vestibularis-neurit. Där kan yrseln hålla i sig i flera timmar till dagar.  – Man mår så dåligt. Du kan ha svårt att resa dig, du ligger och kräks. Allting bara snurrar. Det är som att vara på  Gröna Lund på crack. Det är hemskt. Vad kan man göra själv? Om man generellt sett känner en ostadighetskänsla  och en yrselkänsla där man inte hittar någon anledning kan man träna upp delarna i balanssystemet. Det kan handla om att skaffa glasögon om synen är dålig eller bygga mer muskelmassa för att stärka upp kring leder. – Man kan även träna balans och det rekommenderar till exempel VHO för äldre individer, där kan man göra väldigt mycket, säger Marcus Olausson. Även om yrseln i de fall ofta inte är farlig kan den ändå innebära ett stort obehag. – Det påverkar livet ganska mycket. De individerna får en påverkan på livskvaliteten, definitivt, säger säger Marcus Olausson. Om du får yrsel i samband med talsvårigheter, domningar och svaghet i en arm, dubbelseende eller kraftig huvudvärk kan det vara tecken på en stroke och då bör du söka akut vård.\n\nYrsel kan även komma i samband med hjärtproblem. Känner du av hjärtklappning, andningssvårigheter eller bröstsmärta ska du också kontakta 112.", "link": "https://www.tv4.se/artikel/3fJQbd8bi1IZc3Ha8F1NF1/haer-aer-vanligaste-orsakerna-till-yrsel-som-groena-lund-pa-crack", "date_display": "2026-05-31", "date_iso": "2026-05-31T11:11:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Hälsa", "/halsa", "/nyhetsmorgon", "/doktor-marcus", "/fysik", "/sjukvard"]}, {"id": 146, "title": "They provide community and support for mothers in isolation", "summary": "Anja Nordenfelt started the organization Mamma United to give marginalized mothers knowledge, tools and power to influence their own life situation. They also want to equip the mothers to be able to give their children the best conditions to grow up to be strong individuals, she says.  - You are involuntarily alone many times. You come to a new country, have left family and friends in your home country and then you come to Sweden, you have no job. But you may only have your children, and no one else in your social circle. It is so incredibly important to get women to be in a context where you meet others, she says. Participant: \"It gave me self-esteem\" The women in Mamma United meet one day a week for three months and receive training in socially important functions, violence in close relationships or just a conversation about loneliness. Experts often come and give lectures on the various subjects. - It is very important information that I have received. I remember when I came to Sweden. It was difficult to enter society, to learn the language. All mothers must have this help, says coordinator Dunia Ibrahim who started as a participant.   Suzan Simsek is also a coordinator in the organization and agrees.  - It gave me self-esteem. And I had someone I could talk to, she says. \"The language barrier is a big problem\" The women they meet express that they need support with school, mental illness and care - but above all work. - All mothers say they want a job to be less alone. So we try to help the mothers get in touch with different employers who can help the mothers into employment, says Anja Nordenfelt.\n\nSuzan Simsek expresses that it is difficult to stand on your own two feet as a woman born abroad. - The language barrier is a big problem - and the power of the man and the culture. Therefore, it is important for a mother to have financial freedom in order to give her children good conditions, she says.", "title_original": "De ger gemenskap och stöd för mammor i utanförskap", "summary_original": "Anja Nordenfelt startade organisationen Mamma United för att ge mammor i utanförskap kunskap, verktyg och kraft att påverka sin egen livssituation. De vill också rusta mammorna att kunna ge sina barn de bästa förutsättningarna att växa upp till starka individer, säger hon.  – Man är ofrivilligt ensam många gånger. Man kommer till ett nytt land, har lämnat familj och vänner i hemlandet och så kommer man till Sverige, man har ingen sysselsättning. Men man kanske bara har sina barn, och ingen annan i sitt umgänge. Det är så otroligt viktigt att få kvinnor att vara i ett sammanhang  där man träffar andra, säger hon. Deltagaren: ”Det gav mig självkänsla” Kvinnorna i Mamma United ses en dag i veckan under tre månader och får utbildning i samhällsviktiga funktioner, våld i nära relationer eller bara ett samtal om ensamhet. Ofta kommer experter och föreläser i de olika ämnena. – Det är jätteviktig information som jag har fått. Jag kommer ihåg när jag kom till Sverige. Det var svårt att komma in i samhället, att lära sig språket. Alla mammor måste ha den här hjälpen, säger koordinatorn Dunia Ibrahim som började som en deltagare.   Suzan Simsek är också koordinator i organisationen och håller med.  – Det gav mig självkänsla. Och jag hade någon som jag kunde prata med, säger hon. ”Språkbarriären är ett stort problem” Kvinnorna de träffar uttrycker att de behöver stöd kring skola, psykisk ohälsa och vård – men framför allt arbete. – Alla mammor säger att de vill ha ett arbete för att vara mindre ensamma. Så vi försöker hjälpa mammorna att komma i kontakt med olika arbetsgivare som kan hjälpa mammorna in i sysselsättning, säger Anja Nordenfelt.\n\nSuzan Simsek uttrycker att det är svårt att stå på egna ben som utrikesfödd kvinna. – Språkbarriären är ett stort problem – och mannens makt och kulturen. Därför är det viktigt att ha ekonomisk frihet för en mamma för att ge sina barn goda förutsättningar, säger hon.", "link": "https://www.tv4.se/artikel/2nVCFhMHZ4OPzfEstti2D4/de-ger-gemenskap-och-stoed-foer-mammor-i-utanfoerskap", "date_display": "2026-05-31", "date_iso": "2026-05-31T10:07:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/nyhetsmorgon", "/nyheter-och-samhalle", "/ensamhet"]}, {"id": 147, "title": "Almost 800 arrested in France - fear of new clashes", "summary": "Paris has been rocked by unrest after Paris Saint-Germain won the Champions League final for the second consecutive year. Clashes with police have led to hundreds of arrests and several injured officers. - Despite the large security effort they carried out, with the lessons learned from last year where two people died, there were still plenty of riots, says Jennifer Paterson, reporter on the ground in Paris. During a press conference on Sunday, Interior Minister Laurent Nuñes announced that the situation was generally under control, but that 780 people had been arrested so far. It has been worst in Paris, with the most arrests. According to the police, cars as well as bus stops and shops have been destroyed around the city. Also 57 police officers are said to have been injured in connection with the clashes. Car drove into outdoor restaurant According to AFP, tear gas was fired at supporters after fireworks were thrown at police outside the Parc des Princes. Around 20,000 people gathered on the Champs-Élysées to celebrate PSG's victory. A car trying to escape from the police is said to have crashed into an outdoor restaurant where supporters were celebrating, two of whom were injured. - It's not quite as bad as last year, but still many arrests and clashes between police and different types of supporters, continues Jennifer Paterson. The Minister of the Interior calls the violence unacceptable. - I regret these abuses, but they were unfortunately expected, says Laurent Nuñes. Fears more unrest PSG won Saturday's final against Arsenal on penalties at the Puskás Arena in Budapest. Due to the situation last year, a parade along the Champs-Élysées has already been opted out of to reduce the risk of violence.  Instead, the champions arrive at 4pm on Sunday at the Eiffel Tower, where they will bow in front of almost 100,000 spectators. A couple of hours later they will be received by President Emmanuel Macron at the Élysée Palace and later the evening continues with celebrations with supporters at the Parc de Prince. The police in Paris have a continued police operation during the day when Fr", "title_original": "Nästan 800 gripna i Frankrike – oro för nya sammandrabbningar", "summary_original": "Paris har skakats av oroligheter efter att Paris Saint-Germain för andra året i rad vunnit Champions League-finalen. Sammandrabbningar med polis har lett till hundratals gripanden och flera skadade poliser. – Trots den stora säkerhetsinsatsen man genomförde, med lärdomarna man hade från förra året där två personer omkom, så var det ändå rejält med kravaller, säger Jennifer Paterson, reporter på plats i Paris. Under en pressträff på söndagen meddelade inrikesminister Laurent Nuñes att läget överlag var under kontroll men att 780 personer gripits hittills. Värst har det varit i Paris, med flest gripna. Enligt polis har såväl bilar som busshållplatser och butiker förstörts runtom i staden. Även 57 poliser ska ha skadats i samband med sammandrabbningarna. Bil körde in i uteservering  Enligt AFP sattes tårgas in mot supportrar sedan fyrverkerier kastats mot polis utanför Parc des Princes. Omkring 20 000 personer samlades på Champs-Élysées för att fira PSG:s seger. En bil som försökte fly från polisen ska ha kört in i en uteservering där supportrar firade, varav två skadades. – Det är inte riktigt så illa som förra året, men ändå många gripna och sammandrabbningar mellan polis och olika typer av supportrar, fortsätter Jennifer Paterson. Inrikesministern kallar våldet för oacceptabelt. – Jag beklagar dessa övergrepp, men de var tyvärr väntade, säger Laurent Nuñes. Fruktar fler oroligheter PSG vann lördagens final mot Arsenal efter straffläggning på Puskás Aréna i Budapest. På grund av situationen förra året har man sedan tidigare valt bort ett paradfirande längs med Champs-Élysées för att minska risken för våldsamheter.  I stället anländer mästarna vid 16-tiden på söndagen till Eiffeltornet där de kommer höja bucklan inför nästan 100 000 åskådare. Ett par timmar senare kommer de tas emot av president Emmanuel Macron på Élyséepalatset och senare fortsätter kvällen med firande med supportrar på Parc de Prince. Polisen i Paris har en fortsatt polisinsats under dagen då man fruktar ännu fler oroligheter. – Det verkar någon slags kultur som har blossat upp i Frankrike där många människor vill nästan konfrontera sig med polisen. Samtidigt får man komma ihåg att det stora antalet fransmän firar segern utan att förstöra. Så det är en dubbelhet med både kravaller och glada firanden som existerar sida vid sida, säger Jennifer Paterson.", "link": "https://www.tv4.se/artikel/4J6pIAJqCMXHx8oT0OauUA/oro-foer-nya-sammandrabbningar-i-paris-naer-psg-anlaender", "date_display": "2026-05-31", "date_iso": "2026-05-31T10:06:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/fotboll", "/sport", "/champions-league", "/paris"]}, {"id": 148, "title": "This is how robotic dogs will help Mexican police during the World Cup", "summary": "It's gathering outside the Estadio Monterrey. In anticipation of June 14 and the Swedish kick-off, the Mexican police's unexpected new acquisition for the World Cup goes in a row and shows itself to the TV4 Nyheternas team on site.  Equipped with AI, the robot dogs will search for dangerous objects or explosive devices and, according to the police, at the same time analyze risks in real time, such as fights between drunken supporters. The local authorities call the dogs an important addition when it comes to guaranteeing security during the WC.  - They are designed to be able to get into tight spaces with poor visibility. They have infrared analysis functions and facial recognition, and help us as police officers to make better decisions, says Miguel Zepeda, head of the police in Monterrey. Critic: “Expensive and uncomfortable” They cost around $145,000, can run 25 kilometers per hour, withstand drops of up to one meter and work in temperatures of up to 70 degrees. But Mexico is not the first - robot dogs have been used in the United States, among others, where critics have called them expensive and unpleasant. Others have warned of the dangers of excessive surveillance.  Armed police also on site For the Mexican authorities, the last few months have been about demonstrating to the outside world that it is safe for foreign supporters to travel to the game locations Mexico City, Guadalajara and Monterrey. In addition to the robot dogs, which are controlled much like flying drones, supporters in attendance can also expect heavily armed police to roam around the matches. Among them, self-confidence is high. - We will guarantee all security so that those who visit us, both from other countries and from here, will feel safe and at ease, says German Juarez Ochoa, head of the Monterrey task force. And that will be enough? - Of course. The charm offensive seems to have gone home. Gabriella Nilsson Nuñez at the Swedish supporters' association Camp Sweden, which counts around 2,500 blue-and-yellow fans in Monterrey, is satisfied with the communication with the authorities in Mexico. She tells T", "title_original": "Så ska robothundar hjälpa mexikansk polis under VM", "summary_original": "Det drar ihop sig utanför Estadio Monterrey. I väntan på den 14 juni och svensk avspark går den mexikanska polisens oväntade nyförvärv till VM på rad och visar upp sig för TV4 Nyheternas team på plats.  Utrustade med AI ska robothundarna söka efter farliga föremål eller sprängladdningar och enligt polisen, samtidigt analysera risker i realtid, som bråk mellan berusade supportrar. De lokala myndigheterna kallar hundarna ett viktigt tillskott när det gäller att garantera säkerheten under VM.  – De är utformade för att kunna ta sig in i trånga utrymmen med dålig sikt. De har infraröda analysfunktioner och ansiktsigenkänning, och hjälper oss som poliser att ta bättre beslut, säger Miguel Zepeda, chef på polisen i Monterrey. Kritiker: ”Dyra och obehagliga” De kostar omkring 145 000 dollar, kan springa 25 kilometer i timmen, klarar fall på upp till en meter och fungerar i temperaturer på upp till 70 grader. Men Mexiko är inte först – robothundar har använts i bland annat USA, där kritiker kallat dem dyra och obehagliga. Andra har varnat för riskerna med överdriven övervakning.  Beväpnade poliser också på plats För de mexikanska myndigheterna har de senaste månaderna handlat om att visa upp för omvärlden att det är tryggt för utländska supportrar att resa till spelorterna Mexiko City, Guadalajara och Monterrey. Utöver robothundarna, som styrs ungefär som flygande drönare, kan supportrar på plats också vänta sig att tungt beväpnade poliser rör sig runt matcherna. Bland dem är självförtroendet stort. – Vi kommer att garantera all säkerhet så att de som besöker oss, både från andra länder och härifrån, ska känna sig trygga och tillfreds, säger German Juarez Ochoa, chef för insatsstyrkan Monterrey. Och det kommer att vara tillräckligt? – Självklart. Charmoffensiven verkar ha gått hem. Gabriella Nilsson Nuñez på svenska supporterföreningen Camp Sweden, som räknar med omkring 2 500 blågula fans i Monterrey, är nöjd med kommunikationen med myndigheterna i Mexiko. Hon säger till TV4 Nyheterna att hon inte mött någon som helst oro eller tveksamheter bland svenska supportrar som vill resa till Monterrey. – De flesta är bara väldigt taggade på att åka, säger hon.", "link": "https://www.tv4.se/artikel/4rQ3w2LZ5txwvhHSjON21V/sa-ska-robothundar-hjaelpa-mexikansk-polis-under-vm", "date_display": "2026-05-31", "date_iso": "2026-05-31T09:12:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport", "/mexiko", "/fotbolls-vm-2026", "/fotboll"]}, {"id": 149, "title": "Decision on 250 million in capital - to benefit congregations", "summary": "Trossamfundet Pingst takes over shares and securities - closes asset management company", "title_original": "Beslut om 250 miljoner i kapital – ska komma församlingar tillgodo", "summary_original": "Trossamfundet Pingst tar över aktier och värdepapper – lägger ner kapitalförvaltningsbolag", "link": "https://www.dagen.se/nyheter/beslut-om-250-miljoner-i-kapital-ska-komma-foersamlingar-tillgodo/10371779", "date_display": "2026-05-31", "date_iso": "2026-05-31T07:07:47+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "They are to be part of Pentecost's pastor's council - and watch over identity and theology", "summary": "Here are the names of the pastors council's 15 members • Newly appointed regional leaders were presented at the council meeting", "title_original": "De ska ingå i Pingsts pastorsråd – och vaka över identitet och teologi", "summary_original": "Här är namnen på pastorsrådets 15 medlemmar • Nyutnämnda regionledare presenterades vid rådslaget", "link": "https://www.dagen.se/nyheter/de-ska-inga-i-pingsts-pastorsrad-och-vaka-oever-identitet-och-teologi/10371742", "date_display": "2026-05-31", "date_iso": "2026-05-31T06:54:44+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "Breaking the silence after the poisonings at Akademiska", "summary": "It was a normal day at work in November 2025 but suddenly \"Anna\" and \"Linda\" became very seriously ill with mysterious symptoms. Their bodies were shaking uncontrollably, their hearts were racing, and their potassium levels were so low they were close to cardiac arrest. - So like a fever and chills times a hundred. It felt like the heart was beating up, vibrating, as if it would burst through the chest and hit one's throat, says \"Linda\". \"The whole body shook\" The prosecutor has never publicly disclosed what the nurses were exposed to. Only when the investigation was closed did the victims themselves find out. For TV4 Nyheterna Story, they now tell us what it was: salbutamol - a bronchodilator asthma medicine sold under the name Ventoline.  It is used for severe asthma symptoms. It must have been given in liquid form and is available on the ward. In small doses it produces harmless tremors. In large doses, it disturbs the body's potassium, and then the heart beats incorrectly. - I have long hair at work, the colleagues around me describe that \"the only thing we saw was a mere tuft going back and forth\", because the whole body was shaking, says \"Anna\". Perhaps we will never know the whole truth The investigation into attempted murder was closed in April 2026 and the suspicions against the previously suspected female colleague were written off. \"Anna\" and \"Linda\" may never get the full answer to who was behind the poisoning and why.\n\n- It is probably someone who has done this on purpose. So it was a very scary thought, says \"Linda\".\n\n- It makes me sad and disappointed and afraid that someone else could be exposed to this again, says \"Anna\".\nThe entire story about the dramatic course of the poisoning at Akademiska, in the nurses' own words, can be seen in Nyheterna Story on TV4 Play.", "title_original": "Bryter tystnaden efter förgiftningarna på Akademiska", "summary_original": "Det var en vanlig dag på jobbet i november 2025 men plötsligt blev ”Anna” och ”Linda” mycket allvarligt sjuka med mystiska symtom. Deras kroppar skakade okontrollerat, deras hjärtan rusade och de hade så låga kaliumnivåer att de var nära hjärtstillestånd. – Alltså som en feberfrossa gånger hundra. Det kändes som hjärtat slog upp, vibrerade, som att det skulle slå ut genom bröstet och slog upp i halsen på en, säger ”Linda”. ”Hela kroppen skakade” Vad sjuksköterskorna utsattes för har åklagaren aldrig gått ut med offentligt. Först när utredningen lades ner fick de drabbade själva veta. För TV4 Nyheterna Story berättar de nu vad det var: salbutamol - ett luftrörsvidgande astmaläkemedel som säljs under namnet Ventoline.  Den används vid kraftiga astmabesvär. Det ska ha getts i flytande form och finns på avdelningen. I små doser ger det ofarliga skakningar. I stora doser rubbar det kroppens kalium, och då slår hjärtat fel. – Jag har långt uppsatt hår på jobbet, kollegorna runt om mig beskriver att ”det enda vi såg det var en bara tofs som åker fram och tillbaka”, för att hela kroppen skakade, säger ”Anna”. Kanske aldrig får veta hela sanningen Utredningen om mordförsök lades ner i april 2026 och misstankarna mot den tidigare misstänkta kvinnliga kollegan skrevs av. ”Anna” och ”Linda” kommer kanske aldrig att få det fulla svaret på vem som låg bakom förgiftningen och varför.\n\n– Det är ju förmodligen någon som har gjort det här medvetet. Så det var ju väldigt läskig tanke, säger ”Linda”.\n\n– Det gör mig ledsen och besviken och rädd för att någon annan kan bli utsatt igen för det här, säger \"Anna\".\nHela berättelsen om det dramatiska förloppet om förgiftningen på Akademiska, med sjuksköterskornas egna ord, går att se i Nyheterna Story på TV4 Play.", "link": "https://www.tv4.se/artikel/1XcVPNXIEF2oX8HkDanvPp/bryter-tystnaden-efter-foergiftningarna-pa-akademiska-sjukhuset", "date_display": "2026-05-31", "date_iso": "2026-05-31T06:00:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Akademiska sjukhuset", "/akademiska-sjukhuset", "/uppsala", "/inrikes", "/nyheterna-story"]}, {"id": 152, "title": "The authors' union ends up in a compromise around AI", "summary": "We sincerely hope that this is now done consistently, says the poet Olivia Bergdahl. The motion, which dealt with whether texts from the Authors' Association's members should be included in the state's AI language model, received some attention during the annual general meeting. Wanted to see a break They wanted to see a break for the project and appoint a group to investigate the issue - something that must now be done. We realized that it was a crucial decision that was on the table. There is a great deal of ignorance among authors in these matters and if there is not an open discussion about what the technology can mean, we are in a difficult position. This discussion should have been held a year ago, before the project was started, says Olivia Bergdahl. In February, the government announced that a new Swedish language model will be developed within the research program WASP. The funding comes from the Knut and Alice Wallenberg foundation and the goal is for the language model to be able to produce its own texts. Decision not anchored The Publishers' Association, Tidningsiggivarna and Bonnierförlagen support what is so far a research project. The Writers' Union believes that it is better to participate in the project - than to let foreign tech companies steal the authors' texts. But the decision to participate in the project has not really been anchored in the majority of the members, says Olivia Bergdahl, who together with fellow writers Nino Mick, Mattias Beijmo and Linus Kollberg wrote the motion. We are at such a strange time in history, where a profession is heavily influenced by technology that is very complex. With that, a debate is required where many different perspectives can be heard, says Olivia Bergdahl.", "title_original": "Författarförbundet landar i kompromiss kring AI", "summary_original": "Vi hoppas innerligt att detta nu görs följdriktigt, säger poeten Olivia Bergdahl. Motionen, som handlade om huruvida texter från Författarförbundets medlemmar ska kunna ingå i statens AI-språkmodell, fick visst gehör under årsstämman. Ville se paus Man ville se en paus för projektet och tillsätta en grupp för att utreda frågan – något som nu ska göras. Vi insåg att det var ett avgörande beslut som låg uppe på bordet. Det finns en väldigt stor okunskap bland författare i de här frågorna och om det inte sker en öppen diskussion kring vad tekniken kan innebära så är vi i en svår sits. Den här diskussionen borde ju ha tagits för ett år sedan, innan projektet sattes i gång, säger Olivia Bergdahl. I februari meddelade regeringen att en ny svensk språkmodell ska tas fram inom forskningsprogrammet WASP. Finansieringen kommer från Knut och Alice Wallenbergs stiftelse och målet är att språkmodellen ska kunna producera egna texter. Beslutet inte förankrat Förläggareföreningen, Tidningsutgivarna och Bonnierförlagen stödjer vad som än så länge är ett forskningsprojekt. Författarförbundet menar att det är bättre att medverka i projektet – än att låta utländska techbolag stjäla författarnas texter. Men beslutet att medverka i projektet har inte riktigt förankrats hos majoriteten av medlemmarna, menar Olivia Bergdahl, som tillsammans med författarkollegorna Nino Mick, Mattias Beijmo och Linus Kollberg skrivit motionen. Vi befinner oss vid en så märklig historisk tidpunkt, där en yrkesgrupp påverkas starkt av teknik som är väldigt komplex. I och med det krävs en debatt där många olika perspektiv får höras, säger Olivia Bergdahl.", "link": "https://www.tv4.se/artikel/2fWogEjDM5Iu4TX143pRW6/foerfattarfoerbundet-landar-i-kompromiss-kring-ai", "date_display": "2026-05-31", "date_iso": "2026-05-31T04:44:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/forfattare", "/forfattarforbundet"]}, {"id": 153, "title": "“I started to purge certain songs from my playlists”", "summary": "Today's youth panel advises on what they have read, seen and heard recently", "title_original": "”Jag började rensa ut vissa låtar från mina spellistor”", "summary_original": "Dagens ungdomspanel tipsar om vad de läst, sett och hört den senaste tiden", "link": "https://www.dagen.se/kultur/jag-boerjade-rensa-ut-vissa-latar-fran-mina-spellistor/10362352", "date_display": "2026-05-31", "date_iso": "2026-05-31T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "The Advent Church in Örebro shows Sweden's night match in the soccer World Cup", "summary": "Pastor Anton Torstensson promises a sober alternative to late-night pubs.", "title_original": "Adventskyrkan i Örebro visar Sveriges nattmatch i fotbolls-VM", "summary_original": "Pastor Anton Torstensson lovar ett nyktert alternativ till nattöppna pubar.", "link": "https://www.dagen.se/nyheter/adventskyrkan-i-oerebro-visar-sveriges-nattmatch-i-fotbolls-vm/10363724", "date_dis
