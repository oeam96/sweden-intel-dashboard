n är den torka som förvärrats av väderfenomenet El Niño.", "link": "https://www.svd.se/a/L4mjmq/torka-begransar-sjohandeln", "date_display": "2026-08-20", "date_iso": "2026-08-20T22:22:03+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 110, "title": "\"Eating clams and pretending I'm in Paris\"", "summary": "Elsa Billgren challenges the eggs' best before date, snacks on granola and cooks French home cooking for France Gall.", "title_original": "”Äter musslor och låtsas jag är i Paris”", "summary_original": "Elsa Billgren utmanar äggens bäst före-datum, småäter granola och lagar fransk husman till France Gall.", "link": "https://www.svd.se/a/5po9A6/elsa-billgren-bestaller-musslor-och-latsas-att-jag-ar-i-paris", "date_display": "2026-08-20", "date_iso": "2026-08-20T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat &amp; dryck"]}, {"id": 111, "title": "\"Delivers against the price tag\"", "summary": "Greece is a wine country that offers both richness of taste and food friendliness. Here are eight wines to try.", "title_original": "”Överlevererar mot prislappen”", "summary_original": "Grekland är ett vinland som bjuder på både smakrikedom och matvänlighet. Här är åtta viner att testa.", "link": "https://www.svd.se/a/V6ayG1/andreas-grube-atta-karaktarsfulla-viner-fran-grekland", "date_display": "2026-08-20", "date_iso": "2026-08-20T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat &amp; dryck"]}, {"id": 112, "title": "\"The restaurant is one of the city's most beautiful\"", "summary": "Dipping shoe, spring crow and wholesaler's dinner - Stockholm's home pubs offer everything from reinterpreted classics to the city's oldest menu.", "title_original": "”Restaurangen är en av stadens vackraste”", "summary_original": "Doppsko, vårkråka och grosshandlarmiddag – Stockholms husmanskrogar bjuder på allt från nytolkade klassiker till stans äldsta meny.", "link": "https://www.svd.se/a/ArJeBq/har-finns-stockholms-basta-husmanskost", "date_display": "2026-08-20", "date_iso": "2026-08-20T22:15:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat &amp; dryck"]}, {"id": 113, "title": "The ex-lawyer wanted to lower Trump: \"We forgave\"", "summary": "Donald Trump's ex-lawyer Michael Cohen did his best to bring Trump down. But the one who got prison was Cohen himself. Now the two seem to be on the verge of reconciling – so much so that the president appears on Cohen's radio show.", "title_original": "Ex-juristen ville sänka Trump: ”Vi förlät”", "summary_original": "Donald Trumps ex-advokat Michael Cohen gjorde sitt bästa för att sänka Trump. Men den som fick fängelse var Cohen själv. Nu tycks de två vara på väg att försonas – så pass att presidenten medverkar i Cohens radioshow.", "link": "https://www.svd.se/a/16yqOX/ex-juristen-ville-sanka-trump-vi-forlat", "date_display": "2026-08-20", "date_iso": "2026-08-20T21:12:52+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 114, "title": "Ceuta clears the beach of migrants", "summary": "Spanish security forces have \"cleared\" a beach in Ceuta where thousands of migrants have camped, reports El País.", "title_original": "Ceuta rensar stranden på migranter", "summary_original": "Spanska säkerhetsstyrkor har ”röjt” en strand i Ceuta där tusentals migranter slagit läger, rapporterar El País.", "link": "https://www.svd.se/a/6qyPpr/ceuta-rensar-stranden-pa-migranter-omplaceras", "date_display": "2026-08-20", "date_iso": "2026-08-20T20:58:08+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 115, "title": "Letter to the editor. Noted by DN's reader on August 20", "summary": "LETTER TO THE EDITOR. Dagens Nyheter's readers give their views on the situation in Sweden and the world as well as DN's content on Thursday, August 20.", "title_original": "Insändare. Noterat av DN:s läsare den 20 augusti", "summary_original": "INSÄNDARE. Dagens Nyheters läsare ger sin syn på läget i Sverige och världen samt DN:s innehåll torsdagen den 20 augusti.", "link": "https://www.dn.se/insandare/noterat-av-dns-lasare-den-20-augusti-3/", "date_display": "2026-08-20", "date_iso": "2026-08-20T20:09:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 116, "title": "Learned from the threats against the representatives: \"I don't read comments\"", "summary": "Annie Lööf announced her resignation from politics in September 2022. In connection with the announcement, she stated that the hatred and threats she had received over the years had strongly contributed to the decision - and that the line was crossed when she found out that she too was one of Almedal's murderer Theodor Engström's intended targets. Anna-Karin Hatt only managed to be party leader of C for about eight months before the hatred and threats took their toll, and she decided to resign. Hatt then spoke, among other things, about a social climate that has hardened and become increasingly polarized. \"She owns her experiences and experiences, and I have all the respect for her decision. But I also understand the reality she describes. Because I know how it feels,\" wrote Annie Lööf after Hatt's statement. Invited the followers to a discussion Elisabeth Thand Ringqvist seems to have learned from her representatives. - I have chosen not to read comments on social media. I thought for a long time that I could hold on to Linkedin, which has been my professional way of talking to others about ideas and reasoning. But even there it has become very political, she says. At one point this summer, however, she dared to invite her followers to a discussion. - I asked where the boundary between hard bread and crispbread was in Sweden. In northern Sweden, you often see hard bread or bread. Then my colleagues said: \"You can easily go in here and talk to everyone\". It was harmless and the bots didn't find it there, so it was completely without strange posts, she says. \"It eats in\" How did you react to your representatives choosing to resign because of these reasons?  - It was something I thought about a lot when I was elected and thought about how to vaccinate myself against it, she says and adds: - Then it was, this not reading comments, because it still takes a lot of energy even if they are irrelevant people. You think that \"I should only react to criticism from those I trust. You can do this, so I will take it to heart\". But otherwise so-called", "title_original": "Lärt sig av hoten mot företrädarna: ”Jag läser inte kommentarer”", "summary_original": "Annie Lööf meddelade sitt avsked från politiken i september 2022. I samband med beskedet angav hon att hatet och hoten hon genom åren fått motta, varit starkt bidragande till beslutet – och att gränsen passerades när hon fick reda på att även hon var en av Almedalsmördaren Theodor Engströms tilltänkta måltavlor. Anna-Karin Hatt hann bara vara partiledare för C i omkring åtta månader innan hatet och hoten tog ut sin rätt, och hon beslutade att avgå. Hatt talade då bland annat om ett samhällsklimat som hårdnat och blivit alltmer polariserat. ”Hon äger sina erfarenheter och upplevelser, och jag har all respekt för hennes beslut. Men jag förstår också den verklighet hon beskriver. För jag vet hur det känns”, skrev Annie Lööf efter Hatts besked. Bjöd in följarna till diskussion Elisabeth Thand Ringqvist verkar ha dragit lärdom av sina företrädare. – Jag har valt att inte läsa kommentarer på sociala medier. Jag trodde länge att jag kunde hålla i Linkedin, som har varit mitt professionella sätt att prata med andra om idéer och resonemang. Men även där har det blivit väldigt politiskt, säger hon. I somras vågade hon vid ett tillfälle dock bjuda in sina följare till diskussion. – Jag frågade var gränsen för hårdbröd och knäckebröd gick i Sverige. I norra Sverige ser man ofta hårdbröd eller spisbröd. Då sa mina kollegor: ”Här kan du lätt gå in och prata med alla”. Det var harmlöst och bottarna hittade inte dit, så det var helt utan konstiga inlägg, berättar hon. ”Det äter sig in” Hur reagerade du på att dina företrädare valde att avgå på grund av de här anledningarna?  – Det var nåt jag tänkte jättemycket på när jag blev vald och funderade på hur jag skulle göra för att vaccinera mig mot det, säger hon och tillägger: – Då var det, det här att inte läsa kommentarer, för det tar ju ändå jättemycket energi även om det är irrelevanta personer. Man tänker att ”jag ska ju bara reagera på kritik från dem som jag litar på. Du kan ju det här, så då tar jag till mig det”. Men annars ska man inte göra det. Men det äter sig nog in, resonerar Elisabeth Thand Ringqvist.", "link": "https://www.tv4.se/artikel/ezgCMPMPbbxYxzva7CH3C/har-laert-sig-av-hoten-mot-foeretraedarna-laeser-inte-kommentarer", "date_display": "2026-08-20", "date_iso": "2026-08-20T19:59:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/valet-2026", "/inrikes", "/politik", "/elisabeth-thand-ringqvist", "/valutfragningen", "/valet-2022/centerpartiet"]}, {"id": 117, "title": "Åkesson on the crisis in L: Not our responsibility to save", "summary": "The Sweden Democrats' party leader Jimmie Åkesson continues to drum up the election momentum. When the bus tour through country and kingdom went to Sörmland and Västmanland, the focus was on cheering up party friends in the polling booths. Above all, selfies should be taken.  - You should count them!, says Jimmie Åkesson.\n\nAccording to TV4 Novus' latest survey, the opposition parties lead by seven percentage points. A non-negligible lead with less than a month left until election day. Not going to offer upvotes - For me it's fifty-fifty. Many people still haven't decided how to vote. Many decide even in the last week, so we have to put in an extra gear, says Jimmie Åkesson.\n\nThe Liberals insist that the party's survival is a prerequisite for Ulf Kristersson to be able to form a new government. But even though the Liberals are on the verge of leaving the Riksdag, Jimmie Åkesson does not intend to offer any support votes.\n\n- The Liberals' negotiating position may not be the one that Sweden Democratic voters want to be the strong one. It's actually our opposite pole in this collaboration, so I don't urge anyone to vote for them in any way. You should vote for the Sweden Democrats, he says. \"No bourgeois party\"  \nThe responsibility for saving the Liberals lies rather in the hands of Ulf Kristersson and Ebba Busch, believes Jimmie Åkesson.\n\n- If I'm being honest, I think it's more of a bourgeois affair. The bourgeoisie usually deals with that by voting for each other. We are not a bourgeois party.\n\nThe tour day ended in Västerås.\n\nThe party leader gave a speech after the dance band \"Åkezzonz\" played on stage. The show was ended by Jimmie Åkesson with a silent appeal to the voters.\n\n- Make sure that all friends of Sweden go out of their houses on election day and vote for the Sweden Democrats.", "title_original": "Åkesson om krisen i L: Inte vårt ansvar att rädda", "summary_original": "Sverigedemokraternas partiledare Jimmie Åkesson fortsätter att trumma på i valspurten. När bussturnén genom land och rike gick till Sörmland och Västmanland låg fokus på att peppa partivänner i valstugorna. Framför allt ska det tas selfies.  – Man skulle räkna dem!, säger Jimmie Åkesson.\n\nEnligt TV4 Novus senaste mätning leder oppositionspartierna med sju procentenheter. Ett inte försumbart försprång med mindre än en månad kvar till valdagen. Tänker inte bjuda på stödröster – För mig är det femtio-femtio. Många människor har fortfarande inte bestämt sig för hur man ska rösta. Många bestämmer sig till och med sista veckan så vi får lägga i en extra växel, säger Jimmie Åkesson.\n\nLiberalerna framhärdar att partiets överlevnad är en förutsättning för att Ulf Kristersson ska kunna bilda en ny regering. Men trots att Liberalerna är på vippen att åka ur riksdagen, tänker Jimmie Åkesson inte bjuda på några stödröster.\n\n– Liberalernas förhandlingsposition kanske inte är den som sverigedemokratiska väljare vill ska vara den starka. Det är ju egentligen vår motpol i det här samarbetet, så jag uppmanar ingen att på något sätt stödrösta på dem. Man bör stödrösta på Sverigedemokraterna, säger han. ”Inget borgerligt part”  \nAnsvaret för att rädda Liberalerna ligger snarare i händerna på Ulf Kristersson och Ebba Busch, anser Jimmie Åkesson.\n\n– Ska jag vara ärlig så tycker jag att det är mer en borgerlig angelägenhet. Borgerligheten brukar hantera det där med att man stödröstar på varandra. Vi är inget borgerligt parti.\n\nTurnédagen avslutades i Västerås.\n\nPartiledaren höll tal efter att dansbandet \"Åkezzonz\" spelat på scenen. Showen avslutades av Jimmie Åkesson med en stilla vädjan till väljarna.\n\n– Se till att alla sverigevänner går man ur huse på valdagen och röstar på Sverigedemokraterna.", "link": "https://www.tv4.se/artikel/5Y28sTOaQQuucxIn7MGC40/akesson-om-krisen-i-l-inte-vart-ansvar-att-raedda", "date_display": "2026-08-20", "date_iso": "2026-08-20T19:39:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/valet-2026", "/inrikes", "/politik", "/personer/jimmie-akesson-sd", "/valet-2022/sverigedemokraterna", "/svensk-politik", "/liberalernas-kris"]}, {"id": 118, "title": "Jennifer Hegseth has been given a \"unique\" position", "summary": "Jennifer Hegseth is unlike any former Pentagon lady. She attends sensitive meetings, recruits personnel and is Defense Secretary Pete Hegseth's closest adviser. - It is quite unique, says USA connoisseur Jan Hallenberg.", "title_original": "Jennifer Hegseth har fått ”unik” position", "summary_original": "Jennifer Hegseth liknar ingen tidigare Pentagonfru. Hon deltar i känsliga möten, rekryterar personal och är försvarsministern Pete Hegseths närmaste rådgivare. – Det är ganska unikt, säger USA-kännaren Jan Hallenberg.", "link": "https://www.dn.se/varlden/jennifer-hegseth-har-fatt-en-unik-position-i-vita-huset/", "date_display": "2026-08-20", "date_iso": "2026-08-20T19:33:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "Only the world record was missing in Lausanne", "summary": "It was a Diamond League duel at high altitudes. Emmanouil Karalis managed 6.16, but as so many times before, the Greek had his superior in Armand Duplantis. Mondo tried twice for the world record of 6.32, but had to settle for 6.21.", "title_original": "Bara världsrekordet saknades i Lausanne", "summary_original": "Det var en Diamond Legue-duell på höga höjder. Emmanouil Karalis klarade 6,16, men som så många gånger förr hade greken sin överman i Armand Duplantis. Mondo prövade två gånger på världsrekordet 6,32, men fick nöja sig med 6,21.", "link": "https://www.dn.se/sport/bara-varldsrekordet-saknades-i-lausanne/", "date_display": "2026-08-20", "date_iso": "2026-08-20T19:05:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 120, "title": "August 20: Don't miss today's news", "summary": "The court expert's theory about Harry and Meghan's move, the health care giant is growing and firefighters are threatening to strike – here are the news you can't miss from the day.", "title_original": "20 augusti: Missa inte dagens nyheter", "summary_original": "Hovexpertens teori om Harry och Meghans flytt, vårdjätte växer och brandmän hotar med strejk – här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/20-augusti-missa-inte-dagens-nyheter/", "date_display": "2026-08-20", "date_iso": "2026-08-20T18:59:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 121, "title": "Here, parents dare to report – their own children", "summary": "The wave of violence in Järva started in the summer of 2015, where the criminal gangs Shottaz and the Death Squad contributed to great fear in the area. Järva, which is located in northwest Stockholm with districts such as Rinkeby, Tensta, Husby, Akalla, Kista and Hjulsta, was then characterized by a lot of violence. - When the wave of violence started, no one spoke, we couldn't even prosecute, we couldn't do anything, but when the police dared to work in a different way, there was a difference, says Rissa Seidou. Parents have become more involved over the years and according to Rissa Seidou, parents dare to report their children regardless of whether it is about crime or new recruitment. - We have worked in a different way, through dialogue meetings that have created trust, which leads to more parents daring to register their children, which I have not seen before if you compare it to 2015 when it all started, she says. The father's turn in grief Libaan Warsame lost his 19-year-old son in 2020 in the conflict. His son was the victim of a botched shooting and according to the police, the son was neither a target nor part of any gang. Libaan then started the organization \"Stop the shooting\" with other parents who have lost their children in violent crimes. The aim on Libaan's part was to be able to process his grief with other parents. And the association's purpose is to counter violence and crime with a particular focus on preventing shootings and crime in public space, but also to counter the recruitment of young people into criminal networks. - Back then, trust was at rock bottom for authorities, but in our organization that cooperates with the police and social services, trust has been built up and today we see a big change, says Libaan. According to Libaan, the confidence and courage of parents in Järva has increased, where the parents turn directly to their organization or other associations in order to know how to report if they notice that their own children are about to be in danger. The increased trust has affected Järva After the organization \"Stop the shooting\" came to Järva and the police increased their", "title_original": "Här vågar föräldrar anmäla – sina egna barn", "summary_original": "Våldsvågen i Järva startade sommaren 2015 där de kriminella gängen Shottaz och Dödspatrullen bidrog med stor rädsla i området. Järva som ligger i nordvästra Stockholm med stadsdelar som Rinkeby, Tensta, Husby, Akalla, Kista och Hjulsta var då präglad av mycket våld. – När våldsvågen startade var det ingen som pratade, vi kunde inte ens lagföra, vi kunde inte göra något, men när polisen vågade arbeta på ett annat sätt blev det skillnad, menar Rissa Seidou. Föräldrar har blivit mer engagerade med åren och enligt Rissa Seidou vågar föräldrar anmäla sina barn oavsett om det handlar om brott och nyrekrytering. – Vi har ju jobbat på ett annat sätt, genom dialogmöten som skapat förtroende vilket leder till att fler föräldrar vågar anmäla sina barn vilket jag inte sett tidigare om man jämför med 2015 när allt började, säger hon. Pappans vändning i sorgen Libaan Warsame förlorade sin 19-åriga son 2020 i konflikten. Hans son blev offer för en felskjutning och enligt polisen var sonen varken måltavla eller med i något gäng. Libaan startade då organisationen \"Stoppa skjutningen\" med andra föräldrar som förlorat sina barn i våldsbrott. Syftet från Libaans sida var att kunna bearbeta sin sorg med andra föräldrar. Och föreningens syfte är att motverka våld och kriminalitet med särskilt fokus på att förebygga skjutningar och kriminalitet i det offentliga rummet men även att motverka rekryteringen av unga till kriminella nätverk. – Då var ju tilliten i botten för myndigheter, men i vår organisation som samarbetar med polis och socialtjänst har tilliten byggts upp och i dag ser vi stor förändring, säger Libaan. Enligt Libaan har förtroendet och modet ökat hos föräldrar i Järva där föräldrarna vänder sig direkt till deras organisation eller andra föreningar för att på den vägen veta hur de ska anmäla om de märker att deras egna barn är på väg att hamna i fara. Den ökade tilliten har påverkat Järva Efter att organisationen ”Stoppa skjutningen” kommit till Järva och att polisen ökat sin närvaro har också Järva tagit sig från ett otryggt område till ett mer tryggt område. – Tryggheten har ju ökat, tilliten mellan myndigheter och boende har ökat och man ser att det är tryggt i Järva nu de senaste åren, säger Libaan. Förutom myndigheter och organisationer hjälper föräldrar varandra ifall de ser att barn i området är på väg in i kriminalitet. Två mammor, som valt att vara anonyma, berättar om hur föräldrasamverkan gör Järva mer tryggt. – Vi föräldrar är ju inte kriminella men vi har fått information om hur man kan se om barn förändrats eller om de är på väg att rekryteras. Den informationen hade föräldrar inte tidigare som de fått nu. Samhällsdebatten och avsaknad av föräldrars ansvar Rissa Seidou ser den hela omställningen som mycket positiv eftersom i samhällsdebatten har frågan ofta ställts ”var är föräldrarna” och hon menar att den frågan blir besvarad när föräldrar i utsatta områden faktiskt gör något genom att anmäla sina barn eller bara höra av sig till myndigheter. Det hela handlar om dialogen mellan boende och myndigheter, som Rissa Seidou pekat mot som är en bidragande faktor att Järva är ett tryggare område i dag. Men om föräldrar ser att deras barn är på väg in i kriminalitet eller ändrat sitt beteende ska det anmälas enligt henne. – Jag tycker man ska vända sig till polisen, vill du rädda ditt barn eller inte. Jag brukar säga till föräldrar här i Järva: Om ni inte hjälper till kan vi inte bevaka varenda port. Om ni inte hjälper till kommer ni begrava era barn. Så välj, livet eller döden, avslutar Rissa Seidou.", "link": "https://www.tv4.se/artikel/6592NzJ64BoWXSE5tb2keu/haer-vagar-foeraeldrar-anmaela-sina-egna-barn", "date_display": "2026-08-20", "date_iso": "2026-08-20T18:29:09+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/jarva", "/valdsvagen"]}, {"id": 122, "title": "Mjällby scored an own goal: \"So pissed off\"", "summary": "Mjällby was on its way to a 0–0 draw at home against Red Bull Salzburg in the Europa League playoff. Then the Austrians decided in extra time through an obligatory own goal from Tom Pettersson. - I am so pissed off, says Pettersson.", "title_original": "Självmål fällde Mjällby: ”Så förbannad”", "summary_original": "Mjällby var på väg mot 0–0 hemma mot Red Bull Salzburg i Europa League-playoff. Då avgjorde österrikarna på tilläggstid genom ett snöpligt självmål från Tom Pettersson. – Jag är så förbannad, säger Pettersson.", "link": "https://www.dn.se/sport/sjalvmal-fallde-mjallby-sa-forbannad/", "date_display": "2026-08-20", "date_iso": "2026-08-20T18:21:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 123, "title": "DN Debate. \"My hands are my own - until death\"", "summary": "DN DEBATE. A new SVT documentary about hand transplants raises ethical questions. But also philosophical ones. I look at my hands, the most personal thing I own. I don't let anyone else use them. Medicine here walks on the edge of how hard you can challenge the public without losing its trust and willingness to donate, writes philosopher Torbjörn Tännsjö.", "title_original": "DN Debatt. ”Mina händer är mina egna – ända in i döden”", "summary_original": "DN DEBATT. En ny SVT-dokumentär om handtransplantationer väcker etiska frågor. Men också filosofiska sådana. Jag betraktar mina händer, det mest personliga jag äger. Jag unnar ingen annan att bruka dem. Medicinen promenerar här på gränsen till hur hårt man kan utmana allmänheten utan att förlora dess förtroende och vilja att donera, skriver filosofen Torbjörn Tännsjö.", "link": "https://www.dn.se/debatt/mina-hander-ar-mina-egna-anda-in-i-doden/", "date_display": "2026-08-20", "date_iso": "2026-08-20T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "New cultural center opens in Sundbyberg: \"I was touched when I got the keys\"", "summary": "On Saturday 22 August, the city of Sundbyberg will inaugurate its new cultural center in Ursvik. For manager Najma Mohamed and her employees, only the last fix remains before opening the doors.", "title_original": "Nytt kulturhus öppnar i Sundbyberg: ”Blev rörd när jag fick nycklarna”", "summary_original": "Lördagen den 22 augusti inviger Sundbybergs stad sitt nya kulturhus i Ursvik. För chefen Najma Mohamed och hennes medarbetare är det bara sista fixet kvar innan dörrarna slås upp.", "link": "https://www.dn.se/kultur/nytt-kulturhus-oppnar-i-sundbyberg-blev-rord-nar-jag-fick-nycklarna/", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:44:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Further resignation demands against Infantino: \"Treason\"", "summary": "A total of 42 different supporter organizations – including Camp Sweden and the Swedish Football Supporter Union – have backed a global petition demanding Infantino's resignation from the presidency of the International Football Association (FIFA). \"Infantino's plan was put together in secret. It was negotiated behind closed doors, hidden from Fifa's own members and from the millions of people whose passion makes football what it is. It was a betrayal,\" the petition says. The petition also calls for a total reform of Fifa with demands for full transparency around all major decisions and increased influence for the supporters. Fifa has not commented on the nomination. Sweden sees several shortcomings in the leadership Next year, Infantino will stand for re-election, but will not receive any support from Sweden. Earlier this summer, the chairman of the Swedish Football Association, Simon Åström, announced that they have no confidence in the president.  - It is based on our assessment of the development within Fifa over a longer period of time. We see recurring shortcomings in terms of control, transparency and governance, said Åström. Together with the European UEFA, they must work to produce a counter-candidate to Infantino for the next election. Received severe criticism internally But criticism of Infantino and his proposals has also come from within Fifa.  His former adviser, Carlos Cordeiro, quit in July in protest at plans to sell stakes in the World Cup to private investors. Fifa's chief operating officer, Kevin Lamour, took the stand and criticized Infantino in a statement, in which he said Infantino had misled Fifa staff. He too has had to leave. According to Sky Sports and The Times, Lamour was fired for publicly criticizing Infantino. The Athletic further reports that Fifa's Swedish general secretary, Mattias Grafström, was the one who informed the staff at Fifa about Lamour's resignation in an email and thanked him for his efforts for the organization.", "title_original": "Ytterligare avgångskrav mot Infantino: ”Förräderi”", "summary_original": "Totalt 42 olika supporterorganisationer – däribland Camp Sweden och Svenska Fotbollssupporterunionen – har ställt sig bakom en global namninsamling som kräver Infantinos avgång från ordförandeposten i Internationella fotbollsförbundet (Fifa). ”Infantinos plan snickrades ihop i hemlighet. Den förhandlades bakom stängda dörrar, dold för Fifas egna medlemmar och för de miljontals människor vars passion gör fotbollen till vad den är. Det var ett förräderi”, står det i namninsamlingen. Namninsamlingen kräver också en total reformering av Fifa med krav på full transparens kring alla större beslut och ökat inflytande för supportrarna. Fifa har inte kommenterat namninsamlingen. Sverige ser flera brister i ledarskapet Nästa år ställer Infantino upp för omval, men kommer då inte att få något stöd från Sverige. Tidigare i sommar meddelade Svenska fotbollförbundets ordförande Simon Åström att man inte har något förtroende för presidenten.  – Det bygger på vår bedömning av utvecklingen inom Fifa över en längre tid. Vi ser återkommande brister när det gäller styrning, transparens och governance, sade Åström. Tillsammans med det europeiska UEFA ska man arbeta för att ta fram en motkandidat till Infantino till nästa val. Fått hård kritik internt Men kritiken mot Infantino och hans förslag har även kommit inifrån Fifa.  Hans tidigare rådgivare, Carlos Cordeiro, slutade i protest i juli mot planerna att sälja andelar av VM till privata investerare. Fifas operativa chef, Kevin Lamour, tog vid och kritiserade Infantino i ett uttalande, i vilket han menade att Infantino hade vilselett Fifas personal. Även han har fått lämna. Enligt Sky Sports och The Times sparkades Lamour för att ha uttalat sig kritiskt mot Infantino offentligt. The Athletic rapporterar vidare att Fifas svenske generalsekreterare, Mattias Grafström, var den som informerade personalen på Fifa kring Lamours avsked i ett mejl och tackade honom för hans insatser för organisationen.", "link": "https://www.tv4.se/artikel/1j4T6nIt6er6mJNnLaO6lC/ytterligare-avgangskrav-mot-infantino-foerraederi", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:43:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/fotboll", "/fifa", "/gianni-infantino"]}, {"id": 126, "title": "Sweden strictest in the EU towards Brexit Britons - the government is open to more people being allowed to stay", "summary": "Sweden is the strictest in the EU when it comes to granting British citizens residence permits. Jane Golding, chairman of British in Europe, questions whether Sweden lives up to the spirit of the Brexit agreement between the EU and Great Britain. Now the government is opening to soften the Swedish stance.", "title_original": "Sverige strängast i EU mot brexitbritter – regeringen öppnar för att fler kan få stanna", "summary_original": "Sverige är striktast i EU när det gäller att ge brittiska medborgare uppehållstillstånd. Jane Golding, ordförande för British in Europe, ifrågasätter om Sverige lever upp till andemeningen i brexitavtalet mellan EU och Storbritannien. Nu öppnar regeringen för att mjuka upp den svenska hållningen.", "link": "https://www.dn.se/sverige/sverige-strangast-i-eu-mot-brexitbritter-regeringen-oppnar-for-att-fler-kan-fa-stanna/", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:33:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Animal disease affects humans - several cases in Sweden", "summary": "A bacterium from the animal world is spreading between humans for the first time. Several cases have been discovered in both Sweden and the rest of Europe.", "title_original": "Djursmitta drabbar människor – flera fall i Sverige", "summary_original": "En bakterie från djurvärlden sprids för första gången mellan människor. Flera fall har upptäckts i både Sverige och övriga Europa.", "link": "https://www.dn.se/sverige/djursmitta-drabbar-manniskor-flera-fall-i-sverige/", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:28:46+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 128, "title": "Secret operation has opened the Strait of Hormuz to tankers", "summary": "Despite raging wars, millions of barrels of oil find their way through the Strait of Hormuz every night. It is the result of a covert – and resource-intensive – US military operation, reports Axios and the New York Times.", "title_original": "Hemlig operation har öppnat Hormuzsundet för tankfartyg", "summary_original": "Trots brinnande krig finner miljontals fat olja varje natt en väg genom Hormuzsundet. Det är resultatet av en hemlig – och resurskrävande – amerikansk militäroperation, rapporterar Axios och New York Times.", "link": "https://www.dn.se/varlden/hemlig-operation-har-oppnat-hormuzsundet-for-tankfartyg/", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:18:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Feeling cheated after documentary: \"They have to take responsibility\"", "summary": "For ten years, Carola Jansson lived in a relationship that gradually became increasingly controlling and violent. Her former partner controlled her finances, everyday life, contacts and monitored her at home. Ex-partner is convicted of pimping, rape, gross violation of women's privacy and a man has been convicted of having bought sex from Carola, arranged by her ex-partner.  After the relationship, Carola told about the years in the book He owned me, which she wrote together with the journalist and author Leone Milton. When the book was published, she was contacted by a production company that wanted to make a documentary about her life. Felt pressured to sign Carola says that early on the production company was very keen to get her on board. At one of the first meetings, she was to sign an agreement which, according to her, was only about the company being able to pitch the idea further. She began to read the agreement, but felt pressured to sign. - This is just so we can pitch it and nothing else, Carola says she was told. Carola Jansson states that the situation became stressful and that she signed. Afterwards, she felt doubtful and when the production company told her that they had sold the documentary, she was unsure if she wanted to participate. Claims that she was promised money Carola claims that the production company promised her over the phone that she would be paid, roughly the same amount as she received for the book. - We will weigh it up. You will be satisfied. You will be great. Of course you will get paid. Just trust us. It will be great. Now we drive. Are you in? Carola says she was told and states that a friend witnessed the conversation. But the promised compensation, according to Carola, was never written into the agreement. - I should have made sure that I had this money before we started filming and that there was a written agreement on it, because it doesn't, she says. She has received compensation for lost earnings. According to Carola, she would also receive SEK 10,000 for archives", "title_original": "Känner sig lurad efter dokumentär: ”De måste ta ansvar”", "summary_original": "I tio år levde Carola Jansson i en relation som gradvis blev allt mer kontrollerande och våldsam. Hennes dåvarande sambo kontrollerade hennes ekonomi, vardag, kontakter och övervakade henne i hemmet. Ex-sambon är dömd för koppleribrott, våldtäkter, grov kvinnofridskränkning och en man har dömts för att ha köpt sex av Carola, arrangerat av hennes ex-sambo.  Efter relationen berättade Carola om åren i boken Han ägde mig, som hon skrev tillsammans med journalisten och författaren Leone Milton. När boken hade kommit ut blev hon kontaktad av ett produktionsbolag som ville göra en dokumentär om hennes liv. Kände sig pressad att skriva under Carola säger att produktionsbolaget tidigt var mycket angeläget om att få med henne. Vid ett av de första mötena skulle hon skriva under ett avtal som enligt henne bara handlade om att bolaget skulle kunna pitcha idén vidare. Hon började läsa avtalet, men upplevde att hon blev stressad att skriva under. – Det här är bara för att vi ska få pitcha det och ingenting annat, säger Carola att hon fick höra. Carola Jansson uppger att situationen blev stressig och att hon skrev under. Efteråt kände hon sig tveksam och när produktionsbolaget berättade att de sålt dokumentären var hon osäker på om hon ville medverka. Hävdar att hon blev lovad pengar Carola hävdar att produktionsbolaget över telefon lovat henne att hon skulle få betalt, ungefär lika mycket som hon fått för boken. – Vi kommer väga upp det. Du kommer vara nöjd. Du kommer bli superbra. Såklart du ska få betalt. Bara lita på oss. Det kommer bli superbra. Nu kör vi. Är du med? säger Carola att hon fick höra och uppger att en vän bevittnade samtalet. Men den utlovade ersättningen skrevs, enligt Carola, aldrig in i avtalet. – Jag borde ha sett till att jag hade de här pengarna innan vi började filma och att det fanns ett skriftligt avtal på det, för det gör det inte, säger hon. Hon har fått ersättning för förlorad arbetsinkomst. Enligt Carola skulle hon också få 10 000 kronor för arkivmaterial, pengar som hon säger att hon inte har fått. I efterhand känner hon sig lurad och säger att situationen påminner om hur hon tidigare blev pressad och manipulerad av sin förövare. ”Det var över hundra personer hemma hos oss” Carola är också kritisk till hur delar av hennes berättelse framställs i dokumentären. I filmen säger hon: – Det var över hundra personer hemma hos oss. Själv uppger hon att hon syftade på de hundratals kvinnor ex-sambon träffat och haft sex med under deras relation, men att hon av produktionen ombads säga ”personer” i stället för ”kvinnor”. I den färdiga dokumentären upplever hon att uttalandet kan få det att framstå som att hon har sålts till över hundra män. Samtidigt vet hon inte hur många män som utnyttjade henne,  vid tillfällena hade hon ögonbindel och kunde därför inte se eller identifiera männen. Hon tycker också att ex-sambon får stort utrymme i dokumentären och att han framställs mildare än hon anser att hans handlingar mot henne motiverar. Nu vill hon framför allt ha upprättelse och att produktionsbolaget tar ansvar för vad hon säger att hon blev lovad. Hon anser också att de som gör dokumentärer om våldsutsatta kvinnor måste ta ansvar för hur de behandlar personer som medverkar. – De måste ta ansvar för vad de lovar, säger Carola. Produktionsbolaget: ”Känner inte igen oss” HBO har fått frågor om Carolas uppgifter om ersättningen, avtalet och hur hennes uttalanden har hanterats. – Vi är mycket tacksamma att Carola velat dela sin berättelse, det är otroligt starkt och modigt. Den bild vi har är att produktionsbolaget följt sedvanliga journalistiska riktlinjer och praxis för den här typen av dokumentärer, säger Axel Eriksson, VP Content and Programming på Warner Bros Discovery. John Mork, producent på produktionsbolaget A Rabbit Hole, delar inte Carolas bild av hur allting gått till. ”Vi känner inte igen oss i det som kommuniceras från Carola. Som brukligt när man gör dokumentära produktioner och enligt avtal ersätts Carola för förlorad arbetsinkomst och arkivmaterial”, skriver Mork till TV4 Nyheterna.", "link": "https://www.tv4.se/artikel/2THwy7iz5aqUozy1kzwY6M/kaenner-sig-lurad-efter-dokumentaeren-de-maste-ta-ansvar", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:02:10+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/hbo", "/dokumentarfilm", "/sexualbrott", "/tv"]}, {"id": 130, "title": "Letter to the editor. Abolish the degrading F grade", "summary": "LETTER TO THE EDITOR. I'm not against grades, but they need to be fair and show opportunities, not close doors. Remove the degrading F grade as soon as possible, writes Carina Nordström, mother of a student who failed.", "title_original": "Insändare. Avskaffa degraderande betyget F", "summary_original": "INSÄNDARE. Jag är inte emot betyg, men de måste vara rättvisa och visa på möjligheter, inte stänga dörrar. Ta snarast bort det degraderande F-betyget, skriver Carina Nordström, mamma till en elev som fått underkänt.", "link": "https://www.dn.se/insandare/avskaffa-degraderande-betyget-f/", "date_display": "2026-08-20", "date_iso": "2026-08-20T17:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Man acquitted of child rape - previously convicted of similar offences", "summary": "The man in his 50s has previously been convicted of aggravated rape against his stepdaughter. Now he is fully acquitted in a new similar case, reports the news agency Siren. The court believes that his sperm may have been transferred in the laundry.", "title_original": "Man frikänns för våldtäkt mot barn – tidigare dömd för liknande brott", "summary_original": "Mannen i 50-årsåldern har tidigare dömts för grov våldtäkt mot sin styvdotter. Nu frias han helt i ett nytt liknande ärende, rapporterar nyhetsbyrån Siren. Rätten menar att hans sperma kan ha överförts i tvätten.", "link": "https://www.dn.se/sverige/man-frikanns-for-valdtakt-mot-barn-tidigare-domd-for-liknande-brott/", "date_display": "2026-08-20", "date_iso": "2026-08-20T16:52:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "They are suspected of being behind thousands of ads for assassination missions", "summary": "A man in his 20s, a native of Halmstad, has been arrested on suspicion of three cases of stamping on different occasions in Örebro and Linköping during the fall of 2025. The man is suspected of trying to recruit young people to commit serious violent crimes across the country. Something that Ekot was the first to report on. Thousands of advertisements The arrested man is said to have acted on behalf of various criminal gangs and is suspected of having been involved in thousands of advertisements of serious criminal missions on encrypted chats.  It is about serious violent crimes, above all assassination missions, but also drug sales. - There is a very large amount of advertisements. Thousands, says prosecutor Mats Ihlbom to TV4 Nyheterna. - It is about minors. We are currently investigating three. But many more have responded to the ads, he continues. \"Acted as an entrepreneur\" According to the prosecutor, the evidence is good. - As I see it, the evidence is good and we will likely prosecute him. The man should not have acted for any specific gang. - He acts as we see it as an independent entrepreneur, says Mats Ihlbom. The man has not been convicted of a crime apart from a minor traffic offence.  He denies any wrongdoing.", "title_original": "Man misstänks ligga bakom tusentals annonser för morduppdrag", "summary_original": "En man i 20-årsåldern, hemmahörande i Halmstad, har häktats misstänkt för tre fall av stämpling vid olika tillfällen i Örebro och Linköping under hösten 2025. Mannen misstänks ha försökt värva ungdomar till att begå grova våldsbrott över hela landet. Något som Ekot var först med att rapportera om. Tusentals annonser Den häktade mannen ska ha agerat på uppdrag av olika kriminella gäng och misstänks ha varit inblandad i tusentals annonser om allvarliga brottsuppdrag på krypterade chattar.  Det handlar om grova våldsbrott, framför allt morduppdrag, men även narkotikaförsäljning. – Det är en väldigt stor mängd annonser. Tusentals, säger åklagaren Mats Ihlbom till TV4 Nyheterna. – Det handlar om minderåriga. Vi utreder just nu tre stycken. Men många fler har svarat på annonserna, fortsätter han. ”Agerat som entreprenör” Enligt åklagaren är bevisningen god. – Bevisningen är som jag ser det bra och vi kommer sannolikt att åtala honom. Mannen ska inte ha agerat åt något specifikt gäng. – Han agerar så som vi ser det som en oberoende entreprenör, säger Mats Ihlbom. Mannen har inte dömts för brott förutom en mindre trafikförseelse.  Han nekar till brott.", "link": "https://www.tv4.se/artikel/7GgyS9kKGrgcxdqonknrg1/man-misstaenks-ligga-bakom-tusentals-annonser-foer-morduppdrag", "date_display": "2026-08-20", "date_iso": "2026-08-20T16:50:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/mordforsok", "/mord", "/kriminalitet"]}, {"id": 133, "title": "From fixed star to accused of cheating – the question marks after Jason Arday's death", "summary": "The death of star scientist Jason Arday, accused of plagiarism, has sparked a furious debate about how black scientists are treated. What mark will his case leave on the academic world?", "title_original": "Från fixstjärna till fuskanklagad – frågetecknen efter Jason Ardays död", "summary_original": "Den plagiatanklagade stjärnforskaren Jason Ardays död har väckt en rasande debatt om hur svarta forskare behandlas. Vilket avtryck kommer hans fall att sätta på den akademiska världen?", "link": "https://www.dn.se/varlden/fran-fixstjarna-till-fuskanklagad-fragetecknen-efter-jason-ardays-dod/", "date_display": "2026-08-20", "date_iso": "2026-08-20T16:49:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "New proposals will strengthen the universities' independence", "summary": "On Thursday, investigator Anna-Sara Lind presented several proposals to strengthen academic freedom. The investigation is a reaction to what Minister of Higher Education and Research Lotta Edholm (L) describes as a worrying development in the world.", "title_original": "Nya förslag ska stärka universitetens oberoende", "summary_original": "På torsdagen presenterade utredaren Anna-Sara Lind flera förslag för att stärka den akademiska friheten. Utredningen är en reaktion på vad högskole- och forskningsminister Lotta Edholm (L) beskriver som en oroande omvärldsutveckling.", "link": "https://www.dn.se/kultur/nya-forslag-ska-starka-universitetens-oberoende/", "date_display": "2026-08-20", "date_iso": "2026-08-20T16:47:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "USA: Iran's regime will collapse due to economic pressure", "summary": "US President Donald Trump threatens Iran with \"economic warfare\" and promises to punish any country that helps the country. Treasury Secretary Scott Bessent says the new US sanctions will cause the Iranian regime to \"collapse\".", "title_original": "USA: Irans regim ska kollapsa av ekonomisk press", "summary_original": "USA:s president Donald Trump hotar Iran med ”ekonomisk krigföring” och lovar att straffa alla länder som hjälper landet. Finansminister Scott Bessent säger att de nya amerikanska sanktionerna kommer att få den iranska regimen att ”kollapsa”.", "link": "https://www.dn.se/varlden/usa-irans-regim-ska-kollapsa-av-ekonomisk-press/", "date_display": "2026-08-20", "date_iso": "2026-08-20T16:17:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "The billionaire after the crime: \"I think she was a stupid, naive perpetrator\"", "summary": "On June 29, a bomb exploded outside Ukrainian billionaire Vadym Yermolaiev's luxury apartment in Monaco. Yermolaiev was seriously injured and the residents of the wealthy city-state were shocked. The perpetrator, who was initially described as a \"man with a black hat\", disappeared. Three days later, authorities identified the culprit as Anastasiia Berezovska – a 39-year-old Ukrainian woman with a large snake tattoo on her arm. Berezovska had no criminal past, no known connection to the billionaire, or any obvious motive. A week after authorities released her name, she was found dead, buried in a shallow grave, in a forest outside Kiev. The billionaire: \"Never had enemies\" Why someone tried to blow up the billionaire is currently unknown and the victim himself is groping for answers. CNN has interviewed Yermolaiev, just days after he was allowed to leave the hospital. - I have never had enemies. I am not a confrontational person. I have always tried to avoid sharp conflicts. I don't understand the reason, he tells the channel. Sources close to the Ukrainian murder investigation tell CNN they believe Berezovska, who died today, was likely a hired foot soldier, motivated by money. Otherwise, they do not want to speculate about who was behind the attack. The crime appears to have been meticulously planned. The 39-year-old, who appears to have been guarding the billionaire for months, managed to escape across several borders before authorities realized it was a woman they were looking for. Picked up by two men Once in Ukraine, the 39-year-old was picked up by a black BMW, something that was captured on surveillance images. It is the last sign of life after Anastasiia Berezovska.  In the car sat two men who the prosecutor suspects are her accomplices. They are said to have communicated with her before the crime, and to have made several cryptocurrency payments to her accounts. The police arrested the men and one of them admitted that he has murdered the 39-year-old, before showing where they could find the body. Later, however, he took back parts of his b", "title_original": "Miljardären efter dådet: ”Jag tror hon var en dum, naiv utförare”", "summary_original": "Den 29 juni exploderade en bomb utanför den ukrainske miljardären Vadym Yermolaievs lyxlägenhet i Monaco. Yermolaiev blev allvarligt skadad och invånarna i den rika stadsstaten chockade. Gärningspersonen, som initialt beskrevs som en ”man med svart hatt”, försvann. Tre dagar senare identifierade myndigheterna den skyldiga som Anastasiia Berezovska – en 39-årig ukrainsk kvinna med en stor ormtatuering på armen. Berezovska hade varken kriminellt förflutet, någon känd koppling till miljardären eller något uppenbart motiv. En vecka efter att myndigheterna gått ut med hennes namn hittades hon död, begravd i en grund grav, i en skog utanför Kiev. Miljardären: ”Har aldrig haft fiender” Varför någon försökt spränga miljardären är i nuläget okänt och offret själv famlar efter svar. CNN har intervjuat Yermolaiev, bara dagar efter att han har fått lämna sjukhuset. – Jag har aldrig haft fiender. Jag är inte en konfrontativ person. Jag har alltid försökt undvika skarpa konflikter. Jag förstår inte anledningen, säger han till kanalen. Källor nära den ukrainska mordutredningen uppger för CNN att de tror att den i dag döda Berezovska troligen var en anlitad fotsoldat, motiverad av pengar. I övrigt vill de inte spekulera kring vem som legat bakom attacken. Dådet verkar vara minutiöst planerat. 39-åringen, som tycks ha bevakat miljardären i månader, lyckades fly över flera landsgränser innan myndigheterna insåg att det var en kvinna de letade efter. Upplockad av två män Väl på plats i Ukraina blev 39-åringen upphämtad av en svart BMW, något som fastnade på övervakningsbilder. Det är sista livstecknet efter Anastasiia Berezovska.  I bilen satt två män som åklagaren misstänker är hennes medbrottslingar. De ska dels ha kommunicerat med henne innan innan dådet, dels ha gjort flera kryptovalutabetalningar till hennes konton. Polisen grep männen och den ena av dem erkände att han har mördat 39-åringen, innan han visade var de kunde hitta kroppen. Senare tog han dock tillbaka delar av sin berättelse och pekar nu istället ut den andre mannen som skytten.  Den ena av männen var anställd inom den ukrainska försvarsunderrättelsetjänsten (GUR). Den andra är en polis, som tidigare arbetat som frivillig officer för Ukrainas säkerhetstjänst. Han hävdar att han trodde att de arbetade på uppdrag av den ukrainska underrättelsetjänsten. Detta påstående förnekas dock av myndigheterna.  De båda männen sitter i dag häktade, misstänkta för att ha mördat kvinnan.  En av Ukrainas rikaste Yermolaiev var tidigare en av Ukrainas rikaste personer. Han sanktionerades av Kiev 2023 för att ha gjort affärer på det ryskockuperade Krim, en anklagelse han förnekar. Miljardären uppger för CNN att han är skeptisk till alla antydningar om att den ukrainska staten ska ha beordrat hans mord.  – Att identifiera vem som beordrade det, det är dagens huvudfråga, säger han. Han själv är säker på att Berezovska inte är komplottens huvudperson. – Jag tror att hon helt enkelt var en dum, naiv utförare som på något sätt fick höra att hon gjorde något viktigt, något fantastiskt. Yermolaiev tror att den ensamstående modern dödades så att hon inte skulle kunna vittna mot andra.", "link": "https://www.tv4.se/artikel/17lhe0ncF8ttTGLqPiuiNi/miljardaeren-efter-dadet-jag-tror-hon-var-en-dum-naiv-utfoerare", "date_display": "2026-08-20", "date_iso": "2026-08-20T14:37:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukraina", "/monaco"]}, {"id": 137, "title": "As a Jew in Sweden, I feel scared before the election", "summary": "The problem is not what is written in the party program, but what happens when people with anti-Semitic beliefs are given space in a party that can gain influence over government power, writes Daniel Eisenberg.", "title_original": "Som jude i Sverige känner jag mig rädd inför valet", "summary_original": "Problemet är inte vad som står i partiprogrammet, utan vad som händer när människor med antisemitiska föreställningar får utrymme i ett parti som kan få inflytande över regeringsmakten, skriver Daniel Eisenberg.", "link": "https://www.dagen.se/debatt/som-jude-i-sverige-kaenner-jag-mig-raedd-infoer-valet/10488770", "date_display": "2026-08-20", "date_iso": "2026-08-20T14:20:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Tougher requirements in the men's national team after the Olympic fiasco", "summary": "When the national ski team has a press conference in Torsby, there are no traces of the chaos that prevailed after the season last spring. With the new coach Egil Kristiansen from Norway and the national team manager Niklas Jonsson, the men's skaters have set out on a new track. Training is rescheduled The evaluation after the Olympics showed that several in the team had trained incorrectly. Now the amount of training has increased for everyone.\n\n- They have practiced more. Mainly when it comes to threshold sessions, and what we call low-threshold sessions. Several riders have doubled that amount now during the spring and summer. In September, we will pull on the brakes a little and go down a little in quantity, says men's coach Egil Kristiansen.\n\nEdvin Anger agrees that discipline may have broken down earlier.\n\n- That was enough. It became easy that we might compete against each other during the training sessions and that has changed now. We are not measuring anything now. Now we train and this winter we will compete, says Edvin Anger. New national team manager Former national team skater Niklas Jonsson is the new national team manager. After many years outside skiing, he is now coming back and is partly tasked with creating calm in the squad.\n\n- Skiing is an extremely performance-based sport and I understand that skiers who did not live up to their expectations get frustrated. Some skaters did not make it all the way, but we must remember that several of the younger skaters continued to develop and several had their best seasons. It is a young national team. The oldest is 28 years old, says Niklas Jonsson.\n\nNext winter, the skiing WC will be decided on home ground in Falun. Expectations are high, not least from the skiing public.\n\n- I have a lot of faith in this team, says Egil Kristiansen. It may be difficult for us to wallpaper the podium already in Falun this winter - but there is a lot of potential.", "title_original": "Hårdare krav i herrlandslaget efter OS-fiaskot", "summary_original": "När skidlandslaget har pressträff i Torsby syns inga spår av det kaos som rådde efter säsongen i våras. Med den nye tränaren Egil Kristiansen från Norge och landslagschefen Niklas Jonsson har herråkarna slagit in på ett nytt spår. Träningen läggs om Utvärderingen efter OS visade att flera i laget hade tränat fel. Nu har mängdträningen ökat för alla.\n\n– De har tränat mer. Främst när det gäller tröskelpass, och det vi kallar lågtröskelpass. Flera åkare har dubblat den mängden nu under våren och sommaren. I september kommer vi att dra lite i bromsen och gå ner lite i mängd, säger herrtränaren Egil Kristiansen.\n\nEdvin Anger håller med om att disciplinen kanske har brustit tidigare.\n\n– Så var det nog. Det blev lätt att vi kanske tävlade mot varandra under träningspassen och det har ändrats nu. Vi mäter ingenting nu. Nu tränar vi och i vinter ska vi tävla, säger Edvin Anger. Ny landslagschef Den förre landslagsåkaren Niklas Jonsson är ny landslagschef. Efter många år utanför skidsporten kommer han nu tillbaka och har delvis som uppgift att skapa lugn i truppen.\n\n– Skidåkning är en extremt prestationsbaserad idrott och jag förstår att åkare som inte nådde upp till sina förväntningar blir frustrerade. Vissa åkare nådde inte hela vägen fram, men vi ska komma ihåg att flera av de yngre åkarna fortsatte att utvecklas och flera gjorde sina bästa säsonger. Det är ett ungt landslag. Den äldste är 28 år, säger Niklas Jonsson.\n\nKommande vinter avgörs skid-VM på hemmaplan i Falun. Förväntningarna är höga, inte minst från skidpubliken.\n\n– Jag tror mycket på det här laget, säger Egil Kristiansen. Det kan nog bli svårt för oss att tapetsera prispallen redan i Falun i vinter – men det finns mycket potential.", "link": "https://www.tv4.se/artikel/1rhm0SjwfR06rpMf1lDRAE/hardare-krav-i-herrlandslaget-efter-os-fiaskot", "date_display": "2026-08-20", "date_iso": "2026-08-20T12:39:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/langdskidor", "/skidlandslaget"]}, {"id": 139, "title": "\"It hasn't rained this much in 26 years\" - staff location in Norrbotten", "summary": "There are currently several weather warnings in eastern Norrbotten. SMHI has issued an orange warning for high flows from Boden up towards Jokkmokk. At the same time, a yellow warning for high flows applies, from Luleå to Gällivare. At the same time, there is a flood warning in Boden municipality, for the watercourses Buddbyträsket and Bodträsket, just north of the city.  The orange warnings are valid until midnight, between Friday and Saturday. The yellow warning for high flows applies for another 24 hours. Strengthening preparedness Due to the storm, the emergency services, as a preventive measure and to strengthen preparedness, have requested regional and national reinforcement resources such as barriers, pumps and sandbags via the Civil Defense Agency. \"The emergency services now need to prioritize their resources where the needs are greatest, with a focus on socially important activities. This means that help to individual properties is limited. You as a property owner therefore need to prepare yourself and, if necessary, take measures to protect your property against flooding,\" the municipality writes on its website. The ground is described as saturated after several days of rain. - It has been raining more or less persistently since last weekend, says TV4 meteorologist Peter Kondrup. Then warmer weather is expected By the weekend, the worst looks to be over and a stabilization of the weather is to be expected - almost everywhere. - High pressure is building up across the country at the beginning of next week. Towards the middle of the week, it looks like late summer heat will arrive, says Peter Kondrup. When there are high flows, you should not drive through bodies of water. It also entails an increased risk of landslides, landslides and erosion. The water in the waterways can also move very quickly, which can cause great danger if you are in or near the waterway.", "title_original": "”Inte regnat så här mycket på 26 år” – stabsläge i Norrbotten", "summary_original": "Det råder just nu flera vädervarningar i östra Norrbotten. SMHI har utfärdat en orange varning för höga flöden från Boden upp mot Jokkmokk. Det gäller samtidigt en gul varning för höga flöden, från Luleå till Gällivare. Det råder samtidigt en varning för översvämning i Boden kommun, för vattendragen Buddbyträsket och Bodträsket, precis norr om staden.  De orange varningarna gäller fram till midnatt, mellan fredag och lördag. Den gula varningen för höga flöden gäller ytterligare ett dygn. Stärker beredskapen På grund av ovädret har räddningstjänsten, som en förebyggande åtgärd och för att stärka beredskapen, begärt regionala och nationella förstärkningsresurser som barriärer, pumpar och sandsäckar via Myndigheten för civilt försvar. ”Räddningstjänsten behöver nu prioritera sina resurser där behoven är som störst, med fokus på samhällsviktig verksamhet. Det innebär att hjälp till enskilda fastigheter är begränsad. Du som fastighetsägare behöver därför förbereda dig och vid behov vidta åtgärder för att skydda din fastighet mot översvämning”, skriver kommunen på sin hemsida. Marken beskrivs som mättad efter flera dagars nederbörd. – Det har regnat mer eller mindre ihärdigt sedan förra helgen, säger TV4-meteorologen Peter Kondrup. Då väntas varmare väder Till helgen ser det värsta ut att ha gått över och en stabilisering av vädret är att vänta – nästan överallt. – Det växer in ett högtryck över hela landet i början av nästa vecka. Framåt mitten av veckan ser det ut att komma sensommarvärme, säger Peter Kondrup. När det råder höga flöden bör man inte köra genom vattensamlingar. Det medför också en ökad risk för ras, skred och erosion. Vattnet i vattendragen kan även röra sig mycket snabbt vilket kan medföra stor fara om man befinner sig i eller nära vattendraget.", "link": "https://www.tv4.se/artikel/50v0b1qb9bJiTbxInHCRId/orange-vaedervarning-raeddningstjaensten-i-stabslaege", "date_display": "2026-08-20", "date_iso": "2026-08-20T12:04:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/vader", "/vadervarningar"]}, {"id": 140, "title": "Power play at the highest level from Ebba Busch", "summary": "In the latest voter barometer from Novus, the sum is 51.4 percent if you add S+MP+C+KD. This means that Magdalena Andersson has a chance to form a government without the Left Party, if she succeeds in attracting the Christian Democrats. Of course, there are major inherent contradictions even in such a coalition, but it is still not as hopeless a task as trying to bring the Left Party together with the Center Party. Moving to the left Already in Almedalen at the beginning of the summer, it was clear that the Christian Democrats have begun a shift in their politics to the left. Ebba Busch presented proposals for record-breaking increases in child benefits and spoke of the need for more priority on welfare issues. She spoke of a \"right with a heart\" and spoke respectfully of the Social Democrats. Ebba Busch has also marked a clearer distance from the Sweden Democrats than before. Unlike Ulf Kristersson and Simona Mohamsson, she has not promised any ministerial posts to SD after the election. All this must be seen in the light of the state of public opinion. The Tidö parties have long been far behind the Opposition. Now there is a tendency for the gap between the blocks to decrease, but the uphill is still difficult. The Liberals will probably leave the Riksdag. Takes two positions In this situation, Ebba Busch takes two positions. 1) As a key player in the Tidö collaboration, she is adamant that their team must win the election, that she believes in election victory and does not intend to let an S-led government emerge. 2) As KD leader, with ambitions to have a central role in Swedish politics going forward regardless of who is prime minister, she is open to new collaborations. When she called a press conference outside Rosenbad today, Ebba Busch repeated her kind words about Magdalena Andersson's leadership and said that she would be happy to cooperate with S on substantive issues. But that's not enough: She also pointed out five specific areas where she wants an answer to whether the Center Party is prepared to settle. Ebba Busch said that C is welcome to the blue and yellow team, but she knows that", "title_original": "Maktspel på högsta nivå från Ebba Busch", "summary_original": "I den senaste väljarbarometern från Novus blir summan 51,4 procent om man lägger ihop S+MP+C+KD. Det innebär att Magdalena Andersson har en chans att bilda regering utan Vänsterpartiet, om hon lyckas locka till sig Kristdemokraterna. Självklart finns det stora inneboende motsättningar även i en sådan koalition, men det är ändå inte en lika hopplös uppgift som att försöka få ihop Vänsterpartiet med Centerpartiet. Rör sig mot vänster Redan i Almedalen i början av sommaren stod det klart att Kristdemokraterna har börjat en omläggning av sin politik mot vänster. Ebba Busch lade fram förslag om rekordstora höjningar av barnbidragen och talade om att välfärdsfrågorna måste prioriteras mer. Hon talade om en ”höger med hjärta” och uttalade sig respektfullt om Socialdemokraterna. Ebba Busch har också markerat tydligare distans mot Sverigedemokraterna än tidigare. Till skillnad från Ulf Kristersson och Simona Mohamsson har hon inte utlovat några ministerposter till SD efter valet. Allt det här ska ses i ljuset av opinionsläget. Tidöpartierna har länge legat långt efter Oppositionen. Nu syns en tendens till att gapet mellan blocken minskar, men uppförsbacken är fortfarande svår. Liberalerna åker förmodligen ur riksdagen. Intar två positioner I det här läget intar Ebba Busch två positioner. 1) Som nyckelspelare i Tidösamarbetet håller hon fast vid att deras lag måste vinna valet, att hon tror på valseger och inte tänker släppa fram en S-ledd regering. 2) Som KD-ledare, med ambitioner att ha en central roll i svensk politik framöver oavsett vem som är statsminister, öppnar hon för nya samarbeten. När hon kallade till pressträff utanför Rosenbad idag upprepade Ebba Busch sina vänliga ord om Magdalena Anderssons ledarskap och sade att hon gärna samarbetar med S i sakfrågor. Men inte nog med det: Hon pekade också ut fem konkreta sakområden där hon vill få svar på om Centerpartiet är beredda att göra upp. Ebba Busch sade att C är välkomna till det blågula laget, men hon vet att det inte kommer att ske. I själva verket var utspelet från Busch en början på något som kan leda till konkreta regeringsförhandlingar – om Tidöpartierna förlorar valet.", "link": "https://www.tv4.se/artikel/4nYxDOgM6G9UORnDULmLPy/maktspel-pa-hoegsta-niva-fran-ebba-busch", "date_display": "2026-08-20", "date_iso": "2026-08-20T10:11:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ebba Busch", "/ebba-busch", "/valet-2026", "/politik"]}, {"id": 141, "title": "Therefore, the interest rate can be raised - despite low inflation: \"Appearances are deceiving\"", "summary": "Today, the Riksbank left the key interest rate unchanged, but in a press release they also write that they \"assess that the probability of an interest rate increase later this year remains\".  They refer to the fact that inflation during the summer has been unexpectedly high and that if this were to be the beginning of a larger and more permanent rise in inflation, the Riksbank will adjust monetary policy in a tighter direction.  There is a target for inflation to be around two percent. Despite the fact that inflation is now 0.7 percent, the Riksbank is flagging for an increase. Frida Bratt believes that the figure is actually up to two percent.  - Inflation is depressed by temporary fiscal policy measures, including tax cuts on fuel and cheaper public transport, she says. \n\nWhy is the assessment made now that inflation will increase later this year? - Of several factors. Partly, the Strait of Hormuz is still closed. It is also drought in several places that can affect food prices.  Sweden has been in a recession and now that the economy is starting to pick up a bit, it can help push inflation up. - You want to see this economic recovery. But at the same time, high inflation is judged to be even worse for the economy in the long term.  No new interest rate shock For mortgage borrowers, according to Frida Bratt, today's announcement need not mean any reason for panic. She does not believe in any strong and rapid rise in interest rates. - There may be an interest rate increase at the end of the year and perhaps another at the beginning of the next. Anyone with a variable interest rate should, above all, think about whether their own finances can handle a higher interest rate. - Can I handle 50 points, 0.5 percentage points higher interest rate? If you do that, then you don't have to rush and commit the interest rate. Fixed mortgage rates are already slightly higher than variable rates.  For those who still want to tie the interest rate, it may be worth it for the sake of security, but then you should make sure you get a good offer from the bank. Uncertain in which direction the interest rate will go But will the households for", "title_original": "Därför kan räntan höjas – trots låg inflation: ”Skenet bedrar”", "summary_original": "I dag lämnade Riksbanken styrräntan oförändrad, men i ett pressmeddelande skriver de också att de ”bedömer att sannolikheten för en räntehöjning senare i år kvarstår”.  De hänvisar till att inflationen under sommaren har varit oväntat hög och att om det skulle vara inledningen på en större och mer bestående inflationsuppgång kommer Riksbanken att anpassa penningpolitiken i en stramare riktning.  Det finns ett mål att inflationen ska ligga runt två procent. Trots att inflationen nu är 0,7 procent flaggar Riksbanken alltså för en höjning. Frida Bratt menar att siffran egentligen är upp emot två procent.  – Inflationen är nedpressad av tillfälliga finanspolitiska åtgärder, bland annat skattesänkningar på drivmedel och billigare kollektivtrafik, säger hon. \n\nVarför görs bedömningen nu att inflationen kommer att öka senare i år? – Av flera faktorer. Dels är det ju Hormuzsundet fortfarande stängt. Det är också torka på flera håll som kan påverka livsmedelspriserna.  Sverige har befunnit sig i en lågkonjunktur och nu när konjunkturen börjar hämta sig lite grann kan det bidra till att trycka upp inflationen. – Man vill ju se den här konjunkturåterhämtningen. Men samtidigt bedömer man att en hög inflation är ännu sämre för konjunkturen på sikt.  Ingen ny räntechock För bolånetagare behöver dagens besked enligt Frida Bratt inte innebära någon anledning till panik. Hon tror inte på någon kraftig och snabb ränteuppgång. – Det kanske är någon räntehöjning i slutet av året och kanske någon till i början av nästa. Den som har rörlig ränta bör framför allt fundera på om den egna ekonomin klarar en högre ränta. – Klarar jag av 50 punkter, 0,5 procentenheters högre ränta? Gör man det, då behöver man inte rusa och binda räntan. Bundna bolåneräntor ligger redan något högre än de rörliga.  För den som ändå vill binda räntan kan det vara värt det för trygghetens skull, men då bör man se till att få ett bra erbjudande från banken. Osäkert åt vilket håll räntan går Men ska då hushållen förbereda sig inför ett läge där bolåneräntan snabbt höjs? Frida Bratt säger att man inte kan jämföra dagens situation med räntechocken 2022, då Riksbanken höjde styrräntan från 0 till 4 procent på ungefär 1,5 år. – Där är vi ju inte nu, säger Frida Bratt.  I stället handlar det om en osäker situation där räntan kan gå åt olika håll. – Det skulle kunna vara så att det blir en lösning på Hormuzsundet, att det öppnas igen. Då skulle ju inflationen kunna falla tillbaka i stället.", "link": "https://www.tv4.se/artikel/hV0zkRSmE2jQwNakVBdOX/daerfoer-kan-raentan-hoejas-trots-lag-inflation-skenet-bedrar", "date_display": "2026-08-20", "date_iso": "2026-08-20T09:39:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/inrikes", "/frida-bratt", "/svensk-ekonomi", "/kriget-i-ukraina/ekonomiskaeffekterna", "/styrranta", "/riksbanken", "/bolan", "/rantebesked"]}, {"id": 142, "title": "Man arrested in Germany - for murder in Kalmar", "summary": "The couple in their 30s are said to have come to Sweden in July this year. The woman's relatives were later unable to find her and reported her missing. The authorities in Germany contacted Swedish police who found the woman's body in Kalmar county on August 7. According to German police, there were signs that the woman had been subjected to violence. An investigation into murder and grave breach of privacy was therefore started and the woman's partner was arrested in his absence. The prosecutor issued a European arrest warrant and the man was wanted internationally. Flee to Germany After a police operation in Germany, the man has now been arrested on suspicion of the murder, according to German police. He is in custody and is expected to be handed over to Sweden. According to documents in the district court, the murder is suspected to have taken place sometime between July 7 and August 7. Prosecutor Linda Caneus, who leads the Swedish preliminary investigation, has asked to come back with a comment. TV4 Nyheterna has contacted the police in Germany.", "title_original": "Man gripen i Tyskland – för mord i Kalmar", "summary_original": "Paret i 30-årsåldern uppges ha kommit till Sverige i juli i år. Kvinnans anhöriga fick senare inte tag på henne och anmälde henne försvunnen. Myndigheterna i Tyskland kontaktade svensk polis som hittade kvinnans kropp i Kalmar län den 7 augusti. Enligt tysk polis fanns det tecken på att kvinnan hade utsatts för våld. En utredning om mord och grovt gravfridsbrott startade därför och kvinnans partner häktades i sin utevaro. Åklagaren utfärdade en europeisk arresteringsorder och mannen blev internationellt efterlyst. Flydde till Tyskland Efter en polisinsats i Tyskland har mannen nu gripits misstänkt för mordet, uppger tysk polis. Han sitter frihetsberövad och väntas överlämnas till Sverige. Enligt handlingar i tingsrätten misstänks mordet ha skett någon gång mellan den 7 juli och den 7 augusti. Åklagare Linda Caneus som leder den svenska förundersökningen har bett om att få återkomma med en kommentar. TV4 Nyheterna har sökt polisen i Tyskland.", "link": "https://www.tv4.se/artikel/5pROCLJdu8F08sCPd2lGeG/man-gripen-i-tyskland-foer-mord-i-kalmar", "date_display": "2026-08-20", "date_iso": "2026-08-20T08:28:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/kalmar", "/mord", "/brott", "/tyskland"]}, {"id": 143, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "During the summer, both growth and inflation have been higher than in the forecast from June, and the risk of underlying inflation becoming too high in the wake of supply disruptions in the Middle East remains. However, the picture is not clear-cut, for example the companies' price plans have been moderated, disruptions in global value chains have subsided and the labor market has developed somewhat weaker than expected. All in all, the outlook is broadly positive. The executive board has decided to leave the key interest rate unchanged at 1.75 percent and assesses that the probability of an interest rate increase later this year remains. Should the unexpectedly high inflation during the summer be the start of a larger and more permanent rise in inflation, the Riksbank will adapt monetary policy in a tighter direction.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Under sommaren har såväl tillväxten som inflationen varit högre än i prognosen från juni och risken för att den underliggande inflationen ska bli för hög i spåren av utbudsstörningarna i Mellanöstern kvarstår. Bilden är dock inte entydig, exempelvis har företagens prisplaner dämpats, störningarna i globala värdekedjor avtagit och arbetsmarknaden utvecklats något svagare än väntat. Sammantaget står sig utsikterna i stora drag. Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent och bedömer att sannolikheten för en räntehöjning senare i år kvarstår. Skulle den oväntat höga inflationen under sommaren vara inledningen på en större och mer bestående inflationsuppgång kommer Riksbanken att anpassa penningpolitiken i en stramare riktning.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent5/", "date_display": "2026-08-20", "date_iso": "2026-08-20T07:30:34+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 144, "title": "Marked increase in calls to Bris: \"Anxiety stands out\"", "summary": "During the summer, Barnens Rätt i Samhället received 11,344 contacts in the national support line for children. This is a slight increase compared to the same period last year and a large increase if you look back a couple of years. - There are many contacts that Bris has had with children, but on the other hand, it is important that children get in touch, that there is someone who can listen, says Maria Frisk, in Nyhetsmorgon. - During the summer, many adults take a break. Schools and activities are closed and children don't have many adults around them. It is positive that children contact us at Bris, continues Maria Frisk. Mental illness Almost half of the conversations were about mental illness and anxiety is now the most common reason why children seek support.  - Almost half of all calls are about mental illness. Anxiety is what stands out now. You see that children do not receive support in time, many children talk about that, says Maria Frisk. Bris has produced a couple of quotes from children who got in touch during the summer, to give examples of how it can sound. \"I don't have an adult to tell, my parents would be very angry and there's no teacher either because it's summer vacation,\" says a child. \"I hardly want summer vacation, I'm just at home and I'm sad. I feel empty and have no energy for anything. I'm on medication for anxiety, etc. and unfortunately I've started vaping now and I've started to feel worse. I have a lot of thoughts and feel like my brain is running at high speed all the time,\" says another. Need to act before it escalates Till Bris, you can call regardless of what you want to talk about. It can be from the small to the big, explains the general secretary. - When they call us, some children tell us that it is the first time they have talked to an adult about what they find difficult. This just shows that during the summer holidays, when the teachers and other adults are not around, it becomes difficult. We need to give children the right support at the right time, before it escalates, says Maria Frisk.", "title_original": "Markant ökning av samtal till Bris: ”Ångest sticker ut”", "summary_original": "Under sommaren har Barnens Rätt i Samhället tagit emot 11 344 kontakter i den nationella stödlinjen för barn. Detta är en knapp ökning jämfört med samma period förra året och en stor ökning om man tittar ett par år tillbaka. – Det är många kontakter som Bris har haft med barn men å andra sidan är det ju viktigt att barn hör av sig, att det finns någon som kan lyssna, säger Maria Frisk, i Nyhetsmorgon. – Under sommaren är det många vuxna som tar paus. Skolor och aktiviteter är stängda och barn har inte så många vuxna runt omkring sig. Det är
