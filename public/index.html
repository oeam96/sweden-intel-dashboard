n svarar direkt.", "link": "https://www.dagen.se/debatt/skriften-aer-fortsatt-hoegsta-auktoritet-i-lausanneroerelsen/10253150", "date_display": "2026-03-20", "date_iso": "2026-03-20T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 166, "title": "The second round of \"Songs of all times\" kicks off the Swedish folk revival", "summary": "Sarah Lindberg one of the new artists in the series: A note can perhaps reach a little further than words", "title_original": "Andra omgången av ”Alla tiders sånger” tar spjärn i den svenska folkväckelsen", "summary_original": "Sarah Lindberg en av de nya artisterna i serien: En ton kan kanske nå lite längre än ord", "link": "https://www.dagen.se/kultur/andra-omgangen-av-alla-tiders-sanger-tar-spjaern-i-den-svenska-folkvaeckelsen/10257468", "date_display": "2026-03-20", "date_iso": "2026-03-20T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 167, "title": "Here it explodes just meters from the reporter - live", "summary": "Watch the dramatic video", "title_original": "Här sprängs det bara meter ifrån reportern – i direktsändning", "summary_original": "Se dramatiska videon", "link": "https://www.tv4.se/artikel/1d7VjcPLCALXNs5hjUFFQm/haer-spraengs-det-bara-meter-ifran-reportern-i-direktsaendning", "date_display": "2026-03-19", "date_iso": "2026-03-19T20:39:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 168, "title": "KD: Norway's decision on religious services in school raises hope for Sweden as well", "summary": "The Christian Democrats are alone in wanting to allow confessional elements when the school holds gatherings in the church", "title_original": "KD: Norskt beslut om gudstjänst i skolan väcker hopp även för Sverige", "summary_original": "Kristdemokraterna ensamma om att vilja tillåta konfessionella inslag när skolan håller samlingar i kyrkan", "link": "https://www.dagen.se/nyheter/kd-norskt-beslut-om-gudstjaenst-i-skolan-vaecker-hopp-aeven-foer-sverige/10257499", "date_display": "2026-03-19", "date_iso": "2026-03-19T09:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 169, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "The executive board has decided to leave the key interest rate unchanged at 1.75 percent and the interest rate is expected to remain at this level for some time to come. But the war in the Middle East makes the forecast very uncertain.  The Riksbank is following developments closely and will adapt monetary policy if the inflation and business cycle prospects require it.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent och räntan väntas ligga kvar på denna nivå under en tid framöver. Men kriget i Mellanöstern gör prognosen mycket osäker.  Riksbanken följer utvecklingen noga och kommer att anpassa penningpolitiken om inflations- och konjunkturutsikterna kräver det.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent2/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:42:40+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 170, "title": "The Riksbank lowers the interest rate on the supplementary liquidity facility", "summary": "In the Riksbank's monetary policy control system, the interest rate that shall apply to the banks' overnight deposits and lending in the Riksbank is specified. In the Riksbank's supplementary liquidity facility, banks can take loans against collateral such as covered bonds. The interest surcharge on the supplementary liquidity facility is now reduced from 0.75 percentage points to 0.30 percentage points above the policy rate. In addition, the Riksbank removes the restriction on the percentage of covered bonds that the banks may use as collateral for loans from the Riksbank. The changes come into effect on 8 April 2026, and are part of the Riksbank's long-term work to facilitate banks' adaptation to an environment with less excess liquidity.", "title_original": "Riksbanken sänker räntan på den kompletterande likviditetsfaciliteten", "summary_original": "I Riksbankens penningpolitiska styrsystem anges vilken ränta som ska gälla för bankernas in- och utlåning över natten i Riksbanken. I Riksbankens kompletterande likviditetsfacilitet kan bankerna ta lån mot säkerheter som exempelvis säkerställda obligationer. Räntepåslaget på den kompletterande likviditetsfaciliteten sänks nu från 0,75 procentenheter till 0,30 procentenheter över styrräntan. Dessutom tar Riksbanken bort begränsningen för hur stor andel säkerställda obligationer bankerna får använda som säkerhet vid lån från Riksbanken. Förändringarna träder i kraft den 8 april 2026, och är en del av Riksbankens långsiktiga arbete med att underlätta bankernas anpassning till en miljö med mindre överskottslikviditet.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbanken-sanker-rantan-pa-den-kompletterande-likviditetsfaciliteten/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:29:00+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "1 day old", "tags": []}, {"id": 171, "title": "New language record for \"The Chosen\"", "summary": "'All these languages ​​represent changed lives,' says director Dallas Jenkins", "title_original": "Nytt språkrekord för ”The Chosen”", "summary_original": "'Alla de här språken representerar förändrade liv' säger regissören Dallas Jenkins", "link": "https://www.dagen.se/kultur/nytt-sprakrekord-foer-the-chosen/10254231", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 172, "title": "Are our congregations organized enough?", "summary": "Young faith does not need more arguments, but it needs to see how faith carries through an entire life, writes Liselotte Lindé.", "title_original": "Är våra församlingar organiserade nog?", "summary_original": "Ung tro behöver inte fler argument utan den behöver se hur tron bär genom ett helt liv, skriver Liselotte Lindé.", "link": "https://www.dagen.se/debatt/aer-vara-foersamlingar-organiserade-nog/10254504", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 173, "title": "After decades of retreat, the church needs to find its boldness", "summary": "Raising your eyes and hooking an arm may sound simple and obvious, but it also comes with a price, write Linnea Åberg, Magnus Alphonce and Markus Sand, proposed new leaders for EFK.", "title_original": "Efter årtionden av reträtt behöver kyrkan hitta sin frimodighet", "summary_original": "Att lyfta blicken och kroka arm kan låta enkelt och självklart, men det kommer också med ett pris, skriver Linnea Åberg, Magnus Alphonce och Markus Sand, föreslagna nya ledare för EFK.", "link": "https://www.dagen.se/debatt/efter-artionden-av-retraett-behoever-kyrkan-hitta-sin-frimodighet/10254022", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 174, "title": "\"As a pastor or priest, one should not exercise power over other people\"", "summary": "Peder Bergqvist, director of the retreat farm Berget, in a large interview about growing up, the conversion and the eastern elements on the farm", "title_original": "”Som pastor eller präst ska man inte utöva makt över andra människor”", "summary_original": "Peder Bergqvist, föreståndare på retreatgården Berget, i stor intervju om uppväxten, konversionen och de österländska inslagen på gården", "link": "https://www.dagen.se/livsstil/som-pastor-eller-praest-ska-man-inte-utoeva-makt-oever-andra-maenniskor/10218896", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 175, "title": "Susanna Birgersson:\nDon't be afraid of AI - stick to the Word and live out the Christian message", "summary": "Technological development cannot frighten the Lord of heaven and earth.", "title_original": "Susanna Birgersson:\nVar inte rädd för AI – håll fast vid Ordet och lev ut det kristna budskapet", "summary_original": "Den tekniska utvecklingen kan inte förskräcka himmelens och jordens Herre.", "link": "https://www.dagen.se/ledare/susanna-birgersson-var-inte-raedd-foer-ai-hall-fast-vid-ordet-och-lev-ut-det-kristna-budskapet/10254995", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 176, "title": "9 out of 13 bishops willing to ordain candidates who do not ordain same-sex couples", "summary": "Mapping done by P4 Gotland shows that the majority of bishops in the Church of Sweden can still ordain someone who does not ordain same-sex couples", "title_original": "9 av 13 biskopar villiga att prästviga kandidater som inte viger samkönade par", "summary_original": "Kartläggning gjord av P4 Gotland visar att majoriteten av biskoparna i Svenska kyrkan fortfarande kan prästviga någon som inte viger samkönade par", "link": "https://www.dagen.se/nyheter/9-av-13-biskopar-villiga-att-praestviga-kandidater-som-inte-viger-samkoenade-par/10256253", "date_display": "2026-03-19", "date_iso": "2026-03-19T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 177, "title": "\"I can laugh a little at the fact that HV thinks they have a monopoly on higher powers\"", "summary": "The Christian profiles are preparing for qualification anxiety when HV71 meet Leksand in the best of seven games", "title_original": "”Jag kan ju le lite åt att HV tror att de har monopol på högre makter”", "summary_original": "De kristna profilerna förbereder sig för kvalångest när HV71 möter Leksand i bäst av sju matcher", "link": "https://www.dagen.se/nyheter/jag-kan-ju-le-lite-at-att-hv-tror-att-de-har-monopol-pa-hoegre-makter/10257140", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:42:43+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 178, "title": "The art of breaking generational boundaries is spelled mentoring", "summary": "The key to creating deep relationships, where together you can help each other get closer to the Lord, lies in the willingness to ask for help and the willingness to be there, writes Olivia Moeller.", "title_original": "Konsten att krossa generationsgränser stavas mentorskap", "summary_original": "Nyckeln i att skapa djupa relationer, där man tillsammans kan hjälpa varandra att komma närmare Herren, ligger i villigheten att be om hjälp och villigheten att finnas där, skriver Olivia Moeller.", "link": "https://www.dagen.se/debatt/konsten-att-krossa-generationsgraenser-stavas-mentorskap/10254385", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 179, "title": "Who has the right to throw the first stone at Simona Mohamsson?", "summary": "Erik Helmerson: Judas trends - but be careful with the words.", "title_original": "Vem har rätt att kasta första stenen mot Simona Mohamsson?", "summary_original": "Erik Helmerson: Judas trendar – men var försiktiga med orden.", "link": "https://www.dagen.se/ledare/vem-har-raett-att-kasta-foersta-stenen-mot-simona-mohamsson/10256440", "date_display": "2026-03-18", "date_iso": "2026-03-18T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 180, "title": "The same prophetic address three times in 24 hours prompted Robert to begin preaching", "summary": "Today, 70-year-old Robert Sahrling holds regular Bible studies.", "title_original": "Samma profetiska tilltal tre gånger på 24 timmar fick Robert att börja predika", "summary_original": "I dag håller 70-årige Robert Sahrling regelbundet i bibelstudier.", "link": "https://www.dagen.se/familj/samma-profetiska-tilltal-tre-ganger-pa-24-timmar-fick-robert-att-boerja-predika/10242047", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 181, "title": "There is a shortage of priests and deacons - but what is being done about it?", "summary": "A church that wants to carry the gospel into the future must also take responsibility for how the bearers of the future are formed. Only then can more people dare to say yes, writes Sebastian Fontler.", "title_original": "Det är präst- och diakonbrist – men vad görs åt saken?", "summary_original": "En kyrka som vill bära evangeliet in i framtiden måste också ta ansvar för hur framtidens bärare formas. Först då kan fler våga säga ja, skriver Sebastian Fontler.", "link": "https://www.dagen.se/debatt/det-aer-praest-och-diakonbrist-men-vad-goers-at-saken/10248156", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 182, "title": "Sweden joins Pax Silica initiative", "summary": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "title_original": "Sweden joins Pax Silica initiative", "summary_original": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "link": "https://www.government.se/press-releases/2026/03/sweden-joins-pax-silica-initiative/", "date_display": "2026-03-17", "date_iso": "2026-03-17T17:05:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "3 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Innovation", "Maria Malmer Stenergard"]}, {"id": 183, "title": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "title_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "link": "https://www.government.se/speeches/2026/03/statement-by-minister-for-energy-business-and-industry-and-deputy-prime-minister-ebba-busch-at-the-energy-council-meeting-in-brussels/", "date_display": "2026-03-17", "date_iso": "2026-03-17T08:33:02+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "3 days old", "tags": ["Speech", "EU", "Ministry of Climate and Enterprise", "Energy", "Ebba Busch"]}, {"id": 184, "title": "Sweden provides humanitarian support to Lebanon", "summary": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "title_original": "Sweden provides humanitarian support to Lebanon", "summary_original": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "link": "https://www.government.se/press-releases/2026/03/sweden-provides-humanitarian-support-to-lebanon/", "date_display": "2026-03-16", "date_iso": "2026-03-16T16:26:07+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Benjamin Dousa"]}, {"id": 185, "title": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "title_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "link": "https://www.government.se/statements/2026/03/joint-statement-by-the-prime-ministers-of-the-nordic-countries-and-canada/", "date_display": "2026-03-15", "date_iso": "2026-03-15T10:33:42+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "5 days old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Civil defence", "Military defence"]}, {"id": 186, "title": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "title_original": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary_original": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/speech-by-the-minister-for-foreign-affairs-at-the-baltic-sea-security-talks-in-gdansk-on-12-march/", "date_display": "2026-03-13", "date_iso": "2026-03-13T13:51:21+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "7 days old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 187, "title": "The Payments Report 2026: Measures required to reduce vulnerability and increase inclusion in the payments market", "summary": "In order to reduce dependence on the outside world, the banks need to develop new payment services based on national and European systems. Primarily, banks must offer more services for instant payments, otherwise legislation should be introduced. To increase inclusion in the payment market, more payment methods are needed for those who do not have a payment account or experience digital exclusion. Access to cash services also needs to be improved, the Riksbank writes in the Payment Report published today.", "title_original": "Betalningsrapporten 2026: Åtgärder krävs för minskad sårbarhet och ökad inkludering på betalningsmarknaden", "summary_original": "För att minska omvärldsberoendet behöver bankerna utveckla nya betaltjänster som bygger på nationella och europeiska system. Primärt måste bankerna erbjuda fler tjänster för omedelbara betalningar, annars bör lagstiftning införas. För att öka inkluderingen på betalningsmarknaden behövs det fler betalsätt för de som saknar betalkonto eller upplever digitalt utanförskap. Tillgången till kontanttjänster behöver också förbättras, det skriver Riksbanken i Betalningsrapporten som publiceras idag.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/betalningsrapporten-2026-atgarder-kravs-for-minskad-sarbarhet-och-okad-inkludering-pa-betalningsmarknaden/", "date_display": "2026-03-12", "date_iso": "2026-03-12T08:00:30+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "8 days old", "tags": []}, {"id": 188, "title": "The Riksbank's business survey: \"It is not an obvious recovery, but we see that it is still happening\"", "summary": "The large Swedish companies are experiencing a certain improvement in the economy, but the recovery is both slow and hesitant. The troubled global situation has noticeably affected household consumption and companies' willingness to invest, and makes companies cautious when looking ahead. This is shown by the Riksbank's company survey in February.", "title_original": "Riksbankens företagsundersökning: ”Det är ingen självklar återhämtning men vi ser att det ändå händer”", "summary_original": "De svenska storföretagen upplever en viss förbättring av konjunkturen, men återhämtningen är både långsam och tvekande. Det oroliga omvärldsläget har påverkat hushållens konsumtion och företagens investeringsvilja märkbart och gör företagen försiktiga när de blickar framåt. Det visar Riksbankens företagsundersökning i februari.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbankens-foretagsundersokning-det-ar-ingen-sjalvklar-aterhamtning-men-vi-ser-att-det-anda-hander/", "date_display": "2026-03-11", "date_iso": "2026-03-11T08:30:29+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "9 days old", "tags": []}, {"id": 189, "title": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "title_original": "Statement by Ms Nina Larsson, Minister for Gender Equality", "summary_original": "Statement by Ms Nina Larsson, Minister for Gender Equality at the UN Commission on the Status of Women, New York, 9 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/statement-by-ms-nina-larsson-minister-for-gender-equality/", "date_display": "2026-03-10", "date_iso": "2026-03-10T14:54:30+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "10 days old", "tags": ["Speech", "International", "Ministry of Employment", "Gender equality", "Nina Larsson"]}, {"id": 190, "title": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "title_original": "Statement from Ministry for Foreign Affairs on summoning of Russian Ambassador", "summary_original": "On 9 March, the Russian Ambassador in Stockholm was summoned to the Ministry for Foreign Affairs.", "link": "https://www.government.se/statements/2026/03/statement-from-ministry-for-foreign-affairs-on-summoning-of-russian-ambassador/", "date_display": "2026-03-10", "date_iso": "2026-03-10T09:26:54+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "10 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement", "Sweden's support to Ukraine"]}, {"id": 191, "title": "Government supports women’s and girls’ resilience in Ukraine", "summary": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "title_original": "Government supports women’s and girls’ resilience in Ukraine", "summary_original": "Russia’s systematic and illegal attacks in Ukraine have deadly consequences. Women may be vulnerable, but they also play a key role in Ukraine’s civilian resilience in areas such as health and medical care, education and defence initiatives. Therefore, the Government is allocating more than SEK 71 million for activities that benefit women and girls in Ukraine. The funds will be distributed between the United Nations Population Fund (UNFPA) and the United Nations Programme for Gender Equality and the Empowerment of Women (UN Women) with a focus on humanitarian activities.", "link": "https://www.government.se/press-releases/2026/03/government-supports-womens-and-girls-resilience-in-ukraine/", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:58:18+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "10 days old", "tags": ["Press release", "International", "Ministry of Employment", "Ministry for Foreign Affairs", "International development cooperation", "Sweden's support to Ukraine", "Benjamin Dousa", "Nina Larsson"]}, {"id": 192, "title": "Get a new favorite book with SvD's new chatbot", "summary": "Looking for a new book for the book club? Or do you need tips on a gift for the 8-year-old? Try SvD's new bookbot!", "title_original": "Få en ny favoritbok med SvD:s nya chatbot", "summary_original": "Letar du efter en ny bok till bokklubben? Eller behöver du tips på present till 8-åringen? Testa SvD:s nya bokbot!", "link": "https://www.svd.se/a/rrlQ5A/svd-s-chatbot-tipsar-om-bocker", "date_display": "2026-03-10", "date_iso": "2026-03-10T07:32:28+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "11 days old", "tags": ["Kultur"]}, {"id": 193, "title": "Minister for Gender Equality wants to see stronger international alliances against online threats and hatred", "summary": "Minister for Gender Equality Nina Larsson will lead the Swedish delegation attending the UN Commission on the Status of Women in New York on 9–19 March, the world’s largest conference on women’s rights and gender equality. Ms Larsson will take part during the first week and will be advocating for stronger international alliances against online threats and hatred. The conference on women’s rights and gender equality is held annually and is the second largest in the UN system.", "title_original": "Minister for Gender Equality wants to see stronger international alliances against online threats and hatred", "summary_original": "Minister for Gender Equality Nina Larsson will lead the Swedish delegation attending the UN Commission on the Status of Women in New York on 9–19 March, the world’s largest conference on women’s rights and gender equality. Ms Larsson will take part during the first week and will be advocating for stronger international alliances against online threats and hatred. The conference on women’s rights and gender equality is held annually and is the second largest in the UN system.", "link": "https://www.government.se/press-releases/2026/03/minister-for-gender-equality-wants-to-see-stronger-international-alliances-against-online-threats-and-hatred/", "date_display": "2026-03-09", "date_iso": "2026-03-09T12:33:12+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "International", "Ministry of Employment", "Democracy and human rights", "Gender equality", "Nina Larsson"]}];

  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
