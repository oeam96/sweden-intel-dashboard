nal": "Joint statement by the Leaders of the Joint Expeditionary Force", "summary_original": "Joint statement by the Leaders of the Joint Expeditionary Force (JEF), Helsinki, 26 March 2026.", "link": "https://www.government.se/statements/2026/03/joint-statement-the-joint-expeditionary-force-leaders-summit/", "date_display": "2026-03-26", "date_iso": "2026-03-26T15:24:01+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "2 days old", "tags": ["International", "Prime Minister's Office", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Military defence", "Total defence"]}, {"id": 178, "title": "Today Noelia dies - young woman receives euthanasia in Spain after dispute", "summary": "The father tried to stop the decision for two years, wanted the daughter to be treated for depression.", "title_original": "I dag dör Noelia – ung kvinna får dödshjälp i Spanien efter tvist", "summary_original": "Fadern försökte stoppa beslutet i två år, ville att dottern skulle behandlas mot depression.", "link": "https://www.dagen.se/nyheter/i-dag-doer-noelia-ung-kvinna-far-doedshjaelp-i-spanien-efter-tvist/10272128", "date_display": "2026-03-26", "date_iso": "2026-03-26T14:33:58+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 179, "title": "Difficult to close one's eyes to the factual errors found in the Bible", "summary": "There are unscientific claims in the Bible that I cannot close my eyes to, writes Kent Johansson in a reply.", "title_original": "Svårt att blunda för de sakfel som finns i Bibeln", "summary_original": "Det finns ovetenskapliga påståenden i Bibeln som jag inte kan blunda för, skriver Kent Johansson i en replik.", "link": "https://www.dagen.se/debatt/svart-att-blunda-foer-de-sakfel-som-finns-i-bibeln/10268309", "date_display": "2026-03-26", "date_iso": "2026-03-26T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 180, "title": "Now Sarah Mullally has been installed as Archbishop", "summary": "She will be the first woman to be elected supreme leader of the Church of England • \"A consequence of the gospel,\" says the Church of Sweden's archbishop Martin Modéus.", "title_original": "Nu har Sarah Mullally installerats som ärkebiskop", "summary_original": "Hon blir första kvinnan som väljs till högsta ledaren för Engelska kyrkan • ”En konsekvens av evangelium”, säger Svenska kyrkans ärkebiskop Martin Modéus.", "link": "https://www.dagen.se/nyheter/nu-har-sarah-mullally-installerats-som-aerkebiskop/10272030", "date_display": "2026-03-26", "date_iso": "2026-03-26T12:41:19+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 181, "title": "Josefin Lilja:\nIs the Jesus trend already over according to the Youth Barometer?", "summary": "Young people now prefer to describe themselves with words such as 'enjoyer of life', 'family lover' and 'exercising person'.", "title_original": "Josefin Lilja:\nÄr Jesustrenden redan över enligt Ungdomsbarometern?", "summary_original": "Unga helst väljer nu att beskriva sig själva med ord som 'livsnjutare', 'familjekär' och 'träningsmänniska'.", "link": "https://www.dagen.se/kultur/josefin-lilja-aer-jesustrenden-redan-oever-enligt-ungdomsbarometern/10271795", "date_display": "2026-03-26", "date_iso": "2026-03-26T10:08:09+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 182, "title": "Minutes from the monetary policy meeting on 18 March 2026", "summary": "Minutes from the monetary policy meeting on 18 March 2026", "title_original": "Protokoll från det penningpolitiska mötet den 18 mars 2026", "summary_original": "Protokoll från det penningpolitiska mötet den 18 mars 2026", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/protokoll-fran-det-penningpolitiska-motet-den-18-mars-2026/", "date_display": "2026-03-25", "date_iso": "2026-03-25T08:30:13+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "3 days old", "tags": []}, {"id": 183, "title": "SEK 240 million in new support to Ukraine", "summary": "The Government has presented a new support package to Ukraine for 2026 worth around SEK 240 million. The support includes SEK 150 million for the Ukrainian Red Cross for humanitarian operations. In addition, the support package is heavily focused on children’s needs, supporting the provision of school food in areas close to the frontline, promoting reforms for family-based care of children and supporting children’s mental health.", "title_original": "SEK 240 million in new support to Ukraine", "summary_original": "The Government has presented a new support package to Ukraine for 2026 worth around SEK 240 million. The support includes SEK 150 million for the Ukrainian Red Cross for humanitarian operations. In addition, the support package is heavily focused on children’s needs, supporting the provision of school food in areas close to the frontline, promoting reforms for family-based care of children and supporting children’s mental health.", "link": "https://www.government.se/press-releases/2026/03/sek-240-million-in-new-support-to-ukraine/", "date_display": "2026-03-23", "date_iso": "2026-03-23T14:52:19+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Sweden's support to Ukraine", "Benjamin Dousa"]}, {"id": 184, "title": "SEK 555 million in new humanitarian aid for Gaza", "summary": "After more than two years of war and suffering, children in Gaza are in acute need of health and medical care, psychosocial support, safety, nutrition and education. Initiatives in these areas are needed to lay the foundations for reconstruction and recovery. Sweden is now providing SEK 555 million in aid, which will be distributed between the UN Children’s Fund (UNICEF), the UN World Food Programme (WFP) and the United Nations Development Programme, and will help bring safety, stability and well-being to children in Gaza.", "title_original": "SEK 555 million in new humanitarian aid for Gaza", "summary_original": "After more than two years of war and suffering, children in Gaza are in acute need of health and medical care, psychosocial support, safety, nutrition and education. Initiatives in these areas are needed to lay the foundations for reconstruction and recovery. Sweden is now providing SEK 555 million in aid, which will be distributed between the UN Children’s Fund (UNICEF), the UN World Food Programme (WFP) and the United Nations Development Programme, and will help bring safety, stability and well-being to children in Gaza.", "link": "https://www.government.se/press-releases/2026/03/sek-555-million-in-new-humanitarian-aid-for-gaza/", "date_display": "2026-03-23", "date_iso": "2026-03-23T13:13:14+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Response to the situation in Israel/Palestine", "Benjamin Dousa"]}, {"id": 185, "title": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada and others on the Strait of Hormuz: 19 March 2026", "summary": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada, Republic of Korea, New Zealand, Denmark, Latvia, Slovenia, Estonia, Norway, Sweden, Finland, Czechia, Romania, Bahrain and Lithuania on the Strait of Hormuz.", "title_original": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada and others on the Strait of Hormuz: 19 March 2026", "summary_original": "Joint statement from the leaders of the United Kingdom, France, Germany, Italy, the Netherlands, Japan, Canada, Republic of Korea, New Zealand, Denmark, Latvia, Slovenia, Estonia, Norway, Sweden, Finland, Czechia, Romania, Bahrain and Lithuania on the Strait of Hormuz.", "link": "https://www.government.se/statements/2026/03/joint-statement-from-the-leaders-of-the-united-kingdom-france-germany-italy-the-netherlands-japan-canada-and-others-on-the-strait-of-hormuz-19-march-2026/", "date_display": "2026-03-20", "date_iso": "2026-03-20T20:17:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "8 days old", "tags": ["International", "Prime Minister's Office", "Energy", "Foreign and security policy", "Statement", "Ulf Kristersson"]}, {"id": 186, "title": "The policy rate remains unchanged at 1.75 percent", "summary": "The executive board has decided to leave the key interest rate unchanged at 1.75 percent and the interest rate is expected to remain at this level for some time to come. But the war in the Middle East makes the forecast very uncertain.  The Riksbank is following developments closely and will adapt monetary policy if the inflation and business cycle prospects require it.", "title_original": "Styrräntan oförändrad på 1,75 procent", "summary_original": "Direktionen har beslutat att lämna styrräntan oförändrad på 1,75 procent och räntan väntas ligga kvar på denna nivå under en tid framöver. Men kriget i Mellanöstern gör prognosen mycket osäker.  Riksbanken följer utvecklingen noga och kommer att anpassa penningpolitiken om inflations- och konjunkturutsikterna kräver det.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/styrrantan-oforandrad-pa-175-procent2/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:42:40+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "9 days old", "tags": []}, {"id": 187, "title": "The Riksbank lowers the interest rate on the supplementary liquidity facility", "summary": "In the Riksbank's monetary policy control system, the interest rate that shall apply to the banks' overnight deposits and lending in the Riksbank is specified. In the Riksbank's supplementary liquidity facility, banks can take loans against collateral such as covered bonds. The interest surcharge on the supplementary liquidity facility is now reduced from 0.75 percentage points to 0.30 percentage points above the policy rate. In addition, the Riksbank removes the restriction on the percentage of covered bonds that the banks may use as collateral for loans from the Riksbank. The changes come into effect on 8 April 2026, and are part of the Riksbank's long-term work to facilitate banks' adaptation to an environment with less excess liquidity.", "title_original": "Riksbanken sänker räntan på den kompletterande likviditetsfaciliteten", "summary_original": "I Riksbankens penningpolitiska styrsystem anges vilken ränta som ska gälla för bankernas in- och utlåning över natten i Riksbanken. I Riksbankens kompletterande likviditetsfacilitet kan bankerna ta lån mot säkerheter som exempelvis säkerställda obligationer. Räntepåslaget på den kompletterande likviditetsfaciliteten sänks nu från 0,75 procentenheter till 0,30 procentenheter över styrräntan. Dessutom tar Riksbanken bort begränsningen för hur stor andel säkerställda obligationer bankerna får använda som säkerhet vid lån från Riksbanken. Förändringarna träder i kraft den 8 april 2026, och är en del av Riksbankens långsiktiga arbete med att underlätta bankernas anpassning till en miljö med mindre överskottslikviditet.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/riksbanken-sanker-rantan-pa-den-kompletterande-likviditetsfaciliteten/", "date_display": "2026-03-19", "date_iso": "2026-03-19T08:29:00+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "9 days old", "tags": []}, {"id": 188, "title": "Sweden joins Pax Silica initiative", "summary": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "title_original": "Sweden joins Pax Silica initiative", "summary_original": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "link": "https://www.government.se/press-releases/2026/03/sweden-joins-pax-silica-initiative/", "date_display": "2026-03-17", "date_iso": "2026-03-17T17:05:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Innovation", "Maria Malmer Stenergard"]}, {"id": 189, "title": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "title_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels", "summary_original": "Statement by Minister for Energy, Business and Industry and Deputy Prime Minister Ebba Busch at the Energy Council meeting in Brussels on 16 March 2026.", "link": "https://www.government.se/speeches/2026/03/statement-by-minister-for-energy-business-and-industry-and-deputy-prime-minister-ebba-busch-at-the-energy-council-meeting-in-brussels/", "date_display": "2026-03-17", "date_iso": "2026-03-17T08:33:02+00:00", "source": "Government.se", "ministry": "Ministry of Climate and Enterprise", "type": "Official Information", "age_tag": "11 days old", "tags": ["Speech", "EU", "Ministry of Climate and Enterprise", "Energy", "Ebba Busch"]}, {"id": 190, "title": "Sweden provides humanitarian support to Lebanon", "summary": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "title_original": "Sweden provides humanitarian support to Lebanon", "summary_original": "Sweden is announcing a new SEK 65 million humanitarian aid package for Lebanon due to the ongoing military escalation between Israel and Hezbollah, which has caused a rapid deterioration in the humanitarian situation in the country. The support will be distributed among UN organisations, the International Red Cross and Red Crescent Movement and civil society to provide support and protection for people who now find themselves in the midst of the crisis.", "link": "https://www.government.se/press-releases/2026/03/sweden-provides-humanitarian-support-to-lebanon/", "date_display": "2026-03-16", "date_iso": "2026-03-16T16:26:07+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "12 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Benjamin Dousa"]}, {"id": 191, "title": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "title_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada", "summary_original": "Joint statement by the Prime Ministers of the Nordic countries and Canada, Oslo, 15 March 2026.", "link": "https://www.government.se/statements/2026/03/joint-statement-by-the-prime-ministers-of-the-nordic-countries-and-canada/", "date_display": "2026-03-15", "date_iso": "2026-03-15T10:33:42+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "13 days old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Civil defence", "Military defence"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
