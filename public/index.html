"https://www.svd.se/a/y593na/ungdomsprotester-rasar-i-indien-kackerlackspartiet-samlar-tusentals", "date_display": "2026-07-22", "date_iso": "2026-07-22T20:45:23+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 121, "title": "AI lift for Alphabet – beats expectations", "summary": "Google's parent company Alphabet beats expectations in its report for the second quarter. The company's AI-driven cloud service venture nearly doubled revenue.", "title_original": "AI-lyft för Alphabet – slår förväntningarna", "summary_original": "Googles ägarbolag Alphabet slår förväntningarna i sin rapport för det andra kvartalet. Bolagets AI-drivna molntjänstsatsning nära dubblerade omsättningen.", "link": "https://www.svd.se/a/XMz8Jm/alphabet-slar-forvantningarna", "date_display": "2026-07-22", "date_iso": "2026-07-22T20:14:25+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 122, "title": "Vervet: \"You trade with Russia, not us\"", "summary": "Danish shipyard Fayard has been criticized for servicing Russian tankers. Now the owners hit back in a letter about the EU's double standards: \"Fayard does not trade with Russia. The EU does\", they write.", "title_original": "Varvet: ”Ni handlar med Ryssland, inte vi”", "summary_original": "Danska skeppsvarvet Fayard kritiserats för att serva ryska tankfartyg. Nu slår ägarna tillbaka i ett brev om EU:s dubbelmoral: ”Fayard handlar inte med Ryssland. Det gör EU”, skriver de.", "link": "https://www.svd.se/a/5pr0LK/fayard-slar-tillbaka-ni-handlar-med-ryssland-inte-vi", "date_display": "2026-07-22", "date_iso": "2026-07-22T20:02:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 123, "title": "Man dead after falling from balcony – two arrested", "summary": "", "title_original": "Man död efter fall från balkong – två gripna", "summary_original": "", "link": "https://www.svd.se/a/Gx6aeV/man-har-fallit-fran-balkong-i-rinkeby-tva-gripna", "date_display": "2026-07-22", "date_iso": "2026-07-22T19:29:18+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 124, "title": "Putin needs a victory - can attack new targets", "summary": "Lithuania has recently increased its preparedness against Russian attacks. In addition, the president has said he can confirm reports that Russia may test NATO's cohesion by attacking the Baltics and Poland. - We don't know what political rationality looks like in Russia, so we can't rule this out, says Johan Norberg, analyst at Total Defense Research Institute FOI.", "title_original": "Putin behöver en seger – kan angripa nya mål", "summary_original": "Litauen har den senaste tiden höjt sin beredskap mot ryska angrepp. Dessutom har presidenten sagt sig kunna bekräfta rapporter om att Ryssland kan komma att testa Natos sammanhållning genom angrepp mot Baltikum och Polen. – Vi vet inte hur den politiska rationaliteten i Ryssland ser ut, så vi kan inte utesluta det här, säger Johan Norberg, analytiker på Totalförsvarets forskningsinstitut FOI.", "link": "https://www.dn.se/varlden/putin-behover-en-seger-kan-angripa-nya-mal/", "date_display": "2026-07-22", "date_iso": "2026-07-22T19:08:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Boys were to be sent home from kollo - started vandalizing the island", "summary": "A number of children have been sent home from Sweden's most famous colloquium after several serious incidents during the camp on Barnens ö outside Norrtälje.   The problems started already on the first day. According to Elias Gröön, responsible for the operation, it was about repeated incidents with a small group of boys, Dagens Nyheter reports.  - Some of it was very rough language, conflicts and behaviors that don't work in collo operations, says Elias Gröön to the newspaper.  Vandalized the farm Despite talks with guardians and efforts from the leaders, the problems continued. On the third day, the decision was made to send the boys home. The children had to spend the last night separated from the rest of the group at another farm. When the boys got the news the next morning, they reacted strongly.  - They started to make their way back to the farm they had previously been to. And then there was some vandalism, says Elias Gröön to DN.  According to Elias Gröön, they smashed windows and damaged vehicles. According to information sent out to parents, the addition was used in the vandalism, but no one is said to have been injured.  - The situation was perceived as threatening by both children and staff, says operations manager Elias Gröön.  Police were called in Police were called to the scene as the children were acting out. The case was later handed over to social services.  Kollot will now review the sequence of events to see if anything could have been handled differently. According to Elias Gröön, home delivery is the last measure the business takes. He believes that the goal is to find solutions so that children can remain on the ballot.", "title_original": "Pojkar skulle skickas hem från kollo – började vandalisera ön", "summary_original": "Ett antal barn har skickats hem från Sveriges mest kända kollo efter flera allvarliga incidenter under lägret på Barnens ö utanför Norrtälje.   Problemen började redan första dagen. Enligt Elias Gröön, ansvarig för verksamheten, handlade det om upprepade händelser hos en mindre grupp pojkar, rapporterar Dagens Nyheter.  – En del var väldigt grovt språk, konflikter och beteenden som inte fungerar i kolloverksamheten, säger Elias Gröön till tidningen.  Vandaliserade gården Trots samtal med vårdnadshavare och insatser från ledarna fortsatte problemen. På den tredje dagen fattades  beslutet om att skicka hem pojkarna. Barnen fick tillbringa den sista natten avskilda från resten av gruppen vid en annan gård. När pojkarna fick beskedet morgonen därpå reagerade de starkt.  – De började ta sig tillbaka till gården de tidigare varit på. Och då uppstod det en del skadegörelse, säger Elias Gröön till DN.  Enligt Elias Gröön krossade de rutor och skadade fordon. Enligt information som skickats ut till föräldrar användes tillhyggen vid vandaliseringen, men ingen person ska ha kommit till skada.  – Situationen upplevdes som hotfull av både barn och personal, säger verksamhetschefen Elias Gröön.  Polis kallades in Polis kallades till platsen då barnen var utåtagerande. Ärendet lämnades senare över till socialtjänsten.  Kollot ska nu gå igenom händelseförloppet för att se om något kunde ha hanterats annorlunda. Enligt Elias Gröön är hemskickning den sista åtgärden verksamheten tar till. Han menar att målet är att hitta lösningar så att barn ska kunna vara kvar på kollot.", "link": "https://www.tv4.se/artikel/18mhqvUBlC7oxT3dK4jdOh/barn-vandaliserade-kollolaeger-med-tillhyggen", "date_display": "2026-07-22", "date_iso": "2026-07-22T19:03:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/vandalisering", "/barn", "/polisforbundet"]}, {"id": 126, "title": "July 22: Don't miss today's news", "summary": "Kollobarn got away with the additions, Epstein's model scout found dead and the groceries getting more expensive – here are the news you can't miss from the day.", "title_original": "22 juli: Missa inte dagens nyheter", "summary_original": "Kollobarn gick loss med tillhyggen, Epsteins modellscout hittad död och matvarorna som blir dyrare – här är nyheterna du inte får missa från dagen.", "link": "https://www.dn.se/varlden/22-juli-missa-inte-dagens-nyheter/", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:58:58+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "The Swedes about the night of horror in the holiday gem: \"It was chaos\"", "summary": "During the night of Wednesday, a severe storm moved in over parts of the Balkans. At least two people have died in Albania, AFP reports.  Swedish Malin Sörensen was with her girlfriends in the Albanian coastal city of Saranda when the storm suddenly moved in. - In just a few minutes, a fog moved in so that you could not see further than 20 meters in front of you. After that, the power went out and you could only see something when the lightning struck, she says.  \"People screamed in fear\" Malin and her friends went down to the hotel restaurant to help, but were told to go back to their rooms. There they had to hold against the balcony doors while the storm raged outside.  - We heard glass panes smashing, furniture flying around and people screaming out of fear.  As the storm began to subside, they were greeted by a chaotic sight.  - The sea was filled with sunbeds, mattresses and rubbish.  \"The neighbor prayed to God\" In the city of Vlora, 23-year-old Edward Marini was also surprised by the storm. When the storm moved in, he and other guests were locked in the restaurant where they were. - It was completely insane. It was 42 degrees all day and then the storm came out of nowhere, he says.  - Parasols, chairs and tables flew around. Children were screaming and people were very worried.  After a few hours locked up, he was able to get home. There he saw the consequences of the storm.  - The neighbor prayed to God. It was total chaos. It was burning on the mountain behind us where the lightning had struck, he says. Several countries affected North Macedonia was also hit hard. In the capital Skopje, at least 30 people were injured and strong winds felled hundreds of trees. Buildings and vehicles were also damaged. In Bosnia and Herzegovina, above all in the region of Herzegovina, the damage to agriculture is described as catastrophic. - In the villages that were affected by the storm, our farmers will practically have nothing left to harvest, said Nevesinje mayor Milenko Avdalović.  The storm comes after several weeks of extreme heat and severe drought in large parts of Central Europe.", "title_original": "Svenskarna om skräcknatten i semesterpärlan: ”Det var kaos”", "summary_original": "Ett kraftigt oväder drog under natten mot onsdagen in över delar av Balkan. Minst två personer har dött i Albanien, rapporterar AFP.  Svenska Malin Sörensen befann sig tillsammans med sina tjejkompisar i den albanska kuststaden Saranda när ovädret plötsligt drog in. – På bara några minuter drog det in en dimma så att man inte kunde se längre än 20 meter framför sig. Därefter blev det strömlöst och man kunde endast se något när blixten slog ner, säger hon.  ”Folk skrek av rädsla” Malin och hennes vänner tog sig ner till hotellrestaurangen för att hjälpa till, men blev tillsagda att gå tillbaka till sina rum. Där fick de hålla emot balkongdörrarna medan stormen rasade utanför.  – Vi hörde glasrutor krossas, möbler flyga runt och folk som skrek av rädsla.  När ovädret började avta möttes de av en kaotisk syn.  – Havet fylldes av solbäddar, madrasser och skräp.  ”Grannen bad till Gud” I staden Vlora överraskades även 23-årige Edward Marini av ovädret. När stormen drog in låstes han och andra gäster in på restaurangen där de befann sig. – Det var helt sjukt. Det var 42 grader varmt hela dagen och sedan kom stormen från ingenstans, säger han.  – Parasoller, stolar och bord flög runt. Barn skrek och folk blev väldigt oroliga.  Efter några timmar inlåst kunde han ta sig hem. Där såg han följderna av ovädret.  – Grannen bad till Gud. Det var totalt kaos. Det brann på berget bakom oss där blixten hade slagit ner, säger han. Flera länder drabbade Även Nordmakedonien drabbades hårt. I huvudstaden Skopje skadades minst 30 personer och kraftiga vindar fällde hundratals träd. Även byggnader och fordon fick skador. I Bosnien och Hercegovina, framför allt i regionen Hercegovina, beskrivs skadorna på jordbruket som katastrofala. – I de byar som drabbades av ovädret kommer våra lantbrukare i praktiken inte att ha någonting kvar att skörda, sade Nevesinjes borgmästare Milenko Avdalović.  Ovädret kommer efter flera veckor av extrem värme och svår torka i stora delar av Centraleuropa.", "link": "https://www.tv4.se/artikel/24dr9YVC7KKBW66RcSJLIS/svenskarna-om-skraecknatten-i-semesterpaerlan-det-var-kaos", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:27:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/albanien", "/ovader", "/vadervarningar"]}, {"id": 128, "title": "The White House's new rules make it more difficult for foreign journalists in the US", "summary": "WASHINGTON. On Friday, the White House Correspondents' Dinner, which was interrupted by an assassination attempt in April, will resume. But the atmosphere between the president and the reporters is hardly at its best. Last week, new rules were hammered out that make it more difficult for foreign journalists to work in the US.", "title_original": "Vita husets nya regler försvårar för utländska journalister i USA", "summary_original": "WASHINGTON. På fredag återupptas Vita husets korrespondentmiddag, som avbröts av ett attentatsförsök i april. Men stämningen mellan presidenten och reportrarna är knappast på topp. I förra veckan klubbades nya regler som försvårar arbetet för utländska journalister i USA.", "link": "https://www.dn.se/varlden/vita-husets-nya-regler-forsvarar-for-utlandska-journalister-i-usa/", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:20:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Here Hibba, 38, learns to swim: \"I want to feel satisfied\"", "summary": "Summer and swimming go together for many Swedes, but not everyone is equally confident in the water. Every fifth Swede states that they are unsure if they can swim.\n\nAt Rosengårdsbadet in Malmö, a swimming school for adults takes place during the summer. The pool is one of three in the city that opens its pools for swimming training, as part of an initiative by the city of Malmö that has been going on for over five years and is free.\n\nThe 38-year-old swimming student Hibba Dai doesn't think it's embarrassing that she can't swim as an adult.\n\n- No. It's actually not a problem for me. You can always learn something new and it has nothing to do with age actually, she says. Swimming school adapted to the students Simeleven Melisse Obwamu grew up in a vibrant big city where the entrance fees to the pools were expensive.\n\n- I regret a little that I didn't learn to swim during my long life. But I'm glad I'm learning it now and here it's free, says Melissa Obwamu.\n\nAccording to the Swedish Lifesaving Society, 81 percent of Swedes state that they can swim 200 meters. However, men tend to overestimate their swimming ability, while swimming skills are often higher in younger people than in older people.\n\nThe swimming school is adapted to the level of the participants, according to swimming teacher Hampus Pålsson:\n\n- Some who come here can already swim, but want to get better at swimming and learn more swimming technique. Then there are those who are afraid of water and have no swimming experience. Many of our visitors often come from other countries. Wants to be able to help her children in the water Hibba Dai's goal is to feel safe in the water - even when she is out with her four children.\n\n- I am here to learn to swim and I also want to feel satisfied that as an adult I can manage in the water. And when I'm out with my children, I have the opportunity to save them too, she says.\n\nMelissa Obwamu hopes more people will take the chance to learn.\n\n- Being able to swim is very important.", "title_original": "Här lär sig Hibba, 38, simma: ”Vill känna mig nöjd”", "summary_original": "Sommar och bad hör ihop för många svenskar, men alla är inte lika trygga i vattnet. Var femte svensk uppger att de är osäkra på om de kan simma.\n\nPå Rosengårdsbadet i Malmö pågår under sommaren simskola för vuxna. Badet är ett av tre i staden som öppnar sina bassänger för simträning, inom ett initiativ från Malmö stad som pågått i över fem år och som är gratis.\n\nDen 38-åriga simeleven Hibba Dai tycker inte att det är pinsamt att hon i vuxen ålder inte kan simma.\n\n– Nej. det är faktiskt inget problem för mig. Man kan alltid lära sig något nytt och det har inte med ålder att göra faktiskt, säger hon. Simskola anpassad efter eleverna Simeleven Melisse Obwamu är uppväxt i en pulserande storstad där entréavgifterna till poolerna var dyra.\n\n– Jag ångrar lite att jag inte lärt mig simmat under mitt långa liv. Men jag är glad att jag lär mig det nu och här är det gratis, säger Melisse Obwamu.\n\nEnligt Svenska Livräddningssällskapet uppger 81 procent av svenskarna att de kan simma 200 meter. Män tenderar dock att överskatta sin simförmåga, samtidigt som simkunnigheten ofta är högre hos yngre än hos äldre.\n\nSimskolan anpassas efter deltagarnas nivå, enligt simläraren Hampus Pålsson:\n\n– Vissa som kommer hit kan redan simma, men vill bli bättre på att simma och lära sig mer simteknik. Sedan finns det de som är rädda för vatten och inte har någon simerfarenhet. Många av våra besökare kommer ofta från andra länder. Vill kunna hjälpa sina barn i vattnet Hibba Dais mål är att känna sig trygg i vattnet – även när hon är ute med sina fyra barn.\n\n– Jag är här för att jag ska lära mig simma och jag vill också känna mig nöjd med att jag som vuxen kan klara mig i vattnet. Och när jag är ute med mina barn har jag möjlighet att rädda dem också, säger hon.\n\nMelisse Obwamu hoppas att fler tar chansen att lära sig.\n\n– Att kunna simma är jätteviktigt.", "link": "https://www.tv4.se/artikel/q5a3d1z6lGJmzHiDqCfyF/haer-laer-sig-hibba-38-simma-vill-kaenna-mig-noejd", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:00:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/malmo", "/simkunnighet"]}, {"id": 130, "title": "Blood Rot, part 33 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 33 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-33-av-57/", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "DN Debate. \"Behind the platitudes about 'Swedishness' hides racism\"", "summary": "DN DEBATE. In the debate about \"Swedishness\" it is often portrayed as open to everyone. But only on paper. In the political rhetoric, the line is drawn again and again – away from culture and values ​​towards heritage, blood and soil. This is precisely why the talk about Swedishness and Swedish values ​​is not only empty, but also deeply political, writes economic historian Erik Thosteman.", "title_original": "DN Debatt. ”Bakom flosklerna om ’svenskhet’ döljer sig rasism”", "summary_original": "DN DEBATT. I debatten om ”svenskhet” utmålas den gärna som öppen för alla. Men bara på papperet. I den politiska retoriken dras gränsen gång på gång om – bort från kultur och värderingar mot arv, blod och jord. Just därför är pratet om svenskhet och svenska värderingar inte bara tomt, utan också djupt politiskt, skriver ekonomihistorikern Erik Thosteman.", "link": "https://www.dn.se/debatt/bakom-flosklerna-om-svenskhet-doljer-sig-rasism/", "date_display": "2026-07-22", "date_iso": "2026-07-22T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "The father's last memory before the crash: \"She is a hero\"", "summary": "A man in his 50s was in the driver's seat when the car drove into a gym in central Sundsvall on Monday evening. He had his ten-year-old daughter with him in the car. He is still shaken by the incident but now tells Sundsvall's newspaper how he just had time to tell his daughter that he was not feeling well before he passed out. \"My daughter took the wheel when I passed out, she is a hero,\" he writes to ST. Don't know why he fainted He says that he himself doesn't know why he became acutely ill, he has no documented illness before and was in good shape. The last thing he remembers is trying to stop the car. When the father passed out, the daughter managed to defend herself from a brick wall and instead drove through the glass window at Nordic Wellness.  The witness: \"Everyone screamed\" There were several people inside the gym. One of them was 20-year-old Charlie Viklund, who was in the middle of a biceps exercise on a machine near the exit. He tells Aftonbladet that it went off loudly like a bomb. - Everyone screamed. I thought someone tried to run someone over inside the gym. But then we saw the driver who didn't seem to be feeling well and a girl who was a passenger and completely cut, says Charlie Viklund to Aftonbladet. Woke up when the car was on its side When the father wakes up again, the car is on its side inside the gym. The car must have then traveled ten meters into the building before it stopped. They were helped to get out and then taken to hospital by ambulance. \"We spent the night in hospital but we are home now and are so grateful that no one was injured,\" the father writes to ST. No one is said to have been seriously injured, but the material damage inside the gym is said to be extensive. No suspicion of crime The car leaked flammable liquid and the emergency services had to carry out a safe recovery. The car was impounded, but the decision has now been lifted. The police established a suspicion of negligence in traffic in order to investigate what happened. But on Wednesday, the preliminary investigation was dropped because there is no indication that what happened was intentional", "title_original": "Pappans sista minne innan kraschen: ”Hon är en hjälte”", "summary_original": "En man i 50-årsåldern satt i förarsätet när bilen körde in i ett gym i centrala Sundsvall under måndagskvällen. Med sig i bilen hade han sin tioåriga dotter. Han är fortfarande omskakad av händelsen men berättar nu för Sundsvalls tidning hur han precis hann säga till sin dotter att han inte mådde bra innan han svimmade av. ”Min dotter tog ratten när jag var avsvimmad, hon är en hjälte”, skriver han till ST. Vet inte varför han svimmade Han berättar att han själv inte vet varför han blev akut sjuk, han har ingen dokumenterad sjukdom sedan tidigare och var i bra form. Det sista han minns är att han försökte stanna bilen. När pappan var avsvimmad lyckades dottern värja från en tegelvägg och körde i stället in genom glasfönstret på Nordic Wellness.  Vittnet: ”Alla skrek” Inne i gymmet befann sig flera personer. En av de var 20-åriga Charlie Viklund som var mitt i en bicepsövning på en maskin nära utgången. Han berättar för Aftonbladet att det small högt som en bomb. – Alla skrek. Jag tänkte att någon försökt köra över någon inne i gymmet. Men så såg vi föraren som inte verkade må så bra och en flicka som var passagerare och helt skärrad, säger Charlie Viklund till Aftonbladet. Vaknade upp när bilen låg på sidan När pappan vaknar upp igen ligger bilen på sidan inne i gymmet. Bilen ska då ha färdats tio meter in i byggnaden innan den stannade. De fick hjälp att ta sig ut och fördes sedan till sjukhus med ambulans. ”Vi tillbringade natten på sjukhus men vi är hemma nu och är så tacksamma att ingen blev skadad”, skriver pappan till ST. Ingen ska ha skadats allvarligt men de materiella skadorna inne i gymmet ska vara omfattande. Ingen misstanke om brott Bilen läckte brandfarlig vätska och räddningstjänsten fick genomföra en säker bärgning. Bilen togs i beslag men nu har beslutet hävts. Polisen upprättade en misstanke om vårdslöshet i trafik för att kunna utreda vad som hänt. Men under onsdagen lades förundersökningen ned eftersom inget tyder på att det som skett var avsiktligt.", "link": "https://www.tv4.se/artikel/4Spy6avyYWbCxDyUcM9cVN/pappans-sista-minne-innan-kraschen-hon-aer-en-hjaelte", "date_display": "2026-07-22", "date_iso": "2026-07-22T17:07:56+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Olycka", "/olycka", "/sundsvall", "/inrikes"]}, {"id": 133, "title": "Unprecedented excess mortality - alarms of \"extraordinary danger\"", "summary": "This is how the new heat waves hit Europe", "title_original": "Överdödlighet utan motstycke – larmar om ”extraordinär fara”", "summary_original": "Så slår nya värmeböljorna mot Europa", "link": "https://www.tv4.se/artikel/4MMm7OMIu5riDDjHA5qlxQ/livsfarlig-hetta-slar-mot-svenskfavoriten-extraordinaer-fara", "date_display": "2026-07-22", "date_iso": "2026-07-22T16:20:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 134, "title": "Boiling anger across the country: \"Killed him mercilessly\"", "summary": "On Sunday, the police were called to a district in Bologna after reports that a man was behaving aggressively. In a video clip spread on social media, two police officers are seen holding down 42-year-old Abderrahim Fakir, who is calling for help. Ambulance personnel stand by throughout the intervention and after two minutes the Moroccan-born man stops moving, reports the BBC. Several protests against excessive violence Since then, protests have followed one another against what is believed to be gross excessive violence on the part of the police. In Bologna and Rome, protesters and police have clashed, and both tear gas and water cannons have been used since cars were set on fire and several police officers were injured. Several eyewitnesses told Italian media that Fakir appeared to be in distress, but that he did not threaten anyone and that he was unarmed. - You can't die like this, his sister told the Italian media. - They killed him mercilessly, and I want the truth. Parallels to George Floyd While the incident is being investigated by prosecutors in Bologna, Fakir's death has raised parallels to George Floyd in the United States – the 46-year-old African-American man who died in connection with a police intervention, the Washington Post reports.\n\nAt the protests in Bologna, signs have also referred to other cases where people died in connection with police interventions, such as Stefano Cucchi, who died in 2009 after being detained for six days, the BBC writes.\n\nPrime Minister Giorgia Meloni says that Fakir's death must be \"thoroughly investigated\", but that nothing can justify violence against the police. \"Those who chose to use this event as a pretext to set the city on fire, attack the police and spread violence - thereby also endangering the safety of innocent bystanders who had nothing to do with the unrest - did not seek the truth: they sought confrontation,\" she writes in a post on X.", "title_original": "Kokande ilska över hela landet: ”Dödade honom skoningslöst”", "summary_original": "Under söndagen larmades polisen till en stadsdel i Bologna efter uppgifter om att en man betedde sig aggressivt. I ett videoklipp som sprids på sociala medier syns två poliser hålla ner den 42-årige Abderrahim Fakir, som ropar på hjälp. Ambulanspersonal står bredvid under hela ingripandet och efter två minuter slutar den marockanskfödde mannen att röra sig, rapporterar BBC. Flera protester mot övervåld Sedan dess har protesterna avlöst varandra mot det som man menar är grovt övervåld från polisens sida. I Bologna och Rom har demonstranter och polis drabbat samman, och både tårgas och vattenkanoner har använts sedan bilar satts i brand och flera poliser skadats. Flera ögonvittnen säger till italienska medier att Fakir verkade vara i nöd, men att han inte hotade någon och att han var obeväpnad. – Man kan inte dö så här, säger hans syster till italienska medier. – De dödade honom skoningslöst, och jag vill ha sanningen. Paralleller till George Floyd Samtidigt som händelsen utreds av åklagare i Bologna har Fakirs död väckt paralleller till George Floyd i USA – den 46-årige afroamerikanske mannen som dog i samband med ett polisingripande, rapporterar Washington Post.\n\nVid protesterna i Bologna har skyltar också hänvisat till andra fall där personer dött i samband med polisingripanden, som Stefano Cucchi, som avled 2009 efter att ha varit frihetsberövad i sex dagar, skriver BBC.\n\nPremiärminister Giorgia Meloni säger att Fakirs död måste ”utredas noggrant”, men att inget kan rättfärdiga våld mot polisen. ”De som valde att använda denna händelse som en förevändning för att sätta staden i brand, angripa poliser och sprida våld – och därmed också äventyra säkerheten för oskyldiga förbipasserande som inte hade något med oroligheterna att göra – sökte inte sanningen: de sökte konfrontation”, skriver hon i ett inlägg på X.", "link": "https://www.tv4.se/artikel/4BhLhHTh7u2oI10OKcXxm4/kokande-ilska-oever-hela-landet-doedade-honom-skoningsloest", "date_display": "2026-07-22", "date_iso": "2026-07-22T15:19:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/brott-och-straff", "/italien", "/polisvald", "/inrikes"]}, {"id": 135, "title": "Torger and his wife got stuck in the car wash - sat for an hour", "summary": "Torger Hagen and his wife Agneta were going to wash the car at OKQ8 in Västerås. When the first part was finished and they were about to enter the next hall, it stopped and Torger and Agneta got stuck in the unmanned car wash. - We sat there and looked around a bit and then saw some phone numbers that we called, says Torger Hagen.  No one answered the emergency number they called, despite the couple trying to arrive for half an hour. After the failed attempts, they called OKQ8 central. The woman who answered also tried to call the emergency number. Instead, a person from a staffing company had to go to the car wash. Torger and Agneta were told that they could press a button on one of the walls to open the doors.  - In the end, we got it up and were able to drive the car out. It was after almost an hour, says Torger Hagen.  Regrets the incident It all worked out in the end, but Torger highlights how it could have turned out inside the laundry hall.  - Imagine if you had claustrophobia and were sitting in the hall. It wouldn't have been so fun, he says.  As compensation, Torger Hagen has received a wash.  - We went there for a brushless car wash and are then offered a wash with brushes as compensation. It's not quite what you had in mind, he says.  OKQ8 regrets what happened in a written comment to VLT, which previously reported on the incident. \"The safety of our customers is always the highest priority. The on-call function must be manned around the clock and we are now investigating what has happened and why the help did not work as it should in this case\".", "title_original": "Torger och frun fastnade i biltvätten – satt i en timme", "summary_original": "Torger Hagen och hans fru Agneta skulle tvätta bilen på OKQ8 i Västerås. När första delen var klar och de skulle in i nästa hall tog det stopp och Torger och Agneta blev fast i den obemannade biltvätten. – Vi satt där och tittade runt lite grann och såg sedan några telefonnummer som vi ringde till, säger Torger Hagen.  Ingen svarade på journumret de ringde, trots att makarna försökte komma fram i en halvtimme. Efter de misslyckade försöken ringde de OKQ8 centralt. Kvinnan som svarade försökte även hon ringa journumret. I stället fick en person från ett bemanningsföretag åka till biltvätten. Torger och Agneta fick veta att de kunde trycka på en knapp på en av väggarna för att öppna dörrarna.  – Till slut så fick vi upp den och kunde köra ut bilen. Det var efter nästan en timme, säger Torger Hagen.  Beklagar händelsen Det hela löste sig till slut, men Torger lyfter hur det hade kunnat bli inne i tvätthallen.  – Tänk om man hade klaustrofobi och blev sittande i hallen. Det hade ju inte varit så kul, säger han.  Som kompensation har Torger Hagen fått en tvätt.  – Vi åkte dit för en borstlös biltvätt och blir sedan erbjudna en tvätt med borstar som kompensation. Det är väl inte riktigt vad man har tänkt sig, säger han.  OKQ8 beklagar det som hänt i en skriftlig kommentar till VLT, som tidigare rapporterat om händelsen. \"Säkerheten för våra kunder är alltid högsta prioritet. Jourfunktionen ska vara bemannad dygnet runt och vi undersöker nu vad som har hänt och varför hjälpen inte fungerade som den skulle i det här fallet\".", "link": "https://www.tv4.se/artikel/27ClkfGt6bdPkXx1S5L2Bd/torger-och-frun-fastnade-i-biltvaetten-satt-i-en-timme", "date_display": "2026-07-22", "date_iso": "2026-07-22T14:31:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/biltvatt", "/vasteras", "/inrikes"]}, {"id": 136, "title": "15 years ago Utøya: This is how it looked on TV4", "summary": "", "title_original": "15 år sedan Utøya: Så såg det ut i TV4", "summary_original": "", "link": "https://www.tv4.se/artikel/8APTulV7cgpVSsO4lzDlS/15-ar-sedan-utoya-sa-sag-det-ut-i-tv4", "date_display": "2026-07-22", "date_iso": "2026-07-22T13:53:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 137, "title": "Jørn saved young people in his own boat: \"Will come again at night\"", "summary": "TV4 meets him again – 15 years after the crime that shook Norway", "title_original": "Jørn räddade ungdomar i egna båten: ”Kommer igen om natten”", "summary_original": "TV4 möter honom igen – 15 år efter dådet som skakade Norge", "link": "https://www.tv4.se/artikel/Z9x4dU1qMkXbqnHa5wcFd/joern-raeddade-ungdomar-i-egna-baten-kommer-igen-om-natten", "date_display": "2026-07-22", "date_iso": "2026-07-22T13:49:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 138, "title": "Accused priest acquitted after property dispute in Södertälje", "summary": "Among the properties in the case is the former Baptist church in Södertälje. The priest who was charged is acquitted by the district court.", "title_original": "Åtalad präst frias efter fastighetsetshärvan i Södertälje", "summary_original": "Bland fastigheterna i målet finns den tidigare Baptistkyrkan i Södertälje. Den präst som åtalades frias av tingsrätten.", "link": "https://www.dagen.se/nyheter/atalad-praest-frias-efter-fastighetsetshaervan-i-soedertaelje/10450829", "date_display": "2026-07-22", "date_iso": "2026-07-22T13:45:04+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Swedish Ebba: Vulnerable girls never get justice", "summary": "The Swedish former photo model Ebba P Karlsson was contacted in the early 1990s by a Swedish man who offered her work abroad. On the spot, it turned out that the trusting scout had no modeling jobs to offer - instead, she stepped into a \"nightmare that never ended\". - I could have been dead today, she has said in an earlier interview with TV4 Nyheterna. Identified him via the Epstein documents With the help of images from the extensive Epstein documents, which began to leak out around the turn of the year, Ebba P Karlsson was able to identify the Swedish model scout. She then reported him to the police for raping her when she was 20 years old. Despite the fact that the crime was most likely time-barred, she hoped that the report would make more people dare to tell about their experiences. On Monday, the Swedish model scout was found dead in his home just outside Paris. According to Le Parisien, the man, who was in his 70s, died of cardiac arrest. Ebba P Karlsson is critical of the French police's delay in arresting him. - I reported him to the police in February together with four other women. In total, there are ten women who have come forward in France and given testimonies to the police. They have dragged out the investigation and not taken us seriously, she tells TV4 Nyheterna. According to the model scout's lawyer Ménya Arab-Tigrine, he requested on several occasions to be heard by the judiciary, but that it never happened. \"He was withdrawn by nature, but he still agreed to the stressful task of appearing in the media - he wanted so badly for the truth to come out,\" writes the lawyer to TV4 Nyheterna. \"Shocked, upset and sad\" TV4 News revealed at the beginning of the year that thousands of messages from the Epstein documents show how the Swedish model scout over a ten-year period had contact with Jeffrey Epstein and recruited women for him. The man is said to have also been suspected of rape and human trafficking. Among other things, he is suspected, according to Le Figaro, of having been inside", "title_original": "Svenska Ebba: Utsatta flickor får aldrig rättvisa", "summary_original": "Den svenska före detta fotomodellen Ebba P Karlsson kontaktades i början av 1990-talet av en svensk man som erbjöd henne arbete utomlands. På plats visade det sig att den förtroendeingivande scouten inte hade några modelljobb att erbjuda – i stället klev hon in i en ”mardröm som aldrig tog slut”. – Jag kunde ha varit död i dag, har hon sagt i en tidigare intervju med TV4 Nyheterna. Identifierade honom via Epsteindokumenten Med hjälp av bilder ur de omfattande Epsteindokumenten, som började sippra ut runt årsskiftet, kunde Ebba P Karlsson identifiera den svenske modellscouten. Därefter polisanmälde hon honom för att ha våldtagit henne när hon var 20 år. Trots att brottet med stor sannolikhet var preskriberat hoppades hon att anmälan skulle få fler att våga berätta om sina upplevelser. Under måndagen hittades den svenske modellscouten död i sin bostad strax utanför Paris. Enligt Le Parisien dog mannen, som var i 70-årsåldern, av hjärtstillestånd. Ebba P Karlsson är kritisk till att fransk polis dröjde med att anhålla honom. – Jag polisanmälde honom i februari tillsammans med fyra andra kvinnor. Totalt är det tio kvinnor som trätt fram i Frankrike och lämnat vittnesmål till polisen. De har dragit ut på utredningen och inte tagit oss på allvar, säger hon till TV4 Nyheterna. Enligt modellscoutens advokat Ménya Arab-Tigrine begärde han vid flera tillfällen att få höras av rättsväsendet, men att det aldrig blev av. ”Han var till sin natur tillbakadragen, men ändå gick han med på den påfrestande uppgiften att synas i media – han ville så gärna att sanningen skulle komma fram”, skriver advokaten till TV4 Nyheterna. ”Chockad, upprörd och ledsen” TV4 Nyheterna avslöjade i början av året att tusentals meddelanden ur Epsteindokumenten visar hur den svenske modellscouten under en tioårsperiod haft kontakt med Jeffrey Epstein och rekryterat kvinnor åt honom. Mannen ska även ha varit misstänkt för våldtäkt och människohandel. Bland annat misstänks han, enligt Le Figaro, ha varit inblandad i rekryteringen av en 22-årig tysk aspirerande modell som försvann spårlöst 2015. – Jag är chockad, upprörd och ledsen. Alla vi som utsatts är besvikna såklart. Tjejerna får aldrig någon chans att få rättvisa, sanningen får aldrig komma fram, säger Ebba P Karlsson. Innan sin död sade mannen i en intervju med CNN att han ångrade sin relation med Jeffrey Epstein, men han förnekade alla brott. Han uppgav också att han inte mindes Ebba P Karlsson och att han såg fram emot att möta henne i rätten. Ebba P Karlsson anmälde även modellscouten till svensk polis i april. – Nu måste det här undersökas i grunden. Vad är det egentligen som har hänt? säger hon. Advokaten: Han var oskyldig Om det stämmer att modellscouten dog av hjärtstillestånd menar hans advokat att det berodde på den ”olidliga väntan”. ”Skammen han fick bära – och som även drabbade hans närmaste – samt pressen och ångesten han levde med varje dag bidrog till det”, skriver advokaten. ”Han är död och han var oskyldig”.", "link": "https://www.tv4.se/artikel/h9G91CKLqfhh4jASXSQNP/svenska-ebba-utsatta-flickor-far-aldrig-raettvisa", "date_display": "2026-07-22", "date_iso": "2026-07-22T12:09:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Jeffrey Epstein", "/jeffrey-epstein", "/epstein-dokumenten", "/frankrike", "/utrikes"]}, {"id": 140, "title": "The activists know that it is interpreted as Jew-hatred - they just don't care", "summary": "Erik Helmerson: To trivialize the Holocaust is like using the n-word.", "title_original": "Aktivisterna vet att det tolkas som judehat – de bara bryr sig inte", "summary_original": "Erik Helmerson: Att trivialisera Förintelsen är som att använda n-ordet.", "link": "https://www.dagen.se/ledare/aktivisterna-vet-att-det-tolkas-som-judehat-de-bara-bryr-sig-inte/10450106", "date_display": "2026-07-22", "date_iso": "2026-07-22T12:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Preliminary investigation into Gaza sign closed", "summary": "The prosecutor: The criteria for incitement against a ethnic group are not met • The Jewish Central Council requests a review.", "title_original": "Förundersökning om Gazaskylt läggs ned", "summary_original": "Åklagaren: Kriterierna för hets mot folkgrupp är inte uppfyllda • Judiska centralrådet begär omprövning.", "link": "https://www.dagen.se/nyheter/foerundersoekning-om-gazaskylt-laeggs-ned/10450832", "date_display": "2026-07-22", "date_iso": "2026-07-22T11:07:45+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Extreme heat on holiday - this applies", "summary": "Several red warnings • \"Be educated about the risks\"", "title_original": "Extremhetta på semestern – det här gäller", "summary_original": "Flera röda varningar • \"Var påläst om riskerna\"", "link": "https://www.tv4.se/artikel/IFVklBkWnS7lHyakIIpFr/extremhetta-i-soedra-europa-inget-giltigt-skael-foer-avbokning", "date_display": "2026-07-22", "date_iso": "2026-07-22T10:07:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "Twelve-year-old is suspected of the knife attack in Helsingborg", "summary": "At the beginning of July, a five-year-old girl was seriously injured in a playground in Helsingborg. According to information to HD, the boy who attacked her is only 12 years old. He is suspected of attempted murder and is being cared for under the law with special provisions on the care of young people (LVU). The boy himself is said to have alerted the police and stated that he attacked a girl with a knife. According to information to TV4 Nyheterna, the attack was completely unprovoked and there is no known connection between the boy and the girl. Previously, no motive was clear and the police assessed the incident as isolated. Linked via email address HD and the Expo foundation now write in a review that there are links between the boy and a Tiktok account that celebrates school shootings and mass murderers. The link is based on the email address used for the account belonging to a relative of the boy.\n\nAt first, among other things, videos were published with Ai-animated cute animals and games, but later the account switched to sharing clips of school shooters and mass murderers. Among other things, a slideshow of clothes worn by the Columbine High School killers was published, framed with a cute Tiktok filter and glittering stars. The shares stopped last Friday. Days after the attack on the girl in Helsingborg, the account began to share a number of tributes to mass murderers. A recurring person is Elliot Rodger, a misogynistic murderer who, according to Sydsvenskan/HD, is glorified in incel circles.\n\n- In short, it's about a community of people who are obsessed with mass murderers. And which builds up a kind of fandom, a kind of cult around these people. It could be a school shooter, it could be terrorists, says Morgan Finnsiö at Expo. The shares on the Tiktok account stopped last Friday. If the boy had contact with people in violent groups, the newspaper has not been able to establish anything.", "title_original": "Tolvåring misstänks för knivdådet i Helsingborg", "summary_original": "I början på juli skadades en femårig flicka allvarligt i en lekpark i Helsingborg. Enligt uppgifter till HD är pojken som attackerade henne bara 12 år gammal. Han misstänks för mordförsök och är omhändertagen enligt lagen med särskilda bestämmelser om vård av unga (LVU). Pojken ska själv ha larmat polisen och uppgett att han attackerat en flicka med kniv. Enligt uppgifter till TV4 Nyheterna var attacken helt oprovocerad och det finns ingen känd koppling mellan pojken och flickan. Tidigare var inget motiv klarlagt och polisen bedömde händelsen som isolerad. Kopplas via mejladress Nu skriver HD och stiftelsen Expo i en granskning att det finns kopplingar mellan pojken och ett Tiktok-konto som hyllar skolskjutningar och massmördare. Kopplingen bygger på att mejladressen som används för kontot tillhör en närstående till pojken.\n\nTill en början publicerades bland annat videor med Ai-animerade söta djur och spel, men senare övergick kontot till att dela klipp på skolskyttar och massmördare. Bland annat publicerades ett bildspel med kläder som bars av Columbine High School-mördarna, inramat med ett gulligt Tiktok-filter och glittrande stjärnor. Delningarna upphörde i fredags Dagarna efter attacken mot flickan i Helsingborg började kontot dela en mängd hyllningar till massmördare. En återkommande person är Elliot Rodger, en kvinnohatande mördare som enligt Sydsvenskan/HD glorifieras i incelkretsar.\n\n– I korthet så handlar det om ett community av människor som är besatta av massmördare. Och som bygger upp en sorts fandom, en sorts kult kring de här personerna. Det kan vara skolskjutare, det kan vara terrorister, säger Morgan Finnsiö på Expo. Delningarna på Tiktok-kontot upphörde i fredags. Om pojken haft kontakt med personer i våldsbejakande grupper är inget tidningen kunnat slå fast.", "link": "https://www.tv4.se/artikel/IHPpBS393muAb8eF3CpUl/tolvaring-misstaenks-foer-knivdadet-i-helsingborg", "date_display": "2026-07-22", "date_iso": "2026-07-22T07:53:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Helsingborg", "/helsingborg", "/inrikes"]}, {"id": 144, "title": "Every tenth person hides financial debts in their relationship", "summary": "Planning for joint purchases or housing is a big milestone in a relationship. But many wait to tell about financial problems, and then a hidden financial debt can put an end to the plans. - It can be like a lifelong dream being crushed. You need to change the entire future plan, says lawyer Bianca Rönngren. According to a new SIFO survey from Familjens Jurist, approximately one in ten Swedes has withheld financial problems or debts from their partner. Taboo subject Rönngren believes that the subject is taboo and often associated with shame. - You may not want to admit that you have incurred debts. It could be consumer debt, unsecured loans, various types of debt. There is an aspect of it being shameful and embarrassing I have observed. In case of separation, hidden debts can lead to unexpected financial consequences. In a property division, assets and liabilities must be added up and divided, which can mean that the person who has no debts gets less than expected. - The other person may then have to share more with their partner in a way they might not have expected, says Rönngren. Different rules for cohabitants and married couples For cohabitants, only the home and household goods are shared in a separation, while married couples have a more extensive financial community. But in no case will you be responsible for your partner's private debts - unless they are joint. Beyond the legal, undiscovered hidden debts can make a separation even more vulnerable. - Separations are sometimes fraught with conflict. You need to solve the legal but also the emotional, which comes up a lot, says Bianca Rönngren. Important to talk about finances The lawyer urges couples to dare to talk about finances and expectations early in the relationship. She believes that one should see it as an act of consideration for one's partner. - You often hear that talking about money is unromantic. But you can see it as taking care of your partner by telling them about your own financial circumstances so that you can get along well", "title_original": "Var tionde person döljer ekonomiska skulder i sin relation", "summary_original": "Att planera för gemensamma inköp eller bostad är en stor milstolpe i ett förhållande. Men många väntar med att berätta om ekonomiska problem, och då kan en dold ekonomisk skuld sätta stopp för planerna. – Det kan vara som att en livsdröm krossas. Man behöver lägga om hela framtidsplanen, säger juristen Bianca Rönngren. Enligt en ny SIFO-undersökning från Familjens Jurist har ungefär var tionde svensk undanhållit ekonomiska problem eller skulder från sin partner. Tabubelagt ämne Rönngren menar att ämnet är tabubelagt och ofta förknippat med skam. – Man kanske inte vill erkänna att man har dragit på sig skulder. Det kan ju röra sig om konsumtionsskulder, blancolån, olika typer av skulder. Det finns en aspekt av att det är skambelagt och pinsamt har jag observerat. Vid separation kan dolda skulder leda till oväntade ekonomiska konsekvenser. I en bodelning ska tillgångar och skulder räknas samman och delas, vilket kan göra att den som inte har skulder får mindre än väntat. – Den andra kan då behöva dela med sig av mer till sin partner på ett sätt man kanske inte hade räknat med, säger Rönngren. Olika regler för sambor och gifta För sambor är det bara bostad och bohag som delas vid en separation, medan gifta par har en mer omfattande ekonomisk gemenskap. Men i inget fall blir man ansvarig för sin partners privata skulder – såvida de inte är gemensamma. Utöver det juridiska kan oupptäckta dolda skulder göra en separation ännu mer sårbar. – Separationer är ju ibland konfliktfyllda. Man behöver lösa det juridiska men också det känslomässiga som kommer upp väldigt mycket, säger Bianca Rönngren. Viktigt att prata om ekonomi Juristen uppmanar par att våga prata om ekonomi och förväntningar tidigt i relationen. Hon menar att man ska se det som en handling av hänsyn till sin partner. – Man får ofta höra att prata om pengar är oromantiskt. Men man kan se det som att man tar hand om sin partner genom att berätta om sina egna ekonomiska förutsättningar så att man kan fatta bra gemensamma beslut tillsammans, säger hon. För den som vill värna sin ekonomiska autonomi finns juridiska lösningar, som samboavtal och äktenskapsförord. Men det viktigaste är att undvika att bygga upp dolda skulder. – Köp det ni vill med pengar som ni har, är mitt tips, säger Bianca Rönngren.", "link": "https://www.tv4.se/artikel/52WKIlO6TlDyo3I0vUMXry/hemlig-ekonomi-i-relationen-kan-krossa-framtidsplanerna", "date_display": "2026-07-22", "date_iso": "2026-07-22T07:50:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Relationer", "/relationer", "/jamstalld-ekonomi", "/privatekonomi", "/jurist", "/gift", "/nyhetsmorgon"]}, {"id": 145, "title": "Ljubisa, 61, was sucked out of the plane: \"Hear the sound every night\"", "summary": "In the early morning of July 10, Serbian Ljubisa Karović, 61, was on a Ryanair flight en route from Greece to Germany to celebrate her brother's birthday. He had a window seat, 11F. Suddenly, Karović heard a bang, and his body was sucked out of the airplane window. - It is that sound, the sound before the chaos, that is always heard when I try to sleep, he tells The Guardian. His upper body was flung out the window and he instantly lost consciousness. The head and right arm were outside the window 4,500 meters up in the air in a plane traveling at over 600 kilometers per hour. It went on for nearly two minutes. The hero pulled him back: \"Forever grateful\" Ljubisa Karović and his wife Svetlana, who sat three rows behind, pay tribute to the man who saved his life, an Albanian. pulled him back into the plane, and tried to block the window with a bag. - It was sucked out immediately, but then they put a larger suitcase there, which worked. We are eternally grateful to him. Pictures from the interview show him sitting with a neck collar. He will have it for at least another six weeks. He has burns and wounds on one arm. - I was lucky. I don't remember much and my head and neck hurt, but I'm still alive. It might have been the seat belt, but maybe it was fate. I am a man of faith and I thank God every day, he says. The dispute: Paralyzed by fear Ljubisa Karović lawyer is dissatisfied with Ryanair. - We have no complaints about the pilot, who adhered to the safety protocol and handled the situation very well. But the cabin crew did not help at all, but were \"paralyzed by fear\", according to the lawyer. The airline is hitting back, saying they did a \"phenomenal job\". If a plane loses altitude rapidly and loses pressure, all passengers and staff must put on belts and oxygen masks, they say. \"As soon as the plane was at a safe altitude, our staff approached Mr. Karović and moved him to another location. A doctor on board sat with them until the plane landed on", "title_original": "Ljubisa, 61, sögs ut från flygplanet: ”Hör ljudet varje natt”", "summary_original": "Tidigt på morgonen den 10 juli satt serbiske Ljubisa Karović, 61, på ett Ryanairflyg på väg från Grekland till Tyskland för att fira sin brors födelsedag. Han hade fönsterplats, 11F. Plötsligt hörde Karovićen smäll, och hans kropp sögs ut genom flygplansfönstret. – Det är det ljudet, ljudet före kaoset, som alltid hörs när jag försöker sova, säger han till The Guardian. Hans överkropp slungades ut mot fönstret och han tappade omedelbart medvetandet. Huvudet och högerarmen var utanför fönstret 4500 meter upp i luften i ett plan som färdades i över 600 kilometer i timmen. Det pågick i nära två minuter. Hjälten drog tillbaka honom: ”Evigt tacksamma” Ljubisa Karović och hans fru Svetlana, som satt tre rader bakom, hyllar mannen som räddade hans liv, en alban. drog tillbaka honom i planet, och försökte blockera fönstret med en väska. – Den sögs ut direkt, men sedan satte de en större resväska där, som fungerade. Vi är evigt tacksamma till honom. Bilder från intervjun visar hur han sitter med en nackkrage. Den ska han ha i minst sex veckor till. Han har brännskador och sår på ena armen. – Jag hade tur. Jag minns inte mycket och jag har ont i huvudet och nacken, men jag lever fortfarande. Det kan ha varit säkerhetsbältet, men kanske var det ödet. Jag är en troende man och jag tackar Gud varje dag, säger han. Dispyten: Paralyserade av skräck Ljubisa Karović advokat är missnöjd med Ryanair. – Vi har inga klagomål på piloten, som höll sig till säkerhetsprotokollet och hanterade situationen jättebra. Men kabinpersonalen hjälpte inte till alls, utan var ”paralyserade av skräck”, menar advokaten. Flygbolaget slår tillbaka mot det och säger att de gjorde ett ”fenomenalt jobb”. Om ett plan tappar höjd fort och förlorar tryck måste alla passagerare och personal sätta på sig bälte och syrgasmask, menar de. ”Så fort planet var på en säker höjd gick vår personal fram till Mr. Karović och flyttade honom till en annan plats. En doktor ombord satt med dem fram tills att planet landet på Thessaloniki, och väl därframme fanns vårdpersonal”, skriver de i ett uttalande till The Guardian.", "link": "https://www.tv4.se/artikel/3AhdZem4aexCB3lweYDdI/ljubisa-61-soegs-ut-fran-flygplanet-hoer-ljudet-varje-natt", "date_display": "2026-07-22", "date_iso": "2026-07-22T07:18:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/flygplan", "/olycka"]}, {"id": 146, "title": "The Liberals at historically low levels: \"A tough situation\"", "summary": "In the survey conducted by TV4 and Novus, 5,726 Swedes were asked what they would have voted for if there were an election today. The measurement shows, among other things, that the Moderates have increased the most of the Tidö parties by 0.7 percentage points, and they thus receive voter support of 17.3 percent. But the red-green bloc still leads with 7.8 percentage points over the Tidö parties.\n\nThe Liberals, on the other hand, end up at the lowest measured level in Novus' history, since 2006, but even if you look back at the Swedish Gallup Institute's previous surveys, the party has never had such a low level.\n\n- For a long time, we have had a tough opinion situation and the government question has been like a wet blanket over us. Now we have made a clear decision and if you want to continue to have a bourgeois government, the liberals must enter the Riksdag. It's a very serious situation if you don't want to see a strong left turn in Swedish politics, says Fredrik Brange (L), party secretary. Losing voters to MP - due to heat waves SD, KD, the Green Party and the Center Party increase slightly in the survey.\nThe Left Party is the party that decreases the most with 1.1 percentage points and according to the survey they have lost the most voters to the Green Party. Something that Torbjörn Sjöström, chairman of the Novus board, links to the climate issue.\n\n- The heat waves during the summer and the reminder of how dependent on oil we are due to the war in Iran, seem to have influenced the voters of the left. Since the climate issue is an issue that is strong for both V and MP, we see that the left's voters go to MP to an increasingly large extent precisely because of this, says Torbjörn Sjöström.", "title_original": "Liberalerna på historiskt låga nivåer: ”Ett tufft läge”", "summary_original": "I undersökningen gjord av TV4 och Novus tillfrågades 5 726 svenskar vad de hade röstat på om det var val idag. Mätningen visar bland annat att Moderaterna har ökat mest av Tidöpartierna med 0,7 procentenheter och de får därmed ett väljarstöd på 17,3 procent. Men det rödgröna blocket leder fortfarande med 7,8 procentenheter över Tidöpartierna.\n\nLiberalerna däremot hamnar på den lägst uppmätta nivån i Novus historia, sedan 2006, men även om man blickar tillbaka på Svenska Gallupinstitutets tidigare undersökningar har partiet aldrig haft en så låg nivå.\n\n– Vi har under lång tid haft ett tufft opinionsläge och regeringsfrågan har legat som en våt filt över oss. Nu har vi fattat ett tydligt beslut och vill man fortsätta ha en borgerlig regering måste liberalerna komma in i riksdagen. Det är ett väldigt allvarligt läge om man inte vill se en kraftig vänstersväng i svensk politik, säger Fredrik Brange (L) partisekreterare. Tappar väljare till MP – på grund av värmeböljor SD, KD, Miljöpartiet och Centerpartiet ökar något i mätningen.\nVänsterpartiet är det parti som minskar mest med 1,1 procentenhet och enligt undersökningen har de tappat flest väljare till Miljöpartiet. Något som Torbjörn Sjöström, styrelseordförande Novus kopplar till klimatfrågan.\n\n– Värmeböljorna under sommaren och påminnelsen om hur oljeberoende vi är på grund av kriget i Iran, verkar ha påverkat vänsterns väljare. Eftersom klimatfrågan är en fråga som är stark hos både V och MP, så ser vi att vänsterns väljare går till MP i allt större omfattning just på grund av detta, säger Torbjörn Sjöström.", "link": "https://www.tv4.se/artikel/4pktq1kzoYNcYvxNypPDhx/liberalerna-pa-historiskt-laga-nivaer-ett-tufft-laege", "date_display": "2026-07-22", "date_iso": "2026-07-22T05:33:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Valet 2026", "/valet-2026", "/politik"]}, {"id": 147, "title": "Tick ​​plague – TBE cases skyrocket", "summary": "There is an ongoing tick plague where a substantial increase in Swedes is infected by TBE. The number of cases this year up to and including July 20 amounts to 213, which can be compared with 111 and 138 cases respectively for the same period in 2024 and 2025. The reason for the increase, according to the Public Health Authority, is climate change, where the warmer climate with earlier springs favors the ticks. The weather also means that people are out and about more – and attract more ticks. The climate has been favorable for ticks and the rodent population that carries the virus, says Ulrika Marking, infectious disease doctor at the Public Health Agency. Six percent increase Marking goes on to say that the total number of TBE cases per year is definitely increasing. She explains that it does not rise gradually exactly every year, but that the increase becomes particularly noticeable if you look at a longer period of time. Looking at the last ten-year period, we are talking about an increase of six percent annually on average. In 2025, the total number was up to 503 TBE cases. In 2024, the figure was 384 infected. National statistics are missing Despite the increase in TBE, there are no national statistics on what protection the Swedes have. The Public Health Agency does not keep statistics on vaccinations but says that it is something they advocate. It is absolutely such a project that we are working to make it a reality. A complete register makes it easier to look at the follow-up of recommendations and vaccine effects. Statistics are kept for the general vaccination programs for children, which include tetanus, measles and mumps. Vaccinations for adults, on the other hand, are seen as recommendations based on, among other things, age and state of health, and it is the regions themselves that decide how these are offered. A region that is constantly among the most vulnerable in the country is Sörmland. For several years, the region has therefore had vaccine subsidies which mean that TBE vaccination is free for children 3–18. Regions such as Uppsala, Västmanland and Östergötland have also introduced the same subsidy. Serious consequences TBE", "title_original": "Fästingplåga – TBE-fallen skjuter i höjden", "summary_original": "Det pågår en fästingplåga där en rejäl ökning av svenskar smittas av TBE. Antalet fall i år fram till och med den 20 juli uppgår till 213 stycken, vilket kan jämföras med 111 respektive 138 fall för samma period 2024 och 2025. Anledningen till ökningen enligt Folkhälsomyndigheten är klimatförändringarna, där det varmare klimatet med tidigarelagda vårar gynnar fästingarna. Vädret gör också att människor är ute och rör sig mer – och drar på sig fler fästingar. Klimatet har varit gynnsamt för fästingar och den gnagarpopulation som bär på viruset, säger Ulrika Marking, infektionsläkare vid Folkhälsomyndigheten. Sex procents ökning Marking säger vidare att det totala antalet TBE-fall per år definitivt ökar. Hon förklarar att det inte stiger gradvis exakt varje år, men att ökningen blir särskilt påtaglig om man ser till en längre tidsperiod. Sett till den senaste tioårsperioden pratar vi om en ökning på sex procent årligen i snitt. Under 2025 var det totala antalet uppe i 503 TBE-fall. 2024 låg siffran på 384 smittade. Nationell statistik saknas Trots ökningen av TBE finns ingen nationell statistik över vilket skydd svenskarna har. Folkhälsomyndigheten för inte statistik över vaccinationerna men säger att det är något man förespråkar. Det är absolut ett sådant projekt som vi jobbar för ska bli verklighet. Ett komplett register underlättar för att titta på uppföljningen av rekommendationer och vaccineffekter. Statistik förs för de allmänna vaccinationsprogrammen för barn där bland annat stelkramp, mässling och påssjuka ingår. Vaccinationer för vuxna ses däremot som rekommendationer utifrån bland annat ålder och hälsotillstånd, och det är regionerna själva som avgör hur dessa erbjuds. En region som ständigt tillhör de värst utsatta i landet är Sörmland. Sedan flera år har regionen därför vaccinsubventioner som innebär att TBE-vaccination är gratis för barn 3–18. Även regioner som Uppsala, Västmanland och Östergötland har infört samma subvention. Allvarliga konsekvenser TBE räknas som en allvarlig sjukdom som kan ge ytterst svåra följder. Många får inga eller endast milda symtom, men det finns också en stor risk för att utveckla neurologiska symtom som ibland inkluderar hjärninflammation, säger Marking. Då blir man personlighetsförändrad, kan få motoriska bortfall så att man inte kan gå, eller inte använda en del av kroppen. Man kan till och med bli medvetslös och i värsta fall dö.", "link": "https://www.tv4.se/artikel/tt-260722-tbesmitta1-5b61cc23/fastingplaga-tbe-fallen-skjuter-i-hojden", "date_display": "2026-07-22", "date_iso": "2026-07-22T04:44:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sverige", "/sverige", "/uppsala", "/ostergotland", "/folkhalsomyndigheten", "/vastmanland", "/inrikes", "/fastingar"]}, {"id": 148, "title": "How far can Sweden go in the fight against the shadow society?", "summary": "Erik Helmerson: The exceptions in the new \"disclosure law\" were necessary.", "title_original": "Hur långt får Sverige gå i kampen mot skuggsamhället?", "summary_original": "Erik Helmerson: Undantagen i den nya ”angiverilagen” var nödvändiga.", "link": "https://www.dagen.se/ledare/hur-langt-far-sverige-ga-i-kampen-mot-skuggsamhaellet/10448483", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "\"I am ashamed of how little patience I have with my children\"", "summary": "Opinion writer Susanna Birgersson answers 20 questions in Dagen's summer series.", "title_original": "”Jag skäms över hur lite tålamod jag har med mina barn”", "summary_original": "Opinionsskribenten Susanna Birgersson svarar på 20 frågor i Dagens sommarserie.", "link": "https://www.dagen.se/kultur/jag-skaems-oever-hur-lite-talamod-jag-har-med-mina-barn/10432652", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "The church does not allow itself to be imprisoned by political etiquette", "summary": "The Christian faith does not coincide with any ideological map, writes Jacob Rudenstrand in a concluding remark.", "title_original": "Kyrkan låter sig inte fängslas av politisk etikett", "summary_original": "Den kristna tron sammanfaller inte med någon ideologisk karta, skriver Jacob Rudenstrand i en slutreplik.", "link": "https://www.dagen.se/debatt/kyrkan-later-sig-inte-faengslas-av-politisk-etikett/10447324", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "\"People almost always ask for Anna when I'm called up\"", "summary": "Congratulations on the name day, Magdalena Vogt!", "title_original": "”Folk frågar nästan alltid efter Anna när jag ropas upp”", "summary_original": "Grattis på namnsdagen, Magdalena Vogt!", "link": "https://www.dagen.se/familj/folk-fragar-naestan-alltid-efter-anna-naer-jag-ropas-upp/10410579", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "Robinson pastor stepped on poisonous caterpillar at Christian campsite: \"It was unbearable\"", "summary": "Lovisa Almén, pastor of Bethlehem Church in Gothenburg: \"It was brutal, now I laugh.\"", "title_original": "Robinson-pastorn klev på giftig larv på kristen camping: ”Det var outhärdligt”", "summary_original": "Lovisa Almén, pastor i Betlehemskyrkan i Göteborg: ”Det var brutalt, nu skrattar jag.”", "link": "https://www.dagen.se/nyheter/robinson-pastorn-klev-pa-giftig-larv-pa-kristen-camping-det-var-outhaerdligt/10449353", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "Successful peace work in Ethiopia awaits continued Swedish support", "summary": "PMU mediates peace in centuries-old conflict - but the support from Sweden may end at the turn of the year.", "title_original": "Framgångsrikt fredsarbete i Etiopien väntar på fortsatt svenskt stöd", "summary_original": "PMU mäklar fred i flerhundraårig konflikt – men stödet från Sverige kan upphöra till årsskiftet.", "link": "https://www.dagen.se/nyheter/framgangsrikt-fredsarbete-i-etiopien-vaentar-pa-fortsatt-svenskt-stoed/10446206", "date_display": "2026-07-22", "date_iso": "2026-07-22T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "After the protests - Zelensky fires the commander-in-chief", "summary": "Ukrainian President Volodymyr Zelenskyy replaces Commander-in-Chief Oleksandr Syrskyy after several days of widespread protests around the country where demonstrators demanded his resignation. On Telegram, Zelenskyy announces that officer Mychajlo Drapatyj will take over as the new commander-in-chief. \"We all have the same desire - to defeat the enemy and create such conditions at the front and such pressure on Russia that will make it possible to force Russia to peace. Tomorrow we will formalize all decisions. Ukraine must come out of this situation strengthened, and it will be more difficult for Russia. Glory to Ukraine!\", he writes.  Demands from protesters According to the Kyiv Independent, Drapatyj was singled out as one of the protesters' favorites to replace Syrskyj. According to the site, thousands of people are said to have shouted his name during the protests. Russia expert Malcolm Dixelius believes that the demonstrations showed that Zelenskyi could no longer ignore the dissatisfaction with Syrskyi. - The extensive demonstrations around the country have shown Zelenskyi that he will not be able to cope with the problems with the staffing of the Ukrainian army with Syrskyi as commander-in-chief, he says. According to Dixelius, the criticism has also been about the morale within the army. - Morale within the army also seems to be failing with a commander-in-chief who does not care about serious misconduct discovered in some units. Fedorov managed to create expectations of Ukrainian success in a short time, he says and adds: - A new commander-in-chief and new defense minister must take advantage of these opportunities so that more Ukrainians will be willing to stand up and fight against Russia. The former Minister of Defense Mychajlo Fedorov had to leave the post after only six months. Many Ukrainians have singled him out as one of the most important figures behind the country's military modernization and success.  Continued pressure The protesters have in recent days demanded that Fedorov return as defense minister. At the same time, they have directed harsh criticism at Syrskyj, which according to", "title_original": "Efter protesterna – Zelenskyj sparkar överbefälhavaren", "summary_original": "Ukrainas president Volodymyr Zelenskyj byter ut överbefälhavaren Oleksandr Syrskyj efter flera dagars omfattande protester runt om i landet där demonstranter krävt hans avgång. På Telegram meddelar Zelenskyj att officeren Mychajlo Drapatyj tar över som ny överbefälhavare. ”Vi har alla samma önskan – att besegra fienden och skapa sådana förhållanden vid fronten och sådant tryck på Ryssland som gör det möjligt att tvinga Ryssland till fred. I morgon kommer vi att formalisera alla beslut. Ukraina måste gå stärkt ur denna situation, och det kommer att bli svårare för Ryssland. Ära åt Ukraina!”, skriver han.  Krav från demonstranter Enligt Kyiv Independent pekades Drapatyj ut som en av demonstranternas favoriter att ersätta Syrskyj. Enligt sajten ska tusentals personer ha ropat hans namn under protesterna. Rysslandskännaren Malcolm Dixelius menar att demonstrationerna visat att Zelenskyj inte längre kunde ignorera missnöjet med Syrskyj. – De omfattande demonstrationerna runt om i landet har visat Zelenskyj att han inte kommer att klara problemen med bemanningen av den ukrainska armén med Syrskyj som överbefälhavare, säger han. Enligt Dixelius har kritiken också handlat om moralen inom armén. – Moralen inom armén verkar också svikta med en överbefälhavare som inte bryr sig om allvarliga missförhållanden som uppdagats inom vissa förband. Fedorov lyckades på kort tid skapa förväntningar om ukrainska framgångar, säger han och tillägger: – En ny överbefälhavare och ny försvarsminister måste tillvarata dessa möjligheter för att fler ukrainare ska vara villiga att ställa upp och slåss mot Ryssland. Den tidigare försvarsministern Mychajlo Fedorov fick lämna posten efter bara sex månader. Många ukrainare har pekat ut honom som en av de viktigaste personerna bakom landets militära modernisering och framgångar.  Fortsatt press Demonstranterna har under de senaste dagarna krävt att Fedorov kommer tillbaka som försvarsminister. Samtidigt har de riktat hård kritik mot Syrskyj, som enligt flera bedömare hamnat i en maktkamp med den tidigare ministern. – Dagens tillställning är ingen protest – det är en aktion som fokuserar på våra krav. Därefter blir det ett uppehåll på tre dagar fram till fredag. Och om vårt krav uppfylls senast på fredag kommer vi att avbryta aktionen, sa en av organisatörerna till demonstrationerna, veteranen Dmytro Koziatynskyi, till Kyiv Independent under måndagen.  Det återstår att se om överbefälhavarens avgång räcker för att få protesterna att upphöra. Enligt flera medier har Fedorov tackat nej till alternativa erbjudanden från Zelenskyj och uppges endast vara intresserad av att återvända som försvarsminister.", "link": "https://www.tv4.se/artikel/4jopBrsaHUD9blMMgF9wH5/zelenskyj-sparkar-oeverbefaelhavaren-efter-patryckningar", "date_display": "2026-07-21", "date_iso": "2026-07-21T20:38:02+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/ukraina", "/zelenskyj", "/krig"]}, {"id": 155, "title": "Concerns about Trump are growing - within the party: \"Persistent dark cloud\"", "summary": "Several people with access to the White House describe a growing discomfort with developments in Iran. The background is this weekend's casualties among American soldiers, while reports of previously unknown injuries among American military continue to emerge. According to Politico, there is growing concern among Trump's allies that the president is finding it increasingly difficult to get out of a war that is perceived as both expensive and unpopular.  - This is what a swamp looks like, says a person with access to the site. On Monday, Trump promised that Iran would have to pay \"many times over\" for every American soldier killed. At the same time, the United States carried out new attacks targeting Iranian military assets linked to the Strait of Hormuz. A betrayal of the election promise TV4 Nyheterna has previously spoken to US expert Andreas Utterström, who warned that American casualties risk becoming what defines Trump's efforts in the Middle East. - It is a betrayal of one of Trump's most important election promises. He promised not to start new wars and to keep the US out of costly military adventures. The more Americans are killed, the harder it will be to defend that image, he said.  Politico's data indicates that Republicans close to the White House are increasingly worried about how the conflict will affect voters' finances. Gasoline prices in the US have risen sharply recently, reaching the highest level in over a month.  Oil price decisive Trump-allied pollster John McLaughlin tells Politico that Iran really only needs to survive the conflict to be able to call it a success. - I don't think anyone likes the intermediate situation with an Iran where these terrorists are still in power and can influence our domestic policy before November. For them, to survive is to win the war, he says and adds: - Their entire existence is based on an ongoing war with us that we don't want either. But they leave us with an option we don't want to have to do.  At the same time, several Republican strategists warn of rising energy prices", "title_original": "Oron för Trump växer – inom partiet: ”Ihållande mörkt moln”", "summary_original": "Flera personer med insyn i Vita huset beskriver ett växande obehag kring utvecklingen i Iran. Bakgrunden är helgens dödsoffer bland amerikanska soldater, samtidigt som rapporter om tidigare okända skador bland amerikansk militär fortsätter att komma fram. Enligt Politico finns en växande oro bland Trumps allierade att presidenten får allt svårare att ta sig ur ett krig som uppfattas som både dyrt och impopulärt.  – Så här ser ett träsk ut, säger en person med insyn till sajten. Under måndagen lovade Trump att Iran skulle få betala ”mångfalt” för varje dödad amerikansk soldat. Samtidigt genomförde USA nya attacker riktade mot iranska militära resurser kopplade till Hormuzsundet. Ett svek mot vallöftet TV4 Nyheterna har tidigare talat med USA-kännaren Andreas Utterström, som varnat för att amerikanska dödsoffer riskerar att bli det som definierar Trumps insats i Mellanöstern. – Det är ett svek mot ett av Trumps viktigaste vallöften. Han lovade att inte starta nya krig och hålla USA borta från kostsamma militära äventyr. Ju fler amerikaner som dödas, desto svårare blir det att försvara den bilden, sa han.  Politicos uppgifter pekar på att republikaner nära Vita huset i allt högre grad oroar sig för hur konflikten påverkar väljarnas ekonomi. Bensinpriset i USA har stigit kraftigt den senaste tiden och nått den högsta nivån på över en månad.  Oljepriset avgörande Trumpallierade opinionsundersökaren John McLaughlin säger till Politico att Iran egentligen bara behöver överleva konflikten för att kunna kalla det en framgång. – Jag tror inte att någon gillar mellanläget med ett Iran där dessa terrorister fortfarande har makten och kan påverka vår inrikespolitik inför november. För dem är det att överleva att vinna kriget, säger han och tillägger: – Hela deras existens bygger på ett pågående krig med oss ​​som vi heller inte vill ha. Men de lämnar oss med ett alternativ som vi inte vill behöva göra.  Samtidigt varnar flera republikanska strateger för att stigande energipriser kan bli ett allvarligt problem inför mellanårsvalet i november. Oljan närmade sig under måndagen 90 dollar per fat, en nivå som historiskt ofta förknippas med politiska problem för det parti som sitter vid makten. – Min uppfattning är alltid att om det sittande partiet har oljepriset över 90 dollar per fat, kommer de att förlora. Och om de har det under 70 dollar per fat, kommer de att vinna. Jag tror att detta redan är farozonen, säger Curt Mills, verkställande direktör för tidskriften American Conservative.  Vita huset hoppas på förhandlingar Trots den hårda retoriken finns det också tecken på försök till deeskalering. Enligt Reuters, via Politico, har medlare lämnat över ett nytt förslag till Iran som skulle innebära tio dagars vapenvila i syfte att få igång nya förhandlingar. Men efter de senaste amerikanska dödsfallen bedömer flera personer att pr
