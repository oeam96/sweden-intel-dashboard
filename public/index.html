as initially awake and talkative, says police spokesperson Magnus Jansson Klarin. A 25-year-old man has been arrested on suspicion of attempted murder. On Saturday, he was also arrested on suspicion of probable cause. - The investigation will now continue over the weekend, says Annie Nilsson at the Public Prosecutor's Office's press service. Train traffic stopped A major police operation has taken place during the night and the place where the person was found has been cordoned off.  - We are talking to witnesses who have observed this event in some way, says Magnus Jansson Klarin. Shortly after the man was found, the police requested a traffic stop for train traffic through the city. - It is part of the investigative measures that a traffic stop was requested, says Magnus Jansson Klarin. The traffic stop began at 22:17 on Friday evening but was lifted just over an hour later after the police searched several trains.  The investigative work has continued during the night and the police have, among other things, searched for suspected perpetrators by helicopter, but so far no one has been arrested.  The police are also interested in tips and observations from the public. If you know anything about the incident, call the police on 114 14.", "title_original": "En anhållen efter misstänkt skottlossning", "summary_original": "Strax efter klockan tio på fredagskvällen fick polisen flera samtal om höga smällar i stadsdelen Sätra i Gävle. Personen som har hittats skadad har förts till sjukhus med ambulans. – Det är oklart på vilket sätt personen är skadad. Det enda jag vet är att han initialt var vaken och talbar, säger polisens presstalesperson Magnus Jansson Klarin. En man i 25-årsåldern har gripits misstänkt för mordförsök. Under lördagen anhölls han också misstänkt på sannolika skäl. – Utredningen fortsätter nu under helgen, säger Annie Nilsson vid Åklagarmyndighetens presstjänst. Tågtrafiken stoppad En större polisinsats har pågått under natten och platsen där personen hittades har spärrats av.  – Vi pratar med vittnen som på något sätt har iakttagit den här händelsen, säger Magnus Jansson Klarin. Strax efter att mannen hittades begärde polisen trafikstopp för tågtrafiken genom staden. – Det är en del av utredningsåtgärderna att man begärde trafikstopp, säger Magnus Jansson Klarin. Trafikstoppet inleddes 22:17 på fredagskvällen men hävdes strax över en timme senare efter att polisen sökt igenom flera tåg.  Utredningsarbetet har fortsatt under natten och polisen har bland annat sökt efter misstänka gärningspersoner med helikopter, men än så länge har ingen gripits.  Polisen är också intresserade av tips och iakttagelser från allmänheten. Vet du något av händelsen, ring polisen på 114 14.", "link": "https://www.tv4.se/artikel/42tcFU41Ic0MBorfRHMmBU/man-skadad-efter-misstaenkt-skottlossning", "date_display": "2026-07-10", "date_iso": "2026-07-10T21:10:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Inrikes", "/inrikes", "/skottlossning", "/gavle", "/skjutning"]}, {"id": 146, "title": "The police chief warns: \"Inappropriate to receive this money\"", "summary": "At the end of June, two police officers were convicted of molestation after wrestling down a 15-year-old boy in the mall Kungsmässan in Kungsbacka in October 2024. The boy was described as loud and unpleasant, but according to the court of appeals verdict, he should not have hindered or hindered the police's work. Earlier this week, TV4 Nyheterna reported that opinion leader Jan Emanuel collected money to pay fines and damages to the police officers, who were sentenced to daily fines of around 24,000 kroner each and a compensation of 15,000 kroner to the boy.  Advises: \"Trust risks being affected\" However, it would be inappropriate for the convicted police officers to accept the money from Jan Emanuel. That's what Johan Nilvé, deputy police area chief in Halland, told the newspaper Norra Halland. - It could constitute a breach of trust for the police, he says. Accepting the money may be against the Police Authority's guidelines for receiving gifts, says the police chief.\n\n- These two police officers and this collection is related to their service as a police officer, so then the guidelines we have for receiving gifts and other benefits become relevant. There, we are clear that employees must be restrictive about receiving gifts because the public's trust risks being affected, says Johan Nilvé. Can be up to SU On the Police Authority's website it is stated that police employees \"do not accept gifts and that questions about abuse are taken very seriously\". - The starting point is that if a gift can affect the performance of the service in a way that causes one to end up in a debt of gratitude or the like, then it must not be accepted. We must be objective and impartial in our exercise of authority and from that perspective this collection could mean that that objectivity and impartiality is called into question. Therefore, it is inappropriate to receive this money, says Johan Nilvé to the newspaper. If the money is received, it is up to the police department for special investigations (SU) to assess whether it is a bribe.", "title_original": "Polischefen varnar: ”Olämpligt att ta emot de här pengarna”", "summary_original": "I slutet av juni dömdes två poliser för ofredande efter att ha brottat ner en 15-årig pojke i gallerian Kungsmässan i Kungsbacka i oktober 2024. Pojken beskrevs som uppkäftig och otrevlig men ska enligt hovrättsdomen inte ha hindrat eller försvårat polisens arbete. Tidigare i veckan rapporterade TV4 Nyheterna att opinionsbildaren Jan Emanuel samlat in pengar för att betala böter och skadestånd åt poliserna, som dömdes till dagsböter på omkring 24 000 kronor vardera och ett skadestånd på 15 000 kronor till pojken.  Avråder: ”Förtroende riskerar att påverkas” Det vore dock olämpligt av de dömda poliserna att ta emot pengarna från Jan Emanuel. Det säger Johan Nilvé, biträdande polisområdeschef i Halland, till tidningen Norra Halland. – Det skulle kunna utgöra en förtroendeskada för polisen, säger han. Att ta emot pengarna kan strida mot Polismyndighetens riktlinjer för mottagande av gåvor, säger polischefen.\n\n– De här två poliserna och den här insamlingen är relaterad till deras tjänst som polis, så då blir de riktlinjer som vi har för mottagande av gåvor och andra förmåner aktuella. Där är vi tydliga med att anställda ska vara restriktiva mot att ta emot gåvor eftersom allmänhetens förtroende riskerar att påverkas, säger Johan Nilvé. Kan bli upp till SU På Polismyndighetens hemsida framgår att polisanställda ”inte tar emot gåvor samt att frågor om jäv tas på stort allvar”. – Utgångspunkten är att om en gåva kan påverka tjänsteutövningen på ett sätt som gör att man hamnar i tacksamhetsskuld eller liknande, då får den inte accepteras. Vi ska vara sakliga och opartiska i vår myndighetsutövning och utifrån det perspektivet skulle den här insamlingen kunna innebära att den sakligheten och opartiskheten ifrågasätts. Därmed är det olämpligt att ta emot de här pengarna, säger Johan Nilvé till tidningen. Om pengarna mottas är det upp till polisens avdelning för särskilda utredningar (SU) att bedöma om det rör sig om en muta.", "link": "https://www.tv4.se/artikel/4dEEL29o33BmZwYUNB1QFS/polischefen-varnar-olaempligt-att-ta-emot-de-haer-pengarna", "date_display": "2026-07-10", "date_iso": "2026-07-10T19:58:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Inrikes", "/inrikes", "/kungsbacka", "/polismyndigheten", "/jan-emanuel"]}, {"id": 147, "title": "Fires continue to ravage southern Europe – twelve dead in Spain", "summary": "The municipality of Los Gallardos, northeast of Almería in Spain, has been hit hard by the fire. - It feels like a bomb has fallen, says Francisco Miguel Reyes, mayor of Los Gallardos, to El País. According to Miguel Reyes, the fire in the densely built-up area is not under control. - The wind is not helping us. We have extensive material damage, but it can be repaired - life cannot, says the mayor. During Friday, the wind is said to have turned to the southwest, which, together with the high temperatures, makes extinguishing work more difficult. Initial investigations point to a falling power line as the cause of the fire, writes El País. Tourists among the dead The dead are feared to be foreign tourists who tried to leave the area via a different route than the evacuation route and got caught in the flames. Four who were found in a car are suspected to be British as the steering wheel in the vehicle was on the right side, reports AFP. The area is a popular tourist destination that particularly attracts Britons and other Europeans. Currently, 23 people are missing in the area, writes El País with reference to the Andalusian regional government. Hundreds of people are still evacuated and parts of the A7 motorway are closed due to the flames. So far, 3,200 hectares have burned in the area, which is characterized by bushes and esparto grass. At this time of year, the vegetation in the area is very dry and becomes fuel for the fire. The head of the regional government of Andalusia, Juanma Moreno, has asked Spain's Prime Minister Pedro Sánchez for \"maximum support\" in the extinguishing work. Over 450 people are currently participating in extinguishing work. In addition, 32 firefighting aircraft are included in the operation. Around Spain, a minute's silence is held for the victims. Three days of mourning have also been declared by the regional government of Andalusia, and in Almería public screenings of Spain's World Cup quarter-final against Belgium have been cancelled. 450 children evacuated from summer camp In neighboring France, a wildfire in the department of Drôme in the south-eastern parts of the country has destroyed close to", "title_original": "Bränder fortsätter härja i Sydeuropa – tolv döda i Spanien", "summary_original": "Kommunen Los Gallardos nordost om Almería i Spanien är hårt drabbad av branden. – Det känns som att en bomb har fallit, säger Francisco Miguel Reyes, borgmästare i Los Gallardos, till El País. Enligt Miguel Reyes är branden i det tätt bebyggda området inte under kontroll. – Vinden hjälper oss inte. Vi har omfattande materiella skador, men de kan repareras – liv kan det inte, säger borgmästaren. Vinden uppges under fredagen ha vänt mot sydväst, vilket tillsammans med de höga temperaturerna försvårar släckningsarbetet. Inledande utredningar pekar på en nedfallande kraftledning som orsaken till branden, skriver El País. Turister bland dödsoffren De avlidna befaras vara utländska turister som försökte lämna området via en annan väg än evakueringsrutten och fastnade i lågorna. Fyra som hittades i en bil misstänks vara britter då ratten i fordonet satt på höger sida, rapporterar AFP. Trakten är ett populärt turistmål som i synnerhet lockar britter och andra européer. I nuläget saknas 23 personer i området, skriver El País med hänvisning till det andalusiska regionalstyret. Hundratals personer är därtill fortsatt evakuerade och delar av motorvägen A7 hålls avstängd med anledning av lågorna. Hittills har 3 200 hektar brunnit i området, som präglas av buskar och espartogräs. Den här tiden på året är vegetationen i området mycket torr och blir som bränsle för elden. Chefen för den regionala regeringen i Andalsuien, Juanma Moreno, har bett Spaniens premiärminister Pedro Sánchez om ”maximalt understöd” i släckningsarbetet. Över 450 personer deltar för närvarande i släckningsarbete. Därutöver ingår 32 brandflygplan i insatsen. Runtom i Spanien hålls en tyst minut för offren. Tre dagars sorg har också utlysts av den regionala regeringen i Andalusien, och i Almería har allmänna visningar av Spaniens VM-kvartsfinal mot Belgien ställts in. 450 barn evakuerade från sommarläger I grannlandet Frankrike har en terrängbrand i departementet Drôme i landets sydöstra delar förstört närmare 3 700 hektar av vegetationen, skriver franska medier.  Branden som rasar i bergen när orten Die har pågått i tio dagar och är svår att få kontroll över på grund av dess svårtillgänglighet. 570 brandmän uppges bekämpa branden som orsakades av ett blixtnedslag. – Efter tio dagar av hårda strider (mot branden reds. anm.) är alla inblandade fortsatt helt engagerade i att hitta en snabb lösning på denna brand, säger Franck Tournier, avdelningschef för Drômes brand- och räddningstjänst.  På torsdagen evakuerades 400 personer med anledning av branden, 350 av dessa från campingplatser i området. Sedan tidigare har även 450 barn vid två sommarläger evakuerats. Le Figaro skriver att totalt 25 000 hektar eldhärjats i olika terrängbränder i Frankrike sedan årsskiftet. Det finns inga uppgifter om att några svenskar omkommit eller saknas i bränderna.", "link": "https://www.tv4.se/artikel/4vEUZzg59bHZs3zbkRnBrk/braender-fortsaetter-haerja-i-sydeuropa-tolv-doeda-i-spanien", "date_display": "2026-07-10", "date_iso": "2026-07-10T17:09:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/utrikes", "/spanien", "/frankrike", "/brand", "/brander", "/europa", "/varme", "/varmeboljor"]}, {"id": 148, "title": "The family is looking for answers after the murder of Gent, 19: Why him?", "summary": "Gent Maksutaj, 19, was shot dead in the Kvarngärdet district in Uppsala last Sunday evening. Three people are suspected of having been involved in the fatal shooting. A teenage boy is in custody on probable cause on suspicion of murder. Another person has been detained on suspicion of aiding and abetting murder. A third person is requested to be detained on suspicion of aggravated protection of a criminal, according to UNT. At the same time, the relatives try to deal with the grief and understand why the 19-year-old was killed. - It is about a son who has passed away under very dark circumstances. The circumstances are very unclear. You want to know why. Why him? Is it just that he was in the wrong place at the wrong time? Is it about something else? says plaintiff's attorney Ilker Aytekin. Described as a \"spreader of joy\" According to Ilker Aytekin, both relatives and people in Gent Maksutaj's surroundings have described him as a young man with a focus on football, training, family and friends. - Everyone has described him as a joy-spreader who is always happy and helpful, says Aytekin. According to Aytekin, it is above all the uncertainty surrounding what has happened that eats away at the relatives. - Why and who? I guess that's what eats at them, except that he's gone. It is clear that you are not feeling well.  The fact that several people are now suspects gives, according to the plaintiff's counsel, some hope that the family will get answers to what is behind the murder. - Since you still got hold of three, you still have hope for an answer, even though it is not very common to\nyou get an answer, then maybe the police investigation will show something about why it might have happened.  At the same time, he emphasizes that it is not uncommon for the subject image to remain unclear. - It is not usual for people involved in this type of case to actually talk, but the investigation may show something, which we hope for.  \"Very convinced\" After the fatal shooting, speculation about motives and possible connections to criminal environments has appeared on social media and online forums. According to Aytekin, they are", "title_original": "Familjen söker svar efter mordet på Gent, 19: Varför just han?", "summary_original": "Gent Maksutaj, 19, sköts ihjäl i stadsdelen Kvarngärdet i Uppsala i söndags kväll. Tre personer misstänks ha varit inblandade i dödsskjutningen. En tonårspojke är häktad på sannolika skäl misstänkt för mord. Ytterligare en person har häktats misstänkt för medhjälp till mord. En tredje person är begärd häktad misstänkt för grovt skyddande av brottsling, enligt UNT. Samtidigt försöker de anhöriga hantera sorgen och förstå varför 19-åringen dödades. – Det handlar om en son som har gått bort under väldigt mörka omständigheter. Omständigheterna är väldigt oklara. Man vill ju gärna veta varför. Varför just han? Handlar det bara om att han var på fel plats vid fel tillfälle? Handlar det om något annat? säger målsägandebiträdet Ilker Aytekin. Beskrivs som en ”glädjespridare” Enligt Ilker Aytekin har både anhöriga och personer i Gent Maksutajs omgivning beskrivit honom som en ung man med fokus på fotboll, träning, familj och vänner. – Alla har beskrivit honom som en glädjespridare som alltid är glad och hjälpsam, säger Aytekin. Enligt Aytekin är det framför allt ovissheten kring vad som har hänt som tär på de anhöriga. – Varför och vem? Det är väl det som tär på dem, förutom att han har gått bort. Det är klart att man inte mår bra.  Att flera personer nu är misstänkta ger enligt målsägandebiträdet ett visst hopp om att familjen ska få svar på vad som ligger bakom mordet. – I och med att man ändå fått tag på tre, så har man ändå hopp på något svar, även om det inte är jättevanligt att\nman får svar, så kanske polisens utredning visar någonting på varför det kan ha hänt.  Samtidigt betonar han att det inte är ovanligt att motivbilden förblir oklar. – Det är inte vanligt att personer involverade i den här typen av mål faktiskt pratar, men utredningen kanske visar på någonting, vilket vi hoppas på.  ”Väldigt övertygade” Efter dödsskjutningen har spekulationer om motiv och eventuella kopplingar till kriminella miljöer förekommit på sociala medier och nätforum. Enligt Aytekin är de anhöriga övertygade om att Gent Maksutaj inte haft någon sådan koppling. – De är väldigt övertygade om att Gent inte har varit i den typen av miljö. Just nu är de säkra på det. Det ligger inte i deras intresse att lyssna på andra just nu. Det hade väl varit lite annorlunda ifall det hade varit känt att Gent hade rört sig i de miljöerna, säger han. ”Ordentlig chock” Han säger att personer i familjens närhet beskriver familjen som lugn och skötsam. – Mamma och pappa jobbar och sliter dag in och dag ut. Barnen är i princip uppvuxna här och sköter skolan och har sina friluftsaktiviteter. Ingen känner till någon form av brottslighet någonstans, säger Aytekin och tillägger: – Det har också gjort att det kommit som en ordentlig chock, att han så plötsligt hade blivit mördad. I och med att familjen präglas av att alla har fötterna på jorden och sköter sitt.  Familjen har genom målsägandebiträdet godkänt namn- och bildpublicering.", "link": "https://www.tv4.se/artikel/57rFqeABbjYMkQR9jsDHZZ/familjen-soeker-svar-efter-mordet-pa-gant-19-varfoer-just-han", "date_display": "2026-07-10", "date_iso": "2026-07-10T16:15:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/uppsala", "/skjutningar-i-sverige", "/skjutning"]}, {"id": 149, "title": "Government puts pressure on EU ahead of Commission’s review of EU Emissions Trading System", "summary": "Next week, the European Commission will present its review of the European Union Emissions Trading System (EU ETS). Sweden’s Minister for EU Affairs Jessica Rosencrantz has sent a letter to the Irish Presidency of the Council of the European Union, with Sweden’s priorities and standpoints ahead of the upcoming negotiations.", "title_original": "Government puts pressure on EU ahead of Commission’s review of EU Emissions Trading System", "summary_original": "Next week, the European Commission will present its review of the European Union Emissions Trading System (EU ETS). Sweden’s Minister for EU Affairs Jessica Rosencrantz has sent a letter to the Irish Presidency of the Council of the European Union, with Sweden’s priorities and standpoints ahead of the upcoming negotiations.", "link": "https://www.government.se/press-releases/2026/07/press ividuals and one entity were also adopted under the EU Global Human Rights Sanctions Regime, which was established because of the internal oppression in Russia.", "link": "https://www.government.se/press-releases/2026/07/eu-adopts-sanctions-over-poisoning-of-russian-opposition-politician-alexei-navalny/", "date_display": "2026-07-07", "date_iso": "2026-07-07T14:57:25+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "EU", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 152, "title": "Government invests SEK 250 million in global health", "summary": "The Government has adopted a new support package for global health, including sexual and reproductive health and rights (SRHR), totalling SEK 250 million for 2026. The health package consolidates Sweden’s commitment to improving the health of the most vulnerable through vaccines in low- and middle-income countries and increased access to maternal and newborn care where the needs are greatest.", "title_original": "Government invests SEK 250 million in global health", "summary_original": "The Government has adopted a new support package for global health, including sexual and reproductive health and rights (SRHR), totalling SEK 250 million for 2026. The health package consolidates Sweden’s commitment to improving the health of the most vulnerable through vaccines in low- and middle-income countries and increased access to maternal and newborn care where the needs are greatest.", "link": "https://www.government.se/press-releases/2026/07/government-invests-sek-250-million-in-global-health/", "date_display": "2026-07-07", "date_iso": "2026-07-07T12:17:56+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Mini  the Venezuelan people and exacerbated an already difficult humanitarian situation. Sweden is now providing SEK 25 million in humanitarian assistance to Venezuela to support initiatives such as the distribution of food packages, access to clean water, temporary emergency shelter, protection of vulnerable groups and reunification of children and families who have been separated.", "link": "https://www.government.se/press-releases/2026/07/sweden-provides-sek-25-million-to-earthquake-stricken-venezuela/", "date_display": "2026-07-02", "date_iso": "2026-07-02T09:14:12+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "11 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Foreign and security policy", "Jakob Forssmed", "Benjamin Dousa"]}, {"id": 161, "title": "Joint statement of the Nordic-Baltic Prime Ministers", "summary": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "title_original": "Joint statement of the Nordic-Baltic Prime Ministers", "summary_original": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "link": "https://www.government.se/statements/2026/07/joint-statement-of-the-nordic-baltic-prime-ministers/", "date_display": "2026-07-01", "date_iso": "2026-07-01T11:58:31+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "11 days old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Civil defence", "Military defence", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 162, "title": "Gover mat of Intergovernmental Consultations, a year and a half after the signing of the renewed Strategic Partnership between Poland and Sweden (Harpsund, 28 November 2024).", "link": "https://www.government.se/statements/2026/06/joint-declaration-from-the-polish-swedish-intergovernmental-consultations-gdynia/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:42:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "13 days old", "tags": ["EU", "Prime Minister's Office", "Statement", "Ulf Kristersson", "Military defence"]}];
  let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
</body>
</html>
