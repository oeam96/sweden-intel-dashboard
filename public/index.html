corruption. Everyday life is permeated by it, from school to healthcare, says Jorina Kadare. Many young people and also Albanians abroad get involved. In the past year alone, 30,000 Albanians have left the country, and over a million have emigrated in the past decade. - We will a", "title_original": "Vrede mot Trumps lyxbygge på skyddad ö – hotar flamingor", "summary_original": "Protesterna, som fått namnet ”flamingorevolutionen”, startade när det blev känt att ett miljardprojekt för exklusiv turism planerades på den obebodda ön Sazan och intilliggande kustremsor. Området är skyddat och hem för utrotningshotade arter, bland annat flamingor och havssköldpaddor. – Det började som en miljöfråga, men har utvecklats till en kamp mot korruption och maktelit, säger Ekots utrikesreporter Jacob Hallerström, som nyligen besökt Albanien. Byggprojektet pausat – protesterna fortsätter Efter att privata säkerhetsvakter gått hårt åt demonstranter och polisen inte ingrep spreds protesterna till huvudstaden Tirana och flera andra städer. Byggprojektet har nu pausats i väntan på en miljökonsekvensanalys, samtidigt som flera investerare utreds för korruption. – Det är första gången sedan kommunismens fall som så många samlas i en bred, folklig rörelse, säger Jacob Hallerström. Ny generation leder motståndet Bakom demonstrationerna står en ny generation albaner, där många unga och studenter tagit ledande roller. Protesterna har också fått stöd från albaner i exil, och flera av de största manifestationerna har samlat tusentals deltagare i både Albanien och utomlands. Jorina Kadare, som tidigare bott i Sverige men valt att stanna kvar i Albanien för att delta i protesterna, beskriver hur rörelsen vuxit fram ur en frustration över bristande demokratiska reformer och utbredd korruption. Hon berättar att hot och trakasserier förekommit mot flera av de mest aktiva, men att det inte avskräckt deltagarna. ”Vi har inget att förlora” Demonstranterna kräver nu inte bara stopp för bygget, utan även att premiärminister Edi Rama och oppositionsledaren Salibi Risha lämnar sina poster. – Albaner är så trötta på korruption. Vardagen är genomsyrad av det, från skola till sjukvård, säger Jorina Kadare. Många unga och även albaner i utlandet engagerar sig. Bara det senaste året har 30 000 albaner lämnat landet, och över en miljon har emigrerat det senaste decenniet. – Vi kommer aldrig att ge upp. Vi har ingenting att förlora, säger Jorina Kadare.", "link": "https://www.tv4.se/artikel/4FSnvKsaHk9duVfRI5ngac/trumps-lyxbygge-pa-skyddad-oe-vaecker-vrede-albanien-i-massprotester", "date_display": "2026-07-25", "date_iso": "2026-07-25T08:12:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/albanien", "/donald-trump", "/jared-kushner", "/korruption", "/protester", "/demonstration", "/lyxvillor"]}, {"id": 157, "title": "Landon, 13, injured in electric scooter accident: \"Skull cracked\"", "summary": "There is a dramatic development in the number of electric shock accidents in Sweden. And it doesn't seem to be slowing down either. In 2025, 7 people died and 6,624 were shaken, which is an increase of a full 38 percent compared to 2024. \"The worst thing you can be a part of\" For Landon's mother and father, an ordinary summer day became a parent's worst nightmare. - Because I saw the blood coming out of the ear... My first thought was that he has bleeding on the brain. So I only saw the worst, that he will never be the same or wake up, says Edisa Arnautovic, Landon's mother. - That was the worst. It's so hard to explain without being deeply moved. It's probably the worst thing you can be a part of. Because precisely in that situation you stand in... Will he survive?, says Mattias Kristensson, Landon's father. Landon himself has no memory of the crash, in which he was seriously injured. - A crack up here in the skull.  And then a hole in the eardrum, a broken collarbone, and scrapes, says Landon Arnautovic. Researchers demand tougher laws Neighboring countries have introduced both age limits and stricter rules, and now researchers in Sweden are demanding similar legislation, precisely so that accidents like this don't have to happen are now demanding - I think it's strange that we are so far behind. In our neighboring countries, they have both looked at what type of vehicle this is and adapted the rules accordingly. We think there should be an age limit of 15 years in Sweden as well, similar to what exists in our neighboring countries, says Joakim Dahlman, head of research at the Norwegian Road and Transport Research Institute VTI. Landon's father agrees that clearer rules may be needed.  - I think it has been good. If there are rules that it has to be 12 or 15 and whatever, then you have to follow it, says Mattias Kristensson, Landon's father. The government: No concrete proposals yet But despite the fact that Sweden is still the most unregulated country in the Nordics, the government has so far no solutions to the problem. -  It is a matter where the government id", "title_original": "Landon, 13, skadades i olycka med elsparkcykel: ”Skallen sprack”", "summary_original": "Det är en dramatisk utveckling av antalet elsparksolyckor i Sverige. Och den tycks inte heller avta. 2025 omkom 7 personer och 6 624 skakades, det är en ökning med hela 38 procent jämfört med 2024. ”Det värsta du kan vara med om” För Landons mamma och pappa blev en vanlig sommardag en förälders värsta mardröm. – Eftersom jag såg blodet ur örat... Min första tanke var att han har blödningar på hjärnan. Så jag såg ju bara värsta liksom, att han aldrig kommer att vara sig lik eller vakna, säger Edisa Arnautovic, mamma till Landon. – Det var det värsta. Det är så svårt att förklara utan att man ska bli jätteberörd. Det är nog det värsta du kan vara med om. För just i det läget så står man i… Kommer han överleva?, säger Mattias Kristensson, pappa till Landon. Landon själv har inget minne från kraschen, där han skadades allvarligt. – En spricka uppe här i skallen.  Och sen hål i trumhinnan, brutet nyckelben, och skrapsår, säger Landon Arnautovic. Forskare kräver hårdare lagar Grannländerna har infört både åldersgränser och striktare regler, och nu kräver forskare i Sverige en liknande lagstiftning, just för att sådana här olyckor inte ska behöva inträffa kräver nu  – Jag tycker det är konstigt att vi ligger så pass mycket efter. I våra grannländer så har man ju  både sett över vad det här är för typ av fordon och anpassat reglerna efter det. Vi tycker att det bör finnas en åldersgräns på 15 år även i Sverige i likhet med det som finns hos våra grannländer, säger Joakim Dahlman, forskningschef vid Statens väg- och transportforskningsinstutut VTI. Landons pappa håller med om att tydligare regler kan behövas.  – Jag tror det har varit bra. Kommer det regler på att det måste vara 12 eller 15 och vad det är, då får man ju följa det, säger Mattias Kristensson, pappa till Landon. Regeringen: Inga konkreta förslag än Men trots att Sverige fortfarande är det mest oreglerade landet i Norden har regeringen än så länge inga lösningar på problemet. –  Det är en fråga där regeringen idag inte har någon specifik uppfattning men jag tycker att  de säkerhetsproblem vi ser och de skador vi ser runt elsparkcyklar verkligen motiverar  att man också ser över de här frågorna på på ett seriöst sätt, Gunnar strömmer (M) justitieminister. Inte heller Sveriges största oppositionsparti  tycks veta hur vi ska få ner skadorna trots att olyckorna ökar. –  Då behöver man se över: Kan det behövas några typer av regleringar när det gäller elsparkcyklar? Men vi har inte kommit fram till vad och hur än, Anna-Caren Sätherberg (S) landsbygdspolitisk talesperson. 13-åriga Landon mår bra idag. Mycket tack vare att han hade hjälm på sig.  – Om inte jag hade den så skulle jag kanske inte funnits eller levt, säger Landon Arnautovic.", "link": "https://www.tv4.se/artikel/4DIRE6pnuLHuJAM7ZPOOFB/landon-13-skadades-allvarligt-i-olycka-med-elsparkcykel", "date_display": "2026-07-25", "date_iso": "2026-07-25T07:58:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Elsparkcyklar", "/elsparkcyklar", "/olyckor"]}, {"id": 158, "title": "Trump's attack: \"When I'm gone you'll all be broke\"", "summary": "In April, Donald Trump was scheduled to speak for the first time as president at the annual Correspondents' Dinner in Washington DC. But when a gunman managed to get past a security checkpoint in the building, drama erupted that led to the president being taken to safety. The night before Saturday, Swedish time, the dinner was held again. The president then also got the chance to speak in front of hundreds of journalists again. Before Trump took the stage, several of the audience received awards. - This has not been an easy night - all these awards. Did I have something to say? Trump initially asked himself.  \"You're all going to be broke\" After a more light-hearted introduction that was met with laughter in the room, the tone became increasingly bitter as Trump moved on to criticize and name individual journalists who reported critically about him.  CNN journalist Kaitan Collins was criticized, among other things, for \"never smiling\". He also stated that the journalists were lucky to be able to show off him. - You have no idea how lucky you are. When I'm gone you'll all be broke. Your business model will be over, Trump said. Spoke for 67 minutes Even hosts Jimmy Fallon and Jimmy Kimmel got their fair share. Just like Jane Fonda, Bruce Springsteen and \"Barack Hussein Obama\". And of course the former president Joe Biden. - Before I came, if you wanted to see someone pass out on the South Lawn of the White House, you just had to ask Joe Biden a question, the president said, referring to the UFC gala held at the White House earlier this year. The speech, which was scheduled to last half an hour, dragged on and finally landed at 67 minutes. But he was also critical of the speechwriters. - I actually thought it was pretty good. \"That's actually the only thing I thought was good in this whole damn, stupid speech they wrote,\" Trump said after a joke that was not well received by the crowd. \"Trump 2028\" Several times he joked about running for president", "title_original": "Trumps attack: ”När jag är borta kommer ni alla att vara panka”", "summary_original": "I april skulle Donald Trump för första gången i egenskap av president tala på den årliga korrespondentmiddagen i Washington DC. Men när en beväpnad man lyckades rusa förbi en säkerhetskontroll i byggnaden utbröt dramatik som ledde till att presidenten fick föras i säkerhet. Natten mot lördagen, svensk tid, hölls middagen på nytt. Presidenten fick då också chansen att tala inför hundratals journalister igen. Innan Trump intog scenen fick flera av åhörarna motta priser. – Det här har inte varit en lätt kväll – alla dessa utmärkelser. Hade jag något att säga till om? frågade sig Trump inledningsvis.  ”Ni kommer alla vara panka” Efter en mer lättsam inledning som möttes av skratt i lokalen blev tonen allt mer bitter när Trump gick över till att kritisera och namnge enskilda journalister som rapporterat kritiskt om honom.  CNN-journalisten Kaitan Collins kritiserades bland annat för att ”aldrig le”. Han uppgav också att journalisterna var lyckligt lottade som kunde sko sig på honom. – Ni har ingen aning om hur lyckligt lottade ni är. När jag är borta kommer ni alla att vara panka. Er affärsmodell kommer att vara slut, sade Trump. Talade i 67 minuter Även programledarna Jimmy Fallon och Jimmy Kimmel fick sin beskärda del. Precis som Jane Fonda, Bruce Springsteen och ”Barack Hussein Obama”. Och såklart den tidigare presidenten Joe Biden. – Innan jag kom, om du ville se någon förlora medvetandet på Vita husets södra gräsmatta, behövde du bara ställa en fråga till Joe Biden, sade presidenten refererandes till den UFC-gala som hölls vid Vita huset tidigare i år. Talet som var planerat att pågå i en halvtimme, drog ut på tiden och landade till slut på 67 minuter. Men han var också kritisk till talskrivarna. – Jag tyckte faktiskt att det var ganska bra. Det var faktiskt det enda jag tyckte var bra i hela det här, förbannade, dumma talet de skrev, sade Trump efter ett skämt som inte mottogs väl av publiken. ”Trump 2028” Flera gånger om skämtade han om att ställa upp i presidentvalet en tredje gång. – Precis som under mitt presidentskap är andra gången alltid bättre. Och tredje gången kommer att bli ännu bättre, sade presidenten och tillade att han ”skojade”. Mot slutet av talet tog han på sig en röd keps med texten ”Trump 2028”. Innan talet var över hade han också hunnit avhandla Irankriget. – Allt går extremt bra. Tro inte på ”fake news”, sade presidenten. Enligt Trump skulle Iran ”älska” att få till ett avtal men uppgav att han inte tror att de är ”redo” för det än. – Jag tror inte att det är dags än, men jag är villig att lyssna.", "link": "https://www.tv4.se/artikel/7bXx6hQ0E5JA0KV0kxWksN/trumps-attack-i-natt-ni-kommer-alla-vara-panka", "date_display": "2026-07-25", "date_iso": "2026-07-25T04:57:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Nyheterna", "/utrikes", "/donald-trump", "/usa", "/republikanerna", "/media", "/washington"]}, {"id": 159, "title": "Liselotte J Andersson:\nClear vision is required to find the way", "summary": "'Now man is not alone in searching, there is a search from the other side'", "title_original": "Liselotte J Andersson:\nDet krävs klarsyn för att finna vägen", "summary_original": "'Nu är människan inte ensam om att söka, det pågår ett sökande från andra hållet'", "link": "https://www.dagen.se/livsstil/liselotte-j-andersson-det-kraevs-klarsyn-foer-att-finna-vaegen/10449643", "date_display": "2026-07-25", "date_iso": "2026-07-25T03:00:00+00:00", "source": "Dage   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
