//www.sydsvenskan.se/118-kvadratmeter-stort-hus-i-hollviken-salt/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:30:46+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Mats J: I called in four engineers to get the job done", "summary": "If you are impractical, you have to rely on those closest to you when a greenhouse is to be erected. And with four engineers on site, nothing can go wrong, right?", "title_original": "Mats J: Jag kallade in fyra ingenjörer för att få jobbet gjort", "summary_original": "Om man är opraktisk får man lita till sina närmaste när ett växthus ska resas. Och med fyra ingenjörer på plats kan väl inget gå fel?", "link": "https://www.dn.se/kultur/mats-j-ska-det-kravas-fyra-ingenjorer-for-att-resa-ett-vaxthus/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:30:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "Review: Fall sausages do not measure up", "summary": "The manufacturers promise beef in their falu sausages. But according to P4's review, several of the sausage varieties have almost no beef at all.", "title_original": "Granskning: Falukorvar håller inte måttet", "summary_original": "Tillverkarna lovar nötkött i sina falukorvar. Men enligt P4:s granskning har flera av korvsorterna nästan inget nötkött alls.", "link": "https://www.sydsvenskan.se/sverige/granskning-falukorvar-haller-inte-mattet/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:23:27+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "Ronaldo sees bright future for Brazil after victory against Scotland", "summary": "MIAMI. Vinícius Júnior put on a football show as Brazil thrashed Scotland 3-0 in Miami. The victory has strengthened the belief that Brazil can go far in the World Cup. - It feels very good now, says the legendary Ronaldo to DN.", "title_original": "Ronaldo ser ljus framtid för Brasilien efter seger mot Skottland", "summary_original": "MIAMI. Vinícius Júnior bjöd på en fotbollsshow när Brasilien körde över Skottland med 3–0 i Miami. Segern har stärkt tron på att Brasilien kan gå långt i VM. – Det känns väldigt bra nu, säger legendaren Ronaldo till DN.", "link": "https://www.dn.se/sport/ronaldo-ser-ljus-framtid-for-brasilien-efter-seger-mot-skottland/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:22:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 106, "title": "Greta Schüldt: Come on now, Jonas Gren, dare to believe in a people's movement!", "summary": "The poet Jonas Gren talks about how he arrived at his disconnected life and offers frightening figures about how we are affected by our screens. DN's Greta Schüldt has listened.", "title_original": "Greta Schüldt: Kom igen nu, Jonas Gren, våga tro på en folkrörelse!", "summary_original": "Poeten Jonas Gren berättar om hur han nådde fram till sitt nedkopplade liv och bjuder på skrämmande siffror om hur vi påverkas av våra skärmar. DN:s Greta Schüldt har lyssnat.", "link": "https://www.dn.se/kultur/greta-schuldt-kom-igen-nu-jonas-gren-vaga-tro-pa-en-folkrorelse/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:15:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 107, "title": "SEK 7,700,000 for a 1960s villa in Bunkeflostrand - the value has increased a lot", "summary": "", "title_original": "7 700 000 kronor för 60-talsvilla i Bunkeflostrand – värdet har ökat mycket", "summary_original": "", "link": "https://www.sydsvenskan.se/7-700-000-kronor-for-60-talsvilla-i-bunkeflostrand-vardet-har-okat-mycket/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:02:46+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 108, "title": "New owner of the property at Vårgatan 10", "summary": "", "title_original": "Ny ägare till fastigheten på Vårgatan 10", "summary_original": "", "link": "https://www.sydsvenskan.se/ny-agare-till-fastigheten-pa-vargatan-10/", "date_display": "2026-06-25", "date_iso": "2026-06-25T05:02:11+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 109, "title": "The Archbishop: \"Oh, how nice to be freed from the secular state religion\"", "summary": "Martin Modéus argued that Sweden changed its state religion and that denominational free schools can be a respite from the secular.", "title_original": "Ärkebiskopen: ”Åh, vad skönt att få slippa den sekulära statsreligionen”", "summary_original": "Martin Modéus argumenterade för att Sverige bytt statsreligion och att konfessionella friskolor kan få vara ett andrum mot det sekulära.", "link": "https://www.dagen.se/nyheter/aerkebiskopen-ah-vad-skoent-att-fa-slippa-den-sekulaera-statsreligionen/10410556", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:54:17+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "Slideshow: Earthquake in Venezuela", "summary": "During Wednesday evening, two strong earthquakes struck Venezuela. Pictures show massive destruction.", "title_original": "Bildspel: Skalv i Venezuela", "summary_original": "Under onsdagskvällen har två kraftiga jordbävningar slagit mot Venezuela. Bilder visar enorm förstörelse.", "link": "https://www.dn.se/varlden/bildspel-skalv-i-venezuela/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:35:48+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 111, "title": "Revenge book suitable for the hammock", "summary": "Katja is convinced that the terminally ill man is to blame for her mother's death. In search of revenge, she takes a job with him. But Alma prize winner Marion Brunet's first adult book in Swedish takes an unexpected turn.", "title_original": "Hämndbok som lämpar sig för hängmattan", "summary_original": "Katja är övertygad om att den döds­sjuke mannen bär skulden för hennes mors död. På jakt efter hämnd tar hon anställning hos honom. Men Almapris­vinnaren Marion Brunets första vuxen­bok på svenska får en oväntad vändning.", "link": "https://www.svd.se/a/Wvo0wj/recension-katja-av-marion-brunet", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 112, "title": "NV Scanian sports profile indicted - allegedly defrauded relatives of 6.8 million", "summary": "A sports profile from northwestern Scania hid his gambling addiction and is suspected of defrauding family and friends of SEK 6.8 million.  Now the man is charged with 19 cases of gross fraud.", "title_original": "NV-skånsk idrottsprofil åtalad – ska ha lurat närstående på 6,8 miljoner", "summary_original": "En idrottsprofil från nordvästra Skåne dolde sitt spelmissbruk och misstänks för att ha lurat familj och vänner på 6,8 miljoner kronor.  Nu åtalas mannen för 19 fall av grovt bedrägeri.", "link": "https://www.hd.se/hoganas/nv-skansk-idrottsprofil-atalad-ska-ha-lurat-narstaende-pa-68-miljoner/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "\"Most of the people who didn't socialize at the leisure center have ended up a little crooked\"", "summary": "Bjuv must invest more in the children and catch those who need help. That's what young people who grow up in a municipality where the grade trend has gone down and segregation is increasing think so.   - Just because a student has difficulty learning does not mean that he cannot. You have to find another way to teach that particular student, says Salma Sheik, who grew up in Billesholm.", "title_original": "”De flesta som inte umgåtts på fritidsgården har hamnat lite snett”", "summary_original": "Bjuv måste satsa mer på barnen och fånga upp dem som behöver hjälp. Det tycker de unga som växer upp i en kommun där betygstrenden gått nedåt och segregationen ökar.   – Bara för att en elev har svårt att lära sig betyder det inte att den inte kan. Man måste hitta ett annat sätt att lära ut till just den eleven, säger Salma Sheik som växt upp i Billesholm.", "link": "https://www.hd.se/bjuv/de-flesta-som-inte-umgatts-pa-fritidsgarden-har-hamnat-lite-snett/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 114, "title": "The big talent's clear message - then it will be Rögle", "summary": "Both parents have competed in the Olympics - but Norway's successful man took a different path. After the uncertainty, Tinus Luc Koblar tells what applies this autumn.", "title_original": "Stortalangens tydliga besked – då blir det Rögle", "summary_original": "Båda föräldrarna har tävlat i OS – men Norges succéman tog en annan väg. Efter osäkerheten berättar Tinus Luc Koblar vad som gäller i höst.", "link": "https://www.hd.se/sport/stortalangens-tydliga-besked-da-blir-det-rogle/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:30:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 115, "title": "Brazil wins their group", "summary": "There could be Swedish nightmare opposition in the round of 16 in the World Cup - in the form of Brazil. It is clear after the brass team's 3-0 victory against Scotland.", "title_original": "Brasilien vinner sin grupp", "summary_original": "Det kan bli svenskt mardrömsmotstånd i 16-delsfinalen i VM – i form av Brasilien. Det står klart efter brassarnas 3–0-seger mot Skottland.", "link": "https://www.svd.se/a/vrn9yp/brasilien-gruppsegrare-sa-paverkas-sverige", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:27:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 116, "title": "South Africa ready for historic playoffs", "summary": "South Africa is ready for the play-offs in a World Cup for the first time. 1–0 against South Korea was enough for the historic advancement.", "title_original": "Sydafrika klart för historiskt slutspel", "summary_original": "Sydafrika är för första gången klart för slutspel i ett VM. 1–0 mot Sydkorea räckte för det historiska avancemanget.", "link": "https://www.svd.se/a/JOvpGb/sydafrika-klart-for-slutspel-for-forsta-gangen", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:21:09+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 117, "title": "Listen: Nocturnal car fire in Helsingborg", "summary": "", "title_original": "Lyssna: Nattlig bilbrand i Helsingborg", "summary_original": "", "link": "https://www.hd.se/skane/lyssna-flera-restauranger-i-helsingborg-fick-rutorna-sonderslagna/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:20:49+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "That's how bad it is to sleep with your pet", "summary": "Is it unhygienic to let the dog sleep in the bed? Experts find out what the situation is with the risk of infections - and disturbed sleep.", "title_original": "Så dåligt är det att sova med sitt husdjur", "summary_original": "Är det ohygieniskt att låta hunden sova i sängen? Experter reder ut hur det står till med risken för smittor – och störd sömn.", "link": "https://www.dn.se/insidan/sa-daligt-ar-det-att-sova-med-sitt-husdjur/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:19:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 119, "title": "The LO men prefer SD again: \"There is contempt for politicians\"", "summary": "During the past mandate period, the Social Democrats have attracted the greatest support among men in LO professions.\nWhen Ulf Kristersson has ruled Sweden with the support of Jimmie Åkesson, Magdalena Andersson seems to have instilled greater confidence in painters, construction workers and professional drivers. But when the Social Democrats now appear to be heading for election victory, and thus regain power from the right, the LO men abandon the party. In the party sympathy survey from Statistics Sweden, which came out in June, 36.3 percent of the LO men surveyed stated that they preferred the Sweden Democrats. The Social Democrats plummeted from 40.7 percent last year, to 31.9 percent today. - There is a frustration. There is a disdain for politicians. A disdain for the establishment and a lack of policy. People think there is too much \"who takes who\", says LO chairman Johan Lindholm to TV4 Nyheterna i Almedalen. The workers have no confidence Johan Lindholm says that he came to the politicians' week after a trip with business visits where he met and spoke with LO members in various industries. He got the impression that the workers have no confidence that the politicians want to solve Sweden's problems. The LO chairman, who also sits on the Social Democrats' executive committee, concludes that the party must talk more about substantive politics in order to bring working men back to the Workers' Party. - It's more about hitting each other in the head and chasing around in the sandbox than actually talking about what everyone wants, says Lindholm. He mentions pension increases and the abolition of the retirement allowance as particularly important issues that S must push hard in the election campaign. - We help, push forward from LO's side what we believe is important and good for Sweden's workers. If we raise those questions and get the necessary political decisions, I think we are on the right track. But there is no \"quick fix\".", "title_original": "LO-männen föredrar SD igen: ”Finns ett politikerförakt”", "summary_original": "Under den gångna mandatperioden har Socialdemokraterna lockat störst stöd bland männen inom LO-yrken.\nNär Ulf Kristersson har styrt Sverige med stöd av Jimmie Åkesson tycks Magdalena Andersson ha ingjutit högre förtroende hos målare, byggnadsarbetare och yrkeschaufförer. Men när Socialdemokraterna nu ser ut att gå mot valseger, och därmed återta makten från högern, överger LO-männen partiet. I partisympatiundersökningen från Statistiska centralbyrån som kom nu i juni uppgav 36,3 procent av de tillfrågade LO-männen att de föredrar Sverigedemokraterna. Socialdemokraterna rasar från 40,7 procent förra året, till 31,9 i dagsläget. – Det finns en frustration. Det finns ett politikerförakt. Ett etablissemangsförakt och avsaknad av sakpolitik. Man tycker att det är för mycket ”vem tar vem”, säger LO-ordföranden Johan Lindholm till TV4 Nyheterna i Almedalen. Arbetarna känner inget förtroende Johan Lindholm berättar att han kommit till politikerveckan efter en resa med verksamhetsbesök där han träffat och talat med LO-medlemmar i olika branscher. Han fick intrycket att arbetarna inte känner något förtroende för att politikerna vill lösa Sveriges problem. LO-ordföranden som också sitter i Socialdemokraternas verkställande utskott, drar slutsatsen att partiet måste prata mer sakpolitik för att få tillbaka arbetarmännen till Arbetarepartiet. – Det är mer att man ska slå varandra i huvudet och jaga runt i sandlådan än att faktiskt tala om vad var och en vill, säger Lindholm. Han nämner pensionshöjningar och avskaffandet av karensavdraget som särskilt viktiga frågor som S måste driva hårt i valrörelsen. – Vi hjälper till, driver på från LO:s håll vad vi tror är viktigt och bra för Sveriges arbetare. Får vi upp de frågorna och får till de politiska beslut som krävs så tror jag att vi är på rätt väg. Men det finns ingen ”quick fix”.", "link": "https://www.tv4.se/artikel/5fmqs5h01YbUNfBynqiP0E/lo-maennen-foeredrar-sd-igen-finns-ett-politikerfoerakt", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:19:39+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/valet-2026", "/politik", "/valet-2022/socialdemokraterna", "/tidopartier", "/ulf-kristersson", "/magdalena-andersson", "/landsorganisationen-i-sverige-lo"]}, {"id": 120, "title": "After the nightmare - now Isak shines again: \"Good place\"", "summary": "Let's just say that the debut season in Liverpool turned out to be a bit of a nightmare. Alexander Isak shines in the national team uniform. Now he wants to push Sweden to the round of 16 in the World Cup. - I feel that I am in a good place now, says Sweden's attacking star ahead of the fateful match against Japan.", "title_original": "Efter mardrömmen – nu lyser Isak igen: &quot;Bra plats”", "summary_original": "Låt vara att debutsäsongen i Liverpool blev lite av en mardröm. I landslagdressen skiner Alexander Isak. Nu vill han skjuta Sverige till 16-delsfinal i fotbolls-VM. – Jag känner att jag är på en bra plats nu, säger Sveriges anfallsstjärna inför ödesmatchen mot Japan.", "link": "https://www.svd.se/a/xre9Xp/alexander-isak-stalls-mot-japan-i-fotbolls-vm", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:18:40+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 121, "title": "Susanne Nyström: Did Ebba Busch suddenly forget Jimmie Åkesson?", "summary": "Ebba Busch's choice of path requires more than soft words. Nowadays, her responsibility does not end with her own party.", "title_original": "Susanne Nyström: Glömde Ebba Busch plötsligt bort Jimmie Åkesson?", "summary_original": "Ebba Buschs vägval kräver mer än mjuka ord. Numera slutar hennes ansvar inte vid det egna partiet.", "link": "https://www.dn.se/ledare/susanne-nystrom-glomde-ebba-busch-plotsligt-bort-jimmie-akesson/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:18:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "This is how you avoid the common stomach bug", "summary": "Wash knives, cutting boards and wash your hands - this is how you avoid the intestinal bacteria campylobacter. - There is a clear increase in people during June, July and August, says Catarina Flink, microbiologist at the Swedish Food Agency.", "title_original": "Så undviker du vanliga magsjukebakterien", "summary_original": "Diska knivar, skärbrädor och tvätta händerna – så undviker du tarmbakterien campylobacter. – Det är en tydlig ökning hos människor under juni, juli och augusti, säger Catarina Flink, mikrobiolog vid Livsmedelsverket.", "link": "https://www.svd.se/a/ExzB55/sa-undviker-du-vanliga-magsjukebakterien", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:13:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 123, "title": "Is the end of free AI now?", "summary": "PODD From token-maxxing to token-minimizing in less than six months. Is the time of free Chat GPT over?", "title_original": "Är det slut på gratis AI nu?", "summary_original": "PODD Från token-maxxing till token-minimizing på mindre än ett halvår. Är det slut på tiden med gratis Chat GPT?", "link": "https://www.svd.se/a/8pRPbQ/svds-podd-tech-brief-ar-det-slut-pa-gatis-ai-nu", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:01:42+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 124, "title": "Experts judge SSAB's explanation about the disease cases: \"unlikely\"", "summary": "34 mysterious cases of illness stopped one of Sweden's biggest industrial projects of all time. Only after SSAB provided an official explanation for the events was the workplace opened and the construction workers sent back. Now DN can reveal that the steel company's medical advisers are ruling out the explanation. \"We feel safe with our conclusions,\" SSAB replies.", "title_original": "Experter dömer ut SSAB:s förklaring om sjukdomsfallen: ”osannolik”", "summary_original": "34 mystiska sjukdomsfall stoppade ett av Sveriges största industriprojekt genom tiderna. Först efter att SSAB lämnade en officiell förklaring till händelserna öppnades arbetsplatsen och byggarbetarna skickades tillbaka. Nu kan DN avslöja att stålbolagets medicinska rådgivare dömer ut förklaringen. ”Vi känner oss trygga med våra slutsatser”, svarar SSAB.", "link": "https://www.dn.se/sverige/experter-domer-ut-ssabs-forklaring-om-sjukdomsfallen-osannolik/", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:00:21+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 125, "title": "Here, it costs the most to sell wine on the farm", "summary": "In Huddinge, it costs SEK 25,000 to apply for a farm sale permit, while the fee in Falkenberg is SEK 1,010. The differences between the municipalities are unreasonable, believes the industry organization Visita.", "title_original": "Här kostar det mest att sälja vin på gården", "summary_original": "I Huddinge kostar det 25 000 kronor att söka tillstånd för gårdsförsäljning, medan avgiften i Falkenberg är 1 010 kronor. Skillnaderna mellan kommunerna är orimliga, anser branschorganisationen Visita.", "link": "https://www.svd.se/a/Gxw6nV/har-kostar-det-mest-att-salja-vin-pa-garden", "date_display": "2026-06-25", "date_iso": "2026-06-25T04:00:11+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 126, "title": "Strong earthquakes in Venezuela - tens of thousands feared dead", "summary": "Two powerful earthquakes have struck Venezuela. Pictures show massive destruction. Thousands to tens of thousands of people are feared dead.", "title_original": "Kraftiga jordbävningar i Venezuela – tiotusentals befaras döda", "summary_original": "Två kraftiga jordbävningar har slagit mot Venezuela. Bilder visar enorm förstörelse. Tusentals till tiotusentals människor befaras vara döda.", "link": "https://www.dn.se/varlden/kraftiga-jordbavningar-i-venezuela-tiotusentals-befaras-doda/", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:57:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 127, "title": "Fried salmon with lemon butter sauce and pickled fennel", "summary": "Today's dinner tip offers salmon served with a smooth lemon butter sauce flavored with trout roe and dill. To that, a fresh pickled fennel and boiled potatoes. An elegant and easy-to-prepare dish to make when you want to cook something extra good without any fuss. See Jacob Jansson's recipe", "title_original": "Stekt lax med citronsmörsås och picklad fänkål", "summary_original": "Dagens middagstips bjuder på lax serverad med en len citronsmörsås smaksatt med forellrom och dill. Till det en frisk picklad fänkål och kokt potatis. En elegant och lättlagad rätt att göra när du vill laga något extra gott utan att krångla till det. Se Jacob Janssons recept", "link": "https://www.tv4.se/artikel/45YU79oZxtz2DWvhd1wog5/stekt-lax-med-citronsmoersas-och-picklad-faenkal", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:37:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/sveriges-masterkock"]}, {"id": 128, "title": "Leader: Make sure grandma gets fluids when the heat wave hits", "summary": "The extreme heat holds Southern Europe in an unhealthy grip. The heat wave is coming to Sweden this weekend. Are we prepared?", "title_original": "Ledare: Se till att mormor får vätska när värmeböljan slår till", "summary_original": "Extremhettan håller Sydeuropa i ett hälsovådligt grepp. Till helgen kommer värmeböljan till Sverige. Är vi beredda?", "link": "https://www.dn.se/ledare/se-till-att-mormor-far-vatska-nar-varmeboljan-slar-till/", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:09:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "\"Lappis\" wants to create self-confidence to tell about life with Jesus", "summary": "Between 5,000 and 10,000 visitors are expected at the Pentecostal movement's conference outside Lycksele next week.", "title_original": "”Lappis” vill skapa självförtroende att berätta om livet med Jesus", "summary_original": "Mellan 5 000 och 10 000 besökare väntas till pingströrelsens konferens utanför Lycksele nästa vecka.", "link": "https://www.dagen.se/nyheter/lappis-vill-skapa-sjaelvfoertroende-att-beraetta-om-livet-med-jesus/10387614", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Jakob Norrhall:\nIs the Christian return an intellectual Vasa ship?", "summary": "That Christianity is on the rise is not only the merit of the church but also the fault of the atheists", "title_original": "Jakob Norrhall:\nÄr den kristna återkomsten ett intellektuellt Vasaskepp?", "summary_original": "Att kristendomen är på uppgång är inte bara är kyrkans förtjänst utan också ateisternas fel", "link": "https://www.dagen.se/ledare/jakob-norrhall-aer-den-kristna-aterkomsten-ett-intellektuellt-vasaskepp/10410354", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Vimlet in Visby becomes the model for the church's role in democracy", "summary": "Erik Helmerson: The cathedral serves as both a square and a refuge.", "title_original": "Vimlet i Visby blir modellen för kyrkans roll i demokratin", "summary_original": "Erik Helmerson: Domkyrkan tjänar som både torg och tillflykt.", "link": "https://www.dagen.se/ledare/vimlet-i-visby-blir-modellen-foer-kyrkans-roll-i-demokratin/10410116", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Mercy also requires responsibility", "summary": "The time when you could dismiss all objections to extensive immigration as a lack of mercy is over, writes Alexander Christiansson (SD) in a reply.", "title_original": "Barmhärtighet kräver också ansvar", "summary_original": "Den tid då man kunde avfärda alla invändningar mot en omfattande invandring som brist på barmhärtighet är förbi, skriver Alexander Christiansson (SD) i en replik.", "link": "https://www.dagen.se/debatt/barmhaertighet-kraever-ocksa-ansvar/10408445", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Josefin de Gregorio:\n Everything is surface and imitation, nothing really means anything", "summary": "I return to the promises of the Bible to find my true identity", "title_original": "Josefin de Gregorio:\n Allt är yta och efterapning, ingenting betyder egentligen någonting", "summary_original": "Jag återvänder till Bibelns löften för att finna min sanna identitet", "link": "https://www.dagen.se/kultur/josefin-de-gregorio-allt-aer-yta-och-efterapning-ingenting-betyder-egentligen-nagonting/10402315", "date_display": "2026-06-25", "date_iso": "2026-06-25T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Earthquake in Venezuela – risk of tens of thousands of dead", "summary": "Two strong earthquakes have struck Venezuela, according to the United States Geological Survey USGS. They have caused damage in several states, states the country's president, Delcy Rodríguez. There is a high risk that the death toll after the quake will be between 10,000 and 100,000, according to the USGS, according to Reuters.", "title_original": "Jordskalv i Venezuela – risk för tiotusentals döda", "summary_original": "Två kraftiga jordbävningar har drabbat Venezuela, enligt USA:s geologiska myndighet USGS. De har orsakat skador i flera delstater, uppger landets president Delcy Rodríguez. Det finns en stor risk för att dödssiffran efter skalvet blir mellan 10 000 och 100 000, uppger USGS enligt Reuters.", "link": "https://www.dn.se/varlden/venezuela-stora-skador-efter-skalv/", "date_display": "2026-06-25", "date_iso": "2026-06-25T02:11:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "On a medium-sized club scene, Fakemink comes into its own", "summary": "With control and integrity, Fakemink convinces live, writes DN's reviewer about the bumpy performance at Debaser.", "title_original": "På en mellanstor klubbscen kommer Fakemink till sin rätt", "summary_original": "Med kontroll och integritet övertygar Fakemink live, skriver DN:s recensent om den knökfulla spelningen på Debaser.", "link": "https://www.dn.se/kultur/pa-en-mellanstor-klubbscen-kommer-fakemink-till-sin-ratt/", "date_display": "2026-06-24", "date_iso": "2026-06-24T22:48:34+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "Yellow cards could force Potter into changes", "summary": "There are things that speak for a new Swedish starting eleven for the World Cup match against Japan. Like the suspension threat hanging over several players. - It is something we are aware of, says Sweden's national team captain Graham Potter.", "title_original": "Gula kort kan tvinga Potter till förändringar", "summary_original": "Det finns saker som talar för en ny svensk startelva till VM-matchen mot Japan. Som det avstängningshot som hänger över flera spelare. – Det är något vi är medvetna om, säger Sveriges förbundskapten Graham Potter.", "link": "https://www.dn.se/sport/gula-kort-kan-tvinga-potter-till-forandringar/", "date_display": "2026-06-24", "date_iso": "2026-06-24T21:48:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Switzerland group winners after the talent's success", "summary": "Freiburg's 20-year-old Johan Manzambi was behind everything when Switzerland won 2-1 against Canada in the World Cup. A win that gave the alpine country the group victory.", "title_original": "Schweiz gruppvinnare efter talangens succé", "summary_original": "Freiburgs 20-åring Johan Manzambi låg bakom allt när Schweiz vann med 2–1 mot Kanada i fotbolls-VM. En vinst som gav alplandet gruppsegern.", "link": "https://www.dn.se/sport/schweiz-gruppvinnare-efter-talangens-succe/", "date_display": "2026-06-24", "date_iso": "2026-06-24T21:09:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Putin sulks - over Trump's positive words about Ukraine: \"Deep misunderstanding\"", "summary": "Russia accuses the US of abandoning its efforts to end the war in Ukraine.  The background is data from last week's G7 meeting in Évian-les-Bains, France. There, Donald Trump is said to have been \"enormously impressed and enthusiastic\" about Ukraine's long-range attacks against targets deep inside Russia. He is also reported to have agreed to tighten sanctions against Russian oil.  Ukrainian officials tell the Financial Times they see signs of strengthened US support - a view shared in Moscow.  - The Russians definitely perceive it that way. Now there are only sour faces, says Russia expert Malcolm Dixelius. The US cannot close its eyes to the progress Russian Foreign Minister Sergey Lavrov believes that Trump's positive tone shows that the US is \"backing away from the role of objective mediator\" and has \"forgotten\" previous sympathies for Moscow's line.  But according to Dixelius, it is not about a dramatic change of course in Washington - but about developments on the battlefield.  - Ukraine is making progress that the US cannot turn a blind eye to. It is the reality that has changed, not the US attitude.  Among other things, he points to Ukraine's advanced drone warfare, where the country has exploited Russia's large area and found weaknesses in the air defense to attack oil facilities, transport routes and military infrastructure.  Deep misunderstanding At the same time, Dixelius describes a growing frustration in Moscow, where the expectations of the United States have been unrealistic. He highlights the meeting between Vladimir Putin and Donald Trump in Alaska last August as an important starting point.  - The Russian leadership obviously lives in the delusion that what happened in Alaska was very significant and decisive, where Russia thought it could sweep home the victory in the war on the negotiating table. But the Americans have never said it was that way, says the Russia expert. - There is a deep misunderstanding and that in turn leads to this tremendous disappointment. \"I was scared\" Malcolm Dixelius says he is worried", "title_original": "Putin surar – över Trumps positiva ord om Ukraina: ”Djupt missförstånd”", "summary_original": "Ryssland anklagar USA för att ha övergett sina försök att få till ett slut på kriget i Ukraina.  Bakgrunden är uppgifter från förra veckans G7-möte i franska Évian-les-Bains. Där ska Donald Trump ha varit ”enormt imponerad och entusiastisk” över Ukrainas långdistansattacker mot mål djupt inne i Ryssland. Han uppges också ha gått med på att skärpa sanktionerna mot rysk olja.  Ukrainska tjänstemän säger till Financial Times att de ser tecken på ett stärkt amerikanskt stöd – en bild som delas i Moskva.  – Ryssarna uppfattar det definitivt så. Nu är det bara sura miner, säger Rysslandskännaren Malcolm Dixelius. USA kan inte blunda för framstegen Rysslands utrikesminister Sergej Lavrov menar att Trumps positiva tongångar visar att USA ”backar från rollen som objektiv medlare” och har ”glömt bort” tidigare sympatier för Moskvas linje.  Men enligt Dixelius handlar det inte om någon dramatisk kursändring i Washington – utan om utvecklingen på slagfältet.  – Ukraina gör framsteg som USA inte kan blunda för. Det är verkligheten som har förändrats, inte USA:s inställning.  Han pekar bland annat på Ukrainas avancerade drönarkrigföring, där landet utnyttjat Rysslands stora yta och hittat svagheter i luftförsvaret för att slå mot oljeanläggningar, transportleder och militär infrastruktur.  Djupt missförstånd Samtidigt beskriver Dixelius en växande frustration i Moskva, där förväntningarna på USA varit orealistiska. Han lyfter mötet mellan Vladimir Putin och Donald Trump i Alaska i augusti förra året som en viktig utgångspunkt.  – Den ryska ledningen lever uppenbarligen i vanföreställningen att det som skedde i Alaska var väldigt betydelsefullt och avgörande, där Ryssland trodde att man kunde sopa hem segern i kriget på förhandlingsbordet. Men amerikanerna har ju aldrig sagt att det var på det sättet, säger Rysslandskännaren. – Där finns ett djupt missförstånd och det i sin tur leder då till den här oerhörda besvikelsen. ”Jag blev skrämd” Malcolm Dixelius säger att han är orolig över Vladimir Putins verklighetsbild.  – Jag blev skrämd när jag hörde Putins tal vid det ekonomiska forumet tidigare i juni. Han verkade så otroligt\nverklighetsfrämmande och gav en beskrivning av kriget som inte stämde på en enda punkt. Enligt honom riskerar den bristande verklighetsförankringen att få allvarliga konsekvenser, bland annat för Putins trovärdighet. – Om det är den information han får så står det otroligt illa till i Ryssland. Ledarskapet kring Putin verkar befinna sig i förnekelse.", "link": "https://www.tv4.se/artikel/4ohPTfbzDQChT9SDrZaxLk/putin-surar-oever-trumps-positiva-ord-om-ukraina-djupt-missfoerstand", "date_display": "2026-06-24", "date_iso": "2026-06-24T19:52:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/putin", "/vladimir-putin", "/zelenskyj", "/donald-trump"]}, {"id": 139, "title": "The cleaning expert catches the warning in social media: \"Disaster\"", "summary": "On Tiktok there is a clip with over 150,000 views where a creator says that he never wants to use a communal laundry again after working in the domestic service and seeing what is washed there. In another clip on the same theme from four years ago, a person writes in the comment field: \"People wash their children's cloth diapers in the same washing machine as they wash their towels with which they dry their faces.\" But what is actually usually washed in the shared laundry room? - Everything is possible, says cleaning expert Marléne Eriksson to TV4 Nyheterna. - They may have washed carpets and everything in that machine. Then your entire laundry can be full of fluff. Wash an empty machine first Therefore, like several users in the comment section, she advises to run an empty wash at at least 60 degrees before starting to wash your things. - It's not just for hygienic reasons. You never know what has been washed there before. They might have washed a duvet full of down, you never know. To be sure of not ruining your laundry, you should always check the machine properly and be happy to run a machine, says Marléne Eriksson. A user writes that she always cleans the washing machine both before and after use in the shared laundry room. \"Disaster\" Marléne Eriksson, however, doesn't think it's that common. According to her observations from assignments in condominium associations, it is often very dirty. - Disaster. There are very few people who clean and tidy up after themselves in the laundry room. However, one user comments that many have no choice but to wash in the common area. According to Marléne Eriksson, you don't need to have your own machine to feel confident that your laundry will be clean. - But you have to think about what you put in, she says. If you don't want to run an empty machine, the cleaning expert recommends starting with non-sore garments. - Something you are not afraid of. Something you feel like that, I can wash it in the washing machine. It doesn't matter if it gets fluff. The housing company: waste of water", "title_original": "Städexperten hakar på varningen i sociala medier: ”Katastrof”", "summary_original": "På Tiktok finns ett klipp med över 150 000 visningar där en kreatör säger att hen aldrig mer vill använda en gemensam tvättstuga efter att ha arbetat i hemtjänsten och sett vad som tvättas där. I ett annat klipp på samma tema från fyra år tillbaka skriver en person i kommentarsfältet: ”Folk tvättar sina barns tygblöjor i samma tvättmaskin som man tvättar sina handdukar som man torkar ansiktet med.” Men vad är det egentligen som brukar tvättas i den gemensamma tvättstugan? – Det är ju allt möjligt, säger städexperten Marléne Eriksson till TV4 Nyheterna. – De kan ha tvättat mattor och allting i den där maskinen. Då kan hela din tvätt bli full med ludd. Tvätta en tom maskin först Därför tipsar hon, i likhet med flera användare i kommentarsfältet, om att köra en tom tvätt på minst 60 grader innan man börjar tvätta sina saker. – Det är inte bara utav hygieniska skäl. Du vet aldrig vad som har tvättats där innan. De kan ha tvättat ett duntäcke fullt med dun, det vet du inte. För att vara säker på att inte förstöra sin tvätt ska man alltid kontrollera maskinen ordentligt och gärna köra en maskin, säger Marléne Eriksson. En användare skriver att hen alltid rengör tvättmaskinen både före och efter användning i den gemensamma tvättstugan. ”Katastrof” Marléne Eriksson tror dock inte att det är så vanligt. Enligt hennes observationer från uppdrag i bostadsrättsföreningar är det ofta väldigt smutsigt. – Katastrof. Det är väldigt få som gör rent och fint efter sig i tvättstugan. En användare kommenterar dock att många inte har något val än att tvätta i de gemensamma utrymmet. Enligt Marléne Eriksson behöver man inte ha egen maskin för att känna sig trygg med att tvätten blir ren. – Men man ska tänka på vad man stoppar i, säger hon. Vill man inte köra en tom maskin rekommenderar städexperten att börja med oömma plagg. – Någonting du inte är rädd om. Något du känner att det där, det kan jag tvätta i tvättmaskin. Det gör ingenting om det blir ludd. Bostadsbolaget: slöseri med vatten Att köra en tom tvätt innan man börjar tvätta sina saker är dock inget som Åsa Stenmark, kommunikationschef på ett av landets största bostadsbolag, rekommenderar. – Det är inte särskilt hållbart utan slöseri med vatten och inget vi på Stockholmshem har upplevt är ett problem, säger hon. Hon känner till att det vid något enstaka tillfälle har kommit in en anmälan om att någon har färgat kläder i den gemensamma tvättstugan. – Det ska man inte göra, men det är ytterst ovanligt. Förtvätt är ett slöseri med vatten, det är inte miljövänligt, säger hon. Stockholmshem anlitar städföretag för städning i deras tvättstugor. – Visst kan det förekomma att det är stökigt, och det är människor som inte alltid tar hand om sin smutstvätt. Men jag skulle säga att det generellt är bra. Av den anledningen behöver man inte förtvätta sin tvätt, säger Åsa Stenmark.", "link": "https://www.tv4.se/artikel/G3Ya7wmgBYssMvGCcIMqf/staedexperten-hakar-pa-varningen-i-sociala-medier-katastrof", "date_display": "2026-06-24", "date_iso": "2026-06-24T19:02:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/halsa", "/hem-och-hushall", "/stada", "/stadning", "/stadtips", "/marlene-eriksson"]}, {"id": 140, "title": "Focus on Nordic countries’ joint security of supply as representatives meet in Visby", "summary": "Together, the Nordic countries have stronger capability to ensure access to essential goods and services in peacetime crises, security-related crisis situations and, ultimately, war. On 24 June, Minister for Civil Defence Carl-Oskar Bohlin met with representatives of several Nordic countries.", "title_original": "Focus on Nordic countries’ joint security of supply as representatives meet in Visby", "summary_original": "Together, the Nordic countries have stronger capability to ensure access to essential goods and services in peacetime crises, security-related crisis situations and, ultimately, war. On 24 June, Minister for Civil Defence Carl-Oskar Bohlin met with representatives of several Nordic countries.", "link": "https://www.government.se/press-releases/2026/06/focus-on-nordic-countries-joint-security-of-supply-as-representatives-meet-in-visby/", "date_display": "2026-06-24", "date_iso": "2026-06-24T18:31:46+00:00", "source": "Government.se", "ministry": "Ministry of Defence", "type": "Official Information", "age_tag": "today", "tags": ["Press release", "International", "Ministry of Defence", "Emergency preparedness", "Carl-Oskar Bohlin", "Civil defence", "International defence cooperation", "Total defence"]}, {"id": 141, "title": "A fragile calm in Sweden's underworld", "summary": "", "title_original": "Ett skört lugn i Sveriges undre värld", "summary_original": "", "link": "https://www.tv4.se/artikel/3eM5ZTYvOk1RjwhpAiOFs4/ett-skoert-lugn-i-sveriges-undre-vaerld", "date_display": "2026-06-24", "date_iso": "2026-06-24T17:57:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff"]}, {"id": 142, "title": "Fewer child torpedoes - violence is decreasing in Sweden", "summary": "\"Parents have started to take more responsibility for their young people\"", "title_original": "Färre barntorpeder – våldet minskar i Sverige", "summary_original": "”Föräldrar har börjat ta mer ansvar över sina ungdomar”", "link": "https://www.tv4.se/artikel/7HFojFzTw2ADM3UbrAAUwf/faerre-barntorpeder-valdet-minskar-i-sverige", "date_display": "2026-06-24", "date_iso": "2026-06-24T17:55:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 143, "title": "Protecting Ukraine - with its old fishing nets: \"Will save lives\"", "summary": "In a parking lot next to the old fire station in Skellefteå, the nets are packed into stackable plastic trays. Within a few weeks, they will be sent to the eastern front in Ukraine. The municipality of Skellefteå has been collaborating with the eastern Ukrainian city of Sumy for almost a year now and supports the municipality in any way it can. The collection of fishing nets is one of the initiatives. Collection with fishermen and students The nets, which would otherwise have ended up in the landfill, have been collected through a collaboration between the municipality, students on the vehicle program and professional fishermen in Västerbotten. - Would say it's 30 cubic meters - it's probably 15 tonnes. SEK 500 per cubic meter, says David Lidström, international manager at Skellefteå municipality. Protection against drone attacks Once in Ukraine, nets are stretched over roads and bridges to act as a physical barrier against kamikaze drones. - It protects transport and then it will protect lives. And it will protect above all vital parts of roads that must be available for blue light operations, I think, says Lindström. - Yes, it is important. Sumy where it is located really needs protected roads. It is close to the Russian border and then you are very exposed to drone attacks, he continues.", "title_original": "Skyddar Ukraina – med sina gamla fisknät: ”Kommer rädda liv”", "summary_original": "På en parkering intill den gamla brandstationen i Skellefteå packas näten ner i stapelbara plastbackar. Inom några veckor ska de skickas till östra fronten i Ukraina. Skellefteå kommun har sedan knappt ett år tillbaka ett samarbete med den östukrainska staden Sumy och stöttar på det sätt kommunen kan. Insamlingen av fisknät är ett av initiativen. Insamling med fiskare och elever Näten, som annars skulle ha hamnat på soptippen, har samlats in genom ett samarbete mellan kommunen, elever på fordonsprogrammet och yrkesfiskare i Västerbotten. – Skulle säga att det är 30 kubik – det är nog 15 ton. 500 kronor per kubik, säger David Lidström, internationell chef vid Skellefteå kommun. Skydd mot drönarattacker Väl i Ukraina spänns näten upp över vägar och broar för att fungera som ett fysiskt hinder mot kamikazedrönare. – Det skyddar transporter och då kommer det skydda liv. Och det kommer skydda framförallt vitala delar av vägar som måste finnas tillgängliga för blåljusverksamhet tänker jag, säger Lindström. – Jo med det är viktigt. Sumy där det ligger behöver verkligen skyddade vägar. Det ligger nära ryska gränsen och då är man väldigt utsatt för drönarattacker, fortsätter han.", "link": "https://www.tv4.se/artikel/zZeYXspeGWBO8rOku6khk/skyddar-ukraina-med-sina-gamla-fisknaet-kommer-raedda-liv", "date_display": "2026-06-24", "date_iso": "2026-06-24T16:33:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/skelleftea"]}, {"id": 144, "title": "Relief in the countryside after the decision on protective hunting: \"Spreads fear after all\"", "summary": "It took three minutes after the wolf attack on the night of Tuesday before the pony Pippi was so bad that her life could not be saved. - It spreads fear, says Camilla Nordström, whose partner saw how the wolf stood and ate on her daughter's horse. Another attack on domestic animals has taken place in the last two weeks and now the County Administrative Board has decided to initiate a protective hunt for the wolf. In June, a ram was attacked on the border between Ystad and Simrishamn municipality. - Relief. But it's not over yet. It's over when it's over. In this situation, with this individual, it is absolutely a step in the right direction, she says. Few wild animals to hunt DNA shows that the wolf comes from a territory in Västmanland. The area it is now in lacks wild animals that the wolf can hunt, according to the County Administrative Board. Camilla Nordström thinks it is in the wrong place. - There is no forest for it to hide in and there are not many ungulates here. There are no deer to eat here. So this wolf is kind of not doing well here – it's starving and has no food. And then it goes without saying that it goes on our domestic animals. This wolf needs to be removed from here, she says. \"Everyone is positive about the decision\" Camilla Nordström has a large horse that she hopes to take home for the weekend and also has children on the farm. - A four-year-old, chickens and a cat. And then all the neighbors. We have a lot of horses around us. Her partner is a hunter and was the one who chased the wolf away from the pasture with his rifle. Camilla Nordström believes that everyone with a license in the area will help each other to create security in the area. - I think we are all positive about the decision. If you had been down here and seen how we live, with farms close together, completely open fields and no forest as far as the eye can see, you would probably understand that this is no habitat for a wolf to live in. So that's a relief.", "title_original": "Lättnad i bygden efter beslut om skyddsjakt: ”Sprider ju skräck”", "summary_original": "Det tog tre minuter efter vargattacken natten mot tisdagen innan ponnyn Pippi var så illa däran att hennes liv inte gick att rädda. – Det sprider ju skräck, säger Camilla Nordström, vars sambo såg hur vargen stod och åt på hennes dotters häst. Ytterligare ett angrepp på tamdjur har skett de senaste två veckorna och nu har Länsstyrelsen beslutat att inleda skyddsjakt på vargen. I juni angreps en bagge på gränsen mellan Ystad och Simrishamns kommun. – Lättnad. Men det är inte över än. Det är över när det är över. I det här läget, med den här individen, är det absolut ett steg i rätt riktning, säger hon. Ont om vilda djur att jaga Dna visar att vargen kommer från ett revir i Västmanland. Området den nu befinner sig i har ont om vilda djur som vargen kan jaga, enligt Länsstyrelsen. Camilla Nordström tycker att den är på fel ställe. – Det finns ingen skog för den att gömma sig i och här finns inte så mycket klövvilt. Här finns inga rådjur att äta. Så den här vargen mår liksom inte bra här – den är utsvulten och har ingen mat. Och då är det ju självklart att den går på våra tamdjur. Den här vargen behöver tas bort härifrån, säger hon. ”Alla är positiva till beslutet” Camilla Nordström har en stor häst som hon hoppas kunna ta hem till helgen och har även barn på gården. – En fyraåring, höns och katt. Och sen alla grannar. Vi har jättemycket hästar runt omkring oss. Hennes sambo är jägare och var den som motade bort vargen inifrån hagen med sitt gevär. Camilla Nordström tror att alla med licens i området kommer att hjälpas åt för att skapa trygghet i bygden. – Jag tror att vi alla är positiva till beslutet. Om man hade varit här nere och sett hur vi bor, med gårdar nära varandra, helt öppna åkrar och ingen skog så långt ögat når, så hade man nog förstått att det här inte är något habitat för en varg att bo i. Så det är en lättnad.", "link": "https://www.tv4.se/artikel/6R6hRYrvlz569yYGa1Y5qX/laettnad-i-bygden-efter-beslut-om-skyddsjakt-sprider-ju-skraeck", "date_display": "2026-06-24", "date_iso": "2026-06-24T16:30:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/husdjur", "/ystad", "/varg", "/vargattacker"]}, {"id": 145, "title": "Sweden’s strategy for a peaceful, secure and sustainable Arctic", "summary": "The overarching and long-term objective of Sweden’s Arctic policy is a peaceful and secure Arctic, with sustainable, robust and attractive communities and reduced environmental and climate impact.", "title_original": "Sweden’s strategy for a peaceful, secure and sustainable Arctic", "summary_original": "The overarching and long-term objective of Sweden’s Arctic policy is a peaceful and secure Arctic, with sustainable, robust and attractive communities and reduced environmental and climate impact.", "link": "https://www.government.se/legal-documents/2026/06/swedens-strategy-for-a-peaceful-secure-and-sustainable-arctic/", "date_display": "2026-06-24", "date_iso": "2026-06-24T14:20:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["Legal document", "International", "Ministry for Foreign Affairs", "Foreign and security policy"]}, {"id": 146, "title": "SMHI extends heat warning: \"It can be difficult to cool down\"", "summary": "During yesterday, SMHI issued a yellow warning for high temperatures in parts of Blekinge and Kalmar counties from Thursday to Sunday. Now another warning for high temperatures has been issued in large parts of Götaland from Friday to Sunday. \"Very warm air moves in, which leads to the temperature reaching at least 30 degrees during the day,\" writes SMHI. The nights are also expected to be warm, which makes it difficult to ventilate.  - It can be difficult to cool down, says Ingrid Eronn. \"Drink water\" People in the warning area are now asked to pay attention to the body's warning signals. - It will be hot. Drink a lot and take it easy, says the meterologist. We can also expect local thunderstorms, especially over Götaland and central Norrland. - But it may change because it is so local. Keep an eye on the radar. Not long-lasting However, the heat is not particularly long-lasting.  Already after the weekend, the forecast returns to normal Swedish summer weather. - Then it is no longer 30 degrees, but it will be just over 25 on Monday and on Tuesday we will be down to around 20 degrees. So normal Swedish temperatures, says Ingrid Eronn.", "title_original": "SMHI utökar värmevarning: ”Kan vara svårt att svalka sig”", "summary_original": "Under gårdagen utfärdade SMHI en gul varning för höga temperaturer i delar av Blekinge och Kalmar län från torsdag till söndag. Nu har ytterligare en varning för höga temperaturer utfärdats i stora delar av Götaland från fredag till söndag. ”Väldigt varm luft rör sig in vilket leder till att temperaturen når minst 30 grader under dagarna”, skriver SMHI. Även nätterna väntas bli varma, vilket försvårar möjligheten att vädra ur.  – Det kan vara svårt att svalka sig, säger Ingrid Eronn. ”Drick vatten” Människor som befinner sig i varningsområdet uppmanas nu att vara uppmärksam på kroppens varningssignaler. – Det blir varmt. Drick mycket och ta det lugnt, säger meterologen. Vi kan också vänta oss lokala åskskurar, speciellt över Götaland och mellersta Norrland. – Men det kan komma att ändras eftersom det är så lokalt. Håll koll i radarn. Inte långvarigt Värmen blir dock inte speciellt långvarig.  Redan efter helgen återgår prognosen till det normala svenska sommarvädret. – Då är det inte 30 grader längre, men det blir drygt 25 på måndag och på tisdag är vi nere på runt 20 grader. Alltså normala svenska temperaturer, säger Ingrid Eronn.", "link": "https://www.tv4.se/artikel/6VShvcnnu7RIKHrO39RH44/smhi-utoekar-varning-foer-hoega-temperaturer", "date_display": "2026-06-24", "date_iso": "2026-06-24T13:47:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/vadret", "/smhi", "/vader", "/vadervarningar"]}, {"id": 147, "title": "The pastor and the minister disagree about putting children in prison", "summary": "But both agree on the main problem – something must be done about the increasingly serious violence where even children are hired as murderers", "title_original": "Pastorn och ministern oense om att sätta barn i fängelse", "summary_original": "Men båda överens om huvudproblemet – något måste göras åt det allt grövre våldet där även barn anlitas som mördare", "link": "https://www.dagen.se/nyheter/pastorn-och-ministern-oense-om-att-saetta-barn-i-faengelse/10410539", "date_display": "2026-06-24", "date_iso": "2026-06-24T12:25:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 148, "title": "Caravan legend Bertil welcomes higher speed limits", "summary": "An increased speed limit for caravans has been discussed in Sweden for several years following the initiative of individual members of parliament. The issue is now being prepared at the government office, but has so far not led to any change.  Now the Social Democrats are also entering the debate and making speed an election issue. The proposal, which was presented by Magdalena Andersson on Wednesday, means that teams that meet special technical and safety requirements will be allowed to drive at up to 100 kilometers per hour on Swedish roads. Today, the limit is 80 kilometers per hour. Welcomes the proposal One of those who welcomes the proposal is Bertil Eliasson, 83, from Ställdalen. For 30 years, he has been a constant guest at Böda camping and one of the profiles in the reality show of the same name. He has spent many miles on the roads with his caravan. - It is clear that it is a big brake block in traffic with caravans that drive slowly, so it would be very good if they could drive faster. Then I can think that the mobile homes are almost a bigger problem. They often drive even slower than the carts, he says. Neighboring countries are ahead In Denmark, Norway and Germany, among others, you can already drive up to 100 kilometers per hour with a caravan, subject to special approval and technical requirements. However, Bertil believes that the issue is more complex than one might think and he is not only positive about the proposal.  - I think many people can drive a caravan for 100, but not all of them. Some only use the caravan once or twice a year and therefore do not build up any knowledge and feeling. It is not entirely easy to take the turns properly. So there is a point in keeping the speeds down as well.", "title_original": "Husvagnslegendaren Bertil välkomnar högre hastighetsgräns", "summary_original": "En höjd hastighetsgräns för husvagnar har diskuterats i Sverige under flera år efter initiativ från enstaka riksdagsledamöter. Frågan bereds nu på regeringskansliet men har hittills inte lett till någon förändring.  Nu ger sig även Socialdemokraterna in i debatten och gör hastigheten till en valfråga. Förslaget, som presenterades av Magdalena Andersson under onsdagen, går ut på att ekipage som uppfyller särskilda tekniska och säkerhetsmässiga krav ska få köra i upp till 100 kilometer i timmen på svenska vägar. I dag är gränsen 80 kilometer i timmen. Välkomnar förslaget En av dem som välkomnar förslaget är Bertil Eliasson, 83, från Ställdalen. I 30 år har han varit en ständig gäst på Böda camping och en av profilerna i dokusåpan med samma namn. Han har tillbringat många mil på vägarna med sin husvagn. – Det är klart att det är en stor bromskloss i trafiken med husvagnar som kör långsamt så det vore ju väldigt bra om de kan få köra fortare. Sen kan jag tycka att husbilarna nästan är ett större problem. De kör ofta ännu långsammare än vagnarna, säger han. Grannländerna ligger före I bland annat Danmark, Norge och Tyskland får man redan köra i upp till 100 kilometer i timmen med husvagn, efter särskilt godkännande och tekniska krav. Bertil menar dock att frågan är mer komplex än man kan tro och han är inte enbart positiv till förslaget.  – Jag tror att många kan köra en husvagn i 100 men inte alla. En del använder bara husvagnen en eller ett par gånger om året och bygger därför inte upp någon kunskap och känsla. Det inte är helt lätt att ta ut svängarna ordentligt. Så det finns en poäng med att hålla nere farterna också.", "link": "https://www.tv4.se/artikel/6ioDEF5QRapqV7Losexv5s/husvagnslegendaren-bertil-vaelkomnar-hoegre-hastighetsgraens", "date_display": "2026-06-24", "date_iso": "2026-06-24T12:07:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Teknik", "/teknik", "/trafik", "/svensk-politik", "/valet-2026", "/inrikes"]}, {"id": 149, "title": "Here the 15-year-old is broken down and violated - by the police", "summary": "The police patrolled Kungsmässan on the evening of 10 October 2024 together with security guards. Then they met a couple of young people sitting on a bench in the shopping centre. One of the police officers, who was alone at the time, is said to have asked a 15-year-old boy about his social security number, the boy says in questioning. - What have I done? And they said \"no you haven't done anything\". Am I suspect of something then? They said no. Why should I give you my social security number then, I say. And they said because we say it. I said am I not suspected of anything? Then I might as well get out of here, right? And then he says, no, I'll shoot you with the stun gun. And I said, and who the hell do you think you are? Who are you to threaten me like that? - And then he grabs my neck and shoulder and throws me over. Jumps on me. Two guards and two policemen I think it was. Bangs my head on the ground and screams, give me your social security number, give me your social security number. I could hardly breathe. According to the policeman himself, he rejected the boy after reports that he had previously behaved disorderly in the mall. When he didn't listen to the warning but \"shut up\", didn't give his social security number, remained on the bench and had a \"bad attitude\", he chose to lift the 15-year-old up and put him on the floor \"to secure the situation and prevent an escalation\". When the boy later gave his social security number, he was released and asked to leave the scene, according to his own statement. \"I'm going to die\" Outside the mall, the 15-year-old called his parents and told them about the incident. In connection with that, he saw a policeman. - Then I go up to him and say that my father wants to talk to you, and do you think your colleague did a good job or. This was damn not okay. The policeman then called his colleagues over the radio. A female police officer had her body camera activated. The film, which was used as evidence and which TV4 Nyheterna can now publish, shows how she approached the boy. Suddenly she grabbed the teenager and wrestled him down on a b", "title_original": "Här blir 15-åringen nedbrottad och kränkt – av poliserna", "summary_original": "Poliserna patrullerade i Kungsmässan på kvällen den 10 oktober 2024 tillsammans med ordningsvakter. Då träffade de på ett par ungdomar som satt på en bänk i köpcentret. En av poliserna, som vid tillfället var ensam, ska ha frågat en 15-årig pojke om hans personnummer, berättar pojken i förhör. – Vad har jag gjort? Och de sa ”nej du har inte gjort något”. Är jag misstänkt för något då? De sa nej. Varför ska jag ge dig mitt personnummer då, säger jag. Och de sa för att vi säger det. Jag sa är jag inte misstänkt för något? Då kan jag väl lika gärna gå härifrån? Och då säger han, nej då skjuter jag dig med elpistolen. Och jag sa, och vem fan tror du att du är? Vem är du att hota mig liksom? – Och då tar han tag på typ nacken och axeln och slänger över mig. Hoppar på mig. Två vakter och två poliser tror jag det var. Bankar mitt huvud i marken och skriker, ge mig ditt personnummer, ge mig ditt personnummer. Jag kunde ju knappt andas liksom. Enligt polismannen själv avvisade han pojken efter uppgifter om att han tidigare uppträtt stökigt i gallerian. När han inte lyssnade på tillsägelsen utan ”käftade emot”, inte gav sitt personnummer, satt kvar på bänken och hade ”dålig attityd” valde han att lyfta upp 15-åringen och lägga ned honom på golvet ”för att säkra situationen och förhindra en eskalering”. När pojken senare gav sitt personnummer släpptes han och blev ombedd att lämna platsen, enligt egen utsago. ”Jag kommer fan dö” Utanför gallerian ringde 15-åringen sina föräldrar och berättade om händelsen. I samband med det såg han en polisman. – Då går jag fram till han och säger att min pappa vill prata med dig, och tycker du att din kollega gjorde ett bra jobb eller. Det här var fan inte okej. Polismannen tillkallade då på sina kollegor genom radion. En kvinnlig polis hade sin kroppskamera aktiverad. Filmen, som använts som bevisning och som TV4 Nyheterna nu kan publicera, visar hur hon gick fram till pojken. Plötsligt tog hon tag i tonåringen och brottade ned honom på en bänk och började skrika. Samma polisman som tidigare ingrep mot pojken ska samtidigt ha dragit fram sitt elchockvapen. – Vad är ditt problem? Vem fan är du att bete dig så jävla illa? Kungsmässan är inte ditt jävla vardagsrum, fattar du det eller? Det är inte ditt jävla vardagsrum. Du har inte nån jävla rätt att bete dig så här bland allmänheten. Vanligt jävla folk ska kunna gå ut och handla, fattar du det eller? Vem fan är du? Beter sig som att du är nån jävla gangster. Du är född i Sverige och du kan inte bete dig. Du ska göra rätt i samhället, skrek polisen samtidigt som hon höll pojken nedtryckt. 15-åringen upprepade ”förlåt” gråtandes med polisen över sig. – Har typ knät på min rygg och trycker ner mig på en blöt bänk, skriker en massa skit på mig. Alltså jag hade inte ens gjort någonting. (...) Så blev jag rädd, det var elpistolen. Jag var livrädd. Hur mycket volt är det i en sån där. Jag kommer för fan dö, säger tonåringen i förhör. – Man behöver inte tre poliser och två ordningsvakter, och en elpistol för att få ner en 15-åring på marken, jag är ju skitsmal. Försvaret: ”Röt till på skarpen” Den kvinnliga polisen har uppgett att hon vid tillfället var påverkad av skjutningen som hade skett på Kungsmässan dagarna tidigare. Hon tyckte att 15-åringen ”var otrevlig och hade en påstridig attityd” och att hon därför ”tog tag i hans jacka och röt till på skarpen för att skapa kontroll och ordning”. Polisåklagaren och avdelningen för särskilda utredningar, som utreder brott av polisanställda, ansåg att patrullens agerande var hänsynslöst och kränkande mot pojken samt att den kvinnliga polisen ”högljutt och skrikande yttrat personangrepp och svordomar” mot pojken. Tingsrätten dömde den kvinnliga polisen men friade polismannen. Hovrätten har nu dömt poliserna för ofredande. Domstolen ansåg att även den manliga polisens ingripande inne i gallerian inte var försvarligt och att det saknades skäl att använda våld mot pojken. Poliserna, som enligt personalansvarsnämnden kommer behålla jobbet, ska betala dagsböter på 24 000 kronor vardera och skadestånd på 15 000 kronor till pojken.", "link": "https://www.tv4.se/artikel/4e9tdBlM1NlbchreF8SJ3r/haer-blir-15-aringen-nedbrottad-och-kraenkt-av-poliserna", "date_display": "2026-06-24", "date_iso": "2026-06-24T11:37:15+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/kungsbacka", "/brott", "/polismyndigheten"]}, {"id": 150, "title": "Devoted his life to protecting turtles - killed in Israeli attack", "summary": "Environmental rights activist Mona Khalil, 76, has died of her injuries after an Israeli bomb attack two weeks ago, the BBC writes. She turned a stretch of beach in southern Lebanon into a nesting site for endangered sea turtles to lay their eggs. \"Talked about the beach as a person\" - She was a deeply committed environmentalist, says Hisham Younes, founder of the Lebanese environmental rights organization Green Southeners, to the BBC. - She used to talk about the beach as if it were a person. She had a special bond with the sunset, the water and the sea turtles. Khalil had worked to protect turtles, more specifically loggerhead and green sea turtles, for over 25 years. It all started with what relatives described as a \"life-changing\" meeting with a turtle that laid eggs on the beach in 1999. At the time, she was visiting from the Netherlands, where she had fled in connection with the civil war in Lebanon. But she would soon move back to her home country. Stayed despite danger During the 2006 war between Israel and Hezbollah, her house was damaged, but she stayed, and has continued to stay during the current Israeli attacks. - Mona barricaded herself in her house, did not receive visitors and thought she was safe because she was a civilian, says her friend Maha Joumaa to local media.", "title_original": "Vigde sitt liv åt att skydda sköldpaddor – dödad i israelisk attack", "summary_original": "Miljörättsaktivisten Mona Khalil, 76, har dött av sina skador efter ett israeliskt bombanfall för två veckor sedan, skriver BBC. Hon förvandlade en bit av strandremsan i södra Libanon till en häckningsplats där utrutningshotade havssköldpaddor kunde lägga ägg. ”Pratade om stranden som en person” – Hon var en djupt engagerad miljökämpe, säger Hisham Younes, grundare i den libanesiska miljörättsorganisationen Green Southeners, till BBC. – Hon brukade prata om stranden som om det vore en person. Hon hade ett speciellt band till solnedgången, vattnet och havssköldpaddorna. Khalil hade arbetat med att skydda sköldpaddor, mer specifikt oäkta karettsköldpaddor och gröna havssköldpaddor, i över 25 år. Allt började med vad anhöriga beskrivit som ett ”livsförändrande” möte med en sköldpadda som lagt ägg på stranden år 1999. Då var hon på besök från Nederländerna, dit hon flytt i samband med inbördeskriget i Libanon. Men hon skulle snart flytta tillbaka till hemlandet. Stannade trots faran Under kriget mellan Israel och Hizbollah 2006 skadades hennes hus, men hon stannade kvar, och fortsatte stanna kvar under de nutida israeliska attackerna. – Mona barrikaderade sig i sitt hus, tog inte emot besökare och trodde att hon var säker för att hon var civil, säger hennes vän Maha Joumaa till lokala medier.", "link": "https://www.tv4.se/artikel/1aRzx28mrnaIEpRWS5p06G/vigde-sitt-liv-at-att-skydda-skoeldpaddor-doedad-i-israelisk-attack", "date_display": "2026-06-24", "date_iso": "2026-06-24T10:24:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/libanon", "/israel", "/irankriget"]}, {"id": 151, "title": "Wrecked in Dalarna - tracked to Poland with hidden GPS transmitter", "summary": "Dirt bikes, motorbike equipment and quad bikes started disappearing without a trace mainly in Dalarna in February 2025. The thefts continued until the summer of the same year when the burglars struck in Leksand, where two motorcycles and a quad bike were stolen. In the latter vehicle, the owner had placed a hidden GPS transmitter and could be traced to a farm in southern Poland. Polish police then carried out an evening raid and found 20 stolen vehicles at the scene. DNA traces were secured and could be linked to a man. When the investigators analyzed the man's phone traffic and call lists, a network of perpetrators was discovered - in an international theft ring from Sweden. - When we started to see the patterns, it became clear that these were not isolated thefts, but an organized activity with a clear structure. The investigation covers a total of 41 separate theft cases where nearly 70 motorcycles and four-wheelers were seized, mainly in central Sweden. Of these, 31 vehicles are still missing. The total value is estimated at around five million kroner, says Fredrik Mattsson of the police's national operational department for serious crimes. The prosecutor's surprise: \"Never been involved\" Prosecutors and various investigation groups within the police in Sweden and Poland launched a joint operation and were able to tie eight men between the ages of 19 and 36 to the theft wave. - I have never seen that we have investigated so many similar thefts. Six of the eight indicted are in custody for aggravated theft. All the defendants grew up in Sweden and are citizens of Sweden, Finland and Poland, says senior prosecutor Johan Knies. The investigation showed that foreign clients are believed to have directed the internationally organized theft operations and employed Swedish perpetrators. - It indicates that foreign actors are increasingly using local executors, which places new demands on how we work against this type of crime. In other words, it is the same development that we can see in the wave of violence where instigators abroad control domestic perpetrators. This means that the police must thank you", "title_original": "Härjade i Dalarna – spårades till Polen med dold GPS-sändare", "summary_original": "Crossmotorcyklar, mc-utrustning och fyrhjulingar började spårlöst försvinna i främst Dalarna i februari 2025. Stölderna pågick fram till sommaren samma år när inbrottstjuvarna slog till i Leksand, där två motorcyklar och en fyrhjuling stals. I det senare fordonet hade ägaren placerat en dold GPS-sändare och kunde spåras till en gård i södra Polen. Polsk polis genomförde då ett kvällstillslag och hittade 20 stulna fordon på platsen. Dna-spår säkrades och kunde knytas till en man. När utredarna analyserade mannens telefontrafik och samtalslistor upptäcktes ett nätverk av gärningsmän – i en internationell stöldliga från Sverige. – När vi började se mönstren stod det klart att det inte rörde sig om enstaka stölder, utan om en organiserad verksamhet med tydlig struktur. Utredningen omfattar totalt 41 separata stöldärenden där närmare 70 motorcyklar och fyrhjulingar tillgripits, främst i Mellansverige. Av dessa saknas fortfarande 31 fordon. Det sammanlagda värdet uppskattas till cirka fem miljoner kronor, säger Fredrik Mattsson på polisens nationella operativa avdelning för grova brott. Åklagarens förvåning: ”Aldrig varit med om” Åklagare och olika utredningsgrupper inom polisen i Sverige och Polen inledde en gemensam insats och kunde knyta åtta män mellan 19 och 36 år till stöldvågen. – Jag har aldrig varit med om att vi har utrett så här många likartade stölder. Sex av de åtta som åtalas är häktade för grova stölder. Alla åtalade är uppväxta i Sverige och är medborgare i Sverige, Finland och Polen, säger senior åklagare Johan Knies. Utredningen visade att utländska beställare tros ha styrt den internationellt organiserade stöldverksamheten och anlitat svenska gärningsmän. – Det tyder på att utländska aktörer i högre grad använder lokala utförare, vilket ställer nya krav på hur vi arbetar mot den här typen av brottslighet. Det är med andra ord samma utveckling som vi kan se i våldsvågen där anstiftare utomlands styr inhemska utförare. Detta innebär att polisen måste tackla och bekämpa denna utveckling av brottslighet med nya metoder och angreppssätt, säger Fredrik Mattsson. I dag meddelades domen i Falu tingsrätt. De åtta männen och ytterligare två personer dömdes för olika former och i olika omfattningar av delaktighet i de grova stölderna och grova häleri. Fängelsestraffen blev mellan ett år och fyra månader till två och ett halvt år. Flera andra dömdes till dagsböter, villkorlig dom och skyddstillsyn.", "link": "https://www.tv4.se/artikel/5RqJMqSTY0PC6AzcqqmEkx/miljonliga-doems-stal-70-motorcyklar", "date_display": "2026-06-24", "date_iso": "2026-06-24T09:12:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/dalarna", "/brott"]}, {"id": 152, "title": "Many young people replace meals with energy drinks: \"Problematic\"", "summary": "The survey, which includes people between the ages of 15 and 24, shows that only sandwiches and bars are used more often as substitutes. The trend confirms a feeling that has long existed among both parents and experts – that energy drinks have become a normalized part of young people's eating habits.  - What is remarkable is that the energy drink is not a supplement but actually replaces a meal. You skip breakfast or lunch. We don't really know what is driving this development, only that it is going incredibly fast, says Elin Boll, nutrition and diet expert at Arla.  Sales doubled in five years According to her, sales of energy drinks have doubled in just five years. Stress, lack of time and a sweet tooth are some of the reasons for the young people's choices.  - It can be problematic because many energy drinks lack a lot of nutrients. A 15-year-old or school youth who is both growing and learning at school must be able to concentrate, have energy and nutrition to make it through the day, says Boll. Social media influences The survey also shows that knowledge about food and health is high among young people, but that there is still a gap between what you know and how you actually act in everyday life.  - When it comes to food and health, you trust the family, experts and authorities. But when you answer the question where do you get information about food and health, it is on social media. Must understand how young people move Elin Boll believes that a holistic approach is needed where both companies, authorities, schools and families work together to make healthy choices easier for young people. \n\n- We want to understand how the eating habits of the future are shaped and make it easier to eat healthy, says Boll.  The full report will be released in August.", "title_original": "Många unga ersätter måltider med energidryck: ”Problematiskt”", "summary_original": "Undersökningen, som omfattar personer mellan 15 och 24 år, visar att bara mackor och bars används oftare som ersättning. Trenden bekräftar en känsla som länge funnits bland både föräldrar och experter – att energidryck blivit en normaliserad del av ungas matvanor.  – Det som är anmärkningsvärt är att energidrycken inte är ett komplement utan faktiskt ersätter en måltid. Man hoppar över frukosten eller lunchen. Vi vet inte riktigt vad som driver den här utvecklingen, bara att det går otroligt fort, säger Elin Boll, nutritions- och kostexpert på Arla.  Fördubblad försäljning på fem år  Enligt henne har försäljningen av energidrycker fördubblats på bara fem år. Stress, tidsbrist och sötsug är några orsaker till ungdomarnas val.  – Det kan bli problematiskt för att det i många energidrycker saknas väldigt mycket näringsämnen. En 15-åring eller skolungdom som både ska växa och lära sig i skolan måste kunna koncentrera sig, ha energi och näring för att klara hela dagen, säger Boll. Sociala medier påverkar  Undersökningen visar också att kunskapen om mat och hälsa är hög bland unga, men att det ändå finns ett gap mellan vad man vet och hur man faktiskt agerar i vardagen.  – När det kommer till mat och hälsa litar man på familjen, experter och myndigheter. Men när man svarar på frågan var man tar till sig information om mat och hälsa är det på sociala medier. Måste förstå hur ungdomarna rör sig Elin Boll menar att det behövs ett helhetsgrepp där både företag, myndigheter, skolor och familjer samarbetar för att göra hälsosamma val enklare för unga. \n\n– Vi vill förstå hur framtidens matvanor formas och göra det lättare att äta hälsosamt, säger Boll.  Hela rapporten släpps i augusti.", "link": "https://www.tv4.se/artikel/4rQkVcxBQQF4EzeUMcN1h4/undersoekning-energidryck-ersaetter-maltider-foer-manga-unga", "date_display": "2026-06-24", "date_iso": "2026-06
