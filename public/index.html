74, "title": "The million-dollar building in Varnhem is now inaugurated: \"Historically unique\"", "summary": "Recreated an organ from the 17th century • A local build • The tone is described as \"velvet\"", "title_original": "Nu invigs miljonbygget i Varnhem: ”Historiskt unikt”", "summary_original": "Återskapat en orgel från 1600-talet • Ett lokalt bygge • Tonen beskrivs som ”sammet”", "link": "https://www.dagen.se/nyheter/nu-invigs-miljonbygget-i-varnhem-historiskt-unikt/10371332", "date_display": "2026-05-30", "date_iso": "2026-05-30T14:01:14+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "3 days old", "tags": []}, {"id": 175, "title": "Chance to win SEK 100,000 a month for a whole year", "summary": "Thinking of joining the Postcode Lottery? Every day you have a chance for new profits from the annual profit plan of approximately SEK 1.6 billion. The presenter Rickard Sjöberg has met winners all over Sweden since the start in 2005. So much has happened since then. For example, all episodes of Postcode millionaire. I am also weak for strong emotions, both tears and laughter. Some of the best laughs are on YouTube, he says.  If you buy a postcode lottery by the end of June at the latest, you are entered into this month's raffle and have a chance to win SEK 100,000 a month for a year. Last year, the prize went to a bunch of happy neighbors in Umeå.  SEK 2.4 million in total. It's absolutely insane, said Alexandra, who became a millionaire on two Postcode lotteries together with her partner Marcus. Buy a postcode lottery and compete for SEK 100,000 a month for a year Gunnar and his family also had more Postcode lotteries. Their profit landed at over half a million kroner - every month for a year.  I'm in the Postcode Lottery because it goes to charity, but I never thought this would happen to me, he said.  If you also want a chance to win SEK 100,000 a month for a year, you need to buy a Postcode Lottery by the end of June. You can also increase your chances of winning by purchasing another ticket at a different address. It doesn't matter if you own the accommodation or not. The main thing is that it is a house with its own address.  Buy a postcode lottery and compete for SEK 100,000 a month for a year One million Swedes participate in the Postcode Lottery - for three simple reasons:\n - Chance to win money, cars or products. \n - Win with your neighbors: Shared joy is double joy.  \n - Contribute to a better world: Over a billion to charity every year.  Age limit 18 years. Stödlinjen.se Buy a postcode lottery ticket and compete for SEK 100,000 a month for a year", "title_original": "Chans att vinna 100 000 kr i månaden i ett helt år", "summary_original": "Funderar du på att gå med i Postkodlotteriet? Varje dag har du chans till nya vinster från den årliga vinstplanen på cirka 1,6 miljarder kronor. Programledaren Rickard Sjöberg har träffat vinnare över hela Sverige sedan starten 2005.  Det har hänt så mycket sedan dess. Till exempel alla avsnitt av Postkodmiljonären. Jag är också svag för starka känslor, både tårar och skratt. Några av de härligaste skratten finns på Youtube, säger han.  Om du köper en postkodlott senast sista juni är du med i månadens utlottning och har chans att vinna 100 000 kr i månaden i ett år. Förra året gick vinsten till ett gäng glada grannar i Umeå.  2,4 miljoner kronor tillsammans. Det är helt sjukt, sa Alexandra som blev miljonär på två Postkodlotter tillsammans med sin partner Marcus. Köp en postkodlott och tävla om 100 000 kr i månaden i ett år Gunnar och hans familj hade också fler Postkodlotter. Deras vinst landade på över en halv miljon kronor – varje månad i ett år.  Jag är med i Postkodlotteriet för att det går till välgörande ändamål, men jag hade aldrig kunnat tro att det här skulle hända mig, sa han.  Om du också vill ha chans att vinna 100 000 kronor i månaden i ett år behöver du köpa en Postkodlott senast sista juni. Du kan också utöka dina vinstchanser genom att köpa ytterligare en lott på en annan adress. Det spelar ingen roll om du äger boendet eller inte. Huvudsaken är att det är ett hus med en egen adress.  Köp en postkodlott och tävla om 100 000 kr i månaden i ett år En miljon svenskar är med i Postkodlotteriet – av tre enkla skäl:\n - Chans att vinna pengar, bilar eller produkter. \n - Vinn med dina grannar: Delad glädje är dubbel glädje.  \n - Bidra till en bättre värld: Över en miljard till välgörenhet varje år.  Åldersgräns 18 år. Stödlinjen.se Köp en postkodlott och tävla om 100 000 kr i månaden i ett år", "link": "https://www.tv4.se/artikel/4fqn8PCyB54htfa0MycjVy/chans-att-vinna-100-000-kr-i-manaden-i-ett-helt-ar", "date_display": "2026-05-30", "date_iso": "2026-05-30T08:12:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "4 days old", "tags": ["Annons", "/annons", "/postkodlotteriet", "/inrikes"]}, {"id": 176, "title": "Many who leave the Free Church go quietly", "summary": "I sometimes wonder if you are just as good at seeing people who don't crash, protest or lose faith - but who just slowly slip out of the community, writes Stefan Kinert.", "title_original": "Många som lämnar frikyrkan går tyst", "summary_original": "Jag undrar ibland om man är lika bra på att se människor som inte kraschar, protesterar eller tappar tron – utan som bara långsamt glider ur gemenskapen, skriver Stefan Kinert.", "link": "https://www.dagen.se/debatt/manga-som-laemnar-frikyrkan-gar-tyst/10357251", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "4 days old", "tags": []}, {"id": 177, "title": "The graduating class of 1976 met again – 50 years after the ordination as pastor", "summary": "Have had many reunions over the years - \"It's probably a bit unique\"", "title_original": "Avgångsklass 1976 träffades igen – 50 år efter ordinationen till pastor", "summary_original": "Har haft många återträffar genom åren – ”Det är nog lite unikt”", "link": "https://www.dagen.se/familj/avgangsklass-1976-traeffades-igen-50-ar-efter-ordinationen-till-pastor/10368694", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "4 days old", "tags": []}, {"id": 178, "title": "The minister is happy to regulate AI - \"with the Pope's blessing\"", "summary": "Minister of Civil Affairs Erik Slottner (KD) shares the Pope's concern about what AI can do in terms of surveillance and new weapons - \"I don't have a stop button\"", "title_original": "Ministern reglerar gärna AI – ”med påvens välsignelse”", "summary_original": "Civilminister Erik Slottner (KD) delar påvens oro för vad AI kan göra när det gäller övervakning och nya vapen – ”jag har ingen stoppknapp”", "link": "https://www.dagen.se/nyheter/ministern-reglerar-gaerna-ai-med-pavens-vaelsignelse/10364477", "date_display": "2026-05-30", "date_iso": "2026-05-30T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "4 days old", "tags": []}, {"id": 179, "title": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "title_original": "Minister for Rural Affairs to host ministerial conference on future of forests", "summary_original": "On 2–3 June, ministers, decision-makers and experts from Europe will convene in Stockholm for FOREST EUROPE’s tenth Ministerial Conference, hosted by Minister for Rural Affairs Peter Kullgren. The Conference also represents the highlight of Sweden’s chairmanship of FOREST EUROPE in 2025–2026.", "link": "https://www.government.se/press-releases/2026/05/minister-for-rural-affairs-to-host-ministerial-conference-on-future-of-forests/", "date_display": "2026-05-29", "date_iso": "2026-05-29T14:01:19+00:00", "source": "Government.se", "ministry": "Ministry of Rural Affairs and Infrastructure", "type": "Official Information", "age_tag": "4 days old", "tags": ["Press release", "EU", "International", "Rural affairs, agriculture and food production", "Ministry of Rural Affairs and Infrastructure", "Peter Kullgren"]}, {"id": 180, "title": "The war in the Middle East entails risks for financial stability", "summary": "The war in the Middle East has created turbulence in the financial markets, but the global financial system has functioned well. However, the uncertainty is great. The longer the war continues, the greater the risk that inflation and interest rates will increase at the same time as the economy deteriorates, which could negatively affect several financial markets and actors. There are also several global vulnerabilities that could reinforce each other and exacerbate such a negative development. Sweden has a good starting position, but there are structural risks in the banking system, for example linked to the banks' international dependencies and significant exposures to the commercial real estate sector.", "title_original": "Kriget i Mellanöstern medför risker för den finansiella stabiliteten", "summary_original": "Kriget i Mellanöstern har skapat turbulens på de finansiella marknaderna, men det globala finansiella systemet har fungerat väl. Osäkerheten är dock stor. Ju längre kriget fortgår desto större är risken att inflationen och räntorna ökar samtidigt som konjunkturen försämras, vilket kan påverka flera finansiella marknader och aktörer negativt. Det finns dessutom flera globala sårbarheter som skulle kunna förstärka varandra och förvärra en sådan negativ utveckling. Sverige har ett bra utgångsläge, men det finns strukturella risker i banksystemet exempelvis kopplade till bankernas internationella beroenden och betydande exponeringar mot den kommersiella fastighetssektorn.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/kriget-i-mellanostern-medfor-risker-for-den-finansiella-stabiliteten/", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:30:22+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "5 days old", "tags": []}, {"id": 181, "title": "Ministerial visit to Ukraine focused on health care and situation for women", "summary": "On 11–13 May, Minister for Health Care Elisabet Lann and Minister for Gender Equality Nina Larsson visited Kyiv and Lviv. The aim of their visit was to gain insight into Ukraine’s health and medical care and the situation for women during Russia’s full-scale invasion.", "title_original": "Ministerial visit to Ukraine focused on health care and situation for women", "summary_original": "On 11–13 May, Minister for Health Care Elisabet Lann and Minister for Gender Equality Nina Larsson visited Kyiv and Lviv. The aim of their visit was to gain insight into Ukraine’s health and medical care and the situation for women during Russia’s full-scale invasion.", "link": "https://www.government.se/articles/2026/05/ministerial-visit-to-ukraine-focused-on-health-care-and-situation-for-women/", "date_display": "2026-05-29", "date_iso": "2026-05-29T07:00:55+00:00", "source": "Government.se", "ministry": "Ministry of Employment", "type": "Official Information", "age_tag": "5 days old", "tags": ["International", "Ministry of Employment", "Ministry of Health and Social Affairs", "Medical care", "Gender equality", "Article", "Sweden's support to Ukraine", "Nina Larsson", "Elisabet Lann"]}, {"id": 182, "title": "Ukraine to procure Swedish fighter jets", "summary": "Ukraine’s highest priority is air defence. To strengthen Ukrainian air defence, Sweden and Ukraine launch a major defence deal, in which Ukraine acquires Swedish G   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
