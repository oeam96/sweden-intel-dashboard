spriset i dag, enligt Jan Ohlsson.  – Norwegian har köpt upp drygt hälften och Ryanair 85 procent. Ryanair har sagt att de inte påverkas alls av detta, så de skär guld med täljkniv och skrattar hela vägen till banken. ”Bra att vänta” Norwegians kommunikationsdirektör Charlotte Holmbergh menar att de ökade bränslekostnaderna kommer att reflekteras i biljettpriset, men kan inte säga hur stora summor det rör sig om.  – Vi blir också påverkade såklart, men har man redan bokat sin resa så kommer man inte påverkas. Vi har inga planer på att ställa in några avgångar. I vanliga fall brukar dyra flygbiljetter leda till att fler stannar hemma eller bilsemestrar, men nu är även bensinpriset högt. Jan Ohlsson tror att en långvarig kris kan innebära stora förluster för flygbolagen.  – För varje dag tappar de miljoner och mycket tyder på att detta drar ut på tiden. Då blir det allvarligt, med fler inställda avgångar och personalpermitteringar. Han tror dock att utvecklingen kan svänga snabbt om krisen tar slut. – Av den anledningen kan det vara bra att vänta med de riskfyllda resmålen. Man får inte glömma att detta inte bara gäller oss svenskar – hela Europa tänker likadant.", "link": "https://www.tv4.se/artikel/1P4dQhTxo2E72BSzZlEUav/flygexpertens-uppmaning-till-svenskarna-infoer-semestern", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:21:00+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/flygbolag", "/irankriget", "/resor"]}, {"id": 128, "title": "Illness before the pandemic common for those with postcovid", "summary": "Women who often sought care before the pandemic ran a significantly greater risk of suffering from post-covid. This is shown by a new study from the Sahlgrenska Academy.", "title_original": "Ohälsa före pandemin vanligt för dem med postcovid", "summary_original": "Kvinnor som ofta sökte vård före pandemin löpte betydligt större risk att drabbas av postcovid. Det visar en ny studie från Sahlgrenska akademin.", "link": "https://www.dn.se/sverige/ohalsa-fore-pandemin-vanligt-for-dem-med-postcovid/", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:18:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 129, "title": "Susanne Nyström: Now no one can doubt the Center - Birgitta Ohlsson's entrance says it all", "summary": "Birgitta Ohlsson's parliamentary candidacy for the Center Party is not just a welcome political comeback. It is also a reminder that there is a bourgeois party that intends to continue to maintain the border with SD.", "title_original": "Susanne Nyström: Nu kan ingen längre tvivla på Centern – Birgitta Ohlssons entré säger allt", "summary_original": "Birgitta Ohlssons riksdagskandidatur för Centerpartiet är inte bara en välkommen politisk comeback. Den är även en påminnelse om att det finns ett borgerligt parti som tänker fortsätta hålla gränsen mot SD.", "link": "https://www.dn.se/ledare/susanne-nystrom-nu-kan-ingen-langre-tvivla-pa-centern-birgitta-ohlssons-entre-sager-allt/", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:03:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 130, "title": "Quark shortage in Swedish stores after \"protein frenzy\"", "summary": "More people than ever are chasing protein, which has led to a shortage of quark in grocery stores. But dietician Karoline Pettersson warns that the \"protein frenzy\" can become one-sided. - You can't live on scraps and think that it solves everything, she says.", "title_original": "Kvargbrist i svenska butiker efter ”proteinhets”", "summary_original": "Fler än någonsin jagar protein vilket har lett till kvargbrist i matbutikerna. Men dietisten Karoline Pettersson varnar för att ”proteinhetsen” kan bli ensidig. – Man kan inte leva på kvarg och tro att det löser allt, säger hon.", "link": "https://www.dn.se/sverige/kvargbrist-i-svenska-butiker-efter-proteinhets/", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:01:51+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "L-top Jan Jönsson leaves politics", "summary": "L-profile Jan Jönsson will not run for the Liberals and is leaving politics. He has decided that he can no longer represent the party if Simona Mohamsson's SD line goes through. - Then I cannot be credible towards my own ethics and morals and the basic values ​​that I stand for, he says to DN.", "title_original": "L-toppen Jan Jönsson lämnar politiken", "summary_original": "L-profilen Jan Jönsson kommer inte att kandidera för Liberalerna och lämnar politiken. Han har beslutat sig för att han inte längre kan representera partiet om Simona Mohamssons SD-linje går igenom. – Då kan jag inte vara trovärdig mot min egen etik och moral och de grundvärden som jag står för, säger han till DN.", "link": "https://www.dn.se/sverige/l-toppen-jan-jonsson-lamnar-politiken/", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:00:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "DN Debate. \"Four out of ten Swedes do not want to defend the US from attack\"", "summary": "DN DEBATE. Support for NATO is strong in Sweden - but not for all countries. Three nations stand out. According to this year's SOM survey, Swedes do not want to send troops to Turkey, Hungary or the United States in the event of an attack. The country that has been the hub of NATO since 1949 is increasingly seen as a threat. And who wants to die fighting for that? write the political scientists Sten Widmalm and Thomas Persson.", "title_original": "DN Debatt. ”Fyra av tio svenskar vill inte försvara USA från angrepp”", "summary_original": "DN DEBATT. Stödet för Nato är starkt i Sverige – men inte för alla länder. Tre nationer sticker ut. Enligt årets SOM-undersökning vill svenskar inte skicka trupp till Turkiet, Ungern eller USA vid angrepp. Landet som varit navet i Nato sedan 1949 betraktas alltmer som ett hot. Och vem vill dö i strid för det? skriver statsvetarna Sten Widmalm och Thomas Persson.", "link": "https://www.dn.se/debatt/fyra-av-tio-svenskar-vill-inte-forsvara-usa-fran-angrepp/", "date_display": "2026-03-18", "date_iso": "2026-03-18T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "Had twelve brain bleeds after the incident: \"Lacks sense of smell\"", "summary": "The artist Pål Hollender became famous after his participation in \"Robinson\" in 1998. Now he is back on TV4 and competing for a place among the twelve best in \"Sweden's Master Chef\". To get to Stockholm, however, a superpower is needed, and for jury member Tina Nordström, Pål Hollender tells that his is that he lacks a sense of smell. - I am 100 percent liberated, he says. \"I don't remember anything\" In the program, Pål Hollender tells us that the permanent thing he lives with is the result of a brain hemorrhage that affected the part of the brain where the sense of smell is located. - It is difficult to describe an event that you do not remember anything about. But they have been able to conclude that I have been assaulted, he says in the program. - Then it has caused twelve brain haemorrhages. For TV4 Nyheterna, he does not want to say more about the assault than what appears in the program, but he says that the incident took place in the summer of 2023. - I don't know anything about it. I don't remember anything, he says. This is how it is to cook without a sense of smell The lack of a sense of smell is one of the reasons why Pål Hollender chose to run for Sweden's master chef. - I personally think it is a greater challenge to be part of the Master Chef because I lack a sense of smell, he says. Whether it makes the competition more difficult or not depends on how you look at it, he believes. He explains that master chefs often emphasize that the balance of the food is more important than the spices themselves. - It's all about sweetness, saltiness, acid, bitterness and umami. Those are the five flavors that exist, and I have them. But I don't have any of the million scents that the rest of you have. - To me it tastes like nothing but sweet, sour, salty and bitter. In the program, he was told by jury member Tina Nordström that one of his dishes was a little too strong. - It's not like you don't feel when your mouth is burning just because you lack a sense of smell. But I have to admit that it might have been a bit strong, he says.", "title_original": "Fick tolv hjärnblödningar efter händelsen: ”Saknar luktsinne”", "summary_original": "Konstnären Pål Hollender blev känd efter sin medverkan i ”Robinson” 1998. Nu är han tillbaka i TV4 och tävlar om en plats bland de tolv bästa i ”Sveriges mästerkock”. För att komma till Stockholm behövs dock en superkraft, och för jurymedlemmen Tina Nordström berättar Pål Hollender att hans är att han saknar luktsinne. – Jag är 100 procent befriad, säger han. ”Jag minns ingenting” I programmet berättar Pål Hollender att det bestående men han lever med är en följd av en hjärnblödning som drabbade den del av hjärnan där luktsinnet sitter. – Det är svårt att beskriva en händelse som man inte minns nånting av. Men man har kunnat sluta sig till att jag har blivit överfallen, säger han i programmet. – Sen har det orsakat tolv hjärnblödningar. För TV4 Nyheterna vill han inte berätta mer om överfallet än det som framkommer i programmet, men han säger att händelsen ägde rum sommaren 2023. – Jag vet ju ingenting om det. Jag minns inget, säger han. Så är det att laga mat utan luktsinne Avsaknaden av luktsinne är en av anledningarna till att Pål Hollender valt att ställa upp i Sveriges mästerkock. – Jag tycker själv att det är en större utmaning att vara med i Mästerkocken eftersom jag saknar luktsinne, säger han. Om det gör tävlingen svårare eller inte beror på hur man ser det, menar han. Han förklarar att mästerkockar ofta betonar att balansen i maten är viktigare än själva kryddorna. – Det handlar ju om sötma, sälta, syra, beskhet och umami. Det är de fem smakerna som finns, och dem har jag. Men jag har ingen av de miljoner dofter som ni andra har. – För mig smakar det ingenting utöver sött, surt, salt och beskt. I programmet fick han höra av jurymedlemmen Tina Nordström att en av hans rätter blev lite för stark. – Det är ju inte så att man inte känner när det brinner i käften bara för att man saknar luktsinne. Men jag får väl erkänna att det kanske blev lite väl starkt, säger han.", "link": "https://www.tv4.se/artikel/1DA2dSiA4JoUPYjysqfiLm/fick-tolv-hjaernbloedningar-efter-haendelsen-saknar-luktsinne", "date_display": "2026-03-18", "date_iso": "2026-03-18T18:59:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/sveriges-masterkock", "/tv4-play"]}, {"id": 134, "title": "The Swedes stuck - in the middle of the outbreak: \"Very scared\"", "summary": "Another five people have been confirmed infected during the morning, which means that a total of 20 people are now infected in the outbreak of epidemic meningitis in Kent, in the south of England.  Swede Martin Norström, who is in Canterbury, says that the class group chat completely exploded when it started to be linked about the outbreak at the university just a couple of hundred meters from where they live.  - The first thing we did was to speculate about what it was about and what we would do. We sent lots of emails home to teachers and principals, but me and my two roommates chose to go to school as usual, but many chose to stay at home. Several have died: \"Unpleasant\" So far, two young women, aged 18 and 21, have died of meningitis. The outbreak is said to have started at a club in Canterbury and UK Prime Minister Keir Starmer today went out and urged everyone who was there between March 5th and 7th to take antibiotics. Martin Norström says several of his friends were there at the time.  - It's quite unpleasant, it's a place we planned to go to and we go to similar places. Right then and there, no one in our class was. At the same time, I have close schoolmates who were there then, says Martin Norström. Must avoid intimate contacts Starting today, 5,000 students will be vaccinated, according to British authorities. So far, 2,500 doses of antibiotics have been distributed for preventive purposes. The Swedish high school class has also been given the opportunity. - It has been offered to everyone, I think there are six places in the city, but it is mainly aimed at those in the risk zones. The bacterium meningococcus-B is mainly spread through saliva, so the high school class has been asked to take care of their hygiene and not have any intimate contacts. They have also been offered to go home early, but the majority of the class will stay, says Martin Norström. - We trust that the school here and at home make an assessment that it is safe to stay.", "title_original": "Svenskarna fast – mitt i utbrottet: ”Väldigt rädda”", "summary_original": "Ytterligare fem personer har under morgonen bekräftats smittade, vilket gör att totalt 20 personer nu är smittade i utbrottet av epidemisk hjärnhinneinflammation i Kent, i södra England.  Svenske Martin Norström, som befinner sig i Canterbury, berättar att klassens gruppchat fullständigt exploderade när det började länkas om utbrottet på universitetet bara ett par hundra meter från där de bor.  – Det första vi gjorde var att spekulera kring vad det handlar om och vad vi skulle göra. Vi skickade massvis med mejl hem till lärare och rektorer, men jag och mina två rumskamrater valde att gå till skolan som vanligt, men det var många som valde att stanna hemma. Flera har dött: ”Obehagligt” Hittills har två unga kvinnor, 18 och 21 år, dött i hjärnhinneinflammation. Utbrottet ska ha startat på klubb i Canterbury och Storbritanniens premiärminister Keir Starmer gick i dag ut och uppmanade alla som varit där mellan femte och sjunde mars att ta antibiotika. Martin Norström berättar flera av hans vänner var där vid tillfället.  – Det är ganska obehagligt, det är ett ställe som vi planerat att gå till och vi går på liknande ställen. Just där och då var det ingen i vår klass som var. Samtidigt har jag närmre skolkamrater som var där då, säger Martin Norström. Ska undvika intima kontakter Från och med i dag ska 5 000 studenter vaccineras, det uppger brittiska myndigheter. Än så länge har 2 500 doser av antibiotika delats ut i förebyggande syfte. Även den svenska gymnasieklassen har fått möjlighet. – Det har erbjudits till alla, jag tror det finns sex ställen i staden, men det är främst riktat till de i riskzonerna. Bakterien meningokocker-B sprids framförallt genom saliv, så gymnasieklassen har uppmanats att ta hand om sin hygien och inte ha några intima kontakter. De har också erbjudits att åka hem i förtid, men majoritet av klassen blir kvar, säger Martin Norström. – Vi litar på att skolan här och hemma gör en bedömning om att det är säkert att vara kvar.", "link": "https://www.tv4.se/artikel/5IizoN4BP7CDSptNv6SigS/svenskarna-fast-mitt-i-utbrottet-vaeldigt-raedda", "date_display": "2026-03-18", "date_iso": "2026-03-18T18:01:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/storbritannien", "/smitta"]}, {"id": 135, "title": "The Fed leaves the US interest rate unchanged - the war is haunting", "summary": "As expected, the Federal Reserve (Fed) leaves the US key interest rate unchanged in the range of 3.50-3.75 percent. The impact of the Iran war on inflation hangs heavy over the US central bank. - It makes an already difficult trade-off even more difficult for the Fed, says Maria Landeborn, senior strategist at Danske Bank.", "title_original": "Fed låter USA-räntan ligga – kriget spökar", "summary_original": "Federal Reserve (Fed) lämnar som väntat den amerikanska styrräntan oförändrad i intervallet 3,50–3,75 procent. Irankrigets påverkan på inflationen hänger tungt över USA:s centralbank. – Det gör en redan svår avvägning ännu svårare för Fed, säger Maria Landeborn, senior strateg vid Danske Bank.", "link": "https://www.svd.se/a/M7nGvr/fed-lamnar-rantan-i-usa-oforandrad", "date_display": "2026-03-18", "date_iso": "2026-03-18T18:01:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 136, "title": "\"What kind of Sweden do I want to leave behind to my daughters?\"", "summary": "Despite the risk of relapse • Ohlsson leaves the doctor in the US for politics in Sweden", "title_original": "”Vad för Sverige vill jag lämna efter mig till mina döttrar?”", "summary_original": "Trots återfallsrisken • Ohlsson lämnar läkaren i USA för politiken i Sverige", "link": "https://www.tv4.se/artikel/4eD7z6NdaBv4MRt6qjPCxi/daerfoer-svaenger-ohlsson-vad-foer-sverige-vill-jag-laemna-efter-mig-till", "date_display": "2026-03-18", "date_iso": "2026-03-18T17:34:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem"]}, {"id": 137, "title": "The master con man's move is stopped - tried to implicate his father", "summary": "Pension company Allra's founder Alexander Ernstberger was sentenced in 2021 to six years in prison for, among other things, bribery and gross disloyalty to the principal. The reason was that Allra carried out deals which, according to the Svea Court of Appeal, enriched the management at the expense of the 130,000 pension savers.  Ernstberger was also sentenced to joint and several damages, which today amount to SEK 300 million. Since 2022, he has been placed in personal bankruptcy. Released book Last year, Ernstberger published the book \"Staten mot kapitalet\", in which he gave his view on the Allra mess. The author states that it sold over 30,000 copies. But Ernstberger has transferred the rights to the book to a company controlled by his father, which Småspararguiden was the first to tell. Since the main character is also placed in personal bankruptcy, the bankruptcy trustee has cracked down on the scheme. \"Due to the bankruptcy decision, Alexander Ernstberger has not been authorized to enter into any valid agreement regarding the transfer or lien of Copyright,\" writes trustee Nils Åberg in the latest report from the Bankruptcy Estate, and maintains that the agreement is invalid. Debt of 300 million The bankruptcy trustee's task is to secure as large assets as possible, in order to pay the bankruptcy estate's debts. This includes, among other things, the debt to the Swedish Pensions Authority of SEK 300 million.  According to administrator Nils Åberg, the company controlled by Ernstberger's father initially opposed the objections. But after negotiations, the company has recognized the bankruptcy estate's demand for possible future royalty income from the book \"Staten mot kapitalet\". Ernstberger himself claims in a written comment that the aim was never to get access to any money. \"Neither I nor any related company has received compensation for the book, and it was never the idea either. It is about the production company taking costs for the project which they will get back, all profits are shared between the publisher and the bankruptcy estate,\" writes Alexander Ernstberger to TV4.", "title_original": "Storsvindlarens drag stoppas – försökte involvera sin pappa", "summary_original": "Pensionsbolaget Allras grundare Alexander Ernstberger dömdes 2021 till sex års fängelse för bland annat mutbrott och grov trolöshet mot huvudman. Orsaken var att Allra genomfört affärer som enligt Svea Hovrätt berikat ledningen på de 130 000 pensionsspararnas bekostnad.  Ernstberger dömdes också till ett solidariskt skadestånd som i dag uppgår till 300 miljoner kronor. Han är sedan 2022 försatt i personlig konkurs. Släppte bok Förra året utkom Ernstberger med boken \"Staten mot kapitalet\", där han gav sin syn på Allra-härvan. Författaren uppger att den sålt i över 30 000 exemplar. Men Ernstberger har överlåtit rättigheterna till boken till ett bolag som kontrolleras av hans far, vilket Småspararguiden var först med att berätta. Eftersom huvudpersonen också är försatt i personlig konkurs, har konkursförvaltaren slagit ned på upplägget. \"Alexander Ernstberger har på grund av konkursbeslutet inte varit behörig att träffa något giltigt avtal kring överlåtelse eller pantförskrivning av Upphovsrätten\" skriver förvaltaren Nils Åberg i  den senaste rapporten från Konkursboet, och menar på att avtalet är är ogiltigt. Skuld på 300 miljoner Konkursförvaltarens uppgift är att säkra så stora tillgångar som det går, i syfte att betala konkursboets skulder. Där ingår bland annat skulden till Pensionsmyndigheten på 300 miljoner kronor.  Enligt förvaltaren Nils Åberg har bolaget som kontrolleras av Ernstbergers far inledningsvis motsatt sig invändningarna. Men efter förhandlingar har bolaget erkänt konkursboets krav på eventuella framtida royaltytintäkter från boken \"Staten mot kapitalet\". Ernstberger själv hävdar i en skriftlig kommentar att syftet aldrig varit att komma åt några pengar. ”Varken jag eller något närstående bolag har fått ersättning för boken, och det har heller aldrig varit tanken. Det handlar om att produktionsbolaget tagit kostnader för projektet som de ska få åter, all vinst delas mellan förlaget och konkursboet”, skriver Alexander Ernstberger till TV4.", "link": "https://www.tv4.se/artikel/1slhBIBVyw6rDhvR8xfSQC/storsvindlarens-drag-stoppas-foersoekte-involvera-sin-pappa", "date_display": "2026-03-18", "date_iso": "2026-03-18T17:04:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/brott-och-straff", "/allra", "/ekonomisk-brottslighet"]}, {"id": 138, "title": "Anger at the Ministry of Foreign Affairs - after today's execution: \"They do nothing\"", "summary": "One who reacts strongly to the news that a Swedish citizen has been executed in Iran is Vida Mehrannia, wife of imprisoned Ahmadreza Djalali. Her husband has been imprisoned in Iran since 2016, accused, among other things, of spying for Israel. The following year he was sentenced to death for the alleged crimes. Most recently, a few weeks ago, Djalali gave an update on the horrors at Evin Prison in Tehran, where the leadership collapsed after Israel and the US launched their attacks. Wife: The Ministry of Foreign Affairs' handling is unacceptable When TV4 Nyheterna reaches Vida Mehrannia, she calls the Ministry of Foreign Affairs' handling of the Swede who was executed on Wednesday \"unacceptable\". - For over eight months he was in prison, and the Swedish government never revealed who he was. They only said that he was a Swedish citizen imprisoned in Iran. There has been a lack of information about his case, the espionage charges, and about his unfair trial, says Vida Mehrannia. - And what is Sweden's reaction? Just a condemnation and a tweet by Maria Malmer Stenergard. \"They do nothing\" Vida Mehrannia wants Sweden to do like Germany, which closed all Iranian consulates in the country after Iran executed the German-Iranian Jamshid Sharmahd in 2024. - I don't understand why Sweden is so silent, they do nothing. Their treatment of Swedes with dual citizenship is unacceptable. They say they care about the relatives of the executed, but if they cared they would act. Did today's news make you more worried about your spouse? - Of course. The Swedish government knows that there is a war in Iran, many things are happening. Sweden just waits and sees what happens. Why are they letting Iran execute a Swedish citizen - again? What do you want the Ministry of Foreign Affairs to do? - They must of course close the Iranian embassy in Sweden. It's the least they can do. And send all diplomats back to Iran. If they do not react strongly, more will be executed. The Minister of Foreign Affairs: Summons the ambassador When TV4 Nyheterna spoke to Maria Malmer Stenergard about what is being done for imprisoned Swedes in Iran", "title_original": "Ilskan mot UD – efter dagens avrättning: ”De gör ingenting”", "summary_original": "En som reagerar kraftigt på nyheterna om att en svensk medborgare avrättats i Iran är Vida Mehrannia, fru till fängslade Ahmadreza Djalali. Hennes make har suttit fängslad i Iran sedan 2016, anklagad bland annat för att ha spionerat för Israel. Året därpå dömdes han till döden för de påstådda brotten. Senast för några veckor sedan gav Djalali en uppdatering om skräcken i Evinfängelset i Teheran, där ledningen kollapsat efter att Israel och USA inlett sina anfall. Frun: UD:s hantering är oacceptabel När TV4 Nyheterna når Vida Mehrannia kallar hon UD:s hantering av den svensken som avrättades på onsdagen ”oacceptabel”. – I över åtta månader var han i fängelse, och den svenska regeringen gick aldrig ut med vem han var. De sade bara att han var en svensk medborgare som fängslats i Iran. Det har varit brist på information om hans fall, spionanklagelserna, och om hans orättvisa rättegång, säger Vida Mehrannia. – Och vad är Sveriges reaktion? Bara ett fördömande och en tweet av Maria Malmer Stenergard. ”De gör ingenting” Vida Mehrannia vill att Sverige gör som Tyskland, som stängde alla iranska konsulat i landet efter att Iran avrättat tysk-iraniern Jamshid Sharmahd år 2024. – Jag förstår inte varför Sverige är så tysta, de gör ingenting. Deras behandling av svenskar med dubbla medborgarskap är oacceptabel. De säger att de bryr sig om de avrättades anhöriga, men om de brydde sig skulle de agera. Gjorde dagens nyheter dig mer orolig för din make? – Självklart. Den svenska regeringen vet att det är krig i Iran, många saker händer. Sverige bara väntar och ser vad som händer. Varför låter de Iran avrätta en svensk medborgare – igen? Vad vill du att UD ska göra? – De ska självklart stänga Irans ambassad i Sverige. Det är det minsta de kan göra. Och skicka tillbaka alla diplomater till Iran. Om de inte reagerar starkt kommer fler avrättas. Utrikesministern: Kallat upp ambassadören När TV4 Nyheterna pratade med Maria Malmer Stenergard om vad som görs för fängslade svenskar i Iran tidigare idag sade hon att Sverige ”söker kontakt på alla nivåer”. – Vi har idag kallat upp Irans ambassadör och genomfört samtal på Utrikesdepartementet och där tydligt fördömt den här avrättningen och naturligtvis krävt att andra inte ska genomföras, sade utrikesministern. – Vad motparten har sagt går jag inte in på i detalj. TV4 Nyheterna söker Maria Malmer Stenergard för en kommentar om Vida Mehrannias kritik.", "link": "https://www.tv4.se/artikel/XSD7KMCdDNiNkRcTRIc8U/ilskan-mot-ud-efter-dagens-avraettning-de-goer-ingenting", "date_display": "2026-03-18", "date_iso": "2026-03-18T16:06:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/utrikes", "/ahmadreza-djalali", "/iran"]}, {"id": 139, "title": "After the crisis – a new spring for Swedish film", "summary": "After success with several short films, Julia Thelin makes her feature film debut with supreme confidence.", "title_original": "Efter krisen – ny vår för svensk film", "summary_original": "Efter framgångar med flera kortfilmer långfilmsdebuterar Julia Thelin med suverän säkerhet.", "link": "https://www.svd.se/a/m0PxAp/mecenaten-biofilm-recension-av-jeanette-gentele", "date_display": "2026-03-18", "date_iso": "2026-03-18T16:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Film", "Kultur"]}, {"id": 140, "title": "\"I can laugh a little at the fact that HV thinks they have a monopoly on higher powers\"", "summary": "The Christian profiles are preparing for qualification anxiety when HV71 meet Leksand in the best of seven games", "title_original": "”Jag kan ju le lite åt att HV tror att de har monopol på högre makter”", "summary_original": "De kristna profilerna förbereder sig för kvalångest när HV71 möter Leksand i bäst av sju matcher", "link": "https://www.dagen.se/nyheter/jag-kan-ju-le-lite-at-att-hv-tror-att-de-har-monopol-pa-hoegre-makter/10257140", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:42:43+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "The Legislative Council saws the government – ​​again", "summary": "According to the government's proposal, among other things, the penalty value limit for deportation is to be lowered to a crime with a penalty more severe than a fine. According to the government, the aim is to deport more foreigners who commit crimes. As late as 2022, the limit was lowered to six months in prison, and according to the Legislative Council, too little time has passed to assess the outcome of that change. Therefore, there are not \"sufficient reasons to now change the current law in the way that has been proposed\", writes the council in its opinion. Legal technical problems The council also writes, similar to both the government's own investigation and several referral bodies, that there are reasons to investigate whether the examination of deportations should be moved from the courts to the Migration Agency before proceeding with the proposals. In addition to that, the Legislative Council sees several legal technical problems, including grading difficulties with what is a \"penalty more severe than a fine\". In its proposal, the government also takes aim at the role of prosecutors. For one thing, deportation will in future only be tried after a lawsuit from the prosecutor, something that the council approves. On the one hand, prosecutors must be obliged to request deportation when the crime is grounds for deportation, without making their own assessment as to whether the reasons for deportation are strong enough. Harsh criticism: \"Stranger to the system\" Just this has been met with harsh criticism from several heavy referral bodies, including the Public Prosecutor's Office. According to the authority, the proposal conflicts with the role of an independent legal authority and public trust risks being undermined when prosecutors are expected to act against better knowledge. The Council of Law considers that it is not \"reasonable\" to proceed with a proposal that has received so much criticism from experienced bodies and calls the proposal \"system alien\". \"It is also indefensible both for efficiency reasons and out of consideration for all defendants who in the trial are to be threatened with deportation, even though it is clear to the person making the deportation request that deportation will not take place,\" writes the Legislative Council. Sawing proposals on the age of criminal liability This", "title_original": "Lagrådet sågar regeringen – igen", "summary_original": "Enligt regeringens förslag ska bland annat straffvärdesgränsen för utvisning sänkas till brott med påföljd strängare än böter. Syftet är enligt regeringen att fler utlänningar som begår brott ska utvisas. Så sent som år 2022 sänktes gränsen till sex månaders fängelse och enligt Lagrådet har det gått för kort tid för att bedöma utfallet av den ändringen. Därför finns det inte “tillräckliga skäl för att nu ändra gällande rätt på det sätt som har föreslagits”, skriver rådet i sitt yttrande. Lagtekniska problem Rådet skriver också, i likhet med både regeringens egen utredning och flera remissinstanser, att det finns skäl att utreda om prövningen av utvisningar borde flyttas från domstolar till Migrationsverket innan man går vidare med förslagen. Utöver det ser Lagrådet flera lagtekniska problem, bland annat graderingssvårigheter med vad som är en “påföljd strängare än böter”. I sitt förslag tar regeringen också sikte på åklagarnas roll. Dels ska utvisning framöver enbart prövas efter talan från åklagaren, något som rådet tillstyrker. Dels ska åklagare vara skyldiga att yrka utvisning när brottet är utvisningsgrundande, utan att göra en egen bedömning huruvida skälen för utvisning är tillräckligt starka. Hårda kritiken: ”Systemfrämmande” Just det här har mötts av hård kritik från flera tunga remissinstanser, däribland Åklagarmyndigheten. Enligt myndigheten strider förslaget mot rollen som en självständig rättslig myndighet och allmänhetens förtroende riskerar att undergrävas när åklagare förväntas agera mot bättre vetande. Lagrådet anser att det inte är “rimligt” att gå fram med ett förslag som fått så mycket kritik från erfarna instanser och kallar förslaget för “systemfrämmande”. \"Den är också oförsvarlig både av effektivitetsskäl och av hänsyn till alla tilltalade som i rättegången ska hotas med utvisning, trots att det för den som framställer utvisningsyrkandet står klart att utvisning inte kommer att ske”, skriver Lagrådet. Sågar förslag om straffbarhetsåldern Detta är andra gången på kort tid som Lagrådet slår ner regeringens förslag.  Förra veckan riktades skarp kritik mot förslaget att sänka straffbarhetsåldern till 13 år. Lagrådet menar att förslaget kan strida mot barnkonventionen och ifrågasätter om det skulle uppfylla sitt syfte:  Forssell: Sätter säkerheten i första rummet Migrationsminister Johan Forssell skriver i en kommentar till TV4 Nyheterna att regeringen tar till sig av synpunkterna, men att Sveriges säkerhet och brottsoffers upprättelse ska sättas i första rummet. ”En del av kritiken vi har fått handlar om att plikten att yrka på utvisning vid utvisningsgrundande brott skulle underminera allmänhetens förtroende för åklagarnas arbete”, skriver Forssell. ”Jag ser en större risk i att allmänhetens förtroende undermineras om mördare och våldtäktsmän som borde ha utvisats blir kvar i landet”. Hur ser regeringen på att förslaget anses strida mot åklagarnas självständiga roll när de tvingas att yrka på ett visst sätt även vid lindriga brott och då de bedömer att ett yrkande inte kommer att vinna bifall? ”Jag ser inte att det strider mot åklagarnas självständiga roll att vi genom den nya lagstiftningen säkerställer att utvisningsgrundande brott också leder till yrkande på utvisning. Om något så banar detta vägen för en mer konsekvent rättstillämpning.”\n\nPå vilket sätt påverkas situationen för dömda mördare och våldtäktsmän genom en sänkning från sex månaders fängelse till påföljder strängare än böter? ”Den här ändringen handlar om att fler brott än tidigare blir utvisningsgrundande. Det är i grund och botten väldigt enkelt: Kommer man hit och begår brott, då väljer man bort en framtid i Sverige.”", "link": "https://www.tv4.se/artikel/5j5iqBgEoGHGaS04xUpIqS/lagradet-sagar-regeringen-igen", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:38:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/utvisning", "/regeringen", "/lagar-och-regler"]}, {"id": 142, "title": "The art of breaking generational boundaries is spelled mentoring", "summary": "The key to creating deep relationships, where together you can help each other get closer to the Lord, lies in the willingness to ask for help and the willingness to be there, writes Olivia Moeller.", "title_original": "Konsten att krossa generationsgränser stavas mentorskap", "summary_original": "Nyckeln i att skapa djupa relationer, där man tillsammans kan hjälpa varandra att komma närmare Herren, ligger i villigheten att be om hjälp och villigheten att finnas där, skriver Olivia Moeller.", "link": "https://www.dagen.se/debatt/konsten-att-krossa-generationsgraenser-stavas-mentorskap/10254385", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Was recruited after Idol - thanks to his appearance: \"Became a talking point\"", "summary": "Victoria Grace participated in \"Idol\" 2024 and finished in sixth place. Now her brother, Lars‑Erik Danielsson, can be seen in the new season of the Netflix series \"Love is Blind\". - It was actually through Idol that he was recruited, says Victoria Grace to TV4 Nyheterna. \"Many women thought he was very handsome\" Lars-Erik Danielsson visited the Idol recordings and became, according to the sister, \"a little gossip\" in the production. - Many women thought he was very handsome. And then I thought: \"My brother has to find someone,\" she says. One morning at the Idolhotellet in Stockholm, she decided to fill out an application for him for the popular love reality show - but gave up because it was so long. Shortly afterwards, a participant manager, who also works for Love is blind, walked by and asked if her brother should apply. - I just: \"How sick! I was just applying.\" Then she said: \"Ask your brother to apply, and I'll pull the strings and pitch him in.\" And that's the way it went, says Victoria Grace. Mixed experience watching her brother date When the camera crew later came home and filmed at the family, it was just months after they were at Victoria Grace's house for Idol. She thinks the fact that the family has become a real TV family is mostly funny. - It's fun. Or, it's probably mostly the nieces and nephews who think it's fun to see their uncle and aunt on TV. She herself thinks that it has been a mixed experience to see her brother in a love program. - People have laughed a little at him, laughed a little with him, and cried a little with him. - It is not often that you get such a great insight into your brother's love life, especially not on film. But I thought it was nice to see his sensitive side that I don't usually get to see.", "title_original": "Värvades efter Idol – tack vare sitt utseende: ”Blev en snackis”", "summary_original": "Victoria Grace deltog i ”Idol” 2024 och slutade på en sjätteplats. Nu syns hennes bror, Lars‑Erik Danielsson, i den nya säsongen av Netflix-serien ”Love is Blind”. – Det var ju faktiskt genom Idol som han blev värvad, säger Victoria Grace till TV4 Nyheterna. ”Många kvinnor tyckte att han var väldigt stilig” Lars-Erik Danielsson besökte Idol-inspelningarna och blev, enligt systern, ”en liten snackis” i produktionen. – Många kvinnor tyckte att han var väldigt stilig. Och då tänkte jag: ”Min brorsa måste ju hitta någon”, säger hon. En morgon på Idolhotellet i Stockholm bestämde hon sig för att fylla i en ansökan åt honom till den populära kärleksrealityn – men gav upp eftersom den var så lång. Strax därefter gick en deltagaransvarig, som även jobbar för Love is blind, förbi och frågade om inte hennes bror borde söka. – Jag bara: ”Vad sjukt! Jag höll precis på med ansökan.” Då sa hon: ”Be din brorsa söka, så drar jag i trådarna och pitchar in honom.” Och på den vägen gick det, berättar Victoria Grace. Blandad upplevelse att se sin bror dejta När kamerateamet senare kom hem och spelade in hos familjen var det bara månader efter att de varit hemma hos Victoria Grace för Idol. Att familjen blivit en riktig tv‑familj tycker hon mest är roligt. – Det är roligt. Eller, det är väl mest syskonbarnen som tycker det är kul att se sin farbror och faster på tv. Själv tycker hon att det har varit en blandad upplevelse att få se sin bror i ett kärleksprogram. – Man har skrattat lite åt honom, skrattat lite med honom, och gråtit lite med honom. – Det är inte så ofta man får så stor inblick i sin brors kärleksliv, särskilt inte på film. Men jag tyckte det var fint att se hans känsliga sida som jag inte brukar få se.", "link": "https://www.tv4.se/artikel/7JyzQW2BUsLOufEKA4wHTp/vaervades-efter-idol-tack-vare-sitt-utseende-blev-en-snackis", "date_display": "2026-03-18", "date_iso": "2026-03-18T14:06:59+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/love-is-blind-sverige", "/tv4", "/netflix", "/idol"]}, {"id": 144, "title": "Man shot with several shots - big effort in residential area", "summary": "The police were called to a residential area in Halmstad at 1.30pm on Wednesday. - Several patrols went to the scene. An ambulance was also called. An injured man was found in a stairwell. It has happened at or in this gate, says Fredrik Svedemyr, press spokesperson for the police in the West region. According to information to TV4 Nyheterna, the man, who is in his 20s, must have been shot with several shots. He was taken to hospital by ambulance. - Awake and talkative is the task I have, otherwise I have no details about the injury situation, says Fredrik Svedemyr. Region Halland stated later in the evening that the man is being treated for gunshot wounds and that his condition is serious. The police describe his condition as critical, but stable.  Two arrested for attempted murder A major search for suspects is underway and the police helicopter is participating in the operation. According to information to TV4 Nyheterna, at least one person on an electric scooter was seen leaving the crime scene. Shortly after the alarm, two people were arrested. They are aged 19 and 35, respectively, according to the police. - They are suspected of attempted murder and serious weapons offences. The place has been cordoned off and we will take further measures. We are there and working, says Fredrik Svedemyr. Shortly after 6 p.m., the cordons at the site were lifted. The police have, among other things, searched with a dog and the investigative work continues during the evening.", "title_original": "Man skjuten med flera skott – stor insats i bostadsområde", "summary_original": "Polisen larmades till ett bostadsområde i Halmstad klockan 13.30 på onsdagen. – Ett flertal patruller åkte till platsen. Ambulans larmades också. I ett trapphus anträffades en skadad man. Det har skett vid eller i den här porten, säger Fredrik Svedemyr, presstalesperson på polisen i region Väst. Enligt uppgifter till TV4 Nyheterna ska mannen, som är i 20-årsåldern, ha blivit skjuten med flera skott. Han är fördes till sjukhus med ambulans. – Vaken och talbar är den uppgiften jag har, i övrigt har jag inga detaljer kring skadeläget, säger Fredrik Svedemyr. Region Halland uppgav senare under kvällen att mannen vårdas för skottskador och att hans skadeläge är allvarligt. Polisen beskriver hans skadeläge som kritiskt, men stabilt.  Två gripna för mordförsök Ett stort sökarbete efter misstänkta pågår och polishelikoptern deltar i insatsen. Enligt uppgifter till TV4 Nyheterna ska minst en person på elsparkcykel ha setts lämna brottsplatsen. Kort efter larmet kunde två personer gripas. De är i 19- respektive 35-årsåldern, enligt polisen. – De misstänks för försök till mord och grovt vapenbrott. Man har spärrat av platsen och vi kommer vidta ytterligare åtgärder. Vi är där och jobbar, säger Fredrik Svedemyr. Strax efter klockan 18 hävdes avspärrningarna på platsen. Polisen har bland annat sökt med hund och utredningsarbetet fortsätter under kvällen.", "link": "https://www.tv4.se/artikel/4HxNuRPfPwxOI03KCFU9Mu/uppgifter-man-skjuten-med-flera-skott-stor-polisinsats", "date_display": "2026-03-18", "date_iso": "2026-03-18T13:58:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/halmstad", "/skottlossning", "/skjutningar-i-sverige", "/brott"]}, {"id": 145, "title": "Who has the right to throw the first stone at Simona Mohamsson?", "summary": "Erik Helmerson: Judas trends - but be careful with the words.", "title_original": "Vem har rätt att kasta första stenen mot Simona Mohamsson?", "summary_original": "Erik Helmerson: Judas trendar – men var försiktiga med orden.", "link": "https://www.dagen.se/ledare/vem-har-raett-att-kasta-foersta-stenen-mot-simona-mohamsson/10256440", "date_display": "2026-03-18", "date_iso": "2026-03-18T13:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 146, "title": "Could become a vote magnet for homeless liberals", "summary": "Ann Tiberg: Strengthens Mohamsson's cards", "title_original": "Kan bli röstmagnet för hemlösa liberaler", "summary_original": "Ann Tiberg: Stärker Mohamssons kort", "link": "https://www.tv4.se/artikel/3Gh2xjmXdoy0CYBNT7DOan/ohlsson-kan-bli-en-roestmagnet-foer-hemloesa-liberaler", "date_display": "2026-03-18", "date_iso": "2026-03-18T13:23:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes"]}, {"id": 147, "title": "Here is Sweden's playoff squad", "summary": "In advance, the goalkeeper question has been a big talking point before the selection, as the previously appointed first goalkeeper Viktor Johansson is absent due to an injury. Potter's choice for the goalkeeper position fell on Noel Törnqvist, Kristoffer Nordfeldt, Melker Ellborg. The latter is a debutant in the A national team. - Melker has really impressed in Malmö FF and the way he started in the Premier League, says Potter during the press conference.  Stroud makes his debut Potter's squad includes four Allsvenskan players. Including Mjällby AIF's Elliot Stroud, who is also making his debut in the A national team. - I got a feeling for Elliot in terms of how he performed over time. His form with Mjällby has been impressive. So I chose him (Stroud), explains Potter, adding: - Elliot deserves this chance. Bergvall ready Even Tottenham Hotspur's Lucas Bergvall, who was recently pulled with an injury, is back and ready to play for the important international matches where Sweden's World Cup participation will be decided. - He has trained very well with Tottenham. He has made a fantastic rehabilitation and is ready for games ahead of time (given the forecast), says the national team captain. Williot Swedberg, who has a fine season behind him in Celta Vigo, is also among the 26 selected players.  Starts against Ukraine Next week, the Swedish men's national team gathers in Valencia, Spain, ahead of the playoff semi-final against Ukraine (March 26). The winner of that meeting gets to play in the final against either Poland or Albania on March 31. In the pot is a ticket to the WC in the USA, Mexico and Canada. Should Sweden make it to the playoff final, it will be played at Strawberry Arena. In the event of a loss against Ukraine, a friendly international against the loser of Poland or Albania awaits, at the national arena.", "title_original": "Här är Sveriges playoff-trupp", "summary_original": "På förhand har målvaktsfrågan varit en stor snackis inför uttagningen, då den tidigare givna förstamålvakten Viktor Johansson är frånavrande på grund av en skada. Potters val till målvaktspositionen föll på Noel Törnqvist, Kristoffer Nordfeldt, Melker Ellborg. Den sistnämnda är debutant i A-landslaget. – Melker har verkligen imponerat i Malmö FF och hur han startat i Premier League, säger Potter under pressträffen.  Stroud debuterar I Potters trupp finns fyra Allsvenska spelare med. Däribland Mjällby AIF:s Elliot Stroud som också gör sin debut i A-landslaget. – Jag fick en känsla för Elliot sett till hur han presterat över tid. Hans form med Mjällby har varit imponerande. Så jag valde honom (Stroud), förklarar Potter och tillägger: – Elliot förtjänar den här chansen. Bergvall redo Även Tottenham Hotspurs Lucas Bergvall, som nyligen dragits med en skada, är tillbaka och redo för spel till de viktiga landskamperna där Sveriges VM-deltagande ska avgöras. – Han har tränat väldigt bra med Tottenham. Han har gjort en fantastisk rehabilitering och är redo för spel i förtid (sett till prognosen), säger förbundskaptenen. Williot Swedberg som har en fin säsong bakom sig i Celta Vigo bakom finns också med bland de 26 uttagna spelarna.  Inleder mot Ukraina Nästa vecka samlas svenska herrlandslaget i spanska Valencia inför playoff-semifinalen mot Ukraina (26 mars). Segraren i det mötet får spela final mot antingen Polen eller Albanien den 31 mars. I potten ligger en biljett till VM i USA, Mexiko och Kanada. Skulle Sverige ta sig till playoff-final spelas den på Strawberry Arena. Vid förlust mot Ukraina väntar en vänskapslandskamp mot förloraren av Polen eller Albanien, på nationalarenan.", "link": "https://www.tv4.se/artikel/7o2DDt9wr4d7Fm0Pe8sw0o/graham-potter-tar-ut-truppen-till-vm-playoffen", "date_display": "2026-03-18", "date_iso": "2026-03-18T10:57:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/sport", "/svenska-landslaget-i-fotboll", "/graham-potter", "/fotbolls-vm-2026"]}, {"id": 148, "title": "The prosecutor calls for a long prison sentence for the \"bonus prince\"", "summary": "No penalty discount • \"A test of whether we can have a monarchy\"", "title_original": "Åklagaren yrkar på långt fängelsestraff för ”bonusprinsen”", "summary_original": "Ingen straffrabatt • ”Ett test om vi kan ha monarki”", "link": "https://www.tv4.se/artikel/3B69EreHvFopy1Mjkl6d5r/aklagaren-yrkar-pa-langt-faengelsestraff-foer-bonusprinsen", "date_display": "2026-03-18", "date_iso": "2026-03-18T10:54:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 149, "title": "Here is Zlatan's new job", "summary": "Zlatan Ibrahimovic, 44, will play a role in this summer's World Cup finals in Canada, Mexico and the United States. Now it is clear that Ibrahimovic will be an expert for American Fox Sports during the championship. He thus joins, for example, Arsenal legend Thierry Henry in the television company's broadcast team. \"I am happy to announce that I will start at Fox Sports in the USA this summer to cover the soccer World Cup. Welcome, America,\" writes Ibrahimovic on X. In a video on X, he says, among other things, the following: - The Olympics are over, but there is no reason to be sad or depressed, says the Swede and continues: - The snow is melting now and you know what you want to do. You want to watch the best in the world. I bring good news to the American people. The WC is coming to Fox this summer. So does Zlatan. See you soon. You're welcome, America. Sweden is not ready for the World Cup Fox top Brad Zager says, to The Athletic, that Ibrahimovic topped the broadcaster's list of people they wanted on their broadcast team. - Zlatan was one of those with whom there was no reason not to try and see if he would be willing to do this, he says. Sweden is not yet ready for the WC this summer. On March 26, Sweden plays a playoff semi-final against Ukraine in Spain. The winner gets to play a decisive playoff final to participate in the WC.", "title_original": "Här är Zlatans nya jobb", "summary_original": "Zlatan Ibrahimovic, 44, kommer att spela en roll under sommarens VM-slutspel i Kanada, Mexiko och USA. Nu står det klart att Ibrahimovic kommer att vara expert för amerikanska Fox Sports under mästerskapet. Han gör därmed exempelvis Arsenal-legendaren Thierry Henry sällskap i tv-bolagets sändningsteam. ”Jag är glad över att kunna meddela att jag kommer att börja på Fox Sports i USA i sommar för att bevaka fotbolls-VM. Välkommen, Amerika”, skriver Ibrahimovic på X. I ett videoklipp på X säger han bland annat följande: – OS är över, men det finns ingen anledning att vara ledsen eller deprimerad, säger svensken och fortsätter: – Snön smälter nu och ni vet vad ni vill göra. Ni vill titta på det bästa i världen. Jag ger det amerikanska folket bra nyheter. VM kommer till Fox i sommar. Det gör Zlatan också. Vi ses snart. Ni är välkomna, Amerika. Sverige är inte klart för VM Fox-toppen Brad Zager säger, till The Athletic, att Ibrahimovic toppade tv-bolagets lista gällande personer som de ville ha med i sitt sändningsteam. – Zlatan var en av dem som det inte fanns någon anledning att inte försöka med och se om han skulle vara villig att göra det här, säger han. Sverige är ännu inte klart för VM i sommar. Den 26 mars spelar Sverige en playoff-semifinal mot Ukraina i Spanien. Vinnaren får spela en helt avgörande playoff-final om att delta i VM.", "link": "https://www.tv4.se/artikel/2xDvMmOtKHynEFQXYbDKOV/haer-aer-zlatans-nya-jobb", "date_display": "2026-03-18", "date_iso": "2026-03-18T07:46:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/sport", "/fotboll"]}, {"id": 150, "title": "Now the electric car premium starts to apply - that's how much money you can get", "summary": "The new electric car premium is a targeted climate effort for households in rural areas with lower incomes. The money comes partly from the EU's social climate fund, which accounts for 75 percent, and the rest is financed by the Swedish state. - The social climate fund aims to make the climate transition more fair, so that the households most affected by fuel prices will have the opportunity to participate in the transition, says Elin Hall, expert at the Environmental Protection Agency. Here are the criteria for the premium There are a number of criteria that must be met to receive the new electric car premium. It is about the premium going to households that need it the most and that are most affected by fuel prices. Firstly, you must live in a rural municipality or in an area that has limited access to public transport. The second is that the household's income must be below 80 percent of the average income in Sweden. - Household income means that we look at incomes for all adults in the household and then they are adjusted based on how many people the income should be enough for, says Elin Hall in Nyhetsmorgon. How much money you can get The most you can get is a total of SEK 64,800, divided into SEK 1,300 per month for a maximum of 36 months (SEK 46,800), plus a start-up grant of SEK 18,000. Around 800,000 households are deemed to meet the set criteria. You can get the premium for both new and used cars, but it can cost a maximum of SEK 450,000 - or if you choose to lease the car, it can cost SEK 4,600 a month. In addition, you must not have had an electric car or a plug-in hybrid in the last year. Do you notice the interest already? - I just received a report that some applications have already come in during the morning or night.", "title_original": "Nu börjar elbilspremien gälla – så mycket pengar kan du få", "summary_original": "Den nya elbilspremien är en riktad klimatinsats till hushåll på landsbygden med lägre inkomster. Pengarna kommer delvis från EU:s sociala klimatfond, som står för 75 procent, och resten finansieras av svenska staten. – Den sociala klimatfonden syftar till att göra klimatomställningen mer rättvis, så att de hushåll som påverkas mest av drivmedelspriser ska kunna få möjlighet att vara med i omställningen, säger Elin Hall, sakkunnig på Naturvårdsverket. Här är kriterierna för premien Det finns ett antal kriterier som man ska uppfylla för att få den nya elbilspremien. Det handlar om att premien ska gå till hushåll som behöver det mest och som är mest påverkade av drivmedelspriser. För det första ska man bo i en landsbygdskommun eller i ett område som har begränsad tillgång till kollektivtrafik. Det andra är att hushållets inkomst ska vara under 80 procent av medelinkomsten i Sverige. – Hushållsinkomst innebär att vi tittar på inkomster för alla vuxna i hushållet och så justeras de utifrån hur många inkomsterna ska räcka till, säger Elin Hall i Nyhetsmorgon. Så mycket pengar kan du få Som mest kan man få totalt 64 800 kronor, fördelat på 1 300 kronor per månad i maximalt 36 månader (46 800 kronor), plus ett startstöd på 18 000 kronor. Omkring 800 000 hushåll bedöms träffas av de uppsatta kriterierna. Du kan få premien både för nya och begagnade bilar, men den får kosta max 450 000 kronor – eller om du väljer att leasa bilen får den kosta 4 600 kronor i månaden. Dessutom får man inte ha haft en elbil eller en laddhybrid det senaste året. Märker ni av intresset redan nu? – Jag fick en rapport nyss att det redan kommit in lite ansökningar under morgonen eller natten.", "link": "https://www.tv4.se/artikel/01nUDy6R0w1Ibbaoc8sdyx/elbilspremien-traeder-i-kraft-i-dag-sa-funkar-den", "date_display": "2026-03-18", "date_iso": "2026-03-18T07:40:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/klimat", "/klimatpolitik", "/klimatomstallningen", "/elbilar"]}, {"id": 151, "title": "Åkesson after the L notice: Made no concessions", "summary": "\"Not the first time I get a hug from Simona\"", "title_original": "Åkesson efter L-beskedet: Gjorde inga eftergifter", "summary_original": "”Inte första gången jag får en kram av Simona”", "link": "https://www.tv4.se/artikel/2XtyIx4iwO0NLopIjcX9iG/akesson-efter-l-beskedet-gjorde-inga-eftergifter", "date_display": "2026-03-18", "date_iso": "2026-03-18T05:16:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 152, "title": "The same prophetic address three times in 24 hours prompted Robert to begin preaching", "summary": "Today, 70-year-old Robert Sahrling holds regular Bible studies.", "title_original": "Samma profetiska tilltal tre gånger på 24 timmar fick Robert att börja predika", "summary_original": "I dag håller 70-årige Robert Sahrling regelbundet i bibelstudier.", "link": "https://www.dagen.se/familj/samma-profetiska-tilltal-tre-ganger-pa-24-timmar-fick-robert-att-boerja-predika/10242047", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 153, "title": "There is a shortage of priests and deacons - but what is being done about it?", "summary": "A church that wants to carry the gospel into the future must also take responsibility for how the bearers of the future are formed. Only then can more people dare to say yes, writes Sebastian Fontler.", "title_original": "Det är präst- och diakonbrist – men vad görs åt saken?", "summary_original": "En kyrka som vill bära evangeliet in i framtiden måste också ta ansvar för hur framtidens bärare formas. Först då kan fler våga säga ja, skriver Sebastian Fontler.", "link": "https://www.dagen.se/debatt/det-aer-praest-och-diakonbrist-men-vad-goers-at-saken/10248156", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 154, "title": "Today's parents - A parent's worst nightmare", "summary": "In the podcast \"Today's parents\" Mattias and Johanna Davén talk about a parent's worst nightmare.", "title_original": "Dagens föräldrar - En förälders värsta mardröm", "summary_original": "I podden ”Dagens föräldrar” berättar Mattias och Johanna Davén om en förälders värsta mardröm.", "link": "https://www.dagen.se/podd/dagens-foeraeldrar-en-foeraelders-vaersta-mardroem/10255386", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 155, "title": "\"Gabriel made many turn to God during the days he lived\"", "summary": "Mattias and Johanna Davén lost their son – seven days after the birth", "title_original": "”Gabriel fick många att vända sig till Gud under de dagar han levde”", "summary_original": "Mattias och Johanna Davén förlorade sin son – sju dagar efter förlossningen", "link": "https://www.dagen.se/livsstil/gabriel-fick-manga-att-vaenda-sig-till-gud-under-de-dagar-han-levde/10252992", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "He ends his football career - gets a \"pastor's role\" in the club", "summary": "Daniel Norrby, 23: \"I want to invest wholeheartedly in what I am passionate about in the church and what Jesus has put on my heart\"", "title_original": "Han avslutar fotbollskarriären – får ”pastorsroll” i klubben", "summary_original": "Daniel Norrby, 23: ”Jag vill satsa helhjärtat på det jag brinner för i kyrkan och det Jesus har lagt på mitt hjärta”", "link": "https://www.dagen.se/nyheter/han-avslutar-fotbollskarriaeren-far-pastorsroll-i-klubben/10253179", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "Principal at a Christian preschool: \"Preoccupied\" to connect Säpo", "summary": "The Social Democrats propose that Säpo be connected to counter religious extremism in denominational preschools - now the Christian actors are roaring back", "title_original": "Rektor på kristen förskola: ”Befängt” att koppla in Säpo", "summary_original": "Socialdemokraterna föreslår att Säpo ska kopplas in för att motverka religiös extremism i konfessionella förskolor – nu ryter de kristna aktörerna ifrån", "link": "https://www.dagen.se/nyheter/rektor-pa-kristen-foerskola-befaengt-att-koppla-in-saepo/10246520", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "Denmark abolished the Great Day of Prayer - before the election the politicians regret it", "summary": "The governing parties blame themselves and many want the holiday to be reintroduced.", "title_original": "Danmark avskaffade Stora bönedagen – inför valet ångrar sig politikerna", "summary_original": "Regeringspartierna skyller ifrån sig och många vill att helgdagen ska återinföras.", "link": "https://www.dagen.se/nyheter/danmark-avskaffade-stora-boenedagen-infoer-valet-angrar-sig-politikerna/10253950", "date_display": "2026-03-18", "date_iso": "2026-03-18T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "The Uppsala professor in bad weather - after posts about Iran's national team", "summary": "Uppsala professor Ashok Swain receives harsh criticism after a post on X about the Iranian women's national soccer team. The post concerns players who applied for asylum in Australia, but where several are said to have returned to Iran. \"Australia has granted asylum to seven members of the Iranian women's soccer team. Last week, one, and three more, decided to return to Iran. It shows how the war has brought Iranians together!\", he writes in the post. Swain is head of department at the Department of Peace and Conflict Research at Uppsala University and has over half a million followers on X, where he often shares posts about conflicts in the Middle East. Criticism of \"regime propaganda\" The post has received harsh criticism from people who believe that Swain spreads the Iranian regime's propaganda and supports its narrative. In the comment fields, he is accused of doing the business of the Islamic Republic. Critics believe that the players' return may rather be due to the regime's pressure on relatives inside Iran. The post has also received international attention, including from the British Member of Parliament Tom Tugendhat. \"A professor in Sweden claims that the violent threats against Iranian women's families are a sign of unity rather than what it is: a sign of how low the Islamic Republic will stoop to force silence and obedience from women, even outside their borders. Unbelievable,\" writes Tom Tugendhat in a post. Swain: \"Doesn't support the regime\" Swain himself says he rejects the criticism, saying that he does not support the Iranian regime, but that he - like so many Iranians - wants to see it fall. When asked if his posts can be perceived as him going about the regime's business, he answers.\n\n- No, absolutely not. Because I don't think that was the intention. I was talking about the political development, he says to TV4 Nyheterna.\n\n- I said that because they have realized what is happening in the political structure and in the political and social development in Iran after the war, the regime is not about to collapse. On the contrary, mä has", "title_original": "Uppsalaprofessorn i blåsväder – efter inlägg om Irans landslag", "summary_original": "Uppsalaprofessorn Ashok Swain får hård kritik efter ett inlägg på X om iranska damfotbollslandslaget. Inlägget rör spelare som sökt asyl i Australien, men där flera uppges ha återvänt till Iran. ”Australien har beviljat asyl till sju medlemmar i det iranska damfotbollslaget. Förra veckan har en, och ytterligare tre, beslutat att återvända till Iran. Det visar hur kriget har fört iranier samman!”, skriver han i inlägget. Swain är avdelningschef vid institutionen för freds- och konfliktforskning på Uppsala universitet och har över en halv miljon följare på X, där han ofta delar inlägg om konflikter i Mellanöstern. Kritik mot ”regimpropaganda” Inlägget har fått hård kritik av personer som menar att Swain sprider den iranska regimens propaganda och stödjer dess narrativ. I kommentarsfälten anklagas han för att gå den Islamiska republikens ärenden. Kritiker menar att spelarnas återvändande snarare kan bero på regimens påtryckningar mot anhöriga inne i Iran. Inlägget har även uppmärksammats internationellt, bland andra av den brittiske ledamoten Tom Tugendhat. ”En professor i Sverige hävdar att de våldsamma hoten mot iranska kvinnors familjer är ett tecken på enighet snarare än vad den är: ett tecken på hur djupt den Islamiska Republiken kommer att sänka sig för att tvinga fram tystnad och lydnad från kvinnor, även utanför deras gränser. Otroligt”, skriver Tom Tugendhat i ett inlägg. Swain: ”Stödjer inte regimen” Swain säger själv slår ifrån sig kritiken, och menar att han inte stödjer den iranska regimen, utan att han – som så många iranier – vill se den falla. På frågan om hans inlägg kan uppfattas som att han går regimens ärenden, svarar han.\n\n– Nej, absolut inte. För jag tror inte att det var avsikten. Jag pratade om den politiska utvecklingen, säger han till TV4 Nyheterna.\n\n– Jag sa att eftersom de har insett vad som sker i den politiska strukturen och i den politiska och sociala utvecklingen i Iran efter kriget, så är inte regimen på väg att kollapsa. Tvärtom har människor, i nationalismens namn, slutit sig samman. Det här kriget handlar inte längre om regimen; det är ett krig mot Iran, fortsätter han. Swain har tidigare delat ett inlägg från den iranska statliga tv‑kanalen Press TV som uppmärksammade Quds‑dagen, grundad av den islamiska revolutionens förste ledare, ayatolla Khomeini.  Säkerhetsexperten varnar Enligt säkerhetsexperten Jörgen Holmlund riskerar Ashoks uttalanden att uppfattas som desinformation, och gynna en totalitär regims berättelse.  – Det är så pass underligt uttalande i relation till kopplingen i systemet. Jag frestas att tro att det är annat än omedvetet slarv i den här paketeringen, säger Holmlund till TV4 Nyheterna. – Medvetet eller omedvetet är det en desinformationsdel där man ger den totalitära statens narrativ i hur man ser på saker, fortsätter han. Han reagerar också på att uttalandet kommer från någon i en sådan position.  – Jag tycker det påvisar en grad av antingen djup omedvetenhet i hur det ser ut, att man blir en desinformationskälla för en regim som faktiskt i närtid har visat sig vara rätt olyckliga mot sina egna medborgare.  – Man ska vara aktsam i att klä sig i en kontext av att föra deras narrativ och budskap framåt i det systemet och mer lyssna i hur det ser ut.   Holmlund påpekar att landslagsspelarna tidigare protesterat mot regimen och att deras återvändande inte ska tolkas som uttryck för sympati, utan snarare som en indikation på att deras familjer kan vara utsatta för hot. Han pekar också på regimens agerande i Sverige. – Iran bedriver ju också här i Sverige faktiskt flyktingspionage och det har ju nyligen avslöjats i TV4 där man faktiskt kan tänka sig till och med genomföra lönnmord mot de som är regimkritiska. Och den regimen ska vi väl hålla på armlängds avstånd och vara rätt försiktiga innan vi uttrycker sympatier för dem.", "link": "https://www.tv4.se/artikel/7nU0aCO8EwHlj0ei3vFQeV/uppsalaprofessorn-i-blasvaeder-efter-inlaegg-om-irans-landslag", "date_display": "2026-03-17", "date_iso": "2026-03-17T21:26:26+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/irankriget", "/iran", "/uppsala", "/uppsala-universitet", "/usa", "/israel"]}, {"id": 160, "title": "Many Swedes carry the bacteria - without knowing it", "summary": "Two young people have died and more than 13 people have become seriously ill after an outbreak of an unusual form of meningitis in Kent, UK.  This type of outbreak is unusual and the disease itself is very serious, says Erik Sturegård, acting state epidemiologist at the Public Health Agency, FHM. - Meningitis caused by meningococci often has a very rapid course. You can go from feeling completely healthy to being serious very quickly. In addition, it often affects young and otherwise healthy people. Can happen in Sweden It is not excluded that someone travels from Kent and falls ill in Sweden, but the outbreak will most likely not grow and spread to other cities and countries, says Erik Sturegård.  - It is not such a disease. However, it is one of the worst diseases we know of in small, local outbreaks. A similar outbreak could also occur in Sweden, he believes. - There is nothing specific that makes it happen in Kent or Great Britain. It's hard to say what made this occasion different, it's all about an unfortunate coincidence.  The bacterium that causes the disease is not uncommon. And the fact that the outbreak in Kent has become so serious is because it is a certain strain of the bacteria that has spread: Meningococcal type B, which is more aggressive. - But we don't know who gets seriously ill, why they get it and why right now, says Sturegård. Many people carry the bacteria - without knowing it Meningitis caused by meningococci is a relatively uncommon disease in Sweden, with approximately 50 cases per year. The bacterium meningococcus, on the other hand, is fairly common in society. - The vast majority do not get seriously ill, you can carry it in the airways without getting ill, it is not dangerous. If you get seriously ill, it is a matter of a combination of properties of the bacteria and the individual's immune system, says state epidemiologist Erik Sturegård. \"Not a threat to society\" Erik Sturegård describes", "title_original": "Många svenskar bär på bakterien – utan att veta om det", "summary_original": "Två ungdomar har dött och över 13 personer har blivit allvarligt sjuka efter ett utbrott av en ovanlig form av hjärnhinneinflammation i Kent, Storbritannien.  Den här typen av utbrott är ovanliga och sjukdomen i sig är väldigt allvarlig, säger Erik Sturegård, tillförordnad statsepidemiolog på Folkhälsomyndigheten, FHM. – Hjärnhinneinflammation orsakad av meningokocker har ofta ett väldigt snabbt förlopp. Man kan gå från att känna sig helt frisk till att bli allvarligt väldigt snabbt. Dessutom drabbar det inte sällan unga och i övrigt friska personer. Kan ske i Sverige Det är inte är uteslutet att någon reser från Kent och insjuknar i Sverige, men utbrottet kommer med allra största sannolikhet inte att växa och spridas till andra städer och länder, säger Erik Sturegård.  – Det är inte en sådan sjukdom. Däremot är det en av de värsta sjukdomarna vi känner till i små, lokala utbrott. Ett liknande utbrott skulle kunna ske även i Sverige, menar han. – Det är inget specifikt som gör att det sker i just Kent eller Storbritannien. Det är svårt att säga vad som gjort den här tillfället annorlunda, det handlar om en olycklig slump.  Bakterien som orsakar sjukdomen är inte ovanlig. Och att utbrottet i Kent blivit så allvarligt handlar om att det är en viss stam av bakterien som fått spridning: Meningokocker typ B, som är mer aggressiv. – Men vilka som blir allvarligt sjuka, varför just de blir det och varför just nu vet vi inte, säger Sturegård. Många bär på bakterien – utan att veta om det Hjärnhinneinflammation orsakad av meningokocker är en relativt ovanlig sjukdom i Sverige, med ungefär 50 fall per år. Bakterien meningokocker är däremot tämligen vanlig i samhället. – De allra flesta blir inte allvarligt sjuka, man kan bära den i luftvägen utan att bli sjuk, det är inte farligt. Blir man allvarligt sjuk handlar det om en kombination av egenskaper hos bakterien och individens immunförsvar, säger statsepidemiolog Erik Sturegård. ”Inte ett samhällshot” Erik Sturegård beskriver sjukdomen som mindre smittsam än covid.  – Det är inte ett samhällshot, som till exempel en pandemi är. Det som gör sjukdomen så allvarlig är att förloppet är så snabbt att vården inte hinner med.  – Den kan orsaka ytterst allvarliga infektioner hos unga i övrigt friska personer trots god sjukvård. Det måste hanteras akut för att undvika alvarliga skador och dödsfall, säger Sturegård. Finns vaccin  I Sverige vaccinerar man inte mot meningokocker. Men det finns vaccin att tillgå, om man till exempel ska resa till länder söder om Sahara, där sjukdomen är vanligast, eller hajj, där många människor samlas på en liten yta, säger Erik Sturegård. – Utbrott av meningokocker är ovanligt. Men ska man till länder med trångboddhet och bristande tillgång till sjukvård, till exempel i Afrika söder om Sahara, kan det vara klokt att vaccinera.", "link": "https://www.tv4.se/artikel/458hq6UZJL4MLjF7pDS6yh/manga-svenskar-baer-pa-bakterien-utan-att-veta-om-det", "date_display": "2026-03-17", "date_iso": "2026-03-17T19:47:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/storbritannien", "/bakterier", "/sjukdomar", "/folkhalsomyndigheten", "/halsa"]}, {"id": 161, "title": "Sweden joins Pax Silica initiative", "summary": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "title_original": "Sweden joins Pax Silica initiative", "summary_original": "On 17 March, Minister for Foreign Affairs Maria Malmer Stenergard signed the Pax Silica Declaration in connection with her visit to Houston, Texas. The initiative brings together leading technology nations and aims to strengthen cooperation to secure supply chains for emerging technologies. Pax Silica will also help promote innovation, secure digital infrastructure and protect sensitive technologies.", "link": "https://www.government.se/press-releases/2026/03/sweden-joins-pax-silica-initiative/", "date_display": "2026-03-17", "date_iso": "2026-03-17T17:05:30+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Innovation", "Maria Malmer Stenergard"]}, {"id": 162, "title": "In memory of Roland Gäreskog", "summary": "", "title_original": "Till minne av Roland Gäreskog", "summary_original": "", "link": "https://www.dagen.se/familj/till-minne-av-rolan rch 2026. Check against delivery.", "title_original": "Speech by the Minister for Foreign Affairs at the Baltic Sea Security Talks in Gdansk", "summary_original": "Speech by the Minister for Foreign Affairs Maria Malmer Stenergard at the Baltic Sea Security Talks in Gdansk, 12 March 2026. Check against delivery.", "link": "https://www.government.se/speeches/2026/03/speech-by-the-minister-for-foreign-affairs-at-the-baltic-sea-security-talks-in-gdansk-on-12-march/", "date_display": "2026-03-13", "date_iso": "2026-03-13T13:51:21+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "5 days old", "tags": ["Speech", "International", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 182, "title": "The Payments Report 2026: Measures required to reduce vulnerability and increase inclusion in the payments market", "summary": "In order to reduce dependence on the outside world, the banks need to develop new payment services based on national and European systems. Primarily, banks must offer more services for instant payments, otherwise legislation should be introduced. To increase inclusion in the payment market, more payment methods are needed for those who do not have a payment account or experience digital exclusion. Access to cash services also needs to be improved, the Riksbank writes in the Payment Report published today.", "title_original": "Betalningsrapporten 2026: Åtgärder krävs för minskad sårbarhet och ökad inkludering på betalningsmarknaden", "summary_original": "För att minska omvärldsberoendet behöver bankerna utveckla nya betaltjänster som bygger på nationella och europeiska system. Primärt måste bankerna erbjuda fler tjänster för omedelbara betalningar, annars bör lagstiftning införas. För att öka inkluderingen på betalningsmarknaden behövs det fler betalsätt för de som saknar betalkonto eller upplever digitalt utanförskap. Tillgången till kont
