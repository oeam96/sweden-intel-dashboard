rebro. För lagkamraterna i BK Forward har träningsplanen blivit en plats där de kan samlas, och försöka hantera saknaden efter sin vän. – Vore alla som Hugo skulle världen vara bättre, säger tränaren Rickard Nilsson.", "link": "https://www.dn.se/sport/traningarna-hjalper-fotbollslaget-i-sorgen-efter-ihjalskjutne-lagkamraten/", "date_display": "2026-03-26", "date_iso": "2026-03-26T19:35:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "DN Debate. \"No own screens for children in primary and middle school\"", "summary": "DN DEBATE. It's time to put an end to the school's computer addiction. Because what do we signal when, on the one hand, we argue about screen time at home, while at the same time we give the children a school they cannot cope with without tablets and computers? Away with individual screens for primary and middle school and in with a screen-free teaching, write Ebba Busch and Jakob Forssmed, Christian Democrats.", "title_original": "DN Debatt. ”Inga egna skärmar för barn i låg- och mellanstadiet”", "summary_original": "DN DEBATT. Det är dags att göra upp med skolans datorberoende. För vad signalerar vi när vi å ena sidan bråkar om skärmtiden hemma, samtidigt som vi ger barnen en skola de inte klarar utan surfplattor och datorer? Bort med individuella skärmar för låg- och mellanstadiet och in med en skärmfri undervisning, skriver Ebba Busch och Jakob Forssmed, Kristdemokraterna.", "link": "https://www.dn.se/debatt/inga-egna-skarmar-for-barn-i-lag-och-mellanstadiet/", "date_display": "2026-03-26", "date_iso": "2026-03-26T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 136, "title": "The play about Swedish war veterans is endlessly interesting – and NATO-current", "summary": "Riksteatern's \"Veterans\" portrays the fate of soldiers with striking simplicity - four actors mostly in civilian clothes and a pile of sand are all that is needed. Johanna Paulsson has seen former Foreign Ministry official Andreas Norman's strong play debut.", "title_original": "Pjäsen om svenska krigsveteraner är oavbrutet intressant – och Nato-aktuell", "summary_original": "Riksteaterns ”Veteranerna” gestaltar soldaternas livsöden med drabbande enkelhet – fyra mestadels civilklädda skådespelare och en sandhög är allt som behövs. Johanna Paulsson har sett tidigare UD-tjänstemannen Andreas Normans starka pjäsdebut.", "link": "https://www.dn.se/kultur/pjasen-om-svenska-krigsveteraner-ar-oavbrutet-intressant-och-nato-aktuell/", "date_display": "2026-03-26", "date_iso": "2026-03-26T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "Leif Zern: In the theater, Ukrainians are not alone", "summary": "The air raid alarm goes off during a performance at the National Theater in Kyiv. War and theater have always gone hand in hand, writes Leif Zern.", "title_original": "Leif Zern: På teatern är ukrainarna inte ensamma", "summary_original": "Flyglarmet går under en föreställning på nationalteatern i Kiev. Krig och teater har alltid slagit följe, skriver Leif Zern.", "link": "https://www.dn.se/kultur/leif-zern-pa-teatern-ar-ukrainarna-inte-ensamma/", "date_display": "2026-03-26", "date_iso": "2026-03-26T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "José González appears as Sweden's mildest protest singer", "summary": "The singer/songwriter's fifth album is existential twilight music inspired by Welsh poet Dylan Thomas. DN's Alexandra Sundqvist is gently rocked by José González's melodies.", "title_original": "José González framstår som Sveriges mildaste protestsångare", "summary_original": "Singer/songwriterns femte album är existentiell skymningsmusik med inspiration från walesiske poeten Dylan Thomas. DN:s Alexandra Sundqvist vaggas mjukt fram av José González melodier.", "link": "https://www.dn.se/kultur/jose-gonzalez-framstar-som-sveriges-mildaste-protestsangare/", "date_display": "2026-03-26", "date_iso": "2026-03-26T19:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "The new top: \"S has been part of the right-wing wind\"", "summary": "The right accuses S of making a \"dangerous left turn\". But the party's largest association, the Reformists, wants S to go further – with more taxes and a ban on profits in the whole of welfare. - I think it is very important to be able to admit that we have had a right-wing wind in Sweden, and our party has not been able to withstand that, says the new chairman Annie Ross.", "title_original": "Nya toppen: ”S har varit en del av högervinden”", "summary_original": "Högern anklagar S för att göra en ”farlig vänstersväng”. Men partiets största förening, Reformisterna, vill att S ska gå längre – med fler skatter och ett förbud mot vinster i hela välfärden. – Jag tror det är väldigt viktigt att kunna erkänna att vi har haft en högervind I Sverige, och det har inte vårt parti kunnat stå emot, säger den nya ordföranden Annie Ross.", "link": "https://www.dn.se/sverige/nya-toppen-s-har-varit-en-del-av-hogervinden/", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:52:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Terrorist propaganda spread on Spotify: \"No platform spared\"", "summary": "Terrorist propaganda on open audio platforms is a growing problem. Now Swedish police have been involved in taking down over 17,000 files, which were spread on services such as Spotify. - No platform is spared, says Pia Lundmark, group manager at the police.", "title_original": "Terrorpropaganda spreds på Spotify: ”Ingen plattform skonas”", "summary_original": "Terrorpropaganda på öppna ljudplattformar är ett växande problem. Nu har svensk polis varit med och tagit ned över 17 000 filer, som spridits på tjänster som Spotify. – Ingen plattform är förskonad, säger Pia Lundmark, gruppchef hos polisen.", "link": "https://www.dn.se/sverige/terrorpropaganda-spreds-pa-spotify-tusentals-filer-nedtagna/", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:44:55+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "Robyn's new album doesn't hold up as a grand comeback", "summary": "\"Sexistential\" is the pop star's first album in eight years. But how can Robyn not have more to come as she hard-launches her comeback? That's what DN's Saga Cavallin, who has listened to the record, wonders.", "title_original": "Robyns nya album håller inte som storslagen comeback", "summary_original": "”Sexistential” är popstjärnans första album på åtta år. Men hur kan Robyn inte ha mer att komma med när hon hårdlanserar sin återkomst? Det frågar sig DN:s Saga Cavallin, som har lyssnat på skivan.", "link": "https://www.dn.se/kultur/robyns-nya-album-haller-inte-som-storslagen-comeback/", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:29:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 142, "title": "Sweden won against Ukraine in the WC playoff", "summary": "Sweden's men's national soccer team faces Ukraine in the semi-finals of the playoff for the soccer World Cup. Victory in tonight's match is a must for the dream of a blue-yellow championship summer to live. Follow the thriller here - kick-off 20.45.", "title_original": "Sverige vann mot Ukraina i VM-playoff", "summary_original": "Sveriges herrlandslag i fotboll ställs mot Ukraina i semifinal i playoff till fotbolls-VM. Seger i kvällens match är ett måste för att drömmen om en blågul mästerskapssommar ska leva. Följ rysaren här – avspark 20.45.", "link": "https://www.dn.se/sport/just-nu-sa-startar-sverige-mot-ukraina-i-kvallens-vm-playoff/", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:26:45+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Sweden one match from the WC – great show by Gyökeres", "summary": "Hat-trick from attacking star: \"World class\" • Gets to face Poland in the final", "title_original": "Sverige en match från VM – stor show av Gyökeres", "summary_original": "Hattrick av anfallsstjärnan: ”Världsklass” • Får möta Polen i final", "link": "https://www.tv4.se/artikel/2Iv9ig7xa9I9pVfMf0O3j7/sa-startar-sverige-mot-ukraina-i-oedesmatchen", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:22:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 144, "title": "The star chef rages - with a week left: \"Of course a hole in the head\"", "summary": "Restaurateur Erik Videgård is strongly critical of the new food VAT, which comes into effect in a week.  Videgård believes that restaurants whose owners and staff already have a high workload are disadvantaged by the new rules and may also have more administration to deal with. - Assume that you sell both alcohol, food and takeaway, then you must handle three different VAT rates, says Erik Videgård to TV4 Nyheterna. \"This is choice pork\" In a post on Instagram, Videgård calls the new food tax a \"very ill-thought-out decision\" that makes restaurant food relatively more expensive.  At the same time, he directs criticism at the finance minister. \"It's obviously a hole in the head and my hope is that people will catch their wits and change this right away,\" the chef writes and asks himself in a video: \"How were Elisabeth Svantesson and her friends thinking here?\" - You have twice as much VAT compared to everyone else. This means that the food you buy in a store or the food you buy as take away becomes relatively cheaper, while the prices in restaurants are stagnant, says Videgård and highlights that all food bought in a store or as take away becomes cheaper, including food that is \"not good for us\". - Instead of removing the VAT on fruit and vegetables and increasing the VAT on ultra-processed food. You have to think a little, this is whale pork, and it's also limited in time.  \"Terribly unfair\" The purpose of the government's VAT reduction is to push down food prices and strengthen households' purchasing power. In an interview with Dagens nyheter, restaurateur Jonas Lagerström dismisses the argument that it would in turn benefit the restaurants.  - When you know that the margins are already so bad in the restaurant industry, why shouldn't these percentages end up with the businesses? It is very illogical, he tells DN. Erik Videgård highlights that many restaurants had a tough time during and after the pandemic. - It's horribly unfair and you could have done it in a smarter way, if you'd only tried a little harder. TV4 Nyheterna has searched for Elis", "title_original": "Stjärnkocken rasar – med en vecka kvar: ”Självklart hål i huvudet”", "summary_original": "Krögaren Erik Videgård är starkt kritisk mot den nya matmomsen, som börjar gälla om en vecka.  Videgård menar att restauranger vars ägare och personal redan har hög arbetsbörda missgynnas av de nya reglerna och dessutom kan få mer administration att hantera. – Ponera att du säljer både alkohol, mat och takeaway, då ska du alltså hantera tre olika momssatser, säger Erik Videgård till TV4 Nyheterna. ”Det här är valfläsk” I ett inlägg på Instagram kallar Videgård den nya matmomsen för ett ”väldigt ogenomtänkt beslut” som gör restaurangmat förhållandevis dyrare.  Samtidigt riktar han kritik mot finansministern. ”Det är självklart hål i huvudet och min förhoppning är att man tar sitt förnuft till fånga och ändrar detta direkt”, skriver kocken och frågar sig i en video: ”Hur tänkte Elisabeth Svantesson och hennes kompisar här?” – Man har dubbelt så hög moms jämfört med alla andra. Det betyder att maten du köper i butik eller maten som du köper som take away blir förhållandevis billigare, medan priserna på restaurang står stilla, säger Videgård och lyfter fram att all mat som köps i butik eller som take away blir billigare, inklusive mat som ”inte är bra för oss”. – I stället för att ta bort momsen på frukt och grönsaker och höja momsen på ultraprocessad mat. Man måste tänka lite, det här är valfläsk, dessutom är det tidsbegränsat.  ”Fruktansvärd orättvist” Syftet med regeringens momssänkning är att pressa matpriserna och stärka hushållens köpkraft. I en intervju med Dagens nyheter avfärdar krögaren Jonas Lagerström argumentet att det i sin tur skulle gynna restaurangerna.  – När man vet att marginalerna redan är så dåliga i restaurangbranschen, varför ska de här procenten inte hamna hos verksamheterna? Det är väldigt ologiskt, säger han till DN. Erik Videgård belyser att många restauranger haft det tufft under och efter pandemin. – Det är fruktansvärt orättvist och man hade kunnat göra det på ett smartare sätt, om man bara täkt till lite grann. TV4 Nyheterna har sökt Elisabeth Svantesson.", "link": "https://www.tv4.se/artikel/5P54shGvyvp5MjojTymR4N/stjaernkocken-rasar-med-en-vecka-kvar-sjaelvklart-hal-i-huvudet", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:21:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/ekonomi", "/mat", "/livsmedel", "/restaurangbranschen", "/restaurang", "/matmoms", "/erik-videgard", "/elisabeth-svantesson"]}, {"id": 145, "title": "Torbjörn Averås Skorup and Jonna Lundell ready for \"The Traitors\"", "summary": "The fifth season of \"The Traitors\" premieres on April 16 and several participants have already been confirmed. The Social Democrats' former party leader Mona Sahlin, artist Miriam Bryant, Hollywood actress Anna Anka and journalist Johan Kücükaslan are some of the participants. Two new participants confirmed Now it is clear that Torbjörn Averås Skorup and Jonna Lundell will join them. Averås Skorup explains how the mood changed quickly in the house when the roles of traitor and faithful were assigned. He describes a nervousness and suspicion that arises among the participants. At the same time, group mentality is strong and suspicions can quickly be directed at a single person, even without clear evidence. - I don't think you can see if someone is lying. Everyone is strange and everyone is just looking for the smallest thing, says Skorup. Jonna Lundell says that she tried to see the whole thing as a game. At the same time, it was hard not to get emotionally involved. - You turn to people, you create relationships and bonds, and then you hope that those closest to you are faithful. The only thing you can trust is yourself, says Jonna Lundell. \"I have followed every single season\" Both participants have followed previous seasons of \"The Traitors\" and are looking forward to being part of it. Jonna Lundell believes that this year's edition will offer extra drama. - I love \"The Traitors\", I have followed every single season, in every single country!  - Without spoiling things, I think the viewers will feel like this: \"Ah!\" They will want to tear their hair out, she says.", "title_original": "Torbjörn Averås Skorup och Jonna Lundell klara för ”Förrädarna”", "summary_original": "Den femte säsongen av ”Förrädarna” har premiär den 16 april och flera deltagare är sedan tidigare bekräftade. Socialdemokraternas tidigare partiledare Mona Sahlin, artisten Miriam Bryant, Hollywoodfrun Anna Anka och journalisten Johan Kücükaslan är några av de som medverkar. Två nya deltagare bekräftade Nu är det klart att Torbjörn Averås Skorup och Jonna Lundell gör dem sällskap. Averås Skorup förklarar hur stämningen förändrades snabbt i huset när rollerna som förrädare och trogna delades ut. Han beskriver en nervositet och misstänksamhet som uppstår bland deltagarna. Samtidigt är gruppmentaliteten stark och misstankarna kan snabbt riktas mot en enskild person, även utan tydliga bevis. – Jag tror inte att man kan se på om någon ljuger. Alla är konstiga och alla bara letar efter minsta lilla, säger Skorup. Jonna Lundell berättar att hon försökte se det hela som ett spel. Samtidigt var det svårt att inte bli känslomässigt engagerad. – Man tyr sig till personer, man skapar relationer och band, och sen hoppas man att de närmsta är trogna. Det enda man kan lita på är sig själv, säger Jonna Lundell. ”Jag har följt varenda säsong” Båda deltagarna har följt tidigare säsonger av ”Förrädarna” och ser fram emot att vara med. Jonna Lundell tror att årets upplaga kommer att bjuda på extra mycket dramatik. – Jag älskar ”Förrädarna”, jag har följt varenda säsong, i vartenda land!  – Utan att spoila saker, så tror jag att tittarna kommer känna så här: ”Ah!” De kommer vilja slita av sig håret, säger hon.", "link": "https://www.tv4.se/artikel/1ie3HDSq8yIKqxghSrUQY4/torbjoern-averas-skorup-och-jonna-lundell-klara-foer-foerraedarna", "date_display": "2026-03-26", "date_iso": "2026-03-26T18:08:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/efter-fem", "/forradarna", "/torbjorn-averas-skorup", "/personer/jonna-lundell", "/tv-program", "/tv4"]}, {"id": 146, "title": "These social media posts could cost you your job", "summary": "According to Helj Nilsson, what is allowed largely depends on what role you have. - If you are the face of an organization, you need to be more careful than if you work behind the scenes, says Helj Nilsson. Even posts that are not directly negative for the company can have consequences. An example is the influencer \"Economic mother\", who had to leave her position at SBAB after linking to competing banks. The employer considered that it was about disloyalty and competing activities. In another case, train conductor Alida Norman was fired by the MTR after posting videos from the driver's cab on Tiktok - something that was against safety rules. - There it is both about breaking internal rules and spreading it in social media, which makes it more serious, says Helj Nilsson. Spread on social media A common mistake is to underestimate how much spread a post can get. - Even if you have a private account, the content can be shared and reach a much larger audience than you imagined. A central issue is the balance between freedom of expression and duty of loyalty. According to Helj Nilsson, the duty of loyalty is strong - especially in the private sector. - As an employee, you have a duty of loyalty to your employer around the clock. It means that you must put the employer's interests before your own in certain situations. Then the employer lost At the same time there are limits. In a high-profile case from 2012, a principal was tried for posting pictures of himself in private contexts. The court considered that the connection to the professional role was too weak, and that the employer lacked clear guidelines. - Had there been a clear policy, the outcome could have been different, says Helj Nilsson. Employees have the right to express their opinions, for example to participate in demonstrations. But here, too, it matters what position you have in the company. - If you work, for example, in an organization as a political expert, perhaps you should be careful that it could become problematic to publicly express against", "title_original": "Dessa inlägg på sociala medier kan kosta dig jobbet", "summary_original": "Vad som är tillåtet beror till stor del på vilken roll man har, enligt Helj Nilsson. – Är du ett ansikte utåt för en organisation behöver du vara mer försiktig än om du jobbar bakom kulisserna, säger Helj Nilsson. Även inlägg som inte är direkt negativa för företaget kan få konsekvenser. Ett exempel är influencern ”Ekonomimamman”, som fick lämna sin tjänst på SBAB efter att ha länkat till konkurrerande banker. Arbetsgivaren ansåg att det handlade om illojalitet och konkurrerande verksamhet. I ett annat fall fick tågvärden Alida Norman sparken av MTR efter att ha publicerat filmer från förarhytten på Tiktok – något som stred mot säkerhetsregler. – Där handlar det både om att bryta mot interna regler och att sprida det i sociala medier, vilket gör det allvarligare, säger Helj Nilsson. Spridning på sociala medier Ett vanligt misstag är att underskatta hur stor spridning ett inlägg kan få. – Även om du har ett privat konto kan innehållet delas vidare och nå en mycket större publik än du tänkt dig. En central fråga är balansen mellan yttrandefrihet och lojalitetsplikt. Enligt Helj Nilsson är lojalitetsplikten stark – särskilt i privat sektor. – Som anställd har du en lojalitetsplikt mot din arbetsgivare dygnet runt. Den innebär att du ska sätta arbetsgivarens intressen framför dina egna i vissa situationer. Då förlorade arbetsgivaren Samtidigt finns det gränser. I ett uppmärksammat fall från 2012 prövades en rektor som lagt ut bilder på sig själv i privata sammanhang. Domstolen ansåg att kopplingen till yrkesrollen var för svag, och att arbetsgivaren saknade tydliga riktlinjer. – Hade det funnits en tydlig policy hade utgången kunnat bli en annan, säger Helj Nilsson. Anställda har rätt att uttrycka sina åsikter, till exempel att delta i demonstrationer. Men även här spelar det roll vilken position du har i företaget. – Jobbar du till exempel i en organisation som politisk sakkunnig kanske du ska vara försiktig med att kan det bli problematiskt att offentligt uttrycka motsatta åsikter, särskilt i sociala medier. Enligt Helj Nilsson behöver fler arbetsplatser ta frågan på allvar. Han menar att tydlighet från arbetsgivaren minskar risken för misstag. – Det räcker inte att dela ut en policy vid anställning. Man behöver ha en levande diskussion om vad som gäller, till exempel på arbetsplatsträffar och i medarbetarsamtal.", "link": "https://www.tv4.se/artikel/6F6tCNBw9GiLsC4o158gJS/dessa-inlaegg-pa-sociala-medier-kan-kosta-dig-jobbet", "date_display": "2026-03-26", "date_iso": "2026-03-26T17:29:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Ekonomi", "/ekonomi", "/sociala-medier", "/arbetsratt", "/arbetsplats"]}, {"id": 147, "title": "Iran – from theocracy to military junta?", "summary": "", "title_original": "Iran – från teokrati till militärjunta?", "summary_original": "", "link": "https://www.tv4.se/artikel/3clNtCFgCaIZRMSF9aeHvj/iran-fran-teokrati-till-militaerjunta", "date_display": "2026-03-26", "date_iso": "2026-03-26T16:59:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 148, "title": "Rapid force in focus: JEF gathers as the threat picture sharpens", "summary": "JEF was started at the initiative of the United Kingdom in 2014, with the ambition of creating a rapid response force that can act in crises. Today, JEF consists of ten countries from the Nordics, the Baltics and the Netherlands. - From the beginning it was primarily a military collaboration. Now it has also become a political platform where prime ministers meet, says Anna Wieslander Northern Europe manager at the Atlantic Council think tank. One of the main advantages of the force is speed. Unlike NATO, which requires broad consensus, the JEF countries can make decisions and act quickly. - It is about like-minded countries that see the threat picture in a similar way. Then you can also act faster, says Wieslander. The force is intended to be used in so-called gray zone situations - situations that lie below the threshold of open war. - It could, for example, be about suspected sabotage in the Baltic Sea. Then you need to quickly show presence and signal that you are in control. Focus on the Baltic Sea and the Arctic JEF can operate on land, at sea and in the air, with a focus on the Baltic Sea area, the North Atlantic and the Arctic – areas that have become increasingly strategically important. - Security in the Arctic has taken on a completely different meaning in recent years. There, JEF is part of the whole. At the same time, there are questions about the size of the force. It is usually estimated at around 10,000 soldiers. - There are large geographical areas to be covered. There is a discussion about whether the capacity is really enough, or whether it needs to be expanded. A central question is how Europe's defense is affected if the US reduces its involvement. - We are already seeing a development where European countries are expected to take greater responsibility. Then regional collaborations like JEF become even more important, says Wieslander. Ukraine and the shadow fleet on the agenda The meeting in Helsinki is also expected to revolve around continued support for Ukraine - and how to increase pressure on Russia. One issue raised is the Russian so-called shadow fleet, which is used to circumvent sanctions and secure oil revenues. - Striking against the shadow fleet is a way to influence R", "title_original": "Snabb styrka i fokus: JEF samlas när hotbilden skärps", "summary_original": "JEF startades på initiativ av Storbritannien 2014, med ambitionen att skapa en snabbinsatsstyrka som kan agera vid kriser. I dag består JEF av tio länder från Norden, Baltikum och Nederländerna. – Från början var det främst ett militärt samarbete. Nu har det också blivit en politisk plattform där statsministrar möts, säger Anna Wieslander Nordeuropachef vid tankesmedjan Atlantic Council . En av styrkans främsta fördelar är snabbhet. Till skillnad från Nato, som kräver bred enighet, kan JEF-länderna fatta beslut och agera snabbt. – Det handlar om likasinnade länder som ser hotbilden på ett liknande sätt. Då kan man också agera snabbare, säger Wieslander. Styrkan är tänkt att användas i så kallade gråzonslägen – situationer som ligger under tröskeln för öppet krig. – Det kan till exempel handla om misstänkt sabotage i Östersjön. Då behöver man snabbt visa närvaro och signalera att man har kontroll. Fokus på Östersjön och Arktis JEF kan operera på land, till havs och i luften, med tyngdpunkt på Östersjöområdet, Nordatlanten och Arktis – områden som blivit allt mer strategiskt viktiga. – Säkerheten i Arktis har fått en helt annan betydelse de senaste åren. Där är JEF en del av helheten. Samtidigt finns frågor kring styrkans storlek. Den brukar uppskattas till omkring 10 000 soldater. – Det är stora geografiska områden som ska täckas. Det finns en diskussion om kapaciteten verkligen räcker, eller om den behöver byggas ut. En central fråga är hur Europas försvar påverkas om USA minskar sitt engagemang. – Vi ser redan en utveckling där europeiska länder förväntas ta ett större ansvar. Då blir regionala samarbeten som JEF ännu viktigare, säger Wieslander. Ukraina och skuggflottan på agendan Mötet i Helsingfors väntas också kretsa kring fortsatt stöd till Ukraina – och hur man kan öka trycket på Ryssland. En fråga som lyfts är den ryska så kallade skuggflottan, som används för att kringgå sanktioner och säkra oljeintäkter. – Att slå mot skuggflottan är ett sätt att påverka Rysslands krigsekonomi. Där kan flera JEF-länder agera gemensamt, säger Wieslander. Storbritanniens premiärminister Keir Starmer har inför mötet öppnat för ytterligare åtgärder – något som också diskuteras i Norden. – Ju fler som agerar, desto större effekt får det. Det kan förändra kalkylen för Ryssland, säger hon.", "link": "https://www.tv4.se/artikel/F6Z4O0DjTo21Sz3QLJQQ7/snabb-styrka-i-fokus-jef-samlas-naer-hotbilden-skaerps", "date_display": "2026-03-26", "date_iso": "2026-03-26T16:10:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/militar", "/svenska-forsvaret", "/nato"]}, {"id": 149, "title": "Minister for Foreign Affairs inaugurates Sweden’s new Consulate-General in Houston", "summary": "On 16–18 March, Minister for Foreign Affairs Maria Malmer Stenergard visited Texas together with HRH The Crown Princess and a business delegation. During the visit, Sweden’s new Consulate-General in Houston was inaugurated.", "title_original": "Minister for Foreign Affairs inaugurates Sweden’s new Consulate-General in Houston", "summary_original": "On 16–18 March, Minister for Foreign Affairs Maria Malmer Stenergard visited Texas together with HRH The Crown Princess and a business delegation. During the visit, Sweden’s new Consulate-General in Houston was inaugurated.", "link": "https://www.government.se/articles/2026/03/minister-for-foreign-affairs-inaugurates-swedens-new-consulate-general-in-houston/", "date_display": "2026-03-26", "date_iso": "2026-03-26T15:28:24+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "today", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Article", "Maria Malmer Stenergard"]}, {"id": 150, "title": "Joint statement by the Leaders of the Joint Expeditionary Force", "summary": "Joint statement by the Leaders of the Joint Expeditionary Force (JEF), Helsinki, 26 March 2026.", "title_original": "Joint statement by the Leaders of the Joint Expeditionary Force", "summary_original": "Joint statement by the Leaders of the Joint Expeditionary Force (JEF), Helsinki, 26 March 2026.", "link": "https://www.government.se/statements/2026/03/joint-statement-the-joint-expeditionary-force-leaders-summit/", "date_display": "2026-03-26", "date_iso": "2026-03-26T15:24:01+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "today", "tags": ["International", "Prime Minister's Office", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Ulf Kristersson", "Military defence", "Total defence"]}, {"id": 151, "title": "Young Swedish biathletes lag behind other nations", "summary": "In order to close the gap between Swedish biathlon juniors and their foreign competitors, the association and Mittuniversitetet have started a research project that will help tomorrow's national team stars reach the top.\n\nThe project began a little more than two years ago. Doctoral student Andreas Kårström at Mittuniversitetet collected data from training sessions with athletes from biathlon high schools in Östersund and Sollefteå, as well as from the junior national team's training camp.\n\nThe goal has been to analyze how different training sessions affect the active by measuring pulse, speed and movement intensity. The overall aim is to create a deeper understanding of the load during training.\n\nThe results showed clear differences between different sessions, especially in terms of speeds and training zones. The hope is that the test results can be used to eliminate or optimize the sessions that are difficult to complete with high quality. \"Very instructive\" Student Nilla Grönborg is one of those who participated and measured their training effectiveness.\n\n- It was very instructive. It was possible to read out both pulse and load and you could see which sessions were not as effective.\n\nWithin the framework of the research collaboration, an experiment with GPS has also been carried out.\n\n- During the Junior WC in Östersund last winter, we measured and compared our Swedish skaters with the German ones and were able to see and measure in a tangible way where on the course the skaters lost or pulled away. We were able to point directly to the challenges and strengths of each rider, says Andreas.\n\nThe Swedish biathlon season ends for both seniors and juniors with the SM in Piteå on the last weekend in March.", "title_original": "Unga svenska skidskyttar ligger efter andra nationer", "summary_original": "För att täppa till avståndet mellan svenska skidskyttejuniorer och deras utländska konkurrenter har förbundet och Mittuniversitetet startat ett forskningsprojekt som ska hjälpa morgondagens landslagsstjärnor att nå toppen.\n\nProjektet inleddes för lite mer än två år sedan. Doktoranden Andreas Kårström vid Mittuniversitetet samlade in data från träningspass med aktiva från skidskyttegymnasier i Östersund och Sollefteå, samt från juniorlandslagets träningsläger.\n\nMålet har varit att analysera hur olika träningspass påverkar de aktiva genom att mäta puls, hastighet och rörelseintensitet. Det övergripande syftet är att skapa en djupare förståelse för belastningen under träningen.\n\nResultaten visade tydliga skillnader mellan olika pass, särskilt vad gäller hastigheter och träningszoner. Förhoppningen är att testresultaten ska kunna användas för att eliminera eller optimera de pass som är svåra att genomföra med hög kvalitet. ”Väldigt lärorikt” Eleven Nilla Grönborg är en av dem som varit med och mätt sin träningseffektivitet.\n\n– Det var väldigt lärorikt. Det gick att utläsa både puls och belastning och man kunde se vilka pass som inte var lika effektiva.\n\nInom ramen för forskningssamarbetet har även ett experiment med GPS genomförts.\n\n– Under junior-VM i Östersund förra vintern mätte vi och jämförde våra svenska åkare med de tyska och kunde på ett handfast sätt se och mäta var på banen som åkarna tappade eller drog ifrån. Vi kunde direkt peka på utmaningar och styrkor för respektive åkare, berättar Andreas.\n\nDen svenska skidskyttesäsongen avslutas för både seniorer och juniorer med SM i Piteå den sista helgen i mars.", "link": "https://www.tv4.se/artikel/bs5Iw9G6KNn3cnCAOfD8p/unga-svenska-skidskyttar-ligger-efter-andra-nationer", "date_display": "2026-03-26", "date_iso": "2026-03-26T15:06:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport", "/skidskytte", "/juniorer"]}, {"id": 152, "title": "Today Noelia dies - young woman receives euthanasia in Spain after dispute", "summary": "The father tried to stop the decision for two years, wanted the daughter to be treated for depression.", "title_original": "I dag dör Noelia – ung kvinna får dödshjälp i Spanien efter tvist", "summary_original": "Fadern försökte stoppa beslutet i två år, ville att dottern skulle behandlas mot depression.", "link": "https://www.dagen.se/nyheter/i-dag-doer-noelia-ung-kvinna-far-doedshjaelp-i-spanien-efter-tvist/10272128", "date_display": "2026-03-26", "date_iso": "2026-03-26T14:33:58+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 153, "title": "Difficult to close one's eyes to the factual errors found in the Bible", "summary": "There are unscientific claims in the Bible that I cannot close my eyes to, writes Kent Johansson in a reply.", "title_original": "Svårt att blunda för de sakfel som finns i Bibeln", "summary_original": "Det finns ovetenskapliga påståenden i Bibeln som jag inte kan blunda för, skriver Kent Johansson i en replik.", "link": "https://www.dagen.se/debatt/svart-att-blunda-foer-de-sakfel-som-finns-i-bibeln/10268309", "date_display": "2026-03-26", "date_iso": "2026-03-26T14:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 154, "title": "Lundintoppers risks long prison terms", "summary": "It is about complicity for a long time, during several sub-moments and complicity in crimes against civilians where a great many civilians had their lives completely destroyed in the company's and the defendant's quest to make a profit, says prosecutor Henrik Attorps in the plea in the Stockholm district court on Thursday. He also demands that they both be detained in connection with the announcement of the verdict. Lundin and Schneiter, former chairman and CEO of Lundin Oil, respectively, are suspected of aiding and abetting gross violations of international law in southern Sudan from 1999 to 2003, when the Swedish company was active in the civil war-stricken country. People were displaced According to the indictment, they knew about and contributed to the fact that the military and militia loyal to the regime killed and displaced people in order to create conditions for the company's oil exploration in an area that had long been controlled by rebels. The offensives, which would, among other things, enable the construction of new roads, were carried out from 1999 to March 2003, according to the investigation. In connection with this, the military and militias were guilty of serious crimes against international law (war crimes). Civilians have, among other things, been subjected to airstrikes, fired upon from helicopters and hacked and shot to death by soldiers. Furthermore, homes and healthcare facilities were looted and burned down, according to the indictment. The prosecutors believe that the company leaders contributed by concluding agreements with and making demands on the regime, which meant that the military needed to create conditions for the company to operate in the areas. The demands, the prosecutors claim, were made with the knowledge that the warfare constituted a violation of international law. Questioning war crimes Both Ian Lundin and Alexander Schneiter deny crimes. The defense has, among other things, denied that the company and the regime had such a relationship as is alleged and questions that war crimes were committed in the way that the investigation has shown.  Attorps believes, however, that the defense's objections lack support in what was presented in court.  When we look at the evidence and the information of the defendants, the conclusion is that the prosecution is substantiated", "title_original": "Lundintoppar riskerar långa fängelsestraff", "summary_original": "Det rör sig om medverkan under lång tid, under flera delmoment och medverkan till brott mot civila där väldigt många civila fick sina liv helt förstörda i bolagets och de tilltalades strävan efter att göra vinst, säger åklagare Henrik Attorps i pläderingen i Stockholms tingsrätt på torsdagen. Han yrkar även att de båda ska häktas i samband med att domen meddelas. Lundin och Schneiter, tidigare styrelseordförande respektive vd i Lundin Oil, misstänks för medhjälp till grovt folkrättsbrott i södra Sudan 1999–2003, då det svenska bolaget var verksamt i det inbördeskrigsdrabbade landet. Människor fördrevs Enligt åtalet hade de vetskap om och bidrog till att militär och regimtrogen milis dödade och fördrev människor för att skapa förutsättningar åt bolagets oljeprospektering i ett område som sedan länge kontrollerades av rebeller. Offensiverna, som bland annat skulle möjliggöra byggen av nya vägar, kom att genomföras från 1999 till mars 2003, enligt utredningen. Militär och miliser gjorde sig i samband med det skyldiga till grova folkrättsbrott (krigsbrott). Civila ska bland annat ha utsatts för flyganfall, beskjutits från helikoptrar och huggits och skjutits ihjäl av soldater. Vidare blev bostäder och vårdinrättningar plundrade och nedbrända, enligt åtalet. Åklagarna menar att bolagstopparna bidrog genom att sluta avtal med och ställa krav på regimen, som innebar att militären behövde skapa förutsättningar för bolaget att verka i områdena. Kraven, hävdar åklagarna, ställdes med vetskap om att krigföringen utgjorde folkrättsbrott. Ifrågasätter krigsbrott Både Ian Lundin och Alexander Schneiter förnekar brott. Försvaret har bland annat förnekat att bolaget och regimen hade en sådan relation som påstås och ifrågasätter att det begåtts krigsbrott på det sätt som utredningen visat.  Attorps menar dock att försvarets invändningar saknar stöd i det som presenterats i rätten.  När vi tittar på bevisningen och på de tilltalades uppgifter, så är slutsatsen att åtalet är styrkt i dess helhet, säger han i. Rättegången har pågått sedan september 2023 och väntas avslutas i maj. Schibbye: Tror att alla blev förvånade En som bevakat Lundin oil länge är Martin Schibbye, chefredaktör för nättidskriften Blankspot. Han förväntade sig att åklagarsidan skulle yrka på långa straff. – De har lagt ribban väldigt högt sedan dag ett och pekat på att de åtalade känt till de här övergreppen och krigsbrotten, men på grund av sin iver att göra vinst på oljeutvinningen sett genom fingrarna och låtit den sudanesiska armén genomföra de här offensiva militära operationerna. Men en händelse var mindre väntad, säger Schibbye, var när åklagaren yrkade på häktning. – Jag tror att alla i salen blev förvånade när åklagaren yrkade på att de åtalade skulle häktas. Det gjorde han med motiveringen att de är schweiziska medborgare, har ekonomiska resurser, och att flyktfaran är väldigt stor. Men det ska poängteras att åklagaren vill att de häktas när domen faller, och det är i oktober-november.", "link": "https://www.tv4.se/artikel/tt-260326-lundinsudan1-5e5dbfed/lundin-och-schneiter-riskerar-langa-straff", "date_display": "2026-03-26", "date_iso": "2026-03-26T13:35:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott", "/brott", "/stockholms-tingsratt", "/inrikes", "/lundinrattegangen", "/kalla-fakta-lundinfallet"]}, {"id": 155, "title": "Now Sarah Mullally has been installed as Archbishop", "summary": "She will be the first woman to be elected supreme leader of the Church of England • \"A consequence of the gospel,\" says the Church of Sweden's archbishop Martin Modéus.", "title_original": "Nu har Sarah Mullally installerats som ärkebiskop", "summary_original": "Hon blir första kvinnan som väljs till högsta ledaren för Engelska kyrkan • ”En konsekvens av evangelium”, säger Svenska kyrkans ärkebiskop Martin Modéus.", "link": "https://www.dagen.se/nyheter/nu-har-sarah-mullally-installerats-som-aerkebiskop/10272030", "date_display": "2026-03-26", "date_iso": "2026-03-26T12:41:19+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 156, "title": "Putin's headache: \"A large and important source of income for Russia\"", "summary": "The war in the Middle East has driven the price of oil to record levels. Analysts have reckoned that Russia could benefit from it, especially when the US chose to ease oil sanctions against the country. But in the middle of all that, almost half of their oil exports are eliminated, writes the Reuters news agency. Two million barrels a day are lost.  Major damage to ports The stoppage is judged to be largely due to Ukraine's intensified strategy to attack Russian ports and oil refineries. The ports of Primorsk and Ust-Luga in the Gulf of Finland and Novorossiysk in the Black Sea have all suffered major damage in recent drone attacks. - These are targeted strategic attacks from the Ukrainian side against a large, important source of income for Russia, says Lieutenant Colonel Johan Huovinen. There are also stops in the Druzhba oil pipeline, which transports Russian oil via Ukraine to Hungary and Slovakia. The stop is controversial, Russia and Hungary accuse Ukraine, which in turn believes that the leadership was hit in Russian attacks.  In addition to the Ukrainian attacks on the export industry, Europe's concerted efforts against the Russian shadow fleet are also hitting hard. The boarding of false-flag oil tankers is believed to cost Russia 300,000 barrels of oil a day.  New markets The export freeze basically only affects oil to the west, and Russia is now forced to rely almost entirely on exports to Asia via China.  In addition, oil continues to be loaded from the port of Kozmino in eastern Russia and the island of Sakhalin, and there are many indications that Russia is also transporting oil to Belarusian refineries.  But those routes lack the capacity to cover the huge losses in the West.", "title_original": "Putins huvudvärk: ”En stor och viktig inkomstkälla för Ryssland”", "summary_original": "Kriget i Mellanöstern har drivit upp oljepriset till rekordnivåer. Analytiker har räknat med att Ryssland kan dra vinning av det, särskilt när USA valt att lätta på oljesanktionerna mot landet. Men mitt i allt det är alltså nästan hälften av deras oljeexport utslagen, skriver nyhetsbyrån Reuters. Två miljoner fat om dagen går förlorade.  Stora skador på hamnar Stoppet bedöms till största del bero på Ukrainas intensifierade strategi att slå mot ryska hamnar och oljeraffinaderier. Hamnarna Primorsk och Ust-Luga i Finska viken och Novorossijsk i Svarta havet har alla tagit stor skada i drönarattacker den senaste tiden. – Det är riktade strategiska attacker från ukrainsk sida mot en stor, viktig inkomstkälla för Ryssland, säger överstelöjtnant Johan Huovinen. Det är också stopp i oljerörledningen Druzjba som transporterar rysk olja via Ukraina till Ungern och Slovakien. Stoppet är omstritt, Ryssland och Ungern anklagar Ukraina som i sin tur menar att ledningen träffats i ryska attacker.  Utöver de ukrainska attackerna mot exportindustrin slår också Europas samlade insatser mot den ryska skuggflottan hårt. Bordningarna av falskflaggade oljetankrar tros kosta Ryssland 300 000 fat olja om dagen.  Nya marknader Exportstoppet påverkar i princip bara oljan västerut och Ryssland tvingas nu förlita sig nästan helt på exporten till Asien via Kina.  Dessutom lastas olja fortsatt från hamnen Kozmino i östra Ryssland och ön Sakhalin och mycket tyder på att Ryssland också transporterar olja till belarusiska raffinaderier.  Men de rutterna saknar kapacitet att täcka upp för de enorma förlusterna i väst.", "link": "https://www.tv4.se/artikel/3ro3OKwSLm3BbusCTlFIGO/putins-huvudvaerk-en-stor-och-viktig-inkomstkaella-foer-ryssland", "date_display": "2026-03-26", "date_iso": "2026-03-26T12:17:20+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/inrikes", "/ukrainakonflikten", "/ukraina", "/ryssland"]}, {"id": 157, "title": "Teachers rushed into the classroom - asking all students to take cover", "summary": "Teacher Malin Einervall was on site at the high school on Wednesday when a colleague rushes into the classroom during a lesson and says that they have to move because of an ongoing shooting. - We took our students and sought protection.  Through a crisis app, they saw that there was ongoing deadly violence. After two hours, the principal informed them that they could go outside. - The students are very upset, they are shocked. Many will be at home today, says Malin Einervall. Many students knew him According to information from TV4 Nyheterna, the teenager who was shot is connected to the secondary school in Tyresö and teacher Malin Einervall confirms that students at the school knew him. - It was a bit uncertain who it actually was, but it apparently landed in the fact that this is someone they know well, says Einervall and says that she had contact with several students last night, who then expressed concern. - I would describe it as fears. This very insecurity that in this place where we move every day a person gets shot, of course it creates enormous insecurity for the immediate environment we are in. Student: \"It's an anxious feeling\" The high school is open during the day and offers crisis support for both students and staff.  - It feels safe that there are people here, says student Lukas Moberg, who is on site at the school after being housed yesterday. - It felt a bit shady and a bit worried, he says and says that many of his friends have been very worried. - It's not fun, not fun at all, says nineteen-year-old Lukas Moberg.", "title_original": "Lärare rusade in i klassrummet – och bad alla elever att ta skydd", "summary_original": "Läraren Malin Einervall var på plats på gymnasieskolan under onsdagen när en kollega rusar in i klassrummet under en lektion och säger att de måste inrymma på grund av en pågående skjutning. – Vi tog våra elever och sökte skydd.  Via en krisapp såg de att det var pågående dödligt våld. Efter två timmar informerade rektorn om att de kunde gå ut. – Eleverna är väldigt upprörda, de är chockade. Många kommer vara hemma i dag, säger Malin Einervall. Många elever kände honom Den skjutna tonåringen har enligt uppgifter till TV4 Nyheterna koppling till gymnasieskolan i Tyresö och läraren Malin Einervall bekräftar att elever på skolan kände honom. – Det var lite osäkert vem det faktiskt var, men det landade tydligen i att det här är någon de känner väl, säger Einervall och berättar att hon hade kontakt med flera elever under gårkvällen, som då uttryckte oro. – Jag skulle beskriva det som rädslor. Just den här otryggheten att på det här stället som vi rör oss varje dag så blir en person skjuten, självklart skapar det en enorm otrygghet för den närmiljö som vi befinner oss i. Eleven: ”Det är en orolig känsla” Gymnasieskolan håller öppet under dagen och erbjuder krisstöd för både elever och personal.  – Det känns tryggt att det är folk här, säger eleven Lukas Moberg som är på plats på skolan efter att ha blivit inrymd under gårdagen. – Det kändes lite skumt och lite orolig känsla, säger han och berättar att många av hans kompisar varit väldigt oroliga. – Det är inte kul, inte kul alls, säger nittonåriga Lukas Moberg.", "link": "https://www.tv4.se/artikel/600uvCu9CbFrtb46ZnpCZS/laerare-rusade-in-i-klassrummet-och-bad-alla-elever-att-ta-skydd", "date_display": "2026-03-26", "date_iso": "2026-03-26T11:13:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/skjutningar-i-sverige", "/skjutningar-i-stockholm", "/skjutning"]}, {"id": 158, "title": "Convicted of raping a 100-year-old - acquitted in the Court of Appeal", "summary": "In December, a 38-year-old man, active in home care, was convicted of rape against a 100-year-old woman. The man was charged with two counts of rape. In the district court, he was acquitted of one of the cases because the investigation was not considered sufficient. In the second case, he was sentenced to four years in prison. Now the Court of Appeal has tried the case and acquits the man completely of the rape charges. \"The Court of Appeal also acquits the man of the case of rape that the District Court convicted him of. This is because the Court of Appeal considers that the evidence is not sufficient in that case either,\" the court writes in a press release. \"Difficult to understand each other\" The Court of Appeal notes that the main evidence in the case consists of information from videotaped police interviews with the two women. According to the Court of Appeal, it has been clear that the women and the interrogator often had difficulty understanding each other. The interrogations are described as lacking in detail, and information must have changed during the investigation.  Certain information must also be contradicted by another investigation. The Court of Appeal therefore considers that it is not beyond reasonable doubt that the man committed the crimes - which is required for a conviction.", "title_original": "Dömdes för våldtäkt mot 100-åring – frias i hovrätten", "summary_original": "I december dömdes en 38-årig man, verksam inom hemtjänsten, för våldtäkt mot en 100-årig kvinna. Mannen åtalades för två fall av våldtäkt. I tingsrätten frikändes han från ett av fallen eftersom utredningen inte ansågs tillräcklig. I det andra fallet dömdes han till fyra års fängelse. Nu har hovrätten prövat målet och friar mannen helt från våldtäktsanklagelserna. ”Hovrätten frikänner mannen även från det fall av våldtäkt som tingsrätten dömde honom för. Detta beror på att hovrätten anser att bevisningen inte heller i det fallet räcker till”, skriver domstolen i ett pressmeddelande. ”Svårt att förstå varandra” Hovrätten konstaterar i att den huvudsakliga bevisningen i målet består av uppgifter från videoinspelade polisförhör med de två kvinnorna. Enligt hovrätten har det varit tydligt att kvinnorna och förhörsledaren ofta haft svårt att förstå varandra. Förhören beskrivs som detaljfattiga, och uppgifter ska ha förändrats under utredningen.  Vissa uppgifter ska dessutom motsägas av annan utredning. Hovrätten bedömer därför att det inte är ställt utom rimligt tvivel att mannen har begått brotten – vilket krävs för en fällande dom.", "link": "https://www.tv4.se/artikel/7gNbiennNoTccGs4434DCV/doemdes-foer-valdtaekt-mot-100-aring-frias-i-hovraetten", "date_display": "2026-03-26", "date_iso": "2026-03-26T10:16:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/brott", "/hemtjanst"]}, {"id": 159, "title": "Josefin Lilja:\nIs the Jesus trend already over according to the Youth Barometer?", "summary": "Young people now prefer to describe themselves with words such as 'enjoyer of life', 'family lover' and 'exercising person'.", "title_original": "Josefin Lilja:\nÄr Jesustrenden redan över enligt Ungdomsbarometern?", "summary_original": "Unga helst väljer nu att beskriva sig själva med ord som 'livsnjutare', 'familjekär' och 'träningsmänniska'.", "link": "https://www.dagen.se/kultur/josefin-lilja-aer-jesustrenden-redan-oever-enligt-ungdomsbarometern/10271795", "date_display": "2026-03-26", "date_iso": "2026-03-26T10:08:09+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 160, "title": "Pastor sounds the alarm to the church leaders about porn abuse: 'Huge problem in the congregations'", "summary": "\"Tsunami of online pornography\", writes pastor Torbjörn Freij in an open letter to Swedish church leaders and bishops", "title_original": "Pastor slår larm till kyrkoledarna om porrmissbruk: 'Enormt problem i församlingarna'", "summary_original": "”Tsunami av nätpornografi”, skriver pastorn Torbjörn Freij i ett öppet brev till svenska kyrkoledare och biskopar", "link": "https://www.dagen.se/nyheter/pastor-slar-larm-till-kyrkoledarna-om-porrmissbruk-enormt-problem-i-foersamlingarna/10268091", "date_display": "2026-03-26", "date_iso": "2026-03-26T09:53:53+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 161, "title": "The friends from the church about Hugo: He loved people", "summary": "\"There was a depth to Hugo that he didn't really get to explore before his life was snuffed out.\"", "title_original": "Vännerna från kyrkan om Hugo: Han älskade människor", "summary_original": "”Det fanns ett djup i Hugo som han inte riktigt hann få utforska innan hans liv släcktes.”", "link": "https://www.dagen.se/nyheter/vaennerna-fran-kyrkan-om-hugo-han-aelskade-maenniskor/10271759", "date_display": "2026-03-26", "date_iso": "2026-03-26T09:20:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 162, "title": "Was forcibly placed for a year - now Lamine is allowed to come home", "summary": "After a year without their baby, the family was reunited on Tuesday. - His brother throws open the car door, rushes out of the car and runs in and roars: now Lamine is coming home. Everyone just breaks down with happiness, says Emelie. Lamine was taken into care when he was seven months old after paramedics discovered three fractures and bruises. The parents were suspected of child abuse and the social services in Linköping decided on compulsory care according to LVU. The legal council's statement The family has always denied any crime. On their own, they brought in outside doctors, researchers and experts who pointed to possible medical explanations for the injuries.  The Court of Appeal requested a statement from the National Board of Health and Welfare's Legal Council, which is involved in difficult medical assessments. This week the statement came. Unlike the pediatrician and the medical examiner who testified that the injuries \"strongly suggested abuse,\" the council writes that the medical explanations put forward cannot be disregarded. Signs of osteoporosis cannot be dismissed and there is data that suggests rickets in healing, which may mean an increased risk of fractures. The fractures may have occurred at the hospital. The council also points out that parts of Lamine's medical records are missing. According to the statement, it makes a full medical assessment impossible. In addition, it is considered that the fracture in the hand could reasonably have occurred during needle insertion, and it cannot be ruled out that the other fractures may have occurred in connection with X-rays. Mamma Emelie's lawyer describes the statement as very unusual. - I have never seen this. The legal council is very clear that it cannot be established that it is a matter of abuse and that the medical explanations that have been put forward cannot be dismissed, says lawyer Charlotta Skogsberg.  - This shows that the placement was wrong from the beginning and that the children's clinic cannot change its assessment, even though new information has come to light. \"There is no legal certainty\" Emelie says that the family is convinced that the outcome would have been the same", "title_original": "Tvångsplacerades i ett år – nu får Lamine komma hem", "summary_original": "Efter ett år utan sin bebis kunde familjen återförenas under tisdagen. – Hans bror slänger upp bildörren, rasar ur bilen och springer in och vrålar: nu ska Lamine komma hem. Alla bara bryter ihop av lycka, säger Emelie. Lamine omhändertogs när han var sju månader gammal efter att sjukvården upptäckt tre frakturer och blåmärken. Föräldrarna misstänktes för barnmisshandel och socialtjänsten i Linköping beslutade om tvångsvård enligt LVU. Rättsliga rådets utlåtande Familjen har hela tiden nekat till brott. På egen hand tog de in utomstående läkare, forskare och experter som pekade på möjliga medicinska förklaringar till skadorna.  Kammarrätten begärde in ett utlåtande från Socialstyrelsens Rättsliga råd, som kopplas in vid svåra medicinska bedömningar. I veckan kom utlåtandet. Till skillnad från barnläkaren och rättsläkaren som vittnade om att skadorna \"talade starkt för misshandel\" skriver rådet att de medicinska förklaringar som förts fram inte kan bortses från. Tecken på benskörhet kan inte avfärdas och det finns uppgifter som talar för rakit i läkning, vilket kan innebära ökad risk för frakturer. Frakturerna kan ha uppstått på sjukhuset Rådet pekar också på att delar av Lamines journaler saknas. Enligt utlåtandet omöjliggör det en fullständig medicinsk bedömning. Dessutom bedöms frakturen i handen rimligen kunna ha uppstått vid nålsättning, och det går inte att utesluta att de övriga frakturerna kan ha uppstått i samband  röntgen. Mamma Emelies advokat beskriver utlåtandet som mycket ovanligt. – Det här har jag aldrig sett. Rättsliga rådet är väldigt tydliga med att det inte går att fastställa att det handlar om misshandel och att de medicinska förklaringar som har förts fram inte kan avfärdas, säger advokaten Charlotta Skogsberg.  – Det här visar att placeringen var fel från början och att barnkliniken inte kan ändra sin bedömning, trots att nya uppgifter har kommit fram. ”Finns ingen rättssäkerhet” Emelie säger att familjen är övertygad om att utfallet hade blivit ett annat om de inte själva drivit frågan. – Jag är hundra procent övertygad om att vi inte hade haft honom här i dag annars. Och med det inser jag att det finns ingen rättssäkerhet, säger hon. Familjen har anmält sjukhuset till både Inspektionen för vård och omsorg (Ivo) och Justitieombudsmannen. Båda anmälningarna har lagts ned. Socialtjänsten: Litar på svensk sjukvård Socialtjänsten i Linköping säger att man saknar egen medicinsk expertis och förlitar sig på vårdens bedömningar. – Vi har ju ingen egen medicinsk expertis inom socialtjänsten utan när det behövs har vi kontakt med barnavårdscentralen, Rättsmedicinalverket eller barnkliniken. Det är den praxis som är för socialtjänsten, säger John Törnquist, enhetschef.  – Jag förlitar mig på den svenska sjukvården och den expertis som finns i det, säger han. ”Känner mig lättad” I går beslutade Socialnämnden i Linköping att häva LVU. Lamine fick komma hem. Pappa Idrissa beskriver känslan när sonen återvände. – Jag är glad, jag är jätteglad. Han är här, men jag kan fortfarande inte förstå det. Jag känner mig verkligen lättad, säger han. TV4 Nyheterna söker ansvariga på sjukhuset i Linköping. TV4 Nyheterna har också sökt den rättsläkare som vittnade mot familjen i ärendet. Lamine heter egentligen något annat. Vi väljer att inte visa hans ansikte på nytagna bilder för att skydda honom.", "link": "https://www.tv4.se/artikel/4zdqSgyzzra149qssEoM2W/tvangsplacerades-i-ett-ar-nu-far-lamine-komma-hem", "date_display": "2026-03-26", "date_iso": "2026-03-26T08:56:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/lvu-bebisen-lamine", "/linkoping", "/socialtjansten"]}, {"id": 163, "title": "The Supreme Court in Finland convicts politicians of incitement against ethnic groups", "summary": "Päivi Räsänen is convicted for a book with statements about homosexuals.", "title_original": "Högsta domstolen i Finland fäller politiker för hets mot folkgrupp", "summary_original": "Päivi Räsänen fälls för en skrift med uttalanden om homosexuella.", "link": "https://www.dagen.se/nyheter/hoegsta-domstolen-i-finland-faeller-politiker-foer-hets-mot-folkgrupp/10271671", "date_display": "2026-03-26", "date_iso": "2026-03-26T08:36:35+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 164, "title": "The car giants back off from previous promises: \"The world has changed\"", "summary": "It has been described as an inevitable and rapid revolution for the automotive industry.  According to most major brands, the major transition to electric cars would be completed by around 2035. But the demand for combustion engines remains high, and political winds in both Europe and especially the US have started to blow in a different direction. Donald Trump has scrapped tax breaks for those who buy electric cars, stopped investments in the expansion of charging stations and, like the EU, eased the emission requirements.  At least twelve global car manufacturers have chosen to scale back their electric car investments, a compilation from the Financial Times shows.  And the retreat is not free. According to calculations, canceled launches and scrapped investments have cost the car industry at least SEK 750 billion in the past year alone, the newspaper writes. \"The world has changed\" The luxury car brand Rolls-Royce, which is owned by BMW, planned that all new cars from the year 2030 should be electric. The first all-electric model was launched last year and more models are to be expected, but now the CEO says that it will continue to offer models with a gasoline-powered V12 engine in parallel.  And Rolls-Royce is far from alone in the turnaround.  Earlier this year, Honda announced it was abandoning plans to completely phase out gasoline engines by 2040, a move estimated to cost 160 billion over the next two years.  Giants such as Mercedes-Benz, Ford and Volvo Cars have also been forced to adjust their plans for an all-electric future.  \"Missing the sound of the engine\" The lack of interest in electric cars may be due to the lack of charging stations and general uncertainty about range or safety.  But when it comes to more sports-oriented brands, the resistance of customer bases is also about feeling. Volkswagen-owned Lamborghini is scrapping plans for the all-electric Lanzador model that was to be launched in 2030. The model will now be a hybrid instead. - The feeling of a Lamborghini is very much in the vibrations, how you steer and how braking feels, and one of the biggest reasons for the lack of interest", "title_original": "Biljättarna backar från tidigare löften: ”Världen har förändrats”", "summary_original": "Det har beskrivits som en oundviklig och snabb revolution för fordonsindustrin.  Den stora övergången till elbilar skulle enligt de flesta stora märken vara genomförd till runt år 2035. Men efterfrågan på förbränningsmotorer är fortsatt hög, och politiska vindar i både Europa och framför allt USA har börjat blåsa åt ett annat håll. Donald Trump har skrotat skattelättnader för dem som köper elbil, stoppat satsningar på utbyggnaden av laddstolpar och, likt EU, lättat på utsläppskraven.  Minst tolv globala biltillverkare har valt att skala ner sina elbilssatsningar, visar en sammanställning från Financial Times.  Och reträtten är inte gratis. Enligt beräkningar har inställda lanseringar och skrotade investeringar kostat bilindustrin minst 750 miljarder kronor bara det senaste året, skriver tidningen. ”Världen har förändrats” Lyxbilsmärket Rolls-Royce, som ägs av BMW, hade som plan att alla nya bilar från år 2030 ska vara eldrivna. Den första helelektriska modellen lanserades i fjol och fler modeller är att vänta men nu säger vd:n att man kommer att fortsätta att erbjuda modeller med bensindriven V12-motor parallellt.  Och Rolls-Royce är långt ifrån ensamma om vändningen.  Tidigare i år meddelade Honda att de överger planen på att helt fasa ut bensinmotorer till år 2040, en åtgärd som beräknas kosta 160 miljarder de kommande två åren.  Giganter som Mercedes-Benz, Ford och Volvo Cars har också tvingats justera sina planer på en helelektrisk framtid.  ”Saknar motorljudet” Ointresset för elbilar kan bero på avsaknad av laddstolpar och allmän osäkerhet kring räckvidd eller säkerhet.  Men när det kommer till mer sportorienterade märken handlar kundbasernas motstånd också om känsla. Volkswagen-ägda Lamborghini skrotar planer på den helelektriska modellen Lanzador som skulle lanserats 2030. Modellen blir nu i stället en hybrid. – Känslan i en Lamborghini ligger mycket i vibrationerna, hur man styr och hur inbromsningar känns, och en av de största anledningarna till ointresset för elbilar är att folk saknar motorljudet, säger företagets vd Stephan Winkelmann.  Ferrari brottas med samma problem. I fjol halverade sportbilstillverkaren sitt produktionsmål för elbilar men fortsätter att utveckla sin första helt elektriska modell med målet att den ska behålla känslan från sina bensindrivna modeller.", "link": "https://www.tv4.se/artikel/5LN3KkgAFToSOB8I5ZzWRk/biljaettarna-backar-fran-tidigare-loeften-vaerlden-har-foeraendrats", "date_display": "2026-03-26", "date_iso": "2026-03-26T07:27:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/trafik", "/elbilar", "/bilar"]}, {"id": 165, "title": "They say yes - and they get dumped: \"Can't understand\"", "summary": "In this year's edition of \"Love is blind\", there are unusually few couples left in the program when the wedding approaches - and fewer than before who finally say yes to each other. Daniel Fjäll, 43 and Johanna Storm, 38 bonded over the fact that they are both \"named like weather\", but the love journey was more stormy than cozy in a mountain cabin. Perhaps the last straw was when Daniel recorded Johanna without her knowledge, or when she overheard him talking about how he'd rather do the dirty work again than go through the experiment one more time.  The pair went their separate ways at the start of the penultimate episode. - I think this is the best for both of us. I have to put myself first and do what makes me feel good. Right now I don't feel good about the relationship and then I have to leave, says Johanna Storm. Believing a problem Ronja Eriksson, 36 and Lars-Erik Danielsson, 35 were united in missing a parent in the capsules. But already on the honeymoon, a shift in the mood was noticeable. Lars-Erik's deep Christian faith ultimately became too heavy a cross for the couple to bear.  At the beginning of the wedding episode, they decided not to take the relationship all the way to the altar. - I have landed in the fact that we only like each other as people, says Ronja Eriksson. - It does not give me the security to get married. So that's why I feel like there's no point in us dragging this out any more when we both know that love doesn't exist. Sing love song Sparks flew about Aniela Eklund, 30 and Ibrahim Kass Gergi, 33 in the capsules, especially when Aniela performed a self-written song for the man of her dreams. The couple's biggest – and apparently only – problem has been that Ibrahim lives and works in Jönköping while Aniela is based in Stockholm.  At the altar, the couple said yes, after Aniela once again sang the love song she had written for Ibrahim. - It's crazy that I'm getting married today. It feels absolutely incredible. I never thought I would come here, says Ibrahim Kass Gergi. - God, I am so very happy, says Aniela Eklund. Doubts too big When Angelica", "title_original": "De säger ja – och de blir dumpade: ”Kan inte förstå”", "summary_original": "I årets upplaga av ”Love is blind” är det ovanligt få par kvar i programmet när bröllopen närmar sig – och färre än tidigare som slutligen säger ja till varandra. Daniel Fjäll, 43 och Johanna Storm, 38 bondade över det faktum att de båda ”heter som väder” men kärleksresan blev mer stormig än fjällstugemysig. Droppen blev kanske när Daniel spelade in Johanna utan hennes vetskap, eller när hon råkade höra honom prata om att han hellre gjort lumpen igen än genomgått experimentet en gång till.  Paret gick skilda vägar i början av det näst sista avsnittet. – Jag tror att det här är det bästa för oss båda. Jag måste sätta mig själv först och göra det som jag mår bra av. Just nu mår jag inte bra av relationen och då måste jag gå, säger Johanna Storm. Tron ett problem Ronja Eriksson, 36 och Lars-Erik Danielsson, 35 förenades i saknaden efter en förälder i kapslarna. Men redan på smekmånaden märktes en skiftning i stämningen. Lars-Eriks djupt kristna tro blev till slut ett för tungt kors att bära för paret.  I början av bröllopsavsnittet bestämde de sig för att inte ta relationen vidare ända till altaret. – Jag har landat i att vi bara tycker om varandra som människor, säger Ronja Eriksson. – Det ger inte mig tryggheten att gifta sig. Så därför känner jag att det inte är någon idé att vi drar ut på det här mer när vi båda vet att den kärleken finns inte. Sjöng kärlekslåt Det slog gnistor om Aniela Eklund, 30 och Ibrahim Kass Gergi, 33 i kapslarna, särskilt när Aniela framförde en egenskriven låt till sina drömmars man. Parets största – och vad det verkar enda – problem har varit att Ibrahim bor och arbetar i Jönköping medan Aniela är baserad i Stockholm.  Vid altaret sade paret ja, efter att Aniela än en gång sjungit kärlekslåten hon skrivit till Ibrahim. – Det är galet att jag ska gifta mig i dag. Det känns helt otroligt. Jag trodde aldrig att jag skulle komma hit, säger Ibrahim Kass Gergi. – Gud, jag är så himla lycklig, säger Aniela Eklund. Tvivlen för stora När Angelica Karlsson, 30 såg Aron Walker, 36 i verkligheten för första gången fick hon en stark fysisk reaktion – något som liknade en panikattack och även visades i programmet. Paret har haft sina meningsskiljaktigheter, men även uttryckt att de älskar varandra. Aron godkändes av Angelicas vänner, där Samir Badran visade sig vara en i kompisgänget.  I slutändan blev dock tvivlen för stora för Angelica, som strax före bröllopsceremonin förklarade att hon inte kände sig redo att gifta sig, något Aron tog mycket hårt. – Jag känner mig som en hemsk människa och det känns som jag sviker, säger Angelica Karlsson. – Jag kan inte förstå hur du kan säga att du är kär men inte vill vara med mig, säger Aron Walker. Nu återstår återträffsavsnittet, där paren ska berätta hur de har gått vidare med sina liv efter kärleksexperimentet. Netflix har ännu inte gått ut med vilket datum det kommer att finnas tillgängligt att titta på.", "link": "https://www.tv4.se/artikel/tt-260326-loveisblind1-7471150f/de-sager-ja-i-love-is-blind", "date_display": "2026-03-26", "date_iso": "2026-03-26T07:00:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Stockholm", "/stockholm", "/storbritannien", "/tyskland", "/sverige", "/netflix", "/konst", "/jonkoping", "/brasilien", "/japan", "/kultur"]}, {"id": 166, "title": "Duplantis sets a new world record in the pole vault", "summary": "Armand Duplantis has broken another world record in the pole vault and is consolidating his position as one of the most successful athletes in Swedish sports history. \n The post Duplantis sets a new world record in the pole vault appeared first on ABC Nyheter.", "title_original": "Duplantis sätter nytt världsrekord i stavhopp", "summary_original": "Armand Duplantis har slagit ytterligare ett världsrekord i stavhopp och befäster sin position som en av de mest framgångsrika atleterna i svensk idrottshistoria. \n The post  Duplantis sätter nytt världsrekord i stavhopp  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/duplantis-satter-nytt-varldsrekord-i-stavhopp/", "date_display": "2026-03-26", "date_iso": "2026-03-26T07:00:00+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "Duplantis", "friidrott", "friidrotts-VM", "idrottsprofil", "stavhopp", "Sverige", "världsrekord"]}, {"id": 167, "title": "That's how much confidence the voters have in Mohamsson after the SD announcement", "summary": "The talked-about hug and the Liberals' swing in their view of cooperation with the Sweden Democrats have affected the image of Mohamsson. In the survey, her trust figure increases from 4 to 8 percent compared to last month. At the same time, the percentage who state that they lack confidence in the Liberals' party leader is also increasing. The percentage of voters who have a lot or rather little trust in Simona Mohamsson (L) rises by 6 percentage points, from 58 to 64 percent. Several party leaders increase The Center Party's Elisabeth Thand Ringqvist also notes a clear increase. She increases by 3 percentage points, from 6 to 9 percent. \nMagdalena Andersson (S) continues to have the highest confidence in the survey, but Prime Minister Ulf Kristersson (M) is nibbling into the top. - I don't think that anyone is more reliable than the other, but then I do think that there are some that you agree with more and they talk more sensibly, says Hulda Asp from Luleå.  The situation is described as even. The survey also captures a picture of an even level of trust between the party leaders, according to voters that TV4 spoke to. - Steady fog, some profile themselves, maybe not positively, but it's a steady fog. It's a bit of a crisis. It shows, says voter Roger Ekerlin.  He also says that the Liberals' change of course is surprising. - I have never had confidence in the Liberals, so for me it doesn't matter. However, I am surprised at how they act. They have been so determined against SD and now a swing, so if I were a Liberal I would have been questioning, says Roger Ekerlin.", "title_original": "Så stort förtroende har väljarna för Mohamsson efter SD-beskedet", "summary_original": "Den omtalade kramen och Liberalernas svängning i synen på samarbete med Sverigedemokraterna har påverkat bilden av Mohamsson. I mätningen ökar hennes förtroendesiffra från 4 till 8 procent jämfört med förra månaden. Samtidigt ökar också andelen som uppger att de saknar förtroende för Liberalernas partiledare. Andelen väljare som har mycket eller ganska litet förtroende för Simona Mohamsson (L) stiger med 6 procentenheter, från 58 till 64 procent. Flera partiledare ökar Även Centerpartiets Elisabeth Thand Ringqvist noterar en tydlig uppgång. Hon ökar med 3 procentenheter, från 6 till 9 procent. \nMagdalena Andersson (S) har fortsatt högst förtroende i mätningen, men statsminister Ulf Kristersson (M) knaprar in i toppen. – Jag tycker väl inte att någon är mer pålitligt än den andra, men sen tycker jag väl att det är vissa som man håller med mer och de pratar mer vettigt typ, säger Hulda Asp från Luleå.  Läget beskrivs som jämnt Mätningen fångar också en bild av ett jämnt förtroendeläge mellan partiledarna, enligt väljare som TV4 talat med. – Jämt töcken, vissa profilerar sig, kanske inte positivt, men det är ett jämt töcken. Det är lite kristider. Det märks, säger väljaren Roger Ekerlin.  Han säger också att Liberalernas kursändring förvånar. – Jag har aldrig haft förtroende för Liberalerna så för mig spelar det ingen roll. Men däremot är jag förvånad över hur de agera. De har ju varit så bestämda mot SD och nu en svängning, så vore jag Liberal så hade jag varit frågande, säger Roger Ekerlin.", "link": "https://www.tv4.se/artikel/2G0fWLMOMjsVqhRLwmvD5C/sa-stort-foertroende-har-vaeljarna-foer-mohamsson-efter-sd-beskedet", "date_display": "2026-03-26", "date_iso": "2026-03-26T05:21:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/politik", "/simona-mohamsson", "/valjaropinion", "/tv4-valjaropinion", "/valjarundersokning", "/novus"]}, {"id": 168, "title": "Recipe of the week: Uncomplicated fika favorite kladdkaka", "summary": "Elin Elg shares the recipe of the recipes - 'Gets comments like: \"Wow - the best cake I've ever tasted!\"", "title_original": "Veckans recept: Okomplicerade fikafavoriten kladdkaka", "summary_original": "Elin Elg delar med sig av recepternas recept - 'Får kommentarer som: ”Wow –bästa kladdkakan jag smakat!”", "link": "https://www.dagen.se/mat/veckans-recept-okomplicerade-fikafavoriten-kladdkaka/10263484", "date_display": "2026-03-26", "date_iso": "2026-03-26T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 169, "title":
