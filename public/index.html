s Löws fick Paul Belosics den kända halsduken av en svensk kvinna han träffade under pandemin 2020. – Han har varit väldigt stolt över halsduken just för att den är från den här staden i Sverige, säger Mattias Löw. Trots Belosics död fortsätter arbetet med dokumentären, där telefonsamtal och intervjuer med honom kommer att användas. – Vi försöker bildsätta det vi har  och vi kommer jobba strukturellt med att bygga en historia kring hela den här märkliga historien som är mer eller mindre omöjlig att föreställa. Och med tanke på allt som har skett så skulle jag inte bli förvånad om när filmen har premiär så dyker Paul Belosic upp på premiären, säger Mattias Löw. Mattias Löw vill också ge en bredare bild av Paul Belosic. Enligt vänner och bekanta beskrivs han som lojal och vänlig, trots sin inblandning i upploppen.", "link": "https://www.tv4.se/artikel/4FShxjGpfbJLq3c3BCva3V/uppgifter-skellefteamannen-aer-doed", "date_display": "2026-07-28", "date_iso": "2026-07-28T19:22:27+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/skelleftea", "/donald-trump", "/usa"]}, {"id": 132, "title": "Trump snubbed a private meeting with Netanyahu", "summary": "Israeli Prime Minister Benjamin Netanyahu did not get a face-to-face conversation with Donald Trump. The meeting between the two leaders at the White House on Tuesday was a crowded affair. Vice President JD Vance, Secretary of State Marco Rubio and several advisers were in attendance.", "title_original": "Trump nobbade enskilt möte med Netanyahu", "summary_original": "Israels premiärminister Benjamin Netanyahu fick inte något samtal mellan fyra ögon med Donald Trump. De bägge ledarnas möte i Vita huset på tisdagen blev en tätt befolkad affär. Vicepresident JD Vance, utrikesminister Marco Rubio och flera rådgivare var på plats.", "link": "https://www.dn.se/varlden/trump-nobbade-enskilt-mote-med-netanyahu/", "date_display": "2026-07-28", "date_iso": "2026-07-28T19:08:36+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 133, "title": "July 28: Don't miss today's news", "summary": "Russia and China share military knowledge, a powerful earthquake has shaken Japan and Pride kicks off in Stockholm – here's the news you can't miss from the day.", "title_original": "28 juli: Missa inte dagens nyheter", "summary_original": "Ryssland och Kina delar militärkunskaper med varandra, en kraftig jordbävning har skakat om Japan och Pride startar i Stockholm – här är nyheterna som du inte får missa från dagen.", "link": "https://www.dn.se/varlden/28-juli-missa-inte-dagens-nyheter/", "date_display": "2026-07-28", "date_iso": "2026-07-28T19:00:10+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Brussels sends fire planes and emergency aid - but opens up to more emissions", "summary": "Brussels is sending firefighting aircraft and emergency aid to the fires in Spain and France. At the same time, criticism is growing against the EU loosening its own climate policy. Some believe that it only adds fuel to the fires you are trying to put out.", "title_original": "Bryssel skickar brandflyg och nödhjälp – men öppnar för mer utsläpp", "summary_original": "Bryssel skickar brandbekämpningsflyg och nödhjälp till bränderna i Spanien och Frankrike. Samtidigt växer kritiken mot att EU luckrar upp sin egen klimatpolitik. Vissa menar att det bara ger nytt bränsle till de bränder man försöker släcka.", "link": "https://www.dn.se/varlden/bryssel-skickar-brandflyg-och-nodhjalp-men-oppnar-for-mer-utslapp/", "date_display": "2026-07-28", "date_iso": "2026-07-28T18:17:53+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "Peacock on the run from Skansen - doesn't want to come home", "summary": "It was staff at the Technical Museum who first discovered the peacock and contacted Skansen. Several attempts have been made to capture her, but without success. Among other things, the peacock has jumped onto the roof of the museum, far out of reach of the animal keepers. - They are free-roaming in our area and it is very easy to get out through the gates at the same time as the guests go out or through the car gate or something like that. It happens that they have wandered off from time to time, but never this far, says Henrietta Seward, head of wildlife Skansen. Skeptical of the animal keepers Skansen's staff now visit the Technical Museum twice a day to feed the peacock and try to regain her trust. However, after several failed capture attempts, she is skeptical of the animal keepers. - Now we don't do anything, we just go there and try to get her to like us again so we can get hold of her, says Henrietta Seward. Sunniva Ellingsen, animal keeper at Skansen, says that they try to attract the peacock with food and the bell that is usually used for feeding at Skansen. The purpose is to remind of the usual food signal and create security.  - We go out every evening and rattle a little and give her some food, to show that we are giving food and not trying to catch her right now, says Sunniva Ellingsen. \"Not really keen on coming home\" Despite the routine, the peacock doesn't seem particularly interested in returning to Skansen. - She doesn't seem very keen on coming home, at least right now, but she probably gets quite well with food and love here, says Sunniva Ellingsen. Skansen hopes to lure the bird home in peace and quiet, until then she must remain at the museum.  Skansen doesn't want anyone else trying to catch her on their own.", "title_original": "Påfågel på rymmen från Skansen – vill inte komma hem", "summary_original": "Det var personal på Tekniska museet som först upptäckte påfågeln och kontaktade Skansen. Flera försök har gjorts att fånga in henne, men utan framgång. Påfågeln har bland annat hoppat upp på museets tak, långt utom räckhåll för djurvårdarna. – De är ju frigående på vårt område och det är väldigt lätt att ta sig ut genom grindarna samtidigt som gästerna går ut eller genom bilporten eller sådär. Det händer att de har strövat iväg då och då, men aldrig såhär långt, säger Henrietta Seward, enhetschef vilda djur Skansen. Skeptisk till djurvårdarna Skansens personal besöker nu Tekniska museet två gånger om dagen för att mata påfågeln och försöka återfå hennes förtroende. Efter flera misslyckade infångningsförsök är hon dock skeptisk till djurvårdarna. – Nu gör vi ingenting utan vi åker bara dit och försöker få henne att tycka om oss igen så att vi kan få tag på henne, säger Henrietta Seward. Sunniva Ellingsen, djurvårdare på Skansen, berättar att de försöker locka påfågeln med mat och den bjällra som brukar användas vid matning på Skansen. Syftet är att påminna om den vanliga matsignalen och skapa trygghet.  – Vi åker ut varje kväll och skramlar lite och ger henne lite mat, för att visa att vi ger mat och inte försöker fånga henne just nu, säger Sunniva Ellingsen. ”Inte jättetaggad på att komma hem” Trots rutinen verkar påfågeln inte särskilt intresserad av att återvända till Skansen. – Hon verkar inte jättetaggad på att komma hem, i alla fall just nu, utan hon får nog ganska bra med mat och kärlek här, säger Sunniva Ellingsen. Skansen hoppas kunna locka hem fågeln i lugn och ro, tills dess får hon stanna kvar vid museet.  Skansen vill inte att någon annan försöker fånga henne på egen hand.", "link": "https://www.tv4.se/artikel/AFSkrVyb8IBgpqSw9IOhI/pafagel-pa-rymmen-fran-skansen-vill-inte-komma-hem", "date_display": "2026-07-28", "date_iso": "2026-07-28T18:17:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/djur", "/skansen"]}, {"id": 136, "title": "Blood Rot, part 39 of 57", "summary": "Read previous episodes here", "title_original": "Blodröta, del 39 av 57", "summary_original": "Läs tidigare avsnitt här", "link": "https://www.dn.se/kultur/blodrota-del-39-av-57/", "date_display": "2026-07-28", "date_iso": "2026-07-28T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 137, "title": "DN Debate. \"The parties play a double game on wind power - say yes but vote no\"", "summary": "DN DEBATE. The parties say yes to wind power nationally but stop it at the local level. If the climate transition is to succeed, they must take greater responsibility for the expansion - also in municipal politics. It becomes especially important now that the government has said no to 84 percent of the offshore wind power applications, writes Filip Johnsson, professor of energy systems.", "title_original": "DN Debatt. ”Partierna dubbelspelar om vindkraft – säger ja men röstar nej”", "summary_original": "DN DEBATT. Partierna säger ja till vindkraft nationellt men stoppar den på lokal nivå. Ska klimatomställningen lyckas måste de ta ett större ansvar för utbyggnaden – även i kommunpolitiken. Det blir extra viktigt nu när regeringen har sagt nej till 84 procent av de havsbaserade vindkraftsansökningarna, skriver Filip Johnsson, professor i energisystem.", "link": "https://www.dn.se/debatt/partierna-dubbelspelar-om-vindkraft-sager-ja-men-rostar-nej/", "date_display": "2026-07-28", "date_iso": "2026-07-28T18:00:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 138, "title": "Volvo's Swedish guerilla – that's how good the EX60 is", "summary": "Here is the car with which Volvo stands and falls. When Geely wants to centralize more and more development, the EX60 is a guerilla action from Gothenburg - developed and built in Sweden. DN's Jonas Fröberg long drives it to the pine heaths of Västerbothnia. Does the car measure up - and is Sweden still good as a car-building nation?", "title_original": "Volvos svenska gerilla – så bra är EX60", "summary_original": "Här är bilen som Volvo står och faller med. När Geely vill samla allt mer utveckling centralt är EX60 en gerillaaktion från Göteborg – utvecklad och byggd i Sverige. DN:s Jonas Fröberg långkör den till de västerbottniska tallhedarna. Håller bilen måttet – och duger Sverige fortfarande som bilbyggarnation?", "link": "https://www.dn.se/motor/volvos-svenska-gerilla-sa-bra-ar-ex60/", "date_display": "2026-07-28", "date_iso": "2026-07-28T17:32:27+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 139, "title": "Elias Rosell: When SDers drive electric cars, climate change has won", "summary": "Running costs for a petrol car are now lower than for an electric car charged from a public station. It should be the other way around.", "title_original": "Elias Rosell: När SD:are kör elbil har klimatomställningen vunnit", "summary_original": "Driftskostnaderna för en bensinbil är nu lägre än för en elbil som laddas från en allmän station. Det borde vara tvärtom.", "link": "https://www.dn.se/ledare/elias-rosell-nar-sdare-kor-elbil-har-klimatomstallningen-vunnit/", "date_display": "2026-07-28", "date_iso": "2026-07-28T17:32:01+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 140, "title": "Major criticism of Infantino's plan: \"Nuclear bomb\"", "summary": "Uefa rages • Millions into Infantino's own pocket", "title_original": "Stor kritik mot Infantinos plan: ”Atombomb”", "summary_original": "Uefa rasar • Miljoner in i Infantinos egen ficka", "link": "https://www.tv4.se/artikel/2p4dSY85bcmsptopbN9nOm/fifa-vill-saelja-vm-atombomb", "date_display": "2026-07-28", "date_iso": "2026-07-28T16:32:08+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport", "/sport"]}, {"id": 141, "title": "The expert: How to protect the house in the event of a forest fire", "summary": "There is a high or very high risk of forest fires in parts of Götaland and Svealand. According to SMHI, fires can quickly arise through, for example, ignition, lightning strikes or sparks from machinery.  There are decisive measures that villa and cottage owners can take to reduce the risk of a forest fire reaching the home, says forest fire researcher Anders Granström.  - How it looks around a house or summer cottage is absolutely decisive for whether it will survive or not.  Common mistakes According to Anders Granström, small changes on the site can make a big difference if a fire approaches. The most important thing is to keep the lawn cut short and well watered.  - Then it is completely non-combustible, he says.  He also warns against storing firewood next to house walls. Another piece of advice is to keep gutters and roofs free of leaves, needles and other dry material.  - When there is a fire, hot gases and smoke rise upwards. With it comes burning flakes that can be dragged tens, sometimes hundreds of meters, he says and continues.  - If the spark lands in a gutter with a lot of combustible material, it ignites immediately and can then find its way under the eaves.  The warning: Flammable hedges Which plants and trees are in the garden can also be important.  - Deciduous trees are generally less flammable than conifers and can act as a barrier against the fire, says Anders Granström.  In connection with the large fires in Southern Europe, Anders Granström raises the risk of certain types of hedges.  - I have seen several pictures of hedges burning in residential areas and cities.  It is mainly about dense conifer hedges that are often used as privacy protection or demarcation between plots.  - They are flammable and are absolutely not the right material in gardens if you want to reduce the risk of fire. It will be like a stubby wire for the spread of the fire, says Anders Granström.", "title_original": "Experten: Så skyddar du huset vid skogsbrand", "summary_original": "Det råder stor eller mycket stor risk för skogsbränder i delar av Götaland och Svealand. Enligt SMHI kan bränder snabbt uppstå genom exempelvis eldning, blixtnedslag eller gnistor från maskiner.  Med det finns avgörande åtgärder som villa- och stugägare kan vidta för att minska risken att en skogsbrand når bostaden, menar skogsbrandsforskaren Anders Granström.  – Hur det ser ut kring ett hus eller sommarstuga är helt avgörande för om den kommer klara sig eller inte.  Vanliga missarna Enligt Anders Granström kan små förändringar på tomten göra stor skillnad om en brand närmar sig. Det viktigaste är att hålla gräsmattan kortklippt och välvattnad.  – Då är den totalt obrännbar, säger han.  Han varnar samtidigt för att förvara ved intill husväggar. Ett annat råd är att hålla hängrännor och tak fria från löv, barr och annat torrt material.  – När det brinner stiger heta gaser och rök uppåt. Med det följer brinnande flagor som kan dras iväg tiotals, ibland hundratals meter, säger han och fortsätter.  – Landar gnistan i en hängränna med mycket brännbart material så tänder det omedelbart och kan sedan leta sig in under takfoten.  Varningen: Brandfarliga häckar  Vilka växter och träd som finns i trädgården kan också ha betydelse.  – Lövträd är generellt mindre brännbara än barrträd och kan fungera som en spärr mot elden, säger Anders Granström.  I samband med de stora bränderna i Sydeuropa lyfter Anders Granström risken med vissa typer av häckar.  – Jag har sett flera bilder på häckar som brinner i villaområden och städer.  Det handlar framför allt om täta barrhäckar som ofta används som insynsskydd eller avgränsning mellan tomter.  – De är eldfängda och är absolut inte rätt material i trädgårdar om man vill minska brandrisken. Det blir som en stubintråd för spridning av elden , säger Anders Granström.", "link": "https://www.tv4.se/artikel/2MrwBljAKPgmbYyeaJ7vTl/experten-sa-skyddar-du-huset-vid-skogsbrand", "date_display": "2026-07-28", "date_iso": "2026-07-28T15:30:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/skogsbrand", "/skogsbrander", "/smhi"]}, {"id": 142, "title": "228 reports have been received against Allsång at Skansen", "summary": "In reports to the Review Board, viewers rage over political messages in the SVT program.", "title_original": "228 anmälningar har inkommit mot Allsång på Skansen", "summary_original": "I anmälningar till Granskningsnämnden rasar tittare över politiska budskap i SVT-programmet.", "link": "https://www.dagen.se/nyheter/228-anmaelningar-har-inkommit-mot-allsang-pa-skansen/10455871", "date_display": "2026-07-28", "date_iso": "2026-07-28T14:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "The high summer heat is coming back – for a quick visit", "summary": "After a period of cooler temperatures and unsettled weather, it looks like there will be a clear change in weather. Already during Wednesday, a warm front begins to approach and pulls in over southern Sweden.  In Skåne, eastern Småland and up towards eastern Svealand, it can locally be up to 25 degrees.  - It is a little sunnier on the east coast. Because it blows from the west, we have the most clouds in the inner and western parts of Götaland, says TV4's meteorologist Peter Kondrup.  Stable weather is expected in northern Sweden on Wednesday. In the far north it will be 10-15 degrees, but in southern Norrland and along the coast of Norrland the temperature can reach 20 degrees.  \"Around 30 degrees\" On Thursday, the heat will start properly. In the southern parts of the country it will be sunny with temperatures of 25-30 degrees and it looks like it will be warmest in inner Götaland. - In several places there can be temperatures around 30 degrees, and maybe upwards of 32, says Peter Kondrup.  At the same time, a low pressure pulls in from the Norwegian Sea. It brings rain and about 15 degrees over the mountains and in the inner parts of Norrland.  During Friday, the cold front passes the whole country and showers and cooler temperatures are expected.  The weekend then offers temperatures around 20 degrees in large parts of the country, with sunniest weather in the southern half. In the mountains and in southern Norrland there may be some showers and the temperature looks set to fall between 10 and 15 degrees.", "title_original": "Högsommarvärmen kommer tillbaka – för en blixtvisit", "summary_original": "Efter en period med svalare temperaturer och ostadigt väder ser det ut att bli ett tydligt väderskifte. Redan under onsdagen börjar en varmfront närma sig och drar in över södra Sverige.  I Skåne, östra Småland och upp mot östra Svealand kan det lokalt bli upp emot 25 grader.  – Det är lite soligare vid ostkusten. Eftersom det blåser västerifrån så har vi mest moln i de inre och västra delarna av Götaland, säger TV4:s meteorolog Peter Kondrup.  I norra Sverige väntas stabilt väder under onsdagen. Allra längst norrut blir det 10-15 grader, men i södra Norrland och längs Norrlandskusten kan temperaturen nå 20 grader.  \"Runt 30 grader\" På torsdagen kommer värmen igång ordentligt. I södra delarna av landet blir det soligt med temperaturer på 25-30 grader och varmast ser det ut att bli i inre Götaland. – Där kan det på flera håll bli temperaturer runt 30 grader, och kanske uppåt 32, säger Peter Kondrup.  Samtidigt drar ett lågtryck in från Norska havet. Det ger regn och omkring 15 grader över fjällen och i de inre delarna av Norrland.  Under fredagen passerar kallfronten hela landet och det väntas skurar och svalare temperaturer.  Helgen bjuder sedan på temperaturer omkring 20 grader i stora delar av landet, med soligast väder i södra halvan. I fjällen och i södra Norrland kan det komma en del skurar och temperaturen ser ut att hamna mellan 10 och 15 grader.", "link": "https://www.tv4.se/artikel/1DCt3Fy3SW5YSygAl2f5iK/hoegsommarvaermen-kommer-tillbaka-foer-en-blixtvisit", "date_display": "2026-07-28", "date_iso": "2026-07-28T13:47:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Vädret", "/vadret", "/sommarvader", "/sol", "/varme", "/inrikes"]}, {"id": 144, "title": "Five dead babies found in France", "summary": "The remains of five infants have reportedly been found in a home in Vaucluse in southern France, French media reports. The home belongs to a couple who live in the municipality of Orange.  The woman, who is in her 30s, is said to have given birth to her third child on Monday evening. She is said to have denied her pregnancy and sought treatment for abdominal pain.  At the same time, her husband is said to have gone through boxes in the home after a conflict over the contents. Then he must have found a rotting body.  Fetuses were found in boxes. The man is said to have then taken the body to the hospital, after which the police were notified. During a search of the couple's home, more rotten fetuses were reportedly found, placed in plastic bags in cardboard boxes.  It has not yet been determined who the children belong to or when the deaths occurred.  The couple already has two children, who are eight and twelve years old respectively. In all pregnancies, the woman must have hidden and denied her pregnancies, writes Le Parisien.  The man works while the woman is a housewife. Both are unpunished from before.  The woman is still being treated in hospital and has not been arrested. Forensic investigations are underway to clarify what has happened Previous cases France has previously been hit by cases where babies were found dead.  In February, a 50-year-old woman was arrested after two babies were found in her house in eastern France. She was later sentenced to 25 years in prison.  In 2015, Dominique Cottrez was also convicted of killing her eight newborn children by suffocation. The sentence was nine years in prison. Among other things, the court took into account that she had mental problems. Among other things, she had hidden the pregnancies from her husband.", "title_original": "Fem döda spädbarn hittade i Frankrike", "summary_original": "Kvarlevor efter fem spädbarn ska ha hittats i ett hem i Vaucluse i södra Frankrike, rapporterar franska medier. Bostaden tillhör ett par som bor i kommunen Orange.  Kvinnan, som är i 30-årsåldern, ska ha fött sitt tredje barn under måndagskvällen. Hon uppges ha förnekat sin graviditet och sökt vård för buksmärtor.  Samtidigt ska hennes man ha gått igenom lådor i hemmet efter en konflikt om innehållet. Då ska han ha hittat en förruttnad kropp.  Foster hittades i kartonger Mannen ska därefter ha tagit med kroppen till sjukhuset, varpå polisen underrättades. Vid en husrannsakan i parets hem ska fler ruttnade foster ha hittats, placerade i plastpåsar i kartonger.  Det är ännu inte fastställt vem barnen tillhör eller när dödsfallen inträffade.  Paret har sedan tidigare två barn, som är åtta respektive tolv år gamla. Vid samtliga graviditeter ska kvinnan ha dolt och förnekat sina graviditeter, skriver Le Parisien.  Mannen arbetar medan kvinnan är hemmafru. Båda är ostraffade sedan tidigare.  Kvinnan vårdas fortfarande på sjukhus och har inte gripits. Rättsmedicinska undersökningar pågår för att klarlägga vad som har hänt  Tidigare fall Frankrike har tidigare drabbats av fall där spädbarn hittats döda.  I februari greps en 50-årig kvinna efter att två spädbarn hittats i hennes hus i östra Frankrike. Hon dömdes senare till 25 års fängelse.  År 2015 dömdes även Dominique Cottrez för att ha dödat sina åtta nyfödda barn genom kvävning. Straffet blev nio års fängelse. Domstolen tog bland annat hänsyn till att hon hade psykiska problem. Hon hade bland annat dolt graviditeterna för sin man.", "link": "https://www.tv4.se/artikel/55fz6KqsSzZ6N1FUSvq1SU/fem-doeda-spaedbarn-hittade-i-frankrike", "date_display": "2026-07-28", "date_iso": "2026-07-28T12:09:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/forlossning", "/barn", "/gravididet"]}, {"id": 145, "title": "Here the earthquake hits Japan", "summary": "The earthquake with a magnitude of 6.8 occurred in the afternoon local time at a depth of ten kilometers on the island of Kyushu in southern Japan. NHK reports that the roof of a shopping mall has collapsed in the city of Kumamoto. Witnesses at the scene say they heard an explosion and saw smoke rising from the mall.  According to the rescue service, the second floor must have collapsed and many people must be trapped in the construction, writes NHK. Several injured AFP writes that twelve buildings have collapsed and that at least 50 people have been taken to hospital.  An issued tsunami warning could be lifted after less than two hours. The Japanese airline ANA has canceled flights in the area, which also houses large factories for companies such as Sony and chip maker TSMC. According to Japanese authorities, nuclear power plants located in the affected region have so far not reported any anomalies.  \"We have to count the dead\" The earthquake was measured on the country's own Shindo scale at the highest possible level. According to the country's meteorological authority JMA, during tremors of that intensity, it is impossible to stand up, reports Bloomberg. Japan is hit by thousands of earthquakes every year. Björn Lund, senior lecturer in seismology at Uppsala University, believes that this causes extra devastation when it occurs on land. - If you are right on top of the movement in the earthquake, the shaking can be as strong as gravity, so the whole house lifts, he says and continues.  - Unfortunately, we have to count on a lot of damage and deaths.  Ten years ago, 275 people died and almost 3,000 people were injured when the area was hit by a massive earthquake, writes Reuters.", "title_original": "Här slår skalvet till i Japan", "summary_original": "Skalvet med magnituden 6,8 inträffade på eftermiddagen lokal tid på tio kilometers djup på ön Kyushu i södra Japan. NHK rapporterar att taket på ett köpcenter har rasat in i staden Kumamoto. Vittnen på plats uppger att de hört en explosion och sett rök stiga från köpcentret.  Enligt räddningtjänsten ska andra våningen ha rasat in och många människor ska vara instängda i bygganden, skriver NHK. Flera skadade AFP skriver att tolv byggnader har rasat och att minst 50 personer har förts till sjukhus.  En utfärdad tsunamivarning kunde lyftas efter mindre än två timmar. Det japanska flygbolaget ANA har ställt in flygningar i området, som också huserar stora fabriker för bolag som Sony och chiptillverkaren TSMC. Kärnkraftverk som finns i den drabbade regionen har enligt japanska myndigheter hittills inte rapporterat några avvikelser.  ”Vi får räkna med omkomna” Jordbävningen mättes på landets egen Shindoskala till den högsta möjliga nivån. Vid skakningar av den intensiteten är det enligt landets meteorologiska myndighet JMA omöjligt att stå upp, rapporterar Bloomberg. Japan drabbas av tusentals jordbävningar varje år. Björn Lund, universitetslektor i seismologi på Uppsala universitet, menar att denna orsakar extra mycket förödelse då den inträffat på land. – Om man är precis ovanpå rörelsen i jordbävningen kan skakningarna bli lika kraftiga som gravitationen, så hela huset lyfter, säger han och fortsätter.  – Vi får tyvärr räkna med en hel del skadegörelse och omkomna.  För tio år sedan dog 275 personer och nästan 3000 personer skadades när området drabbades av en omfattande jordbävning, skriver Reuters.", "link": "https://www.tv4.se/artikel/1vdczqLN7XoO8psYQtD5Pj/50-tal-skadade-i-kraftigt-skalv-i-japan", "date_display": "2026-07-28", "date_iso": "2026-07-28T10:54:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/japan", "/naturkatastrof"]}, {"id": 146, "title": "Bodies left to rot in piles - apologies", "summary": "On Monday, the trial began against the 48-year-old undertaker Robert Bush, owner of the funeral agency Legacy Independent Funeral Directors in Hull. For several months, he allegedly left bodies to rot in his premises instead of cremating them. At the same time, several families got the wrong ashes home, reports The Guardian.  On his way into the courtroom, he apologized to the families. - I am sorry, yes, he told journalists on the spot.  The apology sparked anger among the affected families, who, according to British media, reacted to him saying it to the press - and not to them. Families received the wrong ashes During the hearing, several relatives read their statements and told about nightmares and PTSD. Jayne Rimmington collected what she believed to be the ashes of her 86-year-old mother in October 2023. The mother's body was later found on the premises of the funeral home - five months after the death. - I trusted him. He stood there smiling, handing over the box as it still lay there rotting away. It is a purely evil act, she says.  Another family reportedly received a navy blue ashtray in a plastic bag from a hobby shop. 198 days after the death, in March of 2024, the body was found. Police found piled bodies When police searched the house in March 2024, they were met with a large number of bodies in various stages of decomposition, as well as half a ton of human ashes.  According to The Guardian, the bodies were stacked on shelves along the walls of a room. A body lay naked on a stretcher on the floor. Flowers, rings, teddy bears and cards left by relatives had been swept under the floor.  Also, the remains of a stillborn boy were reportedly found in a bag on the floor, despite the mother's belief that the child had already been cremated and buried. It took two days to remove the bodies from the premises. Several were later identified using DNA, dental records and fingerprints.  Had large debts In police questioning, Bush is said to have stated that he had debts of around 90,000 pounds. At the same time, more than 3 million", "title_original": "Lämnade kroppar att ruttna på hög – ber om ursäkt", "summary_original": "På måndagen inleddes rättegången mot den 48-årige begravningsentreprenören Robert Bush, ägare till begravningsbyrån Legacy Independent Funeral Directors i Hull. Under flera månader ska han ha låtit kroppar ligga och ruttna i sina lokaler i stället för att kremera dem. Samtidigt fick flera familjer fel aska med sig hem, rapporterar The Guardian.  På väg in i rättssalen bad han familjerna om ursäkt. – Jag är ledsen, ja, sade han till journalister på plats.  Ursäkten väckte ilska bland de drabbade familjerna, som enligt brittiska medier reagerade på att han sa det till pressen – och inte till dem. Familjer fick fel aska Under förhandlingen läste flera anhöriga upp sina utsagor och berättade om mardrömmar och PTSD. Jayne Rimmington hämtade vad hon trodde var askan efter sin 86-åriga mamma i oktober år 2023. Moderns kropp återfanns senare i begravningsbyråns lokaler – fem månader efter dödsfallet. – Jag litade på honom. Han stod där och log, räckte över lådan, när hon fortfarande låg där och ruttnade bort. Det är en rent ondskefull handling, säger hon.  En annan familj ska ha fått en marinblå askurna i en plastpåse från en hobbyaffär. 198 dagar efter dödsfallet, i mars år 2024, hittades kroppen. Polisen fann staplade kroppar När polisen gjorde en husrannsakan i mars 2024 möttes de av ett stort antal kroppar i olika stadier av förruttnelse, samt ett halvt ton mänsklig aska.  Enligt The Guardian låg kropparna staplade på hyllor längs väggarna i ett rum. En kropp låg naken på en bår på golvet. Blommor, ringar, nallar och kort som anhöriga lämnat hade sopats in under golvet.  Även kvarlevorna efter en dödfödd pojke ska ha hittats i en påse på golvet, trots att mamman trodde att barnet redan hade kremerats och begravts. Det tog två dagar att föra ut liken ur lokalerna. Flera identifierades senare med hjälp av DNA, tandjournaler och fingeravtryck.  Hade stora skulder I polisförhör ska Bush ha uppgett att han hade skulder på omkring 90 000 pund. Samtidigt ska mer än 3 miljoner pund ha betalats in på hans konton under en sjuårsperiod, rapporterar BBC. – Bush valde att inte ta hand om de kroppar som anförtrotts honom, utan agerade som han själv ville och spenderade pengarna på sig själv och andra, säger åklagaren.  Bush har erkänt samtliga 67 åtalspunkter, däribland 30 fall av att ha förhindrat en laglig och värdig begravning. Han drev begravningsbyrån i omkring 14 år.  Dom väntas efter den fem dagar långa förhandlingen.", "link": "https://www.tv4.se/artikel/2UjUAHv5QD0zCNiRcUGNKb/laemnade-kroppar-att-ruttna-pa-hoeg-ber-om-ursaekt", "date_display": "2026-07-28", "date_iso": "2026-07-28T10:24:38+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/brott-och-straff", "/atal", "/gravfridsbrott"]}, {"id": 147, "title": "Official: Zidane takes over France", "summary": "It has hardly been a secret that Zinedine Zidane, 54, would take over France's men's national team after the World Cup. Now it's no longer a secret. The French Football Federation (FFF) announces that Zidane will be the new federation captain. The icon has signed a contract that extends to the WC 2030. - I am handing over the responsibility of the French national team to one of our greatest legends. Zidane has shown what enormous talent and competence he has as a coach, says FFF president Philippe Diallo at a press conference. \"A dream for me\" In the past, Zidane himself has spoken openly about his ambition to \"come full circle\" and coach France's men's national team. - This is a dream for me. I've had offers for four or five years to take over clubs, but I've turned them all down for the French national team. This is the only thing I want to do, says Zidane. - I will give everything for this national team to keep winning. It's the only thing that drives me. Zidane has been idle since leaving his head coaching job at Real Madrid five years ago, in 2021. In \"Los Blancos\" he reaped great success, including three Champions League and two La Liga titles. In \"Les Bleus\", he replaces Didier Deschamps, who spent 14 years in the national team captaincy.", "title_original": "Officiellt: Zidane tar över Frankrike", "summary_original": "Det har knappast varit en hemlighet att Zinedine Zidane, 54, skulle ta över Frankrikes herrlandslag efter VM. Nu är det ingen hemlighet längre. Frankrikes fotbollsförbund (FFF) meddelar att Zidane blir ny förbundskapten. Ikonen har signerat ett kontrakt som sträcker sig över VM 2030. - Jag överlämnar ansvaret för det franska landslaget till en av våra största legender. Zidane har visat vilken enorm talang och kompetens han har som tränare, säger FFF:s president Philippe Diallo på en presskonferens. ”En dröm för mig” Tidigare har Zidane själv talat öppet om sin ambition att \"sluta cirkeln\" och få träna Frankrikes herrlandslag. - Det här är en dröm för mig. Jag har fått bud i fyra-fem år om att ta över klubbar, men jag har tackat nej till alla för det franska landslaget. Det här är det enda jag vill göra, säger Zidane. - Jag kommer att ge allt för att det här landslaget ska fortsätta vinna. Det är det enda som driver mig. Zidane har gått sysslolös sedan han lämnade sitt huvudtränarjobb i Real Madrid för fem år sedan, 2021. I \"Los Blancos\" skördade han stora framgångar med bland annat tre Champions League- och två La Liga-titlar. I \"Les Bleus\" ersätter han Didier Deschamps som satt 14 år på förbundskaptensposten.", "link": "https://www.tv4.se/artikel/4cvfvC994OsdzsP0cWrTBc/officiellt-zidane-tar-oever-frankrike", "date_display": "2026-07-28", "date_iso": "2026-07-28T09:40:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Sport", "/sport", "/fotboll", "/frankrike", "/real-madrid"]}, {"id": 148, "title": "Jonas Falk is sentenced to a long prison sentence", "summary": "Jonas Falk, also known as the \"Playasvensken\", is sentenced to nine years and two months in prison for extensive cocaine smuggling. The smuggling has taken place from South America to Europe and involves nearly 2.5 tons of cocaine.  Falk is said to have had the drug manufactured and also organized the actual transport across the Atlantic. The transport must have taken place between Costa Rica, Portugal, Suriname, Colombia and Spain. He denies the crimes on all counts. - From the contents of the messages it appears that the man took an active part in the planning and implementation of all four charges and that the business was organized to conduct large-scale drug trafficking, says the court's chairman, lawyer Göran Lundahl in a press release.  Encrypted chats as evidence Prosecutor Lars Lindman believes that Falk has had a decisive role in the four different seizures that have been made. All of them were made abroad and took place between 2020 and 2021. Most of the evidence consists of chats in the encrypted apps Enchrochat and Sky ECC, which European police managed to crack in the spring of 2021. Jonas Falk has chosen not to participate in the main hearing and not to answer any questions.  Link to Operation Playa Falk has been described as one of Sweden's most notorious criminals and is already serving a prison sentence since he was convicted last year of blackmailing businessman Joachim Kuylenstierna. The court is taking that sentence into account and Falk will serve a total of 14 years in prison, which is the maximum sentence for several cases of extremely serious drug offences.  Prosecutor Lars Lindman asked for 12 years in prison, and to TV4 Nyheterna he asks to be told whether he shares the district court's view that the maximum sentence has been reached or not. On the whole, he sees the outcome positively.  - I think it is a completely reasonable and sensible reasoning that the district court has, and also with regard to the penalty part, says prosecutor Lars Lindman.  Will appeal Jonas Falk's lawyer Max Ahlgren announces that they will appeal the verdict. He believes that r", "title_original": "Jonas Falk döms till långt fängelsestraff", "summary_original": "Jonas Falk, även känd som ”Playasvensken”, döms till fängelse i nio år och två månader för omfattande kokainsmuggling. Smugglingen har skett från Sydamerika till Europa och rör sig om närmare 2,5 ton kokain.  Falk ska ha låtit tillverka drogen och även organiserat själva transporten över Atlanten. Transporten ska ha skett mellan Costa Rica, Portugal, Surinam, Colombia och Spanien. Han nekar till brotten på samtliga punkter. – Av meddelandenas innehåll framgår att mannen tagit en aktiv del i planeringen och genomförandet av samtliga fyra åtalspunkter och att verksamheten varit organiserad för att bedriva storskalig narkotikahandel, säger rättens ordförande, lagmannen Göran Lundahl i ett pressmeddelande.  Krypterade chattar som bevis Åklagare Lars Lindman menar att Falk har haft en avgörande roll i de fyra olika beslag som gjorts. Samtliga har gjorts utomlands och skedde mellan 2020 och 2021. Merparten av bevisningen består av chattar i de krypterade apparna Enchrochat och Sky ECC, som europeisk polis lyckades knäcka våren 2021.  Jonas Falk har valt att inte delta i huvudförhandlingen och inte svara på några frågor.  Koppling till Operation Playa Falk har beskrivits som en av Sveriges mest ökända brottslingar och avtjänar redan ett fängelsestraff sedan han förra året dömdes för att ha utpressat affärsmannen Joachim Kuylenstierna. Domstolen har den domen i beräkning och sammanlagt ska Falk avtjäna 14 år i fängelse, vilket är maxstraffet för flera fall av synnerligen grovt narkotikabrott.  Åklagare Lars Lindman yrkade på 12 års fängelse, och till TV4 Nyheterna ber han att få återkomma om han delar tingsrättens uppfattning av att maxstraffet är uppnått eller inte. På det stora hela ser han positivt på utfallet.  – Jag tycker att det är ett fullt rimligt och vettigt resonemang som tingsrätten för, och även vad gäller påföljdsdelen, säger åklagare Lars Lindman.  Kommer att överklaga Jonas Falks advokat Max Ahlgren meddelar att de kommer att överklaga domen. Han menar att rätten har övervärderat de krypterade chattarna och att tingsrätten har gjort en felaktig bedömning.  – När det är fråga om flerfaldig brottslighet så har man en rabatt. Tingsrätten har gett en mindre rabatt än vad jag menar att man i normala fall gör vid den här typen av brottslighet, säger han.  Han har tidigare dömts för flertalet väpnade rån och även haft en koppling till Sveriges största narkotikarättegång genom tiderna, Operation Playa, då 1,4 ton kokain beslagtogs i en segelbåt.  Falk pekades då ut som huvudman i processen och dömdes av tingsrätten till 18 månaders fängelse. Senare friades han helt från misstankarna av hovrätten.", "link": "https://www.tv4.se/artikel/1RUv9v7AF0AyRgfpikmcS7/jonas-falk-doems-till-langt-faengelsestraff", "date_display": "2026-07-28", "date_iso": "2026-07-28T09:02:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/brott-och-straff", "/johan-falk", "/smuggling", "/dom"]}, {"id": 149, "title": "Polish billionaire behind giant statue of Mary", "summary": "Cost a quarter of a billion to make - second highest in the world.", "title_original": "Polsk miljardär bakom gigantisk Mariastaty", "summary_original": "Kostade en kvarts miljard att göra - näst högst i världen.", "link": "https://www.dagen.se/nyheter/polsk-miljardaer-bakom-gigantisk-mariastaty/10457378", "date_display": "2026-07-28", "date_iso": "2026-07-28T08:34:23+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Place the food correctly in the fridge - avoid the traps of the rotten month", "summary": "During the rotting month, the risk of food spoiling quickly increases, especially when the heat and humidity rise. How you place the food in the refrigerator can be decisive for both durability and health. Professor Marie-Louise Danielsson Tham, expert in food hygiene, explains why the right placement in the fridge can save you from illness. Not all refrigerators are the same Modern refrigerators often have circulating cold air, which makes the temperature more even. In older refrigerators, the cold air sinks downwards and this can create a large temperature difference between the shelves. - Measure the temperature where it is coldest in the fridge. Sensitive foods should be kept where it is cold, often in the middle, says Marie-Louise Danielsson Tham. How to place different foods Dairy products, seafood and other sensitive food should be in the middle of the fridge, where the temperature is lowest. Vegetables and fruit, on the other hand, should be in the vegetable drawer at the bottom, where it is a little warmer and they are not at risk of freezing. - If you put fruit and vegetables too cold, they get sad quickly. They freeze, quite simply, says Danielsson Tham. The door compartment is the warmest part of the refrigerator and is best suited for products that are not so sensitive, such as ketchup, mayonnaise and some dressings. Milk and dairy products should not be left there, as they turn sour faster. - In the door compartments, you should have things that are not so sensitive, she says. Tips to avoid food waste Eggs keep best in the refrigerator and can be stored significantly longer than at room temperature. Tomatoes do best outside the fridge, while lemons can be kept in the vegetable drawer. - You don't want to throw away food unnecessarily, says Marie-Louise Danielsson Tham. Keeping an eye on the temperature of the refrigerator and placing the food correctly is especially important during the rotting month, when bacteria multiply faster in the heat. - Everyone should watch out, I think. You never know when the heat will come, says Danielsson Tham.", "title_original": "Placera maten rätt i kylen – undvik rötmånadens fällor", "summary_original": "Under rötmånaden ökar risken för att maten snabbt blir dålig, särskilt när värmen och luftfuktigheten stiger. Hur du placerar maten i kylskåpet kan vara avgörande för både hållbarhet och hälsa. Professor Marie-Louise Danielsson Tham, expert på livsmedelshygien, förklarar varför rätt placering i kylen kan rädda dig från sjukdom. Alla kylskåp är inte lika Moderna kylskåp har ofta cirkulerande kalluft, vilket gör temperaturen jämnare. I äldre kylskåp sjunker kalluften nedåt och det kan skapa stor temperaturskillnad mellan hyllorna. – Mät temperaturen där det är kallast i kylen. Känsliga livsmedel ska stå där det är kallast, ofta i mitten, säger Marie-Louise Danielsson Tham. Så placerar du olika livsmedel Mejeriprodukter, skaldjur och annan känslig mat bör stå mitt i kylen, där temperaturen är lägst. Grönsaker och frukt ska däremot ligga i grönsakslådan längst ner, där det är lite varmare och de inte riskerar att frysa. – Lägger du frukt och grönt för kallt blir de ledsna fort. De fryser, helt enkelt, säger Danielsson Tham. Dörrfacken är kylskåpets varmaste plats och passar bäst för produkter som inte är så känsliga, till exempel ketchup, majonnäs och vissa dressingar. Mjölk och mejeriprodukter bör inte stå där, eftersom de surnar snabbare. – I dörrfacken ska man ha sådant som inte är så känsligt, säger hon. Tips för att undvika matsvinn Ägg håller sig bäst i kylskåp och kan förvaras betydligt längre än i rumstemperatur. Tomater mår bäst utanför kylen, medan citroner gärna kan ligga i grönsakslådan. – Man vill ju inte kasta livsmedel i onödan, säger Marie-Louise Danielsson Tham. Att ha koll på kylskåpets temperatur och placera maten rätt är särskilt viktigt under rötmånaden, då bakterier förökar sig snabbare i värmen. – Alla bör se upp, tycker jag. Man vet aldrig när värmen kommer, säger Danielsson Tham.", "link": "https://www.tv4.se/artikel/4Ht8wtybXL4iGnDkfyrbyP/roetmanadens-faellor-haer-ska-maten-sta-i-kylen", "date_display": "2026-07-28", "date_iso": "2026-07-28T08:23:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/livsmedel", "/matforgiftning", "/magsjuka", "/sommar"]}, {"id": 151, "title": "Ready for Let's Dance", "summary": "TV4 put the long-distance runner on hiatus last year, but already this autumn the competition is making a comeback. The premiere is on August 21 and a total of ten participants will take on the dance journey, which this season will also be followed more behind the scenes. Dance debut for the astronaut For Christer Fuglesang, astronaut and professor, it will be a completely new arena. He has no previous experience of dance classes and describes that he can mainly bug and \"party dance\". - It's fun. It's a completely new challenge, but it should be a lot of fun, says Christer Fuglesang.  At the same time, the goal is clear: he aims to make it all the way to the final. - You have to aim high, says Christer Fuglesang to TV4. From space to the dance floor Before the start, Fuglesang met his dance partner and teacher Ines, and read about the set-up. He believes that dancing is a new experience, but emphasizes that discipline and persistence are qualities he hopes to benefit from. In addition, experience from space can come in handy. - The spacewalk is a lot of physical activity. You move around in space in these space suits, says Christer Fuglesang. - It's a bit clumsier than dance clothes.  A traitor in dancing shoes Even Julia Franzén, influencer and TV profile, is ready for the new season. Franzén is already used to television and has recently appeared in, among other things, \"The Traitors\". Now a new type of challenge awaits in a live dance competition. - I have always said that Let's Dance, I will say no to that. But I said \"yes\", says Julia Franzén. She is hoping to improve her dancing skills and have a fun experience. Franzén says that she was attracted by the fact that it is usually described as a fun experience and that she has self-distance if things go badly.  - The traitors were more fun because I was good there, but it will still be fun, says Franzén. \"Clumsy and ungraceful\" Both Fuglesang and Franzén describe themselves as anything but graceful and expect this fall's dance competition to be a real challenge.  - I'm as stiff as a refrigerator,", "title_original": "Klara för Let´s Dance", "summary_original": "TV4 satte förra året långköraren på paus, men redan i höst gör tävlingen comeback. Premiären är den 21 augusti och totalt ska tio deltagare ta sig an dansresan, som den här säsongen också ska följas mer bakom kulisserna. Dansdebut för astronauten För Christer Fuglesang, astronaut och professor, blir det en helt ny arena. Han har ingen tidigare erfarenhet av danskurser och beskriver att han främst kan bugga och ”festdansa”. – Det är roligt. Det är en helt ny utmaning, men det ska bli väldigt roligt, säger Christer Fuglesang.  Samtidigt är målet tydligt: han siktar på att ta sig hela vägen till final. – Man måste sikta högt, säger Christer Fuglesang till TV4. Från rymden till dansgolvet Inför start har Fuglesang träffat sin danspartner och lärarinna Ines, och läst på om upplägget. Han menar att dans är en ny erfarenhet, men lyfter att disciplin och envishet är egenskaper han hoppas kunna ha nytta av. Dessutom kan erfarenheten från rymden komma till nytta. – Rymdpromenaden är mycket att man utför fysiska moment. Man rör sig runt i rymden i de här rymddräkterna, säger Christer Fuglesang. – Det är lite klumpigare än danskläder.  En förrädare i dansskor Även Julia Franzén, influencer och tv-profil, är klar för den nya säsongen. Franzén är sedan tidigare van vid tv och har nyligen synts i bland annat ”Förrädarna”. Nu väntar en ny typ av utmaning i direktsänd danstävling. - Jag har alltid sagt att Let's Dance, det kommer jag tacka nej till. Men jag sa ju ”ja”, säger Julia Franzén. Hon är hoppfull om att förbättra sina danskunskaper och få en kul upplevelse. Franzén säger att hon lockades av att det brukar beskrivas som en rolig upplevelse och att hon har självdistans om det skulle gå dåligt.  – Förrädarna var ju roligare för där var jag ju bra, men det ska ändå bli kul, säger Franzén. ”Klumpig och ograciös” Både Fuglesang och Franzén beskriver sig själva som allt annat än graciösa och räknar med att höstens danstävling blir en rejäl utmaning.  – Jag är stel som ett kylskåp, säger Franzén. Sikte på finalen Dansträningarna inför Let's Dance drar igång i dag, och deltagarna är redo att satsa stenhårt. – Jag vill inte förlora. Jag känner inte att jag måste vara bättre än alla andra, men jag vill inte vara sämre än alla andra, säger Fuglesang. Franzén lovar att träna på för att kunna göra sin danspartner stolt. – Jag ska verkligen gå all in. Det gör jag med allt, säger Franzén. ”Let’s Dance” har premiär 21 augusti.", "link": "https://www.tv4.se/artikel/4t0MqA0XU0KoXWuMpTk50R/lets-dance-tva-nya-deltagare-bekraeftade", "date_display": "2026-07-28", "date_iso": "2026-07-28T06:15:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/lets-dance", "/personer/julia-franzen", "/christer-fuglesang", "/dans"]}, {"id": 152, "title": "Support for Fedorov rushes after the poke: \"Severe misjudgment\"", "summary": "When Ukrainian Defense Minister Mychaylo Fedorov had to leave his post, the protests exploded. At the same time, his trust figures have soared. According to an opinion poll by the Rating Group, Fedorov has in a short time become one of the country's most popular politicians, and in the Ukrainian media he is now highlighted as a possible future presidential candidate. Russia expert Malcolm Dixelius believes that President Volodymyr Zelenskyi likely underestimated the consequences of the dismissal. - Obviously it was a misjudgment right from the start and he has already tried to make corrections. A serious misjudgment, I can definitely go that far, he says. \"Not a power struggle yet\" Fedorov has received strong support after his dismissal and thousands of people have demonstrated for his reinstatement. But Dixelius thinks it is too early to talk about an open power struggle. - It is an open democratic society, so these kinds of rivalries will arise. It is no wonder that rivalries arise between young politicians, he says. According to Dixelius, an important explanation for Fedorov's popularity is that he is perceived as the symbol of a new Ukraine. - Fedorov belongs to the generation that has no idea what the Soviet Union even was. He has spent his entire life in modern Ukraine. Dixelius describes the conflict as part of a larger generational change in Ukrainian politics. - Zelenskyi represents a middle generation. He still has his past in the Soviet era and knows how it worked, he says. Support is particularly strong among younger Ukrainians. - He wants to reshape his country into a country with more Western European standards. Therefore, he is more categorical and more impatient in his will to change Ukraine, he says. - Above all, they seek two things: a rapprochement with Western Europe and a peace agreement that prevents Russia from resuming the war. Has lost dominance At the same time, Dixelius believes that Zelenskyi's position at home is not as strong as before", "title_original": "Stödet för Fedorov rusar efter petningen: ”Svår missbedömning”", "summary_original": "När Ukrainas försvarsminister Mychajlo Fedorov fick lämna sitt uppdrag exploderade protesterna. Samtidigt har hans förtroendesiffror skjutit i höjden. Enligt en opinionsmätning från Rating Group har Fedorov på kort tid blivit en av landets mest populära politiker, och i ukrainska medier lyfts han nu fram som en möjlig framtida presidentkandidat. Rysslandskännaren Malcolm Dixelius menar att president Volodymyr Zelenskyj sannolikt underskattade vilka konsekvenser avskedandet skulle få. – Uppenbarligen var det en missbedömning redan från början och han har ju redan försökt göra rättelser. En svår missbedömning, så långt kan jag definitivt gå, säger han. ”Inte en maktstrid än” Fedorov har fått starkt stöd efter avskedandet och tusentals människor har demonstrerat för att han ska återinsättas. Men Dixelius tycker att det är för tidigt att tala om en öppen maktkamp. – Det är ju ett öppet demokratiskt samhälle, så den här sortens rivaliteter kommer att uppstå. Det är inget konstigt att det uppstår rivaliteter mellan unga politiker, säger han. Enligt Dixelius är en viktig förklaring till Fedorovs popularitet att han uppfattas som symbolen för ett nytt Ukraina. – Fedorov tillhör den generation som inte har en susning om vad Sovjetunionen ens var. Hela hans liv har han tillbringat i det moderna Ukraina. Dixelius beskriver konflikten som en del av en större generationsväxling i ukrainsk politik. – Zelenskyj representerar en mellangeneration. Han har ändå sitt förflutna i den sovjetiska tiden och vet hur den fungerade, säger han. Stödet är särskilt starkt bland yngre ukrainare. – Han vill forma om sitt land till ett land med mer västeuropeiska normer. Därför är han mer kategorisk och mer otålig i sin vilja att förändra Ukraina, säger han. – De söker framför allt två saker: ett närmande till Västeuropa och ett fredsavtal som förhindrar Ryssland från att återuppta kriget. Har tappat dominans Samtidigt tror Dixelius att Zelenskyjs ställning på hemmaplan inte är lika stark som under krigets första år. – Det malande kriget med terror mot civilbefolkningen och angrepp mot infrastrukturen har sänkt hans trovärdighet som ledare, säger han. Enligt Dixelius insåg Zelenskyj sannolikt snabbt att avskedandet av Fedorov skulle få större konsekvenser än väntat. – Men han vill inte vika sig hundra procent, utan vill fortfarande visa att det är han som bestämmer vem som ska vara försvarsminister och hur landet ska styras. Fler möjliga presidentkandidater Även om presidentval inte kan hållas så länge krigslagarna gäller pågår redan spekulationer om vem som kan bli Ukrainas nästa ledare. Fedorov nämns allt oftare som en möjlig kandidat, men Dixelius pekar även på andra namn. – Klitjko, borgmästaren i Kiev, är definitivt en rival. Han har ställt upp i tidigare presidentval och har varit rätt tapper i försvaret av Kiev. Han verkar också ha varit en ganska bra borgmästare. Han vill inte heller räkna ut tidigare presidenten Petro Porosjenko. – Men det som inte har skett under den här tiden är nya partibildningar. Därför vet vi inte riktigt hur folk kommer att gruppera sig. För tidigt att döma ut Zelenskyj Enligt Dixelius är det därför för tidigt att dra långtgående slutsatser av dagens opinionsmätningar. – Jag tror att de säger väldigt mycket om stämningarna i Ukraina just nu. Men det är svårt att översätta det till ett framtida valresultat så länge kriget pågår. När Ukraina väl går till val tror Dixelius att Ryssland kommer att försöka påverka processen. – Det bästa de kan göra, sett ur rysk synvinkel, är att försöka göra processen så illegitim som möjligt så att man kan ifrågasätta att Ukraina verkligen är ett demokratiskt land. – Ryssland kommer att försöka på varje sätt att misstänkliggöra och sprida information, även falsk information, om kandidater som de tycker illa om.", "link": "https://www.tv4.se/artikel/6M2zzebltMdlFbOtci6S3J/stoedet-foer-fedorov-rusar-efter-petningen-svar-missbedoemning", "date_display": "2026-07-28", "date_iso": "2026-07-28T06:12:19+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/ukraina", "/zelenskyj", "/politiker", "/utrikespolitik", "/malcolm-dixelius"]}, {"id": 153, "title": "A man is treated for life-threatening injuries after a head-on collision", "summary": "The police were called on Monday evening to road 503 in the municipality of Marks after a head-on collision between two cars. - One car had gone into the water in a lake right next to the road. The other car had gone into a mountain wall, says Morten Gunneng, officer on duty at the police. One person is being treated for life-threatening injuries and the condition of the other three involved in the accident is assessed to be stable.  The driver who drove into the mountain wall was taken to hospital by ambulance helicopter. In the car that ended up in the water, three people managed to get up with the help of passers-by. They too were taken to hospital. Suspected drunk driving The driver of the car that drove into the mountain wall is suspected of drunk driving, gross negligence in traffic and causing bodily harm. - He was both pinned down and unconscious, says Morten Gunneng. All involved in the accident are in their 20s. Both cars were recovered after the accident and traffic was able to resume shortly afterwards.", "title_original": "Man vårdas med livshotande skador efter frontalkrock", "summary_original": "Polisen larmades under måndagskvällen till väg 503 i Marks kommun efter en frontalkrock mellan två bilar. – Den ena bilen hade gått ner i vattnet i en sjö precis i anslutning till vägen. Den andra bilen hade gått in i en bergsvägg, säger Morten Gunneng, vakthavande befäl hos polisen. En person vårdas för livshotande skador och för övriga tre inblandade i olyckan bedöms läget vara stabilt.  Föraren som kört in i bergsväggen fördes till sjukhus med ambulanshelikopter. I bilen som hamnade i vattnet lyckades tre personer ta sig upp med hjälp av förbipasserande. Även de fördes till sjukhus. Misstänkt rattfylleri Föraren till bilen som körde in i bergsväggen är misstänkt för rattfylleri, grov vårdslöshet i trafik och vållande till kroppsskada. – Han var både fastklämd och medvetslös, säger Morten Gunneng. Alla inblandade i olyckan är i 20-årsåldern. Båda bilarna bärgades efter olyckan och kort därefter kunde trafiken rulla på igen.", "link": "https://www.tv4.se/artikel/7sJcMBzHIzygroMksJslNx/bil-hamnade-i-sjoe-efter-frontalkrock", "date_display": "2026-07-28", "date_iso": "2026-07-28T05:20:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/olycka", "/trafikolycka", "/marks-kommun"]}, {"id": 154, "title": "Here the forest fire dog finds the glow that the eye misses", "summary": "Flatcoated retriever Segra sniffs around the training area outside Götene, which consists of a wood that has already been ravaged by fire. Segra is a trained forest fire dog and can smell a glow that the naked eye cannot see. Together with his colleague Malin Kyllesjö, Olsson has hidden a container that develops fire gas in a pit nearby. Segra finds it in seconds after the \"search\" command is spoken. The idea was born after the extreme year 2018 The concept was developed after the extreme year 2018, when over 8,000 fires broke out in forests and land. That was around 3,000 more than both the year before and after, according to statistics from MCF, the Norwegian Civil Defense Agency. Malin Kyllesjö, who has worked with dogs for many years, then began developing a training course. Since then, she has certified seven forest fire dogs and five dog handlers, including Matilda Olsson in Götene. - A forest fire dog can make a big difference in post-extinguishing work, says Malin Kyllesjö. More dogs are being trained and the goal is for there to be a team in every county, and also outside Sweden's borders. - Yes, we are already underway and have contact with Denmark and the Netherlands. Then we had phone calls from Australia and Canada. Yes, more countries than that, says Malin Kyllesjö. - It feels great. The biggest gain is that there is not as much forest burning as it has been. We can prevent the spread, she continues. Risks for the dogs too The mission is to help rescue services, forest owners and insurance companies in post-extinguishing work, something they have done repeatedly in recent years. But the work also involves risks for the dogs. - Yes, there is a risk of injury. On the one hand, there are toxic gases in the smoke and then there is a risk that they will burn, twist or trip. But we must constantly try to secure as much as we can, says Matilda Olsson. - The risk is also small in relation to the importance of the work, she concludes.", "title_original": "Här hittar skogsbrandhunden glöden som ögat missar", "summary_original": "Flatcoated retrivern Segra nosar runt i övningsområdet utanför Götene, som består av en sedan tidigare brandhärjad dunge. Segra är utbildad skogsbrandhund och kan dofta sig till en glöd som blotta ögat inte kan se. Tillsammans med sin kollega Malin Kyllesjö har Olsson gömt en behållare som utvecklar brandgas i en grop i närheten. Segra hittar den på sekunder efter att kommandot \"sök\" uttalats. Idén föddes efter extremåret 2018 Konceptet togs fram efter extremåret 2018, då över 8 000 bränder bröt ut i skog och mark. Det var omkring 3 000 fler än både året före och efter, enligt statistik från MCF, Myndigheten för civilt försvar. Malin Kyllesjö, som arbetat med hundar i många år, började då ta fram en utbildning. Sedan dess har hon certifierat sju skogsbrandhundar och fem hundförare, däribland Matilda Olsson i Götene. – En skogsbrandhund kan göra stor skillnad i eftersläckningsarbetet, berättar Malin Kyllesjö. Fler hundar är under utbildning och målet är att det ska finnas ett ekipage i varje län, och även utanför Sveriges gränser. – Ja, vi är redan på gång och har kontakt med Danmark och Nederländerna. Sen har vi haft telefonsamtal från Australien och Kanada. Ja, fler länder än så, säger Malin Kyllesjö. – Det känns jättegott. Största vinningen är att det inte brinner så mycket skog som det har gjort. Vi kan hindra spridningen, fortsätter hon. Risker även för hundarna Uppdraget är att hjälpa räddningstjänst, skogsägare och försäkringsbolag i eftersläckningsarbete, något de gjort vid upprepade tillfällen de senaste åren. Men arbetet innebär också risker för hundarna. – Jo, det är en skaderisk. Dels är det giftiga gaser i röken och sedan är det risk att de bränner sig, vrickar eller snubblar. Men vi får hela tiden försöka säkra upp så mycket vi kan, berättar Matilda Olsson. – Risken är också liten i förhållande till vikten av arbetet, avslutar hon.", "link": "https://www.tv4.se/artikel/5qc79y0JHg95cUL9rhtTpu/haer-hittar-skogsbrandhunden-gloeden-som-oegat-missar", "date_display": "2026-07-28", "date_iso": "2026-07-28T04:45:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/skogsbrander", "/gotene", "/kriget-i-ukraina/svenskaberedskapen"]}, {"id": 155, "title": "Time to introduce mandatory parent training", "summary": "This proposal can save the children from a destructive upbringing, writes Harald Berglund.", "title_original": "Dags att införa obligatorisk föräldrautbildning", "summary_original": "Detta förslag kan rädda barnen från en destruktiv uppväxt, skriver Harald Berglund.", "link": "https://www.dagen.se/debatt/dags-att-infoera-obligatorisk-foeraeldrautbildning/10430943", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 156, "title": "Give every Swedish household a free daily newspaper", "summary": "Think what it would do for democracy, integration, literacy and much, much more! writes Jan Olsson.", "title_original": "Ge varje svenskt hushåll en gratis dagstidning", "summary_original": "Tänk vad det skulle göra för demokratin, integrationen, läskunnigheten och mycket, mycket annat! skriver Jan Olsson.", "link": "https://www.dagen.se/debatt/ge-varje-svenskt-hushall-en-gratis-dagstidning/10451974", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "The more I understand how the world comes into being, the more clearly I see God's work", "summary": "Jakob Norrhall: As a young adult, it is painfully difficult to find the balance.", "title_original": "Ju mer jag förstår hur världen blir till, desto tydligare ser jag Guds verk", "summary_original": "Jakob Norrhall: Som ung vuxen är det smärtsamt svårt att finna balansen.", "link": "https://www.dagen.se/ledare/ju-mer-jag-foerstar-hur-vaerlden-blir-till-desto-tydligare-ser-jag-guds-verk/10271557", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The regalia coup in the cathedral baffles: \"I wonder what they were thinking\"", "summary": "The theft coup against Strängnäs cathedral contains so many strange ingredients - eight years later only question marks remain.", "title_original": "Regaliekuppen i domkyrkan förbryllar: ”Undrar hur de tänkte”", "summary_original": "Stöldkuppen mot Strängnäs domkyrka innehåller så många märkliga ingredienser – åtta år senare kvarstår bara frågetecken.", "link": "https://www.dagen.se/nyheter/regaliekuppen-i-domkyrkan-foerbryllar-undrar-hur-de-taenkte/10456365", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 159, "title": "\"The basic decision from 2009 is not to protect the religious freedom of the individual priest\"", "summary": "Wanja Lundby-Wedin (S), the church board's first vice chairman, thinks it is \"tricky\" to talk about the religious freedom of the individual priest - but the term religious freedom is used in the new guidelines from the church board.", "title_original": "”Grundbeslutet från 2009 är inte att skydda den enskilde prästens religionsfrihet”", "summary_original": "Wanja Lundby-Wedin (S), kyrkostyrelsens förste vice ordförande, tycker att det är ”knepigt” att prata om den enskilde prästens religionsfrihet – men termen religionsfrihet används i de nya riktlinjerna från kyrkostyrelsen.", "link": "https://www.dagen.se/nyheter/grundbeslutet-fran-2009-aer-inte-att-skydda-den-enskilde-praestens-religionsfrihet/10453982", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 160, "title": "Jakob Ihfongård: Balancing to pass the board game hobby on to the next generation", "summary": "An activity that brings the family together around the table - away from all screens", "title_original": "Jakob Ihfongård: Balansgång att föra brädspels­hobbyn vidare till nästa generation", "summary_original": "En aktivitet som samlar familjen runt bordet – bort från alla skärmar", "link": "https://www.dagen.se/familj/jakob-ihfongard-balansgang-att-foera-braedspelshobbyn-vidare-till-naesta-generation/10353545", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 161, "title": "Uncertain future for classic Christian camping", "summary": "The current Löttorp operator is pulling out after the summer.", "title_original": "Osäker framtid för klassisk kristen camping", "summary_original": "Nuvarande Löttorp-operatören drar sig ur efter sommaren.", "link": "https://www.dagen.se/nyheter/osaeker-framtid-foer-klassisk-kristen-camping/10455813", "date_display": "2026-07-28", "date_iso": "2026-07-28T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 162, "title": "Forest fires threaten wine production in Bordeaux", "summary": "The large forest fires in France and Spain have forced around 350,000 people to evacuate their homes. One of the affected areas is the French wine region of Bordeaux. Now questions are being raised about whether the fires also risk affecting the wine itself.  Elisabeth Due, CEO of the industry organization Spirit & Wine Suppliers Association, has followed the development. - It will mean a lot for wine production and is one of the things that makes you very worried in our industry. You don't know how this will affect this year's harvest, she says.  The consequences may linger Wine is a storage product and the wines available at Systembolaget today are made from grapes that were picked a year ago, or more. According to Elisabeth Due, the effects of the fires can therefore only be felt in the coming years. - It will definitely affect the supply. It is both quantity and quality that this will hit, which makes it very serious, she says.  At the wineries, there are people who make sure that the wines taste as they should before they hit the market. If the wine is a blended wine, you can possibly adjust which grape varieties are used to get the right taste, explains Elisabeth Due. In contrast, wines from Bordeaux are often made from only one grape variety.  Can hit favorite wines The fires are also hitting wine production hard in Spain, where the Rioja and Andalusia regions have been hit. - This is devastating for these regions. Wine is their livelihood, says Elisabeth Due. Elisabeth Due assesses that the fires may affect prices for Swedish consumers, even if the effect in a larger perspective may be limited. She points out that wine consumption has decreased in both Sweden and the rest of Europe. - For those of us who like to drink a specific wine and who have our favorites at Systembolaget, it will certainly affect the price, she says.", "title_original": "Skogsbränder hotar vinproduktionen i Bordeaux", "summary_original": "De stora skogsbränderna i Frankrike och Spanien har tvingat omkring 350 000 personer att evakuera sina hem. Ett av de drabbade områdena är det franska vindistriktet Bordeaux. Nu väcks frågor om bränderna också riskerar att påverka själva vinet.  Elisabeth Due, vd för branschorganisationen Sprit & Vinleverantörsföreningen, har följt utvecklingen. – Det kommer betyda jättemycket för vinproduktionen och är en av de grejer som gör att man är väldigt orolig inom vår bransch. Man vet inte hur det här kommer att påverka årets skörd, säger hon.  Konsekvenserna kan dröja Vin är en lagringsprodukt och de viner som finns på Systembolaget i dag är gjorda på vindruvor som plockades för ett år sedan, eller mer. Enligt Elisabeth Due kan effekterna av bränderna därför märkas först under kommande år. – Det kommer definitivt att påverka utbudet. Det är både kvantitets- och kvalitetsmässigt som det här kommer att slå, vilket gör det väldigt allvarligt, säger hon.  På vinhusen finns det personer som ser till att vinerna smakar som de ska innan de kommer ut på marknaden. Om vinet är ett blandvin kan man eventuellt justera vilka druvsorter som används för att få rätt smak, förklarar Elisabeth Due. Däremot är viner från Bordeaux ofta gjorda på endast en druvsort.  Kan slå mot favoritviner Bränderna slår hårt mot vinproduktionen även i Spanien, där regionerna Rioja och Andalusien har drabbats. – Det här är förödande för de här regionerna. Vinet är deras levebröd, säger Elisabeth Due. Elisabeth Due bedömer att bränderna kan påverka priserna för svenska konsumenter, även om effekten i ett större perspektiv kan bli begränsad. Hon pekar på att vinkonsumtionen har minskat i både Sverige och övriga Europa. – För oss som gärna vill dricka ett specifikt vin och som har våra favoriter på Systembolaget kommer det säkerligen att påverka priset, säger hon.", "link": "https://www.tv4.se/artikel/1H2Py0DrYSw03RdVwrDgvM/skogsbraender-hotar-vinproduktionen-i-bordeaux", "date_display": "2026-07-27", "date_iso": "2026-07-27T20:42:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Vädret", "/vadret", "/utrikes", "/vin", "/skogsbrander", "/brandernaieuropa"]}, {"id": 163, "title": "Missing man found alive: \"Heavy hypothermia\"", "summary": "It was during Sunday that the man left his home to pick berries. Shortly before he was reported missing, he had contact with his relatives by phone. - He himself contacted his relatives and said that he was lost, says Johanna Carlefred, RLC commander. At ten o'clock on Sunday evening, the man was reported missing. An extensive operation with drones, helicopters and mountain rescuers was launched and shortly afterwards the man's car was found just north of Jukkasjärvi. Found by military personnel Barely 24 hours later, at half past ten on Monday evening, the police announced that the man had been found. - He is alive but is severely hypothermic and has been taken to hospital by ambulance, says Johanna Carlefred. In addition to the fact that he is severely hypothermic, the man's injury status is unclear. - I cannot explain how it happened when he was found, other than that he was found by military personnel from the Armed Forces, says Johanna Carlefred. Difficult terrain Johan Björnström is an operations leader from the Swedish Armed Forces.  - Right now it's just euphoria. We found the man and we could make a difference. A fantastic collaboration of everyone involved, including the police, mountain rescue, the defense and the home guard, he tells the freelance photographer Mattias Johansson.  He describes the terrain as difficult and heavy, which made it difficult to search from the air.  - Some people who searched the ground heard a person breathing, that's what led us to the missing person, says Johan Björnström.", "title_original": "Försvunnen man hittad vid liv: ”Kraftigt nerkyld”", "summary_original": "Det var under söndagen som mannen lämnade sitt hem för att plocka bär. Strax innan han anmäldes försvunnen hade han kontakt med sina anhöriga över telefon. – Han har själv hört av sig till anhöriga och sagt att han har gått vilse, säger Johanna Carlefred, RLC-befäl. Vid tiotiden på söndagskvällen anmäldes mannen försvunnen. En omfattande insats med drönare, helikopter och fjällräddare inleddes och kort därpå hittades mannens bil strax norr om Jukkasjärvi. Hittades av militär personal Knappt 24 timmar senare, vid halv tiotiden på måndagskvällen, meddelade polisen att mannen hittats. – Han är vid liv men är kraftigt nerkyld och har förts till sjukhus med ambulans, säger Johanna Carlefred. Utöver att han är kraftigt nerkyld är mannens skadeläge oklart. – Jag kan inte förklara hur det gick till när han hittades, mer än att han hittades av militär personal från Försvarsmakten, säger Johanna Carlefred. Svår terräng Johan Björnström är insatsledare från Försvarsmakten.  – Just nu är det bara eufori. Vi hittade mannen och vi kunde göra skillnad. Ett fantastiskt samarbete av alla inblandade, bland annat polis, fjällräddning, försvaret, och hemvärnet, säger han till frilansfotografen Mattias Johansson.  Han beskriver terrängen som svår och tung, vilket gjorde det svårt att söka från luften.  – Några personer som sökte på marken hörde en person som andades, det var det som ledde oss fram till den försvunna personen, säger Johan Björnström.", "link": "https://www.tv4.se/artikel/6D8yJYZwhaC1T9EldVVugh/foersvunnen-man-hittad-vid-liv-kraftigt-nerkyld", "date_display": "2026-07-27", "date_iso": "2026-07-27T20:00:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/forsvunna-personer", "/norrbotten", "/jukkasjarvi", "/kiruna"]}, {"id": 164, "title": "The person killed was a school employee: \"A shock\"", "summary": "It was last Friday that a 25-year-old man was shot to death in Hässelby in western Stockholm. TV4 Nyheterna can now reveal that the man was employed at Grimstaskolan in Stockholm.  - It's great news, a colleague called me last Saturday and told me that it had happened. Now we don't know much more than that, says Fredrik Olsson, principal at Grimstaskolan. \"A shock\" Three people, two of whom are under the age of 18, have been arrested since Saturday, and the motive is still unclear. Fredrik Olsson has not worked with the employee for very long, and believes that the announcement came completely unexpectedly. - You are surprised, it is a shock that this happens to an employee. I don't have a personal relationship with him, but he is a person with whom I have had contact, he says. The prosecutor must make a decision no later than 12 o'clock on Tuesday whether to ask for the arrestees to be detained or to release them at large. On Monday, all had been interrogated with defenders, after the witnesses were heard and the police made seizures.  - Now we work extensively in the preliminary investigation with, among other things, technical investigations. The police are interested in making contact with more people who may have witnessed the incident, says District Attorney Sarah Mattsson, who leads the preliminary investigation. The school strengthens support Fredrik Olsson says that the focus is now on meeting the needs of the school and providing support. Grimstaskolan has strengthened itself with more leaders to be able to handle the situation. - It's about being there as a support for people. To be able to pick up worried citizens and contact closest colleagues at times of remembrance. Yes, capture worry and sadness, he says.", "title_original": "Den dödade var skolanställd: ”En chock”", "summary_original": "Det var i fredags som en man i 25-årsåldern sköts till döds i Hässelby i västra Stockholm. TV4 Nyheterna kan nu avslöja att mannen var anställd på Grimstaskolan i Stockholm.  – Det är jättenytt, en kollega ringde mig i lördags och berättade att det hänt. Nu vet vi inte så mycket mer än s
