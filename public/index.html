today", "tags": []}, {"id": 44, "title": "Abbott after Stanley Cup title: \"Feels surreal\"", "summary": "The Carolina Hurricanes got to lift the Stanley Cup trophy. In the middle of the whirlwind: Rögle's former sporting director Chris Abbott.", "title_original": "Abbott efter Stanley Cup-titeln: ”Känns surrealistiskt”", "summary_original": "Carolina Hurricanes fick lyfta Stanley Cup-pokalen. Mitt i glädjeyran: Rögles förre sportchef Chris Abbott.", "link": "https://www.hd.se/sport/abbott-efter-stanley-cup-titeln-kanns-surrealistiskt/", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:21:34+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 45, "title": "The bathers' enemy can be the \"ocean sausage\"", "summary": "They are sharp and spread quickly along the Swedish west coast. The invasive Pacific oyster changes the ecosystem and destroys bathers. Big investments are now being made to take advantage of the questionable mollusk. - They are like the sea's falu sausage, says Åsa Strand, marine nature conservation manager at the county board.", "title_original": "Badgästernas fiende kan bli ”havets falukorv”", "summary_original": "De är vassa och sprider sig snabbt längs den svenska västkusten. Det invasiva stillahavsostronet förändrar ekosystemet och förstör för badgäster. Nu görs stora satsningar för att ta tillvara det ifrågasatta blötdjuret. – De är som havets falukorv, säger Åsa Strand, marin naturvårdsförvaltare på länsstyrelsen.", "link": "https://www.svd.se/a/d4k15J/badgasternas-fiende-kan-bli-havets-falukorv", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:13:53+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 46, "title": "Wind turbines – taller than Turning Torso – are being built in Landskrona", "summary": "Three new wind turbines, all taller than Turning Torso, will replace four older ones in Lundåkra Bay.  The investment quadruples electricity production and strengthens Landskrona's energy supply.", "title_original": "Vindkraftverk – högre än Turning Torso – byggs i Landskrona", "summary_original": "Tre nya vindkraftverk, alla högre än Turning Torso, ska ersätta fyra äldre i Lundåkrabukten.  Satsningen fyrdubblar elproduktionen och stärker Landskronas energiförsörjning.", "link": "https://www.hd.se/landskrona/vindkraftverk-hogre-an-turning-torso-byggs-i-landskrona/", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:10:10+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 47, "title": "\"Straight down\" - British regrets about Brexit", "summary": "Ten years have passed since Britain decided to wave goodbye to the EU. Now it stings – even where almost everyone voted for Brexit. - We shot ourselves in the foot, say voters in Wigan.", "title_original": "”Spikrakt nedåt” – brittisk ånger om brexit", "summary_original": "Tio år har gått sedan Storbritannien bestämde sig för att vinka adjö till EU. Nu svider det – till och med där nästan alla röstade för brexit. – Vi sköt oss själva i foten, säger väljare i Wigan.", "link": "https://www.svd.se/a/0poAwo/spikrakt-nedat-brittisk-anger-om-brexit", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:08:26+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 48, "title": "Got hand chopped off with machete - two get jail time", "summary": "A teenage boy had his hand chopped off with a machete. Now two young men are sentenced to prison for 6.5 and 3.5 years respectively.", "title_original": "Fick hand avhuggen med machete – två får fängelse", "summary_original": "En pojke i tonåren fick sin hand avhuggen med en machete. Nu döms två unga män till fängelse i 6,5 respektive 3,5 år.", "link": "https://www.hd.se/sverige/fick-hand-avhuggen-med-machete-tva-far-fangelse/", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:07:58+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 49, "title": "Schools remain open after the attempted murder in Alvesta", "summary": "Days after the end of summer, schools in Alvesta open for students and guardians. This weekend, two girls were subjected to attempted murder - the suspected perpetrator was found dead. - It will take a very long time before we close this case, says Thomas Johansson, police spokesperson.", "title_original": "Skolor håller öppet efter mordförsöket i Alvesta", "summary_original": "Dagar efter sommaravslutningen öppnar skolor i Alvesta för elever och vårdnadshavare. I helgen utsattes två flickor för mordförsök – den misstänkte gärningsmannen hittades död. – Det kommer att ta väldigt lång tid innan vi stänger det här ärendet, säger Thomas Johansson, polisens presstalesperson.", "link": "https://www.dn.se/sverige/skolor-haller-oppet-efter-mordforsoket-i-alvesta/", "date_display": "2026-06-15", "date_iso": "2026-06-15T10:06:59+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 50, "title": "The situation is still critical for the girls - after the act of violence", "summary": "The alarm about a serious incident came to the police at 10.58 on Saturday. - We sent many resources to the scene, says police spokesperson Thomas Johansson. On site at the villa outside Alvesta, two injured girls were found who were taken by ambulance to hospital in Växjö. Now they are cared for in Lund.  One of the girls suffered life-threatening injuries and the other was seriously injured.  - What I realized during the morning was that the damage situation is the same, said the police on Monday. The perpetrator was found dead Shortly before half past two on Saturday afternoon, the suspected perpetrator was found dead near the villa.  The police have carried out a technical examination and a forensic examination of the suspect is to be carried out. - It is a very tragic case. The preliminary investigation is aimed at clarifying the sequence of events, says Thomas Johansson. Details: Father and daughters The police confirm that there is a relationship between the suspected perpetrator and the two girls, but otherwise do not want to go into details. According to information to TV4 Nyheterna, it is about a father and his two daughters. The Smålandsposten states that the family was known to the social service in Alvesta after suspicions that the father abused the mother in the spring of 2025. The mother allegedly tried to get a divorce for several years, something the husband appealed several times. On June 11, the divorce was finally settled, Smålandsposten writes. The mother is said to have been in contact with social services in close connection with the incident and at a meeting a few days earlier, on June 8, she is said to have expressed her concern for the children and warned of the father's aggressive behaviour, according to Smålandsposten. The newspaper states that the father allegedly showed anger during the meeting and that the mother was worried that the situation would escalate. The municipality supports The police state that it is an isolated incident.  - It is important to emphasize that there are not several perpetrators, says Thomas Johansson. According to the police, it will take time before m", "title_original": "Läget fortfarande kritiskt för flickorna – efter våldsdådet", "summary_original": "Larmet om en allvarlig händelse kom till polisen klockan 10.58 på lördagen. – Vi skickade många resurser till platsen, säger polisens presstalesperson Thomas Johansson. På plats vid villan utanför Alvesta hittades två skadade flickor som fördes med ambulans till sjukhus i Växjö. Nu vårdas de i Lund.  En av flickorna fick livshotande skador och den andra blev allvarligt skadad.  – Det jag fick till mig under morgonen var att skadeläget är det samma, säger polisen på måndagen. Gärningsmannen hittades död Strax innan halv två på lördagseftermiddagen påträffades den misstänkte gärningsmannen död i närheten av villan.  Polisen har genomfört en teknisk undersökning och en rättsmedicinsk undersökning av den misstänkte mannen ska genomföras. – Det är ett mycket tragiskt ärende. Förundersökningen är inriktad på att klargöra händelseförloppet, säger Thomas Johansson. Uppgifter: Pappa och döttrar Polisen bekräftar att det finns en relation mellan den misstänkte gärningsmannen och de två flickorna, men vill i övrigt inte gå in på detaljer. Enligt uppgifter till TV4 Nyheterna handlar det om en pappa och hans två döttrar. Smålandsposten uppger att familjen varit kända av socialtjänsten i Alvesta efter misstankar om att pappan misshandlat mamman under våren 2025. Mamman ska under flera år ha försökt skilja sig, något mannen överklagat flera gånger. Den 11 juni blev skilsmässan slutgiltigt klar, skriver Smålandsposten. Mamman ska ha haft kontakt med socialtjänsten i nära anslutning till händelsen och vid ett möte dagarna tidigare, den 8 juni, ska hon ha uttryckt sin oro för barnen och varnat för pappans aggressiva beteende, enligt Smålandsposten. Tidningen uppger att pappan ska ha uppvisat ilska under mötet och att mamman var orolig för att situationen skulle eskalera. Kommunen stöttar  Polisen uppger att det handlar om en enskild händelse.  – Det är viktigt att poängtera att det inte finns flera gärningspersoner, säger Thomas Johansson. Enligt polisen kommer det att ta tid innan man kan ge en fullständig bild av vad som hänt. Efter händelsen har Alvesta kommun aktiverat sin krisledning. Under måndagen håller skolor i Alvesta öppet för elever och vårdnadshavare som behöver stöd eller samtal. Alvesta kyrka håller öppet under dagen för den som vill samlas eller söka stöd.", "link": "https://www.tv4.se/artikel/6CV0Dy5N60nVgYh7Q0iQtx/laeget-fortfarande-kritiskt-foer-flickorna-efter-valdsdadet", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:53:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/alvesta", "/polisen", "/brott"]}, {"id": 51, "title": "Spy suspect denies – wanted open doors", "summary": "The 34-year-old man who is charged with attempted espionage on behalf of Russia denies any wrongdoing. He stated that when the main hearing began in the Stockholm district court. He also objected to the court's in camera order.", "title_original": "Spionmisstänkt nekar – ville ha öppna dörrar", "summary_original": "Den 34-årige man som är åtalad för försök till spioneri för Rysslands räkning nekar till brott. Det uppgav han när huvudförhandlingen inleddes i Stockholms tingsrätt. Han motsatte sig också rättens beslut om stängda dörrar.", "link": "https://www.svd.se/a/rrdjkA/spionmisstankt-nekar-ville-ha-oppna-dorrar", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:49:14+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 52, "title": "The UK completely bans social media for children under 16", "summary": "LONDON. Youtube, Instagram, Tiktok and Snapchat are banned for UK children under 16. The Labor government is also introducing a digital curfew for 16- and 17-year-olds to stop late-night scrolling.", "title_original": "Storbritannien totalförbjuder sociala medier för barn under 16 år", "summary_original": "LONDON. Youtube, Instagram, Tiktok och Snapchat förbjuds för brittiska barn under 16 år. Labourregeringen inför även ett digitalt utegångsförbud för 16- och 17-åringar för att stoppa nattligt scrollande.", "link": "https://www.dn.se/varlden/storbritannien-totalforbjuder-sociala-medier-for-barn-under-16-ar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:48:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 53, "title": "The best and worst midsummer weather ever", "summary": "Which Midsummer's Eve has had the best weather of all time? And which one has had the worst? According to SMHI's compiled data, there are two years that particularly stand out. A year when it was over 30 degrees hot in several places on Midsummer's Eve.", "title_original": "Det bästa och det sämsta midsommarvädret genom tiderna", "summary_original": "Vilken midsommarafton har haft det bästa vädret genom alla tider? Och vilken har haft det allra sämsta? Enligt SMHI:s sammanställda data finns det två år som särskilt sticker ut. Ett år då det var över 30 grader varmt på flera håll på midsommarafton.", "link": "https://www.dn.se/sverige/det-basta-och-det-samsta-midsommarvadret-genom-tiderna/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:41:44+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 54, "title": "The star defender leaves Chelsea - ready for Real Madrid", "summary": "Left-back Marc Cucurella, 27, is leaving Premier League club Chelsea. The Spaniard has signed a six-year contract with Spanish giants Real Madrid.", "title_original": "Stjärnbacken lämnar Chelsea – klar för Real Madrid", "summary_original": "Vänsterbacken Marc Cucurella, 27, lämnar Premier League-klubben Chelsea. Spanjoren har skrivit på ett sexårskontrakt med spanska giganten Real Madrid.", "link": "https://www.sydsvenskan.se/sport/stjarnbacken-lamnar-chelsea-klar-for-real-madrid/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:41:23+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 55, "title": "Got hand chopped off with machete - two get jail time", "summary": "A teenage boy had his hand chopped off with a machete. Now two young men are sentenced to prison for 6.5 and 3.5 years respectively.", "title_original": "Fick hand avhuggen med machete – två får fängelse", "summary_original": "En pojke i tonåren fick sin hand avhuggen med en machete. Nu döms två unga män till fängelse i 6,5 respektive 3,5 år.", "link": "https://www.sydsvenskan.se/sverige/fick-hand-avhuggen-med-machete-tva-far-fangelse/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:37:54+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 56, "title": "Olle Svenning: Open anti-Semitism is dividing the left in France", "summary": "In the parliamentary elections two years ago, the French left formed a new \"popular front\". Today, Jean-Luc Mélenchon's anti-Semitic inspired electoral strategy has pulverized all cooperation. It opens the way for a far-right president, writes Olle Svenning.", "title_original": "Olle Svenning: Den öppna antisemitismen splittrar vänstern i Frankrike", "summary_original": "Vid parlamentsvalen för två år sedan bildade den franska vänstern en ny ”folkfront”. I dag har Jean-Luc Mélenchons antisemitiskt inspirerade valstrategi pulvriserat allt samarbete. Det öppnar för en högerextrem president, skriver Olle Svenning.", "link": "https://www.dn.se/kultur/olle-svenning-den-oppna-antisemitismen-splittrar-vanstern-i-frankrike/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:33:40+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 57, "title": "No one knows anything at all - just guessing", "summary": "Before the Sweden-Tunisia match, nobody in the studio knows anything at all - but time has to be passed and you can always guess.", "title_original": "Ingen vet något alls – killgissar", "summary_original": "Före matchen Sverige–Tunisien vet ingen i studion just någonting alls – men tid ska fördrivas och man kan ju alltid gissa.", "link": "https://www.svd.se/a/L4jOpP/bara-killgissningar-i-svt-infor-sverigetunisien-kommentar-av-jan-soderqvist", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:30:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Kultur"]}, {"id": 58, "title": "Reader question: Can you ignore your partner and go on your own holiday?", "summary": "They are newly retired, she longs for excitement and wants to go out and travel while he just wants to relax on the sofa. Can she travel without him, even though he doesn't want to? Farshid Jalalvand ponders.", "title_original": "Läsarfrågan: Kan man strunta i partnern och åka på egen semester?", "summary_original": "De är nyblivna pensionärer, hon längtar efter spänning och vill ut och resa medan han bara vill ta det lugnt i soffan. Kan hon resa utan honom, trots att han inte vill det? Farshid Jalalvand funderar.", "link": "https://www.sydsvenskan.se/inpa-livet/lasarfragan-kan-man-strunta-i-partnern-och-aka-pa-egen-semester/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:30:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 59, "title": "Makes a difference - that's how expensive the theme parks are", "summary": "It's not just the carousels that are leaving. Admission, meals and ice cream can make visiting a theme park a very expensive affair.  But there are tricks to use.", "title_original": "Skiljer tusenlappar – så dyra är nöjesparkerna", "summary_original": "Det är inte bara karusellerna som drar iväg. Inträde, måltider och glass kan göra besöket på en nöjespark till ett riktigt dyrt nöje.  Men det finns knep att ta till.", "link": "https://www.svd.se/a/wrK3XP/liseberg-och-grona-lund-har-de-dyraste-intradena", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:28:04+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 60, "title": "First international match in Malmö in twelve years: \"A big advantage\"", "summary": "For the first time in twelve years, the women's national handball team will play an international match in Malmö. Sweden will meet Iceland in the Baltic Hall on November 26, the week before the European Championship which will be played in the Czech Republic, Poland, Romania, Slovakia and Turkey.", "title_original": "Första landskampen i Malmö på tolv år: ”En stor fördel”", "summary_original": "För första gången på tolv år kommer damlandslaget i handboll att spela en landskamp i Malmö. Sverige möter Island i Baltiska hallen den 26 november, veckan före EM som spelas i Tjeckien, Polen, Rumänien, Slovakien och Turkiet.", "link": "https://www.sydsvenskan.se/sport/forsta-landskampen-i-malmo-pa-tolv-ar-en-stor-fordel/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:18:14+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 61, "title": "Letter to the editor. First-generation Swedes are indispensable", "summary": "LETTER TO THE EDITOR. Ethnic Swedes on the right wing may find it difficult to get excited when the national football team is playing. This should lead to reflection by those who run Swedish migration policy, writes Hans Skagerlind.", "title_original": "Insändare. Första generationens svenskar är oumbärliga", "summary_original": "INSÄNDARE. Etniska svenskar på högerkanten kan ha svårt för att entusiasmeras då fotbollslandslaget spelar. Detta bör leda till eftertanke hos de som driver svensk migrationspolitik, skriver Hans Skagerlind.", "link": "https://www.dn.se/insandare/forsta-generationens-svenskar-ar-oumbarliga/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:14:57+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 62, "title": "Bjuv's associations will be walking at night all summer", "summary": "The municipality gives 45,000 kroner to the Night Walkers in Bjuv to engage the associations for ten weeks this summer.  - If all goes well, we will basically cover every day of the week, all summer, says Susanne Bakken from Nattvanderna.", "title_original": "Bjuvs föreningar ska nattvandra hela sommaren", "summary_original": "Kommunen ger 45 000 kronor till Nattvandrarna i Bjuv för att engagera föreningarna under tio veckor i sommar.  – Om allt går vägen så kommer vi i princip att täcka alla dagar i veckan, hela sommaren, säger Susanne Bakken från Nattvandrarna.", "link": "https://www.hd.se/bjuv/bjuvs-foreningar-ska-nattvandra-hela-sommaren/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:13:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 63, "title": "Zlatan dissed Sweden - hung out with Trump", "summary": "Swedish World Cup premiere - then Zlatan Ibrahimovic chose something completely different. The former striker appeared at the UFC gala hosted by President Donald Trump at the White House. - It feels fantastic, Ibrahimovic said.", "title_original": "Zlatan dissade Sverige – hängde med Trump", "summary_original": "Svensk VM-premiär – då valde Zlatan Ibrahimovic något helt annat. Forne anfallaren dök på UFC-galan som arrangerades av president Donald Trump i Vita huset. – Det känns fantastiskt, sade Ibrahimovic.", "link": "https://www.sydsvenskan.se/sport/zlatan-dissade-sverige-hangde-med-trump/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:10:45+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "19-year-old had his hand chopped off - two sentenced to prison", "summary": "In a brutal attack at Vinterviken in Stockholm, a 19-year-old had his hand chopped off. The crime was aimed at the wrong person and was only stopped when a group of joggers happened to pass by. Now two young men are sentenced to prison for extremely serious assault.", "title_original": "19-åring fick handen avhuggen – två döms till fängelse", "summary_original": "I en brutal attack vid Vinterviken i Stockholm fick en 19-åring handen avhuggen. Dådet var riktat mot fel person och avbröts först när ett gäng joggare råkade passera. Nu döms två unga män till fängelse för synnerligen grov misshandel.", "link": "https://www.dn.se/sverige/19-aring-fick-handen-avhuggen-tva-doms-till-fangelse/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:08:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 65, "title": "LKAB receives permission for continued operations", "summary": "LKAB receives a new environmental permit for continued and expanded mining operations in Malmberget in Gällivare. The mining group also receives permission to build a plant for fossil-free sponge iron, according to a judgment in the Land and Environmental Court in Umeå.", "title_original": "LKAB får tillstånd för fortsatt verksamhet", "summary_original": "LKAB får nytt miljötillstånd för fortsatt och utökad gruvverksamhet i Malmberget i Gällivare. Gruvkoncernen får även tillstånd att bygga en anläggning för fossilfri järnsvamp, enligt en dom i Mark- och miljödomstolen i Umeå.", "link": "https://www.svd.se/a/q6kBlg/lkab-far-tillstand-for-fortsatt-verksamhet", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:06:45+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 66, "title": "The minister was persecuted – three are convicted", "summary": "One evening in September, Carl-Oskar Bohlin (M), Minister for Civil Defense, was pursued by Palestine activists when he was on his way home from a meeting with the moderate parliamentary group. The persons had participated in a permitted demonstration at Mynttorget in central Stockholm. In a 3 minute and 21 second long video clip that the minister himself published, around ten people can be seen walking behind him shouting slogans and filming. The protesters were heard shouting \"Shame on you\" and \"You have blood on your hands\", as well as urging him to leave his job.  - I didn't have time to take more than a few steps outside the Riksdag building before a lynch mob appeared and started chasing me. I then realized that I cannot go home, because my address here in Stockholm is not public, Carl-Oskar Bohlin has said in an interview with TV4 Nyheterna.  Criticizes the Palestine movement Now three people are sentenced for molestation.  \"You cannot, under any circumstances, behave in any way and follow people home. To follow and harass elected officials is in this case a criminal act,\" writes Carl-Oskar Bohlin in a text message to TV4 Nyheterna. \"Unfortunately, the development of the Palestinian movement has meant that it was only a matter of time before we ended up here. I can only hope that it prompts reflection in those parts of the Palestinian movement that have made this type of anti-social dominance behavior a central part of their behavior in the public space,\" he continues. The chairman of the Court of Justice says that a minister \"must withstand criticism, political messages and harsh and provocative slogans\", and believes that this is something else. - However, it is not the slogans themselves or the political messages that constitute harassment here. The recklessness and breach of peace consists in the defendants following at a very close distance in a group, filming and shouting loudly at the minister, who was crowded and found himself in an exposed and unsafe situation, says the court's chairman, Chief Councilor Magdalena Hägg Bergvall in a press release", "title_original": "Ministern förföljdes – tre döms", "summary_original": "En kväll i september blev Carl-Oskar Bohlin (M), minister för civilt försvar, förföljd av Palestinaaktivister när han var på väg hem från en träff med den moderata riksdagsgruppen. Personerna hade deltagit i en tillståndsgiven demonstration vid Mynttorget i centrala Stockholm. I ett 3 minuter och 21 sekunder långt videoklipp som ministern själv publicerat syns hur runt tio personer går bakom honom och ropar slagord och filmar. Demonstranterna hördes ropa ”Shame on you” och ”Du har blod på dina händer”, samt uppmana honom att lämna sitt jobb.  – Jag hann inte ta mer än några steg utanför riksdagshuset innan det kom fram en lynchmobb som började förfölja mig. Jag insåg då att jag inte kan gå hem, därför att min adress här i Stockholm inte är offentlig, har Carl-Oskar Bohlin sagt i en intervju med TV4 Nyheterna.  Kritiserar Palestinarörelsen Nu döms tre personer för ofredande.  ”Man kan inte under vilka former som helst bete sig hur som helst och förfölja folk hem till bostaden. Att förfölja och trakassera folkvalda är i detta fall en brottslig gärning”, skriver Carl-Oskar Bohlin i ett sms till TV4 Nyheterna. ”Palestinarörelsens utveckling har tyvärr gjort att det bara var en tidsfråga innan vi hamnade här. Jag kan bara hoppas att det stämmer till eftertanke i de delar av palestinarörelsen som gjort denna typ av antisocialt dominansbeteende till en central del av sitt uppträdande i det offentliga rummet”, fortsätter han. En frias Rättens ordförande säger att en minister ”måste tåla kritik, politiska budskap samt hårda och provocerande slagord”, och menar att det här är något annat. – Det är emellertid inte slagorden i sig eller de politiska budskapen som här utgör ett ofredande. Hänsynslösheten och fridskränkningen består i att de tilltalade på mycket nära avstånd i grupp följt efter, filmat och skrikit högt mot ministern, som blivit trängd och befunnit sig i en utsatt och otrygg situation säger rättens ordförande chefsrådmannen Magdalena Hägg Bergvall i ett pressmeddelande. De tre personerna döms till dagsböter. En person frias från åtalet, eftersom rätten kommit fram till att denne endast dokumenterat händelsen genom att filma.", "link": "https://www.tv4.se/artikel/3tCSzk0OgMrWZ0scpvdJSv/ministern-foerfoeljdes-tre-doems", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:04:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/carl-oskar-bohlin-m", "/ofredande"]}, {"id": 67, "title": "Three are sentenced for molestation - persecuted minister", "summary": "", "title_original": "Tre döms för ofredande – förföljde minister", "summary_original": "", "link": "https://www.svd.se/a/43mAeG/tre-doms-for-ofredande-forfoljde-minister", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:03:07+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 68, "title": "First departure of the Snälltåget to Oslo", "summary": "The premiere trip for Snälltåget's new line between Malmö and Oslo attracted both train enthusiasts and vacationers to Malmö C early on Monday.", "title_original": "Första avgången för Snälltåget till Oslo", "summary_original": "Premiärturen för Snälltågets nya linje mellan Malmö och Oslo lockade både tågentusiaster och semesterfirare till Malmö C tidigt på måndagen.", "link": "https://www.sydsvenskan.se/malmo/forsta-avgangen-for-snalltaget-till-oslo/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:01:03+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 69, "title": "Bus plunged into ravine – many dead in Ethiopia", "summary": "A bus was on its way to Ethiopia's capital Addis Ababa when it plunged into a 100-meter-deep ravine. At least 28 people died, according to local authorities.", "title_original": "Buss störtade ner i ravin – många döda i Etiopien", "summary_original": "En buss var på väg mot Etiopiens huvudstad Addis Abeba när den störtade ner i en 100 meter djup ravin. Minst 28 människor dog, enligt lokala myndigheter.", "link": "https://www.sydsvenskan.se/varlden/buss-stortade-ner-i-ravin-manga-doda-i-etiopien/", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:00:02+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 70, "title": "\"Nimby groups hinder Stockholm's development\"", "summary": "It is a sign of health for cities if their central areas are densified. That local nimby groups and politicians can block development is unsustainable, writes Rutger Brattström, Timbro, in a reply.", "title_original": "”Nimby-grupper hindrar Stockholms utveckling”", "summary_original": "Det är ett hälsotecken för städer om deras centrala områden förtätas. Att lokala nimby-grupper och politiker kan blockera utveckling är ohållbart, skriver Rutger Brattström, Timbro, i en replik.", "link": "https://www.svd.se/a/oE7a3m/nimby-grupper-som-malarhojdsforeningen-blockerar-utveckling-skriver-rutger-brattstrom", "date_display": "2026-06-15", "date_iso": "2026-06-15T09:00:00+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Debatt"]}, {"id": 71, "title": "Is there good healthcare in Scania?", "summary": "", "title_original": "Bra sjukvård i Skåne, finns det?", "summary_original": "", "link": "https://www.hd.se/min-mening/bra-sjukvard-i-skane-finns-det/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:58:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 72, "title": "Bus plunged into ravine - many dead", "summary": "A bus was on its way to Ethiopia's capital Addis Ababa when it plunged into a 100-meter-deep ravine. At least 28 people died, according to local authorities.", "title_original": "Buss störtade ner i ravin – många döda", "summary_original": "En buss var på väg mot Etiopiens huvudstad Addis Abeba när den störtade ner i en 100 meter djup ravin. Minst 28 människor dog, enligt lokala myndigheter.", "link": "https://www.hd.se/varlden/buss-stortade-ner-i-ravin-manga-doda/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:57:59+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "Why are the Christmas decorations still up?", "summary": "", "title_original": "Varför sitter julpyntet fortfarande uppe?", "summary_original": "", "link": "https://www.hd.se/min-mening/varfor-sitter-julpyntet-fortfarande-uppe/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:57:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "The couple Agerhäll and Rönndahl do a comedy show", "summary": "Marie Agerhäll and Jesper Rönndahl have, among other things, made the TV series \"Dips\" together. Now the married couple are setting up a comedy show together with a premiere this autumn.", "title_original": "Paret Agerhäll och Rönndahl gör humorshow", "summary_original": "Marie Agerhäll och Jesper Rönndahl har bland annat gjort tv-serien ”Dips” ihop. Nu sätter det äkta paret upp en humorshow tillsammans med premiär i höst.", "link": "https://www.hd.se/noje/paret-agerhall-och-ronndahl-gor-humorshow/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:52:30+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "Russian-born conductor donates million prize to Ukraine", "summary": "The Russian-born conductor Kirill Petrenko surprised the audience when he received the prestigious Léonie Sonnings Music Prize in Copenhagen. He is donating the prize of 1 million Danish kroner to those affected by the war in Ukraine, Danmarks Radio writes.", "title_original": "Ryskfödd dirigent skänker miljonpris till Ukraina", "summary_original": "Den ryskfödde dirigenten Kirill Petrenko överraskade publiken när han tog emot anrika Léonie Sonnings musikpris i Köpenhamn. Priset på 1 miljon danska kronor skänker han till de som drabbas av kriget i Ukraina, skriver Danmarks Radio.", "link": "https://www.sydsvenskan.se/noje/ryskfodd-dirigent-skanker-miljonpris-till-ukraina/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:51:22+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Midsummer plate cheaper this year", "summary": "The VAT reduction on food means that midsummer food will be cheaper this year than last year.", "title_original": "Midsommartallriken billigare i år", "summary_original": "Momssänkningen på livsmedel innebär att midsommarmaten blir billigare i år än föregående år.", "link": "https://www.sydsvenskan.se/ekonomi/midsommartallriken-billigare-i-ar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:48:49+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "Svanberg's goal second fastest by a substitute in WC history", "summary": "MONTERREY. He has waited a long time for his championship debut. Once it arrived, it was all the faster to score the first championship goal. Mattias Svanberg scored 4–1 against Tunisia and scored the second fastest goal as a substitute in WC history.", "title_original": "Svanbergs mål näst snabbast av en inhoppare i VM-historien", "summary_original": "MONTERREY. Han har väntat länge på mästerskapsdebuten. När den väl kom gick det desto fortare att göra första mästerskapsmålet. Mattias Svanberg satte 4–1 mot Tunisien och gjorde det näst snabbaste målet som inhoppare i VM-historien.", "link": "https://www.dn.se/sport/svanbergs-mal-nast-snabbast-av-en-inhoppare-i-vm-historien/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:44:00+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Jubilation filled Helsingborg's pubs during Sweden's World Cup premiere", "summary": "Contagious joy in Helsingborg when Sweden drove over Tunisia in the WC.", "title_original": "Jubel fyllde Helsingborgs krogar under Sveriges VM-premiär", "summary_original": "Smittande glädje i Helsigborg när Sverige körde över Tunisien i VM.", "link": "https://www.hd.se/helsingborg/jubel-fyllde-helsingborgs-krogar-under-sveriges-vm-premiar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:42:51+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 79, "title": "The property at Kometgatan 36 in Oxie has a new owner", "summary": "", "title_original": "Fastigheten på Kometgatan 36 i Oxie har fått ny ägare", "summary_original": "", "link": "https://www.sydsvenskan.se/fastigheten-pa-kometgatan-36-i-oxie-har-fatt-ny-agare/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:41:45+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "Football fever in the middle of the night - here the fans cheer", "summary": "When Sweden met Tunisia in the World Cup at 04:00, the Sydsvenskan was there and interviewed football fans at both Lördagsplan and Vinny's, which is open at night.", "title_original": "Fotbollsfeber mitt i natten – här jublar fansen", "summary_original": "När Sverige mötte Tunisien i VM klockan 04.00 var Sydsvenskan på plats och intervjuade fotbollsfans på både Lördagsplan och nattöppna Vinny's.", "link": "https://www.sydsvenskan.se/fotbollsfeber-mitt-i-natten-har-jublar-fansen/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:39:37+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "The Ebola outbreak is growing: More dead and infected", "summary": "The dreaded Ebola hemorrhagic fever is claiming more and more victims in Congo-Kinshasa. The number of dead is now 181, Congolese authorities announce.", "title_original": "Ebolautbrottet växer: Fler döda och smittade", "summary_original": "Den fruktade blödarfebern ebola skördar allt fler offer i Kongo-Kinshasa. Antalet döda är nu 181, meddelar kongolesiska myndigheter.", "link": "https://www.sydsvenskan.se/varlden/ebolautbrottet-vaxer-fler-doda-och-smittade/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:39:03+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "Letter to the editor. Answer: 200 Afghans convicted of crimes must be able to be deported", "summary": "RESPONSE TO POSTERS. The government does not hold talks with the Taliban regime at a political level, nor does it legitimize the regime in Kabul. It is therefore not true that we are giving the green light to oppression in Afghanistan, writes Migration Minister Johan Forssell (M).", "title_original": "Insändare. Svar: 200 brottsdömda afghaner måste kunna utvisas", "summary_original": "SVAR PÅ INSÄNDARE. Regeringen för inte samtal med talibanregimen på politisk nivå och legitimerar inte heller regimen i Kabul. Det är alltså inte sant att vi ger grönt ljus till förtryck i Afghanistan, skriver migrationsminister Johan Forssell (M).", "link": "https://www.dn.se/insandare/svar-200-brottsdomda-afghaner-maste-kunna-utvisas/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:33:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 83, "title": "Deficiencies in hygiene and working environment in nail salons", "summary": "During an inspection of nail salons in Helsingborg, a number of deficiencies could be reported. Among other things, there were problems with hygiene, working environment and cash registers. One salon was so dirty it was forced to close.", "title_original": "Brister i hygien och arbetsmiljö på nagelsalonger", "summary_original": "Vid en kontroll av nagelsalonger i Helsingborg kunde en rad brister rapporteras. Bland annat fanns problem med hygien, arbetsmiljö och kassaregister. En salong var så smutsig att den tvingades stänga.", "link": "https://www.hd.se/helsingborg/brister-i-hygien-och-arbetsmiljo-pa-nagelsalonger/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:19:48+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 84, "title": "Zlatan dissed Sweden - hung out with Trump", "summary": "Swedish World Cup premiere - then Zlatan Ibrahimovic chose something completely different. The former striker appeared at the UFC gala hosted by President Donald Trump at the White House. - It feels fantastic, Ibrahimovic said.", "title_original": "Zlatan dissade Sverige – hängde med Trump", "summary_original": "Svensk VM-premiär – då valde Zlatan Ibrahimovic något helt annat. Forne anfallaren dök på UFC-galan som arrangerades av president Donald Trump i Vita huset. – Det känns fantastiskt, sade Ibrahimovic.", "link": "https://www.hd.se/sport/zlatan-dissade-sverige-hangde-med-trump/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:17:21+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 85, "title": "The Bergvall family's jubilation in Monterrey: \"It just exploded\"", "summary": "MONTERREY. There were no limits to the joy among the Swedish supporters in Monterrey after Sweden made the historic crushing against Tunisia with 5-1 in the World Cup premiere. - It was beyond all expectations, says Andreas Bergvall, father of the substitute Lucas Bergvall.", "title_original": "Familjen Bergvalls jubel i Monterrey: ”Det bara exploderade”", "summary_original": "MONTERREY. Det fanns inga gränser för glädjen bland de svenska supportrarna i Monterrey efter att Sverige gjort den historiska krossen mot Tunisien med 5–1 i VM-premiären. – Det var över alla förväntningar, säger Andreas Bergvall, pappa till inhopparen Lucas Bergvall.", "link": "https://www.dn.se/sport/familjen-bergvalls-jubel-i-monterrey-det-bara-exploderade/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:11:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 86, "title": "Anything can go wrong – and for Trump it is a strategic defeat", "summary": "", "title_original": "Allt kan gå fel – och för Trump är det ett strategiskt nederlag", "summary_original": "", "link": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:11:22+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 87, "title": "Defending his European Championship gold: \"Has longed\"", "summary": "Spades Dam's Nora Johansson got to step on top of the podium during the EC in Odense, Denmark.", "title_original": "Försvarar sitt EM-guld: ”Har längtat”", "summary_original": "Spader Dams Nora Johansson fick kliva högst upp på pallen under EM i danska Odense.", "link": "https://www.hd.se/sport/forsvarar-sitt-em-guld-har-langtat/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:11:18+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 88, "title": "Social media is banned for young people in the UK", "summary": "The UK is to ban under-16s from using several different social media apps.", "title_original": "Sociala medier förbjuds för unga i Storbritannien", "summary_original": "Storbritannien ska förbjuda personer under 16 år att använda flera olika appar för sociala medier.", "link": "https://www.sydsvenskan.se/varlden/sociala-medier-forbjuds-for-unga-i-storbritannien/", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:10:55+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 89, "title": "\"The question is whether it's just a break\"", "summary": "", "title_original": "”Frågan är om det bara är en paus”", "summary_original": "", "link": "https://www.tv4.se/artikel/yDCC98RV7YRTAHfwwXf32/fragan-aer-om-det-bara-aer-en-paus", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:03:54+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mellanöstern", "/mellanostern"]}, {"id": 90, "title": "Fresh start for the Norwegian royal house?", "summary": "Scandals and crises have created enormous attention around the Norwegian royal house. Is it over now, after the verdict against the Bonus Prince? Could this be the restart the court needs?", "title_original": "Nystart för norska kungahuset?", "summary_original": "Skandaler och kriser har skapat en enorm uppmärksamhet kring det norska kungahuset. Är det över nu, efter domen mot Bonusprinsen? Kan detta bli den omstart hovet behöver?", "link": "https://www.svd.se/a/2pmgEa/kan-domen-mot-marius-hoeiby-innebara-en-omstart-for-det-norska-kungahuset", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:03:49+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 91, "title": "Zlatan dissed Sweden - for Trump", "summary": "Swedish World Cup premiere - then Zlatan Ibrahimovic chose something completely different. The former striker appeared at the UFC gala hosted by President Donald Trump at the White House. - It feels fantastic, Ibrahimovic said.", "title_original": "Zlatan dissade Sverige – för Trump", "summary_original": "Svensk VM-premiär – då valde Zlatan Ibrahimovic något helt annat. Forne anfallaren dök på UFC-galan som arrangerades av president Donald Trump i Vita huset. – Det känns fantastiskt, sade Ibrahimovic.", "link": "https://www.svd.se/a/GxjAqx/zlatan-dissade-sverige-hangde-med-trump", "date_display": "2026-06-15", "date_iso": "2026-06-15T08:02:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 92, "title": "The Swedish fans in Mexico believe in 1994 again", "summary": "Sweden's fans in Monterrey could hardly believe their eyes when Blågult crushed the Eagles from Carthage in the opening match of the World Cup. Now the supporters believe that we can experience the WC summer of 1994 again.", "title_original": "De svenska fansen i Mexiko tror på nytt 1994", "summary_original": "Sveriges fans i Monterrey trodde knappt sina ögon när Blågult krossade Örnarna från Kartago i premiärmatchen i fotbolls-VM. Nu tror supportarna att vi kan få uppleva VM-sommaren 1994 igen.", "link": "https://www.svd.se/a/OkjARw/de-svenska-fansen-i-mexiko-tror-pa-nytt-1994", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:58:06+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 93, "title": "UFC at the White House: Obama mocked, champion kicked out", "summary": "- Michelle Obama is a man, shouted heavyweight Josh Hokit in his winner's interview at the UFC gala at the White House. Before the event even started, middleweight champion Sean Strickland was ejected by security.", "title_original": "UFC vid Vita huset: Obama hånad, mästare utslängd", "summary_original": "– Michelle Obama är en man, ropade tungviktaren Josh Hokit i sin vinnarintervju på UFC-galan vid Vita huset. Innan evenemanget ens inletts slängdes mellanviktsmästaren Sean Strickland ut av säkerhetsvakter.", "link": "https://www.sydsvenskan.se/varlden/ufc-vid-vita-huset-obama-hanad-mastare-utslangd/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:57:26+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 94, "title": "Potato salad with asparagus and grilled fresh onions", "summary": "Today's dinner tip offers a hearty potato salad with new potatoes, green asparagus, grilled fresh onions and radishes in a creamy dressing with lemon, dijon mustard and mayonnaise.", "title_original": "Potatissallad med sparris och grillad färsk lök", "summary_original": "Dagens middagstips bjuder på en matig potatissallad med färskpotatis, grön sparris, grillad färsk lök och rädisor i en krämig dressing med citron, dijonsenap och majonnäs.", "link": "https://www.tv4.se/artikel/7ytytamYFSF1rE5ueRaP5L/potatissallad-med-sparris-och-grillad-faersk-loek", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:53:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/siri-barje"]}, {"id": 95, "title": "Letter to the editor. The WC victory shows how a mixed Sweden works", "summary": "LETTER TO THE EDITOR. Four of the five Swedish goals in the World Cup opener against Tunisia were scored by players with an immigrant background. The question is why some still hesitate to see them as self-evident parts of Sweden, writes Juan Fonseca, former Member of Parliament for the Social Democrats.", "title_original": "Insändare. VM-segern visar hur ett blandat Sverige fungerar", "summary_original": "INSÄNDARE. Fyra av de fem svenska målen i VM-premiären mot Tunisien gjordes av spelare med invandrarbakgrund. Frågan är varför vissa fortfarande tvekar inför att se dem som självklara delar av Sverige, skriver Juan Fonseca, tidigare riksdagsledamot för Socialdemokraterna.", "link": "https://www.dn.se/insandare/vm-segern-visar-hur-ett-blandat-sverige-fungerar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:42:09+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 96, "title": "Dangerous development when politics wants to control religious communities in detail", "summary": "Christian civil society is a living force that every day makes Sweden stronger, more human and more cohesive, writes Ebba Busch (KD).", "title_original": "Farlig utveckling när politiken vill detaljstyra trossamfund", "summary_original": "Det kristna civilsamhället är en levande kraft som varje dag gör Sverige starkare, mänskligare och mer sammanhållet, skriver Ebba Busch (KD).", "link": "https://www.dagen.se/debatt/farlig-utveckling-naer-politiken-vill-detaljstyra-trossamfund/10389470", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:30:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 97, "title": "Susanne Nyström: There is still a question awaiting an answer", "summary": "What happened on the way? Why did it go wrong? Many are wondering after the historic verdict against Marius Borg Høiby.", "title_original": "Susanne Nyström: Det finns fortfarande en fråga som väntar på svar", "summary_original": "Vad hände på vägen? Varför gick det fel? Det undrar många efter den historiska domen mot Marius Borg Høiby.", "link": "https://www.dn.se/ledare/susanne-nystrom-det-finns-fortfarande-en-fraga-som-vantar-pa-svar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:29:18+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "Britain bans social media for young people", "summary": "", "title_original": "Storbritannien förbjuder sociala medier för unga", "summary_original": "", "link": "https://www.svd.se/a/9p6Ab9/storbritannien-forbjuder-sociala-medier-for-unga", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:19:50+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 99, "title": "Letter to the editor. Don't take it for granted that we understand Potter's English", "summary": "LETTER TO THE EDITOR. An English-speaking national football captain should be translated in the Swedish media so that everyone understands what he is saying. I wonder if Sveriges Radio has any idea how many of the listeners have difficulty understanding English, writes Jonas Borelius.", "title_original": "Insändare. Ta inte för givet att vi begriper Potters engelska", "summary_original": "INSÄNDARE. En engelsktalande förbundskapten i fotboll bör i svenska medier översättas så att alla förstår vad han säger. Jag undrar om Sveriges Radio har koll på hur många av lyssnarna som har svårt att förstå engelska, skriver Jonas Borelius.", "link": "https://www.dn.se/insandare/ta-inte-for-givet-att-vi-begriper-potters-engelska/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:19:31+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 100, "title": "HIF recruits from the English third league: \"Has been in the works for a long time\"", "summary": "HIF has found its offensive reinforcement. Julian Larsson is recruited from England's Burton.", "title_original": "HIF värvar från engelska tredjeligan: ”Har varit på gång länge”", "summary_original": "HIF har hittat sin offensiva förstärkning. Julian Larsson värvas in från engelska Burton.", "link": "https://www.hd.se/sport/hif-varvar-fran-engelska-tredjeligan-har-varit-pa-gang-lange/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:13:05+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 101, "title": "The stock market rises after the Iran deal", "summary": "", "title_original": "Börsen stiger efter Iranavtal", "summary_original": "", "link": "https://www.svd.se/a/8pEAGw/borsen-stiger-efter-iranavtal", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:11:34+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sverige"]}, {"id": 102, "title": "Emma Bouvin: Trump thinks Netanyahu should be grateful - he's not", "summary": "A peace agreement between Iran and the US is complete and is to be signed within a few days. We've heard it before, but this time at least Iran also seems to agree with Trump on the matter. The only problem is that no one invited Israel to the negotiations.", "title_original": "Emma Bouvin: Trump tycker att Netanyahu borde vara tacksam – det är han inte", "summary_original": "Ett fredsavtal mellan Iran och USA är färdigt och ska undertecknas inom några dagar. Vi har hört det förut, men den här gången verkar åtminstone även Iran hålla med Trump om saken. Problemet är bara att ingen bjöd in Israel till förhandlingarna.", "link": "https://www.dn.se/varlden/emma-bouvin-trump-tycker-att-netanyahu-borde-vara-tacksam-det-ar-han-inte/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:10:08+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 103, "title": "Alexander Isak: \"If it continues like this, it will be a lot of fun\"", "summary": "MONTERREY/STOCKHOLM. His form has been uncertain heading into the World Cup, but Alexander Isak opened the championship with a statement. The striker played 90 minutes and was involved in four forward goals in the premiership win over Tunisia. - I was a bit like the rest of the team, good, he says.", "title_original": "Alexander Isak: ”Fortsätter det så här blir det väldigt roligt”", "summary_original": "MONTERREY/STOCKHOLM. Hans form har varit osäker in mot fotbolls-VM, men Alexander Isak öppnade mästerskapet med besked. Anfallaren spelade 90 minuter och var inblandad i fyra mål framåt i premiärsegern över Tunisien. – Jag var lite som resten av laget, bra, säger han.", "link": "https://www.dn.se/sport/alexander-isak-fortsatter-det-sa-har-blir-det-valdigt-roligt/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:08:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 104, "title": "The expert: Cheapest midsummer plate in years", "summary": "Reduced food VAT and falling prices of cereals make the midsummer table more wallet-friendly this year, according to SEB. At the same time, the troubled global situation continues to put pressure on agriculture. - If the production costs increase with weak profitability, then it speaks for the prices going up, says the expert Marcus Widén.", "title_original": "Experten: Billigaste midsommartallriken på flera år", "summary_original": "Sänkt matmoms och sjunkande priser på spannmål gör midsommarbordet mer plånboksvänlig i år, enligt SEB. Samtidigt fortsätter det oroliga omvärldsläget att pressa lantbruket. – Om produktionskostnaderna ökar med svag lönsamhet så talar det för att priserna ska upp, säger experten Marcus Widén.", "link": "https://www.dn.se/ekonomi/experten-billigaste-midsommartallriken-pa-flera-ar/", "date_display": "2026-06-15", "date_iso": "2026-06-15T07:00:29+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 105, "title": "New spa inaugurated - this is how Rusthållargården in Arild wants to attract guests all year round", "summary": "After several years of waiting, Rusthållargården in Arild has opened an outdoor spa section. The investment will give guests a holistic experience and extend the season at the classic hotel.", "title_original": "Nytt spa invigt – så vill Rusthållargården i Arild locka gäster året runt", "summary_original": "Efter flera års väntan har Rusthållargården i Arild öppnat en utomhusspaavdelning. Satsningen ska ge gästerna en helhetsupplevelse och förlänga säsongen på det klassiska hotellet.", "link": "https://www.hd.se/hoganas/nytt-spa-invigt-sa-v sions are heard in Lebanon", "summary": "The agreement between the United States and Iran does not apply to Israel, a far-right minister in the Israeli government objects. Israel's military intends to remain in southern Lebanon. New skirmishes are reported there.", "title_original": "Skepsis i Israel – nya smällar hörs i Libanon", "summary_original": "Överenskommelsen mellan USA och Iran gäller inte Israel, invänder en högerextrem minister i den israeliska regeringen. Israels militär avser att stanna kvar i södra Libanon. Där rapporteras nya skärmytslingar.", "link": "https://www.svd.se/a/n14jWd/minister-avtalet-galler-inte-israel", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:51:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 109, "title": "The bonus prince is convicted of rape: \"She slept\"", "summary": "OSLO. Marius Borg Høiby is sentenced to four years in prison. The Norwegian crown princess's son is convicted of two filmed sleep rapes, but acquitted at the same time of two others.", "title_original": "Bonusprinsen fälls för våldtäkter: ”Hon sov”", "summary_original": "OSLO. Marius Borg Høiby döms till fyra års fängelse. Den norska kronprinsessans son fälls för två filmade sovvåldtäkter, men frikänns samtidigt för två andra.", "link": "https://www.dn.se/varlden/bonusprinsen-doms-till-fangelse/", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:49:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 110, "title": "The \"bonus prince\" is sentenced to four years in prison", "summary": "The Norwegian \"bonus prince\" Marius Borg Høiby is sentenced to four years in prison. He has been charged with around 40 crimes in one of the country's most high-profile trials.", "title_original": "”Bonusprinsen” döms till fyra års fängelse", "summary_original": "Den norska ”bonusprinsen” Marius Borg Høiby döms till fyra års fängelse. Han har stått åtalad för ett 40-tal brott i en av landets mest uppmärksammade rättegångar.", "link": "https://www.svd.se/a/9p6d7r/bonusprinsen-doms-till-fyra-ars-fangelse", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:34:46+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 111, "title": "124 square meter house in Munka-Ljungby bought for 1.9 million", "summary": "", "title_original": "124 kvadratmeter stort hus i Munka-Ljungby köpt för 1,9 miljoner", "summary_original": "", "link": "https://www.hd.se/angelholm/124-kvadratmeter-stort-hus-i-munka-ljungby-kopt-for-19-miljoner/", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:23:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 112, "title": "Carolina Stanley Cup champions: \"So proud\"", "summary": "Carolina has won the Stanley Cup for the second time. Vegas was defeated with a clear 3-0 last night. - What a fight. The guys really fought today, my God, Carolina captain Jordan Staal told nhl.com.", "title_original": "Carolina Stanley Cup-mästare: ”Så stolt”", "summary_original": "Carolina har för andra gången vunnit Stanley Cup. Vegas besegrades med klara 3–0 i natt. – Vilken kamp. Killarna kämpade verkligen i dag, herregud, säger Carolina-kaptenen Jordan Staal till nhl.com.", "link": "https://www.dn.se/sport/carolina-stanley-cup-mastare-sa-stolt/", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:17:54+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 113, "title": "Marius Borg Høiby is sentenced to four years in prison - for 36 crimes", "summary": "Assault and rape • Damages of over 600,000", "title_original": "Marius Borg Høiby döms till fyra års fängelse – för 36 brott", "summary_original": "Misshandel och våldtäkt • Skadestånd på över 600 000", "link": "https://www.tv4.se/artikel/29c3jk2AR3uxXEtUGr9FWp/nu-faller-domen-mot-bonusprinsen-marius-borg-hoiby", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:14:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 114, "title": "UFC at the White House: Obama mocked, champion kicked out", "summary": "- Michelle Obama is a man, shouted heavyweight Josh Hokit in his winner's interview at the UFC gala at the White House. Before the event even started, middleweight champion Sean Strickland was ejected by security.", "title_original": "UFC vid Vita huset: Obama hånad, mästare utslängd", "summary_original": "– Michelle Obama är en man, ropade tungviktaren Josh Hokit i sin vinnarintervju på UFC-galan vid Vita huset. Innan evenemanget ens inletts slängdes mellanviktsmästaren Sean Strickland ut av säkerhetsvakter.", "link": "https://www.svd.se/a/WvkKlk/ufc-vid-vita-huset-obama-hanad-mastare-utslangd", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:11:16+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Världen"]}, {"id": 115, "title": "AI combat is likened to nuclear weapons", "summary": "Good morning! Anthropic stops new model and creates concern in the outside world, Microsoft's CEO urges companies to combine human and AI capital, and concerns about the technology are simmering in Sweden.", "title_original": "AI-kamp liknas med kärnvapen", "summary_original": "God morgon! Anthropic stoppar ny modell och skapar oro i omvärlden, Microsofts vd uppmanar bolag att kombinera mänskligt och AI-kapital, och oron för tekniken pyr i Sverige.", "link": "https://www.svd.se/a/k0QO9j/ai-kamp-liknas-med-karnvapen", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:07:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Näringsliv"]}, {"id": 116, "title": "Joy and emotional storms when there was a mass baptism in Stockholm", "summary": "\"Fantastically big, it's the biggest thing you can experience\"", "title_original": "Glädje och känslostormar när det hölls massdop i Stockholm", "summary_original": "”Fantastiskt stort, det är det största som man kan uppleva”", "link": "https://www.dagen.se/nyheter/glaedje-och-kaenslostormar-naer-det-hoells-massdop-i-stockholm/10393718", "date_display": "2026-06-15", "date_iso": "2026-06-15T06:03:18+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 117, "title": "Famous monastery in flames after attacks on Kyiv", "summary": "An almost 1,000-year-old monastery is on fire after the night's Russian attack", "title_original": "Känt kloster i lågor efter attacker mot Kiev", "summary_original": "Ett nästan 1 000 år gammalt kloster står i brand efter nattens ryska attack", "link": "https://www.dagen.se/nyheter/kaent-kloster-i-lagor-efter-attacker-mot-kiev/10394538", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:56:44+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 118, "title": "See the highlights from the blockbuster match", "summary": "", "title_original": "Se höjdpunkterna från succématchen", "summary_original": "", "link": "https://www.tv4.se/artikel/1uFT7vLPcXSYRI5b1Q0eks/se-hoejdpunkterna-fran-succematchen", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:50:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 119, "title": "The good news - the grocery bag has become cheaper: \"Fantastic\"", "summary": "The food price survey, or \"PRO-kassen\" as it is also called, is carried out every year to increase price awareness among the organization's members and the public.  Over a thousand pensioners have collected price information on 42 goods in 736 stores across Sweden. The survey, which is usually carried out in the autumn, was moved this year to the spring to avoid traders lowering prices during the measurement week. The food box has become cheaper Earlier this year, the government halved the VAT on food. This year, PRO's food box has become cheaper, which is mainly explained by the reduced food VAT from 12 to 6 percent.  - Oranges and orange juice have become much cheaper. It's probably because there is a surplus and it didn't last time. All dairy products have also become cheaper. It's nice because it's something we need and it's due to overproduction in Europe, says Åsa Lindestam, chairman of PRO. The exception is, among other things, ground beef, which has become more expensive as a result of the shortage of the product.  Big differences between regions The result shows that Skåne is the cheapest, while Jämtland is the most expensive to shop in. According to Åsa Lindestam, this may be because Jämtland has more small shops, which often means higher prices.  Cross-border trade can also play a role, but PRO believes that the size of the stores is the biggest explanation for the price differences. PRO only measures regular prices, not extra prices, which means that basic goods can also greatly affect the result.  Advice to consumers Åsa Lindestam urges consumers to be price conscious and compare prices between different stores.  - Be price conscious and unfaithful. Look at the price and go to another store and compare to start this awareness. I think it is necessary that we do it today, she says.", "title_original": "Glädjebeskedet – matkassen har blivit billigare: ”Fantastiskt”", "summary_original": "Matprisundersökningen, eller ”PRO-kassen” som den också kallas, genomförs varje år för att öka prismedvetenheten hos organisationens medlemmar och allmänheten.  Över tusen pensionärer har samlat in prisuppgifter på 42 varor i 736 butiker över hela Sverige. Undersökningen, som vanligtvis görs på hösten, flyttades i år till våren för att undvika att handlarna sänker priserna just under mätveckan. Matkassen har blivit billigare Tidigare i år halverade regeringen momsen på livsmedel. I år har PRO:s matkasse blivit billigare, något som främst förklaras just av den sänkta matmomsen från 12 till 6 procent.  – Apelsiner och apelsinjuice har blivit mycket billigare. Det är väl för att det finns ett överskott och det gjorde det inte senast. Alla mejerivaror har också blivit billigare. Det är skönt för det är sådant vi behöver och det beror på en överproduktion i Europa, säger Åsa Lindestam, ordförande för PRO. Undantaget är bland annat nötfärs som blivit dyrare till följd av bristen på varan.  Stora skillnader mellan regioner Resultatet visar att Skåne är billigast medan Jämtland är dyrast att handla i. Enligt Åsa Lindestam kan det bero på att Jämtland har fler små butiker, vilket ofta innebär högre priser.  Gränshandeln kan också spela in, men PRO tror att butikernas storlek är den största förklaringen till prisskillnaderna. PRO mäter endast ordinarie priser, inte extrapriser, vilket gör att basvaror också kan påverka resultatet mycket.  Råd till konsumenter Åsa Lindestam uppmanar konsumenter att vara prismedvetna och jämföra priser mellan olika butiker.  – Var prismedveten och otrogen. Titta på priset och gå till en annan butik och jämför för att få igång det här medvetandet. Jag tror att det är nödvändigt att vi gör det idag, säger hon.", "link": "https://www.tv4.se/artikel/71n1AgcxxXjsktWTADJs50/haer-aer-maten-dyrast-och-billigast-i-landet-fantastiskt", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:41:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/pro", "/matpriserna"]}, {"id": 120, "title": "The fans celebrated the victory with beer for breakfast", "summary": "Blågult won the WC premiere with a whopping 5–1 in Monterrey, Mexico. 9,000 kilometers to the east, Swedish fans celebrated the victory in Stockholm's pubs early on Monday morning. \"It will probably be a good summer,\" says supporter Gabriel.", "title_original": "Fansen firade segern med öl till frukost", "summary_original": "Blågult vann VM-premiären med hela 5–1 i mexikanska Monterrey. 9 000 kilometer österut firade svenska fans segern på Stockholms krogar tidigt under måndagsmorgonen. ”Det blir nog en bra sommar”, säger supportern Gabriel.", "link": "https://www.svd.se/a/q6kdlE/det-blir-nog-en-bra-sommar-i-usa-allsang-pa-tradgarden-i-stockholm", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:38:02+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Sport"]}, {"id": 121, "title": "Four anonymous witnesses with the new law: \"Good outcome\"", "summary": "At least four people have been allowed to testify under secret identities since the law on anonymous witnesses came into force last year. It shows that there is actually a need for the debated law, according to Minister of Justice Gunnar Strömmer (M). - I see this as a very good outcome, he says.", "title_original": "Fyra anonyma vittnen med nya lagen: ”Bra utfall”", "summary_original": "Åtminstone fyra personer har fått vittna under hemlig identitet sedan lagen om anonyma vittnen trädde i kraft förra året. Det visar att det faktiskt finns ett behov av den omdebatterade lagen, enligt justitieminister Gunnar Strömmer (M). – Jag ser det här som ett väldigt bra utfall, säger han.", "link": "https://www.hd.se/sverige/fyra-anonyma-vittnen-med-nya-lagen-bra-utfall/", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:37:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 122, "title": "Crazy good start - even if Sweden got a little help", "summary": "", "title_original": "Galet bra start – även om Sverige fick lite hjälp", "summary_original": "", "link": "https://www.tv4.se/artikel/73UBnej4q2GJiV2ByRRS1X/galet-bra-start-aeven-om-sverige-fick-lite-hjaelp", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:36:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Fotbolls-VM 2026", "/fotbolls-vm-2026"]}, {"id": 123, "title": "Daniel Schatz: The left party only reacts when the media pressure becomes too great", "summary": "The problem is not that the Left Party missed individual candidates, but that people with documented extremism could be nominated. Therefore, the issue should become one of the most important of the election campaign, writes political scientist and author Daniel Schatz.", "title_original": "Daniel Schatz: Vänsterpartiet reagerar först när medietrycket blir för stort", "summary_original": "Problemet är inte att Vänsterpartiet missat enskilda kandidater, utan att personer med dokumenterad extremism kunde nomineras. Därför bör frågan bli en av valrörelsens viktigaste, skriver statsvetaren och författaren Daniel Schatz.", "link": "https://www.dn.se/kultur/daniel-schatz-vansterpartiet-reagerar-forst-nar-medietrycket-blir-for-stort/", "date_display": "2026-06-15", "date_iso": "2026-06-15T05:32:06+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 124, "title": "n'Jonas: Do you have a watch? Or just the mobile phone?", "summary": "In the factory, everyone followed a collective tick-tock. Then time became individual. But today ... how do you know what time it is?", "title_original": "n'Jonas: Har ni någon klocka? Eller bara mobilen?", "summary_original": "På fabriken följde alla ett kollektivt tick-tackande. Sen blev tiden individuell. Men i dag ... hur vet du själv vad klockan är?", "link": "https://www.dn.se/kultur/n-jonas-sa-gick-sverige-fran-slavklocka-till-mobiltid/", "date_display": "2026-06-15", "date_iso": "2026-06-15
