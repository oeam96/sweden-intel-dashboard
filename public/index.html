lood sugar with continuous measurement. But the benefit for people without diabetes is highly unclear, says Minna Johansson, doctor and researcher at the University of Gothenburg. - For them, there is a lack of scientific support because it leads to benefit, while there are risks, says Minna Johansson. Risk of unhealthy fixation According to Johansson, it is normal for blood sugar to vary after meals, and the body regulates this itself in healthy people. Trying to avoid normal variations can even be harmful. - It is not at all certain that it is healthy to avoid these normal variations in blood sugar if you are healthy, she says. She also warns that its use can lead to an unhealthy fixation on blood sugar levels. - There is no scientific evidence that it is good to try to avoid normal variations in blood sugar. In addition, there is a risk of avoiding healthy food and replacing it with unhealthy food. For example, fresh fruit often causes a spike in blood sugar, says Minna Johansson. Can burden healthcare In addition to the personal risks, the trend can also negatively affect healthcare. - If I'm busy helping patients who are healthy with interpreting their blood sugar values ​​from a continuous blood sugar measurement, then I don't have time to take care of those who are sick, says Johansson. For those who want to improve their health, Minna Johansson recommends following well-known advice instead: - It's about not smoking, not drinking too much alcohol, exercising regularly and eating a varied diet with lots of fruit and vegetables. At the same time, she emphasizes that it is not always good to be too fixated on optimizing your health. - It is often highly doubtful whether it really leads to feeling better, says Minna Johansson.", "title_original": "Forskare varnar för hälsotrenden: ”Det finns risker”", "summary_original": "Blodsockermätare har tidigare främst använts av personer med diabetes. Nu har det blivit en populär wellnessprodukt även bland friska. Tanken är att undvika variationer i blodsockret med kontinuerlig mätning. Men nyttan för personer utan diabetes är högst oklar, menar Minna Johansson, läkare och forskare vid Göteborgs universitet. – För dem saknas det vetenskapligt stöd för att det leder till nytta, samtidigt som det finns risker, säger Minna Johansson. Risk för osund fixering Enligt Johansson är det normalt att blodsockret varierar efter måltider, och kroppen reglerar detta själv hos friska personer. Att försöka undvika normala variationer kan till och med vara skadligt. – Det är inte alls säkert att det är hälsosamt att undvika de här normala variationerna i blodsockret om man är frisk, säger hon. Hon varnar också för att användningen kan leda till en osund fixering vid blodsockernivåer. – Det finns inga vetenskapliga belägg för att det är bra att försöka undvika normala variationer i blodsockret. Dessutom finns det en risk att man undviker nyttig mat och ersätter den med onyttig mat. Till exempel ger färsk frukt ofta en stegring i blodsockret, säger Minna Johansson. Kan belasta vården Utöver de personliga riskerna kan trenden också påverka vården negativt. – Om jag har fullt upp att hjälpa patienter som är friska med att tolka sina blodsockervärden från en kontinuerlig blodsockermätning då har jag inte tid att ta hand om de som är sjuka, säger Johansson. För den som vill förbättra sin hälsa rekommenderar Minna Johansson istället att följa välkända råd: – Det handlar om att inte röka, att inte dricka för mycket alkohol, att motionera regelbundet och att äta en varierad kost med mycket frukt och grönt. Hon betonar samtidigt att det inte alltid är bra att vara för fixerad vid att optimera sin hälsa. – Det är ofta högst tveksamt om det verkligen leder till att man mår bättre, säger Minna Johansson.", "link": "https://www.tv4.se/artikel/5iGSfUz8yMYfsjMIGeu1kQ/blodsockermaetare-kan-leda-till-haelsofixering-laekaren-finns-risker", "date_display": "2026-08-10", "date_iso": "2026-08-10T07:51:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/diabetes", "/sjukdomar", "/halsohets", "/halsosam-kost", "/vard"]}, {"id": 152, "title": "Sweden deepens cooperation with Brazil", "summary": "On Wednesday, in connection with Minister for Foreign Affairs Maria Malmer Stenergard’s visit to Brazil, the two countries signed a bilateral action plan for expanded cooperation. This signing took place against the backdrop of Sweden and Brazil celebrating 200 years of diplomatic relations this year.", "title_original": "Sweden deepens cooperation with Brazil", "summary_original": "On Wednesday, in connection with Minister for Foreign Affairs Maria Malmer Stenergard’s visit to Brazil, the two countries signed a bilateral action plan for expanded cooperation. This signing took place against the backdrop of Sweden and Brazil celebrating 200 years of diplomatic relations this year.", "link": "https://www.government.se/press-releases/2026/08/sweden-deepens-cooperation-with-brazil/", "date_display": "2026-08-10", "date_iso": "2026-08-10T07:31:07+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Trade and investment promotion", "Foreign and security policy", "Maria Malmer Stenergard"]}, {"id": 153, "title": "The new track in Leipzig: \"Mothership\"", "summary": "The drone incident at Leipzig-Halle airport in eastern Germany is now being investigated by experts. It was on August 4 that an explosive-laden drone was stopped by an airbus driver, when it was hovering at low altitude near four Ukrainian transport planes. At least one of them must have contained military equipment. The airbus driver had angelic vigil Now the investigators believe that it may be a complex military operation, writes German Bild. According to the newspaper's information, the bus driver had an angelic guard - the detonator on the drone seems to have been defective. That is supposed to be the reason why the explosive charge on the drone did not explode immediately, or when it was detected. The bomb drone was built in such a way that it could not be detected by the drone defense system at the airport, which is why it was able to pass by unnoticed at first. Suspect 'mothership' Investigators also suspect there was a second tactical drone, described as a sort of 'mothership'. According to the analyses, it acted as a relay that transmitted signals and live images to those behind the attack. Now the evidence for that theory has been strengthened, according to the newspaper. The second drone has not been found, but is said to have been used to maintain visual contact with the bomb drone. A DHL cargo plane, which was forced to abort its landing when flight operations were suspended in connection with the discovery of the first drone, collided with an unknown flying object - presumably the \"mother ship\". The collision was what caused the attack on the airport to fail, writes Bild. Russia: \"Elaborate provocation\" German Interior Minister Alexander Dobrindt has said that \"foreign power\" may be behind, and describes what happened as a hybrid attack. He himself has not blamed Russia, but observers have singled out the Russian army. However, the Russian embassy in Berlin has stated that the drone incident is \"a calculated provocation\" to blame Moscow, and denies any Russian involvement.", "title_original": "Nya spåret i Leipzig: ”Moderskepp”", "summary_original": "Drönarincidenten på flygplatsen Leipzig-Halle i östra Tyskland utreds nu av experter. Det var den 4 augusti som en sprängmedelsbestyckad drönare stoppades av en flygbusschaufför, när den svävade på låg höjd nära fyra ukrainska transportflyg. Minst ett av dem ska ha innehållit krigsmateriel. Flygbusschauffören hade änglavakt Nu tror utredarna att det kan röra sig om en komplex militär operation, skriver tyska Bild. Enligt tidningens uppgifter hade busschauffören änglavakt – detonatorn på drönaren verkar nämligen ha varit defekt. Det ska vara anledningen till att sprängladdningen på drönaren inte exploderade direkt, eller när den upptäcktes. Bombdrönaren var byggd på ett sätt så att den inte kunde upptäckas av drönarförsvarssystemet på flygplatsen, vilket var anledningen till att den först kunde passera obemärkt förbi. Misstänker ”moderskepp” Utredarna misstänker också att det fanns en andra taktisk drönare, som beskrivs som ett slags ”moderskepp”. Enligt analyserna fungerade den som ett relä som överförde signaler och livebilder till de som låg bakom attacken. Nu har bevisläget för den teorin stärkts, enligt uppgift till tidningen. Den andra drönaren har inte hittats, men ska ha använts för att upprätthålla visuell kontakt med bombdrönaren. Ett fraktflygplan från DHL, som tvingades avbryta sin landning när flygverksamheten avbröts i samband med att man hittade den första drönaren, krockade nämligen med ett okänt flygande objekt – förmodligen ”moderskeppet”. Kollisionen var det som gjorde att attacken mot flygplatsen misslyckades, skriver Bild. Ryssland: ”Utstuderad provokation” Tysklands inrikesminister Alexander Dobrindt har sagt att ”främmande makt” kan ligga bakom, och beskriver det som hänt som en hybridattack. Han har själv inte beskyllt Ryssland, men bedömare har pekat ut den ryska armén. Rysslands ambassad i Berlin har dock uppgett att drönarincidenten är ”en utstuderad provokation” för att ge Moskva skulden, och förnekar all rysk inblandning.", "link": "https://www.tv4.se/artikel/63jBl9XUf2yoVFbWvVfyVq/nya-sparet-i-leipzig-moderskepp", "date_display": "2026-08-10", "date_iso": "2026-08-10T06:19:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Drönare", "/dronare", "/tyskland", "/utrikes"]}, {"id": 154, "title": "The police's new weapon: DNA reveals the killer's age", "summary": "In normal cases, dna profiles from a crime scene are compared against suspects or in police databases. When investigations get stuck, the new analysis can provide completely new information. So far, the police have been able to obtain eye colour, hair color and geographical origin. If we have a DNA trace at a crime scene, we can analyze the DNA and find out the age of the person who left the trace, with a certain margin of error, says Maja Sidstedt, first molecular biologist at the National Forensic Center (NFC) in Linköping, where the police's DNA analyzes are carried out. Used in serious crimes The new method will primarily be used in serious crimes - such as rape and murder - where there is no suspected perpetrator and where normal database searches have not yielded results. Currently, the method requires relatively large amounts of DNA from a single individual, which means that it mainly works on traces of blood or sperm, explains Maja Sidstedt. She is not sure if the method can also be used to solve cold cases, where the police have closed the investigation without having caught the perpetrator. Unfortunately, there are still limitations in the method because a lot of DNA is required, she says. Analyzing the gene's switch The new method means that the perpetrator's age is estimated within a certain interval by analyzing the chemical changes (methyl groups) on the DNA molecule. The methyl groups act as switches to turn genes off or on, and they naturally change over time. The process is called DNA methylation. Dna methylation is used a lot in the clinical research related to aging and how we can slow down aging. Or understand why some people age faster than others, says Maja Sidstedt. The technology of the future sees if the perpetrator smokes NFC is also participating in a large EU-funded research project that runs until 2029. The goal is to develop even more sensitive methods for age assessment. In the future, we hope to be more accurate in terms of age assessment by being able to perform the h", "title_original": "Polisens nya vapen: Dna avslöjar mördarens ålder", "summary_original": "I vanliga fall jämförs dna-profiler från en brottsplats mot misstänkta personer eller i polisens databaser. När utredningar kör fast kan den nya analysen ge helt ny information. Hittills har polisen kunnat få fram ögonfärg, hårfärg och geografiskt ursprung. Om vi har ett dna-spår på en brottsplats kan vi analysera dna och få fram vilken ålder personen som lämnat spåret har, med viss felmarginal, säger Maja Sidstedt, förste molekylärbiolog vid Nationellt forensiskt centrum (NFC) i Linköping där polisens dna-analyser görs. Används vid grova brott Den nya metoden kommer framför allt att användas vid grova brott – som våldtäkter och mord – där det saknas en misstänkt gärningsperson och där vanliga databassökningar inte har gett resultat. I dagsläget kräver metoden relativt stora mängder dna från en enskild individ, vilket gör att den främst fungerar på spår av blod eller sperma, förklarar Maja Sidstedt. Hon är inte säker på om metoden också kan användas för att lösa kalla fall, där polisen har lagt ner utredningen utan att ha fått fast gärningsmannen. Tyvärr finns fortfarande begränsningar i metoden eftersom det krävs mycket dna, säger hon. Analyserar genens strömbrytare Den nya metoden innebär att gärningspersonens ålder uppskattas inom ett visst intervall genom att analysera de kemiska förändringarna (metylgrupper) som sitter på dna-molekylen. Metylgrupperna fungerar som strömbrytare för att stänga av eller på gener, och de förändras naturligt över tid. Processen kallas dna-metylering. Dna-metylering används mycket inom den kliniska forskningen som rör åldrandet och hur vi kan bromsa åldrandet. Eller förstå varför vissa personer åldras snabbare än andra, säger Maja Sidstedt. Framtidens teknik ser om gärningspersonen röker NFC deltar även i ett stort EU-finansierat forskningsprojekt som pågår fram till 2029. Målet är att utveckla ännu känsligare metoder för åldersbedömning. I framtiden hoppas vi bli mer träffsäkra vad gäller åldersbedömning genom att kunna utföra den här typen av analyser på betydligt mindre mängder dna, exempelvis från snus eller cigarettfimpar, säger Maja Sidstedt, som är projektledare på NFC i forskningsprojektet. Forskningen pekar också på att dna-metylering framöver kan avslöja ännu fler detaljer om en gärningsperson, till exempel om personen är rökare eller inte.", "link": "https://www.tv4.se/artikel/tt-260810-dnaaldersbestamning1-6ca23b31/polisens-nya-vapen-dna-avslojar-mordarens-alder", "date_display": "2026-08-10", "date_iso": "2026-08-10T05:00:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott", "/brott", "/sverige", "/linkoping", "/ostergotland", "/inrikes"]}, {"id": 155, "title": "Officials sound the alarm: Gothia Cup exploits minors", "summary": "During this summer's Gothia Cup in Gothenburg, over 1,000 officials worked at the schools where the soccer teams lived. For some, that meant working around the clock for nine cup days.  18-year-old Hugo Strömberg was a canteen host at Oskar Fredrik's school and testifies to how understaffing and violence between the teams made it unsafe.  - There were 400 people eating. There would have been seven of us in the kitchen, but some days you could work alone, some days we were 2-3 people. It felt so stressful and difficult to take care of the entire canteen business at the same time that it could happen at any time between the teams, says Hugo Strömberg.  Surveillance with security guards was deployed at the end of the week, the police also had a high presence at the school.  \"It was chaos\" Gothia Cup pays a canteen host SEK 3,500 for eight days' work, which corresponds to roughly SEK 50 an hour. - It is disappointing. It was chaos at this school. I raised almost every day that we needed more staff, but they didn't seem to understand, says Hugo Strömberg.  Gothia Cup admits that there has been turnover in staff but claims that those who quit were replaced. They emphasize that the clerical assignment is different from a regular summer job.  - It is important that everyone feels safe when they participate and that everyone does it of their own free will. But if something is broken there, we have to fix it, of course, says tournament leader Lena Rönnefors.  Violating the rules for minors Many canteen hosts and school hosts during the Gothia Cup are between 16-18 years old. According to TV4's information, many have worked in such a way that is not permitted according to the Swedish Labor and Employment Agency's regulations, and can result in fines for the employer.  The youngsters have been scheduled for eight-hour shifts, seven to nine days in a row. A 16-year-old clerk testifies about missed meal breaks and how she worked overtime almost every night, sometimes until 2 a.m. - We have to go in and look at how it could have happened. You shouldn't be 16, it's the age that's the problem here, says Lena Rönnefors from Gothia Cup. It seems it was", "title_original": "Funktionärerna larmar: Gothia Cup utnyttjar minderåriga", "summary_original": "Under sommarens Gothia Cup i Göteborg arbetade över 1000 funktionärer på de skolor där fotbollslagen bodde. För vissa innebar det jobb dygnet runt under nio cupdagar.  18-årige Hugo Strömberg var matsalsvärd på Oskar Fredriks skola och vittnar om hur underbemanning och våldsamheter mellan lagen gjorde det otryggt.  – Det var 400 ätande. Vi skulle varit sju i köket men vissa dagar kunde man jobba själv, vissa dagar var vi 2-3 personer. Det kändes så stressigt och jobbigt att sköta om hela matsalsverksamheten samtidigt som att det när som helst kunde smälla mellan lagen, berättar Hugo Strömberg.  Bevakning med skyddsvakter sattes in i slutet av veckan, även polisen hade hög närvaro på skolan.  ”Det var kaos” Gothia Cup betalar en matsalsvärd 3 500 kronor för åtta dagars arbete, vilket motsvarar drygt 50 kronor i timmen. – Det är en besvikelse. Det var kaos på den här skolan. Jag lyfte nästan varje dag att vi behövde mer personal, men de verkade inte förstå, säger Hugo Strömberg.  Gothia Cup medger att det varit ruljangs på personal men hävdar att de som slutade ersattes. De understryker att funktionärsuppdraget skiljer sig från ett vanligt sommarjobb.  – Det är viktigt att alla känner sig trygga när de är med och att alla gör det av fri vilja. Men är det något som brustit där så måste vi rätta till det såklart, säger turneringsledaren Lena Rönnefors.  Bryter mot reglerna för minderåriga Många matsalsvärdar och skolvärdar under Gothia Cup är mellan 16-18 år. Enligt TV4:s uppgifter har många jobbat på sådant sätt som inte är tillåtet enligt Arbetmijöverkets föreskrifter, och kan ge arbetsgivaren böter.  Ungdomarna har varit schemalagda på åttatimmarspass, sju till nio dagar i rad. En 16-årig funktionär vittnar om uteblivna matraster och hur hon jobbat övertid nästan varje kväll, ibland till klockan 02.  – Vi måste gå in och titta på hur det kan ha blivit så. Man ska inte vara 16, det är åldern som är problemet här, säger Lena Rönnefors från Gothia Cup. Det verkar ju vara mer regel än undantag att ni har det upplägget? – Låt oss gå in och titta på det mer specifikt. Det är ju ett funktionärsuppdrag och ingen anställning. Men vi ska såklart följa reglerna, särskilt när det gäller de minderåriga.", "link": "https://www.tv4.se/artikel/7aH5qcJIKtllPVQ75Sf9B4/funktionaererna-larmar-gothia-cup-utnyttjar-minderariga", "date_display": "2026-08-10", "date_iso": "2026-08-10T04:22:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Inrikes", "/inrikes", "/barn-och-unga", "/gothia-cup", "/goteborg"]}, {"id": 156, "title": "The Hen Island Conference may have to move", "summary": "\"It becomes more vulnerable with tents due to weather and wind,\" says Anders Marklund, director of Hönö Mission Church.", "title_original": "Hönökonferensen kan behöva flytta", "summary_original": "”Det blir mer sårbart med tält på grund av väder och vind”, säger Anders Marklund, föreståndare för Hönö Missionskyrka.", "link": "https://www.dagen.se/nyheter/hoenoekonferensen-kan-behoeva-flytta/10470046", "date_display": "2026-08-10", "date_iso": "2026-08-10T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 157, "title": "\"Now it looks like my opportunity to become a priest is deteriorating\"", "summary": "Dagen has spoken to three priest students who do not want to marry same-sex couples • How do they see their future in the Church of Sweden?", "title_original": "”Nu ser det ut som att min möjlighet att bli präst försämras”", "summary_original": "Dagen har pratat med tre präststudenter som inte vill viga samkönade par • Hur ser de på sin framtid i Svenska kyrkan?", "link": "https://www.dagen.se/nyheter/nu-ser-det-ut-som-att-min-moejlighet-att-bli-praest-foersaemras/10470376", "date_display": "2026-08-10", "date_iso": "2026-08-10T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "The marriage motion can lead to a split in the church", "summary": "The petitioner has either not realized the scope of the consequences that the proposal can lead to or, more likely, has chosen to ignore them, writes Elisabeth Sandlund, Frimodig church (FK).", "title_original": "Vigselmotionen kan leda till kyrkosplittring", "summary_original": "Motionären har antingen inte insett vidden av de konsekvenser som förslaget kan leda till eller, mer sannolikt, valt att bortse från dem, skriver Elisabeth Sandlund, Frimodig kyrka (FK).", "link": "https://www.dagen.se/debatt/vigselmotionen-kan-leda-till-kyrkosplittring/10470925", "date_display": "2026-08-10", "date_iso": "2026-08-10T03:00:00+00:00", "source": "Dagen", "ministry": "General News", "type":   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
