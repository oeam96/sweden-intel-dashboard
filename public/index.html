 och miljöminister Romina Pourmokhtari (L) säger att frågan inte lyftes i valrörelsen och varnar för att det kan skada väljarnas förtroende. – Jag oroas över att Socialdemokraterna inför miljözoner utan att ha gått till val på det. Hur skulle de då hantera bränslepriserna om de rödgröna får makten nationellt?, säger Pourmokhtari. Skapar frustration Miljözoner kan, enligt Pourmokhtari, ha positiva effekter men hon menar att genomförandet har stor betydelse för hur förändringen tas emot. – Jag tänker att det är viktigt att man är tydlig gentemot väljarna i god tid när sådant här ska införas så att det inte blir så mycket kritik och frustration gentemot de här miljözonerna som i grunden kan vara en väldigt bra sak i vissa områden där man har förutsättningar och möjlighet att införa det och näringslivet är med på tåget.  Hon menar att utspelet kommer som en överraskning. – När det kommer lite från ingenstans, om man exempelvis som Socialdemokraterna inte har sagt att man vill göra det här i valrörelsen utan gör det direkt efteråt, blir det ju mycket kritik. Kritik från M och C Även Moderaterna och Centern har kritiserat förslaget. – Jag blir genuint upprörd. Det är ett löftessvek av historiska dimensioner, sade Dennis Wedin (M), oppositionsborgarråd i Stockholm. ”Vänsterstyret fortsätter med piskan samtidigt som morötterna saknas. En så stor förändring kräver förankring och långsiktighet, inte politiskt hasardspel”, skrev Jonas Naddebo (C) tidigare.", "title_original": "Ministerns kritik mot S: ”Kommer från ingenstans”", "summary_original": "Stockholms rödgröna styre har enats om en utvidgad miljözon. Bensin- och dieseldrivna personbilar, inklusive laddhybrider, ska förbjudas från 2027. Förslaget har väckt kritik från oppositionen i Stockholm.  Klimat- och miljöminister Romina Pourmokhtari (L) säger att frågan inte lyftes i valrörelsen och varnar för att det kan skada väljarnas förtroende. – Jag oroas över att Socialdemokraterna inför miljözoner utan att ha gått till va re larm har visat sig vara falska. Hans Brun, terrorexpert och chefsanalytiker på SRI, menar att händelserna bör ses som en del av en större påverkansoperation. Bakom den står med stor sannolikhet Ryssland, enligt honom. – Man ska nog se det här som ett led i en större kampanj, där den ryska regeringen försöker öka trycket på Europa för att minska stödet till Ukraina, helt enkelt.  Två skäl till ökat tryck  Han pekar på två skäl till att Ryssland nu gradvis ökar trycket mot Europa. – Det första är att kriget i Ukraina går dåligt. Ryssarna tvingas tillbaka, säger Brun. Det andra skälet beskriver han som ”högintressant”. – Det är det faktum att valet i USA är ett stort bakslag för Putinadministrationen. Valet innebär att Ukraina kommer att stärkas på sikt och få mera stöd från USA, säger han. Enligt Brun gör utvecklingen att Ryssland har incitament att agera relativt snabbt. – Det här innebär att Putin nu har ett litet fönster att öka trycket på Europa innan Ryssland blir alldeles för svagt.  ”Man vill skapa oro” Han tror att det är Ryssland som ligger bakom hoten i och med att de följer ett mönster som stämmer väl överens med den ryska hybridkrigföringen. – Man vill skapa oro runt om i Europa. Kan man störa flyg, tåg eller kollektivtrafik påverkar man väldigt många människor till en låg kostnad och ganska låg risk, säger han. Enligt honom behöver de personer som genomför hoten inte själva vara ryssar. – Det kan vara personer som rekryteras via exempelvis Telegram och får betalt för att utföra olika uppdrag. Det här gör avsändaren, i det här fallet Ryssland, för att försöka isolera sig mot anklagelser.  ”Trycket på Europa kommer att öka” Brun menar att syftet inte är att döda människor, utan att skapa oro. Ett dödligt attentat riskerar att utlösa ett betydligt hårdare svar från Europa och Nato. – Det man nu kommer att göra är att öka trycket så mycket som möjligt i Europa utan att för den sakens skull trigga artikel 5 i Natostadgan, säger Brun. Samtidigt varnar han för att utvecklingen kan bli mer märkbar för vanliga européer framöver. – Det vi tror är att trycket på Europa kommer att öka. Jag tror att vi kommer att få se flera sådana här större händelser. Till exempel kanske man slår ut tunnelbanan genom hot eller cyberattacker, så att det påverkar folks vardag, säger han.", "title_original": "Terrorexperten om bombhoten: Kan vara del av rysk kampanj", "summary_original": "Ett flyg på väg från Köpenhamn till Warszawa, ett annat mellan Dublin och Rom och flera andra passagerarplan runt om i Europa har de senaste dagarna utsatts för bombhot. Hoten har lett till omdirigeringar, nödlandningar och insatser från polis och bombtekniker. Hittills har inga explosiva föremål hittats och tidigare larm har visat sig vara falska. Hans Brun, terrorexpert och chefsanalytiker på SRI, menar att händelserna bör ses som en del av en större påverkansoperation. Bakom den står med stor sannolikhet Ryssland, enligt honom. – Man ska nog se det här som ett led i en större kampanj, där den ryska regeringen försöker öka trycket på Europa för att minska stödet till Ukraina, helt enkelt.  Två skäl till ökat tryck  Han pekar på två skäl till att Ryssland nu gradvis ökar trycket mot Europa. – Det första är att kriget i Ukraina går dåligt. Ryssarna tvingas tillbaka, säger Brun. Det andra skälet beskriver han som ”högintressant”. – Det är det faktum att valet i USA är ett stort bakslag för Putinadministrationen. Valet innebär att Ukraina kommer att stärkas på sikt och få mera stöd från USA, säger han. Enligt Brun gör utvecklingen att Ryssland har incitament att agera relativt snabbt. – Det här innebär att Putin nu har ett litet fönster att öka trycket på Europa innan Ryssland blir alldeles för svagt.  ”Man vill skapa oro” Han tror att det är Ryssland som ligger bakom hoten i och med att de följer ett mönster som stämmer väl överens med den ryska hybridkrigföringen. – Man vill skapa oro runt om i Europa. Kan man störa flyg, tåg eller kollektivtrafik påverkar man väldigt många människor till en låg kostnad och ganska låg risk, säger han. Enligt honom behöver de personer som genomför hoten inte själva vara ryssar. – Det kan vara personer som rekryteras via exempelvis Telegram och får betalt för att utföra olika uppdrag. Det här gör avsändaren, i det här fallet Ryssland, för att försöka isolera sig mot anklagelser.  ”Trycket på Europa kommer att öka” Brun menar att syftet inte är att döda människor, utan att skapa oro. Ett dödligt attentat riskerar att utlösa ett betydligt hårdare svar från Europa och Nato. – Det man nu kommer att göra är att öka trycket så mycket som möjligt i Europa utan att för den sakens skull trigga artikel 5 i Natostadgan, säger Brun. Samtidigt varnar han för att utvecklingen kan bli mer märkbar för vanliga européer framöver. – Det vi tror är att trycket på Europa kommer att öka. Jag tror att vi kommer att få se flera sådana här större händelser. Till exempel kanske man slår ut tunnelbanan genom hot eller cyberattacker, så att det påverkar folks vardag, säger han.", "link": "https://www.tv4.se/artikel/7JjDxA6pzxht4iuWue70Lu/terrorexperten-om-bombhoten-kan-vara-del-av-rysk-kampanj", "date_display": "2026-11-05", "date_iso": "2026-11-05T13:18:49+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/utrikes", "/ryssland", "/flygplan", "/flygsakerhet", "/flygtrafik", "/ukrainakonflikten"]}, {"id": 50, "title": "Ronaldos besked efter bråket: Slutar i landslaget", "summary": "Efter 23 år, 146 mål och ett EM-guld tackar Cristiano Ronaldo för sig. I en video på Instagram berättar 41-åringen att den portugisiska landslagskarriären är över. – Dagen har kommit för mig att lämna tillbaka tröja nummer 7, säger han.", "title_original": "Ronaldos besked efter bråket: Slutar i landslaget", "summary_original": "Efter 23 år, 146 mål och ett EM-guld tackar Cristiano Ronaldo för sig. I en video på Instagram berättar 41-åringen att den portugisiska landslagskarri setts till världens 23:e bästa.  Restaurangen är därmed den enda svenska som klättrat upp och gått förbi Frantzén på listan World's 50 Best Restaurants.  Det är sent på natten i Lima i Peru när TV4 Nyheterna når Daniel Berlin. Hemma i Sverige är det tidig morgon, men gratulationerna har redan börjat strömma in. – Det är fint. Man känner stödet hemifrån, säger Daniel Berlin. Utmärkelsen betyder mycket – både för Daniel Berlin personligen och för alla som arbetar på restaurangen, berättar han.  – Det är jättekul. Det är kul för Vyn och det är kul för Skåne och det är kul för Sverige, tänker jag, fortsätter han. ”Unik i sitt slag” Daniel Berlin är inte helt säker på vad som har gjort att Vyn hamnat bland världens bästa. Men platsen, som han beskriver som ”unik i sitt slag”, kan ha varit avgörande ,tror han. – Vi försöker ha en stark identitet på restaurangen, ett DNA som berättar om platsen, säger han. Han beskriver Vyn som en ”destinationsrestaurang” som gäster behöver resa till för att besöka. Verksamheten omfattar hotell, restaurang, mat- och vinbar samt en trädgård. – Jag tror väl kanske just att det är den här gastronomiska platsen, ett hotell, en mat-och vinbar, en restaurang. Vi har en relativt stor trädgård som växer, säger han. – Vi vill ju också att det ska vara den här platsen som man behöver resa till och man bygger upp förväntningar. Vilket också gör att det såklart skapar lite mer press på oss att leverera, fortsätter han. Spansk restaurang i topp Listan på världens 50 bästa restauranger sätts samman av en jury med över 1 000 kockar, krögare, matskribenter och gastronomer.  Etta på listan blev Asador Etxebarri i spanska Bizkaia som utsågs till världens bästa restaurang. Den baskiska restaurangen, som drivs av Bittor Arginzoniz, klättrar från fjolårets andraplacering till förstaplatsen. Svenska Frantzén finns inte med bland de 50 bästa, men hamnar på plats 58 bland världens 100 bästa.", "title_original": "Svenske krögaren om topp-placeringen: ”Betyder jätt klättrar från fjolårets andraplacering till förstaplatsen. Svenska Frantzén finns inte med bland de 50 bästa, men hamnar på plats 58 bland världens 100 bästa.", "link": "https://www.tv4.se/artikel/5nTg74KUIQXXonhHNxzhI/svenske-kroegaren-om-topp-placeringen-betyder-jaettemycket", "date_display": "2026-11-05", "date_iso": "2026-11-05T12:26:32+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["/", "/inrikes", "/restaurangbranschen", "/restaurang"]}, {"id": 62, "title": "Polisen: Kraftig smäll från övning ska ske i Stockholm", "summary": "", "title_original": "Polisen: Kraftig smäll från övning ska ske i Stockholm", "summary_original": "", "link": "https://www.svd.se/a/wA9Gmd/senaste-nytt?pinnedEntry=79505&utm_medium=rss", "date_display": "2026-11-05", "date_iso": "2026-11-05T12:25:35+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 63, "title": "Kvinna till sjukhus efter olycka på tågperrong i Malmö", "summary": "", "title_original": "Kvinna till sjukhus efter olycka på tågperrong i Malmö", "summary_original": "", "link": "https://www.hd.se/skane/kvinna-till-sjukhus-efter-olycka-pa-tagperrong-i-malmo/", "date_display": "2026-11-05", "date_iso": "2026-11-05T12:22:29+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 64, "title": "Valet Direkt: Allt du behöver veta efter valet 2026", "summary": "Här i HD:s Valet Direkt följer du alla stora och små nyheter efter valet.", "title_original": "Valet Direkt: Allt du behöver veta efter valet 2026", "summary_original": "Här i HD:s Valet Direkt följer du alla stora och små nyheter efter valet.", "link": "https://www.hd.se/sverige/infor-valet-har-ar-de-senaste-nyheterna/", "date_display": "2026-11-05", "date_iso": "2026-11-05T12:20:11+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type":  arbetsgivare till en arbetsrättslig domstol i Australien.  Där berättade han att han tidigare bett sin chef att ”kontrollera hur viktigt det är för italienare att inte ha ananas på pizzan”.   ”Mer än en pizzatopping”  Restaurangen lyfte å sin sida ett antal andra problem med den italienska kocken, såsom att han använde olämpligt språk.  Chefen för restaurangen säger till Daily Mail:  – Det är mer till denna historia än pizzatopping. Restaurangen ligger i Queensland, som enligt BBC anses vara Australiens ananasepicentrum. Det är i den delstaten som all ananas som odlas för försäljning växer.", "title_original": "Italiensk kock vägrade ha ananas på pizza – fick sparken", "summary_original": "Kocken jobbade på en restaurang i Brisbane där pizza med ananas stod på menyn.  Men när några gäster beställde Hawaiipizzor vägrade kocken tillaga maten, med förklaringen att han inte behöver följa instruktioner från cheferna när det är ”stötande mot hans kultur”.   ”Viktigt för italienare att inte ha ananas på pizzan”  Det var tredje gången gillt, och droppen för den italienska kockens arbetsgivare. Det hela slutade med att kocken fick sparken.  Han rapporterade då sin arbetsgivare till en arbetsrättslig domstol i Australien.  Där berättade han att han tidigare bett sin chef att ”kontrollera hur viktigt det är för italienare att inte ha ananas på pizzan”.   ”Mer än en pizzatopping”  Restaurangen lyfte å sin sida ett antal andra problem med den italienska kocken, såsom att han använde olämpligt språk.  Chefen för restaurangen säger till Daily Mail:  – Det är mer till denna historia än pizzatopping. Restaurangen ligger i Queensland, som enligt BBC anses vara Australiens ananasepicentrum. Det är i den delstaten som all ananas som odlas för försäljning växer.", "link": "https://www.tv4.se/artikel/2Ge5OaBBNw2gNdrtkBVh52/italiensk-kock-vaegrade-ha-ananas-pa-pizza-fick-sparken", "date_display": "2026-11-05", "date_iso": "2026-11-05T10:51:03+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/pizza", "/italien", "/australien"]}, {"id": 97, "title": "Shygirls ”Swallow!” är en skiva att svälja hel", "summary": "Shygirls nya album ”Swallow!” är ett tittskåp mot en lycklig kärlekssaga. Skivan pulserar av experimentlusta, men det tar emellanåt överhanden, skriver DN:s Vera von Otter.", "title_original": "Shygirls ”Swallow!” är en skiva att svälja hel", "summary_original": "Shygirls nya album ”Swallow!” är ett tittskåp mot en lycklig kärlekssaga. Skivan pulserar av experimentlusta, men det tar emellanåt överhanden, skriver DN:s Vera von Otter.", "link": "https://www.dn.se/kultur/shygirls-swallow-ar-en-skiva-att-svalja-hel/", "date_display": "2026-11-05", "date_iso": "2026-11-05T10:48:24+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 98, "title": "Efter våldtäktsanklagelser – GVFÖ skrotas", "summary": "Den populära realityserien togs tidigare i år bort från bland annat TV4 Play och norska TV2 efter uppgifter om sexuella övergrepp under inspelningen.\n\nI en BBC-dokumentär vittnade två kvinnliga deltagare om att de våldtagits av sina makar under produktionen. Ytterligare en kvinna anklagade en manlig deltagare för att ha utfört en sexuell handling utan hennes samtycke. Efter anklagelserna spekulerade många i Storbritannien i att programmet, som sänts i tio säsonger och med publiksiffror på över tre miljoner, inte skulle återvända. Nu rapporterar BBC att så blir fallet. Channel 4:s vd säger till kanalen på torsdagen att programmets budget i stället ska investeras i nya produktioner. Vd:n ber också på nytt om ursäkt till de drabbade kvinnorna för den ”oro och lidande de uppenbarligen har känt”. Granskning färdig Alla tre kvinnor har riktat hård kritik mot Channel 4 och menar att produktionen inte skyddade dem tillräckligt. Produktionsbolaget CPL har tillbakavisat anklagelserna och hävdat att deras säkerhetsrutiner håller ”högsta klass”. Kort efter att programmet pausades inleddes en extern granskning i två delar som nu är klar. Även den brittiska mediemyndigheten Ofcom har tittat närmare på händelserna och i juni greps en manlig skådespelare misstänkt för våldtäkt.\n\nGranskningen visar bland annat att säkerhetsrutinerna för de medverkande vid vissa enstaka tillfällen inte implementerades fullt ut och att skyddet för deltagarna på vissa områden hade kunnat stärkas ytterligare. Trots det ansåg BBC:s Lorraine Heggessey, som ansvarade för den andra delen av granskningen, att det ändå skulle vara rimligt att fortsätta producera framtida säsonger av brittiska Gift vid första ögonkastet om skyddet för deltagarna stärktes ännu mer. SVT om beskedet När TV4 Nyheterna i maj pratade med SVT, som sänder den svenska versionen av programmet, sa kanalens programchef Charles Franz att kanalen såklart vässar blicken ytterligare inför kommande inspelningar. – Grejen är att det här är inga nya frågor för oss. Det här är liksom vår topprioritet och har varit det i många år. Men det är klart att när vi tar del av det här så är det jävligt otäckt, sa Charles Franz.", "title_original": "Efter våldtäktsanklagelser – GVFÖ skrotas", "summary_original": "Den populära realityserien togs tidigare i år bort från bland annat TV4 Play och norska TV2 efter uppgifter om sexuella övergrepp under inspelningen.\n\nI en BBC-dokumentär vittnade två kvinnliga deltagare om att de våldtagits av sina makar under produktionen. Ytterligare en kvinna anklagade en manlig deltagare för att ha utfört en sexuell handling utan hennes samtycke. Efter anklagelserna spekulerade många i Storbritannien i att programmet, som sänts i tio säsonger och med publiksiffror på över tre miljoner, inte skulle återvända. Nu rapporterar BBC att så blir fallet. Channel 4:s vd säger till kanalen på torsdagen att programmets budget i stället ska investeras i nya produktioner. Vd:n ber också på nytt om ursäkt till de drabbade nför Stockholm. Nu har en man gripits och häktats för mordet, något som Expressen var först med att rapportera om. Enligt åklagarnas tidigare teori lockades Abbas till en lägenhet av en kvinna som han haft en relation med. Där ska han ha misshandlats och fått en dödlig skärskada i halsen innan kroppen fördes bort och gömdes i en väska. Varit internationellt efterlyst Den nu gripne mannen lämnade Sverige efter mordet och har sedan dess varit internationellt efterlyst. Enligt rättsdokument greps han i tisdags och häktades senare. Åklagaren vill inte gå in i mer detalj.  – Han häktades på sannolika skäl misstänkt för mord och grovt gravfridsbrott, säger kammaråklagare Cecilia Tepper. Mannen var sedan tidigare misstänkt i utredningen men fanns inte i Sverige när rättegången hölls. Tidigare har tre personer dömts till fängelse för bland annat grovt gravfridsbrott, medhjälp till grov misshandel och grovt skyddande av brottsling.  Ingen av dem dömdes för mord. Får möjlighet att höras Åklagaren har sedan tidigare uppgett att mordet misstänks ha varit hedersrelaterat. Enligt utredningen hade Abbas haft en relation med en gift kvinna, något som enligt åklagarnas teori låg bakom dödandet. Åtalsfristen för den nu häktade mannen löper ut den 2 december, enligt kammaråklagare Cecilia Tepper. – Det är ett tidigt skede nu. Vi kan inte gå in på några detaljer i målet, säger hon.", "title_original": "Man gripen misstänkt för väskmordet på Värmdö", "summary_original": "I mars 2024 hittades Ako Hameed Abbas, 37, död i en väska på Värmdö utanför Stockholm. Nu har en man gripits och häktats för mordet, något som Expressen var först med att rapportera om. Enligt åklagarnas tidigare teori lockades Abbas till en lägenhet av en kvinna som han haft en relation med. Där ska han ha misshandlats och fått en dödlig skärskada i halsen innan kroppen fördes bort och gömdes i en väska. Varit internationellt efterlyst Den nu gripne mannen lämnade Sverige efter mordet och har sedan dess varit internati å blir julsändningen med Bergfeldt Hon fick frågan för drygt två och en halv månad sedan och har sedan dess lyssnat på julmusik. Med tanke på läget i omvärlden vill Carina Bergfeldt fokusera på att vara en julvärd som för människor samman. – Det är en polariserad värld och ett förvirrat Sverige just nu. Vi vet inte hur det är politiskt. Väldigt mycket saker är människor oense om i världen i dag. Men en sak man är överens om är att på julafton klockan 15 är det jul, och då sitter julvärden där med människor och är ett sällskap, säger hon till TV4 Nyheterna. Enligt Bergfeldt går det inte att spela rollen som julvärd. Man måste vara sig själv. Därför blir det berättelser om henne själv, hennes familj och liv. – Det blir överraskningar som har en personlig anknytning. Jag tror att man ska vara någon form av gäst i folks vardagsrum. Men det som är bra med mig är att man slipper diska efter gästen. ”Carina är gratis” Många är säkert nyfikna på vad man får betalt för att lotsa tv-tittarna genom julen. Men eftersom Carina Bergfeldt är fast anställd på SVT får hon sin vanliga lön. – Det är ett budgetår, så de bara: ”Carina är gratis”, säger hon och skrattar. Något annat många pratar om är hur det ska gå för julvärlden att tända ljuset. Det är nervöst även för Bergfeldt, även om hon tycker att den största utmaningen är att veta vad hon ska säga. – Jag har gått runt i ljusaffärer och tittat på ljus på ett sätt som känns nästan lite ohälsosamt. Jag har funderat så mycket över det här stackars ljuset.", "title_original": "Hon blir årets julvärd: ”Vad i hela friden ska jag säga?”", "summary_original": "SVT har sedan 1959 haft så kallade julvärdar i sina sändningar på julafton. Då var det Gerd Almgren som lotsade svenska folket genom firandet. Sedan dess har värdskapet skiftat, men Arne Weise höll i stafettpinnen flera gånger mellan 1964 och 2002. Inför årets presentation pekades programledaren Messiah Hallberg och skådespelarna Lasse Åberg och Christina Schollin ut som favoriter. Julafton", "/julafton", "/svt", "/jul", "/noje"]}, {"id": 129, "title": "Krämig fiskpanna med chiliolja", "summary": "Dagens middagstips bjuder på en fiskrätt med sej, broccoli och morot i en krämig sås med citron och vitlök toppad med krispig chiliolja och färska örter för sting och fräschör. En lättlagad och lyxigt god vardagsmiddag med prisvärd fisk som serveras med pressad potatis. Se Jennie Walldéns recept", "title_original": "Krämig fiskpanna med chiliolja", "summary_original": "Dagens middagstips bjuder på en fiskrätt med sej, broccoli och morot i en krämig sås med citron och vitlök toppad med krispig chiliolja och färska örter för sting och fräschör. En lättlagad och lyxigt god vardagsmiddag med prisvärd fisk som serveras med pressad potatis. Se Jennie Walldéns recept", "link": "https://www.tv4.se/artikel/6kU4a54WpLlu51RVxTAJ1g/kraemig-fiskpanna-med-chiliolja", "date_display": "2026-11-05", "date_iso": "2026-11-05T08:29:48+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Mat", "/mat", "/koket", "/kokets-middag", "/personer/jennie-wallden"]}, {"id": 130, "title": "Totalstopp i tågtrafiken söder om Stockholm efter olycka", "summary": "Det är helt stopp för all tågtrafik mellan Stockholm och Flemingsberg. Orsaken är olycka där ett tåg strax efter klockan 02 under natten körde på en grävmaskin. – Vi har precis fått en prognos från trafikledningen om att tågtrafiken kan återupptas i morgon klockan 06, säger Pär Aronsson vid Trafikverket.", "title_original": "Totalstopp i tågtrafiken söder om Stockholm efter olycka", "summary_original": "Det är helt stopp för all tågtrafik mellan Stockholm och Flemingsberg. Orsaken är olycka där ett tåg strax efter klockan 02 under natten körde på en grävmaskin. – Vi har precis fått en prognos från trafikledningen om att tågtrafiken kan återupptas i morgon klockan 06, säger Pär Aronsson vid Trafikverket.", "link": "https://www.dn.se/sverige/totalstopp-i-tagtrafiken-soder-om-stockholm-efter-olycka/", "date_display": "2026-11-05", "date_iso": "2026-11-05T08:20:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 131, "title": "Aili Lundmark: Eftervärlden får bedöma stilisternas arbete med Nya testamentet", "summary": "Det råder delade meningar om hur förutsättningar har varit under översättningsarbetet med NT26. Aili Lundmark svarar Jonas Holmstrand i frågan och menar att boken stressades fram och att stilisterna blev överkörda.", "title_original": "Aili Lundmark: Eftervärlden får bedöma stilisternas arbete med Nya testamentet", "summary_original": "Det råder delade meningar om hur förutsättningar har varit under översättningsarbetet med NT26. Aili Lundmark svarar Jonas Holmstrand i frågan och menar att boken stressades fram och att stilisterna blev överkörda.", "link": "https://www.dn.se/kultur/aili-lundmark-eftervarlden-far-bedoma-stilisternas-arbete-med-nya-testamentet/", "date_display": "2026-11-05", "date_iso": "2026-11-05T08:11:16+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 132, "title": "Mobbningen ökar – Friends kräver nationell kartläggning", "summary": "I årets Friends-rapport uppgav 17 procent att de blivit mobbade de senaste månaderna. Det är en ökning med tre procentenheter från förra året. Totalt har 944 elever i mellan- och högstadiet tillfrågats i rapporten, som pekar ut barn med NPF-diagnoser som adhd eller autism som särskilt utsatta. – Vi misslyckas med att varje barn ska känna sig tryggt i skolan, den plats ditt barn enligt lag ska gå till varenda dag, säger Maja Frankel, generalsekreterare för Friends. ”Väldigt ensamt” En som vet hur det känns att bli mobbad är Matilda Mäntynena i Finspång. – Det är väldigt ensamt. Jag förstod inte varför... Vill ni inte vara med mig? Vad säger jag? Vad gör jag för fel? Det är väldigt mycket grubblande i det. Det här har fått mig att må totalt skit, skulle jag säga. Nu kräver Friends en nationell trygghetskartläggning för att ta reda på varför mobbningen ökar och vilka insatser som kan vända utvecklingen. Sverige bör ta inspiration från andra nordiska länder, som tagit krafttag mot mobbning. – Så det är öppen dörr för Sverige att ta den här typen av krafttag som vi har sett att många andra länder har gjort, säger Maja Frankel. ”Psykiskt förtryck” På Friends chatt får organisationen kontakt med många utsatta barn, som vittnar om både fysisk och psykisk mobbning. – Det är ganska mycket det här psykiska förtrycket. Varje gång jag räcker upp handen så suckar alla eller när jag kommer in i klassrummet så vänder alla bort blicken. Det kan vara ganska svårt ibland för vuxenvärlden att se och veta hur man ska agera, men för barnet är det smärtsamt, säger Carolina Rindefors, sakkunnig i barns trygghet på Friends. Hon menar att barn vill ha hjälp av oss vuxna, men det kan vara väldigt svårt att prata om mobbning. – Det behöver finnas vuxna runtomkring som faktiskt ser det här och som faktiskt gör någonting. Att man inte bara avvisar som att barn är barn, som att det bara är småkäbbel, säger Matilda Mäntynena, som själv utsattes. Tips till föräldrar Som förälder är det viktigt att prata om mobbning hemma – även om ens barn inte blir mobbat – i förebyggande syfte. – Man kan börja öppna de här dialogerna. Hur gör man om någon säger det här till dig, eller om du ser det på nätet? Vem tar du hjälp av? Man kan öppna diskussionen långt innan, säger Carolina Rindefors. Om man känner sig ensam eller utsatt som barn vill man inte alltid berätta det för sina föräldrar. Men det finns tecken att vara uppmärksam på – som beteendeförändringar, säger Carolina Rindefors. – De tar inte hem kompisar längre, de drar sig undan när man pratar om skolan. Att ha ont i magen eller ha svårt att sova – det är oftast på riktigt, just när det är kopplat till att gå till skolan. Så det finns tecken att leta efter.", "title_original": "Mobbningen ökar – Friends kräver nationell kartläggning", "summary_original": "I årets Friends-rapport uppgav 17 procent att de blivit mobbade de senaste månaderna. Det är en ökning med tre procentenheter från förra året. Totalt har 944 elever i mellan- och högstadiet tillfrågats i rapporten, som pekar ut barn med NPF-diagnoser som adhd eller autism som särskilt utsatta. – Vi misslyckas med att varje barn ska känna sig tryggt i skolan, den plats ditt barn enligt lag ska gå till varenda dag, säger Maja Frankel, generalsekreterare för Friends. ”Väldigt ensamt” En som vet hur det känns att bli mobbad är Matilda Mäntynena i Finspång. – Det är väldigt ensamt. Jag förstod inte varför... Vill ni inte vara med mig? Vad säger jag? Vad gör jag för fel? Det är väldigt mycket grubblande i det. Det här har fått mig att må totalt skit, skulle jag säga. Nu kräver Friends en nationell trygghetskartläggning för att ta reda på varför mobbningen ökar och vilka insatser som kan vända utvecklingen. Sverige bör ta inspiration från andra nordiska länder, som tagit krafttag mot mobbning. – Så det är öppen dörr för Sverige att ta den här typen av krafttag som vi har sett att många andra länder har gjort, säger Maja Frankel. ”Psykiskt förtryck” På Friends chatt får organisationen kontakt med många utsatta barn, som vittnar om både fysisk och psykisk mobbning. – Det är ganska mycket det här psykiska förtrycket. Varje gång jag räcker upp handen så suckar alla eller när jag kommer in i klassrummet så vänder alla bort blicken. Det kan vara ganska svårt ibland för vuxenvärlden att se och veta hur man ska agera, men för barnet är det smärtsamt, säger Carolina Rindefors, sakkunnig i barns trygghet på Friends. Hon menar att barn vill ha hjälp av oss vuxna, men det kan vara väldigt svårt att prata om mobbning. – Det behöver finnas vuxna runtomkring som faktiskt ser det här och som faktiskt gör någonting. Att man inte bara avvisar som att barn är barn, som att det bara är småkäbbel, säger Matilda Mäntynena, som själv utsattes. Tips till föräldrar Som förälder är det viktigt att prata om mobbning hemma – även om ens barn inte blir mobbat – i förebyggande syfte. – Man kan börja öppna de här dialogerna. Hur gör man om någon säger det här till dig, eller om du ser det på nätet? Vem tar du hjälp av? Man kan öppna diskussionen långt innan, säger Carolina Rindefors. Om man känner sig ensam eller utsatt som barn vill man inte alltid berätta det för sina föräldrar. Men det finns tecken att vara uppmärksam på – som beteendeförändringar, säger Carolina Rindefors. – De tar inte hem kompisar längre, de drar sig undan när man pratar om skolan. Att ha ont i magen eller ha svårt att sova – det är oftast på riktigt, just när det är kopplat till att gå till skolan. Så det finns tecken att leta efter.", "link": "https://www.tv4.se/artikel/7CjET2xfgtje0azUDjSrgM/mobbningen-oekar-friends-kraever-nationell-kartlaeggning", "date_display": "2026-11-05", "date_iso": "2026-11-05T07:38:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/barn", "/ungdomar", "/skola", "/mobbning", "/friends"]}, {"id": 133, "title": "Inflationen faller oväntat mycket", "summary": "Inflationen enligt KPIF-måttet sjönk i oktober till 1,1 procent, från 1,5 procent föregående månad. Detta enligt preliminära beräkningar från SCB. Det var betydligt lägre än marknadens förväntningar som låg på 1,4 procent. Jämfört med föregående månad var konsumentpriserna oförändrade. Bortrensat för energipriser föll inflationen från 0,5 i september till 0,1 procent i oktober.", "title_original": "Inflationen faller oväntat mycket", "summary_original": "Inflationen enligt KPIF-måttet sjönk i oktober till 1,1 procent, från 1,5 procent föregående månad. Detta enligt preliminära beräkningar från SCB. Det var betydligt lägre än marknadens förväntningar som låg på 1,4 procent. Jämfört med föregående månad var konsumentpriserna oförändr dets församlingar", "summary_original": "Johanna Bode inför möten med volontärer: Vi måste se och pröva att det finns ett allt större intresse för kristen tro i samhället.", "link": "https://www.dagen.se/nyheter/pingstledare-efterlyser-nytt-saett-att-taenka-i-landets-foersamlingar/10614536", "date_display": "2026-11-05", "date_iso": "2026-11-05T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 143, "title": "Misstänkt mord – en person gripen", "summary": "Under onsdagskvällen har en person dött och en annan skadats allvarligt i Sollentuna norr om Stockholm.  I samband med polisinsatsen har en person gripits misstänkt för mord och mordförsök.  Polisen: Ingen fara för allmänheten Larmet kom in strax efter klockan 17 på onsdagen och polisen uppgav då att det rörde sig om ett misstänkt grovt brott.  – Vi misstänker ett grovt brott, det är det vi utreder nu, sade Ashkan Ardalan, presstalesperson på polisen, vid 18.30-tiden. Strax före 21.30 meddelade polisen att en person hade avlidit och en andra person skadats. Samtidigt uppgav polisen att man inte ser några kopplingar till andra ärenden.   – Vi bedömer händelsen som isolerad. Det finns ingen anledning att vara orolig för allmänheten och vi ser i nuläget inga kopplingar till organiserad brottslighet, säger Ashkan Ardalan.  Genomför vittnesförhör och teknisk undersökning Polisen meddelar att man nu kommer att utreda händelsen för att klarlägga omständigheterna kring det inträffade.  – Under kvällen kommer vi att hålla förhör med vittnen och genomföra teknisk undersökning för att utreda vad det är som har hänt, säger Ashkan Ardalan. I övrigt är polisen förtegen om ärendet.", "title_original": "Misstänkt mord – en person gripen", "summary_original": "Under onsdagskvällen har en person dött och en annan skadats allvarligt i Sollentuna norr om Stockholm.  I samband med polisinsatsen har en person gripits misstänkt för mord och mordförsök.  Polisen: Ingen ngprocessen och behörighetskontrollen i Slack, för att stärka kontrollen av vem som får tillgång till systemet. RHS (Rikshemvärnsstaben) har därför beslutat att pausa inbjudningar av nya användare, inklusive förnyade inbjudningar, tills det arbetet är klart”, lyder meddelandet som igår gick ut i Hemvärnets Slack-grupp, som TV4 Nyheterna tagit del av. ”Få lite ordning och reda” Från Rikshemvärnsstaben bekräftar man att organisationen försöker få kontroll över organisationens kommunikationsplattform: – Den här pausen är kopplad till ett pågående arbete med att se över onboardingprocessen och få lite ordning och reda i systemet. Det här är helt enkelt en del av den löpande förvaltningen av plattformen, säger Therese Fagerstedt, presschef för Hemvärnet. Har ni inte haft ordning och reda? – Ordning och reda är ett löpande arbete. Det är ingenting man bara gör en gång. Interna farhågor Flera anonyma hemvärnsaktiva har kontaktat TV4 Nyheterna med oro över att så mycket information legat öppen i Slack-systemet. Farhågor har framförts internt och i visselblåsarrapporter. För ett år sedan infördes tvåfaktors-autentisering. De ytterligare förändringar som nu tillkommer är välkomna. – Äntligen tar Hemvärnet de här problemen på allvar. Visst är det saktfärdigt, men det känns bra att de slutligen öppnar ögonen, säger en hemvärnsman som talat med TV4 anonymt. Främmande underrättelsetjänst Förra sommaren gjorde organisationen en egen säkerhetsanalys, som pekade på att innehållet i plattformen kunde vara ”av intresse för främmande underrättelsetjänst”. Efter att TV4 Nyheterna ställt frågor har Hemvärnet gjort flera förändringar . Bland annat har inte alla medlemmar i Hemvärnet längre tillgång till alla profiler i Slack, och en del information maskas. Men enligt Rikshemvärnsstaben är det en slump att det sker just nu. – Det här är en del av en handlingsplan som har legat sen i somras. Det har egentligen inte alls att göra med att TV4 har börjat ställa frågor, säger Therese Fagerstedt, presschef på Rikshemvärnsstaben.", "title_original": "Hemvärnet pausar nya Slack-användare: ”Vill stärka kontrollen”", "summary_original": "TV4 Nyheterna har avslöjat hur delar av Hemvärnets organisation legat öppet i gruppens generella Slack-verktyg. Slack är en amerikansk kommunikationsplattform som började användas av Hemvärnet för ett par år sedan. Men användandet har också fått kritik, eftersom de 22 000 medlemmarna har kunnat se varandras profiler, mailadresser och i många fall befattning, enhet, telefonnummer och bild. Säkerhetsexperter har kritiserat Hemvärnets användande av Slack, och menat att det varit aningslöst. Igår fattade Hemvärnet beslut om att stoppa nya medlemmar i Slack-systemet. ”Vi ser över onboardingprocessen och behörighetskontrollen i Slack, för att stärka kontrollen av vem som får tillgång till systemet. RHS (Rikshemvärnsstaben) har därför beslutat att pausa inbjudningar av nya användare, inklusive förnyade inbjudningar, tills det arbetet är klart”, lyder meddelandet som igår gick ut i Hemvärnets Slack-grupp, som TV4 Nyheterna tagit del av. ”Få lite ordning och reda” Från Rikshemvärnsstaben bekräftar man att organisationen försöker få kontroll över organisationens kommunikationsplattform: – Den här pausen är kopplad till ett pågående arbete med att se över onboardingprocessen och få lite ordning och reda i systemet. Det här är helt enkelt en del av den löpande förvaltningen av plattformen, säger Therese Fagerstedt, presschef för Hemvärnet. Har ni inte haft ordning och reda? – Ordning och reda är ett löpande arbete. Det är ingenting man bara gör en gång. Interna farhågor Flera anonyma hemvärnsaktiva har kontaktat TV4 Nyheterna med oro över att så mycket information legat öppen i Slack-systemet. Farhågor har framförts internt och i visselblåsarrapporter. För ett år sedan infördes tvåfaktors-autentisering. De ytterligare förändringar som nu tillkommer är välkomna. – Äntligen tar Hemvärnet de här problemen på allvar. Visst är det saktfärdigt, tt bonden alltid har varit blyg när det kommer till tjejer. – Han tar ju inte steget fram, han tar ofta steget tillbaka. Mot slutet av kvällen, när det blivit dags för dans, frågar Christian vem av tjejerna han vill bjuda upp först. – Jag vet inte, vi får se. Jag tycker det känns stelt att bara börja dansa så här, svarar Daniel. I stället för att bjuda upp någon av brevskrivarna dansar han med sin syster. – Han har tre tjejer att bjuda upp, så tar han sin syster. Jag tyckte ändå att jag satt där och var väldigt tillgänglig och redo, så jag tror ändå att han borde ha fattat det. Men någonting gör ju att han inte riktigt vågar, säger Matilda Rantanen. ”Väldigt mycket kompisar” När Christian påpekar att Daniel nog har missuppfattat uppgiften bryter Matilda in och säger att han hade chansen att dansa med dem. – Nu är vi väldigt mycket kompisar. Och om han vill att det ska bli mer än kompisar behöver han visa det nu. Jag ska verkligen försöka förstå hans perspektiv och att han är blyg. Men det var ju öppet mål. Efter dansen säger Daniel att det har varit intensivt och svårt att vara på alla ställen samtidigt. – Jag kanske kunde ha prioriterat annorlunda, men det var svårt att få till. Man har velat mer än man kunnat. Det är jag lite besviken på mig själv över, säger han. Kompisen Christian är orolig för att Daniel blir överkörd av tjejerna om han fortsätter att hålla sig tillbaka. – Man har ju lite magont för honom, säger han.", "title_original": "Dansar hellre med systern – än med sina tre dejter", "summary_original": "I kväll är det fest i ”Bonde söker fru” när Daniel Eliasson har bjudit in vänner och familj till gården för att fira sin födelsedag. Brevskrivarna är nyfikna på hur han ska få tid för dem när det händer så mycket annat runt omkring och familjen vill förstås se Daniel tillsammans med dem som uppvaktar honom. Men bonden tar inte särskilt mycket plats socialt. – Han kommer ju inte fram och kollar av läget, om man mår bra, hur det är eller vad man tycker och känner, säger Marielle Isaksson i programmet. Dansar i stället med sin syster Kritiken kommer efter att Daniel i förra avsnittet blev grillad av brevskrivarna som tyckte att han borde våga närma sig dem mer och kanske ge en komplimang eller två då och då. Daniels kompis Christian har känt honom sedan skolåren och säger i kvällens avsnitt att bonden alltid har varit blyg när det kommer till tjejer. – Han tar ju inte steget fram, han tar ofta steget tillbaka. Mot slutet av kvällen, när det blivit dags för dans, frågar Christian vem av tjejerna han vill bjuda upp först. – Jag vet inte, vi får se. Jag tycker det känns stelt att bara börja dansa så här, svarar Daniel. I stället för att bjuda upp någon av brevskrivarna dansar han med sin syster. – Han har tre tjejer att bjuda upp, så tar han sin syster. Jag tyckte ändå att jag satt där och var väldigt tillgänglig och redo, så jag tror ändå att han borde ha fattat det. Men någonting gör ju att han inte riktigt vågar, säger Matilda Rantanen. ”Väldigt mycket kompisar” När Christian påpekar att Daniel nog har missuppfattat uppgiften bryter Matilda in och säger att han hade chansen att dansa med dem. – Nu är vi väldigt mycket kompisar. Och om han vill att det ska bli mer än kompisar behöver han visa det nu. Jag ska verkligen försöka förstå hans perspektiv och att han är blyg. Men det var ju öppet mål. Efter dansen säger Daniel att det har varit intensivt och svårt att vara på alla ställen samtidigt. – Jag kanske kunde ha prioriterat annorlunda, men det var svårt att få till. Man har velat mer än man kunnat. Det är jag lite besviken på mig själv över, säger han. Kompisen Christian är orolig för att Daniel blir överkörd av tjejerna om han fortsätter att hålla sig tillbaka. – Man har ju lite magont för honom, säger han.", "link": "https://www.tv4.se/artikel/5rH0JAlGa7DKM1o0fTsx0I/dansar-hellre-med-systern-aen-med-sina-tre-dejter", "date_display": "2026-11-04", "date_iso": "2026-11-04T20:30:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/bonde", "/tv", "/tv4", "/tv4-play"]}, {"id": 146, "title": "Säpochefen varnar för ryska sabotagehotet: ”Förbrukningsagenter”", "summary": "Säpo har på onsdagen informerat försvarsberedningen om hotbilden mot Sverige. Fredrik Hallström, operativ chef på Säpo, säger att sabotagehotet från Ryssland bedöms vara högt. – Det riktar sig främst mot försvarsindustrin, det vill säga det stöd som Sverige ger Ukraina. Sabotagehotet bedöms inte bara som högt – det ökar. Detta eftersom det ryska riskbenägenheten och ambitionen har ökat, säger Hallström. Kan använda kriminella ”förbrukningsagenter” Konkret det här ta sig uttryck i attentat, som ”förbrukningsagenter” kan användas för att utföra. Det kan även vara cyberattacker eller att personer försöker kartlägga mål i Sverige. – Jag skulle säga att det finns ett flertal olika individer som mot betalning skulle kunna tänka sig genomföra en attack eller något riktat mot ett mål som Ryssland uppfattar är centralt, säger Fredrik Hallström. – Det kan vara kriminella individer eller individer som är i behov av pengar, inte bara kvalificerade inresta agenter. Vill inte kommentera om konkreta hot avvärjts Hallström säger att arbetet fortsätter med att hitta och skydda sig mot hot. – Vi har löpande tagit initiativ till kontakter ända sedan krigsutbrottet mot försvarsindustrin, och informerat om lägesbilden så att de skyddsåtgärder som behöver behöver vidtas, också vidtas. Har konkreta hot avvärjts? – Jag kan inte kommentera det.", "title_original": "Säpochefen varnar för ryska sabotagehotet: ”Förbrukningsagenter”", "summary_original": "Säpo har på onsdagen informerat försvarsberedningen om hotbilden mot Sverige. Fredrik Hallström, operativ chef på Säpo, säger att sabotagehotet från Ryssland bedöms vara högt. – Det riktar sig främst mot försvarsindustrin, det vill säga det stöd som Sverige ger Ukraina. Sabotagehotet bedöms inte bara som högt – det ökar. Detta eftersom det ryska riskbenägenheten och ambitionen har ökat, säger Hallström. Kan använda kriminella ”förbrukningsagenter” Konkret det här ta sig uttryck i attentat, som ”förbrukningsagenter” kan användas för att utföra. Det kan även vara cyberattacker eller att personer försöker kartlägga mål i Sverige. – Jag skulle säga att det finns ett flertal olika individer som mot betalning skulle kunna tänka sig genomföra en attack eller något riktat mot ett mål som Ryssland uppfattar är centralt, säger Fredrik Hallström. – Det kan vara kriminella individer eller individer som är i behov av pengar, inte bara kvalificerade inresta agenter. Vill inte kommentera om konkreta hot avvärjts Hallström säger att arbetet fortsätter med att hitta och skydda sig mot hot. – Vi har löpande tagit initiativ till kontakter ända sedan krigsutbrottet mot försvarsindustrin, och informerat om lägesbilden så att de skyddsåtgärder som behöver behöver vidtas, också vidtas. Har konkreta hot avvärjts? – Jag kan inte kommentera det.", "link": "https://www.tv4.se/artikel/60W0OTpkfaQHyOyrc9evMS/saepochefen-varnar-foer-ryska-sabotagehotet-foerbrukningsagenter", "date_display": "2026-11-04", "date_iso": "2026-11-04T19:55:13+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Svenska försvaret", "/svenska-forsvaret", "/sapo", "/ryssland", "/inrikes"]}, {"id": 147, "title": "Här springer råttan runt på hamburgerrestaurangen", "summary": "En film från Max vid Medborgarplatsen har väckt starka reaktioner på nätet. På klippet syns en råtta springa fram och tillbaka bland gästerna, som till synes obekymrat fortsätter äta. Men Isa Zand som själv var på plats och filmade klippet berättar att många reagerade starkt på händelsen. – Vi ser att folk härjar och att det är mycket liv. Vi undrar vad som händer. Då ser man en liten råtta, säger Isa Zand. Isa Zand hade varit ute på AW med sina kollegor innan de gick till hamburgerrestaurangen. Både hon och kollegorna blev förvånade över att flera gäster ändå verkade obrydda över råttan. – Vissa satt bara kvar och åt sin mat medan råttan sprang förbi, säger Isa Zand. AI-misstankar Klippet har fått över 133 000 visningar på Tiktok och många har ifrågasatt om det verkligen är äkta. Men Isa Zand försäkrar att filmen är genuin. – Det var flera som skrev att det såg ut som AI, men det var legit. Folk var nästan vana vid att det var råttor i Max. Ingen reaktion alls, säger hon. Efter att filmen fått stor spridning har Max agerat och låtit både Anticimex och Stockholms stads miljö- och hälsoenhet kontrollera restaurangen. ”Vi uppmärksammade den publicerade filmen på lördag morgon. Vi valde att ta den på stort allvar och vidtog genast åtgärder. Vår skadedjurspartner Anticimex har utfört kontroller. Stockholms stads miljö- och hälsoenhet har besökt restaurangen och fann inga spår av skadedjur i våra lokaler”, skriver Max i en kommentar till TV4. Råttan sprang över brickor Efter händelsen är Isa Zand tveksam till att besöka hamburgerrestaurangen igen. – Efter den här incidenten har jag lite svårt att gå dit för jag är ganska känslig när det kommer till sånt här. Nu säger de att de har inspekterat så man får väl se om det blir någon förbättring, säger hon. Zand beskriver hur hon blev särskilt påverkad av att se råttan springa på brickorna där maten serveras. – Det är det som blir så äckligt. Sådana bakterier… Jag vet inte om det går att få bort, säger hon.", "title_original": "Här springer råttan runt på hamburgerrestaurangen", "summary_original": "En film från Max vid Medborgarplatsen har väckt starka reaktioner på nätet. På klippet syns en råtta springa fram och tillbaka bland gästerna, som till synes obekymrat fortsätter äta. Men Isa Zand som själv var på plats och filmade klippet berättar att många reagerade starkt på händelsen. – Vi ser att folk härjar och att det är mycket liv. Vi undrar vad som händer. Då ser man en liten råtta, säger Isa Zand. Isa Zand hade varit ute på A  en telefon att ringa. Deltagaren Sebastian Tarkowski svarar. – Det här är Martin och om tio minuter, klockan tickar nu, ska du packa dina grejer och åka till Gränslandet om du inte lyckas få någon annan att ta över det här samtalet, säger programledaren Martin Järborg. Telefonsamtalet fortsätter och efter ett par minuter lämnar Sebastian över luren till Petra Sjödin som i sin tur ger den till Jessica Lasses. Hon får då veta att det bara återstår fem sekunder av tiden och tvingas därmed åka till Gränslandet. – Fan säger jag bara, säger Jessica. ”Hennes närmsta vän” Efteråt är hela lägret i chock. – Jessica? Hennes närmaste vän här i lägret. Jag förstår inte hur hon tänker, säger Sebastian. – Vad hände? Jag fattar inte riktigt det här. Det var ju också Petras troligtvis närmaste. Var det så här det skulle sluta? säger Tommy Sarenbrant. Petra säger senare i programmet att hjärnan blir helt ”fucked up” av att inte äta och att hon själv inte förstår hur hon tänkte när hon skickade i väg sin bästa vän till Gränslandet. I ett sms till TV4 Nyheterna skriver hon att hon inte uppfattade uppgiften i all stress och press. ”Om jag ens visste det själv haha! Skulle nog säga totalt hjärnsläpp”, skriver hon. Därför fick hon telefonen Jessica Lasses köper hennes förklaring till viss del och tror absolut att Petra blev stressad av situationen. Särskilt eftersom Petra var den i lägret som gärna höll sig i bakgrunden och inte ville stå i fokus, enligt henne. Den som väljer att skicka någon till Gränslandet så här sent i programmet gör att man ses som en stark spelare och ett hot. ”Jag vet att Petra inte ville ha ut mig, däremot har jag nu i min otroligt överarbetade och överanalyserande analys tänkt att det kan nog ha varit så att Petras tanke med att ge luren till mig kan ha varit för att hon själv skulle slippa att ta beslutet om att välja vem som skulle lämna”, skriver Jessica, som har gått och grubblat på händelsen i månader. Enligt Jessica var Petra helt knäckt efteråt och när de två har pratat om händelsen har hon bett om ursäkt flera gånger. ”Det är ett spel och jag skulle aldrig låta den tiden jag och Petra haft och allt vi upplevt tillsammans och den tillit jag kände till henne i spelet raseras i det riktiga livet av en sån här grej. (Även om jag fortfarande känner att det kan ha varit det klantigaste en person någonsin har gjort i Robinsons historia hahaha).", "title_original": "Skickar ut bästa vännen: ”Totalt hjärnsläpp”", "summary_original": "På ”Robinson” börjar en telefon att ringa. Deltagaren Sebastian Tarkowski svarar. – Det här är Martin och om tio minuter, klockan tickar nu, ska du packa dina grejer och åka till Gränslandet om du inte lyckas få någon annan att ta över det här samtalet, säger programledaren Martin Järborg. Telefonsamtalet fortsätter och efter ett par minuter lämnar Sebastian över luren till Petra Sjödin som i sin tur ger den till Jessica Lasses. Hon får då veta att det bara återstår fem sekunder av tiden och tvingas därmed åka till Gränslandet. – Fan säger jag bara, säger Jessica. ”Hennes närmsta vän” Efteråt är hela lägret i chock. – Jessica? Hennes närmaste vän här i lägret. Jag förstår inte hur hon tänker, säger Sebastian. – Vad hände? Jag fattar inte riktigt det här. Det var ju också Petras troligtvis närmaste. Var det så här det skulle sluta? säger Tommy Sarenbrant. Petra säger senare i programmet att hjärnan blir helt ”fucked up” av att inte äta och att hon själv inte förstår hur hon tänkte när hon skickade i väg sin bästa vän till Gränslandet. I ett sms till TV4 Nyheterna skriver hon att hon inte uppfattade uppgiften i all stress och press. ”Om jag ens visste det själv haha! Skulle nog säga totalt hjärnsläpp”, skriver hon. Därför fick hon telefonen Jessica Lasses köper hennes förklaring till viss del och tror absolut att Petra blev stressad av situationen. Särskilt eftersom Petra var den i lägret som gärna höll sig i bakgrunden och inte ville stå i fokus, enligt henne. Den som väljer att skicka någon till Gränslandet så här sent i programmet gör att man ses som en stark spelare och ett hot. ”Jag vet att Petra inte ville ha ut mig, däremot har jag nu i min otroligt överarbetade och överanalyserande analys tänkt att det kan nog ha varit så att Petras tanke med att ge luren till mig kan ha varit för att hon själv skulle slippa att ta beslutet om att välja vem som skulle lämna”, skriver Jessica, som har gått och grubblat på händelsen i månader. Enligt Jessica var Petra helt knäckt efteråt och när de två har pratat om händelsen har hon bett om ursäkt flera gånger. ”Det är ett spel och jag skulle aldrig låta den tiden jag och Petra haft och allt vi upplevt tillsammans och den tillit jag kände till henne i spelet raseras i det riktiga livet av en sån här grej. (Även om jag fortfarande känner att det kan ha varit det klantigaste en person någonsin har gjort i Robinsons historia hahaha).", "link": "https://www.tv4.se/artikel/7qQ06FhlGLhY8gVX6CtBM/skickar-ut-baesta-vaennen-totalt-hjaernslaepp", "date_display": "2026-11-04", "date_iso": "2026-11-04T19:00:04+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/robinson", "/tv4", "/tv4-play"]}, {"id": 149, "title": "Riksbankschefen: Fler räntehöjningar kan vänta", "summary": "Riksbanken motiverar beslutet med att svensk ekonomi går starkt, men att inflationen drivs upp av både inhemsk efterfrågan och stigande energipriser. Enligt riksbankschefen Erik Thedéen handlar det om att agera i förebyggande syfte för att undvika att priserna biter sig fast på en hög nivå. Osäkerhet kring framtida räntebesked Många hushåll är oroliga för hur deras ekonomi påverkas, särskilt de med stora bolån. Erik Thedéen betonar att svenska hushåll generellt har goda marginaler, men att räntehöjningen ändå kan bli kännbar på kort sikt. – På kort sikt drabbar det hushållen, framför allt om man har bolån. Men alternativet, att inte agera, innebär ännu sämre utveckling längre fram, säger han. Riksbanken flaggar för att flera höjningar kan bli aktuella inom ett år, men utesluter inte att räntan kan lämnas oförändrad vid nästa besked i december. – Vi är alltid lite vaga om framtiden, för det är en så osäker framtid. Men vi har en ränteprognos som säger upp till två höjningar på ett års sikt, säger Erik Thedéen. Ekonomiska risker kvarstår Trots oro bland hushållen menar Thedéen att svensk ekonomi i stort går bra och att de flesta fått en positiv reallöneutveckling de senaste åren. Samtidigt pekar han på att framtida beslut om räntan påverkas av faktorer som utvecklingen i USA, Mellanöstern och energipriserna. – Exakt tajming beror på den data vi får. Vi har en idé om hur mycket vi behöver höja, men är inte säkra, säger han.", "title_original": "Riksbankschefen: Fler räntehöjningar kan vänta", "summary_original": "Riksbanken motiverar beslutet med att svensk ekonomi går starkt, men att inflationen drivs upp av både inhemsk efterfrågan och stigande energipriser. Enligt riksbankschefen Erik Thedéen handlar det om att agera i förebyggande syfte för att undvika att priserna biter sig fast på en hög nivå. Osäkerhet kring framtida räntebesked Många hushåll är oroliga för hur deras ekonomi påverkas, särskilt de med stora bolån. Erik Thedéen betonar att svenska hushåll generellt har goda marginaler, men att räntehöjningen ändå kan bli kännbar på kort sikt. – På kort sikt drabbar det hushållen, framför allt om man har bolån. Men alternativet, att inte agera, innebär ännu sämre utveckling längre fram, säger han. Riksbanken flaggar för att flera höjningar kan bli aktuella inom ett år, men utesluter inte att räntan kan lämnas oförändrad vid nästa besked i december. – Vi är alltid lite vaga om framtiden, för det är en så osäker framtid. Men vi har en ränteprognos som säger upp till två höjningar på ett års sikt, säger Erik Thedéen. Ekonomiska risker kvarstår Trots oro bland hushållen menar Thedéen att svensk ekonomi i stort går bra och att de flesta fått en positiv reallöneutveckling de senaste åren. Samtidigt pekar han på att framtida beslut om räntan påverkas av faktorer som utvecklingen i USA, Mellanöstern och energipriserna. – Exakt tajming beror på den data vi får. Vi har en idé om hur mycket vi behöver höja, men är inte säkra, säger han.", "link": "https://www.tv4.se/artikel/3OGcUgjygnODUtsxvztTHT/riksbankschefen-fler-raentehoejningar-kan-vaenta", "date_display": "2026-11-04", "date_iso": "2026-11-04T18:41:57+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/riksbanken", "/rantebesked", "/svensk-ekonomi", "/privatekonomi"]}, {"id": 150, "title": "Skyller förlusten på kriget i Iran: ”Jag hade gjort det igen”", "summary": "Trump bryter tystnaden efter förlusten • ”Om jag var på valsedeln hade vi vunnit”", "title_original": "Skyller förlusten på kriget i Iran: ”Jag hade gjort det igen”", "summary_original": "Trump bryter tystnaden efter förlusten • ”Om jag var på valsedeln hade vi vunnit”", "link": "https://www.tv4.se/artikel/2E2Jwo7kd9BL9PW10kokbU/trump-hade-gatt-in-i-iran-igen-om-jag-var-tvungen", "date_display": "2026-11-04", "date_iso": "2026-11-04T18:29:35+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 151, "title": "Sigtunaskolan ställer in julspex: ”Djupt problematiska inslag”", "summary": "Efter de misstänkta övergreppen på Sigtunaskolan har skolledningen meddelat föräldrar att man inlett en genomlysning av verksamheten. I ett mejl som gått ut till vårdnadshavare efter höstlovet, som TV4 Nyheterna har tagit del av, skriver skolledningen att man ställer in en specifik populär aktivitet – det årliga julspexet.  ”I år är vi inte beredda att ta några risker”, skriver de i mejlet. ”Djupt problematiska inslag” Som bakgrund till beslutet skriver skolledningen att man tar de rapporterade incidenterna på allvar.  ”Polisutredningen efter de allvarliga händelserna i oktober pågår. Vi förväntar oss att det någon gång under tiden fram till jul kommer att väckas åtal och kanske också hållas rättegång”, skriver skolledningen. Skolledningen skriver att man sedan händelserna i oktober har mötts av berättelser om destruktiva strukturer och negativa inslag i kulturen på skolan, och att man nu vill gå till botten med problemen.  ”Styrelsen har initierat en genomlysning av verksamheten”, skriver de. Julspexet pekas ut som en särskilt uppmärksammad händelse, och skolledningen skriver att man har behövt hantera både öppna och förtäckta kränkningar i samband med spexen. ”Det är för många en rolig och positiv upplevelse, men det har också vid upprepade tillfällen haft djupt problematiska inslag”. Det är med den motiveringen som man ställer in spexet. Skolledningen skriver att det finns en oro bland föräldrar att det tas förhastade beslut och att ”kulturbärande aktiviteter får stryka på foten”. Skolan hänvisar till att man behöver agera och tänka långsiktigt. Sigtunaskolans svar TV4 Nyheterna har via mejl frågat Sigtunaskolans vd och skolchef Sofia Kinberg om beslutet. Frågorna handlar om den interna genomlysningen, julspexets ”problematiska inslag” och varför man tidigare tillåtit öppna och förtäckta kränkningar i samband med spexen. \n\n”Det stämmer att vi gör en del förändringar under den här perioden. Vi diskuterar dem med våra elever och deras vårdnadshavare. Vi kommer att återkomma om genomlysningen. I övrigt finns det inget mer att säga just nu”, skriver Sofia Kinberg i ett mejl till TV4 Nyheterna.  Vid en så kallad nollning på internatskolan Sigtunaskolan Humanistiska Läroverket ska flera maskerade elever, enligt uppgifter till TV4 Nyheterna, ha ”straffat och förnedrat” yngre elever.  Tre elever i 18-årsåldern sitter häktade misstänkta för bland annat grovt sexuellt ofredande och misshandel. Ytterligare två personer misstänks för misshandel och olaga tvång, men är inte häktade.", "title_original": " rysdiskar hackade. Enligt franska BFM TV ska hackarna då lyckats ”aktivera avfrostningssystemen i ett stort antal butiker”. I Sverige ledde incidenten till att matvaror för flera hundra tusen kronor behövde slängas. På onsdagen hävdade grupperna Noname057(16) och Z-Pentest att de ligger bakom tillslaget, och flera andra i Europa. Grupperna uppger att de även har möjlighet att påverka vattenförsörjningssystem, kraftverk och industrianläggningar.  Samtidigt skriver Cybernews att inläggen inte är verifierade och att de efter publicering plockats ned. Säpo: ”Allvarligt” Tidigare har polisen uppgett att man utreder attackerna och har flaggat för att det kan finnas ett mörkertal kopplat till incidenten. Säpo meddelar att man följer händelsen för att kunna bringa klarhet i vem som orsakat skadan.   – Det är naturligtvis allvarligt. Nu har Polismyndigheten en förundersökning och Nationellt cybersäkerhetscenter har varit involverat i det. Säkerhetspolisen följer naturligtvis det här för att kunna förstå och bedöma vilken aktör som ligger bakom och varför det genomförs, säger Fredrik Hallström, operativ chef på Säpo. \n\nFinns risken att det skulle kunna vara en statsaktör som ligger bakom det här?\n\n– Det är inget jag kan uttala mig om i nuläget. Vi behöver göra ett arbete för att låta oss förstå vad som ligger bakom och varför, säger Fredrik Hallström.", "title_original": "Uppgifter: Proryska hackare tar på sig frysattackerna", "summary_original": "Under natten till måndagen utsattes flera svenska matbutiker för en hackerattack, vilket ledde till att kylar och frysar höjdes till 50 grader. Nu har två proryska hackergrupper tagit på sig attackerna, rapporterar italienska Ansa. ”Det fanns inget behov av någon skadlig kod. Vi utnyttjade helt enkelt de integrerade systemen”, säger de i ett uttalande på sociala medier. Hävdar att de kan påverka kraftverk I förra veckan fick hundratals matbutiker över hela Frankrike sina kyl- och frysdiskar hackade. Enligt franska BFM TV ska hac   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
