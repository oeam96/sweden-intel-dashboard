, "summary_original": "Niclas Madestam har lämnat • ”Organisationen behöver en annan person med andra gåvor”", "link": "https://www.dagen.se/nyheter/compassion-i-norden-soeker-ny-generalsekreterare-igen/10270721", "date_display": "2026-03-28", "date_iso": "2026-03-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 149, "title": "Now SVT is showing the blockbuster Nunnan", "summary": "The film's director: That's where it gets its big audience", "title_original": "Nu visar SVT biosuccén Nunnan", "summary_original": "Filmens regissör: Det är ju där den får sin stora publik", "link": "https://www.dagen.se/kultur/nu-visar-svt-biosuccen-nunnan/10269244", "date_display": "2026-03-28", "date_iso": "2026-03-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 150, "title": "Nalin Baksi: The Church of Sweden is naive in its collaborations with Islamists", "summary": "She became the first Muslim to be elected to Sweden's Riksdag, and over the years has often warned of the progress of Islamism - for example when Islamist representatives are legitimized by the leaders of the Church of Sweden", "title_original": "Nalin Baksi: Svenska kyrkan är naiv i sina samarbeten med islamister", "summary_original": "Hon blev första muslim att väljas in i Sveriges riksdag, och har under åren ofta varnat för islamismens framfart – bland annat när islamistiska företrädare legitimeras av Svenska kyrkans ledare", "link": "https://www.dagen.se/nyheter/nalin-baksi-svenska-kyrkan-aer-naiv-i-sina-samarbeten-med-islamister/10258715", "date_display": "2026-03-28", "date_iso": "2026-03-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 151, "title": "Antje Jackelén on the criticism: I have a well-thought-out attitude", "summary": "Former Archbishop: If you want to contribute to a more peaceful world, you sometimes have to have conversations even with those who are considered controversial", "title_original": "Antje Jackelén om kritiken: Jag har en genomtänkt hållning", "summary_original": "Tidigare ärkebiskopen: Om man vill bidra till en fredligare värld måste man ibland ha samtal även med dem som anses kontroversiella", "link": "https://www.dagen.se/nyheter/antje-jackelen-om-kritiken-jag-har-en-genomtaenkt-hallning/10268665", "date_display": "2026-03-28", "date_iso": "2026-03-28T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 152, "title": "That is why the Ukrainian attack on the Russian oil tanker is so unusual", "summary": "Just a few miles off the Turkish coast, an unusual, audacious drone attack on an oil tanker in the Russian shadow fleet was carried out on Thursday. Every day, ships from the Russian shadow fleet pass the Bosphorus strait in and out of the Black Sea with oil products. The ships are sanctioned by the EU, but traffic has been going on since the outbreak of the Ukrainian war. But now the ships are no longer safe. \"Part of a well-thought-out strategy\" The drone attack yesterday against the ship Altura, which was transporting 140,000 tons of Russian crude oil, is the first to take place just north of Istanbul in one of Europe's busiest waterways. It is no coincidence. Ukraine has begun a new phase in its efforts to stop the flow of oil money into the Russian war coffers. - For Ukraine, it is not about random attacks on Russian ships, says Yevgenija Gaber, researcher at the Atlantic Council. - They are part of a well-thought-out strategy. For Russia, this is one of the most important sources of income and one of the largest additions to the budget and thus the war coffers. Fear in Turkey: \"Squeezed in\" No one TV4 News spoke to in Turkey expressed anger at the attack. But many are afraid of the increasingly intrusive presence of two major wars at the same time, both in Ukraine and Iran. - We feel squeezed. We get sad when we watch the news. It feels uneasy. We don't know what lies ahead, so we have to imagine the worst possible scenario and be careful, says Turkish pensioner Farda Gules. - When it does happen, it happens quickly and there you stand. I hope that the war does not spread and that it ends very soon, she says.", "title_original": "Därför är ukrainska attacken mot ryska oljetankern så ovanlig", "summary_original": "Bara några mil utanför den turkiska kusten genomfördes på torsdagen en ovanlig, djärv drönarattack mot en oljetanker i den ryska skuggflottan. Varje dygn passerar fartyg ur den ryska skuggflottan sundet Bosporen in och ut ur svarta havet med oljeprodukter. Fartygen är sanktionerade av EU, men trafiken har pågått sedan Ukrainakrigets utbrott. Men nu går inte fartygen säkra längre. ”Del av genomtänkt strategi” Drönarangreppet igår mot skeppet Altura som fraktade 140 000 ton rysk råolja är det första som skett strax norr om Istanbul i en av Europas mest trafikerade farleder. Det är ingen tillfällighet. Ukraina har inlett en ny fas i sina insatser för att stoppa inflödet av oljepengar till den ryska krigskassan. – För Ukraina handlar det inte om slumpmässiga angrepp på ryska fartyg, säger Jevgenija Gaber, forskare på Atlantic Council. – De är del av en genomtänkt strategi. För Ryssland är det här nämligen en av de viktigaste inkomstkällorna och ett av de största tillskotten till budgeten och därmed krigskassan. Rädsla i Turkiet: ”Inklämda” Ingen som TV4 Nyheterna pratar med i Turkiet uttrycker ilska mot attacken. Men många är rädda för den alltmer påträngande närvaron av två storkrig samtidigt, både i Ukraina och Iran. – Vi känner oss inklämda. Vi blir ledsna när vi tittar på nyheterna. Det känns oroligt. Vi vet inte vad som väntar, så vi måste föreställa oss det värsta tänkbara scenariot och vara försiktiga, säger den turkiska pensionären Farda Gules. – När det väl händer går det snabbt och där står man. Jag hoppas att kriget inte sprider sig och att det tar slut väldigt snart, säger hon.", "link": "https://www.tv4.se/artikel/62JBjW2Gysik15bNGZgJ4l/attacken-mot-rysk-oljetanker-tyder-pa-djaervare-ukraina-inte-slumpmaessigt", "date_display": "2026-03-27", "date_iso": "2026-03-27T21:16:45+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/ukrainakonflikten", "/ryssland", "/irankriget", "/turkiet"]}, {"id": 153, "title": "The giant baby first to leave \"Masked singer\"", "summary": "\"Masked singer\" is back and the only one still left in the original panel is Pernilla Wahlgren. This year's new addition Edvin Törnblom - who himself came second in the program as the \"jellyfish\" in 2023 - was the one who guessed that it was the Tiktok star Isa Östling who would appear when the head of the costume was taken off. That was the clue about \"Game of thrones\", I know that Isa is from Västerås, he said. Isa Östling, who previously participated in \"Let's dance\" and \"Frrädarna\" is used to going out early in similar play programs. It has been so hard to sing. It's my phobia, she said after the revelation. That it was Edvin Törnblom who guessed correctly did not surprise her. I said before that if anyone is going to second-guess me, it's him. Pernilla Wahlgren praised Östling's singing performance and guessed that first Omar Rudberg and then Tone Sekelius disguised themselves as a giant baby. Carina Berg was out cycling, when she guessed Edvin Törnblom's partner Johanna Nordström - who appeared as a \"dragon\" already in 2021. However, there is no rule that says that celebrities cannot appear several times in the program, pointed out David Hellenius, even if it did not happen in all of the previous five seasons.", "title_original": "Jättebebisen först att åka ur ”Masked singer”", "summary_original": "”Masked singer” är tillbaka och den enda som fortfarande är kvar i ursprungspanelen är Pernilla Wahlgren. Årets nya tillskott Edvin Törnblom – som själv kom tvåa i programmet som ”manet” 2023 – blev den som gissade att det var Tiktokstjärnan Isa Östling som skulle dyka upp när huvudet på dräkten togs av. Det var ledtråden om ”Game of thrones”, jag vet ju att Isa är från Västerås, sade han. Isa Östling, som tidigare medverkat i ”Let's dance” och ”Förrädarna” är van att åka ut tidigt i liknande lekprogram. Det har varit så jobbigt att sjunga. Det är min fobi, sade hon efter avslöjandet. Att det var just Edvin Törnblom som gissade rätt förvånade henne inte. Jag sade innan att om det är någon som kommer gissa på mig så är det han. Pernilla Wahlgren hyllade Östlings sånginsats och gissade på att först Omar Rudberg och sedan Tone Sekelius maskerat sig till en gigantisk bebis. Carina Berg var ute och cyklade, då hon gissade på Edvin Törnbloms parhäst Johanna Nordström – som medverkade som ”drake” redan 2021. Det finns dock ingen regel som säger att kändisar inte får medverka flera gånger i programmet, påpekade David Hellenius, även om det inte hänt under alla tidigare fem säsonger.", "link": "https://www.tv4.se/artikel/tt-260327-maskedsinger1-923e16a9/jattebebisen-forst-att-aka-ur-masked-singer", "date_display": "2026-03-27", "date_iso": "2026-03-27T21:00:23+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/sverige", "/konst", "/vasteras", "/kultur", "/vastmanland", "/edvin-tornblom", "/tone-sekelius", "/personer/david-hellenius", "/personer/pernilla-wahlgren"]}, {"id": 154, "title": "The League's theft tour - went around stealing elderly people's wallets", "summary": "It was in Sala that the investigation took off. The men were arrested after a theft - and could then be linked to surveillance images from a shop in Gävle, where they stole the wallet from an elderly woman. \n\nWhen the police obtained a description, it turned out that the men traveled around and committed similar crimes in several locations. In connection with the trial, the elderly woman said that she wanted them to be convicted and deported, which is now also the case. Aimed at the elderly According to the verdict from the Gävle district court, the men have carried out thefts on at least seven occasions, often in shops where they came across wallets from elderly people.\n\nIn several cases, cash was stolen, but sometimes credit cards were also used to withdraw money. The crimes have been committed in several places in the country, including in Sala, Gävle, Uppsala, Kalix, Kramfors and Vännäs. The men, who are in their 40s and 50s, respectively, were arrested in February 2026 after an off-duty police officer noticed a vehicle that had previously been of interest. They could then be connected to several thefts, both from the fall of 2025 and the beginning of 2026. In some of the earlier crimes, a third person is also suspected of having participated. Being deported - despite being EU citizens The two men are now sentenced to two years and three months in prison each for eight cases of gross theft and several cases of fraud. They must also pay damages to the crime victims - at least SEK 5,000 per person, in addition to compensation for what was stolen. After the sentence has been served, the men must be deported from Sweden and prohibited from returning. If they violate the ban, they risk additional prison terms.\n\nThe verdict comes shortly after the Supreme Court ruled that even EU citizens can be deported for repeated crimes. In the current case, the risk of continued crime was considered to weigh heavily.", "title_original": "Ligans stöldturné – åkte runt och stal äldres plånböcker", "summary_original": "Det var i Sala som utredningen tog fart. Männen greps efter en stöld – och kunde då kopplas till övervakningsbilder från en butik i Gävle, där de stulit plånboken från en äldre kvinna. \n\nNär polisen fick fram ett signalement visade det sig att männen rest runt och begått liknande brott på flera orter. I samband med rättegången sa den äldre kvinnan att hon ville att de skulle dömas och utvisas, något som nu också blir fallet. Riktade in sig på äldre Enligt domen från Gävle tingsrätt har männen genomfört stölder vid minst sju tillfällen, ofta i butiker där de kommit över plånböcker från äldre personer.\n\nI flera fall stals kontanter, men ibland användes även kontokort för att ta ut pengar. Brotten har begåtts på flera platser i landet, bland annat i Sala, Gävle, Uppsala, Kalix, Kramfors och Vännäs. Männen, som är i 40- respektive 50-årsåldern, greps i februari 2026 efter att en ledig polis uppmärksammat ett fordon som tidigare varit av intresse. De kunde därefter kopplas till flera stölder, både från hösten 2025 och början av 2026. Vid vissa av de tidigare brotten misstänks även en tredje person ha deltagit. Blir utvisade – trots EU-medborgare  De två männen döms nu till två år och tre månaders fängelse vardera för åtta fall av grov stöld samt flera fall av bedrägeri. De ska också betala skadestånd till brottsoffren – minst 5 000 kronor per person, utöver ersättning för det som stulits. Efter att straffen avtjänats ska männen utvisas ur Sverige och förbjudas att återvända. Om de bryter mot förbudet riskerar de ytterligare fängelsestraff.\n\nDomen kommer kort efter att Högsta domstolen slagit fast att även EU-medborgare kan utvisas vid upprepade brott. I det aktuella fallet ansågs risken för fortsatt brottslighet väga tungt.", "link": "https://www.tv4.se/artikel/4HLF1ufswQwnvTDvwtNHEF/ligans-stoeldturne-akte-runt-och-stal-aeldres-planboecker", "date_display": "2026-03-27", "date_iso": "2026-03-27T20:41:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/gavle", "/brottsoffer", "/brott", "/aldrebedragerier"]}, {"id": 155, "title": "SAS flight attendant flew drunk - was taken by police at Arlanda", "summary": "The SAS plane had just landed at Arlanda in February and was preparing for the next flight when the police stepped on board and carried out a check. A female flight attendant was then taken into care by the patrol for being under the influence of alcohol. She blew positive in the police breathalyzer and admitted to the crime of flying drunk right away. - That's right, I'm not denying anything. I admit crime, she says in police interrogation. Hotel party: \"Three glasses of wine\" The SAS flight attendant told us that the night before she was at a birthday party in a hotel and had drunk alcohol. - Three glasses of wine, approximately. White wine. Very stupid of me that I didn't keep track of the hours and that it caused this, says the woman in the investigation. Police: Do you have anything you want to add? - It's the stupidest mistake I've ever made. On Thursday, the woman was convicted of flying drunk and must pay SEK 4,000 in daily fines. \"By the fact that she began her duties despite this knowledge, she has, according to the district court, been indifferent to the fact that she performed tasks of essential importance for flight safety despite the fact that she was under the influence of alcohol,\" writes the court. TV4 Nyheterna has repeatedly sought SAS for a comment.", "title_original": "SAS-flygvärdinna flög full – togs av polis på Arlanda", "summary_original": "SAS-planet hade precis landat på Arlanda i februari och höll på att förbereda inför nästa flygning när polisen klev ombord och genomförde en kontroll. En kvinnlig flygvärdinna blev då omhändertagen av patrullen för att ha varit alkoholpåverkad. Hon blåste positivt i polisens alkoholmätare och erkände brottet flygfylleri direkt. – Det stämmer, jag förnekar ingenting. Jag erkänner brott, säger hon i polisförhör. Hotellfest: ”Tre glas vin” SAS-flygvärdinnan berättade att hon kvällen innan var på en födelsedagsfest på ett hotell och hade druckit alkohol. – Tre glas vin, ungefär. Vitt vin. Väldigt dumt av mig att jag inte hade koll på timmarna och att det orsakade det här, säger kvinnan i utredningen. Polisen: Har du något du vill tillägga? – Det är det dummaste misstag jag någonsin gjort. På torsdagen dömdes kvinnan för flygfylleri och ska betala 4 000 kronor i dagsböter. ”Genom att hon trots denna vetskap påbörjade tjänstgöringen har hon enligt tingsrätten varit likgiltig inför att hon fullgjorde uppgifter av väsentlig betydelse för flygsäkerheten trots att hon var påverkad av alkohol”, skriver domstolen. TV4 Nyheterna har upprepade gånger sökt SAS för en kommentar.", "link": "https://www.tv4.se/artikel/8sm9NDqxcHXTtBjvvCfqw/sas-flygvaerdinna-floeg-full-togs-av-polis-pa-arlanda", "date_display": "2026-03-27", "date_iso": "2026-03-27T19:46:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/sas", "/arlanda", "/brott"]}, {"id": 156, "title": "Tiger Woods in car accident - suspected of drunk driving", "summary": "Golfer Tiger Woods has been involved in a car accident in Florida on Friday afternoon, reports ABC News. The car he was traveling in must have overturned, the channel writes. Tiger Woods should not be injured. Woods is said to have been seen at the scene and, according to a witness to TMZ, appeared to \"be okay\" under the circumstances. Released on bail After the accident, Woods was arrested for drunk driving, according to Sky News. John Budensiek, sheriff of Martin County, Florida, says Woods showed signs of intoxication and refused to provide a urine test, which is itself a felony. A police spokesperson confirms that Woods, who was not injured in the accident, has been released on bail. In Florida, a person must be detained for at least eight hours before being released on bail.  He is also suspected of vandalism. Trump: \"Close friend\" US President Donald Trump, who himself is an enthusiastic golfer, has spoken about Tiger Woods' accident to Reuters. - He is a very close friend of mine. It was an accident, that's all I know, he says. - An incredible man, but with some difficulties. I don't want to talk about it. Recently made a comeback Tiger Woods has been plagued with major injury problems in recent years. In October, Woods had back surgery for the seventh time and in March of last year he tore his hamstring. On Tuesday, the 50-year-old played his first competition in over a year when he played a match in the indoor league TGL.  After the comeback, Tiger stated to the media that he did not rule out play in the first major tournament of the year, the Masters, which takes place at Augusta National April 9-12.  - We'll see how it goes. I will train and play at home this week, keep trying to make progress, Woods said according to TT. Badly injured in 2021 In 2021, Woods was badly injured when he overturned his car in California. An investigation showed that he had then driven at 129 kilometers per hour, twice the speed limit. In the accident, he suffered severe leg injuries that required surgery.  Four years earlier, in 2017, Woods was arrested on suspicion of driving under the influence. He must then have been found like this", "title_original": "Tiger Woods i bilolycka – misstänks för rattfylla", "summary_original": "Golfaren Tiger Woods har varit inblandad i en bilolycka i Florida på fredagseftermiddagen, rapporterar ABC News. Bilen han färdades i ska ha voltat, skriver kanalen. Tiger Woods ska inte vara skadad. Woods ska ha synts på platsen och enligt ett vittne till TMZ sett ut att efter omständigheterna ”vara okej”. Släppt mot borgen Efter olyckan greps Woods för rattfylla, enligt Sky News. John Budensiek, sheriff i Martin county i Florida, säger att Woods visade tecken på berusning och vägrade ge urinprov, vilket i sig är ett brott. En talesperson för polisen bekräftar att Woods, som inte skadades i olyckan, släppts mot borgen. I Florida behöver en person vara frihetsberövad i minst åtta timmar innan man kan släppas mot borgen.  Han misstänks också för skadegörelse. Trump: ”Nära vän” USA:s president Donald Trump, som själv är en entusiastisk golfare, har uttalat sig om Tiger Woods olycka till Reuters. – Han är en väldigt nära vän till mig. Det har varit en olycka, det är allt jag vet, säger han. – En otrolig man, men med vissa svårigheter. Jag vill inte prata om det. Gjorde nyligen comeback Tiger Woods har de senaste åren slitits med stora skadeproblem. I oktober opererade Woods ryggen för sjunde gången och i mars i fjol slet han av hälsenan. I tisdags spelade 50-åringen sin första tävling på över ett år när han spelade en match i inomhusligan TGL.  Efter comebacken uppgav Tiger för media att han inte uteslöt spel i årets första majortävling Masters som går av stapeln på Augusta National 9–12 april.  – Vi får se hur det går. Jag kommer träna och spela hemma den här veckan, fortsätta försöka göra framsteg, sade Woods enligt TT. Skadades svårt 2021 2021 skadades Woods svårt när han voltade med sin bil i Kalifornien. En utredning visade att han då hade kört i 129 kilometer i timmen, dubbla hastighetsgränsen. I olyckan ådrog han sig svåra skador i benet som krävde operation.  Fyra år tidigare, 2017, greps Woods efter misstankar om att han kört påverkad. Han ska då ha hittats sovandes i sitt fordon stillaståendes mitt på vägen med motorn igång. Tiger Woods anses vara en av tidernas mest framstående golfare och har bland annat vunnit på PGA-touren 82 gånger. Han har dessutom vunnit samtliga fyra ”majors” vid flera tillfällen. Så sent som 2019 vann han US Masters för femte gången.", "link": "https://www.tv4.se/artikel/28cCeNFNPzxvHcEbfpL0l4/tiger-woods-i-bilolycka-oklart-skadelaege", "date_display": "2026-03-27", "date_iso": "2026-03-27T19:30:21+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/sport", "/tiger-woods", "/golf", "/bilolycka", "/usa"]}, {"id": 157, "title": "Heavy criticism of the state secretary's holdings of Russian shares", "summary": "The Social Democrats' party secretary Tobias Baudin (S) is now furious that Ebba Busch's employee Simon Westeberg has bought Russian shares. In a comment to TV4 Nyheterna, Baudin also criticizes Prime Minister Ulf Kristersson (M): \"At the same time that Ulf Kristersson condemns Russia's war against Ukraine, people in his own government invest in companies that do Vladimir Putin's business. It is extremely serious. I assume that the Prime Minister will now make an assessment of whether it is appropriate for the person to continue working for the government. At the same time, I expect Ulf Kristersson to ensure that no one in the government invests in Putin's Russia.\" Two Russian companies In the government's list of the state secretaries' financial holdings, it appears that Simon Westberg, state secretary at the Ministry of Climate and Business for Ebba Busch (KD), owns shares in two Russian companies. The companies are Rosagro, a large Russian agricultural company, and Phosagro, which manufactures fertilizers.  Westberg bought the shares in connection with Russia's annexation of Ukraine in February 2022. Intends to sell the shares Simon Westberg states to TV4 Nyheterna that it was \"a wrong decision\" to make the share purchase in 2022. He also says that he intends to sell the shares. \"I do not want to own the shares and will sell them as soon as it is permitted and possible,\" writes Simon Westberg.", "title_original": "Kraftig kritik mot statssekreterarens innehav av ryss-aktier", "summary_original": "Socialdemokraternas partisekreterare Tobias Baudin (S) rasar nu mot att Ebba Buschs medarbetare Simon Westeberg har köpt ryska aktier. I en kommentar till TV4 Nyheterna riktar Baudin kritik även mot statsminister Ulf Kristersson (M): ”Samtidigt som Ulf Kristersson fördömer Rysslands krig mot Ukraina investerar personer i hans egen regering i bolag som går Vladimir Putins ärenden. Det är oerhört allvarligt. Jag förutsätter att statsministern nu gör en bedömning av om det är lämpligt att personen fortsatt arbetar för regeringen. Samtidigt förväntar jag mig att Ulf Kristersson säkerställer att ingen i regeringen investerar i Putins Ryssland.” Två ryska bolag I regeringens förteckning över statssekreterarnas ekonomiska innehav framgår det att Simon Westberg, statssekreterare på klimat- och näringslivsdepartementet för Ebba Busch (KD), äger aktier i två ryska bolag. Bolagen är Rosagro, ett stort ryskt jordbruksföretag, och Phosagro, som tillverkar gödningsmedel.  Westberg köpte aktierna i samband med att Ryssland invarderade Ukraina i februari 2022. Har för avsikt att sälja aktierna Simon Westberg uppger för TV4 Nyheterna att det var ”ett felaktigt beslut” att göra aktieköpet 2022. Han säger också att han har för avsikt att sälja aktierna. ”Jag vill inte äga aktierna och kommer avyttra dem så fort det är tillåtet och möjligt”, skriver Simon Westberg.", "link": "https://www.tv4.se/artikel/5nkbdw8h3zHNaGuiLCrY8V/kraftig-kritik-mot-statssekreterarens-innehav-av-ryss-aktier", "date_display": "2026-03-27", "date_iso": "2026-03-27T18:51:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/politik", "/valet-2022/kristdemokraterna", "/ebba-busch", "/svensk-politik", "/tobias-baudin-s"]}, {"id": 158, "title": "Elisabet and Gunnar reunited after 60 years: \"More dear now\"", "summary": "It was in the 1950s that Elisabet and Gunnar first became a couple. They were engaged and together for three years, but when Gunnar moved to Umeå to study, they went their separate ways and eventually married other people. Life went on, but during the pandemic both lost their respective partners. 65 years after his first engagement After a period of grief, Gunnar decided to get in touch with Elisabet again, to ask for forgiveness for leaving her. With the children's support, he invited her to a Christmas dinner, and the feelings from the youth were brought to life. - I had never forgotten Elisabet, says Gunnar Odebäck. Elisabet says that at first she thought life as a widow would mean that you eventually move to a home and then take the end as it comes, but the meeting with Gunnar changed everything. - It was already over when we saw each other. We were a little cautious, but after 65 years to the day we got engaged again, she says. \"Wonderful to be newly married and 85 years old\" In December, the couple got married in Valbo church, in front of 85 guests. As a surprise, the artist Carola appeared and sang for the bride and groom - something that Gunnar arranged thanks to his contacts. - If we are going to have a wedding, I said, then we should have a big wedding and it should be in a big church, says Elisabet Porat. Gunnar reflects on the difference between teenage love and today's love. - I actually think that you are more wild and in love when you become an adult than when you are young. Now you are more afraid of love and how precious and beautiful it is. Now the couple enjoys everyday life together, goes to church, to concerts and takes care of life. - It is absolutely wonderful to be newly married and to be 85 years old, says Elisabet Porat.", "title_original": "Elisabet och Gunnar återförenades efter 60 år: ”Mer kära nu”", "summary_original": "Det var på 1950-talet som Elisabet och Gunnar först blev ett par. De var förlovade och tillsammans i tre år, men när Gunnar flyttade till Umeå för studier gick de skilda vägar och gifte sig så småningom med andra. Livet rullade vidare, men under pandemin förlorade båda sina respektive partners. 65 år efter sin första förlovning Efter en tid av sorg bestämde sig Gunnar för att ta kontakt med Elisabet igen, för att be om förlåtelse för att han hade lämnat henne. Med barnens stöd bjöd han henne på julbord, och känslorna från ungdomen väcktes till liv. – Jag hade ju aldrig glömt Elisabet, säger Gunnar Odebäck. Elisabet berättar att hon först trodde livet som änka skulle innebära att man så småningom flyttar till ett hem och sedan tar slutet som det kommer, men mötet med Gunnar förändrade allt. – Det var ju kört redan när vi såg varann. Vi var lite försiktiga, men efter 65 år på dagen förlovade vi oss igen, säger hon. ”Underbart att vara nygift och 85 år” I december gifte sig paret i Valbo kyrka, inför 85 gäster. Som överraskning dök artisten Carola upp och sjöng för brudparet – något som Gunnar ordnat tack vare sina kontakter. – Ska vi ha bröllop, sa jag, då ska vi ha ett stort bröllop och det ska vara i en stor kyrka, säger Elisabet Porat. Gunnar reflekterar över skillnaden mellan tonårsförälskelsen och dagens kärlek. – Jag tror faktiskt att man är mer vild och kär när man blir fullvuxen än när man är ung. Nu är man mer rädd om kärleken och hur dyrbar och fin den är. Nu njuter paret av vardagen tillsammans, går i kyrkan, på konserter och tar vara på livet. – Det är helt underbart att vara nygift och vara 85 år, säger Elisabet Porat.", "link": "https://www.tv4.se/artikel/3n1j8af88iF2fD6RkP449S/elisabet-och-gunnar-aterfoerenades-efter-65-ar-mer-kaera-nu", "date_display": "2026-03-27", "date_iso": "2026-03-27T18:14:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Efter fem", "/efter-fem", "/karlek", "/aldre", "/sverigesvepet"]}, {"id": 159, "title": "The criminologist: \"Girls are increasingly playing a role in criminal gangs\"", "summary": "The 15-year-old girl who was detained is suspected of first murdering a teenager in Vårby farm south of Stockholm, and then taking the train to Malmö to murder a 15-year-old boy. The crimes must be connected to gang crime.  Can go under the radar Girls are playing an increasing role in criminal gangs, says Camila Salazar Atías, criminologist at Fryshuset, who works with children who have ended up in crime in various ways. One of the reasons for that is that they often go under the radar, which can make it easier for the gangs to carry out crimes, says Salazar Atías. - Girls have become a strategic piece because we don't see them. We discover them later than the guys and they become a way to access victims without being seen. \"A double vulnerability\" Children are often tricked into crime and for girls there is a double vulnerability, says Camila Salazar Atías. - They are often victims of crime. They have often been sexually exploited or subjected to violence in some way.  Jenny Yourston, associate professor of psychology, agrees that girls often have a more difficult problem as the reason why they end up in crime.  - In a sense, they are both victims and perpetrators at the same time.  Often the children are subjected to pressure or threats when they are exploited by the gangs, which can also hit girls hard, according to Salazar Atías. - We can see that there are sexual videos or other things that are threatened to be spread. They do not have the same position in the gangs either. Get more advanced assignments Jenny Yourston does not believe that girls will participate in gang crime to the same extent as boys and men. However, they have been given new roles.  - From having stayed a bit in the background to putting them on these more advanced assignments, and that they also take on these more advanced assignments.   The changed role of the girls may partly be about the gangs finding new strategies to recruit, partly an increased presence on social media, says Yourston. - If you find yourself in a social risk environment in some sense, it can be very tempting to be drawn in.  “Can", "title_original": "Kriminologen: ”Flickor får allt större roll i kriminella gäng”", "summary_original": "Den 15-åriga flickan som häktats misstänks först ha mördat en tonåring i Vårby gård söder om Stockholm, för att sedan ta tåget till Malmö för att mörda en pojke i 15-årsåldern. Brotten ska ha koppling till gängkriminalitet.  Kan gå under radarn  Flickor får en allt större roll i kriminella gäng, säger Camila Salazar Atías, kriminolog på Fryshuset, som jobbar med barn som på olika sätt hamnat i kriminalitet. En av anledningarna till det är att de ofta går under radarn, vilket kan göra det enklare för gängen att genomföra brott, säger Salazar Atías. – Flickor har blivit en strategisk pjäs eftersom vi inte ser dem. Vi upptäcker dem senare än killarna och de blir ett sätt att komma åt offer utan att bli sedda. ”En dubbel utsatthet” Barn blir ofta lurade in i kriminalitet och för flickor finns en dubbel utsatthet, säger Camila Salazar Atías. – De är ofta brottsoffer. De har ofta varit sexuellt utnyttjade eller på något sätt våldsutsatta.  Jenny Yourston, docent i psykologi, håller med om att tjejer oftare har en svårare problematik som orsak till varför de hamnar i kriminalitet.  – De är i en mening både offer och förövare samtidigt.  Ofta utsätts barnen av press eller hot när de utnyttjas av gängen, vilket också kan slå hårt mot tjejer enligt Salazar Atías. – Vi kan se att det finns sexuella videos eller annat som man hotar med att sprida. De har inte samma ställning i gängen heller. Får mer avancerade uppdrag  Att tjejer kommer att delta i gängens brott i samma utsträckning som pojkar och män tror inte Jenny Yourston. Däremot att de har fått nya roller.  – Från att ha hållit sig lite i bakgrunden till att man sätter dem på de här mer avancerade uppdragen, och att de också tar de här mer avancerade uppdragen.   Tjejernas förändrade roll kan dels handla om att gängen hittar nya strategier för att rekrytera, dels en ökad närvaro på sociala medier, säger Yourston. – Om man befinner sig i en social riskmiljö i någon mening så kan det vara väldigt lockande att dras in.  ”Kan gå med handgranat i väskan“ Fall som det där en 15-åring flicka nu misstänks för två mord väcker uppmärksamhet för tjejers roll i gängen. – Att tjejer kan gå över ett torg med handgranater i en tygväska, det hade vi kanske inte \ntänkt för fem år sen. Men idag så vet vi att det faktiskt kan vara möjligt, säger Yourston och tillägger att detta inte är en förvånande utveckling.  – Det är självklart att tjejer också följer med i den här utvecklingen.", "link": "https://www.tv4.se/artikel/4ArRGhyWN6YD2P6QbDA2x7/kriminologen-flickor-far-allt-stoerre-roll-i-kriminella-gaeng", "date_display": "2026-03-27", "date_iso": "2026-03-27T18:07:14+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/gangkriminalitet", "/gangkriminella", "/kriminalitet", "/brott", "/misstankt-brott", "/organiserad-brottslighet", "/grovt-brott"]}, {"id": 160, "title": "After graduation: Sigrid has been hoarse for five years", "summary": "When Sigrid Källander graduated from Gävle in 2021, she celebrated in accordance with tradition for seven days. But the joy came at an unexpected price. After all the celebrating, her voice almost completely disappeared and throughout the summer she had difficulty speaking. - You have to seek care after three weeks and I sought help after three months, says Sigrid Källander. Got no answers When Sigrid sought help, she had to see a speech therapist who gave her speech exercises, then she was sent on to ear-nose-throat. There she had to have her tonsils removed - without results. Despite several investigations, no one has been able to find any clear reason why the voice did not recover. - It was neither irritated nor any knots or anything wrong, everything else in the throat looked as usual, so it's very strange, says Sigrid Källander. \"It sounds a bit charming\" Despite the fact that the voice has never been the same as before, Sigrid tries to see the positive in the situation - Most people in my life are used to me talking like this, says Sigrid Källander and continues: - Many say that it sounds a bit charming and nice and a bit nice to listen to.", "title_original": "Efter studenten: Sigrid har varit hes i fem år", "summary_original": "När Sigrid Källander tog studenten i Gävle 2021 firade hon i enlighet med traditionen  i sju dagar. Men glädjen fick ett oväntat pris. Efter allt firande försvann rösten nästan helt och under hela sommaren hade hon svårt att prata. – Man ska ju söka vård efter tre veckor och jag sökte hjälp efter tre månader, säger Sigrid Källander. Fick inga svar När Sigrid sökte hjälp fick hon träffa en logoped som gav henne talövningar, sedan skickades hon vidare till öron-näsa-hals. Där fick hon operera bort halsmandlarna – utan resultat. Trots flera undersökningar har ingen kunnat hitta någon tydlig orsak till att rösten inte återhämtat sig. – Det var varken irriterat eller några knutor eller någonting fel, det såg ut som vanligt även allt annat i halsen, så det är jättemärkligt, säger Sigrid Källander. ”Det låter lite charmigt” Trots att rösten aldrig blivit som förr försöker Sigrid se det positiva i situationen – De flesta i mitt liv är van vid att jag pratar så här, säger Sigrid Källander och fortsätter: – Många säger att det låter lite charmigt och snyggt och lite skönt att lyssna på.", "link": "https://www.tv4.se/artikel/4nbEjUxj5Buexb4WU2lQnd/efter-studenten-sigrid-har-varit-hes-i-fem-ar", "date_display": "2026-03-27", "date_iso": "2026-03-27T16:58:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Efter fem", "/efter-fem", "/sjukvard", "/studentfirande", "/halsa"]}, {"id": 161, "title": "No crime to sell child-like sex dolls - preliminary investigation closed", "summary": "The children's rights organization ChildX reported the Swedish-owned company Docklandet and several international e-commerce players, including Amazon, to the police for the sale of child-like sex dolls - something that TV4 Nyheterna revealed last year. The organization believed that some of Dolllandet's dolls had childlike faces, school uniforms and posed in a school environment. ChildX argued that it constitutes a child pornography offense under Swedish law. After the report, a preliminary investigation was started. But now the prosecutor announces that the preliminary investigation is closed because there is no reason to assume that a crime has been committed. \"The material that was relevant in the case has been assessed in accordance with the Police Authority's assessment criteria and, based on these, has not been considered to constitute abuse material,\" the decision states. ChildX: \"Very serious\" Ida Östensson, general secretary of ChildX, takes the decision to close the case seriously. She requests more information from the prosecutor about why the decision was made. She believes that the closure is due to the legislation being too strict, and not to the fact that the material does not sexualise children. - It confirms what we have been saying for a very long time, that Swedish legislation does not keep up with reality, says Ida Östensson to TV4 Nyheterna. She believes that the closure is due to the legislation being too strict, and not to the fact that the material does not sexualise children. She points out that the law today is based on a so-called puberty development prop. - This means, for example, that a real twelve-year-old with breasts or then child-like dolls or AI-manipulated children designed to circumvent the law fall outside. Because girls often go through puberty earlier than boys, they are also hit particularly hard, she says.\n\nÖstensson wants to see a change in the law and that the protection should apply to everyone under 18. - The most important thing is to change the way the child pornography crime is structured, and remove this puberty development requirement so that all children under the age of 18 receive the same protection and instead assess the material based on whether it is actually sexual", "title_original": "Inget brott att sälja barnliknande sexdockor – förundersökning läggs ned", "summary_original": "Barnrättsorganisationen ChildX polisanmälde det svenskägda företaget Docklandet och flera internationella e-handelsaktörer, däribland Amazon, för försäljning av barnliknande sexdockor – något som TV4 Nyheterna avslöjade  förra året. Organisationen menade att vissa av Docklandets dockor hade barnlika ansikten, skoluniform och poserade i skolmiljö. ChildX menade att det utgör barnpornografibrott enligt svensk lag. Efter anmälan inleddes en förundersökning. Men nu meddelar åklagaren att förundersökningen läggs ned eftersom det saknas anledning att anta att brott begåtts. ”Det material som varit aktuellt i ärendet har bedömts i enlighet med Polismyndighetens bedömningskriterier och utifrån dessa inte ansetts utgöra övergreppsmaterial”, står det i beslutet. ChildX: ”Väldigt allvarligt” Ida Östensson, generalsekreterare för ChildX, ser allvarligt på beslutet att lägga ned ärendet. Hon efterfrågar mer information från åklagaren om varför beslutet fattats. Hon menar att nedläggningen beror på att lagstiftningen är för snäv, och inte på att materialet inte sexualiserar barn. – Det bekräftar det vi har sagt väldigt länge, att svensk lagstiftning inte hänger med i verkligheten, säger Ida Östensson till TV4 Nyheterna. Hon menar att nedläggningen beror på att lagstiftningen är för snäv, och inte på att materialet inte sexualiserar barn. Hon pekar på att lagen i dag bygger på ett så kallat pubertetsutvecklingsrekvisit. – Det gör exempelvis att en riktig tolvåring med bröst eller då barnlika dockor eller AI-manipulerade barn som utformas för att kringgå lagen faller utanför. Eftersom flickor ofta genomgår pubertet tidigare än pojkar så drabbas de också extra hårt, säger hon.\n\nÖstensson vill se en ändring av lagen och att skyddet ska gälla alla under 18 år. – Det viktigaste är att ändra hur barnpornografibrottet är uppbyggt, och ta bort det här pubertetsutvecklingsrekvisitet så att alla barn under 18 år får samma skydd och i stället bedöma materialet utifrån om det faktiskt sexualiserar eller exploaterar barn. ”Kommer aldrig att sälja” Sexdockorna som polisanmälts är runt en meter höga och marknadsförs som onanileksaker med bland annat vagina, erigerad penis och anus.  Docklandet har i ett tidigare mejl till TV4 Nyheterna skrivit att dockorna föreställer vuxna kvinnor med markerade höfter, E-kupa i bröststorlek och ett surrealistiskt ansikte i anime-stil. ”Docklandet har aldrig och kommer aldrig sälja barn-liknande sexdockor. Däremot har vi många miniatyrer i vår butik, alltså modeller av vuxna kvinnor som man krympt ned en skala”, skrev företaget. Produkterna togs efter rapporteringen bort från företagets hemsida. TV4 Nyheterna har sökt Docklandet samt åklagaren för en kommentar.", "link": "https://www.tv4.se/artikel/7JlFT4bVTLPHY7H5WWVfoM/foerundersoekning-mot-docklandet-laeggs-ned-allvarligt", "date_display": "2026-03-27", "date_iso": "2026-03-27T16:55:12+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/dockor", "/misstankt-brott", "/sexdockor"]}, {"id": 162, "title": "She is ready for the new season of \"The Traitors\"", "summary": "It has already been known that, among others, former S leader Mona Sahlin, artist Miriam Bryant, Hollywood wife Anna Anka and YouTube star Jonna Lundell will be in the spring round.  Bibi Rödöö's name is now added to the list of participants. - So nice that it's happening here and now. I have had to say \"no comments\" for quite some time since it leaked in October, she says in \"Studio Ett\". It was not obvious to say yes when the question came, she says. But a former participant made her change her mind. - I met the former \"Traitor\" Thomas Bodström who said that \"this is one of the funnest things I've done, do it\", says Bibi Rödöö. In 2009, Bibi Rödöö was awarded the Great Journalism Award for her work with Summer and Winter in P1, for which she has been program director since 1997 and 2008, respectively. The new season premieres on TV4 on April 16.", "title_original": "Hon är klar för nya säsongen av ”Förrädarna”", "summary_original": "Sedan tidigare är det känt att bland andra förra S-ledaren Mona Sahlin, artisten Miriam Bryant, Hollywoodfrun Anna Anka och Youtube-stjärnan Jonna Lundell ska vara med i vårens omgång.  Bibi Rödöös namn skrivs nu till raden av deltagare. – Så skönt att det sker här och nu. Jag har fått säga ”inga kommentarer” ganska länge sedan det läckte ut i oktober, säger hon i ”Studio Ett”. Det var inte självklart att tacka ja när frågan kom, berättar hon. Men en tidigare deltagare fick henne på andra tankar. – Jag träffade den tidigare ”Förrädaren” Thomas Bodström som sa att ”det här är något av det roligaste jag har gjort, gör det”, berättar Bibi Rödöö. 2009 tilldelades Bibi Rödöö Stora journalistpriset för sitt arbete med Sommar och Vinter i P1, som hon varit programchef för sedan 1997 respektive 2008. Nya säsongen har premiär i TV4 den 16 april.", "link": "https://www.tv4.se/artikel/6hZu17PsAQ494a5D0r5pM0/hon-aer-klar-foer-foerraedarna-inte-sjaelvklart", "date_display": "2026-03-27", "date_iso": "2026-03-27T16:35:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nöje", "/noje", "/tv", "/forradarna", "/sveriges-radio", "/sommar-i-p1"]}, {"id": 163, "title": "Putin's desperate move in the war: \"They are starting to lose patience\"", "summary": "Russia entered Ukraine with great ambitions. The \"special operation\" as Putin himself calls it would go quickly, a few weeks at the most, he is said to have promised those closest to him, but there was margin for a longer war in the oil funds that had managed to build up.  - They are largely empty now. They have burned everything on the war. The little you have left are emergency reserves that you don't dare tap into, because then you're headed for state bankruptcy, says Malcolm Dixelius.  Unable to benefit from higher oil prices Vladimir Putin may have raised hopes of a somewhat recovered economy as a result of the war in the Middle East.  US and Israeli attacks on Iran have pushed up oil prices sharply and led Donald Trump to ease oil sanctions on Russia to keep it down.  But there are several things that have prevented Russia from benefiting from it, says Malcolm Dixelius. - One is that Russia basically always sells oil at a discount. They never charge full price. The second is that Ukraine has crippled their export capacity. Currently, close to half of the oil Russia normally exports is estimated to be stuck. In addition, both Venezuela, whose president the US arrested in the intervening days, and Iran have previously been used as important links in exports.  \"No longer a secret\" Russia's difficult economy has been a poorly kept secret. Several experts have assessed that by 2026 the situation would be too serious to be hidden, which now seems to be true.  Although for many Russians it has been clear for a long time. - They have cut into things that shouldn't be cut into, maintenance of infrastructure and the social. Things that are noticeable, says Malcolm Dixelius.  Was placed in a mental hospital It has gone so far that the Kremlin has had to force banks to lend money at low interest rates to keep up the industrial production of military equipment, which is believed to soon lead to a serious banking crisis. And on Thursday, Putin is said to have made investment rounds with the country's oligarchs. All this has made that", "title_original": "Putins desperata drag i kriget: ”De börjar att tappa tålamodet”", "summary_original": "Ryssland gick in i Ukraina med stora ambitioner. ”Specialoperationen” som Putin själv kallar den skulle gå fort, max några veckor lär han ha lovat sina närmaste, men det fanns marginal för ett längre krig i de oljefonder man hade hunnit bygga upp.  – De är i stort sett tömda nu. De har bränt allt på kriget. Det lilla man har kvar är akuta reserver som man inte vågar ta sig in i för då går man mot statsbankrutt, säger Malcolm Dixelius.  Kan inte dra nytta av höjda oljepriser Vladimir Putin kan ha fått upp hoppet om en något återhämtad ekonomi till följd av kriget i Mellanöstern.  USA och Israels attacker mot Iran har drivit upp oljepriset kraftigt och lett till att Donald Trump har lättat på oljesanktionerna mot Ryssland för att hålla nere det.  Men det finns flera saker som har hindrat Ryssland från att dra vinning av det, säger Malcolm Dixelius. – Det ena är att Ryssland i princip alltid säljer olja med rabatt. De får aldrig ut fullt pris. Det andra är att Ukraina har lamslagit deras exportkapacitet. I nuläget bedöms nära hälften av den olja Ryssland normalt exporterar sitta fast. Dessutom har både Venezuela, vars president USA grep i mellandagarna, och Iran tidigare använts som viktiga länkar i exporterna.  ”Inte längre en hemlighet” Rysslands svåra ekonomi har varit en illa dold hemlighet. Flera experter har bedömt att situationen senast 2026 skulle bli för allvarlig för att kunna döljas, vilket nu verkar visa sig vara sant.  Även om det för många ryssar har varit tydligt länge. – De har skurit i saker man inte borde skära i, underhåll av infrastruktur och det sociala. Sådant som märks, säger Malcolm Dixelius.  Placerades på mentalsjukhus Det har gått så långt att Kreml varit tvungna att tvinga banker att låna ut pengar till låg ränta för att hålla uppe industriproduktionen av krigsmateriel, vilket snart tros kunna leda till en allvarlig bankkris. Och under torsdagen uppges alltså Putin ha gått investeringsrundor hos landets oligarker. Allt det här har gjort att tidigare mycket lojala Putinanhängare har börjat vända honom ryggen.  En av dem är Ilja Remeslo, en krigsbloggare med över 100 000 följare som efter att i flera år ha gått Kremls ärenden plötsligt kallade presidenten för ”illegitim” och anklagade honom för krigsbrott. Dagen efter placerades han på mentalsjukhus. – Även de mest lojala börjar tappa tålamodet. Och enligt trovärdiga mätningar är 70 procent av befolkningen emot att kriget fortsätter, även om de inte protesterar, säger Malcolm Dixelius.", "link": "https://www.tv4.se/artikel/2f8xd99yMuTiSxsG4g1oac/putins-desperata-drag-i-kriget-de-boerjar-att-tappa-talamodet", "date_display": "2026-03-27", "date_iso": "2026-03-27T13:10:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/ukrainakonflikten", "/vladimir-putin"]}, {"id": 164, "title": "The new tool - to hack your phone: \"You don't notice anything\"", "summary": "Darksword is a tool that exploits vulnerabilities in the iPhone's software and allows phones to be hacked just by visiting a website.  The hackers create so-called infected websites - which look completely ordinary - and trick visitors in via email and links. - You don't notice anything, but attackers can steal data from your mobile, email, passwords, call history, messages. The pictures too, says IT security specialist Karl Emil Nikka. How to avoid being hacked Hundreds of millions of iPhones may be at risk of Darksword, but there are ways to avoid being hacked.  - Always install security updates and stop using a mobile when it is no longer possible to update it. The updates are released as new versions of the IOS operating system, so when one comes, you should do it immediately, don't wait, says Karl Emil Nikka. There have been many similar spyware programs over the years. But they have mainly been aimed at specific targets such as the president of France, high-ranking defense officials, journalists and freedom fighters, says Nikka.  - They are used by evil regimes to spy on dissidents. But also by governments and law enforcement agencies that need spyware to monitor suspicious people. It is something that the Swedish police can also do. \"All cybercriminals have access\" You don't know who or who created Darksword, says Karl Emil Nikka. And although these types of tools are developed for the purpose of fighting terrorism, they often end up in the hands of criminals.  - We know that groups with Russian connections have exploited these vulnerabilities, there is no doubt about that, Nikka says, adding that the situation became more serious earlier this week. - Now the code for Darksword is publicly available online, so anyone can download it. All cybercriminals in the world have access to this tool now. Apple's action To deal with the vulnerabilities, Apple has released updates for phones that it otherwise no longer maintains, says Nikka. – S", "title_original": "Nya verktyget – för att hacka din telefon: ”Du märker inget”", "summary_original": "Darksword är ett verktyg som utnyttjar sårbarheter i Iphones mjukvara och gör att telefoner kan hackas bara genom att man besöker en hemsida.  Hackarna skapar så kallade infekterade hemsidor – som ser helt vanliga ut – och lurar in besökare via mail och länkar. – Du märker ingenting, men angripare kan stjäla data från din mobil, mejl, lösenord, samtalshistorik, meddelanden. Bilderna också, säger it-säkerhetsspecialisten Karl Emil Nikka. Så undviker du att hackas Hundratals miljoner Iphones kan ligga i riskzonen för Darksword, men det finns sätt att undvika att hackas.  – Installera alltid säkerhetsuppdateringar och sluta använda en mobil när det inte går att uppdatera den längre. Uppdateringarna släpps som nya versioner av operativsystemet IOS, så när det kommer en sådan ska du göra det direkt, vänta inte, säger Karl Emil Nikka. Det har funnits många liknande spionprogram genom åren. Men de har främst riktats mot specifika måltavlor som Frankrikes president, högt uppsatta inom försvaret, journalister och frihetskämpar, säger Nikka.  – De används av elaka regimer för att spionera på meningsmotståndare. Men också av regeringar och brottsbekämpande myndigheter som behöver spionprogram för att övervaka misstänkta personer. Det är något som även svenska polisen får göra. ”Alla cyberkriminella har tillgång” Vem eller vilka som skapat Darksword vet man inte, säger Karl Emil Nikka. Och även om den här typen av verktyg tas fram i syftet att bekämpa terrorism hamnar de ofta i händerna på kriminella.  – Vi vet att grupper med rysk koppling har utnyttjat de här sårbarheterna, det råder det inga tvivel om, säger Nikka och tillägger att situationen blev allvarligare tidigare i veckan. – Nu ligger koden till Darksword publikt på nätet, så alla kan ladda ner den. Alla världens cyberkriminella har tillgång till det här verktyget nu. Apples åtgärd  För att hantera sårbarheterna har Apple släppt släppt uppdateringar för telefoner som de annars inte underhåller längre, säger Nikka. – Som det ser ut idag underhåller de IOS 18 och senare. Men på grund av att det här är så allvarligt har de gått tillbaka tio år i tiden till IOS 15 för att täppa till sårbarheterna. Det innebär att Iphone 6s och senare kan uppdateras för att undvika att drabbas av Darksword. När det gäller Darksword är inte det viktiga att vara försiktig med länkar och annat, eftersom de infekterade sajterna kan finnas var som helst, säger Nikka. Det viktiga är att uppdatera mobiltelefonen. – Om din mobiltelefon blir infekterad har angriparna tillgång till allt, det är schackmatt, det är slut.", "link": "https://www.tv4.se/artikel/1XI31A6ahVhBb6DAufGS5j/nya-verktyget-foer-att-hacka-din-telefon-du-maerker-inget", "date_display": "2026-03-27", "date_iso": "2026-03-27T11:16:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/utrikes", "/brott-och-straff", "/cyberangrepp", "/cybersakerhet", "/apple", "/it-expert", "/it-sakerhet", "/mobiltelefoner"]}, {"id": 165, "title": "Instills fear in the population - with the help of images of Hitler", "summary": "Viral images on social media show banners with Adolf Hitler's image and quotes posted in public settings in several Iranian cities. The posters contain Hitler's portrait along with texts attributed to him and accusing people of collaborating with the enemy. \"He who rejoices in the abuse of his country is like someone who rejoices in the abuse of his own mother\", attributed to Hitler in one of the messages. The message is to be directed at Iranians who are accused of siding with the enemy.  Seen next to the supreme leader On one of the posters, Hitler is seen right next to a manipulated photo of Mojtaba Khamenei. The poster contains congratulations on Khamenei's new post, but also a sentence attributed to Hitler and referring to \"treason against the homeland\". \"The worst are those who collaborate with the enemy when the country is taken over,\" reads the poster. The installation in a public environment and the publication of an image of the banner have led to widespread reactions.  Social media users state that the quotes are fabricated and condemn the use of Hitler's image in public.\n\nThe publication of the images occurs at the same time as the Islamic Republic is said to be intensifying crackdowns on alleged foreign spies and internal collaborators. According to the reports, during the war against Israel and the US, the regime has become increasingly focused on rooting out what it describes as foreign spies and collaborators.", "title_original": "Sätter skräck i befolkningen – med hjälp av bilder på Hitler", "summary_original": "Virala bilder på sociala medier visar banderoller med Adolf Hitlers bild och citat uppsatta i offentlig miljö i flera iranska städer. Affischerna innehåller Hitlers porträtt tillsammans med texter som tillskrivs honom och som anklagar personer för att samarbeta med fienden. ”Den som gläds åt övergrepp på sitt land är som någon som gläds åt övergrepp på sin egen mamma”, tillskrivs Hitler i ett av budskapen. Budskapet ska vara riktat till iranier som anklagas för att ställa sig på fiendens sida.  Syns intill högste ledaren På en av affischerna syns Hitler precis intill ett manipulerat foto av Mojtaba Khamenei. Affischen innehåller gratulationer till Khameneis nya post, men även en mening som tillskrivs Hitler och hänvisar till ”förräderi mot hemlandet”. ”De värsta är de som samarbetar med fienden när landet tas över”, står det på affischen. Installationen i offentlig miljö och publiceringen av en bild på banderollen har lett till omfattande reaktioner.  Användare på sociala medier uppger att citaten är påhittade och fördömer användningen av Hitlers bild i offentligheten.\n\nPubliceringen av bilderna sker samtidigt som Islamiska republiken uppges intensifiera tillslag mot påstådda utländska spioner och interna kollaboratörer. Enligt uppgifterna har regimen under kriget mot Israel och USA blivit alltmer fokuserad på att utrota vad den beskriver som utländska spioner och kollaboratörer.", "link": "https://www.tv4.se/artikel/7IyrUDuhbc0dkgpXklfOVJ/saetter-skraeck-i-befolkningen-med-hjaelp-av-bilder-pa-hitler", "date_display": "2026-03-27", "date_iso": "2026-03-27T09:57:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/iran", "/irankriget"]}, {"id": 166, "title": "'The squirrel turned to me and lifted the heart - it was absolutely crazy'", "summary": "Johnny Kääpä, 60, left his job as a salesman and became a nature photographer: A mission from God", "title_original": "'Ekorren vände sig mot mig och lyfte upp hjärtat - det var helt galet'", "summary_original": "Johnny Kääpä, 60, lämnade jobbet som säljare och blev naturfotograf: Ett uppdrag från Gud", "link": "https://www.dagen.se/familj/ekorren-vaende-sig-mot-mig-och-lyfte-upp-hjaertat-det-var-helt-galet/10263894", "date_display": "2026-03-27", "date_iso": "2026-03-27T04:01:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 167, "title": "Icelandic priest accused of conducting conversion therapy", "summary": "Preliminary investigation has been launched after a Catholic priest explained in a ra progressiveness as the only way are sometimes both surprised and worried about the development, writes Staffan Werme.", "title_original": "Är Kyrkans inre sekularisering vid vägs ände?", "summary_original": "De som sett progressiviteten som den enda vägen blir ibland både förvånade och oroade över utvecklingen, skriver Staffan Werme.", "link": "https://www.dagen.se/debatt/aer-kyrkans-inre-sekularisering-vid-vaegs-aende/10268619", "date_display": "2026-03-27", "date_iso": "2026-03-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 171, "title": "It is crucial for the future that pastor training continuously develops", "summary": "We will work for an education where theology comes to life. We believe this happens best in a responsive dialogue between the congregations, academia and public education, write Ulf Häggqvist, SAM, Ingemar Forss and Linalie Newman, EFK and Pelle Hörnmark, Pentecost FFS.", "title_original": "Avgörande för framtiden att pastorsutbildningen kontinuerligt utvecklas", "summary_original": "Vi kommer arbeta för en utbildning där teologi får liv. Vi tror detta sker bäst i en lyhörd dialog mellan församlingarna, akademin och folkbildningen, skriver Ulf Häggqvist, SAM, Ingemar Forss och Linalie Newman, EFK och Pelle Hörnmark, Pingst FFS.", "link": "https://www.dagen.se/debatt/avgoerande-foer-framtiden-att-pastorsutbildningen-kontinuerligt-utvecklas/10253496", "date_display": "2026-03-27", "date_iso": "2026-03-27T04:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": []}, {"id": 172, "title": "In Lent, this is the testimony we need", "summary": "The church needs to come forward and demonstrate other principles", "title_original": "I fastetid är detta det vittnesbörd vi behöver", "summary_original": "Kyrkan behöver träda fram och visa på andra principer", "link": "https://www.dagen.se/ledare/i-fastetid-aer-detta-det-vitt
