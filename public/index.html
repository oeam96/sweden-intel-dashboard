er lägre hastighet, då får man passera på den sida som är lämpligast med hänsyn till den fortsatte färden. Det är fullkomligt solklart, säger Jeanette Jedbäck Hindenburg. Enligt trafikexperten beror okunskapen på utbildningssystemet och att många enbart pluggar för att klara teoriprovet, särskilt unga. – Vi har bara provet som en utbildningsform i Sverige i dag. Eftersom provet styr vad man pluggar på så blir det här en av de okända sakerna. Och det här nämns kanske inte så mycket på provet. Det är vanligare hos den nya generationen. Man litar väldigt mycket på sociala medier och tittar på Youtube och så vidare. Det är svårt att ligga på motorvägen och fråga ChatGPT vilket körfält man ska välja. – Det är bara ett bevis på förarutbildningssystemets förfall, att folk inte riktigt vet hur man ska göra längre. De får inte kunskaperna. Straffet för bilföraren blev böter på 1 000 kronor.", "link": "https://www.tv4.se/artikel/23eTXPTQh8esAt9qhFGTH7/polisen-filmar-medan-bilisten-begar-det-okaenda-trafikbrottet", "date_display": "2026-03-20", "date_iso": "2026-03-20T18:12:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brott och straff", "/brott-och-straff", "/inrikes", "/trafikbrott", "/trafik", "/brott", "/stockholm", "/e4"]}, {"id": 133, "title": "Former aid minister: \"Complete scandal\"", "summary": "That the SD organization Hepatica plans to give aid money to abortion opponents arouses strong reactions. Former aid minister Isabella Lövin (MP) warns that Sweden's reputation could be damaged. - It is a complete scandal, she says.", "title_original": "Tidigare biståndsministern: ”Fullständig skandal”", "summary_original": "Att SD-organisationen Hepatica planerar att ge biståndspengar till abortmotståndare väcker starka reaktioner. Tidigare biståndsministern Isabella Lövin (MP) varnar för att Sveriges anseende kan skadas. – Det är en fullständig skandal, säger hon.", "link": "https://www.dn.se/sverige/tidigare-bistandsministern-fullstandig-skandal/", "date_display": "2026-03-20", "date_iso": "2026-03-20T18:08:42+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 134, "title": "Preschool closes - with two weeks' notice: 'Shocked'", "summary": "The Karolina preschool in Solna closes - and leaves families in a panic. With two weeks' notice, the children must be relocated. - We received a notice in an app on Tuesday. I was about to throw up, says parent Parisa Amoor.", "title_original": "Förskola stänger – med två veckors varsel: ”Chockartat”", "summary_original": "Förskolan Karolina i Solna stänger – och lämnar familjer i panik. Med två veckors varsel måste barnen omplaceras. – Vi fick en notis i en app i tisdags. Jag höll på att kräkas, säger föräldern Parisa Amoor.", "link": "https://www.dn.se/sverige/forskola-stanger-med-tva-veckors-varsel-chockartat/", "date_display": "2026-03-20", "date_iso": "2026-03-20T17:26:20+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 135, "title": "The new trend that is spreading on social media - all over the world", "summary": "The trend has received a lot of attention in 2026 and is based on the fact that we risk missing out on satisfaction when we always choose the easiest path. Examples of \"too convenient\" could be using AI services for everyday tasks, ordering food home or never asking anyone for directions. AI's progress is believed to be the reason. Psychologist Björn Hedensjö believes that the trend has developed as new technology makes everyday life easier.  - We use new technology so much to make life completely frictionless. We do that because we think it's nicest, he says. But Hedensjö believes that an overly comfortable life makes us feel worse in the long run. He points out that we are becoming less patient and creative. In addition, our ability to endure boredom and adversity can be impaired. - If we don't get any friction, no resistance, it's not quite good for us. You always need resistance to build resilience. Besides, if we're really going to enjoy something, we need some contrast. New term - but not a new phenomenon Hedensjö points out, however, that even if the term \"skavmaxxa\" is new, the phenomenon is not.  - After all, we're all on it, or many of us have \"chafing maxxat\", a little bit anyway. He compares it to experiences such as mountain hiking or riding the Vasaloppet, where uncomfortable moments can become the most memorable in retrospect. - If you were to ask a mountain hiker how they feel right now with damp underwear, mosquitoes and all that, they would say that it's not so much fun. But when they look back on it, it was a good experience and a great memory.", "title_original": "Nya trenden som sprider sig på sociala medier – i hela världen", "summary_original": "Trenden har fått stor uppmärksamhet under 2026 och bygger på att vi riskerar att gå miste om tillfredsställelse när vi alltid väljer den enklaste vägen. Exempel på ”för bekvämt” kan vara att använda AI-tjänster för vardagssysslor, beställa hem mat eller att aldrig fråga någon om vägen. AI:s framfart tros vara anledningen Psykologen Björn Hedensjö tror att trenden vuxit fram i takt med att ny teknik gör vardagen enklare.  – Vi använder ny teknik så mycket för att göra livet helt friktionsfritt. Det gör vi för att vi tycker att det är skönast, säger han. Men Hedensjö menar att ett alltför bekvämt liv gör att vi mår sämre på sikt. Han pekar på att vi blir mindre tålmodiga och kreativa. Dessutom kan vår förmåga att stå ut med tristess och motgångar försämras. – Om vi inte får nåt skav, inget motstånd, så är det inte helt bra för oss. Man behöver alltid motstånd för att bygga upp motståndskraft. Dessutom, om vi verkligen ska njuta av nåt så behöver vi lite kontrast. Nytt begrepp – men inget nytt fenomen  Hedensjö påpekar dock att även om begreppet ”skavmaxxa” är nytt så är fenomenet inte det.  – Vi håller ju alla på, eller många av oss har ”skavmaxxat”, lite grann i alla fall. Han jämför med upplevelser som fjällvandring eller att åka Vasaloppet där obekväma stunder i efterhand kan bli de mest minnesvärda. – Om man skulle fråga en fjällvandrare hur de har det just nu med fuktiga underställ, myggor och allt vad det är så skulle de säga att det inte är så kul. Men när de tittar tillbaka på det så var det en bra erfarenhet och ett fantastiskt minne.", "link": "https://www.tv4.se/artikel/4gom1LetBz3DiQ5POw8hIR/nya-trenden-som-utmanar-bekvaemligheten-skavmaxxa", "date_display": "2026-03-20", "date_iso": "2026-03-20T17:24:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Efter fem", "/efter-fem", "/livsstil", "/trender", "/sociala-medier", "/psykisk-halsa", "/mental-halsa"]}, {"id": 136, "title": "Foreign Ministry officials amid celebrations - of Islamic revolution: 'Offensive'", "summary": "The 47th anniversary of the Islamic revolution was noted not only in Iran, but also at the Iranian embassy in Stockholm. A small number of officials from the Ministry of Foreign Affairs were also present at the celebration, reveals the newspaper Fokus. Something that the Ministry of Foreign Affairs confirms to TV4 Nyheterna.\n\n\"A small number of officials from the Foreign Ministry attended,\" the ministry writes to TV4 Nyheterna. This is at the same time as the government has recently condemned the Iranian regime for, among other things, the increased threat to exiled Iranians, and the executions in the country - most recently when a Swedish man was executed on Wednesday. - Sweden will continue to condemn serious violations of human rights in Iran, said Foreign Minister Maria Malmer Stenergard in a statement in connection with the execution. S demands an explanation The Social Democrats' foreign policy spokesperson Morgan Johansson calls the action \"deeply inappropriate\". He believes that the Ministry of Foreign Affairs' presence at the embassy is not compatible with the government's public condemnation of the regime. Instead, it contributes to legitimizing the regime, according to him.\n\n- I think it is deeply inappropriate, I think it is deeply offensive, I think it is deeply remarkable, he says to TV4 Nyheterna. - This was also around the same time when the Iranian regime killed tens of thousands of its own citizens, he continues. \"Opportunity to express criticism\" The Ministry of Foreign Affairs justifies the participation at the embassy by saying that it provides an opportunity to express criticism. \n\n\"It also gives us the opportunity to express our condemnation of the regime's actions in the wake of the recent protests,\" writes the Foreign Ministry. \"Sweden has diplomatic relations with a number of countries where the governance and politics do not conform to our values, including Iran. We have this in order to safeguard Swedish interests and to be able to act in matters important to Sweden such as our consular cases,\" the ministry further writes. Are there other ways Morgan Johansson (S) emphasizes that there are other ways to express criticism. He now demands to speak", "title_original": "UD-tjänstemän mitt i firande – av islamiska revolutionen: ”Stötande”", "summary_original": "47-årsdagen av den islamiska revolutionen uppmärksammades inte bara i Iran, utan även på Irans ambassad i Stockholm. Vid firandet fanns också ett mindre antal tjänstemän från UD på plats, avslöjar tidningen Fokus. Något som utrikesdepartementet bekräftar för TV4 Nyheterna.\n\n”Ett mindre antal tjänstemän från UD närvarade”, skriver departementet till TV4 Nyheterna. Detta samtidigt som regeringen nyligen fördömt den iranska regimen för bland annat den ökade hotbilden mot exiliranier, och avrättningarna i landet – senast när en svensk man avrättades i onsdags. – Sverige kommer att fortsätta att fördöma allvarliga kränkningar av de mänskliga rättigheterna i Iran, sade utrikesminister Maria Malmer Stenergard i ett uttalande i samband med avrättningen. S kräver förklaring Socialdemokraternas utrikespolitiska talesperson Morgan Johansson kallar agerandet för ”djupt olämpligt”. Han menar att UD:s närvaro på ambassaden inte är förenlig med regeringens offentliga fördömanden av regimen. Det bidrar i stället till att legitimera regimen, enligt honom.\n\n– Jag tycker det är djupt olämpligt, jag tycker det är djupt stötande, jag tycker det är djupt anmärkningsvärt, säger han till TV4 Nyheterna. – Det här var ju dessutom ungefär i samma tid när den iranska regimen dödade tiotusentals av sina egna medborgare, fortsätter han. ”Möjlighet att framföra kritik” UD motiverar deltagandet på ambassaden med att det ger möjlighet att framföra kritik. \n\n”Det ger oss också möjlighet att framföra våra fördömanden av regimens agerande i spåren av de senaste protesterna”, skriver UD. ”Sverige har diplomatiska relationer med ett antal länder där styrelseskicket och politiken inte överensstämmer med våra värderingar, inklusive Iran. Det har vi för att tillvarata svenska intressen och kunna agera i för Sverige viktiga ärenden såsom våra konsulärfall”, skriver departementet vidare. Finns andra sätt Morgan Johansson (S) understryker att det finns andra sätt för att framför kritik. Han kräver nu att utrikesminister Maria Malmer Stenergard förklarar besöket. – Vill man framföra kritik, då är det mycket lämpligare att kalla upp den iranska ambassadören i så fall och göra det direkt öga mot öga, istället för att delta i firandet utav i den islamiska republiken, säger han. – Det här är ju en av de länder som Säkerhetspolisen gång efter gång pekar ut som ett hot mot Sverige och svenska intressen. Iran är ett av länderna, Ryssland är ju ett annat land. Inte skulle väl den svenska regeringen komma på tanken att gå på något firande av Ryssland på något sätt.\n\nUD vill inte svara på frågor om syftet med besöket eller vilka som deltog. TV4 Nyheterna har sökt utrikesminister Maria Malmer Stenergard som avböjer en kommentar.", "link": "https://www.tv4.se/artikel/5ussixHpEkcIlgWz6pBiif/ud-tjaenstemaen-mitt-i-firande-av-islamiska-revolutionen-stoetande", "date_display": "2026-03-20", "date_iso": "2026-03-20T16:32:42+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/film", "/iran", "/ud", "/utrikesdepartementet-ud", "/irans-ambassad"]}, {"id": 137, "title": "Girl is abused outside Zara - harsh criticism is directed at the clothing chain", "summary": "At the beginning of March, a 14-year-old girl was seriously abused in the city of Bristol in England. The girl sought shelter inside the clothing store Zara but received no help, writes the BBC. Strong criticism is now being directed at the clothing store's actions. - The staff knew, but they chose not to help her, says a woman who protests against the action. The assault is linked to a social media trend where youngsters from rival schools in Bristol are being encouraged to fight each other. The trend targets young people between the ages of 11 and 15 and has led to an increased police presence in the city, according to the BBC. \"No one wanted to help\" The girl's father says that the gang first molested her at a bus stop and prevented her from getting on the bus. She then ran into a Zara store to hide, but received no help from the staff. - I really feel that they let her down, he says. A video of the beating has been shared on social media and led to protests outside the store. The father is critical of the fact that no one intervened. - For 25 minutes they followed her. No one wanted to help and no one asked: \"Are you unharmed?\". Five teenagers arrested A spokesperson for Zara UK tells Bristol Live that their thoughts are with the victim. - We are assisting the police investigation and will support them in every way we can. Five teenagers were arrested in connection with the incident and have now been released on bail.", "title_original": "Flicka misshandlas utanför Zara – hård kritik riktas mot klädkedjan", "summary_original": "I början på mars blev en 14-årig flicka blev allvarligt misshandlad i staden Bristol i England. Flickan sökte skydd inne i klädbutiken Zara men fick ingen hjälp, skriver BBC. Nu riktas stark kritik mot klädbutikens agerande. – Personalen visste, men de valde att inte hjälpa henne, säger en kvinna som protesterar mot agerandet. Misshandeln kopplas till en trend i sociala medier där ungdomar från rivaliserande skolor i Bristol uppmanas att slåss mot varandra. Trenden riktar sig till ungdomar mellan 11 och 15 år och har lett till ökad polisnärvaro i staden, enligt BBC. ”Ingen ville hjälpa till” Flickans pappa berättar att gänget först antastade henne vid en busshållplats och hindrade henne från att stiga på bussen. Därefter sprang hon in i en Zara-butik för att gömma sig, men fick ingen hjälp av personalen. – Jag känner verkligen att man svek henne, säger han. En video på misshandeln har spridits i sociala medier och lett till protester utanför butiken. Pappan är kritisk mot att ingen ingrep. – I 25 minuter följde de efter henne. Ingen ville hjälpa till och ingen frågade: ”Är du oskadd?”. Fem tonåringar greps En talesperson för Zara UK säger till Bristol Live att deras tankar går till offret. – Vi bistår polisens utredning och kommer stödja dem på alla sätt vi kan. Fem tonåringar greps i samband med händelsen och har nu släppts mot borgen.", "link": "https://www.tv4.se/artikel/5bODvYHxDWTcZLD5mMzfgK/flicka-misshandlas-utanfoer-zara-hard-kritik-riktas-mot-klaedkedjan", "date_display": "2026-03-20", "date_iso": "2026-03-20T16:11:44+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes", "/bristol", "/misshandel"]}, {"id": 138, "title": "Got married - in secret", "summary": "It was in October 2024 that Armand Duplantis proposed to Desiré Inglander, who after their civil marriage has now taken his surname.  But the real wedding ceremony and party will take place in Cannes on June 13-14, as competition director Steinar Hoen announced. - I was a little shocked that he said that, but it is what it is, says Duplantis to TT. \"Marrying the love of my life\" The reason was that Duplantis then misses a competition to get married, something he himself does not take too seriously.  - It's a wedding and it happens once in a lifetime. If you miss one or two races - who cares? I have competed as many times as I can in the last five years. If I have to miss a competition because of a wedding and marry the love of my life, it doesn't matter, says Duplantis to Sportbladet.  Duplantis tells TT that he will not wear the ring until after the wedding this summer.  Is on the cover of Vogue in a wedding dress It was only a few days before Armand Duplantis, 26, took his latest world record of 6.31 meters that the civil wedding took place.  Before that, Desiré Duplantis, 24, had appeared on the cover of Vogue Scandinavia in a potential wedding dress. For the magazine, she talks about the preparations for the big event.  - I will be a little nervous about the first wedding waltz, we will get to practice it a bit, says Desiré Duplantis to the newspaper.", "title_original": "Har gift sig – i hemlighet", "summary_original": "Det var i oktober 2024 som Armand Duplantis friade till Desiré Inglander, som efter deras borgliga giftermål nu har tagit hans efternamn.  Men den riktiga bröllopsceremonin och festen äger rum i Cannes 13-14 juni, vilket tävlingsledaren Steinar Hoen offentliggjorde. – Jag har var lite chockad att han sade det, men det är som det är, säger Duplantis till TT. ”Gifter mig med mitt livs kärlek” Anledningen var att Duplantis då missar en tävling för att gifta sig,  något han själv inte tar för hårt på.  – Det är ett bröllop och det sker en gång i livet. Om man missar en eller två tävlingar – vem bryr sig? Jag har tävlat hur många gånger som helst de senaste fem åren. Om jag behöver missa en tävling på grund av ett bröllop och gifter mig med mitt livs kärlek gör det inget, säger Duplantis till Sportbladet.  För TT berättar Duplantis att han inte kommer ha ringen på sig förrän efter bröllopet i sommar.  Är på Vogue-omslaget i bröllopsklänning Det var bara några dagar innan Armand Duplantis, 26, tog sitt senaste världsrekord på 6,31 meter som den borgerliga vigseln ägde rum.  Innan dess hade Desiré Duplantis,  24, synts på omslaget av Vogue Scandinavia i en potentiell bröllopsklänning. För tidningen berättar hon om förberedelserna inför den stora tillställningen.  – Den första bröllopsvalsen den kommer jag vara lite nervös över, den kommer vi få öva lite på, säger Desiré Duplantis till tidningen.", "link": "https://www.tv4.se/artikel/1MNKzhW5SmsVACSwWZ92dk/har-gift-sig-i-hemlighet", "date_display": "2026-03-20", "date_iso": "2026-03-20T15:46:30+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/noje", "/sport", "/friidrott", "/armand-duplantis", "/brollop"]}, {"id": 139, "title": "Chuck Norris is dead", "summary": "He died Thursday morning in Hawaii, according to a post from his family.  \"It is with heavy hearts that we announce the passing of our beloved Chuck Norris yesterday morning,\" they write in a public statement on the actor's Instagram.  It has previously been known that Norris was hospitalized and the family is grateful for the support they have received since then.  World champion and Hollywood star Chuck Norris had his breakthrough in 1972 with the film \"Way of the dragon\". Between 1964 and 1974 he was the undefeated middleweight karate champion. It was while serving in the US Air Force in South Korea that he came into contact with the martial arts.  \"For the rest of the world, he was a martial artist, actor and a symbol of strength. For us, he was a faithful husband, loving father and grandfather,\" the family writes further in their open letter. It was by training big movie stars in martial arts that he was introduced to Hollywood. The breakthrough was followed by films such as \"Missing in battle\", \"Firewalker\" and \"Strength Delta force\" during the 80s.  In the 90s he played in the series \"Walker, Texas ranger\". In 2005, he became relevant again when the Internet phenomenon \"Chuck Norris facts\" began to spread.  The film reviewer: \"A controversial action hero\" TV4's film reviewer Ronny Svensson looks back on Norris' career.  - He was a fucking star who drew people to the salons. Then you must not forget that he was actually a martial arts champion and a role model in that sphere as well, says Svensson to TV4 Nyheterna.  Norris was also politically active in the Republican Party and the National Rifle Association, a lobbying organization that advocates the right to bear arms.  - It is not inconceivable that Trump will speak out, because Norris was a right-wing patriot who thought the USA was the biggest, best and most beautiful. A controversial action hero, quite simply, says Ronny Svensson.  At the same time, he believes that Chuck Norris will be remembered for the mark he left on the action film genre.  - He will be remembered in", "title_original": "Chuck Norris är död", "summary_original": "Han dog under torsdagsmorgonen i Hawaii, enligt ett inlägg från hans familj.  ”Det är med tunga hjärtan som vi offentliggör bortgången av vår älskade Chuck Norris igår morgon”, skriver de i ett offentligt uttalande på skådespelarens Instagram.  Tidigare har det varit känt att Norris varit inlagd på sjukhus och familjen tackar för den support de fått sedan dess.  Världsmästare och Hollywoodstjärna Chuck Norris fick sitt genombrott 1972 med filmen ”Way of the dragon”. Mellan 1964 och 1974 var han obesegrad mellanviktsmästare i karate. Det var när han tjänstgjorde i det amerikanska flygvapnet i Sydkorea som han kom i kontakt med kampsporten.  ”För resten av världen var han en kampsportare, skådespelare och en symbol för styrka. För oss var han en trofast make, kärleksfull pappa och farfar\", skriver familjen vidare i sitt öppna brev. Det var genom att träna stora filmstjärnor i kampsport som han introducerades in i Hollywood. Efter genombrottet följde filmer som ”Saknad i strid”, ”Firewalker” och ”Styrka Delta force” under 80-talet.  På 90-talet spelade han i serien ”Walker, Texas ranger”. 2005 blev han aktuell igen när internetfenomenet ”Chuck Norris facts” började sprida sig.  Filmrecensenten: ”En kontroversiell actionhjälte” TV4:s filmrecensent Ronny Svensson minns tillbaka på Norris karriär.  – Han var en jävla stjärna som drog folk till salongerna. Sen får man inte glömma att han faktiskt var kampsportsmästare och en förebild inom den sfären också, säger Svensson till TV4 Nyheterna.  Norris var också politiskt aktiv i det republikanska partiet och National Rifle Association, en lobbyorganisation som förespråkar rätten att bära vapen.  – Det är inte otänkbart att Trump kommer uttala sig, för Norris var en högerpatriot som tyckte att USA var störst, bäst och vackrast. En kontroversiell actionhjälte, helt enkelt, säger Ronny Svensson.  Samtidigt menar han att Chuck Norris kommer bli ihågkommen för den prägel han satt på actionfilmsgenren.  – Man kommer minnas honom i kamouflagekläder, han banade väg för många actionfilmer som kom efter honom, säger Ronny Svensson.", "link": "https://www.tv4.se/artikel/2oWaeMtUymVhZpg2QnjzMZ/chuck-norris-aer-doed-86-ar-gammal", "date_display": "2026-03-20", "date_iso": "2026-03-20T14:06:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/noje"]}, {"id": 140, "title": "Pentecost wants to inspire more missionary zeal at the Sänd i weekend conference", "summary": "Responsible for the investment: \"This conference is about finding our way back to our basic mission.\"", "title_original": "Pingst vill inspirera till mer missionsiver på konferensen Sänd i helgen", "summary_original": "Ansvarig för satsningen: ”Den här konferensen handlar om att hitta tillbaka till vårt grunduppdrag.”", "link": "https://www.dagen.se/nyheter/pingst-vill-inspirera-till-mer-missionsiver-pa-konferensen-saend-i-helgen/10261184", "date_display": "2026-03-20", "date_iso": "2026-03-20T14:00:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 141, "title": "That's why the royal couple's happy kiss is unique: \"It's lovely to see\"", "summary": "Queen Silvia and King Carl Gustaf attended the performance \"Mamma Mia! The Party\" on Wednesday. In the audience was also one of Aftonbladet's readers, who caught how the royal couple danced and shared a kiss with Abbas' \"Dancing queen\". Court expert Ebba Kleberg von Sydow follows the royals closely and tells TV4 Nyheterna that she has at most seen a hand on her back. - A little light hug, but this? No, it's lovely to see. That's why we rarely see the royal couple kissing Susanne Nylund Skog, ethnologist at the Institute for Language and Folklore, says that there is an explanation for why we see people kissing on public transport or at outdoor restaurants - but rarely royalty. - This physical contact, how bodies meet each other, is quite class-bound, she says. - There is a notion that something as physical as a deep kiss does not belong in public. \"More expected in Paradise hotel\" Judging from the pictures, it's hard to tell if their lips actually meet or not. But for the king and queen to stand and \"kiss hard\" would be unthinkable, says ethnologist Susanne Nylund Skog. - It is more expected in a context like Paradise hotel, she says. At the same time, she points out that royals, who are strictly regulated in what they can do and when, sometimes take the chance to show that there is an emotional bond when they know they are being watched. - That they still love each other, despite all the trials they have been subjected to. - It will be a mark. A kiss or a kiss is not just nothing in these contexts. The king and queen celebrate 50 years of marriage this year, and the kiss that has now been captured on picture can be seen as a foretaste of their upcoming anniversary. - It must be the year of love 2026 that does this, says Ebba Kleberg von Sydow. Age also a factor Another factor in why we rarely see the royal couple kissing in public is age. According to Susanne Nylund Skog, there is a strong ageism in Sweden. - Perhaps this applies especially to women who desexualize over the years.", "title_original": "Därför är kungaparets glada puss unik: ”Det är härligt att se”", "summary_original": "Drottning Silvia och kung Carl Gustaf närvarade vid föreställningen ”Mamma Mia! The Party” på onsdagen. I publiken fanns även en av Aftonbladets läsare, som fångade hur kungaparet dansade och delade en puss till Abbas ”Dancing queen”. Hovexperten Ebba Kleberg von Sydow följer kungligheterna noggrant och säger till TV4 Nyheterna att hon på sin höjd har sett en hand på ryggen. – En liten lätt kram, men det här? Nej, det är härligt att se. Därför ser vi sällan kungaparet pussa varandra Susanne Nylund Skog, etnolog vid Institutet för språk och folkminnen, säger att det finns en förklaring till varför vi ser människor pussas i kollektivtrafiken eller på uteserveringar – men sällan kungligheter. – Den här fysiska kontakten, hur kroppar möter varandra, är ganska klassbunden, säger hon. – Det finns en föreställning om att något så kroppsligt som en djup kyss inte hör hemma i offentligheten. ”Mer förväntat i Paradise hotel” Av bilderna att döma är det svårt att avgöra om deras läppar faktiskt möts eller inte. Men att kungen och drottningen skulle stå och ”hårdkyssas” vore otänkbart, menar etnologen Susanne Nylund Skog. – Det är mer förväntat i ett sammanhang som Paradise hotel, säger hon. Samtidigt påpekar hon att kungligheter, som är strikt reglerade i vad de får göra och när, ibland tar chansen att visa att det finns ett känslomässigt band när de vet att de iakttas. – Att de fortfarande älskar varandra, trots alla prövningar de utsatts för. – Det blir en markering. En puss eller en kyss är inte bara ingenting i de här sammanhangen. Kungen och drottning firar 50 år som gifta i år och den puss som nu fångats på bild kan ses som en försmak inför deras kommande jubileum. – Det måste ju vara kärleksåret 2026 som gör detta, säger Ebba Kleberg von Sydow. Åldern även en faktor En annan faktor till att vi sällan ser kungaparet pussas offentligt är ålder. Enligt Susanne Nylund Skog råder en stark ålderism i Sverige. – Det gäller kanske speciellt kvinnor som avsexualiseras med åren. Det väcker lite anstöt om kvinnor i drottning Silvias ålder synligt visar att de har en sexualitet. Det händer oftare att vi ser prins Daniel och kronprinsessan Victoria pussa varandra offentligt. – Då kan det markera att de är med i tiden på något sätt och att de liksom uppför sig som man ”ska” i deras ålder. De har fått barn och är fortfarande jättekära, säger hon.", "link": "https://www.tv4.se/artikel/71ggzMtpGxlDz67LIOugzp/daerfoer-aer-kungaparets-glada-puss-unik-det-aer-haerligt-att-se", "date_display": "2026-03-20", "date_iso": "2026-03-20T13:29:58+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nöje", "/noje", "/tv", "/paradise-hotel", "/kungahuset", "/svenska-kungafamiljen", "/kung-carl-xvi-gustaf", "/drottning-silvia", "/prins-daniel", "/kronprinsessan-victoria"]}, {"id": 142, "title": "Extreme right-wing triangle drama is celebrated - as an ideological heroic effort", "summary": "On January 17, 2025, a teenage boy in southern Stockholm was lured out of his apartment by his ex-girlfriend. They followed to a wooded area where three young men were waiting. The teenage boy turned back home but the gang followed. - At the gate, I'm stopped just as I'm about to open the door and then I get a blow right across the face. And then I fall to the ground. And then they kick me ten times in the head. And they filmed, says the victim in questioning with the police. Trio sentenced Two men in their 20s could subsequently be identified and in September also sentenced to prison for 1.5 years for serious assault. In the Court of Appeal, the sentence was upheld against one man and was increased to one year and nine months in prison for the other, who was seen as the driving force in the assault. The convicted men are both members of White boys Stockholm, which is a subgroup of the extreme right-wing fight club Aktivklubb Sverige. The teenage boy's girlfriend, who also has right-wing extremist connections, was convicted of aiding and abetting assault. The investigation reveals the background to the assault. It is about an affair of infidelity and how the teenage girl convicted today left a White boy for another. - In my opinion, it is in any case initially a triangle drama. The plaintiff was with one of the defendants and then it ended between them and then she ended up with another guy who was also one of the defendants, says Annika Almström who was the prosecutor in the case.  - There were indications that those involved may have thought that there had been some form of infidelity or overlapped each other a little. The teenage boy was previously a member of the violent group himself, but dropped out in connection with the break-up with his girlfriend. He allegedly left in a way that created irritation among the others, the investigation shows. - So I think it is perhaps a combination of that and that it has become bullshit at school, says Annika Almström. Appealing for money This week Aktivklubb Sverige has publice", "title_original": "Högerextremt triangeldrama hyllas – som ideologisk hjälteinsats", "summary_original": "Den 17 januari 2025 lockades en tonårspojke i södra Stockholm ut ur sin lägenhet av sin före detta flickvän. De slog följe till ett skogsparti där tre unga män väntade. Tonårspojken vände hemåt igen men gänget följde efter. – I porten så blir jag stannad precis när jag ska öppna dörren och sedan så får jag ett slag rätt över ansiktet. Och sedan så ramlar jag ju ner på marken. Och så sparkar de mig ett tiotal gånger i huvudet. Och de filmade, berättar offret i förhör med polisen. Trio dömdes Två män i 20-årsåldern kunde därefter identifieras och i september också dömas till fängelse i 1,5 år för grov misshandel. I hovrätten fastställdes domen mot ena mannen och skärptes till ett år och nio månaders fängelse för den andre, som setts som drivande i överfallet. De dömda männen är båda medlemmar i White boys Stockholm, som är en undergrupp till den högerextrema slagsmålsklubben Aktivklubb Sverige. Tonårspojkens flickvän, som också hon har högerextrema kopplingar, dömdes för medhjälp till misshandel. I utredningen framkommer bakgrunden till överfallet. Det handlar om en otrohetsaffär och hur den i dag dömda tonårstjejen lämnat en White boy för en annan. – Enligt min uppfattning rör det sig i varje fall inledningsvis om ett triangeldrama. Målsägande var tillsammans med en av de tilltalade och sen tog det slut mellan dem och sen så blev hon tillsammans med en annan kille som också var en av de tilltalade, säger Annika Almström som var åklagare i fallet.  – Det fanns indikationer på att de inblandade kanske trodde att det hade varit någon form av otrohet eller överlappat varandra lite. Tonårspojken var tidigare själv medlem i den våldsamma grupperingen men hoppade av i samband med uppbrottet från sin flickvän. Han ska ha lämnat på ett sätt som skapade irritation bland de andra, visar utredningen. – Så jag tror att det kanske är en kombination med det och att av det har blivit skitsnack i skolan, säger Annika Almström. Vädjar om pengar I veckan  har Aktivklubb Sverige publicerat ett inlägg till sina följare på Telegram: ”Aktivister sitter just nu fängslade, anklagade för att ha misshandlat en informatör åt terrorgruppen AFA. Vi är tacksamma för hjälp med att betala de juridiska kostnaderna på ca. 58k kr. Stötta hjältarna på frontlinjen som offrar sin frihet för din!” Texten följs av ett bankgironummer men det som framställs som ett ideologiskt hjältedåd verkar av allt att döma vara fjolårets högerextrema triangeldrama. Rättegångskostnaderna på dryga 58 000 kronor motsvarar nämligen det skadestånd som trion blev dömda att betala sitt offer, plus ränta och trippla avgifter till brottsofferfonden. I övrigt betalades de själva rättegångskostnaderna av staten. TV4 Nyheterna kan inte hitta några andra rättsfall som passar in på gruppens beskrivning av fallet. Inspelat telefonsamtal  Det finns inget i utredningen som tyder på att den misshandlade tonårskillen skulle vara en informatör åt AFA. Istället sattes hotfulla uthängningslappar upp i offrets bostadsområde, där han pekades ut som en del av White boys – enligt honom själv då hans forna vänner försökte att locka vänsterextrema till hans port.  Ett inspelat telefonsamtal mellan offret, hans exflickvän och den äldre White boys-medlemmen, handlar istället till väldigt stor del om kärleksrelationen och att offret ska ha snackat skit om sitt ex i skolan. Vid ett tillfälle nämns ordet ”gola” och att det är något som offret skulle kunna ha gjort av misstag men detta sker mest i förbifarten. I Expos årsrapport beskrivs hur den rasideologiska miljön finansieras. Det sker bland annan genom evenemang som konserter, konferenser, festivaler och kampsportsgalor.  – Det absolut vanligaste sättet är dock att man skänker pengar ur egen ficka som aktivister, säger Expos vd Daniel Poohl. TV4 Nyheterna har sökt Aktivklubb Sverige.", "link": "https://www.tv4.se/artikel/6a59gE0O2gnwHCE3UUNn5I/hoegerextremt-triangeldrama-hyllas-som-hjaeltedad", "date_display": "2026-03-20", "date_iso": "2026-03-20T11:50:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Inrikes", "/inrikes", "/brott-och-straff", "/aktivklubb", "/hogerextremism", "/stockholm"]}, {"id": 143, "title": "Here are the best and worst steamers: \"They spit on the garment\"", "summary": "You may be used to pulling out the ironing board and iron when you need to fix a wrinkled garment - but a steamer makes the job a little easier, many think. However, that is not the only function a steamer has, says Klaus Hahn, CEO at Testfakta. - They also help to freshen up the clothes. They bring some dust, some bacteria and some of the smell too. So instead of putting it directly in the laundry basket, you might be able to use the garment once more. And it helps a lot to save water and energy, he says. Four really good Testfakta have tested nine popular steamers. All turned out to be quite good, but four stand out as really good. Two of these have a vacuum function that attracts the garment, which facilitates handling. - You never really know what distance you should have. You are a little afraid that the steam might be too hot, so you don't really know how close you should go. These do the job for you, says Klaus Hahn in Nyhetsmorgon. Test winner Tefal has the best ironing results, but is also the loudest. It is also the most expensive. The steamer in fourth place, from Electrolux, has only a slightly lower rating - but is much cheaper. Leaves wet stains None of the products tested were really bad, but the four at the bottom of the list leaked water onto the garment. - The slightly worse usually \"spit\" on the garment. So that there are wet spots. And that can be very annoying when you're short on time, says Klaus Hahn. He believes that you can steam basically all materials, except leather and suede. - But you can also take silk and can also go over a cashmere sweater. Everything you can't do with an iron. The steam penetrates the fibers and straightens them, so the fabric almost becomes \"relaxed\". Whereas an iron stresses the fabric, says Hahn.", "title_original": "Här är bästa och sämsta steamern: ”De spottar på plagget”", "summary_original": "Du kanske är van att baxa fram strykbrädan och strykjärnet när du behöver fixa till ett skrynkligt plagg – men en steamer gör jobbet lite enklare, tycker många. Dock är det inte den enda funktionen en steamer har, menar Klaus Hahn, vd på Testfakta. – De hjälper också till att fräscha upp kläderna. De tar med sig en del damm, lite bakterier och lite av lukten också. Så i stället för att lägga det direkt in i tvättkorgen, så kanske man kan använda plagget en gång till. Och det hjälper ju rätt så mycket att spara vatten och energi, säger han. Fyra riktigt bra Testfakta har testat nio populära steamers. Samtliga visade sig vara ganska bra, men fyra utmärker sig som riktigt bra. Två av dessa har en vakuumfunktion som drar till sig plagget, vilket underlättar hanteringen. – Du vet aldrig riktigt vilket avstånd du ska ha. Man är lite rädd att ångan kanske är för varm, så man vet inte riktigt hur nära man ska gå. De här gör jobbet åt dig, säger Klaus Hahn i Nyhetsmorgon. Testvinnaren Tefal har bäst strykresultat, men är också mest högljudd. Den är även dyrast. Steamern på fjärdeplats, från Electrolux, har bara något sämre betyg – men är mycket billigare. Ger våta fläckar Ingen av de testade produkterna var riktigt dålig, men de fyra i slutet av listan läckte vatten på plagget. – De lite sämre brukar ”spotta” på plagget. Så att det blir våta fläckar. Och det kan ju vara väldigt irriterande när man har ont om tid, säger Klaus Hahn. Han menar att man kan steama i princip alla material, utom läder och mocka. – Men du kan även ta siden och kan även gå över en kashmirtröja. Allt som du inte kan göra med ett strykjärn. Ångan tränger in i fibrerna och rätar ut dem, så tyget nästan blir ”relaxed”. Medan ett strykjärn stressar tyget, säger Hahn.", "link": "https://www.tv4.se/artikel/68j8n70GLJr4vqtccZ7L6a/slipp-strykbesvaeret-stort-test-av-steamers", "date_display": "2026-03-20", "date_iso": "2026-03-20T11:24:05+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/tester", "/testfakta", "/klader", "/hem-och-hushall"]}, {"id": 144, "title": "Previous pastor's government report on family placements contained several errors - retracted", "summary": "Several errors in the report's references • Thomas Ardenfors: \"I don't know what broke.\"", "title_original": "Tidigare pastorns regeringsrapport om familjeplaceringar innehöll flera fel - dras tillbaka", "summary_original": "Flera fel i rapportens referenser • Thomas Ardenfors: ”Jag vet inte vad som brustit.”", "link": "https://www.dagen.se/nyheter/tidigare-pastorns-regeringsrapport-om-familjeplaceringar-innehoell-flera-fel-dras-tillbaka/10259932", "date_display": "2026-03-20", "date_iso": "2026-03-20T10:59:58+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 145, "title": "The expert's two scenarios: Then the interest rate can be raised - several times", "summary": "The Riksbank announced during the day that the policy rate will be left unchanged at 1.75 percent. The main forecast continues to be that the interest rate will remain there for the rest of the year. At the same time, Riksbank governor Erik Thedéen emphasizes that the Iran war makes the situation very uncertain and that both interest rate increases and interest rate cuts may be relevant during the year - depending on how the conflict and energy prices develop. According to Swedbank and Sparbankerna's private economist, Arturo Arques, the announcement was expected. - Yes, both right and expected considering how the situation looks today. But I'll just add that the market itself implies that there could be an interest rate between September and December that lands somewhere around 2 percent, he says. Two scenarios According to Arturo Arques, Swedbank works based on two scenarios. In the first, one assumes approximately today's oil prices - which, according to Arques, have almost doubled since the crisis began - and a level around 110 dollars per barrel. In that scenario, it is also assumed that the war ends and that the oil can continue to be transported through the Strait of Hormuz within four to five weeks. Then the inflation forecast ends up at 1.9 percent and growth at 2.4 percent, according to Arques.  He then assesses that the risk of interest rate increases during the year is low and that the interest rate can remain at 1.75 percent. \"A worse scenario\" In a worse scenario, Arques instead sees a risk of one or more interest rate increases during the year. Then it is about oil prices that can rise to 140 dollars per barrel and electricity prices around 1.50 before next winter, as a result of the conflict going on much longer. In that situation, he assesses that inflation may spread to more sectors, end up closer to 5 percent and that growth will remain at 1.5 percent. With households holding tighter in their wallets, consumption decreases, which can hit growth because private consumption accounts for roughly half of GDP, he explains. - With this scenario, there is a risk that this improved purchasing power in 2026 will be eaten up. - It would be very, very unfortunate with a tan", "title_original": "Expertens två scenarion: Då kan räntan höjas – flera gånger", "summary_original": "Riksbanken meddelade under dagen att styrräntan lämnas oförändrad på 1,75 procent. Huvudprognosen är fortsatt att räntan ligger kvar där året ut. Samtidigt betonar riksbankschef Erik Thedéen att Irankriget gör läget mycket osäkert och att både räntehöjningar och räntesänkningar kan bli aktuella under året – beroende på hur konflikten och energipriserna utvecklas. Enligt Swedbanks och Sparbankernas privatekonom, Arturo Arques var beskedet väntat. – Ja, både rätt och väntat med tanke på hur situationen ser ut idag. Men jag ska bara lägga till också att marknaden själv implicerar att det kan bli en ränta mellan september och december som landar någonstans runt drygt 2 procent, säger han. Två scenarier  Enligt Arturo Arques arbetar Swedbank utifrån två scenarier. I det första utgår man från ungefär dagens oljepriser – som enligt Arques nära nog har fördubblats sedan krisen inleddes – och en nivå runt 110 dollar per fat. I det scenariot utgår man också från att kriget avslutas och att oljan kan fortsätta transporteras genom Hormuzsundet inom fyra–fem veckor. Då hamnar inflationsprognosen 1,9 procent och tillväxten 2,4 procent, enligt Arques.  Han bedömer då att risken för räntehöjningar under året är låg och att räntan kan ligga kvar på 1,75 procent. ”Ett sämre scenario” I ett sämre scenario ser Arques i stället en risk för en eller flera räntehöjningar under året. Då handlar det om oljepriser som kan stiga till 140 dollar per fat och elpriser runt 1,50 inför nästa vinter, som en följd av att konflikten pågår betydligt längre. I det läget bedömer han att inflationen kan sprida sig till fler sektorer, hamna närmare 5 procent och att tillväxten stannar på 1,5 procent. Med hushåll som håller hårdare i plånboken minskar konsumtionen, vilket kan slå mot tillväxten eftersom den privata konsumtionen står för ungefär halva BNP, förklarar han. – Med det här scenariot finns ju en risk att den här förbättrade köpkraften 2026 äts upp. – Det vore ju väldigt, väldigt olyckligt med tanke på att vi såg ljuset i tunneln redan under andra delen av förra året då. Vi såg också att konsumtionen steg och att det fanns all anledning  inte minst med tanke på de starka statsfinanserna att ekonomin skulle utvecklas fortsatt väl.", "link": "https://www.tv4.se/artikel/5dn00xDo71IvtI6SRmj6HI/expertens-tva-scenarion-da-kan-raentan-hoejas-flera-ganger", "date_display": "2026-03-20", "date_iso": "2026-03-20T10:59:28+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/ekonomi", "/svensk-ekonomi", "/kriget-i-ukraina/ekonomiskaeffekterna", "/riksbanken", "/rantan"]}, {"id": 146, "title": "Disagree with Mohamsson - directly: \"Not the biggest supporter\"", "summary": "Goes against the party leadership on important issues • \"On some point you can have different opinions\"", "title_original": "Oense med Mohamsson – direkt: ”Inte den största anhängaren”", "summary_original": "Går emot partiledningen i viktiga frågan • ”På någon punkt kan man tycka olika”", "link": "https://www.tv4.se/artikel/3K8Kf6AnRNvEnzH330xuTs/oense-med-mohamsson-direkt-inte-den-stoersta-anhaengaren", "date_display": "2026-03-20", "date_iso": "2026-03-20T10:25:46+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 147, "title": "Desperation oozes - but \"The Lion King\" should attract votes", "summary": "", "title_original": "Osar desperation – men ”Lejonkungen” borde dra röster", "summary_original": "", "link": "https://www.tv4.se/artikel/Od3cXItLjQxI8NbTrifie/osar-desperation-men-lejonkungen-borde-dra-roester", "date_display": "2026-03-20", "date_iso": "2026-03-20T10:01:52+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 148, "title": "\"The conclusion is that Sara Svensson shot a dead person\"", "summary": "With the help of Sweden's leading forensic experts, Aftonbladet revealed serious mistakes in the investigation of the Knutby drama last fall. The data indicated that Alexandra Fossmo was already dead when the nanny Sara Svensson fired her shots.  On Friday morning, star lawyer Johan Eriksson announces that he is submitting a request to the National Prosecutor to resume the preliminary investigation. - Someone else has shot Alexandra Fossmo. Some other perpetrator has done it, says Johan Eriksson at a press conference. \"Completely unique\" According to Johan Eriksson, the verdict rests largely on the nanny's own information, and that her story does not match forensic findings.  - It appears to me to be completely unique, that you have half a meter large pools of blood under a bed that are not accounted for. It seems to me completely unique that there is no picture of the mattress she is lying on, where you can see it, he says. At the same time, Johan Eriksson emphasizes that he is not directing criticism at investigators, prosecutors or defense attorneys, but describes how so-called \"confirmation bias\" can cause deviations to be explained in a way that still fits an established thesis. Conclusion: Already dead Johan Eriksson concludes that when Sara Svensson entered the room, Alexandra Fossmo was already dead.  - That thing is straight up and down obvious. You can't kill a dead person, he says. According to him, in addition to a medical examiner who subsequently reviewed the autopsy reports, an autopsy technician who participated in the original autopsy of Alexandra Fossmo has confirmed that there was no bleeding in connection with the shot to the hip. \"Bring out the bedclothes\" He states that he is now requesting that the Attorney General resume the preliminary investigation and that the National Board of Health and Welfare's legal council review the autopsy report.  - We want you to search for and bring out bedding, there are no mattresses, but pillows, sheets, everything that can be found to re-examine both the presence of blood and bullet holes and the number of bullet holes and we want you to", "title_original": "”Slutsatsen är att Sara Svensson skjutit en död person”", "summary_original": "Med hjälp av Sveriges främsta kriminaltekniker, avslöjade Aftonbladet grova missar i utredningen av Knutbydramat i höstas. Uppgifterna pekade på att Alexandra Fossmo redan var död när barnflickan Sara Svensson avlossade sina skott.  På fredagsmorgonen meddelar stjärnadvokaten Johan Eriksson att han lämnar in en begäran till Riksåklagaren om att återuppta förundersökningen. – Någon annan har skjutit Alexandra Fossmo. Någon annan gärningsperson har gjort det, säger Johan Eriksson på en pressträff. ”Fullständigt unikt” Enligt Johan Eriksson vilar domen till stora delar på barnflickans egna uppgifter, och att hennes berättelse inte stämmer med rättsmedicinska fynd.  – Det framstår för mig som fullständigt unikt, att man har en halvmeter stor blodpölar under en säng som inte redovisas. Det framstår som mig helt unikt att det inte förekommer någon bild på den madrass, som hon ligger på, där man kan se den., säger han. Johan Eriksson betonar samtidigt att han inte riktar kritik mot utredare, åklagare eller försvarare, utan beskriver hur så kallad ”confirmation bias” kan göra att avvikelser förklaras på ett sätt som ändå passar en fastslagen tes. Slutsats: Låg redan död Johan Eriksson drar slutsatsen att när Sara Svensson kom in i rummet låg Alexandra Fossmo redan död.  – Den saken är rakt upp och ner uppenbar. Man kan inte döda en död människa, säger han. Enligt honom har, utöver en rättsläkare som i efterhand granskat obduktionsprotokollen, även en obduktionstekniker som deltog i den ursprungliga obduktionen av Alexandra Fossmo bekräftat att ingen blödning förekom i samband med skottet mot höften. ”Ta fram sängkläder” Han uppger att han nu begär att Riksåklagaren återupptar förundersökningen och att Socialstyrelsens rättsliga råd granskar obduktionsprotokollet.  – Vi vill att man söker och tar fram sängkläder,  madrasser finns inte, men kuddar, lakan, allt som kan finnas för att på nytt undersöka både blodförekomst och skotthål och antalet skotthål och vi vill att man genomför en granskning av den kriminaltekniska utredningen i jämförelse med det material som har förekommit.  – Jag begär också att obduktionsteknikern som närvarande också ska få berätta om de iakttagelser han gjorde själv i samband med obduktionen, vilket ju naturligtvis är väldigt viktigt.", "link": "https://www.tv4.se/artikel/PlfAIFKwL6XebIXE8Kt1i/slutsatsen-aer-att-sara-svensson-skjutit-en-doed-person", "date_display": "2026-03-20", "date_iso": "2026-03-20T09:50:25+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/knutby", "/knutbydramat"]}, {"id": 149, "title": "Born at week 24: “Went to die quite a few times”", "summary": "Today, Theres Belt is 33 years old. When she was born in 1993 at 24 weeks, it was considered very early. - The whole hospital was down and watching me. My parents have described it as feeling very watched, like they were caged animals. The telephone operator had also been down and looked, she says. New recommendations Everything that followed the neonatal spring has been incredibly tough, she says. - The nursing period was also tough. I was about to die quite a few times. But then life after comes and then the question is: What happens then? The Norwegian Medical Ethics Council (Smer) came out today with a new opinion with recommendations for both healthcare and parents. For children born at the beginning of week 22, \"palliative care without a focus on saving or prolonging life\" is recommended. For those born at the end of week 23, the recommendation is instead the opposite. \"Carry with you a trauma\" Almost half of the children born in week 22 survive and many of the survivors have severe disabilities. - It is so important that the parents are allowed to participate in these difficult questions around week 22. After all, everyone brings with them their own experiences and what they themselves feel they are ready for, says Theres Belt, who is a member of the Swedish Prematurity Association. How has it affected your parents? - They carry a trauma with them. Every time they went home, they didn't know what they would be met with the next day. Not knowing if I would be on a respirator, or when my eyes wouldn't cooperate and the blood vessels grew too fast. Or when I got sepsis, or when I got fungus in the blood. Wants to see better support throughout her life. She says that she is careful about how she talks about her disabilities with her parents. - I make sure that they don't have to feel bad because it's not their fault. It's just the way it turned out, says Theres Belt. She calls for better support throughout her life. - You only see when we get older what the outcome will be regarding the need for support. At present, it is very difficult", "title_original": "Föddes i vecka 24: ”Höll på att dö ganska många gånger”", "summary_original": "I dag är Theres Belt 33 år. När hon föddes 1993 i vecka 24 ansågs det vara väldigt tidigt. – Hela sjukhuset var väl ner och tittade på mig. Mina föräldrar har beskrivit det som att de kände sig väldigt uttittade, som att de var djur i bur. Även telefonisten hade varit ner och tittat, säger hon. Nya rekommendationer Allt som följde efter neonatalvåren har varit otroligt tufft, berättar hon. – Vårdtiden var ju också tuff. Jag höll på att dö ganska många gånger. Men sen så kommer ju livet efter och då är ju frågan: Vad händer då? Statens medicinsk-etiska råd (Smer) kom i dag med ett nytt yttrande med rekommendationer för såväl vården som för föräldrar. För barn som föds i början av vecka 22 rekommenderas ”lindrande vård utan inriktning på att rädda eller förlänga liv”. För de som föds i slutet av vecka 23 är i stället rekommendationen den motsatta. ”Bär med sig ett trauma” Knappt hälften av barnen födda i vecka 22 överlever och många av de överlevande får svåra funktionsnedsättningar. – Det är så viktigt att föräldrarna får vara delaktiga i de här svåra frågorna kring vecka 22. Alla bär ju med sig sina egna erfarenheter och vad de själva känner att de är redo för, säger Theres Belt, som är ledamot i Svenska Prematurförbundet. Hur har det påverkat dina föräldrar? – De bär ju med sig ett trauma. Varje gång de gick hem så visste de ju dagen efter inte vad de skulle mötas av. Att inte veta ifall jag skulle ligga i respirator, eller när mina ögon inte ville samarbeta och blodkärlen växte för snabbt. Eller när jag fick sepsis, eller när jag fick svamp i blodet. Vill se bättre stöd hela livet Hon berättar att hon är försiktig med hur hon pratar om sina funktionsnedsättningar med sina föräldrar. – Jag är mån om att de inte ska behöva ha dåligt mående i och med att det inte ligger på dem. Det är ju bara så det blev, säger Theres Belt. Hon efterlyser bättre stöd genom hela livet. – Man ser ju först när vi blir äldre vad utfallet blir kring stödbehov. I dagsläget är det jättesvårt att få rätt hjälp för många som vi möter. Oavsett vilket beslut man tar på neonatalen så behöver man sen säkerställa att vi får hjälp uppåt i åldrarna också. Och hela familjen då.", "link": "https://www.tv4.se/artikel/4v5ksbLOIvPfz8rkcmSnln/hoell-pa-att-doe-ganska-manga-ganger", "date_display": "2026-03-20", "date_iso": "2026-03-20T09:30:40+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/halsa", "/neonatalvard", "/barn", "/foraldraskap", "/foraldrar", "/sjukdomar", "/sjukvarden", "/sjukvard"]}, {"id": 150, "title": "Sara Svensson's lawyer requests that the preliminary investigation into the Knutby murder be resumed", "summary": "Wants the \"Nanny\" acquitted of murder after the January 2004 crime", "title_original": "Sara Svenssons advokat begär att förundersökningen om Knutbymordet återupptas", "summary_original": "Vill att ”Barnflickan” frias från morddomen efter dådet januari 2004", "link": "https://www.dagen.se/nyheter/sara-svenssons-advokat-begaer-att-foerundersoekningen-om-knutbymordet-aterupptas/10260576", "date_display": "2026-03-20", "date_iso": "2026-03-20T08:46:05+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 151, "title": "Mozzarella sticks with tomato sauce", "summary": "Today's weekend tip offers crispy breaded and deep-fried mozzarella sticks to dip in garlic-scented and slightly hot tomato sauce. A perfect way to start the weekend! See Dante Zia's recipe", "title_original": "M commendations. Mette-Marit now describes how she felt both deceived and manipulated by the convicted sex offender.  Mette-Marit and Epstein's relationship continued after the financier was convicted of purchasing sexual services from a minor in 2008. The email exchanges that have been published show extensive contact, with Christmas greetings, book recommendations and plans for visits and meetings. The tone of the emails can be perceived as intimate, but the Crown Princess does not agree.  - I don't perceive it that way, I perceive it as a friendly tone.  \"Really tried to remember\" In 2008, several years before the relationship began, Jeffrey Epstein was convicted of purchasing sexual services from a minor.  Three years later, the crown princess writes in an email to Epstein that she googled him and that it \"doesn't look good\".  What she saw is not clear, but Epstein's sex crimes were already mentioned on his Wikipedia page.  In the interview, NRK's ​​reporter asks what she saw.  - I really tried to remember it. But if I saw that he was a sex offender, I wouldn't have finished with a smiley, she says.", "title_original": "Bryter tystnaden om Epstein: ”Jag blev manipulerad och lurad”", "summary_original": "Det har gått sju veckor sedan USA:s justitiedepartement släppte tusentals dokument ur Epsteinutredningen.  Materialet innehöll en omfattande mejlkorrespondens mellan kronprinsessan Mette-Marit och sexualförbrytaren Jeffrey Epstein och efter det har kronprinsessan hållit låg profil.  Det förklarar hon med sviktande hälsa och uppståndelsen kring rättegången mot hennes son.  – Jag är mamma till en ung man som har varit i en väldigt krävande situation.  ”Uppfattar det som en kamratlig ton” Kontakten, som pågick mellan 2011 och 2014, omfattade allt från möten till boktips. Mette-Marit beskriver nu hur hon kände sig både lurad och manipulerad av den dömde sexualförbrytaren.  Mette-Marit och Epsteins relation pågick efter att finansmannen dömts för köp av sexuella tjänster av minderårig 2008.  Mejlväxlingarna som publicerats visar en omfattande kontakt, med julhälsningar, boktips och planer om besök och möten. Tonen i mejlen kan uppfattas som intim, men det håller inte kronprinsessan med om.  – Jag uppfattar det inte så, jag uppfattar det som en kamratlig ton.  ”Har verkligen försökt komma ihåg” 2008, flera år innan relationen inleddes, dömdes Jeffrey Epstein för köp av sexuell tjänst av minderårig.  Tre år senare skriver kronprinsessan i ett mejl till Epstein att hon googlat honom och att det ”inte ser bra ut”.  Vad hon sett framgår inte, men Epsteins sexualbrott nämndes redan då på hans Wikipedia-sida.  I intervjun frågar NRK:s reporter vad hon såg.  – Jag har verkligen försökt komma ihåg det. Men om jag såg att han var en sexualförbrytare hade jag ju inte avslutat med en smiley, säger hon.", "link": "https://www.tv4.se/artikel/384Yth1qdAXBfnKrQlRdJ7/mette-marit-blev-lurad", "date_display": "2026-03-20", "date_iso": "2026-03-20T06:09:51+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/mette-marit", "/norge", "/jeffrey-epstein", "/norska-kungahuset"]}, {"id": 157, "title": "Do we want a church where you don't dare talk about same-sex marriage?", "summary": "Erik Helmerson: There must be brotherly love for those who think differently.", "title_original": "Vill vi ha en kyrka där man inte vågar prata om samkönade äktenskap?", "summary_original": "Erik Helmerson: Det måste finnas syskonkärlek för den som tycker annorlunda.", "link": "https://www.dagen.se/ledare/vill-vi-ha-en-kyrka-daer-man-inte-vagar-prata-om-samkoenade-aektenskap/10259937", "date_display": "2026-03-20", "date_iso": "2026-03-20T06:08:00+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 158, "title": "L halts the gloomy trend - but SD loses heavily after the announcement", "summary": "First measurement since
