body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; padding: 20px; color: #333; }

h1 { margin: 0 0 10px 0; color: #1a1a1a; }

/* CONTROLS */
.controls { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
button, select { padding: 10px 18px; border-radius: 8px; border: 1px solid #ddd; cursor: pointer; font-size: 0.95rem; background: white; transition: all 0.2s; }

button.download { background: #28a745; color: white; border-color: #28a745; font-weight: 600; }
select { padding-right: 30px; }

/* GRID */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; }

/* CARD */
.card {
    background: white; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    display: flex; flex-direction: column;
    transition: transform 0.2s;
    border-top: 6px solid #ccc;
    height: auto;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
.card.official { border-color: #007bff; }
.card.news { border-color: #ffc107; }

.card-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }

/* META */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; letter-spacing: 0.3px; }
.tag-type { background: #e9ecef; color: #495057; }
.tag-ministry { background: #e3f2fd; color: #0d47a1; }
.tag-old { background: #ffebee; color: #c62828; }

.meta-line { font-size: 0.85rem; color: #6c757d; margin-bottom: 12px; font-weight: 500; }
h3 { margin: 0 0 12px 0; font-size: 1.2rem; line-height: 1.4; color: #212529; }

/* SUMMARY (Expandable) */
.summary-container { position: relative; font-size: 0.95rem; color: #444; line-height: 1.6; flex: 1; }
.summary-text {
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    transition: max-height 0.3s ease;
}
.summary-text.expanded { -webkit-line-clamp: unset; overflow: visible; }

/* FOOTER */
.card-footer {
    padding: 15px 20px; background: #f8f9fa; border-top: 1px solid #eee;
    display: flex; justify-content: space-between; align-items: center;
}
.btn-text { background: none; border: none; color: #007bff; font-weight: 600; padding: 0; font-size: 0.9rem; }
.btn-text:hover { text-decoration: underline; background: none; }
.btn-link { text-decoration: none; color: #495057; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }
.btn-link:hover { color: #212529; }
</style>

_iso": "2026-08-31T14:24:09+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 26, "title": "Viktor Karlsson: The consultants are despised - but they are the future", "summary": "Thinkers on both the left and the right advocate an economy built on services. But the parties are fixed in the concrete template.", "title_original": "Viktor Karlsson: Konsulterna är föraktade – men de är framtiden", "summary_original": "Tänkare till både vänster och höger förespråkar en ekonomi byggd på tjänster. Men partierna är fast i betongmallen.", "link": "https://www.dn.se/ledare/viktor-karlsson-konsulterna-ar-foraktade-men-de-ar-framtiden/", "date_display": "2026-08-31", "date_iso": "2026-08-31T14:18:43+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 27, "title": "145 square meter house for 8.5 million", "summary": "", "title_original": "145 kvadratmeter stort hus för 8,5 miljoner", "summary_original": "", "link": "https://www.hd.se/bastad/145-kvadratmeter-stort-hus-for-85-miljoner/", "date_display": "2026-08-31", "date_iso": "2026-08-31T14:13:04+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 28, "title": "Drunken men in a fight at the campsite in Lerberget", "summary": "On Saturday evening, the police had to be called out after a fight at the campsite. Now the parties involved have reported each other for assault.", "title_original": "Berusade män i slagsmål på campingen i Lerberget", "summary_original": "På lördagskvällen fick polisen rycka ut efter ett bråk på campingplatsen. Nu har de inblandade parterna anmält varandra för misshandel.", "link": "https://www.hd.se/hoganas/berusade-man-i-slagsmal-pa-campingen-i-lerberget/", "date_display": "2026-08-31", "date_iso": "2026-08-31T14:00:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 29, "title": "Israeli minister boasts of public hanging of Palestinians", "summary": "Recently, Itamar Ben-Gvir showed where Palestinians are to be hanged. In a podcast he also said that 30-40 Palestinians should be killed every night in Gaza. It is incomprehensible that he and other extremists in Netanyahu's government are not hit by tougher sanctions.", "title_original": "Israeliske ministern skryter om att palestinier ska hängas inför publik", "summary_original": "Nyligen visade Itamar Ben-Gvir upp var palestinier ska hängas. I en podcast sa han även att 30–40 palestinier borde dödas varje natt i Gaza. Det är obegripligt att han och andra extremister i Netanyahus regering inte träffas av hårdare sanktioner.", "link": "https://www.sydsvenskan.se/kultur/israeliske-ministern-skryter-om-att-palestinier-ska-hangas-infor-publik/", "date_display": "2026-08-31", "date_iso": "2026-08-31T14:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 30, "title": "Swedish police assist during the royal funeral", "summary": "The Swedish police will assist their Norwegian colleagues in connection with the late King Harald's funeral.", "title_original": "Svensk polis bistår under  kungabegravningen", "summary_original": "Den svenska polisen kommer att bistå sina norska kollegor i samband med avlidne kung Haralds begravning.", "link": "https://www.hd.se/varlden/svensk-polis-bistar-under-kungabegravningen/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:59:55+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 31, "title": "The police are investigating - used a stun gun against the demented Celestin", "summary": "The other day, dementia sufferer Celestin Gato in Trelleborg was going out to cut bushes so he could get around better with his walker. Armed with a knife and scissors, he went out. Then someone called the police, the family believes. A moment later, a patrol came to the scene and shot Gato with a stun gun. When he fell to the ground, he was handcuffed and broke his arm in the commotion. Now Chief Prosecutor Marianne Nordström at the Special Prosecutor's Chamber confirms to TV4 Nyheterna that a preliminary investigation has been launched into suspected misconduct. The police's response The police write in an email to TV4 Nyheterna that stun guns may only be used if the \"police task\" cannot be solved in any other, less invasive way. \"The violence must be justifiable in relation to the principle of need and proportionality\", they write further. A stun gun can cause what is known as neuromuscular incapacitation, which means that the electric current knocks out the body's nervous system and temporarily stops the brain's ability to control the muscles. At the same time, the police state that the weapon must not be used against anyone who risks suffering serious injuries. The family: \"It's a disaster\" In the case of demented and cancer patient Celestin Gato, he fell so badly that he broke his arm. The family is critical of the police's actions. - They shot him and broke his hand. It's disaster. Why do they keep hurting him when he's already down? He is not aggressive. He is old and demented, says son Jean Bosco Bahati to TV4 Nyheterna. After the operation, the police should have released Celestin alone at the hospital, without relatives or the opportunity to communicate.  - I want to know why the police did that, says daughter Joys Yandereye. The police told Sydsvenskan that their intervention dealt with a case of illness. Heidi Hedberg, municipal police in Trelleborg, describes the case as tragic and says that it is about an elderly person who acted very confused. Handcuffing a person deemed to pose a threat is also routine, he explains", "title_original": "Polisen utreds – använde elpistol mot demente Celestin", "summary_original": "Häromdagen skulle demenssjuke Celestin Gato i Trelleborg ut och klippa buskar så han kunde ta sig fram bättre med sin rollator. Utrustad med kniv och sax gick han ut. Då slog någon larm till polisen, tror familjen. En stund senare kom en patrull till platsen och sköt Gato med elpistol. När han föll till marken blev han handfängslad och bröt armen i tumultet. Nu bekräftar chefsåklagare Marianne Nordström vid särskilda åklagarkammaren för TV4 Nyheterna att man inlett en förundersökning om misstänkt tjänstefel. Polisens svar Polisen skriver i ett mejl till TV4 Nyheterna att elchockvapen bara får användas om den ”polisiära uppgiften” inte kan lösas på något annat, mindre ingripande, sätt. ”Våldet ska vara försvarligt i förhållande till behovs- och proportionalitetsprincipen”, skriver man vidare. Ett elchockvapen kan orsaka så kallad neuromuskulär inkapacitering, vilket betyder att den elektriska strömmen slår ut kroppens nervsystem och tillfälligt stoppar hjärnans förmåga att kontrollera musklerna. Samtidigt uppger polisen att vapnet inte får användas mot någon som riskerar att drabbas av svåra skador. Familjen: ”Det är katastrof” I demente och cancersjuke Celestin Gatos fall föll han så illa att han bröt armen. Familjen är kritisk till polisens agerande. – De har skjutit honom och brutit hans hand. Det är katastrof. Varför fortsätter de att skada honom när han redan har fallit ner? Han är inte aggressiv. Han är gammal och dement, säger sonen Jean Bosco Bahati till TV4 Nyheterna. Efter insatsen ska poliserna ha släppt av Celestin ensam vid sjukhuset, utan anhöriga eller möjlighet att kommunicera.  – Jag vill veta varför poliserna gjorde så, säger dottern Joys Yandereye. Polisen uppger för Sydsvenskan att deras insats handlade om ett sjukdomsfall. Heidi Hedberg, kommunpolis i Trelleborg, beskriver ärendet som tragiskt och säger att det handlar om en äldre person som uppträtt väldigt förvirrat. Att handfängsla en person som bedöms utgöra ett hot är också rutin, förklarar hon.", "link": "https://www.tv4.se/artikel/52vvdkTA6G7l3j6GCDABcJ/polisen-utreds-anvaende-elpistol-mot-demente-celestin", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:54:06+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/brott-och-straff", "/polisen", "/trelleborg"]}, {"id": 32, "title": "120 square meter house for 5.4 million", "summary": "", "title_original": "120 kvadratmeter stort hus för 5,4 miljoner", "summary_original": "", "link": "https://www.sydsvenskan.se/fastighetsaffarer/120-kvadratmeter-stort-hus-for-54-miljoner/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:49:44+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 33, "title": "Letter to the editor. Convert the deed to a fixed fee", "summary": "LETTER TO THE EDITOR. It is horrible that the Land Survey is allowed to charge 1.5 percent of the purchase price in stamp duty. The cost of registration and maintenance of the property register should be the same regardless of the price of the property, writes Bo Cedergren.", "title_original": "Insändare. Gör om lagfarten till en fast avgift", "summary_original": "INSÄNDARE. Det är horribelt att Lantmäteriet tillåts ta ut 1,5 procent av köpeskillingen i stämpelskatt. Kostnaden för registrering och skötsel av fastighetsregistret bör vara densamma oavsett fastighetens pris, skriver Bo Cedergren.", "link": "https://www.dn.se/insandare/gor-om-lagfarten-till-en-fast-avgift/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:42:11+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 34, "title": "Tougher EU requirements on Chat GPT", "summary": "Chat GPT becomes the first AI service to be classified as so large that it faces particularly tough EU rules.", "title_original": "Hårdare EU-krav på Chat GPT", "summary_original": "Chat GPT blir första AI-tjänst att klassas som så stor att den ställs inför särskilt hårda EU-regler.", "link": "https://www.sydsvenskan.se/sverige/hardare-eu-krav-pa-chat-gpt/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:41:08+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 35, "title": "Live report on the war in Ukraine and the security situation in Europe", "summary": "Follow our live reporting on the war in Ukraine and the security situation in Europe.", "title_original": "Direktrapport om kriget i Ukraina och säkerhetsläget i Europa", "summary_original": "Följ vår direktrapportering om kriget i Ukraina och säkerhetsläget i Europa.", "link": "https://www.sydsvenskan.se/varlden/direktrapport-om-kriget-i-ukraina-och-sakerhetslaget-i-europa/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:35:58+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 36, "title": "Letter to the editor. Estonia's reaction shows that we need to rethink", "summary": "LETTER TO THE EDITOR. When an EU country says \"we cannot accept these prisoners\", the problem is not logistical, but structural. Now Sweden must quickly introduce an effective crime prevention strategy, writes Leif Ekman.", "title_original": "Insändare. Estlands reaktion visar att vi måste tänka om", "summary_original": "INSÄNDARE. När ett EU-land säger ”de här fångarna kan vi inte ta emot” är problemet inte logistiskt, utan strukturellt. Nu måste Sverige snabbt införa en effektiv kriminalitets­förebyggande strategi, skriver Leif Ekman.", "link": "https://www.dn.se/insandare/estlands-reaktion-visar-att-vi-maste-tanka-om/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:35:17+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 37, "title": "Laxmi cannot sleep at night after the disaster", "summary": "TRISHULI. Laxmi Chalise beats her hand on her chest to show how fast her heart beats at night when she can't sleep. The shock of the avalanche does not leave her. - A lot of people need treatment to get on, says doctor Ram Thapa.", "title_original": "Laxmi kan inte sova på nätterna efter katastrofen", "summary_original": "TRISHULI. Laxmi Chalise bankar med handen på bröstet för att visa hur snabbt hjärtat slår på nätterna när hon inte kan sova. Chocken efter störtfloden lämnar henne inte. – Väldigt många behöver vård för att komma vidare, säger läkaren Ram Thapa.", "link": "https://www.dn.se/varlden/laxmi-kan-inte-sova-pa-natterna-efter-katastrofen/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:32:50+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 38, "title": "There are two weeks left - but Ulf Kristersson has already checked out", "summary": "Prime Minister Ulf Kristersson (M).", "title_original": "Det är två veckor kvar – men Ulf Kristersson har redan checkat ut", "summary_original": "Statsminister Ulf Kristersson (M).", "link": "https://www.sydsvenskan.se/opinion/huvudledare/det-ar-tva-veckor-kvar-men-ulf-kristersson-har-redan-checkat-ut/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:28:52+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 39, "title": "Done: Barcola to Liverpool", "summary": "Liverpool have completed the signing of French national team winger Bradley Barcola from Paris Saint-Germain. The price: roughly SEK 1.3 billion.", "title_original": "Klart: Barcola till Liverpool", "summary_original": "Liverpool har gjort klart med franske landslagsyttern Bradley Barcola från Paris Saint-Germain. Priset: drygt 1,3 miljarder kronor.", "link": "https://www.sydsvenskan.se/sport/klart-barcola-till-liverpool/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:24:16+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 40, "title": "Letter to the editor. Benjamin Dousa abuses his ministerial office", "summary": "LETTER TO THE EDITOR. My high school is careful about the social mission and our democratic values. But when a moderate minister comes to visit, most of the time is spent on moderate election propaganda, writes teacher and local C politician Stefan Ögren.", "title_original": "Insändare. Benjamin Dousa missbrukar sitt ministerämbete", "summary_original": "INSÄNDARE. Min gymnasieskola är noga med samhällsuppdraget och våra demokratiska värderingar. Men när en moderat minister kommer på besök ägnas det mesta av av tiden var moderat valpropaganda, skriver läraren och lokala C-politikern Stefan Ögren.", "link": "https://www.dn.se/insandare/benjamin-dousa-missbrukar-sitt-ministerambete/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:23:22+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 41, "title": "The centre's environmental election promise: 90 percent new electric cars by 2030", "summary": "The Center Party wants 90 percent of new car sales in 2030 to be electric cars. Electric car bonuses, expanded charging networks and environmental zones will help to reach the goal. - It is a big change, states party leader Elisabeth Thand Ringqvist.", "title_original": "Centerns miljövallöfte: 90 procent nya elbilar år 2030", "summary_original": "Centerpartiets vill att 90 procent av nybilsförsäljningen 2030 ska utgöras av elbilar. Elbilsbonusar, utbyggda laddnät och miljözoner ska hjälpa till att nå målet. – Det är en stor förändring, konstaterar partiledaren Elisabeth Thand Ringqvist.", "link": "https://www.dn.se/sverige/centerns-miljovallofte-90-procent-nya-elbilar-ar-2030/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:20:02+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 42, "title": "The soldiers apologize to me for the cramped bunker", "summary": "THE COLUMN: Ukraine's soldiers know exactly what each loss costs, writes Alex Voronov directly from Ukraine.", "title_original": "Soldaterna ber mig om ursäkt för den trånga bunkern", "summary_original": "KOLUMNEN: Ukrainas soldater vet exakt vad varje förlust kostar, skriver Alex Voronov direkt från Ukraina.", "link": "https://www.hd.se/opinion/ledare/soldaterna-ber-mig-om-ursakt-for-den-tranga-bunkern/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:15:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 43, "title": "Letter to the editor. Answer: Visibility is not the same as change", "summary": "RESPONSE TO POSTERS. In the climate debate, the influence of public opinion and change in society's institutions are often mixed up. The decisive question is what happens to society's rules and institutions when the demonstration is over, writes Jonas Paulsson, party leader of the local party Växtbaserat Täby.", "title_original": "Insändare. Svar: Synlighet är inte detsamma som förändring", "summary_original": "SVAR PÅ INSÄNDARE. I klimatdebatten blandas påverkan av opinionen och förändring av samhällets institutioner ofta ihop. Den avgörande frågan är vad som händer med samhällets regler och institutioner när demonstrationen är över, skriver Jonas Paulsson, partiledare för lokalpartiet Växtbaserat Täby.", "link": "https://www.dn.se/insandare/svar-synlighet-ar-inte-detsamma-som-forandring/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:04:39+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 44, "title": "Swedish Trond, 12, on site to influence the UN", "summary": "Trond Scholtens Pennanen is one of five children on site at 3:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 49, "title": "Bozena, 71: \"Why doesn't public transport work at night?\"", "summary": "Bozena Wlosinska regularly visits her old mother in Poland. When she comes back to Lund at night, she often has to take a taxi home because the last bus and tram have already left. As the election approaches, public transport has become more and more of a matter of the heart for her.  - The buses should run once an hour, she says.", "title_original": "Bozena, 71:”Varför fungerar inte kollektivtrafiken på natten?”", "summary_original": "Bozena Wlosinska hälsar regelbundet på sin gamla mamma i Polen. När hon kommer tillbaka till Lund på natten måste hon ofta ta taxi hem eftersom sista bussen och spårvagnen redan har gått. I takt med att valet närmar sig har kollektivtrafiken blivit allt mer av en hjärtefråga för henne.  – Bussarna borde gå en gång i timmen, säger hon.", "link": "https://www.sydsvenskan.se/lund/bozena-71varfor-fungerar-inte-kollektivtrafiken-pa-natten/", "date_display": "2026-08-31", "date_iso": "2026-08-31T13:00:00+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 50, "title": "Cyclist hit at Triangelplatsen", "summary": "On Monday, a cyclist was hit by a car in the roundabout at Triangelplatsen.", "title_original": "Cyklist påkörd vid Triangelplatsen", "summary_original": "En cyklist blev under måndagen påkörd av en personbil i rondellen vid Triangelplatsen.", "link": "https://www.hd.se/hoganas/person-pakord-vid-overgangsstalle-i-hoganas/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:52:10+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 51, "title": "This is what the politicians in Helsingborg want - follow HD's big election debate", "summary": "What do Helsingborg's various parties think about important local issues? Follow HD's election debate live here on Monday evening - starting at 6pm!", "title_original": "Det här vill politikerna i Helsingborg – följ HD:s stora valdebatt", "summary_original": "Vad tycker Helsingborgs olika partier om viktiga lokala frågor? Följ HD:s valdebatt live här på måndagskvällen – med start klockan 18!", "link": "https://www.hd.se/helsingborg/det-har-vill-politikerna-i-helsingborg-folj-hds-stora-valdebatt/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:45:28+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 52, "title": "Letter to the editor. Answer: Ridiculous to let the Home Guard defend the country", "summary": "RESPONSE TO POSTERS. With NATO membership, Swedish soldiers are primarily for eastern Finland, the Baltics and possibly Poland. The Home Guard, with its 22,000 men, is thus supposed to defend the country's 450,000 square kilometers, which appears to be downright ridiculous, writes Lars-Gunnar Liljestrand.", "title_original": "Insändare. Svar: Löjeväckande låta hemvärnet försvara landet", "summary_original": "SVAR PÅ INSÄNDARE. Med Natomedlemskapet är svenska soldater främst för östra Finland, Baltikum och eventuellt Polen. Hemvärnet, med sina 22 000 man, ska således försvara landets 450 000 kvadratkilometer, vilket framstår som rent löjeväckande, skriver Lars-Gunnar Liljestrand.", "link": "https://www.dn.se/insandare/svar-lojevackande-lata-hemvarnet-forsvara-landet/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:38:38+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 53, "title": "\"Has become a kind of conflict of attrition\"", "summary": "After a month's hiatus, the US and Iran have attacked each other militarily again.", "title_original": "”Har blivit ett slags utnötningskonflikt”", "summary_original": "Efter en månads uppehåll har USA och Iran anfallit varandra militärt igen.", "link": "https://www.svd.se/a/6qKpez/har-blivit-ett-slags-utnotningskonflikt?utm_medium=rss", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:32:10+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 54, "title": "115 square meter chain house in Råå sold", "summary": "", "title_original": "115 kvadratmeter stort kedjehus på Råå sålt", "summary_original": "", "link": "https://www.hd.se/helsingborg/115-kvadratmeter-stort-kedjehus-pa-raa-salt/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:31:11+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 55, "title": "Saab-Muller speaks out about the poor years: \"Lived in a hostel\"", "summary": "Dutchman Victor Muller's sports car company Spyker bought Saab Automobile from General Motors in 2010. Barely two years later, the car manufacturer in Trollhättan went bankrupt with billions in debt. Spyker has since led a waning existence. But now Victor Muller has secured new money from 36-year-old Ukrainian crypto exchange owner Volodymyr Nosov, whom he got to know four months ago. - We have so much in common. We both share a passion for business and cars, he has 150 cars even though he is only 36 years old, says Victor Muller in the Dutch business podcast Leergeld. \"Set fire to the furniture\" With the crypto money behind him, the Dutchman has finally been able to show off Spyker's new car, the C8 Preliator, which was announced ten years ago, but was recently unveiled at the Quail motor show in California. In the interview with Leergeld, Muller is also clear that his own resources have long been exhausted. - I kept myself alive, because there was no income for ten years, by burning the furniture to keep myself warm, so to speak. And it has gone really well. I have nothing left. How was it? - Tough. It is of course quite strange when you have to break the children's piggy banks to be able to refuel to get them to school, says Victor Muller in Leergeld. Money hunt and unpaid bills Spyker's acquisition of Saab Automobile was a financial disaster. The shortfall in the bankruptcy estate was a staggering SEK 9.4 billion, and Swedish taxpayers took a big hit. After the bankruptcy, Muller tried to push Spyker forward with several different investors. In 2014, the company was declared bankrupt, which was lifted a year later after a long legal process. In 2021, however, the company finally went bankrupt, whereupon Muller bought the brand rights out of the bankruptcy estate and now intends to make another attempt. The past decade has been marred by money-hunting and unpaid bills, both for Spyker and Muller himself and his family. - We have never gone hungry. I won't exaggerate. But I have slept in a hostel in London to", "title_original": "Saab-Muller talar ut om fattiga åren: ”Bodde på vandrarhem”", "summary_original": "Holländaren Victor Mullers sportbilsbolag Spyker köpte  Saab Automobile från General Motors 2010. Knappt två år senare gick biltillverkaren i Trollhättan i konkurs med miljardskulder. Spyker har sedan dess fört en tynande tillvaro. Men nu har Victor Muller säkrat nya pengar från den 36-årige ukrainske kryptobörsägaren Volodymyr Nosov, som han lärde känna för fyra månader sedan. – Vi har så mycket gemensamt. Vi delar båda passionen för affärer och bilar, han har ju 150 bilar trots att han bara är 36 år, säger Victor Muller i den nederländska ekonomipodden Leergeld. \"Elda upp möblerna\" Med kryptopengarna i ryggen har holländaren slutligen kunnat visa upp Spykers nya bil, C8 Preliator, som annonserades för tio år sedan, men nyligen avtäcktes på motorträffen the Quail i Kalifornien. I intervjun med Leergeld är Muller också tydlig med att hans egna resurser sedan länge är slut. – Jag höll mig levande, eftersom det inte fanns några inkomster under tio års tid, genom att elda upp möblerna för att hålla mig varm, så att säga. Och det har gått riktigt bra. Jag har inget kvar. Hur var det? – Tufft. Det är naturligtvis ganska konstigt när du måste slå sönder barnens spargrisar för att kunna tanka för att få dom till skolan, säger Victor Muller i Leergeld. Pengajakt och obetalda räkningar Spykers förvärv av Saab Automobile blev en finansiell katastrof. Bristen i konkursboet blev svindlande 9,4 miljarder kronor och svenska skattebetalare tog en rejäl smäll. Efter konkursen försökte Muller driva Spyker vidare med flera olika investerare. 2014 sattes bolaget i konkurs, vilket upphävdes ett år senare efter en lång rättsprocess. 2021 gick bolaget dock slutligen i putten, varpå Muller köpte varumärkesrättigheterna ur konkursboet och nu tänker göra ett nytt försök. Det senaste decenniet har kantats av pengajakt och obetalda räkningar, både för Spyker och Muller själv med familj. – Vi har aldrig gått hungriga. Jag ska inte överdriva. Men jag har sovit på ett vandrarhem i London för att jag var så luspank, för att ta mig till ett investerarmöte nästa dag. Jag bryr mig inte, säger Victor Muller. Oklar prislapp Spyker uppger i ett pressmeddelande att de genom Volodymyr Nosov säkrat finansiering för att bygga 25 exemplar av bilen C8 Preliator.  Hur mycket pengar Volodymyr Nosov pumpat in i Spyker är oklart. Hans förmögenhet beräknas till sju miljarder dollar, enligt sajten Medium. Tidigare var den ryske oligarken Vladimir Antonov en investerare i Spyker och Saab. Efter att hans bankimperium kollapsade, har han flera gånger dömts för bedrägeri.", "link": "https://www.tv4.se/artikel/5Y5RqsGF35hX0n4Exs4Sjm/saab-muller-ttalar-ut-om-fattiga-aren-bodde-pa-vandrarhem", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:25:11+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/ekonomi", "/saab-automobile", "/spyker"]}, {"id": 56, "title": "After the turbulence – prof ide", "summary": "Household finances and healthcare are the most important issues when voters decide how to vote in the parliamentary election, according to a survey from DN/Ipsos. - There is clearly a different agenda in this election campaign compared to the last one, says Nicklas Källebring at Ipsos.", "title_original": "DN/Ipsos: Plånboken och vården viktigast när väljarna bestämmer sig", "summary_original": "Hushållsekonomin och sjukvården är de viktigaste frågorna när väljarna ska bestämma hur de röstar i riksdagsvalet, enligt en mätning från DN/Ipsos. – Det är helt klart en annan dagordning i den här valrörelsen jämfört med den förra, säger Nicklas Källebring på Ipsos.", "link": "https://www.dn.se/sverige/dn-ipsos-planboken-och-varden-viktigast-nar-valjarna-bestammer-sig/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:01:13+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 60, "title": "Red numbers despite the success in 2024 for Designgolv in Scandinavia", "summary": "Design floor in Skandinavien AB had a turnover of around ten and a half million kroner last year.", "title_original": "Röda tal trots succén 2024 för Designgolv i Skandinavien", "summary_original": "Designgolv i Skandinavien AB omsatte omkring tio och en halv miljoner kronor senaste året.", "link": "https://www.hd.se/landskrona/roda-tal-trots-succen-2024-for-designgolv-i-skandinavien/", "date_display": "2026-08-31", "date_iso": "2026-08-31T12:00:18+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 61, "title": "The future of the Saga cinema is secured", "summary": "There will be no doubled rent for Sagabiografen in Höganäs. A new lease is underway and will be signed in October. The municipality itself has to cover the cost of a disabled toilet.", "title_original": "Sagabiografens framtid är säkrad", "summary_original": "Det blir ttps://www.hd.se/skane/far-inte-heta-sylt-byter-namn-till-beredning/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:52:30+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 71, "title": "Høiby with and carries Harald's coffin through the castle", "summary": "King Harald's coffin was moved on Monday afternoon in a procession through the castle in Oslo to…", "title_original": "Høiby med och bär Haralds kista genom slottet", "summary_original": "Kung Haralds kista flyttades på måndagseftermiddagen i en procession genom slottet i Oslo till…", "link": "https://www.svd.se/a/9pMjrE/hoeiby-far-delta-vid-kungens-begravning?utm_medium=rss", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:49:51+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 72, "title": "In memory of Lars Hurtig", "summary": "Kerstin Hurtig has written this memorial about him", "title_original": "Till minne av Lars Hurtig", "summary_original": "Kerstin Hurtig har skrivit detta minnesord om honom", "link": "https://www.dagen.se/familj/till-minne-av-lars-hurtig/10489321", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:49:41+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 73, "title": "New owners of villa", "summary": "", "title_original": "Nya ägare till villa", "summary_original": "", "link": "https://www.sydsvenskan.se/fastighetsaffarer/nya-agare-till-villa-kJbH3/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:37:45+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 74, "title": "Fire alarm at Väla", "summary": "On Monday, the emergency services went to Väla following reports of a suspicious fire in a premises.", "title_original": "Larm om brand på Väla", "summary_original": "På måndagen ryckte räddningstjänsten ut till Väla efter uppgifter om en misstänkt brand i en lokal.", "link": "https://www.hd.se/helsingborg/larm-om-brand-pa-vala/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:35:33+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 75, "title": "S election promise: Introduce a Swedish mafia law", "summary": "The Social Democrats want to introduce a Swedish mafia law and transform the Ecocrime Authority into the Organized Crime Agency. - The new authority must function as a hub and guide for society's efforts, says S legal policy spokesperson Teresa Carvalho.", "title_original": "S vallöfte: Inför en svensk maffialag", "summary_original": "Socialdemokraterna vill införa en svensk maffialag och stöpa om Ekobrottsmyndigheten till Myndigheten mot organiserad brottslighet. – Den nya myndigheten ska fungera som nav och ledning för samhällets insatser, säger S rättspolitiska talesperson Teresa Carvalho.", "link": "https://www.dn.se/sverige/s-vallofte-infor-en-svensk-maffialag/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:33:33+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 76, "title": "Deadlock in the dispute between KD and SD", "summary": "SD leader Jimmie Åkesson has demanded a public answer to the \"exceptional situation\" in which the KD leader can say yes to an S-led government. But KD has no plans for a special public clarification.", "title_original": "Dödläge i bråket mellan KD och SD", "summary_original": "SD-ledaren Jimmie Åkesson har krävt ett offentligt svar på i vilket ”exceptionellt läge” KD-ledaren kan säga ja till en S-ledd regering. Men KD har inga planer på ett särskilt offentligt klarläggande.", "link": "https://www.sydsvenskan.se/sverige/dodlage-i-braket-mellan-kd-och-sd/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:24:08+00:00", "source": "Sydsvenskan", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 77, "title": "One arrested after shooting at rave", "summary": "One person has been arrested after the shooting at a rave in the Swiss Aarau on Sunday night. Four of those injured are Swiss citizens and the fifth is German, writes the newspaper Blick.", "title_original": "En gripen efter skottlossning på rejv", "summary_original": "En person har gripits efter skottlossningen på ett rejv i schweiziska Aarau natten till söndagen. Fyra av de som skadades är schweiziska medborgare och den femte är tysk, skriver tidningen Blick.", "link": "https://www.hd.se/varlden/en-gripen-efter-skottlossning-pa-rejv/", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:22:00+00:00", "source": "Helsingborgs Dagblad (HD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 78, "title": "Warns of the notorious drug: \"You are in a world that does not exist\"", "summary": "At the age of 12, Johanna started drinking alcohol. When she was 14, she moved away from home and started smoking cannabis. She quickly developed a liking for amphetamines. - I thought I was an adult. I'd never let a 14-year-old move away from home, but then of course there were parties. What followed was a deep abuse of mainly amphetamines, but also other drugs. She went in and out of different treatment centers. Notorious drug on the rise in Sweden In the early 2010s, the internet drug MDPV basically took over Västerås. The amphetamine-like drug is very similar to alpha-PVP, which circulated at the same time and then largely disappeared. Until a year ago, when the police's seizures began to increase, above all in Norrköping and the surrounding area. In total, the police seized 418 grams of alpha-PVP in 2026. - These are still very low levels compared to other drugs, but the increase is quite large, says Linda Nilsson at the police's National Operative Department in the East region. The potent drug alpha-PVP - known as \"flakka\" and \"bath salts\" in the US - is a synthetic cathinone. It has basically replaced regular amphetamine in Finland, but Sweden has been relatively spared from the drug. \"Such a nasty drug\" Johanna Lindén took both MDPV and alpha-PVP for several years in the 2010s. The drug was cheap, easily available and incredibly strong, she says. Strong enough that even heroin addicts would switch to it. - It is such a disgusting drug. I feel really bad when I hear that it has increased again. She describes a period of constant psychosis. - It's not even possible to explain how it goes in the head. You are in a world that does not exist. When you end up in these psychoses, you're kind of not aware of it. You walk in your own world, see things and see people talking even if they don't. She has friends who died from the drug and believes they were not even aware of their own death when they died. - They think they are at their best, but in reality they sit completely curled up, with a look that is completely gone. According to her, it is the worst drug", "title_original": "Varnar för ökända drogen: ”Man är i en värld som inte existerar”", "summary_original": "Vid 12 års ålder började Johanna dricka alkohol. När hon var 14 år flyttade hon hemifrån och började röka cannabis. Snabbt fann hon tycke för amfetamin. – Jag trodde att jag var vuxen. Jag hade aldrig låtit en 14-åring flytta hemifrån, men sedan blev det naturligtvis fester. Det som följde var ett djupt missbruk av framför allt amfetamin, men även andra droger. Hon åkte in och ut från olika behandlingshem. Ökända drogen ökar i Sverige I början av 2010-talet tog internetdrogen MDPV i princip över i Västerås. Den amfetaminliknande drogen är mycket lik alfa-PVP, som cirkulerade samtidigt och sedan i stort sett försvann. Tills för ett år sedan, då polisens beslag började öka, framför allt i Norrköping med omnejd. Totalt har polisen beslagtagit 418 gram alfa-PVP under 2026. – Det är fortfarande mycket låga nivåer jämfört med annan narkotika, men ökningen är ganska stor, säger Linda Nilsson vid polisens Nationella operativa avdelning i region Öst. Den potenta drogen alfa-PVP – känd som ”flakka” och ”bath salts” i USA – är en syntetisk katinon. Den har i princip ersatt vanligt amfetamin i Finland, men Sverige har varit relativt skonade från drogen. ”Så vidrig drog” Johanna Lindén tog både MDPV och alfa-PVP under flera år på 2010-talet. Drogen var billig, lättillgänglig och otroligt stark, berättar hon. Tillräckligt stark för att även heroinister skulle gå över till den. – Det är en så vidrig drog. Jag mår jättedåligt när jag hör att den har ökat igen. Hon beskriver en period av konstanta psykoser. – Det går inte ens att förklara hur det blir i huvudet. Man är i en värld som inte existerar. När man hamnar i de här psykoserna är man liksom inte medveten om det. Man går i sin egen värld, ser saker och ser folk prata fast de inte gör det. Hon har vänner som dött av drogen och tror att de inte ens var medvetna om sin egen död när de dog. – De tror att de är på topp, men i verkligheten sitter de helt ihopkrupna, med en blick som är helt borta. Det är enligt henne den värsta drogen hon någonsin har tagit, och hon ”skulle inte ta den igen även om hon hade en pipa mot nacken”. Hon har fått hjärtstillestånd och hamnat i tillstånd då hon inte kunnat andas. Förlorat allt i missbruket Efter en livslång kamp med missbruket har hon nu lyckats vända sitt liv. Hon reagerar starkt på människors kommentarer om missbruk. – Det finns ingen människa som vill hålla på så här. Ingen. Alla bär på skuld och skam.  Med hjälp av Anonyma Narkomaners tolvstegsprogram har hon varit nykter i flera år.  – Man får höra: ”Du får skylla dig själv när du började med droger.” Herregud, det tar lång tid innan man hamnar där jag har varit, och det tar lika lång tid att ta sig ur ett missbruk. ”Runt en beroende finns det tio till som drabbas” Hon beskriver hur hon förlorat allt på grund av missbruket, levt på gatan och i dag har stora problem med minnet. – Man brukar säga att runt en person med beroende finns det tio andra som drabbas, om inte fler. Jag är mamma och syster. Mina föräldrar har lidit. Den bördan blir hon aldrig av med, säger hon. – Jag kan föra budskapet vidare till en person med beroende som fortfarande lider. Det är fint, det är vackert. Jag har inte slängt mitt liv åt fanders.", "link": "https://www.tv4.se/artikel/2NnXPmH2z7jPNHXEo80iFF/varnar-foer-oekaenda-drogen-man-aer-i-en-vaerld-som-inte-existerar", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:15:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/inrikes", "/droger", "/missbruk"]}, {"id": 79, "title": "An arrested suspect for rifle shooting", "summary": "", "title_original": "En gripen misstänkt för rejvskjutning", "summary_original": "", "link": "https://www.svd.se/a/wA9Gmd/senaste-nytt?pinnedEntry=76788&utm_medium=rss", "date_display": "2026-08-31", "date_iso": "2026-08-31T11:09:04+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 80, "title": "USA storms against camera surveillance", "summary": "After years of growing criticism against surveillance company Flock Safety, opposition is now exploding against…", "title_original": "USA till storms mot kameraövervakning", "summary_original": "Efter år av växande kritik mot övervakningsföretaget Flock Safety exploderar nu motståndet mot…", "link": "https://www.svd.se/a/Okq47l/flock-safety-har-120-000-overvakningskameror-uppsatta-i-usa-nu-vill-bade-demokrater-och-republikaner-ha-bort-dem?utm_medium=rss", "date_display": "2026-08-31", "date_iso": "2026-08-31T10:52:17+00:00", "source": "Svenska Dagbladet (SvD)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 81, "title": "Magdalena Andersson: \"Difficult to form a government without the Center Party being involved\"", "summary": "Magdalena Andersson (S) criticizes Jimmie Åkesson's (SD) demand for \"submission\" in the Tidö collaboration. She herself keeps the door open for collaboration across the traditional block boundaries. - I want to lead Sweden in a new direction of cooperation and am prepared to cooperate with several different parties, she tells DN.", "title_original": "Magdalena Andersson: ”Svårt att bilda regering utan att Centerpartiet är involverat”", "summary_original": "Magdalena Andersson (S) kritiserar Jimmie Åkessons (SD) krav på ”underkastelse” i Tidösamarbetet. Själv håller hon dörren öppen för ett samarbete över de traditionella blockgränserna. – Jag vill leda Sverige i en ny samarbetsriktning och är beredd att samarbeta med flera olika partier, säger hon till DN.", "link": "https://www.dn.se/sverige/magdalena-andersson-svart-att-bilda-regering-utan-att-centerpartiet-ar-involverat/", "date_display": "2026-08-31", "date_iso": "2026-08-31T10:51:15+00:00", "source": "Dagens Nyheter (DN)", "ministry": "General News", "type": "News", "age_tag": "today", "tags": []}, {"id": 82, "title": "16-year-old still in custody - still a suspect", "summary": "The 16-year-old boy, who was arrested and detained in Stockholm on 24 August on suspicion of preparation for murder, is no longer in custody in that case. But he remains in custody as he is also suspected of aiding and abetting the school crime in Fagersta.", "title_original": "16-åring kvar i häkte – fortsatt misstänkt", "summary_original": "Den 16-årige pojke, som den 24 augusti greps och anhölls i Stockholm misstänkt för förberedelse till mord, är inte längre frihetsberövad i det ärendet. Men han är kvar i häkte då han även misstänks för medhjälp i skoldådet i Fagersta.", "link": "https://www.sydsvenskan.se/sverige/16-aring-slappt-misstankt-for-forberedelse-till-mord/", "date_display": "2026-08-31", "date_iso": "2026-08-31T10:48:01+00:00", "source": "Sydsvenskan", "minist ts ned. [...] Det är uppenbart att beskedet att avskeda mig tagits först och att de därefter försökt hitta ett svepskäl att hänga upp det på”, skriver Åman Thiel. Ifrågasatta utlandsresor Senare kom anklagelserna att preciseras till att facklig tid skulle ha använts till semester, vilket Expressen var först att berätta om. Enligt brevet som TV4 läst har SAS satt frågetecken för att Mattias Åman Thiel varit utomlands sammanlagt nio dagar under tre års tid, då han haft facklig tid på schemat. ”Jag har arbetat fackligt alla de aktuella datumen, vilket jag kan styrka med en detaljerad logg över arbetsuppgifter, mail, dokument och meddelanden. Efter att SAS fått se loggen menade de i stället att det fackliga arbete jag utfört inte höll tillräckligt god kvalité. Det är naturligtvis inte arbetsgivaren som ska bedöma det”, skriver Mattias Åman Thiel i det interna brevet till SPF:s medlemmar. ”Kommer inte göra undantag” Svensk Pilotförening ska idag måndag hålla ett extrainsatt krismöte på Arlanda med anledning av avskedandet av den lokale ordföranden. SAS ledning vill inte kommentera uppsägningen av Åman Thiel, men gör ett generellt uttalande: – På SAS är det en grundläggande princip att samma arbetsrättsliga regler, företagspolicyer, krav och förväntningar gäller för alla våra kollegor. Vi kan och kommer inte att göra undantag eller behandla kollegor olika beroende på deras position, senioritet eller personliga relationer, säger Alexandra Lindgren Kaoukji, kommunikationschef på SAS. Ökad risk för strejk Flera källor till TV4 inom SAS-personalen säger att stämningen i bolaget är upprörd efter uppsägningen av Mattias Åman Thiel, och menar att personlig animositet mellan honom och bolagets avgående vd Anko van der Werff kan ha spelat roll. Flygbolaget ska förhandla ett nytt kollektivavtal inför 2027, vilket kallas för K27. Risken för strejker bedöms ha ökat, vilket Mattias Åman Thiel också är inne på i sitt interna brev. ”Strategin att ge sig på ledaren för att vinna slaget m Minst åtta personer har bekräftats döda medan räddningstjänsten fortsätter sökandet efter de saknade. I räddningsinsatsen deltar bland annat turkiska kustbevakningsfartyg, helikoptrar, drönare och ett övervakningsflygplan från Turkiet. Den turkiska republiken Nordcypern har med anledning av olyckan utlyst tre dagars landssorg. Polisen har samtidigt gripit färjans kapten och ytterligare sju besättningsmedlemmar. Olyckan utreds nu av myndigheterna. Den cirka 40 meter långa katamaranen ska enligt myndigheterna ha sjunkit till botten på mer än 500 meters djup. Orsaken till olyckan är ännu inte fastställd. – Det finns fortfarande mycket frågetecken, konstaterar TV4 Nyheternas utrikesreporter Tomas Kvarnkullen, som är på plats på Cypern.", "link": "https://www.tv4.se/artikel/75RWlLTdjyCBYDbZNJI1gT/panikslagna-passagerare-slog-larm-men-faerjan-fortsatte-aenda", "date_display": "2026-08-31", "date_iso": "2026-08-31T06:27:36+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/cypern", "/farja"]}, {"id": 130, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Var tredje snusare skräpar ner: ”Kostar hundratals miljoner”", "summary_original": "Undersökningen gjordes på uppdrag av Håll Sverige Rent och omfattar 1 084 svenskar i åldern 16–84 år som röker, snusar och eller vejpar regelbundet.  Den visar att 29 procent av snusarna ibland slänger prillan på marken. Trots att siffrorna är en förbättring jämfört med 2020 kan man inte se någon skillnad i skräpmätningarna hur många prillor som ligger på gator, torg eller i naturen, berättar Joakim Brodahl, vice vd på Håll Sverige rent.  – Men det är intressant att se att det ändå finns en minskning, så man kan hoppas att man kan göra något åt det här, säger han.  Fler snusar – mindre rökning Joakim Brodahl menar att den ökade användningen av vitt snus kan vara en förklaring till att mängden snusprillor i miljön inte minskar, trots att färre röker.  – Vi ser i statistiken att rökningen minskar, vilket är glädjande, men att det vita snuset framför allt ökar. Enligt Brodahl finns det en tydlig kunskapsbrist bland snusare.  – Sju av tio uppger att de inte visste att snusprillor innehåller plaster, kemikalier och gifter. Hade man vetat det skulle man dra sig för att skräpa ner, säger han. Många tror att de är bättre än andra Nästan åtta av tio snusare anser att de själva skräpar ner mindre än andra snusare.  – Det kan finnas lite glapp där i verklighetsuppfattningen, säger Brodahl. Han påpekar att många ändå gör rätt, men att nedskräpning med nikotinprodukter är ett allvarligt miljö- och samhällsproblem. Av rökarna uppger 24 procent att de slänger fimpen ute i naturen.  – Det är ingen som vill ha fimpar eller snusprillor hemma hos sig vilket gör att det föder obehag. Det finns ingenting gott med det, utan det är bara negativa konsekvenser. Beteendeförändring är nyckeln Brodahl menar att det viktigaste är att påverka människors beteende och öka kunskapen om konsekvenserna. Han tycker inte att det generellt finns för få papperskorgar, men att infrastrukturen måste vara tillräcklig för att det ska vara lätt att göra rätt.  – Det enklaste är att släcka fimpen och slänga i en papperskorg. Alternativt kan man använda en engångsask, säger Joakim Brodahl.", "link": "https://www.tv4.se/artikel/64giq9KgsdhuNPWmmF2J45/undersoekning-var-tredje-snusare-erkaenner-att-de-skraepar-ner", "date_display": "2026-08-31", "date_iso": "2026-08-31T05:33:31+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyhetsmorgon", "/nyhetsmorgon", "/snus", "/nedskrapning"]}, {"id": 131, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.Th 00 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Över 30 döda på äldreboende: ”Varför förvara ammunition här?”", "summary_original": "Det var i fredags natt som en rysk drönare träffade ett ammunition- och vapenlager i byn Myla, väster om Kiev. Granater, minor och annan ammunition exploderade och en kraftig brand bröt ut. Ett 50-tal hus skadades i explosionerna och den efterföljande branden. Under gårdagen fördes över 30 kroppar ut från ett äldreboende i området. I Ludmila Polianichkos trädgård ligger granater och vapen utspridda. – Det var en så enorm explosion att alla fönster splittrades inåt på ett ögonblick. Vi trodde aldrig att det kunde finnas något liknande i lagret. Vi samlade ihop allt på gården. Man såg vilken hög med odetonerade granater och ammunition det fanns. Attacken beskrivs som den dödligaste i år och över 370 människor evakuerades. Zhanna Kravchuk, 52, förlorade sin man i attacken och har nu flera frågor. – Det finns så många frågor. Varför finns sådana här vapen här? Varför förvaras de i lager och inte vid frontlinjen, där de skulle kunna göra nytta? Zelenskyj: Polisutredning inledd President Volodymyr Zelenskyj skriver på X under söndagen att de flesta bränderna är släckta efter attacken. 38 personer dog i attacken, 20 personer skadades och fyra saknas. ”Sökinsatsen för att hitta dem fortsätter. Jag är tacksam mot alla som finns där för människorna och ger hjälp”, skriver han. Han skrev under lördagen att frågan om varför ammunitionen fanns där kommer att utredas av polis. Enligt honom är det inte tillåtet enligt ukrainsk lag att förvara ammunition nära människors hem. ”En fruktansvärd situation och en fruktansvärd försummelse från de som förvarade sprängämnen alldeles intill människor.” Ryssland bekräftar attacken och skriver i ett uttalande att landet riktade in sig på ammunitionslagret, enligt BBC. Andra attacken på två månader Attacken är den andra i Kievregionen på två månader där ett ammunitionslager har exploderat och dödat lokalbefolkning. I juli exploderade ett lager i Vyshneve. Explosionen dödade nio personer, skadade dussintals och förstörde hundratals hem i området. Flera boende i Kiev reagerar nu starkt på att fredagens explosion kunde ske igen. – Försvarsministeriet, varför var detta tillåtet vid depåerna, på en plats där det brukade finnas mat? säger Borys Daniyluk, 61, till BBC. – Varför förvarades ammunition och vapen där, bredvid en befolkad by? Det finns inga ord, bara känslor.", "link": "https://www.tv4.se/artikel/6WBkddll72NOCHfsoQb4Cj/oever-30-spraengdes-till-doeds-pa-aeldreboende-varfoer-haer", "date_display": "2026-08-30", "date_iso": "2026-08-30T20:09:01+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna", "/utrikes", "/ukraina", "/ukrainakonflikten", "/kiev"]}, {"id": 144, "title": "The girl is miraculously rescued from a collapsed building - after 60 hours", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Flickan mirakelräddas ur kollapsad byggnad – efter 60 timmar", "summary_original": "Se dramatiska räddningsinsatsen • Nästan 800 döda", "link": "https://www.tv4.se/artikel/44HbVfsUacJt3bHtt37l4H/flickan-mirakelraeddas-ur-kollapsad-byggnad-efter-60-timmar", "date_display": "2026-08-30", "date_iso": "2026-08-30T17:56:34+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Nyheterna"]}, {"id": 145, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Så nära var polisen misstänkte mördaren – redan 2005: ”Otroligt”", "summary_original": "När den dåvarande chefen för länskriminalen, Börje Öhman, kommer till gården i Brattås utanför Härnösand den 2 juni 2005 har han gott självförtroende.  – Jag är inte särskilt orolig över ärendet i sig därför att normalt så är mord – att säga lättuppklarade är väl fel - men de brukar klaras upp i nio fall av tio, säger han i TV4 Nyheterna Story.  70-årige Tor Öberg och hans särbo Gärd Viklund hade blivit brutalt ihjälslagna på den ensliga gården och Börje Öhman tänker att de få grannarna bör ha noterat eventuella avvikelser. ”Det ska inte vara så här svårt” Polisen ställer därför upp kontroller längs vägen in mot Härnösand för att fråga alla som passerar om de sett något annorlunda de senaste dagarna. De får en rad tips om bilar och personer som inte känns igen, men inget av spåren leder vidare. Ett DNA-spår som säkrats på Gärd Viklunds ben testas mot alla polisen kan ta in på förhör, totalt över 800 personer i Sverige och utomlands, men polisen får ingen träff.  – Och då så småningom kommer ju naturligtvis tanken, “men hur svårt ska det här vara”. “Det ska inte vara så här svårt, varför kommer vi inte rätt?”, säger Börje Öhman. DNA-träffen: ”Otroligt fascinerande” Nästan 21 år efter morden påbörjar polisen ett arbete med att identifiera den misstänkte genom DNA-baserad släktforskning. En metod som nyligen tillåtits i lag efter att den testats för att identifiera den skyldige till dubbelmordet i Linköping. Och när träffen kommer inser Börje Öhman hur nära de var – åtminstone geografiskt. När de första poliserna kom till gården satt den nu åtalade 45-åringen i sin lägenhet ungefär fyra kilometer därifrån. Och under tiden de höll sina förhör var de ännu närmre varandra. Lägenheten ligger nämligen mindre än en kilometer från polishuset.  – Sammantaget är det en stor utredning men den är väldigt gedigen. Och att vi då inte har nått fram till den här personen är ju i sig otroligt fascinerande, säger Börje Öhman. Den misstänkte 45-åringen nekar till brott. Han erkänner att han flyttat Gärds kropp för att han var rädd för att själv bli misstänkt men säger att han inte har dödat henne.", "link": "https://www.tv4.se/artikel/408VO76T5aHAmoU9loDaSR/sa-naera-var-polisen-misstaenkte-moerdaren-redan-2005-otroligt", "date_display": "2026-08-30", "date_iso": "2026-08-30T17:06:07+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Brattås", "/brattas", "/dubbelmordet-i-brattas", "/inrikes", "/nyheterna-story"]}, {"id": 146, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "", "title_original": "Debatten om Trump som skymmer viktigaste frågan", "summary_original": "", "link": "https://www.tv4.se/artikel/497rydrqgmw2eeKLcyRDdU/aer-trump-vaerldens-baesta-eller-saemsta-foerhandlare", "date_display": "2026-08-30", "date_iso": "2026-08-30T16:16:24+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "today", "tags": ["Utrikesnyheter", "/utrikes"]}, {"id": 147, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "title_original": "Kungaparet och ärkebiskopen deltog i gudstjänst efter skolattacken", "summary_original": "Även politiker och representanter för räddningstjänsten och den drabbade skolan deltog.", "link": "https://www.dagen.se/nyheter/kungaparet-och-aerkebiskopen-deltog-i-gudstjaenst-efter-skolattacken/10505049", "date_display": "2026-08-30", "date_iso": "2026-08-30T13:41:59+00:00", "source": "Dagen", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": []}, {"id": 148, "title": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.", "summary": "Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
