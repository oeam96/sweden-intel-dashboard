hchi and Ghalibaf were on an Israeli list of intended targets, but that the plans were put aside when the US began talks with Iran. According to the New York Times, US representatives have subsequently urged Israel to refrain from targeting the two. The paper also states that Iran took extensive security measures during the negotiations. Among other things, Iranian representatives are said to have requested guarantees, via Pakistani and Qatari intermediaries, that the delegation participating in talks with the United States would not be subjected to attacks. - Today, Ghalibaf and Araghchi, together with others, have funds", "title_original": "Uppgifter: USA varnade Iran för israelisk dödsplan", "summary_original": "USA befarade att Israel kunde komma att försöka döda två av Irans högsta politiska företrädare under känsliga fredsförhandlingar tidigare i år. Det uppger New York Times, som hänvisar till nuvarande och tidigare amerikanska tjänstemän. Enligt tidningen växte oron under våren när USA och Iran förde samtal om ett möjligt avtal som skulle kunna leda till vapenvila och fortsatta förhandlingar om Irans kärnenergiprogram. Varnade Iran via andra länder De personer som amerikanska företrädare särskilt oroade sig för var Irans utrikesminister Abbas Araghchi och talmannen Mohammad Bagher Ghalibaf. Båda har haft betydande roller i kontakterna mellan Iran och USA sedan kriget bröt ut. Enligt New York Times var USA så bekymrat över risken för ett israeliskt attentat att amerikanska företrädare via andra länder i regionen lät varna Iran om hotbilden. Bakgrunden ska ha varit att Israel tidigt i konflikten prioriterade att slå mot den iranska ledningen. Samtidigt började USA allt mer fokusera på möjligheterna att nå en politisk lösning, enligt tidningen. New York Times beskriver hur USA framställde sitt mål som att få till stånd en överenskommelse och undvika nya strider. Samtidigt uppges många i Israel ha motsatt sig en uppgörelse som inte ledde till regimskifte eller en betydande försvagning av Irans militära kapacitet. Uppgifter om mållista Wall Street Journal rapporterade redan i mars att Araghchi och Ghalibaf funnits med på en israelisk lista över tilltänkta mål, men att planerna lagts åt sidan när USA inledde samtal med Iran. Enligt New York Times ska amerikanska företrädare därefter ha uppmanat Israel att avstå från att rikta in sig på de båda. Tidningen uppger också att Iran vidtog omfattande säkerhetsåtgärder under förhandlingarna. Bland annat ska iranska företrädare ha begärt garantier, via pakistanska och qatariska mellanhänder, att den delegation som deltog i samtal med USA inte skulle utsättas för attacker. – I dag har Ghalibaf och Araghchi, tillsammans med andra medlemmar i förhandlingsgruppen, satt sina liv på spel trots att de är medvetna om de allvarliga säkerhetsriskerna, och detta är ett verkligt uppoffrande, inte någon politisk manöver, sa Mohsen Zanganeh, en parlamentsledamot, som uttalade sig till lokala medier i slutet av april efter mötet i Islamabad. Trots säkerhetsoron fortsatte kontakterna mellan länderna. Araghchi och Ghalibaf deltog senare i möten i både Qatar och Schweiz tillsammans med amerikanska företrädare. Israel har, enligt New York Times, ännu inte kommenterat uppgifterna.", "link": "https://www.tv4.se/artikel/3lYJC1e8oCMBvNowf4P7e6/uppgifter-usa-varnade-iran-foer-israelisk-doedsplan", "date_display": "2026-07-03", "date_iso": "2026-07-03T20:44:16+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/utrikes", "/usa", "/irankriget", "/iran", "/israel"]}, {"id": 143, "title": "The good news: Anna receives ALS medicine in Sweden", "summary": "Mother of two Anna Furbeck from Luleå was diagnosed with ALS three years ago. In order to get access to the drug Tofersen, which can slow down parts of the course of the disease in some patients, she has so far been forced to travel to Germany. During Friday, Anna was informed by her neurologist that she was approved for treatment in Sweden, something P4 Norrbotten was the first to tell. - It's a good day today, says her husband Christoffer Eriksson to TV4 Nyheterna. \"Fantastic\" The announcement comes after the regions' expert council, the NT Council, updated its recommendations and opened the way for the medicine to be offered to patients who meet special criteria. - There were quite high criteria and it was unclear whether Anna would fulfill them. But after going through her case, it has now been established that she meets the requirements set, says Christoffer Eriksson. The family no longer needs to raise money for the treatment, as it is now financed within Swedish healthcare. Anna can also receive her treatment at Sunderby Hospital, just 15 minutes from home, instead of having to make four-day trips to Germany.  - It is fantastic. It is great and happy news, he says. Paid 250,000 a month When the couple visited Nyhetsmorgon in April this year, Christoffer told that Anna loses bodily functions for every day that goes by without the medicine. When she started the treatment, the hope was that it would eventually be able to continue in Sweden. - To continue to self-finance a drug treatment that costs around a quarter of a million kroner a month - that is not sustainable. So this means a lot, he says. At the same time, Christoffer thinks it is fantastic that, thanks to support from the public, they were able to start the treatment even before the drug was recommended in Sweden. - This gives even more reasons to feel hope and confidence in the future. Anna is expected to receive the first treatment in Sweden in August.", "title_original": "Glädjebeskedet: Anna får ALS-medicin i Sverige", "summary_original": "Tvåbarnsmamman Anna Furbeck från Luleå diagnostiserades med ALS för tre år sedan. För att få tillgång till läkemedlet Tofersen, som kan bromsa delar av sjukdomsförloppet hos vissa patienter, har hon hittills tvingats resa till Tyskland. Under fredagen fick Anna besked av sin neurolog att hon godkänts för behandling i Sverige, något P4 Norrbotten var först med att berätta. – Det är en bra dag i dag, säger hennes man Christoffer Eriksson till TV4 Nyheterna. ”Fantastiskt” Beskedet kommer efter att regionernas expertråd, NT-rådet, uppdaterat sina rekommendationer och öppnat för att läkemedlet ska kunna erbjudas patienter som uppfyller särskilda kriterier. – Det var ganska högt ställda kriterier och det var oklart om Anna skulle uppfylla dem. Men efter att ha gått igenom hennes ärende har man nu konstaterat att hon uppfyller de krav som ställts, säger Christoffer Eriksson. Familjen behöver inte längre samla in pengar till behandlingen, eftersom den nu finansieras inom den svenska vården. Anna kan dessutom få sin behandling på Sunderby sjukhus, bara 15 minuter från hemmet, i stället för att behöva göra fyradagarsresor till Tyskland.  – Det är fantastiskt. Det är ju stora och glada nyheter, säger han. Betalade 250 000 i månaden När paret gästade Nyhetsmorgon i april i år berättade Christoffer att Anna förlorar kroppsliga funktioner för varje dag som går utan medicinen. När hon påbörjade behandlingen var förhoppningen att den så småningom skulle kunna fortsätta i Sverige. – Att fortsätta egenfinansiera en läkemedelsbehandling som går på omkring en kvarts miljon kronor i månaden – det är ju inte hållbart. Så det här betyder jättemycket, säger han. Samtidigt tycker Christoffer att det är fantastiskt att de, tack vare stöd från allmänheten, kunde påbörja behandlingen redan innan läkemedlet rekommenderades i Sverige. – Det här ger ännu fler skäl att känna hopp och tilltro inför framtiden. Den första behandlingen i Sverige väntas Anna få i augusti.", "link": "https://www.tv4.se/artikel/5MgXBFutuMZK02pHfOmu7D/glaedjebeskedet-anna-far-als-medicin-i-sverige", "date_display": "2026-07-03", "date_iso": "2026-07-03T20:05:43+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna", "/inrikes", "/halsa", "/als", "/lakemedel", "/medicin"]}, {"id": 144, "title": "Maria Malmer Stenergard to receive China’s Minister of Foreign Affairs Wang Yi", "summary": "On Saturday 4 July, Minister for Foreign Affairs Maria Malmer Stenergard will receive China’s Minister of Foreign Affairs Wang Yi for a bilateral meeting. Prime Minister Ulf Kristersson will also receive Mr Wang for a courtesy visit.", "title_original": "Maria Malmer Stenergard to receive China’s Minister of Foreign Affairs Wang Yi", "summary_original": "On Saturday 4 July, Minister for Foreign Affairs Maria Malmer Stenergard will receive China’s Minister of Foreign Affairs Wang Yi for a bilateral meeting. Prime Minister Ulf Kristersson will also receive Mr Wang for a courtesy visit.", "link": "https://www.government.se/press-releases/2026/07/maria-malmer-stenergard-to-receive-chinas-minister-of-foreign-affairs-wang-yi/", "date_display": "2026-07-03", "date_iso": "2026-07-03T18:06:00+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "1 day old", "tags": ["Press release", "International", "Prime Minister's Office", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard", "Ulf Kristersson"]}, {"id": 145, "title": "Oskar, 19, has collected half a million for Christian's family", "summary": "Contributions continue to flow in • \"Many Swedes who were very affected\"", "title_original": "Oskar, 19, har samlat in en halv miljon till Christians familj", "summary_original": "Bidrag fortsätter strömma in • ”Många svenskar som blev väldigt berörda”", "link": "https://www.tv4.se/artikel/4fintzPg9wG4QuF36JNLIT/oskar-19-har-samlat-in-en-halv-miljon-till-christians-familj", "date_display": "2026-07-03", "date_iso": "2026-07-03T17:35:50+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 146, "title": "Sixteen children were rescued from homes of horrors - kept locked up", "summary": "It was when the police conducted a house search in the town of Hamden in Ohio on Tuesday, in connection with another case, that the 16 children were discovered, according to the AP news agency. \"Most of our livestock are kept in better conditions than the children,\" said Sheriff Ryan Cain during a press conference. The family is said to have moved around Ohio in recent years to avoid the authorities. The children were not enrolled in any school. Surrounded by human excrement The children, boys and girls from the same family aged 1.5 to 18, lived according to pictures from the scene in very difficult conditions. Outside the house were, among other things, children's bicycles and other discarded items. According to the police, the children are said to have often been in a room of just over 13 square meters, surrounded by human excrement. - We had no idea that there would be 16 children in there. It's something we're not used to seeing in the United States, says the state's attorney general, Andy Wilson, and tells us that, 24 hours after the operation, he still can't get rid of the stench. At the intervention, several of the children could not speak and one of the oldest children, with an intellectual disability, could not write his name. A child in critical condition Seven of the children were taken to hospital, of which two were flown by helicopter. During Tuesday, a child was stated to be in critical condition. The parents and the children's grandparents have been arrested and charged with several cases of gross violence against children. A neighbor tells the news agency that he has not seen any children since the family moved in and describes the area as a quiet neighborhood. The suspects deny any crime.", "title_original": "Sexton barn räddades från skräckhem – hölls instängda", "summary_original": "Det var när polisen i tisdags genomförde en husrannsakan i orten Hamden i Ohio, i samband med ett annat ärende, som de 16 barnen upptäcktes, enligt nyhetsbyrån AP. – De flesta av våra boskapsdjur hålls under bättre förhållanden än barnen, sa sheriffen Ryan Cain under en pressträff. Familjen ska de senaste åren ha flyttat runt i Ohio för att undvika myndigheterna. Barnen var inte inskrivna i någon skola. Omgivna av mänsklig avföring Barnen, pojkar och flickor från samma familj i åldrarna 1,5 till 18 år, levde enligt bilder från platsen under mycket svåra förhållanden. Utanför huset låg bland annat barncyklar och andra kasserade föremål. Enligt polisen ska barnen ofta ha befunnit sig i ett rum på drygt 13 kvadratmeter, omgivna av mänsklig avföring. – Vi hade ingen aning om att det skulle vara 16 barn där inne. Det är något vi inte är vana med att se i USA, säger delstatens justitieminister Andy Wilson och berättar att han, 24 timmar efter insatsen, fortfarande inte kan få bort stanken. Vid insatsen kunde flera av barnen inte tala och ett av de äldsta barnen, med en intellektuell funktionsnedsättning, kunde inte skriva sitt namn. Ett barn i kritiskt tillstånd Sju av barnen fördes till sjukhus, varav två flögs med helikopter. Under tisdagen uppgavs ett barn vara i kritiskt tillstånd. Föräldrarna och barnens mor- eller farföräldrar har gripits och åtalats för flera fall av grovt våld mot barn. En granne säger till nyhetsbyrån att han inte sett några barn sedan familjen flyttade in och beskriver området som ett lugnt kvarter. De misstänkta nekar till brott.", "link": "https://www.tv4.se/artikel/2J2pwlAziVZlKQrPzlEnnB/sexton-barn-raeddades-fran-skraeckhem-hoells-instaengda-i-litet-rum", "date_display": "2026-07-03", "date_iso": "2026-07-03T17:12:18+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Utrikesnyheter", "/utrikes", "/brott-och-straff", "/usa", "/ohio"]}, {"id": 147, "title": "The Iranian leader shows up - the first time since the war began", "summary": "Appears in connection with Ayatollah Ali Khameni's funeral", "title_original": "Iranledaren visar sig – första gången sedan kriget började", "summary_original": "Dyker upp i samband med ayatolla Ali Khamenis begravning", "link": "https://www.tv4.se/artikel/3qiN1NUe5tNYF35iewnPwD/iranledaren-visar-sig-foersta-gangen-sedan-kriget-boerjade", "date_display": "2026-07-03", "date_iso": "2026-07-03T15:52:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 148, "title": "Swedish police officer Christian, 32, beaten to death in Copenhagen", "summary": "A man arrested • \"We had a memorial service here this morning\"", "title_original": "Svenske polisen Christian, 32, misshandlad till döds i Köpenhamn", "summary_original": "En man gripen • ”Vi har haft en minnestund här på morgonen”", "link": "https://www.tv4.se/artikel/7cfabbddeQ23piNXQSttZw/svenske-christian-32-misshandlad-till-doeds-i-koepenhamn", "date_display": "2026-07-03", "date_iso": "2026-07-03T12:31:53+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Köpenhamn", "/kopenhamn"]}, {"id": 149, "title": "The world watches as Khamenei is buried", "summary": "", "title_original": "Världen tittar på när Khamenei begravs", "summary_original": "", "link": "https://www.tv4.se/artikel/7pr8RQpuFTKAxsi1oxhlvx/vaerlden-tittar-pa-naer-khamenei-begravs", "date_display": "2026-07-03", "date_iso": "2026-07-03T12:04:37+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "1 day old", "tags": ["Nyheterna"]}, {"id": 150, "title": "Iran expert: That's why Khamenei is not expected to appear", "summary": "\"Is there a pronounced threat\"", "title_original": "Iranexpert: Därför väntas Khamenei inte synas till", "summary_original": "”Finns ett uttalat hot”", "link": "https://www.tv4.se/artikel/tt-260703-iran1-5675f41f/iranexpert-darfor-vantas-khamenei-inte-synas-till", "date_display": "2026-07-03", "date_iso": "2026-07-03T09:17:47+00:00", "source": "TV4 Nyheterna", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Uppsala universitet", "/uppsala-universitet"]}, {"id": 151, "title": "Poland procures three A26 submarines from Saab following talks with Swedish Government", "summary": "On 29 June, Swedish Prime Minister Ulf Kristersson visited Gdynia, Poland for government-level talks. The meeting focused on strengthened bilateral cooperation between Sweden and Poland in the areas of regional security and defence. Minister for Defence Pål Jonson, Minister for Foreign Affairs Maria Malmer Stenergard, Minister for Culture Parisa Liljestrand, Minister for Infrastructure and Housing Andreas Carlson and Minister for EU Affairs Jessica Rosencrantz also took part on the trip.", "title_original": "Poland procures three A26 submarines from Saab following talks with Swedish Government", "summary_original": "On 29 June, Swedish Prime Minister Ulf Kristersson visited Gdynia, Poland for government-level talks. The meeting focused on strengthened bilateral cooperation between Sweden and Poland in the areas of regional security and defence. Minister for Defence Pål Jonson, Minister for Foreign Affairs Maria Malmer Stenergard, Minister for Culture Parisa Liljestrand, Minister for Infrastructure and Housing Andreas Carlson and Minister for EU Affairs Jessica Rosencrantz also took part on the trip.", "link": "https://www.government.se/articles/2026/07/poland-procures-three-a26-submarines-from-saab-following-talks-with-swedish-government/", "date_display": "2026-07-02", "date_iso": "2026-07-02T13:55:45+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "2 days old", "tags": ["EU", "Prime Minister's Office", "Ministry of Culture", "Ministry of Defence", "Ministry for Foreign Affairs", "Foreign and security policy", "Article", "Ministry of Rural Affairs and Infrastructure", "Andreas Carlson", "Maria Malmer Stenergard", "Parisa Liljestrand", "Pål Jonson", "Ulf Kristersson", "Military defence", "Jessica Rosencrantz"]}, {"id": 152, "title": "The mystery of the car sites: Who is behind the aggressive link scam for Kollabilinfo.se and Onevin.com?", "summary": "Are you looking for reviews for Kollabilinfo.se or Onevin.com? Read our review of aggressive link marketing and why site owners are warning. \n The post The mystery of car sites: Who is behind the aggressive link scam for Kollabilinfo.se and Onevin.com?  appeared first on ABC News.", "title_original": "Mysteriet med bilsajterna: Vem ligger bakom den aggressiva länkbluffen för Kollabilinfo.se och Onevin.com?", "summary_original": "Letar du efter omdöme för Kollabilinfo.se eller Onevin.com? Läs vår granskning av den aggressiva länkmarknadsföringen och varför sajtägare varnar. \n The post  Mysteriet med bilsajterna: Vem ligger bakom den aggressiva länkbluffen för Kollabilinfo.se och Onevin.com?  appeared first on  ABC Nyheter .", "link": "https://www.abcnyheter.se/kollabilinfo-onevin-omdome-varning/", "date_display": "2026-07-02", "date_iso": "2026-07-02T12:16:47+00:00", "source": "ABC Nyheter", "ministry": "General News", "type": "News", "age_tag": "2 days old", "tags": ["Samhälle"]}, {"id": 153, "title": "Sweden provides SEK 25 million to earthquake-stricken Venezuela", "summary": "The two earthquakes in Venezuela on 24 June have had a profound impact on the Venezuelan people and exacerbated an already difficult humanitarian situation. Sweden is now providing SEK 25 million in humanitarian assistance to Venezuela to support initiatives such as the distribution of food packages, access to clean water, temporary emergency shelter, protection of vulnerable groups and reunification of children and families who have been separated.", "title_original": "Sweden provides SEK 25 million to earthquake-stricken Venezuela", "summary_original": "The two earthquakes in Venezuela on 24 June have had a profound impact on the Venezuelan people and exacerbated an already difficult humanitarian situation. Sweden is now providing SEK 25 million in humanitarian assistance to Venezuela to support initiatives such as the distribution of food packages, access to clean water, temporary emergency shelter, protection of vulnerable groups and reunification of children and families who have been separated.", "link": "https://www.government.se/press-releases/2026/07/sweden-provides-sek-25-million-to-earthquake-stricken-venezuela/", "date_display": "2026-07-02", "date_iso": "2026-07-02T09:14:12+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "3 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "Ministry of Health and Social Affairs", "International development cooperation", "Foreign and security policy", "Jakob Forssmed", "Benjamin Dousa"]}, {"id": 154, "title": "Joint statement of the Nordic-Baltic Prime Ministers", "summary": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "title_original": "Joint statement of the Nordic-Baltic Prime Ministers", "summary_original": "Joint statement of the Heads of Government of Denmark, Estonia, Finland, Iceland, Latvia, Lithuania, Norway and Sweden, Tallinn, 9 June 2026.", "link": "https://www.government.se/statements/2026/07/joint-statement-of-the-nordic-baltic-prime-ministers/", "date_display": "2026-07-01", "date_iso": "2026-07-01T11:58:31+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "3 days old", "tags": ["International", "Prime Minister's Office", "Trade and investment promotion", "Foreign and security policy", "Statement", "Sweden's support to Ukraine", "NATO", "Civil defence", "Military defence", "N5/NB8–cooperation on foreign and security policy"]}, {"id": 155, "title": "Government overhauls development assistance to Africa, Latin America and Asia", "summary": "The Government has adopted nine new development assistance strategies which will provide a total of around SEK 6 billion for development cooperation in Africa, Latin America and Asia. The new development assistance will be based on evidence of what works and produces concrete results.", "title_original": "Government overhauls development assistance to Africa, Latin America and Asia", "summary_original": "The Government has adopted nine new development assistance strategies which will provide a total of around SEK 6 billion for development cooperation in Africa, Latin America and Asia. The new development assistance will be based on evidence of what works and produces concrete results.", "link": "https://www.government.se/press-releases/2026/07/government-overhauls-development-assistance-to-africa-latin-america-and-asia/", "date_display": "2026-07-01", "date_iso": "2026-07-01T11:50:02+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "3 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Benjamin Dousa", "The reform agenda - Development assistance for a n"]}, {"id": 156, "title": "Offline card payments - now the possibilities are expanding", "summary": "As of today, July 1, 2026, expanded opportunities to pay by card offline will be introduced when purchasing essential goods. The measure strengthens the resilience of the payment system and is based on an agreement between the Riksbank and market participants.", "title_original": "Offlinebetalningar med kort - nu utökas möjligheterna", "summary_original": "Från och med i dag, 1 juli 2026, införs utökade möjligheter att betala med kort offline vid köp av livsnödvändiga varor. Åtgärden stärker betalningssystemets motståndskraft och bygger på en överenskommelse mellan Riksbanken och marknadsaktörer.", "link": "https://www.riksbank.se/sv/press-och-publicerat/nyheter-och-pressmeddelanden/pressmeddelanden/2026/offlinebetalningar-med-kort---nu-utokas-mojligheterna/", "date_display": "2026-07-01", "date_iso": "2026-07-01T07:31:02+00:00", "source": "Riksbanken", "ministry": "Central Bank", "type": "Official Information", "age_tag": "4 days old", "tags": []}, {"id": 157, "title": "Poland signs agreement to procure submarines from Saab and deepen strategic cooperation with Sweden", "summary": "Sweden and Poland have successfully finalised negotiations on Poland’s procurement of three A26 submarines from Saab. This agreement is a significant step in strengthening Poland’s maritime capability, while also helping the countries deepen their collaboration on security and industrial policy.", "title_original": "Poland signs agreement to procure submarines from Saab and deepen strategic cooperation with Sweden", "summary_original": "Sweden and Poland have successfully finalised negotiations on Poland’s procurement of three A26 submarines from Saab. This agreement is a significant step in strengthening Poland’s maritime capability, while also helping the countries deepen their collaboration on security and industrial policy.", "link": "https://www.government.se/press-releases/2026/06/poland-signs-agreement-to-procure-submarines-from-saab-and-deepen-strategic-cooperation-with-sweden/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:43:44+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "5 days old", "tags": ["Press release", "EU", "Prime Minister's Office", "Ministry of Defence", "Ministry for Foreign Affairs", "Foreign and security policy", "Maria Malmer Stenergard", "Pål Jonson", "Ulf Kristersson", "Military defence"]}, {"id": 158, "title": "Joint statement of the Republic of Poland and the Kingdom of Sweden on the Baltic Sea Pact", "summary": "Concluding the first Polish-Swedish Intergovernmental Consultations on 29 June 2026, in Gdynia, Poland and Sweden agreed to deepen their bilateral security and defence cooperation in the Baltic Sea region by launching the Baltic Sea Pact.", "title_original": "Joint statement of the Republic of Poland and the Kingdom of Sweden on the Baltic Sea Pact", "summary_original": "Concluding the first Polish-Swedish Intergovernmental Consultations on 29 June 2026, in Gdynia, Poland and Sweden agreed to deepen their bilateral security and defence cooperation in the Baltic Sea region by launching the Baltic Sea Pact.", "link": "https://www.government.se/statements/2026/06/joint-statement-of-the-republic-of-poland-and-the-kingdom-of-sweden-on-the-baltic-sea-pact/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:43:14+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "5 days old", "tags": ["EU", "Prime Minister's Office", "Statement", "Ulf Kristersson", "Military defence"]}, {"id": 159, "title": "Joint Declaration from the Polish-Swedish Intergovernmental Consultations Gdynia", "summary": "The Republic of Poland and the Kingdom of Sweden are close Baltic Sea neighbours, Allies and partners, tied together by shared history, geography and responsibility for their strategically important region. Our Governments meet on 29 June 2026 for the first time in the format of Intergovernmental Consultations, a year and a half after the signing of the renewed Strategic Partnership between Poland and Sweden (Harpsund, 28 November 2024).", "title_original": "Joint Declaration from the Polish-Swedish Intergovernmental Consultations Gdynia", "summary_original": "The Republic of Poland and the Kingdom of Sweden are close Baltic Sea neighbours, Allies and partners, tied together by shared history, geography and responsibility for their strategically important region. Our Governments meet on 29 June 2026 for the first time in the format of Intergovernmental Consultations, a year and a half after the signing of the renewed Strategic Partnership between Poland and Sweden (Harpsund, 28 November 2024).", "link": "https://www.government.se/statements/2026/06/joint-declaration-from-the-polish-swedish-intergovernmental-consultations-gdynia/", "date_display": "2026-06-29", "date_iso": "2026-06-29T11:42:57+00:00", "source": "Government.se", "ministry": "Prime Minister's Office", "type": "Official Information", "age_tag": "5 days old", "tags": ["EU", "Prime Minister's Office", "Statement", "Ulf Kristersson", "Military defence"]}, {"id": 160, "title": "Joint Statement from the International Contact Group for the Great Lakes (ICG)", "summary": "Belgium, Denmark, Canada, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement:", "title_original": "Joint Statement from the International Contact Group for the Great Lakes (ICG)", "summary_original": "Belgium, Denmark, Canada, the European Union, France, Germany, the Netherlands, Sweden, Switzerland, the United Kingdom and the United States of America, as members of the International Contact Group for the Great Lakes (ICG), chaired by Sweden, issue the following statement:", "link": "https://www.government.se/statements/2026/06/joint-statement-from-the-international-contact-group-for-the-great-lakes-icg/", "date_display": "2026-06-26", "date_iso": "2026-06-26T13:51:36+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "8 days old", "tags": ["International", "Ministry for Foreign Affairs", "Foreign and security policy", "Statement"]}, {"id": 161, "title": "Sweden takes next major step towards new nuclear power", "summary": "The Government has decided that the state will become a shareholder in Videberg Kraft AB, which plans to build nuclear reactors at Ringhals. The Swedish state, Vattenfall AB and Industrikraft i Sverige AB have concluded a shareholders’ agreement on the management of the company. The state’s shareholding will be 60 per cent, while Vattenfall and Industrikraft will each hold 20 per cent. The state has also negotiated the principal terms and conditions for state aid to the company.", "title_original": "Sweden takes next major step towards new nuclear power", "summary_original": "The Government has decided that the state will become a shareholder in Videberg Kraft AB, which plans to build nuclear reactors at Ringhals. The Swedish state, Vattenfall AB and Industrikraft i Sverige AB have concluded a shareholders’ agreement on the management of the company. The state’s shareholding will be 60 per cent, while Vattenfall and Industrikraft will each hold 20 per cent. The state has also negotiated the principal terms and conditions for state aid to the company.", "link": "https://www.government.se/press-releases/2026/06/sweden-takes-next-major-step-towards-new-nuclear-power/", "date_display": "2026-06-26", "date_iso": "2026-06-26T08:51:59+00:00", "source": "Government.se", "ministry": "Ministry of Finance", "type": "Official Information", "age_tag": "9 days old", "tags": ["Press release", "EU", "Ministry of Finance", "Energy", "Financial markets", "Central government budget", "Niklas Wykman", "Government’s priorities", "Nuclear financing"]}, {"id": 162, "title": "Sweden strengthens Ukraine’s energy supply ahead of winter", "summary": "Last winter, Ukraine’s electrical grid and power plants were intensively attacked by Russia. Ukraine must now make extensive efforts to ensure the energy supply for the coming winter. The Swedish Government has therefore approved a new support package for Ukraine worth approximately SEK 1.5 billion to support the country’s energy sector in 2026. It is expected to contribute to preparation through repairs, installation of new energy production, material support and enhanced nuclear safety.", "title_original": "Sweden strengthens Ukraine’s energy supply ahead of winter", "summary_original": "Last winter, Ukraine’s electrical grid and power plants were intensively attacked by Russia. Ukraine must now make extensive efforts to ensure the energy supply for the coming winter. The Swedish Government has therefore approved a new support package for Ukraine worth approximately SEK 1.5 billion to support the country’s energy sector in 2026. It is expected to contribute to preparation through repairs, installation of new energy production, material support and enhanced nuclear safety.", "link": "https://www.government.se/press-releases/2026/06/sweden-strengthens-ukraines-energy-supply-ahead-of-winter/", "date_display": "2026-06-25", "date_iso": "2026-06-25T13:53:26+00:00", "source": "Government.se", "ministry": "Ministry for Foreign Affairs", "type": "Official Information", "age_tag": "9 days old", "tags": ["Press release", "International", "Ministry for Foreign Affairs", "International development cooperation", "Foreign and security policy", "Sweden's support to Ukraine", "Benjamin Dousa"]}, {"id": 163, "title": "Ulf Kristersson to hold joint press conference with Prime Minister of Poland on bilateral submarine cooperation", "summary": "On Monday 29 June, Prime Minister Ulf Kristersson will travel with several ministers to Gdynia, Poland for intergovernmental consultations. The focus will be on strengthened bilateral cooperation between Sweden and Poland, specifically with regard to regional security and defence. Mr Kristersson and Prime Minister of Poland Donald Tusk will hold a joint press conference during which they will announce a new development in the countries’ bilateral submarine cooperation.", "title_original": "Ulf Kristersson to hold joint press conference with Prime Minister of Poland on bilateral submarine cooperation", "summary_original": "On Monday 29 June, Prime Minister Ul   let currentType = 'all';
  let currentMinistry = 'all';

  const ministries = [...new Set(data.map(i => i.ministry))].sort();
  const select = document.getElementById('ministrySelect');
  ministries.forEach(m => {
    let opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    select.appendChild(opt);
  });

  function render() {
    const container = document.getElementById('container');
    container.innerHTML = '';

    const filtered = data.filter(item => {
      const typeMatch = (currentType === 'all') || (item.type === currentType);
      const minMatch = (currentMinistry === 'all') || (item.ministry === currentMinistry);
      return typeMatch && minMatch;
    });

    filtered.forEach(item => {
      const typeClass = item.type === 'Official Information' ? 'official' : 'news';
      const ageHtml = item.age_tag ? `<span class="tag tag-old">⏱ ${item.age_tag}</span>` : '';
      const ministryTag = `<span class="tag tag-ministry">${item.ministry}</span>`;

      const card = `
        <div class="card ${typeClass}">
          <div class="card-body">
            <div class="tags">
              <span class="tag tag-type">${item.type}</span>
              ${ministryTag}
              ${ageHtml}
            </div>
            <div class="meta-line">
              <strong>${item.source}</strong> | ${item.date_display}
            </div>
            <h3>${item.title}</h3>
            <div class="summary-container">
              <div class="summary-text" id="sum-${item.id}">
                ${item.summary || 'No summary text available.'}
              </div>
            </div>
          </div>
          <div class="card-footer">
            <button class="btn-text" onclick="toggleText('${item.id}', this)">Read More</button>
            <a href="${item.link}" target="_blank" class="btn-link">🔗 Open Article</a>
          </div>
        </div>
      `;
      container.innerHTML += card;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<p style="text-align:center; width:100%; color:#666;">No results.</p>';
    }
  }

  function toggleText(id, btn) {
    const el = document.getElementById('sum-' + id);
    el.classList.toggle('expanded');
    btn.textContent = el.classList.contains('expanded') ? "Show Less" : "Read More";
  }

  function filterType(type, btn) {
    currentType = type;
    document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const dlBtn = document.querySelector('.download');
    if (btn !== dlBtn) dlBtn.classList.remove('active');
    render();
  }

  function filterMinistry() {
    currentMinistry = document.getElementById('ministrySelect').value;
    render();
  }

  function downloadMD() {
    let md = "# Sweden Intelligence Report\n";
    md += "Generated: " + new Date().toLocaleString() + "\n\n";

    data.forEach(item => {
      md += `## ${item.title}\n`;
      md += `**Outlet:** ${item.source}\n`;
      md += `**Category:** ${item.ministry} | **Date:** ${item.date_display} (${item.age_tag})\n\n`;
      md += `${item.summary || 'No summary text available.'}\n\n`;
      md += `[Read Full Article](${item.link})\n`;
      md += "---\n\n";
    });

    const blob = new Blob([md], {type: 'text/markdown'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sweden_intelligence.md';
    a.click();
  }

  render();
</script>
